<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Network Day 5 개념 워크시트</title>
<style>
  :root{--bg:#0b1220;--panel:#111a2e;--line:#1f2b45;--text:#dbe4f0;--dim:#8a9bb8;--amber:#f5b942;--teal:#2dd4bf;--blue:#60a5fa;--green:#4ade80;--red:#f87171;--purple:#c084fc;--mono:"Consolas","D2Coding","JetBrains Mono",monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR","Segoe UI",sans-serif;font-size:15px;line-height:1.55}
  .app{max-width:920px;margin:0 auto;padding:22px 20px 40px}
  h1{color:var(--amber);font-size:24px;margin:0 0 6px}
  .sub{color:var(--dim);margin:0 0 14px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
  .panel h2{font-size:14px;color:var(--dim);margin:0 0 10px;font-weight:600}
  button{background:#172239;border:1px solid #2a3a5c;color:var(--text);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--amber)}button.active{background:#3a2e12;border-color:var(--amber);color:var(--amber)}
  button.primary{background:#123d33;border-color:var(--teal);color:var(--teal);font-weight:700;padding:9px 18px;font-size:14px}
  button.submit{background:#3a2e12;border-color:var(--amber);color:var(--amber);font-weight:700;padding:9px 18px;font-size:14px}
  button:disabled{opacity:.5;cursor:default}
  button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  input[type=text]{background:#0a0f1c;color:var(--text);border:1px solid #2a3a5c;border-radius:6px;padding:6px 10px;font-family:var(--mono);font-size:14px}
  select{background:#0a0f1c;color:var(--text);border:1px solid #2a3a5c;border-radius:6px;padding:4px 8px;font-family:inherit;font-size:14px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px}
  .tabs button .s{font-family:var(--mono);font-size:11px;color:var(--dim);margin-left:6px}
  .tabs button.graded .s{color:var(--green)}
  .legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .tag{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--dim);font-family:var(--mono)}
  .head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .head .t{color:var(--amber);font-size:17px}
  .head .a{font-size:13px;color:var(--teal);font-family:var(--mono)}
  .q{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;background:#0e1628}
  .q.unans{border-color:#5a3a1a}
  .q.ok{border-color:#1f6b45}.q.bad{border-color:#7a2e2e}
  .qh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .q .n{font-family:var(--mono);color:var(--dim);font-size:12px}
  .ty{font-size:11.5px;border-radius:999px;padding:1px 9px;border:1px solid}
  .q .p{margin:6px 0 10px;font-size:15px}
  .q code,.fb code,.dg code{font-family:var(--mono);color:var(--blue);background:#0a0f1c;padding:1px 5px;border-radius:4px}
  .q pre{font-family:var(--mono);background:#0a0f1c;border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:6px 0 4px;font-size:14px;white-space:pre;overflow-x:auto;line-height:1.9}
  .q pre input{font-size:13px;padding:2px 6px;width:auto;min-width:5ch}
  .opts{display:grid;gap:6px}
  .opt{text-align:left;padding:8px 12px;font-size:14px}
  .opt .box{display:inline-block;width:18px;font-family:var(--mono);color:var(--dim)}
  .opt.sel{border-color:var(--amber);background:#1f1a0c}
  .opt.ok{border-color:var(--green);color:var(--green);background:#0d2216}
  .opt.bad{border-color:var(--red);color:var(--red);background:#2a1212}
  .opt.miss{border-color:var(--green);border-style:dashed}
  .ox{display:flex;gap:10px}
  .ox button{font-size:22px;width:78px;height:54px;font-weight:700}
  .fill{line-height:2.3}
  .mrow{display:grid;grid-template-columns:1fr 24px minmax(160px,1.2fr);gap:8px;align-items:center;margin-bottom:6px}
  .mrow .l{background:#0a0f1c;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:14px}
  .mrow select{width:100%}
  .mrow .arr{color:var(--dim);text-align:center}
  .mrow.ok select{border-color:var(--green)}.mrow.bad select{border-color:var(--red)}
  .ord{list-style:none;margin:0;padding:0;display:grid;gap:6px}
  .ord li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;background:#0a0f1c;border:1px solid #2a3a5c;border-radius:8px;padding:7px 10px;cursor:grab;font-size:14px}
  .ord li.drag{opacity:.4}.ord li.over{border-color:var(--amber)}
  .ord li .k{font-family:var(--mono);color:var(--dim)}
  .ord li .mv button{padding:2px 8px;margin-left:4px}
  .ord li.ok{border-color:var(--green)}.ord li.bad{border-color:var(--red)}
  .hot{background:#0a0f1c;border:1px solid var(--line);border-radius:8px;padding:6px;overflow-x:auto}
  .hot svg{display:block;max-width:100%;height:auto;margin:0 auto}
  .hot .rg{cursor:pointer;fill:transparent;stroke:transparent;stroke-width:2.5}
  .hot .rg:hover{stroke:#f5b94288}
  .hot .rg.sel{stroke:var(--amber);fill:#f5b94222}
  .hot .rg.ok{stroke:var(--green);fill:#4ade8026}
  .hot .rg.bad{stroke:var(--red);fill:#f8717126}
  .card{perspective:900px;max-width:560px}
  .card .in{position:relative;min-height:130px;transition:transform .5s;transform-style:preserve-3d}
  .card.flip .in{transform:rotateY(180deg)}
  .card .f,.card .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;border:1px solid #2a3a5c;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px 18px;font-size:16px}
  .card .f{background:#14203a;color:var(--amber)}
  .card .b{background:#0f2a27;color:var(--teal);transform:rotateY(180deg)}
  @media (prefers-reduced-motion:reduce){.card .in{transition:none}}
  .selfrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
  .selfrow .hint{margin-left:4px}
  .fb{margin-top:10px;font-size:13px;color:var(--dim);border-left:3px solid var(--line);padding-left:10px}
  .fb.ok{border-left-color:var(--green)}.fb.bad{border-left-color:var(--red)}
  .fb b.v{display:block;margin-bottom:2px}
  .fb.ok b.v{color:var(--green)}.fb.bad b.v{color:var(--red)}
  .fb .anim{color:var(--teal);font-family:var(--mono);font-size:12px;display:block;margin-top:3px}
  .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
  .code{font-family:var(--mono);font-size:20px;color:var(--amber);letter-spacing:1px}
  .score{font-family:var(--mono);color:var(--green);font-size:16px}
  .hint{color:var(--dim);font-size:13px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:0;max-width:860px;width:92vw;max-height:88vh}
  dialog::backdrop{background:#000a}
  .dg{padding:18px 20px}
  .dg h3{color:var(--amber);margin:0 0 4px;font-size:20px}
  .dg .meta{color:var(--dim);font-size:13px;margin-bottom:12px;font-family:var(--mono)}
  .dg .sec{margin:14px 0 6px;color:var(--teal);font-weight:700;font-size:14px}
  .dg table{width:100%;border-collapse:collapse;font-size:13px}
  .dg th{text-align:left;color:var(--dim);font-weight:600;padding:5px 8px;border-bottom:1px solid var(--line);font-size:12px}
  .dg td{padding:5px 8px;border-bottom:1px solid #16203a;vertical-align:top}
  .dg .ok{color:var(--green)}.dg .bad{color:var(--red)}.dg .none{color:var(--dim)}
  .dg .sum{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0;font-family:var(--mono)}
  .dgbar{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 20px;display:flex;gap:8px;justify-content:flex-end;align-items:center}
  .toast{color:var(--green);font-size:13px;margin-right:auto}
  .body{overflow:auto;max-height:calc(88vh - 60px)}
  @media(max-width:600px){.mrow{grid-template-columns:1fr;gap:4px}.mrow .arr{display:none}}
</style>
</head>
<body>
<div class="app">
  <h1>Neural Network Day 5 개념 워크시트</h1>
  <p class="sub">교시마다 10문항 — 객관식 · O/X · 빈칸 · 짝 맞추기 · 순서 배열 · 핫스팟 · 코드 완성 등 9가지 유형이 섞여 나옵니다. 답을 고른 뒤 아래 <b style="color:var(--teal)">채점하기</b>를 누르면 정오 · 해설과 결과 코드가 나타납니다. 채점 전에는 답을 바꿀 수 있고, 채점 후에는 잠깁니다. 모든 교시를 마치면 <b style="color:var(--amber)">제출</b>로 오답 정리를 열고, <b>캡처</b>로 복사해 노션에 붙여 넣으세요.</p>

  <div class="panel">
    <div class="row"><label style="color:var(--dim);font-size:13px">이름 <input type="text" id="name" placeholder="홍길동"></label><span class="hint">이름은 결과 코드 계산에만 쓰이며 저장되지 않습니다.</span></div>
  </div>
  <div class="panel"><h2>교시</h2><div class="tabs" id="tabs"></div><div class="legend" id="legend"></div></div>
  <div class="panel" id="sheet"></div>
  <div class="panel">
    <div class="actions">
      <button class="primary" id="gradeBtn">채점하기</button>
      <span class="score" id="rscore"></span>
      <span class="hint" id="rhint"></span>
      <span class="code" id="rcode">—</span>
    </div>
    <div class="actions" style="margin-top:12px">
      <button class="submit" id="submitBtn">제출 (오답 정리)</button>
      <button id="resetBtn">이 교시 다시 풀기</button>
    </div>
  </div>
</div>

<dialog id="dlg">
  <div class="body"><div class="dg" id="dgBody"></div></div>
  <div class="dgbar"><span class="toast" id="toast"></span><button id="captureBtn" class="primary">📋 캡처 (노션용 복사)</button><button id="closeBtn">닫기</button></div>
</dialog>

<script>
const Q = [{"t": "1교시 · 복습 퀴즈 · 완전연결층의 한계", "anim": "D5-1 완전연결층의 한계", "qs": [{"type": "single", "p": "28×28 이미지를 784 로 펼치면 (행 r, 열 c) 픽셀은 몇 번째 원소가 되나? (row-major, reshape)", "o": ["28·(r + c)", "784 − (28·r + c)", "28·r + c", "r + 28·c"], "a": 2, "w": "한 행 28 칸이 끝나야 다음 행이 시작합니다. 그래서 오른쪽 이웃은 +1, <b>바로 아래 이웃은 +28</b> — 이미지에선 붙어 있던 픽셀이 벡터에선 멀리 떨어집니다.", "an": "D5-1 · 평탄화"}, {"type": "single", "p": "모든 train · test 이미지의 픽셀을 <b>같은</b> permutation(784) 로 뒤섞어 MLP 를 학습했더니 0.9436 → 0.9455 로 거의 같았습니다. 이 결과가 뜻하는 것은?", "o": ["MLP 는 픽셀의 공간 배치를 쓰지 않는다 — 섞어도 W 의 행 순서만 바뀐 것과 같다", "Adam 이 permutation 을 거꾸로 학습해 원래 이미지를 복원했다", "뒤섞기가 데이터 증강 효과를 내서 정확도가 올랐다", "1 epoch 만 학습해서 이미지 구조를 쓸 시간이 없었기 때문이다"], "a": 0, "w": "Affine 은 입력 순서에 아무 의미를 두지 않습니다. 0.0019 차이는 잡음 수준. 사람에게는 알아볼 수 없는 이미지가 MLP 에겐 똑같이 쉽다는 것 — 이웃 관계를 쓰지 않는다는 증거입니다.", "an": "문제 1-2"}, {"type": "multi", "p": "완전연결층 (Affine) 으로 이미지를 다룰 때의 문제를 <b>모두</b> 고르세요.", "o": ["같은 획이 다른 위치에 나오면 다른 가중치로 따로 배워야 한다", "펼치면 바로 아래 픽셀이 28 칸 떨어져 이웃 관계 (공간 정보) 가 사라진다", "입력 크기에 비례해 가중치가 폭발한다 (224×224×3 → 1000: 1.5억 개)", "Affine 은 미분할 수 없어 이미지 입력으로는 역전파가 안 된다"], "a": [0, 1, 2], "w": "Affine 역전파는 입력이 이미지여도 똑같이 됩니다 (Day 3). 문제는 구조 — 위치마다 다른 가중치, 모든 픽셀과 연결. 합성곱은 지역성 · 가중치 공유로 셋 다 해결합니다.", "an": "D5-1 · 완전연결층의 한계"}, {"type": "ox", "p": "RGB 입력에 3×3 필터 64개를 쓰는 합성곱 층의 파라미터 수는 입력이 28×28 이든 224×224 든 같다.", "a": true, "w": "64·3·3·3 + 64 = 1,792 — FN · C · FH · FW 와 편향뿐, H · W 는 들어가지 않습니다. 같은 필터를 모든 위치에 다시 쓰기 (가중치 공유) 때문입니다.", "an": "D5-1 · 파라미터 폭발"}, {"type": "short", "p": "224×224×3 이미지를 펼쳐 은닉 1000 개 Affine 에 넣으면 W 의 원소 수는? (숫자)", "a": ["150528000", "150,528,000"], "w": "150,528 × 1000 = 150,528,000. float32 면 W 하나가 약 602 MB — 온디바이스에선 불가능한 크기입니다.", "an": "문제 1-1"}, {"type": "drop", "p2": "합성곱의 두 아이디어: 필터가 작은 영역만 보는 {} 과, 같은 필터를 모든 위치에 쓰는 {}.", "opts": [["정규화 (normalization)", "평탄화 (flatten)", "지역성 (locality)"], ["가중치 공유 (weight sharing)", "weight decay", "Dropout"]], "a": [2, 0], "w": "지역성은 이웃 관계를 지키고, 가중치 공유는 파라미터를 이미지 크기와 무관하게 만들며 '어디에 있든 같은 패턴' 을 찾게 합니다.", "an": "D5-1 · 완전연결층의 한계"}, {"type": "match", "p": "층과 파라미터 수를 짝지으세요.", "left": ["28×28 → 은닉 100 (W 만)", "224×224×3 → 은닉 1000 (W 만)", "RGB · 3×3 필터 64개 (W + b)", "Day 3 MLP 784-100-10 전체"], "right": ["78,400", "150,528,000", "1,792", "79,510"], "a": [0, 1, 2, 3], "w": "Day 3 MLP 는 78,400 + 100 + 1,000 + 10 = 79,510. 합성곱 1,792 개는 224×224 입력에서도 그대로입니다.", "an": "문제 1-1"}, {"type": "order", "p": "문제 1-2 픽셀 뒤섞기 실험의 순서로 배열하세요.", "items": ["<code>perm = rng.permutation(784)</code> 를 <b>한 번</b> 만든다 (rng = default_rng(0))", "train · test 모든 이미지에 <code>X[:, perm]</code> 로 같은 순서를 적용한다", "784-100-10 MLP 를 Adam 으로 1 epoch 학습한다", "원본 학습 결과 (0.9436) 와 test 정확도 0.9455 를 비교한다"], "w": "이미지마다 다른 permutation 을 쓰면 정보가 실제로 망가집니다. '같은' 순서여야 '공간 정보만 지운' 실험이 됩니다.", "an": "문제 1-2"}, {"type": "hot", "p": "x_train[0] 의 일부입니다. 노란 칸 (13, 13) 은 펼친 벡터의 377 번째입니다. 펼친 벡터에서 <b>28 칸 뒤 (405 번째)</b> 인 픽셀을 이미지에서 클릭하세요.", "w": "(14, 13) — 노란 칸 <b>바로 아래</b> 입니다. 28·14 + 13 = 405. 이미지에선 맞닿은 이웃이 벡터에선 27 칸을 사이에 두고 떨어집니다. Affine 은 이 거리를 모릅니다.", "an": "D5-1 · 평탄화", "viewBox": "0 0 520 340", "sw": 520, "svg": "<text x=\"20.0\" y=\"14.0\" font-size=\"12\" fill=\"#8a9bb8\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">x_train[0] (숫자 5) 의 행 10~16 · 열 10~16</text><text x=\"56.0\" y=\"37.0\" font-size=\"10\" fill=\"#8a9bb8\" text-anchor=\"end\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">r\\c</text><text x=\"56.0\" y=\"61.0\" font-size=\"10\" fill=\"#8a9bb8\" text-anchor=\"end\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">10</text><text x=\"79.0\" y=\"37.0\" font-size=\"10\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">10</text><rect x=\"64.0\" y=\"46.0\" width=\"30.0\" height=\"30.0\" rx=\"0\" fill=\"rgb(18,18,28)\" stroke=\"#2a3a5c\" stroke-width=\"1\"/><rect 로 · 세로가 입력과 같다 (same)", "backward 는 forward 때 저장한 argmax 자리로만 dout 을 보낸다", "backward 는 dout 을 영역 4 칸에 1/4 씩 나눠 보낸다"], "a": [0, 2], "w": "최댓값이 아닌 칸은 출력에 영향이 없으니 기울기도 0 — ReLU 의 mask 와 같은 원리. 크기는 절반 (24 → 12), 채널 수는 그대로. 1/4 씩 나누는 것은 average pooling 입니다.", "an": "문제 4-3"}, {"type": "ox", "p": "Convolution 의 He 초기화에서 n_in 은 출력 채널 수 FN 이다.", "a": false, "w": "n_in = C·FH·FW — 출력 값 하나가 보는 입력 개수 (col 의 열 수). Convolution(1, 30, 5) 면 √(2/25) ≈ 0.283.", "an": "D5 공통 · He 초기화"}, {"type": "short", "p": "gradient check 의 두 번째 경우: x (2, 3, 7, 7) 에 Convolution(3, 2, 3, stride 2, pad 0) 을 쓰면 출력의 OH 는? (숫자)", "a": ["3"], "w": "(7 − 3) // 2 + 1 = 3 → 출력 (2, 2, 3, 3). 이 경우 dx 상대 오차 3.7e-12. pad 1 · stride 1 인 첫 경우는 7×7 그대로 (dx 3.8e-12 · W 6.5e-13 · b 2.5e-12).", "an": "문제 4-4"}, {"type": "drop", "p2": "<code>Convolution.backward</code>: dout 을 (N·OH·OW, FN) 로 바꾼 뒤 dW = {} 로 구하고, dcol = dout @ col_W.T 를 {} 로 (N, C, H, W) 에 되돌린다.", "opts": [["col @ dout", "col.T @ dout", "dout @ col.T"], ["col2im (겹치는 자리는 더함)", "reshape 만", "im2col"]], "a": [1, 0], "w": "Affine 의 dW = X.T @ dout 와 같은 꼴 (X 자리에 col). 한 픽셀이 여러 window 에 들어갔으니 돌려놓을 때 그 기울기들을 더해야 합니다.", "an": "문제 4-2"}, {"type": "match", "p": "계층의 메서드와 하는 일을 짝지으세요.", "left": ["<code>Convolution.forward</code>", "<code>Convolution.backward</code>", "<code>Pooling.forward</code>", "<code>Pooling.backward</code>"], "right": ["im2col → 행렬곱 + b → reshape · transpose", "dW = col.T @ dout, dcol → col2im", "영역마다 max, argmax 저장", "argmax 자리에만 dout, col2im"], "a": [0, 1, 2, 3], "w": "Pooling 도 im2col 로 영역을 행으로 펼친 뒤 행마다 max 를 고릅니다. 둘 다 Day 4 Layer 규약 (params · grads · forward(x, train_flg) · backward(dout)) 을 지킵니다.", "an": "문제 4-1 ~ 4-3"}, {"type": "order", "p": "4교시 노트북에서 mynn.py 를 Day 5 버전으로 만드는 순서로 배열하세요.", "items": ["<code>%%writefile mynn_conv.py</code> 로 im2col · col2im · Convolution · Pooling 을 쓴다", "<code>mynn_day4.py</code> 내용 뒤에 <code>mynn_conv.py</code> 를 붙여 <code>mynn.py</code> 를 만든다", "<code>import mynn</code> 으로 새 계층을 불러온다", "gradient che  앞섭니다. 1 − 0.9810 = 0.0190 → 190 장.", "an": "문제 5-3"}, {"type": "ox", "p": "SimpleConvNet 의 파라미터는 대부분 Convolution 층에 있다.", "a": false, "w": "Conv 780 개 (0.2%), Affine(4320→100) 432,100 개 (99.6%). 합성곱은 가중치 공유로 아주 적은 파라미터만 씁니다 — 7교시: '파라미터는 Affine 에, 연산은 Conv 에'.", "an": "문제 5-2"}, {"type": "short", "p": "SimpleConvNet 의 전체 파라미터 수는? (숫자)", "a": ["433890", "433,890"], "w": "conv 30·1·5·5 + 30 = 780, affine1 4320·100 + 100 = 432,100, affine2 100·10 + 10 = 1,010 → 433,890.", "an": "문제 5-2"}, {"type": "drop", "p2": "(N, 1, 28, 28) → Conv 5×5 → (N, 30, {}, 24) → Pooling 2×2 → (N, 30, {}, 12)", "opts": [["24", "26", "28"], ["6", "12", "24"]], "a": [0, 1], "w": "Conv: 28 − 5 + 1 = 24. Pooling 2×2 stride 2 는 가로 · 세로를 절반으로 → 12.", "an": "문제 5-1"}, {"type": "drop", "p2": "학습 전 (무작위 가중치) 손실은 약 {} 이고, Adam(0.001) · batch 100 으로 60,000 장을 1 epoch 학습한 뒤 test 정확도는 {} 이다.", "opts": [["0.1665", "0.0474", "2.704"], ["0.9825", "0.9810", "0.9757"]], "a": [2, 1], "w": "1 epoch = 600 iteration, 마지막 손실 0.1665. train 은 0.9825. 서버 약 135 초 — 대부분은 train 6만 장 정확도 평가 시간입니다.", "an": "문제 5-3"}, {"type": "match", "p": "SimpleConvNet 의 층과 파라미터 수를 짝지으세요.", "left": ["Convolution(1→30, 5×5)", "Pooling(2×2)", "Affine(4320→100)", "Affine(100→10)"], "right": ["780", "0", "432,100", "1,010"], "a": [0, 1, 2, 3], "w": "Pooling · Relu 는 파라미터가 없어 params() 키도 없습니다. 저장 키는 '0.W' (30, 1, 5, 5) · '3.W' (4320, 100) · '5.W'.", "an": "문제 5-2"}, {"type": "order", "p": "SimpleConvNet 의 계층을 입력부터 순서대로 배열하세요.", "items": ["Convolution(1, 30, 5) + Relu", "Pooling(2, 2, 2)", "Affine(4320, 100) + Relu", "Affine(100, 10)", "SoftmaxWithLoss (학습 때 손실)"], "w": "Conv–ReLU–Pool 이 특징을 뽑고, Affine 두 층이 분류합니다. 이 패턴을 여러 번 쌓은 것이 VGG 같은 큰 CNN 입니다.", "an": "문제 5-2"}, {"type": "hot", "p": "SimpleConvNet 의 계층과 출력 shape 입니다. <b>파라미터가 가장 많은</b> 층을 클릭하세요.", "w": "Affine 4320→100 (432,100 개) 입니다. 입력 4320 개 모두와 연결된 100 개 뉴런. Convolution 은 출력이 가장 크지만 (30×24×24) 파라미터는 780 개뿐 — 가중치 공유의 효과입니다.", "an": "D5-6 · SimpleConvNet", "viewBox": "0 0 520 370", " ", "label": "Affine 4320→100 층", "x": 30, "y": 194, "w": 250, "h": 30}, {"id": "relu2", "label": "Relu 층", "x": 30, "y": 234, "w": 250, "h": 30}, {"id": "aff2", "label": "Affine 100→10 층", "x": 30, "y": 274, "w": 250, "h": 30}, {"id": "sm", "label": "SoftmaxWithLoss 층", "x": 30, "y": 314, "w": 250, "h": 30}], "a": "aff1"}, {"type": "code", "p": "문제 5-2 SimpleConvNet 을 완성하세요.", "code": "model = M.Sequential([\n    M.Convolution(1, 30, {{}}, seed=1), M.Relu(), M.Pooling(2, 2, 2),\n    M.Affine({{}}, 100, seed=2), M.Relu(), M.Affine(100, 10, seed=3)])", "a": [["5"], ["4320", "30*12*12"]], "w": "Day 4 의 Sequential · Trainer 를 그대로 씁니다 — 새로 만든 것은 Convolution · Pooling 두 계층뿐.", "an": "문제 5-2"}]}, {"t": "6교시 · 학습 결과 해석", "anim": "D5-7 필터 · 특징 맵", "qs": [{"type": "single", "p": "학습 <b>후</b> 1층 필터 30개 (5×5) 를 그리면 주로 어떤 모양이 보이나?", "o": ["숫자 0~9 를 축소한 템플릿 10 개", "2교시 Sobel 처럼 뚜렷한 에지 검출기로 완전히 바뀐다", "30 개가 모두 같은 모양 (가중치 공유 때문)", "초기값과 거의 같다 — 변화량(후 − 전)에만 경계 방향 무늬가 생긴다"], "a": 3, "w": "1 epoch (600 step) 후 필터별 학습 전후 상관계수는 0.86 ~ 0.999 — 거의 그대로입니다. 그래도 무작위 필터가 국소 밝기 차이에 반응하므로, 1 epoch 동안은 주로 뒤쪽 Affine 이 그 반응을 조합하는 법을 배웁니다. 가중치 공유는 '위치 사이' 공유이지 필터끼리 같아지는 것이 아닙니다.", "an": "문제 6-1"}, {"type": "multi", "p": "특징 맵 (feature map) 에 대해 옳은 것을 <b>모두</b> 고르세요.", "o": ["ReLU 를 지나면 음수 응답은 0 이 된다", "숫자 한 장을 넣으면 1층에서 24×24 짜리 30 장이 나온다", "30 장은 모두 같은 필터 하나로 만든다", "필터 하나가 이미지 전체를 훑은 결과 — 그 필터의 패턴이 있는 곳이 밝다"], "a": [0, 1, 3], "w": "특징 맵 f 는 필터 W[f] 의 결과입니다 — 필터 30 개 → 30 장. 같은 숫자라도 맵마다 밝은 곳이 다른 이유.", "an": "문제 6-2"}, {"type": "multi", "p": "test 를 옆으로 밀었을 때 CNN 이 MLP 보다 덜 떨어지는 이유를 <b>모두</b> 고르세요.", "o": ["CNN 은 파라미터가 많아 어떤 입력이든 외워 둔다", "CNN 은 학습 때 이미 밀린 이미지를 보았다", "Max Pooling — 2×2 안에서 조금 움직여도 최댓값이 비슷하다", "가중치 공유 — 같은 필터가 모든 위치에서 같은 패턴을 찾는다"], "a": [2, 3], "w": "두 모델 모두 원본 이미지로만 학습했습니다. 구조가 이동에 덜 민감할 뿐, 완전히 불변은 아니라서 3 픽셀이면 CNN 도 0.7484.", "an": "문제 6-3"}, {"type": "ox", "p": "test 를 오른쪽으로 3 픽셀 밀면 CNN 도 0.7484 로 떨어진다. 즉 CNN 이 위치 이동에 완전히 불변인 것은 아니다.", "a": true, "w": "Affine 층은 여전히 위치별 가중치를 쓰고, 2×2 풀링 한 번이 흡수하는 이동은 1 픽셀 정도입니다. 그래도 MLP (0.5619) 보다 훨씬 덜 떨어집니다.", "an": "문제 6-3"}, {"type": "short", "p": "1 픽셀 밀었을 때 Day 4 MLP 정확도는 0.9757 → 0.9551 입니다. 떨어진 폭은? (소수 넷째 자리)", "a": ["0.0206", ".0206"], "w": "0.9757 − 0.9551 = 0.0206. CNN 은 0.9810 → 0.9734 로 0.0076 — 이미 1 픽셀부터 약 3배 차이.", "an": "문제 6-3"}, {"type": "drop", "p2": "<code>np.roll(X_test, 2, axis=?)</code> 에서 축을 {} 으로 주면 (N, C, H, W) 이미지가 {} 으로 2 픽셀 밀린다 (밀려 나간 열은 반대쪽으로 들어옴).", "opts": [["1", "2", "3"], ["왼쪽", "오른쪽", "아래쪽"]], "a": [2, 1], "w": "axis 3 = W (가로). 양수 shift 는 인덱스가 커지는 쪽 = 오른쪽. MLP 는 같은 이미지를 펼친 (N, 784) 로 평가합니다.", "an": "문제 6-3"}, {"type": "match", "p": "모델과 결과를 짝지으세요.", "left": ["Day 3 MLP (784-100-10)", "Day 4 MLP (5층 + BN + Adam, 5 epoch)", "SimpleConvNet (1 epoch)", "3 픽셀 이동 — CNN / Day 4 MLP"], "right": ["79,510 개 / 0.9694", "110,610 개 / 0.9757", "433,890 개 / 0.9810", "0.7484 / 0.5619"], "a": [0, 1, 2, 3], "w": "파라미터는 CNN 이 가장 많지만 거의 전부 Affine 층입니다. 정확도와 이동 강건성 둘 다 구조의 차이에서 나옵니다.", "an": "문제 6-3"}, {"type": "order", "p": "문제 6-2 특징 맵을 그리는 순서로 배열하세요.", "items": ["<code>load_params(model, 'cnn_ref.npz')</code> 로 학습된 가중치를 불러온다", "<code>x_test[0:1]</code> 을 (1, 1, 28, 28) 로 만든다", "<code>model.layers[0]</code> (Conv) → <code>layers[1]</code> (Relu) 로 forward 한다", "(1, 30, 24, 24) 의 30 장을 격자로 imshow 한다"], "w": "Sequential 의 계층을 하나씩 forward 하면 중간 결과를 꺼낼 수 있습니다. 모든 계층이 같은 forward(x, train_flg) 규약이라 가능합니다.", "an": "문제 6-2"}, {"type": "hot", "p": "test 를 오른쪽으로 0 ~ 3 픽셀 밀었을 때의 정확도입니다. <b>CNN 과 MLP 의 차이가 가장 큰</b> 이동량을 클릭하세요.", "w": "3 픽셀 — 0.7484 vs 0.5619, 차이 0.1865 입니다. 0 → 1 → 2 → 3 픽셀에서 차이가 0.0053 → 0.0183 → 0.1144 → 0.1865 로 커집니다. 많이 밀수록 구조의 차이가 드러납니다.", "an": "D5-7 · 이동 강건성", "viewBox": "0 0 520 300", "sw": 520, "svg": "<line x1=\"54.0\" y1=\"34.0\" x2=\"54.0\" y2=\"240.0\" stroke=\"#8a9bb8\" stroke-width=\"1\" /><line x1=\"54.0\" y1=\"240.0\" x2=\"504.0\" y2=\"240.0\" stroke=\"#8a9bb8\" stroke-width=\"1\" /><line x1=\"50.0\" y1=\"240.0\" x2=\"504.0\" y2=\"240.0\" stroke=\"#2a3a5c\" stroke-width=\"1 \"9.5\" fill=\"#f5b942\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">.7975</text><text x=\"339.0\" y=\"256.0\" font-size=\"11\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">2 픽셀</text><rect x=\"407.0\" y=\"120.4\" width=\"38\" height=\"119.6\" fill=\"#2dd4bf\" fill-opacity=\"0.85\"/><text x=\"426.0\" y=\"111.4\" font-size=\"9.5\" fill=\"#2dd4bf\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">.7484</text><rect x=\"451.0\" y=\"184.4\" width=\"38\" height=\"55.6\" fill=\"#f5b942\" fill-opacity=\"0.85\"/><text x=\"470.0\" y=\"175.4\" font-size=\"9.5\" fill=\"#f5b942\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">.5619</text><text x=\"448.0\" y=\"256.0\" font-size=\"11\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">3 픽셀</text><text x=\"54.0\" y=\"284.0\" font-size=\"10\" fill=\"#8a9bb8\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">세로축은 0.4 부터</text>", "regions": [{"id": "s0", "label": "0 픽셀 이동", "x": 70.0, "y": 28, "w": 97.0, "h": 238}, {"id": "s1", "label": "1 픽셀 이동", "x": 179.0, "y": 28, "w": 97.0, "h": 238}, {"id": "s2", "label": "2 픽셀 이동", "x": 288.0, "y": 28, "w": 97.0, "h": 238}, {"id": "s3", "label": "3 픽셀 이동", "x": 397.0, "y": 28, "w": 97.0, "h": 238}], "a": "s3"}, {"type": "code", "p": "문제 6-1 1층 필터 30개를 그리는 코드를 완성하세요.", "code": "W = model.params()[{{}}]          # (30, 1, 5, 5)\nfig, axes = plt.subplots(3, 10, figsize=(10, 3))\nfor i in range(30):\n    axes.flat[i].imshow(W[i, {{}}], cmap='gray')", "a": [["'0.W'", "\"0.W\""], ["0"]], "w": "키는 '계층 번호.이름' — Convolution 이 0 번째 계층. 입력 채널이 1 개라 W[i, 0] 이 5×5 그림 한 장.", "an": "문제 6-1"}]}, {"t": "7교시 · 모델 비용 계산", "anim": "D5-8 모델 비용 계산기", "qs": [{"type": "single", "p": "Convolution 의 MAC (곱셈-덧셈) 수는?", "o": ["N·C·H·W·FH·FW", "FN·OH·OW·C·FH·FW", "FN·C·FH·FW", "FN·OH·OW"], "a": 1, "w": "출력 값 하나 (FN·OH·OW 개) 마다 C·FH·FW 번 곱해 더합니다. FN·C·FH·FW 는 파라미터 (편향 제외), FN·OH·OW 는 출력 값의 개수.", "an": "문제 7-1"}, {"type": "multi", "p": "SimpleConvNet 비용표에서 옳은 것을 <b>모두</b> 고르세요.", "o": ["총 MAC 은 865,000 이다", "Pooling 이 MAC 의 대부분을 차지한다", "Conv 는 파라미터 780 개로 Affine1 과 같은 432,000 MAC 을 계산한다", "파라미터는 Affine(4320→100) 에 몰려 있다 (432,100)"], "a": [0, 2, 3], "w": "'파라미터는 Affine 에, 연산은 Conv 에'. Conv 의 필터 하나가 576 (24×24) 위치에서 다시 쓰이기 때문. Pooling 은 MAC 0 (비교만).", "an": "문제 7-3"}, {"type": "ox", "p": "Affine(in, out) 의 MAC 은 in·out 으로, 파라미터 수 (in·out + out) 와 거의 같다.", "a": true, "w": "샘플 하나에 가중치 하나를 딱 한 번 씁니다. Conv 는 가중치 하나를 OH·OW 번 다시 써서 MAC 이 파라미터보다 훨씬 큽니다.", "an": "문제 7-2"}, {"type": "ox", "p": "SimpleConvNet 을 float32 → int8 로 바꾸면 크기가 1.74 MB → 0.43 MB 로 줄고, MAC 수도 1/4 로 준다.", "a": false, "w": "int8 은 값 하나를 4 B → 1 B 로 줄일 뿐 곱셈-덧셈 횟수는 그대로입니다. 대신 연산 하나가 가볍고 빨라집니다 — Vision 과정의 Quantization.", "an": "문제 7-3"}, {"type": "short", "p": "224×224×3 입력에 3×3 필터 64개 (stride 1, pad 1) conv 하나의 MAC 은? (숫자)", "a": ["86704128", "86,704,128"], "w": "64 · 224 · 224 · 3·3·3 = 86,704,128. 파라미터는 1,792 개뿐인데 출력 3,211,264 값 (float32 12.8 MB) — 큰 이미지에선 연산 · 활성화 메모리가 병목.", "an": "문제 7-1"}, {"type": "drop", "p2": "SimpleConvNet 의 float32 크기는 433,890 × {} B = 1,735,560 B ≈ 1.74 MB 이고, int8 이면 약 {} MB 이다.", "opts": [["2", "4", "8"], ["1.74", "0.87", "0.43"]], "a": [1, 2], "w": "float32 = 4 바이트, int8 = 1 바이트. 433,890 B ≈ 0.43 MB.", "an": "문제 7-3"}, {"type": "match", "p": "경량 CNN 의 층과 (파라미터 / MAC) 을 짝지으세요.", "left": ["Conv(1→16, 3×3, P1)", "Conv(16→32, 3×3, P1)", "Affine(1568→10)", "전체"], "right": ["160 / 112,896", "4,640 / 903,168", "15,690 / 15,680", "20,490 / 1,031,744"], "a": [0, 1, 2, 3], "w": "SimpleConvNet (433,890 / 865,000) 보다 파라미터는 21 배 적고 MAC 은 비슷합니다. 풀링을 두 번 해 Affine 입력을 1568 로 줄인 덕분.", "an": "문제 7-3"}, {"type": "order", "p": "경량 CNN 에서 텐서 shape 이 바뀌는 순서로 배열하세요.", "items": ["(N, 1, 28, 28)", "Conv(1→16, 3×3, P1) → (N, 16, 28, 28)", "Pooling → (N, 16, 14, 14)", "Conv(16→32, 3×3, P1) → (N, 32, 14, 14)", "Pooling → (N, 32, 7, 7) → 펼쳐서 1568"], "w": "pad 1 이면 3×3 conv 는 크기를 유지하고, 풀링이 절반씩 줄입니다. 채널을 늘리고 크기를 줄이는 것이 CNN 의 전형적인 모양.", "an": "문제 7-3"}, {"type": "hot", "p": "경량 CNN 의 계층과 출력 shape 입니다. <b>MAC 이 가장 많은</b> 층을 클릭하세요.", "w": "Conv 16→32 (903,168 MAC) 입니다. 32·14·14 출력마다 16·3·3 = 144 번. Conv 1→16 은 출력이 더 크지만 (16·28·28) 입력 채널이 1 이라 9 번씩 → 112,896. Affine 은 15,680.", "an": "D5-8 · 모델 비용 계산기", "viewBox": "0 0 520 290", "sw": 520, "svg": "<defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#8a9bb8\"/></marker></defs><text x=\"30.0\" y=\"16.0\" font-size=\"12\" fill=\"#8a9bb8\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">경량 CNN (Relu 생략)</text><text x=\"310.0\" y=\"16.0\" font-size=\"12\" fill=\"#8a9bb8\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">출력 shape</text><rect x=\"30.0\" y=\"34.0\" width=\"250.0\" height=\"30.0\" rx=\"6\" fill=\"#0a0f1c\" stroke=\"#2a3a5c\" stroke-width=\"1\"/><text x=\"155.0\" y=\"49.0\" font-size=\"12.5\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">입력</text><text x=\"310.0\" y=\"49.0\" font-size=\"12.5\" fill=\"#2dd4bf\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">(N, 1, 28, 28)</text><line x1=\"155.0\" y1=\"65.0\" x2=\"155.0\" y2=\"73.0\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"30.0\" y=\"74.0\" width=\"250.0\" height=\"30.0\" rx=\"6\" fill=\"#14203a\" stroke=\"#60a5fa\" stroke-width=\"1\"/><text x=\"155.0\" y=\"89.0\" font-size=\"12.5\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">Conv 1→16, 3×3, P1</text><text x=\"310.0\" y=\"89.0\" font-size=\"12.5\" fill=\"#2dd4bf\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">(N, 16, 28, 28)</text><line x1=\"155.0\" y1=\"105.0\" x2=\"155.0\" y2=\"113.0\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"30.0\" y=\"114.0\" width=\"250.0\" height=\"30.0\" rx=\"6\" fill=\"#14203a\" stroke=\"#f472b6\" stroke-width=\"1\"/><text x=\"155.0\" y=\"129.0\" font-size=\"12.5\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">Pooling 2×2</text><text x=\"310.0\" y=\"129.0\" font-size=\"12.5\" fill=\"#2dd4bf\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">(N, 16, 14, 14)</text><line x1=\"155.0\" y1=\"145.0\" x2=\"155.0\" y2=\"153.0\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"30.0\" y=\"154.0\" width=\"250.0\" height=\"30.0\" rx=\"6\" fill=\"#14203a\" stroke=\"#60a5fa\" stroke-width=\"1\"/><text x=\"155.0\" y=\"169.0\" font-size=\"12.5\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">Conv 16→32, 3×3, P1</text><text x=\"310.0\" y=\"169.0\" font-size=\"12.5\" fill=\"#2dd4bf\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">(N, 32, 14, 14)</text><line x1=\"155.0\" y1=\"185.0\" x2=\"155.0\" y2=\"193.0\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"30.0\" y=\"194.0\" width=\"250.0\" height=\"30.0\" rx=\"6\" fill=\"#14203a\" stroke=\"#f472b6\" stroke-width=\"1\"/><text x=\"155.0\" y=\"209.0\" font-size=\"12.5\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">Pooling 2×2</text><text x=\"310.0\" y=\"209.0\" font-size=\"12.5\" fill=\"#2dd4bf\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">(N, 32, 7, 7) → 1568</text><line x1=\"155.0\" y1=\"225.0\" x2=\"155.0\" y2=\"233.0\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"30.0\" y=\"234.0\" width=\"250.0\" height=\"30.0\" rx=\"6\" fill=\"#14203a\" stroke=\"#f5b942\" stroke-width=\"1\"/><text x=\"155.0\" y=\"249.0\" font-size=\"12.5\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">Affine 1568→10</text><text x=\"310.0\" y=\"249.0\" font-size=\"12.5\" fill=\"#2dd4bf\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">(N, 10)</text>", "regions": [{"id": "c1", "label": "Conv 1→16, 3×3, P1 층", "x": 30, "y": 74, "w": 250, "h": 30}, {"id": "p1", "label": "Pooling 2×2 층", "x": 30, "y": 114, "w": 250, "h": 30}, {"id": "c2", "label": "Conv 16→32, 3×3, P1 층", "x": 30, "y": 154, "w": 250, "h": 30}, {"id": "p2", "label": "Pooling 2×2 층", "x": 30, "y": 194, "w": 250, "h": 30}, {"id": "fc", "label": "Affine 1568→10 층", "x": 30, "y": 234, "w": 250, "h": 30}], "a": "c2"}, {"type": "code", "p": "문제 7-1 <code>conv_cost</code> 를 완성하세요.", "code": "def conv_cost(C, H, W, FN, F, stride=1, pad=0):\n    OH = (H + 2 * pad - F) // stride + 1\n    OW = (W + 2 * pad - F) // stride + 1\n    params = FN * C * F * F + {{}}\n    mac = FN * OH * OW * {{}}\n    return params, mac, FN * OH * OW      # 파라미터, MAC, 출력 값 수", "a": [["FN"], ["C*F*F", "F*F*C", "C*F**2"]], "w": "conv_cost(1, 28, 28, 30, 5) = (780, 432,000, 17,280). affine_cost 는 (in·out + out, in·out, out).", "an": "문제 7-1"}]}, {"t": "8교시 · 평가 · 5일 과정 정리", "anim": "5일 개념 지도 · Vision 과정 연결", "qs": [{"type": "single", "p": "Day 2 의 Affine 과 im2col 을 쓴 Convolution 의 관계로 옳은 것은?", "o": ["Affine 은 Y = XW + b, Conv 는 행렬곱과 무관한 별도 연산 Y = W ⊛ X 이다", "Affine 은 Y = WX, Conv 는 Y = XWᵀ + b 로 곱하는 방향이 반대다", "둘 다 Y = XW + b — Conv 는 X 자리에 col, W 자리에 펼친 필터를 넣는다", "둘 다 Y = σ(XW) — 활성화가 계층 안에 들어 있다"], "a": 2, "w": "그래서 Conv 의 backward 도 Affine 의 세 줄 (dX · dW · db) 그대로이고, 끝에 col2im 만 붙습니다. 활성화는 늘 별도 계층입니다.", "an": "Day 2 · Day 5 문제 3-2"}, {"type": "multi", "p": "Day 3 의 Affine 역전파 규칙으로 옳은 것을 <b>모두</b> 고르세요.", "o": ["<code>db = dout.sum(axis=1)</code>", "<code>dW = dout @ X.T</code>", "<code>dW = X.T @ dout</code>", "<code>dX = dout @ W.T</code>"], "a": [2, 3], "w": "shape 으로 확인: X (N, in), dout (N, out) → dW 는 (in, out) 이어야 하니 X.T @ dout. db 는 배치 방향 합 sum(axis=0) — axis=1 이면 (N,) 이 되어 b (out,) 와 shape 이 안 맞습니다.", "an": "Day 3 · Affine 역전파"}, {"type": "ox", "p": "gradient check 는 수치 미분 (중심 차분) 기울기와 역전파 기울기를 비교하며, Day 5 의 Convolution · Pooling 은 상대 오차 1e-12 수준으로 통과했다.", "a": true, "w": "Conv dx 3.8e-12 · W 6.5e-13 · b 2.5e-12, Pool dx 1.8e-12 — 기준 1e-7 보다 훨씬 작습니다. 실습 평가 과제 1 (30점) 입니다.", "an": "Day 3 · Day 5 문제 4-4"}, {"type": "short", "p": "Day 4 에서 BN 을 앞의 Affine 에 접어 넣으면 (BN folding) 13 계층 모델이 몇 계층이 되었나? (숫자)", "a": ["9"], "w": "BN 4 개가 사라져 9 계층. W' = W·γ/√(σ² + ε), b' = (b − μ)·γ/√(σ² + ε) + β. 정확도는 같고 추론 연산은 줄어듭니다 — TensorRT 가 하는 최적화.", "an": "Day 4 · BN folding"}, {"type": "drop", "p2": "하이퍼파라미터는 {} 정확도로 고르고, {} 정확도는 마지막에 한 번만 본다.", "opts": [["validation", "test", "train"], ["test", "validation", "train"]], "a": [0, 0], "w": "test 로 고르면 test 에 과적합합니다. 오늘 CNN 은 곡선만 보려고 val = test 로 넣었고, 하이퍼파라미터는 고르지 않았습니다.", "an": "Day 4 · validation"}, {"type": "match", "p": "Day 4 기법과 역할을 짝지으세요.", "left": ["Adam", "He 초기화", "BatchNorm", "Dropout"], "right": ["파라미터마다 학습률 조절 (Momentum + RMSProp)", "std √(2/n_in) — ReLU 층의 신호 크기 유지", "미니배치로 평균 0 · 분산 1, 그다음 γ, β", "학습 때 뉴런을 무작위로 꺼 과적합 억제"], "a": [0, };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip = h => { const d = document.createElement('div'); d.innerHTML = h; return d.textContent; };
const norm = s => String(s ?? '').toLowerCase().replace(/\s+/g, '').replace(/[“”]/g, '"').replace(/[‘’]/g, "'");
function rng(seed){ let h = 2166136261; for (const c of seed) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 100000) / 100000; }; }
function shuffled(arr, seed){ const r = rng(seed), idx = arr.map((_, i) => i); for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; } if (idx.every((v, i) => v === i) && idx.length > 1) idx.push(idx.shift()); return idx; }

    case 'drop': return q.opts.map(() => -1);
    case 'match': return q.left.map(() => -1);
    case 'order': return shuffled(q.items, 'o' + id);          // 현재 화면 순서(원래 인덱스)

  switch (q.type) {
    case 'single': case 'ox': case 'hot': return a !== null;

    case 'drop': case 'match': return a.every(v => v >= 0);

    case 'short': return q.a.some(x => norm(x) === norm(a));
    case 'drop': return a.every((v, i) => v === q.a[i]);
    case 'match': return a.every((v, i) => v === q.a[i]);
    case 'order': return a.every((v, i) => v === i);

  switch (q.type) {
    case 'single': return right ? `${L[q.a]} ${strip(q.o[q.a])}` : (a === null ? '미응답' : `${L[a]} ${strip(q.o[a])}`);
    case 'multi': { const v = right ? q.a : a; return v.length ? [...v].sort().map(i => L[i]).join(' ') : '미응답'; }
    case 'ox': { const v = right ? q.a : a; return v === null ? '미응답' : (v ? 'O' : 'X'); }
    case 'short': return right ? q.a[0] : (a.trim() || '미응답');
    case 'drop': return (right ? q.a : a).map((v, i) => v < 0 ? '?' : strip(q.opts[i][v])).join(' / ');
    case 'match': return (right ? q.a : a).map((v, i) => `${strip(q.left[i])}→${v < 0 ? '?' : strip(q.right[v])}`).join(', ');
    case 'order': return (right ? q.items.map((_, i) => i) : a).map(i => strip(q.items[i])).join(' → ');
    case 'hot': { const v = right ? q.a : a; return v === null ? '미응답' : (q.regions.find(r => r.id === v) || {}).label; }
    case 'flash': return right ? strip(q.back) : (a.self === null ? '미응답' : (a.self ? '알았다' : '몰랐다'));

      break;
    }
    case 'order':
      body = '<div class="hint" style="margin:-4px 0 8px">끌어다 놓거나 ▲▼ 버튼으로 순서를 바꾸세요.</div><ol class="ord" data-k="' + k + '">' + a.map((it, pos) => {
        const c = g ? (it === pos ? 'ok' : 'bad') : '';
        return `<li class="${c}" draggable="${!g}" data-pos="${pos}"><span class="k">${pos + 1}</span><span>${q.items[it]}</span><span class="mv"><button data-k="${k}" data-pos="${pos}" data-d="-1" ${dis || (pos === 0 ? 'disabled' : '')} aria-label="위로">▲</button><button data-k="${k}" data-pos="${pos}" data-d="1" ${dis || (pos === a.length - 1 ? 'disabled' : '')} aria-label="아래로">▼</button></span></li>`;
      }).join('') + '</ol>';
      break;
    case 'hot': {
      const regs = q.regions.map(r => {
        let c = a === r.id ? 'sel' : '';
        if (g) c = r.id === q.a ? 'ok' : (a === r.id ? 'bad' : '');
        const shape = r.shape === 'circle' ? `<circle cx="${r.x}" cy="${r.y}" r="${r.r}"` : `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="6"`;
        return `${shape} class="rg ${c}" data-k="${k}" data-r="${r.id}" tabindex="${g ? -1 : 0}" role="button" aria-label="${esc(r.label)}"><title>${esc(r.label)}</title>${r.shape === 'circle' ? '</circle>' : '</rect>'}`;
      }).join('');
      body = `<div class="hot"><svg viewBox="${q.viewBox}" width="${q.sw}" xmlns="http://www.w3.org/2000/svg">${q.svg}${regs}</svg></div>` +
        `<div class="hint" style="margin-top:6px">선택: <b style="color:var(--amber)">${a === null ? '없음' : esc((q.regions.find(r => r.id === a) || {}).label)}</b></div>`;
      break;
    }
    case 'flash':
      body = `<div class="card ${a.flipped ? 'flip' : ''}" data-k="${k}"><div class="in"><div class="f">${q.front}</div><div class="b">${q.back}</div></div></div>` +
        `<div class="selfrow"><button class="flipb" data-k="${k}" ${g ? 'disabled' : ''}>${a.flipped ? '앞면 보기' : '🔄 카드 뒤집기'}</button>` +
        `<button class="selfb ${a.self === true ? 'active' : ''}" data-k="${k}" data-v="1" ${g || !a.flipped ? 'disabled' : ''}>✅ 알았다</button>` +
        `<button class="selfb ${a.self === false ? 'active' : ''}" data-k="${k}" data-v="0" ${g || !a.flipped ? 'disabled' : ''}>❌ 몰랐다</button>` +
        `<span class="hint">${a.flipped ? '정답과 비교해 스스로 채점하세요.' : '먼저 답을 떠올린 뒤 뒤집으세요.'}</span></div>`;
      break;
    case 'code': {
      let i = 0;
      body = '<pre>' + esc(q.code).replace(/\{\{\}\}/g, () => {
        const n = i++;
        const w = Math.max(5, (q.a[n][0] || '').length + 2);
        const st = g ? `style="border-color:${q.a[n].some(x => norm(x) === norm(a[n])) ? 'var(--green)' : 'var(--red)'};width:${w}ch"` : `style="width:${w}ch"`;
        return `<input type="text" class="ci" data-k="${k}" data-n="${n}" value="${esc(a[n])}" ${dis} ${st} aria-label="빈칸 ${n + 1}">`;
      }) + '</pre>';
      break;
    }
  }
  const t = TYPES[q.type];
  const prompt = q.type === 'drop' ? (q.p || '') : (q.type === 'flash' ? (q.p || '카드 앞면의 질문에 답을 떠올린 뒤 뒤집어 확인하세요.') : q.p);
  let fb = '';
  if (g) {
    const right = q.type === 'flash' ? '' : `<div>정답: <b>${esc(fmt(q, a, true))}</b></div>`;
    fb = `<div class="fb ${ok ? 'ok' : 'bad'}"><b class="v">${ok ? '정답' : '오답'}</b>${right}${q.w}<span class="anim">확인: ${q.an}</span></div>`;
  }
  const un = !g && !answered(q, a) && attempted[tab] ? 'unans' : '';
  return `<div class="q ${g ? (ok ? 'ok' : 'bad') : un}"><div class="qh"><span class="n">문항 ${k + 1}</span><span class="ty" style="color:${t.c};border-color:${t.c}">${t.n}</span></div><div class="p">${prompt}</div>${body}${fb}</div>`;
}
const attempted = Q.map(() => false);
function render(){
  renderTabs();
  const s = Q[tab];
  $('#sheet').innerHTML = `<div class="head"><span class="t">${s.t}</span><span class="a">🎬 ${s.anim}</span></div>` + s.qs.map((q, k) => qHTML(q, k)).join('');
  bind();
  const nm = $('#name').value, g = graded[tab];
  if (g) {
    const sc = scoreOf(tab); $('#rscore').textContent = `${sc}/10`;
    if (nm.trim()) { $('#rcode').textContent = codeFor(nm, tab + 1, sc); $('#rhint').textContent = '결과 코드'; }
    else { $('#rcode').textContent = '—'; $('#rhint').textContent = '이름을 입력하면 결과 코드가 나옵니다.'; }
  } else {
    $('#rcode').textContent = '—'; $('#rscore').textContent = '';
    const n = ans[tab].filter((a, k) => answered(s.qs[k], a)).length;
    $('#rhint').textContent = `${tab + 1}교시: ${n}/10 응답. 채점하기를 누르면 잠깁니다.`;
  }
  $('#gradeBtn').disabled = g;
}
function bind(){
  const S = $('#sheet'), A = ans[tab];
  S.querySelectorAll('.opt[data-j]').forEach(b => b.onclick = () => {
    const k = +b.dataset.k, j = +b.dataset.j, q = Q[tab].qs[k];
    if (q.type === 'multi') { const i = A[k].indexOf(j); i < 0 ? A[k].push(j) : A[k].splice(i, 1); }
    else A[k] = A[k] === j ? null : j;
    render();
  });
  S.querySelectorAll('.oxb').forEach(b => b.onclick = () => { const k = +b.dataset.k, v = b.dataset.v === 'true'; A[k] = A[k] === v ? null : v; render(); });
  S.querySelectorAll('.sa').forEach(i => i.oninput = () => { A[+i.dataset.k] = i.value; renderTabs(); });
  S.querySelectorAll('.ci').forEach(i => i.oninput = () => { A[+i.dataset.k][+i.dataset.n] = i.value; renderTabs(); });
  S.querySelectorAll('.dd').forEach(s => s.onchange = () => { A[+s.dataset.k][+s.dataset.n] = +s.value; renderTabs(); });
  S.querySelectorAll('.mm').forEach(s => s.onchange = () => { A[+s.dataset.k][+s.dataset.i] = +s.value; renderTabs(); });
  S.querySelectorAll('.ord .mv button').forEach(b => b.onclick = () => {
    const k = +b.dataset.k, p = +b.dataset.pos, d = +b.dataset.d, arr = A[k];
    [arr[p], arr[p + d]] = [arr[p + d], arr[p]]; render();
  });
  S.querySelectorAll('.ord').forEach(ol => {
    const k = +ol.dataset.k; let from = null;
    ol.querySelectorAll('li').forEach(li => {
      li.addEventListener('dragstart', e => { from = +li.dataset.pos; li.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(from)); });
      li.addEventListener('dragend', () => li.classList.remove('drag'));
      li.addEventListener('dragover', e => { if (from !== null) { e.preventDefault(); li.classList.add('over'); } });
      li.addEventListener('dragleave', () => li.classList.remove('over'));
      li.addEventListener('drop', e => { e.preventDefault(); const to = +li.dataset.pos; if (from === null || from === to) return; const arr = A[k]; const [x] = arr.splice(from, 1); arr.splice(to, 0, x); from = null; render(); });
    });
  });
  S.querySelectorAll('.rg').forEach(r => {
    const pick = () => { if (graded[tab]) return; const k = +r.dataset.k; A[k] = A[k] === r.dataset.r ? null : r.dataset.r; render(); };
    r.addEventListener('click', pick);
    r.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
  });
  S.querySelectorAll('.flipb').forEach(b => b.onclick = () => { const k = +b.dataset.k; A[k].flipped = !A[k].flipped; render(); });
  S.querySelectorAll('.card').forEach(c => c.onclick = () => { if (graded[tab]) return; const k = +c.dataset.k; A[k].flipped = !A[k].flipped; render(); });
  S.querySelectorAll('.selfb').forEach(b => b.onclick = () => { const k = +b.dataset.k; A[k].self = b.dataset.v === '1'; render(); });
}

// ── 채점 · 결과 코드 ──
function hash(s){ let h = 5381; for (const c of s) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return h.toString(16).padStart(8, '0').slice(-4); }
function codeFor(name, t, score){ return `${t}${'ABCDEFGHIJK'[10 - score] || 'K'}-${hash(`${name.trim()}|${t}|${score}|nnday5`)}`; }
$('#gradeBtn').onclick = () => {
  const s = Q[tab], n = ans[tab].filter((a, k) => answered(s.qs[k], a)).length;
  attempted[tab] = true;
  if (n < 10 && !confirm(`아직 ${10 - n}문항에 답하지 않았습니다. 그래도 채점할까요? (미응답은 오답 처리)`)) { render(); return; }
  graded[tab] = true; render();
};
$('#resetBtn').onclick = () => {
  if (!confirm(`${tab + 1}교시 답을 모두 지우고 다시 풀까요?`)) return;
  graded[tab] = false; attempted[tab] = false;
  ans[tab] = Q[tab].qs.map((q, k) => init(q, `${tab}-${k}`)); render();
};
$('#name').oninput = render;

// ── 제출 · 오답 정리 ──
let lastHtml = '', lastText = '';
function buildReport(){
  const nm = $('#name').value.trim() || '(이름 없음)', ds = new Date().toLocaleString('ko-KR');
  let h = `<h3>Neural Network Day 5 개념 워크시트 — 오답 정리</h3><div class="meta">${esc(nm)} · ${ds}</div>`;
  let t = `Neural Network Day 5 개념 워크시트 — 오답 정리\n이름: ${nm}\n일시: ${ds}\n\n`;
  let tot = 0, cnt = 0;
  const byType = {};
  Q.forEach((s, i) => {
    if (!graded[i]) return;
    const sc = scoreOf(i); tot += sc; cnt++;
    s.qs.forEach((q, k) => { const b = byType[q.type] ||= [0, 0]; b[1]++; if (correct(q, ans[i][k])) b[0]++; });
    const code = $('#name').value.trim() ? codeFor($('#name').value, i + 1, sc) : '—';
    const wrong = s.qs.map((q, k) => ({ q, k, a: ans[i][k] })).filter(x => !correct(x.q, x.a));
    h += `<div class="sec">${esc(s.t)} — ${sc}/10 · 결과 코드 ${code}</div>`;
    t += `[${s.t}] ${sc}/10 · 결과 코드 ${code}\n`;
    if (!wrong.length) { h += `<div class="ok">전부 정답 🎉</div>`; t += '  전부 정답\n\n'; return; }
    h += '<table><tr><th>#</th><th>유형</th><th>문항</th><th>내 답</th><th>정답</th><th>다시 볼 곳</th></tr>';
    wrong.forEach(({ q, k, a }) => {
      const qt = strip(q.type === 'flash' ? q.front : (q.p || q.p2 || '')).replace(/\s+/g, ' ').slice(0, 70);
      const my = fmt(q, a, false), co = fmt(q, a, true);
      h += `<tr><td>${k + 1}</td><td>${TYPES[q.type].n}</td><td>${esc(qt)}</td><td class="bad">${esc(my)}</td><td class="ok">${esc(co)}</td><td>${esc(strip(q.an))}</td></tr>`;
      t += `  ${k + 1}. [${TYPES[q.type].n}] ${qt}\n     내 답: ${my}\n     정답: ${co}\n     다시 볼 곳: ${strip(q.an)}\n`;
    });
    h += '</table>'; t += '\n';
  });
  const notGraded = Q.map((s, i) => graded[i] ? null : i + 1).filter(x => x);
  const typeLine = Object.entries(byType).map(([k, [c, n]]) => `${TYPES[k].n} ${c}/${n}`).join(' · ');
  const sum = `<div class="sum"><span>채점한 교시 ${cnt}/8</span><span>합계 ${tot}/${cnt * 10}</span>${notGraded.length ? `<span class="none">미채점: ${notGraded.join(', ')}교시</span>` : ''}</div>` + (typeLine ? `<div class="meta">유형별 정답: ${typeLine}</div>` : '');
  h = h.replace('</div>', '</div>' + sum);
  t = t.replace('\n\n', `\n채점한 교시 ${cnt}/8 · 합계 ${tot}/${cnt * 10}${notGraded.length ? ' · 미채점 ' + notGraded.join(', ') + '교시' : ''}\n유형별 정답: ${typeLine}\n\n`);
  lastHtml = h; lastText = t;
  return h;
}
$('#submitBtn').onclick = () => {
  if (!graded.some(x => x)) { alert('먼저 한 교시 이상 채점하세요.'); return; }
  $('#dgBody').innerHTML = buildReport(); $('#toast').textContent = ''; $('#dlg').showModal();
};
$('#closeBtn').onclick = () => $('#dlg').close();
$('#captureBtn').onclick = async () => {
  const htmlDoc = `<meta charset="utf-8">` + lastHtml.replace(/ class="[^"]*"/g, '').replace(/<table>/g, '<table border="1" style="border-collapse:collapse">');
  try {
    if (navigator.clipboard && window.ClipboardItem) {
      await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([htmlDoc], { type: 'text/html' }), 'text/plain': new Blob([lastText], { type: 'text/plain' }) })]);
      $('#toast').textContent = '복사했습니다 — 노션에 붙여 넣으세요.'; return;
    }
  } catch (e) {}
  const ta = document.createElement('textarea'); ta.value = lastText; ta.style.position = 'fixed'; ta.style.opacity = '0';
  $('#dlg').appendChild(ta); ta.focus(); ta.select();
  const ok = document.execCommand('copy'); ta.remove();
  $('#toast').textContent = ok ? '텍스트로 복사했습니다.' : '복사하지 못했습니다 — 직접 선택해 복사하세요.';
};

$('#legend').innerHTML = Object.values(TYPES).map(t => `<span class="tag" style="color:${t.c};border-color:${t.c}55">${t.n}</span>`).join('');
// worksheet.html#t3 → 3교시 탭으로 바로 열기 (노트북 교시별 링크)
function fromHash(){ const m = location.hash.match(/^#t([1-8])$/); if (m) { tab = +m[1] - 1; } }
fromHash();
window.addEventListener('hashchange', () => { fromHash(); render(); window.scrollTo({ top: 0 }); });
render();
</script>
</body>
</html>
