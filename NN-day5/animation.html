&lt;div class=&quot;app&quot;&gt;

  &lt;p class=&quot;sub&quot;&gt;Day 2~4 의 MLP 는 28×28 이미지를 &lt;code&gt;x.reshape(-1, 784)&lt;/code&gt; 로 한 줄로 펴서 받았습니다. 2D 에서 바로 위 · 아래에 붙어 있던 픽셀이 1D 에서는 &lt;b style=&quot;color:var(--purple)&quot;&gt;28칸&lt;/b&gt; 떨어지고, Affine 층은 784개 입력을 &lt;b&gt;순서와 상관없이&lt;/b&gt; 각자 가중치로 곱해 더할 뿐입니다. 그림 위에 마우스를 올리면(터치) 그 픽셀의 상하좌우 이웃이 1D 벡터의 어디로 가는지 보입니다.&lt;/p&gt;

    &lt;div class=&quot;panel&quot;&gt;&lt;h2 id=&quot;stageTitle&quot;&gt;2D 이미지 (28×28) → 1D 벡터 (784)&lt;/h2&gt;

&lt;script&gt;
const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,ms));

function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}

$(&#x27;#digs&#x27;).innerHTML=DIG.map((d,i)=&gt;`&lt;button type=&quot;button&quot; aria-label=&quot;${d.src} 숫자 ${d.t}&quot;&gt;&lt;canvas width=&quot;28&quot; height=&quot;28&quot;&gt;&lt;/canvas&gt;&lt;/button&gt;`).join(&#x27;&#x27;);
$$(&#x27;#digs button&#x27;).forEach((b,i)=&gt;{const g=b.querySelector(&#x27;canvas&#x27;).getContext(&#x27;2d&#x27;),im=g.createImageData(28,28);for(let j=0;j&lt;784;j++){const v=Math.round(DIG[i].x[j]*255);im.data.set([v,v,v,255],4*j);}g.putImageData(im,0,0);b.onclick=()=&gt;{if(!busy)pickDigit(i);};});
function hover(e){if(!geo)return;const r=$(&#x27;#cv&#x27;).getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  const c=Math.floor((x-geo.ix)/geo.cell),rr=Math.floor((y-geo.iy)/geo.cell);if(c&lt;0||c&gt;27||rr&lt;0||rr&gt;27){const j=Math.floor((x-geo.sx)/geo.sw);if(y&gt;=geo.sy-12&amp;&amp;y&lt;=geo.sy+geo.sh+4&amp;&amp;j&gt;=0&amp;&amp;j&lt;784){hp=permOn?PERM[j]:j;draw();info();}return;}
  const j=rr*28+c;hp=permOn?PERM[j]:j;draw();info();}
$(&#x27;#cv&#x27;).addEventListener(&#x27;pointermove&#x27;,e=&gt;{if(!busy)hover(e);});$(&#x27;#cv&#x27;).addEventListener(&#x27;pointerdown&#x27;,e=&gt;{if(!busy)hover(e);});
async function flatten(ms=45){flatT=0;draw();for(let t=0;t&lt;=28;t+=0.25){flatT=t;draw();await sleep(ms/4);}flatT=28;draw();}
$(&#x27;#bFlat&#x27;).onclick=async()=&gt;{if(busy)return;busy=true;try{await flatten();setStatus(&#x27;info&#x27;,&#x27;28개 행을 차례로 이어 붙이면 784 벡터 — r 행 c 열 → i = r·28 + c&#x27;);}finally{busy=false;}};
$(&#x27;#bReset&#x27;).onclick=()=&gt;{if(busy)return;flatT=0;draw();};
$(&#x27;#cPerm&#x27;).onchange=e=&gt;{if(busy){e.target.checked=permOn;return;}permOn=e.target.checked;draw();info();mlpBars(permOn?1:0);};
async function setPerm(on,ms=0){if(permOn===on)return;if(ms){for(let k=0;k&lt;3;k++){$(&#x27;#cv&#x27;).style.opacity=0.4;await sleep(ms/6);$(&#x27;#cv&#x27;).style.opacity=1;await sleep(ms/6);}}permOn=on;$(&#x27;#cPerm&#x27;).checked=on;draw();info();mlpBars(on?1:0);}
window.addEventListener(&#x27;resize&#x27;,()=&gt;{draw();});
window.__d1={};
const P=[
 {n:&#x27;① 펼치기 (flatten)&#x27;,ex:&#x27;&lt;p&gt;MLP 의 첫 줄 &lt;code&gt;X = x.reshape(-1, 784)&lt;/code&gt; 는 28개 행을 차례로 이어 붙입니다: (r, c) → &lt;b class=&quot;amber&quot;&gt;i = r·28 + c&lt;/b&gt;. 같은 행의 좌우 이웃은 1D 에서도 &lt;b class=&quot;blue&quot;&gt;±1&lt;/b&gt; 로 붙어 있지만, 위 · 아래 이웃은 &lt;b class=&quot;purple&quot;&gt;±28&lt;/b&gt; 칸 떨어집니다.&lt;/p&gt;&lt;p&gt;Affine 층 &lt;code&gt;X @ W&lt;/code&gt; 는 784개 입력 하나하나에 별도의 가중치를 곱해 더할 뿐, &quot;어느 픽셀이 어느 픽셀 옆인지&quot; 를 전혀 모릅니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{await setPerm(false);pickDigit(0);hp=null;await flatten(55);hp=11*28+12;draw();info();codeMain();window.__d1.flat={p:hp,up:hp-28,down:hp+28};
   setStatus(&#x27;ok&#x27;,&#x27;(1, 28, 28) → (784,): 획 위의 픽셀 (11, 12) → i = 320 · 위 292 (−28) · 아래 348 (+28) · 왼쪽 319 · 오른쪽 321&#x27;);}},
 {n:&#x27;② 이웃이 멀어진다&#x27;,ex:&#x27;&lt;p&gt;몇 개 픽셀을 차례로 짚어 봅니다. 위아래 이웃은 언제나 1D 에서 &lt;b class=&quot;purple&quot;&gt;28칸&lt;/b&gt; 떨어져 있습니다. 더 나쁜 경우: 맨 왼쪽 열(c = 0) 의 i − 1 은 1D 에서는 바로 옆이지만 2D 에서는 &lt;b class=&quot;red&quot;&gt;윗줄의 오른쪽 끝&lt;/b&gt; — 전혀 이웃이 아닙니다.&lt;/p&gt;&lt;p&gt;이미지에서 의미 있는 패턴(획 · 모서리)은 &lt;b&gt;가까운 픽셀들의 2D 모양&lt;/b&gt;입니다. 이 구조를 처음부터 쓰는 층이 합성곱(convolution) 입니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{await setPerm(false);flatT=28;const pts=[[14,14],[6,20],[20,7],[12,0]];for(const [r,c] of pts){hp=r*28+c;draw();info();
     setStatus(c===0?&#x27;warn&#x27;:&#x27;info&#x27;,c===0?`(${r}, 0) → i = ${hp}: 1D 이웃 i − 1 = ${hp-1} 은 2D (${r-1}, 27) — 윗줄 끝, 진짜 이웃이 아님`:`(${r}, ${c}) → i = ${hp}: 위 ${hp-28} · 아래 ${hp+28} (±28) · 좌우 ${hp-1} · ${hp+1} (±1)`);await sleep(1100);}
   window.__d1.edge=hp;}},
 {n:&#x27;③ 픽셀 뒤섞기 실험&#x27;,ex:&#x27;&lt;p&gt;모든 이미지의 784 픽셀을 &lt;b&gt;똑같은 순서&lt;/b&gt; &lt;code&gt;perm = default_rng(0).permutation(784)&lt;/code&gt; 로 섞습니다. 사람 눈엔 잡음이지만 MLP 의 정확도는 &lt;b class=&quot;teal&quot;&gt;0.9436&lt;/b&gt; (원본) vs &lt;b class=&quot;red&quot;&gt;0.9455&lt;/b&gt; (뒤섞음) — 사실상 같습니다 (차이는 초기화 · 순서의 우연).&lt;/p&gt;&lt;p&gt;즉 MLP 는 애초에 이웃 관계를 쓰지 않았다는 증거입니다. 이웃 픽셀들이 지금 어디 있는지 보세요 — 원래 이웃이 1D 에서 수백 칸씩 흩어져 있습니다. 사람(그리고 CNN)은 이 그림을 못 읽지만 MLP 에게는 같은 문제입니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{flatT=28;pickDigit(0);hp=11*28+12;await setPerm(false);mlpBars(0);await sleep(700);await setPerm(true,600);info();
   const pp=INV[hp];window.__d1.perm={orig:D.mlp_orig,perm:D.mlp_perm,pos:pp,up:INV[hp-28]};codeMain();
   setStatus(&#x27;ok&#x27;,`원본 순서 test ${D.mlp_orig.toFixed(4)} · 뒤섞음 test ${D.mlp_perm.toFixed(4)} — MLP 는 픽셀 순서와 무관. 픽셀 (11, 12) 는 이제 i = ${pp}, 원래 위 이웃은 i = ${INV[hp-28]}`);}},
 {n:&#x27;④ 파라미터 폭발&#x27;,ex:&#x27;&lt;p&gt;FC 층의 가중치 수 = 입력 수 × 출력 수 = &lt;b&gt;H·W·C·hidden&lt;/b&gt;. MNIST 28×28 → 은닉 100 은 &lt;b class=&quot;amber&quot;&gt;78,400&lt;/b&gt; 개로 감당할 만하지만, 224×224 컬러 사진 → 은닉 1000 이면 &lt;b class=&quot;red&quot;&gt;150,528,000&lt;/b&gt; 개 (float32 로 602 MB) — 층 하나에!&lt;/p&gt;&lt;p&gt;게다가 이 가중치들은 &quot;왼쪽 위 모서리의 세로 획&quot; 과 &quot;오른쪽 아래의 세로 획&quot; 을 따로따로 배워야 합니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{await setCalc({iH:28,iW:28,iC:1,iN:100,iFN:30,iF:5});const a=calc();setStatus(&#x27;info&#x27;,`28×28×1 → 100: W ${fmtI(a.fcW)} 개`);await sleep(1300);
   await setCalc({iH:64,iW:64,iC:3,iN:500},250);await setCalc({iH:224,iW:224,iC:3,iN:1000},250);const b=calc();window.__d1.fc=[a.fcW,b.fcW];
   setStatus(&#x27;warn&#x27;,`224×224×3 → 1000: W ${fmtI(b.fcW)} 개 (float32 ${(b.fcW*4/1e6).toFixed(0)} MB) — 28×28 의 ${fmtI(b.fcW/a.fcW)} 배`);}},
 {n:&#x27;⑤ 합성곱: 지역성 · 가중치 공유&#x27;,ex:&#x27;&lt;p&gt;합성곱층의 두 아이디어:&lt;/p&gt;&lt;p&gt;· &lt;b class=&quot;teal&quot;&gt;지역성 (local connectivity)&lt;/b&gt; — 출력 한 칸은 입력의 작은 영역(F×F)만 봅니다.&lt;br&gt;· &lt;b class=&quot;green&quot;&gt;가중치 공유 (weight sharing)&lt;/b&gt; — 같은 필터를 이미지의 모든 위치에 씁니다.&lt;/p&gt;&lt;p&gt;그래서 파라미터 수 = &lt;code&gt;FN·C·F·F + FN&lt;/code&gt;. 3×3 필터 64개 on RGB = 64·3·3·3 + 64 = &lt;b class=&quot;green&quot;&gt;1,792&lt;/b&gt; 개 — 입력이 28×28 이든 224×224 든 4096×4096 이든 &lt;b&gt;같습니다&lt;/b&gt;. FC (150,528,000) 의 약 8만분의 1.&lt;/p&gt;&#x27;,
  run:async()=&gt;{await setCalc({iC:3,iFN:64,iF:3,iN:1000});for(const h of [28,224,1024,4096]){await setCalc({iH:h,iW:h});const c=calc();setStatus(&#x27;info&#x27;,`입력 ${h}×${h}×3: FC W ${fmtI(c.fcW)} · Conv ${fmtI(c.conv)} (변하지 않음)`);await sleep(800);}
   await setCalc({iH:224,iW:224});const c=calc();window.__d1.conv=c.conv;setStatus(&#x27;ok&#x27;,`3×3 필터 64개 on RGB = 64·3·3·3 + 64 = ${fmtI(c.conv)} — FC ${fmtI(c.fcW)} 의 ${fmtI(c.fcW/c.conv)}분의 1, 이미지 크기와 무관`);}},
];
initPresets(P);
pickDigit(0);mlpBars(null);codeMain();info();calc();
$(&#x27;#presets button&#x27;).click();
&lt;/script&gt;

&lt;body&gt;
&lt;div class=&quot;app&quot;&gt;
  &lt;h1&gt;합성곱 연산 — 커널 · 패딩 · 스트라이드&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;커널(필터)을 입력 위에 올려놓고 &lt;b style=&quot;color:var(--amber)&quot;&gt;같은 자리끼리 곱해서 모두 더한 값&lt;/b&gt; 하나를 출력 칸에 씁니다. 그다음 stride 만큼 옮겨 반복합니다. 딥러닝의 &quot;합성곱&quot; 은 실제로는 커널을 뒤집지 않는 &lt;b&gt;cross-correlation&lt;/b&gt; 입니다: &lt;code&gt;out[i, j] = Σ_y Σ_x x[i·S + y, j·S + x] · K[y, x]&lt;/code&gt;. 패딩 P 는 가장자리에 0 을 두르는 것.&lt;/p&gt;
  &lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill amber&quot;&gt;OH = (H + 2P − FH) // S + 1&lt;/span&gt;&lt;span class=&quot;pill teal&quot;&gt;arange(16) ⊛ [[1, 0], [0, −1]] → 전부 −5&lt;/span&gt;&lt;span class=&quot;pill blue&quot;&gt;(28, 5, 1, 0) → 24 · (28, 3, 1, 1) → 28&lt;/span&gt;&lt;span class=&quot;pill purple&quot;&gt;(28, 3, 2, 1) → 14 · (224, 7, 2, 3) → 112&lt;/span&gt;&lt;span class=&quot;pill green&quot;&gt;(32, 5, 1, 2) → 32 · (7, 3, 2, 0) → 3&lt;/span&gt;&lt;span class=&quot;pill red&quot;&gt;Sobel 가로 [[−1,−2,−1],[0,0,0],[1,2,1]]&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;grid&quot;&gt;

        cell:(r,c)=&gt;{const kk=r*o+c;if(!done(kk))return null;if(!DAT)return &#x27;rgba(45,212,191,0.45)&#x27;;const v=DAT.out[k][kk];return v&gt;0?`rgba(245,185,66,${Math.min(0.9,0.25+v*0.1)})`:v&lt;0?`rgba(96,165,250,${Math.min(0.9,0.25-v*0.1)})`:&#x27;rgba(45,212,191,0.15)&#x27;;},
        tint:big?&#x27;rgba(45,212,191,0.25)&#x27;:null,mark:cur&amp;&amp;stage&gt;=2&amp;&amp;stage&lt;=4?{r:i,c:j}:null};});

}
function shapes(){const o=OH(),par=FN*C*F*F+FN,mac=FN*o*o*C*F*F;
  $(&#x27;#kv&#x27;).innerHTML=`&lt;span&gt;x&lt;/span&gt;&lt;b class=&quot;shape&quot; style=&quot;color:var(--teal)&quot;&gt;(N, C, H, W) = (${N}, ${C}, ${H}, ${H})&lt;/b&gt;&lt;span&gt;W&lt;/span&gt;&lt;b class=&quot;shape&quot; style=&quot;color:var(--amber)&quot;&gt;(FN, C, FH, FW) = (${FN}, ${C}, ${F}, ${F})&lt;/b&gt;&lt;span&gt;b&lt;/span&gt;&lt;b class=&quot;shape&quot; style=&quot;color:var(--purple)&quot;&gt;(FN,) = (${FN},)&lt;/b&gt;&lt;span&gt;OH = OW&lt;/span&gt;&lt;b&gt;(${H} + 2·${P} − ${F}) // ${S} + 1 = ${o}&lt;/b&gt;&lt;span&gt;out&lt;/span&gt;&lt;b class=&quot;shape&quot; style=&quot;color:var(--green)&quot;&gt;(N, FN, OH, OW) = (${N}, ${FN}, ${o}, ${o})&lt;/b&gt;&lt;span&gt;파라미터&lt;/span&gt;&lt;b style=&quot;color:var(--amber)&quot;&gt;${FN}·${C}·${F}·${F} + ${FN} = ${fmtI(par)}&lt;/b&gt;&lt;span&gt;MAC (이미지 1장)&lt;/span&gt;&lt;b&gt;${FN}·${o}·${o}·${C}·${F}·${F} = ${fmtI(Math.max(0,mac))}&lt;/b&gt;&lt;span&gt;출력 값 수 (N 장)&lt;/span&gt;&lt;b&gt;${fmtI(N*FN*Math.max(0,o)*Math.max(0,o))}&lt;/b&gt;`;

  const f=stage&gt;=4?Math.min(ff,FN-1):0,i=Math.floor(pos/o),j=pos%o;let rows=&#x27;&#x27;,tot=DAT.b[f];

  rows+=`&lt;tr&gt;&lt;td style=&quot;color:var(--purple)&quot;&gt;편향&lt;/td&gt;&lt;td&gt;b[${f}]&lt;/td&gt;&lt;td&gt;${stage&gt;=2?DAT.b[f]:&#x27;·&#x27;}&lt;/td&gt;&lt;/tr&gt;&lt;tr class=&quot;cur&quot;&gt;&lt;td style=&quot;color:var(--teal)&quot;&gt;출력&lt;/td&gt;&lt;td&gt;out[n, ${f}, ${i}, ${j}]&lt;/td&gt;&lt;td&gt;&lt;b style=&quot;color:var(--teal)&quot;&gt;${fin?tot:&#x27;?&#x27;}&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;`;

function codeMain(){setCode(`&lt;span class=&quot;c&quot;&gt;# 2-3 conv_naive — x (N, C, H, W), W (FN, C, FH, FW), b (FN,)&lt;/span&gt;
def conv_naive(x, W, b, stride=1, pad=0):
    N, C, H, Wd = x.shape
    FN, _, FH, FW = W.shape                   &lt;span class=&quot;a&quot;&gt;# (${FN}, ${C}, ${F}, ${F})&lt;/span&gt;
    OH = (H + 2*pad - FH) // stride + 1         &lt;span class=&quot;a&quot;&gt;# ${OH()}&lt;/span&gt;
    OW = (Wd + 2*pad - FW) // stride + 1
    xp = np.pad(x, [(0,0), (0,0), (pad,pad), (pad,pad)])
    out = np.zeros((N, FN, OH, OW))             &lt;span class=&quot;g&quot;&gt;# (${N}, ${FN}, ${OH()}, ${OH()})&lt;/span&gt;
    for n in range(N):
        for f in range(FN):                     &lt;span class=&quot;c&quot;&gt;# 필터 1개 → 출력 채널 1장&lt;/span&gt;
            for i in range(OH):
                for j in range(OW):
                    win = xp[n, :, i*stride:i*stride+FH, j*stride:j*stride+FW]   &lt;span class=&quot;c&quot;&gt;# (C, FH, FW)&lt;/span&gt;
                    out[n, f, i, j] = np.sum(win * W[f]) + b[f]  &lt;span class=&quot;a&quot;&gt;# 채널까지 전부 합&lt;/span&gt;

function sync(){[[&#x27;C&#x27;,C],[&#x27;FN&#x27;,FN],[&#x27;F&#x27;,F],[&#x27;P&#x27;,P],[&#x27;S&#x27;,S],[&#x27;N&#x27;,N]].forEach(([k,v])=&gt;{$(&#x27;#s&#x27;+k).value=v;$(&#x27;#o&#x27;+k).textContent=v;});$(&#x27;#iH&#x27;).value=H;
  $$(&#x27;#stages button&#x27;).forEach((b,k)=&gt;b.classList.toggle(&#x27;active&#x27;,k===stage));}

  if(s===5){ff=FN;cc=C;pos=tot-1;render();}}

$$(&#x27;#stages button&#x27;).forEach((b,k)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;try{await goStage(k,300);}finally{busy=false;}});

const PR=[
 {n:&#x27;① 필터 1개 · 채널 3개&#x27;,ex:&#x27;&lt;p&gt;RGB 처럼 채널이 3개인 7×7 입력 (빨강 · 초록 · 파랑 카드). 필터도 같은 수의 채널 (3, 3, 3) 을 가집니다. 한 위치에서: 채널 0 의 3×3 곱의 합 + 채널 1 의 합 + 채널 2 의 합 + &lt;b class=&quot;purple&quot;&gt;b&lt;/b&gt; = 출력 &lt;b&gt;한 칸&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;그래서 출력은 채널이 &lt;b class=&quot;teal&quot;&gt;1개&lt;/b&gt;입니다 — &quot;채널별로 따로&quot; 가 아니라 &quot;채널까지 전부 더함&quot;. 오른쪽 표에서 채널별 부분합을 확인하세요.&lt;/p&gt;&#x27;,

// 시드 고정 난수 (mulberry32) + 정규분포 (Box-Muller) — numpy default_rng 과는 다른 수열

// 공용 선 그래프: o={xr,yr,xlog,ylog,xt,yt,xf,yf,xl,yl,series:[{pts,c,w,dash,dot,alpha}],hl:[{y,c,t}],vb:[{x0,x1,c}],ml}

/* 격자 장면: items = [{id, lab, foot, R, C, cs(최대 칸 크기), col:(r,c)=&gt;css, txt:(r,c)=&gt;str|null, hl:[{r,c,h,w,c:color,lw,fill}], grid:bool} | {op:&#x27;×&#x27;, w}]

  &lt;span class=&quot;n&quot;&gt;im2col&lt;/span&gt;&lt;span&gt;&lt;div class=&quot;bar&quot; style=&quot;width:${Math.max(0.6,D.im2col_s/D.naive_s*100).toFixed(2)}%;background:#4ade80&quot;&gt;&lt;/div&gt;&lt;span class=&quot;v&quot;&gt;${D.im2col_s.toFixed(3)} s → &lt;b style=&quot;color:var(--green)&quot;&gt;약 ${Math.round(sp)}배&lt;/b&gt; 빠름&lt;/span&gt;&lt;/span&gt;`;}
function setStage(s,end){stage=s;k=end?nSteps()-1:-1;info();}
async function play(ms){k=-1;info();const n=nSteps();for(k=0;k&lt;n;k++){info();await sleep(ms);}k=n-1;info();}
$(&#x27;#stages&#x27;).innerHTML=STG.map(s=&gt;`&lt;button type=&quot;button&quot;&gt;${s}&lt;/button&gt;`).join(&#x27;&#x27;);
$$(&#x27;#stages button&#x27;).forEach((b,i)=&gt;b.onclick=()=&gt;{if(!busy)setStage(i,true);});
$$(&#x27;#segH button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(busy)return;H=+b.dataset.v;build();setStage(stage,true);});
$$(&#x27;#segC button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(busy)return;C=+b.dataset.v;build();setStage(stage,true);});
$(&#x27;#bPrev&#x27;).onclick=()=&gt;{if(busy)return;if(k&gt;-1)k--;info();};
$(&#x27;#bNext&#x27;).onclick=()=&gt;{if(busy)return;if(k&lt;nSteps()-1)k++;info();};
$(&#x27;#bEnd&#x27;).onclick=()=&gt;{if(busy)return;k=nSteps()-1;info();};
$(&#x27;#bPlay&#x27;).onclick=async()=&gt;{if(busy)return;busy=true;try{await play(450);setStatus(&#x27;ok&#x27;,STG[stage]+&#x27; 완료&#x27;);}finally{busy=false;}};
window.addEventListener(&#x27;resize&#x27;,()=&gt;draw());
window.__d4={};
function direct(){const o=[];for(let f=0;f&lt;FN;f++){let s=new Float32Array(R).fill(B[f]);for(let c=0;c&lt;C;c++){const r=conv2d(Float32Array.from(X[c]),H,H,Wt[f].slice(c*9,c*9+9),F,F,1,0,0);r.o.forEach((v,i)=&gt;s[i]+=v);}o.push(Array.from(s));}return o;}
const PR=[
 {n:&#x27;① 창 → 행 (im2col)&#x27;,ex:&#x27;&lt;p&gt;4×4 입력, 3×3 필터, stride 1 → 창이 2×2 = 4개. 창 하나의 9개 값을 왼쪽 위부터 읽어 &lt;b class=&quot;amber&quot;&gt;col 의 행 하나&lt;/b&gt;에 씁니다. 창들이 겹치므로 같은 픽셀(예: 가운데 5, 6, 9, 10)이 여러 행에 &lt;b&gt;복사&lt;/b&gt;됩니다 — 메모리를 더 쓰는 이유.&lt;/p&gt;&lt;p&gt;mynn.py 의 &lt;code&gt;im2col&lt;/code&gt; 은 창마다 for 를 도는 대신 (y, x) 오프셋 F×F 번만 돌며 슬라이싱으로 한꺼번에 복사합니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{H=4;C=1;build();stage=0;await play(700);window.__d4.col=[R,K,COL[0].join(&#x27;,&#x27;)];setStatus(&#x27;ok&#x27;,`col (${R}, ${K}): 첫 행 [${COL[0].join(&#x27;, &#x27;)}] · 입력 ${C*H*H}개 → col ${R*K}개 (${(R*K/(C*H*H)).toFixed(2)}배)`);}},
 {n:&#x27;② 2채널 · 5×5&#x27;,ex:&#x27;&lt;p&gt;채널이 2개면 행 하나에 &lt;b style=&quot;color:#f87171&quot;&gt;채널 0 의 9개&lt;/b&gt; + &lt;b style=&quot;color:#4ade80&quot;&gt;채널 1 의 9개&lt;/b&gt; = C·FH·FW = 18개가 이어집니다. 5×5 입력이면 창 3×3 = 9개 → col (9, 18).&lt;/p&gt;&lt;p&gt;배치 N 장이면 행이 N·OH·OW 개로 늘어날 뿐 열 수는 같습니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{H=5;C=2;build();stage=0;await play(420);window.__d4.col2=[R,K];setStatus(&#x27;ok&#x27;,`x (1, 2, 5, 5) → col (${R}, ${K}) — 입력 50개 → ${R*K}개 (${(R*K/50).toFixed(2)}배)`);}},
 {n:&#x27;③ 행렬곱 → reshape&#x27;,ex:&#x27;&lt;p&gt;필터 W (FN, C, 3, 3) 를 &lt;code&gt;reshape(FN, −1).T&lt;/code&gt; 로 펴면 col_W (C·9, FN) — 필터 하나가 &lt;b&gt;열 하나&lt;/b&gt;. 그러면 &lt;code&gt;col @ col_W + b&lt;/code&gt; 의 (r, f) 칸 = 창 r 과 필터 f 의 원소별 곱의 합 = 합성곱 출력 한 칸.&lt;/p&gt;&lt;p&gt;결과 (N·OH·OW, FN) 은 &lt;code&gt;reshape(N, OH, OW, FN).transpose(0, 3, 1, 2)&lt;/code&gt; 로 (N, FN, OH, OW) 가 됩니다. 4중 for 루프 결과와 같은지 오른쪽 상태에서 확인.&lt;/p&gt;&#x27;,
  run:async()=&gt;{H=4;C=1;build();setStage(1);await play(500);await sleep(300);stage=2;await play(280);await sleep(300);stage=3;await play(700);
   const d=direct(),same=d.every((m,f)=&gt;m.every((v,i)=&gt;v===OUT2[i][f]));window.__d4.same=same;window.__d4.out=OUT2;
   setStatus(same?&#x27;ok&#x27;:&#x27;warn&#x27;,`col @ col_W + b = 4중 for 결과와 ${same?&#x27;동일 (allclose)&#x27;:&#x27;다름!&#x27;} — out[0, 0] = [${d[0].join(&#x27;, &#x27;)}], out[0, 1] = [${d[1].join(&#x27;, &#x27;)}]`);}},
 {n:&#x27;④ col2im — 겹치면 더한다&#x27;,ex:&#x27;&lt;p&gt;역전파: Convolution 은 Affine 과 같은 행렬곱이므로 &lt;code&gt;dcol = dout @ col_W.T&lt;/code&gt;, &lt;code&gt;dW = col.T @ dout&lt;/code&gt;. 그런데 dcol 의 행 하나는 &lt;b&gt;입력의 창 하나&lt;/b&gt;에 해당하므로 제자리로 돌려놓아야 합니다 — col2im.&lt;/p&gt;&lt;p&gt;한 픽셀이 여러 창에 들어갔다면(겹침) 그 픽셀은 출력 여러 칸에 영향을 준 것이므로 기울기를 &lt;b class=&quot;purple&quot;&gt;모두 더합니다&lt;/b&gt; (연쇄법칙의 분기 = 합). dcol 을 전부 1 로 두면 결과가 곧 &quot;몇 번 겹쳤는가&quot; 입니다: 4×4·3×3 이면 가운데 2×2 가 4, 모서리가 1.&lt;/p&gt;&#x27;,
  run:async()=&gt;{H=4;C=1;build();stage=4;await play(800);window.__d4.cnt=DX[0].slice();setStatus(&#x27;ok&#x27;,`col2im(ones) = [${DX[0].join(&#x27;, &#x27;)}] — 가운데 4칸은 4번 겹침`);await sleep(600);
   H=5;build();stage=4;await play(380);window.__d4.cnt5=DX[0].slice();setStatus(&#x27;ok&#x27;,`5×5: 가운데 칸은 ${Math.max(...DX[0])}번 겹침 (창 9개 모두에 포함) · 모서리 1번`);}},
 {n:&#x27;⑤ 메모리 · 속도 (MNIST)&#x27;,ex:&#x27;&lt;p&gt;MNIST 배치 100 장 (100, 1, 28, 28), 5×5 필터 30개: col = (100·24·24, 1·5·5) = &lt;b class=&quot;amber&quot;&gt;(57,600, 25)&lt;/b&gt; = 1,440,000 값 — 입력 78,400 의 &lt;b class=&quot;red&quot;&gt;18.4배&lt;/b&gt;. 픽셀 대부분이 25개 창에 겹쳐 들어가기 때문 (최대 F·F = 25배).&lt;/p&gt;&lt;p&gt;속도: 4중 for (Python 루프 100·30·24·24 = 1,728,000 번) &lt;b&gt;6.9 초&lt;/b&gt; vs im2col + 행렬곱 &lt;b class=&quot;green&quot;&gt;0.039 초&lt;/b&gt; → 약 &lt;b class=&quot;green&quot;&gt;177배&lt;/b&gt; (서버 기준; Colab 에서도 백 배 이상). 메모리를 써서 시간을 산 것 — PyTorch 등도 비슷한 방식(+ 최적화)을 씁니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{bars();const s=window.__d4.stats;$(&#x27;#bars&#x27;).style.opacity=0.3;await sleep(300);$(&#x27;#bars&#x27;).style.opacity=1;
   setStatus(&#x27;ok&#x27;,`col (57,600, 25) = ${fmtI(s.col)} 값 = 입력의 ${s.ratio.toFixed(1)}배 · ${D.naive_s.toFixed(1)} s vs ${D.im2col_s.toFixed(3)} s → 약 ${Math.round(s.speed)}배`);}},
];
initPresets(PR);
build();bars();setStage(0);

&lt;div class=&quot;app&quot;&gt;
  &lt;h1&gt;Max Pooling — 2×2 창의 최댓값&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;Pooling(2, 2, stride 2) 은 겹치지 않는 2×2 창마다 &lt;b style=&quot;color:var(--amber)&quot;&gt;최댓값 하나&lt;/b&gt;만 남깁니다 → 높이 · 너비 절반. 학습할 &lt;b&gt;파라미터가 없고&lt;/b&gt; 채널마다 따로 계산합니다. 역전파는 ReLU 의 mask 처럼, forward 때 기억한 &lt;b style=&quot;color:var(--purple)&quot;&gt;arg_max 자리로만&lt;/b&gt; dout 을 보내고 나머지는 0. 입력 칸의 숫자를 직접 고쳐 보세요.&lt;/p&gt;

  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2 id=&quot;stageTitle&quot;&gt;forward&lt;/h2&gt;
      &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;lab&quot;&gt;입력 x (채널 1개) — 값 편집&lt;/span&gt;&lt;div class=&quot;seg&quot; id=&quot;segN&quot;&gt;&lt;button type=&quot;button&quot; data-v=&quot;4&quot;&gt;4×4&lt;/button&gt;&lt;button type=&quot;button&quot; data-v=&quot;6&quot;&gt;6×6&lt;/button&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; id=&quot;bRand&quot;&gt;무작위&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;bShift&quot;&gt;→ 오른쪽 1칸 이동&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;scroll&quot;&gt;&lt;div class=&quot;ed&quot; id=&quot;ed&quot;&gt;&lt;/div&gt;&lt;/div&gt;

      &lt;div class=&quot;row ctl&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;run&quot; id=&quot;bFwd&quot;&gt;▶ forward&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;run&quot; id=&quot;bBwd&quot;&gt;◀ backward&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;bAll&quot;&gt;한 번에&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div&gt;

const SNIP={&quot;conv_output_size&quot;: &quot;def conv_output_size(input_size, filter_size, stride=1, pad=0):\n    return (input_size + 2 * pad - filter_size) // stride + 1&quot;, &quot;im2col&quot;: &quot;def im2col(x, FH, FW, stride=1, pad=0):\n    \&quot;\&quot;\&quot;(N, C, H, W) → (N·OH·OW, C·FH·FW): 필터가 닿는 영역 하나를 행 하나로 펼친다\&quot;\&quot;\&quot;\n    N, C, H, W = x.shape\n    OH, OW = conv_output_size(H, FH, stride, pad), conv_output_size(W, FW, stride, pad)\n    img = np.pad(x, [(0, 0), (0, 0), (pad, pad), (pad, pad)])\n    col = np.zeros((N, C, FH, FW, OH, OW))\n    for y in range(FH):\n        y_max = y + stride * OH\n        for x_ in range(FW):\n            x_max = x_ + stride * OW\n            col[:, :, y, x_, :, :] = img[:, :, y:y_max:stride, x_:x_max:stride]\n    return col.transpose(0, 4, 5, 1, 2, 3).reshape(N * OH * OW, -1)&quot;, &quot;col2im&quot;: &quot;def col2im(col, input_shape, FH, FW, stride=1, pad=0):\n    \&quot;\&quot;\&quot;im2col 의 반대 — 겹치는 자리는 더한다 (역전파용)\&quot;\&quot;\&quot;\n    N, C, H, W = input_shape\n    OH, OW = conv_output_size(H, FH, stride, pad), conv_output_size(W, FW, stride, pad)\n    col = col.reshape(N, OH, OW, C, FH, FW).transpose(0, 3, 4, 5, 1, 2)\n    img = np.zeros((N, C, H + 2 * pad + stride - 1, W + 2 * pad + stride - 1))\n    for y in range(FH):\n        y_max = y + stride * OH\n        for x_ in range(FW):\n            x_max = x_ + stride * OW\n            img[:, :, y:y_max:stride, x_:x_max:stride] += col[:, :, y, x_, :, :]\n    return img[:, :, pad:H + pad, pad:W + pad]&quot;, &quot;conv_forward&quot;: &quot;def forward(self, x, train_flg=True):\n    FN, C, FH, FW = self.params[\&quot;W\&quot;].shape\n    N, _, H, W = x.shape\n    OH, OW = conv_output_size(H, FH, self.stride, self.pad), conv_output_size(W, FW, self.stride, self.pad)\n    self.x_shape = x.shape\n    self.col = im2col(x, FH, FW, self.stride, self.pad)          # (N·OH·OW, C·FH·FW)\n    self.col_W = self.params[\&quot;W\&quot;].reshape(FN, -1).T               # (C·FH·FW, FN)\n    out = self.col @ self.col_W + self.params[\&quot;b\&quot;]                # (N·OH·OW, FN) — Affine 과 같은 행렬곱\n    return out.reshape(N, OH, OW, FN).transpose(0, 3, 1, 2)      # (N, FN, OH, OW)&quot;, &quot;conv_backward&quot;: &quot;def backward(self, dout):\n    FN, C, FH, FW = self.params[\&quot;W\&quot;].shape\n    dout = dout.transpose(0, 2, 3, 1).reshape(-1, FN)            # (N·OH·OW, FN)\n    self.grads[\&quot;b\&quot;] = dout.sum(axis=0)\n    self.grads[\&quot;W\&quot;] = (self.col.T @ dout).T.reshape(FN, C, FH, FW)\n    dcol = dout @ self.col_W.T                                    # Affine 의 dX 와 같은 식\n    return col2im(dcol, self.x_shape, FH, FW, self.stride, self.pad)&quot;, &quot;pool_forward&quot;: &quot;def forward(self, x, train_flg=True):\n    N, C, H, W = x.shape\n    OH = conv_output_size(H, self.pool_h, self.stride, self.pad)\n    OW = conv_output_size(W, self.pool_w, self.stride, self.pad)\n    self.x_shape = x.shape\n    col = im2col(x, self.pool_h, self.pool_w, self.stride, self.pad).reshape(-1, self.pool_h * self.pool_w)\n    self.arg_max = col.argmax(axis=1)                             # 역전파 때 기울기를 보낼 자리\n    out = col[np.arange(col.shape[0]), self.arg_max]              # = col.max(axis=1)\n    return out.reshape(N, OH, OW, C).transpose(0, 3, 1, 2)&quot;, &quot;pool_backward&quot;: &quot;def backward(self, dout):\n    dout = dout.transpose(0, 2, 3, 1)\n    pool_size = self.pool_h * self.pool_w\n    dmax = np.zeros((dout.size, pool_size))\n    dmax[np.arange(self.arg_max.size), self.arg_max] = dout.ravel()   # 최댓값 자리에만\n    dcol = dmax.reshape(dout.shape[0] * dout.shape[1] * dout.shape[2], -1)\n    return col2im(dcol, self.x_shape, self.pool_h, self.pool_w, self.stride, self.pad)&quot;};

function accumulate(src,bx,by,s,ox,oy){const out=new Float32Array(784);for(let y=0;y&lt;280;y++)for(let x=0;x&lt;280;x++){const v=src[(y*280+x)*4]/255;if(!v)continue;
    const tx=Math.floor(ox+(x-bx+0.5)*s),ty=Math.floor(oy+(y-by+0.5)*s);if(tx&lt;0||ty&lt;0||tx&gt;27||ty&gt;27)continue;out[ty*28+tx]+=v*s*s;}
  for(let i=0;i&lt;784;i++)out[i]=Math.min(1,out[i]);return out;}

  for(let y=0;y&lt;280;y++)for(let x=0;x&lt;280;x++)if(d[(y*280+x)*4]&gt;20){if(x&lt;x0)x0=x;if(x&gt;x1)x1=x;if(y&lt;y0)y0=y;if(y&gt;y1)y1=y;}

const PR=[
 {n:&#x27;① 단계별 순전파&#x27;,ex:&#x27;&lt;p&gt;test[0] (정답 7) 이 층을 지날 때마다 shape 이 바뀝니다: &lt;code&gt;(1, 1, 28, 28)&lt;/code&gt; → Conv+ReLU &lt;code&gt;(1, 30, 24, 24)&lt;/code&gt; → Pool &lt;code&gt;(1, 30, 12, 12)&lt;/code&gt; → 펼침 4320 → Affine+ReLU &lt;code&gt;(1, 100)&lt;/code&gt; → Affine &lt;code&gt;(1, 10)&lt;/code&gt; → softmax.&lt;/p&gt;&lt;p&gt;특징 맵 30장은 같은 숫자를 30개 필터로 각각 본 결과입니다. 밝은 곳 = 필터 패턴과 잘 맞는 곳. 풀링 후에도 모양은 대략 남고 크기만 1/4.&lt;/p&gt;&#x27;,

 {n:&#x27;② 파라미터 433,890 · 학습&#x27;,ex:&#x27;&lt;p&gt;파라미터: conv 30·1·5·5 + 30 = &lt;b&gt;780&lt;/b&gt;, affine1 4320·100 + 100 = &lt;b class=&quot;red&quot;&gt;432,100&lt;/b&gt; (전체의 99.6%), affine2 100·10 + 10 = &lt;b&gt;1,010&lt;/b&gt; → 합계 &lt;b class=&quot;amber&quot;&gt;433,890&lt;/b&gt;. 학습 전 손실 2.704 (He 초기화라 ln 10 = 2.303 보다 조금 큼).&lt;/p&gt;&lt;p&gt;Adam(0.001), batch 100, 전체 60,000장 &lt;b&gt;1 epoch&lt;/b&gt; (600 iteration) 만에 train &lt;b class=&quot;green&quot;&gt;0.9825&lt;/b&gt;, test &lt;b class=&quot;green&quot;&gt;0.9810&lt;/b&gt; — Day 4 MLP 5 epoch (0.9757) 보다 높습니다. 서버 약 135 초, Colab 2~4 분 (대부분은 train 6만 장 정확도 평가).&lt;/p&gt;&#x27;,

&lt;script&gt;
const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,ms));
let busy=false, timer=null;
function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}
function setCode(h){$(&#x27;#code&#x27;).innerHTML=h;}
function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const g=c.getContext(&#x27;2d&#x27;);g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}
function show(id,title){$$(&#x27;.view&#x27;).forEach(v=&gt;v.classList.toggle(&#x27;on&#x27;,v.id===id));if(title&amp;&amp;$(&#x27;#stageTitle&#x27;))$(&#x27;#stageTitle&#x27;).textContent=title;}
function initPresets(P,stop){$(&#x27;#presets&#x27;).innerHTML=P.map(p=&gt;`&lt;button type=&quot;button&quot;&gt;${p.n}&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}
const sigm=z=&gt;1/(1+Math.exp(-z));
const fe=(v,d=4)=&gt;{if(Number.isNaN(v))return &#x27;nan&#x27;;if(!isFinite(v))return v&gt;0?&#x27;inf&#x27;:&#x27;-inf&#x27;;const a=Math.abs(v);return a!==0&amp;&amp;(a&gt;=1e5||a&lt;1e-3)?v.toExponential(2):v.toFixed(d);};
const f3=v=&gt;(Math.abs(v)&lt;5e-4?0:v).toFixed(3), f4=v=&gt;(Math.abs(v)&lt;5e-5?0:v).toFixed(4);
const esc=s=&gt;String(s).replace(/&amp;/g,&#x27;&amp;amp;&#x27;).replace(/&lt;/g,&#x27;&amp;lt;&#x27;).replace(/&gt;/g,&#x27;&amp;gt;&#x27;);
// 시드 고정 난수 (mulberry32) + 정규분포 (Box-Muller) — numpy default_rng 과는 다른 수열
function makeRng(seed){let a=seed&gt;&gt;&gt;0;const u=()=&gt;{a=(a+0x6D2B79F5)&gt;&gt;&gt;0;let t=a;t=Math.imul(t^(t&gt;&gt;&gt;15),t|1);t^=t+Math.imul(t^(t&gt;&gt;&gt;7),t|61);return((t^(t&gt;&gt;&gt;14))&gt;&gt;&gt;0)/4294967296;};
  let sp=null;const n=()=&gt;{if(sp!==null){const v=sp;sp=null;return v;}let x,y,r;do{x=u()*2-1;y=u()*2-1;r=x*x+y*y;}while(r&gt;=1||r===0);const m=Math.sqrt(-2*Math.log(r)/r);sp=y*m;return x*m;};return {u,n};}
// 공용 선 그래프: o={xr,yr,xlog,ylog,xt,yt,xf,yf,xl,yl,series:[{pts,c,w,dash,dot,alpha}],hl:[{y,c,t}],vb:[{x0,x1,c}],ml}
function chart(cv,o){
  const [g,W,H]=fitCanvas(cv);g.clearRect(0,0,W,H);
  const ml=o.ml??46,mr=o.mr??12,mt=o.mt??10,mb=o.xl?36:24;
  const tx=v=&gt;o.xlog?Math.log10(v):v,ty=v=&gt;o.ylog?Math.log10(Math.max(v,1e-300)):v;
  const X=v=&gt;ml+(tx(v)-tx(o.xr[0]))/(tx(o.xr[1])-tx(o.xr[0]))*(W-ml-mr);
  const Y=v=&gt;mt+(1-(ty(v)-ty(o.yr[0]))/(ty(o.yr[1])-ty(o.yr[0])))*(H-mt-mb);
  g.font=&#x27;11px Consolas,monospace&#x27;;g.lineWidth=1;
  (o.vb||[]).forEach(b=&gt;{g.fillStyle=b.c;g.fillRect(X(b.x0),mt,X(b.x1)-X(b.x0),H-mt-mb);});
  (o.yt||[]).forEach(v=&gt;{const y=Y(v);g.strokeStyle=&#x27;#1a2540&#x27;;g.beginPath();g.moveTo(ml,y);g.lineTo(W-mr,y);g.stroke();g.fillStyle=&#x27;#5d7292&#x27;;g.textAlign=&#x27;right&#x27;;g.fillText(o.yf?o.yf(v):v,ml-5,y+4);});
  (o.xt||[]).forEach(v=&gt;{const x=X(v);g.strokeStyle=&#x27;#1a2540&#x27;;g.beginPath();g.moveTo(x,mt);g.lineTo(x,H-mb);g.stroke();g.fillStyle=&#x27;#5d7292&#x27;;g.textAlign=&#x27;center&#x27;;g.fillText(o.xf?o.xf(v):v,x,H-mb+14);});
  g.textAlign=&#x27;left&#x27;;
  if(o.xl){g.fillStyle=&#x27;#8a9bb8&#x27;;g.textAlign=&#x27;right&#x27;;g.fillText(o.xl,W-mr,H-4);g.textAlign=&#x27;left&#x27;;}
  if(o.yl){g.fillStyle=&#x27;#8a9bb8&#x27;;g.fillText(o.yl,ml+4,mt+11);}
  g.save();g.beginPath();g.rect(ml,mt-2,W-ml-mr,H-mt-mb+4);g.clip();
  (o.hl||[]).forEach(h=&gt;{g.strokeStyle=h.c;g.setLineDash([5,4]);g.beginPath();g.moveTo(ml,Y(h.y));g.lineTo(W-mr,Y(h.y));g.stroke();g.setLineDash([]);if(h.t){g.fillStyle=h.c;g.fillText(h.t,ml+6,Y(h.y)-4);}});
  (o.series||[]).forEach(s=&gt;{if(!s.pts.length)return;g.globalAlpha=s.alpha??1;g.strokeStyle=s.c;g.fillStyle=s.c;g.lineWidth=s.w||2;g.setLineDash(s.dash||[]);
    if(!s.only){g.beginPath();s.pts.forEach(([x,y],i)=&gt;{const px=X(x),py=Y(y);i?g.lineTo(px,py):g.moveTo(px,py);});g.stroke();}
    g.setLineDash([]);if(s.dot)s.pts.forEach(([x,y])=&gt;{g.beginPath();g.arc(X(x),Y(y),s.dot,0,7);g.fill();});g.globalAlpha=1;});
  g.restore();g.lineWidth=1;
  return {g,W,H,X,Y,ml,mr,mt,mb};
}
function arrow(g,x0,y0,x1,y1,c,w=2,hs=8){const a=Math.atan2(y1-y0,x1-x0),L=Math.hypot(x1-x0,y1-y0);if(L&lt;1)return;hs=Math.min(hs,L*0.6);g.strokeStyle=c;g.fillStyle=c;g.lineWidth=w;g.beginPath();g.moveTo(x0,y0);g.lineTo(x1-Math.cos(a)*hs*0.7,y1-Math.sin(a)*hs*0.7);g.stroke();
  g.beginPath();g.moveTo(x1,y1);g.lineTo(x1-hs*Math.cos(a-0.4),y1-hs*Math.sin(a-0.4));g.lineTo(x1-hs*Math.cos(a+0.4),y1-hs*Math.sin(a+0.4));g.closePath();g.fill();g.lineWidth=1;}
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
// ---- Day 5 공용: base64 · 색 · 격자 장면(scene) 그리기 · 합성곱 ----
function b64u8(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i&lt;b.length;i++)u[i]=b.charCodeAt(i);return u;}
const digitOf=s=&gt;Float32Array.from(b64u8(s),v=&gt;v/255);
const fmtI=n=&gt;Math.round(n).toLocaleString(&#x27;en-US&#x27;);
const gray=v=&gt;{const c=Math.round(Math.max(0,Math.min(1,v))*255);return `rgb(${c},${c},${c})`;};
// 부호 있는 값: 음수 파랑 · 양수 주황 (m = 최대 절댓값)
const divc=(v,m)=&gt;{const t=Math.max(-1,Math.min(1,m?v/m:0));return t&gt;=0?`rgba(245,185,66,${0.08+0.92*t})`:`rgba(96,165,250,${0.08+0.92*-t})`;};
// 0 이상 값: 검정 → 청록 → 흰색
const heat=(v,m)=&gt;{const t=Math.max(0,Math.min(1,m?v/m:0));if(t&lt;0.6){const k=t/0.6;return `rgb(${Math.round(10+35*k)},${Math.round(15+197*k)},${Math.round(28+163*k)})`;}const k=(t-0.6)/0.4;return `rgb(${Math.round(45+210*k)},${Math.round(212+43*k)},${Math.round(191+64*k)})`;};
const maxAbs=a=&gt;{let m=0;for(const v of a)if(Math.abs(v)&gt;m)m=Math.abs(v);return m;};
const numTxt=v=&gt;{if(v==null)return &#x27;&#x27;;if(Number.isInteger(v))return String(v);const a=Math.abs(v);return a&gt;=100?v.toFixed(0):a&gt;=10?v.toFixed(1):v.toFixed(2);};
/* 격자 장면: items = [{id, lab, foot, R, C, cs(최대 칸 크기), col:(r,c)=&gt;css, txt:(r,c)=&gt;str|null, hl:[{r,c,h,w,c:color,lw,fill}], grid:bool} | {op:&#x27;×&#x27;, w}]
   폭에 맞춰 왼→오 배치, 넘치면 줄 바꿈. 반환: {pos:{id:{x,y,cs,R,C}}, g, W, H} */
function scene(cv,items,o={}){
  const W=cv.getBoundingClientRect().width||320,gap=o.gap??14,lh=18;
  const opW=b=&gt;b.w||(b.op.length&gt;2?b.op.length*7+8:22);
  const L=items.map((b,i)=&gt;{if(b.op!=null)return {b,w:opW(b),h:0,op:1};
    const pre=i&gt;0&amp;&amp;items[i-1].op!=null?opW(items[i-1])+gap:0;
    const lim=Math.min(b.cs||30,(W-4-pre)/b.C,o.maxH?o.maxH/b.R:1e9);const cs=b.int===false?lim:Math.max(1,Math.floor(lim*4)/4);
    return {b,cs,w:cs*b.C,h:cs*b.R+lh+(b.foot?17:0)};});
  const U=[];L.forEach(it=&gt;{const last=U[U.length-1];if(last&amp;&amp;last.length===1&amp;&amp;last[0].op)last.push(it);else U.push([it]);});   // 연산자는 다음 블록과 한 덩어리
  const rows=[[]];let rw=0;
  U.forEach(u=&gt;{const uw=u.reduce((s,it,i)=&gt;s+it.w+(i?gap:0),0),r=rows[rows.length-1],add=(r.length?gap:0)+uw;if(r.length&amp;&amp;rw+add&gt;W){rows.push([...u]);rw=uw;}else{r.push(...u);rw+=add;}});
  let y=4;const pos={},place=[];
  rows.forEach(r=&gt;{if(!r.length)return;
    const tw=r.reduce((s,it,i)=&gt;s+it.w+(i?gap:0),0),rh=Math.max(...r.map(it=&gt;it.h),20);let x=o.left?2:Math.max(2,(W-tw)/2);
    r.forEach(it=&gt;{place.push({it,x,y,rh});if(!it.op)pos[it.b.id||it.b.lab]={x,y:y+lh,cs:it.cs,R:it.b.R,C:it.b.C};x+=it.w+gap;});y+=rh+(o.rowGap??12);});
  const H=Math.ceil(y);cv.style.height=H+&#x27;px&#x27;;const [g]=fitCanvas(cv);g.clearRect(0,0,W,H);
  place.forEach(({it,x,y,rh})=&gt;{const b=it.b;
    if(it.op){g.fillStyle=b.c||&#x27;#8a9bb8&#x27;;g.font=&#x27;bold 15px Consolas,monospace&#x27;;g.textAlign=&#x27;center&#x27;;g.fillText(b.op,x+it.w/2,y+lh+(rh-lh-(b.foot?17:0))/2+5);g.textAlign=&#x27;left&#x27;;return;}
    const cs=it.cs,y0=y+lh;g.font=&#x27;12px Consolas,monospace&#x27;;g.fillStyle=b.labc||&#x27;#8a9bb8&#x27;;g.textAlign=&#x27;left&#x27;;
    let lab=b.lab||&#x27;&#x27;;const lw=Math.max(it.w,60)+gap;if(g.measureText(lab).width&gt;lw){while(lab.length&gt;3&amp;&amp;g.measureText(lab+&#x27;…&#x27;).width&gt;lw)lab=lab.slice(0,-1);lab+=&#x27;…&#x27;;}g.fillText(lab,x,y+13);
    for(let r=0;r&lt;b.R;r++)for(let c=0;c&lt;b.C;c++){g.fillStyle=b.col?b.col(r,c):&#x27;#0e1628&#x27;;g.fillRect(x+c*cs,y0+r*cs,cs+(cs&lt;6?0.6:0),cs+(cs&lt;6?0.6:0));}
    if(b.grid!==false&amp;&amp;cs&gt;=7){g.strokeStyle=b.gc||&#x27;#22314f&#x27;;g.lineWidth=1;g.beginPath();for(let r=0;r&lt;=b.R;r++){g.moveTo(x,y0+r*cs+0.5);g.lineTo(x+b.C*cs,y0+r*cs+0.5);}for(let c=0;c&lt;=b.C;c++){g.moveTo(x+c*cs+0.5,y0);g.lineTo(x+c*cs+0.5,y0+b.R*cs);}g.stroke();}
    else{g.strokeStyle=&#x27;#2a3a5c&#x27;;g.strokeRect(x+0.5,y0+0.5,b.C*cs-1,b.R*cs-1);}

 {n:&#x27;① 학습 전 · 후 · 변화&#x27;,ex:&#x27;&lt;p&gt;왼쪽(학습 전)과 가운데(1 epoch 후)는 거의 같아 보입니다 — 실제로 필터별 상관이 &lt;b class=&quot;amber&quot;&gt;0.86 ~ 0.999&lt;/b&gt;, 전체 변화량은 처음 크기의 &lt;b class=&quot;red&quot;&gt;28%&lt;/b&gt; (|ΔW| / |W0| = 0.28) 뿐입니다. &quot;학습하면 1층이 깔끔한 에지 검출기가 된다&quot; 는 그림은 1 epoch 에서는 &lt;b&gt;나오지 않습니다&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;오른쪽 ΔW 는 자체 눈금으로 확대해 그렸습니다. 같은 seed 로 Convolution(1, 30, 5, seed=1) 을 다시 만들면 학습 전 W0 를 그대로 얻을 수 있습니다 (노트북 6-1).&lt;/p&gt;&#x27;,

 {n:&#x27;④ 이동 강건성 0~3 px&#x27;,ex:&#x27;&lt;p&gt;test 전체를 오른쪽으로 1 · 2 · 3 픽셀 밀면(&lt;code&gt;np.roll(x, s, axis=3)&lt;/code&gt;): CNN &lt;b class=&quot;teal&quot;&gt;0.9734 / 0.9119 / 0.7484&lt;/b&gt;, Day 4 MLP &lt;b class=&quot;red&quot;&gt;0.9551 / 0.7975 / 0.5619&lt;/b&gt;. 둘 다 떨어지지만 CNN 이 덜 떨어집니다.&lt;/p&gt;&lt;p&gt;이유: (1) &lt;b&gt;가중치 공유&lt;/b&gt; — 같은 필터를 모든 위치에 쓰므로 숫자가 밀리면 특징 맵도 같이 밀릴 뿐 (가운데 그림), (2) &lt;b&gt;풀링&lt;/b&gt; — 2×2 안의 작은 이동은 흡수 (D5-5). 다만 Affine 층은 위치마다 다른 가중치라 완전히 불변은 아닙니다. 오른쪽 예측은 이 숫자들에 대한 실제 모델 출력(사전 계산)입니다 — 숫자마다 결과가 다르고(test[2] 의 1 은 2px 부터 둘 다 틀림), 전체 경향은 그래프의 10,000장 정확도로 봅니다.&lt;/p&gt;&#x27;,

 {n:&#x27;⑤ MLP 와 비교&#x27;,ex:&#x27;&lt;p&gt;Day 3 MLP &lt;b&gt;79,510&lt;/b&gt; 파라미터 · 10 epoch → 0.9694, Day 4 MLP &lt;b&gt;110,610&lt;/b&gt; · 5 epoch → 0.9757, CNN &lt;b&gt;433,890&lt;/b&gt; · &lt;b&gt;1 epoch&lt;/b&gt; → &lt;b class=&quot;green&quot;&gt;0.9810&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;CNN 이 파라미터는 더 많지만 그중 99.8% 가 Affine 에 있고, Conv 는 780개뿐입니다. 적은 epoch 로 더 높은 정확도 + 이동에 더 강함 — 공간 구조를 쓰는 덕분입니다. 비용(연산량)은 D5-8 에서.&lt;/p&gt;&#x27;,

&lt;body&gt;
&lt;div class=&quot;app&quot;&gt;
  &lt;h1&gt;모델 비용 계산기 — 파라미터 · MAC · 메모리&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;온디바이스 AI 에서는 정확도만큼 &lt;b style=&quot;color:var(--amber)&quot;&gt;비용&lt;/b&gt;이 중요합니다. 층을 쌓으면 층마다 출력 shape, 파라미터 수, &lt;b&gt;MAC&lt;/b&gt; (multiply-accumulate, 곱셈-덧셈 한 쌍), 출력 값(활성화) 수를 계산합니다. Conv MAC = &lt;code&gt;FN·OH·OW·C·FH·FW&lt;/code&gt;, Affine MAC = &lt;code&gt;in·out&lt;/code&gt;. 값을 바꾸거나 층을 추가 · 삭제해 보세요.&lt;/p&gt;
  &lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill amber&quot;&gt;SimpleConvNet 433,890 params · 865,000 MAC&lt;/span&gt;&lt;span class=&quot;pill green&quot;&gt;경량 CNN 20,490 · 1,031,744&lt;/span&gt;&lt;span class=&quot;pill red&quot;&gt;224×224×3 · 3×3×64: 1,792 params · 86,704,128 MAC&lt;/span&gt;&lt;span class=&quot;pill purple&quot;&gt;float32 1.74 MB · int8 0.43 MB&lt;/span&gt;&lt;span class=&quot;pill teal&quot;&gt;파라미터는 Affine 에, 연산은 Conv 에&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;grid&quot;&gt;
    &lt;div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;층 쌓기 (노트북 7-1 conv_cost · 7-2 affine_cost)&lt;/h2&gt;
        &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;lab&quot;&gt;입력 (C, H, W)&lt;/span&gt;&lt;input type=&quot;number&quot; class=&quot;num&quot; id=&quot;iC&quot; min=&quot;1&quot; value=&quot;1&quot; aria-label=&quot;C&quot;&gt;&lt;input type=&quot;number&quot; class=&quot;num&quot; id=&quot;iH&quot; min=&quot;1&quot; value=&quot;28&quot; aria-label=&quot;H&quot;&gt;&lt;input type=&quot;number&quot; class=&quot;num&quot; id=&quot;iW&quot; min=&quot;1&quot; value=&quot;28&quot; aria-label=&quot;W&quot;&gt;&lt;/div&gt;
        &lt;div id=&quot;layers&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;row&quot;&gt;&lt;button type=&quot;button&quot; data-add=&quot;conv&quot;&gt;+ Conv&lt;/button&gt;&lt;button type=&quot;button&quot; data-add=&quot;pool&quot;&gt;+ Pool&lt;/button&gt;&lt;button type=&quot;button&quot; data-add=&quot;affine&quot;&gt;+ Affine&lt;/button&gt;&lt;button type=&quot;button&quot; data-add=&quot;bn&quot;&gt;+ BatchNorm&lt;/button&gt;&lt;button type=&quot;button&quot; data-add=&quot;relu&quot;&gt;+ ReLU&lt;/button&gt;&lt;/div&gt;
        &lt;p class=&quot;note&quot;&gt;ReLU · Softmax 는 파라미터 0 · MAC 0 (프리셋에서는 생략). BatchNorm 은 γ, β 2·C 개, 연산은 MAC 에 넣지 않음. Affine 은 앞 출력을 펼쳐(flatten) 받습니다.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;층별 비용표 (노트북 7-3)&lt;/h2&gt;&lt;div class=&quot;scroll&quot;&gt;&lt;table class=&quot;tt&quot; id=&quot;tbl&quot;&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;합계 · 메모리&lt;/h2&gt;&lt;div class=&quot;kv&quot; id=&quot;kv&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;층별 막대&lt;/h2&gt;&lt;div class=&quot;cap&quot; id=&quot;cap&quot;&gt;파라미터는 Affine 에, 연산은 Conv 에&lt;/div&gt;
        &lt;div class=&quot;lab&quot;&gt;파라미터&lt;/div&gt;&lt;canvas id=&quot;cP&quot;&gt;&lt;/canvas&gt;
        &lt;div class=&quot;lab&quot; style=&quot;margin-top:10px&quot;&gt;MAC&lt;/div&gt;&lt;canvas id=&quot;cM&quot;&gt;&lt;/canvas&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;Python&lt;/h2&gt;&lt;div class=&quot;code&quot; id=&quot;code&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;상태&lt;/h2&gt;&lt;div class=&quot;status info&quot; id=&quot;status&quot;&gt;프리셋을 누르세요.&lt;/div&gt;&lt;/div&gt;

  &lt;/div&gt;
  &lt;div class=&quot;panel explain&quot; id=&quot;explain&quot;&gt;&lt;/div&gt;

&lt;script&gt;
const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,ms));
let busy=false, timer=null;
function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}
function setCode(h){$(&#x27;#code&#x27;).innerHTML=h;}
function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const g=c.getContext(&#x27;2d&#x27;);g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}
function show(id,title){$$(&#x27;.view&#x27;).forEach(v=&gt;v.classList.toggle(&#x27;on&#x27;,v.id===id));if(title&amp;&amp;$(&#x27;#stageTitle&#x27;))$(&#x27;#stageTitle&#x27;).textContent=title;}
function initPresets(P,stop){$(&#x27;#presets&#x27;).innerHTML=P.map(p=&gt;`&lt;button type=&quot;button&quot;&gt;${p.n}&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}
const sigm=z=&gt;1/(1+Math.exp(-z));
const fe=(v,d=4)=&gt;{if(Number.isNaN(v))return &#x27;nan&#x27;;if(!isFinite(v))return v&gt;0?&#x27;inf&#x27;:&#x27;-inf&#x27;;const a=Math.abs(v);return a!==0&amp;&amp;(a&gt;=1e5||a&lt;1e-3)?v.toExponential(2):v.toFixed(d);};
const f3=v=&gt;(Math.abs(v)&lt;5e-4?0:v).toFixed(3), f4=v=&gt;(Math.abs(v)&lt;5e-5?0:v).toFixed(4);
const esc=s=&gt;String(s).replace(/&amp;/g,&#x27;&amp;amp;&#x27;).replace(/&lt;/g,&#x27;&amp;lt;&#x27;).replace(/&gt;/g,&#x27;&amp;gt;&#x27;);
// 시드 고정 난수 (mulberry32) + 정규분포 (Box-Muller) — numpy default_rng 과는 다른 수열
function makeRng(seed){let a=seed&gt;&gt;&gt;0;const u=()=&gt;{a=(a+0x6D2B79F5)&gt;&gt;&gt;0;let t=a;t=Math.imul(t^(t&gt;&gt;&gt;15),t|1);t^=t+Math.imul(t^(t&gt;&gt;&gt;7),t|61);return((t^(t&gt;&gt;&gt;14))&gt;&gt;&gt;0)/4294967296;};
  let sp=null;const n=()=&gt;{if(sp!==null){const v=sp;sp=null;return v;}let x,y,r;do{x=u()*2-1;y=u()*2-1;r=x*x+y*y;}while(r&gt;=1||r===0);const m=Math.sqrt(-2*Math.log(r)/r);sp=y*m;return x*m;};return {u,n};}
// 공용 선 그래프: o={xr,yr,xlog,ylog,xt,yt,xf,yf,xl,yl,series:[{pts,c,w,dash,dot,alpha}],hl:[{y,c,t}],vb:[{x0,x1,c}],ml}
function chart(cv,o){
  const [g,W,H]=fitCanvas(cv);g.clearRect(0,0,W,H);
  const ml=o.ml??46,mr=o.mr??12,mt=o.mt??10,mb=o.xl?36:24;
  const tx=v=&gt;o.xlog?Math.log10(v):v,ty=v=&gt;o.ylog?Math.log10(Math.max(v,1e-300)):v;
  const X=v=&gt;ml+(tx(v)-tx(o.xr[0]))/(tx(o.xr[1])-tx(o.xr[0]))*(W-ml-mr);
  const Y=v=&gt;mt+(1-(ty(v)-ty(o.yr[0]))/(ty(o.yr[1])-ty(o.yr[0])))*(H-mt-mb);
  g.font=&#x27;11px Consolas,monospace&#x27;;g.lineWidth=1;
  (o.vb||[]).forEach(b=&gt;{g.fillStyle=b.c;g.fillRect(X(b.x0),mt,X(b.x1)-X(b.x0),H-mt-mb);});
  (o.yt||[]).forEach(v=&gt;{const y=Y(v);g.strokeStyle=&#x27;#1a2540&#x27;;g.beginPath();g.moveTo(ml,y);g.lineTo(W-mr,y);g.stroke();g.fillStyle=&#x27;#5d7292&#x27;;g.textAlign=&#x27;right&#x27;;g.fillText(o.yf?o.yf(v):v,ml-5,y+4);});
  (o.xt||[]).forEach(v=&gt;{const x=X(v);g.strokeStyle=&#x27;#1a2540&#x27;;g.beginPath();g.moveTo(x,mt);g.lineTo(x,H-mb);g.stroke();g.fillStyle=&#x27;#5d7292&#x27;;g.textAlign=&#x27;center&#x27;;g.fillText(o.xf?o.xf(v):v,x,H-mb+14);});
  g.textAlign=&#x27;left&#x27;;
  if(o.xl){g.fillStyle=&#x27;#8a9bb8&#x27;;g.textAlign=&#x27;right&#x27;;g.fillText(o.xl,W-mr,H-4);g.textAlign=&#x27;left&#x27;;}
  if(o.yl){g.fillStyle=&#x27;#8a9bb8&#x27;;g.fillText(o.yl,ml+4,mt+11);}
  g.save();g.beginPath();g.rect(ml,mt-2,W-ml-mr,H-mt-mb+4);g.clip();
  (o.hl||[]).forEach(h=&gt;{g.strokeStyle=h.c;g.setLineDash([5,4]);g.beginPath();g.moveTo(ml,Y(h.y));g.lineTo(W-mr,Y(h.y));g.stroke();g.setLineDash([]);if(h.t){g.fillStyle=h.c;g.fillText(h.t,ml+6,Y(h.y)-4);}});
  (o.series||[]).forEach(s=&gt;{if(!s.pts.length)return;g.globalAlpha=s.alpha??1;g.strokeStyle=s.c;g.fillStyle=s.c;g.lineWidth=s.w||2;g.setLineDash(s.dash||[]);
    if(!s.only){g.beginPath();s.pts.forEach(([x,y],i)=&gt;{const px=X(x),py=Y(y);i?g.lineTo(px,py):g.moveTo(px,py);});g.stroke();}
    g.setLineDash([]);if(s.dot)s.pts.forEach(([x,y])=&gt;{g.beginPath();g.arc(X(x),Y(y),s.dot,0,7);g.fill();});g.globalAlpha=1;});
  g.restore();g.lineWidth=1;
  return {g,W,H,X,Y,ml,mr,mt,mb};
}
function arrow(g,x0,y0,x1,y1,c,w=2,hs=8){const a=Math.atan2(y1-y0,x1-x0),L=Math.hypot(x1-x0,y1-y0);if(L&lt;1)return;hs=Math.min(hs,L*0.6);g.strokeStyle=c;g.fillStyle=c;g.lineWidth=w;g.beginPath();g.moveTo(x0,y0);g.lineTo(x1-Math.cos(a)*hs*0.7,y1-Math.sin(a)*hs*0.7);g.stroke();
  g.beginPath();g.moveTo(x1,y1);g.lineTo(x1-hs*Math.cos(a-0.4),y1-hs*Math.sin(a-0.4));g.lineTo(x1-hs*Math.cos(a+0.4),y1-hs*Math.sin(a+0.4));g.closePath();g.fill();g.lineWidth=1;}
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
// ---- Day 5 공용: base64 · 색 · 격자 장면(scene) 그리기 · 합성곱 ----
function b64u8(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i&lt;b.length;i++)u[i]=b.charCodeAt(i);return u;}
const digitOf=s=&gt;Float32Array.from(b64u8(s),v=&gt;v/255);
const fmtI=n=&gt;Math.round(n).toLocaleString(&#x27;en-US&#x27;);
const gray=v=&gt;{const c=Math.round(Math.max(0,Math.min(1,v))*255);return `rgb(${c},${c},${c})`;};
// 부호 있는 값: 음수 파랑 · 양수 주황 (m = 최대 절댓값)
const divc=(v,m)=&gt;{const t=Math.max(-1,Math.min(1,m?v/m:0));return t&gt;=0?`rgba(245,185,66,${0.08+0.92*t})`:`rgba(96,165,250,${0.08+0.92*-t})`;};
// 0 이상 값: 검정 → 청록 → 흰색

<script>
const ids = [...document.querySelectorAll('nav button')].map(b => b.dataset.id);
function fit(fr) {
  try {
    const d = fr.contentDocument; if (!d || !d.body) return;
    fr.style.height = Math.max(600, d.documentElement.scrollHeight) + 'px';
  } catch (e) {}
}
function show(id, push) {
  if (!ids.includes(id)) id = ids[0];
  document.querySelectorAll('section.lesson').forEach(s => s.classList.toggle('active', s.id === id));
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-current', b.dataset.id === id ? 'true' : 'false'));
  const sec = document.getElementById(id);
  document.title = sec.dataset.title + ' — Neural Network Day 5';
  const fr = sec.querySelector('iframe');
  fr.loading = 'eager'; fit(fr);
  if (push) history.replaceState(null, '', '#' + id);
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('section.lesson iframe').forEach(fr => {
  fr.addEventListener('load', () => {
    fit(fr);
    try {
      new ResizeObserver(() => fit(fr)).observe(fr.contentDocument.body);
      fr.contentDocument.addEventListener('keydown', key);   // iframe 안에서도 ← → 동작
    } catch (e) {}
  });
});
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.id, true));
function key(e) {
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const cur = ids.indexOf(location.hash.slice(1) || ids[0]);
  if (e.key === 'ArrowRight' && cur < ids.length - 1) show(ids[cur + 1], true);
  if (e.key === 'ArrowLeft' && cur > 0) show(ids[cur - 1], true);
}
document.addEventListener('keydown', key);
window.addEventListener('resize', () => document.querySelectorAll('section.lesson.active iframe').forEach(fit));
window.addEventListener('hashchange', () => show(location.hash.slice(1), false));   // 주소창에서 #d5-N 을 바꿔도 이동
show(location.hash.slice(1), false);
</script>
