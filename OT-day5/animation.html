&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div class=&quot;app&quot;&gt;

&lt;h1&gt;ONNX·TensorRT 5일 지도 — 계단을 다 올랐습니다&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;&lt;b&gt;내보내기 → 열어보기 → 실행하기 → 빠르게 하기 → 실제 파이프라인에 넣기&lt;/b&gt;. 계단을 누르면 그날 쌓은 도구가 펼쳐집니다. 모든 계단은 같은 &lt;code&gt;.onnx&lt;/code&gt; 한 파일에서 출발했고, 측정은 &lt;code&gt;ot_baseline.csv&lt;/code&gt; 한 표에 쌓였습니다.&lt;/p&gt;
&lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill blue&quot;&gt;.onnx = 설계도&lt;/span&gt;&lt;span class=&quot;pill teal&quot;&gt;ORT = 바로 실행&lt;/span&gt;&lt;span class=&quot;pill amber&quot;&gt;.engine = 이 GPU 전용&lt;/span&gt;&lt;span class=&quot;pill green&quot;&gt;ot_baseline.csv = 비교 기준&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;panel pred&quot;&gt;&lt;h2&gt;먼저 예측 (실행 전에)&lt;/h2&gt;&lt;div id=&quot;pred&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;5일 계단 — 눌러서 펼치기&lt;/h2&gt;
  &lt;div class=&quot;stairs&quot; id=&quot;stairs&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;row ctl&quot; style=&quot;margin-top:8px&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;bAll&quot;&gt;모두 펼치기&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;bFold&quot;&gt;모두 접기&lt;/button&gt;&lt;/div&gt;
  &lt;div class=&quot;panel det&quot; id=&quot;det&quot; style=&quot;margin:10px 0 0&quot;&gt;&lt;span class=&quot;dim&quot;&gt;계단 하나를 누르세요.&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;
  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;다음 과목으로&lt;/h2&gt;&lt;div class=&quot;next&quot; id=&quot;next&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div&gt;
    &lt;div class=&quot;panel self&quot;&gt;&lt;h2&gt;셀프 체크&lt;/h2&gt;&lt;div id=&quot;self&quot;&gt;&lt;/div&gt;&lt;div class=&quot;prog&quot;&gt;&lt;i id=&quot;prog&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;lab&quot; id=&quot;progL&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;상태&lt;/h2&gt;&lt;div class=&quot;status info&quot; id=&quot;status&quot;&gt;프리셋을 누르세요.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;panel explain&quot; id=&quot;explain&quot;&gt;&lt;/div&gt;

&lt;/div&gt;
&lt;script&gt;
const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];
const RM=window.matchMedia&amp;&amp;window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,RM?Math.min(ms,80):ms));
let busy=false, timer=null;
function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}
function setCode(h){$(&#x27;#code&#x27;).innerHTML=h;}
function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const g=c.getContext(&#x27;2d&#x27;);g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}
function initPresets(P,stop){$(&#x27;#presets&#x27;).innerHTML=P.map(p=&gt;`&lt;button type=&quot;button&quot;&gt;${p.n}&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}
const esc=s=&gt;String(s).replace(/&amp;/g,&#x27;&amp;amp;&#x27;).replace(/&lt;/g,&#x27;&amp;lt;&#x27;).replace(/&gt;/g,&#x27;&amp;gt;&#x27;);
const fmt=n=&gt;n.toLocaleString(&#x27;en-US&#x27;);
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
window.__d5={};
let guess=null, predOpts=[];
function initPredict(q,opts){predOpts=opts;guess=null;
  $(&#x27;#pred&#x27;).innerHTML=`&lt;div class=&quot;steps3&quot;&gt;&lt;span class=&quot;on&quot; id=&quot;st1&quot;&gt;① 예측&lt;/span&gt;&lt;span id=&quot;st2&quot;&gt;② 실행&lt;/span&gt;&lt;span id=&quot;st3&quot;&gt;③ 설명&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;pq&quot;&gt;${q}&lt;/div&gt;&lt;div class=&quot;seg&quot; id=&quot;predOpts&quot;&gt;${opts.map((o,i)=&gt;`&lt;button type=&quot;button&quot; data-i=&quot;${i}&quot;&gt;${o}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;pv&quot; id=&quot;predV&quot;&gt;먼저 하나를 고른 뒤 실행 ▶ 하세요. (안 골라도 실행은 됩니다)&lt;/div&gt;`;
  $$(&#x27;#predOpts button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{guess=+b.dataset.i;$$(&#x27;#predOpts button&#x27;).forEach(x=&gt;{x.classList.toggle(&#x27;sel&#x27;,x===b);x.classList.remove(&#x27;ok&#x27;,&#x27;bad&#x27;);});
    const v=$(&#x27;#predV&#x27;);v.className=&#x27;pv&#x27;;v.textContent=&#x27;예측: &#x27;+opts[guess]+&#x27; → 이제 실행해서 확인&#x27;;phase(1);});}
function phase(k){[&#x27;#st1&#x27;,&#x27;#st2&#x27;,&#x27;#st3&#x27;].forEach((s,i)=&gt;{const e=$(s);if(e)e.classList.toggle(&#x27;on&#x27;,i===k);});}
function judge(ans,why){$$(&#x27;#predOpts button&#x27;).forEach((b,i)=&gt;{b.classList.toggle(&#x27;ok&#x27;,i===ans);b.classList.toggle(&#x27;bad&#x27;,i===guess&amp;&amp;i!==ans);});
  const v=$(&#x27;#predV&#x27;);v.className=&#x27;pv &#x27;+(guess===null?&#x27;&#x27;:guess===ans?&#x27;ok&#x27;:&#x27;bad&#x27;);
  v.innerHTML=(guess===null?&#x27;정답: &#x27;:guess===ans?&#x27;✅ 예측 적중 — &#x27;:&#x27;❌ 예측과 다름 — &#x27;)+&#x27;&lt;b&gt;&#x27;+predOpts[ans]+&#x27;&lt;/b&gt;. &#x27;+why;phase(2);window.__d5.judged=(window.__d5.judged||0)+1;}
function ready(){$(&#x27;#explain&#x27;).innerHTML=&#x27;&lt;p&gt;&lt;b class=&quot;amber&quot;&gt;① 예측&lt;/b&gt;을 먼저 고르고 → &lt;b class=&quot;teal&quot;&gt;② 프리셋 또는 ▶ 버튼&lt;/b&gt;으로 실행하면 → &lt;b class=&quot;green&quot;&gt;③ 여기에 설명&lt;/b&gt;이 나옵니다.&lt;/p&gt;&#x27;;setStatus(&#x27;info&#x27;,&#x27;먼저 위에서 예측을 하나 고른 뒤, 프리셋이나 ▶ 버튼을 누르세요.&#x27;);}
function pct(a,q){const s=[...a].sort((x,y)=&gt;x-y);const h=(s.length-1)*q/100,lo=Math.floor(h),hi=Math.ceil(h);return s[lo]+(s[hi]-s[lo])*(h-lo);}
function rng(seed){let t=seed&gt;&gt;&gt;0;return()=&gt;{t+=0x6D2B79F5;let r=Math.imul(t^t&gt;&gt;&gt;15,1|t);r^=r+Math.imul(r^r&gt;&gt;&gt;7,61|r);return((r^r&gt;&gt;&gt;14)&gt;&gt;&gt;0)/4294967296;};}


const DAYS=[{d:&#x27;Day 1&#x27;,t:&#x27;ONNX 첫걸음&#x27;,v:&#x27;내보내기&#x27;,tools:[&#x27;torch.onnx.export&#x27;,&#x27;Netron&#x27;,&#x27;InferenceSession&#x27;,&#x27;allclose&#x27;],k:&#x27;PyTorch 모델을 .onnx 한 파일로 — 어디서나 읽히는 설계도. 같은 입력 · 같은 답을 allclose 로 확인.&#x27;},
          {d:&#x27;Day 2&#x27;,t:&#x27;ONNX 속 들여다보기&#x27;,v:&#x27;열어보기&#x27;,tools:[&#x27;describe_onnx&#x27;,&#x27;opset&#x27;,&#x27;dynamic_axes&#x27;,&#x27;verify&#x27;,&#x27;onnxslim&#x27;],k:&#x27;노드 · 입출력 · opset 을 읽고, 배치를 바꿀 수 있게 (dynamic_axes) 내보내고, 가볍게 다듬기.&#x27;},
          {d:&#x27;Day 3&#x27;,t:&#x27;ONNX Runtime 으로 빠르게&#x27;,v:&#x27;실행하기&#x27;,tools:[&#x27;bench&#x27;,&#x27;스레드&#x27;,&#x27;최적화 레벨&#x27;,&#x27;CUDA EP&#x27;,&#x27;배치&#x27;,&#x27;profiling&#x27;],k:&#x27;잴 줄 알아야 빠르게 할 수 있다 — mean · p95 · fps 로 재고 스레드 · 최적화 레벨 · EP · 배치를 바꿔 비교.&#x27;},
          {d:&#x27;Day 4&#x27;,t:&#x27;TensorRT 첫걸음&#x27;,v:&#x27;빠르게 하기&#x27;,tools:[&#x27;polygraphy&#x27;,&#x27;build_engine&#x27;,&#x27;trt_runner&#x27;,&#x27;FP16&#x27;,&#x27;엔진 인스펙터&#x27;],k:&#x27;.onnx → 이 GPU 전용 .engine. 빌드는 한 번 (오래), 실행은 여러 번 (빠르게). FP16 은 정확도까지 확인.&#x27;},
          {d:&#x27;Day 5&#x27;,t:&#x27;탐지 · 종합 프로젝트&#x27;,v:&#x27;파이프라인에 넣기&#x27;,tools:[&#x27;TRTInfer&#x27;,&#x27;detect(frame, infer)&#x27;,&#x27;AP 비교&#x27;,&#x27;네 조각 시간&#x27;,&#x27;침입 감지&#x27;],k:&#x27;클래스로 묶고, YOLOv8n 에 그대로 쓰고, 추론기만 바꿔 실제 감지기에 넣기 — 결과 영상 · 이벤트 · 성능표.&#x27;}];
const NEXT=[{dt:&#x27;11/16~&#x27;,t:&#x27;Quantization·Pruning&#x27;,s:&#x27;INT8 이면 오늘 성능표가 어떻게 바뀔까? — ot_baseline.csv 가 비교 기준.&#x27;},
            {dt:&#x27;11/25~&#x27;,t:&#x27;[프로젝트] 현장 안전 모니터링&#x27;,s:&#x27;run_intrusion 의 source 만 카메라로. Jetson 에서는 .onnx 를 가져가 그 장치에서 다시 빌드.&#x27;},
            {dt:&#x27;12/11~&#x27;,t:&#x27;YOLOv8 Edge 모델&#x27;,s:&#x27;직접 학습한 YOLO 를 같은 경로 (ONNX → 엔진 → TRTInfer) 로.&#x27;}];
const SELF=[&#x27;함수를 클래스로 묶어 엔진 준비 (한 번) 와 실행 (여러 번) 을 나눌 수 있다&#x27;,&#x27;YOLOv8n 엔진의 입출력 (1, 3, 640, 640) → (1, 84, 8400) 을 설명할 수 있다&#x27;,&#x27;추론기를 인자로 받는 detect 로 ORT · TensorRT 를 바꿔 끼울 수 있다&#x27;,&#x27;같은 데이터 · 같은 함수로 FP32 와 FP16 의 AP 를 비교할 수 있다&#x27;,&#x27;한 프레임을 네 조각으로 재고 다음 병목을 찾을 수 있다&#x27;,&#x27;침입 감지 파이프라인에서 추론기만 바꿔 결과 영상 · 이벤트 · 성능표를 만들 수 있다&#x27;];
let open_=[0,0,0,0,0], hot=-1, nhot=-1, sc=SELF.map(()=&gt;0);
function drawStairs(){$(&#x27;#stairs&#x27;).innerHTML=DAYS.map((d,i)=&gt;`&lt;button type=&quot;button&quot; class=&quot;step ${open_[i]?&#x27;open&#x27;:&#x27;&#x27;} ${hot===i?&#x27;hot&#x27;:&#x27;&#x27;} ${i===4?&#x27;today&#x27;:&#x27;&#x27;}&quot; data-i=&quot;${i}&quot;&gt;&lt;span class=&quot;d&quot;&gt;${d.d}${i===4?&#x27; · 오늘&#x27;:&#x27;&#x27;}&lt;/span&gt;&lt;b&gt;${d.t}&lt;/b&gt;&lt;span class=&quot;v&quot;&gt;${d.v}&lt;/span&gt;${open_[i]?`&lt;span class=&quot;tools&quot;&gt;${d.tools.map(x=&gt;`&lt;code&gt;${esc(x)}&lt;/code&gt;`).join(&#x27;&#x27;)}&lt;/span&gt;`:&#x27;&#x27;}&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#stairs .step&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(busy)return;reveal(+b.dataset.i);});window.__d5.open=open_.reduce((a,b)=&gt;a+b,0);}
function reveal(i){open_[i]=1;hot=i;drawStairs();const d=DAYS[i];$(&#x27;#det&#x27;).innerHTML=`&lt;h3&gt;${d.d} — ${d.t} (${d.v})&lt;/h3&gt;&lt;p style=&quot;margin:4px 0&quot;&gt;${d.k}&lt;/p&gt;&lt;div class=&quot;tools&quot;&gt;${d.tools.map(x=&gt;`&lt;code&gt;${esc(x)}&lt;/code&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;setStatus(&#x27;info&#x27;,`${d.d} ${d.t} — ${d.tools.join(&#x27; · &#x27;)}`);}
function drawNext(){$(&#x27;#next&#x27;).innerHTML=NEXT.map((n,i)=&gt;`&lt;div class=&quot;nx ${nhot===i?&#x27;hot&#x27;:&#x27;&#x27;}&quot;&gt;&lt;span class=&quot;dt&quot;&gt;${n.dt}&lt;/span&gt;&lt;b&gt;${n.t}&lt;/b&gt;&lt;small&gt;${n.s}&lt;/small&gt;&lt;/div&gt;`).join(&#x27;&#x27;);}
function drawSelf(){$(&#x27;#self&#x27;).innerHTML=SELF.map((s,i)=&gt;`&lt;label&gt;&lt;input type=&quot;checkbox&quot; data-i=&quot;${i}&quot; ${sc[i]?&#x27;checked&#x27;:&#x27;&#x27;}&gt;${s}&lt;/label&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#self input&#x27;).forEach(c=&gt;c.onchange=()=&gt;{sc[+c.dataset.i]=c.checked?1:0;prog();});prog();}

<script>
const ids = [...document.querySelectorAll('nav button')].map(b => b.dataset.id);
function fit(fr) {
  try {
    const d = fr.contentDocument; if (!d || !d.body) return;
    fr.style.height = Math.max(600, d.documentElement.scrollHeight) + 'px';
  } catch (e) {}
}
function show(id, push) {
  if (!ids.includes(id)) id = ids[0];
  document.querySelectorAll('section.lesson').forEach(s => s.classList.toggle('active', s.id === id));
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-current', b.dataset.id === id ? 'true' : 'false'));
  const sec = document.getElementById(id);
  document.title = sec.dataset.title + ' — ONNX·TensorRT Day 5';
  const fr = sec.querySelector('iframe');
  fr.loading = 'eager'; fit(fr);
  if (push) history.replaceState(null, '', '#' + id);
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('section.lesson iframe').forEach(fr => {
  fr.addEventListener('load', () => {
    fit(fr);
    try {
      new ResizeObserver(() => fit(fr)).observe(fr.contentDocument.body);
      fr.contentDocument.addEventListener('keydown', key);   // iframe 안에서도 ← → 동작
    } catch (e) {}
  });
});
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.id, true));
function key(e) {
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const cur = ids.indexOf(location.hash.slice(1) || ids[0]);
  if (e.key === 'ArrowRight' && cur < ids.length - 1) show(ids[cur + 1], true);
  if (e.key === 'ArrowLeft' && cur > 0) show(ids[cur - 1], true);
}
document.addEventListener('keydown', key);
window.addEventListener('resize', () => document.querySelectorAll('section.lesson.active iframe').forEach(fit));
window.addEventListener('hashchange', () => show(location.hash.slice(1), false));   // 주소창에서 #d5-N 을 바꿔도 이동
show(location.hash.slice(1), false);
</script>
