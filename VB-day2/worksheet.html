<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vision 기본 모델 Day 2 개념 워크시트</title>
<style>
  :root{--bg:#0b1220;--panel:#111a2e;--line:#1f2b45;--text:#dbe4f0;--dim:#8a9bb8;--amber:#f5b942;--teal:#2dd4bf;--blue:#60a5fa;--green:#4ade80;--red:#f87171;--purple:#c084fc;--mono:"Consolas","D2Coding","JetBrains Mono",monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR","Segoe UI",sans-serif;font-size:15px;line-height:1.55}
  .app{max-width:920px;margin:0 auto;padding:22px 20px 40px}
  h1{color:var(--amber);font-size:24px;margin:0 0 6px}
  .sub{color:var(--dim);margin:0 0 14px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
  .panel h2{font-size:14px;color:var(--dim);margin:0 0 10px;font-weight:600}
  button{background:#172239;border:1px solid #2a3a5c;color:var(--text);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--amber)}button.active{background:#3a2e12;border-color:var(--amber);color:var(--amber)}
  button.primary{background:#123d33;border-color:var(--teal);color:var(--teal);font-weight:700;padding:9px 18px;font-size:14px}
  button.submit{background:#3a2e12;border-color:var(--amber);color:var(--amber);font-weight:700;padding:9px 18px;font-size:14px}
  button:disabled{opacity:.5;cursor:default}
  button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  input[type=text]{background:#0a0f1c;color:var(--text);border:1px solid #2a3a5c;border-radius:6px;padding:6px 10px;font-family:var(--mono);font-size:14px}
  select{background:#0a0f1c;color:var(--text);border:1px solid #2a3a5c;border-radius:6px;padding:4px 8px;font-family:inherit;font-size:14px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px}
  .tabs button .s{font-family:var(--mono);font-size:11px;color:var(--dim);margin-left:6px}
  .tabs button.graded .s{color:var(--green)}
  .legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .tag{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--dim);font-family:var(--mono)}
  .head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .head .t{color:var(--amber);font-size:17px}
  .head .a{font-size:13px;color:var(--teal);font-family:var(--mono)}
  .q{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;background:#0e1628}
  .q.unans{border-color:#5a3a1a}
  .q.ok{border-color:#1f6b45}.q.bad{border-color:#7a2e2e}
  .qh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .q .n{font-family:var(--mono);color:var(--dim);font-size:12px}
  .ty{font-size:11.5px;border-radius:999px;padding:1px 9px;border:1px solid}
  .q .p{margin:6px 0 10px;font-size:15px}
  .q code,.fb code,.dg code{font-family:var(--mono);color:var(--blue);background:#0a0f1c;padding:1px 5px;border-radius:4px}
  .q pre{font-family:var(--mono);background:#0a0f1c;border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:6px 0 4px;font-size:14px;white-space:pre;overflow-x:auto;line-height:1.9}
  .q pre input{font-size:13px;padding:2px 6px;width:auto;min-width:5ch}
  .opts{display:grid;gap:6px}
  .opt{text-align:left;padding:8px 12px;font-size:14px}
  .opt .box{display:inline-block;width:18px;font-family:var(--mono);color:var(--dim)}
  .opt.sel{border-color:var(--amber);background:#1f1a0c}
  .opt.ok{border-color:var(--green);color:var(--green);background:#0d2216}
  .opt.bad{border-color:var(--red);color:var(--red);background:#2a1212}
  .opt.miss{border-color:var(--green);border-style:dashed}
  .ox{display:flex;gap:10px}
  .ox button{font-size:22px;width:78px;height:54px;font-weight:700}
  .fill{line-height:2.3}
  .mrow{display:grid;grid-template-columns:1fr 24px minmax(160px,1.2fr);gap:8px;align-items:center;margin-bottom:6px}
  .mrow .l{background:#0a0f1c;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:14px}
  .mrow select{width:100%}
  .mrow .arr{color:var(--dim);text-align:center}
  .mrow.ok select{border-color:var(--green)}.mrow.bad select{border-color:var(--red)}
  .ord{list-style:none;margin:0;padding:0;display:grid;gap:6px}
  .ord li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;background:#0a0f1c;border:1px solid #2a3a5c;border-radius:8px;padding:7px 10px;cursor:grab;font-size:14px}
  .ord li.drag{opacity:.4}.ord li.over{border-color:var(--amber)}
  .ord li .k{font-family:var(--mono);color:var(--dim)}
  .ord li .mv button{padding:2px 8px;margin-left:4px}
  .ord li.ok{border-color:var(--green)}.ord li.bad{border-color:var(--red)}
  .hot{background:#0a0f1c;border:1px solid var(--line);border-radius:8px;padding:6px;overflow-x:auto}
  .hot svg{display:block;max-width:100%;height:auto;margin:0 auto}
  .hot .rg{cursor:pointer;fill:transparent;stroke:transparent;stroke-width:2.5}
  .hot .rg:hover{stroke:#f5b94288}
  .hot .rg.sel{stroke:var(--amber);fill:#f5b94222}
  .hot .rg.ok{stroke:var(--green);fill:#4ade8026}
  .hot .rg.bad{stroke:var(--red);fill:#f8717126}
  .card{perspective:900px;max-width:560px}
  .card .in{position:relative;min-height:130px;transition:transform .5s;transform-style:preserve-3d}
  .card.flip .in{transform:rotateY(180deg)}
  .card .f,.card .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;border:1px solid #2a3a5c;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px 18px;font-size:16px}
  .card .f{background:#14203a;color:var(--amber)}
  .card .b{background:#0f2a27;color:var(--teal);transform:rotateY(180deg)}
  @media (prefers-reduced-motion:reduce){.card .in{transition:none}}
  .selfrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
  .selfrow .hint{margin-left:4px}
  .fb{margin-top:10px;font-size:13px;color:var(--dim);border-left:3px solid var(--line);padding-left:10px}
  .fb.ok{border-left-color:var(--green)}.fb.bad{border-left-color:var(--red)}
  .fb b.v{display:block;margin-bottom:2px}
  .fb.ok b.v{color:var(--green)}.fb.bad b.v{color:var(--red)}
  .fb .anim{color:var(--teal);font-family:var(--mono);font-size:12px;display:block;margin-top:3px}
  .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
  .code{font-family:var(--mono);font-size:20px;color:var(--amber);letter-spacing:1px}
  .score{font-family:var(--mono);color:var(--green);font-size:16px}
  .hint{color:var(--dim);font-size:13px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:0;max-width:860px;width:92vw;max-height:88vh}
  dialog::backdrop{background:#000a}
  .dg{padding:18px 20px}
  .dg h3{color:var(--amber);margin:0 0 4px;font-size:20px}
  .dg .meta{color:var(--dim);font-size:13px;margin-bottom:12px;font-family:var(--mono)}
  .dg .sec{margin:14px 0 6px;color:var(--teal);font-weight:700;font-size:14px}
  .dg table{width:100%;border-collapse:collapse;font-size:13px}
  .dg th{text-align:left;color:var(--dim);font-weight:600;padding:5px 8px;border-bottom:1px solid var(--line);font-size:12px}
  .dg td{padding:5px 8px;border-bottom:1px solid #16203a;vertical-align:top}
  .dg .ok{color:var(--green)}.dg .bad{color:var(--red)}.dg .none{color:var(--dim)}
  .dg .sum{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0;font-family:var(--mono)}
  .dgbar{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 20px;display:flex;gap:8px;justify-content:flex-end;align-items:center}
  .toast{color:var(--green);font-size:13px;margin-right:auto}
  .body{overflow:auto;max-height:calc(88vh - 60px)}
  @media(max-width:600px){.mrow{grid-template-columns:1fr;gap:4px}.mrow .arr{display:none}}
</style>
</head>
<body>
<div class="app">
  <h1>Vision 기본 모델 Day 2 개념 워크시트</h1>
  <p class="sub">교시마다 10문항 — 객관식 · O/X · 빈칸 · 짝 맞추기 · 순서 배열 · 핫스팟 · 코드 완성 등 9가지 유형이 섞여 나옵니다. 답을 고른 뒤 아래 <b style="color:var(--teal)">채점하기</b>를 누르면 정오 · 해설과 결과 코드가 나타납니다. 채점 전에는 답을 바꿀 수 있고, 채점 후에는 잠깁니다. 모든 교시를 마치면 <b style="color:var(--amber)">제출</b>로 오답 정리를 열고, <b>캡처</b>로 복사해 노션에 붙여 넣으세요.</p>

  <div class="panel">
    <div class="row"><label style="color:var(--dim);font-size:13px">이름 <input type="text" id="name" placeholder="홍길동"></label><span class="hint">이름은 결과 코드 계산에만 쓰이며 저장되지 않습니다.</span></div>
  </div>
  <div class="panel"><h2>교시</h2><div class="tabs" id="tabs"></div><div class="legend" id="legend"></div></div>
  <div class="panel" id="sheet"></div>
  <div class="panel">
    <div class="actions">
      <button class="primary" id="gradeBtn">채점하기</button>
      <span class="score" id="rscore"></span>
      <span class="hint" id="rhint"></span>
      <span class="code" id="rcode">—</span>
    </div>
    <div class="actions" style="margin-top:12px">
      <button class="submit" id="submitBtn">제출 (오답 정리)</button>
      <button id="resetBtn">이 교시 다시 풀기</button>
    </div>
  </div>
</div>

<dialog id="dlg">
  <div class="body"><div class="dg" id="dgBody"></div></div>
  <div class="dgbar"><span class="toast" id="toast"></span><button id="captureBtn" class="primary">📋 캡처 (노션용 복사)</button><button id="closeBtn">닫기</button></div>
</dialog>

<script>
const Q = [{"t": "1교시 · 복습 · CIFAR-10 과 MLP", "anim": "D2-1 MLP 의 한계", "qs": [{"type": "single", "p": "CIFAR-10 이미지 한 장은 32×32 컬러(RGB 3채널) 입니다. 한 장을 MLP 에 넣으려고 펼치면 값이 몇 개인가요? (MNIST 28×28 흑백은 784 개)", "o": ["3,072", "1,024", "784", "9,216"], "a": 0, "w": "3 · 32 · 32 = 3,072 개로 MNIST 784 개의 약 4배입니다. 1,024 는 한 채널(32 · 32) 만 센 값입니다.", "an": "D2-1 · CIFAR-10"}, {"type": "single", "p": "CIFAR-10 train 50,000 장을 아래처럼 묶었습니다. <code>len(train_loader)</code> (epoch 당 step 수) 는?<pre>train_loader = DataLoader(train_set, batch_size=128, shuffle=True,\n                          num_workers=2, pin_memory=True)</pre>", "o": ["390", "391", "128", "500"], "a": 1, "w": "50,000 / 128 = 390.6 이고, drop_last=False (기본) 라 마지막 80 장짜리 배치도 쓰므로 올림해 391 입니다. 7 · 8교시 OneCycleLR 의 steps_per_epoch 도 391.", "an": "1교시 · 데이터 로더"}, {"type": "multi", "p": "CIFAR-10 데이터에 대한 설명으로 <b>옳은 것</b>을 모두 고르세요.", "o": ["train 50,000 장 (클래스당 5,000) · test 10,000 장 (클래스당 1,000) 이다", "원본 배열 <code>train_set.data</code> 는 (50000, 3, 32, 32) 모양의 CHW 이다", "한 장의 값은 32 × 32 × 3 = 3,072 개로 MNIST 784 개의 약 4배다", "10 클래스 안에 automobile 과 truck 이 따로 있다", "<code>transforms.ToTensor()</code> 는 값을 0~255 정수 그대로 둔다"], "a": [0, 2, 3], "w": "원본 <code>train_set.data</code> 는 (50000, 32, 32, 3) uint8 HWC 입니다. ToTensor 가 (3, 32, 32) float32 0~1 로 바꿉니다.", "an": "D2-1 · CIFAR-10"}, {"type": "ox", "p": "정규화 상수 <code>MEAN</code> · <code>STD</code> 는 train 50,000 장과 test 10,000 장을 합친 60,000 장으로 계산해야 test 평가가 공정하다.", "a": false, "w": "정규화 상수는 train 으로만 구하고 test 에도 같은 값을 씁니다. test 를 섞으면 시험 문제를 미리 본 것과 같습니다. 결과는 MEAN (0.4914, 0.4822, 0.4465), STD (0.2470, 0.2435, 0.2616).", "an": "문제 1-1"}, {"type": "short", "p": "문제 1-2 — CIFAR-10 용 MLP <code>3072 → 512 → 256 → 10</code> (Linear 3개, bias 포함) 의 전체 파라미터 수는? (숫자만)", "a": ["1707274", "1,707,274", "1_707_274"], "w": "3072 · 512 + 512 = 1,573,376 · 512 · 256 + 256 = 131,328 · 256 · 10 + 10 = 2,570 → 1,707,274. 첫 층이 약 92% 를 차지합니다.", "an": "문제 1-2"}, {"type": "drop", "p": "문제 1-1 — 정규화 상수를 직접 구합니다. 빈칸에 알맞은 것을 고르세요.", "p2": "<code>data01 = train_set.data / 255.0</code> 의 shape 는 {} 이다. 채널별 평균은 <code>data01.mean(axis={})</code> 로 구하고, 결과 shape 는 {} 이다.", "opts": [["(50000, 3, 32, 32)", "(50000, 32, 32, 3)", "(3, 32, 32)"], ["(1, 2, 3)", "3", "(0, 1, 2)"], ["(32, 32, 3)", "(3,)", "(50000,)"]], "a": [1, 2, 1], "w": "원본은 HWC 라 채널이 마지막 축(3) 입니다. 축 (0, 1, 2) = (이미지, 세로, 가로) 를 모두 평균하면 채널 3 개만 남아 (3,).", "an": "문제 1-1"}, {"type": "match", "p": "문제 1-2 의 MLP 에서 각 계층의 파라미터 수를 짝지으세요.", "left": ["<code>nn.Linear(3072, 512)</code>", "<code>nn.Linear(512, 256)</code>", "<code>nn.Linear(256, 10)</code>", "<code>nn.Flatten()</code> · <code>nn.ReLU()</code>"], "right": ["1,573,376", "131,328", "2,570", "0"], "a": [0, 1, 2, 3], "w": "in · out + out. 펼치기와 활성화 함수는 학습할 값이 없습니다. 합계 1,707,274.", "an": "문제 1-2"}, {"type": "order", "p": "CIFAR-10 사진 한 장이 MLP 의 첫 Linear 에 들어가기까지의 순서로 배열하세요.", "items": ["PIL 이미지 32×32×3 uint8 (HWC)", "<code>ToTensor()</code> → (3, 32, 32) float32, 0~1", "<code>Normalize(MEAN, STD)</code> → 채널별로 평균 0 · 표준편차 1 근처", "DataLoader 가 128 장을 쌓아 (128, 3, 32, 32)", "<code>nn.Flatten()</code> → (128, 3072)"], "w": "Dataset 이 한 장씩 변환하고, DataLoader 가 배치로 묶고, 모델 첫 층의 Flatten 이 배치 축만 남기고 펼칩니다.", "an": "1교시 · 데이터 로더"}, {"type": "hot", "p": "MLP 는 (3, 32, 32) 텐서를 채널 → 세로 → 가로 순서로 펼쳐 3,072 칸의 줄로 만듭니다. 주황 픽셀이 줄의 0번 칸일 때, 그 <b>바로 아래</b> 픽셀 (청록 ?) 은 줄의 몇 번 칸에 놓이나요?", "w": "32번 칸입니다. 펼친 위치 = c · 1024 + y · 32 + x 이므로 (0, 1, 0) → 32. 오른쪽 이웃은 1, 같은 위치의 G 채널은 1024 칸 떨어집니다. MLP 는 이 이웃 관계를 모른 채 시작합니다.", "an": "D2-1 · MLP 의 한계", "viewBox": "0 0 720 260", "sw": 720, "svg": "<defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#8a9bb8\"/></marker><marker id=\"ahr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#f87171\"/></marker></defs><text x=\"20\" y=\"22\" font-s \"140\" width=\"50\" height=\"56\" rx=\"6\" fill=\"#3a2e12\" stroke=\"#f5b942\" /><text x=\"265\" y=\"168.0\" font-size=\"13\" fill=\"#f5b942\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">0</text><rect x=\"302\" y=\"140\" width=\"72\" height=\"56\" rx=\"6\" fill=\"#0f1a30\" stroke=\"#60a5fa\" /><text x=\"338\" y=\"168.0\" font-size=\"14\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">1</text><rect x=\"386\" y=\"140\" width=\"72\" height=\"56\" rx=\"6\" fill=\"#0f1a30\" stroke=\"#60a5fa\" /><text x=\"422\" y=\"168.0\" font-size=\"14\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">32</text><rect x=\"470\" y=\"140\" width=\"72\" height=\"56\" rx=\"6\" fill=\"#0f1a30\" stroke=\"#60a5fa\" /><text x=\"506\" y=\"168.0\" font-size=\"14\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">33</text><rect x=\"554\" y=\"140\" width=\"72\" height=\"56\" rx=\"6\" fill=\"#0f1a30\" stroke=\"#60a5fa\" /><text x=\"590\" y=\"168.0\" font-size=\"14\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">1024</text><text x=\"648\" y=\"168.0\" font-size=\"12\" fill=\"#8a9bb8\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">… 3071</text><text x=\"240\" y=\"214\" font-size=\"11\" fill=\"#8a9bb8\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">펼친 줄 (3072 칸) 의 일부 — 번호 = 줄에서의 위치</text><path d=\"M88,89 C 160,90 200,150 238,166\" fill=\"none\" stroke=\"#f5b942\" stroke-dasharray=\"4 3\" marker-end=\"url(#ah)\"/>", "regions": [{"id": "i1", "label": "줄의 1번 칸", "x": 302, "y": 140, "w": 72, "h": 56}, {"id": "i32", "label": "줄의 32번 칸", "x": 386, "y": 140, "w": 72, "h": 56}, {"id": "i33", "label": "줄의 33번 칸", "x": 470, "y": 140, "w": 72, "h": 56}, {"id": "i1024", "label": "줄의 1024번 칸", "x": 554, "y": 140, "w": 72, "h": 56}], "a": "i32"}, {"type": "code", "p": "문제 1-2 · 1-3 — MLP 를 만들어 GPU 로 옮기고 Adam 으로 3 epoch 학습하는 코드를 완성하세요.", "code": "mlp = nn.Sequential(\n    nn.{{}}(),\n    nn.Linear({{}}, 512), nn.ReLU(),\n    nn.Linear(512, 256), nn.ReLU(),\n    nn.Linear(256, {{}}),\n)\nmlp = mlp.{{}}\nopt = torch.optim.Adam(mlp.parameters(), lr=1e-3)\nhist_mlp = fit(mlp, train_loader, test_loader, 3, opt, label=\"MLP\")", "a": [["Flatten"], ["3 * 32 * 32", "3072", "32 * 32 * 3", "3 * 1024"], ["10"], ["to(device)", "to(device=device)"]], "w": "Flatten → Linear(3072, 512) → … → Linear(256, 10). 실행 예: 3 epoch test 0.4994 — 170만 파라미터로도 '이웃 픽셀' 구조를 쓰지 못해 MNIST 처럼 높지 않습니다.", "an": "문제 1-3"}]}, {"t": "2교시 · Conv 다시 보기", "anim": "D2-2 Conv2d 의 인자", "qs": [{"type": "single", "p": "ResNet 첫 층의 설정입니다. 224×224 입력에 대한 출력 크기는? (O = ⌊(N + 2P − K) / S⌋ + 1)<pre>nn.Conv2d(3, 64, kernel_size=7, stride=2, padding=3)</pre>", "o": ["109", "111", "112", "224"], "a": 2, "w": "(224 + 2·3 − 7) // 2 + 1 = 223 // 2 + 1 = 111 + 1 = 112. 111 은 마지막 '+ 1' 을 빠뜨린 값입니다.", "an": "문제 2-1"}, {"type": "single", "p": "문제 2-2 — 아래 depthwise 합성곱 (기본 bias=True) 의 파라미터 수는?<pre>nn.Conv2d(64, 64, 3, groups=64)</pre>", "o": ["36,928", "576", "4,160", "640"], "a": 3, "w": "필터 하나가 보는 입력 채널이 64 // 64 = 1 개라 가중치 64 · 1 · 9 = 576 에 bias 64 를 더해 640. 일반 64→64 3×3 (36,928) 의 1/57.7 (가중치만은 1/64) — Day 3 MobileNet 의 핵심입니다.", "an": "문제 2-2"}, {"type": "multi", "p": "<code>nn.Conv2d</code> 의 인자에 대한 설명으로 <b>옳은 것</b>을 모두 고르세요.", "o": ["K=3, P=1, S=1 이면 출력 크기가 입력과 같다 (same)", "padding 을 늘리면 파라미터 수도 늘어난다", "stride=2 이면 출력 크기가 약 절반이 된다", "groups = Cin = Cout 이면 depthwise 합성곱이 되어 가중치 수가 1/G 로 준다", "kernel_size 를 키우면 출력 크기가 커진다"], "a": [0, 2, 3], "w": "padding 은 입력 가장자리에 0 을 덧댈 뿐 가중치와 무관합니다. K 가 커지면 N + 2P − K 가 작아져 출력은 오히려 줄어듭니다.", "an": "D2-2 · Conv2d 의 인자"}, {"type": "ox", "p": "<code>nn.Conv2d(64, 128, 3, stride=2, padding=1)</code> 로 (N, 64, 32, 32) → (N, 128, 16, 16) 을 만들면, 채널은 2배가 되지만 위치 수가 1/4 이라 연산량(MAC) 은 크기를 유지하는 64→64 3×3 층의 절반이다.", "a": true, "w": "64→64 (32×32): 64 · 1024 · 64 · 9 = 37,748,736 MAC. 64→128 (16×16): 128 · 256 · 64 · 9 = 18,874,368 MAC — 정확히 절반입니다. VGG · ResNet 이 '크기 1/2 마다 채널 2배' 로 설계하는 이유.", "an": "문제 2-4"}, {"type": "short", "p": "문제 2-2 — <code>nn.Conv2d(64, 128, 3)</code> (bias=True) 의 파라미터 수는? (숫자만)", "a": ["73856", "73,856", "73_856"], "w": "Cout · Cin · K² + Cout = 128 · 64 · 9 + 128 = 73,728 + 128 = 73,856.", "an": "문제 2-2"}, {"type": "drop", "p": "문제 2-3 — 수용 영역 (receptive field) 계산 규칙입니다 (시작 rf = 1, jump = 1). 빈칸에 알맞은 것을 고르세요.", "p2": "층마다 <code>rf ← rf + (K − 1) × {}</code>, <code>jump ← jump × {}</code> 로 갱신한다. 3×3 을 세 층 쌓으면 rf = {} 이고, LeNet 의 (5, 1)(2, 2)(5, 1)(2, 2) 는 rf = {} 이다.", "opts": [["jump", "rf", "K"], ["K", "S", "2"], ["5", "7", "9"], ["14", "16", "32"]], "a": [0, 1, 1, 1], "w": "3×3 ×3: 1 + 2 + 2 + 2 = 7. LeNet: 1 + 4 = 5 → pool 후 jump 2 → 5 + 2 = 7 → 7 + 4·2 = 15 → 15 + 1·2 = 16 (jump 4).", "an": "문제 2-3"}, {"type": "match", "p": "문제 2-1 — 입력 크기 N, 커널 K, stride S, padding P 에 따른 출력 크기를 짝지으세요.", "left": ["(N, K, S, P) = (32, 5, 1, 0)", "(32, 3, 1, 1)", "(32, 3, 2, 1)", "(7, 3, 2, 0)"], "right": ["28", "32", "16", "3"], "a": [0, 1, 2, 3], "w": "(32 − 5) + 1 = 28 · (32 + 2 − 3) + 1 = 32 (same) · (32 + 2 − 3) // 2 + 1 = 16 · (7 − 3) // 2 + 1 = 3.", "an": "문제 2-1"}, {"type": "order", "p": "아래 합성곱 층들을 <b>파라미터 수가 작은 것부터</b> 순서대로 배열하세요.", "items": ["<code>Conv2d(3, 6, 5)</code>", "<code>Conv2d(64, 64, 3, groups=64)</code>", "<code>Conv2d(16, 32, 3, bias=False)</code>", "<code>Conv2d(64, 128, 1, bias=False)</code>", "<code>Conv2d(64, 128, 3)</code>"], "w": "456 → 640 → 4,608 → 8,192 → 73,856. groups 는 ÷G, 1×1 은 K² = 1, bias=False 는 Cout 만큼 줄어듭니다.", "an": "문제 2-2"}, {"type": "hot", "p": "<code>paddi  1], "w": "작은 영역만 보는 필터를 같은 가중치로 전체에 밀고 다니므로 적은 파라미터로 이웃 관계 · 이동 불변성을 얻습니다. 실행 예: LeNet-5 0.5489 vs MLP 0.4994.", "an": "문제 3-2"}, {"type": "match", "p": "LeNet-5 의 각 계층과 파라미터 수를 짝지으세요.", "left": ["conv1 <code>Conv2d(3, 6, 5)</code>", "conv2 <code>Conv2d(6, 16, 5)</code>", "fc1 <code>Linear(400, 120)</code>", "fc3 <code>Linear(84, 10)</code>"], "right": ["456", "2,416", "48,120", "850"], "a": [0, 1, 2, 3], "w": "3 · 6 · 25 + 6 = 456 · 6 · 16 · 25 + 16 = 2,416 · 400 · 120 + 120 = 48,120 · 84 · 10 + 10 = 850. fc2 (120 · 84 + 84) 는 10,164.", "an": "문제 3-1"}, {"type": "order", "p": "ImageNet 대회 (ILSVRC) 우승 · 주요 모델을 <b>연도 순서</b>대로 배열하세요.", "items": ["XRCE — top-5 25.8%", "AlexNet — 15.3%, 8층", "ZFNet — 11.7%", "GoogLeNet — 6.7%, 22층 (VGG 7.3% 2위)", "ResNet — 3.57%, 152층"], "w": "2011 XRCE → 2012 AlexNet → 2013 ZFNet → 2014 GoogLeNet · VGG → 2015 ResNet. 해마다 더 깊어졌습니다: 8 → 19 · 22 → 152층.", "an": "3교시 · ImageNet 연표"}, {"type": "hot", "p": "LeNet-5 (CIFAR 판) 의 계층들입니다. 전체 62,006 개 중 <b>파라미터가 가장 많은 계층</b>을 클릭하세요.", "w": "fc1 <code>Linear(400, 120)</code> 입니다. 400 · 120 + 120 = 48,120 개로 전체의 약 78%. 합성곱 두 층은 456 + 2,416 개뿐 — '파라미터는 FC 에, 연산은 Conv 에' (MAC 은 conv1 352,800 + conv2 240,000 vs FC 58,920).", "an": "D2-3 · LeNet-5 의 shape 흐름", "viewBox": "0 0 712 272", "sw": 712, "svg": "<defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#8a9bb8\"/></marker><marker id=\"ahr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#f87171\"/></marker></defs><text x=\"20\" y=\"22\" font-size=\"12\" fill=\"#8a9bb8\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">입력 (N, 3, 32, 32)  — 괄호 안은 각 계층의 출력 shape</text><rect x=\"14\" y=\"50\" width=\"124\" height=\"64\" rx=\"6\" fill=\"#14203a\" stroke=\"#2dd4bf\" /><te        self.pool = nn.MaxPool2d(2)\n        self.fc1 = nn.Linear({{}}, 120)\n        ...\n\nalex = torchvision.models.alexnet(weights=None)\nname, p = max(alex.{{}}, key=lambda kv: kv[1].{{}})", "a": [["5", "kernel_size=5"], ["16 * 5 * 5", "400", "16 * 25"], ["named_parameters()"], ["numel()"]], "w": "14 − 5 + 1 = 10, 16 · 5 · 5 = 400. AlexNet 전체 61,100,840 개 중 classifier.1.weight (4096, 9216) = 37,748,736 개 (61.8%) 가 가장 큽니다.", "an": "문제 3-3"}]}, {"t": "4교시 · VGG", "anim": "D2-4 3×3 쌓기와 수용 영역", "qs": [{"type": "single", "p": "문제 4-1 — 채널 C = 64, bias 없음. 5×5 한 층 (102,400) 과 수용 영역이 같은 <b>3×3 두 층</b>의 파라미터 수는?", "o": ["102,400", "36,864", "110,592", "73,728"], "a": 3, "w": "2 · 9 · 64² = 18C² = 73,728 로 25C² 보다 28% 적습니다. 36,864 는 한 층, 110,592 는 세 층 (7×7 대응) 입니다.", "an": "문제 4-1"}, {"type": "single", "p": "VGG-mini 는 블록 3개 (채널 32 → 64 → 128, 블록마다 MaxPool2d(2)) 뒤에 Flatten → <code>nn.Linear(?, 10)</code> 입니다. 입력 (N, 3, 32, 32) 일 때 ? 는?", "o": ["8,192", "128", "2,048", "512"], "a": 2, "w": "32 → 16 → 8 → 4 이므로 (N, 128, 4, 4) → 128 · 4 · 4 = 2,048. 8,192 는 풀링 하나를 빠뜨린 128 · 8 · 8 입니다.", "an": "문제 4-2"}, {"type": "multi", "p": "5×5 한 층 대신 <b>3×3 두 층</b>을 쌓는 이유로 옳은 것을 모두 고르세요. (padding 으로 크기 유지)", "o": ["두 층의 수용 영역이 5×5 한 층과 같다", "파라미터가 18C² 로 25C² 보다 28% 적다", "ReLU 가 두 번 들어가 더 복잡한 모양을 표현할 수 있다", "출력 크기가 5×5 한 층보다 커져 정보가 덜 사라진다", "층이 늘어 연산량(MAC) 이 5×5 한 층보다 많아진다"], "a": [0, 1, 2], "w": "같은 padding 이면 출력 크기는 같고, MAC 도 파라미터와 같은 비율 (18 : 25) 로 줄어듭니다. 세 층이면 7×7 과 같은 영역에 27C² vs 49C² (45% 감소).", "an": "D2-4 · 3×3 쌓기와 수용 영역"}, {"type": "ox", "p": "2014년 원래 VGG 는 Conv 뒤마다 BatchNorm 을 넣어 16~19층을 학습했다.", "a": false, "w": "BatchNorm 은 2015년에 나왔습니다. 오늘의 VGG 블록은 요즘 표준대로 [Conv3×3 (bias=False) → BN → ReLU] × n → MaxPool 입니다.", "an": "4교시 · VGG 블록"}, {"type": "short", "p": "문제 4-2 — VGG-mini (vgg_block(3, 32, 2) → vgg_block(32, 64, 2) → vgg_block(64, 128, 2) → Linear(2048, 10)) 의 전체 파라미터 수는? (숫자만)", "a": ["307946", "307,946", "307_946"], "w": "합성곱 6층 286,560 + BN 6개 896 (γ · β) + Linear 20,490 = 307,946. LeNet-5 의 약 5배, MLP 의 1/5.5.", "an": "문제 4-2"}, {"type": "drop", "p": "VGG 블록 <code>vgg_block(cin, cout, n_convs)</code> 의 설계입니다. 빈칸에 알맞은 것을 고르세요.", "p2": "합성곱은 <code>Conv2d(cin, cout, 3, padding={}, bias={})</code> 이다. 바로 뒤의 {} 가 bias 역할을 하기 때문이고, 블록 끝의 <code>MaxPool2d(2)</code> 는 가로 · 세로 크기를 {} 로 줄인다.", "opts": [["0", "1", "2"], ["True", "False"], ["ReLU", "BatchNorm2d", "MaxPool2d"], ["1/2", "1/4", "그대로"]], "a": [1, 1, 1, 0], "w": "3×3 · padding 1 은 크기 유지, BN 의 β 가 bias 를 대신하므로 bias=False. 풀링 2×2 는 가로 · 세로를 각각 1/2 (위치 수는 1/4) 로 줄입니다.", "an": "문제 4-2"}, {"type": "match", "p": "VGG-mini 에 (N, 3, 32, 32) 를 넣을 때 각 단계의 출력 shape 를 짝지으세요.", "left": ["<code>vgg_block(3, 32, 2)</code>", "<code>vgg_block(32, 64, 2)</code>", "<code>vgg_block(64, 128, 2)</code>", "<code>nn.Flatten()</code>"], "right": ["(N, 32, 16, 16)", "(N, 64, 8, 8)", "(N, 128, 4, 4)", "(N, 2048)"], "a": [0, 1, 2, 3], "w": "블록마다 크기 1/2, 채널 2배. 마지막 합성곱의 수용 영역은 32 로 32×32 이미지 전체를 봅니다.", "an": "문제 4-2"}, {"type": "order", "p": "<code>vgg_block(3, 32, 2)</code> 안의 계층을 순서대로 배열하세요.", "items": ["<code>Conv2d(3, 32, 3, padding=1, bias=False)</code>", "<code>BatchNorm2d(32)</code> → <code>ReLU</code>", "<code>Conv2d(32, 32, 3, padding=1, bias=False)</code>", "<code>BatchNorm2d(32)</code> → <code>ReLU</code> (두 번째)", "<code>MaxPool2d(2)</code> → (N, 32, 16, 16)"], "w": "[Conv3×3 → BN → ReLU] × 2 → MaxPool. 두 번째 Conv 는 입력도 cout (32) 채널입니다 (<code>cin if i == 0 else cout</code>).", "an": "문제 4-2"}, {"type": "hot", "p": "VGG-mini 의 단계들입니다 (BN · ReLU · MaxPool 은 블록 안에 포함). 전체 307,946 개 중 <b>파라미터가 가장 많은 단계</b>를 클릭하세요.", "w": "<code>vgg_block(64, 128, 2)</code> 입니다. 64·128·9 + 128·128·9 = 221,184 + BN 512 = 221,696 개로 약 72%. 채널이 2배가 되면 3×3 합성곱의 파라미터는 4배가 됩니다 (블록1 10,208 · 블록2 55,552 · Linear 20,490).", "an": "D2-4 · VGG-mini", "viewBox": "0 0 676 262", "sw": 676, "svg": "<defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><pa -anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">vgg_block(64, 128, 2)</text><text x=\"554.0\" y=\"110\" font-size=\"10.5\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">→ (N, 128, 4, 4)</text><line x1=\"434\" y1=\"96.0\" x2=\"454\" y2=\"96.0\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"150\" y=\"176\" width=\"196\" height=\"68\" rx=\"6\" fill=\"#14203a\" stroke=\"#60a5fa\" /><text x=\"248.0\" y=\"201\" font-size=\"12\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">Flatten()</text><text x=\"248.0\" y=\"224\" font-size=\"10.5\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">→ (N, 2048)</text><rect x=\"386\" y=\"176\" width=\"196\" height=\"68\" rx=\"6\" fill=\"#14203a\" stroke=\"#f5b942\" /><text x=\"484.0\" y=\"201\" font-size=\"12\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">Linear(2048, 10)</text><text x=\"484.0\" y=\"224\" font-size=\"10.5\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">→ (N, 10)</text><line x1=\"348\" y1=\"210.0\" x2=\"384\" y2=\"210.0\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><path d=\"M554.0,132 L554.0,154 L248,154 L248,174\" fill=\"none\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/>", "regions": [{"id": "b1", "label": "vgg_block(3, 32, 2)", "x": 16, "y": 62, "w": 196, "h": 68}, {"id": "b2", "label": "vgg_block(32, 64, 2)", "x": 236, "y": 62, "w": 196, "h": 68}, {"id": "b3", "label": "vgg_block(64, 128, 2)", "x": 456, "y": 62, "w": 196, "h": 68}, {"id": "flat", "label": "Flatten()", "x": 150, "y": 176, "w": 196, "h": 68}, {"id": "fc", "label": "Linear(2048, 10)", "x": 386, "y": 176, "w": 196, "h": 68}], "a": "b3"}, {"type": "code", "p": "문제 4-2 — <code>vgg_block</code> 과 VGG-mini 를 완성하세요.", "code": "def vgg_block(cin, cout, n_convs):\n    layers = []\n    for i in range(n_convs):\n        layers += [nn.Conv2d(cin if i == 0 else cout, cout, 3, padding={{}}, bias=False),\n                   nn.BatchNorm2d({{}}),\n                   nn.ReLU(inplace=True)]\n    layers.append(nn.MaxPool2d(2))\n    return nn.Sequential(*layers)\n\ndef vgg_mini(n_cls=10):\n    return nn.Sequential(\n        vgg_block(3, 32, 2),\n        vgg_block(32, 64, 2),\n        vgg_block(64, {{}}, 2),\n        nn.Flatten(),\n        nn.Linear({{}}, n_cls),\n    )", "a": [["1"], ["cout"], ["128"], ["128 * 4 * 4", "2048", "2_048", "128 * 16"]], "w": "padding 1 로 크기 유지, BN 은 출력 채널 수, 마지막 블록 128 채널, (N, 128, 4, 4) → 2,048. 실행 예: 3 epoch test 0.7526.", "an": "문제 4-2"}]}, {"t": "5교시 · 깊이의 문제 · BatchNorm", "anim": "D2-5 기울기 소실과 BatchNorm", "qs": [{"type": "single", "p": "문제 5-3 — <code>nn.BatchNorm2d(16)</code> 의 <b>학습 파라미터</b> 수 (<code>count_params</code>) 는?", "o": ["32", "16", "64", "80"], "a": 0, "w": "weight γ 16 + bias β 16 = 32. running_mean · running_var 는 학습되지 않는 buffer 라 parameters() 에 포함되지 않습니다 (64 는 이것까지 센 값).", "an": "문제 5-3"}, {"type": "single", "p": "문제 5-2 — BN 을 넣은 plain-20 은 <b>train 손실조차</b> BN 을 넣은 plain-8 보다 높게 끝납니다. 가장 알맞은 설명은?", "o": ["층이 많아 train 데이터를 외워 버리는 과적합이다", "plain-20 은 파라미터가 plain-8 보다 적어 표현력이 부족하다", "깊은 plain 망은 최적화 자체가 어려워진다 — 성능 저하 (degradation), 6교시 ResNet 이 푸는 문제", "test 데이터가 10,000 장뿐이라 측정이 부정확하다"], "a": 2, "w": "과적합이면 train 손실은 낮고 test 만 나빠야 합니다. plain-20 (42,378 개) 은 plain-8 (14,538 개) 보다 파라미터가 많습니다. 실행 예: train 손실 plain-8+BN 1.699 vs plain-20+BN 1.785. BN 이 없으면 둘 다 손실 약 2.30 (= ln 10) 에서 움직이지 못했습니다 (2.304 · 2.303).", "an": "문제 5-2"}, {"type": "multi", "p": "문제 5-3 — <code>nn.BatchNorm2d(16).state_dict()</code> 의 항목 중 <b>학습되지 않지만 저장되는 buffer</b> 를 모두 고르세요.", "o": ["<code>weight</code>", "<code>bias</code>", "<code>running_mean</code>", "<code>running_var</code>", "<code>num_batches_tracked</code>"], "a": [2, 3, 4], "w": "weight (γ) · bias (β) 는 학습 파라미터, 나머지 셋은 학습 중 쌓이는 통계로 추론 때 씁니다. 그래서 저장 · 불러오기에 함께 들어가야 합니다.", "an": "문제 5-3"}, {"type": "ox", "p": "<code>nn.BatchNorm2d(C)</code> 는 채널마다 (배치 · 세로 · 가로) 전체에서 평균 · 분산을 하나씩 구한다.", "a": true, "w": "Conv 출력 (N, C, H, W) 에서 채널 하나당 N · H · W 개 값으로 통계를 냅니다. NN Day 4 의 BatchNorm (Affine 뒤) 은 배치 축 (axis=0) 만 썼습니다.", "an": "5교시 · BatchNorm 다시 보기"}, {"type": "short", "p": "plain-N 은 3×3 Conv (N − 1) 개 + GAP + Linear 입니다. 문제 5-1 의 <code>conv_grad_norms(plain_net(20), xb, yb)</code> 가 돌려주는 리스트 g20 의 길이는? (숫자만)", "a": ["19"], "w": "Conv2d 모듈마다 하나씩, 20 − 1 = 19 개 (plain-8 은 7 개). 가중치 층 20 = Conv 19 + Linear 1.", "an": "문제 5-1"}, {"type": "drop", "p": "BatchNorm 의 계산입니다. 빈칸에 알맞은 것을 고르세요.", "p2": "학습 때 <code>x̂ = (x − {}) / √(σ²_batch + ε)</code>, <code>y = {} · x̂ + {}</code> 로 계산하고, 추론 (<code>model.eval()</code>) 때는 배치 통계 대신 {} 을 쓴다.", "opts": [["μ_batch", "running_mean", "γ"], ["β", "γ", "ε"], ["γ", "β", "μ"], ["running 평균 · 분산", "test 배치의 평균 · 분산", "0 과 1"]], "a": [0, 1, 1, 0], "w": "배치 통계로 정규화한 뒤 γ 로 크기, β 로 위치를 다시 배웁니다. eval() 을 빼먹으면 test 배치 통계를 써서 결과가 배치마다 달라집니다.", "an": "5교시 · BatchNorm 다시 보기"}, {"type": "match", "p": "BN 을 쓸 때 자주 하는 실수와 결과를 짝지으세요.", "left": ["추론 때 <code>model.eval()</code> 누락", "배치 크기 1 로 BN 학습", "BN 바로 앞 Conv 에 <code>bias=True</code>", "BN 없이 plain 망을 20층으로"], "right": ["test 배치 통계를 써서 결과가 배치마다 달라짐", "분산을 구할 수 없어 오류 또는 불안정", "β 와 겹쳐 파라미터 낭비 (오류는 없음)", "입력 쪽 기울기가 사라져 학습이 잘 안 됨"], "a": [0, 1, 2, 3], "w": "eval() 은 BN 을 running 통계로 바꾸는 스위치입니다. Conv bias 는 BN 이 평균을 빼면서 지워지므로 의미가 없습니다.", "an": "5교시 · 자주 하는 실수"}, {"type": "order", "p": "문제 5-1 <code>conv_grad_norms(net, xb, yb)</code> 가 층별 기울기 크기를 구하는 순서로 배열하세요.", "items": ["<code>net.zero_grad()</code> 로 이전 기울기 비우기", "<code>net(xb)</code> 순전파 → logits", "<code>F.cross_entropy(logits, yb)</code> 로 손실", "<code>.backward()</code> 로 역전파", "Conv2d 마다 <code>m.weight.grad.norm()</code> 모으기"], "w": "학습 전 망에 배치 128 장을 한 번 넣고 역전파만 합니다 (갱신 없음). 리스트 앞쪽이 입력 쪽 층입니다.", "an": "문제 5-1"}, {"type": "hot", "p": "학습 전 plain-20 (BN 없음) 에 배치 하나를 넣고 역전파했습니다. Conv 층 가중치 기울기의 크기 (노름) 가 <b>가장 작아지는 (기울기 소실이 가장 심한) 구간</b>을 클릭하세요.", "w": "입력 쪽 Conv 층 1–5 입니다. 역전파는 출력에서 시작해 층마다 1 보다 작은 값을 곱하며 내려오므로 입력 쪽으로 갈수록 작아집니다. 실행 예: plain-20 첫 층 1.06e-09 vs 마지막 층 2.17e-02 (BN 을 넣으면 첫 층 3.39e-01).", "an": "D2-5 · 기울기 소실과 BatchNorm", "viewBox": "0 0 820 230", "sw": 820, "svg": "<defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#8a9bb8\"/></marker><marker id=\"ahr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#f87171\"/></marker></defs><text x=\"20\" y=\"22\" font-size=\"12\" fill=\"#dbe4f0\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">plain-20 (BN 없음) : 3×3 Conv 19 개 (16채널, 크기 유지) → GAP → Linear(16 → 10)</text><rect x=\"14\" y=\"70\" width=\"62\" height=\"90\" rx=\"6\" fill=\"#0f1a30\" stroke=\"#8a9bb8\" /><text x=\"45\" y=\"105\" font-size=\"11.5\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">입력</text><text x=\"45\" y=\"125\" font-size=\"11\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">xb</text><rect x=\"92\" y=\"70\" width=\"128\" height=\"90\" rx=\"6\" fill=\"#0f1a30\" stroke=\"#2dd4bf\" /><rect x=\"104.0\" y=\"88\" width=\"16\" height=\"36\" rx=\"3\" fill=\"#1c3a3a\" stroke=\"#2dd4bf\"/><rect x=\"126.0\" y=\"88\" width=\"16\" height=\"36\" rx=\"3\" fill=\"#1c3a3a\" stroke=\"#2dd4bf\"/><rect x=\"148.0\" y=\"88\" g,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">loss</text><line x1=\"743\" y1=\"115\" x2=\"755\" y2=\"115\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><path d=\"M780,140 L780,192 L45,192 L45,164\" fill=\"none\" stroke=\"#f87171\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\" marker-end=\"url(#ahr)\"/><text x=\"380\" y=\"212\" font-size=\"11.5\" fill=\"#f87171\" text-anchor=\"middle\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">역전파: 층을 지날 때마다 (가중치 × 국소 미분) 을 곱하며 입력 쪽으로</text><text x=\"20\" y=\"48\" font-size=\"11\" fill=\"#8a9bb8\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">← 입력 쪽 (층 1)</text><text x=\"742\" y=\"48\" font-size=\"11\" fill=\"#8a9bb8\" text-anchor=\"end\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">출력 쪽 →</text>", "regions": [{"id": "g1", "label": "Conv 층 1–5", "x": 92, "y": 70, "w": 128, "h": 90}, {"id": "g2", "label": "Conv 층 6–10", "x": 234, "y": 70, "w": 128, "h": 90}, {"id": "g3", "label": "Conv 층 11–15", "x": 376, "y": 70, "w": 128, "h": 90}, {"id": "g4", "label": "Conv 층 16–19", "x": 518, "y": 70, "w": 128, "h": 90}, {"id": "head", "label": "GAP + Linear", "x": 660, "y": 70, "w": 82, "h": 90}], "a": "g1"}, {"type": "code", "p": "문제 5-1 · 5-2 · 5-3 — 빈칸을 채우세요.", "code": "def conv_grad_norms(net, xb, yb):\n    net.zero_grad()\n    F.cross_entropy(net(xb), yb).backward()\n    return [m.weight.{{}}.norm().item() for m in net.modules() if isinstance(m, {{}})]\n\nsmall_loader = DataLoader(Subset(train_set, range({{}})), batch_size=128, shuffle=True)\n\nbn16 = nn.BatchNorm2d(16)\nn_learn = {{}}          # 32", "a": [["grad"], ["nn.Conv2d"], ["10000", "10_000"], ["count_params(bn16)", "sum(p.numel() for p in bn16.parameters())"]], "w": "기울기는 .grad, 합성곱 층만 골라 노름을 모읍니다. 5-2 는 train 앞 10,000 장으로 SGD lr 0.05 · 3 epoch. BN 학습 파라미터는 γ · β 32 개.", "an": "문제 5-3"}]}, {"t": "6교시 · ResNet", "anim": "D2-6 Residual 지름길", "qs": [{"type": "single", "p": "Residual 블록의 덧셈 <code>y = F(x) + x</code> 에서 역전파로 x 에 전해지는 국소 미분 ∂y/∂x 는?", "o": ["F'(x)", "F'(x) + 1", "F'(x) · x", "1 − F'(x)"], "a": 1, "w": "덧셈 노드는 기울기를 그대로 두 갈래로 보냅니다. F' 가 아무리 작아도 +1 이 남아 기울기가 입력 쪽까지 줄지 않고 흐릅니다.", "an": "D2-6 · Residual 지름길"}, {"type": "single", "p": "문제 6-1 — <code>BasicBlock(16, 32, stride=2)</code> 의 파라미터 수는? (Conv 는 모두 bias=False, 지름길 = 1×1 Conv + BN)", "o": ["13,952", "14,464", "13,824", "14,528"], "a": 3, "w": "conv1 16·32·9 = 4,608 · bn1 64 · conv2 32·32·9 = 9,216 · bn2 64 · 지름길 1×1 16·32 = 512 + BN 64 → 14,528. 13,952 는 지름길을 뺀 값입니다.", "an": "문제 6-1"}, {"type": "multi", "p": "<code>nn.Identity()</code> 가 아니라 <b>1×1 Conv + BN 지름길</b>이 만들어지는 블록을 모두 고르세요.", "o": ["<code>BasicBlock(16, 16)</code>", "<code>BasicBlock(16, 32, stride=2)</code>", "<code>BasicBlock(32, 32, stride=1)</code>", "<code>BasicBlock(16, 16, stride=2)</code>", "<code>BasicBlock(32, 64)</code>"], "a": [1, 3, 4], "w": "stride ≠ 1 (크기가 바뀜) 또는 cin ≠ cout (채널이 바뀜) 이면 x 를 그대로 더할 수 없어 1×1 Conv(stride) + BN 으로 모양을 맞춥니다.", "an": "문제 6-1"}, {"type": "ox", "p": "BatchNorm 을 넣으면 56층 plain 망도 20층 plain 망보다 train 오류가 낮아지므로, 깊이 문제는 BN 만으로 해결된다.", "a": false, "w": "2015년 Kaiming He 등은 BN 이 있어도 56층 plain 이 20층보다 train 오류가 높은 성능 저하 (degradation) 를 보였습니다. 여러 층으로 항등 함수를 배우기 어렵기 때문 → Residual.", "an": "6교시 · ResNet"}, {"type": "short", "p": "CIFAR 용 ResNet 은 블록 수 n 으로 깊이가 <b>6n + 2</b> 층입니다 (n = 3 → ResNet-20). n = 9 이면 몇 층인가요? (숫자만)", "a": ["56"], "w": "6 · 9 + 2 = 56 (ResNet-56). n = 18 이면 ResNet-110. 2 = stem Conv 1 + Linear 1, 6n = 단계 3개 × 블록 n × Conv 2.", "an": "6교시 · ResNet-20"}, {"type": "drop", "p": "ResNet-20 (CIFAR) 의 구조입니다. 빈칸에 알맞은 것을 고르세요.", "p2": "layer2 의 출력은 크기 {} · 채널 {} 이고, 그 첫 블록만 stride {} 이다. 마지막에는 거대한 FC 대신 {} 를 써서 FC 파라미터가 650 개뿐이다.", "opts": [["8×8", "16×16", "32×32"], ["32", "16", "64"], ["2", "1"], ["Flatten + Linear(4096, 10)", "GAP + Linear(64, 10)", "Dropout + Linear(64, 10)"]], "a": [1, 0, 0, 1], "w": "stem · layer1 32×32 16ch → layer2 16×16 32ch → layer3 8×8 64ch → GAP (N, 64, 1, 1) → Linear(64, 10) = 650. 전체 272,474 개로 VGG-mini 보다 적습니다.", "an": "문제 6-2"}, {"type": "match", "p": "ResNet-20 에 (N, 3, 32, 32) 를 넣을 때 각 단계의 출력 shape 를 짝지으세요.", "left": ["<code>layer1</code>", "<code>layer2</code>", "<code>layer3</code>", "<code>pool</code> (AdaptiveAvgPool2d(1))"], "right": ["(N, 16, 32, 32)", "(N, 32, 16, 16)", "(N, 64, 8, 8)", "(N, 64, 1, 1)"], "a": [0, 1, 2, 3], "w": "단계마다 크기 1/2, 채널 2배. GAP 는 채널마다 평균 하나를 남기고, flatten(1) 하면 (N, 64) 가 되어 Linear(64, 10) 에 들어갑니다.", "an": "문제 6-2"}, {"type": "order", "p": "<code>BasicBlock.forward(x)</code> (residual=True) 의 계산 순서로 배열하세요.", "items": ["<code>self.conv1(x)</code> — 3×3, stride", "<code>self.bn1</code> → <code>F.relu</code>", "<code>self.conv2</code> — 3×3, stride 1", "<code>self.bn2</code>", "<code>out + self.shortcut(x)</code>", "<code>F.relu(out)</code>"], "w": "덧셈은 bn2 뒤, 마지막 ReLU 앞입니다: y = ReLU(F(x) + shortcut(x)). residual=False 이면 덧셈만 빠진 plain 블록이 됩니다.", "an": "문제 6-1"}, {"type": "hot", "p": "<code>BasicBlock(16, 32, stride=2)</code> 의 구조입니다 (파라미터 14,528 개, Conv 는 bias=False). 이 중 <b>파라미터가 정확히 512 개</b>인 층을 클릭하세요.", "w": "지름길의 <code>Conv 1×1, 16→32, stride 2</code> 입니다: 32 · 16 · 1 · 1 = 512. 이 층이 x 를 (N, 32, 16, 16) 으로 바꿔 본류와 더할 수 있게 합니다. conv1 4,608 · conv2 9,216 · BN(32) 은 각 64.", "an": "D2-6 · Residual 지름길", "viewBox": "0 0 650 406", "sw": 650, "svg": "<defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#8a9bb8\"/></marker><marker id=\"ahr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#f87171\"/></marker></defs><rect x=\"90\" y=\"14\" width=\"200\" height=\"36\" rx=\"6\" fill=\"#0f1a30\" stroke=\"#8a9bb8\" /><text x=\"190.0\" y=\"32\" font-size=\"12\" fill= , "w": 240, "h": 44}, {"id": "bn2", "label": "BN(32) (bn2)", "x": 70, "y": 262, "w": 240, "h": 44}, {"id": "sc", "label": "지름길 Conv 1×1, 16→32, stride 2", "x": 380, "y": 138, "w": 250, "h": 44}, {"id": "scbn", "label": "지름길 BN(32)", "x": 380, "y": 200, "w": 250, "h": 44}, {"id": "add", "label": "덧셈 (+)", "shape": "circle", "x": 190.0, "y": 342, "r": 22}], "a": "sc"}, {"type": "code", "p": "문제 6-1 · 6-2 — <code>BasicBlock</code> 과 <code>make_layer</code> 의 빈칸을 채우세요.", "code": "class BasicBlock(nn.Module):\n    def __init__(self, cin, cout, stride=1, residual=True):\n        super().__init__()\n        self.residual = residual\n        self.conv1 = nn.Conv2d(cin, cout, 3, stride={{}}, padding=1, bias=False)\n        ...\n        if stride != 1 or cin != cout:\n            self.shortcut = nn.Sequential(nn.Conv2d(cin, cout, {{}}, stride=stride, bias=False), nn.BatchNorm2d(cout))\n        else:\n            self.shortcut = nn.Identity()\n\n    def forward(self, x):\n        out = F.relu(self.bn1(self.conv1(x)))\n        out = self.bn2(self.conv2(out))\n        if self.residual:\n            out = out + {{}}\n        return F.relu(out)\n\n# ResNet.make_layer\nblocks = [BasicBlock(cin, cout, stride, residual)]\nfor _ in range(n - 1):\n    blocks.append(BasicBlock({{}}, cout, 1, residual))", "a": [["stride"], ["1", "kernel_size=1"], ["self.shortcut(x)"], ["cout"]], "w": "첫 Conv 만 stride, 지름길은 1×1 Conv(stride), 블록의 나머지는 cout → cout. 실행 예 (6-3): 학습 전 stem 기울기는 BN 덕분에 둘 다 비슷하지만 (plain-20 9.84e-01 · ResNet-20 8.32e-01), 3 epoch 뒤 test 는 0.3803 vs 0.4432 로 지름길 쪽이 높습니다.", "an": "문제 6-2"}]}, {"t": "7교시 · 학습 기법", "anim": "D2-7 데이터 증강 · 학습률 스케줄", "qs": [{"type": "single", "p": "<code>OneCycleLR(opt, max_lr=0.1, epochs=15, steps_per_epoch=391)</code> (기본 설정) 의 <b>첫 step 학습률</b>은?", "o": ["0.1", "0.01", "0.004", "0.0004"], "a": 2, "w": "시작 학습률 = max_lr / 25 = 0.1 / 25 = 0.004. 30% 지점에서 0.1, 끝은 시작의 1/10⁴ = 4e-7.", "an": "문제 7-2"}, {"type": "single", "p": "같은 설정 (15 epoch × 391 = 5,865 "y": 58, "w": 60, "h": 162}], "a": "B"}, {"type": "code", "p": "문제 7-4 — forward hook 으로 MAC 을 세는 <code>count_macs</code> 의 빈칸을 채우세요.", "code": "def count_macs(model, input_size=(1, 3, 32, 32)):\n    total = [0]\n    def hook(m, inp, out):\n        if isinstance(m, nn.Conv2d):\n            cout, oh, ow = out.shape[1:]\n            total[0] += cout * oh * ow * (m.in_channels // {{}}) * m.kernel_size[0] * m.kernel_size[1]\n        elif isinstance(m, nn.Linear):\n            total[0] += m.in_features * {{}}\n    hs = [m.{{}}(hook) for m in model.modules() if isinstance(m, (nn.Conv2d, nn.Linear))]\n    model.eval()\n    with torch.no_grad():\n        model(torch.zeros(input_size))\n    for h in hs:\n        h.{{}}\n    return total[0]", "a": [["m.groups"], ["m.out_features"], ["register_forward_hook"], ["remove()"]], "w": "Conv MAC = Cout · OH · OW · (Cin / G) · K², Linear = in · out. hook 을 remove() 하지 않으면 다음 실행에 중복으로 불려 MAC 이 두 배로 셉니다. LeNet-5 = 651,720.", "an": "문제 7-4"}]}, {"t": "8교시 · 미니 프로젝트 — ResNet-20", "anim": "D2-8 ResNet-20 학습 · 오답 분석", "qs": [{"type": "single", "p": "과제 1 의 옵티마이저입니다. <code>weight_decay=5e-4</code> 는 무엇을 하나요?<pre>opt = torch.optim.SGD(model.parameters(), lr=0.1, momentum=0.9,\n                      nesterov=True, weight_decay=5e-4)</pre>", "o": ["학습률을 epoch 마다 5e-4 씩 줄인다", "momentum 이 쌓인 속도를 5e-4 비율로 줄인다", "기울기 크기를 5e-4 로 잘라 폭주를 막는다", "가중치를 0 쪽으로 조금씩 당기는 L2 규제 (NN Day 4)"], "a": 3, "w": "손실에 가중치 제곱합을 더하는 것과 같은 효과로 과적합을 줄입니다. 학습률 변화는 OneCycleLR 이 맡습니다.", "an": "과제 1"}, {"type": "single", "p": "GPU 를 받지 못해 CPU 런타임에서 과제 2 를 실행하면 어떻게 되나요?", "o": ["CPU 로 20 epoch 을 그대로 학습하고 점수도 똑같이 받는다", "강사가 학습한 가중치 (resnet20_cifar10.pt) 를 내려받아 이어서 진행하고, 과제 2 점수는 제외된다", "epoch 을 3 으로 줄여 학습하면 35점을 받는다", "채점 셀이 오류를 내고 모든 과제가 0점이 된다"], "a": 1, "w": "T4 GPU 로는 epoch 당 약 20초 · 20 epoch 약 7분 (예상) 이지만 CPU 로는 너무 오래 걸립니다. 과제 3~5 는 내려받은 가중치로 그대로 진행합니다.", "an": "과제 2"}, {"type": "multi", "p": "CIFAR-10 모델이 <b>흔히 헷갈리는 쌍</b>으로 과정에서 다룬 것을 모두 고르세요.", "o": ["cat ↔ dog", "frog ↔       }).join('');
      body = `<div class="hot"><svg viewBox="${q.viewBox}" width="${q.sw}" xmlns="http://www.w3.org/2000/svg">${q.svg}${regs}</svg></div>` +
        `<div class="hint" style="margin-top:6px">선택: <b style="color:var(--amber)">${a === null ? '없음' : esc((q.regions.find(r => r.id === a) || {}).label)}</b></div>`;
      break;
    }
    case 'flash':
      body = `<div class="card ${a.flipped ? 'flip' : ''}" data-k="${k}"><div class="in"><div class="f">${q.front}</div><div class="b">${q.back}</div></div></div>` +
        `<div class="selfrow"><button class="flipb" data-k="${k}" ${g ? 'disabled' : ''}>${a.flipped ? '앞면 보기' : '🔄 카드 뒤집기'}</button>` +
        `<button class="selfb ${a.self === true ? 'active' : ''}" data-k="${k}" data-v="1" ${g || !a.flipped ? 'disabled' : ''}>✅ 알았다</button>` +
        `<button class="selfb ${a.self === false ? 'active' : ''}" data-k="${k}" data-v="0" ${g || !a.flipped ? 'disabled' : ''}>❌ 몰랐다</button>` +
        `<span class="hint">${a.flipped ? '정답과 비교해 스스로 채점하세요.' : '먼저 답을 떠올린 뒤 뒤집으세요.'}</span></div>`;
      break;
    case 'code': {
      let i = 0;
      body = '<pre>' + esc(q.code).replace(/\{\{\}\}/g, () => {
        const n = i++;
        const w = Math.max(5, (q.a[n][0] || '').length + 2);
        const st = g ? `style="border-color:${q.a[n].some(x => norm(x) === norm(a[n])) ? 'var(--green)' : 'var(--red)'};width:${w}ch"` : `style="width:${w}ch"`;
        return `<input type="text" class="ci" data-k="${k}" data-n="${n}" value="${esc(a[n])}" ${dis} ${st} aria-label="빈칸 ${n + 1}">`;
      }) + '</pre>';
      break;
    }
  }
  const t = TYPES[q.type];
  const prompt = q.type === 'drop' ? (q.p || '') : (q.type === 'flash' ? (q.p || '카드 앞면의 질문에 답을 떠올린 뒤 뒤집어 확인하세요.') : q.p);
  let fb = '';
  if (g) {
    const right = q.type === 'flash' ? '' : `<div>정답: <b>${esc(fmt(q, a, true))}</b></div>`;
    fb = `<div class="fb ${ok ? 'ok' : 'bad'}"><b class="v">${ok ? '정답' : '오답'}</b>${right}${q.w}<span class="anim">확인: ${q.an}</span></div>`;
  }
  const un = !g && !answered(q, a) && attempted[tab] ? 'unans' : '';
  return `<div class="q ${g ? (ok ? 'ok' : 'bad') : un}"><div class="qh"><span class="n">문항 ${k + 1}</span><span class="ty" style="color:${t.c};border-color:${t.c}">${t.n}</span></div><div class="p">${prompt}</div>${body}${fb}</div>`;
}
const attempted = Q.map(() => false);
function render(){
  renderTabs();
  const s = Q[tab];
  $('#sheet').innerHTML = `<div class="head"><span class="t">${s.t}</span><span class="a">🎬 ${s.anim}</span></div>` + s.qs.map((q, k) => qHTML(q, k)).join('');
  bind();
  const nm = $('#name').value, g = graded[tab];
  if (g) {
    const sc = scoreOf(tab); $('#rscore').textContent = `${sc}/10`;
    if (nm.trim()) { $('#rcode').textContent = codeFor(nm, tab + 1, sc); $('#rhint').textContent = '결과 코드'; }
    else { $('#rcode').textContent = '—'; $('#rhint').textContent = '이름을 입력하면 결과 코드가 나옵니다.'; }
  } else {
    $('#rcode').textContent = '—'; $('#rscore').textContent = '';
    const n = ans[tab].filter((a, k) => answered(s.qs[k], a)).length;
    $('#rhint').textContent = `${tab + 1}교시: ${n}/10 응답. 채점하기를 누르면 잠깁니다.`;
  }
  $('#gradeBtn').disabled = g;
}
function bind(){
  const S = $('#sheet'), A = ans[tab];
  S.querySelectorAll('.opt[data-j]').forEach(b => b.onclick = () => {
    const k = +b.dataset.k, j = +b.dataset.j, q = Q[tab].qs[k];
    if (q.type === 'multi') { const i = A[k].indexOf(j); i < 0 ? A[k].push(j) : A[k].splice(i, 1); }
    else A[k] = A[k] === j ? null : j;
    render();
  });
  S.querySelectorAll('.oxb').forEach(b => b.onclick = () => { const k = +b.dataset.k, v = b.dataset.v === 'true'; A[k] = A[k] === v ? null : v; render(); });
  S.querySelectorAll('.sa').forEach(i => i.oninput = () => { A[+i.dataset.k] = i.value; renderTabs(); });
  S.querySelectorAll('.ci').forEach(i => i.oninput = () => { A[+i.dataset.k][+i.dataset.n] = i.value; renderTabs(); });
  S.querySelectorAll('.dd').forEach(s => s.onchange = () => { A[+s.dataset.k][+s.dataset.n] = +s.value; renderTabs(); });
  S.querySelectorAll('.mm').forEach(s => s.onchange = () => { A[+s.dataset.k][+s.dataset.i] = +s.value; renderTabs(); });
  S.querySelectorAll('.ord .mv button').forEach(b => b.onclick = () => {
    const k = +b.dataset.k, p = +b.dataset.pos, d = +b.dataset.d, arr = A[k];
    [arr[p], arr[p + d]] = [arr[p + d], arr[p]]; render();
  });
  S.querySelectorAll('.ord').forEach(ol => {
    const k = +ol.dataset.k; let from = null;
    ol.querySelectorAll('li').forEach(li => {
      li.addEventListener('dragstart', e => { from = +li.dataset.pos; li.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(from)); });
      li.addEventListener('dragend', () => li.classList.remove('drag'));
      li.addEventListener('dragover', e => { if (from !== null) { e.preventDefault(); li.classList.add('over'); } });
      li.addEventListener('dragleave', () => li.classList.remove('over'));
      li.addEventListener('drop', e => { e.preventDefault(); const to = +li.dataset.pos; if (from === null || from === to) return; const arr = A[k]; const [x] = arr.splice(from, 1); arr.splice(to, 0, x); from = null; render(); });
    });
  });
  S.querySelectorAll('.rg').forEach(r => {
    const pick = () => { if (graded[tab]) return; const k = +r.dataset.k; A[k] = A[k] === r.dataset.r ? null : r.dataset.r; render(); };
    r.addEventListener('click', pick);
    r.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
  });
  S.querySelectorAll('.flipb').forEach(b => b.onclick = () => { const k = +b.dataset.k; A[k].flipped = !A[k].flipped; render(); });
  S.querySelectorAll('.card').forEach(c => c.onclick = () => { if (graded[tab]) return; const k = +c.dataset.k; A[k].flipped = !A[k].flipped; render(); });
  S.querySelectorAll('.selfb').forEach(b => b.onclick = () => { const k = +b.dataset.k; A[k].self = b.dataset.v === '1'; render(); });
}

// ── 채점 · 결과 코드 ──
function hash(s){ let h = 5381; for (const c of s) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return h.toString(16).padStart(8, '0').slice(-4); }
function codeFor(name, t, score){ return `${t}${'ABCDEFGHIJK'[10 - score] || 'K'}-${hash(`${name.trim()}|${t}|${score}|vbday2`)}`; }
$('#gradeBtn').onclick = () => {
  const s = Q[tab], n = ans[tab].filter((a, k) => answered(s.qs[k], a)).length;
  attempted[tab] = true;
  if (n < 10 && !confirm(`아직 ${10 - n}문항에 답하지 않았습니다. 그래도 채점할까요? (미응답은 오답 처리)`)) { render(); return; }
  graded[tab] = true; render();
};
$('#resetBtn').onclick = () => {
  if (!confirm(`${tab + 1}교시 답을 모두 지우고 다시 풀까요?`)) return;
  graded[tab] = false; attempted[tab] = false;
  ans[tab] = Q[tab].qs.map((q, k) => init(q, `${tab}-${k}`)); render();
};
$('#name').oninput = render;

// ── 제출 · 오답 정리 ──
let lastHtml = '', lastText = '';
function buildReport(){
  const nm = $('#name').value.trim() || '(이름 없음)', ds = new Date().toLocaleString('ko-KR');
  let h = `<h3>Vision 기본 모델 Day 2 개념 워크시트 — 오답 정리</h3><div class="meta">${esc(nm)} · ${ds}</div>`;
  let t = `Vision 기본 모델 Day 2 개념 워크시트 — 오답 정리\n이름: ${nm}\n일시: ${ds}\n\n`;
  let tot = 0, cnt = 0;
  const byType = {};
  Q.forEach((s, i) => {
    if (!graded[i]) return;
    const sc = scoreOf(i); tot += sc; cnt++;
    s.qs.forEach((q, k) => { const b = byType[q.type] ||= [0, 0]; b[1]++; if (correct(q, ans[i][k])) b[0]++; });
    const code = $('#name').value.trim() ? codeFor($('#name').value, i + 1, sc) : '—';
    const wrong = s.qs.map((q, k) => ({ q, k, a: ans[i][k] })).filter(x => !correct(x.q, x.a));
    h += `<div class="sec">${esc(s.t)} — ${sc}/10 · 결과 코드 ${code}</div>`;
    t += `[${s.t}] ${sc}/10 · 결과 코드 ${code}\n`;
    if (!wrong.length) { h += `<div class="ok">전부 정답 🎉</div>`; t += '  전부 정답\n\n'; return; }
    h += '<table><tr><th>#</th><th>유형</th><th>문항</th><th>내 답</th><th>정답</th><th>다시 볼 곳</th></tr>';
    wrong.forEach(({ q, k, a }) => {
      const qt = strip(q.type === 'flash' ? q.front : (q.p || q.p2 || '')).replace(/\s+/g, ' ').slice(0, 70);
      const my = fmt(q, a, false), co = fmt(q, a, true);
      h += `<tr><td>${k + 1}</td><td>${TYPES[q.type].n}</td><td>${esc(qt)}</td><td class="bad">${esc(my)}</td><td class="ok">${esc(co)}</td><td>${esc(strip(q.an))}</td></tr>`;
      t += `  ${k + 1}. [${TYPES[q.type].n}] ${qt}\n     내 답: ${my}\n     정답: ${co}\n     다시 볼 곳: ${strip(q.an)}\n`;
    });
    h += '</table>'; t += '\n';
  });
  const notGraded = Q.map((s, i) => graded[i] ? null : i + 1).filter(x => x);
  const typeLine = Object.entries(byType).map(([k, [c, n]]) => `${TYPES[k].n} ${c}/${n}`).join(' · ');
  const sum = `<div class="sum"><span>채점한 교시 ${cnt}/8</span><span>합계 ${tot}/${cnt * 10}</span>${notGraded.length ? `<span class="none">미채점: ${notGraded.join(', ')}교시</span>` : ''}</div>` + (typeLine ? `<div class="meta">유형별 정답: ${typeLine}</div>` : '');
  h = h.replace('</div>', '</div>' + sum);
  t = t.replace('\n\n', `\n채점한 교시 ${cnt}/8 · 합계 ${tot}/${cnt * 10}${notGraded.length ? ' · 미채점 ' + notGraded.join(', ') + '교시' : ''}\n유형별 정답: ${typeLine}\n\n`);
  lastHtml = h; lastText = t;
  return h;
}
$('#submitBtn').onclick = () => {
  if (!graded.some(x => x)) { alert('먼저 한 교시 이상 채점하세요.'); return; }
  $('#dgBody').innerHTML = buildReport(); $('#toast').textContent = ''; $('#dlg').showModal();
};
$('#closeBtn').onclick = () => $('#dlg').close();
$('#captureBtn').onclick = async () => {
  const htmlDoc = `<meta charset="utf-8">` + lastHtml.replace(/ class="[^"]*"/g, '').replace(/<table>/g, '<table border="1" style="border-collapse:collapse">');
  try {
    if (navigator.clipboard && window.ClipboardItem) {
      await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([htmlDoc], { type: 'text/html' }), 'text/plain': new Blob([lastText], { type: 'text/plain' }) })]);
      $('#toast').textContent = '복사했습니다 — 노션에 붙여 넣으세요.'; return;
    }
  } catch (e) {}
  const ta = document.createElement('textarea'); ta.value = lastText; ta.style.position = 'fixed'; ta.style.opacity = '0';
  $('#dlg').appendChild(ta); ta.focus(); ta.select();
  const ok = document.execCommand('copy'); ta.remove();
  $('#toast').textContent = ok ? '텍스트로 복사했습니다.' : '복사하지 못했습니다 — 직접 선택해 복사하세요.';
};

$('#legend').innerHTML = Object.values(TYPES).map(t => `<span class="tag" style="color:${t.c};border-color:${t.c}55">${t.n}</span>`).join('');
// worksheet.html#t3 → 3교시 탭으로 바로 열기 (노트북 교시별 링크)
function fromHash(){ const m = location.hash.match(/^#t([1-8])$/); if (m) { tab = +m[1] - 1; } }
fromHash();
window.addEventListener('hashchange', () => { fromHash(); render(); window.scrollTo({ top: 0 }); });
render();
</script>
</body>
