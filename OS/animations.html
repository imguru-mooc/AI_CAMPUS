<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>운영체제 활용 24H · PRO 인터랙티브 애니메이션 LAB</title>
<style>
:root{--bg:#07101d;--panel:#101c31;--panel2:#162640;--panel3:#0b1629;--text:#f4f8ff;--muted:#9fb1cf;--blue:#65a6ff;--cyan:#5fe0e7;--green:#61deb0;--amber:#ffc85b;--red:#ff7484;--line:#2c4267}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 75% 0,#12294b 0,#08121f 38%,#060d18 100%);color:var(--text);font-family:Inter,Pretendard,"Noto Sans KR",system-ui,sans-serif}button,input,select{font:inherit}.app{max-width:1600px;margin:auto;padding:16px}.top{position:sticky;top:8px;z-index:30;background:rgba(15,27,48,.92);backdrop-filter:blur(15px);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:16px 18px;display:flex;justify-content:space-between;gap:16px;align-items:center;box-shadow:0 20px 60px rgba(0,0,0,.28)}h1{font-size:clamp(21px,2.5vw,34px);margin:0;letter-spacing:-.03em}.sub{color:var(--muted);font-size:12.5px;margin-top:5px}.global{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid rgba(255,255,255,.11);background:#192b49;color:#fff;border-radius:11px;padding:9px 12px;cursor:pointer}.btn:hover{background:#233b61}.btn.primary{background:linear-gradient(135deg,#477de9,#59a8ff);border:0}.btn.good{background:linear-gradient(135deg,#168776,#31b99a);border:0}.btn.warn{background:linear-gradient(135deg,#9f6812,#d69528);border:0}.btn.danger{background:linear-gradient(135deg,#8c3445,#cf5264);border:0}.layout{display:grid;grid-template-columns:245px 1fr;gap:14px;margin-top:14px}.nav{background:rgba(15,27,48,.76);border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:9px;height:calc(100vh - 120px);position:sticky;top:105px;overflow:auto}.nav button{width:100%;border:0;background:transparent;color:#b6c5de;border-radius:10px;padding:10px;text-align:left;cursor:pointer}.nav button:hover,.nav button.on{background:#172941;color:#fff}.nav button.on{outline:1px solid rgba(101,166,255,.28)}.main{min-width:0}.head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin:4px 0 12px}.head h2{font-size:clamp(24px,3vw,38px);margin:0}.head p{margin:5px 0 0;color:var(--muted)}.badge{font-size:11px;color:#aef4df;border:1px solid rgba(97,222,176,.34);border-radius:99px;padding:6px 10px;background:rgba(97,222,176,.09)}.toolbar{background:rgba(15,27,48,.82);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:10px 12px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}.toolbar label{font-size:12px;color:#b9c7df;display:flex;gap:6px;align-items:center}.toolbar select,.toolbar input[type=range]{accent-color:#6aa8ff}.toolbar select{background:#0c1728;color:#fff;border:1px solid #334a70;border-radius:8px;padding:7px}.board{margin-top:12px;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(310px,.8fr);gap:12px}.leftcol,.rightcol{display:flex;flex-direction:column;gap:12px}.panel{background:rgba(12,22,39,.88);border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:14px;box-shadow:0 14px 36px rgba(0,0,0,.18)}.panel h3{font-size:15px;margin:0 0 10px}.flowBoard{height:250px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 45%,rgba(72,121,205,.16),transparent 45%),#081322;border-radius:14px;border:1px solid rgba(255,255,255,.06);padding:20px}.nodes{height:100%;display:flex;align-items:center;justify-content:space-between;gap:9px;position:relative;z-index:2}.node{flex:1;min-width:80px;min-height:74px;border:1px solid #314968;background:#142641;border-radius:13px;padding:11px 7px;text-align:center;display:grid;place-items:center;color:#c7d4e9;transition:.35s;position:relative}.node::after{content:"";position:absolute;right:-14px;top:50%;width:18px;height:2px;background:#39587e}.node:last-child::after{display:none}.node.on{background:#235687;border-color:#68b1ff;transform:translateY(-7px);box-shadow:0 0 25px rgba(87,167,255,.25)}.node.bad{background:#612f3a;border-color:#ef7180}.node.good{background:#245848;border-color:#69d7af}.token{position:absolute;z-index:6;width:20px;height:20px;border-radius:50%;background:var(--cyan);box-shadow:0 0 22px rgba(95,224,231,.9);left:0;top:0;transition:all .55s cubic-bezier(.2,.8,.2,1);pointer-events:none}.token::after{content:"";position:absolute;inset:-7px;border:1px solid rgba(95,224,231,.25);border-radius:50%;animation:ring 1.2s infinite}@keyframes ring{50%{transform:scale(1.4);opacity:.2}}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{background:#0c182b;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:10px}.metric b{font-size:11px;color:#aabbd5}.metric strong{display:block;font-size:19px;margin-top:4px}.meter{height:7px;background:#263a58;border-radius:99px;overflow:hidden;margin-top:6px}.meter i{height:100%;width:10%;display:block;background:linear-gradient(90deg,var(--blue),var(--green));transition:.4s}.detail{min-height:310px}.log{height:215px;overflow:auto;background:#050d18;border-radius:11px;border:1px solid rgba(255,255,255,.06);padding:10px;font:12px ui-monospace,SFMono-Regular,Consolas,monospace;color:#bcd7ff;white-space:pre-wrap}.mission{line-height:1.55;color:#c6d2e5;font-size:13px}.mission b{color:var(--amber)}.statusbar{display:flex;gap:7px;align-items:center;margin-top:8px;font-size:12px;color:#aebed7}.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 10px rgba(97,222,176,.6)}.queue{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:48px}.q{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;background:#29578b;font-weight:700;font-size:12px;transition:.3s}.q.run{background:#277561;transform:translateY(-5px)}.q.wait{background:#7e5b25}.q.bad{background:#773440}.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}.cell{height:31px;border-radius:5px;background:#1d304c;border:1px solid rgba(255,255,255,.05);transition:.3s}.cell.on{background:#397bc1}.cell.hot{background:#a06827}.cell.swap{background:#6d4d93}.cell.bad{background:#8d3547}.tree{font:12px ui-monospace,monospace;line-height:1.65;color:#c5d5ed}.tree .hi{color:#70d8bd;font-weight:700}.gantt{height:90px;display:flex;align-items:stretch;gap:3px;margin-top:8px}.gantt div{flex:1;border-radius:6px;background:#25496f;display:grid;place-items:center;font-size:11px}.gantt .on{background:#438cda}.gantt .switch{background:#8a612e}.packetLane{height:84px;border:1px dashed #385579;border-radius:12px;position:relative;margin:10px 0}.packet{position:absolute;width:36px;height:25px;border-radius:7px;background:#337bc1;top:28px;display:grid;place-items:center;font-size:10px;transition:left .45s}.packet.lost{background:#883647;opacity:.6}.temperature{font-size:36px;font-weight:900}.evidence{display:grid;grid-template-columns:1fr 1fr;gap:7px}.ev{padding:9px;border-radius:9px;background:#142640;border:1px solid #2c4267;font-size:12px}.ev.on{border-color:#69d8b0;background:#194536}.challenge{margin-top:8px;padding:9px;border:1px dashed #4a6286;border-radius:10px;color:#bac9df;font-size:12px}.footerNav{display:flex;justify-content:space-between;margin-top:12px}@media(max-width:1050px){.layout{grid-template-columns:1fr}.nav{position:static;height:auto;display:flex;overflow-x:auto}.nav button{min-width:190px}.board{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.top{position:static;align-items:flex-start;flex-direction:column}}
</style>
</head><body>
<div class="app"><header class="top"><div><h1>운영체제 활용 24H · PRO 인터랙티브 애니메이션 LAB</h1><div class="sub">단계 실행 · 자동 재생 · 시나리오 · 속도 조절 · 실시간 로그 · 상태/Queue/자원 변화 · 챌린지</div></div><div class="global"><button class="btn" onclick="resetLab()">↺ Reset</button><button class="btn primary" id="playBtn" onclick="togglePlay()">▶ Auto Play</button><button class="btn good" onclick="stepLab()">⏭ Step</button></div></header>
<div class="layout"><aside class="nav" id="nav"></aside><main class="main"><div class="head"><div><h2 id="title"></h2><p id="desc"></p></div><span class="badge">PRO SIMULATION</span></div><div class="toolbar"><label>시나리오 <select id="scenario" onchange="resetLab()"></select></label><label>속도 <input id="speed" type="range" min="350" max="1400" value="750" step="50"><span id="speedLabel">0.75s</span></label><span id="params"></span></div><div class="board"><div class="leftcol"><section class="panel"><h3>① 동작 워크플로우</h3><div class="flowBoard" id="flowBoard"><div class="nodes" id="nodes"></div><div class="token" id="token"></div></div><div class="statusbar"><span class="dot"></span><span id="stateText">준비</span></div></section><section class="panel"><h3>② 실시간 상태 / 내부 구조</h3><div class="detail" id="detail"></div></section></div><div class="rightcol"><section class="panel"><h3>③ 핵심 지표</h3><div class="metrics" id="metrics"></div></section><section class="panel"><h3>④ Event Log</h3><div class="log" id="log"></div></section><section class="panel mission"><h3>⑤ 학습 미션</h3><div id="mission"></div><div class="challenge" id="challenge"></div></section></div></div><div class="footerNav"><button class="btn" onclick="go(-1)">← 이전 챕터</button><button class="btn primary" onclick="go(1)">다음 챕터 →</button></div></main></div></div>
<script>
const defs=[
{t:'01. 운영체제 개요',d:'User Space↔Kernel Space, 자원 중재, Driver/HW, RTOS 응답 특성을 한 흐름으로 관찰합니다.',nodes:['User App','System Call','Kernel Policy','Driver','Hardware','Result'],sc:['파일 읽기','카메라 프레임','AI 추론','RTOS Deadline'],metrics:['CPU','RAM','I/O','Latency'],mission:'<b>예측:</b> 요청 종류를 바꾸면 어느 자원 게이지가 가장 크게 변할까요?',challenge:'미션: AI 추론과 RTOS Deadline을 각각 실행하고 “평균 성능”과 “응답시간 예측 가능성”의 차이를 설명하세요.'},
{t:'02. Linux 운영환경',d:'경로 탐색, 권한 검사, PATH 검색, /proc·/sys·/dev 노드 생성을 이벤트 순서로 추적합니다.',nodes:['명령 입력','PATH 검색','권한 검사','Process 생성','/proc','/sys·/dev'],sc:['정상 실행','실행권한 없음','PATH 미등록','Camera Hot Plug'],metrics:['Search','Permission','PID','Device'],mission:'<b>예측:</b> 실행 파일은 있는데 Permission denied라면 어느 단계에서 멈출까요?',challenge:'미션: PATH 오류와 실행권한 오류를 각각 재현하고, 둘을 구분할 수 있는 증거를 적으세요.'},
{t:'03. 프로세스와 스레드',d:'New→Ready→Running→Waiting 상태 전이와 fork/exec, Thread Race/Mutex를 연결합니다.',nodes:['New','Ready','Running','Waiting','Ready','Terminated'],sc:['CPU 작업','I/O 요청','fork + exec','Thread Race'],metrics:['Ready Q','Threads','Switch','Counter'],mission:'<b>예측:</b> Running 프로세스가 I/O를 요청하면 CPU는 누구에게 넘어갈까요?',challenge:'미션: Race 시나리오에서 Counter가 기대값보다 작아지는 순간을 찾고 Mutex가 무엇을 바꾸는지 설명하세요.'},
{t:'04. CPU 스케줄링',d:'FCFS/SJF/Priority/RR과 Context Switch, Multi-Core 배정을 같은 프로세스 집합으로 비교합니다.',nodes:['Ready Queue','Scheduler','Dispatch','CPU','Context SW','Complete'],sc:['FCFS','SJF','Priority','Round Robin'],metrics:['Wait Avg','Switch','CPU','Throughput'],mission:'<b>예측:</b> RR Quantum을 줄이면 반응성과 Context Switch는 각각 어떻게 변할까요?',challenge:'미션: SJF와 RR을 비교하여 평균 대기시간과 반응성 중 어떤 목표가 우선되는지 설명하세요.'},
{t:'05. 메모리 관리',d:'Virtual Page→Page Table→TLB/Frame→Page Fault→Swap/OOM 흐름을 단계적으로 실행합니다.',nodes:['Virtual Addr','TLB','Page Table','RAM Frame','Page Fault','Disk/Swap'],sc:['Page Hit','Page Fault','Replacement','Memory Pressure'],metrics:['RAM','Faults','Swap','Latency'],mission:'<b>예측:</b> Page Fault는 오류일까요, 정상적인 메모리 관리 사건일까요?',challenge:'미션: Page Hit와 Page Fault의 Latency 차이를 관찰하고 Thrashing이 시작될 조건을 말하세요.'},
{t:'06. 파일시스템',d:'Filename→Directory Entry→inode→Data Block→Open/Unlink→Mount 상태를 추적합니다.',nodes:['Filename','Directory','inode','Block','Open FD','Read/Write'],sc:['파일 읽기','Hard Link','unlink','USB Mount'],metrics:['Links','Blocks','Open FD','Disk I/O'],mission:'<b>예측:</b> unlink 후에도 프로세스가 파일을 열어두면 Block이 즉시 반환될까요?',challenge:'미션: Hard Link가 있는 상태에서 unlink를 수행하고 link count와 Block 상태를 설명하세요.'},
{t:'07. 장치와 I/O',d:'Camera→Driver→Ring Buffer→RAM→App 흐름에서 Polling/Interrupt/DMA와 Frame Drop을 비교합니다.',nodes:['Camera','Driver','IRQ/DMA','Ring Buffer','RAM','App'],sc:['Polling','Interrupt','DMA','Buffer Overflow'],metrics:['CPU','FPS','Drop','Latency'],mission:'<b>예측:</b> Input FPS가 처리 FPS보다 높으면 먼저 증가하는 것은 Drop일까요, Queue일까요?',challenge:'미션: Buffer 크기를 바꾸며 Drop과 Latency의 Trade-off를 찾으세요.'},
{t:'08. 시스템 콜',d:'Binary Load→execve→open/read→Kernel→Storage→User Buffer와 FD/Pipe 변화를 추적합니다.',nodes:['Binary','Loader','User Mode','syscall','Kernel','Return'],sc:['execve','read()','pipe()','Permission Error'],metrics:['Syscalls','FD','Copies','Latency'],mission:'<b>예측:</b> read() 실행 시 User Mode와 Kernel Mode가 몇 번 전환될까요?',challenge:'미션: read()와 pipe()의 공통점과 차이를 FD 관점에서 설명하세요.'},
{t:'09. 부팅과 서비스',d:'Firmware→Bootloader→Kernel→systemd→Dependency→Service와 journal 로그를 시간축으로 추적합니다.',nodes:['Firmware','Bootloader','Kernel','systemd','Dependency','Service'],sc:['정상 Boot','Network Dependency Fail','Service Crash','Auto Restart'],metrics:['Boot Time','Services','Restart','Errors'],mission:'<b>예측:</b> network가 늦게 준비되면 camera.service는 어느 단계에서 실패할까요?',challenge:'미션: Auto Restart가 문제를 숨길 수 있는 이유를 journal 로그와 함께 설명하세요.'},
{t:'10. 네트워크와 OS',d:'Socket Bind→Listen→SYN/SYN-ACK/ACK→Data→Loss/Retransmit→Close를 패킷 수준으로 추적합니다.',nodes:['Socket','Bind','Listen','Handshake','Data','Close'],sc:['정상 TCP','Packet Loss','UDP','Port Conflict'],metrics:['RTT','Loss','Retrans','Sockets'],mission:'<b>예측:</b> Packet Loss가 증가하면 TCP의 Latency와 Throughput은 어떻게 변할까요?',challenge:'미션: Port Conflict와 Packet Loss를 각각 재현하고 “연결 자체 실패”와 “연결 후 성능 저하”를 구분하세요.'},
{t:'11. 온디바이스 AI 자원',d:'Camera→Buffer→CPU Preprocess→GPU/NPU→Postprocess에서 자원·Queue·Thermal을 함께 관찰합니다.',nodes:['Camera','Frame Buffer','CPU','GPU/NPU','Postprocess','Result'],sc:['Balanced','CPU Bottleneck','NPU Bottleneck','Thermal Throttle'],metrics:['CPU','Accel','FPS','Temp'],mission:'<b>예측:</b> GPU 사용률이 낮다고 GPU가 병목이 아니라고 바로 결론 내릴 수 있을까요?',challenge:'미션: CPU Bottleneck과 Thermal Throttle을 비교해 FPS가 떨어지는 원인이 어떻게 다른지 설명하세요.'},
{t:'12. 종합 장애 분석',d:'증상→신속 점검→증거 수집→가설→조치→재검증을 OS 탐정 방식으로 수행합니다.',nodes:['Symptom','Quick Check','Evidence','Hypothesis','Fix','Verify'],sc:['Memory Leak','Disk Full','Camera Missing','Service Loop'],metrics:['CPU','RAM','Disk','Confidence'],mission:'<b>예측:</b> 첫 번째 비정상 지표가 항상 Root Cause일까요?',challenge:'미션: 최소 3개 증거를 모은 뒤에만 가설을 선택하고, 수정 후 동일 조건으로 Verify까지 완료하세요.'}
];
let cur=0,step=0,timer=null,playing=false,history=[],detailState={};
const $=s=>document.querySelector(s);const nav=$('#nav');defs.forEach((d,i)=>{const b=document.createElement('button');b.textContent=d.t;b.onclick=()=>show(i);nav.appendChild(b)});
function log(msg,type=''){const l=$('#log');const tm=new Date().toLocaleTimeString();l.textContent+=`[${tm}] ${type?type+' ':''}${msg}\n`;l.scrollTop=l.scrollHeight}
function show(i){stop();cur=Math.max(0,Math.min(defs.length-1,i));step=0;history=[];detailState={};[...nav.children].forEach((b,n)=>b.classList.toggle('on',n===cur));const d=defs[cur];$('#title').textContent=d.t;$('#desc').textContent=d.d;$('#scenario').innerHTML=d.sc.map(x=>`<option>${x}</option>`).join('');$('#mission').innerHTML=d.mission;$('#challenge').textContent=d.challenge;renderNodes();renderParams();renderMetrics();renderDetail();$('#log').textContent='';log('Lab initialized');setState('준비 · Step 또는 Auto Play를 눌러 시작하세요.');setTimeout(moveToken,80);const u=new URL(location.href);u.searchParams.set('ch',cur+1);history.replaceState(null,'',u)}
function renderNodes(){const d=defs[cur];$('#nodes').innerHTML=d.nodes.map((n,i)=>`<div class="node" data-i="${i}">${n}</div>`).join('')}
function renderParams(){let h='';switch(cur){case 3:h='<label>Quantum <input id="p1" type="range" min="1" max="6" value="2"></label><label>Cores <input id="p2" type="range" min="1" max="4" value="2"></label>';break;case 4:h='<label>Frames <input id="p1" type="range" min="3" max="8" value="5"></label><label>Policy <select id="p2"><option>LRU</option><option>FIFO</option></select></label>';break;case 6:h='<label>Input FPS <input id="p1" type="range" min="10" max="60" value="30"></label><label>Buffer <input id="p2" type="range" min="2" max="10" value="5"></label>';break;case 10:h='<label>Model <input id="p1" type="range" min="1" max="5" value="3"></label><label>Load <input id="p2" type="range" min="20" max="100" value="55"></label>';break;default:h='<label>Intensity <input id="p1" type="range" min="1" max="10" value="5"></label>'}$('#params').innerHTML=h}
function renderMetrics(){const d=defs[cur];$('#metrics').innerHTML=d.metrics.map((m,i)=>`<div class="metric"><b>${m}</b><strong id="mv${i}">0</strong><div class="meter"><i id="mb${i}"></i></div></div>`).join('');for(let i=0;i<4;i++)metric(i,10,'')}
function metric(i,v,suffix='%'){const e=$(`#mv${i}`),b=$(`#mb${i}`);if(e)e.textContent=Math.round(v)+(suffix||'');if(b)b.style.width=Math.max(3,Math.min(100,v))+'%'}
function setState(t){$('#stateText').textContent=t}
function moveToken(){const node=document.querySelector(`.node[data-i="${Math.min(step,defs[cur].nodes.length-1)}"]`),board=$('#flowBoard'),tok=$('#token');if(!node)return;document.querySelectorAll('.node').forEach((n,i)=>n.classList.toggle('on',i===Math.min(step,defs[cur].nodes.length-1)));const r=node.getBoundingClientRect(),br=board.getBoundingClientRect();tok.style.left=(r.left-br.left+r.width/2-10)+'px';tok.style.top=(r.top-br.top+r.height/2-10)+'px'}
function togglePlay(){playing?stop():play()}
function play(){playing=true;$('#playBtn').textContent='⏸ Pause';const tick=()=>{if(!playing)return;stepLab();if(step>=defs[cur].nodes.length){playing=false;$('#playBtn').textContent='▶ Auto Play';return}timer=setTimeout(tick,+$('#speed').value)};tick()}
function stop(){playing=false;clearTimeout(timer);$('#playBtn')&&($('#playBtn').textContent='▶ Auto Play')}
function resetLab(){stop();step=0;history=[];detailState={};renderMetrics();renderDetail();$('#log').textContent='';log(`Scenario: ${$('#scenario').value}`);setState('Reset 완료');moveToken()}
