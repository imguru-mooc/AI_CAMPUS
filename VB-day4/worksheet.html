<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vision 기본 모델 Day 4 개념 워크시트</title>
<style>
  :root{--bg:#0b1220;--panel:#111a2e;--line:#1f2b45;--text:#dbe4f0;--dim:#8a9bb8;--amber:#f5b942;--teal:#2dd4bf;--blue:#60a5fa;--green:#4ade80;--red:#f87171;--purple:#c084fc;--mono:"Consolas","D2Coding","JetBrains Mono",monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR","Segoe UI",sans-serif;font-size:15px;line-height:1.55}
  .app{max-width:920px;margin:0 auto;padding:22px 20px 40px}
  h1{color:var(--amber);font-size:24px;margin:0 0 6px}
  .sub{color:var(--dim);margin:0 0 14px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
  .panel h2{font-size:14px;color:var(--dim);margin:0 0 10px;font-weight:600}
  button{background:#172239;border:1px solid #2a3a5c;color:var(--text);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--amber)}button.active{background:#3a2e12;border-color:var(--amber);color:var(--amber)}
  button.primary{background:#123d33;border-color:var(--teal);color:var(--teal);font-weight:700;padding:9px 18px;font-size:14px}
  button.submit{background:#3a2e12;border-color:var(--amber);color:var(--amber);font-weight:700;padding:9px 18px;font-size:14px}
  button:disabled{opacity:.5;cursor:default}
  button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  input[type=text]{background:#0a0f1c;color:var(--text);border:1px solid #2a3a5c;border-radius:6px;padding:6px 10px;font-family:var(--mono);font-size:14px}
  select{background:#0a0f1c;color:var(--text);border:1px solid #2a3a5c;border-radius:6px;padding:4px 8px;font-family:inherit;font-size:14px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px}
  .tabs button .s{font-family:var(--mono);font-size:11px;color:var(--dim);margin-left:6px}
  .tabs button.graded .s{color:var(--green)}
  .legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .tag{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--dim);font-family:var(--mono)}
  .head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .head .t{color:var(--amber);font-size:17px}
  .head .a{font-size:13px;color:var(--teal);font-family:var(--mono)}
  .q{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;background:#0e1628}
  .q.unans{border-color:#5a3a1a}
  .q.ok{border-color:#1f6b45}.q.bad{border-color:#7a2e2e}
  .qh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .q .n{font-family:var(--mono);color:var(--dim);font-size:12px}
  .ty{font-size:11.5px;border-radius:999px;padding:1px 9px;border:1px solid}
  .q .p{margin:6px 0 10px;font-size:15px}
  .q code,.fb code,.dg code{font-family:var(--mono);color:var(--blue);background:#0a0f1c;padding:1px 5px;border-radius:4px}
  .q pre{font-family:var(--mono);background:#0a0f1c;border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:6px 0 4px;font-size:14px;white-space:pre;overflow-x:auto;line-height:1.9}
  .q pre input{font-size:13px;padding:2px 6px;width:auto;min-width:5ch}
  .opts{display:grid;gap:6px}
  .opt{text-align:left;padding:8px 12px;font-size:14px}
  .opt .box{display:inline-block;width:18px;font-family:var(--mono);color:var(--dim)}
  .opt.sel{border-color:var(--amber);background:#1f1a0c}
  .opt.ok{border-color:var(--green);color:var(--green);background:#0d2216}
  .opt.bad{border-color:var(--red);color:var(--red);background:#2a1212}
  .opt.miss{border-color:var(--green);border-style:dashed}
  .ox{display:flex;gap:10px}
  .ox button{font-size:22px;width:78px;height:54px;font-weight:700}
  .fill{line-height:2.3}
  .mrow{display:grid;grid-template-columns:1fr 24px minmax(160px,1.2fr);gap:8px;align-items:center;margin-bottom:6px}
  .mrow .l{background:#0a0f1c;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:14px}
  .mrow select{width:100%}
  .mrow .arr{color:var(--dim);text-align:center}
  .mrow.ok select{border-color:var(--green)}.mrow.bad select{border-color:var(--red)}
  .ord{list-style:none;margin:0;padding:0;display:grid;gap:6px}
  .ord li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;background:#0a0f1c;border:1px solid #2a3a5c;border-radius:8px;padding:7px 10px;cursor:grab;font-size:14px}
  .ord li.drag{opacity:.4}.ord li.over{border-color:var(--amber)}
  .ord li .k{font-family:var(--mono);color:var(--dim)}
  .ord li .mv button{padding:2px 8px;margin-left:4px}
  .ord li.ok{border-color:var(--green)}.ord li.bad{border-color:var(--red)}
  .hot{background:#0a0f1c;border:1px solid var(--line);border-radius:8px;padding:6px;overflow-x:auto}
  .hot svg{display:block;max-width:100%;height:auto;margin:0 auto}
  .hot .rg{cursor:pointer;fill:transparent;stroke:transparent;stroke-width:2.5}
  .hot .rg:hover{stroke:#f5b94288}
  .hot .rg.sel{stroke:var(--amber);fill:#f5b94222}
  .hot .rg.ok{stroke:var(--green);fill:#4ade8026}
  .hot .rg.bad{stroke:var(--red);fill:#f8717126}
  .card{perspective:900px;max-width:560px}
  .card .in{position:relative;min-height:130px;transition:transform .5s;transform-style:preserve-3d}
  .card.flip .in{transform:rotateY(180deg)}
  .card .f,.card .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;border:1px solid #2a3a5c;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px 18px;font-size:16px}
  .card .f{background:#14203a;color:var(--amber)}
  .card .b{background:#0f2a27;color:var(--teal);transform:rotateY(180deg)}
  @media (prefers-reduced-motion:reduce){.card .in{transition:none}}
  .selfrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
  .selfrow .hint{margin-left:4px}
  .fb{margin-top:10px;font-size:13px;color:var(--dim);border-left:3px solid var(--line);padding-left:10px}
  .fb.ok{border-left-color:var(--green)}.fb.bad{border-left-color:var(--red)}
  .fb b.v{display:block;margin-bottom:2px}
  .fb.ok b.v{color:var(--green)}.fb.bad b.v{color:var(--red)}
  .fb .anim{color:var(--teal);font-family:var(--mono);font-size:12px;display:block;margin-top:3px}
  .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
  .code{font-family:var(--mono);font-size:20px;color:var(--amber);letter-spacing:1px}
  .score{font-family:var(--mono);color:var(--green);font-size:16px}
  .hint{color:var(--dim);font-size:13px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:0;max-width:860px;width:92vw;max-height:88vh}
  dialog::backdrop{background:#000a}
  .dg{padding:18px 20px}
  .dg h3{color:var(--amber);margin:0 0 4px;font-size:20px}
  .dg .meta{color:var(--dim);font-size:13px;margin-bottom:12px;font-family:var(--mono)}
  .dg .sec{margin:14px 0 6px;color:var(--teal);font-weight:700;font-size:14px}
  .dg table{width:100%;border-collapse:collapse;font-size:13px}
  .dg th{text-align:left;color:var(--dim);font-weight:600;padding:5px 8px;border-bottom:1px solid var(--line);font-size:12px}
  .dg td{padding:5px 8px;border-bottom:1px solid #16203a;vertical-align:top}
  .dg .ok{color:var(--green)}.dg .bad{color:var(--red)}.dg .none{color:var(--dim)}
  .dg .sum{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0;font-family:var(--mono)}
  .dgbar{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 20px;display:flex;gap:8px;justify-content:flex-end;align-items:center}
  .toast{color:var(--green);font-size:13px;margin-right:auto}
  .body{overflow:auto;max-height:calc(88vh - 60px)}
  @media(max-width:600px){.mrow{grid-template-columns:1fr;gap:4px}.mrow .arr{display:none}}
</style>
</head>
<body>
<div class="app">
  <h1>Vision 기본 모델 Day 4 개념 워크시트</h1>
  <p class="sub">교시마다 10문항 — 객관식 · O/X · 빈칸 · 짝 맞추기 · 순서 배열 · 핫스팟 · 코드 완성 등 9가지 유형이 섞여 나옵니다. 답을 고른 뒤 아래 <b style="color:var(--teal)">채점하기</b>를 누르면 정오 · 해설과 결과 코드가 나타납니다. 채점 전에는 답을 바꿀 수 있고, 채점 후에는 잠깁니다. 모든 교시를 마치면 <b style="color:var(--amber)">제출</b>로 오답 정리를 열고, <b>캡처</b>로 복사해 노션에 붙여 넣으세요.</p>

  <div class="panel">
    <div class="row"><label style="color:var(--dim);font-size:13px">이름 <input type="text" id="name" placeholder="홍길동"></label><span class="hint">이름은 결과 코드 계산에만 쓰이며 저장되지 않습니다.</span></div>
  </div>
  <div class="panel"><h2>교시</h2><div class="tabs" id="tabs"></div><div class="legend" id="legend"></div></div>
  <div class="panel" id="sheet"></div>
  <div class="panel">
    <div class="actions">
      <button class="primary" id="gradeBtn">채점하기</button>
      <span class="score" id="rscore"></span>
      <span class="hint" id="rhint"></span>
      <span class="code" id="rcode">—</span>
    </div>
    <div class="actions" style="margin-top:12px">
      <button class="submit" id="submitBtn">제출 (오답 정리)</button>
      <button id="resetBtn">이 교시 다시 풀기</button>
    </div>
  </div>
</div>

<dialog id="dlg">
  <div class="body"><div class="dg" id="dgBody"></div></div>
  <div class="dgbar"><span class="toast" id="toast"></span><button id="captureBtn" class="primary">📋 캡처 (노션용 복사)</button><button id="closeBtn">닫기</button></div>
</dialog>

<script>
const Q = [{"t": "1교시 · 분류 vs 탐지", "anim": "D4-1 분류 vs 탐지", "qs": [{"type": "single", "p": "객체 탐지 (object detection) 모델이 이미지 한 장에 대해 내는 출력은?", "o": ["물체마다 (클래스, 박스, 점수)", "이미지 전체에 라벨 하나", "픽셀마다 클래스 번호", "사람마다 관절 좌표"], "a": 0, "w": "분류 = 이미지 한 장 → 라벨 하나 (\"무엇이\"), 탐지 = 물체마다 (클래스, 박스, 점수) (\"무엇이 어디에\"). 사람이 몇 명인지는 박스 개수로 셉니다.", "an": "D4-1 · 분류 vs 탐지"}, {"type": "single", "p": "559×536 이미지를 64×128 창, stride 16 으로 훑는 sliding window 의 창 개수는? (창 크기 하나만)", "o": ["31", "1,190", "806", "3,224"], "a": 2, "w": "가로 (559 − 64) // 16 + 1 = 31, 세로 (536 − 128) // 16 + 1 = 26 → 31 × 26 = 806. 사람 크기가 제각각이라 실제로는 창 크기 · 비율마다 이만큼 더 필요합니다.", "an": "문제 1-3"}, {"type": "multi", "p": "Penn-Fudan Pedestrian 데이터셋에 대한 설명으로 <b>옳은 것</b>을 모두 고르세요.", "o": ["이미지 170장 (Fudan 74 + Penn 96)", "보행자 423명", "bbox 와 마스크가 함께 있다", "사진 속 모든 사람이 빠짐없이 정답에 들어 있다", "어노테이션은 COCO JSON 파일로 제공된다"], "a": [0, 1, 2], "w": "너무 작거나 많이 가려진 사람은 정답에 없습니다 — 탐지기가 맞게 찾아도 FP 로 계산될 수 있습니다 (8교시). 어노테이션은 텍스트 파일이라 정규식으로 파싱하고 2교시에 COCO 로 바꿉니다.", "an": "문제 1-2"}, {"type": "ox", "p": "806 개 창을 Day 3 MobileNetV3-S (창당 약 6 ms) 로 하나씩 분류하면 약 4.8초가 걸리고, 그것도 창 크기 하나만 본 것이다.", "a": true, "w": "806 × 6 ms ≈ 4.8초 / 장. 실시간 (10 FPS 면 100 ms) 과 거리가 멀어 이미지를 한 번만 보고 모든 박스를 내는 탐지기가 필요합니다.", "an": "문제 1-3"}, {"type": "short", "p": "Penn-Fudan <code>FudanPed00001</code> 의 정답 보행자는 몇 명인가요? (숫자만)", "a": ["2", "2명"], "w": "박스 [[160, 182, 302, 431], [420, 171, 535, 486]] 두 개. 170장 전체는 423명 — 이미지당 평균 약 2.5명입니다.", "an": "문제 1-1"}, {"type": "drop", "p": "분류와 탐지의 차이입니다. 빈칸에 알맞은 것을 고르세요.", "p2": "분류는 이미지 한 장 → {} 를 낸다. 탐지는 물체마다 {} 를 낸다. sliding window 는 창마다 {} 를 돌려야 해서 느리다.", "opts": [["박스 여러 개", "라벨 하나", "마스크"], ["(클래스, 박스, 점수)", "라벨 하나", "픽셀 클래스"], ["NMS", "분류기", "letterbox"]], "a": [1, 0, 1], "w": "sliding window = 분류기를 탐지기처럼 쓰는 가장 단순한 방법. 559×536 · 창 하나 크기만으로 806 번 분류 → 약 4.8초.", "an": "D4-1 · 분류 vs 탐지"}, {"type": "match", "p": "작업과 출력을 짝지으세요.", "left": ["분류 (Day 3)", "객체 탐지 (Day 4)", "세그멘테이션 (Day 5)", "포즈 추정 (Day 5)"], "right": ["이미지 → 라벨 하나", "물체마다 클래스 · np.asarray(scores, float)\n    order = np.argsort({{}})                 # 점수 높은 순\n    keep = []\n    while order.size > 0:\n        i = order[0]\n        keep.append(i)\n        rest = order[1:]\n        order = rest[iou(boxes[i], boxes[rest]) {{}} iou_thr]\n    return np.array(keep, dtype=int)", "a": [["minimum"], ["inter"], ["-scores"], ["<="]], "w": "IoU 가 iou_thr 이하인 박스만 남깁니다 (초과하면 제거). 예제 결과 [0, 2] = <code>torchvision.ops.nms</code>. <code>iou_matrix(A, B)</code> 는 같은 계산을 브로드캐스팅으로 N×M 한 번에 = <code>torchvision.ops.box_iou</code> (문제 3-2).", "an": "문제 3-1 · 3-3"}]}, {"t": "4교시 · Precision · Recall · AP · mAP", "anim": "D4-4 PR 곡선과 AP", "qs": [{"type": "single", "p": "정답 4개, 탐지 5개 (점수 순 TP, TP, FP, TP, FP) 의 AP (all-point 보간) 는?", "o": ["0.7500", "0.6000", "0.8125", "0.6875"], "a": 3, "w": "envelope 1, 1, 0.75, 0.75, 0.60 → Recall 이 늘어나는 구간만 넓이: 0.25×1 + 0.25×1 + 0.25×0.75 = 0.6875. Recall 0.75 → 1 구간은 정답 하나를 못 찾아 넓이 0.", "an": "문제 4-2"}, {"type": "single", "p": "같은 예에서 탐지 5개를 모두 썼을 때 Precision 과 Recall 은?", "o": ["P = 0.75, R = 0.60", "P = 0.60, R = 0.75", "P = 0.60, R = 0.60", "P = 1.00, R = 0.75"], "a": 1, "w": "TP 3 · FP 2 → P = 3/5 = 0.60, 정답 4 중 3 → R = 3/4 = 0.75. 분모가 다릅니다: Precision 은 탐지 수, Recall 은 정답 수.", "an": "문제 4-1"}, {"type": "multi", "p": "TP · FP · FN 판정에 대한 설명으로 <b>옳은 것</b>을 모두 고르세요. (IoU 0.5 기준)", "o": ["같은 정답에 두 번째로 매칭된 탐지는 FP 다", "정답과 IoU 0.4 로 겹친 탐지는 FP 다", "못 찾은 정답 (FN) 은 Recall 을 낮춘다", "FP 가 늘면 Recall 이 낮아진다", "Precision = TP / 정답 수 다"], "a": [0, 1, 2], "w": "TP 는 정답과 IoU ≥ 0.5 이면서 그 정답에 처음 매칭된 것만. FP 는 Precision 만 낮추고 Recall 은 그대로입니다. Precision = TP / (TP + FP).", "an": "문제 4-3"}, {"type": "ox", "p": "mAP@0.5:0.95 는 IoU 0.5 와 0.95 두 기준의 AP 를 평균한 값이다.", "a": false, "w": "IoU 0.50, 0.55, …, 0.95 의 <b>10개</b> 기준 AP 평균 (COCO 주 지표) 입니다. 엄격한 기준이 섞여 박스 위치 정확도까지 봅니다. 오늘은 클래스가 person 하나라 mAP = AP.", "an": "문제 4-4"}, {"type": "short", "p": "mAP@0.5:0.95 에서 평균하는 IoU 기준은 몇 개인가요? (숫자만)", "a": ["10", "10개"], "w": "0.50 부터 0.05 간격으로 0.95 까지: 0.50 · 0.55 · 0.60 · 0.65 · 0.70 · 0.75 · 0.80 · 0.85 · 0.90 · 0.95.", "an": "문제 4-4"}, {"type": "drop", "p": "AP 계산 방법입니다. 빈칸에 알맞은 것을 고르세요.", "p2": "모든 이미지의 탐지를 {} 높은 순으로 정렬해 누적 TP · FP 로 P · R 을 구한다. precision 은 {} 최댓값으로 바꾸고 (envelope), 오늘 구현은 {} 보간으로 넓이를 구한다.", "opts": [["IoU", "점수", "넓이"], ["왼쪽에서 오른쪽으로", "오른쪽에서 왼쪽으로", "가운데부터"], ["101점 (COCO)", "11점", "all-point (VOC)"]], "a": [1, 1, 2], "w": "COCO 는 101점 보간이라 값이 약간 다를 수 있습니다. envelope 는 '그 Recall 이상에서 얻을 수 있는 최고 precision'.", "an": "문제 4-2"}, {"type": "match", "p": "손 계산 예 (정답 4개) 에서 탐지 순서와 누적 P · R 을 짝지으세요.", "left": ["1번째 탐지 (TP)", "3번째 탐지 (FP)", "4번째 탐지 (TP)", "5번째 탐지 (FP)"], "right": ["P 1.00 · R 0.25", "P 0.67 · R 0.50", "P 0.75 · R 0.75", "P 0.60 · R 0.75"], "a": [0, 1, 2, 3], "w": "누적 TP 1, 2, 2, 3, 3 / 누적 FP 0, 0, 1, 1, 2. 2번째는 P 1.00 · R 0.50.", "an": "문제 4-1"}, {"type": "order", "p": "문제 4-1 ~ 4-4 — 직접 만든 평가 함수가 AP · mAP 를 구하는 순서로 배열하세요.", "items": ["<code>match_detections(dets, gts, iou_thr)</code> — 모든 탐지를 점수 순 정렬 후 TP / FP 표시 (정답당 하나)", "<code>precision_recall(tp, n_gt)</code> — 누적 TP · FP 로 (precision, recall)", "<code>ap_from_pr(recall, precision)</code> — envelope 후 Recall 축 넓이", "<code>map_50_95(dets, gts)</code> — IOU_THRS 10개의 <code>evaluate_ap</code> 평균"], "w": "<code>evaluate_ap(dets, gts, iou_thr=0.5)</code> 가 앞 세 단계를 묶습니다. 함수들은 <code>iou_nms_map.py</code> 로 저장해 5교시 · 8교시에 씁니다.", "an": "문제 4-1 ~ 4-4"}, {"type": "hot", "p": "손 계산 예의 PR 점입니다. envelope (오른쪽에서 왼쪽 최댓값) 를 적용할 때 <b>precision 이 더 큰 값으로 바뀌는 점</b>을 클릭하세요.", "w": "3번째 탐지 (R 0.50, P 0.67) 입니다. 오른쪽 4번째 점의 P 0.75 가 더 크므로 0.75 로 올라갑니다. 1 · 2번째는 이미 1.00, 4번째 0.75 는 오른쪽 (0.60) 보다 크고, 5번째는 맨 끝이라 그대로입니다.", "an": "D4-4 · PR 곡선과 AP", "viewBox": "0 0 680 390", "sw": 680, "svg": "<defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#8a9bb8\"/></marker><marker id=\"ahr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHe eline=\"middle\">Precision</text><path d=\"M220.0,50.0 L360.0,50.0 L360.0,236.7 L500.0,190.0 L500.0,274.0\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"1.6\"/><circle cx=\"220.0\" cy=\"50.0\" r=\"7\" fill=\"#4ade80\" stroke=\"#4ade80\"/><text x=\"236.0\" y=\"36.0\" font-size=\"10.5\" fill=\"#4ade80\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">1번째 (TP)</text><circle cx=\"360.0\" cy=\"50.0\" r=\"7\" fill=\"#4ade80\" stroke=\"#4ade80\"/><text x=\"344.0\" y=\"36.0\" font-size=\"10.5\" fill=\"#4ade80\" text-anchor=\"end\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">2번째 (TP)</text><circle cx=\"360.0\" cy=\"236.7\" r=\"7\" fill=\"#f87171\" stroke=\"#f87171\"/><text x=\"376.0\" y=\"254.7\" font-size=\"10.5\" fill=\"#f87171\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">3번째 (FP)</text><circle cx=\"500.0\" cy=\"190.0\" r=\"7\" fill=\"#4ade80\" stroke=\"#4ade80\"/><text x=\"516.0\" y=\"176.0\" font-size=\"10.5\" fill=\"#4ade80\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">4번째 (TP)</text><circle cx=\"500.0\" cy=\"274.0\" r=\"7\" fill=\"#f87171\" stroke=\"#f87171\"/><text x=\"516.0\" y=\"260.0\" font-size=\"10.5\" fill=\"#f87171\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">5번째 (FP)</text>", "regions": [{"id": "p1", "label": "1번째 탐지 (R 0.25, P 1.00)", "shape": "circle", "x": 220.0, "y": 50.0, "r": 20}, {"id": "p2", "label": "2번째 탐지 (R 0.50, P 1.00)", "shape": "circle", "x": 360.0, "y": 50.0, "r": 20}, {"id": "p3", "label": "3번째 탐지 (R 0.50, P 0.67)", "shape": "circle", "x": 360.0, "y": 236.7, "r": 20}, {"id": "p4", "label": "4번째 탐지 (R 0.75, P 0.75)", "shape": "circle", "x": 500.0, "y": 190.0, "r": 20}, {"id": "p5", "label": "5번째 탐지 (R 0.75, P 0.60)", "shape": "circle", "x": 500.0, "y": 274.0, "r": 20}], "a": "p3"}, {"type": "code", "p": "문제 4-1 · 4-2 · 4-4 — <code>precision_recall</code> · <code>ap_from_pr</code> · <code>evaluate_ap</code> 와 mAP 의 IoU 기준을 완성하세요.", "code": "def precision_recall(tp, n_gt):\n    tp = np.asarray(tp, float)               # 점수 순 TP=1 / FP=0\n    ctp = np.{{}}(tp); cfp = np.cumsum(1 - tp)\n    precision = ctp / np.maximum({{}}, 1e-12)\n    recall = ctp / max(n_gt, 1)\n    return precision, recall\n\ndef ap_from_pr(rec, prec):\n    mrec = np.concatenate([[0.0], rec, [1.0]])\n    mpre = np.concatenate([[0.0], prec, [0.0]])\n    for i in range(len(mpre) - 2, -1, -1):        # envelope\n        mpre[i] = max(mpre[i], {{}})\n    idx = np.where(mrec[1:] != mrec[:-1])[0]\n    return float(np.sum((mrec[idx + 1] - mrec[idx]) * mpre[idx + 1]))\n\ndef evaluate_ap(dets, gts, iou_thr=0.5):\n    scores, tp, n_gt = match_detections(dets, gts, iou_thr)\n    precision, recall = precision_recall(tp, n_gt)\n    return ap_from_pr({{}}, {{}})\n\nIOU_THRS = np.arange(0.5, 0.96, {{}})           # 0.50, 0.55, …, 0.95", "a": [["cumsum"], ["ctp + cfp", "cfp + ctp"], ["mpre[i + 1]", "mpre[i+1]"], ["recall"], ["precision"], ["0.05", ".05"]], "w": "<code>precision_recall</code> 은 (precision, recall) 순서로 돌려주고 <code>ap_from_pr</code> 는 (rec, prec) 순서로 받습니다 — 순서를 바꿔 넣으면 넓이가 틀립니다. 손 계산 예 tp = [1, 1, 0, 1, 0], n_gt = 4 → 0.6875. <code>map_50_95</code> = IOU_THRS 10개의 evaluate_ap 평균. 실행 예 (8교시): YOLOv8n 640 AP50 0.9692 · mAP@0.5:0.95 0.8357.", "an": "문제 4-1 · 4-2 · 4-4"}]}, {"t": "5교시 · 2-stage vs 1-stage", "anim": "D4-5 Anchor 와 RPN", "qs": [{"type": "single", "p": "559×536 이미지, stride 16 특징맵 (34×35) 의 위치마다 크기 3 × 비율 3 의 anchor 를 두면 anchor 는 모두 몇 개?", "o": ["10,710", "1,190", "11,025", "3,570"], "a": 0, "w": "34 × 35 = 1,190 위치 × 9 = 10,710. 모델은 anchor 마다 오프셋 (dx, dy, dw, dh) 과 점수를 예측합니다 — sliding window 806 창 × 분류기와 달리 한 번의 forward 로.", "an": "문제 5-1"}, {"type": "single", "p": "torchvision 탐지기 (Faster R-CNN · SSDLite) 의 출력 형식은?", "o": ["텐서 하나 (1, 84, 8400)", "이미지마다 (클래스, 점수) 두 값", "배치 전체 xywh 텐서 하나", "이미지마다 dict — boxes (N, 4) xyxy · labels (N,) · scores (N,)"], "a": 3, "w": "입력은 0~1 float 텐서의 리스트 (정규화 · 크기 조정은 모델 안에서), 출력은 같은 길이의 dict 리스트. (1, 84, 8400) 은 YOLOv8 원시 출력 (6교시).", "an": "문제 5-2"}, {"type": "multi", "p": "2-stage 와 1-stage 탐지기에 대한 설명으로 <b>옳은 것</b>을 모두 고르세요.", "o": ["Faster R-CNN 은 RPN 이 proposal 을 고른 뒤 다시 분류 · 박스 보정을 한다", "SSD 는 여러 해상도 특징맵에서 anchor 마다 클래스와 박스를 한 번에 예측한다", "1-stage 는 보통 빠르지만 작은 물체에 약하다", "같은 backbone 이면 SSDLite320 의 COCO mAP 가 Faster R-CNN 보다 높다", "torchvision 탐지기에 넣기 전에 ImageNet 정규화와 640 크기 조정을 직접 해야 한다"], "a": [0, 1, 2], "w": "MobileNetV3-Large backbone: Faster R-CNN 4.49 GFLOPS · mAP 32.8 vs SSDLite320 0.58 GFLOPS · 21.3 — 정확도와 속도를 맞바꿉니다. torchvision 탐지기는 정규화 · 크기 조정을 모델 안에서 합니다.", "an": "D4-5 · 2-stage vs 1-stage"}, {"type": "ox", "p": "torchvision COCO 탐지기에서 person 의 라벨 번호는 0 이다.", "a": false, "w": "torchvision 은 0 이 background 라 person = 1 입니다. ultralytics YOLOv8 은 person = 클래스 0 — 라이브러리마다 다릅니다.", "an": "문제 5-2"}, {"type": "short", "p": "같은 MobileNetV3-Large backbone 에서 Faster R-CNN (4.49 GFLOPS) 은 SSDLite320 (0.58 GFLOPS) 의 약 몇 배 연산인가요? (소수 첫째 자리까지)", "a": ["7.7", "7.7배", "약7.7", "약7.7배"], "w": "4.49 / 0.58 ≈ 7.7 배. 그 대가로 COCO mAP 32.8 vs 21.3. Faster R-CNN ResNet-50 FPN 은 134.38 GFLOPS · 37.0.", "an": "문제 5-3"}, {"type": "drop", "p": "Anchor 와 Faster R-CNN 입니다. 빈칸에 알맞은 것을 고르세요.", "p2": "anchor 는 특징맵 각 위치에 {} 가 다른 기준 박스다. 모델은 anchor 에 대한 {} 와 점수를 예측한다. Faster R-CNN 은 proposal 마다 {} 로 7×7 특징을 잘라낸다.", "opts": [["색 · 밝기", "크기 · 비율", "클래스"], ["절대 좌표 xyxy", "마스크", "오프셋 (dx, dy, dw, dh)"], ["RoI Align", "NMS", "letterbox"]], "a": [1, 2, 0], "w": "RPN 은 anchor 마다 '물체 있음?' + 박스 보정 → 상위 proposal (수백~수천) → RoI Align → 분류 + 박스 다시 보정.", "an": "D4-5 · Anchor 와 RPN"}, {"type": "match", "p": "모델과 파라미터 수를 짝지으세요.", "left": ["Faster R-CNN ResNet-50 FPN", "Faster R-CNN MobileNetV3-Large FPN", "SSDLite320 MobileNetV3-Large", "YOLOv8n"], "right": ["41,755,286", "19,3 fill=\"#14203a\" stroke=\"#2dd4bf\" /><text x=\"225.0\" y=\"326\" font-size=\"13\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"bold\" dominant-baseline=\"middle\">Box Head</text><text x=\"225.0\" y=\"348\" font-size=\"10.5\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">분류 + 박스 다시 보정</text><line x1=\"112\" y1=\"95\" x2=\"138\" y2=\"95\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><line x1=\"312\" y1=\"95\" x2=\"338\" y2=\"95\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><line x1=\"440\" y1=\"132\" x2=\"440\" y2=\"188\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><line x1=\"338\" y1=\"225\" x2=\"312\" y2=\"225\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><line x1=\"225\" y1=\"262\" x2=\"225\" y2=\"298\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><path d=\"M225,132 L225,160 L180,160 L180,188\" fill=\"none\" stroke=\"#8a9bb8\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\" marker-end=\"url(#ah)\"/><text x=\"232\" y=\"150\" font-size=\"10\" fill=\"#8a9bb8\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">특징맵</text><line x1=\"312\" y1=\"335\" x2=\"360\" y2=\"335\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><text x=\"368\" y=\"326\" font-size=\"10.5\" fill=\"#8a9bb8\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">boxes (N, 4) xyxy</text><text x=\"368\" y=\"344\" font-size=\"10.5\" fill=\"#8a9bb8\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">labels · scores</text>", "regions": [{"id": "bb", "label": "Backbone + FPN", "x": 140, "y": 60, "w": 170, "h": 70}, {"id": "rpn", "label": "RPN", "x": 340, "y": 60, "w": 200, "h": 70}, {"id": "prop", "label": "Proposals", "x": 340, "y": 190, "w": 200, "h": 70}, {"id": "roi", "label": "RoI Align", "x": 140, "y": 190, "w": 170, "h": 70}, {"id": "head", "label": "Box Head", "x": 140, "y": 300, "w": 170, "h": 70}], "a": "roi"}, {"type": "code", "p": "문제 5-2 — torchvision 탐지기로 사람만 찾는 <code>run_tv</code> 를 완성하세요.", "code": "def run_tv(model, img, score_thr=0.5):\n    x = torch.from_numpy(img).permute(2, 0, 1).float().div({{}}).to(device)     # RGB uint8 → (3, H, W) 0~1\n    with torch.no_grad():\n        out = model([x])[{{}}]                 # 이미지 리스트 → 결과 dict 리스트\n    m = (out[\"labels\"] == {{}}) & (out[\"scores\"] >= score_thr)\n    return out[\"{{}}\"][m].cpu().numpy(), out[\"scores\"][m].cpu().numpy()", "a": [["255", "255.0"], ["0"], ["1"], ["boxes"]], "w": "입력은 텐서 리스트, 출력은 dict 리스트. person = 라벨 1 (0 은 background). 문제 5-3 은 이 함수 (score_thr 0.05) 로 두 탐지기를 170장에서 <code>evaluate_ap</code> 로 평가합니다.", "an": "문제 5-2"}]}, {"t": "6교시 · YOLO 구조", "anim": "D4-6 YOLO grid 와 출력 텐서", "qs": [{"type": "single", "p": "YOLOv8 에 640×640 을 넣으면 예측 (후보 박스) 은 모두 몇 개?", "o": ["6,400", "8,400", "2,100", "25,200"], "a": 1, "w": "(640/8)² + (640/16)² + (640/32)² = 6,400 + 1,600 + 400 = 8,400. 6,400 은 stride 8 하나만 센 값, 2,100 은 320 입력.", "an": "문제 6-1"}, {"type": "single", "p": "YOLOv8 (COCO) 원시 출력 <code>yolo.model(x)[0]</code> 의 모양은? (640 입력, 배치 1)", "o": ["(1, 8400, 85)", "(1, 80, 8400)", "(1, 84, 8400)", "(1, 3, 640, 640)"], "a": 2, "w": "84 = 박스 4 (cx, cy, w, h — 입력 640 픽셀 단위) + COCO 80 클래스 점수. YOLOv8 은 objectness 점수가 없어 85 가 아닙니다. 후처리 전에 (8400, 84) 로 전치합니다.", "an": "문제 6-2"}, {"type": "multi", "p": "YOLOv8 구조에 대한 설명으로 <b>옳은 것</b>을 모두 고르세요.", "o": ["anchor-free — 칸 중심에서 박스 네 변까지 거리를 직접 예측한다 (DFL)", "클래스 점수는 sigmoid 다", "Backbone (CSP) → Neck (FPN + PAN) → Head (stride 8 · 16 · 32)", "출력 84 개 중 5번째 값은 objectness 점수다", "320 입력이면 예측 개수가 8,400 의 절반인 4,200 이다"], "a": [0, 1, 2], "w": "objectness 는 YOLOv5 까지 (85 = 4 + 1 + 80). 예측 개수는 한 변 길이의 제곱에 비례 — 320 이면 1/4 인 2,100.", "an": "D4-6 · YOLO 구조"}, {"type": "ox", "p": "768×576 영상 프레임을 <code>letterbox(img, size=640)</code> 하면 scale = 0.8333 이고 640×480 으로 줄인 뒤 위아래에 회색 (114) 패딩이 80 픽셀씩 붙는다.", "a": true, "w": "scale = min(640/576, 640/768) = 0.8333 → 768×0.8333 = 640, 576×0.8333 = 480 → (640 − 480) / 2 = 80. 비율을 유지하므로 사람이 찌그러지지 않습니다.", "an": "문제 6-2"}, {"type": "short", "p": "YOLOv8 에 320×320 을 넣으면 예측 개수는? (숫자만)", "a": ["2100", "2,100", "2_100"], "w": "40² + 20² + 10² = 1,600 + 400 + 100 = 2,100 — 640 의 1/4. 연산도 대략 1/4 로 줄어 8교시에서 속도 · 정확도를 비교합니다.", "an": "문제 6-1"}, {"type": "drop", "p": "YOLOv8 후처리 (decode) 입니다. 빈칸에 알맞은 것을 고르세요.", "p2": "(84, 8400) 을 (8400, 84) 로 {} 하고, 클래스 최댓값을 점수로 삼아 conf 기준 {} 로 거른다. cxcywh → xyxy 로 바꾼 뒤 NMS (IoU {}) 를 한다.", "opts": [["softmax", "전치", "정규화"], ["0.5", "0.7", "0.25"], ["0.5", "0.7", "0.45"]], "a": [1, 2, 1], "w": "마지막으로 패딩을 빼고 scale 로 나눠 원본 좌표로 돌립니다. 직접 디코드한 결과 = ultralytics <code>model.predict</code> 결과.", "an": "문제 6-3"}, {"type": "match", "p": "YOLO 버전과 핵심 변화를 짝지으세요.", "left": ["YOLOv1 (2016)", "YOLOv2 · v3", "YOLOv4 · v5", "YOLOv8 (2023)"], "right": ["이미지를 grid 로 나눠 칸마다 예측", "anchor · 다중 스케일", "CSP · 데이터 증강", "anchor-free · decoupled head"], "a": [0, 1, 2, 3], "w": "커스텀 데이터 학습은 YOLOv8 Edge 모델 과목 (12/11~) 에서 합니다. 오늘은 COCO 사전학습 YOLOv8n · YOLOv8s 를 그대로 씁니다.", "an": "6교시 · 버전 흐름"}, {"type": "order", "p": "직접 만드는 YOLOv8 추론 과정 (<code>letterbox</code> → <code>decode_yolo</code>) 의 순서로 배열하세요.", "items": ["letterbox — 비율 유지 축소 + 회색 (114) 패딩", "BGR → RGB, /255, CHW", "<code>yolo.model(x)[0]</code> → (1, 84, 8400)", "(8400, 84) 전치 · 클래스 최댓값 = 점수 · conf 0.25 · 사람 (cls 0) 만", "cxcywh → xyxy", "NMS (IoU 0.7)", "패딩 빼고 scale 로 나눠 원본 좌표"], "w": "ultralytics 결과 객체도 같은 값: <code>r.boxes.xyxy</code> · <code>r.boxes.conf</code> · <code>r.boxes.cls</code>, 단계별 시간은 <code>r.speed</code> (전처리 · 추론 · 후처리 ms).", "an": "문제 6-2 · 6-3"}, {"type": "hot", "p": "YOLOv8 (640 입력) 구조입니다. <b>6,400 개의 예측</b>을 내는 출력을 클릭하세요.", "w": "Head P3 (stride 8) 입니다 — 640/8 = 80 → 80×80 = 6,400 칸. P4 (stride 16) 는 40×40 = 1,600, P5 (stride 32) 는 20×20 = 400. 촘촘한 P3 이 작은 물체, 거친 P5 가 큰 물체를 맡습니다.", "an": "D4-6 · YOLO grid", "viewBox": "0 0 730 320", "sw": 730, "svg": "<defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#8a9bb8\"/></marker><marker id=\"ahr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#f87171\"/></marker></defs><text x=\"20\" y=\"20\" font-size=\"12\" fill=\"#dbe4f0\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">YOLOv8 (입력 1×3×640×640) — Backbone → Neck → Head</text><rect x=\"20\" y=\"50\" width=\"150\" height=\"250\" rx=\"6\" fill=\"#14203a\" stroke=\"#2dd4bf\" /><text x=\"95\" y=\"160\" font-size=\"13\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"bold\" dominant-baseline=\"middle\">Backbone</text><text x=\"95\" y=\"182\" font-size=\"10.5\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">CSP · 특징 추출</text><rect x=\"210\" y=\"50\" width=\"150\" height=\"250\" rx=\"6\" fill=\"#14203a\" stroke=\"#60a5fa\" /><text x=\"285\" y=\"160\" font-size=\"13\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"bold\" dominant-baseline=\"middle\">Neck</text><text x=\"285\" y=\"182\" font-size=\"10.5\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">FPN + PAN</text><rect x=\"400\" y=\"50\" width=\"170\" height=\"70\" rx=\"6\" fill=\"#3a2e12\" stroke=\"#f5b942\" /><text x=\"485\" y=\"74\" font-size=\"13\" fill=\"#f5b942\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"bold\" dominant-baseline=\"middle\">Head P3</text><text x=\"485\" y=\"96\" font-size=\"10.5\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">stride 8 · ? × ? 칸</text><line x1=\"362\" y1=\"85\" x2=\"398\" y2=\"85\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"400\" y=\"140\" width=\"170\" height=\"70\" rx=\"6\" fill=\"#3a2e12\" stroke=\"#f5b942\" /><text x=\"485\" y=\"164\" font-size=\"13\" fill=\"#f5b942\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"bold\" dominant-baseline=\"middle\">Head P4</text><text x=\"485\" y=\"186\" font-size=\"10.5\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">stride 16 · ? × ? 칸</text><line x1=\"362\" y1=\"175\" x2=\"398\" y2=\"175\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"400\" y=\"230\" width=\"170\" height=\"70\" rx=\"6\" fill=\"#3a2e12\" stroke=\"#f5b942\" /><text x=\"485\" y=\"254\" font-size=\"13\" fill=\"#f5b942\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"bold\" dominant-baseline=\"middle\">Head P5</text><text x=\"485\" y=\"276\" font-size=\"10.5\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">stride 32 · ? × ? 칸</text><line x1=\"362\" y1=\"265\" x2=\"398\" y2=\"265\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><line x1=\"172\" y1=\"175\" x2=\"208\" y2=\"175\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><path d=\"M572,85 L600,85 L600,265 L572,265 M600,175 L620,175\" fill=\"none\" stroke=\"#8a9bb8\" stroke-width=\"1.4\"/><text x=\"626\" y=\"166\" font-size=\"10.5\" fill=\"#8a9bb8\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">합쳐서</text><text x=\"626\" y=\"184\" font-size=\"10.5\" fill=\"#dbe4f0\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">(1, 84, 8400)</text>", "regions": [{"id": "bb", "label": "Backbone", "x": 20, "y": 50, "w": 150, "h": 250}, {"id": "neck", "label": "Neck (FPN + PAN)", "x": 210, "y": 50, "w": 150, "h": 250}, {"id": "p3", "label": "Head P3 (stride 8)", "x": 400, "y": 50, "w": 170, "h": 70}, {"id": "p4", "label": "Head P4 (stride 16)", "x": 400, "y": 140, "w": 170, "h": 70}, {"id": "p5", "label": "Head P5 (stride 32)", "x": 400, "y": 230, "w": 170, "h": 70}], "a": "p3"}, {"type": "code", "p": "문제 6-2 · 6-3 — <code>letterbox</code> 와 <code>decode_yolo</code> 를 완성하세요.", "code": "def letterbox(img, size=640, color=114):\n    h, w = img.shape[:2]\n    r = {{}}(size / h, size / w)\n    nw, nh = round(w * r), round(h * r)\n    resized = cv2.resize(img, ({{}}), interpolation=cv2.INTER_LINEAR)\n    top, left = (size - nh) // 2, (size - nw) // 2\n    out = np.full((size, size, 3), color, dtype=np.uint8)\n    out[top:top + nh, left:left + nw] = resized\n    return out, r, (left, top)\n\ndef decode_yolo(out, conf_thr=0.25, iou_thr=0.7, cls=0):\n    p = out[0].{{}}.cpu().numpy()                 # (84, 8400) → (8400, 84)\n    boxes_c, cls_scores = p[:, :{{}}], p[:, 4:]\n    best, conf = cls_scores.argmax(1), cls_scores.max(1)\n    m = (conf > conf_thr) & (best == {{}})\n    cx, cy, w, h = boxes_c[m].T\n    boxes = np.stack([cx - w / 2, cy - h / 2, cx + w / 2, cy + h / 2], 1)\n    keep = nms(boxes, conf[m], iou_thr)\n    return boxes[keep], conf[m][keep]", "a": [["min"], ["nw, nh"], ["T", "t()", "transpose(0, 1)", "transpose(1, 0)", "permute(1, 0)"], ["4"], ["cls", "0"]], "w": "cv2.resize 크기 인자는 (W, H) (Day 1). 앞 4 칸은 박스 (cx, cy, w, h), 4 번부터 80 클래스, cls=0 = person. 768×576 → r 0.8333, 위아래 패딩 80 (회색 color=114). 원래 좌표 = (박스 − [left, top, left, top]) / r.", "an": "문제 6-2 · 6-3"}]}, {"t": "7교시 · 영상 탐지 파이프라인", "anim": "D4-7 프레임 파이프라인", "qs": [{"type": "single", "p": "10 FPS 영상을 실시간으로 처리하려면 프레임 한 장 (전처리 ~ 저장 전체) 이 몇 ms 안에 끝나야 하나요?", "o": ["10 ms", "33 ms", "1,000 ms", "100 ms"], "a": 3, "w": "1000 / 10 = 100 ms. 30 FPS 면 33 ms. 실행 예 (CPU, YOLOv8n 640): 전처리 2.8 ms · 추론 102.1 ms · 후처리 1.3 ms → 약 9.0 FPS.", "an": "문제 7-3"}, {"type": "single", "p": "<code>data/people.mp4</code> 의 속성은?", "o": ["768×576, 10 FPS, 795 프레임 (79.5초)", "640×480, 30 FPS, 795 프레임", "768×576, 30 FPS, 2,385 프레임", "576×768, 10 FPS, 79 프레임"], "a": 0, "w": "OpenCV 공개 샘플 (vtest) 보행자 영상. <code>cap.get(cv2.CAP_PROP_FRAME_COUNT)</code> 795, <code>CAP_PROP_FPS</code> 10, 795 / 10 = 79.5초.", "an": "7교시 · 영상 열기"}, {"type": "multi", "p": "영상 파이프라인의 시간 측정에 대한 설명으로 <b>옳은 것</b>을 모두 고르세요.", "o": ["전처리 · 추론 · 후처리 · 그리기 · 저장 시간을 단계별로 따로 잰다", "GPU 시간은 <code>torch.cuda.synchronize()</code> 뒤에 잰다", "같은 영상 · 같은 모델로 GPU 와 CPU 를 비교한다", "첫 프레임의 시간이 가장 정확하므로 그것만 기록한다", "추론만 빨라지면 전체 FPS 도 반드시 같은 비율로 빨라진다"], "a": [0, 1, 2], "w": "첫 프레임은 준비 비용 때문에 느립니다 (Day 3 warm-up). 추론이 빨라져도 전처리 · 그리기 · 저장 시간은 그대로라 전체 FPS 는 덜 오릅니다 — 그래서 단계별로 잽니다.", "an": "문제 7-3"}, {"type": "ox", "p": "추론 시간만 프레임당 100 ms 보다 짧으면 10 FPS 영상을 항상 실시간으로 처리할 수 있다.", "a": false, "w": "실시간 조건은 전처리 · 추론 · 후처리 · 그리기 · 저장을 모두 더한 시간이 100 ms 안이어야 합니다. 실행 예 (CPU): 추론 102.1 ms, 전체 약 9.0 FPS.", "an": "문제 7-3"}, {"type": "short", "p": "<code>data/people.mp4</code> 의 전체 프레임 수는? (숫자만)", "a": ["795"], "w": "10 FPS × 79.5초 = 795. 8교시 실행 예: 795 프레임 처리, 최대 8 명 · 평균 4.96 명.", "an": "7교시 · 영상 열기"}, {"type": "drop", "p": "영상 입출력 코드의 설계입니다. 빈칸에 알맞은 것을 고르세요.", "p2": "입력은 <code>cv2.VideoCapture({})</code> 하나로 두어 나중에 카메라로 바꾸기 쉽게 한다. 저장은 <code>cv2.{}</code> (mp4v) 이고 크기 인자는 {} 순서다.", "opts": [["frame", "source", "fps"], ["imwrite", "VideoCapture", "VideoWriter"], ["(W, H)", "(H, W)", "(C, H, W)"]], "a": [1, 2, 0], "w": "크기를 (H, W) 로 주면 오류 없이 빈 영상이 됩니다 (Day 1). mp4v 는 브라우저 재생이 안 될 수 있어 ffmpeg 로 H.264 변환.", "an": "문제 7-2"}, {"type": "match", "p": "조건과 프레임당 시간 예산 (또는 길이) 을 짝지으세요.", "left" · GT A 와 IoU 0.7 정도 (d1 다음)</text><rect x=\"400\" y=\"190\" width=\"300\" height=\"56\" rx=\"6\" fill=\"#2a1416\" stroke=\"#f87171\" /><text x=\"414\" y=\"218\" font-size=\"11\" fill=\"#dbe4f0\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">d3 · 점수 0.48 · 겹치는 GT 없음</text><rect x=\"400\" y=\"260\" width=\"300\" height=\"56\" rx=\"6\" fill=\"#2a1416\" stroke=\"#f87171\" /><text x=\"414\" y=\"288\" font-size=\"11\" fill=\"#dbe4f0\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">d4 · 점수 0.62 · GT B 와 IoU 0.4 정도</text>", "regions": [{"id": "d1", "label": "d1", "x": 400, "y": 50, "w": 300, "h": 56}, {"id": "d2", "label": "d2", "x": 400, "y": 120, "w": 300, "h": 56}, {"id": "d3", "label": "d3", "x": 400, "y": 190, "w": 300, "h": 56}, {"id": "d4", "label": "d4", "x": 400, "y": 260, "w": 300, "h": 56}], "a": "d3"}, {"type": "code", "p": "과제 1 · 3 · 4 의 핵심 줄을 완성하세요.", "code": "def predict_dataset(model, imgsz=640, conf={{}}):      # AP 용 — 아주 낮은 conf\n    ...\nres[(name, 640)] = {\"dets\": dets, \"AP50\": evaluate_ap(dets, gts, {{}}), \"mAP\": map_50_95(dets, gts)}\n...\nCONFS = np.round(np.arange(0.10, 0.91, 0.05), 2)\n    F1_c.append(2 * P * Rc / max({{}}, 1e-12))\nbest_conf = float(CONFS[np.{{}}(F1_c)])\ncounts_p, times_p = process_video(VIDEO, \"count_result.mp4\", yolo_n, imgsz=640, conf={{}})", "a": [["0.001", ".001"], ["0.5", ".5"], ["P + Rc", "Rc + P"], ["argmax"], ["best_conf"]], "w": "AP50 = IoU 0.5 기준 AP, map_50_95 = 10개 기준 평균. 실행 예: YOLOv8n 640 AP50 0.9692 / mAP 0.8357, F1 최대 conf 0.70.", "an": "과제 1 · 3 · 4"}]}];
const TYPES = {
  single:{n:'단일 선택',c:'#60a5fa'}, multi:{n:'다중 선택',c:'#c084fc'}, ox:{n:'O/X',c:'#f5b942'},
  short:{n:'단답형',c:'#2dd4bf'}, drop:{n:'선택형 빈칸',c:'#93c5fd'}, match:{n:'짝 맞추기',c:'#f472b6'},
  order:{n:'순서 배열',c:'#fb923c'}, hot:{n:'핫스팟',c:'#4ade80'}, code:{n:'코드 완성',c:'#a3e635'}
};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip = h => { const d = document.createElement('div'); d.innerHTML = h; return d.textContent; };
const norm = s => String(s ?? '').toLowerCase().replace(/\s+/g, '').replace(/[“”]/g, '"').replace(/[‘’]/g, "'");
function rng(seed){ let h = 2166136261; for (const c of seed) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 100000) / 100000; }; }
function shuffled(arr, seed){ const r = rng(seed), idx = arr.map((_, i) => i); for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; } if (idx.every((v, i) => v === i) && idx.length > 1) idx.push(idx.shift()); return idx; }

// ── 상태 ──
let tab = 0;
const graded = Q.map(() => false);
const ans = Q.map((s, i) => s.qs.map((q, k) => init(q, `${i}-${k}`)));
function init(q, id){
  switch (q.type) {
    case 'single': case 'ox': case 'hot': return null;
    case 'multi': return [];
    case 'short': return '';
    case 'drop': return q.opts.map(() => -1);
    case 'match': return q.left.map(() => -1);
    case 'order': return shuffled(q.items, 'o' + id);          // 현재 화면 순서(원래 인덱스)
    case 'flash': return { flipped:false, self:null };
    case 'code': return q.a.map(() => '');
  }
}
function answered(q, a){
  switch (q.type) {
    case 'single': case 'ox': case 'hot': return a !== null;
    case 'multi': return a.length > 0;
    case 'short': return a.trim() !== '';
    case 'drop': case 'match': return a.every(v => v >= 0);
    case 'order': return true;
    case 'flash': return a.self !== null;
    case 'code': return a.every(v => v.trim() !== '');
  }
}
function correct(q, a){
  switch (q.type) {
    case 'single': case 'hot': return a === q.a;
    case 'ox': return a === q.a;
    case 'multi': return a.length === q.a.length && q.a.every(x => a.includes(x));
    case 'short': return q.a.some(x => norm(x) === norm(a));
    case 'drop': return a.every((v, i) => v === q.a[i]);
    case 'match': return a.every((v, i) => v === q.a[i]);
    case 'order': return a.every((v, i) => v === i);
    case 'flash': return a.self === true;
    case 'code': return a.every((v, i) => q.a[i].some(x => norm(x) === norm(v)));
  }
}
const scoreOf = i => ans[i].filter((a, k) => correct(Q[i].qs[k], a)).length;

// ── 답 문자열 (오답 정리용) ──
const L = '①②③④⑤⑥⑦⑧';
function fmt(q, a, right){
  switch (q.type) {
    case 'single': return right ? `${L[q.a]} ${strip(q.o[q.a])}` : (a === null ? '미응답' : `${L[a]} ${strip(q.o[a])}`);
    case 'multi': { const v = right ? q.a : a; return v.length ? [...v].sort().map(i => L[i]).join(' ') : '미응답'; }
    case 'ox': { const v = right ? q.a : a; return v === null ? '미응답' : (v ? 'O' : 'X'); }
    case 'short': return right ? q.a[0] : (a.trim() || '미응답');
    case 'drop': return (right ? q.a : a).map((v, i) => v < 0 ? '?' : strip(q.opts[i][v])).join(' / ');
    case 'match': return (right ? q.a : a).map((v, i) => `${strip(q.left[i])}→${v < 0 ? '?' : strip(q.right[v])}`).join(', ');
    case 'order': return (right ? q.items.map((_, i) => i) : a).map(i => strip(q.items[i])).join(' → ');
    case 'hot': { const v = right ? q.a : a; return v === null ? '미응답' : (q.regions.find(r => r.id === v) || {}).label; }
    case 'flash': return right ? strip(q.back) : (a.self === null ? '미응답' : (a.self ? '알았다' : '몰랐다'));
    case 'code': return (right ? q.a.map(x => x[0]) : a.map(v => v || '?')).join(' / ');
  }
}

// ── 렌더 ──
function renderTabs(){
  $('#tabs').innerHTML = Q.map((s, i) => {
    const n = ans[i].filter((a, k) => answered(s.qs[k], a)).length;
    return `<button class="${i === tab ? 'active' : ''} ${graded[i] ? 'graded' : ''}" data-i="${i}">${i + 1}교시<span class="s">${graded[i] ? scoreOf(i) + '/10' : n + '/10'}</span></button>`;
  }).join('');
  $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => { tab = +b.dataset.i; history.replaceState(null, '', '#t' + (tab + 1)); render(); window.scrollTo({ top: 0 }); });
}
function qHTML(q, k){
  const a = ans[tab][k], g = graded[tab], id = `${tab}-${k}`, dis = g ? 'disabled' : '';
  const ok = g && correct(q, a);
  let body = '';
  switch (q.type) {
    case 'single':
    case 'multi': {
      const isM = q.type === 'multi';
      body = (isM ? '<div class="hint" style="margin:-4px 0 8px">정답을 <b>모두</b> 고르세요.</div>' : '') + '<div class="opts">' + q.o.map((o, j) => {
        const sel = isM ? a.includes(j) : a === j, isA = isM ? q.a.includes(j) : q.a === j;
        let c = sel ? 'sel' : '';
        if (g) c = isA && sel ? 'ok' : (sel ? 'bad' : (isA ? (isM ? 'miss' : 'ok') : ''));
        const box = isM ? (sel ? '☑' : '☐') : L[j];
        return `<button class="opt ${c}" data-k="${k}" data-j="${j}" ${dis}><span class="box">${box}</span> ${o}</button>`;
      }).join('') + '</div>';
      break;
    }
    case 'ox':
      body = '<div class="ox">' + [true, false].map(v => {
        let c = a === v ? 'active' : '';
        if (g) c = (q.a === v ? 'opt ok' : (a === v ? 'opt bad' : ''));
        return `<button class="oxb ${c}" data-k="${k}" data-v="${v}" ${dis} aria-label="${v ? '참' : '거짓'}">${v ? 'O' : 'X'}</button>`;
      }).join('') + '</div>';
      break;
    case 'short':
      body = `<input type="text" class="sa" data-k="${k}" value="${esc(a)}" placeholder="정답 입력" style="width:min(100%,320px)" ${dis}>`;
      break;
    case 'drop': {
      let i = 0;
      body = '<div class="fill">' + q.p2.replace(/\{\}/g, () => {
        const n = i++;
        const opts = q.opts[n].map((o, j) => `<option value="${j}" ${a[n] === j ? 'selected' : ''}>${esc(strip(o))}</option>`).join('');
        const st = g ? `style="border-color:${a[n] === q.a[n] ? 'var(--green)' : 'var(--red)'}"` : '';
        return `<select class="dd" data-k="${k}" data-n="${n}" ${dis} ${st}><option value="-1">선택</option>${opts}</select>`;
      }) + '</div>';
      break;
    }
    case 'match': {
      const order = shuffled(q.right, 'm' + id);
      body = q.left.map((l, i) => {
        const opts = order.map(j => `<option value="${j}" ${a[i] === j ? 'selected' : ''}>${esc(strip(q.right[j]))}</option>`).join('');
        const c = g ? (a[i] === q.a[i] ? 'ok' : 'bad') : '';
        return `<div class="mrow ${c}"><span class="l">${l}</span><span class="arr">↔</span><select class="mm" data-k="${k}" data-i="${i}" ${dis}><option value="-1">짝 선택</option>${opts}</select></div>`;
      }).join('');
      break;
    }
    case 'order':
      body = '<div class="hint" style="margin:-4px 0 8px">끌어다 놓거나 ▲▼ 버튼으로 순서를 바꾸세요.</div><ol class="ord" data-k="' + k + '">' + a.map((it, pos) => {
        const c = g ? (it === pos ? 'ok' : 'bad') : '';
        return `<li class="${c}" draggable="${!g}" data-pos="${pos}"><span class="k">${pos + 1}</span><span>${q.items[it]}</span><span class="mv"><button data-k="${k}" data-pos="${pos}" data-d="-1" ${dis || (pos === 0 ? 'disabled' : '')} aria-label="위로">▲</button><button data-k="${k}" data-pos="${pos}" data-d="1" ${dis || (pos === a.length - 1 ? 'disabled' : '')} aria-label="아래로">▼</button></span></li>`;
      }).join('') + '</ol>';
      break;
    case 'hot': {
      const regs = q.regions.map(r => {
        let c = a === r.id ? 'sel' : '';
        if (g) c = r.id === q.a ? 'ok' : (a === r.id ? 'bad' : '');
        const shape = r.shape === 'circle' ? `<circle cx="${r.x}" cy="${r.y}" r="${r.r}"` : `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="6"`;
        return `${shape} class="rg ${c}" data-k="${k}" data-r="${r.id}" tabindex="${g ? -1 : 0}" role="button" aria-label="${esc(r.label)}"><title>${esc(r.label)}</title>${r.shape === 'circle' ? '</circle>' : '</rect>'}`;
      }).join('');
      body = `<div class="hot"><svg viewBox="${q.viewBox}" width="${q.sw}" xmlns="http://www.w3.org/2000/svg">${q.svg}${regs}</svg></div>` +
        `<div class="hint" style="margin-top:6px">선택: <b style="color:var(--amber)">${a === null ? '없음' : esc((q.regions.find(r => r.id === a) || {}).label)}</b></div>`;
      break;
    }
    case 'flash':
      body = `<div class="card ${a.flipped ? 'flip' : ''}" data-k="${k}"><div class="in"><div class="f">${q.front}</div><div class="b">${q.back}</div></div></div>` +
        `<div class="selfrow"><button class="flipb" data-k="${k}" ${g ? 'disabled' : ''}>${a.flipped ? '앞면 보기' : '🔄 카드 뒤집기'}</button>` +
        `<button class="selfb ${a.self === true ? 'active' : ''}" data-k="${k}" data-v="1" ${g || !a.flipped ? 'disabled' : ''}>✅ 알았다</button>` +
        `<button class="selfb ${a.self === false ? 'active' : ''}" data-k="${k}" data-v="0" ${g || !a.flipped ? 'disabled' : ''}>❌ 몰랐다</button>` +
        `<span class="hint">${a.flipped ? '정답과 비교해 스스로 채점하세요.' : '먼저 답을 떠올린 뒤 뒤집으세요.'}</span></div>`;
      break;
    case 'code': {
      let i = 0;
      body = '<pre>' + esc(q.code).replace(/\{\{\}\}/g, () => {
        const n = i++;
        const w = Math.max(5, (q.a[n][0] || '').length + 2);
        const st = g ? `style="border-color:${q.a[n].some(x => norm(x) === norm(a[n])) ? 'var(--green)' : 'var(--red)'};width:${w}ch"` : `style="width:${w}ch"`;
        return `<input type="text" class="ci" data-k="${k}" data-n="${n}" value="${esc(a[n])}" ${dis} ${st} aria-label="빈칸 ${n + 1}">`;
      }) + '</pre>';
      break;
    }
  }
  const t = TYPES[q.type];
  const prompt = q.type === 'drop' ? (q.p || '') : (q.type === 'flash' ? (q.p || '카드 앞면의 질문에 답을 떠올린 뒤 뒤집어 확인하세요.') : q.p);
  let fb = '';
  if (g) {
    const right = q.type === 'flash' ? '' : `<div>정답: <b>${esc(fmt(q, a, true))}</b></div>`;
    fb = `<div class="fb ${ok ? 'ok' : 'bad'}"><b class="v">${ok ? '정답' : '오답'}</b>${right}${q.w}<span class="anim">확인: ${q.an}</span></div>`;
  }
  const un = !g && !answered(q, a) && attempted[tab] ? 'unans' : '';
  return `<div class="q ${g ? (ok ? 'ok' : 'bad') : un}"><div class="qh"><span class="n">문항 ${k + 1}</span><span class="ty" style="color:${t.c};border-color:${t.c}">${t.n}</span></div><div class="p">${prompt}</div>${body}${fb}</div>`;
}
const attempted = Q.map(() => false);
function render(){
  renderTabs();
  const s = Q[tab];
  $('#sheet').innerHTML = `<div class="head"><span class="t">${s.t}</span><span class="a">🎬 ${s.anim}</span></div>` + s.qs.map((q, k) => qHTML(q, k)).join('');
  bind();
  const nm = $('#name').value, g = graded[tab];
  if (g) {
    const sc = scoreOf(tab); $('#rscore').textContent = `${sc}/10`;
    if (nm.trim()) { $('#rcode').textContent = codeFor(nm, tab + 1, sc); $('#rhint').textContent = '결과 코드'; }
    else { $('#rcode').textContent = '—'; $('#rhint').textContent = '이름을 입력하면 결과 코드가 나옵니다.'; }
  } else {
    $('#rcode').textContent = '—'; $('#rscore').textContent = '';
    const n = ans[tab].filter((a, k) => answered(s.qs[k], a)).length;
    $('#rhint').textContent = `${tab + 1}교시: ${n}/10 응답. 채점하기를 누르면 잠깁니다.`;
  }
  $('#gradeBtn').disabled = g;
}
function bind(){
  const S = $('#sheet'), A = ans[tab];
  S.querySelectorAll('.opt[data-j]').forEach(b => b.onclick = () => {
    const k = +b.dataset.k, j = +b.dataset.j, q = Q[tab].qs[k];
    if (q.type === 'multi') { const i = A[k].indexOf(j); i < 0 ? A[k].push(j) : A[k].splice(i, 1); }
    else A[k] = A[k] === j ? null : j;
    render();
  });
  S.querySelectorAll('.oxb').forEach(b => b.onclick = () => { const k = +b.dataset.k, v = b.dataset.v === 'true'; A[k] = A[k] === v ? null : v; render(); });
  S.querySelectorAll('.sa').forEach(i => i.oninput = () => { A[+i.dataset.k] = i.value; renderTabs(); });
  S.querySelectorAll('.ci').forEach(i => i.oninput = () => { A[+i.dataset.k][+i.dataset.n] = i.value; renderTabs(); });
  S.querySelectorAll('.dd').forEach(s => s.onchange = () => { A[+s.dataset.k][+s.dataset.n] = +s.value; renderTabs(); });
  S.querySelectorAll('.mm').forEach(s => s.onchange = () => { A[+s.dataset.k][+s.dataset.i] = +s.value; renderTabs(); });
  S.querySelectorAll('.ord .mv button').forEach(b => b.onclick = () => {
    const k = +b.dataset.k, p = +b.dataset.pos, d = +b.dataset.d, arr = A[k];
    [arr[p], arr[p + d]] = [arr[p + d], arr[p]]; render();
  });
  S.querySelectorAll('.ord').forEach(ol => {
    const k = +ol.dataset.k; let from = null;
    ol.querySelectorAll('li').forEach(li => {
      li.addEventListener('dragstart', e => { from = +li.dataset.pos; li.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(from)); });
      li.addEventListener('dragend', () => li.classList.remove('drag'));
      li.addEventListener('dragover', e => { if (from !== null) { e.preventDefault(); li.classList.add('over'); } });
      li.addEventListener('dragleave', () => li.classList.remove('over'));
      li.addEventListener('drop', e => { e.preventDefault(); const to = +li.dataset.pos; if (from === null || from === to) return; const arr = A[k]; const [x] = arr.splice(from, 1); arr.splice(to, 0, x); from = null; render(); });
    });
  });
  S.querySelectorAll('.rg').forEach(r => {
    const pick = () => { if (graded[tab]) return; const k = +r.dataset.k; A[k] = A[k] === r.dataset.r ? null : r.dataset.r; render(); };
    r.addEventListener('click', pick);
    r.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
  });
  S.querySelectorAll('.flipb').forEach(b => b.onclick = () => { const k = +b.dataset.k; A[k].flipped = !A[k].flipped; render(); });
  S.querySelectorAll('.card').forEach(c => c.onclick = () => { if (graded[tab]) return; const k = +c.dataset.k; A[k].flipped = !A[k].flipped; render(); });
  S.querySelectorAll('.selfb').forEach(b => b.onclick = () => { const k = +b.dataset.k; A[k].self = b.dataset.v === '1'; render(); });
}

// ── 채점 · 결과 코드 ──
function hash(s){ let h = 5381; for (const c of s) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return h.toString(16).padStart(8, '0').slice(-4); }
function codeFor(name, t, score){ return `${t}${'ABCDEFGHIJK'[10 - score] || 'K'}-${hash(`${name.trim()}|${t}|${score}|vbday4`)}`; }
$('#gradeBtn').onclick = () => {
  const s = Q[tab], n = ans[tab].filter((a, k) => answered(s.qs[k], a)).length;
  attempted[tab] = true;
  if (n < 10 && !confirm(`아직 ${10 - n}문항에 답하지 않았습니다. 그래도 채점할까요? (미응답은 오답 처리)`)) { render(); return; }
  graded[tab] = true; render();
};
$('#resetBtn').onclick = () => {
  if (!confirm(`${tab + 1}교시 답을 모두 지우고 다시 풀까요?`)) return;
  graded[tab] = false; attempted[tab] = false;
  ans[tab] = Q[tab].qs.map((q, k) => init(q, `${tab}-${k}`)); render();
};
$('#name').oninput = render;

// ── 제출 · 오답 정리 ──
let lastHtml = '', lastText = '';
function buildReport(){
  const nm = $('#name').value.trim() || '(이름 없음)', ds = new Date().toLocaleString('ko-KR');
  let h = `<h3>Vision 기본 모델 Day 4 개념 워크시트 — 오답 정리</h3><div class="meta">${esc(nm)} · ${ds}</div>`;
  let t = `Vision 기본 모델 Day 4 개념 워크시트 — 오답 정리\n이름: ${nm}\n일시: ${ds}\n\n`;
  let tot = 0, cnt = 0;
  const byType = {};
  Q.forEach((s, i) => {
    if (!graded[i]) return;
    const sc = scoreOf(i); tot += sc; cnt++;
    s.qs.forEach((q, k) => { const b = byType[q.type] ||= [0, 0]; b[1]++; if (correct(q, ans[i][k])) b[0]++; });
    const code = $('#name').value.trim() ? codeFor($('#name').value, i + 1, sc) : '—';
    const wrong = s.qs.map((q, k) => ({ q, k, a: ans[i][k] })).filter(x => !correct(x.q, x.a));
    h += `<div class="sec">${esc(s.t)} — ${sc}/10 · 결과 코드 ${code}</div>`;
    t += `[${s.t}] ${sc}/10 · 결과 코드 ${code}\n`;
    if (!wrong.length) { h += `<div class="ok">전부 정답 🎉</div>`; t += '  전부 정답\n\n'; return; }
    h += '<table><tr><th>#</th><th>유형</th><th>문항</th><th>내 답</th><th>정답</th><th>다시 볼 곳</th></tr>';
    wrong.forEach(({ q, k, a }) => {
      const qt = strip(q.type === 'flash' ? q.front : (q.p || q.p2 || '')).replace(/\s+/g, ' ').slice(0, 70);
      const my = fmt(q, a, false), co = fmt(q, a, true);
      h += `<tr><td>${k + 1}</td><td>${TYPES[q.type].n}</td><td>${esc(qt)}</td><td class="bad">${esc(my)}</td><td class="ok">${esc(co)}</td><td>${esc(strip(q.an))}</td></tr>`;
      t += `  ${k + 1}. [${TYPES[q.type].n}] ${qt}\n     내 답: ${my}\n     정답: ${co}\n     다시 볼 곳: ${strip(q.an)}\n`;
    });
    h += '</table>'; t += '\n';
  });
  const notGraded = Q.map((s, i) => graded[i] ? null : i + 1).filter(x => x);
  const typeLine = Object.entries(byType).map(([k, [c, n]]) => `${TYPES[k].n} ${c}/${n}`).join(' · ');
  const sum = `<div class="sum"><span>채점한 교시 ${cnt}/8</span><span>합계 ${tot}/${cnt * 10}</span>${notGraded.length ? `<span class="none">미채점: ${notGraded.join(', ')}교시</span>` : ''}</div>` + (typeLine ? `<div class="meta">유형별 정답: ${typeLine}</div>` : '');
  h = h.replace('</div>', '</div>' + sum);
  t = t.replace('\n\n', `\n채점한 교시 ${cnt}/8 · 합계 ${tot}/${cnt * 10}${notGraded.length ? ' · 미채점 ' + notGraded.join(', ') + '교시' : ''}\n유형별 정답: ${typeLine}\n\n`);
  lastHtml = h; lastText = t;
  return h;
}
$('#submitBtn').onclick = () => {
  if (!graded.some(x => x)) { alert('먼저 한 교시 이상 채점하세요.'); return; }
  $('#dgBody').innerHTML = buildReport(); $('#toast').textContent = ''; $('#dlg').showModal();
};
$('#closeBtn').onclick = () => $('#dlg').close();
$('#captureBtn').onclick = async () => {
  const htmlDoc = `<meta charset="utf-8">` + lastHtml.replace(/ class="[^"]*"/g, '').replace(/<table>/g, '<table border="1" style="border-collapse:collapse">');
  try {
    if (navigator.clipboard && window.ClipboardItem) {
      await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([htmlDoc], { type: 'text/html' }), 'text/plain': new Blob([lastText], { type: 'text/plain' }) })]);
      $('#toast').textContent = '복사했습니다 — 노션에 붙여 넣으세요.'; return;
    }
  } catch (e) {}
  const ta = document.createElement('textarea'); ta.value = lastText; ta.style.position = 'fixed'; ta.style.opacity = '0';
  $('#dlg').appendChild(ta); ta.focus(); ta.select();
  const ok = document.execCommand('copy'); ta.remove();
  $('#toast').textContent = ok ? '텍스트로 복사했습니다.' : '복사하지 못했습니다 — 직접 선택해 복사하세요.';
};

$('#legend').innerHTML = Object.values(TYPES).map(t => `<span class="tag" style="color:${t.c};border-color:${t.c}55">${t.n}</span>`).join('');
// worksheet.html#t3 → 3교시 탭으로 바로 열기 (노트북 교시별 링크)
function fromHash(){ const m = location.hash.match(/^#t([1-8])$/); if (m) { tab = +m[1] - 1; } }
fromHash();
window.addEventListener('hashchange', () => { fromHash(); render(); window.scrollTo({ top: 0 }); });
render();
</script>
</body>
