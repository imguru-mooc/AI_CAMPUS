<button data-id="d4-3" aria-current="false"><span class="p">3교시</span><span class="no">D4-3</span><span class="tt">IoU · NMS</span><span class="d">IoU = 교집합 / 합집합 (0.1429 · 0.6807) · greedy NMS 5박스 예제 · iou_thr 0.5 → keep [0, 2] · 0.85 → 5개 · conf threshold vs IoU threshold</span></button>

 {n:&#x27;① 분류기: 라벨 하나&#x27;,ex:&#x27;&lt;p&gt;&lt;b&gt;분류&lt;/b&gt; (Day 1~3) 은 이미지 한 장 → 라벨 하나 (&quot;person&quot;). 사람이 &lt;b&gt;몇 명&lt;/b&gt;인지, &lt;b&gt;어디&lt;/b&gt;에 있는지는 출력에 없습니다.&lt;/p&gt;&lt;p&gt;&lt;b class=&quot;amber&quot;&gt;탐지 (detection)&lt;/b&gt; 는 물체마다 &lt;b&gt;(클래스, 박스, 점수)&lt;/b&gt; 를 냅니다. 오늘의 주제: &quot;무엇이&quot; → &quot;무엇이 &lt;b&gt;어디에&lt;/b&gt;&quot;.&lt;/p&gt;&#x27;,

&lt;div class=&quot;app&quot;&gt;
&lt;h1&gt;bbox 좌표계&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;2교시 — 박스를 숫자 4개로 적는 방법은 여러 가지입니다. 같은 사람 박스가 데이터셋 · 라이브러리마다 다른 숫자로 적혀 있으니 &lt;b style=&quot;color:var(--amber)&quot;&gt;형식을 바꾸는 함수&lt;/b&gt;가 필요합니다. 그림 위에서 &lt;b&gt;박스를 끌어 옮기거나 모서리를 끌어 크기를 바꿔&lt;/b&gt; 보세요 (빈 곳을 끌면 새 박스).&lt;/p&gt;

  $(&#x27;#oI&#x27;).textContent=ithr.toFixed(2);$(&#x27;#oC&#x27;).textContent=cthr.toFixed(2);$(&#x27;#sI&#x27;).value=ithr;$(&#x27;#sC&#x27;).value=cthr;
  $(&#x27;#nstep&#x27;).textContent=`단계 ${si+1} / ${EV.length}`;
  const done=si&gt;=EV.length-1;$(&#x27;#keep&#x27;).innerHTML=done?`keep = [${S.keep.join(&#x27;, &#x27;)}] &lt;span class=&quot;lab&quot;&gt;(${S.keep.length}개)&lt;/span&gt;`:`keep = [${S.keep.join(&#x27;, &#x27;)}…] &lt;span class=&quot;lab&quot;&gt;진행 중&lt;/span&gt;`;
  const ref=e&amp;&amp;(e.t===&#x27;sup&#x27;||e.t===&#x27;pass&#x27;||e.t===&#x27;keep&#x27;)?e.i:null;
  $(&#x27;#nt&#x27;).innerHTML=&#x27;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;박스 xyxy&lt;/th&gt;&lt;th&gt;점수&lt;/th&gt;&lt;th&gt;IoU (#&#x27;+(ref??&#x27;—&#x27;)+&#x27; 와)&lt;/th&gt;&lt;th&gt;상태&lt;/th&gt;&lt;/tr&gt;&#x27;+[0,1,2,3,4].map(i=&gt;{const st=S.st[i];const cls=st===&#x27;keep&#x27;?&#x27;ok1&#x27;:st===&#x27;제거&#x27;?&#x27;bad1&#x27;:st===&#x27;conf 탈락&#x27;?&#x27;dim&#x27;:&#x27;&#x27;;
    return `&lt;tr class=&quot;${e&amp;&amp;(e.j===i||(e.t===&#x27;keep&#x27;&amp;&amp;e.i===i))?&#x27;cur&#x27;:&#x27;&#x27;}&quot;&gt;&lt;td&gt;&lt;span class=&quot;sw&quot; style=&quot;background:${C[i]}&quot;&gt;&lt;/span&gt;${i}&lt;/td&gt;&lt;td&gt;[${NB[i].join(&#x27;, &#x27;)}]&lt;/td&gt;&lt;td&gt;${NS[i].toFixed(2)}&lt;/td&gt;&lt;td&gt;${ref==null||ref===i?&#x27;—&#x27;:f4(iou(NB[ref],NB[i]))}&lt;/td&gt;&lt;td class=&quot;st ${cls}&quot;&gt;${st}${S.by[i]?` (#${S.by[i][0]})`:&#x27;&#x27;}&lt;/td&gt;&lt;/tr&gt;`;}).join(&#x27;&#x27;);}
function regen(keepEnd=true){EV=events();si=keepEnd?EV.length-1:0;drawN();}
function nStatus(){const S=stateAt(si);setStatus(si&gt;=EV.length-1?&#x27;ok&#x27;:&#x27;info&#x27;,evMsg(S.cur));}
function nPause(){stopTimer();$(&#x27;#nPlay&#x27;).textContent=&#x27;▶ 자동&#x27;;}
function nGo(i){si=Math.max(0,Math.min(EV.length-1,i));drawN();nStatus();}
$(&#x27;#nFirst&#x27;).onclick=()=&gt;{if(busy)return;nPause();nGo(0);};
$(&#x27;#nPv&#x27;).onclick=()=&gt;{if(busy)return;nPause();nGo(si-1);};
$(&#x27;#nNx&#x27;).onclick=()=&gt;{if(busy)return;nPause();nGo(si+1);};
$(&#x27;#nPlay&#x27;).onclick=()=&gt;{if(busy)return;if(timer){nPause();return;}if(si&gt;=EV.length-1)si=-1;$(&#x27;#nPlay&#x27;).textContent=&#x27;⏸ 멈춤&#x27;;timer=setInterval(()=&gt;{nGo(si+1);if(si&gt;=EV.length-1)nPause();},900);};
$(&#x27;#sI&#x27;).addEventListener(&#x27;input&#x27;,e=&gt;{if(busy)return;nPause();ithr=+e.target.value;regen();nStatus();});
$(&#x27;#sC&#x27;).addEventListener(&#x27;input&#x27;,e=&gt;{if(busy)return;nPause();cthr=+e.target.value;regen();nStatus();});
const NCODE=`&lt;span class=&quot;b&quot;&gt;def&lt;/span&gt; nms(boxes, scores, iou_thr=0.5):
    order = scores.argsort(descending=True)
    keep = []
    &lt;span class=&quot;b&quot;&gt;while&lt;/span&gt; len(order) &amp;gt; 0:
        i = order[0]; keep.append(int(i))
        ious = iou_matrix(boxes[i:i+1], boxes[order[1:]])[0]
        order = order[1:][ious &amp;lt;= iou_thr]  &lt;span class=&quot;c&quot;&gt;# 겹친 것 제거&lt;/span&gt;
    &lt;span class=&quot;b&quot;&gt;return&lt;/span&gt; keep
nms(boxes, scores, 0.5)  &lt;span class=&quot;c&quot;&gt;# [0, 2]&lt;/span&gt;
torchvision.ops.nms(boxes, scores, 0.5)  &lt;span class=&quot;c&quot;&gt;# 같은 인덱스&lt;/span&gt;`;
const ICODE=`&lt;span class=&quot;b&quot;&gt;def&lt;/span&gt; iou_matrix(A, B):  &lt;span class=&quot;c&quot;&gt;# (N,4) xyxy, (M,4) → (N,M)&lt;/span&gt;
    lt = torch.max(A[:, None, :2], B[None, :, :2])
    rb = torch.min(A[:, None, 2:], B[None, :, 2:])
    wh = (rb - lt).clamp(min=0)  &lt;span class=&quot;c&quot;&gt;# 안 겹치면 0&lt;/span&gt;
    inter = wh[..., 0] * wh[..., 1]
    area = &lt;span class=&quot;b&quot;&gt;lambda&lt;/span&gt; b: (b[:, 2] - b[:, 0]) * (b[:, 3] - b[:, 1])
    &lt;span class=&quot;b&quot;&gt;return&lt;/span&gt; inter / (area(A)[:, None] + area(B)[None, :] - inter)
iou_matrix(t([[0,0,10,10]]), t([[5,5,15,15]]))  &lt;span class=&quot;c&quot;&gt;# 0.1429&lt;/span&gt;
torchvision.ops.box_iou(...)  &lt;span class=&quot;c&quot;&gt;# 같은 값&lt;/span&gt;`;
function stop(){nPause();}
async function stepAll(ms){nPause();si=0;drawN();nStatus();await sleep(ms);while(si&lt;EV.length-1){si++;drawN();nStatus();await sleep(ms);}}
const PS=[
 {n:&#x27;① IoU 0.1429&#x27;,ex:&#x27;&lt;p&gt;&lt;b&gt;IoU&lt;/b&gt; (Intersection over Union) = 교집합 넓이 / 합집합 넓이. 교집합 폭 = max(0, min(x2) − max(x1)), 높이도 같은 식.&lt;/p&gt;&lt;p&gt;[0,0,10,10] vs [5,5,15,15]: 교집합 5×5 = &lt;b&gt;25&lt;/b&gt;, 합집합 100 + 100 − 25 = &lt;b&gt;175&lt;/b&gt; → &lt;b class=&quot;amber&quot;&gt;0.1429&lt;/b&gt;. 반이나 겹친 것 같지만 IoU 는 작습니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{setCode(ICODE);A=EX[0][0].slice();Bx=EX[0][1].slice();VW=EX[0][2];showI=false;showU=false;drawI();setStatus(&#x27;info&#x27;,&#x27;A = [0, 0, 10, 10], B = [5, 5, 15, 15]&#x27;);await sleep(700);showI=true;drawI();setStatus(&#x27;info&#x27;,&#x27;교집합 폭 = max(0, min(10, 15) − max(0, 5)) = 5 → 5 × 5 = 25&#x27;);await sleep(1000);showU=true;drawI();setStatus(&#x27;info&#x27;,&#x27;합집합 = 100 + 100 − 25 = 175&#x27;);await sleep(900);const P=drawI();window.__d4.iou1=+f4(P.v);setStatus(&#x27;ok&#x27;,&#x27;IoU = 25 / 175 = 0.1429&#x27;);}},
 {n:&#x27;② IoU 0.6807&#x27;,ex:&#x27;&lt;p&gt;[50,50,150,150] vs [60,60,160,160]: 교집합 90×90 = &lt;b&gt;8,100&lt;/b&gt;, 합집합 10,000 + 10,000 − 8,100 = &lt;b&gt;11,900&lt;/b&gt; → &lt;b class=&quot;purple&quot;&gt;0.6807&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;10 픽셀씩만 어긋나도 IoU 는 0.68. &lt;code&gt;iou_matrix(A, B)&lt;/code&gt; (N×M, 브로드캐스팅) 는 &lt;code&gt;torchvision.ops.box_iou&lt;/code&gt; 와 같은 값.&lt;/p&gt;&#x27;,
  run:async()=&gt;{setCode(ICODE);const P=await setPair(...EX[1]);window.__d4.iou2=+f4(P.v);await sleep(600);setStatus(&#x27;ok&#x27;,&#x27;8,100 / 11,900 = 0.6807&#x27;);}},
 {n:&#x27;③ 같은 박스 1 · 안 겹침 0&#x27;,ex:&#x27;&lt;p&gt;완전히 같은 박스 → 교집합 = 합집합 → &lt;b&gt;IoU = 1&lt;/b&gt;. 안 겹치면 교집합 폭이 max(0, 음수) = 0 → &lt;b&gt;IoU = 0&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;B 를 A 위에서 오른쪽으로 밀면 IoU 가 1 → 0 으로 줄어듭니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{setCode(ICODE);A=[50,50,150,150];VW={x0:20,y0:20,w:280,h:210};const out=[];for(let d=0;d&lt;=120;d+=10){Bx=[50+d,50,150+d,150];const P=drawI();out.push(+f4(P.v));setStatus(&#x27;info&#x27;,`B 를 ${d} 만큼 이동 → IoU ${f4(P.v)}`);await sleep(d===0?800:170);}window.__d4.slide=out;setStatus(&#x27;ok&#x27;,&#x27;같은 박스 1.0000 → 안 겹침 0.0000&#x27;);}},
 {n:&#x27;④ NMS iou 0.5 → [0, 2]&#x27;,ex:&#x27;&lt;p&gt;&lt;b&gt;Greedy NMS&lt;/b&gt;: 점수 높은 순 정렬 → 가장 높은 것 keep → 그것과 IoU &amp;gt; iou_thr 인 박스 제거 → 남은 것에서 반복.&lt;/p&gt;&lt;p&gt;IoU(0,1) = &lt;b&gt;0.8005&lt;/b&gt;, IoU(0,3) = &lt;b&gt;0.7808&lt;/b&gt;, IoU(2,4) = &lt;b&gt;0.7500&lt;/b&gt; → iou_thr 0.5 이면 1 · 3 · 4 가 지워지고 &lt;b class=&quot;teal&quot;&gt;keep [0, 2]&lt;/b&gt;. &lt;code&gt;torchvision.ops.nms&lt;/code&gt; 와 같은 인덱스.&lt;/p&gt;&#x27;,
  run:async()=&gt;{setCode(NCODE);ithr=0.5;cthr=0;regen(false);await stepAll(650);window.__d4.keep05=stateAt(si).keep;}},
 {n:&#x27;⑤ conf 0.5 먼저&#x27;,ex:&#x27;&lt;p&gt;&lt;b&gt;conf threshold&lt;/b&gt; 를 먼저 적용: 점수 0.40 인 #4 가 NMS 전에 빠집니다. 그다음 NMS (iou 0.5) → 그래도 &lt;b&gt;[0, 2]&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;conf 를 올리면 탐지 개수 · 오탐이 줄고, 너무 올리면 진짜 사람도 놓칩니다 (4교시 Precision · Recall).&lt;/p&gt;&#x27;,
  run:async()=&gt;{setCode(NCODE.replace(&#x27;nms(boxes, scores, 0.5)  &#x27;,&#x27;m = scores &amp;gt;= 0.5; nms(boxes[m], scores[m], 0.5)&#x27;).replace(&#x27;&lt;span class=&quot;c&quot;&gt;# [0, 2]&lt;/span&gt;&#x27;,&#x27;&lt;span class=&quot;c&quot;&gt;# #4 (0.40) 먼저 빠짐 → [0, 2]&lt;/span&gt;&#x27;));ithr=0.5;cthr=0.5;regen(false);await stepAll(600);window.__d4.keepC=stateAt(si).keep;}},
 {n:&#x27;⑥ iou 0.85 → 5개&#x27;,ex:&#x27;&lt;p&gt;iou_thr 를 &lt;b&gt;0.85&lt;/b&gt; 로 올리면 가장 많이 겹친 쌍 (IoU 0.8005) 도 기준 이하 → 아무것도 안 지워져 &lt;b class=&quot;red&quot;&gt;5개 모두&lt;/b&gt; 남습니다 (중복).&lt;/p&gt;&lt;p&gt;반대로 너무 낮추면 (예: 0.05) 붙어 있는 &lt;b&gt;다른 사람&lt;/b&gt;까지 지울 수 있습니다. YOLOv8 기본 NMS IoU 는 0.7 (6교시).&lt;/p&gt;&#x27;,
  run:async()=&gt;{setCode(NCODE);cthr=0;const out=[];for(const t of [0.5,0.6,0.7,0.75,0.8,0.85]){ithr=t;regen();out.push([t,stateAt(si).keep.length]);setStatus(&#x27;info&#x27;,`iou_thr ${t.toFixed(2)} → keep [${stateAt(si).keep.join(&#x27;, &#x27;)}]`);await sleep(650);}window.__d4.thrSweep=out;setStatus(&#x27;ok&#x27;,&#x27;iou_thr 0.85 → keep [0, 1, 2, 3, 4] — 5개 모두 (중복 남음)&#x27;);}},
];
predict(&#x27;#pred&#x27;,&#x27;NMS 의 iou_thr 를 0.5 → 0.85 로 올리면 5개 중 몇 개가 남을까요?&#x27;,[&#x27;2개&#x27;,&#x27;3개&#x27;,&#x27;4개&#x27;,&#x27;5개&#x27;],3,&#x27;가장 많이 겹친 쌍 IoU(0,1) = 0.8005 도 0.85 이하 → 아무것도 지워지지 않아 &lt;b&gt;5개 모두&lt;/b&gt;. IoU threshold 가 높을수록 중복이 남고, 낮을수록 많이 지웁니다.&#x27;);

onRedraw(()=&gt;{drawI();drawN();});

  $(&#x27;#oD&#x27;).textContent=dd+&#x27; px&#x27;;$(&#x27;#sD&#x27;).value=dd;window.__d4.iouTh=[+f4(u),ok];}
$$(&#x27;#iseg button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(busy)return;im=b.dataset.m;drawIt();setStatus(&#x27;info&#x27;,im===&#x27;def&#x27;?&#x27;TP: 정답과 IoU ≥ 0.5 · 같은 정답에 처음 매칭된 것만 / FP: 나머지 (중복 포함) / FN: 못 찾은 정답&#x27;:im===&#x27;ap50&#x27;?&#x27;AP@0.5: IoU 0.5 하나만 — 대충 맞아도 TP&#x27;:&#x27;mAP@0.5:0.95: IoU 0.50, 0.55, …, 0.95 의 AP 10개 평균 — 위치가 정밀해야 높음&#x27;);});

const PS=[
 {n:&#x27;① TP · FP · FN&#x27;,ex:&#x27;&lt;p&gt;&lt;b class=&quot;green&quot;&gt;TP&lt;/b&gt;: 정답과 IoU ≥ 0.5 이고 그 정답에 &lt;b&gt;처음&lt;/b&gt; 매칭된 탐지. &lt;b class=&quot;red&quot;&gt;FP&lt;/b&gt;: 나머지 — 배경을 잡았거나, 이미 매칭된 정답을 또 잡은 &lt;b&gt;중복&lt;/b&gt;. &lt;b class=&quot;amber&quot;&gt;FN&lt;/b&gt;: 아무 탐지도 매칭 안 된 정답 (놓침).&lt;/p&gt;&lt;p&gt;그래서 탐지는 &lt;b&gt;점수 높은 순&lt;/b&gt;으로 매칭합니다 — 높은 점수가 먼저 정답을 차지. NMS 가 덜 지운 중복은 FP 가 됩니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{im=&#x27;def&#x27;;drawIt();setStatus(&#x27;info&#x27;,&#x27;정답 2개 · 탐지 3개&#x27;);await sleep(900);window.__d4.def={tp:1,fp:2,fn:1};setStatus(&#x27;ok&#x27;,&#x27;TP 1 · FP 2 (중복 1, 배경 1) · FN 1 → Precision 1/3, Recall 1/2&#x27;);}},
 {n:&#x27;② 누적 P · R&#x27;,ex:&#x27;&lt;p&gt;정답 &lt;b&gt;4개&lt;/b&gt;, 탐지 5개 (점수 0.95, 0.90, 0.80, 0.60, 0.50) 판정 &lt;b&gt;TP, TP, FP, TP, FP&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;누적 TP 1, 2, 2, 3, 3 / FP 0, 0, 1, 1, 2 → &lt;b class=&quot;teal&quot;&gt;P = 1.00, 1.00, 0.67, 0.75, 0.60&lt;/b&gt;, &lt;b class=&quot;blue&quot;&gt;R = 0.25, 0.50, 0.50, 0.75, 0.75&lt;/b&gt;. threshold 를 내릴수록 (한 줄씩 내려갈수록) Recall 은 늘고 Precision 은 흔들립니다.&lt;/p&gt;&#x27;,

 {n:&#x27;③ envelope&#x27;,ex:&#x27;&lt;p&gt;PR 점은 지그재그. AP 계산 전에 precision 을 &lt;b class=&quot;amber&quot;&gt;오른쪽에서 왼쪽으로 최댓값&lt;/b&gt;으로 바꿉니다 (envelope): &quot;이 recall 이상에서 얻을 수 있는 최고 precision&quot;.&lt;/p&gt;&lt;p&gt;1.00, 1.00, 0.67, 0.75, 0.60 → &lt;b class=&quot;amber&quot;&gt;1, 1, 0.75, 0.75, 0.60&lt;/b&gt;. 0.67 이 오른쪽의 0.75 로 올라갑니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{pause();TPs=DEF.tp.slice();NG=DEF.ng;$(&#x27;#cEnv&#x27;).checked=false;$(&#x27;#cArea&#x27;).checked=false;go(5);await sleep(500);go(6);await sleep(900);window.__d4.env=calc().rows.map(r=&gt;+p2(r.e));setStatus(&#x27;ok&#x27;,&#x27;envelope = 1, 1, 0.75, 0.75, 0.60&#x27;);}},
 {n:&#x27;④ 넓이 = AP 0.6875&#x27;,ex:&#x27;&lt;p&gt;AP = envelope 곡선 아래 넓이 (&lt;b&gt;all-point 보간&lt;/b&gt;, VOC 방식) = Σ (recall 증가분 × envelope).&lt;/p&gt;&lt;p&gt;recall 이 0 → 0.25 → 0.50 → 0.75 로 늘 때만 넓이가 생김: &lt;b class=&quot;amber&quot;&gt;0.25×1 + 0.25×1 + 0.25×0.75 = 0.6875&lt;/b&gt;. recall 이 그대로인 3번 · 5번 (FP) 은 넓이 0. 판정 칸을 눌러 바꿔 보세요.&lt;/p&gt;&#x27;,
  run:async()=&gt;{pause();TPs=DEF.tp.slice();NG=DEF.ng;go(6);await sleep(400);go(7);await sleep(900);const C=calc();window.__d4.ap=+f4(C.ap);setStatus(&#x27;ok&#x27;,`AP = 0.25×1 + 0.25×1 + 0.25×0.75 = ${f4(C.ap)}`);}},

  run:async()=&gt;{im=&#x27;coco&#x27;;const out=[];for(const d of [0,4,8,14,20,28,40]){dd=d;drawIt();const u=iou(predB(),G1);out.push([d,TH.filter(t=&gt;u&gt;=t-1e-9).length]);setStatus(&#x27;info&#x27;,`어긋남 ${d} px → IoU ${f4(u)} → ${out[out.length-1][1]} / 10 threshold 에서 TP`);await sleep(650);}dd=14;drawIt();window.__d4.sweep=out;setStatus(&#x27;ok&#x27;,&#x27;AP@0.5 는 위치가 대충 맞아도 OK · mAP@0.5:0.95 는 10개 평균 → 위치 정밀도까지&#x27;);}},

&lt;div class=&quot;app&quot;&gt;
&lt;h1&gt;Anchor 와 RPN&lt;/h1&gt;

function pick(e){const [W,H]=[acv.clientWidth,acv.clientHeight];const v=view(W,H,SW,SH);const [px,py]=evXY(e,acv);const x=v.ix(px),y=v.iy(py);if(x&lt;0||y&lt;0||x&gt;=SW||y&gt;=SH)return false;const n=[Math.min(FR-1,Math.floor(y/STR)),Math.min(FC-1,Math.floor(x/STR))];if(n[0]===cell[0]&amp;&amp;n[1]===cell[1])return true;cell=n;if(fs&gt;=0){fs=-1;fPause();}nA=9;drawAll();const bb=best(...cell);setStatus(&#x27;info&#x27;,`칸 (행 ${cell[0]}, 열 ${cell[1]}) — anchor 9개 · best IoU ${f4(bb.u)}`);window.__d4.cell=cell.slice();return true;}
acv.addEventListener(&#x27;pointermove&#x27;,e=&gt;{if(busy||lock)return;pick(e);});
acv.addEventListener(&#x27;pointerdown&#x27;,e=&gt;{if(busy)return;lock=false;pick(e);lock=true;});
acv.addEventListener(&#x27;pointerleave&#x27;,()=&gt;{lock=false;});
$(&#x27;#cG&#x27;).addEventListener(&#x27;change&#x27;,drawA);$(&#x27;#cB&#x27;).addEventListener(&#x27;change&#x27;,drawA);
$(&#x27;#bC1&#x27;).onclick=()=&gt;{if(busy)return;fs=-1;cell=[19,14];nA=9;drawAll();const bb=best(19,14);setStatus(&#x27;info&#x27;,`사람 1 중심 칸 (행 19, 열 14) — ${SIZES[bb.a.si]} · ${bb.a.q===1?&#x27;1:1&#x27;:bb.a.q&lt;1?&#x27;1:2&#x27;:&#x27;2:1&#x27;} anchor 가 가장 비슷 (IoU ${f4(bb.u)})`);};
$(&#x27;#bC2&#x27;).onclick=()=&gt;{if(busy)return;fs=-1;cell=[4,22];nA=9;drawAll();setStatus(&#x27;info&#x27;,`배경 칸 (행 4, 열 22) — best IoU ${f4(best(4,22).u)} → &quot;물체 없음&quot; (negative) 으로 학습`);};
const ACODE=`&lt;span class=&quot;b&quot;&gt;from&lt;/span&gt; torchvision.models.detection.anchor_utils &lt;span class=&quot;b&quot;&gt;import&lt;/span&gt; AnchorGenerator
&lt;span class=&quot;c&quot;&gt;# 크기 3 × 비율 3 = 위치마다 9개 (예: 64 · 128 · 256 / 0.5 · 1 · 2)&lt;/span&gt;
H, W, s = 536, 559, 16
fh, fw = math.ceil(H / s), math.ceil(W / s)  &lt;span class=&quot;c&quot;&gt;# 34, 35&lt;/span&gt;
fh * fw * 9  &lt;span class=&quot;c&quot;&gt;# 10,710 anchor&lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;# 모델 출력 = anchor 마다 점수 + (dx, dy, dw, dh)&lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;# dx = (gx - ax) / aw,  dw = log(gw / aw)&lt;/span&gt;`;
function stop(){fPause();}
const PS=[
 {n:&#x27;① stride 16 → 34×35&#x27;,ex:&#x27;&lt;p&gt;backbone 을 통과하면 이미지가 &lt;b&gt;stride 16&lt;/b&gt; 으로 줄어든 특징맵이 됩니다. 559×536 → ⌈536/16⌉ × ⌈559/16⌉ = &lt;b class=&quot;amber&quot;&gt;34 × 35 = 1,190 위치&lt;/b&gt;. 특징맵의 칸 하나 = 이미지의 16×16 영역 (실제로 보는 범위는 더 넓음).&lt;/p&gt;&#x27;,
  run:async()=&gt;{fPause();fs=-1;nA=0;cntV=0;setCode(ACODE);for(gridN=0;gridN&lt;=FR;gridN+=2){drawA();cntV=Math.min(FR,gridN)*FC*9;info();setStatus(&#x27;info&#x27;,`${Math.min(FR,gridN)} 행 × ${FC} 열 = ${fmt(Math.min(FR,gridN)*FC)} 위치`);await sleep(90);}gridN=FR;cntV=FR*FC*9;nA=9;drawAll();window.__d4.fmap=[FR,FC,FR*FC];setStatus(&#x27;ok&#x27;,`특징맵 ${FR} × ${FC} = ${fmt(FR*FC)} 위치`);}},
 {n:&#x27;② anchor 9개 → 10,710&#x27;,ex:&#x27;&lt;p&gt;위치마다 크기 &lt;b&gt;3&lt;/b&gt; (예: 64 · 128 · 256) × 비율 &lt;b&gt;3&lt;/b&gt; (h:w = 1:2 · 1:1 · 2:1) = &lt;b&gt;9개&lt;/b&gt; anchor.&lt;/p&gt;&lt;p&gt;1,190 위치 × 9 = &lt;b class=&quot;red&quot;&gt;10,710 anchor&lt;/b&gt;. sliding window 806 창 (크기 하나) 과 달리 크기 · 비율이 여러 개인데도, 특징맵을 &lt;b&gt;한 번&lt;/b&gt; 계산하고 공유하므로 빠릅니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{fPause();fs=-1;gridN=FR;cell=[19,14];setCode(ACODE);for(nA=1;nA&lt;=9;nA++){drawA();info();const a=anchors(...cell)[nA-1];setStatus(&#x27;info&#x27;,`anchor ${nA}: 크기 ${SIZES[a.si]} · h:w ${a.q===1?&#x27;1:1&#x27;:a.q&lt;1?&#x27;1:2&#x27;:&#x27;2:1&#x27;}`);await sleep(380);}nA=9;
    for(let t=0;t&lt;=20;t++){cntV=Math.round(FR*FC*9*t/20);info();await sleep(40);}cntV=FR*FC*9;drawAll();window.__d4.anchors=cntV;setStatus(&#x27;ok&#x27;,&#x27;34 × 35 = 1,190 위치 × 9 = 10,710 anchor&#x27;);}},
 {n:&#x27;③ anchor → 오프셋&#x27;,ex:&#x27;&lt;p&gt;모델은 박스를 처음부터 그리지 않고, &lt;b&gt;anchor 를 얼마나 옮기고 늘릴지&lt;/b&gt;를 예측합니다: dx = (gx − ax) / aw, dy = (gy − ay) / ah, dw = log(gw / aw), dh = log(gh / ah).&lt;/p&gt;&lt;p&gt;정답과 IoU 가 큰 anchor 는 &quot;물체&quot; (positive), 작은 anchor 는 &quot;배경&quot; (negative) 으로 학습. 칸을 옮기면 best anchor 와 오프셋이 바뀝니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{fPause();fs=-1;nA=9;$(&#x27;#cB&#x27;).checked=true;setCode(ACODE);const out=[];for(const c of [[19,14],[15,14],[19,10],[19,29],[4,22]]){cell=c;drawAll();const bb=best(...c);out.push(+f4(bb.u));const o=offs(bb.a.b,bb.gt);setStatus(&#x27;info&#x27;,`칸 (${c[0]}, ${c[1]}) best IoU ${f4(bb.u)} → dx ${o[0].toFixed(3)} · dy ${o[1].toFixed(3)} · dw ${o[2].toFixed(3)} · dh ${o[3].toFixed(3)}`);await sleep(1000);}cell=[19,14];drawAll();window.__d4.bestIoU=out;setStatus(&#x27;ok&#x27;,&#x27;anchor + 오프셋 → 박스 · 점수가 높은 것만 다음 단계로&#x27;);}},
 {n:&#x27;④ 2-stage: Faster R-CNN&#x27;,ex:&#x27;&lt;p&gt;&lt;b&gt;Faster R-CNN&lt;/b&gt;: backbone → &lt;b&gt;RPN&lt;/b&gt; 이 anchor 마다 &quot;물체 있음?&quot; + 박스 보정 → 상위 &lt;b&gt;proposal&lt;/b&gt; (수백~수천) → &lt;b&gt;RoI Align&lt;/b&gt; (proposal 마다 7×7 로 잘라냄) → 분류 + 박스 &lt;b&gt;다시&lt;/b&gt; 보정.&lt;/p&gt;&lt;p&gt;두 번 보정하므로 정확하지만 느립니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{fPause();fm=&#x27;2&#x27;;for(let i=0;i&lt;ST2.length;i++){fGo(i);await sleep(1100);}window.__d4.two=ST2.length;}},
 {n:&#x27;⑤ 1-stage: SSD&#x27;,ex:&#x27;&lt;p&gt;&lt;b&gt;SSD / SSDLite&lt;/b&gt;: 여러 해상도 특징맵에서 anchor 마다 &lt;b&gt;클래스 + 박스를 한 번에&lt;/b&gt;. proposal · RoI 단계가 없어 빠르고, 대신 작은 물체에 약합니다.&lt;/p&gt;&lt;p&gt;YOLO (6교시) 도 1-stage. YOLOv8 은 anchor 도 없앴습니다 (anchor-free).&lt;/p&gt;&#x27;,
  run:async()=&gt;{fPause();fm=&#x27;1&#x27;;for(let i=0;i&lt;ST1.length;i++){fGo(i);await sleep(1100);}window.__d4.one=ST1.length;}},
 {n:&#x27;⑥ 같은 backbone 비교&#x27;,ex:&#x27;&lt;p&gt;같은 &lt;b&gt;MobileNetV3-Large&lt;/b&gt; backbone: Faster R-CNN FPN &lt;b&gt;4.49 GFLOPS · mAP 32.8&lt;/b&gt; vs SSDLite320 &lt;b&gt;0.58 GFLOPS · 21.3&lt;/b&gt; — 연산 약 7.7배 차이, 정확도 11.5 포인트 차이.&lt;/p&gt;&lt;p&gt;ResNet-50 FPN 은 134.38 GFLOPS · 37.0. 장치에서 몇 ms 인지는 Colab 에서 직접 잽니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{fPause();fs=-1;for(const h of [[0],[1],[2],[1,2]]){hiM=h;drawPipe();setStatus(&#x27;info&#x27;,h.map(i=&gt;`${MD[i][0]}: ${MD[i][3]} GFLOPS · mAP ${MD[i][4]}`).join(&#x27; / &#x27;));await sleep(1000);}window.__d4.ratio=+(4.49/0.58).toFixed(2);setStatus(&#x27;ok&#x27;,&#x27;같은 backbone: 4.49 vs 0.58 GFLOPS (약 7.7배) · mAP 32.8 vs 21.3&#x27;);hiM=[];}},
];
predict(&#x27;#pred&#x27;,&#x27;559×536 이미지, stride 16, 위치마다 anchor 9개 → anchor 는 모두 몇 개?&#x27;,[&#x27;1,190개&#x27;,&#x27;806개&#x27;,&#x27;8,400개&#x27;,&#x27;10,710개&#x27;],3,&#x27;특징맵 34 × 35 = 1,190 위치 × 9 = &lt;b&gt;10,710&lt;/b&gt;. 806 은 1교시 sliding window 창 수, 8,400 은 6교시 YOLOv8 (640 입력) 예측 수.&#x27;);

function setInp(n){inp=n;sel=null;ds=-1;decode();drawAll();setStatus(&#x27;info&#x27;,`입력 ${n} → ${ncount(n).map(fmt).join(&#x27; + &#x27;)} = ${fmt(ncount(n).reduce((a,b)=&gt;a+b,0))} 칸`);}
$$(&#x27;#iseg button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(busy)return;dPause();setInp(+b.dataset.i);});
$$(&#x27;#sseg button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(busy)return;dPause();sd=+b.dataset.s;ds=-1;if(sel&amp;&amp;sel.s!==sd)sel=null;drawAll();setStatus(&#x27;info&#x27;,`stride ${sd} → ${inp/sd}×${inp/sd} = ${fmt((inp/sd)**2)} 칸 · 칸 하나 = ${sd}×${sd} 픽셀`);});
$(&#x27;#yc&#x27;).addEventListener(&#x27;pointerdown&#x27;,e=&gt;{if(busy)return;const cv=$(&#x27;#yc&#x27;),v=V(cv.clientWidth,cv.clientHeight),[px,py]=evXY(e,cv),x=v.ix(px),y=v.iy(py);if(x&lt;0||y&lt;0||x&gt;=inp||y&gt;=inp)return;dPause();ds=-1;sel={s:sd,i:Math.floor(y/sd),j:Math.floor(x/sd)};drawAll();const p=cellPred(sd,sel.i,sel.j);setStatus(&#x27;info&#x27;,`칸 (stride ${sd}, 행 ${sel.i}, 열 ${sel.j}) → person 점수 ${p.cls[0].toFixed(3)} (모식)`);});
const DCODE=`&lt;span class=&quot;c&quot;&gt;# letterbox: 비율 유지 + 114 패딩 · BGR→RGB · /255 · CHW&lt;/span&gt;
x = letterbox(img, 640)
out = model.model(x)[0]  &lt;span class=&quot;c&quot;&gt;# (1, 84, 8400)&lt;/span&gt;
p = out[0].T  &lt;span class=&quot;c&quot;&gt;# (8400, 84)&lt;/span&gt;
scores, cls = p[:, 4:].max(1)  &lt;span class=&quot;c&quot;&gt;# 클래스 최댓값 = 점수&lt;/span&gt;
m = scores &amp;gt;= 0.25
cx, cy, w, h = p[m, :4].T
xyxy = torch.stack([cx - w/2, cy - h/2, cx + w/2, cy + h/2], 1)
keep = torchvision.ops.nms(xyxy, scores[m], 0.7)
&lt;span class=&quot;c&quot;&gt;# 원본 좌표: 패딩 빼고 scale 로 나눔&lt;/span&gt;
xyxy = (xyxy[keep] - pad) / scale
&lt;span class=&quot;c&quot;&gt;# = model.predict → r.boxes.xyxy · conf · cls&lt;/span&gt;`;
function stop(){dPause();}
const PS=[
 {n:&#x27;① 3 크기 grid&#x27;,ex:&#x27;&lt;p&gt;YOLOv8 head 는 stride &lt;b&gt;8 · 16 · 32&lt;/b&gt; 세 해상도에서 예측합니다. 640 입력 → &lt;b&gt;80×80&lt;/b&gt; (작은 물체) · &lt;b&gt;40×40&lt;/b&gt; · &lt;b&gt;20×20&lt;/b&gt; (큰 물체).&lt;/p&gt;&lt;p&gt;칸 하나 = 8×8 · 16×16 · 32×32 픽셀. Penn-Fudan 사람처럼 큰 물체는 주로 stride 32 칸에서 점수가 높습니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{dPause();ds=-1;inp=640;sel=null;decode();for(const s of [8,16,32]){sd=s;drawAll();setStatus(&#x27;info&#x27;,`stride ${s} → ${640/s}×${640/s} = ${fmt((640/s)**2)} 칸`);await sleep(1000);}window.__d4.grids=STRIDES.map(s=&gt;640/s);setStatus(&#x27;ok&#x27;,&#x27;80×80 · 40×40 · 20×20 — 같은 이미지를 세 크기 grid 로&#x27;);}},
 {n:&#x27;② 8,400 vs 2,100&#x27;,ex:&#x27;&lt;p&gt;예측 개수 = (640/8)² + (640/16)² + (640/32)² = 6,400 + 1,600 + 400 = &lt;b class=&quot;amber&quot;&gt;8,400&lt;/b&gt;. 입력 320 → 1,600 + 400 + 100 = &lt;b class=&quot;blue&quot;&gt;2,100&lt;/b&gt; — 4배 적음 (입력 크기² 에 비례).&lt;/p&gt;&lt;p&gt;8교시에 320 / 640 해상도의 AP 와 속도를 비교합니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{dPause();const out=[];for(const n of [640,320,640]){setInp(n);out.push(drawCnt());await sleep(1100);}window.__d4.counts=out.slice(0,2);setStatus(&#x27;ok&#x27;,&#x27;640 → 8,400 · 320 → 2,100&#x27;);}},
 {n:&#x27;③ 칸 하나 = 84 숫자&#x27;,ex:&#x27;&lt;p&gt;원시 출력 &lt;code&gt;model.model(x)[0]&lt;/code&gt; 모양 &lt;b&gt;(1, 84, 8400)&lt;/b&gt;: 칸마다 박스 4 (&lt;b&gt;cx, cy, w, h&lt;/b&gt; — 입력 640 픽셀 단위) + COCO &lt;b&gt;80&lt;/b&gt; 클래스 점수 (sigmoid, 서로 독립).&lt;/p&gt;&lt;p&gt;YOLOv8 에는 별도 &quot;objectness&quot; 가 없습니다 — 80 점수 중 최댓값이 그 칸의 점수. 사람 위 칸은 person (0) 이 높고, 배경 칸은 모두 낮습니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{dPause();ds=-1;if(inp!==640){inp=640;decode();}const out=[];for(const c of [[32,11,8],[16,22,16],[8,40,30],[32,2,3]]){sd=c[0];sel={s:c[0],i:c[1],j:c[2]};drawAll();const p=cellPred(...c);out.push(+p.cls[0].toFixed(3));setStatus(&#x27;info&#x27;,`stride ${c[0]} 칸 (${c[1]}, ${c[2]}) → person ${p.cls[0].toFixed(3)} (모식)`);await sleep(1200);}sd=32;sel={s:32,i:11,j:8};drawAll();window.__d4.cellScores=out;setStatus(&#x27;ok&#x27;,&#x27;칸 = 출력 텐서의 한 열 · 84 = 박스 4 + 클래스 80&#x27;);}},
 {n:&#x27;④ conf → NMS&#x27;,ex:&#x27;&lt;p&gt;후처리: (1, 84, 8400) → 전치 (8400, 84) → 클래스 최댓값 = 점수 → &lt;b&gt;conf ≥ 0.25&lt;/b&gt; 인 후보만 → cxcywh → xyxy → &lt;b&gt;NMS (IoU 0.7)&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;사람 한 명에 후보 박스가 여러 개 (이웃 칸 · 다른 stride) → NMS 로 하나씩만 남습니다 (3교시).&lt;/p&gt;&#x27;,
  run:async()=&gt;{dPause();if(inp!==640){inp=640;}decode();for(let i=0;i&lt;=5;i++){dGo(i);await sleep(1000);}window.__d4.dec=[CAND.length,KEEP.length];}},
 {n:&#x27;⑤ 원본 좌표로&#x27;,ex:&#x27;&lt;p&gt;박스는 letterbox 입력 (640) 좌표 → &lt;b&gt;패딩을 빼고 scale 로 나눠&lt;/b&gt; 원본 559×536 좌표로. scale = min(640/536, 640/559) = &lt;b&gt;1.1449&lt;/b&gt;, 위 패딩 13.&lt;/p&gt;&lt;p&gt;직접 디코드한 결과 = ultralytics &lt;code&gt;model.predict&lt;/code&gt; 결과 (&lt;code&gt;r.boxes.xyxy&lt;/code&gt;, &lt;code&gt;r.boxes.conf&lt;/code&gt;, &lt;code&gt;r.boxes.cls&lt;/code&gt;, &lt;code&gt;r.plot()&lt;/code&gt;, &lt;code&gt;r.speed&lt;/code&gt;).&lt;/p&gt;&#x27;,
  run:async()=&gt;{dPause();if(inp!==640)inp=640;decode();dGo(5);await sleep(700);dGo(6);await sleep(900);const L=lb(640);window.__d4.lb=[+L.s.toFixed(4),L.nw,L.nh,L.top];setStatus(&#x27;ok&#x27;,`원본 좌표 = (xy − pad) / ${L.s.toFixed(4)} — 정답 박스와 거의 같음 (모식)`);}},
 {n:&#x27;⑥ 구조 · 버전&#x27;,ex:&#x27;&lt;p&gt;&lt;b&gt;Backbone&lt;/b&gt; (특징 추출, CSP) → &lt;b&gt;Neck&lt;/b&gt; (FPN + PAN, 해상도 섞기) → &lt;b&gt;Head&lt;/b&gt; (stride 8 · 16 · 32 세 크기에서 예측).&lt;/p&gt;&lt;p&gt;버전 흐름: YOLOv1 (2016, grid) → v2/v3 (anchor · 다중 스케일) → v4/v5 (CSP · 증강) → &lt;b class=&quot;amber&quot;&gt;v8&lt;/b&gt; (2023, anchor-free · decoupled head) → 이후 버전들.&lt;/p&gt;&#x27;,

  run:async()=&gt;{stopTimer();setT(CPU,&#x27;CPU 가정 값&#x27;);for(let i=0;i&lt;STG.length;i++){curS=i;drawV();drawT();setStatus(&#x27;info&#x27;,`${i+1}. ${STG[i][0]} (${STG[i][2]}) — ${T[STG[i][1]]} ms`);await sleep(650);}curS=-1;for(let k=0;k&lt;12;k++){frame=(frame+1)%NF;drawV();await sleep(70);}drawT();window.__d4.stages=STG.length;setStatus(&#x27;ok&#x27;,`합계 ${sum()} ms → ${(1000/sum()).toFixed(1)} FPS (가정 값)`);}},
 {n:&#x27;② 10 FPS vs 30 FPS 예산&#x27;,ex:&#x27;&lt;p&gt;실시간 조건: &lt;b&gt;10 FPS&lt;/b&gt; 영상 → 프레임당 &lt;b class=&quot;amber&quot;&gt;100 ms&lt;/b&gt;, &lt;b&gt;30 FPS&lt;/b&gt; 카메라 → &lt;b class=&quot;red&quot;&gt;33 ms&lt;/b&gt;. 모든 단계의 합이 예산 안에 들어와야 합니다.&lt;/p&gt;&lt;p&gt;추론 시간을 바꾸면 FPS 가 1000 / 합계 로 바뀝니다. 저장용 처리 (오프라인) 는 느려도 결과는 같지만, 현장 카메라는 프레임을 놓칩니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{stopTimer();T={...CPU};src=&#x27;CPU 가정 값&#x27;;const out=[];for(const i of [20,25,40,60,90,120,60]){T.inf=i;src=&#x27;추론만 바꿈 (가정)&#x27;;out.push(+drawT().toFixed(1));drawV();setStatus(sum()&lt;=1000/30?&#x27;ok&#x27;:sum()&lt;=100?&#x27;info&#x27;:&#x27;warn&#x27;,`추론 ${i} ms → 합계 ${sum()} ms → ${(1000/sum()).toFixed(1)} FPS · 10 FPS ${sum()&lt;=100?&#x27;✓&#x27;:&#x27;✗&#x27;} · 30 FPS ${sum()&lt;=1000/30?&#x27;✓&#x27;:&#x27;✗&#x27;}`);await sleep(800);}window.__d4.fpsSweep=out;}},
 {n:&#x27;③ CPU vs GPU (가정)&#x27;,ex:&#x27;&lt;p&gt;GPU 는 추론을 크게 줄입니다 (예: 60 → 8 ms, &lt;b&gt;가정 값&lt;/b&gt;). 그러면 &lt;b&gt;전처리 · 저장&lt;/b&gt; 같은 CPU 쪽 단계가 상대적으로 커집니다 — 다음 병목.&lt;/p&gt;&lt;p&gt;노트북에서 GPU / CPU 로 단계별 시간을 직접 재 보세요. Colab T4 와 현장 장치는 숫자가 다릅니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{stopTimer();const out=[];for(const [o,n] of [[CPU,&#x27;CPU 가정 값&#x27;],[GPU,&#x27;GPU 가정 값&#x27;],[CPU,&#x27;CPU 가정 값&#x27;],[GPU,&#x27;GPU 가정 값&#x27;]]){setT(o,n);out.push(+(1000/sum()).toFixed(1));setStatus(&#x27;info&#x27;,`${n}: 추론 ${o.inf} ms · 합계 ${sum()} ms → ${(1000/sum()).toFixed(1)} FPS`);await sleep(900);}window.__d4.cpuGpu=out.slice(0,2);setStatus(&#x27;ok&#x27;,`CPU ${out[0]} FPS vs GPU ${out[1]} FPS (가정 값) — GPU 에서는 전처리 · 저장이 다음 병목`);}},
 {n:&#x27;④ letterbox&#x27;,ex:&#x27;&lt;p&gt;&lt;b&gt;letterbox&lt;/b&gt;: 비율을 유지해 축소 — &lt;b&gt;scale = min(640/H, 640/W)&lt;/b&gt; — 하고 남는 곳을 회색 &lt;b&gt;114&lt;/b&gt; 로 채워 640×640. 그다음 BGR→RGB, /255, CHW.&lt;/p&gt;&lt;p&gt;768×576 영상: min(640/576, 640/768) = &lt;b&gt;0.8333&lt;/b&gt; → 640×480 + 위 · 아래 80. 세로 영상이면 좌우에 패딩.&lt;/p&gt;&#x27;,
  run:async()=&gt;{const out=[];for(let i=0;i&lt;LS.length;i++){li=i;out.push(drawL());setStatus(&#x27;info&#x27;,`${LS[i][2]}: scale ${out[i][0]} → ${out[i][1]}×${out[i][2]}`);await sleep(1000);}li=0;drawL();window.__d4.lb=out;setStatus(&#x27;ok&#x27;,&#x27;768×576 → scale 0.8333 → 640×480 + 패딩 80 / 80 (114)&#x27;);}},
 {n:&#x27;⑤ 실행 예 (CPU)&#x27;,ex:&#x27;&lt;p&gt;강사 사전 실행 (CPU, YOLOv8n 640): 전처리 &lt;b class=&quot;rv&quot; data-r=&quot;vid_pre&quot;&gt;&lt;/b&gt; ms · 추론 &lt;b class=&quot;rv&quot; data-r=&quot;vid_inf&quot;&gt;&lt;/b&gt; ms · 후처리 &lt;b class=&quot;rv&quot; data-r=&quot;vid_post&quot;&gt;&lt;/b&gt; ms → 전체 약 &lt;b class=&quot;rv&quot; data-r=&quot;vid_fps&quot;&gt;&lt;/b&gt; FPS.&lt;/p&gt;&lt;p&gt;숫자는 &lt;b&gt;실행 예&lt;/b&gt; — 장치 · 런타임마다 다릅니다. 각자 Colab 에서 GPU / CPU 로 재 보세요. 더 빠르게: 입력 320 (8교시), ONNX · TensorRT (11/4~), Quantization (11/16~).&lt;/p&gt;&#x27;,
  run:async()=&gt;{stopTimer();fillR(R);const ok=loadRes();if(ok){play();await sleep(2500);stopTimer();$(&#x27;#bPlay&#x27;).textContent=&#x27;▶ 재생&#x27;;curS=-1;drawV();}else{await sleep(600);}window.__d4.res=ok;fillR(R);}},
];
predict(&#x27;#pred&#x27;,&#x27;10 FPS 영상을 실시간으로 처리하려면 한 프레임을 몇 ms 안에 끝내야 할까요?&#x27;,[&#x27;10 ms&#x27;,&#x27;33 ms&#x27;,&#x27;100 ms&#x27;,&#x27;1,000 ms&#x27;],2,&#x27;1000 ms / 10 프레임 = &lt;b&gt;100 ms&lt;/b&gt;. 30 FPS 카메라는 1000 / 30 ≈ 33 ms. 추론뿐 아니라 읽기 · 전처리 · 후처리 · 그리기 · 저장을 모두 더한 시간입니다.&#x27;);
initPresets(PS,stop);
fillR(R);setCode(CODE);drawT();drawV();drawL();
onRedraw(()=&gt;{drawT();drawV();drawL();});

&lt;div class=&quot;app&quot;&gt;
&lt;h1&gt;탐지기 고르기&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;8교시 미니 프로젝트 — 오늘 직접 만든 &lt;code&gt;evaluate_ap&lt;/code&gt; 로 &lt;b style=&quot;color:var(--teal)&quot;&gt;YOLOv8n&lt;/b&gt; · &lt;b style=&quot;color:var(--purple)&quot;&gt;YOLOv8s&lt;/b&gt; 를 Penn-Fudan 170장에서 평가하고, 해상도 (320 / 640) · conf threshold 를 바꿔 &lt;b style=&quot;color:var(--amber)&quot;&gt;현장에 쓸 설정&lt;/b&gt;을 고릅니다. 표의 숫자는 강사 사전 실행 (CPU) 의 &lt;b&gt;실행 예&lt;/b&gt; — 각자 결과는 조금씩 다릅니다.&lt;/p&gt;
&lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill amber&quot;&gt;640 · conf 0.001 로 평가&lt;/span&gt;&lt;span class=&quot;pill teal&quot;&gt;AP@0.5 · mAP@0.5:0.95 · ms/장&lt;/span&gt;&lt;span class=&quot;pill blue&quot;&gt;conf 0.1~0.9 → P · R · F1&lt;/span&gt;&lt;span class=&quot;pill green&quot;&gt;자동 80 + 강사 20&lt;/span&gt;&lt;span class=&quot;pill purple&quot;&gt;실행 예&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;과제 1~5 — 단계를 누르면 코드와 설명&lt;/h2&gt;&lt;div class=&quot;pipe&quot; id=&quot;pipe&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;row ctl&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;bPv&quot;&gt;◀ 이전&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;bNx&quot;&gt;다음 ▶&lt;/button&gt;&lt;/div&gt;
&lt;/div&gt;

 {n:&#x27;④ 운영 threshold 고르기&#x27;,ex:&#x27;&lt;p&gt;운영 threshold 는 목적에 따라: 사람을 &lt;b&gt;놓치면 안 되면&lt;/b&gt; (안전) conf 를 낮게 (Recall 우선), &lt;b&gt;오경보가 싫으면&lt;/b&gt; 높게 (Precision 우선). 기준이 없으면 &lt;b class=&quot;amber&quot;&gt;F1 최대&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;실행 예: F1 최대 conf &lt;b class=&quot;rv&quot; data-r=&quot;best_conf&quot;&gt;&lt;/b&gt; (P &lt;b class=&quot;rv&quot; data-r=&quot;best_p&quot;&gt;&lt;/b&gt;, R &lt;b class=&quot;rv&quot; data-r=&quot;best_r&quot;&gt;&lt;/b&gt;, F1 &lt;b class=&quot;rv&quot; data-r=&quot;best_f1&quot;&gt;&lt;/b&gt;). 속도 예산으로 설정도 고릅니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{goSt(2);const bc=rn(R.best_conf);const bi=F1.indexOf(Math.max(...F1));conf=bc!=null?Math.min(0.9,Math.max(0.1,bc)):CV.c[bi];drawTh();fillR(R);await sleep(700);const out=[];for(const b of [300,100,50,20,100]){bud=b;out.push(decide());setStatus(&#x27;info&#x27;,`예산 ${b} ms → ${out[out.length-1]??&#x27;판단 보류 / 선택 없음&#x27;}`);await sleep(700);}window.__d4.pick=out;setStatus(&#x27;ok&#x27;,`운영 conf ${conf.toFixed(2)} ${bc!=null?&#x27;(F1 최대, 실행 예)&#x27;:CV.real?&#x27;(곡선의 F1 최대)&#x27;:&#x27;(자리표시)&#x27;} · 설정은 예산 안 mAP 최고`);}},
 {n:&#x27;⑤ 영상 카운트 · 해석&#x27;,ex:&#x27;&lt;p&gt;고른 모델 · threshold 로 &lt;code&gt;data/people.mp4&lt;/code&gt; 의 프레임마다 사람 수 → 결과 영상 + CSV. 실행 예: &lt;b class=&quot;rv&quot; data-r=&quot;vid_frames&quot;&gt;&lt;/b&gt; 프레임, 최대 &lt;b class=&quot;rv&quot; data-r=&quot;cnt_max&quot;&gt;&lt;/b&gt; 명, 평균 &lt;b class=&quot;rv&quot; data-r=&quot;cnt_mean&quot;&gt;&lt;/b&gt; 명.&lt;/p&gt;&lt;p&gt;정답에 없는 사람 (작거나 가려진) 은 FP 로 잡혀 Precision 을 깎습니다 — 숫자만 보지 말고 결과 영상을 직접 보세요. 다음: Day 5 세그멘테이션 · 포즈 · ONNX · 성능 측정 → 위험구역 침입 감지.&lt;/p&gt;&#x27;,
  run:async()=&gt;{goSt(3);fillR(R);await sleep(900);goSt(4);await sleep(700);window.__d4.vid=[rs(R.vid_frames),rs(R.cnt_max),rs(R.cnt_mean)];setStatus(&#x27;ok&#x27;,`영상 실행 예: ${rs(R.vid_frames)} 프레임 · 최대 ${rs(R.cnt_max)} 명 · 평균 ${rs(R.cnt_mean)} 명 → 다음은 Day 5`);}},
];
predict(&#x27;#pred&#x27;,&#x27;conf threshold 를 0.5 → 0.2 로 낮추면?&#x27;,[&#x27;Recall ↑ · Precision ↓&#x27;,&#x27;Recall ↓ · Precision ↑&#x27;,&#x27;둘 다 ↑&#x27;,&#x27;변화 없음&#x27;],0,&#x27;점수 낮은 탐지까지 남기므로 놓치는 사람이 줄어 &lt;b&gt;Recall ↑&lt;/b&gt;, 대신 배경 · 중복 · 정답에 없는 사람이 섞여 &lt;b&gt;Precision ↓&lt;/b&gt;.&#x27;);
initPresets(PS,stop);
drawPipe();drawCmp();drawTh();decide();fillR(R);
onRedraw(()=&gt;{drawCmp();drawTh();});
$(&#x27;#presets button&#x27;).click();
&lt;/script&gt;

<script>
const ids = [...document.querySelectorAll('nav .list button')].map(b => b.dataset.id);
// ---- 라이트 / 다크: 처음에는 시스템 설정, 버튼으로 바꾸면 이 브라우저에 기억 ----
const mq = matchMedia('(prefers-color-scheme: light)');
let theme = null;
try { theme = localStorage.getItem('vb4-theme'); } catch (e) {}
function curTheme() { return theme || (mq.matches ? 'light' : 'dark'); }
function applyTheme() {
  const t = curTheme();
  document.documentElement.dataset.theme = t;
  document.getElementById('theme').textContent = t === 'dark' ? '☀ 라이트' : '☾ 다크';
  document.querySelectorAll('section.lesson iframe').forEach(fr => { try { fr.contentDocument.documentElement.dataset.theme = t; } catch (e) {} });
}
document.getElementById('theme').onclick = () => {
  theme = curTheme() === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('vb4-theme', theme); } catch (e) {}
  applyTheme();
};
try { mq.addEventListener('change', applyTheme); } catch (e) {}
function fit(fr) {
  try {
    const d = fr.contentDocument; if (!d || !d.body) return;
    fr.style.height = Math.max(600, d.documentElement.scrollHeight) + 'px';
  } catch (e) {}
}
function show(id, push) {
  if (!ids.includes(id)) id = ids[0];
  document.querySelectorAll('section.lesson').forEach(s => s.classList.toggle('active', s.id === id));
  document.querySelectorAll('nav .list button').forEach(b => b.setAttribute('aria-current', b.dataset.id === id ? 'true' : 'false'));
  const sec = document.getElementById(id);
  document.title = sec.dataset.title + ' — Vision 기본 모델 Day 4';
  const fr = sec.querySelector('iframe');
  fr.loading = 'eager'; fit(fr);
  if (push) history.replaceState(null, '', '#' + id);
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('section.lesson iframe').forEach(fr => {
  fr.addEventListener('load', () => {
    try { fr.contentDocument.documentElement.dataset.theme = curTheme(); } catch (e) {}
    fit(fr);
    try {
      new ResizeObserver(() => fit(fr)).observe(fr.contentDocument.body);
      fr.contentDocument.addEventListener('keydown', key);   // iframe 안에서도 ← → 동작
    } catch (e) {}
  });
});
document.querySelectorAll('nav .list button').forEach(b => b.onclick = () => show(b.dataset.id, true));
function key(e) {
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const cur = ids.indexOf(location.hash.slice(1) || ids[0]);
  if (e.key === 'ArrowRight' && cur < ids.length - 1) show(ids[cur + 1], true);
  if (e.key === 'ArrowLeft' && cur > 0) show(ids[cur - 1], true);
}
document.addEventListener('keydown', key);
window.addEventListener('resize', () => document.querySelectorAll('section.lesson.active iframe').forEach(fit));
window.addEventListener('hashchange', () => show(location.hash.slice(1), false));   // 주소창에서 #d4-N 을 바꿔도 이동
applyTheme();
show(location.hash.slice(1), false);
</script>
