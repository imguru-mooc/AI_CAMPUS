<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vision 기본 모델 Day 1 개념 워크시트</title>
<style>
  :root{--bg:#0b1220;--panel:#111a2e;--line:#1f2b45;--text:#dbe4f0;--dim:#8a9bb8;--amber:#f5b942;--teal:#2dd4bf;--blue:#60a5fa;--green:#4ade80;--red:#f87171;--purple:#c084fc;--mono:"Consolas","D2Coding","JetBrains Mono",monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR","Segoe UI",sans-serif;font-size:15px;line-height:1.55}
  .app{max-width:920px;margin:0 auto;padding:22px 20px 40px}
  h1{color:var(--amber);font-size:24px;margin:0 0 6px}
  .sub{color:var(--dim);margin:0 0 14px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
  .panel h2{font-size:14px;color:var(--dim);margin:0 0 10px;font-weight:600}
  button{background:#172239;border:1px solid #2a3a5c;color:var(--text);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--amber)}button.active{background:#3a2e12;border-color:var(--amber);color:var(--amber)}
  button.primary{background:#123d33;border-color:var(--teal);color:var(--teal);font-weight:700;padding:9px 18px;font-size:14px}
  button.submit{background:#3a2e12;border-color:var(--amber);color:var(--amber);font-weight:700;padding:9px 18px;font-size:14px}
  button:disabled{opacity:.5;cursor:default}
  button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  input[type=text]{background:#0a0f1c;color:var(--text);border:1px solid #2a3a5c;border-radius:6px;padding:6px 10px;font-family:var(--mono);font-size:14px}
  select{background:#0a0f1c;color:var(--text);border:1px solid #2a3a5c;border-radius:6px;padding:4px 8px;font-family:inherit;font-size:14px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px}
  .tabs button .s{font-family:var(--mono);font-size:11px;color:var(--dim);margin-left:6px}
  .tabs button.graded .s{color:var(--green)}
  .legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .tag{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--dim);font-family:var(--mono)}
  .head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .head .t{color:var(--amber);font-size:17px}
  .head .a{font-size:13px;color:var(--teal);font-family:var(--mono)}
  .q{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;background:#0e1628}
  .q.unans{border-color:#5a3a1a}
  .q.ok{border-color:#1f6b45}.q.bad{border-color:#7a2e2e}
  .qh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .q .n{font-family:var(--mono);color:var(--dim);font-size:12px}
  .ty{font-size:11.5px;border-radius:999px;padding:1px 9px;border:1px solid}
  .q .p{margin:6px 0 10px;font-size:15px}
  .q code,.fb code,.dg code{font-family:var(--mono);color:var(--blue);background:#0a0f1c;padding:1px 5px;border-radius:4px}
  .q pre{font-family:var(--mono);background:#0a0f1c;border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:6px 0 4px;font-size:14px;white-space:pre;overflow-x:auto;line-height:1.9}
  .q pre input{font-size:13px;padding:2px 6px;width:auto;min-width:5ch}
  .opts{display:grid;gap:6px}
  .opt{text-align:left;padding:8px 12px;font-size:14px}
  .opt .box{display:inline-block;width:18px;font-family:var(--mono);color:var(--dim)}
  .opt.sel{border-color:var(--amber);background:#1f1a0c}
  .opt.ok{border-color:var(--green);color:var(--green);background:#0d2216}
  .opt.bad{border-color:var(--red);color:var(--red);background:#2a1212}
  .opt.miss{border-color:var(--green);border-style:dashed}
  .ox{display:flex;gap:10px}
  .ox button{font-size:22px;width:78px;height:54px;font-weight:700}
  .fill{line-height:2.3}
  .mrow{display:grid;grid-template-columns:1fr 24px minmax(160px,1.2fr);gap:8px;align-items:center;margin-bottom:6px}
  .mrow .l{background:#0a0f1c;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:14px}
  .mrow select{width:100%}
  .mrow .arr{color:var(--dim);text-align:center}
  .mrow.ok select{border-color:var(--green)}.mrow.bad select{border-color:var(--red)}
  .ord{list-style:none;margin:0;padding:0;display:grid;gap:6px}
  .ord li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;background:#0a0f1c;border:1px solid #2a3a5c;border-radius:8px;padding:7px 10px;cursor:grab;font-size:14px}
  .ord li.drag{opacity:.4}.ord li.over{border-color:var(--amber)}
  .ord li .k{font-family:var(--mono);color:var(--dim)}
  .ord li .mv button{padding:2px 8px;margin-left:4px}
  .ord li.ok{border-color:var(--green)}.ord li.bad{border-color:var(--red)}
  .hot{background:#0a0f1c;border:1px solid var(--line);border-radius:8px;padding:6px;overflow-x:auto}
  .hot svg{display:block;max-width:100%;height:auto;margin:0 auto}
  .hot .rg{cursor:pointer;fill:transparent;stroke:transparent;stroke-width:2.5}
  .hot .rg:hover{stroke:#f5b94288}
  .hot .rg.sel{stroke:var(--amber);fill:#f5b94222}
  .hot .rg.ok{stroke:var(--green);fill:#4ade8026}
  .hot .rg.bad{stroke:var(--red);fill:#f8717126}
  .card{perspective:900px;max-width:560px}
  .card .in{position:relative;min-height:130px;transition:transform .5s;transform-style:preserve-3d}
  .card.flip .in{transform:rotateY(180deg)}
  .card .f,.card .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;border:1px solid #2a3a5c;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px 18px;font-size:16px}
  .card .f{background:#14203a;color:var(--amber)}
  .card .b{background:#0f2a27;color:var(--teal);transform:rotateY(180deg)}
  @media (prefers-reduced-motion:reduce){.card .in{transition:none}}
  .selfrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
  .selfrow .hint{margin-left:4px}
  .fb{margin-top:10px;font-size:13px;color:var(--dim);border-left:3px solid var(--line);padding-left:10px}
  .fb.ok{border-left-color:var(--green)}.fb.bad{border-left-color:var(--red)}
  .fb b.v{display:block;margin-bottom:2px}
  .fb.ok b.v{color:var(--green)}.fb.bad b.v{color:var(--red)}
  .fb .anim{color:var(--teal);font-family:var(--mono);font-size:12px;display:block;margin-top:3px}
  .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
  .code{font-family:var(--mono);font-size:20px;color:var(--amber);letter-spacing:1px}
  .score{font-family:var(--mono);color:var(--green);font-size:16px}
  .hint{color:var(--dim);font-size:13px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:0;max-width:860px;width:92vw;max-height:88vh}
  dialog::backdrop{background:#000a}
  .dg{padding:18px 20px}
  .dg h3{color:var(--amber);margin:0 0 4px;font-size:20px}
  .dg .meta{color:var(--dim);font-size:13px;margin-bottom:12px;font-family:var(--mono)}
  .dg .sec{margin:14px 0 6px;color:var(--teal);font-weight:700;font-size:14px}
  .dg table{width:100%;border-collapse:collapse;font-size:13px}
  .dg th{text-align:left;color:var(--dim);font-weight:600;padding:5px 8px;border-bottom:1px solid var(--line);font-size:12px}
  .dg td{padding:5px 8px;border-bottom:1px solid #16203a;vertical-align:top}
  .dg .ok{color:var(--green)}.dg .bad{color:var(--red)}.dg .none{color:var(--dim)}
  .dg .sum{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0;font-family:var(--mono)}
  .dgbar{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 20px;display:flex;gap:8px;justify-content:flex-end;align-items:center}
  .toast{color:var(--green);font-size:13px;margin-right:auto}
  .body{overflow:auto;max-height:calc(88vh - 60px)}
  @media(max-width:600px){.mrow{grid-template-columns:1fr;gap:4px}.mrow .arr{display:none}}
</style>
</head>
<body>
<div class="app">
  <h1>Vision 기본 모델 Day 1 개념 워크시트</h1>
  <p class="sub">교시마다 10문항 — 객관식 · O/X · 빈칸 · 짝 맞추기 · 순서 배열 · 핫스팟 · 코드 완성 등 9가지 유형이 섞여 나옵니다. 답을 고른 뒤 아래 <b style="color:var(--teal)">채점하기</b>를 누르면 정오 · 해설과 결과 코드가 나타납니다. 채점 전에는 답을 바꿀 수 있고, 채점 후에는 잠깁니다. 모든 교시를 마치면 <b style="color:var(--amber)">제출</b>로 오답 정리를 열고, <b>캡처</b>로 복사해 노션에 붙여 넣으세요.</p>

  <div class="panel">
    <div class="row"><label style="color:var(--dim);font-size:13px">이름 <input type="text" id="name" placeholder="홍길동"></label><span class="hint">이름은 결과 코드 계산에만 쓰이며 저장되지 않습니다.</span></div>
  </div>
  <div class="panel"><h2>교시</h2><div class="tabs" id="tabs"></div><div class="legend" id="legend"></div></div>
  <div class="panel" id="sheet"></div>
  <div class="panel">
    <div class="actions">
      <button class="primary" id="gradeBtn">채점하기</button>
      <span class="score" id="rscore"></span>
      <span class="hint" id="rhint"></span>
      <span class="code" id="rcode">—</span>
    </div>
    <div class="actions" style="margin-top:12px">
      <button class="submit" id="submitBtn">제출 (오답 정리)</button>
      <button id="resetBtn">이 교시 다시 풀기</button>
    </div>
  </div>
</div>

<dialog id="dlg">
  <div class="body"><div class="dg" id="dgBody"></div></div>
  <div class="dgbar"><span class="toast" id="toast"></span><button id="captureBtn" class="primary">📋 캡처 (노션용 복사)</button><button id="closeBtn">닫기</button></div>
</dialog>

<script>
const Q = [{"t": "1교시 · 복습 · mynn → PyTorch", "anim": "D1-1 mynn → PyTorch", "qs": [{"type": "single", "p": "NN Day 5 SimpleConvNet 의 첫 계층 <code>nn.Conv2d(1, 30, 5)</code> 는 입력 채널 1, 출력 채널 30, 5×5 필터입니다. 이 계층의 파라미터 수(가중치 + 편향)는?", "o": ["750", "780", "900", "810"], "a": 1, "w": "가중치 30 · 1 · 5 · 5 = 750 에 출력 채널마다 편향 1 개씩 30 을 더해 780 입니다.", "an": "문제 1-1"}, {"type": "single", "p": "SimpleConvNet 에서 <code>nn.Linear(4320, 100)</code> 의 입력 크기 4320 은 어떻게 나온 값인가요? (입력 (N, 1, 28, 28))", "o": ["Conv 출력 (N, 30, 24, 24) 을 Flatten 한 30 × 24 × 24", "입력 이미지를 Flatten 한 1 × 28 × 28 에 30 을 곱한 값", "Conv 필터 30 × 5 × 5 × 5 + 30 을 반올림한 값", "MaxPool 출력 (N, 30, 12, 12) 을 Flatten 한 30 × 12 × 12"], "a": 3, "w": "Conv 5×5 → 24×24, MaxPool 2 → 12×12 이므로 Flatten 결과는 30 · 12 · 12 = 4,320 입니다.", "an": "문제 1-2"}, {"type": "multi", "p": "NN 과정 <code>mynn.py</code> 의 부품과 PyTorch 대응으로 <b>옳은 것</b>을 모두 고르세요.", "o": ["<code>Affine</code> → <code>nn.Linear</code> (W 를 (out, in) 으로 저장)", "<code>optimizer.update(params, grads)</code> → <code>opt.step()</code> 한 줄이면 되고 기울기 비우기는 필요 없다", "<code>SoftmaxWithLoss</code> → <code>nn.CrossEntropyLoss</code> (logits 입력, softmax 포함)", "<code>np.savez</code> → <code>torch.save(model.state_dict())</code>"], "a": [0, 2, 3], "w": "갱신은 <code>opt.zero_grad()</code> → <code>loss.backward()</code> → <code>opt.step()</code> 세 줄입니다. 기울기가 누적되므로 매 step 비워야 합니다.", "an": "D1-1 · mynn ↔ PyTorch 대응표"}, {"type": "ox", "p": "<code>nn.CrossEntropyLoss</code> 에는 모델 출력에 softmax 를 먼저 적용한 <b>확률</b>을 넣어야 한다.", "a": false, "w": "CrossEntropyLoss 는 softmax 를 포함하므로 softmax 전 점수인 logits 를 그대로 넣습니다. 모델 끝에 softmax 를 또 붙이면 두 번 적용됩니다.", "an": "D1-1 · mynn ↔ PyTorch 대응표"}, {"type": "short", "p": "문제 1-1 에서 <code>sum(p.numel() for p in net.parameters())</code> 로 센 SimpleConvNet 의 전체 파라미터 수는? (숫자만)", "a": ["433890", "433,890", "433_890"], "w": "780 + 432,100 + 1,010 = 433,890 — NumPy 로 만든 NN Day 5 판과 똑같습니다.", "an": "문제 1-1"}, {"type": "drop", "p": "빈칸에 알맞은 것을 고르세요.", "p2": "<code>nn.Linear</code> 는 가중치 W 를 {} 모양으로 저장하므로 순전파는 {} 로 계산한다. 따라서 <code>nn.Linear(4320, 100)</code> 의 <code>weight.shape</code> 는 {} 이다.", "opts": [["(in, out)", "(out, in)"], ["x @ W + b", "x @ W.T + b", "W @ x + b"], ["(4320, 100)", "(100, 4320)", "(100,)"]], "a": [1, 1, 1], "w": "NumPy 판 Affine 은 W 가 (in, out) 이었지만 PyTorch 는 (out, in) = (100, 4320) 으로 저장하고 x @ W.T + b 로 계산합니다.", "an": "D1-1 · mynn ↔ PyTorch 대응표"}, {"type": "match", "p": "문제 1-2 처럼 가짜 입력 <code>torch.zeros(2, 1, 28, 28)</code> (이미지 2장) 을 통과시킬 때, 각 계층의 출력 shape 를 짝지으세요.", "left": ["<code>nn.Conv2d(1, 30, 5)</code>", "<code>nn.MaxPool2d(2)</code>", "<code>nn.Flatten()</code>", "<code>nn.Linear(4320, 100)</code>"], "right": ["(2, 30, 24, 24)", "(2, 30, 12, 12)", "(2, 4320)", "(2, 100)"], "a": [0, 1, 2, 3], "w": "28 − 5 + 1 = 24, 풀링 2×2 로 12, Flatten 하면 30 · 12 · 12 = 4,320, Linear 로 100. 배치 축 2 는 끝까지 그대로입니다.", "an": "문제 1-2"}, {"type": "order", "p": "SimpleConvNet 을 <code>nn.Sequential</code> 로 쓸 때 계층의 순서대로 배열하세요. (ReLU 는 생략)", "items": ["<code>nn.Conv2d(1, 30, 5)</code>", "<code>nn.MaxPool2d(2)</code>", "<code>nn.Flatten()</code>", "<code>nn.Linear(4320, 100)</code>", "<code>nn.Linear(100, 10)</code>"], "w": "Conv → ReLU → Pool → Flatten → Linear → ReLU → Linear. NN 과정의 Convolution → Relu → Pooling → Affine → Relu → Affine 과 같은 순서입니다.", "an": "문제 1-1"}, {"type": "hot", "p": "PyTorch 로 다시 쓴 SimpleConvNet 의 계층들입니다 (괄호는 입력 2장일 때 출력 shape). 전체 433,890 개 중 <b>파라미터가 가장 많은 계층</b>을 클릭하세요.", "w": "<code>nn.Linear(4320, 100)</code> 입니다. 4320 · 100 + 100 = 432,100 개로 전체 433,890 개의 약 99.6% 를 차지합니다. Conv 는 780, 마지막 Linear 는 1,010, 풀링 · Flatten 은 0 개.", "an": "D1-1 · SimpleConvNet 파라미터", "viewBox": "0 0 560 260", "sw": 560, "svg": "<defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#8a9bb8\"/></marker></defs><text x=\"50\" y=\"30\" font-size=\"11\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">입력</text><text x=\"50\" y=\"50\" font-size=\"11\" fill=\"#f5b942\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">(2, 1, 28, 28)</text><rect x=\"20\" y=\"80\" width=\"160\" height=\"60\" rx=\"6\" fill=\"#14203a\" stroke=\"#2dd4bf\" /><text x=\"100.0\" y=\"102\" font-size=\"12\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">nn.Conv2d(1, 30, 5)</text><text x=\"100.0\" y=\"122\" font-size=\"10.5\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">→ (2, 30, 24, 24)</text><rect x=\"196\" y=\"80\" width=\"160\" height=\"60\" rx=\"6\" fill=\"#14203a\" stroke=\"#60a5fa\" /><text x=\"276.0\" y=\"102\" font-size=\"12\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">nn.MaxPool2d(2)</text><text x=\"276.0\" y=\"122\" font-size=\"10.5\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">→ (2, 30, 12, 12)</text><rect x=\"372\" y=\"80\" width=\"160\" height=\"60\" rx=\"6\" fill=\"#14203a\" stroke=\"#60a5fa\" /><text x=\"452.0\" y=\"102\" font-size=\"12\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">nn.Flatten()</text><text x=\"452.0\" y=\"122\" font-size=\"10.5\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">→ (2, 4320)</text><rect x=\"20\" y=\"180\" width=\"160\" height=\"60\" rx=\"6\" fill=\"#14203a\" stroke=\"#f5b942\" /><text x=\"100.0\" y=\"202\" font-size=\"12\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">nn.Linear(4320, 100)</text><text x=\"100.0\" y=\"222\" font-size=\"10.5\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">→ (2, 100)</text><rect x=\"196\" y=\"180\" width=\"160\" height=\"60\" rx=\"6\" fill=\"#14203a\" stroke=\"#f5b942\" /><text x=\"276.0\" y=\"202\" font-size=\"12\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">nn.Linear(100, 10)</text><text x=\"276.0\" y=\"222\" font-size=\"10.5\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">→ (2, 10)</text><line x1=\"50\" y1=\"60\" x2=\"60\" y2=\"78\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><line x1=\"180\" y1=\"110\" x2=\"194\" y2=\"110\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><line x1=\"356\" y1=\"110\" x2=\"370\" y2=\"110\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><path d=\"M452,140 L452,160 L100,160 L100,176\" fill=\"none\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><line x1=\"180\" y1=\"210\" x2=\"194\" y2=\"210\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><text x=\"372\" y=\"210\" font-size=\"11\" fill=\"#8a9bb8\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">(ReLU 는 파라미터가 없어 생략)</text>", "regions": [{"id": "conv", "label": "nn.Conv2d(1, 30, 5)", "x": 20, "y": 80, "w": 160, "h": 60}, {"id": "pool", "label": "nn.MaxPool2d(2)", "x": 196, "y": 80, "w": 160, "h": 60}, {"id": "flat", "label": "nn.Flatten()", "x": 372, "y": 80, "w": 160, "h": 60}, {"id": "fc1", "label": "nn.Linear(4320, 100)", "x": 20, "y": 180, "w": 160, "h": 60}, {"id": "fc2", "label": "nn.Linear(100, 10)", "x": 196, "y": 180, "w": 160, "h": 60}], "a": "fc1"}, {"type": "code", "p": "문제 1-1 — NN Day 5 SimpleConvNet 을 <code>nn.Sequential</code> 로 만들고 파라미터 수를 세는 코드를 완성하세요.", "code": "net = nn.Sequential(\n    nn.Conv2d({{}}, {{}}, {{}}),     # (N, 1, 28, 28) → (N, 30, 24, 24)\n    nn.ReLU(),\n    nn.MaxPool2d(2),\n    nn.Flatten(),\n    nn.Linear({{}}, 100),\n    nn.ReLU(),\n    nn.Linear(100, 10),\n)\nn_params = sum({{}} for p in net.parameters())", "a": [["1", "in_channels=1"], ["30", "out_channels=30"], ["5", "kernel_size=5"], ["4320", "4_320", "30*12*12", "30 * 12 * 12"], ["p.numel()"]], "w": "Conv2d(1, 30, 5), Linear(4320, 100), 그리고 원소 개수 p.numel() 을 모두 더하면 433,890 입니다.", "an": "문제 1-1"}]}, {"t": "2교시 · Tensor · GPU", "anim": "D1-2 Tensor 의 메모리", "qs": [{"type": "single", "p": "문제 2-2 — 아래 코드를 실행한 뒤 <code>a</code> 와 <code>c</code> 의 값은?<pre>a = np.zeros(3)\nb = torch.from_numpy(a)       # 공유\nc = torch.tensor(a)           # 복사\nb[0] = 7.0\nc[1] = 9.0</pre>", "o": ["a = [0, 0, 0], c = [0, 9, 0]", "a = [7, 9, 0], c = [7, 9, 0]", "a = [7, 0, 0], c = [0, 9, 0]", "a = [7, 0, 0], c = [7, 9, 0]"], "a": 2, "w": "from_numpy 는 a 와 메모리를 공유해 b[0] = 7 이 a 에 보이고, torch.tensor 는 만들 때 복사했으므로 c[1] = 9 는 a 에 영향이 없고 a 의 변경도 c 에 보이지 않습니다.", "an": "문제 2-2"}, {"type": "single", "p": "문제 2-1 — NumPy 로 만든 배열을 그대로 텐서로 바꿔 <code>nn.Linear</code> 에 넣으면 어떻게 될까요?<pre>X_np = rng.standard_normal((4, 784))     # NumPy 기본 float64\nX = torch.from_numpy(X_np)\nY = nn.Linear(784, 10)(X)</pre>", "o": ["<code>expected ... Float but found Double</code> 오류 — <code>.float()</code> 로 float32 로 바꿔야 한다", "자동으로 float32 로 바뀌어 정상 동작한다", "shape 가 맞지 않는다는 오류가 난다", "결과가 float64 (4, 10) 으로 정상 출력된다"], "a": 0, "w": "NumPy 기본 실수형은 float64, PyTorch 모델 가중치는 float32 입니다. <code>torch.from_numpy(X_np).float()</code> 로 바꿉니다.", "an": "문제 2-1"}, {"type": "multi", "p": "shape 를 바꾸는 함수에 대한 설명으로 <b>옳은 것</b>을 모두 고르세요.", "o": ["<code>reshape</code> · <code>view</code> 는 원소 순서는 그대로 두고 모양만 바꾼다", "<code>permute(2, 0, 1)</code> 은 이미지 CHW 를 HWC 로 바꿀 때 쓴다", "<code>permute</code> 는 축의 순서를 바꾸므로 원소 배치가 달라진다", "<code>unsqueeze(0)</code> 은 맨 앞에 크기 1 인 축(배치 축)을 넣는다"], "a": [0, 2, 3], "w": "permute(2, 0, 1) 은 (H, W, C) 의 축 2 (C) 를 맨 앞으로 보내 HWC → CHW 를 만듭니다 — 반대 방향이 아닙니다.", "an": "D1-2 · reshape · permute · unsqueeze"}, {"type": "ox", "p": "GPU 연산 시간을 <code>torch.cuda.synchronize()</code> 없이 재면 실제보다 훨씬 <b>빠르게</b> 측정될 수 있다.", "a": true, "w": "GPU 는 비동기라 명령만 받고 바로 돌아옵니다. 끝날 때까지 기다리는 synchronize() 를 앞뒤에 넣어야 정확합니다.", "an": "D1-2 · GPU 로 옮기기"}, {"type": "short", "p": "문제 2-4 — <code>x = torch.arange(24).reshape(2, 3, 4)</code> 에서 <code>f = x.reshape(2, -1)</code> 일 때 <code>-1</code> 자리에 계산되어 들어가는 크기는? (숫자만)", "a": ["12"], "w": "원소 24 개를 첫 축 2 로 나누면 24 / 2 = 12, 결과 shape 는 (2, 12) 입니다. −1 은 '나머지는 알아서 계산'.", "an": "문제 2-4"}, {"type": "drop", "p": "문제 2-3 의 softmax 를 NumPy 에서 PyTorch 로 옮깁니다. 빈칸에 알맞은 것을 고르세요.", "p2": "NumPy 의 <code>Y.max(axis=1, keepdims=True)</code> 는 PyTorch 에서 <code>Y.max({}, keepdim=True){}</code> 로 쓰고, <code>np.exp(Y)</code> 는 {} 로 쓴다.", "opts": [["axis=1", "dim=0", "dim=1"], [".indices", ".values", "(아무것도 붙이지 않음)"], ["math.exp(Y)", "torch.exp(Y)", "np.exp(Y)"]], "a": [2, 1, 1], "w": "torch 의 max(dim=…) 는 (values, indices) 두 개를 돌려주므로 .values 를 씁니다. axis → dim, keepdims → keepdim, np.exp → torch.exp.", "an": "문제 2-3"}, {"type": "match", "p": "자주 하는 실수와 고치는 방법을 짝지으세요.", "left": ["<code>torch.from_numpy(float64 배열)</code> 을 모델에 넣음", "모델은 GPU, 데이터는 CPU", "GPU 텐서를 바로 <code>.numpy()</code>", "GPU 시간을 그냥 <code>time.perf_counter()</code> 로 잼"], "right": ["<code>.float()</code> 로 float32", "둘 다 <code>.to(device)</code>", "<code>.cpu().numpy()</code>", "<code>torch.cuda.synchronize()</code> 후 측정"], "a": [0, 1, 2, 3], "w": "device 가 섞이면 'Expected all tensors to be on the same device' 오류가 납니다. GPU 텐서는 CPU 로 옮긴 뒤에야 NumPy 가 됩니다.", "an": "D1-2 · GPU 로 옮기기"}, {"type": "order", "p": "2교시 <code>bench()</code> 로 GPU 의 2048×2048 행렬곱 시간을 정확히 재는 순서로 배열하세요.", "items": ["<code>A</code>, <code>B</code> 를 <code>device=dev</code> 에 만든다", "준비 운동으로 <code>A @ B</code> 를 한 번 실행한다", "<code>torch.cuda.synchronize()</code> 후 시작 시각 <code>t0</code> 를 잰다", "<code>reps</code> 번 <code>C = A @ B</code> 를 반복한다", "다시 <code>synchronize()</code> 한 뒤 (경과 시간 / reps) 를 구한다"], "w": "첫 실행에는 초기화 시간이 섞이므로 준비 운동을 하고, 비동기인 GPU 가 끝날 때까지 기다린 뒤 시간을 잽니다. 실행 예: CPU (2코어 서버) 약 77.5 ms.", "an": "D1-2 · GPU 로 옮기기"}, {"type": "hot", "p": "<code>p = x.permute(0, 2, 1)</code> 은 x 의 축을 (0, 2, 1) 순서로 다시 놓습니다. 아래쪽 <b>p 의 축 1</b> (크기 ?) 은 위쪽 x 의 어느 축에서 왔나요? x 의 축 상자를 클릭하세요.", "w": "x 의 축 2 (크기 4) 입니다. permute(0, 2, 1) 은 '새 0번 축 = 옛 0번, 새 1번 = 옛 2번, 새 2번 = 옛 1번' 이라 p.shape = (2, 4, 3), p[1, 3, 2] == x[1, 2, 3].", "an": "문제 2-4", "viewBox": "0 0 600 270", "sw": 600, "svg": "<defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#8a9bb8\"/></marker></defs><text x=\"20\" y=\"30\" font-size=\"13\" fill=\"#dbe4f0\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">x = torch.arange(24).reshape(2, 3, 4)</text><text x=\"126\" y=\"152\" font-size=\"13\" fill=\"#dbe4f0\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">p = x.permute(0, 2, 1)</text><rect x=\"40\" y=\"52\" width=\"140\" height=\"64\" rx=\"6\" fill=\"#14203a\" stroke=\"#60a5fa\" /><text x=\"110\" y=\"74\" font-size=\"12\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">x 의 축 0</text><text x=\"110\" y=\"98\" font-size=\"14\" fill=\"#f5b942\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">크기 2</text><rect x=\"210\" y=\"52\" width=\"140\" height=\"64\" rx=\"6\" fill=\"#14203a\" stroke=\"#60a5fa\" /><text x=\"280\" y=\"74\" font-size=\"12\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">x 의 축 1</text><text x=\"280\" y=\"98\" font-size=\"14\" fill=\"#f5b942\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">크기 3</text><rect x=\"380\" y=\"52\" width=\"140\" height=\"64\" rx=\"6\" fill=\"#14203a\" stroke=\"#60a5fa\" /><text x=\"450\" y=\"74\" font-size=\"12\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">x 의 축 2</text><text x=\"450\" y=\"98\" font-size=\"14\" fill=\"#f5b942\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">크기 4</text><rect x=\"40\" y=\"190\" width=\"140\" height=\"64\" rx=\"6\" fill=\"#0f1a30\" stroke=\"#2dd4bf\" /><text x=\"110\" y=\"212\" font-size=\"12\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">p 의 축 0</text><text x=\"110\" y=\"236\" font-size=\"14\" fill=\"#2dd4bf\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">크기 2</text><rect x=\"210\" y=\"190\" width=\"140\" height=\"64\" rx=\"6\" fill=\"#0f1a30\" stroke=\"#f5b942\" /><text x=\"280\" y=\"212\" font-size=\"12\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">p 의 축 1</text><text x=\"280\" y=\"236\" font-size=\"14\" fill=\"#f5b942\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">크기 ?</text><rect x=\"380\" y=\"190\" width=\"140\" height=\"64\" rx=\"6\" fill=\"#0f1a30\" stroke=\"#2dd4bf\" /><text x=\"450\" y=\"212\" font-size=\"12\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">p 의 축 2</text><text x=\"450\" y=\"236\" font-size=\"14\" fill=\"#2dd4bf\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">크기 3</text><line x1=\"110\" y1=\"118\" x2=\"110\" y2=\"186\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><line x1=\"280\" y1=\"118\" x2=\"450\" y2=\"186\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/>", "regions": [{"id": "x0", "label": "x 의 축 0 (크기 2)", "x": 40, "y": 52, "w": 140, "h": 64}, {"id": "x1", "label": "x 의 축 1 (크기 3)", "x": 210, "y": 52, "w": 140, "h": 64}, {"id": "x2", "label": "x 의 축 2 (크기 4)", "x": 380, "y": 52, "w": 140, "h": 64}], "a": "x2"}, {"type": "code", "p": "문제 2-4 — shape (2, 3, 4) 텐서에서 p: 마지막 두 축을 바꾼 (2, 4, 3), u: 맨 앞에 크기 1 축을 넣은 (1, 2, 3, 4), f: 첫 축만 남기고 펼친 (2, 12) 를 만드세요.", "code": "x = torch.arange(24).reshape(2, 3, 4)\np = x.permute({{}})\nu = x.{{}}\nf = x.reshape(2, {{}})", "a": [["0, 2, 1", "(0, 2, 1)"], ["unsqueeze(0)", "unsqueeze(dim=0)"], ["-1", "12"]], "w": "permute(0, 2, 1) → (2, 4, 3), unsqueeze(0) → (1, 2, 3, 4), reshape(2, -1) → (2, 12).", "an": "문제 2-4"}]}, {"t": "3교시 · autograd", "anim": "D1-3 autograd 계산 그래프", "qs": [{"type": "single", "p": "<code>requires_grad=True</code> 인 잎 텐서에 대해 <code>backward()</code> 를 부르면, 계산된 기울기는 그 텐서의 <code>.grad</code> 에 어떻게 저장되나요?", "o": ["기존 값을 덮어쓴다", "기존 값에 <b>더해진다</b> (누적)", "기존 값과 평균을 낸다", "다음 backward() 호출 때 자동으로 0 이 된다"], "a": 1, "w": "기울기는 누적됩니다. 그래서 학습 루프는 매 step <code>zero_grad()</code> 로 비웁니다 (문제 3-2: 2 → 4).", "an": "D1-3 · 기울기 누적"}, {"type": "single", "p": "문제 3-2 — 아래 코드에서 두 번째 print 가 출력하는 <code>x.grad</code> 값은?<pre>x = torch.tensor(1.0, requires_grad=True)\n(x ** 2).backward()\nprint(x.grad.item())      # 2.0\n(x ** 2).backward()\nprint(x.grad.item())      # ?</pre>", "o": ["2.0", "0.0", "RuntimeError (그래프를 두 번 미분)", "4.0"], "a": 3, "w": "d(x²)/dx = 2x = 2 가 한 번 더 더해져 2 + 2 = 4 입니다. f 를 다시 계산했으므로 그래프 오류는 나지 않습니다.", "an": "문제 3-2"}, {"type": "multi", "p": "autograd 를 쓸 때 <b>옳은 설명</b>을 모두 고르세요.", "o": ["<code>zero_grad()</code> 를 빼먹으면 기울기가 계속 더해져 학습이 폭주한다", "평가에서 <code>torch.no_grad()</code> 를 쓰면 정확도가 올라간다", "requires_grad 텐서를 <code>.numpy()</code> 하려면 <code>.detach().numpy()</code> 를 쓴다", "<code>no_grad()</code> 없이 <code>p -= lr * p.grad</code> 를 하면 in-place 오류가 난다"], "a": [0, 2, 3], "w": "no_grad() 는 기록을 꺼 메모리를 아낄 뿐 정확도를 바꾸지 않습니다. 잎 텐서 in-place 갱신은 'a leaf Variable that requires grad is being used in an in-place operation' 오류.", "an": "D1-3 · 자주 하는 실수"}, {"type": "ox", "p": "문제 3-3 에서 손으로 유도한 <code>dW = X.T @ (Y − T)</code> 에 <code>/ N</code> 을 붙여야 autograd 의 <code>W.grad</code> 와 같아지는 이유는 <code>F.cross_entropy</code> 가 배치 <b>평균</b>을 내기 때문이다.", "a": true, "w": "F.cross_entropy 는 N = 6 개 샘플 손실의 평균이므로 기울기도 1/N 배가 됩니다. 두 값의 최대 오차는 약 3e-8.", "an": "문제 3-3"}, {"type": "short", "p": "문제 3-1 — <code>x = 1.0</code>, <code>y = 2.0</code> 일 때 <code>f = x ** 2 + 3 * y ** 2</code> 의 값 <code>f.item()</code> 은? (숫자만)", "a": ["13", "13.0"], "w": "1² + 3 · 2² = 1 + 12 = 13 입니다. 기울기는 (2x, 6y) = (2, 12).", "an": "문제 3-1"}, {"type": "drop", "p": "문제 3-3 — Affine + softmax + cross-entropy 의 기울기를 손으로 유도합니다. 빈칸에 알맞은 것을 고르세요.", "p2": "<code>dW_manual = {} @ (Y − T) / N</code>, <code>db_manual = (Y − T).{} / N</code> 이고, 여기서 <code>Y</code> 는 {} 이다.", "opts": [["X", "X.T", "W.T"], ["sum(dim=1)", "mean(dim=0)", "sum(dim=0)"], ["logits", "softmax 확률", "one-hot 정답"]], "a": [1, 2, 1], "w": "∂L/∂W = Xᵀ(y − t)/N — (N, D) 의 전치 (D, N) 에 (N, K) 를 곱해 W 와 같은 (D, K). db 는 샘플 축(0) 으로 더합니다. T 가 one-hot 정답.", "an": "문제 3-3"}, {"type": "match", "p": "오류 메시지 · 증상과 원인을 짝지으세요.", "left": ["'a leaf Variable that requires grad is being used in an in-place operation'", "'Can't call numpy() on Tensor that requires grad'", "손실이 줄지 않고 학습이 폭주한다", "평가 중에 메모리를 불필요하게 많이 쓴다"], "right": ["<code>no_grad()</code> 없이 <code>p -= lr * p.grad</code>", "<code>.detach()</code> 없이 <code>.numpy()</code>", "<code>zero_grad()</code> 누락", "평가를 <code>with torch.no_grad():</code> 로 감싸지 않음"], "a": [0, 1, 2, 3], "w": "갱신은 기록할 필요가 없는 연산이라 no_grad 안에서, NumPy 로 꺼낼 때는 detach, 기울기는 매 step 비우기.", "an": "D1-3 · 자주 하는 실수"}, {"type": "order", "p": "문제 3-5 — <code>torch.optim.SGD([q], lr=0.1)</code> 로 f = x² + 3y² 를 최소화하는 for 루프 한 바퀴의 순서로 배열하세요.", "items": ["<code>loss = q[0] ** 2 + 3 * q[1] ** 2</code>", "<code>opt.zero_grad()</code>", "<code>loss.backward()</code>", "<code>opt.step()</code>"], "w": "zero_grad → backward → step 순서입니다. 출발 (−4, 2), 100 step 이면 문제 3-4 와 같은 (0, 0) 근처 (f ≈ 1e-18) 에 도착합니다.", "an": "문제 3-5"}, {"type": "hot", "p": "f = x² + 3y² 를 (x, y) = (1, 2) 에서 계산한 <b>계산 그래프</b>입니다 (노드 아래 숫자는 순전파 값). <code>f.backward()</code> 뒤 <code>.grad</code> 가 <b>12</b> 가 되는 텐서를 클릭하세요.", "w": "잎 텐서 y 입니다. ∂f/∂y = 6y = 12, ∂f/∂x = 2x = 2. 연산 노드(x ** 2, +, …) 는 잎이 아니라 .grad 가 저장되지 않습니다.", "an": "문제 3-1", "viewBox": "0 0 620 270", "sw": 620, "svg": "<defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#8a9bb8\"/></marker></defs><circle cx=\"70\" cy=\"70\" r=\"34\" fill=\"#14203a\" stroke=\"#f5b942\"/><text x=\"70\" y=\"62\" font-size=\"13\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">x</text><text x=\"70\" y=\"81\" font-size=\"11\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">1.0</text><circle cx=\"70\" cy=\"200\" r=\"34\" fill=\"#14203a\" stroke=\"#f5b942\"/><text x=\"70\" y=\"192\" font-size=\"13\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">y</text><text x=\"70\" y=\"211\" font-size=\"11\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">2.0</text><circle cx=\"210\" cy=\"70\" r  "label": "ToTensor() 단계", "x": 168, "y": 60, "w": 132, "h": 70}, {"id": "sh", "label": "shuffle=True 단계", "x": 322, "y": 60, "w": 132, "h": 70}, {"id": "bt", "label": "batch_size=100 단계", "x": 476, "y": 60, "w": 132, "h": 70}, {"id": "md", "label": "model(xb) 단계", "x": 630, "y": 60, "w": 132, "h": 70}], "a": "bt"}, {"type": "code", "p": "문제 4-2 — NumPy 배열 X (uint8, (N, 28, 28)) 과 y 로 Dataset 을 만듭니다. <code>__getitem__</code> 은 float32 (1, 28, 28) 0~1 텐서와 정수 레이블을 돌려줘야 합니다.", "code": "class NumpyDigits(Dataset):\n    def __init__(self, X, y):\n        self.X, self.y = X, y\n\n    def __len__(self):\n        return {{}}\n\n    def __getitem__(self, i):\n        x = torch.from_numpy(self.X[i]).float() / {{}}\n        return x.{{}}, int(self.y[i])", "a": [["len(self.X)", "len(self.y)", "self.X.shape[0]"], ["255", "255.0", "255."], ["unsqueeze(0)", "unsqueeze(dim=0)", "reshape(1, 28, 28)", "view(1, 28, 28)", "unsqueeze(-3)"]], "w": "len(self.X) 는 500, ÷255 로 0~1, unsqueeze(0) 으로 채널 축을 붙여 (1, 28, 28) — test_set[0] 과 값이 같습니다.", "an": "문제 4-2"}]}, {"t": "5교시 · 학습 루프 · 저장", "anim": "D1-5 학습 루프 한 바퀴", "qs": [{"type": "single", "p": "문제 5-2 — 학습하지 않은 MLP 를 <code>evaluate</code> 로 평가하면 test 정확도가 <b>0.0953</b> 근처입니다. 이유로 가장 알맞은 것은?", "o": ["model.eval() 을 불러 Dropout 이 꺼졌기 때문에", "10 클래스 중 사실상 무작위로 찍는 수준 (≈ 1/10) 이라서", "torch.no_grad() 안에서는 정확도가 1/10 로 줄기 때문에", "test_loader 의 배치가 1000 이라서"], "a": 1, "w": "가중치가 무작위인 모델은 클래스를 거의 고르게 찍으므로 정확도 ≈ 0.1. 학습 전 손실 ≈ ln 10 과 같은 이야기입니다.", "an": "문제 5-2"}, {"type": "single", "p": "문제 5-4 — <code>torch.save(model.state_dict(), \"mlp.pt\")</code> 로 저장한 MLP 파일은 <b>320,309 bytes</b> 입니다. 이 크기의 대부분을 설명하는 계산은?", "o": ["79,510 개 × 8 B (float64) = 636,080", "433,890 개 × 4 B = 1,735,560", "79,510 개 × 4 B (float32) = 318,040", "784 × 100 개 × 1 B = 78,400"], "a": 2, "w": "파라미터 79,510 개가 float32 (4 바이트) 로 저장되어 318,040 바이트, 나머지는 키 이름 등 메타데이터입니다.", "an": "문제 5-4"}, {"type": "multi", "p": "<code>model.eval()</code> 과 <code>torch.no_grad()</code> 에 대해 <b>옳은 것</b>을 모두 고르세요.", "o": ["<code>eval()</code> 은 Dropout · BatchNorm 을 평가 모드로 바꾼다", "<code>no_grad()</code> 는 계산 그래프 기록을 끈다", "<code>eval()</code> 만 불러도 기록이 꺼지므로 <code>no_grad()</code> 는 필요 없다", "평가 뒤 학습을 이어 가려면 <code>model.train()</code> 을 다시 불러야 한다"], "a": [0, 1, 3], "w": "eval() 은 계층의 모드, no_grad() 는 기록 끄기 — 서로 다른 일이라 평가에는 둘 다 씁니다. train_one_epoch 첫 줄에 model.train() 을 두면 안전합니다.", "an": "문제 5-2"}, {"type": "ox", "p": "모델과 옵티마이저를 만들 때는 <code>torch.optim.Adam(model.parameters(), ...)</code> 로 옵티마이저를 먼저 만들고, 그 <b>뒤에</b> <code>model.to(device)</code> 를 하는 것이 올바른 순서다.", "a": false, "w": "model.to(device) 를 옵티마이저 생성 <b>전에</b> 합니다 (문제 5-3: <code>model = MLP().to(device)</code> 다음 줄에 Adam).", "an": "문제 5-3"}, {"type": "short", "p": "문제 5-3 — MLP 를 Adam (lr 1e-3) 으로 3 epoch 학습한 실행 예 (CPU) 에서 3 epoch 후 test 정확도는? (소수 넷째 자리까지)", "a": ["0.9624", ".9624"], "w": "실행 예: epoch 1 0.9356 → 2 0.9568 → 3 0.9624 (Colab GPU 에서는 소수 셋째 자리에서 조금 다를 수 있음). NN Day 3 SGD 10 epoch 은 0.9694.", "an": "문제 5-3"}, {"type": "drop", "p": "문제 5-1 · 5-2 의 함수 일부입니다. 빈칸에 알맞은 것을 고르세요.", "p2": "평균 손실을 구하려고 <code>total += loss.{} * len(xb)</code> 로 더하고, 정확도를 구하려고 <code>pred = model(xb).{}</code> 로 예측 클래스를 얻는다.", "opts": [["detach()", "item()", "numpy()"], ["softmax(dim=1)", "max(dim=1)", "argmax(dim=1)"]], "a": [1, 2], "w": "loss 텐서를 그대로 모으면 그래프가 붙어 메모리가 샙니다 → loss.item(). 클래스 번호는 행마다 가장 큰 logit 의 위치 argmax(dim=1).", "an": "문제 5-1"}, {"type": "match", "p": "문제 5-4 — MLP 의 <code>state_dict()</code> 에 들어 있는 키와 텐서 shape 를 짝지으세요.", "left": ["<code>fc1.weight</code>", "<code>fc1.bias</code>", "<code>fc2.weight</code>", "<code>fc2.bias</code>"], "right": ["(100, 784)", "(100,)", "(10, 100)", "(10,)"], "a": [0, 1, 2, 3], "w": "nn.Linear 는 weight 를 (out, in) 으로 저장합니다. 원소 수 78,400 + 100 + 1,000 + 10 = 79,510.", "an": "문제 5-4"}, {"type": "order", "p": "5교시 학습 루프에서 배치 하나를 처리하는 6 단계를 순서대로 배열하세요.", "items": ["<code>xb, yb = xb.to(device), yb.to(device)</code>", "<code>logits = model(xb)</code>", "<code>loss = loss_fn(logits, yb)</code>", "<code>opt.zero_grad()</code>", "<code>loss.backward()</code>", "<code>opt.step()</code>"], "w": "배치 → device, 순전파, 손실, 기울기 비우기, 역전파, 갱신. 모델이 ResNet 이든 YOLO 든 이 모양은 같습니다.", "an": "D1-5 · 학습 루프 한 바퀴"}, {"type": "hot", "p": "학습 루프 한 바퀴의 6 단계입니다. 이 단계를 빼먹으면 이전 배치의 기울기가 <b>계속 더해지는</b>, 즉 <b>기울기를 0 으로 비우는</b> 단계를 클릭하세요.", "w": "④ <code>opt.zero_grad()</code> 입니다. .grad 는 누적되므로 backward 전에 비워야 합니다. ⑤ backward 는 기울기를 계산(더함), ⑥ step 은 그 기울기로 가중치를 갱신.", "an": "D1-5 · 학습 루프 한 바퀴", "viewBox": "0 0 680 250", "sw": 680, "svg": "<defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#8a9bb8\"/></marker></defs><rect x=\"40\" y=\"30\" width=\"180\" height=\"64\" rx=\"6\" fill=\"#14203a\" stroke=\"#2dd4bf\" /><text x=\"130.0\" y=\"54\" font-size=\"12.5\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">① xb.to(device)</text><text x=\"130.0\" y=\"76\" font-size=\"11\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">배치를 device 로</text><rect x=\"250\" y=\"30\" width=\"180\" height=\"64\" rx=\"6\" fill=\"#14203a\" stroke=\"#2dd4bf\" /><text x=\"340.0\" y=\"54\" font-size=\"12.5\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">② model(xb)</text><text x=\"340.0\" y=\"76\" font-size=\"11\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">순전파 → logits</text><rect x=\"460\" y=\"30\" width=\"180\" height=\"64\" rx=\"6\" fill=\"#14203a\" stroke=\"#2dd4bf\" /><text x=\"550.0\" y=\"54\" font-size=\"12.5\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">③ loss_fn(logits, yb)</text><text x=\"550.0\" y=\"76\" font-size=\"11\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">손실</text><rect x=\"460\" y=\"170\" width=\"180\" height=\"64\" rx=\"6\" fill=\"#14203a\" stroke=\"#f5b942\" /><text x=\"550.0\" y=\"202\" font-size=\"12.5\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">④ opt.zero_grad()</text><rect x=\"250\" y=\"170\" width=\"180\" height=\"64\" rx=\"6\" fill=\"#14203a\" stroke=\"#f5b942\" /><text x=\"340.0\" y=\"194\" font-size=\"12.5\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">⑤ loss.backward()</text><text x=\"340.0\" y=\"216\" font-size=\"11\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">역전파</text><rect x=\"40\" y=\"170\" width=\"180\" height=\"64\" rx=\"6\" fill=\"#14203a\" stroke=\"#f5b942\" /><text x=\"130.0\" y=\"194\" font-size=\"12.5\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">⑥ opt.step()</text><text x=\"130.0\" y=\"216\" font-size=\"11\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">갱신</text><line x1=\"222\" y1=\"62\" x2=\"248\" y2=\"62\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><line x1=\"432\" y1=\"62\" x2=\"458\" y2=\"62\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><line x1=\"550\" y1=\"96\" x2=\"550\" y2=\"168\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><line x1=\"458\" y1=\"202\" x2=\"432\" y2=\"202\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><line x1=\"248\" y1=\"202\" x2 = torch.from_numpy(rgb.copy()).{{}}.float() / {{}}\n\nx_norm = (x - mean.view({{}})) / std.view({{}})", "a": [["permute(2, 0, 1)"], ["255", "255.0", "255."], ["3, 1, 1", "3, 1, 1)", "-1, 1, 1"], ["3, 1, 1", "-1, 1, 1"]], "w": "permute(2, 0, 1) 로 HWC → CHW, ÷255 로 0~1 → (3, 640, 480). mean · std 를 (3, 1, 1) 로 바꿔야 채널별로 브로드캐스팅됩니다.", "an": "문제 6-3 · 6-5"}]}, {"t": "7교시 · 영상 파일 파이프라인", "anim": "D1-7 영상 = 프레임의 연속", "qs": [{"type": "single", "p": "테스트 영상 <code>digits.mp4</code> 는 120×320, <b>30 FPS</b>, 길이 <b>6.0 초</b> 입니다. 이 영상의 프레임 수는?", "o": ["30", "180", "120", "360"], "a": 1, "w": "프레임 수 = 길이 × FPS = 6 × 30 = 180. 반대로 길이 = 프레임 수 / FPS.", "an": "문제 7-2"}, {"type": "single", "p": "문제 7-1 — 프레임이 (120, 320, 3) 인데 실수로 아래처럼 크기를 (H, W) 순서로 넣었습니다. 어떻게 될까요?<pre>writer = cv2.VideoWriter(\"digits.mp4\", fourcc, 30, (120, 320))</pre>", "o": ["즉시 ValueError 가 나며 멈춘다", "영상이 90° 회전되어 저장된다", "오류 없이 프레임이 써지지 않은 <b>빈 영상</b>이 만들어진다", "write() 가 프레임 크기를 자동으로 맞춰 정상 저장된다"], "a": 2, "w": "VideoWriter 의 크기는 (W, H) = (320, 120) 입니다. 틀려도 오류가 나지 않아 찾기 어려운 함정 — 파일 크기(정상 약 43 KB) 로 확인합니다.", "an": "문제 7-1"}, {"type": "multi", "p": "<code>cv2.VideoCapture</code> · <code>cv2.VideoWriter</code> 에 대한 설명으로 <b>옳은 것</b>을 모두 고르세요.", "o": ["<code>cap.get(cv2.CAP_PROP_FRAME_COUNT)</code> 는 float 을 돌려주므로 int 로 바꾼다", "<code>cap.read()</code> 는 (성공 여부, 프레임) 두 값을 돌려준다", "영상이 끝나면 <code>ok</code> 가 False 이고 <code>frame</code> 은 None 이다", "<code>release()</code> 는 VideoCapture 에만 필요하고 VideoWriter 는 자동으로 완성된다"], "a": [0, 1, 2], "w": "VideoWriter 도 release() 를 해야 파일이 완성됩니다. 안 하면 덜 써진 파일이라 재생이 안 됩니다.", "an": "D1-7 · 영상 = 프레임의 연속"}, {"type": "ox", "p": "OpenCV 의 <code>mp4v</code> 코덱으로 저장한 영상은 브라우저 · 노트북에서 언제나 바로 재생된다.", "a": false, "w": "mp4v 는 브라우저 재생이 안 되는 경우가 많아, 노트북의 show_video 는 ffmpeg 로 H.264 로 바꾼 뒤 재생합니다.", "an": "D1-7 · 결과 영상 보기"}, {"type": "short", "p": "<code>digits.mp4</code> 는 숫자 [7, 2, 1, 0, 4, 1] 이 1초에 160px 씩 왼쪽으로 지나가며, k 번째 숫자(k = 0, 1, …) 는 프레임 30k + 15 에서 화면 가운데에 옵니다. 숫자 <b>0</b> 이 가운데에 오는 프레임 번호는?", "a": ["105"], "w": "0 은 k = 3 번째 숫자이므로 30 · 3 + 15 = 105. 가운데 프레임은 15, 45, 75, 105, 135, 165.", "an": "D1-7 · 테스트 영상"}, {"type": "drop", "p": "문제 7-3 <code>frame_to_input</code> 의 처리 순서입니다. 빈칸에 알맞은 것을 고르세요.", "p2": "(120, 320, 3) 프레임을 {} 로 흑백으로 바꾸고, 가운데 120×120 을 {} 로 자른 뒤, {} 로 줄이고 ÷255 한 다음 <code>[None, None]</code> 으로 {} 를 만든다.", "opts": [["cv2.COLOR_RGB2BGR", "cv2.COLOR_BGR2GRAY"], ["gray[100:220, :]", "gray[:, 0:120]", "gray[:, 100:220]"], ["120×120", "28×28", "20×20"], ["(1, 28, 28)", "(28, 28, 1)", "(1, 1, 28, 28)"]], "a": [1, 2, 1, 2], "w": "가운데 열은 (320 − 120) / 2 = 100 부터 220 까지. 28×28 (INTER_AREA) → [None, None] 으로 배치 · 채널 축을 붙여 (1, 1, 28, 28).", "an": "문제 7-3"}, {"type": "match", "p": "문제 7-2 — <code>digits.mp4</code> 를 열어 읽은 속성과 값을 짝지으세요.", "left": ["<code>CAP_PROP_FRAME_COUNT</code>", "<code>CAP_PROP_FPS</code>", "<code>CAP_PROP_FRAME_WIDTH</code>", "<code>CAP_PROP_FRAME_HEIGHT</code>"], "right": ["180", "30", "320", "120"], "a": [0, 1, 2, 3], "w": "180 프레임 · 30 FPS · 320×120 · 6.0 초. 모두 float 로 나오므로 int() 로 바꿉니다.", "an": "문제 7-2"}, {"type": "order", "p": "문제 7-4 — 읽기 → 처리 → 쓰기 루프의 순서로 배열하세요.", "items": ["<code>cap = cv2.VideoCapture(...)</code>, <code>writer = cv2.VideoWriter(...)</code>", "<code>ok, frame = cap.read()</code>", "<code>if not ok: break</code>", "<code>cv2.rectangle</code> · <code>cv2.putText</code> 로 상자와 프레임 번호 그리기", "<code>writer.write(frame)</code>", "루프가 끝나면 <code>cap.release(); writer.release()</code>"], "w": "while True 안에서 read → ok 확인 → 처리 → write 를 반복하고, 끝나면 둘 다 release. 180 프레임, 프레임당 평균 약 0.7 ms.", "an": "문제 7-4"}, {"type": "hot", "p": "<code>digits.mp4</code> 의 프레임 몇 장입니다 (초록 상자 = 가운데 120×120). 두 번째 숫자 <b>2</b> 가 초록 상자 가운데에 온 프레임을 클릭하세요.", "w": "frame 45 (1.5 초) 입니다. k = 1 번째 숫자라 30 · 1 + 15 = 45. frame 30 · 60 처럼 두 숫자 사이 프레임은 상자에 숫자가 반쯤 걸려 예측이 흔들립니다.", "an": "D1-7 · 영상 = 프레임의 연속", "viewBox": "0 0 700 160", "sw": 700, "svg": "<defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\" pace\" font-weight=\"bold\" dominant-baseline=\"middle\">1</text></g><rect x=\"459.5\" y=\"52\" width=\"45.0\" height=\"45.0\" fill=\"none\" stroke=\"#4ade80\" stroke-width=\"1.4\"/><text x=\"482.0\" y=\"115.0\" font-size=\"12\" fill=\"#f5b942\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">frame 60</text><text x=\"482.0\" y=\"133.0\" font-size=\"10.5\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">2.0 초</text><clipPath id=\"fc4\"><rect x=\"558\" y=\"52\" width=\"120.0\" height=\"45.0\"/></clipPath><rect x=\"558\" y=\"52\" width=\"120.0\" height=\"45.0\" fill=\"#000\"/><g clip-path=\"url(#fc4)\"><text x=\"558.0\" y=\"75.5\" font-size=\"30\" fill=\"#f0f0f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"bold\" dominant-baseline=\"middle\">2</text><text x=\"618.0\" y=\"75.5\" font-size=\"30\" fill=\"#f0f0f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"bold\" dominant-baseline=\"middle\">1</text><text x=\"678.0\" y=\"75.5\" font-size=\"30\" fill=\"#f0f0f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"bold\" dominant-baseline=\"middle\">0</text></g><rect x=\"595.5\" y=\"52\" width=\"45.0\" height=\"45.0\" fill=\"none\" stroke=\"#4ade80\" stroke-width=\"1.4\"/><text x=\"618.0\" y=\"115.0\" font-size=\"12\" fill=\"#f5b942\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">frame 75</text><text x=\"618.0\" y=\"133.0\" font-size=\"10.5\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">2.5 초</text><text x=\"14\" y=\"22\" font-size=\"11.5\" fill=\"#8a9bb8\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">120×320 · 30 FPS — 초록 상자 = 가운데 120×120 (frame_to_input 이 자르는 영역)</text>", "regions": [{"id": "f15", "label": "frame 15", "x": 10, "y": 46, "w": 128.0, "h": 95.0}, {"id": "f30", "label": "frame 30", "x": 146, "y": 46, "w": 128.0, "h": 95.0}, {"id": "f45", "label": "frame 45", "x": 282, "y": 46, "w": 128.0, "h": 95.0}, {"id": "f60", "label": "frame 60", "x": 418, "y": 46, "w": 128.0, "h": 95.0}, {"id": "f75", "label": "frame 75", "x": 554, "y": 46, "w": 128.0, "h": 95.0}], "a": "f45"}, {"type": "code", "p": "문제 7-1 — 프레임 180장(6초) 을 <code>digits.mp4</code> 로 저장하세요. (<code>FPS = 30</code>, <code>W_V = 320</code>, <code>H_V = 120</code>)", "code": "fourcc = cv2.VideoWriter_fourcc(*\"mp4v\")\nwriter = cv2.VideoWriter(\"digits.mp4\", fourcc, {{}}, ({{}}))\nfor i in range(6 * FPS):\n    writer.{{}}(frame_at(i))\nwriter.{{}}", "a": [["FPS", "30"], ["W_V, H_V", "320, 120"], ["write"], ["release()"]], "w": "크기는 (W, H) = (W_V, H_V). write 로 프레임을 넣고 release() 로 닫아야 약 43 KB 파일이 완성됩니다.", "an": "문제 7-1"}]}, {"t": "8교시 · 미니 프로젝트 — 종이 손글씨", "anim": "D1-8 종이 손글씨 전처리", "qs": [{"type": "single", "p": "MNIST 로 test 0.9830 까지 학습한 SimpleConvNet 에 종이 사진을 흑백 → 28×28 → ÷255 만 해서(naive) 넣었더니 30장 중 <b>27장을 '8'</b> 로 예측했습니다 (정확도 0.100). 가장 큰 이유는?", "o": ["흰 종이 배경이라 거의 모든 픽셀이 밝아서 — MNIST 는 검은 배경에 흰 글씨", "2 epoch 만 학습해 모델이 덜 배워서", "사진이 컬러라 채널 수가 맞지 않아서", "JPEG 압축으로 숫자가 지워져서"], "a": 0, "w": "MNIST 와 밝기가 정반대라 모델이 '밝은 픽셀이 가장 많은 숫자' 8 로 쏠립니다. d7_0 의 naive 확률은 8 이 0.574, 7 은 0.004.", "an": "과제 4"}, {"type": "single", "p": "과제 6 — <code>preprocess</code> 에서 조명 보정 두 줄 (<code>bg = …</code>, <code>g = cv2.divide(…)</code>) 을 지우고 다시 돌리면 30장 정확도는? (실행 예)", "o": ["0.100 (3/30)", "0.967 (29/30)", "1.000 (30/30)", "0.600 (18/30)"], "a": 3, "w": "그림자 진 사진 11장에서 Otsu 가 그림자 쪽을 글씨로 잡아 거대한 덩어리가 됩니다. 조명 보정까지 하면 0.967 (29/30).", "an": "과제 6"}, {"type": "multi", "p": "MNIST 손글씨 이미지가 가진 성질로 <b>옳은 것</b>을 모두 고르세요. (전처리가 사진을 이 모양으로 맞춥니다)", "o": ["검은 배경에 흰 글씨", "숫자가 28×28 을 가장자리까지 꽉 채운다", "숫자가 20×20 상자 안에 비율을 유지해 들어간다", "무게중심이 28×28 의 가운데 (14, 14) 에 있다"], "a": [0, 2, 3], "w": "숫자는 긴 변 20 으로 줄여 28×28 가운데에 놓고 무게중심을 (14, 14) 로 맞춘 데이터라, 가장자리 4 픽셀 정도는 비어 있습니다.", "an": "D1-8 · 종이 손글씨 전처리"}, {"type": "ox", "p": "전처리 후 30장 정확도는 0.967 이고, 틀린 1장은 <code>d7_2.jpg</code> 로 '2' 로 예측했다. (실행 예)", "a": true, "w": "29/30 = 0.967. 남은 1장 d7_2.jpg 는 7 을 2 로 예측했고, d7_0 은 전처리 후 7 확률 1.00.", "an": "과제 4"}, {"type": "short", "p": "과제 5 — 영상의 가운데 프레임 6개 (15, 45, 75, 105, 135, 165) 에 대한 SimpleConvNet 예측 정확도는? (소수로)", "a": ["1.0", "1", "1.00", "100%"], "w": "예측 [7, 2, 1, 0, 4, 1] 이 정답과 모두 같아 1.0. 두 숫자 사이 프레임은 확신도가 낮고 예측이 흔들립니다.", "an": "과제 5"}, {"type": "drop", "p": "더 알아보기 — 데이터 분포 문제입니다. 빈칸에 알맞은 것을 고르세요.", "p2": "학습 데이터와 실제 입력의 분포가 다른 문제를 {} 라고 한다. 오늘은 {} 로 입력을 학습 데이터 쪽으로 옮겼고, Day 2 의 {} 와 Day 3 의 전이학습은 모델이 실제 데이터를 보고 배우게 한다.", "opts": [["overfitting", "domain shift", "vanishing gradient"], ["전처리", "Dropout", "데이터 증강"], ["BatchNorm", "전처리", "데이터 증강"]], "a": [1, 0, 2], "w": "domain shift — '실험실에서는 잘 되는데 현장에서 안 된다' 의 가장 흔한 원인입니다. 전처리로 naive 0.100 → 0.967.", "an": "D1-8 · domain shift"}, {"type": "match", "p": "과제 3 <code>preprocess</code> 의 단계와 코드를 짝지으세요.", "left": ["조명 보정", "반전 + 이진화", "숫자만 자르기", "무게중심 맞추기"], "right": ["<code>cv2.divide(g, GaussianBlur(g, (0, 0), 25), scale=255)</code>", "<code>threshold(g, 0, 255, THRESH_BINARY_INV + THRESH_OTSU)</code>", "<code>max(contours, key=cv2.contourArea)</code> → <code>boundingRect</code>", "<code>moments</code> → <code>warpAffine</code> 로 (14 − cx, 14 − cy) 이동"], "a": [0, 1, 2, 3], "w": "아주 크게 흐린 이미지는 조명 · 그림자만 남은 배경이라 원본을 나누면 밝기가 평평해집니다. BINARY_INV 로 흰 배경 → 검은 배경.", "an": "과제 3"}, {"type": "order", "p": "과제 3 — 종이 사진을 MNIST 모양 (1, 1, 28, 28) 으로 바꾸는 <code>preprocess</code> 의 단계를 순서대로 배열하세요.", "items": ["<code>cvtColor(BGR2GRAY)</code> 흑백", "배경 <code>GaussianBlur(g, (0, 0), 25)</code> 로 나눠 조명 보정", "<code>GaussianBlur (5, 5)</code> → Otsu 반전 이진화 → <code>MORPH_OPEN</code>", "가장 큰 contour 의 boundingRect 로 자르기", "긴 변을 20 으로 (scale = 20 / max(w, h))", "28×28 가운데에 놓 const TYPES = {
  single:{n:'단일 선택',c:'#60a5fa'}, multi:{n:'다중 선택',c:'#c084fc'}, ox:{n:'O/X',c:'#f5b942'},
  short:{n:'단답형',c:'#2dd4bf'}, drop:{n:'선택형 빈칸',c:'#93c5fd'}, match:{n:'짝 맞추기',c:'#f472b6'},
  order:{n:'순서 배열',c:'#fb923c'}, hot:{n:'핫스팟',c:'#4ade80'}, code:{n:'코드 완성',c:'#a3e635'}
};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip = h => { const d = document.createElement('div'); d.innerHTML = h; return d.textContent; };
const norm = s => String(s ?? '').toLowerCase().replace(/\s+/g, '').replace(/[“”]/g, '"').replace(/[‘’]/g, "'");
function rng(seed){ let h = 2166136261; for (const c of seed) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 100000) / 100000; }; }
function shuffled(arr, seed){ const r = rng(seed), idx = arr.map((_, i) => i); for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; } if (idx.every((v, i) => v === i) && idx.length > 1) idx.push(idx.shift()); return idx; }

// ── 상태 ──
let tab = 0;
const graded = Q.map(() => false);
const ans = Q.map((s, i) => s.qs.map((q, k) => init(q, `${i}-${k}`)));
function init(q, id){
  switch (q.type) {
    case 'single': case 'ox': case 'hot': return null;
    case 'multi': return [];
    case 'short': return '';
    case 'drop': return q.opts.map(() => -1);
    case 'match': return q.left.map(() => -1);
    case 'order': return shuffled(q.items, 'o' + id);          // 현재 화면 순서(원래 인덱스)
    case 'flash': return { flipped:false, self:null };
    case 'code': return q.a.map(() => '');
  }
}
function answered(q, a){
  switch (q.type) {
    case 'single': case 'ox': case 'hot': return a !== null;
    case 'multi': return a.length > 0;
    case 'short': return a.trim() !== '';
    case 'drop': case 'match': return a.every(v => v >= 0);
    case 'order': return true;
    case 'flash': return a.self !== null;
    case 'code': return a.every(v => v.trim() !== '');
  }
}
function correct(q, a){
  switch (q.type) {
    case 'single': case 'hot': return a === q.a;
    case 'ox': return a === q.a;
    case 'multi': return a.length === q.a.length && q.a.every(x => a.includes(x));
    case 'short': return q.a.some(x => norm(x) === norm(a));
    case 'drop': return a.every((v, i) => v === q.a[i]);
    case 'match': return a.every((v, i) => v === q.a[i]);
    case 'order': return a.every((v, i) => v === i);
    case 'flash': return a.self === true;
    case 'code': return a.every((v, i) => q.a[i].some(x => norm(x) === norm(v)));
  }
}
const scoreOf = i => ans[i].filter((a, k) => correct(Q[i].qs[k], a)).length;

// ── 답 문자열 (오답 정리용) ──
const L = '①②③④⑤⑥⑦⑧';
function fmt(q, a, right){
  switch (q.type) {
    case 'single': return right ? `${L[q.a]} ${strip(q.o[q.a])}` : (a === null ? '미응답' : `${L[a]} ${strip(q.o[a])}`);
    case 'multi': { const v = right ? q.a : a; return v.length ? [...v].sort().map(i => L[i]).join(' ') : '미응답'; }
    case 'ox': { const v = right ? q.a : a; return v === null ? '미응답' : (v ? 'O' : 'X'); }
    case 'short': return right ? q.a[0] : (a.trim() || '미응답');
    case 'drop': return (right ? q.a : a).map((v, i) => v < 0 ? '?' : strip(q.opts[i][v])).join(' / ');
    case 'match': return (right ? q.a : a).map((v, i) => `${strip(q.left[i])}→${v < 0 ? '?' : strip(q.right[v])}`).join(', ');
    case 'order': return (right ? q.items.map((_, i) => i) : a).map(i => strip(q.items[i])).join(' → ');
    case 'hot': { const v = right ? q.a : a; return v === null ? '미응답' : (q.regions.find(r => r.id === v) || {}).label; }
    case 'flash': return right ? strip(q.back) : (a.self === null ? '미응답' : (a.self ? '알았다' : '몰랐다'));
    case 'code': return (right ? q.a.map(x => x[0]) : a.map(v => v || '?')).join(' / ');
  }
}

// ── 렌더 ──
function renderTabs(){
  $('#tabs').innerHTML = Q.map((s, i) => {
    const n = ans[i].filter((a, k) => answered(s.qs[k], a)).length;
    return `<button class="${i === tab ? 'active' : ''} ${graded[i] ? 'graded' : ''}" data-i="${i}">${i + 1}교시<span class="s">${graded[i] ? scoreOf(i) + '/10' : n + '/10'}</span></button>`;
  }).join('');
  $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => { tab = +b.dataset.i; history.replaceState(null, '', '#t' + (tab + 1)); render(); window.scrollTo({ top: 0 }); });
}
function qHTML(q, k){
  const a = ans[tab][k], g = graded[tab], id = `${tab}-${k}`, dis = g ? 'disabled' : '';
  const ok = g && correct(q, a);
  let body = '';
  switch (q.type) {
    case 'single':
    case 'multi': {
      const isM = q.type === 'multi';
      body = (isM ? '<div class="hint" style="margin:-4px 0 8px">정답을 <b>모두</b> 고르세요.</div>' : '') + '<div class="opts">' + q.o.map((o, j) => {
        const sel = isM ? a.includes(j) : a === j, isA = isM ? q.a.includes(j) : q.a === j;
        let c = sel ? 'sel' : '';
        if (g) c = isA && sel ? 'ok' : (sel ? 'bad' : (isA ? (isM ? 'miss' : 'ok') : ''));
        const box = isM ? (sel ? '☑' : '☐') : L[j];
        return `<button class="opt ${c}" data-k="${k}" data-j="${j}" ${dis}><span class="box">${box}</span> ${o}</button>`;
      }).join('') + '</div>';
      break;
    }
    case 'ox':
      body = '<div class="ox">' + [true, false].map(v => {
        let c = a === v ? 'active' : '';
        if (g) c = (q.a === v ? 'opt ok' : (a === v ? 'opt bad' : ''));
        return `<button class="oxb ${c}" data-k="${k}" data-v="${v}" ${dis} aria-label="${v ? '참' : '거짓'}">${v ? 'O' : 'X'}</button>`;
      }).join('') + '</div>';
      break;
    case 'short':
      body = `<input type="text" class="sa" data-k="${k}" value="${esc(a)}" placeholder="정답 입력" style="width:min(100%,320px)" ${dis}>`;
      break;
    case 'drop': {
      let i = 0;
      body = '<div class="fill">' + q.p2.replace(/\{\}/g, () => {
        const n = i++;
        const opts = q.opts[n].map((o, j) => `<option value="${j}" ${a[n] === j ? 'selected' : ''}>${esc(strip(o))}</option>`).join('');
        const st = g ? `style="border-color:${a[n] === q.a[n] ? 'var(--green)' : 'var(--red)'}"` : '';
        return `<select class="dd" data-k="${k}" data-n="${n}" ${dis} ${st}><option value="-1">선택</option>${opts}</select>`;
      }) + '</div>';
      break;
    }
    case 'match': {
      const order = shuffled(q.right, 'm' + id);
      body = q.left.map((l, i) => {
        const opts = order.map(j => `<option value="${j}" ${a[i] === j ? 'selected' : ''}>${esc(strip(q.right[j]))}</option>`).join('');
        const c = g ? (a[i] === q.a[i] ? 'ok' : 'bad') : '';
        return `<div class="mrow ${c}"><span class="l">${l}</span><span class="arr">↔</span><select class="mm" data-k="${k}" data-i="${i}" ${dis}><option value="-1">짝 선택</option>${opts}</select></div>`;
      }).join('');
      break;
    }
    case 'order':
      body = '<div class="hint" style="margin:-4px 0 8px">끌어다 놓거나 ▲▼ 버튼으로 순서를 바꾸세요.</div><ol class="ord" data-k="' + k + '">' + a.map((it, pos) => {
        const c = g ? (it === pos ? 'ok' : 'bad') : '';
        return `<li class="${c}" draggable="${!g}" data-pos="${pos}"><span class="k">${pos + 1}</span><span>${q.items[it]}</span><span class="mv"><button data-k="${k}" data-pos="${pos}" data-d="-1" ${dis || (pos === 0 ? 'disabled' : '')} aria-label="위로">▲</button><button data-k="${k}" data-pos="${pos}" data-d="1" ${dis || (pos === a.length - 1 ? 'disabled' : '')} aria-label="아래로">▼</button></span></li>`;
      }).join('') + '</ol>';
      break;
    case 'hot': {
      const regs = q.regions.map(r => {
        let c = a === r.id ? 'sel' : '';
        if (g) c = r.id === q.a ? 'ok' : (a === r.id ? 'bad' : '');
        const shape = r.shape === 'circle' ? `<circle cx="${r.x}" cy="${r.y}" r="${r.r}"` : `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="6"`;
        return `${shape} class="rg ${c}" data-k="${k}" data-r="${r.id}" tabindex="${g ? -1 : 0}" role="button" aria-label="${esc(r.label)}"><title>${esc(r.label)}</title>${r.shape === 'circle' ? '</circle>' : '</rect>'}`;
      }).join('');
      body = `<div class="hot"><svg viewBox="${q.viewBox}" width="${q.sw}" xmlns="http://www.w3.org/2000/svg">${q.svg}${regs}</svg></div>` +
        `<div class="hint" style="margin-top:6px">선택: <b style="color:var(--amber)">${a === null ? '없음' : esc((q.regions.find(r => r.id === a) || {}).label)}</b></div>`;
      break;
    }
    case 'flash':
      body = `<div class="card ${a.flipped ? 'flip' : ''}" data-k="${k}"><div class="in"><div class="f">${q.front}</div><div class="b">${q.back}</div></div></div>` +
        `<div class="selfrow"><button class="flipb" data-k="${k}" ${g ? 'disabled' : ''}>${a.flipped ? '앞면 보기' : '🔄 카드 뒤집기'}</button>` +
        `<button class="selfb ${a.self === true ? 'active' : ''}" data-k="${k}" data-v="1" ${g || !a.flipped ? 'disabled' : ''}>✅ 알았다</button>` +
        `<button class="selfb ${a.self === false ? 'active' : ''}" data-k="${k}" data-v="0" ${g || !a.flipped ? 'disabled' : ''}>❌ 몰랐다</button>` +
        `<span class="hint">${a.flipped ? '정답과 비교해 스스로 채점하세요.' : '먼저 답을 떠올린 뒤 뒤집으세요.'}</span></div>`;
      break;
    case 'code': {
      let i = 0;
      body = '<pre>' + esc(q.code).replace(/\{\{\}\}/g, () => {
        const n = i++;
        const w = Math.max(5, (q.a[n][0] || '').length + 2);
        const st = g ? `style="border-color:${q.a[n].some(x => norm(x) === norm(a[n])) ? 'var(--green)' : 'var(--red)'};width:${w}ch"` : `style="width:${w}ch"`;
        return `<input type="text" class="ci" data-k="${k}" data-n="${n}" value="${esc(a[n])}" ${dis} ${st} aria-label="빈칸 ${n + 1}">`;
      }) + '</pre>';
      break;
    }
  }
  const t = TYPES[q.type];
  const prompt = q.type === 'drop' ? (q.p || '') : (q.type === 'flash' ? (q.p || '카드 앞면의 질문에 답을 떠올린 뒤 뒤집어 확인하세요.') : q.p);
  let fb = '';
  if (g) {
    const right = q.type === 'flash' ? '' : `<div>정답: <b>${esc(fmt(q, a, true))}</b></div>`;
    fb = `<div class="fb ${ok ? 'ok' : 'bad'}"><b class="v">${ok ? '정답' : '오답'}</b>${right}${q.w}<span class="anim">확인: ${q.an}</span></div>`;
  }
  const un = !g && !answered(q, a) && attempted[tab] ? 'unans' : '';
  return `<div class="q ${g ? (ok ? 'ok' : 'bad') : un}"><div class="qh"><span class="n">문항 ${k + 1}</span><span class="ty" style="color:${t.c};border-color:${t.c}">${t.n}</span></div><div class="p">${prompt}</div>${body}${fb}</div>`;
}
const attempted = Q.map(() => false);
function render(){
  renderTabs();
  const s = Q[tab];
  $('#sheet').innerHTML = `<div class="head"><span class="t">${s.t}</span><span class="a">🎬 ${s.anim}</span></div>` + s.qs.map((q, k) => qHTML(q, k)).join('');
  bind();
  const nm = $('#name').value, g = graded[tab];
  if (g) {
    const sc = scoreOf(tab); $('#rscore').textContent = `${sc}/10`;
    if (nm.trim()) { $('#rcode').textContent = codeFor(nm, tab + 1, sc); $('#rhint').textContent = '결과 코드'; }
    else { $('#rcode').textContent = '—'; $('#rhint').textContent = '이름을 입력하면 결과 코드가 나옵니다.'; }
  } else {
    $('#rcode').textContent = '—'; $('#rscore').textContent = '';
    const n = ans[tab].filter((a, k) => answered(s.qs[k], a)).length;
    $('#rhint').textContent = `${tab + 1}교시: ${n}/10 응답. 채점하기를 누르면 잠깁니다.`;
  }
  $('#gradeBtn').disabled = g;
}
function bind(){
  const S = $('#sheet'), A = ans[tab];
  S.querySelectorAll('.opt[data-j]').forEach(b => b.onclick = () => {
    const k = +b.dataset.k, j = +b.dataset.j, q = Q[tab].qs[k];
    if (q.type === 'multi') { const i = A[k].indexOf(j); i < 0 ? A[k].push(j) : A[k].splice(i, 1); }
    else A[k] = A[k] === j ? null : j;
    render();
  });
  S.querySelectorAll('.oxb').forEach(b => b.onclick = () => { const k = +b.dataset.k, v = b.dataset.v === 'true'; A[k] = A[k] === v ? null : v; render(); });
  S.querySelectorAll('.sa').forEach(i => i.oninput = () => { A[+i.dataset.k] = i.value; renderTabs(); });
  S.querySelectorAll('.ci').forEach(i => i.oninput = () => { A[+i.dataset.k][+i.dataset.n] = i.value; renderTabs(); });
  S.querySelectorAll('.dd').forEach(s => s.onchange = () => { A[+s.dataset.k][+s.dataset.n] = +s.value; renderTabs(); });
  S.querySelectorAll('.mm').forEach(s => s.onchange = () => { A[+s.dataset.k][+s.dataset.i] = +s.value; renderTabs(); });
  S.querySelectorAll('.ord .mv button').forEach(b => b.onclick = () => {
    const k = +b.dataset.k, p = +b.dataset.pos, d = +b.dataset.d, arr = A[k];
    [arr[p], arr[p + d]] = [arr[p + d], arr[p]]; render();
  });
  S.querySelectorAll('.ord').forEach(ol => {
    const k = +ol.dataset.k; let from = null;
    ol.querySelectorAll('li').forEach(li => {
      li.addEventListener('dragstart', e => { from = +li.dataset.pos; li.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(from)); });
      li.addEventListener('dragend', () => li.classList.remove('drag'));
      li.addEventListener('dragover', e => { if (from !== null) { e.preventDefault(); li.classList.add('over'); } });
      li.addEventListener('dragleave', () => li.classList.remove('over'));
      li.addEventListener('drop', e => { e.preventDefault(); const to = +li.dataset.pos; if (from === null || from === to) return; const arr = A[k]; const [x] = arr.splice(from, 1); arr.splice(to, 0, x); from = null; render(); });
    });
  });
  S.querySelectorAll('.rg').forEach(r => {
    const pick = () => { if (graded[tab]) return; const k = +r.dataset.k; A[k] = A[k] === r.dataset.r ? null : r.dataset.r; render(); };
    r.addEventListener('click', pick);
    r.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
  });
  S.querySelectorAll('.flipb').forEach(b => b.onclick = () => { const k = +b.dataset.k; A[k].flipped = !A[k].flipped; render(); });
  S.querySelectorAll('.card').forEach(c => c.onclick = () => { if (graded[tab]) return; const k = +c.dataset.k; A[k].flipped = !A[k].flipped; render(); });
  S.querySelectorAll('.selfb').forEach(b => b.onclick = () => { const k = +b.dataset.k; A[k].self = b.dataset.v === '1'; render(); });
}

// ── 채점 · 결과 코드 ──
function hash(s){ let h = 5381; for (const c of s) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return h.toString(16).padStart(8, '0').slice(-4); }
function codeFor(name, t, score){ return `${t}${'ABCDEFGHIJK'[10 - score] || 'K'}-${hash(`${name.trim()}|${t}|${score}|vbday1`)}`; }
$('#gradeBtn').onclick = () => {
  const s = Q[tab], n = ans[tab].filter((a, k) => answered(s.qs[k], a)).length;
  attempted[tab] = true;
  if (n < 10 && !confirm(`아직 ${10 - n}문항에 답하지 않았습니다. 그래도 채점할까요? (미응답은 오답 처리)`)) { render(); return; }
  graded[tab] = true; render();
};
$('#resetBtn').onclick = () => {
  if (!confirm(`${tab + 1}교시 답을 모두 지우고 다시 풀까요?`)) return;
  graded[tab] = false; attempted[tab] = false;
  ans[tab] = Q[tab].qs.map((q, k) => init(q, `${tab}-${k}`)); render();
};
$('#name').oninput = render;

// ── 제출 · 오답 정리 ──
let lastHtml = '', lastText = '';
function buildReport(){
  const nm = $('#name').value.trim() || '(이름 없음)', ds = new Date().toLocaleString('ko-KR');
  let h = `<h3>Vision 기본 모델 Day 1 개념 워크시트 — 오답 정리</h3><div class="meta">${esc(nm)} · ${ds}</div>`;
  let t = `Vision 기본 모델 Day 1 개념 워크시트 — 오답 정리\n이름: ${nm}\n일시: ${ds}\n\n`;
  let tot = 0, cnt = 0;
  const byType = {};
  Q.forEach((s, i) => {
    if (!graded[i]) return;
    const sc = scoreOf(i); tot += sc; cnt++;
    s.qs.forEach((q, k) => { const b = byType[q.type] ||= [0, 0]; b[1]++; if (correct(q, ans[i][k])) b[0]++; });
    const code = $('#name').value.trim() ? codeFor($('#name').value, i + 1, sc) : '—';
    const wrong = s.qs.map((q, k) => ({ q, k, a: ans[i][k] })).filter(x => !correct(x.q, x.a));
    h += `<div class="sec">${esc(s.t)} — ${sc}/10 · 결과 코드 ${code}</div>`;
    t += `[${s.t}] ${sc}/10 · 결과 코드 ${code}\n`;
    if (!wrong.length) { h += `<div class="ok">전부 정답 🎉</div>`; t += '  전부 정답\n\n'; return; }
    h += '<table><tr><th>#</th><th>유형</th><th>문항</th><th>내 답</th><th>정답</th><th>다시 볼 곳</th></tr>';
    wrong.forEach(({ q, k, a }) => {
      const qt = strip(q.type === 'flash' ? q.front : (q.p || q.p2 || '')).replace(/\s+/g, ' ').slice(0, 70);
      const my = fmt(q, a, false), co = fmt(q, a, true);
      h += `<tr><td>${k + 1}</td><td>${TYPES[q.type].n}</td><td>${esc(qt)}</td><td class="bad">${esc(my)}</td><td class="ok">${esc(co)}</td><td>${esc(strip(q.an))}</td></tr>`;
      t += `  ${k + 1}. [${TYPES[q.type].n}] ${qt}\n     내 답: ${my}\n     정답: ${co}\n     다시 볼 곳: ${strip(q.an)}\n`;
    });
    h += '</table>'; t += '\n';
  });
  const notGraded = Q.map((s, i) => graded[i] ? null : i + 1).filter(x => x);
  const typeLine = Object.entries(byType).map(([k, [c, n]]) => `${TYPES[k].n} ${c}/${n}`).join(' · ');
  const sum = `<div class="sum"><span>채점한 교시 ${cnt}/8</span><span>합계 ${tot}/${cnt * 10}</span>${notGraded.length ? `<span class="none">미채점: ${notGraded.join(', ')}교시</span>` : ''}</div>` + (typeLine ? `<div class="meta">유형별 정답: ${typeLine}</div>` : '');
  h = h.replace('</div>', '</div>' + sum);
  t = t.replace('\n\n', `\n채점한 교시 ${cnt}/8 · 합계 ${tot}/${cnt * 10}${notGraded.length ? ' · 미채점 ' + notGraded.join(', ') + '교시' : ''}\n유형별 정답: ${typeLine}\n\n`);
  lastHtml = h; lastText = t;
  return h;
}
$('#submitBtn').onclick = () => {
  if (!graded.some(x => x)) { alert('먼저 한 교시 이상 채점하세요.'); return; }
  $('#dgBody').innerHTML = buildReport(); $('#toast').textContent = ''; $('#dlg').showModal();
};
$('#closeBtn').onclick = () => $('#dlg').close();
$('#captureBtn').onclick = async () => {
  const htmlDoc = `<meta charset="utf-8">` + lastHtml.replace(/ class="[^"]*"/g, '').replace(/<table>/g, '<table border="1" style="border-collapse:collapse">');
  try {
    if (navigator.clipboard && window.ClipboardItem) {
      await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([htmlDoc], { type: 'text/html' }), 'text/plain': new Blob([lastText], { type: 'text/plain' }) })]);
      $('#toast').textContent = '복사했습니다 — 노션에 붙여 넣으세요.'; return;
    }
  } catch (e) {}
  const ta = document.createElement('textarea'); ta.value = lastText; ta.style.position = 'fixed'; ta.style.opacity = '0';
  $('#dlg').appendChild(ta); ta.focus(); ta.select();
  const ok = document.execCommand('copy'); ta.remove();
  $('#toast').textContent = ok ? '텍스트로 복사했습니다.' : '복사하지 못했습니다 — 직접 선택해 복사하세요.';
};

$('#legend').innerHTML = Object.values(TYPES).map(t => `<span class="tag" style="color:${t.c};border-color:${t.c}55">${t.n}</span>`).join('');
// worksheet.html#t3 → 3교시 탭으로 바로 열기 (노트북 교시별 링크)
function fromHash(){ const m = location.hash.match(/^#t([1-8])$/); if (m) { tab = +m[1] - 1; } }
fromHash();
window.addEventListener('hashchange', () => { fromHash(); render(); window.scrollTo({ top: 0 }); });
render();
</script>
</body>
</html>
