&lt;h1&gt;mynn → PyTorch&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;Neural Network 과목에서 NumPy 로 직접 만든 &lt;code&gt;mynn.py&lt;/code&gt; 의 SimpleConvNet 을 PyTorch 로 옮깁니다. 계층은 그대로 &lt;code&gt;nn.Sequential&lt;/code&gt; 에 넣고, 입력 2장 &lt;code&gt;(2, 1, 28, 28)&lt;/code&gt; 을 한 계층씩 통과시키며 &lt;b style=&quot;color:var(--amber)&quot;&gt;shape&lt;/b&gt; 와 &lt;b style=&quot;color:var(--purple)&quot;&gt;파라미터 수&lt;/b&gt;를 확인합니다. 아래 대응표에서 mynn 쪽 카드를 누르면 PyTorch 대응이 강조됩니다.&lt;/p&gt;
&lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill amber&quot;&gt;(2,1,28,28) → (2,10)&lt;/span&gt;&lt;span class=&quot;pill purple&quot;&gt;780 + 432,100 + 1,010 = 433,890&lt;/span&gt;&lt;span class=&quot;pill teal&quot;&gt;NumPy 판과 같은 수&lt;/span&gt;&lt;span class=&quot;pill blue&quot;&gt;nn.Linear W = (out, in)&lt;/span&gt;&lt;span class=&quot;pill green&quot;&gt;MAC conv 432,000 · fc1 432,000 · fc2 1,000&lt;/span&gt;&lt;/div&gt;

&lt;script&gt;
const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,ms));

function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}
function setCode(h){$(&#x27;#code&#x27;).innerHTML=h;}
function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const g=c.getContext(&#x27;2d&#x27;);g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}
function initPresets(P,stop){$(&#x27;#presets&#x27;).innerHTML=P.map(p=&gt;`&lt;button type=&quot;button&quot;&gt;${p.n}&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}
const esc=s=&gt;String(s).replace(/&amp;/g,&#x27;&amp;amp;&#x27;).replace(/&lt;/g,&#x27;&amp;lt;&#x27;).replace(/&gt;/g,&#x27;&amp;gt;&#x27;);
const fmt=n=&gt;n.toLocaleString(&#x27;en-US&#x27;);
// 공용 선 그래프: o={xr,yr,xt,yt,xf,yf,xl,yl,series:[{pts,c,w,dash,dot}],hl:[{y,c,t}],ml}
function chart(cv,o){
  const [g,W,H]=fitCanvas(cv);g.clearRect(0,0,W,H);
  const ml=o.ml??46,mr=o.mr??12,mt=o.mt??10,mb=o.xl?36:24;
  const X=v=&gt;ml+(v-o.xr[0])/(o.xr[1]-o.xr[0])*(W-ml-mr);

&lt;p class=&quot;sub&quot;&gt;Tensor = ndarray + &lt;b style=&quot;color:var(--amber)&quot;&gt;device&lt;/b&gt; + &lt;b style=&quot;color:var(--amber)&quot;&gt;requires_grad&lt;/b&gt;. 칸 하나 = 메모리 한 칸입니다. &lt;code&gt;torch.from_numpy(a)&lt;/code&gt; 는 같은 칸을 &lt;b style=&quot;color:var(--amber)&quot;&gt;공유&lt;/b&gt;하고, &lt;code&gt;torch.tensor(a)&lt;/code&gt; 는 새 칸으로 &lt;b style=&quot;color:var(--teal)&quot;&gt;복사&lt;/b&gt;합니다. 아래 뷰에서는 &lt;code&gt;arange(24).reshape(2, 3, 4)&lt;/code&gt; 에 reshape · permute · unsqueeze 를 적용해 어떤 칸이 어디로 가는지 확인합니다 (칸을 누르면 대응 칸 강조).&lt;/p&gt;

&lt;div class=&quot;grid&quot;&gt;

&lt;script&gt;
const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,ms));
let busy=false, timer=null;
function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}

function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const g=c.getContext(&#x27;2d&#x27;);g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}
function initPresets(P,stop){$(&#x27;#presets&#x27;).innerHTML=P.map(p=&gt;`&lt;button type=&quot;button&quot;&gt;${p.n}&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}
const esc=s=&gt;String(s).replace(/&amp;/g,&#x27;&amp;amp;&#x27;).replace(/&lt;/g,&#x27;&amp;lt;&#x27;).replace(/&gt;/g,&#x27;&amp;gt;&#x27;);
const fmt=n=&gt;n.toLocaleString(&#x27;en-US&#x27;);
// 공용 선 그래프: o={xr,yr,xt,yt,xf,yf,xl,yl,series:[{pts,c,w,dash,dot}],hl:[{y,c,t}],ml}
function chart(cv,o){
  const [g,W,H]=fitCanvas(cv);g.clearRect(0,0,W,H);
  const ml=o.ml??46,mr=o.mr??12,mt=o.mt??10,mb=o.xl?36:24;
  const X=v=&gt;ml+(v-o.xr[0])/(o.xr[1]-o.xr[0])*(W-ml-mr);
  const Y=v=&gt;mt+(1-(v-o.yr[0])/(o.yr[1]-o.yr[0]))*(H-mt-mb);
  g.font=&#x27;11px Consolas,monospace&#x27;;g.lineWidth=1;
  (o.yt||[]).forEach(v=&gt;{const y=Y(v);g.strokeStyle=&#x27;#1a2540&#x27;;g.beginPath();g.moveTo(ml,y);g.lineTo(W-mr,y);g.stroke();g.fillStyle=&#x27;#5d7292&#x27;;g.textAlign=&#x27;right&#x27;;g.fillText(o.yf?o.yf(v):v,ml-5,y+4);});
  (o.xt||[]).forEach(v=&gt;{const x=X(v);g.strokeStyle=&#x27;#1a2540&#x27;;g.beginPath();g.moveTo(x,mt);g.lineTo(x,H-mb);g.stroke();g.fillStyle=&#x27;#5d7292&#x27;;g.textAlign=&#x27;center&#x27;;g.fillText(o.xf?o.xf(v):v,x,H-mb+14);});
  g.textAlign=&#x27;left&#x27;;
  if(o.xl){g.fillStyle=&#x27;#8a9bb8&#x27;;g.textAlign=&#x27;right&#x27;;g.fillText(o.xl,W-mr,H-4);g.textAlign=&#x27;left&#x27;;}
  if(o.yl){g.fillStyle=&#x27;#8a9bb8&#x27;;g.fillText(o.yl,ml+4,mt+11);}
  (o.hl||[]).forEach(h=&gt;{g.strokeStyle=h.c;g.setLineDash([5,4]);g.beginPath();g.moveTo(ml,Y(h.y));g.lineTo(W-mr,Y(h.y));g.stroke();g.setLineDash([]);if(h.t){g.fillStyle=h.c;g.fillText(h.t,ml+6,Y(h.y)-4);}});
  (o.series||[]).forEach(s=&gt;{if(!s.pts.length)return;g.strokeStyle=s.c;g.fillStyle=s.c;g.lineWidth=s.w||2;g.setLineDash(s.dash||[]);
    g.beginPath();s.pts.forEach(([x,y],i)=&gt;{const px=X(x),py=Y(y);i?g.lineTo(px,py):g.moveTo(px,py);});g.stroke();
    g.setLineDash([]);if(s.dot)s.pts.forEach(([x,y])=&gt;{g.beginPath();g.arc(X(x),Y(y),s.dot,0,7);g.fill();});});

  return {g,W,H,X,Y,ml,mr,mt,mb};
}
function arrow(g,x0,y0,x1,y1,c,w=2,hs=8){const a=Math.atan2(y1-y0,x1-x0),L=Math.hypot(x1-x0,y1-y0);if(L&lt;1)return;hs=Math.min(hs,L*0.6);g.strokeStyle=c;g.fillStyle=c;g.lineWidth=w;g.beginPath();g.moveTo(x0,y0);g.lineTo(x1-Math.cos(a)*hs*0.7,y1-Math.sin(a)*hs*0.7);g.stroke();
  g.beginPath();g.moveTo(x1,y1);g.lineTo(x1-hs*Math.cos(a-0.4),y1-hs*Math.sin(a-0.4));g.lineTo(x1-hs*Math.cos(a+0.4),y1-hs*Math.sin(a+0.4));g.closePath();g.fill();g.lineWidth=1;}

window.__d1={};

// ---- 공유 vs 복사 ----
let st=0, buf1=[0,0,0], buf2=null, hot1=-1, hot2=-1;
const SC=[&#x27;a = np.zeros(3)&#x27;,&#x27;b = torch.from_numpy(a)&#x27;,&#x27;c = torch.tensor(a)&#x27;,&#x27;b[0] = 7&#x27;,&#x27;c[1] = 9&#x27;];
function applyStep(n){buf1=[0,0,0];buf2=null;hot1=-1;hot2=-1;
  if(n&gt;=2)buf2=[0,0,0];
  if(n&gt;=3){buf1[0]=7;if(n===3)hot1=0;}
  if(n&gt;=4){buf2[1]=9;hot2=1;}
  st=n;drawShare();}
const cells=(arr,hot,cls=&#x27;&#x27;)=&gt;arr.map((v,i)=&gt;`&lt;div class=&quot;cell ${cls} ${i===hot?&#x27;hot&#x27;:&#x27;&#x27;}&quot;&gt;&lt;small&gt;${i}&lt;/small&gt;${v}&lt;/div&gt;`).join(&#x27;&#x27;);
function drawShare(){
  $(&#x27;#nm1&#x27;).innerHTML=(st&gt;=0?&#x27;&lt;span class=&quot;nm a&quot;&gt;a (ndarray)&lt;/span&gt;&#x27;:&#x27;&#x27;)+(st&gt;=1?&#x27;&lt;span class=&quot;nm b&quot;&gt;b (Tensor, 공유)&lt;/span&gt;&#x27;:&#x27;&#x27;);
  $(&#x27;#m1&#x27;).innerHTML=cells(buf1,hot1);
  $(&#x27;#nm2&#x27;).innerHTML=buf2?&#x27;&lt;span class=&quot;nm c&quot;&gt;c (Tensor, 복사)&lt;/span&gt;&#x27;:&#x27;&lt;span class=&quot;dim&quot; style=&quot;font-size:12.5px&quot;&gt;아직 없음&lt;/span&gt;&#x27;;
  $(&#x27;#m2&#x27;).innerHTML=buf2?cells(buf2,hot2,&#x27;cp&#x27;):&#x27;&#x27;;
  $$(&#x27;.ctl button[id^=bS]&#x27;).forEach((b,i)=&gt;b.classList.toggle(&#x27;sel&#x27;,i&lt;=st));
  const A=&#x27;[&#x27;+buf1.join(&#x27;, &#x27;)+&#x27;]&#x27;,C=buf2?&#x27;[&#x27;+buf2.join(&#x27;, &#x27;)+&#x27;]&#x27;:&#x27;—&#x27;;
  $(&#x27;#kv&#x27;).innerHTML=`&lt;span&gt;a&lt;/span&gt;&lt;b style=&quot;color:var(--blue)&quot;&gt;${A}&lt;/b&gt;&lt;span&gt;b&lt;/span&gt;&lt;b style=&quot;color:var(--amber)&quot;&gt;${st&gt;=1?A+&#x27;  (a 와 같은 칸)&#x27;:&#x27;—&#x27;}&lt;/b&gt;&lt;span&gt;c&lt;/span&gt;&lt;b style=&quot;color:var(--teal)&quot;&gt;${C}&lt;/b&gt;&lt;span&gt;b.dtype&lt;/span&gt;&lt;b&gt;${st&gt;=1?&#x27;torch.float64 (a 를 따라감)&#x27;:&#x27;—&#x27;}&lt;/b&gt;&lt;span&gt;a 가 바뀌었나&lt;/span&gt;&lt;b style=&quot;color:${st&gt;=3?&#x27;var(--red)&#x27;:&#x27;var(--dim)&#x27;}&quot;&gt;${st&gt;=3?&#x27;예 — b[0] = 7 이 a[0] 을 바꿈&#x27;:&#x27;아니오&#x27;}&lt;/b&gt;`;
  setCode(SC.map((s,i)=&gt;i&lt;=st?`&lt;span class=&quot;${i===st?&#x27;a&#x27;:&#x27;g&#x27;}&quot;&gt;${s}&lt;/span&gt;`:`&lt;span class=&quot;c&quot;&gt;${s}&lt;/span&gt;`).join(&#x27;\n&#x27;)+`\n&lt;span class=&quot;c&quot;&gt;print(a, c)&lt;/span&gt;  &lt;span class=&quot;b&quot;&gt;# ${st&gt;=4?&#x27;[7. 0. 0.]  tensor([0., 9., 0.], dtype=torch.float64)&#x27;:&#x27;…&#x27;}&lt;/span&gt;`);
}
async function share(ms=750){for(let i=0;i&lt;5;i++){applyStep(i);setStatus(&#x27;info&#x27;,SC[i]);await sleep(ms);}window.__d1.share={a:buf1.slice(),c:buf2.slice()};setStatus(&#x27;ok&#x27;,&#x27;a = [7, 0, 0] (b 와 공유) · c = [0, 9, 0] (복사본만 바뀜)&#x27;);}
$$(&#x27;.ctl button[id^=bS]&#x27;).forEach((b,i)=&gt;b.onclick=()=&gt;{if(busy)return;applyStep(i);setStatus(&#x27;info&#x27;,SC[i]);});
// ---- view 연산 ----
const SH=[2,3,4];
const OPS={
 view:{n:&#x27;reshape(2, -1)&#x27;,sh:[2,12],src:idx=&gt;{const f=idx[0]*12+idx[1];return [Math.floor(f/12),Math.floor(f%12/4),f%4];},note:&#x27;reshape / view 는 &lt;b&gt;모양만&lt;/b&gt; 바꿉니다. 메모리 순서 그대로 한 줄을 12칸씩 다시 자릅니다 → (2, 12). 원소 순서 0,1,2,… 그대로.&#x27;},
 perm:{n:&#x27;permute(0, 2, 1)&#x27;,sh:[2,4,3],src:idx=&gt;[idx[0],idx[2],idx[1]],note:&#x27;permute 는 &lt;b&gt;축 순서&lt;/b&gt;를 바꿉니다. p[i, j, k] = x[i, k, j] → &lt;b&gt;p[1, 3, 2] == x[1, 2, 3] == 23&lt;/b&gt;. 메모리는 그대로이고 stride 만 바뀌어 contiguous 가 아닙니다 (이미지 HWC → CHW 에 씀).&#x27;},
 unsq:{n:&#x27;unsqueeze(0)&#x27;,sh:[1,2,3,4],src:idx=&gt;[idx[1],idx[2],idx[3]],note:&#x27;unsqueeze(0) 은 맨 앞에 크기 1 축을 넣습니다 → (1, 2, 3, 4). 이미지 1장을 &lt;b&gt;배치 1장&lt;/b&gt;으로 만들 때 씁니다. 값 · 메모리는 그대로.&#x27;},
};
let op=&#x27;perm&#x27;, sel=null; // sel = x index [i,j,k]
const xval=([i,j,k])=&gt;i*12+j*4+k;
function grid3(sh,val,pick,tag){ // sh: [..., R, C]
  const R=sh[sh.length-2],C=sh[sh.length-1],outer=sh.slice(0,-2),no=outer.reduce((a,b)=&gt;a*b,1);let h=&#x27;&#x27;;
  for(let o=0;o&lt;no;o++){const oi=outer.length===2?[Math.floor(o/outer[1]),o%outer[1]]:outer.length===1?[o]:[];
    h+=`&lt;div class=&quot;dim&quot; style=&quot;font-family:var(--mono);font-size:11.5px;margin-top:4px&quot;&gt;[${oi.join(&#x27;, &#x27;)}${oi.length?&#x27;, &#x27;:&#x27;&#x27;}:, :]&lt;/div&gt;&lt;div class=&quot;vg&quot; style=&quot;grid-template-columns:repeat(${C},minmax(0,1fr))&quot;&gt;`;
    for(let r=0;r&lt;R;r++)for(let c=0;c&lt;C;c++){const idx=oi.concat([r,c]);const v=val(idx);h+=`&lt;div class=&quot;cell ${pick(idx,v)}&quot; data-${tag}=&quot;${idx.join(&#x27;,&#x27;)}&quot;&gt;${v}&lt;/div&gt;`;}
    h+=&#x27;&lt;/div&gt;&#x27;;}
  return h;}
function drawView(){
  const O=OPS[op],sv=sel?xval(sel):-1;
  let target=null;
  $(&#x27;#vx&#x27;).innerHTML=grid3(SH,xval,(idx,v)=&gt;v===sv?&#x27;src&#x27;:&#x27;&#x27;,&#x27;x&#x27;);
  $(&#x27;#vrl&#x27;).textContent=`r = x.${O.n} — (${O.sh.join(&#x27;, &#x27;)})`;
  $(&#x27;#vr&#x27;).innerHTML=grid3(O.sh,idx=&gt;xval(O.src(idx)),(idx,v)=&gt;{if(v===sv){target=idx;return &#x27;dst&#x27;;}return &#x27;&#x27;;},&#x27;r&#x27;);
  $(&#x27;#flat&#x27;).innerHTML=[...Array(24)].map((_,i)=&gt;`&lt;div class=&quot;cell ${i===sv?&#x27;hot&#x27;:&#x27;&#x27;}&quot; style=&quot;width:30px;height:26px;font-size:11.5px&quot;&gt;${i}&lt;/div&gt;`).join(&#x27;&#x27;);
  $(&#x27;#opNote&#x27;).innerHTML=O.note+(sel?` &amp;nbsp;선택: &lt;b style=&quot;color:var(--amber)&quot;&gt;x[${sel.join(&#x27;, &#x27;)}] = ${sv}&lt;/b&gt; → &lt;b style=&quot;color:var(--purple)&quot;&gt;r[${target.join(&#x27;, &#x27;)}]&lt;/b&gt;`:&#x27;&#x27;);
  $$(&#x27;#ops button&#x27;).forEach(b=&gt;b.classList.toggle(&#x27;sel&#x27;,b.dataset.k===op));
  $$(&#x27;#vx .cell&#x27;).forEach(c=&gt;c.onclick=()=&gt;{if(busy)return;sel=c.dataset.x.split(&#x27;,&#x27;).map(Number);drawView();});
  $$(&#x27;#vr .cell&#x27;).forEach(c=&gt;c.onclick=()=&gt;{if(busy)return;sel=OPS[op].src(c.dataset.r.split(&#x27;,&#x27;).map(Number));drawView();});
  return target;
}
$(&#x27;#ops&#x27;).innerHTML=Object.entries(OPS).map(([k,o])=&gt;`&lt;button type=&quot;button&quot; data-k=&quot;${k}&quot;&gt;${o.n}&lt;/button&gt;`).join(&#x27;&#x27;);
$$(&#x27;#ops button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(busy)return;op=b.dataset.k;drawView();});
// ---- dtype ----
function dtype(fix){$(&#x27;#dA&#x27;).innerHTML=fix?&#x27;x.float()&lt;b style=&quot;color:var(--teal)&quot;&gt;float32&lt;/b&gt;4 B / 원소&#x27;:&#x27;np.random.rand(4, 784)&lt;b style=&quot;color:var(--red)&quot;&gt;float64&lt;/b&gt;8 B / 원소&#x27;;
  $(&#x27;#dArrow&#x27;).innerHTML=fix?&#x27;&lt;span style=&quot;color:var(--green)&quot;&gt;→ OK&lt;/span&gt;&#x27;:&#x27;&lt;span style=&quot;color:var(--red)&quot;&gt;→ ✗&lt;/span&gt;&#x27;;
  if(fix)setStatus(&#x27;ok&#x27;,&#x27;x = torch.from_numpy(a).float() → float32 · fc(x) 성공&#x27;);else setStatus(&#x27;warn&#x27;,&#x27;RuntimeError: expected Float but found Double — from_numpy 는 float64 를 그대로 가져옵니다&#x27;);}
$(&#x27;#bD1&#x27;).onclick=()=&gt;{if(!busy)dtype(false);};$(&#x27;#bD2&#x27;).onclick=()=&gt;{if(!busy)dtype(true);};
function stop(){}
const P=[
 {n:&#x27;① 공유 vs 복사 (2-2)&#x27;,ex:&#x27;&lt;p&gt;&lt;code&gt;b = torch.from_numpy(a)&lt;/code&gt; 는 a 의 메모리를 &lt;b class=&quot;amber&quot;&gt;그대로 가리키는&lt;/b&gt; Tensor 입니다 — 복사 비용 0, 대신 b 를 바꾸면 a 도 바뀝니다. &lt;code&gt;c = torch.tensor(a)&lt;/code&gt; 는 새 메모리에 &lt;b class=&quot;teal&quot;&gt;복사&lt;/b&gt;합니다.&lt;/p&gt;&lt;p&gt;b[0] = 7, c[1] = 9 후 → &lt;b class=&quot;blue&quot;&gt;a = [7, 0, 0]&lt;/b&gt;, &lt;b class=&quot;teal&quot;&gt;c = [0, 9, 0]&lt;/b&gt;. 같은 원리로 &lt;code&gt;t.numpy()&lt;/code&gt; 도 CPU Tensor 와 메모리를 공유합니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{await share();}},
 {n:&#x27;② permute(0, 2, 1)&#x27;,ex:&#x27;&lt;p&gt;&lt;code&gt;x.permute(0, 2, 1)&lt;/code&gt; → shape (2, 4, 3). 새 텐서의 [i, j, k] 는 원래 x 의 [i, k, j] 입니다. 그래서 &lt;b class=&quot;purple&quot;&gt;p[1, 3, 2] == x[1, 2, 3]&lt;/b&gt; (값 23).&lt;/p&gt;&lt;p&gt;메모리 한 줄(아래 24칸)은 그대로이고, 칸을 읽는 순서(stride)만 바뀝니다. OpenCV 이미지 (H, W, C) → PyTorch (C, H, W) 가 바로 &lt;code&gt;permute(2, 0, 1)&lt;/code&gt; 입니다 (D1-6).&lt;/p&gt;&#x27;,
  run:async()=&gt;{op=&#x27;perm&#x27;;for(const s of [[0,0,1],[0,2,0],[1,0,3],[1,2,3]]){sel=s;const t=drawView();setStatus(&#x27;info&#x27;,`x[${s.join(&#x27;, &#x27;)}] = ${xval(s)} → p[${t.join(&#x27;, &#x27;)}]`);await sleep(850);}
   const t=drawView();window.__d1.perm=t;setStatus(&#x27;ok&#x27;,`p[${t.join(&#x27;, &#x27;)}] == x[1, 2, 3] == 23 · p.shape = (2, 4, 3)`);}},
 {n:&#x27;③ reshape vs permute&#x27;,ex:&#x27;&lt;p&gt;둘 다 (2, 3, 4) 를 다른 모양으로 만들지만 &lt;b&gt;뜻이 다릅니다&lt;/b&gt;. &lt;code&gt;reshape(2, -1)&lt;/code&gt; 은 메모리 순서대로 다시 자를 뿐(원소 순서 0, 1, 2, …), &lt;code&gt;permute&lt;/code&gt; 는 축을 맞바꿔 원소가 놓이는 자리가 바뀝니다.&lt;/p&gt;&lt;p&gt;이미지를 (H, W, C) → (C, H, W) 로 바꿀 때 reshape 를 쓰면 shape 는 맞아도 &lt;b class=&quot;red&quot;&gt;픽셀이 뒤섞인 그림&lt;/b&gt;이 됩니다 — 오류가 나지 않아 찾기 어렵습니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{sel=[1,2,3];for(const o of [&#x27;view&#x27;,&#x27;perm&#x27;,&#x27;view&#x27;,&#x27;perm&#x27;]){op=o;drawView();setStatus(&#x27;info&#x27;,`x.${OPS[o].n} → (${OPS[o].sh.join(&#x27;, &#x27;)}) · 23 의 위치 비교`);await sleep(1000);}setStatus(&#x27;ok&#x27;,&#x27;reshape = 모양만 · permute = 축 순서&#x27;);}},
 {n:&#x27;④ unsqueeze(0) = 배치 축&#x27;,ex:&#x27;&lt;p&gt;모델은 언제나 &lt;b class=&quot;amber&quot;&gt;(N, C, H, W)&lt;/b&gt; 처럼 맨 앞에 배치 축을 기대합니다. 이미지 1장 (3, 224, 224) 에 &lt;code&gt;unsqueeze(0)&lt;/code&gt; → (1, 3, 224, 224).&lt;/p&gt;&lt;p&gt;반대로 결과에서 배치 축을 없앨 때는 &lt;code&gt;squeeze(0)&lt;/code&gt; 또는 &lt;code&gt;[0]&lt;/code&gt;.&lt;/p&gt;&#x27;,
  run:async()=&gt;{op=&#x27;unsq&#x27;;sel=[0,1,2];const t=drawView();setStatus(&#x27;info&#x27;,`x[0, 1, 2] → u[${t.join(&#x27;, &#x27;)}]`);await sleep(900);sel=[1,2,3];const t2=drawView();setStatus(&#x27;ok&#x27;,`unsqueeze(0) → (1, 2, 3, 4) · x[1, 2, 3] → u[${t2.join(&#x27;, &#x27;)}]`);}},
 {n:&#x27;⑤ float64 함정&#x27;,ex:&#x27;&lt;p&gt;NumPy 기본 실수형은 &lt;b class=&quot;red&quot;&gt;float64&lt;/b&gt;, PyTorch 기본은 &lt;b class=&quot;teal&quot;&gt;float32&lt;/b&gt;. &lt;code&gt;from_numpy&lt;/code&gt; 는 dtype 까지 그대로 가져오므로 float64 Tensor 를 nn.Linear 에 넣으면 &lt;code&gt;expected Float but found Double&lt;/code&gt; (환경에 따라 문구는 조금 다름).&lt;/p&gt;&lt;p&gt;해결: &lt;code&gt;torch.from_numpy(a).float()&lt;/code&gt;. float32 는 원소당 4 B — 메모리 · 속도 모두 유리합니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{dtype(false);await sleep(1300);dtype(true);}},
];
initPresets(P,stop);
applyStep(0);drawView();
$(&#x27;#presets button&#x27;).click();
&lt;/script&gt;

&lt;/style&gt;

&lt;body&gt;
&lt;div class=&quot;app&quot;&gt;
&lt;h1&gt;autograd 계산 그래프&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;&lt;code&gt;requires_grad=True&lt;/code&gt; 인 잎 텐서로 한 연산은 &lt;b style=&quot;color:var(--blue)&quot;&gt;계산 그래프&lt;/b&gt;로 기록됩니다. &lt;code&gt;f.backward()&lt;/code&gt; 는 그래프를 거꾸로 따라가며 각 노드의 &lt;b style=&quot;color:var(--purple)&quot;&gt;국소 미분&lt;/b&gt;을 곱하고(연쇄 법칙) 잎의 &lt;code&gt;.grad&lt;/code&gt; 에 &lt;b style=&quot;color:var(--red)&quot;&gt;더합니다(누적)&lt;/b&gt;. 슬라이더로 (x, y) 를 바꿔 보세요. 아래 등고선을 클릭하면 경사하강 출발점이 바뀝니다.&lt;/p&gt;
&lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill blue&quot;&gt;f = x² + 3y²&lt;/span&gt;&lt;span class=&quot;pill amber&quot;&gt;(1, 2) → f 13&lt;/span&gt;&lt;span class=&quot;pill red&quot;&gt;grad (2, 12)&lt;/span&gt;&lt;span class=&quot;pill purple&quot;&gt;backward 두 번 → 4 · zero_ → 2&lt;/span&gt;&lt;span class=&quot;pill teal&quot;&gt;(−4, 2) lr 0.1 · 100 step → (0, 0)&lt;/span&gt;&lt;span class=&quot;pill green&quot;&gt;zero_grad → backward → step&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;
  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;계산 그래프 — &lt;span style=&quot;color:var(--blue)&quot;&gt;파랑 = forward 값&lt;/span&gt; · &lt;span style=&quot;color:var(--purple)&quot;&gt;보라 = 국소 미분&lt;/span&gt; · &lt;span style=&quot;color:var(--red)&quot;&gt;빨강 = 흘러온 기울기&lt;/span&gt;&lt;/h2&gt;
    &lt;svg id=&quot;gsvg&quot; viewBox=&quot;0 0 560 300&quot; role=&quot;img&quot; aria-label=&quot;f = x² + 3y² 계산 그래프&quot;&gt;&lt;/svg&gt;
    &lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;sx&quot;&gt;x&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sx&quot; min=&quot;-3&quot; max=&quot;3&quot; step=&quot;0.5&quot; value=&quot;1&quot;&gt;&lt;output id=&quot;ox&quot;&gt;1&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;sy&quot;&gt;y&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sy&quot; min=&quot;-3&quot; max=&quot;3&quot; step=&quot;0.5&quot; value=&quot;2&quot;&gt;&lt;output id=&quot;oy&quot;&gt;2&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;row ctl&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;bFw&quot;&gt;forward&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;bBw&quot;&gt;backward ▶ 한 단계&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;run&quot; id=&quot;bAll&quot;&gt;▶ forward + backward&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;현재 값&lt;/h2&gt;&lt;div class=&quot;kv&quot; id=&quot;kv&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;Python&lt;/h2&gt;&lt;div class=&quot;code&quot; id=&quot;code&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;상태&lt;/h2&gt;&lt;div class=&quot;status info&quot; id=&quot;status&quot;&gt;프리셋을 누르세요.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;two&quot;&gt;
  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;문제 3-2 — .grad 는 누적된다 (x = 1, (x**2).backward())&lt;/h2&gt;
    &lt;div class=&quot;acc&quot; id=&quot;acc&quot;&gt;&lt;/div&gt;&lt;div class=&quot;accl&quot; id=&quot;accl&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;row ctl&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;bA1&quot;&gt;backward()&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;bA0&quot;&gt;x.grad.zero_()&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;bAr&quot;&gt;처음&lt;/button&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;문제 3-4 · 3-5 — 경사하강 (−4, 2), lr 0.1&lt;/h2&gt;
    &lt;canvas id=&quot;gd&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;steps&quot; id=&quot;steps&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;row ctl&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;run&quot; id=&quot;bGd&quot;&gt;▶ 100 step&lt;/button&gt;&lt;label class=&quot;chk&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;cZ&quot; checked&gt; zero_grad 호출&lt;/label&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;panel explain&quot; id=&quot;explain&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,ms));
let busy=false, timer=null;
function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}
function setCode(h){$(&#x27;#code&#x27;).innerHTML=h;}
function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const g=c.getContext(&#x27;2d&#x27;);g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}
function initPresets(P,stop){$(&#x27;#presets&#x27;).innerHTML=P.map(p=&gt;`&lt;button type=&quot;button&quot;&gt;${p.n}&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}
const esc=s=&gt;String(s).replace(/&amp;/g,&#x27;&amp;amp;&#x27;).replace(/&lt;/g,&#x27;&amp;lt;&#x27;).replace(/&gt;/g,&#x27;&amp;gt;&#x27;);
const fmt=n=&gt;n.toLocaleString(&#x27;en-US&#x27;);
// 공용 선 그래프: o={xr,yr,xt,yt,xf,yf,xl,yl,series:[{pts,c,w,dash,dot}],hl:[{y,c,t}],ml}
function chart(cv,o){
  const [g,W,H]=fitCanvas(cv);g.clearRect(0,0,W,H);
  const ml=o.ml??46,mr=o.mr??12,mt=o.mt??10,mb=o.xl?36:24;
  const X=v=&gt;ml+(v-o.xr[0])/(o.xr[1]-o.xr[0])*(W-ml-mr);
  const Y=v=&gt;mt+(1-(v-o.yr[0])/(o.yr[1]-o.yr[0]))*(H-mt-mb);
  g.font=&#x27;11px Consolas,monospace&#x27;;g.lineWidth=1;
  (o.yt||[]).forEach(v=&gt;{const y=Y(v);g.strokeStyle=&#x27;#1a2540&#x27;;g.beginPath();g.moveTo(ml,y);g.lineTo(W-mr,y);g.stroke();g.fillStyle=&#x27;#5d7292&#x27;;g.textAlign=&#x27;right&#x27;;g.fillText(o.yf?o.yf(v):v,ml-5,y+4);});
  (o.xt||[]).forEach(v=&gt;{const x=X(v);g.strokeStyle=&#x27;#1a2540&#x27;;g.beginPath();g.moveTo(x,mt);g.lineTo(x,H-mb);g.stroke();g.fillStyle=&#x27;#5d7292&#x27;;g.textAlign=&#x27;center&#x27;;g.fillText(o.xf?o.xf(v):v,x,H-mb+14);});
  g.textAlign=&#x27;left&#x27;;
  if(o.xl){g.fillStyle=&#x27;#8a9bb8&#x27;;g.textAlign=&#x27;right&#x27;;g.fillText(o.xl,W-mr,H-4);g.textAlign=&#x27;left&#x27;;}
  if(o.yl){g.fillStyle=&#x27;#8a9bb8&#x27;;g.fillText(o.yl,ml+4,mt+11);}
  (o.hl||[]).forEach(h=&gt;{g.strokeStyle=h.c;g.setLineDash([5,4]);g.beginPath();g.moveTo(ml,Y(h.y));g.lineTo(W-mr,Y(h.y));g.stroke();g.setLineDash([]);if(h.t){g.fillStyle=h.c;g.fillText(h.t,ml+6,Y(h.y)-4);}});
  (o.series||[]).forEach(s=&gt;{if(!s.pts.length)return;g.strokeStyle=s.c;g.fillStyle=s.c;g.lineWidth=s.w||2;g.setLineDash(s.dash||[]);
    g.beginPath();s.pts.forEach(([x,y],i)=&gt;{const px=X(x),py=Y(y);i?g.lineTo(px,py):g.moveTo(px,py);});g.stroke();
    g.setLineDash([]);if(s.dot)s.pts.forEach(([x,y])=&gt;{g.beginPath();g.arc(X(x),Y(y),s.dot,0,7);g.fill();});});
  g.lineWidth=1;
  return {g,W,H,X,Y,ml,mr,mt,mb};
}
function arrow(g,x0,y0,x1,y1,c,w=2,hs=8){const a=Math.atan2(y1-y0,x1-x0),L=Math.hypot(x1-x0,y1-y0);if(L&lt;1)return;hs=Math.min(hs,L*0.6);g.strokeStyle=c;g.fillStyle=c;g.lineWidth=w;g.beginPath();g.moveTo(x0,y0);g.lineTo(x1-Math.cos(a)*hs*0.7,y1-Math.sin(a)*hs*0.7);g.stroke();
  g.beginPath();g.moveTo(x1,y1);g.lineTo(x1-hs*Math.cos(a-0.4),y1-hs*Math.sin(a-0.4));g.lineTo(x1-hs*Math.cos(a+0.4),y1-hs*Math.sin(a+0.4));g.closePath();g.fill();g.lineWidth=1;}
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
window.__d1={};

let X=1,Y=2,phase=0; // 0 없음, 1 forward, 2.. backward 단계
// nodes: x, y, a=x², b=y², c=3b, f=a+c
const N={x:[60,80],y:[60,220],a:[230,80],b:[230,220],c:[380,220],f:[500,150]};
const E=[[&#x27;x&#x27;,&#x27;a&#x27;],[&#x27;y&#x27;,&#x27;b&#x27;],[&#x27;b&#x27;,&#x27;c&#x27;],[&#x27;a&#x27;,&#x27;f&#x27;],[&#x27;c&#x27;,&#x27;f&#x27;]];
function vals(){const a=X*X,b=Y*Y,c=3*b,f=a+c;return {x:X,y:Y,a,b,c,f};}
function grads(){return {f:1,a:1,c:1,b:3,x:2*X,y:6*Y};}
// backward 순서: f(1) → a,c (×1) → b (×3) → x (×2x), y (×2y)
const BW=[[&#x27;f&#x27;],[&#x27;a&#x27;,&#x27;c&#x27;],[&#x27;b&#x27;],[&#x27;x&#x27;,&#x27;y&#x27;]];
const LOC={a:&#x27;∂f/∂a = 1&#x27;,c:&#x27;∂f/∂c = 1&#x27;,b:&#x27;∂c/∂b = 3&#x27;,x:&#x27;∂a/∂x = 2x&#x27;,y:&#x27;∂b/∂y = 2y&#x27;};
const fn=v=&gt;Number.isInteger(v)?String(v):v.toFixed(2);
function gknown(){const s=new Set();for(let i=0;i&lt;phase-1&amp;&amp;i&lt;BW.length;i++)BW[i].forEach(n=&gt;s.add(n));return s;}
function drawG(){
  const v=vals(),g=grads(),K=gknown(),cur=phase&gt;=2?BW[phase-2]:[];
  const lab={x:&#x27;x&#x27;,y:&#x27;y&#x27;,a:&#x27;a = x²&#x27;,b:&#x27;b = y²&#x27;,c:&#x27;c = 3·b&#x27;,f:&#x27;f = a + c&#x27;};
  let h=&#x27;&#x27;;
  E.forEach(([s,t])=&gt;{const on=K.has(s)&amp;&amp;K.has(t);h+=`&lt;line x1=&quot;${N[s][0]+50}&quot; y1=&quot;${N[s][1]}&quot; x2=&quot;${N[t][0]-50}&quot; y2=&quot;${N[t][1]}&quot; class=&quot;${on?&#x27;on&#x27;:&#x27;&#x27;}&quot;/&gt;`;});
  Object.entries(N).forEach(([k,[cx,cy]])=&gt;{
    h+=`&lt;g class=&quot;nd ${k===&#x27;x&#x27;||k===&#x27;y&#x27;?&#x27;leaf&#x27;:&#x27;&#x27;} ${cur.includes(k)?&#x27;on&#x27;:&#x27;&#x27;}&quot;&gt;&lt;rect x=&quot;${cx-50}&quot; y=&quot;${cy-22}&quot; width=&quot;100&quot; height=&quot;44&quot; rx=&quot;9&quot;/&gt;&lt;text x=&quot;${cx}&quot; y=&quot;${cy+5}&quot; text-anchor=&quot;middle&quot; class=&quot;op&quot;&gt;${lab[k]}&lt;/text&gt;`;
    if(phase&gt;=1)h+=`&lt;text x=&quot;${cx}&quot; y=&quot;${cy-30}&quot; text-anchor=&quot;middle&quot; class=&quot;fv&quot;&gt;${k===&#x27;x&#x27;||k===&#x27;y&#x27;?k:k} = ${fn(v[k])}&lt;/text&gt;`;
    if(K.has(k))h+=`&lt;text x=&quot;${cx}&quot; y=&quot;${cy+40}&quot; text-anchor=&quot;middle&quot; class=&quot;gv&quot;&gt;∂f/∂${k} = ${fn(g[k])}&lt;/text&gt;`;
    if(K.has(k)&amp;&amp;LOC[k])h+=`&lt;text x=&quot;${cx}&quot; y=&quot;${cy+56}&quot; text-anchor=&quot;middle&quot; class=&quot;lv&quot;&gt;${LOC[k]}&lt;/text&gt;`;
    h+=&#x27;&lt;/g&gt;&#x27;;});
  $(&#x27;#gsvg&#x27;).innerHTML=h;
}
function info(){
  $(&#x27;#sx&#x27;).value=X;$(&#x27;#sy&#x27;).value=Y;$(&#x27;#ox&#x27;).textContent=X;$(&#x27;#oy&#x27;).textContent=Y;
  const v=vals(),g=grads(),done=phase&gt;=2+BW.length-1;
  $(&#x27;#kv&#x27;).innerHTML=`&lt;span&gt;(x, y)&lt;/span&gt;&lt;b&gt;(${fn(X)}, ${fn(Y)})&lt;/b&gt;&lt;span&gt;f = x² + 3y²&lt;/span&gt;&lt;b style=&quot;color:var(--blue)&quot;&gt;${phase&gt;=1?fn(v.f):&#x27;—&#x27;}&lt;/b&gt;&lt;span&gt;x.grad = 2x&lt;/span&gt;&lt;b style=&quot;color:var(--red)&quot;&gt;${done?fn(g.x):&#x27;None&#x27;}&lt;/b&gt;&lt;span&gt;y.grad = 6y&lt;/span&gt;&lt;b style=&quot;color:var(--red)&quot;&gt;${done?fn(g.y):&#x27;None&#x27;}&lt;/b&gt;&lt;span&gt;단계&lt;/span&gt;&lt;b&gt;${phase===0?&#x27;대기&#x27;:phase===1?&#x27;forward 완료&#x27;:done?&#x27;backward 완료&#x27;:&#x27;backward &#x27;+(phase-1)+&#x27; / 4&#x27;}&lt;/b&gt;`;
  setCode(`x = torch.tensor(${fn(X)}, requires_grad=True)
y = torch.tensor(${fn(Y)}, requires_grad=True)
&lt;span class=&quot;${phase&gt;=1?&#x27;g&#x27;:&#x27;c&#x27;}&quot;&gt;f = x**2 + 3 * y**2&lt;/span&gt;     &lt;span class=&quot;b&quot;&gt;# ${phase&gt;=1?fn(v.f):&#x27;?&#x27;}&lt;/span&gt;
&lt;span class=&quot;${phase&gt;=2?&#x27;a&#x27;:&#x27;c&#x27;}&quot;&gt;f.backward()&lt;/span&gt;
print(x.grad, y.grad)      &lt;span class=&quot;e&quot;&gt;# ${done?`tensor(${fn(g.x)}) tensor(${fn(g.y)})`:&#x27;None None&#x27;}&lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;# y 경로: 1 × 3 × 2y = 6y = ${fn(6*Y)}&lt;/span&gt;`);
  drawG();
}
async function fwbw(ms=700){phase=1;info();setStatus(&#x27;info&#x27;,`forward: f = ${fn(X)}² + 3·${fn(Y)}² = ${fn(vals().f)}`);await sleep(ms);
  for(let i=0;i&lt;BW.length;i++){phase=2+i;info();setStatus(&#x27;info&#x27;,[&#x27;backward 시작: ∂f/∂f = 1&#x27;,&#x27;덧셈 노드는 기울기를 그대로 나눠 줌 (×1)&#x27;,&#x27;c = 3b → ×3&#x27;,&#x27;잎에 도착: x 는 ×2x, y 는 ×2y → .grad 에 저장&#x27;][i]);await sleep(ms);}
  const g=grads();setStatus(&#x27;ok&#x27;,`f = ${fn(vals().f)} · x.grad = ${fn(g.x)} · y.grad = ${fn(g.y)}`);}
$(&#x27;#sx&#x27;).oninput=e=&gt;{if(busy)return;X=+e.target.value;phase=0;info();};
$(&#x27;#sy&#x27;).oninput=e=&gt;{if(busy)return;Y=+e.target.value;phase=0;info();};
$(&#x27;#bFw&#x27;).onclick=()=&gt;{if(busy)return;phase=1;info();setStatus(&#x27;info&#x27;,`forward: f = ${fn(vals().f)}`);};
$(&#x27;#bBw&#x27;).onclick=()=&gt;{if(busy)return;if(phase&lt;1)phase=1;else if(phase&lt;1+BW.length)phase++;info();};
$(&#x27;#bAll&#x27;).onclick=async()=&gt;{if(busy)return;busy=true;try{await fwbw(500);}finally{busy=false;}};
// ---- 누적 ----
let accH=[];
function drawAcc(){const mx=6;$(&#x27;#acc&#x27;).innerHTML=accH.map(a=&gt;`&lt;div class=&quot;bar&quot; style=&quot;height:${a.v/mx*100}%;background:${a.z?&#x27;#60a5fa&#x27;:a.v&gt;2?&#x27;#f87171&#x27;:&#x27;#4ade80&#x27;}&quot;&gt;&lt;span&gt;${a.v}&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
  $(&#x27;#accl&#x27;).innerHTML=accH.map(a=&gt;`&lt;span&gt;${a.l}&lt;/span&gt;`).join(&#x27;&#x27;);}
function accBw(){const last=accH.length?accH[accH.length-1].v:0;accH.push({v:last+2,l:&#x27;backward&#x27;});if(accH.length&gt;6)accH.shift();drawAcc();setStatus(last+2&gt;2?&#x27;warn&#x27;:&#x27;info&#x27;,`x.grad = ${last} + 2 = ${last+2}${last+2&gt;2?&#x27; (누적!)&#x27;:&#x27;&#x27;}`);}
function accZ(){accH.push({v:0,l:&#x27;zero_()&#x27;,z:1});if(accH.length&gt;6)accH.shift();drawAcc();setStatus(&#x27;info&#x27;,&#x27;x.grad.zero_() → 0&#x27;);}
$(&#x27;#bA1&#x27;).onclick=()=&gt;{if(!busy)accBw();};$(&#x27;#bA0&#x27;).onclick=()=&gt;{if(!busy)accZ();};$(&#x27;#bAr&#x27;).onclick=()=&gt;{if(!busy){accH=[];drawAcc();}};
// ---- 경사하강 ----
let gs=[-4,2],path=[],gk=0,zeroOn=true,stepI=-1;
const SN=[&#x27;opt.zero_grad()&#x27;,&#x27;f = loss(q)&#x27;,&#x27;f.backward()&#x27;,&#x27;opt.step()&#x27;];
function gdCompute(){path=[gs.slice()];let x=gs[0],y=gs[1],gx=0,gy=0;for(let i=0;i&lt;100;i++){if(zeroOn){gx=0;gy=0;}gx+=2*x;gy+=6*y;x-=0.1*gx;y-=0.1*gy;path.push([x,y]);if(!isFinite(x)||Math.abs(x)&gt;1e6)break;}}
const GX=[-5,5],GY=[-3,3];
function drawGd(){
  const [g,W,H]=fitCanvas($(&#x27;#gd&#x27;));g.clearRect(0,0,W,H);if(W&lt;20)return;
  const Xp=x=&gt;(x-GX[0])/(GX[1]-GX[0])*W,Yp=y=&gt;(1-(y-GY[0])/(GY[1]-GY[0]))*H;
  g.strokeStyle=&#x27;#2c3f66&#x27;;[1,4,9,16,25].forEach(c=&gt;{g.beginPath();for(let a=0;a&lt;=64;a++){const t=a/64*2*Math.PI,x=Math.sqrt(c)*Math.cos(t),y=Math.sqrt(c/3)*Math.sin(t);a?g.lineTo(Xp(x),Yp(y)):g.moveTo(Xp(x),Yp(y));}g.stroke();});
  g.fillStyle=&#x27;#4ade80&#x27;;g.beginPath();g.arc(Xp(0),Yp(0),4,0,7);g.fill();
  g.strokeStyle=zeroOn?&#x27;#f5b942&#x27;:&#x27;#f87171&#x27;;g.fillStyle=g.strokeStyle;g.lineWidth=2;g.beginPath();
  const cl=(v,a,b)=&gt;Math.min(b,Math.max(a,v));
  for(let i=0;i&lt;=gk&amp;&amp;i&lt;path.length;i++){const px=cl(Xp(path[i][0]),2,W-2),py=cl(Yp(path[i][1]),2,H-2);i?g.lineTo(px,py):g.moveTo(px,py);}g.stroke();g.lineWidth=1;
  for(let i=0;i&lt;=gk&amp;&amp;i&lt;path.length;i++){g.beginPath();g.arc(cl(Xp(path[i][0]),2,W-2),cl(Yp(path[i][1]),2,H-2),i===gk?5:2,0,7);g.fill();}
  const p=path[Math.min(gk,path.length-1)];g.font=&#x27;11px Consolas,monospace&#x27;;g.fillStyle=&#x27;#dbe4f0&#x27;;g.fillText(`step ${gk}: (${fe(p[0])}, ${fe(p[1])})`,6,14);
  $(&#x27;#steps&#x27;).innerHTML=SN.map((s,i)=&gt;`&lt;span class=&quot;stp ${i===stepI?&#x27;on&#x27;:&#x27;&#x27;} ${i===0&amp;&amp;!zeroOn?&#x27;skip&#x27;:&#x27;&#x27;}&quot;&gt;${i+1}. ${s}&lt;/span&gt;`).join(&#x27;&#x27;);
}
const fe=v=&gt;{if(!isFinite(v))return v&gt;0?&#x27;inf&#x27;:&#x27;-inf&#x27;;const a=Math.abs(v);return a!==0&amp;&amp;(a&gt;=1e4||a&lt;1e-3)?v.toExponential(1):v.toFixed(3);};
const fxy=(x,y)=&gt;x*x+3*y*y;
async function gdPlay(){gdCompute();gk=0;drawGd();
  for(let i=1;i&lt;=3;i++){for(let s=0;s&lt;4;s++){stepI=s;drawGd();setStatus(&#x27;info&#x27;,`step ${i}: ${SN[s]}${s===0&amp;&amp;!zeroOn?&#x27; — 건너뜀!&#x27;:&#x27;&#x27;}`);await sleep(380);}gk=i;drawGd();}
  stepI=-1;const n=path.length-1;while(gk&lt;n){gk=Math.min(n,gk+3);drawGd();await sleep(30);}
  const p=path[n];return p;}
$(&#x27;#bGd&#x27;).onclick=async()=&gt;{if(busy)return;busy=true;try{const p=await gdPlay();gdMsg(p);}finally{busy=false;}};
function gdMsg(p){const f=fxy(p[0],p[1]);if(zeroOn)setStatus(&#x27;ok&#x27;,`${path.length-1} step 후 (${fe(p[0])}, ${fe(p[1])}) · f = ${f.toExponential(1)} — (0, 0) 근처`);else setStatus(&#x27;warn&#x27;,`zero_grad 없이: 기울기가 계속 누적 → ${path.length-1} step 후 (${fe(p[0])}, ${fe(p[1])}) · 수렴하지 않음`);}
$(&#x27;#cZ&#x27;).onchange=e=&gt;{if(busy)return;zeroOn=e.target.checked;gdCompute();gk=0;drawGd();};
$(&#x27;#gd&#x27;).addEventListener(&#x27;click&#x27;,e=&gt;{if(busy)return;const r=e.target.getBoundingClientRect();gs=[Math.round((GX[0]+(e.clientX-r.left)/r.width*(GX[1]-GX[0]))*10)/10,Math.round((GY[0]+(1-(e.clientY-r.top)/r.height)*(GY[1]-GY[0]))*10)/10];gdCompute();gk=0;drawGd();setStatus(&#x27;info&#x27;,`출발점 (${gs[0]}, ${gs[1]}) — ▶ 100 step`);});
window.addEventListener(&#x27;resize&#x27;,drawGd);
function stop(){}
const P=[
 {n:&#x27;① (1, 2) forward · backward (3-1)&#x27;,ex:&#x27;&lt;p&gt;forward: a = x² = 1, b = y² = 4, c = 3b = 12, &lt;b class=&quot;blue&quot;&gt;f = a + c = 13&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;backward 는 f 에서 1 을 출발시켜 거꾸로: 덧셈은 ×1, c = 3b 는 &lt;b class=&quot;purple&quot;&gt;×3&lt;/b&gt;, 제곱은 &lt;b class=&quot;purple&quot;&gt;×2x · ×2y&lt;/b&gt;. 그래서 ∂f/∂x = 1·2·1 = &lt;b class=&quot;red&quot;&gt;2&lt;/b&gt;, ∂f/∂y = 1·3·2·2 = &lt;b class=&quot;red&quot;&gt;12&lt;/b&gt;. 결과는 잎 텐서의 &lt;code&gt;.grad&lt;/code&gt; 에 저장됩니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{X=1;Y=2;phase=0;info();await sleep(300);await fwbw();window.__d1.g12={f:vals().f,gx:grads().x,gy:grads().y};}},
 {n:&#x27;② 다른 (x, y) 에서&#x27;,ex:&#x27;&lt;p&gt;국소 미분 &lt;b class=&quot;purple&quot;&gt;2x · 2y&lt;/b&gt; 는 forward 때 기억해 둔 x, y 값으로 계산됩니다 — 그래서 autograd 는 forward 중간값을 저장해 둡니다(메모리 사용). ∂f/∂x = 2x, ∂f/∂y = 6y 가 점마다 달라지는 것을 확인하세요.&lt;/p&gt;&#x27;,
  run:async()=&gt;{for(const [a,b] of [[-2,1],[3,-0.5],[0,0]]){X=a;Y=b;phase=0;info();await fwbw(300);await sleep(500);}X=1;Y=2;phase=0;info();await fwbw(250);}},
 {n:&#x27;③ .grad 누적 (3-2)&#x27;,ex:&#x27;&lt;p&gt;x = 1 에서 &lt;code&gt;(x**2).backward()&lt;/code&gt; 를 두 번 하면 x.grad 는 2 → &lt;b class=&quot;red&quot;&gt;4&lt;/b&gt;. backward 는 .grad 를 &lt;b&gt;덮어쓰지 않고 더합니다&lt;/b&gt;. 여러 손실의 기울기를 합칠 때 쓰는 기능이지만, 학습 루프에서는 매 step 전에 비워야 합니다.&lt;/p&gt;&lt;p&gt;&lt;code&gt;x.grad.zero_()&lt;/code&gt; 후 다시 backward → &lt;b class=&quot;green&quot;&gt;2&lt;/b&gt;.&lt;/p&gt;&#x27;,
  run:async()=&gt;{accH=[];drawAcc();await sleep(300);accBw();await sleep(800);accBw();await sleep(900);accZ();await sleep(800);accBw();window.__d1.acc=accH.map(a=&gt;a.v);setStatus(&#x27;ok&#x27;,&#x27;2 → 4 (누적) → zero_() → 0 → 2&#x27;);}},
 {n:&#x27;④ 경사하강 (3-4 · 3-5)&#x27;,ex:&#x27;&lt;p&gt;출발 (−4, 2), lr 0.1, 100 step. 한 step 의 순서는 &lt;b class=&quot;amber&quot;&gt;zero_grad → (forward) → backward → step&lt;/b&gt;. 수동 버전은 &lt;code&gt;with torch.no_grad(): p -= lr * p.grad&lt;/code&gt; 후 &lt;code&gt;p.grad.zero_()&lt;/code&gt; — no_grad 없이 제자리 갱신하면 &quot;a leaf Variable that requires grad is being used in an in-place operation&quot; 오류.&lt;/p&gt;&lt;p&gt;x 는 매 step 0.8 배, y 는 0.4 배 → (0, 0) 근처 (f ≈ 1e-18). &lt;code&gt;torch.optim.SGD([q], lr=0.1)&lt;/code&gt; 도 같은 결과입니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{zeroOn=true;$(&#x27;#cZ&#x27;).checked=true;gs=[-4,2];const p=await gdPlay();window.__d1.gd={x:p[0],y:p[1],f:fxy(p[0],p[1])};gdMsg(p);}},
 {n:&#x27;⑤ zero_grad 를 빼먹으면&#x27;,ex:&#x27;&lt;p&gt;zero_grad 없이 backward 만 반복하면 .grad 에 지난 기울기가 &lt;b class=&quot;red&quot;&gt;계속 쌓입니다&lt;/b&gt;. step 크기가 실제 기울기가 아니라 &quot;지금까지 기울기의 합&quot; 이 되어 경로가 최솟값을 계속 지나치며 &lt;b class=&quot;red&quot;&gt;끝없이 출렁이고&lt;/b&gt; 수렴하지 않습니다 (100 step 이 지나도 (0, 0) 에 못 감). 기울기가 쌓이는 정도에 따라 발산하기도 합니다.&lt;/p&gt;&lt;p&gt;학습 루프의 대표 실수 1번 — D1-5 에서 다시 봅니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{zeroOn=false;$(&#x27;#cZ&#x27;).checked=false;gs=[-4,2];const p=await gdPlay();gdMsg(p);window.__d1.nozero={x:p[0],y:p[1]};}},
];
initPresets(P,stop);
info();drawAcc();gdCompute();drawGd();
$(&#x27;#presets button&#x27;).click();
&lt;/script&gt;

&lt;div class=&quot;app&quot;&gt;
&lt;h1&gt;Dataset · DataLoader&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;&lt;code&gt;Dataset&lt;/code&gt; 은 &lt;code&gt;__len__&lt;/code&gt; 과 &lt;code&gt;__getitem__(i)&lt;/code&gt; 두 가지만 약속합니다. &lt;code&gt;DataLoader&lt;/code&gt; 는 인덱스 0 ~ 59,999 를 &lt;b style=&quot;color:var(--amber)&quot;&gt;섞고(shuffle)&lt;/b&gt;, &lt;b style=&quot;color:var(--teal)&quot;&gt;batch_size 개씩 잘라&lt;/b&gt; &lt;code&gt;__getitem__&lt;/code&gt; 결과를 쌓아 &lt;code&gt;(B, 1, 28, 28)&lt;/code&gt; 텐서로 만들어 줍니다 — mynn 의 &lt;code&gt;rng.permutation&lt;/code&gt; + 슬라이싱과 같은 일. 아래 띠 하나의 가로줄 = 인덱스 60,000 개 (색 = 원래 번호).&lt;/p&gt;
&lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill teal&quot;&gt;train 60,000 · test 10,000&lt;/span&gt;&lt;span class=&quot;pill amber&quot;&gt;batch 100 → len 600&lt;/span&gt;&lt;span class=&quot;pill blue&quot;&gt;xb (100, 1, 28, 28) float32 · yb (100,) int64&lt;/span&gt;&lt;span class=&quot;pill purple&quot;&gt;ceil(60000 / b) · drop_last → 60000 // b&lt;/span&gt;&lt;span class=&quot;pill red&quot;&gt;학습 전 CE 2.3010 ≈ ln 10 = 2.3026&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;
  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;인덱스 60,000 개 → 배치 (한 줄 = 배치 하나, 위에서부터 iteration 순서)&lt;/h2&gt;
    &lt;canvas id=&quot;strip&quot;&gt;&lt;/canvas&gt;
    &lt;canvas id=&quot;zoom&quot;&gt;&lt;/canvas&gt;

  run:async()=&gt;{bi=4;shuf=false;drop=false;curB=-1;info();await sleep(300);await iterate(6,380);window.__d1.len100=nIter();setStatus(&#x27;ok&#x27;,`len(train_loader) = ${nIter()} · xb (100, 1, 28, 28)`);}},
 {n:&#x27;② shuffle=True&#x27;,ex:&#x27;&lt;p&gt;shuffle=False 면 배치마다 인덱스가 0~99, 100~199 … 순서대로(색이 매끈한 그라데이션). shuffle=True 면 매 epoch 시작에 &lt;b class=&quot;amber&quot;&gt;새 순열&lt;/b&gt;을 만들어 자릅니다 — 배치마다 색이 뒤섞입니다.&lt;/p&gt;&lt;p&gt;MNIST 처럼 레이블 순서로 정렬된 데이터도 있기 때문에 학습용은 섞고, 평가용 test_loader 는 batch 1000, &lt;b&gt;shuffle=False&lt;/b&gt;.&lt;/p&gt;&#x27;,
  run:async()=&gt;{bi=4;drop=false;shuf=false;curB=0;info();setStatus(&#x27;info&#x27;,&#x27;shuffle=False: 0, 1, 2, … 순서&#x27;);await sleep(1100);for(let e=1;e&lt;=3;e++){shuf=true;doShuffle();curB=0;info();setStatus(&#x27;info&#x27;,`epoch ${e}: 새 순열 — 첫 배치 인덱스 ${[0,1,2].map(k=&gt;perm[k]).join(&#x27;, &#x27;)}, …`);await sleep(1000);}setStatus(&#x27;ok&#x27;,&#x27;shuffle=True: epoch 마다 다른 순서&#x27;);}},
 {n:&#x27;③ 나누어떨어지지 않으면&#x27;,ex:&#x27;&lt;p&gt;60,000 이 batch 로 나누어떨어지지 않으면 마지막 배치가 덜 찹니다. 기본(drop_last=False) 은 &lt;b class=&quot;amber&quot;&gt;len = ceil(60000 / b)&lt;/b&gt;, drop_last=True 면 나머지를 버려 &lt;b class=&quot;purple&quot;&gt;len = 60000 // b&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;예: b = 128 → 60000 / 128 = 468.75 → 469 개 (마지막 96장) 또는 468 개.&lt;/p&gt;&#x27;,
  run:async()=&gt;{shuf=false;for(const [i,d] of [[5,false],[5,true],[6,false],[6,true],[7,false]]){bi=i;drop=d;curB=-1;info();const n=nIter();setStatus(&#x27;info&#x27;,`b = ${B()}, drop_last=${d?&#x27;True&#x27;:&#x27;False&#x27;} → len ${fmt(n)}${NTR%B()&amp;&amp;!d?` (마지막 배치 ${lastSize()}장)`:&#x27;&#x27;}`);await sleep(1100);}
   bi=5;drop=false;info();window.__d1.b128=[Math.ceil(NTR/128),Math.floor(NTR/128),NTR-468*128];setStatus(&#x27;ok&#x27;,&#x27;ceil(60000/128) = 469 · 60000 // 128 = 468 · 마지막 96장&#x27;);}},
 {n:&#x27;④ 학습 전 손실 ≈ ln 10 (4-4)&#x27;,ex:&#x27;&lt;p&gt;&lt;code&gt;nn.CrossEntropyLoss&lt;/code&gt; 는 &lt;b class=&quot;amber&quot;&gt;logits&lt;/b&gt; 를 받아 내부에서 log_softmax 를 하고 정답 칸만 뽑아 평균: &lt;code&gt;-F.log_softmax(logits, dim=1)[torch.arange(N), yb].mean()&lt;/code&gt;.&lt;/p&gt;&lt;p&gt;학습 전 logits 가 모두 0 근처면 확률은 모두 0.1 → 손실 = −log 0.1 = &lt;b class=&quot;red&quot;&gt;ln 10 = 2.3026&lt;/b&gt;. 노트북에서 실제로 잰 학습 전 손실 &lt;b&gt;2.3010&lt;/b&gt; 이 이 값에 가깝다면 &quot;모델 · 손실 연결이 정상&quot; 이라는 신호입니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{lab=5;zc=0;let l=drawCE();setStatus(&#x27;info&#x27;,`logits 모두 0 → loss ${l.toFixed(4)} = ln 10`);await sleep(1200);window.__d1.ln10=+l.toFixed(4);
   for(const v of [1,2,4,6]){zc=v;l=drawCE();setStatus(&#x27;ok&#x27;,`정답 logit ${v} → p ${ceCalc().p[lab].toFixed(3)} · loss ${l.toFixed(4)}`);await sleep(700);}
   zc=-3;l=drawCE();setStatus(&#x27;warn&#x27;,`정답 logit −3 → loss ${l.toFixed(4)} (틀리게 확신할수록 손실이 큼)`);await sleep(900);zc=0;drawCE();setStatus(&#x27;ok&#x27;,&#x27;학습 전 측정 2.3010 ≈ ln 10 = 2.3026&#x27;);}},
 {n:&#x27;⑤ softmax 를 또 붙이면&#x27;,ex:&#x27;&lt;p&gt;CrossEntropyLoss 안에 이미 softmax 가 있습니다. 모델 끝에 softmax 를 또 붙이면 손실에 들어가는 값이 0~1 확률이 되어 logits 의 차이가 아무리 커도 &lt;b class=&quot;red&quot;&gt;손실이 크게 줄지 않고&lt;/b&gt; 기울기도 약해집니다. 모델은 &lt;b class=&quot;amber&quot;&gt;logits 를 그대로&lt;/b&gt; 반환하고, 확률이 필요할 때만 &lt;code&gt;softmax(logits, dim=1)&lt;/code&gt;.&lt;/p&gt;&#x27;,
  run:async()=&gt;{lab=5;for(const v of [0,4,8]){zc=v;const l=drawCE();const p=ceCalc().p;const z2=p.map((q,i)=&gt;q);const m=Math.max(...z2);const s=z2.reduce((a,q)=&gt;a+Math.exp(q-m),0);const l2=-(z2[lab]-m-Math.log(s));
   setStatus(v?&#x27;warn&#x27;:&#x27;info&#x27;,`정답 logit ${v}: 올바른 loss ${l.toFixed(4)} · softmax 두 번 → ${l2.toFixed(4)}`);await sleep(1300);}
   window.__d1.dbl=true;setStatus(&#x27;warn&#x27;,`softmax 를 두 번 하면 정답 확률이 1 이어도 손실 하한 = log(e + 9) − 1 = ${(Math.log(Math.E+9)-1).toFixed(4)} — 0 으로 못 내려감`);}},
];
initPresets(P,stop);
info();drawCE();
$(&#x27;#presets button&#x27;).click();
&lt;/script&gt;

&lt;body&gt;
&lt;div class=&quot;app&quot;&gt;
&lt;h1&gt;학습 루프 한 바퀴&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;PyTorch 학습 한 step 은 언제나 같은 &lt;b style=&quot;color:var(--amber)&quot;&gt;6단계&lt;/b&gt;입니다: ① 배치를 device 로 ② &lt;code&gt;logits = model(xb)&lt;/code&gt; ③ &lt;code&gt;loss = loss_fn(logits, yb)&lt;/code&gt; ④ &lt;code&gt;opt.zero_grad()&lt;/code&gt; ⑤ &lt;code&gt;loss.backward()&lt;/code&gt; ⑥ &lt;code&gt;opt.step()&lt;/code&gt;. 아래 막대는 한 파라미터의 &lt;code&gt;.grad&lt;/code&gt; 크기입니다 (값은 설명용 예시) — zero_grad 를 끄면 step 마다 쌓이는 것을 볼 수 있습니다. 숫자는 노트북 문제 5-3 실행 예 (CPU).&lt;/p&gt;
&lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill amber&quot;&gt;zero_grad → backward → step&lt;/span&gt;&lt;span class=&quot;pill teal&quot;&gt;학습 전 acc 0.0953&lt;/span&gt;&lt;span class=&quot;pill blue&quot;&gt;MLP · Adam 1e-3 · 3 epoch → 약 0.9624&lt;/span&gt;&lt;span class=&quot;pill purple&quot;&gt;eval() ≠ no_grad()&lt;/span&gt;&lt;span class=&quot;pill green&quot;&gt;mlp.pt 320,309 bytes ≈ 79,510 × 4 B&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;
  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;한 step 의 6단계 (train_one_epoch 안의 for 루프)&lt;/h2&gt;
    &lt;svg id=&quot;cyc&quot; viewBox=&quot;0 0 560 330&quot; role=&quot;img&quot; aria-label=&quot;학습 루프 6단계&quot;&gt;&lt;/svg&gt;
    &lt;canvas id=&quot;gbar&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:#4ade80&quot;&gt;&lt;/i&gt;이번 배치의 진짜 기울기 (예시 값)&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#f87171&quot;&gt;&lt;/i&gt;.grad 에 들어 있는 값&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;row ctl&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;bStep&quot;&gt;1단계 ▶&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;run&quot; id=&quot;bPlay&quot;&gt;▶ 3 step 재생&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;bReset&quot;&gt;처음&lt;/button&gt;&lt;label class=&quot;chk&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;cZ&quot; checked&gt; ④ zero_grad 호출&lt;/label&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;현재 값&lt;/h2&gt;&lt;div class=&quot;kv&quot; id=&quot;kv&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;Python (노트북 5-1)&lt;/h2&gt;&lt;div class=&quot;code&quot; id=&quot;code&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;상태&lt;/h2&gt;&lt;div class=&quot;status info&quot; id=&quot;status&quot;&gt;프리셋을 누르세요.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;two&quot;&gt;
  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;문제 5-3 — MLP 784-100-10, Adam 1e-3, 3 epoch (실행 예, CPU)&lt;/h2&gt;
    &lt;canvas id=&quot;hist&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:#f87171&quot;&gt;&lt;/i&gt;train loss&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#2dd4bf&quot;&gt;&lt;/i&gt;test acc&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#8a9bb8&quot;&gt;&lt;/i&gt;NN Day 3 SGD 10 epoch 0.9694&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;scroll&quot;&gt;&lt;table class=&quot;tt&quot; id=&quot;ht&quot; style=&quot;margin-top:8px&quot;&gt;&lt;/table&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;문제 5-4 — torch.save(model.state_dict(), &quot;mlp.pt&quot;)&lt;/h2&gt;
    &lt;div class=&quot;sd&quot; id=&quot;sd&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;kv&quot; id=&quot;kv3&quot; style=&quot;margin-top:10px&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;model.train() · model.eval() · torch.no_grad() — 서로 다른 일&lt;/h2&gt;
  &lt;div class=&quot;cards&quot; id=&quot;cards&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;panel explain&quot; id=&quot;explain&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,ms));
let busy=false, timer=null;
function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}
function setCode(h){$(&#x27;#code&#x27;).innerHTML=h;}
function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const g=c.getContext(&#x27;2d&#x27;);g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}

 {n:&#x27;④ train · eval · no_grad&#x27;,ex:&#x27;&lt;p&gt;&lt;code&gt;model.eval()&lt;/code&gt; 과 &lt;code&gt;torch.no_grad()&lt;/code&gt; 는 &lt;b class=&quot;red&quot;&gt;다른 일&lt;/b&gt;입니다. eval() 은 Dropout · BatchNorm 같은 계층의 &lt;b&gt;동작&lt;/b&gt;을, no_grad() 는 autograd 의 &lt;b&gt;기록&lt;/b&gt;을 바꿉니다. 평가 함수(5-2)는 둘 다 쓰고 &lt;code&gt;argmax(dim=1)&lt;/code&gt; 로 예측합니다.&lt;/p&gt;&lt;p&gt;평가 뒤 다음 epoch 에서 &lt;code&gt;model.train()&lt;/code&gt; 을 다시 부르는 것도 잊지 마세요.&lt;/p&gt;&#x27;,
  run:async()=&gt;{for(let i=0;i&lt;3;i++){ck=i;drawCards();setStatus(&#x27;info&#x27;,CARDS[i][0]);await sleep(1000);}ck=-1;drawCards();setStatus(&#x27;ok&#x27;,&#x27;evaluate = model.eval() + with torch.no_grad() + argmax(dim=1)&#x27;);}},
 {n:&#x27;⑤ state_dict 저장 (5-4)&#x27;,ex:&#x27;&lt;p&gt;&lt;code&gt;model.state_dict()&lt;/code&gt; 는 &lt;b class=&quot;amber&quot;&gt;이름 → 텐서&lt;/b&gt; 사전입니다. 구조(코드)는 저장하지 않으므로 불러올 때는 같은 클래스로 새 모델을 만들고 &lt;code&gt;load_state_dict(torch.load(&quot;mlp.pt&quot;, map_location=device))&lt;/code&gt;.&lt;/p&gt;&lt;p&gt;79,510 개 × 4 B = 318,040 B + 이름 · 메타데이터 → 파일 &lt;b class=&quot;green&quot;&gt;320,309 bytes&lt;/b&gt;. 불러온 모델의 정확도는 그대로 0.9624.&lt;/p&gt;&#x27;,
  run:async()=&gt;{for(let i=0;i&lt;4;i++){sdk=i;drawSD();setStatus(&#x27;info&#x27;,`${SD[i][0]} (${SD[i][1].join(&#x27;, &#x27;)})`);await sleep(650);}sdk=-1;drawSD();window.__d1.np=NP;setStatus(&#x27;ok&#x27;,`${fmt(NP)} × 4 B = ${fmt(NP*4)} B → mlp.pt 320,309 bytes`);}},
];
initPresets(P,stop);
info();drawHist();drawSD();drawCards();
$(&#x27;#presets button&#x27;).click();
&lt;/script&gt;

&lt;div class=&quot;app&quot;&gt;
&lt;h1&gt;이미지 → 텐서&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;&lt;code&gt;cv2.imread&lt;/code&gt; 는 &lt;b style=&quot;color:var(--amber)&quot;&gt;(H, W, C) uint8 0~255, BGR 순서&lt;/b&gt;로 읽고, PyTorch 모델은 &lt;b style=&quot;color:var(--teal)&quot;&gt;(N, C, H, W) float32 0~1, RGB&lt;/b&gt; 를 기대합니다. 아래는 종이 위 파란 잉크를 흉내 낸 8×6 픽셀 합성 이미지 (세로 사진처럼 H 8 · W 6) — 단계 버튼으로 변환을 따라가고, 픽셀을 누르면 그 픽셀의 값이 단계마다 어떻게 바뀌는지 봅니다.&lt;/p&gt;
&lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill amber&quot;&gt;imread → (640, 480, 3) uint8 BGR&lt;/span&gt;&lt;span class=&quot;pill blue&quot;&gt;img[:, :, ::-1] = BGR→RGB&lt;/span&gt;&lt;span class=&quot;pill teal&quot;&gt;permute(2, 0, 1).float() / 255&lt;/span&gt;&lt;span class=&quot;pill purple&quot;&gt;mean [0.485, 0.456, 0.406] · std [0.229, 0.224, 0.225]&lt;/span&gt;&lt;span class=&quot;pill red&quot;&gt;uint8 200+100 → 44 · cv2.add → 255&lt;/span&gt;&lt;span class=&quot;pill green&quot;&gt;cv2.resize(img, (W, H))&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;
  &lt;div class=&quot;panel&quot;&gt;&lt;h2 id=&quot;stTitle&quot;&gt;단계&lt;/h2&gt;
    &lt;div class=&quot;stg&quot; id=&quot;stg&quot;&gt;&lt;/div&gt;
    &lt;canvas id=&quot;img&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;note&quot; id=&quot;stNote&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;선택한 픽셀&lt;/h2&gt;&lt;div class=&quot;kv&quot; id=&quot;kv&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;Python (노트북 6-1 · 6-3 · 6-5)&lt;/h2&gt;&lt;div class=&quot;code&quot; id=&quot;code&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;상태&lt;/h2&gt;&lt;div class=&quot;status info&quot; id=&quot;status&quot;&gt;프리셋을 누르세요.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;

    &lt;canvas id=&quot;gray&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;kv&quot; id=&quot;kvg&quot; style=&quot;margin-top:8px&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;uint8 overflow — 255 를 넘으면?&lt;/h2&gt;
    &lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;sa&quot;&gt;값&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sa&quot; min=&quot;0&quot; max=&quot;255&quot; step=&quot;1&quot; value=&quot;200&quot;&gt;&lt;output id=&quot;oa&quot;&gt;200&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;sb&quot;&gt;+ 더할 값&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sb&quot; min=&quot;0&quot; max=&quot;255&quot; step=&quot;1&quot; value=&quot;100&quot;&gt;&lt;output id=&quot;ob&quot;&gt;100&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;calc&quot; id=&quot;calc&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;note&quot;&gt;uint8 은 0~255 만 담을 수 있어 NumPy 덧셈은 &lt;b&gt;256 으로 나눈 나머지&lt;/b&gt;로 감기고(wrap-around), &lt;code&gt;cv2.add&lt;/code&gt; 는 255 에서 &lt;b&gt;멈춥니다&lt;/b&gt;(saturation). 밝기 조절 등 계산은 float32 로 바꾼 뒤에.&lt;/div&gt;

&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;문제 6-4 — cv2.resize 의 크기 인자는 (W, H)&lt;/h2&gt;
  &lt;canvas id=&quot;rs&quot;&gt;&lt;/canvas&gt;
  &lt;div class=&quot;row ctl&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;bR1&quot;&gt;cv2.resize(img, (480, 640))  ← (W, H)&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;bR2&quot;&gt;cv2.resize(img, (640, 480))  ← (H, W) 로 착각&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;bR3&quot;&gt;crop 480×480 → (224, 224)&lt;/button&gt;&lt;/div&gt;

&lt;script&gt;
const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,ms));
let busy=false, timer=null;
function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}
function setCode(h){$(&#x27;#code&#x27;).innerHTML=h;}
function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const g=c.getContext(&#x27;2d&#x27;);g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}
function initPresets(P,stop){$(&#x27;#presets&#x27;).innerHTML=P.map(p=&gt;`&lt;button type=&quot;button&quot;&gt;${p.n}&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}
const esc=s=&gt;String(s).replace(/&amp;/g,&#x27;&amp;amp;&#x27;).replace(/&lt;/g,&#x27;&amp;lt;&#x27;).replace(/&gt;/g,&#x27;&amp;gt;&#x27;);
const fmt=n=&gt;n.toLocaleString(&#x27;en-US&#x27;);
// 공용 선 그래프: o={xr,yr,xt,yt,xf,yf,xl,yl,series:[{pts,c,w,dash,dot}],hl:[{y,c,t}],ml}
function chart(cv,o){
  const [g,W,H]=fitCanvas(cv);g.clearRect(0,0,W,H);
  const ml=o.ml??46,mr=o.mr??12,mt=o.mt??10,mb=o.xl?36:24;
  const X=v=&gt;ml+(v-o.xr[0])/(o.xr[1]-o.xr[0])*(W-ml-mr);
  const Y=v=&gt;mt+(1-(v-o.yr[0])/(o.yr[1]-o.yr[0]))*(H-mt-mb);
  g.font=&#x27;11px Consolas,monospace&#x27;;g.lineWidth=1;
  (o.yt||[]).forEach(v=&gt;{const y=Y(v);g.strokeStyle=&#x27;#1a2540&#x27;;g.beginPath();g.moveTo(ml,y);g.lineTo(W-mr,y);g.stroke();g.fillStyle=&#x27;#5d7292&#x27;;g.textAlign=&#x27;right&#x27;;g.fillText(o.yf?o.yf(v):v,ml-5,y+4);});
  (o.xt||[]).forEach(v=&gt;{const x=X(v);g.strokeStyle=&#x27;#1a2540&#x27;;g.beginPath();g.moveTo(x,mt);g.lineTo(x,H-mb);g.stroke();g.fillStyle=&#x27;#5d7292&#x27;;g.textAlign=&#x27;center&#x27;;g.fillText(o.xf?o.xf(v):v,x,H-mb+14);});
  g.textAlign=&#x27;left&#x27;;
  if(o.xl){g.fillStyle=&#x27;#8a9bb8&#x27;;g.textAlign=&#x27;right&#x27;;g.fillText(o.xl,W-mr,H-4);g.textAlign=&#x27;left&#x27;;}
  if(o.yl){g.fillStyle=&#x27;#8a9bb8&#x27;;g.fillText(o.yl,ml+4,mt+11);}
  (o.hl||[]).forEach(h=&gt;{g.strokeStyle=h.c;g.setLineDash([5,4]);g.beginPath();g.moveTo(ml,Y(h.y));g.lineTo(W-mr,Y(h.y));g.stroke();g.setLineDash([]);if(h.t){g.fillStyle=h.c;g.fillText(h.t,ml+6,Y(h.y)-4);}});
  (o.series||[]).forEach(s=&gt;{if(!s.pts.length)return;g.strokeStyle=s.c;g.fillStyle=s.c;g.lineWidth=s.w||2;g.setLineDash(s.dash||[]);
    g.beginPath();s.pts.forEach(([x,y],i)=&gt;{const px=X(x),py=Y(y);i?g.lineTo(px,py):g.moveTo(px,py);});g.stroke();
    g.setLineDash([]);if(s.dot)s.pts.forEach(([x,y])=&gt;{g.beginPath();g.arc(X(x),Y(y),s.dot,0,7);g.fill();});});
  g.lineWidth=1;

  run:async()=&gt;{sel=[1,2];for(const i of [0,1,2,1,2]){si=i;info();setStatus(i===1?&#x27;warn&#x27;:&#x27;ok&#x27;,ST[i].n+(i===1?&#x27; — 잉크가 갈색&#x27;:&#x27; — 올바른 색&#x27;));await sleep(1000);}}},
 {n:&#x27;③ 흑백 변환 (6-2)&#x27;,ex:&#x27;&lt;p&gt;Gray = &lt;b class=&quot;amber&quot;&gt;0.299R + 0.587G + 0.114B&lt;/b&gt; — 사람 눈이 초록에 가장 민감한 것을 반영한 가중치. BGR 배열에서는 &lt;code&gt;img[:, :, 2]&lt;/code&gt; 가 R 입니다(순서 주의).&lt;/p&gt;&lt;p&gt;uint8 그대로 곱하면 넘치거나 잘리므로 &lt;b&gt;float32 로 바꾼 뒤&lt;/b&gt; 계산하세요. 노트북에서 cv2.cvtColor 결과와의 최대 차이는 0.43 (반올림 차이).&lt;/p&gt;&#x27;,
  run:async()=&gt;{for(const s of [[0,0],[1,2],[4,3],[7,5]]){sel=s;si=0;info();const v=gray(...s);setStatus(&#x27;info&#x27;,`(${s.join(&#x27;, &#x27;)}): Gray = ${v.toFixed(3)} → ${Math.round(v)}`);await sleep(900);}window.__d1.gray=+gray(7,5).toFixed(3);setStatus(&#x27;ok&#x27;,&#x27;잉크는 어둡고(작은 값) 종이는 밝음(큰 값) — 다음 단계(D1-8)에서 이것을 뒤집습니다&#x27;);}},
 {n:&#x27;④ uint8 overflow&#x27;,ex:&#x27;&lt;p&gt;uint8 배열 &lt;code&gt;[[200, 250]] + 100&lt;/code&gt; → &lt;b class=&quot;red&quot;&gt;[[44, 94]]&lt;/b&gt; (300 − 256 = 44, 350 − 256 = 94). float 로 바꿔 더하면 [300, 350], &lt;code&gt;cv2.add&lt;/code&gt; 는 &lt;b class=&quot;amber&quot;&gt;[[255, 255]]&lt;/b&gt; (saturation).&lt;/p&gt;&lt;p&gt;오류가 나지 않고 &quot;밝게 했는데 어두워진&quot; 그림이 나오는 함정입니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{A=200;Bv=100;let r=calc();setStatus(&#x27;warn&#x27;,`uint8 200 + 100 → ${r[0]} · float ${r[1]} · cv2.add ${r[2]}`);await sleep(1300);A=250;r=calc();window.__d1.ov=[(200+100)%256,(250+100)%256];setStatus(&#x27;warn&#x27;,`uint8 250 + 100 → ${r[0]} · float ${r[1]} · cv2.add ${r[2]}`);await sleep(1300);A=150;r=calc();setStatus(&#x27;ok&#x27;,`150 + 100 = ${r[0]} — 255 이하면 셋 다 같음`);await sleep(900);A=200;calc();setStatus(&#x27;ok&#x27;,&#x27;[[200, 250]] + 100 → uint8 [[44, 94]] · float [300, 350] · cv2.add [[255, 255]]&#x27;);}},
 {n:&#x27;⑤ resize (W, H) 함정 (6-4)&#x27;,ex:&#x27;&lt;p&gt;NumPy shape 는 &lt;b&gt;(H, W)&lt;/b&gt; 인데 &lt;code&gt;cv2.resize(img, dsize)&lt;/code&gt; 의 dsize 는 &lt;b class=&quot;red&quot;&gt;(W, H)&lt;/b&gt; 입니다. (H, W) 로 넣으면 오류 없이 가로세로가 바뀐 그림이 됩니다.&lt;/p&gt;&lt;p&gt;6-4: 가운데 정사각형 480×480 을 잘라 &lt;code&gt;cv2.resize(crop, (224, 224), interpolation=cv2.INTER_AREA)&lt;/code&gt; → 정사각형이면 순서 걱정이 없습니다. 이 (W, H) 규칙은 D1-7 의 VideoWriter 에서도 다시 나옵니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{rs(0);await sleep(1100);rs(1);await sleep(1300);rs(2);window.__d1.rs=true;}},
];
initPresets(P,stop);
info();calc();drawRs();
$(&#x27;#presets button&#x27;).click();
&lt;/script&gt;

&lt;p class=&quot;sub&quot;&gt;영상 파일은 같은 크기 이미지(프레임)를 일정한 간격(FPS)으로 늘어놓은 것입니다. 테스트 영상 &lt;code&gt;digits.mp4&lt;/code&gt; 는 MNIST test 0~5번 숫자 &lt;b style=&quot;color:var(--amber)&quot;&gt;[7, 2, 1, 0, 4, 1]&lt;/b&gt; 을 160px 칸마다 놓은 띠(120×1280) 위를 &lt;b&gt;120×320 창&lt;/b&gt;이 1초에 160px 씩 지나가며 찍은 것 — frame i 의 창 시작 = &lt;code&gt;int(i·160/30)&lt;/code&gt;. 아래 띠의 숫자는 캔버스 글꼴로 흉내 낸 것입니다.&lt;/p&gt;

const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];

function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const g=c.getContext(&#x27;2d&#x27;);g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}

// 공용 선 그래프: o={xr,yr,xt,yt,xf,yf,xl,yl,series:[{pts,c,w,dash,dot}],hl:[{y,c,t}],ml}
function chart(cv,o){
  const [g,W,H]=fitCanvas(cv);g.clearRect(0,0,W,H);
  const ml=o.ml??46,mr=o.mr??12,mt=o.mt??10,mb=o.xl?36:24;
  const X=v=&gt;ml+(v-o.xr[0])/(o.xr[1]-o.xr[0])*(W-ml-mr);
  const Y=v=&gt;mt+(1-(v-o.yr[0])/(o.yr[1]-o.yr[0]))*(H-mt-mb);
  g.font=&#x27;11px Consolas,monospace&#x27;;g.lineWidth=1;
  (o.yt||[]).forEach(v=&gt;{const y=Y(v);g.strokeStyle=&#x27;#1a2540&#x27;;g.beginPath();g.moveTo(ml,y);g.lineTo(W-mr,y);g.stroke();g.fillStyle=&#x27;#5d7292&#x27;;g.textAlign=&#x27;right&#x27;;g.fillText(o.yf?o.yf(v):v,ml-5,y+4);});
  (o.xt||[]).forEach(v=&gt;{const x=X(v);g.strokeStyle=&#x27;#1a2540&#x27;;g.beginPath();g.moveTo(x,mt);g.lineTo(x,H-mb);g.stroke();g.fillStyle=&#x27;#5d7292&#x27;;g.textAlign=&#x27;center&#x27;;g.fillText(o.xf?o.xf(v):v,x,H-mb+14);});
  g.textAlign=&#x27;left&#x27;;
  if(o.xl){g.fillStyle=&#x27;#8a9bb8&#x27;;g.textAlign=&#x27;right&#x27;;g.fillText(o.xl,W-mr,H-4);g.textAlign=&#x27;left&#x27;;}
  if(o.yl){g.fillStyle=&#x27;#8a9bb8&#x27;;g.fillText(o.yl,ml+4,mt+11);}

    g.beginPath();s.pts.forEach(([x,y],i)=&gt;{const px=X(x),py=Y(y);i?g.lineTo(px,py):g.moveTo(px,py);});g.stroke();
    g.setLineDash([]);if(s.dot)s.pts.forEach(([x,y])=&gt;{g.beginPath();g.arc(X(x),Y(y),s.dot,0,7);g.fill();});});

function arrow(g,x0,y0,x1,y1,c,w=2,hs=8){const a=Math.atan2(y1-y0,x1-x0),L=Math.hypot(x1-x0,y1-y0);if(L&lt;1)return;hs=Math.min(hs,L*0.6);g.strokeStyle=c;g.fillStyle=c;g.lineWidth=w;g.beginPath();g.moveTo(x0,y0);g.lineTo(x1-Math.cos(a)*hs*0.7,y1-Math.sin(a)*hs*0.7);g.stroke();

window.__d1={};

const DIG=[7,2,1,0,4,1], SW=1280, SH=120, VW=320, VH=120, FPS=30, NF=180, SPEED=160;
const start=i=&gt;Math.floor(i*SPEED/FPS);
const CEN=DIG.map((_,k)=&gt;30*k+15);
// 띠를 오프스크린에 그림 (흰 글씨 · 검은 배경, 96×96 칸 안에)
const strip=document.createElement(&#x27;canvas&#x27;);strip.width=SW;strip.height=SH;
(function(){const g=strip.getContext(&#x27;2d&#x27;);g.fillStyle=&#x27;#000&#x27;;g.fillRect(0,0,SW,SH);g.fillStyle=&#x27;#fff&#x27;;g.textAlign=&#x27;center&#x27;;g.textBaseline=&#x27;middle&#x27;;
  g.font=&#x27;bold 92px &quot;Segoe Print&quot;,&quot;Comic Sans MS&quot;,&quot;Noto Sans KR&quot;,sans-serif&#x27;;
  DIG.forEach((d,k)=&gt;{const cx=160*(k+1)+80;g.save();g.translate(cx,SH/2+4);g.rotate((k%2?-1:1)*0.06);g.fillText(String(d),0,0);g.restore();});})();
let fi=15, wBad=false;
function curDigit(i){const c=start(i)+160;const k=Math.round((c-240)/160);const off=c-(240+160*k);return {k,off};}
function draw(){
  const s=start(fi);
  {const [g,W,H]=fitCanvas($(&#x27;#strip&#x27;));g.clearRect(0,0,W,H);if(W&gt;20){const sc=W/SW;g.drawImage(strip,0,0,SW,SH,0,0,W,SH*sc);
    g.fillStyle=&#x27;#8a9bb8&#x27;;g.font=&#x27;10px Consolas,monospace&#x27;;for(let c=0;c&lt;=8;c++){g.fillRect(Math.min(W-1,c*160*sc),SH*sc,1,5);if(c&lt;8&amp;&amp;c%2===0)g.fillText(c*160,c*160*sc+2,SH*sc+15);}
    g.strokeStyle=&#x27;#f5b942&#x27;;g.lineWidth=2;g.strokeRect(s*sc+1,1,VW*sc-2,SH*sc-2);g.strokeStyle=&#x27;#2dd4bf&#x27;;g.strokeRect((s+100)*sc,3,120*sc,SH*sc-6);g.lineWidth=1;}}
  {const [g,W,H]=fitCanvas($(&#x27;#frame&#x27;));g.clearRect(0,0,W,H);if(W&gt;20){const sc=W/VW;g.imageSmoothingEnabled=true;g.drawImage(strip,s,0,VW,VH,0,0,W,VH*sc);
    g.strokeStyle=&#x27;#2dd4bf&#x27;;g.lineWidth=2;g.strokeRect(100*sc,1,120*sc,VH*sc-2);g.lineWidth=1;
    g.fillStyle=&#x27;#2dd4bf&#x27;;g.font=&#x27;13px Consolas,monospace&#x27;;g.fillText(`frame ${fi}`,6,16);g.fillStyle=&#x27;#8a9bb8&#x27;;g.font=&#x27;11px Consolas,monospace&#x27;;g.fillText(&#x27;box (100, 0)-(219, 119)&#x27;,100*sc+4,VH*sc-6);
    g.fillText(`frame ${fi}: x ${s} ~ ${s+VW-1} of strip`,4,VH*sc+16);}}
  {const c=$(&#x27;#crop&#x27;);c.width=120;c.height=120;const g=c.getContext(&#x27;2d&#x27;);g.drawImage(strip,s+100,0,120,120,0,0,120,120);}
  {const c=$(&#x27;#c28&#x27;);const t=document.createElement(&#x27;canvas&#x27;);t.width=28;t.height=28;const tg=t.getContext(&#x27;2d&#x27;);tg.imageSmoothingQuality=&#x27;high&#x27;;tg.drawImage(strip,s+100,0,120,120,0,0,28,28);

}
let codeLine=-1;
const CODE=[&#x27;cap = cv2.VideoCapture(&quot;digits.mp4&quot;)&#x27;,&#x27;int(cap.get(cv2.CAP_PROP_FRAME_COUNT))  # 180&#x27;,&#x27;cap.get(cv2.CAP_PROP_FPS)               # 30.0&#x27;,&#x27;while True:&#x27;,&#x27;    ok, frame = cap.read()      # (120, 320, 3) BGR&#x27;,&#x27;    if not ok:&#x27;,&#x27;        break                   # 180 장 다 읽음&#x27;,&#x27;    x = frame_to_input(frame)   # (1, 1, 28, 28)&#x27;,&#x27;    cv2.rectangle(frame, (100, 0), (219, 119), …)&#x27;,&#x27;    out.write(frame)&#x27;,&#x27;cap.release(); out.release()&#x27;];
function info(){
  $(&#x27;#sf&#x27;).value=fi;$(&#x27;#of&#x27;).textContent=fi;
  const s=start(fi),{k,off}=curDigit(fi),isC=CEN.includes(fi);
  $(&#x27;#kv&#x27;).innerHTML=`&lt;span&gt;frame i&lt;/span&gt;&lt;b style=&quot;color:var(--amber)&quot;&gt;${fi} / ${NF-1}&lt;/b&gt;&lt;span&gt;시각&lt;/span&gt;&lt;b&gt;${(fi/FPS).toFixed(3)} s&lt;/b&gt;&lt;span&gt;창 시작&lt;/span&gt;&lt;b&gt;int(${fi}·160/30) = ${s}&lt;/b&gt;&lt;span&gt;창 범위&lt;/span&gt;&lt;b&gt;x ${s} ~ ${s+VW-1}&lt;/b&gt;&lt;span&gt;가운데에 가까운 숫자&lt;/span&gt;&lt;b style=&quot;color:${isC?&#x27;var(--green)&#x27;:&#x27;var(--text)&#x27;}&quot;&gt;${k&gt;=0&amp;&amp;k&lt;6?`k = ${k} → 숫자 ${DIG[k]} (중심에서 ${off&gt;0?&#x27;+&#x27;:&#x27;&#x27;}${off}px)`:&#x27;없음&#x27;}&lt;/b&gt;&lt;span&gt;가운데 프레임?&lt;/span&gt;&lt;b style=&quot;color:${isC?&#x27;var(--green)&#x27;:&#x27;var(--dim)&#x27;}&quot;&gt;${isC?&#x27;예 — 30·&#x27;+CEN.indexOf(fi)+&#x27; + 15&#x27;:&#x27;아니오 (15, 45, 75, 105, 135, 165)&#x27;}&lt;/b&gt;`;

}
function vw(){wBad=!!wBad;
  $(&#x27;#vw&#x27;).innerHTML=`&lt;div class=&quot;vbx ${wBad?&#x27;bad&#x27;:&#x27;ok&#x27;}&quot;&gt;VideoWriter(&quot;digits.mp4&quot;, fourcc(&quot;mp4v&quot;), 30, &lt;span style=&quot;color:${wBad?&#x27;var(--red)&#x27;:&#x27;var(--green)&#x27;}&quot;&gt;${wBad?&#x27;(120, 320)&#x27;:&#x27;(320, 120)&#x27;}&lt;/span&gt;)&lt;b style=&quot;color:${wBad?&#x27;var(--red)&#x27;:&#x27;var(--green)&#x27;}&quot;&gt;${wBad?&#x27;write 180번 — 오류 없음 …&#x27;:&#x27;write 180번 → 180 프레임&#x27;}&lt;/b&gt;${wBad?&#x27;frame.shape (120, 320, 3) = 크기 320×120 ≠ 지정한 120×320 → 프레임을 조용히 버림&#x27;:&#x27;frame.shape (H, W) = (120, 320) ↔ frameSize (W, H) = (320, 120) 일치&#x27;}&lt;/div&gt;
  &lt;div class=&quot;vbx ${wBad?&#x27;bad&#x27;:&#x27;ok&#x27;}&quot;&gt;결과 파일&lt;b style=&quot;color:${wBad?&#x27;var(--red)&#x27;:&#x27;var(--green)&#x27;}&quot;&gt;${wBad?&#x27;빈 영상 (프레임 0개, 아주 작은 파일)&#x27;:&#x27;digits.mp4 약 43 KB · 180 프레임 · 6.0 s&#x27;}&lt;/b&gt;${wBad?&#x27;CAP_PROP_FRAME_COUNT 로 확인해야 알아챔&#x27;:&#x27;release() 를 해야 파일이 마무리됨&#x27;}&lt;/div&gt;`;}
function setW(b){wBad=b;vw();setStatus(b?&#x27;warn&#x27;:&#x27;ok&#x27;,b?&#x27;(H, W) 로 넣으면 오류 없이 빈 영상 — 크기 인자는 (W, H)&#x27;:&#x27;frameSize = (W_V, H_V) = (320, 120) → 정상 기록&#x27;);}
$(&#x27;#bW1&#x27;).onclick=()=&gt;{if(!busy)setW(false);};$(&#x27;#bW2&#x27;).onclick=()=&gt;{if(!busy)setW(true);};
let playing=false;
async function playRange(a,b,ms=1000/FPS){playing=true;for(fi=a;fi&lt;=b&amp;&amp;playing;fi++){codeLine=4;info();await sleep(ms);}fi=Math.min(fi,b);playing=false;}
$(&#x27;#sf&#x27;).oninput=e=&gt;{if(busy)return;playing=false;fi=+e.target.value;info();};
$(&#x27;#bPrev&#x27;).onclick=()=&gt;{if(busy)return;if(fi&gt;0)fi--;info();};
$(&#x27;#bNext&#x27;).onclick=()=&gt;{if(busy)return;if(fi&lt;NF-1)fi++;info();};
$(&#x27;#bStop&#x27;).onclick=()=&gt;{playing=false;};
$(&#x27;#bCen&#x27;).onclick=()=&gt;{if(busy)return;fi=CEN.find(c=&gt;c&gt;fi)??CEN[0];info();setStatus(&#x27;ok&#x27;,`frame ${fi} → 가운데 숫자 ${DIG[CEN.indexOf(fi)]}`);};
$(&#x27;#bPlay&#x27;).onclick=async()=&gt;{if(busy)return;busy=true;try{await playRange(fi&gt;=NF-1?0:fi,NF-1);setStatus(&#x27;info&#x27;,`frame ${fi} 에서 멈춤`);}finally{busy=false;}};

const P=[
 {n:&#x27;① 6초 재생&#x27;,ex:&#x27;&lt;p&gt;180 프레임을 30 FPS 로 → &lt;b class=&quot;amber&quot;&gt;6.0 초&lt;/b&gt;. 창은 1초에 160px = 한 칸씩 움직이고, frame i 의 창 시작은 &lt;code&gt;int(i·160/30)&lt;/code&gt; (frame 179 → 954, 954 + 320 = 1274 ≤ 1280).&lt;/p&gt;&lt;p&gt;오른쪽 아래 두 상자는 각 프레임에서 모델이 볼 가운데 120×120 crop 과 28×28 축소본입니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{codeLine=-1;await playRange(0,NF-1);window.__d1.last=[fi,start(fi)];setStatus(&#x27;ok&#x27;,`180 프레임 · 마지막 frame 179 창 시작 ${start(179)}`);}},
 {n:&#x27;② 가운데 프레임 6개&#x27;,ex:&#x27;&lt;p&gt;k 번째 숫자의 중심은 띠의 x = 240 + 160k. 창 가운데(시작 + 160)가 거기 오려면 start = 80 + 160k → i·160/30 = 80 + 160k → &lt;b class=&quot;green&quot;&gt;i = 30k + 15&lt;/b&gt; = 15, 45, 75, 105, 135, 165.&lt;/p&gt;&lt;p&gt;과제 5 에서 이 6 프레임의 예측이 [7, 2, 1, 0, 4, 1] 과 같으면 정확도 1.0.&lt;/p&gt;&#x27;,
  run:async()=&gt;{const got=[];for(const c of CEN){fi=c;codeLine=7;info();const {k,off}=curDigit(c);got.push(DIG[k]);setStatus(&#x27;ok&#x27;,`frame ${c}: 창 시작 ${start(c)} · 가운데 숫자 ${DIG[k]} (중심 오차 ${off}px)`);await sleep(850);}window.__d1.centers=got;setStatus(&#x27;ok&#x27;,`가운데 프레임 ${CEN.join(&#x27;, &#x27;)} → [${got.join(&#x27;, &#x27;)}]`);}},
 {n:&#x27;③ read 루프 (7-4)&#x27;,ex:&#x27;&lt;p&gt;&lt;code&gt;cap.read()&lt;/code&gt; 는 &lt;b class=&quot;amber&quot;&gt;(ok, frame)&lt;/b&gt; 을 돌려줍니다. 마지막 프레임 다음에는 ok = False, frame = None — &lt;b class=&quot;red&quot;&gt;ok 확인을 안 하면&lt;/b&gt; None 을 cv2 함수에 넣어 오류가 납니다.&lt;/p&gt;&lt;p&gt;속성은 &lt;code&gt;cap.get(cv2.CAP_PROP_FRAME_COUNT)&lt;/code&gt; 180, &lt;code&gt;CAP_PROP_FPS&lt;/code&gt; 30, &lt;code&gt;CAP_PROP_FRAME_WIDTH&lt;/code&gt; 320, &lt;code&gt;CAP_PROP_FRAME_HEIGHT&lt;/code&gt; 120 — 모두 float 이므로 int() 로.&lt;/p&gt;&#x27;,

   fi=NF-1;for(const l of [4,5,6,10]){codeLine=l;info();setStatus(l===6?&#x27;warn&#x27;:&#x27;info&#x27;,l===4?&#x27;ok, frame = cap.read() → (False, None)&#x27;:CODE[l].trim());await sleep(700);}codeLine=-1;info();setStatus(&#x27;ok&#x27;,&#x27;180 프레임 처리 · 프레임당 평균 약 0.7 ms (실행 예)&#x27;);}},
 {n:&#x27;④ 두 숫자 사이 프레임&#x27;,ex:&#x27;&lt;p&gt;frame 30 처럼 두 숫자 &lt;b&gt;사이&lt;/b&gt;에서는 crop 에 숫자의 반쪽 둘이 걸칩니다. 모델은 그래도 10개 중 하나를 고르므로 확신도가 낮고 예측이 흔들립니다.&lt;/p&gt;&lt;p&gt;대책 (D1-8): 확신도 기준(0.9) 이하는 표시 안 함 · 여러 프레임 다수결(시간 평활화) · 위치까지 찾는 탐지 모델(Day 4).&lt;/p&gt;&#x27;,

&lt;div class=&quot;app&quot;&gt;
&lt;h1&gt;종이 손글씨 전처리&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;MNIST 로 학습한 CNN(test 약 0.98) 에 휴대폰으로 찍은 종이 손글씨를 그대로 넣으면 30장 중 3장만 맞습니다. MNIST 의 세 가지 성질 — &lt;b style=&quot;color:var(--amber)&quot;&gt;① 검은 배경에 흰 글씨 ② 숫자가 20×20 상자 안에 비율 유지 ③ 무게중심이 28×28 가운데 (14, 14)&lt;/b&gt; — 를 사진에도 만들어 주는 것이 &lt;code&gt;preprocess(img_bgr)&lt;/code&gt; 입니다. 아래 사진은 브라우저에서 합성한 작은 예(96×128) 이고 각 단계는 같은 알고리즘을 JS 로 직접 계산한 결과입니다. 정확도 숫자는 노트북 실행 결과(30장)입니다.&lt;/p&gt;
&lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill red&quot;&gt;naive 0.100 — 27장을 &#x27;8&#x27; 로&lt;/span&gt;&lt;span class=&quot;pill amber&quot;&gt;조명 보정 없이 0.600&lt;/span&gt;&lt;span class=&quot;pill green&quot;&gt;전체 전처리 0.967 (29/30)&lt;/span&gt;&lt;span class=&quot;pill blue&quot;&gt;영상 가운데 6 프레임 → [7, 2, 1, 0, 4, 1] · 1.0&lt;/span&gt;&lt;span class=&quot;pill purple&quot;&gt;domain shift&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;

const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];

  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}
const esc=s=&gt;String(s).replace(/&amp;/g,&#x27;&amp;amp;&#x27;).replace(/&lt;/g,&#x27;&amp;lt;&#x27;).replace(/&gt;/g,&#x27;&amp;gt;&#x27;);
const fmt=n=&gt;n.toLocaleString(&#x27;en-US&#x27;);
// 공용 선 그래프: o={xr,yr,xt,yt,xf,yf,xl,yl,series:[{pts,c,w,dash,dot}],hl:[{y,c,t}],ml}
function chart(cv,o){

  const ml=o.ml??46,mr=o.mr??12,mt=o.mt??10,mb=o.xl?36:24;
  const X=v=&gt;ml+(v-o.xr[0])/(o.xr[1]-o.xr[0])*(W-ml-mr);
  const Y=v=&gt;mt+(1-(v-o.yr[0])/(o.yr[1]-o.yr[0]))*(H-mt-mb);
  g.font=&#x27;11px Consolas,monospace&#x27;;g.lineWidth=1;
  (o.yt||[]).forEach(v=&gt;{const y=Y(v);g.strokeStyle=&#x27;#1a2540&#x27;;g.beginPath();g.moveTo(ml,y);g.lineTo(W-mr,y);g.stroke();g.fillStyle=&#x27;#5d7292&#x27;;g.textAlign=&#x27;right&#x27;;g.fillText(o.yf?o.yf(v):v,ml-5,y+4);});
  (o.xt||[]).forEach(v=&gt;{const x=X(v);g.strokeStyle=&#x27;#1a2540&#x27;;g.beginPath();g.moveTo(x,mt);g.lineTo(x,H-mb);g.stroke();g.fillStyle=&#x27;#5d7292&#x27;;g.textAlign=&#x27;center&#x27;;g.fillText(o.xf?o.xf(v):v,x,H-mb+14);});
  g.textAlign=&#x27;left&#x27;;
  if(o.xl){g.fillStyle=&#x27;#8a9bb8&#x27;;g.textAlign=&#x27;right&#x27;;g.fillText(o.xl,W-mr,H-4);g.textAlign=&#x27;left&#x27;;}
  if(o.yl){g.fillStyle=&#x27;#8a9bb8&#x27;;g.fillText(o.yl,ml+4,mt+11);}

function arrow(g,x0,y0,x1,y1,c,w=2,hs=8){const a=Math.atan2(y1-y0,x1-x0),L=Math.hypot(x1-x0,y1-y0);if(L&lt;1)return;hs=Math.min(hs,L*0.6);g.strokeStyle=c;g.fillStyle=c;g.lineWidth=w;g.beginPath();g.moveTo(x0,y0);g.lineTo(x1-Math.cos(a)*hs*0.7,y1-Math.sin(a)*hs*0.7);g.stroke();

// ---- 종이 손글씨 합성 + 전처리 (OpenCV 단계를 JS 로 단순 재현) ----
const IW=96, IH=128;              // 480×640 사진을 1/5 로 (W 96 · H 128)

const GLYPH={
 7:g=&gt;{g.moveTo(-1,-1.05);g.lineTo(1,-1.05);g.lineTo(-0.15,1.3);},
 2:g=&gt;{g.moveTo(-0.9,-0.55);g.quadraticCurveTo(-0.1,-1.6,0.8,-0.7);g.quadraticCurveTo(1.15,0.05,-0.95,1.2);g.lineTo(1.05,1.2);},
 4:g=&gt;{g.moveTo(0.45,1.35);g.lineTo(0.45,-1.2);g.lineTo(-1,0.55);g.lineTo(1.1,0.55);},
};
// 잉크 마스크 0~1 (오프스크린 캔버스 알파)
function inkMask(d){const c=(typeof OffscreenCanvas!==&#x27;undefined&#x27;)?new OffscreenCanvas(IW,IH):Object.assign(document.createElement(&#x27;canvas&#x27;),{width:IW,height:IH});
  const g=c.getContext(&#x27;2d&#x27;);g.clearRect(0,0,IW,IH);g.save();g.translate(64,38);g.rotate(0.08);g.scale(13,13);g.lineWidth=0.42;g.lineCap=&#x27;round&#x27;;g.lineJoin=&#x27;round&#x27;;g.strokeStyle=&#x27;#000&#x27;;g.beginPath();GLYPH[d](g);g.stroke();g.restore();

   setStatus(&#x27;warn&#x27;,`가장 큰 덩어리 ${b.w}×${b.h} — 그림자 덩어리를 숫자로 자름`);await sleep(1200);si=6;info();setStatus(&#x27;warn&#x27;,&#x27;⑥ 결과가 숫자 모양이 아님 → 오답&#x27;);}},
 {n:&#x27;③ naive 는 왜 8 인가&#x27;,ex:&#x27;&lt;p&gt;naive = 흑백 → 28×28 → ÷255. MNIST 는 대부분이 0(검정)인데, 종이 사진은 &lt;b class=&quot;red&quot;&gt;흰 배경이 거의 전부 밝은 픽셀&lt;/b&gt; — 모델이 본 적 없는 입력입니다. 이런 &quot;온통 밝은&quot; 입력에서 모델은 획이 가장 많은 숫자인 8 쪽으로 쏠립니다.&lt;/p&gt;&lt;p&gt;노트북: 30장 중 &lt;b class=&quot;red&quot;&gt;27장을 \&#x27;8\&#x27;&lt;/b&gt; 로, 정확도 0.100. d7_0 의 확률은 8 이 0.574, 7 은 0.004.&lt;/p&gt;&#x27;,
  run:async()=&gt;{digit=7;illum=true;shadow=true;si=7;info();rk=1;drawRes();const n=chips(&#x27;naive&#x27;);setStatus(&#x27;warn&#x27;,`naive: ${n}/30 정답 · &#x27;8&#x27; 예측 ${PRED.naive.filter(v=&gt;v===8).length}장`);await sleep(1200);si=6;info();setStatus(&#x27;ok&#x27;,&#x27;같은 사진을 전처리하면 MNIST 처럼 보임&#x27;);}},
 {n:&#x27;④ 30장 결과 비교&#x27;,ex:&#x27;&lt;p&gt;naive &lt;b class=&quot;red&quot;&gt;0.100&lt;/b&gt; → 조명 보정 없이 &lt;b class=&quot;amber&quot;&gt;0.600&lt;/b&gt; → 전체 전처리 &lt;b class=&quot;green&quot;&gt;0.967&lt;/b&gt;. 틀린 1장은 &lt;b&gt;d7_2.jpg → 2&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;모델은 그대로이고 &lt;b&gt;입력만&lt;/b&gt; 바꿨습니다. 실제 서비스에서 &quot;학습 정확도 98% 인데 현장에서 안 된다&quot; 의 대부분은 이런 입력 차이입니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{for(const [k,i] of [[&#x27;naive&#x27;,1],[&#x27;noillum&#x27;,2],[&#x27;full&#x27;,3]]){rk=i;drawRes();const n=chips(k);setStatus(i===3?&#x27;ok&#x27;:&#x27;warn&#x27;,`${RES[i-1][0]}: ${n}/30 = ${(n/30).toFixed(3)}`);await sleep(1300);}window.__d1.acc=[&#x27;naive&#x27;,&#x27;noillum&#x27;,&#x27;full&#x27;].map(k=&gt;PRED[k].filter((v,i)=&gt;v===Math.floor(i/3)).length);setStatus(&#x27;ok&#x27;,&#x27;0.100 → 0.600 → 0.967 (틀린 1장 d7_2 → 2)&#x27;);}},
 {n:&#x27;⑤ 다른 숫자 · domain shift&#x27;,ex:&#x27;&lt;p&gt;숫자를 바꿔 같은 파이프라인이 일반적으로 동작하는지 확인하세요. 영상에서도 가운데 프레임 6개를 같은 방식(흑백 → 가운데 crop → 28×28)으로 넣어 &lt;b class=&quot;green&quot;&gt;[7, 2, 1, 0, 4, 1]&lt;/b&gt;, 정확도 1.0.&lt;/p&gt;&lt;p&gt;학습 데이터와 실제 입력의 분포 차이 = &lt;b class=&quot;purple&quot;&gt;domain shift&lt;/b&gt;. 오늘은 전처리로 입력을 학습 데이터 쪽으로, Day 2 데이터 증강 · Day 3 전이학습은 모델을 실제 데이터 쪽으로 옮깁니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{illum=true;shadow=true;for(const d of [2,4,7]){digit=d;si=6;info();setStatus(&#x27;info&#x27;,`숫자 ${d}: bbox ${R.box.w}×${R.box.h} → 무게중심 (${R.cm2[0].toFixed(2)}, ${R.cm2[1].toFixed(2)})`);await sleep(1100);}setStatus(&#x27;ok&#x27;,&#x27;영상 가운데 프레임 [7, 2, 1, 0, 4, 1] → 정확도 1.0&#x27;);}},
];
initPresets(P,stop);
info();drawRes();chips(&#x27;full&#x27;);
$(&#x27;#presets button&#x27;).click();

<script>
const ids = [...document.querySelectorAll('nav button')].map(b => b.dataset.id);
function fit(fr) {
  try {
    const d = fr.contentDocument; if (!d || !d.body) return;
    fr.style.height = Math.max(600, d.documentElement.scrollHeight) + 'px';
  } catch (e) {}
}
function show(id, push) {
  if (!ids.includes(id)) id = ids[0];
  document.querySelectorAll('section.lesson').forEach(s => s.classList.toggle('active', s.id === id));
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-current', b.dataset.id === id ? 'true' : 'false'));
  const sec = document.getElementById(id);
  document.title = sec.dataset.title + ' — Vision 기본 모델 Day 1';
  const fr = sec.querySelector('iframe');
  fr.loading = 'eager'; fit(fr);
  if (push) history.replaceState(null, '', '#' + id);
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('section.lesson iframe').forEach(fr => {
  fr.addEventListener('load', () => {
    fit(fr);
    try {
      new ResizeObserver(() => fit(fr)).observe(fr.contentDocument.body);
      fr.contentDocument.addEventListener('keydown', key);   // iframe 안에서도 ← → 동작
    } catch (e) {}
  });
});
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.id, true));
function key(e) {
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const cur = ids.indexOf(location.hash.slice(1) || ids[0]);
  if (e.key === 'ArrowRight' && cur < ids.length - 1) show(ids[cur + 1], true);
  if (e.key === 'ArrowLeft' && cur > 0) show(ids[cur - 1], true);
}
document.addEventListener('keydown', key);
window.addEventListener('resize', () => document.querySelectorAll('section.lesson.active iframe').forEach(fit));
window.addEventListener('hashchange', () => show(location.hash.slice(1), false));   // 주소창에서 #d1-N 을 바꿔도 이동
show(location.hash.slice(1), false);
</script>
