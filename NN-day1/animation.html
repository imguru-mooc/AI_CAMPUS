&lt;body&gt;
&lt;div class=&quot;app&quot;&gt;
  &lt;h1&gt;행렬곱 추적기 — C = A @ B&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;&lt;b style=&quot;color:var(--amber)&quot;&gt;A 의 i 행&lt;/b&gt;과 &lt;b style=&quot;color:var(--blue)&quot;&gt;B 의 j 열&lt;/b&gt;을 원소별로 곱해 더한 값이 &lt;b style=&quot;color:var(--green)&quot;&gt;C[i][j]&lt;/b&gt; 입니다. 노트북 4교시 &lt;code style=&quot;font-family:var(--mono);color:var(--blue)&quot;&gt;matmul_loop&lt;/code&gt; 의 3중 for 루프를 한 칸씩 따라갑니다.&lt;/p&gt;
  &lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill amber&quot;&gt;C[i][j] = Σₖ A[i][k]·B[k][j]&lt;/span&gt;&lt;span class=&quot;pill teal&quot;&gt;(N, D) @ (D, H) → (N, H)&lt;/span&gt;&lt;span class=&quot;pill green&quot;&gt;안쪽 D 가 같아야 함&lt;/span&gt;&lt;span class=&quot;pill red&quot;&gt;안쪽이 다르면 ValueError&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;행렬&lt;/h2&gt;&lt;div class=&quot;stage&quot; id=&quot;stage&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;Python&lt;/h2&gt;&lt;div class=&quot;code&quot; id=&quot;code&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;ctrl&quot;&gt;&lt;button class=&quot;run&quot; id=&quot;stepBtn&quot;&gt;한 단계 (k)&lt;/button&gt;&lt;button id=&quot;playBtn&quot;&gt;자동 재생&lt;/button&gt;&lt;button id=&quot;resetBtn&quot;&gt;처음부터&lt;/button&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;상태&lt;/h2&gt;&lt;div class=&quot;status info&quot; id=&quot;status&quot;&gt;프리셋을 누르세요.&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel explain&quot; id=&quot;explain&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
const $=s=&gt;document.querySelector(s);
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,ms));
function mat(label,M,kind){
  const c=M[0].length;
  return `&lt;div class=&quot;mat&quot;&gt;&lt;div class=&quot;mlabel&quot;&gt;${label}&lt;/div&gt;&lt;div class=&quot;mgrid&quot; style=&quot;grid-template-columns:repeat(${c},auto)&quot;&gt;${
    M.map((r,i)=&gt;r.map((v,j)=&gt;`&lt;span class=&quot;cell ${kind?kind(i,j,v):&#x27;&#x27;}&quot;&gt;${v===&#x27;&#x27;?&#x27;&amp;nbsp;&#x27;:v}&lt;/span&gt;`).join(&#x27;&#x27;)).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;`;
}
const op=s=&gt;`&lt;span class=&quot;op&quot;&gt;${s}&lt;/span&gt;`;
const mrow=(...xs)=&gt;`&lt;div class=&quot;mrow&quot;&gt;${xs.join(&#x27;&#x27;)}&lt;/div&gt;`;
function setStage(h){$(&#x27;#stage&#x27;).innerHTML=h;}
function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}
function setCode(h){$(&#x27;#code&#x27;).innerHTML=h;}
function matmul(A,B){return A.map(r=&gt;B[0].map((_,j)=&gt;r.reduce((s,v,k)=&gt;s+v*B[k][j],0)));}

/* ---------- 단계 추적 상태 ---------- */
const A=[[1,2,3],[4,5,6]];
const B=[[1,0],[2,1],[0,3]];
const Cfull=matmul(A,B);               // [[5,11],[14,23]]
const N=A.length,D=A[0].length,H=B[0].length;
let tr=null, timer=null, busy=false, stepMode=false;
function trReset(){tr={i:0,j:0,k:-1,C:Array.from({length:N},()=&gt;Array(H).fill(&#x27;&#x27;)),terms:[],done:false};}
function trCode(){
  const L=[&#x27;for i in range(n):&#x27;,&#x27;    for j in range(p):&#x27;,&#x27;        for k in range(m):&#x27;,&#x27;            C[i][j] += A[i][k] * B[k][j]&#x27;];
  const cur=tr&amp;&amp;!tr.done&amp;&amp;tr.k&gt;=0?3:-1;
  return &#x27;def matmul_loop(A, B):\n  ...\n&#x27;+L.map((l,x)=&gt;x===cur?`&lt;span class=&quot;cur&quot;&gt;${l}&lt;/span&gt;`:l).join(&#x27;\n&#x27;)+
    (tr&amp;&amp;tr.k&gt;=0&amp;&amp;!tr.done?`\n&lt;span class=&quot;c&quot;&gt;# i=${tr.i}, j=${tr.j}, k=${tr.k}&lt;/span&gt;`:&#x27;&#x27;)+(tr&amp;&amp;tr.done?&#x27;\n\n&lt;span class=&quot;g&quot;&gt;A @ B   # 같은 결과, C · BLAS 내부 루프&lt;/span&gt;&#x27;:&#x27;&#x27;);
}
function trRender(){
  const {i,j,k,C}=tr;
  const act=k&gt;=0&amp;&amp;!tr.done;
  const aK=(ii,kk)=&gt;act&amp;&amp;ii===i?(kk===k?&#x27;hk&#x27;:(kk&lt;k?&#x27;hl&#x27;:&#x27;a&#x27;)):&#x27;dim&#x27;;
  const bK=(kk,jj)=&gt;act&amp;&amp;jj===j?(kk===k?&#x27;hk&#x27;:(kk&lt;k?&#x27;hl&#x27;:&#x27;b&#x27;)):&#x27;dim&#x27;;
  const cK=(ii,jj)=&gt;C[ii][jj]===&#x27;&#x27;?&#x27;ghost&#x27;:(act&amp;&amp;ii===i&amp;&amp;jj===j?&#x27;a&#x27;:&#x27;g&#x27;);
  const A_=tr.done?(()=&gt; &#x27;b&#x27;):aK, B_=tr.done?(()=&gt; &#x27;b&#x27;):bK;
  setStage(mrow(mat(&#x27;A (2, 3)&#x27;,A,A_),op(&#x27;@&#x27;),mat(&#x27;B (3, 2)&#x27;,B,B_),op(&#x27;=&#x27;),mat(&#x27;C (2, 2)&#x27;,C,cK))+
    `&lt;div class=&quot;acc&quot;&gt;${act?`C[${i}][${j}] = `+tr.terms.map((t,x)=&gt;`&lt;span class=&quot;term&quot;&gt;${t}&lt;/span&gt;`).join(&#x27; + &#x27;)+` = &lt;span class=&quot;sum&quot;&gt;${C[i][j]}&lt;/span&gt;`:(tr.done?&#x27;&lt;span class=&quot;sum&quot;&gt;완료 — C = &#x27;+JSON.stringify(Cfull)+&#x27;&lt;/span&gt;&#x27;:&#x27;&quot;한 단계&quot; 를 누르면 k 루프가 한 번 돕니다.&#x27;)}&lt;/div&gt;`+
    `&lt;div class=&quot;shape&quot;&gt;&lt;span class=&quot;t&quot;&gt;(&lt;span class=&quot;out&quot;&gt;2&lt;/span&gt;, &lt;span class=&quot;in&quot;&gt;3&lt;/span&gt;)&lt;/span&gt;@&lt;span class=&quot;t&quot;&gt;(&lt;span class=&quot;in&quot;&gt;3&lt;/span&gt;, &lt;span class=&quot;out&quot;&gt;2&lt;/span&gt;)&lt;/span&gt;→&lt;span class=&quot;t&quot;&gt;(&lt;span class=&quot;out&quot;&gt;2&lt;/span&gt;, &lt;span class=&quot;out&quot;&gt;2&lt;/span&gt;)&lt;/span&gt;&lt;/div&gt;`);
  setCode(trCode());
}
function trStep(){
  if(!tr||tr.done)return;
  // advance index
  if(tr.k&lt;0){tr.k=0;}
  else if(tr.k&lt;D-1){tr.k++;}
  else{ // finished cell (i,j)
    tr.terms=[];
    if(tr.j&lt;H-1){tr.j++;}else if(tr.i&lt;N-1){tr.i++;tr.j=0;}else{tr.done=true;trRender();stopPlay();
      setStatus(&#x27;ok&#x27;,`3중 루프 완료: 곱셈 ${N*H*D}번. C = [[${Cfull[0]}],[${Cfull[1]}]] — &lt;code&gt;A @ B&lt;/code&gt; 와 같습니다.`);updBtns();return;}
    tr.k=0;
  }
  const {i,j,k}=tr;
  if(k===0)tr.C[i][j]=0;
  tr.C[i][j]+=A[i][k]*B[k][j];
  tr.terms.push(`${A[i][k]}·${B[k][j]}`);
  trRender();
  setStatus(k===D-1?&#x27;ok&#x27;:&#x27;info&#x27;,k===D-1
    ?`C[${i}][${j}] 완성 = ${tr.terms.join(&#x27; + &#x27;)} = &lt;b&gt;${tr.C[i][j]}&lt;/b&gt;  (A 의 ${i}행 · B 의 ${j}열 내적)`
    :`k=${k}: A[${i}][${k}]·B[${k}][${j}] = ${A[i][k]}·${B[k][j]} = ${A[i][k]*B[k][j]} 누적 → ${tr.C[i][j]}`);
  updBtns();
}
function stopPlay(){clearInterval(timer);timer=null;$(&#x27;#playBtn&#x27;).textContent=&#x27;자동 재생&#x27;;}
function updBtns(){$(&#x27;#stepBtn&#x27;).disabled=!stepMode||!tr||tr.done;$(&#x27;#playBtn&#x27;).disabled=!stepMode;$(&#x27;#resetBtn&#x27;).disabled=!stepMode;}
function trStart(){stopPlay();trReset();trRender();setStatus(&#x27;info&#x27;,&#x27;노란 칸 = 지금 곱하는 원소(k), 주황 = A 의 i 행, 파랑 = B 의 j 열. &quot;한 단계&quot; 또는 &quot;자동 재생&quot;.&#x27;);updBtns();}
$(&#x27;#stepBtn&#x27;).onclick=()=&gt;{stopPlay();trStep();};
$(&#x27;#resetBtn&#x27;).onclick=trStart;
$(&#x27;#playBtn&#x27;).onclick=()=&gt;{if(timer){stopPlay();return;}if(!tr||tr.done)trStart();$(&#x27;#playBtn&#x27;).textContent=&#x27;정지&#x27;;trStep();timer=setInterval(trStep,750);};

/* ---------- 프리셋 ---------- */
const X=[[1,0,2],[0,1,1],[2,1,0],[1,1,1]];
const W=[[1,-1],[0,2],[1,0]];
const bb=[1,-1];
const P=[
 {n:&#x27;① C = A @ B 한 칸씩 추적&#x27;,step:true,ex:&#x27;&lt;p&gt;C[i][j] 하나를 만들려면 &lt;b class=&quot;amber&quot;&gt;A 의 i 행&lt;/b&gt;과 &lt;b class=&quot;blue&quot;&gt;B 의 j 열&lt;/b&gt;을 맞대어 &lt;b class=&quot;teal&quot;&gt;k = 0, 1, 2&lt;/b&gt; 순서로 곱해 더합니다 — 즉 &lt;b class=&quot;green&quot;&gt;행·열의 내적&lt;/b&gt;입니다.&lt;/p&gt;&lt;p&gt;(2, 3) @ (3, 2) 는 곱셈 2×2×3 = 12번. 200×200 이면 800만 번이라 Python 루프와 &lt;code&gt;A @ B&lt;/code&gt; 의 속도 차가 수천 배가 됩니다(노트북 4교시 측정 셀).&lt;/p&gt;&#x27;,
  run:async()=&gt;{trStart();}},
 {n:&#x27;② shape 규칙 (N,D)@(D,H)→(N,H)&#x27;,ex:&#x27;&lt;p&gt;행렬곱의 shape 는 &lt;b class=&quot;teal&quot;&gt;안쪽 두 숫자(D)가 같아야&lt;/b&gt; 하고, 결과는 &lt;b class=&quot;amber&quot;&gt;바깥쪽 두 숫자 (N, H)&lt;/b&gt; 입니다. 안쪽 D 는 내적 과정에서 Σₖ 로 &lt;b&gt;사라집니다&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;신경망에서 N = 샘플 수(batch), D = 입력 특징 수, H = 출력 뉴런 수. Day 2 순전파는 이 규칙만으로 shape 를 추적합니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{
   setCode(&#x27;&lt;span class=&quot;c&quot;&gt;# 규칙&lt;/span&gt;\n(N, D) @ (D, H)  →  (N, H)\n\n(2, 3) @ (3, 2)  →  (2, 2)\n(4, 3) @ (3, 2)  →  (4, 2)\n(1, 784) @ (784, 100) → (1, 100)   &lt;span class=&quot;c&quot;&gt;# Day 3 MNIST&lt;/span&gt;&#x27;);
   const ex=[[2,3,2],[4,3,2],[1,784,100],[3,1,5]];
   for(const [n,d,h] of ex){
     setStage(`&lt;div class=&quot;shape&quot;&gt;&lt;span class=&quot;t&quot;&gt;(&lt;span class=&quot;out&quot;&gt;${n}&lt;/span&gt;, &lt;span class=&quot;in&quot;&gt;${d}&lt;/span&gt;)&lt;/span&gt; @ &lt;span class=&quot;t&quot;&gt;(&lt;span class=&quot;in&quot;&gt;${d}&lt;/span&gt;, &lt;span class=&quot;out&quot;&gt;${h}&lt;/span&gt;)&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;note&quot;&gt;안쪽 ${d} = ${d} ✓ — Σₖ 로 사라짐&lt;/div&gt;`);
     setStatus(&#x27;info&#x27;,`안쪽 차원 비교: ${d} vs ${d}`);
     await sleep(800);
     setStage(`&lt;div class=&quot;shape&quot;&gt;&lt;span class=&quot;t&quot;&gt;(&lt;span class=&quot;out&quot;&gt;${n}&lt;/span&gt;, &lt;span class=&quot;in&quot;&gt;${d}&lt;/span&gt;)&lt;/span&gt; @ &lt;span class=&quot;t&quot;&gt;(&lt;span class=&quot;in&quot;&gt;${d}&lt;/span&gt;, &lt;span class=&quot;out&quot;&gt;${h}&lt;/span&gt;)&lt;/span&gt; → &lt;span class=&quot;t&quot;&gt;(&lt;span class=&quot;out&quot;&gt;${n}&lt;/span&gt;, &lt;span class=&quot;out&quot;&gt;${h}&lt;/span&gt;)&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;note&quot;&gt;결과 = 바깥쪽 (${n}, ${h}) · 곱셈 ${n}×${h}×${d} = ${(n*h*d).toLocaleString()}번&lt;/div&gt;`);
     setStatus(&#x27;ok&#x27;,`(${n}, ${d}) @ (${d}, ${h}) → (${n}, ${h})`);
     await sleep(1000);
   }
   setStage([&#x27;(2, 3) @ (3, 2) → (2, 2)&#x27;,&#x27;(4, 3) @ (3, 2) → (4, 2)&#x27;,&#x27;(1, 784) @ (784, 100) → (1, 100)&#x27;,&#x27;(3, 1) @ (1, 5) → (3, 5)  ← 외적(outer)&#x27;].map(s=&gt;`&lt;div class=&quot;shape&quot;&gt;&lt;span class=&quot;t&quot;&gt;${s}&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;));
   setStatus(&#x27;ok&#x27;,&#x27;안쪽은 같아야 하고 사라진다, 바깥쪽이 결과 shape — 이것만 기억하면 됩니다.&#x27;);}},
 {n:&#x27;③ ⚠ (2,3) @ (2,3) — 안쪽 불일치&#x27;,ex:&#x27;&lt;p&gt;A 의 행 길이는 3, B 의 열 길이는 2 — &lt;b class=&quot;red&quot;&gt;내적할 짝이 맞지 않습니다&lt;/b&gt;. NumPy 는 &lt;code&gt;matmul: Input operand 1 has a mismatch in its core dimension 0&lt;/code&gt; 오류를 냅니다.&lt;/p&gt;&lt;p&gt;대부분 &lt;b class=&quot;amber&quot;&gt;전치(.T)&lt;/b&gt; 를 빼먹은 경우입니다: &lt;code&gt;A @ A.T&lt;/code&gt; 는 (2,3)@(3,2) → (2,2). 5교시 &lt;code&gt;P @ M.T&lt;/code&gt; 가 .T 를 붙이는 이유도 같습니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{
   const B2=[[1,0,2],[2,1,0]];
   setStage(mrow(mat(&#x27;A (2, 3)&#x27;,A,(i)=&gt;i===0?&#x27;a&#x27;:&#x27;b&#x27;),op(&#x27;@&#x27;),mat(&#x27;B (2, 3)&#x27;,B2,(i,j)=&gt;j===0?&#x27;b&#x27;:&#x27;dim&#x27;)));
   setCode(&#x27;A = np.array([[1,2,3],[4,5,6]])     &lt;span class=&quot;c&quot;&gt;# (2, 3)&lt;/span&gt;\nB = np.array([[1,0,2],[2,1,0]])     &lt;span class=&quot;c&quot;&gt;# (2, 3)&lt;/span&gt;\nA @ B&#x27;);
   setStatus(&#x27;info&#x27;,&#x27;A 의 0행(3개)과 B 의 0열(2개)을 맞대 봅니다…&#x27;);await sleep(1100);
   setStage(mrow(mat(&#x27;A 0행 (3개)&#x27;,[A[0]],(i,j)=&gt;j===2?&#x27;r&#x27;:&#x27;a&#x27;),op(&#x27;·&#x27;),mat(&#x27;B 0열 (2개)&#x27;,[[B2[0][0],B2[1][0],&#x27;?&#x27;]],(i,j)=&gt;j===2?&#x27;r&#x27;:&#x27;b&#x27;))+
     `&lt;div class=&quot;shape&quot;&gt;&lt;span class=&quot;t&quot;&gt;(2, &lt;span class=&quot;bad&quot;&gt;3&lt;/span&gt;)&lt;/span&gt; @ &lt;span class=&quot;t&quot;&gt;(&lt;span class=&quot;bad&quot;&gt;2&lt;/span&gt;, 3)&lt;/span&gt; → &lt;span class=&quot;bad&quot;&gt;✗&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;note&quot;&gt;안쪽 3 ≠ 2 — 세 번째 원소의 짝이 없음&lt;/div&gt;`);
   setCode(&#x27;A @ B\n&lt;span class=&quot;e&quot;&gt;ValueError: matmul: Input operand 1 has a mismatch in its\ncore dimension 0, with gufunc signature (n?,k),(k,m?)-&gt;(n?,m?)\n(size 2 is different from 3)&lt;/span&gt;\n\n&lt;span class=&quot;c&quot;&gt;# 고치기 — 전치&lt;/span&gt;\nA @ B.T     &lt;span class=&quot;g&quot;&gt;# (2,3) @ (3,2) → (2,2)&lt;/span&gt;&#x27;);
   await sleep(600);
   setStatus(&#x27;warn&#x27;,&#x27;안쪽 차원 3 vs 2 — 오류 메시지의 &quot;size 2 is different from 3&quot; 이 그 뜻입니다.&#x27;);}},
 {n:&#x27;④ X(4,3) @ W(3,2) + b(2,) → (4,2)&#x27;,ex:&#x27;&lt;p&gt;신경망 한 층: 샘플 4개 × 특징 3개 &lt;b class=&quot;blue&quot;&gt;X&lt;/b&gt; 를 가중치 &lt;b class=&quot;amber&quot;&gt;W (3, 2)&lt;/b&gt; 로 출력 2개 공간에 보내고, 편향 &lt;b class=&quot;green&quot;&gt;b (2,)&lt;/b&gt; 를 모든 행에 브로드캐스팅으로 더합니다.&lt;/p&gt;&lt;p&gt;노트북 문제 5-3 &lt;code&gt;Y = X @ W + b&lt;/code&gt; 와 같은 shape 흐름 — Day 2 순전파의 기본 단위이자 Day 3 역전파에서 shape 로 기울기를 검산하는 근거입니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{
   const XW=matmul(X,W);const Y=XW.map(r=&gt;r.map((v,j)=&gt;v+bb[j]));
   setStage(mrow(mat(&#x27;X (4, 3)&#x27;,X,()=&gt;&#x27;b&#x27;),op(&#x27;@&#x27;),mat(&#x27;W (3, 2)&#x27;,W,()=&gt;&#x27;a&#x27;),op(&#x27;+&#x27;),mat(&#x27;b (2,)&#x27;,[bb],()=&gt;&#x27;p&#x27;))+
     `&lt;div class=&quot;shape&quot;&gt;&lt;span class=&quot;t&quot;&gt;(4, &lt;span class=&quot;in&quot;&gt;3&lt;/span&gt;)&lt;/span&gt;@&lt;span class=&quot;t&quot;&gt;(&lt;span class=&quot;in&quot;&gt;3&lt;/span&gt;, 2)&lt;/span&gt;+&lt;span class=&quot;t&quot;&gt;(2,)&lt;/span&gt;&lt;/div&gt;`);
   setCode(&#x27;X = rng.normal(size=(4, 3))   &lt;span class=&quot;c&quot;&gt;# 여기선 작은 정수로&lt;/span&gt;\nW = rng.normal(size=(3, 2))\nb = np.zeros(2)\nY = X @ W + b&#x27;);
   setStatus(&#x27;info&#x27;,&#x27;1단계: 안쪽 3 = 3 → X @ W 가능&#x27;);await sleep(1000);
   const XWp=XW.map(r=&gt;r.map(()=&gt;&#x27;&#x27;));
   for(let i=0;i&lt;4;i++){
     for(let j=0;j&lt;2;j++){
       XWp[i][j]=XW[i][j];
       setStage(mrow(mat(&#x27;X (4, 3)&#x27;,X,(ii)=&gt;ii===i?&#x27;hl&#x27;:&#x27;dim&#x27;),op(&#x27;@&#x27;),mat(&#x27;W (3, 2)&#x27;,W,(kk,jj)=&gt;jj===j?&#x27;hl&#x27;:&#x27;dim&#x27;),op(&#x27;=&#x27;),mat(&#x27;X @ W (4, 2)&#x27;,XWp,(ii,jj)=&gt;ii===i&amp;&amp;jj===j?&#x27;a&#x27;:(XWp[ii][jj]===&#x27;&#x27;?&#x27;ghost&#x27;:&#x27;g&#x27;))));
       setStatus(&#x27;info&#x27;,`XW[${i}][${j}] = ${X[i].map((v,k)=&gt;`${v}·${W[k][j]}`).join(&#x27; + &#x27;)} = ${XW[i][j]}`);
       await sleep(380);
     }
   }
   setStatus(&#x27;info&#x27;,&#x27;2단계: (4, 2) + (2,) — 오른쪽 끝 2 = 2 → b 가 4개 행으로 늘어남&#x27;);
   for(let k=1;k&lt;4;k++){
     setStage(mrow(mat(&#x27;X @ W (4, 2)&#x27;,XW,()=&gt;&#x27;g&#x27;),op(&#x27;+&#x27;),mat(`b 늘어남 → (${k+1}, 2)`,[0,1,2,3].map(i=&gt;i&lt;=k?bb:[&#x27;&#x27;,&#x27;&#x27;]),(i)=&gt;i===0?&#x27;p&#x27;:(i&lt;=k?&#x27;p ghost&#x27;:&#x27;dim&#x27;))));
     await sleep(380);
   }
   setStage(mrow(mat(&#x27;X @ W (4, 2)&#x27;,XW,()=&gt;&#x27;dim&#x27;),op(&#x27;+&#x27;),mat(&#x27;b (복제됨)&#x27;,[bb,bb,bb,bb],(i)=&gt;i?&#x27;p ghost&#x27;:&#x27;p&#x27;),op(&#x27;=&#x27;),mat(&#x27;Y (4, 2)&#x27;,Y,()=&gt;&#x27;g&#x27;))+
     `&lt;div class=&quot;shape&quot;&gt;&lt;span class=&quot;t&quot;&gt;(4, 3)&lt;/span&gt;@&lt;span class=&quot;t&quot;&gt;(3, 2)&lt;/span&gt;→&lt;span class=&quot;t&quot;&gt;(4, 2)&lt;/span&gt;+&lt;span class=&quot;t&quot;&gt;(2,)&lt;/span&gt;→&lt;span class=&quot;t&quot;&gt;(&lt;span class=&quot;out&quot;&gt;4&lt;/span&gt;, &lt;span class=&quot;out&quot;&gt;2&lt;/span&gt;)&lt;/span&gt;&lt;/div&gt;`);
   setCode(&#x27;Y = X @ W + b\n&lt;span class=&quot;c&quot;&gt;# (4,3) @ (3,2) → (4,2)\n# (4,2) + (2,)  → (4,2)   브로드캐스팅&lt;/span&gt;\nY.shape   &lt;span class=&quot;g&quot;&gt;# (4, 2)&lt;/span&gt;\n&lt;span class=&quot;g&quot;&gt;# &#x27;+JSON.stringify(Y)+&#x27;&lt;/span&gt;&#x27;);
   setStatus(&#x27;ok&#x27;,&#x27;Y.shape == (4, 2) — 샘플 4개가 각각 출력 2개를 얻었습니다.&#x27;);}},
];
$(&#x27;#presets&#x27;).innerHTML=P.map(p=&gt;`&lt;button&gt;${p.n}&lt;/button&gt;`).join(&#x27;&#x27;);
$(&#x27;#presets&#x27;).querySelectorAll(&#x27;button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;stopPlay();stepMode=!!P[i].step;updBtns();
  $(&#x27;#presets&#x27;).querySelectorAll(&#x27;button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;await P[i].run();busy=false;});
$(&#x27;#presets&#x27;).querySelector(&#x27;button&#x27;).click();
&lt;/script&gt;
&lt;/body&gt;

&lt;body&gt;
&lt;div class=&quot;app&quot;&gt;
  &lt;h1&gt;2×2 선형변환 — 행렬은 공간을 옮긴다&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;행렬 M 을 곱하면 격자 전체가 &lt;b style=&quot;color:var(--teal)&quot;&gt;회전 · 확대 · 전단 · 반사&lt;/b&gt;됩니다. M 의 &lt;b style=&quot;color:var(--red)&quot;&gt;1열 = e₁ 이 가는 곳&lt;/b&gt;, &lt;b style=&quot;color:var(--blue)&quot;&gt;2열 = e₂ 가 가는 곳&lt;/b&gt;. 점들은 행 하나가 점 하나인 (N, 2) 배열이라 &lt;code style=&quot;font-family:var(--mono);color:var(--blue)&quot;&gt;Q = P @ M.T&lt;/code&gt; 로 변환합니다.&lt;/p&gt;
  &lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill red&quot;&gt;M[:,0] = M·e₁&lt;/span&gt;&lt;span class=&quot;pill blue&quot;&gt;M[:,1] = M·e₂&lt;/span&gt;&lt;span class=&quot;pill amber&quot;&gt;det = ad − bc = 넓이 배율&lt;/span&gt;&lt;span class=&quot;pill purple&quot;&gt;det &amp;lt; 0 → 뒤집힘&lt;/span&gt;&lt;span class=&quot;pill green&quot;&gt;det = 0 → 한 줄로 찌그러짐&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;평면 (before → after)&lt;/h2&gt;
      &lt;svg class=&quot;plane&quot; id=&quot;svg&quot; viewBox=&quot;0 0 480 480&quot; aria-label=&quot;선형변환 평면&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:#3f5070&quot;&gt;&lt;/i&gt;원래 격자&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#2dd4bf&quot;&gt;&lt;/i&gt;변환된 격자&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#8a9bb8&quot;&gt;&lt;/i&gt;P (before)&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#f5b942&quot;&gt;&lt;/i&gt;Q (after)&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#f87171&quot;&gt;&lt;/i&gt;M e₁&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#60a5fa&quot;&gt;&lt;/i&gt;M e₂&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;행렬 M = [[a, b], [c, d]]&lt;/h2&gt;
        &lt;div class=&quot;mview&quot;&gt;&lt;div class=&quot;bracket&quot; id=&quot;mview&quot;&gt;&lt;/div&gt;&lt;div class=&quot;det&quot; id=&quot;det&quot;&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;sliders&quot;&gt;
          &lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;sa&quot;&gt;a&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sa&quot; min=&quot;-2&quot; max=&quot;2&quot; step=&quot;0.01&quot;&gt;&lt;output id=&quot;oa&quot;&gt;&lt;/output&gt;&lt;/div&gt;
          &lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;sb&quot;&gt;b&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sb&quot; min=&quot;-2&quot; max=&quot;2&quot; step=&quot;0.01&quot;&gt;&lt;output id=&quot;ob&quot;&gt;&lt;/output&gt;&lt;/div&gt;
          &lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;sc&quot;&gt;c&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sc&quot; min=&quot;-2&quot; max=&quot;2&quot; step=&quot;0.01&quot;&gt;&lt;output id=&quot;oc&quot;&gt;&lt;/output&gt;&lt;/div&gt;
          &lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;sd&quot;&gt;d&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sd&quot; min=&quot;-2&quot; max=&quot;2&quot; step=&quot;0.01&quot;&gt;&lt;output id=&quot;od&quot;&gt;&lt;/output&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;Python&lt;/h2&gt;&lt;div class=&quot;code&quot; id=&quot;code&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;상태&lt;/h2&gt;&lt;div class=&quot;status info&quot; id=&quot;status&quot;&gt;프리셋을 누르거나 슬라이더를 움직이세요.&lt;/div&gt;&lt;/div&gt;

&lt;script&gt;
const $=s=&gt;document.querySelector(s);
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,ms));
const NS=&#x27;http://www.w3.org/2000/svg&#x27;;
const W=480, R=3.2, sc=W/(2*R);                 // world [-3.2, 3.2]
const tx=x=&gt;W/2+x*sc, ty=y=&gt;W/2-y*sc;
const Pts=[[0,0],[1,0],[1,1],[0,1],[0,0],[0.5,1.5],[1,1]];   // 노트북 P
let M=[[1,0],[0,1]], codeLabel=&#x27;M = np.eye(2)&#x27;, busy=false;
const f2=v=&gt;(Math.abs(v)&lt;5e-4?0:v).toFixed(2);
const f3=v=&gt;(Math.abs(v)&lt;5e-4?0:v).toFixed(3);
function apply(M,[x,y]){return [M[0][0]*x+M[0][1]*y, M[1][0]*x+M[1][1]*y];}
function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}
function arrow(x1,y1,x2,y2,col,w,id){
  return `&lt;line x1=&quot;${tx(x1)}&quot; y1=&quot;${ty(y1)}&quot; x2=&quot;${tx(x2)}&quot; y2=&quot;${ty(y2)}&quot; stroke=&quot;${col}&quot; stroke-width=&quot;${w}&quot; marker-end=&quot;url(#${id})&quot; stroke-linecap=&quot;round&quot;/&gt;`;
}
function draw(){
  let h=`&lt;defs&gt;${[[&#x27;mr&#x27;,&#x27;#f87171&#x27;],[&#x27;mb&#x27;,&#x27;#60a5fa&#x27;],[&#x27;md&#x27;,&#x27;#5d7292&#x27;]].map(([id,c])=&gt;`&lt;marker id=&quot;${id}&quot; markerWidth=&quot;9&quot; markerHeight=&quot;9&quot; refX=&quot;7&quot; refY=&quot;4.5&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0 L9,4.5 L0,9 z&quot; fill=&quot;${c}&quot;/&gt;&lt;/marker&gt;`).join(&#x27;&#x27;)}&lt;/defs&gt;`;
  // 원래 격자
  for(let k=-3;k&lt;=3;k++){
    h+=`&lt;line x1=&quot;${tx(k)}&quot; y1=&quot;${ty(-R)}&quot; x2=&quot;${tx(k)}&quot; y2=&quot;${ty(R)}&quot; stroke=&quot;${k?&#x27;#1a2540&#x27;:&#x27;#3f5070&#x27;}&quot; stroke-width=&quot;${k?1:1.5}&quot;/&gt;`;
    h+=`&lt;line x1=&quot;${tx(-R)}&quot; y1=&quot;${ty(k)}&quot; x2=&quot;${tx(R)}&quot; y2=&quot;${ty(k)}&quot; stroke=&quot;${k?&#x27;#1a2540&#x27;:&#x27;#3f5070&#x27;}&quot; stroke-width=&quot;${k?1:1.5}&quot;/&gt;`;
  }
  // 변환된 격자 (clip)
  h+=`&lt;clipPath id=&quot;cp&quot;&gt;&lt;rect x=&quot;0&quot; y=&quot;0&quot; width=&quot;${W}&quot; height=&quot;${W}&quot;/&gt;&lt;/clipPath&gt;&lt;g clip-path=&quot;url(#cp)&quot;&gt;`;
  const L=8;
  for(let k=-L;k&lt;=L;k++){
    const a=apply(M,[k,-L]),b=apply(M,[k,L]),c=apply(M,[-L,k]),d=apply(M,[L,k]);
    const op=k?0.35:0.8;
    h+=`&lt;line x1=&quot;${tx(a[0])}&quot; y1=&quot;${ty(a[1])}&quot; x2=&quot;${tx(b[0])}&quot; y2=&quot;${ty(b[1])}&quot; stroke=&quot;#2dd4bf&quot; stroke-opacity=&quot;${op}&quot; stroke-width=&quot;1&quot;/&gt;`;
    h+=`&lt;line x1=&quot;${tx(c[0])}&quot; y1=&quot;${ty(c[1])}&quot; x2=&quot;${tx(d[0])}&quot; y2=&quot;${ty(d[1])}&quot; stroke=&quot;#2dd4bf&quot; stroke-opacity=&quot;${op}&quot; stroke-width=&quot;1&quot;/&gt;`;
  }
  // 단위 정사각형의 상 (넓이 = |det|)
  const sq=[[0,0],[1,0],[1,1],[0,1]].map(p=&gt;apply(M,p));
  const det=M[0][0]*M[1][1]-M[0][1]*M[1][0];
  h+=`&lt;polygon points=&quot;${sq.map(p=&gt;tx(p[0])+&#x27;,&#x27;+ty(p[1])).join(&#x27; &#x27;)}&quot; fill=&quot;${det&lt;0?&#x27;#c084fc&#x27;:&#x27;#f5b942&#x27;}&quot; fill-opacity=&quot;.14&quot; stroke=&quot;none&quot;/&gt;`;
  // P before
  h+=`&lt;polyline points=&quot;${Pts.map(p=&gt;tx(p[0])+&#x27;,&#x27;+ty(p[1])).join(&#x27; &#x27;)}&quot; fill=&quot;none&quot; stroke=&quot;#8a9bb8&quot; stroke-opacity=&quot;.55&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;5 4&quot;/&gt;`;
  Pts.forEach(p=&gt;h+=`&lt;circle cx=&quot;${tx(p[0])}&quot; cy=&quot;${ty(p[1])}&quot; r=&quot;3.5&quot; fill=&quot;#8a9bb8&quot; fill-opacity=&quot;.6&quot;/&gt;`);
  // Q after
  const Q=Pts.map(p=&gt;apply(M,p));
  h+=`&lt;polyline points=&quot;${Q.map(p=&gt;tx(p[0])+&#x27;,&#x27;+ty(p[1])).join(&#x27; &#x27;)}&quot; fill=&quot;none&quot; stroke=&quot;#f5b942&quot; stroke-width=&quot;2.5&quot;/&gt;`;
  Q.forEach(p=&gt;h+=`&lt;circle cx=&quot;${tx(p[0])}&quot; cy=&quot;${ty(p[1])}&quot; r=&quot;4&quot; fill=&quot;#f5b942&quot;/&gt;`);
  h+=&#x27;&lt;/g&gt;&#x27;;
  // basis
  h+=arrow(0,0,1,0,&#x27;#5d7292&#x27;,1.5,&#x27;md&#x27;)+arrow(0,0,0,1,&#x27;#5d7292&#x27;,1.5,&#x27;md&#x27;);
  const e1=apply(M,[1,0]),e2=apply(M,[0,1]);
  if(Math.hypot(...e1)&gt;0.02)h+=arrow(0,0,e1[0],e1[1],&#x27;#f87171&#x27;,3,&#x27;mr&#x27;);
  if(Math.hypot(...e2)&gt;0.02)h+=arrow(0,0,e2[0],e2[1],&#x27;#60a5fa&#x27;,3,&#x27;mb&#x27;);
  const lab=(p,t,c)=&gt;{const x=Math.max(-R+0.3,Math.min(R-0.3,p[0])),y=Math.max(-R+0.3,Math.min(R-0.3,p[1]));return `&lt;text x=&quot;${tx(x)+6}&quot; y=&quot;${ty(y)-6}&quot; fill=&quot;${c}&quot; font-family=&quot;Consolas,monospace&quot; font-size=&quot;14&quot;&gt;${t}&lt;/text&gt;`;};
  h+=lab(e1,&#x27;Me₁&#x27;,&#x27;#f87171&#x27;)+lab(e2,&#x27;Me₂&#x27;,&#x27;#60a5fa&#x27;);
  h+=`&lt;text x=&quot;${tx(1)-4}&quot; y=&quot;${ty(0)+16}&quot; fill=&quot;#5d7292&quot; font-family=&quot;Consolas,monospace&quot; font-size=&quot;12&quot;&gt;e₁&lt;/text&gt;&lt;text x=&quot;${tx(0)-18}&quot; y=&quot;${ty(1)+4}&quot; fill=&quot;#5d7292&quot; font-family=&quot;Consolas,monospace&quot; font-size=&quot;12&quot;&gt;e₂&lt;/text&gt;`;
  $(&#x27;#svg&#x27;).innerHTML=h;
  // matrix view
  $(&#x27;#mview&#x27;).innerHTML=`&lt;span class=&quot;c1&quot;&gt;${f2(M[0][0])}&lt;/span&gt;&lt;span class=&quot;c2&quot;&gt;${f2(M[0][1])}&lt;/span&gt;&lt;span class=&quot;c1&quot;&gt;${f2(M[1][0])}&lt;/span&gt;&lt;span class=&quot;c2&quot;&gt;${f2(M[1][1])}&lt;/span&gt;`;
  const dc=Math.abs(det)&lt;1e-3?&#x27;var(--green)&#x27;:(det&lt;0?&#x27;var(--purple)&#x27;:&#x27;var(--amber)&#x27;);
  $(&#x27;#det&#x27;).innerHTML=`det = ad − bc&lt;br&gt;= ${f2(M[0][0])}·${f2(M[1][1])} − ${f2(M[0][1])}·${f2(M[1][0])}&lt;br&gt;= &lt;b style=&quot;color:${dc}&quot;&gt;${f3(det)}&lt;/b&gt;`;
  [&#x27;a&#x27;,&#x27;b&#x27;,&#x27;c&#x27;,&#x27;d&#x27;].forEach((k,i)=&gt;{const v=M[i&gt;&gt;1][i&amp;1];$(&#x27;#s&#x27;+k).value=v;$(&#x27;#o&#x27;+k).textContent=f2(v);});
  $(&#x27;#code&#x27;).innerHTML=`P = np.array([[0,0],[1,0],[1,1],[0,1],[0,0],[0.5,1.5],[1,1]])\n${codeLabel}\n&lt;span class=&quot;c&quot;&gt;# M = [[${f3(M[0][0])}, ${f3(M[0][1])}], [${f3(M[1][0])}, ${f3(M[1][1])}]]&lt;/span&gt;\nQ = P @ M.T          &lt;span class=&quot;c&quot;&gt;# 행 = 점 → M.T 를 오른쪽에&lt;/span&gt;\nnp.linalg.det(M)     &lt;span class=&quot;g&quot;&gt;# ${f3(det)}&lt;/span&gt;\n&lt;span class=&quot;c&quot;&gt;# e₁ → (${f2(e1[0])}, ${f2(e1[1])})   e₂ → (${f2(e2[0])}, ${f2(e2[1])})&lt;/span&gt;`;
  return det;
}
function detMsg(det){
  if(Math.abs(det)&lt;1e-3)return [&#x27;warn&#x27;,`det = 0 — 평면 전체가 &lt;b&gt;한 직선&lt;/b&gt;으로 찌그러졌습니다. 정보가 사라져 역행렬이 없습니다(특이행렬).`];
  if(det&lt;0)return [&#x27;info&#x27;,`det = ${f3(det)} &amp;lt; 0 — 넓이는 ${f3(Math.abs(det))}배, 그리고 &lt;b&gt;앞뒤가 뒤집혔습니다&lt;/b&gt;(e₁→e₂ 회전 방향이 반대).`];
  return [&#x27;ok&#x27;,`det = ${f3(det)} — 단위 정사각형(노란 면)의 넓이가 ${f3(det)}배가 됩니다.`];
}
async function animateTo(T,label,ms=900){
  const S=M.map(r=&gt;r.slice());codeLabel=label;
  const n=24;
  for(let s=1;s&lt;=n;s++){
    const t=s/n, e=t&lt;.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    M=S.map((r,i)=&gt;r.map((v,j)=&gt;v+(T[i][j]-v)*e));
    draw();await sleep(ms/n);
  }
  M=T.map(r=&gt;r.slice());return draw();
}
const c30=Math.cos(Math.PI/6), s30=Math.sin(Math.PI/6);
const ROT=[[c30,-s30],[s30,c30]], SC=[[2,0],[0,0.5]];
const SR=[[SC[0][0]*ROT[0][0],SC[0][0]*ROT[0][1]],[SC[1][1]*ROT[1][0],SC[1][1]*ROT[1][1]]]; // S @ R
const I2=[[1,0],[0,1]];
const P=[
 {n:&#x27;① 항등 I&#x27;,T:I2,code:&#x27;M = np.eye(2)&#x27;,ex:&#x27;&lt;p&gt;항등행렬은 e₁ → e₁, e₂ → e₂ — 아무것도 움직이지 않습니다. &lt;b class=&quot;amber&quot;&gt;M 의 각 열이 기저벡터가 도착하는 곳&lt;/b&gt;이라는 것만 기억하면 어떤 2×2 행렬도 그림으로 읽을 수 있습니다.&lt;/p&gt;&#x27;},
 {n:&#x27;② 회전 30°&#x27;,T:ROT,code:&#x27;M = rot(np.pi / 6)&#x27;,ex:&#x27;&lt;p&gt;&lt;code&gt;rot(θ) = [[cos θ, −sin θ], [sin θ, cos θ]]&lt;/code&gt; — 노트북 문제 5-2. 길이와 각도를 보존하므로 &lt;b class=&quot;amber&quot;&gt;det = cos²θ + sin²θ = 1&lt;/b&gt;, 넓이도 그대로입니다.&lt;/p&gt;&lt;p&gt;e₁ = (1, 0) 은 (cos 30°, sin 30°) = (0.866, 0.5) 로 갑니다 — 1열과 같습니다.&lt;/p&gt;&#x27;},
 {n:&#x27;③ 확대 S=(2, 0.5)&#x27;,T:SC,code:&#x27;M = S   # [[2, 0], [0, 0.5]]&#x27;,ex:&#x27;&lt;p&gt;대각행렬은 축마다 따로 늘이고 줄입니다. x 는 2배, y 는 0.5배 → 넓이는 &lt;b class=&quot;amber&quot;&gt;2 × 0.5 = 1&lt;/b&gt;배. 모양은 바뀌어도 넓이가 같을 수 있습니다.&lt;/p&gt;&lt;p&gt;Day 4 BatchNorm 의 γ(감마)가 특징마다 이런 배율을 곱합니다.&lt;/p&gt;&#x27;},
 {n:&#x27;④ 회전 → 확대 (S @ R)&#x27;,T:SR,code:&#x27;M = S @ rot(np.pi / 6)   # 오른쪽부터 적용&#x27;,ex:&#x27;&lt;p&gt;&lt;code&gt;S @ R&lt;/code&gt; 은 &lt;b class=&quot;teal&quot;&gt;R 을 먼저&lt;/b&gt;, S 를 나중에 적용합니다(오른쪽부터). det(S@R) = det(S)·det(R) = 1·1 = 1. &lt;code&gt;R @ S&lt;/code&gt; 와는 결과 모양이 다릅니다 — &lt;b class=&quot;red&quot;&gt;행렬곱은 교환법칙이 성립하지 않습니다&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;신경망의 층을 쌓는 것도 변환을 이어 붙이는 것입니다. 단, 활성화 함수가 없으면 여러 층이 결국 행렬 하나로 합쳐집니다 (Day 2).&lt;/p&gt;&#x27;},
 {n:&#x27;⑤ 전단 (shear)&#x27;,T:[[1,1],[0,1]],code:&#x27;M = np.array([[1, 1], [0, 1]])&#x27;,ex:&#x27;&lt;p&gt;e₁ 은 그대로, e₂ 는 (1, 1) 로 기울어 — 정사각형이 &lt;b class=&quot;teal&quot;&gt;평행사변형&lt;/b&gt;이 됩니다. 밑변과 높이가 그대로라 &lt;b class=&quot;amber&quot;&gt;det = 1·1 − 1·0 = 1&lt;/b&gt;.&lt;/p&gt;&#x27;},
 {n:&#x27;⑥ 반사 (y축 뒤집기)&#x27;,T:[[-1,0],[0,1]],code:&#x27;M = np.array([[-1, 0], [0, 1]])&#x27;,ex:&#x27;&lt;p&gt;x 좌표의 부호를 바꾸면 거울에 비친 모양이 됩니다. 넓이는 같지만 &lt;b class=&quot;purple&quot; style=&quot;color:var(--purple)&quot;&gt;det = −1 &amp;lt; 0&lt;/b&gt; — 음수 행렬식은 &quot;앞뒤가 뒤집혔다&quot; 는 뜻입니다(e₁→e₂ 의 회전 방향이 반대).&lt;/p&gt;&#x27;},
 {n:&#x27;⑦ ⚠ 특이행렬 det=0&#x27;,T:[[1,2],[0.5,1]],code:&#x27;M = np.array([[1, 2], [0.5, 1]])&#x27;,ex:&#x27;&lt;p&gt;두 열 (1, 0.5) 와 (2, 1) 이 &lt;b class=&quot;red&quot;&gt;같은 방향&lt;/b&gt;(2열 = 1열 × 2)이라 평면 전체가 &lt;b class=&quot;red&quot;&gt;한 직선 위로 눌립니다&lt;/b&gt;. det = 1·1 − 2·0.5 = 0, 넓이가 0 이고 역행렬이 없습니다.&lt;/p&gt;&lt;p&gt;여러 점이 같은 점으로 겹치므로 정보가 사라진 것 — &lt;code&gt;np.linalg.inv(M)&lt;/code&gt; 은 &lt;code&gt;LinAlgError: Singular matrix&lt;/code&gt;.&lt;/p&gt;&#x27;},
];
$(&#x27;#presets&#x27;).innerHTML=P.map(p=&gt;`&lt;button&gt;${p.n}&lt;/button&gt;`).join(&#x27;&#x27;);
$(&#x27;#presets&#x27;).querySelectorAll(&#x27;button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;
  $(&#x27;#presets&#x27;).querySelectorAll(&#x27;button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;
  setStatus(&#x27;info&#x27;,&#x27;변환 적용 중…&#x27;);
  if(i&gt;0){await animateTo(I2,P[i].code,350);}
  const det=await animateTo(P[i].T,P[i].code,1000);
  const [c,m]=detMsg(det);setStatus(c,m);busy=false;});
[&#x27;a&#x27;,&#x27;b&#x27;,&#x27;c&#x27;,&#x27;d&#x27;].forEach((k,i)=&gt;$(&#x27;#s&#x27;+k).addEventListener(&#x27;input&#x27;,e=&gt;{if(busy)return;M[i&gt;&gt;1][i&amp;1]=+e.target.value;codeLabel=&#x27;M = np.array([[a, b], [c, d]])   # 슬라이더&#x27;;
  $(&#x27;#presets&#x27;).querySelectorAll(&#x27;button&#x27;).forEach(x=&gt;x.classList.remove(&#x27;active&#x27;));
  const det=draw();const [c,m]=detMsg(det);setStatus(c,m);
  $(&#x27;#explain&#x27;).innerHTML=&#x27;&lt;p&gt;슬라이더로 직접 바꿔 보세요. &lt;b class=&quot;red&quot;&gt;a, c&lt;/b&gt; 는 e₁ 의 도착점(1열), &lt;b class=&quot;blue&quot;&gt;b, d&lt;/b&gt; 는 e₂ 의 도착점(2열)을 움직입니다. ad = bc 가 되는 순간 det = 0 — 평면이 한 줄로 눌립니다.&lt;/p&gt;&lt;p&gt;신경망의 한 층 &lt;code&gt;X @ W&lt;/code&gt; 도 같은 일을 합니다. W 를 학습한다는 것은 &quot;데이터를 어떤 공간으로 옮길지&quot; 를 배우는 것입니다.&lt;/p&gt;&#x27;;}));
draw();
$(&#x27;#presets&#x27;).querySelectorAll(&#x27;button&#x27;)[1].click();
&lt;/script&gt;

&lt;body&gt;
&lt;div class=&quot;app&quot;&gt;
  &lt;h1&gt;미분 · 접선 · 수치미분&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;h 를 줄이면 &lt;b style=&quot;color:var(--red)&quot;&gt;할선(전방 차분)&lt;/b&gt;이 &lt;b style=&quot;color:var(--amber)&quot;&gt;접선&lt;/b&gt;에 다가갑니다. &lt;b style=&quot;color:var(--green)&quot;&gt;중앙 차분&lt;/b&gt;은 훨씬 빨리 다가가지만, h 가 &lt;b style=&quot;color:var(--red)&quot;&gt;너무 작으면 부동소수점 반올림 오차&lt;/b&gt;가 다시 커집니다. 그래프의 점을 드래그해 x₀ 를 옮길 수 있습니다.&lt;/p&gt;
  &lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill red&quot;&gt;전방: (f(x+h) − f(x)) / h&lt;/span&gt;&lt;span class=&quot;pill green&quot;&gt;중앙: (f(x+h) − f(x−h)) / 2h&lt;/span&gt;&lt;span class=&quot;pill amber&quot;&gt;h = 1e-4 (노트북 기본값)&lt;/span&gt;&lt;span class=&quot;pill blue&quot;&gt;h &amp;lt; 1e-8 → 반올림 오차 증가&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;함수와 접선&lt;/h2&gt;

    &lt;/div&gt;

      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;조절&lt;/h2&gt;
        &lt;div class=&quot;ctl&quot;&gt;
          &lt;div class=&quot;fsel&quot; id=&quot;fsel&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;sx&quot;&gt;x₀&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sx&quot; min=&quot;-5&quot; max=&quot;5&quot; step=&quot;0.01&quot;&gt;&lt;output id=&quot;ox&quot;&gt;&lt;/output&gt;&lt;/div&gt;
          &lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;sh&quot;&gt;h (log)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sh&quot; min=&quot;-15&quot; max=&quot;0&quot; step=&quot;0.1&quot;&gt;&lt;output id=&quot;oh&quot;&gt;&lt;/output&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;Python&lt;/h2&gt;&lt;div class=&quot;code&quot; id=&quot;code&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;상태&lt;/h2&gt;&lt;div class=&quot;status info&quot; id=&quot;status&quot;&gt;프리셋을 누르세요.&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;오차 표 (현재 x₀, JS double = NumPy float64)&lt;/h2&gt;&lt;table id=&quot;tbl&quot;&gt;&lt;/table&gt;&lt;/div&gt;

&lt;script&gt;
const $=s=&gt;document.querySelector(s);
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,ms));
const FN={
  q:{name:&#x27;0.1x² + 0.5x&#x27;,py:&#x27;f = lambda x: 0.1 * x ** 2 + 0.5 * x&#x27;,f:x=&gt;0.1*x*x+0.5*x,d:x=&gt;0.2*x+0.5,xr:[-6,6],yr:[-2,7],x0:1},
  s:{name:&#x27;x²&#x27;,py:&#x27;f = lambda x: x ** 2&#x27;,f:x=&gt;x*x,d:x=&gt;2*x,xr:[-4.5,4.5],yr:[-3,16],x0:3},
  n:{name:&#x27;sin x&#x27;,py:&#x27;f = np.sin&#x27;,f:Math.sin,d:Math.cos,xr:[-5,5],yr:[-2,2],x0:1},
};
let fk=&#x27;q&#x27;, x0=1, lh=-4, busy=false;
const HS=[1e-1,1e-2,1e-4,1e-6,1e-8,1e-10,1e-12,1e-15];
function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}
function fwd(F,x,h){return (F.f(x+h)-F.f(x))/h;}
function cen(F,x,h){return (F.f(x+h)-F.f(x-h))/(2*h);}
const e2=v=&gt;v===0?&#x27;0&#x27;:v.toExponential(2);
function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const g=c.getContext(&#x27;2d&#x27;);g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}
function drawPlot(){
  const F=FN[fk],c=$(&#x27;#plot&#x27;);const [g,W,H]=fitCanvas(c);
  const [xa,xb]=F.xr,[ya,yb]=F.yr;
  const X=x=&gt;(x-xa)/(xb-xa)*W, Y=y=&gt;H-(y-ya)/(yb-ya)*H;
  g.clearRect(0,0,W,H);
  g.strokeStyle=&#x27;#1a2540&#x27;;g.lineWidth=1;
  for(let x=Math.ceil(xa);x&lt;=xb;x++){g.beginPath();g.moveTo(X(x),0);g.lineTo(X(x),H);g.stroke();}
  for(let y=Math.ceil(ya);y&lt;=yb;y++){g.beginPath();g.moveTo(0,Y(y));g.lineTo(W,Y(y));g.stroke();}
  g.strokeStyle=&#x27;#3f5070&#x27;;g.lineWidth=1.5;g.beginPath();g.moveTo(X(0),0);g.lineTo(X(0),H);g.moveTo(0,Y(0));g.lineTo(W,Y(0));g.stroke();
  // f
  g.strokeStyle=&#x27;#60a5fa&#x27;;g.lineWidth=2.5;g.beginPath();
  for(let i=0;i&lt;=300;i++){const x=xa+(xb-xa)*i/300;i?g.lineTo(X(x),Y(F.f(x))):g.moveTo(X(x),Y(F.f(x)));}g.stroke();
  const h=Math.pow(10,lh), y0=F.f(x0);
  const line=(m,px,py,col,w,dash)=&gt;{g.save();g.setLineDash(dash||[]);g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(X(xa),Y(py+m*(xa-px)));g.lineTo(X(xb),Y(py+m*(xb-px)));g.stroke();g.restore();};
  line(F.d(x0),x0,y0,&#x27;#f5b942&#x27;,2);
  const mf=fwd(F,x0,h), mc=cen(F,x0,h);
  if(isFinite(mf))line(mf,x0,y0,&#x27;#f87171&#x27;,2,[7,5]);
  if(isFinite(mc))line(mc,x0-h,F.f(x0-h),&#x27;#4ade80&#x27;,2,[3,4]);
  const dot=(x,y,col,r)=&gt;{g.fillStyle=col;g.beginPath();g.arc(X(x),Y(y),r,0,7);g.fill();};
  if(h&gt;0.02){dot(x0+h,F.f(x0+h),&#x27;#f87171&#x27;,5);dot(x0-h,F.f(x0-h),&#x27;#4ade80&#x27;,5);
    g.fillStyle=&#x27;#8a9bb8&#x27;;g.font=&#x27;12px Consolas,monospace&#x27;;g.fillText(&#x27;x₀+h&#x27;,X(x0+h)+6,Y(F.f(x0+h))+14);g.fillText(&#x27;x₀−h&#x27;,X(x0-h)-36,Y(F.f(x0-h))+14);}
  dot(x0,y0,&#x27;#f5b942&#x27;,7);g.strokeStyle=&#x27;#0b1220&#x27;;g.lineWidth=2;g.stroke();
  g.fillStyle=&#x27;#dbe4f0&#x27;;g.font=&#x27;13px Consolas,monospace&#x27;;g.fillText(`f(x) = ${F.name}`,10,18);
}
function drawErr(mark){
  const F=FN[fk],c=$(&#x27;#errc&#x27;);const [g,W,H]=fitCanvas(c);
  const pad=34, X=l=&gt;pad+(-l)/15*(W-pad-8), Y=l=&gt;8+(1-l)/18*(H-28); // log err 1 .. -17
  g.clearRect(0,0,W,H);g.font=&#x27;11px Consolas,monospace&#x27;;g.fillStyle=&#x27;#5d7292&#x27;;
  for(let l=0;l&gt;=-15;l-=3){g.strokeStyle=&#x27;#1a2540&#x27;;g.beginPath();g.moveTo(X(l),8);g.lineTo(X(l),H-20);g.stroke();const tl=l===0?&#x27;1&#x27;:&#x27;1e&#x27;+l;g.fillText(tl,Math.min(X(l)-10,W-g.measureText(tl).width-2),H-6);}
  for(let l=0;l&gt;=-16;l-=4){g.strokeStyle=&#x27;#1a2540&#x27;;g.beginPath();g.moveTo(pad,Y(l));g.lineTo(W,Y(l));g.stroke();g.fillText(l===0?&#x27;1&#x27;:&#x27;1e&#x27;+l,0,Y(l)+4);}
  // 1e-8 boundary
  g.strokeStyle=&#x27;#f8717155&#x27;;g.setLineDash([4,4]);g.beginPath();g.moveTo(X(-8),8);g.lineTo(X(-8),H-20);g.stroke();g.setLineDash([]);
  const upto=mark==null?-15:mark;
  for(const [fn,col] of [[fwd,&#x27;#f87171&#x27;],[cen,&#x27;#4ade80&#x27;]]){
    g.strokeStyle=col;g.lineWidth=2;g.beginPath();let st=false;
    for(let l=0;l&gt;=upto-1e-9;l-=0.1){const e=Math.abs(fn(F,x0,Math.pow(10,l))-F.d(x0));const le=Math.max(-17,Math.log10(e||1e-17));st?g.lineTo(X(l),Y(le)):g.moveTo(X(l),Y(le));st=true;}
    g.stroke();
  }
  g.strokeStyle=&#x27;#f5b942&#x27;;g.lineWidth=1.5;g.beginPath();g.moveTo(X(lh),8);g.lineTo(X(lh),H-20);g.stroke();
  g.fillStyle=&#x27;#f5b942&#x27;;g.fillText(&#x27;h&#x27;,X(lh)&gt;W-14?X(lh)-12:X(lh)+4,18);
}
function drawTable(){
  const F=FN[fk],t=F.d(x0);
  const rows=HS.map(h=&gt;({h,ef:Math.abs(fwd(F,x0,h)-t),ec:Math.abs(cen(F,x0,h)-t)}));
  const bf=Math.min(...rows.map(r=&gt;r.ef)),bc=Math.min(...rows.map(r=&gt;r.ec));
  const cur=Math.pow(10,lh);
  $(&#x27;#tbl&#x27;).innerHTML=&#x27;&lt;tr&gt;&lt;th&gt;h&lt;/th&gt;&lt;th&gt;전방 오차&lt;/th&gt;&lt;th&gt;중앙 오차&lt;/th&gt;&lt;/tr&gt;&#x27;+rows.map(r=&gt;`&lt;tr class=&quot;${Math.abs(Math.log10(r.h)-lh)&lt;0.05?&#x27;cur&#x27;:&#x27;&#x27;}&quot;&gt;&lt;td&gt;${r.h.toExponential(0)}&lt;/td&gt;&lt;td class=&quot;fw ${r.ef===bf?&#x27;best&#x27;:&#x27;&#x27;}&quot;&gt;${e2(r.ef)}&lt;/td&gt;&lt;td class=&quot;ce ${r.ec===bc?&#x27;best&#x27;:&#x27;&#x27;}&quot;&gt;${e2(r.ec)}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;);
}
function drawCode(){
  const F=FN[fk],h=Math.pow(10,lh);
  const mf=fwd(F,x0,h),mc=cen(F,x0,h),t=F.d(x0);
  $(&#x27;#code&#x27;).innerHTML=`${F.py}\ndef numerical_diff(f, x, h=1e-4):\n    return (f(x + h) - f(x - h)) / (2 * h)\n\nx0, h = ${+x0.toFixed(2)}, ${h.toExponential(1)}\n(f(x0+h) - f(x0)) / h      &lt;span class=&quot;c&quot;&gt;# 전방&lt;/span&gt;  &lt;span class=&quot;g&quot;&gt;${mf.toPrecision(10)}&lt;/span&gt;\nnumerical_diff(f, x0, h)   &lt;span class=&quot;c&quot;&gt;# 중앙&lt;/span&gt;  &lt;span class=&quot;g&quot;&gt;${mc.toPrecision(10)}&lt;/span&gt;\n&lt;span class=&quot;c&quot;&gt;# 참값 f&#x27;(x0) = ${t.toPrecision(10)}&lt;/span&gt;`;
}
function render(mark){
  $(&#x27;#sx&#x27;).value=x0;$(&#x27;#ox&#x27;).textContent=x0.toFixed(2);$(&#x27;#sh&#x27;).value=lh;$(&#x27;#oh&#x27;).textContent=Math.pow(10,lh).toExponential(1);
  drawPlot();drawErr(mark);drawTable();drawCode();
}
function autoStatus(){
  const F=FN[fk],h=Math.pow(10,lh),t=F.d(x0);const ef=Math.abs(fwd(F,x0,h)-t),ec=Math.abs(cen(F,x0,h)-t);
  if(lh&lt;-8.5&amp;&amp;(ec&gt;1e-9||ef&gt;1e-8))setStatus(&#x27;warn&#x27;,`h = ${h.toExponential(1)} — 너무 작습니다. f(x+h) − f(x) 에서 &lt;b&gt;유효숫자가 사라져&lt;/b&gt; 오차가 커집니다 (전방 ${e2(ef)}, 중앙 ${e2(ec)}).`);
  else setStatus(ec&lt;=ef?&#x27;ok&#x27;:&#x27;info&#x27;,`h = ${h.toExponential(1)}: 전방 오차 ${e2(ef)}, 중앙 오차 ${e2(ec)}`);
}
function selF(k){fk=k;x0=FN[k].x0;$(&#x27;#sx&#x27;).min=FN[k].xr[0]+0.5;$(&#x27;#sx&#x27;).max=FN[k].xr[1]-0.5;
  $(&#x27;#fsel&#x27;).querySelectorAll(&#x27;button&#x27;).forEach(b=&gt;b.classList.toggle(&#x27;sel&#x27;,b.dataset.k===k));}
$(&#x27;#fsel&#x27;).innerHTML=&#x27;&lt;span style=&quot;font-size:13px;color:var(--dim);align-self:center&quot;&gt;f(x):&lt;/span&gt;&#x27;+Object.entries(FN).map(([k,F])=&gt;`&lt;button data-k=&quot;${k}&quot;&gt;${F.name}&lt;/button&gt;`).join(&#x27;&#x27;);
$(&#x27;#fsel&#x27;).querySelectorAll(&#x27;button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(busy)return;selF(b.dataset.k);render();autoStatus();});
$(&#x27;#sx&#x27;).oninput=e=&gt;{if(busy)return;x0=+e.target.value;render();autoStatus();};
$(&#x27;#sh&#x27;).oninput=e=&gt;{if(busy)return;lh=+e.target.value;render();autoStatus();};
// drag x0 on plot
let drag=false;
const plotX=e=&gt;{const r=$(&#x27;#plot&#x27;).getBoundingClientRect(),F=FN[fk];const x=F.xr[0]+(e.clientX-r.left)/r.width*(F.xr[1]-F.xr[0]);return Math.max(+$(&#x27;#sx&#x27;).min,Math.min(+$(&#x27;#sx&#x27;).max,x));};
$(&#x27;#plot&#x27;).addEventListener(&#x27;pointerdown&#x27;,e=&gt;{if(busy)return;drag=true;$(&#x27;#plot&#x27;).setPointerCapture(e.pointerId);x0=+plotX(e).toFixed(2);render();autoStatus();});
$(&#x27;#plot&#x27;).addEventListener(&#x27;pointermove&#x27;,e=&gt;{if(!drag)return;x0=+plotX(e).toFixed(2);render();autoStatus();});
$(&#x27;#plot&#x27;).addEventListener(&#x27;pointerup&#x27;,()=&gt;drag=false);
window.addEventListener(&#x27;resize&#x27;,()=&gt;render());
async function sweepH(from,to,ms){const n=Math.round(Math.abs(to-from)/0.1);for(let i=0;i&lt;=n;i++){lh=+(from+(to-from)*i/n).toFixed(2);render();await sleep(ms);}}

const P=[
 {n:&#x27;① 할선 → 접선 (h: 1 → 0.001)&#x27;,ex:&#x27;&lt;p&gt;미분의 정의 &lt;code&gt;f\&#x27;(x) = lim (f(x+h) − f(x)) / h&lt;/code&gt; 를 그대로 그립니다. h 가 줄어들수록 &lt;b class=&quot;red&quot;&gt;빨간 할선&lt;/b&gt;이 &lt;b class=&quot;amber&quot;&gt;노란 접선&lt;/b&gt;에 붙습니다. 접선의 기울기가 곧 &quot;x₀ 에서의 순간 변화율&quot; 입니다.&lt;/p&gt;&lt;p&gt;노트북 6교시 마지막 셀 — x=1 에서 0.1x² + 0.5x 의 접선 기울기 0.7.&lt;/p&gt;&#x27;,
  run:async()=&gt;{selF(&#x27;q&#x27;);x0=1;setStatus(&#x27;info&#x27;,&#x27;h 를 1 에서 0.001 까지 줄입니다…&#x27;);await sweepH(0,-3,70);
   setStatus(&#x27;ok&#x27;,`h = 0.001: 할선 기울기 ${fwd(FN.q,1,1e-3).toFixed(4)} ≈ 접선 기울기 f&#x27;(1) = 0.2·1 + 0.5 = 0.7`);}},
 {n:&#x27;② 전방 vs 중앙 차분 (h = 0.5)&#x27;,ex:&#x27;&lt;p&gt;전방 차분은 x₀ 와 x₀+h 를 잇고, 중앙 차분은 &lt;b class=&quot;green&quot;&gt;x₀−h 와 x₀+h&lt;/b&gt; 를 잇습니다. 2차 함수에서는 중앙 차분 할선이 &lt;b class=&quot;amber&quot;&gt;접선과 정확히 평행&lt;/b&gt; — 오차가 이론상 0 입니다.&lt;/p&gt;&lt;p&gt;일반 함수에서도 전방 오차는 O(h), 중앙 오차는 &lt;b class=&quot;green&quot;&gt;O(h²)&lt;/b&gt;. h = 1e-4 이면 1e-4 vs 1e-8 수준 — 그래서 &lt;code&gt;numerical_diff&lt;/code&gt; 는 중앙 차분을 씁니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{selF(&#x27;q&#x27;);x0=1;lh=Math.log10(0.5);render();
   const F=FN.q;setStatus(&#x27;ok&#x27;,`h = 0.5 — 전방 기울기 ${fwd(F,1,.5).toFixed(4)} (오차 ${Math.abs(fwd(F,1,.5)-.7).toFixed(4)} = 0.1·h), 중앙 기울기 ${cen(F,1,.5).toFixed(4)} (오차 ≈ 0)`);}},
 {n:&#x27;③ sin x — O(h) vs O(h²)&#x27;,ex:&#x27;&lt;p&gt;2차 함수가 아니면 중앙 차분도 오차가 있지만 &lt;b class=&quot;green&quot;&gt;h 를 10배 줄이면 오차는 100배&lt;/b&gt; 줄어듭니다(O(h²)). 전방 차분은 10배만 줄어듭니다(O(h)). 아래 log-log 그래프에서 &lt;b class=&quot;green&quot;&gt;초록 선의 기울기가 빨간 선의 2배&lt;/b&gt;인 것을 확인하세요.&lt;/p&gt;&lt;p&gt;노트북 확인 셀 &lt;code&gt;numerical_diff(np.sin, 0.0) ≈ 1.0&lt;/code&gt;.&lt;/p&gt;&#x27;,
  run:async()=&gt;{selF(&#x27;n&#x27;);x0=1;setStatus(&#x27;info&#x27;,&#x27;sin x, x₀ = 1 에서 h 를 1 → 1e-6 으로…&#x27;);await sweepH(0,-6,45);
   setStatus(&#x27;ok&#x27;,`h = 1e-6: 전방 오차 ${e2(Math.abs(fwd(FN.n,1,1e-6)-Math.cos(1)))}, 중앙 오차 ${e2(Math.abs(cen(FN.n,1,1e-6)-Math.cos(1)))}`);}},
 {n:&#x27;④ ⚠ h → 1e-15: 반올림 오차 폭발&#x27;,ex:&#x27;&lt;p&gt;h 가 1e-8 보다 작아지면 f(x+h) 와 f(x) 가 &lt;b class=&quot;red&quot;&gt;유효숫자 16자리 중 거의 전부가 같아져&lt;/b&gt; 뺄셈에서 정보가 사라집니다(catastrophic cancellation). 그 작은 차이를 다시 작은 h 로 나누니 오차가 &lt;b class=&quot;red&quot;&gt;다시 커집니다&lt;/b&gt; — 그래프가 V 자인 이유.&lt;/p&gt;&lt;p&gt;그래서 실무 기본값은 &lt;b class=&quot;amber&quot;&gt;h = 1e-4&lt;/b&gt;. 이 &lt;code&gt;numerical_gradient&lt;/code&gt; 는 Day 3 &lt;b class=&quot;teal&quot;&gt;gradient check&lt;/b&gt; 에서 역전파 결과를 검증할 때 다시 씁니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{selF(&#x27;s&#x27;);x0=3;setStatus(&#x27;info&#x27;,&#x27;f = x², x = 3 — 노트북 오차 표와 같은 조건. h 를 1 → 1e-15 로…&#x27;);
   for(let i=0;i&lt;=150;i++){lh=+(-i/10).toFixed(1);render(lh);if(lh===-8)setStatus(&#x27;warn&#x27;,&#x27;h = 1e-8 통과 — 여기서부터 반올림 오차가 지배합니다…&#x27;);await sleep(28);}
   const F=FN.s;setStatus(&#x27;warn&#x27;,`h = 1e-15: 중앙 오차 ${e2(Math.abs(cen(F,3,1e-15)-6))}, 전방 오차 ${e2(Math.abs(fwd(F,3,1e-15)-6))} — 1e-4 일 때(${e2(Math.abs(cen(F,3,1e-4)-6))})보다 훨씬 큽니다.`);}},
 {n:&#x27;⑤ 노트북 기본값 h = 1e-4&#x27;,ex:&#x27;&lt;p&gt;h = 1e-4 는 &lt;b class=&quot;green&quot;&gt;절단 오차(h 가 커서 생기는 오차)&lt;/b&gt;와 &lt;b class=&quot;red&quot;&gt;반올림 오차(h 가 작아서 생기는 오차)&lt;/b&gt;의 균형점 근처입니다. float64 에서 중앙 차분 오차는 대략 1e-8 ~ 1e-11 수준.&lt;/p&gt;&lt;p&gt;참고: &lt;code&gt;np.float32(1e-50)&lt;/code&gt; 은 아예 0.0 이 됩니다 — float32 에서는 h 를 더 크게 잡아야 합니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{selF(&#x27;s&#x27;);x0=3;const s=lh;await sweepH(s,-4,20);lh=-4;render();
   setStatus(&#x27;ok&#x27;,`h = 1e-4: numerical_diff(f, 3.0) = ${cen(FN.s,3,1e-4).toPrecision(12)} ≈ 6.0 (오차 ${e2(Math.abs(cen(FN.s,3,1e-4)-6))})`);}},
];
$(&#x27;#presets&#x27;).innerHTML=P.map(p=&gt;`&lt;button&gt;${p.n}&lt;/button&gt;`).join(&#x27;&#x27;);
$(&#x27;#presets&#x27;).querySelectorAll(&#x27;button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;$(&#x27;#presets&#x27;).querySelectorAll(&#x27;button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;await P[i].run();render();busy=false;});
selF(&#x27;q&#x27;);render();
$(&#x27;#presets&#x27;).querySelector(&#x27;button&#x27;).click();
&lt;/script&gt;
&lt;/body&gt;

<section class="lesson" id="d1-8" data-title="D1-8 경사하강 등고선"><iframe title="D1-8 경사하강 등고선" loading="lazy" srcdoc="&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;ko&quot;&gt;

&lt;style&gt;

&lt;body&gt;
&lt;div class=&quot;app&quot;&gt;
  &lt;h1&gt;경사하강법 — f(x, y) = x² + 3y²&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;현재 위치에서 &lt;b style=&quot;color:var(--red)&quot;&gt;−∇f&lt;/b&gt; 방향(가장 빨리 내려가는 방향)으로 &lt;b style=&quot;color:var(--amber)&quot;&gt;η(학습률)&lt;/b&gt;만큼 이동을 반복합니다. 캔버스를 클릭하면 출발점이 바뀝니다 (기본 (−4, 2) — 미니 프로젝트와 같음).&lt;/p&gt;
  &lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill blue&quot;&gt;∇f = (2x, 6y)&lt;/span&gt;&lt;span class=&quot;pill amber&quot;&gt;p ← p − η ∇f(p)&lt;/span&gt;&lt;span class=&quot;pill teal&quot;&gt;y ← (1 − 6η) y&lt;/span&gt;&lt;span class=&quot;pill red&quot;&gt;|1 − 6η| &amp;gt; 1 ⇔ η &amp;gt; 1/3 → 발산&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;등고선 · 경로&lt;/h2&gt;
      &lt;canvas id=&quot;cv&quot;&gt;&lt;/canvas&gt;
      &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:#2dd4bf&quot;&gt;&lt;/i&gt;등고선 f = 상수&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#f5b942&quot;&gt;&lt;/i&gt;경로&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#f87171&quot;&gt;&lt;/i&gt;−∇f (현재 점)&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#c084fc&quot;&gt;&lt;/i&gt;−∇f 벡터장&lt;/span&gt;&lt;/div&gt;
      &lt;canvas id=&quot;yc&quot;&gt;&lt;/canvas&gt;
      &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:#60a5fa&quot;&gt;&lt;/i&gt;x 좌표&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#f5b942&quot;&gt;&lt;/i&gt;y 좌표&lt;/span&gt;&lt;span&gt;— 스텝별 (지그재그 = 부호가 바뀜)&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;조절&lt;/h2&gt;
        &lt;div class=&quot;row&quot; id=&quot;lrBtns&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;lr&quot;&gt;η (lr)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;lr&quot; min=&quot;0.01&quot; max=&quot;0.4&quot; step=&quot;0.005&quot;&gt;&lt;output id=&quot;olr&quot;&gt;&lt;/output&gt;&lt;/div&gt;
        &lt;div class=&quot;row&quot;&gt;
          &lt;button class=&quot;run&quot; id=&quot;stepBtn&quot;&gt;한 스텝&lt;/button&gt;&lt;button id=&quot;playBtn&quot;&gt;자동 재생&lt;/button&gt;&lt;button id=&quot;resetBtn&quot;&gt;처음부터&lt;/button&gt;
          &lt;label class=&quot;chk&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;quiv&quot;&gt; −∇f 벡터장 (quiver)&lt;/label&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;현재 상태&lt;/h2&gt;&lt;div class=&quot;kv&quot; id=&quot;kv&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;Python&lt;/h2&gt;&lt;div class=&quot;code&quot; id=&quot;code&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;상태&lt;/h2&gt;&lt;div class=&quot;status info&quot; id=&quot;status&quot;&gt;프리셋을 누르세요.&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel explain&quot; id=&quot;explain&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
const $=s=&gt;document.querySelector(s);
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,ms));
const XR=[-5,5], YR=[-4,4];
const f=(x,y)=&gt;x*x+3*y*y, grad=(x,y)=&gt;[2*x,6*y];
let start=[-4,2], lr=0.1, path=[[-4,2]], timer=null, busy=false, quiver=false, MAXS=60;
const fx=v=&gt;{if(!isFinite(v))return &#x27;inf&#x27;;const a=Math.abs(v);return a!==0&amp;&amp;(a&gt;=1e5||a&lt;1e-4)?v.toExponential(2):v.toFixed(4);};
function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}
function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const g=c.getContext(&#x27;2d&#x27;);g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}
function arrowTo(g,x1,y1,x2,y2,col,w,hs){
  const a=Math.atan2(y2-y1,x2-x1);g.strokeStyle=col;g.fillStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();
  g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-hs*Math.cos(a-0.45),y2-hs*Math.sin(a-0.45));g.lineTo(x2-hs*Math.cos(a+0.45),y2-hs*Math.sin(a+0.45));g.closePath();g.fill();
}
function draw(){
  const [g,W,H]=fitCanvas($(&#x27;#cv&#x27;));
  const X=x=&gt;(x-XR[0])/(XR[1]-XR[0])*W, Y=y=&gt;H-(y-YR[0])/(YR[1]-YR[0])*H;
  g.clearRect(0,0,W,H);
  // grid
  g.strokeStyle=&#x27;#1a2540&#x27;;g.lineWidth=1;
  for(let x=XR[0];x&lt;=XR[1];x++){g.beginPath();g.moveTo(X(x),0);g.lineTo(X(x),H);g.stroke();}
  for(let y=YR[0];y&lt;=YR[1];y++){g.beginPath();g.moveTo(0,Y(y));g.lineTo(W,Y(y));g.stroke();}
  g.strokeStyle=&#x27;#3f5070&#x27;;g.beginPath();g.moveTo(X(0),0);g.lineTo(X(0),H);g.moveTo(0,Y(0));g.lineTo(W,Y(0));g.stroke();
  // contours: ellipses x²/c + y²/(c/3) = 1
  const levels=[0.25,1,2.5,5,8,12,17,23,30,38,48,60];
  levels.forEach((c,i)=&gt;{g.strokeStyle=`rgba(45,212,191,${0.55-i*0.03})`;g.lineWidth=1.2;g.beginPath();
    const rx=Math.sqrt(c),ry=Math.sqrt(c/3);g.ellipse(X(0),Y(0),rx/(XR[1]-XR[0])*W,ry/(YR[1]-YR[0])*H,0,0,Math.PI*2);g.stroke();});
  g.fillStyle=&#x27;#4ade80&#x27;;g.beginPath();g.arc(X(0),Y(0),4,0,7);g.fill();
  g.font=&#x27;11px Consolas,monospace&#x27;;g.fillStyle=&#x27;#5d7292&#x27;;g.fillText(&#x27;min (0,0)&#x27;,X(0)+6,Y(0)+14);
  // quiver
  if(quiver){
    for(let x=-4.5;x&lt;=4.51;x+=1)for(let y=-3.5;y&lt;=3.51;y+=1){
      const [gx,gy]=grad(x,y);const s=0.05;const ex=x-s*gx,ey=y-s*gy;
      arrowTo(g,X(x),Y(y),X(ex),Y(ey),&#x27;rgba(192,132,252,.75)&#x27;,1.3,6);
    }
  }
  // path
  g.strokeStyle=&#x27;#f5b942&#x27;;g.lineWidth=2;g.beginPath();
  path.forEach((p,i)=&gt;{const px=X(Math.max(-1e4,Math.min(1e4,p[0]))),py=Y(Math.max(-1e4,Math.min(1e4,p[1])));i?g.lineTo(px,py):g.moveTo(px,py);});g.stroke();
  path.forEach((p,i)=&gt;{g.fillStyle=i===0?&#x27;#60a5fa&#x27;:&#x27;#f5b942&#x27;;g.beginPath();g.arc(X(p[0]),Y(p[1]),i===0?5:3,0,7);g.fill();});
  // current -grad arrow
  const c=path[path.length-1];
  if(isFinite(c[0])&amp;&amp;Math.abs(c[0])&lt;50&amp;&amp;Math.abs(c[1])&lt;50){
    const [gx,gy]=grad(c[0],c[1]);const ex=c[0]-lr*gx,ey=c[1]-lr*gy;
    if(Math.hypot(gx,gy)&gt;1e-6)arrowTo(g,X(c[0]),Y(c[1]),X(ex),Y(ey),&#x27;#f87171&#x27;,2.5,10);
    g.strokeStyle=&#x27;#dbe4f0&#x27;;g.lineWidth=2;g.beginPath();g.arc(X(c[0]),Y(c[1]),6,0,7);g.stroke();
  }
  drawY();
}
function drawY(){
  const [g,W,H]=fitCanvas($(&#x27;#yc&#x27;));g.clearRect(0,0,W,H);
  const n=Math.max(path.length,10), ymax=Math.min(Math.max(4.5,...path.map(p=&gt;Math.max(Math.abs(p[0]),Math.abs(p[1])))),12);
  const X=i=&gt;8+i/(n-1)*(W-16), Y=v=&gt;H/2-Math.max(-ymax,Math.min(ymax,v))/ymax*(H/2-8);
  g.strokeStyle=&#x27;#3f5070&#x27;;g.beginPath();g.moveTo(0,H/2);g.lineTo(W,H/2);g.stroke();
  g.fillStyle=&#x27;#5d7292&#x27;;g.font=&#x27;11px Consolas,monospace&#x27;;g.fillText(&#x27;±&#x27;+ymax.toFixed(1),4,12);g.fillText(&#x27;step&#x27;,W-34,H-4);
  for(const [k,col] of [[0,&#x27;#60a5fa&#x27;],[1,&#x27;#f5b942&#x27;]]){g.strokeStyle=col;g.lineWidth=2;g.beginPath();path.forEach((p,i)=&gt;i?g.lineTo(X(i),Y(p[k])):g.moveTo(X(i),Y(p[k])));g.stroke();
    path.forEach((p,i)=&gt;{g.fillStyle=col;g.beginPath();g.arc(X(i),Y(p[k]),2.2,0,7);g.fill();});}
}
function info(){
  const c=path[path.length-1],k=path.length-1;const [gx,gy]=isFinite(c[0])?grad(c[0],c[1]):[NaN,NaN];
  const ry=1-6*lr, rx=1-2*lr;
  $(&#x27;#kv&#x27;).innerHTML=`&lt;span&gt;step&lt;/span&gt;&lt;b&gt;${k}&lt;/b&gt;&lt;span&gt;p = (x, y)&lt;/span&gt;&lt;b&gt;(${fx(c[0])}, ${fx(c[1])})&lt;/b&gt;&lt;span&gt;f(p)&lt;/span&gt;&lt;b style=&quot;color:var(--green)&quot;&gt;${fx(f(c[0],c[1]))}&lt;/b&gt;&lt;span&gt;∇f = (2x, 6y)&lt;/span&gt;&lt;b&gt;(${fx(gx)}, ${fx(gy)})&lt;/b&gt;`+
   `&lt;span&gt;x 배율 1−2η&lt;/span&gt;&lt;b style=&quot;color:${Math.abs(rx)&gt;1?&#x27;var(--red)&#x27;:&#x27;var(--blue)&#x27;}&quot;&gt;${rx.toFixed(3)}&lt;/b&gt;&lt;span&gt;y 배율 1−6η&lt;/span&gt;&lt;b style=&quot;color:${Math.abs(ry)&gt;1?&#x27;var(--red)&#x27;:(ry&lt;0?&#x27;var(--amber)&#x27;:&#x27;var(--blue)&#x27;)}&quot;&gt;${ry.toFixed(3)}&lt;/b&gt;`;
  $(&#x27;#code&#x27;).innerHTML=`def grad_f(p):\n    return np.array([2 * p[0], 6 * p[1]])\n\np = np.array([${start[0].toFixed(1)}, ${start[1].toFixed(1)}])\nlr = ${lr}\nfor _ in range(steps):\n    p = p - lr * grad_f(p)\n&lt;span class=&quot;c&quot;&gt;# y ← y − ${lr}·6y = (1 − 6·${lr}) y = ${ry.toFixed(3)} · y&lt;/span&gt;\n&lt;span class=&quot;g&quot;&gt;# step ${k}: p = [${fx(c[0])}, ${fx(c[1])}]  f = ${fx(f(c[0],c[1]))}&lt;/span&gt;`;
  $(&#x27;#lr&#x27;).value=lr;$(&#x27;#olr&#x27;).textContent=lr.toFixed(3);
  $(&#x27;#lrBtns&#x27;).querySelectorAll(&#x27;button&#x27;).forEach(b=&gt;b.classList.toggle(&#x27;sel&#x27;,+b.dataset.v===lr));
}
function stepStatus(){
  const c=path[path.length-1],k=path.length-1;const ry=1-6*lr;const fv=f(c[0],c[1]);
  if(Math.abs(ry)&gt;1+1e-12){
    setStatus(&#x27;warn&#x27;,`⚠ 발산 — y ← (1 − 6η) y = (${ry.toFixed(2)}) · y. |${ry.toFixed(2)}| &amp;gt; 1 이라 y 가 매 스텝 ${Math.abs(ry).toFixed(2)}배로 커지며 부호가 뒤집힙니다. η &amp;lt; 1/3 ≈ 0.333 이어야 수렴. (step ${k}, f = ${fx(fv)})`);return;}
  if(Math.abs(Math.abs(ry)-1)&lt;1e-9){setStatus(&#x27;warn&#x27;,`경계값 η = 1/3: 1 − 6η = −1 → y 가 크기를 유지한 채 영원히 진동합니다. (step ${k})`);return;}
  if(fv&lt;1e-6){setStatus(&#x27;ok&#x27;,`수렴 — step ${k} 에서 f = ${fx(fv)}. 최소점 (0, 0) 에 도착했습니다.`);return;}
  if(ry&lt;0)setStatus(&#x27;info&#x27;,`step ${k}: 1 − 6η = ${ry.toFixed(2)} &amp;lt; 0 → y 부호가 매 스텝 바뀜(지그재그), 크기는 ${Math.abs(ry).toFixed(2)}배씩 줄어 수렴 중. f = ${fx(fv)}`);
  else setStatus(&#x27;info&#x27;,`step ${k}: f = ${fx(fv)} — 매 스텝 x 는 ${(1-2*lr).toFixed(2)}배, y 는 ${ry.toFixed(2)}배.`);
}
function reset(){stopPlay();path=[start.slice()];draw();info();setStatus(&#x27;info&#x27;,`출발점 (${start[0].toFixed(1)}, ${start[1].toFixed(1)}), η = ${lr}. &quot;한 스텝&quot; 또는 &quot;자동 재생&quot;. 빨간 화살표 = 이번 스텝의 이동 −η∇f.`);}
function step(){
  const c=path[path.length-1];
  if(path.length&gt;MAXS||!isFinite(c[0])||Math.hypot(c[0],c[1])&gt;1e6){stopPlay();stepStatus();return false;}
  const [gx,gy]=grad(c[0],c[1]);path.push([c[0]-lr*gx,c[1]-lr*gy]);
  draw();info();stepStatus();
  const n=path[path.length-1];
  if(f(n[0],n[1])&lt;1e-10||path.length&gt;MAXS||Math.hypot(n[0],n[1])&gt;1e6){stopPlay();return false;}
  return true;
}
function stopPlay(){clearInterval(timer);timer=null;$(&#x27;#playBtn&#x27;).textContent=&#x27;자동 재생&#x27;;}
function play(){if(timer){stopPlay();return;}const c=path[path.length-1];if(path.length&gt;MAXS||f(c[0],c[1])&lt;1e-10||Math.hypot(c[0],c[1])&gt;1e6)reset();$(&#x27;#playBtn&#x27;).textContent=&#x27;정지&#x27;;if(step())timer=setInterval(()=&gt;{if(!step())stopPlay();},280);}
function setLr(v){lr=+v;$(&#x27;#presets&#x27;).querySelectorAll(&#x27;button&#x27;).forEach(x=&gt;x.classList.remove(&#x27;active&#x27;));reset();}
$(&#x27;#lrBtns&#x27;).innerHTML=&#x27;&lt;span style=&quot;font-size:13px;color:var(--dim)&quot;&gt;η:&lt;/span&gt;&#x27;+[0.01,0.1,0.3,0.35].map(v=&gt;`&lt;button data-v=&quot;${v}&quot;&gt;${v}&lt;/button&gt;`).join(&#x27;&#x27;);
$(&#x27;#lrBtns&#x27;).querySelectorAll(&#x27;button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(busy)return;setLr(b.dataset.v);});
$(&#x27;#lr&#x27;).oninput=e=&gt;{if(busy)return;setLr(e.target.value);};
$(&#x27;#stepBtn&#x27;).onclick=()=&gt;{if(busy)return;stopPlay();step();};
$(&#x27;#playBtn&#x27;).onclick=()=&gt;{if(busy)return;play();};
$(&#x27;#resetBtn&#x27;).onclick=()=&gt;{if(busy)return;reset();};
$(&#x27;#quiv&#x27;).onchange=e=&gt;{quiver=e.target.checked;draw();};
$(&#x27;#cv&#x27;).addEventListener(&#x27;click&#x27;,e=&gt;{if(busy)return;const r=$(&#x27;#cv&#x27;).getBoundingClientRect();
  start=[+(XR[0]+(e.clientX-r.left)/r.width*(XR[1]-XR[0])).toFixed(1),+(YR[1]-(e.clientY-r.top)/r.height*(YR[1]-YR[0])).toFixed(1)];reset();});
window.addEventListener(&#x27;resize&#x27;,draw);

async function runTo(n,ms){for(let i=0;i&lt;n;i++){if(!step())break;await sleep(ms);}}
const P=[
 {n:&#x27;① η = 0.1 — 정상 수렴&#x27;,lr:0.1,ex:&#x27;&lt;p&gt;매 스텝 x 는 (1 − 2·0.1) = 0.8배, y 는 (1 − 6·0.1) = &lt;b class=&quot;teal&quot;&gt;0.4배&lt;/b&gt;로 줄어듭니다. 빨간 화살표 −∇f 는 항상 &lt;b class=&quot;amber&quot;&gt;등고선에 수직&lt;/b&gt;으로, 가장 가파르게 내려가는 방향입니다.&lt;/p&gt;&lt;p&gt;미니 프로젝트 과제 3: &lt;code&gt;gradient_descent(grad_f, [-4, 2], lr=0.1, steps=100)&lt;/code&gt; 은 노름 &amp;lt; 1e-3 까지 수렴합니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{await runTo(30,160);}},
 {n:&#x27;② η = 0.01 — 너무 느림&#x27;,lr:0.01,ex:&#x27;&lt;p&gt;y 배율 1 − 0.06 = 0.94, x 배율 0.98 — 한 번에 움직이는 거리 η∇f 가 너무 작아 &lt;b class=&quot;red&quot;&gt;30스텝으로는 최소점에 닿지 못합니다&lt;/b&gt;(과제 5-1).&lt;/p&gt;&lt;p&gt;학습률이 작으면 안정적이지만 느립니다 — 실제 신경망 학습에서 loss 가 거의 줄지 않을 때 먼저 의심할 것.&lt;/p&gt;&#x27;,
  run:async()=&gt;{await runTo(30,110);}},
 {n:&#x27;③ η = 0.3 — y 지그재그&#x27;,lr:0.3,ex:&#x27;&lt;p&gt;y 갱신식 &lt;code&gt;y ← y − η·6y = (1 − 6η) y&lt;/code&gt;. η = 0.3 이면 1 − 1.8 = &lt;b class=&quot;amber&quot;&gt;−0.8&lt;/b&gt; → 매 스텝 &lt;b class=&quot;amber&quot;&gt;y 부호가 바뀌며&lt;/b&gt;(지그재그) 크기는 0.8배씩 줄어 결국 수렴합니다(과제 5-2).&lt;/p&gt;&lt;p&gt;아래 작은 그래프에서 노란 y 좌표가 위아래로 번갈아 튀는 것을 확인하세요. x 는 0.4배로 부드럽게 줄어듭니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{await runTo(30,170);}},
 {n:&#x27;④ ⚠ η = 0.35 — 발산&#x27;,lr:0.35,ex:&#x27;&lt;p&gt;1 − 6·0.35 = &lt;b class=&quot;red&quot;&gt;−1.1&lt;/b&gt; — y 크기가 매 스텝 1.1배로 커지며 부호가 뒤집혀 &lt;b class=&quot;red&quot;&gt;발산&lt;/b&gt;합니다. 수렴 조건 |1 − 6η| &amp;lt; 1 ⇔ &lt;b class=&quot;amber&quot;&gt;0 &amp;lt; η &amp;lt; 1/3&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;x 방향 조건(η &amp;lt; 1)보다 y 방향이 더 엄격 — &lt;b class=&quot;teal&quot;&gt;가장 가파른 방향이 학습률 상한을 정합니다&lt;/b&gt;. 이 문제를 푸는 것이 Day 4 Momentum · Adam 입니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{await runTo(30,170);}},
 {n:&#x27;⑤ −∇f 벡터장 (quiver)&#x27;,lr:0.1,quiv:true,ex:&#x27;&lt;p&gt;각 점에서 −∇f = (−2x, −6y) 를 화살표로 그렸습니다. 모든 화살표가 &lt;b class=&quot;green&quot;&gt;최소점 (0, 0)&lt;/b&gt; 쪽을 향하지만, y 성분이 3배 커서 &lt;b class=&quot;amber&quot;&gt;세로 방향이 더 가파릅니다&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;노트북 6교시 &lt;code&gt;plt.quiver(..., -G[:,0], -G[:,1])&lt;/code&gt; 그림과 같은 내용 — 그때는 x₀² + x₁² 라 화살표가 정확히 원점을 향했습니다. 기울기 계산은 Day 3 gradient check 에서 다시 씁니다.&lt;/p&gt;&#x27;,

$(&#x27;#presets&#x27;).innerHTML=P.map(p=&gt;`&lt;button&gt;${p.n}&lt;/button&gt;`).join(&#x27;&#x27;);
$(&#x27;#presets&#x27;).querySelectorAll(&#x27;button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;stopPlay();
  lr=P[i].lr;start=[-4,2];quiver=!!P[i].quiv;$(&#x27;#quiv&#x27;).checked=quiver;reset();

  await P[i].run();busy=false;});
info();draw();
$(&#x27;#presets&#x27;).querySelector(&#x27;button&#x27;).click();
&lt;/script&gt;

&lt;body&gt;
&lt;div class=&quot;app&quot;&gt;
  &lt;h1&gt;확률 분포 · 표준화&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;표본을 많이 뽑을수록 &lt;b style=&quot;color:var(--blue)&quot;&gt;히스토그램&lt;/b&gt;이 이론 분포 모양에, 표본 &lt;b style=&quot;color:var(--amber)&quot;&gt;평균 · 표준편차&lt;/b&gt;가 참값에 다가갑니다. &lt;b style=&quot;color:var(--green)&quot;&gt;표준화 z = (x − μ) / σ&lt;/b&gt; 는 어떤 분포든 평균 0, 표준편차 1 로 옮깁니다.&lt;/p&gt;
  &lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill blue&quot;&gt;rng.uniform(-1, 1, n)&lt;/span&gt;&lt;span class=&quot;pill teal&quot;&gt;rng.normal(0, 1, n)&lt;/span&gt;&lt;span class=&quot;pill amber&quot;&gt;rng.normal(170, 8, n)&lt;/span&gt;&lt;span class=&quot;pill green&quot;&gt;z = (x − x.mean()) / x.std()&lt;/span&gt;&lt;span class=&quot;pill red&quot;&gt;seed 고정 → 같은 난수&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;히스토그램&lt;/h2&gt;
      &lt;canvas id=&quot;cv&quot;&gt;&lt;/canvas&gt;
      &lt;div class=&quot;legend&quot; id=&quot;legend&quot;&gt;&lt;/div&gt;
      &lt;h2 style=&quot;margin-top:16px&quot;&gt;통계&lt;/h2&gt;&lt;div class=&quot;kv&quot; id=&quot;kv&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;조절&lt;/h2&gt;
        &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;lbl&quot;&gt;분포&lt;/span&gt;&lt;span id=&quot;dsel&quot; class=&quot;row&quot; style=&quot;margin:0&quot;&gt;&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;lbl&quot;&gt;표본 수&lt;/span&gt;&lt;span id=&quot;nsel&quot; class=&quot;row&quot; style=&quot;margin:0&quot;&gt;&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;lbl&quot;&gt;변환&lt;/span&gt;&lt;button id=&quot;zBtn&quot;&gt;표준화 z&lt;/button&gt;&lt;button id=&quot;rBtn&quot;&gt;원래 x&lt;/button&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;Python&lt;/h2&gt;&lt;div class=&quot;code&quot; id=&quot;code&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;상태&lt;/h2&gt;&lt;div class=&quot;status info&quot; id=&quot;status&quot;&gt;프리셋을 누르세요.&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel explain&quot; id=&quot;explain&quot;&gt;&lt;/div&gt;
&lt;/div&gt;

&lt;script&gt;
const $=s=&gt;document.querySelector(s);
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,ms));
/* seeded RNG: mulberry32 + Box-Muller */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a&gt;&gt;&gt;15,1|a);t=t+Math.imul(t^t&gt;&gt;&gt;7,61|t)^t;return((t^t&gt;&gt;&gt;14)&gt;&gt;&gt;0)/4294967296;};}
let rand=mulberry32(42), spare=null;
function normal(){if(spare!==null){const s=spare;spare=null;return s;}let u=0;while(u===0)u=rand();const v=rand();const r=Math.sqrt(-2*Math.log(u));spare=r*Math.sin(2*Math.PI*v);return r*Math.cos(2*Math.PI*v);}
function reseed(){rand=mulberry32(42);spare=null;}
const DIST={
  u:{name:&#x27;Uniform(-1, 1)&#x27;,py:&#x27;x = rng.uniform(-1, 1, n)&#x27;,gen:()=&gt;-1+2*rand(),mu:0,sd:1/Math.sqrt(3),xr:[-1.5,1.5],pdf:x=&gt;(x&gt;=-1&amp;&amp;x&lt;=1)?0.5:0,bins:30},
  n:{name:&#x27;Normal(0, 1)&#x27;,py:&#x27;x = rng.normal(0, 1, n)&#x27;,gen:()=&gt;normal(),mu:0,sd:1,xr:[-4.5,4.5],pdf:x=&gt;Math.exp(-x*x/2)/Math.sqrt(2*Math.PI),bins:36},
  h:{name:&#x27;키 Normal(170, 8)&#x27;,py:&#x27;heights = rng.normal(170, 8, n)   # cm&#x27;,gen:()=&gt;170+8*normal(),mu:170,sd:8,xr:[134,206],pdf:x=&gt;Math.exp(-(((x-170)/8)**2)/2)/(8*Math.sqrt(2*Math.PI)),bins:36},
};
let dk=&#x27;n&#x27;, data=[], view={lo:-4.5,hi:4.5}, mode=&#x27;x&#x27;, busy=false, diceMode=false, dice=[];
const mean=a=&gt;a.reduce((s,v)=&gt;s+v,0)/a.length;
const std=a=&gt;{const m=mean(a);return Math.sqrt(a.reduce((s,v)=&gt;s+(v-m)**2,0)/a.length);};
function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}
function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const g=c.getContext(&#x27;2d&#x27;);g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}
/* draw histogram of arr in window [lo,hi] with bins of fixed width bw (in arr units) */
function drawHist(arr,lo,hi,bw,pdf,opts={}){
  const [g,W,H]=fitCanvas($(&#x27;#cv&#x27;));g.clearRect(0,0,W,H);
  const padL=36,padB=24,pw=W-padL-8,ph=H-padB-10;
  const X=v=&gt;padL+(v-lo)/(hi-lo)*pw;
  // ticks
  g.font=&#x27;11px Consolas,monospace&#x27;;g.fillStyle=&#x27;#5d7292&#x27;;g.strokeStyle=&#x27;#1a2540&#x27;;
  const span=hi-lo, maxT=Math.max(4,Math.floor(pw/55));let step=[0.25,0.5,1,2,5,10,20,50,100].find(s=&gt;span/s&lt;=maxT)||200;
  for(let t=Math.ceil(lo/step)*step;t&lt;=hi+1e-9;t+=step){g.beginPath();g.moveTo(X(t),10);g.lineTo(X(t),10+ph);g.stroke();g.fillText(+t.toFixed(1),X(t)-8,H-6);}
  g.strokeStyle=&#x27;#3f5070&#x27;;g.beginPath();g.moveTo(padL,10+ph);g.lineTo(W-8,10+ph);g.stroke();
  if(!arr.length){g.fillStyle=&#x27;#5d7292&#x27;;g.font=&#x27;14px sans-serif&#x27;;g.fillText(&#x27;표본 수 버튼을 누르세요&#x27;,W/2-70,H/2);return;}
  const o=opts.origin??0;
  const k0=Math.floor((lo-o)/bw),k1=Math.ceil((hi-o)/bw);
  const cnt=new Map();arr.forEach(v=&gt;{const k=Math.floor((v-o)/bw);cnt.set(k,(cnt.get(k)||0)+1);});
  const dens=k=&gt;(cnt.get(k)||0)/(arr.length*bw);
  let ymax=0;for(let k=k0;k&lt;=k1;k++)ymax=Math.max(ymax,dens(k));
  if(pdf){for(let i=0;i&lt;=200;i++){ymax=Math.max(ymax,pdf(lo+(hi-lo)*i/200));}}
  ymax*=1.1;const Y=d=&gt;10+ph-d/ymax*ph;
  g.fillStyle=opts.color||&#x27;rgba(96,165,250,.55)&#x27;;g.strokeStyle=opts.stroke||&#x27;#60a5fa&#x27;;g.lineWidth=1;
  for(let k=k0;k&lt;=k1;k++){const d=dens(k);if(!d)continue;const x0=X(o+k*bw),x1=X(o+(k+1)*bw);g.fillRect(x0+0.5,Y(d),Math.max(1,x1-x0-1),10+ph-Y(d));g.strokeRect(x0+0.5,Y(d),Math.max(1,x1-x0-1),10+ph-Y(d));}
  if(pdf){g.strokeStyle=&#x27;#f5b942&#x27;;g.lineWidth=2;g.beginPath();for(let i=0;i&lt;=300;i++){const v=lo+(hi-lo)*i/300;const y=Y(pdf(v));i?g.lineTo(X(v),y):g.moveTo(X(v),y);}g.stroke();}
  // mean &amp; ±std
  const m=mean(arr),s=std(arr);
  g.strokeStyle=&#x27;#4ade80&#x27;;g.lineWidth=2;g.beginPath();g.moveTo(X(m),10);g.lineTo(X(m),10+ph);g.stroke();
  g.setLineDash([5,4]);g.strokeStyle=&#x27;#2dd4bf&#x27;;g.lineWidth=1.5;g.beginPath();g.moveTo(X(m-s),10);g.lineTo(X(m-s),10+ph);g.moveTo(X(m+s),10);g.lineTo(X(m+s),10+ph);g.stroke();g.setLineDash([]);
  g.fillStyle=&#x27;#4ade80&#x27;;g.font=&#x27;12px Consolas,monospace&#x27;;g.fillText(&#x27;μ&#x27;,X(m)+4,22);g.fillStyle=&#x27;#2dd4bf&#x27;;g.fillText(&#x27;−σ&#x27;,X(m-s)+3,36);g.fillText(&#x27;+σ&#x27;,X(m+s)+3,36);
  g.fillStyle=&#x27;#5d7292&#x27;;g.fillText(&#x27;density&#x27;,2,20);
}
function drawDice(){
  const [g,W,H]=fitCanvas($(&#x27;#cv&#x27;));g.clearRect(0,0,W,H);
  const padL=36,padB=24,pw=W-padL-8,ph=H-padB-10;const n=dice.length;
  const cnt=[0,0,0,0,0,0];dice.forEach(v=&gt;cnt[v-1]++);
  const pr=cnt.map(c=&gt;n?c/n:0);const ymax=0.35;const Y=p=&gt;10+ph-p/ymax*ph;
  g.font=&#x27;11px Consolas,monospace&#x27;;g.fillStyle=&#x27;#5d7292&#x27;;
  [0,0.1,0.2,0.3].forEach(p=&gt;{g.strokeStyle=&#x27;#1a2540&#x27;;g.beginPath();g.moveTo(padL,Y(p));g.lineTo(W-8,Y(p));g.stroke();g.fillText(p.toFixed(1),4,Y(p)+4);});
  const bw=pw/6;
  pr.forEach((p,i)=&gt;{g.fillStyle=&#x27;rgba(96,165,250,.55)&#x27;;g.strokeStyle=&#x27;#60a5fa&#x27;;g.fillRect(padL+i*bw+8,Y(p),bw-16,10+ph-Y(p));g.strokeRect(padL+i*bw+8,Y(p),bw-16,10+ph-Y(p));
    g.fillStyle=&#x27;#dbe4f0&#x27;;g.font=&#x27;13px Consolas,monospace&#x27;;g.fillText(String(i+1),padL+i*bw+bw/2-4,H-6);
    g.fillStyle=&#x27;#8a9bb8&#x27;;g.font=&#x27;11px Consolas,monospace&#x27;;if(n)g.fillText(p.toFixed(3),padL+i*bw+bw/2-16,Y(p)-4);});
  g.strokeStyle=&#x27;#f5b942&#x27;;g.lineWidth=2;g.setLineDash([6,4]);g.beginPath();g.moveTo(padL,Y(1/6));g.lineTo(W-8,Y(1/6));g.stroke();g.setLineDash([]);
  g.fillStyle=&#x27;#f5b942&#x27;;g.font=&#x27;12px Consolas,monospace&#x27;;g.fillText(&#x27;1/6 ≈ 0.1667&#x27;,W-110,Y(1/6)-6);
  return pr;
}
function legend(){
  $(&#x27;#legend&#x27;).innerHTML=diceMode?&#x27;&lt;span&gt;&lt;i style=&quot;background:#60a5fa&quot;&gt;&lt;/i&gt;추정 확률 np.mean(dice == k)&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#f5b942&quot;&gt;&lt;/i&gt;참값 1/6&lt;/span&gt;&#x27;
   :&#x27;&lt;span&gt;&lt;i style=&quot;background:#60a5fa&quot;&gt;&lt;/i&gt;히스토그램 (density)&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#f5b942&quot;&gt;&lt;/i&gt;이론 pdf&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#4ade80&quot;&gt;&lt;/i&gt;표본 평균 μ&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#2dd4bf&quot;&gt;&lt;/i&gt;μ ± σ&lt;/span&gt;&#x27;;
}
function stats(){
  if(diceMode){const n=dice.length;const cnt=[0,0,0,0,0,0];dice.forEach(v=&gt;cnt[v-1]++);const pr=cnt.map(c=&gt;n?c/n:0);const me=Math.max(...pr.map(p=&gt;Math.abs(p-1/6)));
    $(&#x27;#kv&#x27;).innerHTML=`&lt;span&gt;n&lt;/span&gt;&lt;b&gt;${n.toLocaleString()}&lt;/b&gt;&lt;span&gt;prob&lt;/span&gt;&lt;b&gt;[${pr.map(p=&gt;p.toFixed(3)).join(&#x27;, &#x27;)}]&lt;/b&gt;&lt;span&gt;prob.sum()&lt;/span&gt;&lt;b&gt;${n?pr.reduce((a,b)=&gt;a+b,0).toFixed(3):&#x27;-&#x27;}&lt;/b&gt;&lt;span&gt;max |p − 1/6|&lt;/span&gt;&lt;b style=&quot;color:${me&lt;0.01?&#x27;var(--green)&#x27;:&#x27;var(--amber)&#x27;}&quot;&gt;${n?me.toFixed(4):&#x27;-&#x27;}&lt;/b&gt;`;
    $(&#x27;#code&#x27;).innerHTML=`dice = rng.integers(1, 7, ${n})      &lt;span class=&quot;c&quot;&gt;# 1~6&lt;/span&gt;\nprob = np.array([np.mean(dice == k) for k in range(1, 7)])\n&lt;span class=&quot;g&quot;&gt;# [${pr.map(p=&gt;p.toFixed(3)).join(&#x27;, &#x27;)}]&lt;/span&gt;\nnp.allclose(prob, 1/6, atol=0.01)   &lt;span class=&quot;g&quot;&gt;# ${n?(me&lt;0.01?&#x27;True&#x27;:&#x27;False&#x27;):&#x27;-&#x27;}&lt;/span&gt;`;return;}
  const D=DIST[dk],n=data.length;const m=n?mean(data):NaN,s=n?std(data):NaN;
  const z=mode===&#x27;z&#x27;&amp;&amp;n;
  const zm=z?mean(data.map(v=&gt;(v-m)/s)):NaN,zs=z?std(data.map(v=&gt;(v-m)/s)):NaN;
  const fmt=v=&gt;isNaN(v)?&#x27;-&#x27;:(Math.abs(v)&lt;5e-13?&#x27;0.0000&#x27;:v.toFixed(4));
  $(&#x27;#kv&#x27;).innerHTML=`&lt;span&gt;분포&lt;/span&gt;&lt;b&gt;${D.name}&lt;/b&gt;&lt;span&gt;n&lt;/span&gt;&lt;b&gt;${n.toLocaleString()}&lt;/b&gt;&lt;span&gt;x.mean()&lt;/span&gt;&lt;b style=&quot;color:var(--green)&quot;&gt;${fmt(m)}&lt;/b&gt;&lt;span&gt;x.std()&lt;/span&gt;&lt;b style=&quot;color:var(--teal)&quot;&gt;${fmt(s)}&lt;/b&gt;&lt;span&gt;참값 μ, σ&lt;/span&gt;&lt;b&gt;${D.mu}, ${+D.sd.toFixed(4)}${dk===&#x27;u&#x27;?&#x27; (=1/√3)&#x27;:&#x27;&#x27;}&lt;/b&gt;`+
   (z?`&lt;span&gt;z.mean()&lt;/span&gt;&lt;b style=&quot;color:var(--green)&quot;&gt;${fmt(zm)}&lt;/b&gt;&lt;span&gt;z.std()&lt;/span&gt;&lt;b style=&quot;color:var(--teal)&quot;&gt;${fmt(zs)}&lt;/b&gt;`:&#x27;&#x27;);
  $(&#x27;#code&#x27;).innerHTML=`rng = np.random.default_rng(42)\n${D.py.replace(&#x27;, n)&#x27;,`, ${n})`)}\nx.mean(), x.std()   &lt;span class=&quot;g&quot;&gt;# ${fmt(m)}, ${fmt(s)}&lt;/span&gt;`+
   (mode===&#x27;z&#x27;?`\n\ndef standardize(x):\n    return (x - x.mean()) / x.std()\nz = standardize(x)\nz.mean(), z.std()   &lt;span class=&quot;g&quot;&gt;# ${fmt(zm)}, ${fmt(zs)}&lt;/span&gt;`:&#x27;&#x27;);
}
function render(){
  legend();
  if(diceMode){drawDice();stats();return;}
  const D=DIST[dk];
  if(mode===&#x27;z&#x27;){drawHist(data.map(v=&gt;(v-mean(data))/std(data)),-4.5,4.5,0.25,DIST.n.pdf,{color:&#x27;rgba(74,222,128,.45)&#x27;,stroke:&#x27;#4ade80&#x27;});}
  else drawHist(data,view.lo,view.hi,(D.xr[1]-D.xr[0])/D.bins,D.pdf,{origin:D.mu});
  stats();
}
function sel(){
  $(&#x27;#dsel&#x27;).querySelectorAll(&#x27;button&#x27;).forEach(b=&gt;b.classList.toggle(&#x27;sel&#x27;,!diceMode&amp;&amp;b.dataset.k===dk));
  $(&#x27;#nsel&#x27;).querySelectorAll(&#x27;button&#x27;).forEach(b=&gt;b.classList.toggle(&#x27;sel&#x27;,+b.dataset.n===(diceMode?dice.length:data.length)));
  $(&#x27;#zBtn&#x27;).classList.toggle(&#x27;sel&#x27;,mode===&#x27;z&#x27;);$(&#x27;#rBtn&#x27;).classList.toggle(&#x27;sel&#x27;,mode===&#x27;x&#x27;);
  $(&#x27;#zBtn&#x27;).disabled=diceMode||!data.length;$(&#x27;#rBtn&#x27;).disabled=diceMode;
}
function setDist(k){diceMode=false;dk=k;data=[];mode=&#x27;x&#x27;;reseed();const D=DIST[k];view={lo:D.xr[0],hi:D.xr[1]};render();sel();}
async function grow(n,ms=250){
  if(diceMode){reseed();const tgt=n;const stepN=[...new Set([1,2,3,5,10,20,50,100,200,500,1000,2000,5000,10000,20000,50000,100000].filter(v=&gt;v&lt;tgt).concat([tgt]))];
    dice=[];for(const t of stepN){while(dice.length&lt;t)dice.push(1+Math.floor(rand()*6));render();sel();await sleep(ms*0.6);}return;}
  reseed();data=[];mode=&#x27;x&#x27;;const D=DIST[dk];view={lo:D.xr[0],hi:D.xr[1]};
  const marks=[...new Set([5,10,30,100,300,1000,3000,10000].filter(v=&gt;v&lt;n).concat([n]))];
  for(const t of marks){while(data.length&lt;t)data.push(D.gen());render();sel();await sleep(ms);}
  const m=mean(data),s=std(data);
  setStatus(n&gt;=1000?&#x27;ok&#x27;:&#x27;info&#x27;,`n = ${n.toLocaleString()}: 평균 ${m.toFixed(3)} (참 ${D.mu}), 표준편차 ${s.toFixed(3)} (참 ${+D.sd.toFixed(3)})${n&lt;100?&#x27; — 표본이 적어 모양이 들쭉날쭉합니다.&#x27;:&#x27;&#x27;}`);
}
async function standardizeAnim(){
  if(!data.length)return;const D=DIST[dk];const m=mean(data),s=std(data);
  const bw=(D.xr[1]-D.xr[0])/D.bins;
  const N=36;
  setStatus(&#x27;info&#x27;,`① x − μ : 평균 ${m.toFixed(2)} 만큼 왼쪽으로 이동…`);
  // phase 1 shift
  // 고정 창: 원래 범위와 이동 후 범위를 모두 포함 → 막대가 미끄러지는 것이 보임
  const lo0=Math.min(view.lo,view.lo-m), hi0=Math.max(view.hi,view.hi-m);
  for(let i=1;i&lt;=N;i++){const t=i/N,e=t&lt;.5?2*t*t:1-Math.pow(-2*t+2,2)/2;const sh=m*e;
    drawHist(data.map(v=&gt;v-sh),lo0,hi0,bw,null,{origin:D.mu-sh});await sleep(22);}
  await sleep(300);
  // phase 2 scale: 데이터는 ÷k, 창은 [lo0,hi0] → [-4.5,4.5]
  setStatus(&#x27;info&#x27;,`② ÷ σ : 표준편차 ${s.toFixed(2)} 로 나눠 폭을 1 로…`);
  for(let i=1;i&lt;=N;i++){const t=i/N,e=t&lt;.5?2*t*t:1-Math.pow(-2*t+2,2)/2;const k=1+(s-1)*e;
    const wl=lo0+(-4.5-lo0)*e, wh=hi0+(4.5-hi0)*e;
    drawHist(data.map(v=&gt;(v-m)/k),wl,wh,bw/k,null,{origin:0});await sleep(22);}
  mode=&#x27;z&#x27;;render();sel();
  const z=data.map(v=&gt;(v-m)/s);
  setStatus(&#x27;ok&#x27;,`z.mean() = ${Math.abs(mean(z))&lt;5e-13?&#x27;0.0000&#x27;:mean(z).toExponential(1)}, z.std() = ${std(z).toFixed(4)} — 모양은 그대로, 위치와 폭만 바뀌었습니다 (Normal(0,1) 곡선과 겹침).`);
}
$(&#x27;#dsel&#x27;).innerHTML=Object.entries(DIST).map(([k,D])=&gt;`&lt;button data-k=&quot;${k}&quot;&gt;${D.name}&lt;/button&gt;`).join(&#x27;&#x27;)+&#x27;&lt;button data-k=&quot;dice&quot;&gt;주사위&lt;/button&gt;&#x27;;
$(&#x27;#nsel&#x27;).innerHTML=[10,100,1000,10000].map(n=&gt;`&lt;button data-n=&quot;${n}&quot;&gt;${n.toLocaleString()}&lt;/button&gt;`).join(&#x27;&#x27;);

window.addEventListener(&#x27;resize&#x27;,render);

  run:async()=&gt;{setDist(&#x27;n&#x27;);for(const n of [10,100,1000,10000]){await grow(n,170);await sleep(500);}}},

  run:async()=&gt;{setDist(&#x27;h&#x27;);await grow(1000,150);await sleep(900);await standardizeAnim();}},

<script>
const ids = [...document.querySelectorAll('nav button')].map(b => b.dataset.id);
function fit(fr) {
  try {
    const d = fr.contentDocument; if (!d || !d.body) return;
    fr.style.height = Math.max(600, d.documentElement.scrollHeight) + 'px';
  } catch (e) {}
}
function show(id, push) {
  if (!ids.includes(id)) id = ids[0];
  document.querySelectorAll('section.lesson').forEach(s => s.classList.toggle('active', s.id === id));
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-current', b.dataset.id === id ? 'true' : 'false'));
  const sec = document.getElementById(id);
  document.title = sec.dataset.title + ' — Neural Network Day 1';
  const fr = sec.querySelector('iframe');
  fr.loading = 'eager'; fit(fr);
  if (push) history.replaceState(null, '', '#' + id);
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('section.lesson iframe').forEach(fr => {
  fr.addEventListener('load', () => {
    fit(fr);
    try {
      new ResizeObserver(() => fit(fr)).observe(fr.contentDocument.body);
      fr.contentDocument.addEventListener('keydown', key);   // iframe 안에서도 ← → 동작
    } catch (e) {}
  });
});
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.id, true));
function key(e) {
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const cur = ids.indexOf(location.hash.slice(1) || ids[0]);
  if (e.key === 'ArrowRight' && cur < ids.length - 1) show(ids[cur + 1], true);
  if (e.key === 'ArrowLeft' && cur > 0) show(ids[cur - 1], true);
}
document.addEventListener('keydown', key);
window.addEventListener('resize', () => document.querySelectorAll('section.lesson.active iframe').forEach(fit));
show(location.hash.slice(1), false);
</script>
