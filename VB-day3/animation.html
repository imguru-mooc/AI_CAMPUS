&lt;div class=&quot;app&quot;&gt;
&lt;h1&gt;정확도 vs 속도&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;1교시 — Day 2 의 ResNet-20 은 CIFAR-10 test &lt;b class=&quot;rv&quot; data-r=&quot;acc_r20&quot;&gt;&lt;/b&gt; &lt;span class=&quot;tag&quot;&gt;실행 예&lt;/span&gt; (Day 2 사전 실행 0.8587). 그런데 &lt;b style=&quot;color:var(--amber)&quot;&gt;현장 장치에서 1장에 몇 ms?&lt;/b&gt; 오늘은 정확도와 함께 &lt;b&gt;파라미터 · MAC · 지연시간&lt;/b&gt;을 같이 봅니다.&lt;/p&gt;

&lt;div class=&quot;grid&quot;&gt;
  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;CPU 지연시간 vs 프레임 예산&lt;/h2&gt;
    &lt;div class=&quot;sl&quot;&gt;&lt;label&gt;FPS&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sF&quot; min=&quot;5&quot; max=&quot;60&quot; value=&quot;30&quot;&gt;&lt;output id=&quot;oF&quot;&gt;&lt;/output&gt;&lt;/div&gt;

&lt;script&gt;
const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,ms));
let busy=false, timer=null;
function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}

function arrow(g,x0,y0,x1,y1,c,w=2,hs=8){const a=Math.atan2(y1-y0,x1-x0),L=Math.hypot(x1-x0,y1-y0);if(L&lt;1)return;hs=Math.min(hs,L*0.6);g.strokeStyle=c;g.fillStyle=c;g.lineWidth=w;g.beginPath();g.moveTo(x0,y0);g.lineTo(x1-Math.cos(a)*hs*0.7,y1-Math.sin(a)*hs*0.7);g.stroke();

const rs=v=&gt;rOk(v)?String(v):&#x27;—&#x27;;
function rn(v){if(!rOk(v))return null;const x=parseFloat(v);return isFinite(x)?x:null;}
function rl(v){if(!rOk(v))return null;try{const a=JSON.parse(v);return Array.isArray(a)&amp;&amp;a.length&amp;&amp;a.every(x=&gt;isFinite(+x))?a.map(Number):null;}catch(e){return null;}}
function fillR(R){$$(&#x27;[data-r]&#x27;).forEach(e=&gt;{const v=R[e.dataset.r];e.textContent=rs(v);e.classList.toggle(&#x27;miss&#x27;,!rOk(v));e.title=rOk(v)?&#x27;실행 예 (vb3/results.json)&#x27;:&#x27;아직 실행 결과 없음 — Colab 실행 후 채워짐&#x27;;});}
const pct=(a,b)=&gt;(100*a/b).toFixed(1)+&#x27;%&#x27;;
// 가로 막대: items=[{l,v,c,t}] (v=null → &quot;—&quot;), o={max,ml,bh,gap,log}
function hbars(cv,items,o={}){const [g,W,H]=fitCanvas(cv);g.clearRect(0,0,W,H);const ml=o.ml??110,bh=o.bh??24,gap=o.gap??12,mx=o.max??Math.max(1e-9,...items.map(i=&gt;i.v??0));
  g.font=&#x27;12px Consolas,monospace&#x27;;const bw=W-ml-12;
  items.forEach((it,i)=&gt;{const y=8+i*(bh+gap);g.globalAlpha=it.a??1;g.fillStyle=&#x27;#8a9bb8&#x27;;g.textAlign=&#x27;left&#x27;;g.fillText(it.l,4,y+bh/2+4);
    if(it.v==null){g.strokeStyle=&#x27;#2a3a5c&#x27;;g.setLineDash([4,4]);g.strokeRect(ml,y,bw*0.3,bh);g.setLineDash([]);g.fillStyle=&#x27;#5d7292&#x27;;g.fillText(it.t??&#x27;— (실행 결과 없음)&#x27;,ml+8,y+bh/2+4);g.globalAlpha=1;return;}
    const w=Math.max(2,bw*(o.log?Math.log10(Math.max(1,it.v))/Math.log10(mx):Math.min(1,it.v/mx)));g.fillStyle=it.c;g.fillRect(ml,y,w,bh);
    const t=it.t??fmt(it.v);const tw=g.measureText(t).width;g.fillStyle=w&gt;tw+12?&#x27;#0b1220&#x27;:it.c;g.fillText(t,w&gt;tw+12?ml+6:Math.min(ml+w+6,W-tw-4),y+bh/2+4);g.globalAlpha=1;});
  return {g,W,H,ml,bw,mx,bh,gap};}

let ci=64,co=64,K=3,H=56,C=256;
function calc(){const p=ci*co*K*K,mac=p*H*H,act=co*H*H;return {p,mac,act,pm:p*4/1e6,am:act*4/1e6};}
function drawCalc(){$(&#x27;#oCi&#x27;).textContent=ci;$(&#x27;#oCo&#x27;).textContent=co;$(&#x27;#oK&#x27;).textContent=K+&#x27;×&#x27;+K;$(&#x27;#oH&#x27;).textContent=H;[&#x27;sCi&#x27;,&#x27;sCo&#x27;,&#x27;sK&#x27;,&#x27;sH&#x27;].forEach((s,i)=&gt;$(&#x27;#&#x27;+s).value=[ci,co,K,H][i]);
  const c=calc();$(&#x27;#ckv&#x27;).innerHTML=`&lt;span&gt;params&lt;/span&gt;&lt;b&gt;${ci}·${co}·${K}² = ${fmt(c.p)}&lt;/b&gt;&lt;span&gt;MAC&lt;/span&gt;&lt;b&gt;params × ${H}·${H} = ${fmt(c.mac)}&lt;/b&gt;&lt;span&gt;param 메모리&lt;/span&gt;&lt;b style=&quot;color:var(--teal)&quot;&gt;${c.pm.toFixed(3)} MB&lt;/b&gt;&lt;span&gt;활성화 메모리&lt;/span&gt;&lt;b style=&quot;color:var(--purple)&quot;&gt;${co}·${H}·${H} × 4 B = ${c.am.toFixed(3)} MB&lt;/b&gt;`;
  hbars($(&#x27;#mem&#x27;),[{l:&#x27;param MB&#x27;,v:c.pm,c:&#x27;#2dd4bf&#x27;,t:c.pm.toFixed(3)+&#x27; MB&#x27;},{l:&#x27;act MB&#x27;,v:c.am,c:&#x27;#c084fc&#x27;,t:c.am.toFixed(3)+&#x27; MB&#x27;}],{ml:70,bh:30,gap:16,max:Math.max(c.pm,c.am)*1.05});
  return c;}
[[&#x27;sCi&#x27;,v=&gt;ci=v],[&#x27;sCo&#x27;,v=&gt;co=v],[&#x27;sK&#x27;,v=&gt;K=v],[&#x27;sH&#x27;,v=&gt;H=v]].forEach(([id,f])=&gt;$(&#x27;#&#x27;+id).addEventListener(&#x27;input&#x27;,e=&gt;{if(busy)return;f(+e.target.value);const c=drawCalc();setStatus(&#x27;info&#x27;,`params ${fmt(c.p)} · MAC ${fmt(c.mac)} · param ${c.pm.toFixed(3)} MB · act ${c.am.toFixed(3)} MB`);}));
// ---- bottleneck ----
let bstep=3;
function bn(c){const q=c/4,a=c*q,b=9*q*q,d=q*c;return {basic:18*c*c,a,b,d,sum:a+b+d};}
function drawBn(){$(&#x27;#oC&#x27;).textContent=C;$(&#x27;#sC&#x27;).value=C;const v=bn(C),[g,W,Hc]=fitCanvas($(&#x27;#bn&#x27;));g.clearRect(0,0,W,Hc);g.font=&#x27;12px Consolas,monospace&#x27;;
  const half=W/2,mxh=Hc-70,unit=mxh/C;
  const col=(x,c,lab,clr)=&gt;{const h=Math.max(6,c*unit);g.fillStyle=clr;g.fillRect(x-14,40+(mxh-h)/2,28,h);g.fillStyle=&#x27;#8a9bb8&#x27;;g.textAlign=&#x27;center&#x27;;g.fillText(lab,x,Hc-12);g.fillText(c,x,40+(mxh-h)/2-6);};
  // basic
  g.fillStyle=&#x27;#f87171&#x27;;g.textAlign=&#x27;left&#x27;;g.fillText(&#x27;basic: 3×3 → 3×3&#x27;,10,16);
  const bx=[30,30+(half-60)/2,half-30];col(bx[0],C,&#x27;in&#x27;,&#x27;#5d7292&#x27;);col(bx[1],C,&#x27;3×3&#x27;,&#x27;#f87171&#x27;);col(bx[2],C,&#x27;3×3&#x27;,&#x27;#f87171&#x27;);
  arrow(g,bx[0]+16,40+mxh/2,bx[1]-16,40+mxh/2,&#x27;#8a9bb8&#x27;,1.5,7);arrow(g,bx[1]+16,40+mxh/2,bx[2]-16,40+mxh/2,&#x27;#8a9bb8&#x27;,1.5,7);
  // bottleneck
  g.fillStyle=&#x27;#2dd4bf&#x27;;g.textAlign=&#x27;left&#x27;;g.fillText(&#x27;bottleneck: 1×1 → 3×3 → 1×1&#x27;,half+10,16);
  const xs=[half+24,half+24+(half-48)/3,half+24+2*(half-48)/3,W-24];const ch=[C,C/4,C/4,C],lb=[&#x27;in&#x27;,&#x27;1×1&#x27;,&#x27;3×3&#x27;,&#x27;1×1&#x27;];
  xs.forEach((x,i)=&gt;{g.globalAlpha=i&lt;=bstep?1:.2;col(x,ch[i],lb[i],i===0?&#x27;#5d7292&#x27;:&#x27;#2dd4bf&#x27;);if(i)arrow(g,xs[i-1]+16,40+mxh/2,x-16,40+mxh/2,&#x27;#8a9bb8&#x27;,1.5,7);g.globalAlpha=1;});
  g.textAlign=&#x27;left&#x27;;
  const r=v.basic/v.sum;
  $(&#x27;#bfm&#x27;).innerHTML=`basic = 2 · 9 · C² = 18 · ${C}² = &lt;b&gt;${fmt(v.basic)}&lt;/b&gt;&lt;br&gt;bottleneck = C·C/4 + 9·(C/4)² + C/4·C = ${fmt(v.a)} + ${fmt(v.b)} + ${fmt(v.d)} = &lt;b style=&quot;color:var(--teal)&quot;&gt;${fmt(v.sum)}&lt;/b&gt; (= 17C²/16)&lt;br&gt;비율 = 18 / (17/16) = &lt;b&gt;${r.toFixed(1)}배&lt;/b&gt; — C 와 무관 · 위치마다 (H·W 곱하면 MAC, 여기선 가중치 수)`;return v;}
$(&#x27;#sC&#x27;).addEventListener(&#x27;input&#x27;,e=&gt;{if(busy)return;C=+e.target.value;bstep=3;const v=drawBn();setStatus(&#x27;info&#x27;,`C = ${C}: basic ${fmt(v.basic)} vs bottleneck ${fmt(v.sum)} → ${(v.basic/v.sum).toFixed(1)}배`);});
// ---- 1×1 mixing ----
const NC=8,NO=2;let mpos=0;const MXW=[[.6,-.2,.3,.1,-.4,.2,.5,-.1],[-.3,.4,.1,.6,.2,-.5,.1,.3]];
function chv(c,p){return ((c*7+p*13)%10)/10;}
function drawMx(){const [g,W,Hc]=fitCanvas($(&#x27;#mx&#x27;));g.clearRect(0,0,W,Hc);g.font=&#x27;11px Consolas,monospace&#x27;;const NP=6,cw=Math.min(26,(W*0.42)/NP),x0=12,y0=16;
  for(let c=0;c&lt;NC;c++)for(let p=0;p&lt;NP;p++){const v=chv(c,p);g.fillStyle=`rgba(96,165,250,${0.15+v*0.8})`;g.fillRect(x0+p*cw,y0+c*20,cw-2,18);if(p===mpos){g.strokeStyle=&#x27;#f5b942&#x27;;g.lineWidth=2;g.strokeRect(x0+p*cw,y0+c*20,cw-2,18);g.lineWidth=1;}}
  g.fillStyle=&#x27;#8a9bb8&#x27;;g.fillText(`입력 ${NC}채널 × 위치 ${NP}`,x0,Hc-4);
  const ox=Math.min(W-12-NP*cw,x0+NP*cw+Math.max(80,W*0.25));const out=[];for(let o=0;o&lt;NO;o++){for(let p=0;p&lt;NP;p++){if(p&gt;mpos)continue;let s=0;for(let c=0;c&lt;NC;c++)s+=MXW[o][c]*chv(c,p);const v=Math.max(0,Math.min(1,s));g.fillStyle=`rgba(45,212,191,${0.15+v*0.8})`;g.fillRect(ox+p*cw,y0+40+o*24,cw-2,22);if(p===mpos)out.push(s);}}
  g.fillStyle=&#x27;#8a9bb8&#x27;;g.fillText(`출력 ${NO}채널 (= ${NC}/4)`,ox,Hc-4);
  const mxX=x0+mpos*cw+cw,myY=y0+NC*10;for(let o=0;o&lt;NO;o++)arrow(g,mxX+4,myY,ox+mpos*cw,y0+51+o*24,&#x27;#f5b942&#x27;,1.5,7);
  $(&#x27;#mxl&#x27;).textContent=`위치 ${mpos}: 출력 = Σ_c w[o,c]·x[c] → ${out.map(v=&gt;v.toFixed(2)).join(&#x27;, &#x27;)} (공간은 안 봄)`;return out;}
$(&#x27;#bMx&#x27;).onclick=()=&gt;{if(busy)return;mpos=(mpos+1)%6;drawMx();};
function stop(){}
const CODE=`&lt;span class=&quot;b&quot;&gt;def&lt;/span&gt; model_cost(model, input_size):
    params = sum(p.numel() &lt;span class=&quot;b&quot;&gt;for&lt;/span&gt; p &lt;span class=&quot;b&quot;&gt;in&lt;/span&gt; model.parameters())
    macs, acts = 0, 0
    &lt;span class=&quot;b&quot;&gt;def&lt;/span&gt; hook(m, inp, out):
        &lt;span class=&quot;b&quot;&gt;nonlocal&lt;/span&gt; macs, acts
        acts += out.numel()                    &lt;span class=&quot;c&quot;&gt;# 활성화 원소&lt;/span&gt;
        &lt;span class=&quot;b&quot;&gt;if&lt;/span&gt; isinstance(m, nn.Conv2d):
            macs += out.numel() * (m.in_channels // m.groups) * m.kernel_size[0] * m.kernel_size[1]
        &lt;span class=&quot;b&quot;&gt;else&lt;/span&gt;:                                  &lt;span class=&quot;c&quot;&gt;# nn.Linear&lt;/span&gt;
            macs += m.in_features * m.out_features
    hs = [m.register_forward_hook(hook) &lt;span class=&quot;b&quot;&gt;for&lt;/span&gt; m &lt;span class=&quot;b&quot;&gt;in&lt;/span&gt; model.modules()
          &lt;span class=&quot;b&quot;&gt;if&lt;/span&gt; isinstance(m, (nn.Conv2d, nn.Linear))]
    model.eval()
    &lt;span class=&quot;b&quot;&gt;with&lt;/span&gt; torch.no_grad(): model(torch.zeros(1, *input_size))
    &lt;span class=&quot;b&quot;&gt;for&lt;/span&gt; h &lt;span class=&quot;b&quot;&gt;in&lt;/span&gt; hs: h.remove()
    &lt;span class=&quot;b&quot;&gt;return&lt;/span&gt; dict(params=params, macs=macs,
                param_MB=params * 4 / 1e6, act_MB=acts * 4 / 1e6)`;
const PS=[
 {n:&#x27;① 파라미터 vs 활성화 메모리&#x27;,ex:&#x27;&lt;p&gt;앞쪽 층 (채널 적고 해상도 큼) 은 &lt;b class=&quot;purple&quot;&gt;활성화 메모리&lt;/b&gt;가, 뒤쪽 층 (채널 많고 해상도 작음) 은 &lt;b class=&quot;teal&quot;&gt;파라미터 메모리&lt;/b&gt;가 큽니다. 3→64 · 112×112 와 512→512 · 7×7 을 비교해 보세요.&lt;/p&gt;&lt;p&gt;온디바이스에서는 둘 다 RAM 을 씁니다 — 파라미터는 계속, 활성화는 추론하는 동안.&lt;/p&gt;&#x27;,
  run:async()=&gt;{setCode(CODE);const out=[];for(const [a,b,k,h] of [[3,64,3,112],[64,128,3,56],[256,256,3,14],[512,512,3,7]]){ci=a;co=b;K=k;H=h;const c=drawCalc();out.push([c.pm,c.am]);setStatus(&#x27;info&#x27;,`${a}→${b} · ${h}×${h}: param ${c.pm.toFixed(3)} MB vs act ${c.am.toFixed(3)} MB`);await sleep(1100);}window.__d3.mem=out;setStatus(&#x27;ok&#x27;,&#x27;앞쪽 = 활성화가 큼 · 뒤쪽 = 파라미터가 큼&#x27;);}},
 {n:&#x27;② MAC = params × H × W&#x27;,ex:&#x27;&lt;p&gt;합성곱은 같은 가중치를 &lt;b&gt;모든 위치&lt;/b&gt;에서 다시 씁니다 → MAC = Cin·Cout·K² × OH·OW. 해상도를 2배로 하면 MAC 은 &lt;b class=&quot;amber&quot;&gt;4배&lt;/b&gt;, 파라미터는 그대로.&lt;/p&gt;&lt;p&gt;&lt;code&gt;model_cost&lt;/code&gt; 는 forward hook 으로 각 Conv/Linear 의 &lt;code&gt;out.numel()&lt;/code&gt; 을 모읍니다. ResNet-50 은 param_MB = &lt;b&gt;102.2 MB&lt;/b&gt;.&lt;/p&gt;&#x27;,
  run:async()=&gt;{setCode(CODE);ci=64;co=64;K=3;const out=[];for(const h of [14,28,56,112]){H=h;const c=drawCalc();out.push(c.mac);setStatus(&#x27;info&#x27;,`H = ${h}: MAC ${fmt(c.mac)} · params ${fmt(c.p)} (그대로)`);await sleep(900);}window.__d3.macH=out;setStatus(&#x27;ok&#x27;,&#x27;해상도 2배 → MAC 4배 · 파라미터 그대로&#x27;);}},
 {n:&#x27;③ basic vs bottleneck (256)&#x27;,ex:&#x27;&lt;p&gt;256 채널, bias 없음: basic 3×3 두 번 = 2·9·256² = &lt;b class=&quot;red&quot;&gt;1,179,648&lt;/b&gt;. bottleneck = 1×1 256→64 &lt;b&gt;16,384&lt;/b&gt; + 3×3 64→64 &lt;b&gt;36,864&lt;/b&gt; + 1×1 64→256 &lt;b&gt;16,384&lt;/b&gt; = &lt;b class=&quot;teal&quot;&gt;69,632&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;약 &lt;b class=&quot;amber&quot;&gt;17배&lt;/b&gt; (16.9) 적습니다. 비싼 3×3 을 채널 1/4 에서만 하는 것이 핵심 — ResNet-50 이 이 블록을 씁니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{C=256;setCode(`&lt;span class=&quot;c&quot;&gt;# 256 채널, bias=False&lt;/span&gt;\nbasic = 2 * 9 * 256 * 256                 &lt;span class=&quot;c&quot;&gt;# 1,179,648&lt;/span&gt;\nbott  = 256*64 + 9*64*64 + 64*256        &lt;span class=&quot;c&quot;&gt;# 16,384 + 36,864 + 16,384&lt;/span&gt;\nprint(basic, bott, basic / bott)         &lt;span class=&quot;c&quot;&gt;# 1179648 69632 16.94&lt;/span&gt;`);for(bstep=0;bstep&lt;=3;bstep++){drawBn();setStatus(&#x27;info&#x27;,[&#x27;입력 256 채널&#x27;,&#x27;1×1 256→64: 16,384&#x27;,&#x27;3×3 64→64: 36,864&#x27;,&#x27;1×1 64→256: 16,384 → 합 69,632&#x27;][bstep]);await sleep(1000);}const v=drawBn();window.__d3.bn=[v.basic,v.sum];setStatus(&#x27;ok&#x27;,&#x27;1,179,648 vs 69,632 → 16.9배&#x27;);}},
 {n:&#x27;④ 채널을 바꿔도 17배&#x27;,ex:&#x27;&lt;p&gt;basic = 18C², bottleneck = C²/4 + 9C²/16 + C²/4 = &lt;b&gt;17C²/16&lt;/b&gt;. 비율은 18 × 16 / 17 ≈ &lt;b class=&quot;amber&quot;&gt;16.9&lt;/b&gt; — 채널 수와 상관없이 같습니다.&lt;/p&gt;&lt;p&gt;그래서 채널이 클수록 절약하는 절대량이 커집니다 (제곱으로).&lt;/p&gt;&#x27;,
  run:async()=&gt;{const out=[];for(const c of [64,128,256,512,1024,256]){C=c;bstep=3;const v=drawBn();out.push(+(v.basic/v.sum).toFixed(2));setStatus(&#x27;info&#x27;,`C = ${c}: ${fmt(v.basic)} vs ${fmt(v.sum)}`);await sleep(800);}window.__d3.ratios=out;setStatus(&#x27;ok&#x27;,&#x27;어떤 C 에서도 16.9배&#x27;);}},
 {n:&#x27;⑤ 1×1 conv = 채널 압축기&#x27;,ex:&#x27;&lt;p&gt;1×1 conv 는 공간(이웃 픽셀)을 보지 않고, &lt;b&gt;위치마다&lt;/b&gt; 채널 벡터에 행렬을 곱합니다 — Linear 를 모든 위치에 적용한 것과 같습니다.&lt;/p&gt;&lt;p&gt;C → C/4 로 줄여서 3×3 에 넘기고, 다시 1×1 로 C 로 늘립니다. 3교시 &lt;b class=&quot;teal&quot;&gt;pointwise&lt;/b&gt; 가 바로 이 1×1 입니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{setCode(`pw = nn.Conv2d(256, 64, kernel_size=1, bias=False)\npw.weight.shape     &lt;span class=&quot;c&quot;&gt;# (64, 256, 1, 1) — 위치마다 256 → 64&lt;/span&gt;\n&lt;span class=&quot;c&quot;&gt;# 위치 (i, j) 출력 = W @ x[:, i, j]&lt;/span&gt;`);let o;for(mpos=0;mpos&lt;6;mpos++){o=drawMx();setStatus(&#x27;info&#x27;,$(&#x27;#mxl&#x27;).textContent);await sleep(650);}mpos=0;drawMx();window.__d3.mix=o.map(v=&gt;+v.toFixed(2));setStatus(&#x27;ok&#x27;,&#x27;1×1 conv = 위치마다 같은 행렬 곱 (채널만 섞음)&#x27;);}},
];
initPresets(PS,stop);
setCode(CODE);drawCalc();drawBn();drawMx();
window.addEventListener(&#x27;resize&#x27;,()=&gt;{drawCalc();drawBn();drawMx();});
$(&#x27;#presets button&#x27;).click();
&lt;/script&gt;

&lt;div class=&quot;app&quot;&gt;

&lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill teal&quot;&gt;dw: Conv2d(cin, cin, 3, groups=cin)&lt;/span&gt;&lt;span class=&quot;pill amber&quot;&gt;pw: Conv2d(cin, cout, 1)&lt;/span&gt;&lt;span class=&quot;pill purple&quot;&gt;비율 = 1/Cout + 1/K²&lt;/span&gt;&lt;span class=&quot;pill red&quot;&gt;MAC ↓ ≠ 지연시간 ↓ (메모리 병목)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;애니메이션 — 입력 4채널 → depthwise (채널마다 자기 3×3) → pointwise 1×1 → 출력 3채널&lt;/h2&gt;
  &lt;canvas id=&quot;dw&quot;&gt;&lt;/canvas&gt;

// 공용 선 그래프: o={xr,yr,xt,yt,xf,yf,xl,yl,series:[{pts,c,w,dash,dot}],hl:[{y,c,t}],ml}

function arrow(g,x0,y0,x1,y1,c,w=2,hs=8){const a=Math.atan2(y1-y0,x1-x0),L=Math.hypot(x1-x0,y1-y0);if(L&lt;1)return;hs=Math.min(hs,L*0.6);g.strokeStyle=c;g.fillStyle=c;g.lineWidth=w;g.beginPath();g.moveTo(x0,y0);g.lineTo(x1-Math.cos(a)*hs*0.7,y1-Math.sin(a)*hs*0.7);g.stroke();

  const c=cost();$(&#x27;#fm&#x27;).innerHTML=`가중치: 일반 ${ci}·${co}·${K}² = &lt;b&gt;${fmt(c.ws)}&lt;/b&gt; · DS dw ${fmt(c.wd)} + pw ${fmt(c.wp)} = &lt;b style=&quot;color:var(--teal)&quot;&gt;${fmt(c.wds)}&lt;/b&gt; (${pct(c.wds,c.ws)})&lt;br&gt;MAC: 일반 &lt;b&gt;${fmt(c.ms)}&lt;/b&gt; · DS dw ${fmt(c.md)} + pw ${fmt(c.mp)} = &lt;b style=&quot;color:var(--teal)&quot;&gt;${fmt(c.mds)}&lt;/b&gt;&lt;br&gt;비율 DS / 일반 = ${(c.mds/c.ms).toFixed(4)} = 1/${co} + 1/${K*K} = &lt;b style=&quot;color:var(--purple)&quot;&gt;${c.r.toFixed(4)}&lt;/b&gt; (약 1/${(1/c.r).toFixed(1)}) · pointwise 비중 ${pct(c.mp,c.mds)}`;
  hbars($(&#x27;#rt&#x27;),[{l:&#x27;일반 conv&#x27;,v:c.ms,c:&#x27;#f87171&#x27;},{l:&#x27;DS · dw&#x27;,v:c.md,c:&#x27;#2dd4bf&#x27;},{l:&#x27;DS · pw&#x27;,v:c.mp,c:&#x27;#f5b942&#x27;},{l:&#x27;DS 합&#x27;,v:c.mds,c:&#x27;#60a5fa&#x27;}],{ml:80,bh:24,gap:12});return c;}
[[&#x27;sCi&#x27;,v=&gt;ci=v],[&#x27;sCo&#x27;,v=&gt;co=v],[&#x27;sK&#x27;,v=&gt;K=v],[&#x27;sH&#x27;,v=&gt;H=v]].forEach(([id,f])=&gt;$(&#x27;#&#x27;+id).addEventListener(&#x27;input&#x27;,e=&gt;{if(busy)return;f(+e.target.value);const c=drawCalc();setStatus(&#x27;info&#x27;,`MAC ${fmt(c.ms)} → ${fmt(c.mds)} · 비율 ${c.r.toFixed(4)}`);}));
// ---- 애니메이션 ----
const CC=[&#x27;#f87171&#x27;,&#x27;#60a5fa&#x27;,&#x27;#4ade80&#x27;,&#x27;#c084fc&#x27;],OC=[&#x27;#f5b942&#x27;,&#x27;#2dd4bf&#x27;,&#x27;#e879f9&#x27;];
let ph=0,pos=-1,dwDone=0,pwDone=-1;  // ph 0: idle, 1: dw, 2: pw
function cell(c,i,j){return ((c*5+i*3+j*7)%11)/10;}
function drawDw(){const [g,W,Hc]=fitCanvas($(&#x27;#dw&#x27;));g.clearRect(0,0,W,Hc);g.font=&#x27;11px Consolas,monospace&#x27;;
  const n=6,cs=Math.max(4,Math.min(14,(W-60)/3/n/1.6,(Hc-44)/(4*n+4))),gw=n*cs,cols=[12,W/2-gw/2,W-12-gw];
  const ylab=(x,y,t)=&gt;{g.fillStyle=&#x27;#8a9bb8&#x27;;g.fillText(t,x,y);};
  ylab(cols[0],12,&#x27;입력 Cin = 4&#x27;);ylab(cols[1],12,&#x27;depthwise 출력 (4)&#x27;);g.textAlign=&#x27;right&#x27;;ylab(W-12,12,&#x27;pointwise 출력 Cout = 3&#x27;);g.textAlign=&#x27;left&#x27;;
  for(let c=0;c&lt;4;c++){const y0=20+c*(gw+8);
    for(let i=0;i&lt;n;i++)for(let j=0;j&lt;n;j++){g.globalAlpha=.2+cell(c,i,j)*.7;g.fillStyle=CC[c];g.fillRect(cols[0]+j*cs,y0+i*cs,cs-1,cs-1);}
    g.globalAlpha=1;
    if(ph===1&amp;&amp;pos&gt;=0){const pi=Math.floor(pos/n),pj=pos%n;g.strokeStyle=&#x27;#f5b942&#x27;;g.lineWidth=2;g.strokeRect(cols[0]+(pj-1)*cs,y0+(pi-1)*cs,3*cs,3*cs);g.lineWidth=1;}
    for(let k=0;k&lt;n*n;k++){const i=Math.floor(k/n),j=k%n;if(k&gt;=dwDone)break;g.globalAlpha=.25+cell(c,j,i)*.6;g.fillStyle=CC[c];g.fillRect(cols[1]+j*cs,y0+i*cs,cs-1,cs-1);}g.globalAlpha=1;
    if(ph===1&amp;&amp;pos&gt;=0){const pi=Math.floor(pos/n),pj=pos%n;arrow(g,cols[0]+gw+4,y0+gw/2,cols[1]-4,y0+(pi+.5)*cs,CC[c],1.2,6);}
  }
  for(let o=0;o&lt;3;o++){const y0=20+o*(gw+8)+gw/2;
    for(let k=0;k&lt;n*n;k++){if(k&gt;pwDone)break;const i=Math.floor(k/n),j=k%n;let s=0;for(let c=0;c&lt;4;c++)s+=cell(c,j,i)*[[.5,.3,-.2,.4],[-.3,.6,.4,.1],[.2,-.1,.5,.5]][o][c];g.globalAlpha=.2+Math.max(0,Math.min(1,s))*.75;g.fillStyle=OC[o];g.fillRect(cols[2]+j*cs,y0+i*cs,cs-1,cs-1);}g.globalAlpha=1;
    if(ph===2&amp;&amp;pos&gt;=0){const pi=Math.floor(pos/n),pj=pos%n;for(let c=0;c&lt;4;c++){const yy=20+c*(gw+8)+(pi+.5)*cs;g.strokeStyle=&#x27;#f5b942&#x27;;g.strokeRect(cols[1]+pj*cs,20+c*(gw+8)+pi*cs,cs,cs);if(o===0)arrow(g,cols[1]+(pj+1)*cs+2,yy,cols[2]-4,20+gw/2+(pi+.5)*cs+o*(gw+8),&#x27;rgba(245,185,66,.7)&#x27;,1.2,6);}}
  }
  g.fillStyle=&#x27;#5d7292&#x27;;g.fillText(ph===1?&#x27;채널마다 자기 3×3 하나 (채널끼리 안 섞음)&#x27;:ph===2?&#x27;위치마다 4채널 → 3채널 (공간 안 봄)&#x27;:&#x27;&#x27;,12,Hc-6);}
async function playDw(){ph=1;dwDone=0;pwDone=-1;for(pos=0;pos&lt;36;pos++){dwDone=pos+1;drawDw();$(&#x27;#dwl&#x27;).textContent=`depthwise 위치 ${pos+1}/36 — 곱셈 4 × 9`;await sleep(55);}pos=-1;drawDw();setCode(DSC);}
async function playPw(){if(dwDone&lt;36){dwDone=36;}ph=2;for(pos=0;pos&lt;36;pos++){pwDone=pos;drawDw();$(&#x27;#dwl&#x27;).textContent=`pointwise 위치 ${pos+1}/36 — 곱셈 4 × 3`;await sleep(55);}pos=-1;drawDw();}
$(&#x27;#bDw&#x27;).onclick=async()=&gt;{if(busy)return;busy=true;try{await playDw();}finally{busy=false;}};
$(&#x27;#bPw&#x27;).onclick=async()=&gt;{if(busy)return;busy=true;try{await playPw();}finally{busy=false;}};
// ---- 지연시간 ----
function drawLt(){const a=rn(R.t_std),b=rn(R.t_ds),c=cost(64,128,3,56);
  hbars($(&#x27;#lt&#x27;),[{l:&#x27;일반 conv&#x27;,v:a,c:&#x27;#f87171&#x27;,t:a==null?null:a+&#x27; ms&#x27;},{l:&#x27;DS conv&#x27;,v:b,c:&#x27;#2dd4bf&#x27;,t:b==null?null:b+&#x27; ms&#x27;},{l:&#x27;MAC 비례라면&#x27;,v:a!=null?a*c.mds/c.ms:null,c:&#x27;#5d7292&#x27;,t:a==null?&#x27;— (일반 ÷ 8.4)&#x27;:(a*c.mds/c.ms).toFixed(2)+&#x27; ms (가상)&#x27;}],{ml:96,bh:24,gap:14,max:Math.max(a??1,b??0)*1.05});
  $(&#x27;#lkv&#x27;).innerHTML=`&lt;span&gt;일반 conv&lt;/span&gt;&lt;b class=&quot;rv&quot; data-r=&quot;t_std&quot;&gt;&lt;/b&gt;&lt;span&gt;DS conv&lt;/span&gt;&lt;b class=&quot;rv&quot; data-r=&quot;t_ds&quot;&gt;&lt;/b&gt;&lt;span&gt;실제 빨라짐&lt;/span&gt;&lt;b&gt;&lt;span class=&quot;rv&quot; data-r=&quot;ds_speedup&quot;&gt;&lt;/span&gt; 배 &lt;span class=&quot;tag&quot;&gt;실행 예&lt;/span&gt;&lt;/b&gt;&lt;span&gt;MAC 비율&lt;/span&gt;&lt;b&gt;${(c.ms/c.mds).toFixed(1)}배 (= 1 / (1/128 + 1/9))&lt;/b&gt;`;fillR(R);}
const DSC=`&lt;span class=&quot;b&quot;&gt;class&lt;/span&gt; DSConv(nn.Module):
    &lt;span class=&quot;b&quot;&gt;def&lt;/span&gt; __init__(self, cin, cout, stride=1):
        super().__init__()
        self.dw = nn.Sequential(                     &lt;span class=&quot;c&quot;&gt;# 채널마다 공간만&lt;/span&gt;
            nn.Conv2d(cin, cin, 3, stride, padding=1, groups=cin, bias=False),
            nn.BatchNorm2d(cin), nn.ReLU(inplace=True))
        self.pw = nn.Sequential(                     &lt;span class=&quot;c&quot;&gt;# 위치마다 채널만&lt;/span&gt;
            nn.Conv2d(cin, cout, 1, bias=False),
            nn.BatchNorm2d(cout), nn.ReLU(inplace=True))
    &lt;span class=&quot;b&quot;&gt;def&lt;/span&gt; forward(self, x):
        &lt;span class=&quot;b&quot;&gt;return&lt;/span&gt; self.pw(self.dw(x))`;
function stop(){}
const PS=[
 {n:&#x27;① depthwise — 채널마다 따로&#x27;,ex:&#x27;&lt;p&gt;&lt;code&gt;groups=Cin&lt;/code&gt; 이면 입력 채널 하나에 3×3 필터 하나 — 채널끼리 섞지 않고 &lt;b class=&quot;teal&quot;&gt;공간만&lt;/b&gt; 봅니다. 가중치 shape &lt;code&gt;(Cin, 1, 3, 3)&lt;/code&gt;.&lt;/p&gt;&lt;p&gt;64채널이면 3×3 필터 64개 = 576 가중치. 일반 conv (64→128) 의 73,728 과 비교해 보세요.&lt;/p&gt;&#x27;,
  run:async()=&gt;{setCode(`dw = nn.Conv2d(64, 64, 3, padding=1, groups=64, bias=False)\ndw.weight.shape   &lt;span class=&quot;c&quot;&gt;# (64, 1, 3, 3) → 576&lt;/span&gt;`);await playDw();window.__d3.dw=576;setStatus(&#x27;ok&#x27;,&#x27;depthwise: 채널 4개 × 위치 36 × 9 곱셈 — 채널끼리 섞지 않음&#x27;);}},
 {n:&#x27;② pointwise — 위치마다 채널만&#x27;,ex:&#x27;&lt;p&gt;1×1 conv 로 위치마다 채널을 섞습니다 (2교시의 채널 압축기). 가중치 shape &lt;code&gt;(Cout, Cin, 1, 1)&lt;/code&gt; — 64→128 이면 &lt;b class=&quot;amber&quot;&gt;8,192&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;depthwise + pointwise 를 합치면 일반 3×3 conv 와 같은 shape 의 출력을 훨씬 적은 연산으로 냅니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{setCode(`pw = nn.Conv2d(64, 128, 1, bias=False)\npw.weight.shape   &lt;span class=&quot;c&quot;&gt;# (128, 64, 1, 1) → 8,192&lt;/span&gt;`);await playPw();setCode(DSC);window.__d3.pw=8192;setStatus(&#x27;ok&#x27;,&#x27;pointwise: 위치마다 4채널 → 3채널 — 공간은 안 봄&#x27;);}},
 {n:&#x27;③ 64→128 · 32×32 계산&#x27;,ex:&#x27;&lt;p&gt;가중치: 일반 &lt;b&gt;73,728&lt;/b&gt; vs DS &lt;b class=&quot;teal&quot;&gt;8,768&lt;/b&gt; (dw 576 + pw 8,192, 11.9%).&lt;/p&gt;&lt;p&gt;MAC: 일반 &lt;b&gt;75,497,472&lt;/b&gt; vs DS &lt;b class=&quot;teal&quot;&gt;8,978,432&lt;/b&gt; (dw 589,824 + pw 8,388,608) → 0.1189 = 1/128 + 1/9. &lt;b class=&quot;amber&quot;&gt;pointwise 가 DS 연산의 93%&lt;/b&gt; — 그래서 MobileNet 최적화는 1×1 conv 가 핵심.&lt;/p&gt;&#x27;,
  run:async()=&gt;{ci=64;co=128;K=3;H=32;const c=drawCalc();setCode(`std = 64 * 128 * 9 * 32 * 32               &lt;span class=&quot;c&quot;&gt;# 75,497,472&lt;/span&gt;\ndw  = 64 * 9 * 32 * 32                     &lt;span class=&quot;c&quot;&gt;# 589,824&lt;/span&gt;\npw  = 64 * 128 * 32 * 32                   &lt;span class=&quot;c&quot;&gt;# 8,388,608&lt;/span&gt;\n(dw + pw) / std                            &lt;span class=&quot;c&quot;&gt;# 0.1189 = 1/128 + 1/9&lt;/span&gt;`);await sleep(600);window.__d3.calc=[c.ws,c.wds,c.ms,c.mds,+(c.mds/c.ms).toFixed(4)];setStatus(&#x27;ok&#x27;,`일반 ${fmt(c.ms)} vs DS ${fmt(c.mds)} → ${(c.mds/c.ms).toFixed(4)} · pointwise ${pct(c.mp,c.mds)}`);}},
 {n:&#x27;④ 비율 = 1/Cout + 1/K²&#x27;,ex:&#x27;&lt;p&gt;DS / 일반 = (Cin·K² + Cin·Cout) / (Cin·Cout·K²) = &lt;b class=&quot;purple&quot;&gt;1/Cout + 1/K²&lt;/b&gt;. Cin 과 해상도는 약분됩니다.&lt;/p&gt;&lt;p&gt;K = 3 이면 Cout 이 커질수록 &lt;b&gt;1/9 에 가까워집니다&lt;/b&gt; (약 1/9 ~ 1/8). K = 5 면 1/25 까지 — MobileNetV3 가 5×5 depthwise 를 쓰는 이유 중 하나.&lt;/p&gt;&#x27;,
  run:async()=&gt;{const out=[];for(const [b,k] of [[16,3],[32,3],[64,3],[128,3],[512,3],[128,5]]){co=b;K=k;const c=drawCalc();out.push(+c.r.toFixed(4));setStatus(&#x27;info&#x27;,`Cout ${b}, K ${k}: 1/${b} + 1/${k*k} = ${c.r.toFixed(4)}`);await sleep(850);}co=128;K=3;drawCalc();window.__d3.r=out;setStatus(&#x27;ok&#x27;,&#x27;Cout ↑ → 1/K² 에 수렴 (K=3 → 1/9)&#x27;);}},
 {n:&#x27;⑤ 실제 지연시간 · 메모리 병목&#x27;,ex:&#x27;&lt;p&gt;문제 3-3: CPU 1스레드, 입력 64×56×56 에서 일반 &lt;b class=&quot;rv&quot; data-r=&quot;t_std&quot;&gt;&lt;/b&gt; ms vs DS &lt;b class=&quot;rv&quot; data-r=&quot;t_ds&quot;&gt;&lt;/b&gt; ms → &lt;b class=&quot;rv&quot; data-r=&quot;ds_speedup&quot;&gt;&lt;/b&gt;배 (실행 예). MAC 은 &lt;b&gt;8.4배&lt;/b&gt; 줄었는데 실제는 그만큼 빨라지지 않습니다.&lt;/p&gt;&lt;p&gt;이유: depthwise 는 &lt;b class=&quot;red&quot;&gt;계산 대비 메모리 이동이 많아&lt;/b&gt; (메모리 병목) 연산 유닛이 놀게 됩니다. MAC 은 근사일 뿐 — &lt;b class=&quot;amber&quot;&gt;실제 장치에서 재야 합니다&lt;/b&gt;.&lt;/p&gt;&#x27;,
  run:async()=&gt;{ci=64;co=128;K=3;H=56;drawCalc();drawLt();setCode(`x = torch.randn(1, 64, 56, 56)\nstd = nn.Conv2d(64, 128, 3, padding=1, bias=False)\nds  = nn.Sequential(nn.Conv2d(64, 64, 3, padding=1, groups=64, bias=False),\n                    nn.Conv2d(64, 128, 1, bias=False))\nt_std = latency_ms(std, (64, 56, 56))\nt_ds  = latency_ms(ds,  (64, 56, 56))\nprint(t_std, t_ds, t_std / t_ds)`);fillR(R);await sleep(700);window.__d3.lat=[rs(R.t_std),rs(R.t_ds),rs(R.ds_speedup)];setStatus(&#x27;ok&#x27;,`MAC 8.4배 감소 vs 실제 ${rs(R.ds_speedup)}배 (실행 예) — 메모리 병목`);}},
];
initPresets(PS,stop);
setCode(DSC);drawCalc();drawDw();drawLt();
window.addEventListener(&#x27;resize&#x27;,()=&gt;{drawCalc();drawDw();drawLt();});
$(&#x27;#presets button&#x27;).click();
&lt;/script&gt;

&lt;body&gt;
&lt;div class=&quot;app&quot;&gt;
&lt;h1&gt;Inverted residual · SE&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;4교시 — MobileNet 의 세 세대. &lt;b style=&quot;color:var(--amber)&quot;&gt;V1&lt;/b&gt; (2017) DS conv 쌓기 → &lt;b style=&quot;color:var(--teal)&quot;&gt;V2&lt;/b&gt; (2018) inverted residual + linear bottleneck → &lt;b style=&quot;color:var(--purple)&quot;&gt;V3&lt;/b&gt; (2019) NAS + SE + h-swish.&lt;/p&gt;
&lt;div class=&quot;tl&quot;&gt;&lt;span&gt;&lt;b&gt;V1 2017&lt;/b&gt; depthwise separable 쌓기&lt;/span&gt;&lt;span&gt;&lt;b&gt;V2 2018&lt;/b&gt; 늘리기 ×6 → dw 3×3 → 줄이기 (마지막 1×1 뒤 활성화 없음)&lt;/span&gt;&lt;span&gt;&lt;b&gt;V3 2019&lt;/b&gt; NAS · SE · h-swish&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;채널 폭 — ResNet bottleneck (줄였다 늘리기) vs inverted residual (늘렸다 줄이기)&lt;/h2&gt;
  &lt;canvas id=&quot;wd&quot;&gt;&lt;/canvas&gt;
  &lt;div class=&quot;row ctl&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;bWd&quot;&gt;흐름 재생&lt;/button&gt;&lt;span class=&quot;lab&quot;&gt;지름길(shortcut)이 어느 쪽 폭에 붙는지 보세요&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;
  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;InvertedResidual(24, 24, stride 1, t = 6) 파라미터&lt;/h2&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;div class=&quot;seg&quot; id=&quot;pseg&quot;&gt;&lt;button type=&quot;button&quot; data-k=&quot;0&quot;&gt;IR(24, 24, s1)&lt;/button&gt;&lt;button type=&quot;button&quot; data-k=&quot;1&quot;&gt;IR(16, 24, s2)&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;canvas id=&quot;pb&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;Python (노트북 4교시)&lt;/h2&gt;&lt;div class=&quot;code&quot; id=&quot;code&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;상태&lt;/h2&gt;&lt;div class=&quot;status info&quot; id=&quot;status&quot;&gt;프리셋을 누르세요.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;SE (Squeeze-and-Excitation) — 6채널 예: 평균 → FC → FC → hard-sigmoid → 채널마다 곱&lt;/h2&gt;
  &lt;canvas id=&quot;se&quot;&gt;&lt;/canvas&gt;
  &lt;div class=&quot;row ctl&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;bSe&quot;&gt;한 단계 ▶&lt;/button&gt;&lt;label class=&quot;chk&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;cBg&quot;&gt; 채널 2 를 강하게 (밝은 입력)&lt;/label&gt;&lt;span class=&quot;lab&quot; id=&quot;sel&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;two&quot;&gt;
  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;활성화 — ReLU · swish · h-swish&lt;/h2&gt;
    &lt;div class=&quot;sl&quot;&gt;&lt;label&gt;x&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sX&quot; min=&quot;-6&quot; max=&quot;6&quot; step=&quot;0.1&quot; value=&quot;1&quot;&gt;&lt;output id=&quot;oX&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;canvas id=&quot;hs&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:#8a9bb8&quot;&gt;&lt;/i&gt;ReLU&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#60a5fa&quot;&gt;&lt;/i&gt;swish x·σ(x)&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#f5b942&quot;&gt;&lt;/i&gt;h-swish x·ReLU6(x+3)/6&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;kv&quot; id=&quot;hkv&quot; style=&quot;margin-top:6px&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;torchvision mobilenet_v3_small — features 안 InvertedResidual 11개&lt;/h2&gt;
    &lt;div class=&quot;blk&quot; id=&quot;blk&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;kv&quot; id=&quot;mkv&quot; style=&quot;margin-top:10px&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;panel explain&quot; id=&quot;explain&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,ms));
let busy=false, timer=null;
function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}
function setCode(h){$(&#x27;#code&#x27;).innerHTML=h;}
function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const g=c.getContext(&#x27;2d&#x27;);g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}
function initPresets(P,stop){$(&#x27;#presets&#x27;).innerHTML=P.map(p=&gt;`&lt;button type=&quot;button&quot;&gt;${p.n}&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}
const esc=s=&gt;String(s).replace(/&amp;/g,&#x27;&amp;amp;&#x27;).replace(/&lt;/g,&#x27;&amp;lt;&#x27;).replace(/&gt;/g,&#x27;&amp;gt;&#x27;);
const fmt=n=&gt;n.toLocaleString(&#x27;en-US&#x27;);
// 공용 선 그래프: o={xr,yr,xt,yt,xf,yf,xl,yl,series:[{pts,c,w,dash,dot}],hl:[{y,c,t}],ml}
function chart(cv,o){
  const [g,W,H]=fitCanvas(cv);g.clearRect(0,0,W,H);
  const ml=o.ml??46,mr=o.mr??12,mt=o.mt??10,mb=o.xl?36:24;
  const X=v=&gt;ml+(v-o.xr[0])/(o.xr[1]-o.xr[0])*(W-ml-mr);
  const Y=v=&gt;mt+(1-(v-o.yr[0])/(o.yr[1]-o.yr[0]))*(H-mt-mb);
  g.font=&#x27;11px Consolas,monospace&#x27;;g.lineWidth=1;
  (o.yt||[]).forEach(v=&gt;{const y=Y(v);g.strokeStyle=&#x27;#1a2540&#x27;;g.beginPath();g.moveTo(ml,y);g.lineTo(W-mr,y);g.stroke();g.fillStyle=&#x27;#5d7292&#x27;;g.textAlign=&#x27;right&#x27;;g.fillText(o.yf?o.yf(v):v,ml-5,y+4);});
  (o.xt||[]).forEach(v=&gt;{const x=X(v);g.strokeStyle=&#x27;#1a2540&#x27;;g.beginPath();g.moveTo(x,mt);g.lineTo(x,H-mb);g.stroke();g.fillStyle=&#x27;#5d7292&#x27;;g.textAlign=&#x27;center&#x27;;g.fillText(o.xf?o.xf(v):v,x,H-mb+14);});
  g.textAlign=&#x27;left&#x27;;
  if(o.xl){g.fillStyle=&#x27;#8a9bb8&#x27;;g.textAlign=&#x27;right&#x27;;g.fillText(o.xl,W-mr,H-4);g.textAlign=&#x27;left&#x27;;}
  if(o.yl){g.fillStyle=&#x27;#8a9bb8&#x27;;g.fillText(o.yl,ml+4,mt+11);}
  (o.hl||[]).forEach(h=&gt;{g.strokeStyle=h.c;g.setLineDash([5,4]);g.beginPath();g.moveTo(ml,Y(h.y));g.lineTo(W-mr,Y(h.y));g.stroke();g.setLineDash([]);if(h.t){g.fillStyle=h.c;g.fillText(h.t,ml+6,Y(h.y)-4);}});
  (o.series||[]).forEach(s=&gt;{if(!s.pts.length)return;g.strokeStyle=s.c;g.fillStyle=s.c;g.lineWidth=s.w||2;g.setLineDash(s.dash||[]);
    g.beginPath();s.pts.forEach(([x,y],i)=&gt;{const px=X(x),py=Y(y);i?g.lineTo(px,py):g.moveTo(px,py);});g.stroke();
    g.setLineDash([]);if(s.dot)s.pts.forEach(([x,y])=&gt;{g.beginPath();g.arc(X(x),Y(y),s.dot,0,7);g.fill();});});
  g.lineWidth=1;
  return {g,W,H,X,Y,ml,mr,mt,mb};
}
function arrow(g,x0,y0,x1,y1,c,w=2,hs=8){const a=Math.atan2(y1-y0,x1-x0),L=Math.hypot(x1-x0,y1-y0);if(L&lt;1)return;hs=Math.min(hs,L*0.6);g.strokeStyle=c;g.fillStyle=c;g.lineWidth=w;g.beginPath();g.moveTo(x0,y0);g.lineTo(x1-Math.cos(a)*hs*0.7,y1-Math.sin(a)*hs*0.7);g.stroke();
  g.beginPath();g.moveTo(x1,y1);g.lineTo(x1-hs*Math.cos(a-0.4),y1-hs*Math.sin(a-0.4));g.lineTo(x1-hs*Math.cos(a+0.4),y1-hs*Math.sin(a+0.4));g.closePath();g.fill();g.lineWidth=1;}
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
window.__d3={};
// 실행 결과 토큰 (@@ + 키 + @@ → build_anim.py 가 vb3/results.json 값으로 치환). 없으면 &quot;—&quot;.
const rOk=v=&gt;v!=null&amp;&amp;String(v)!==&#x27;&#x27;&amp;&amp;!/^@@/.test(String(v));
const rs=v=&gt;rOk(v)?String(v):&#x27;—&#x27;;
function rn(v){if(!rOk(v))return null;const x=parseFloat(v);return isFinite(x)?x:null;}
function rl(v){if(!rOk(v))return null;try{const a=JSON.parse(v);return Array.isArray(a)&amp;&amp;a.length&amp;&amp;a.every(x=&gt;isFinite(+x))?a.map(Number):null;}catch(e){return null;}}
function fillR(R){$$(&#x27;[data-r]&#x27;).forEach(e=&gt;{const v=R[e.dataset.r];e.textContent=rs(v);e.classList.toggle(&#x27;miss&#x27;,!rOk(v));e.title=rOk(v)?&#x27;실행 예 (vb3/results.json)&#x27;:&#x27;아직 실행 결과 없음 — Colab 실행 후 채워짐&#x27;;});}
const pct=(a,b)=&gt;(100*a/b).toFixed(1)+&#x27;%&#x27;;
// 가로 막대: items=[{l,v,c,t}] (v=null → &quot;—&quot;), o={max,ml,bh,gap,log}
function hbars(cv,items,o={}){const [g,W,H]=fitCanvas(cv);g.clearRect(0,0,W,H);const ml=o.ml??110,bh=o.bh??24,gap=o.gap??12,mx=o.max??Math.max(1e-9,...items.map(i=&gt;i.v??0));
  g.font=&#x27;12px Consolas,monospace&#x27;;const bw=W-ml-12;
  items.forEach((it,i)=&gt;{const y=8+i*(bh+gap);g.globalAlpha=it.a??1;g.fillStyle=&#x27;#8a9bb8&#x27;;g.textAlign=&#x27;left&#x27;;g.fillText(it.l,4,y+bh/2+4);
    if(it.v==null){g.strokeStyle=&#x27;#2a3a5c&#x27;;g.setLineDash([4,4]);g.strokeRect(ml,y,bw*0.3,bh);g.setLineDash([]);g.fillStyle=&#x27;#5d7292&#x27;;g.fillText(it.t??&#x27;— (실행 결과 없음)&#x27;,ml+8,y+bh/2+4);g.globalAlpha=1;return;}
    const w=Math.max(2,bw*(o.log?Math.log10(Math.max(1,it.v))/Math.log10(mx):Math.min(1,it.v/mx)));g.fillStyle=it.c;g.fillRect(ml,y,w,bh);
    const t=it.t??fmt(it.v);const tw=g.measureText(t).width;g.fillStyle=w&gt;tw+12?&#x27;#0b1220&#x27;:it.c;g.fillText(t,w&gt;tw+12?ml+6:Math.min(ml+w+6,W-tw-4),y+bh/2+4);g.globalAlpha=1;});
  return {g,W,H,ml,bw,mx,bh,gap};}

// ---- 폭 ----
let wf=-1;
function drawWd(){const [g,W,H]=fitCanvas($(&#x27;#wd&#x27;));g.clearRect(0,0,W,H);g.font=&#x27;12px Consolas,monospace&#x27;;const half=W/2,mh=H-80;
  const draw=(x0,w,ch,mx,clr,title,lab,short)=&gt;{g.fillStyle=clr;g.textAlign=&#x27;left&#x27;;g.fillText(title,x0,16);const xs=ch.map((_,i)=&gt;x0+20+i*(w-40)/(ch.length-1));
    xs.forEach((x,i)=&gt;{const h=Math.max(6,ch[i]/mx*mh);g.globalAlpha=wf&lt;0||wf&gt;=i?1:.25;g.fillStyle=i===0||i===ch.length-1?&#x27;#5d7292&#x27;:clr;g.fillRect(x-11,34+(mh-h)/2,22,h);g.fillStyle=&#x27;#dbe4f0&#x27;;g.textAlign=&#x27;center&#x27;;g.fillText(ch[i],x,34+(mh-h)/2-5);g.fillStyle=&#x27;#8a9bb8&#x27;;g.fillText(lab[i],x,H-30);
      if(i)arrow(g,xs[i-1]+13,34+mh/2,x-13,34+mh/2,&#x27;#8a9bb8&#x27;,1.2,6);g.globalAlpha=1;});
    const sy=H-14;g.strokeStyle=wf&gt;=ch.length-1?&#x27;#4ade80&#x27;:&#x27;#2a3a5c&#x27;;g.lineWidth=2;g.beginPath();g.moveTo(xs[0],H-24);g.lineTo(xs[0],sy);g.lineTo(xs[xs.length-1],sy);g.lineTo(xs[xs.length-1],H-24);g.stroke();g.lineWidth=1;g.fillStyle=&#x27;#4ade80&#x27;;g.textAlign=&#x27;center&#x27;;g.fillText(short,(xs[0]+xs[xs.length-1])/2,sy-3);g.textAlign=&#x27;left&#x27;;};
  draw(6,half-12,[256,64,64,256],256,&#x27;#60a5fa&#x27;,&#x27;ResNet bottleneck&#x27;,[&#x27;in&#x27;,&#x27;1×1&#x27;,&#x27;3×3&#x27;,&#x27;1×1&#x27;],&#x27;지름길 = 넓은 쪽 (256)&#x27;);
  draw(half+6,half-12,[24,144,144,24],256,&#x27;#2dd4bf&#x27;,&#x27;V2 inverted residual&#x27;,[&#x27;in&#x27;,&#x27;1×1 ×6&#x27;,&#x27;dw 3×3&#x27;,&#x27;1×1&#x27;],&#x27;지름길 = 얇은 쪽 (24)&#x27;);}
async function playWd(){for(wf=0;wf&lt;=3;wf++){drawWd();await sleep(600);}}
$(&#x27;#bWd&#x27;).onclick=async()=&gt;{if(busy)return;busy=true;try{await playWd();}finally{busy=false;}};
// ---- 파라미터 ----
function irp(cin,cout,t){const h=cin*t;return [[&#x27;1×1 늘리기&#x27;,cin*h],[&#x27;BN&#x27;,2*h],[&#x27;dw 3×3&#x27;,h*9],[&#x27;BN&#x27;,2*h],[&#x27;1×1 줄이기&#x27;,h*cout],[&#x27;BN&#x27;,2*cout]];}
let pk=0,pn=6;
function drawPb(){$$(&#x27;#pseg button&#x27;).forEach(b=&gt;b.classList.toggle(&#x27;sel&#x27;,+b.dataset.k===pk));const P=pk?irp(16,24,6):irp(24,24,6),tot=P.reduce((a,b)=&gt;a+b[1],0);
  const C=hbars($(&#x27;#pb&#x27;),P.map((p,i)=&gt;({l:p[0],v:p[1],c:[&#x27;#2dd4bf&#x27;,&#x27;#5d7292&#x27;,&#x27;#f5b942&#x27;,&#x27;#5d7292&#x27;,&#x27;#60a5fa&#x27;,&#x27;#5d7292&#x27;][i],a:i&lt;pn?1:.15})).concat([{l:&#x27;합계&#x27;,v:pn&gt;=6?tot:null,c:&#x27;#4ade80&#x27;,t:pn&gt;=6?fmt(tot)+(pk?&#x27; (지름길 없음: stride 2 · 16≠24)&#x27;:&#x27; (지름길 있음)&#x27;):&#x27;…&#x27;}]),{ml:84,bh:22,gap:10,max:3456*1.1});return tot;}
$$(&#x27;#pseg button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(busy)return;pk=+b.dataset.k;pn=6;const t=drawPb();setStatus(&#x27;info&#x27;,`${pk?&#x27;IR(16, 24, s2)&#x27;:&#x27;IR(24, 24, s1)&#x27;} = ${fmt(t)} 파라미터`);});
// ---- SE ----
let seStep=4,big=false;
const W1=[[.8,-.4,.6,.2,-.3,.5],[-.5,.7,.3,-.2,.6,.1],[.2,.3,-.6,.7,.4,-.3]],B1=[.1,0,-.1],W2=[[1.2,-.8,.5],[-.6,1.0,.4],[.9,.3,-1.1],[-.4,1.3,.6],[.7,-.5,.9],[-1.0,.6,.8]],B2=[0,.2,-.1,.1,0,-.2];
function chMap(c,i,j){let v=((c*3+i*5+j*7)%9)/9*(c%2?0.6:1.0)+0.1;if(big&amp;&amp;c===2)v=Math.min(1.6,v+1);return v;}
function seCalc(){const s=[...Array(6)].map((_,c)=&gt;{let a=0;for(let i=0;i&lt;4;i++)for(let j=0;j&lt;4;j++)a+=chMap(c,i,j);return a/16;});
  const z=W1.map((w,k)=&gt;Math.max(0,w.reduce((a,x,c)=&gt;a+x*s[c],B1[k])));const e=W2.map((w,c)=&gt;w.reduce((a,x,k)=&gt;a+x*z[k],B2[c]));const hs=e.map(x=&gt;Math.min(6,Math.max(0,x+3))/6);return {s,z,e,hs};}
function drawSe(){const [g,W,H]=fitCanvas($(&#x27;#se&#x27;));g.clearRect(0,0,W,H);g.font=&#x27;11px Consolas,monospace&#x27;;const r=seCalc();const rowH=Math.min(44,(H-30)/6),cs=Math.min(rowH/4.4,(W*0.2)/4);
  const colX=[10,10+4*cs+70,W*0.42,W*0.62,W-12-4*cs];
  g.fillStyle=&#x27;#8a9bb8&#x27;;[&#x27;입력 6채널&#x27;,&#x27;평균 s&#x27;,&#x27;FC 6→3→6&#x27;,&#x27;hard-sigmoid&#x27;,&#x27;× 가중치&#x27;].forEach((t,i)=&gt;{if(i&lt;=seStep){g.textAlign=i===4?&#x27;right&#x27;:&#x27;left&#x27;;g.fillText(t,i===4?W-12:colX[i]-(i===2?20:0),12);}});g.textAlign=&#x27;left&#x27;;
  for(let c=0;c&lt;6;c++){const y=22+c*rowH;
    for(let i=0;i&lt;4;i++)for(let j=0;j&lt;4;j++){g.fillStyle=`rgba(96,165,250,${Math.min(1,.12+chMap(c,i,j)*.7)})`;g.fillRect(colX[0]+j*cs,y+i*cs,cs-1,cs-1);}
    if(seStep&gt;=1){g.fillStyle=&#x27;#60a5fa&#x27;;g.fillText(r.s[c].toFixed(2),colX[1],y+cs*2+4);}
    if(seStep&gt;=3){const w=W*0.14*r.hs[c];g.fillStyle=&#x27;#c084fc&#x27;;g.fillRect(colX[3],y+2,Math.max(1,w),cs*4-4);g.fillStyle=&#x27;#dbe4f0&#x27;;g.fillText(r.hs[c].toFixed(2),colX[3]+Math.max(1,w)+4,y+cs*2+4);}
    if(seStep&gt;=4){for(let i=0;i&lt;4;i++)for(let j=0;j&lt;4;j++){g.fillStyle=`rgba(45,212,191,${Math.min(1,.05+chMap(c,i,j)*r.hs[c]*.8)})`;g.fillRect(colX[4]+j*cs,y+i*cs,cs-1,cs-1);}}
  }
  if(seStep&gt;=2){g.fillStyle=&#x27;#f5b942&#x27;;const y0=22+rowH*1.5;r.z.forEach((v,k)=&gt;{g.fillText(`z${k} = ${v.toFixed(2)}`,colX[2]-20,y0+k*rowH);});g.fillStyle=&#x27;#8a9bb8&#x27;;g.fillText(&#x27;ReLU&#x27;,colX[2]-20,y0+3*rowH);}
  $(&#x27;#sel&#x27;).textContent=[&#x27;① 입력&#x27;,&#x27;② squeeze: 채널별 공간 평균&#x27;,&#x27;③ excitation: FC 6→3 (ReLU) → FC 3→6&#x27;,&#x27;④ hard-sigmoid → 0~1&#x27;,&#x27;⑤ 채널마다 곱 (scale)&#x27;][seStep];return r;}
$(&#x27;#bSe&#x27;).onclick=()=&gt;{if(busy)return;seStep=(seStep+1)%5;drawSe();};
$(&#x27;#cBg&#x27;).addEventListener(&#x27;change&#x27;,e=&gt;{if(busy)return;big=e.target.checked;seStep=4;const r=drawSe();setStatus(&#x27;info&#x27;,`채널별 가중치: ${r.hs.map(v=&gt;v.toFixed(2)).join(&#x27;, &#x27;)}`);});
// ---- h-swish ----
let hx=1;const relu=x=&gt;Math.max(0,x),r6=x=&gt;Math.min(6,Math.max(0,x)),sw=x=&gt;x/(1+Math.exp(-x)),hsw=x=&gt;x*r6(x+3)/6;
function drawHs(){$(&#x27;#oX&#x27;).textContent=hx.toFixed(1);$(&#x27;#sX&#x27;).value=hx;const P=f=&gt;{const a=[];for(let x=-6;x&lt;=6.001;x+=0.1)a.push([x,f(x)]);return a;};
  const C=chart($(&#x27;#hs&#x27;),{xr:[-6,6],yr:[-1,6],xt:[-6,-3,0,3,6],yt:[0,2,4,6],ml:30,series:[{pts:P(relu),c:&#x27;#8a9bb8&#x27;,w:1.5,dash:[4,3]},{pts:P(sw),c:&#x27;#60a5fa&#x27;},{pts:P(hsw),c:&#x27;#f5b942&#x27;}]});
  const g=C.g;g.fillStyle=&#x27;#f5b942&#x27;;g.beginPath();g.arc(C.X(hx),C.Y(hsw(hx)),5,0,7);g.fill();g.strokeStyle=&#x27;#5d7292&#x27;;g.setLineDash([3,3]);[-3,3].forEach(v=&gt;{g.beginPath();g.moveTo(C.X(v),C.mt);g.lineTo(C.X(v),C.H-C.mb);g.stroke();});g.setLineDash([]);
  $(&#x27;#hkv&#x27;).innerHTML=`&lt;span&gt;ReLU&lt;/span&gt;&lt;b&gt;${relu(hx).toFixed(3)}&lt;/b&gt;&lt;span&gt;swish&lt;/span&gt;&lt;b style=&quot;color:var(--blue)&quot;&gt;${sw(hx).toFixed(3)}&lt;/b&gt;&lt;span&gt;h-swish&lt;/span&gt;&lt;b style=&quot;color:var(--amber)&quot;&gt;${hsw(hx).toFixed(3)} ${hx&lt;=-3?&#x27;(x ≤ −3 → 0)&#x27;:hx&gt;=3?&#x27;(x ≥ 3 → x)&#x27;:&#x27;&#x27;}&lt;/b&gt;`;}
$(&#x27;#sX&#x27;).addEventListener(&#x27;input&#x27;,e=&gt;{if(busy)return;hx=+e.target.value;drawHs();});
// ---- V3-S 블록 ----
const BK=[[16,1,&#x27;RE&#x27;,2],[24,0,&#x27;RE&#x27;,2],[24,0,&#x27;RE&#x27;,1],[40,1,&#x27;HS&#x27;,2],[40,1,&#x27;HS&#x27;,1],[40,1,&#x27;HS&#x27;,1],[48,1,&#x27;HS&#x27;,1],[48,1,&#x27;HS&#x27;,1],[96,1,&#x27;HS&#x27;,2],[96,1,&#x27;HS&#x27;,1],[96,1,&#x27;HS&#x27;,1]];let bi=-1;
function drawBlk(){$(&#x27;#blk&#x27;).innerHTML=BK.map((b,i)=&gt;`&lt;div class=&quot;${b[1]?&#x27;se&#x27;:&#x27;&#x27;} ${i===bi?&#x27;on&#x27;:&#x27;&#x27;}&quot;&gt;&lt;b&gt;${b[0]}&lt;/b&gt;${b[2]}${b[3]===2?&#x27; s2&#x27;:&#x27;&#x27;}&lt;br&gt;&lt;span class=&quot;s&quot;&gt;${b[1]?&#x27;SE&#x27;:&#x27;—&#x27;}&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;)+`&lt;div style=&quot;border-color:var(--teal)&quot;&gt;&lt;b&gt;576&lt;/b&gt;1×1&lt;br&gt;HS&lt;/div&gt;`;
  $(&#x27;#mkv&#x27;).innerHTML=`&lt;span&gt;InvertedResidual&lt;/span&gt;&lt;b&gt;11 개 (SE 있는 블록 9 개)&lt;/b&gt;&lt;span&gt;마지막 특징맵&lt;/span&gt;&lt;b&gt;224 입력 → (576, 7, 7)&lt;/b&gt;&lt;span&gt;classifier&lt;/span&gt;&lt;b&gt;Linear(576→1024) · Hardswish · Dropout · Linear(1024→1000)&lt;/b&gt;&lt;span&gt;전체&lt;/span&gt;&lt;b&gt;2,542,856 params · 56,510,400 MAC (ResNet-50 의 1/72)&lt;/b&gt;`;}
const IRC=`&lt;span class=&quot;b&quot;&gt;class&lt;/span&gt; InvertedResidual(nn.Module):
    &lt;span class=&quot;b&quot;&gt;def&lt;/span&gt; __init__(self, cin, cout, stride, t=6):
        super().__init__()
        h = cin * t
        self.use_res = stride == 1 &lt;span class=&quot;b&quot;&gt;and&lt;/span&gt; cin == cout
        self.block = nn.Sequential(
            nn.Conv2d(cin, h, 1, bias=False), nn.BatchNorm2d(h), nn.ReLU6(inplace=True),
            nn.Conv2d(h, h, 3, stride, 1, groups=h, bias=False),
            nn.BatchNorm2d(h), nn.ReLU6(inplace=True),
            nn.Conv2d(h, cout, 1, bias=False), nn.BatchNorm2d(cout))   &lt;span class=&quot;c&quot;&gt;# linear bottleneck&lt;/span&gt;
    &lt;span class=&quot;b&quot;&gt;def&lt;/span&gt; forward(self, x):
        y = self.block(x)
        &lt;span class=&quot;b&quot;&gt;return&lt;/span&gt; x + y &lt;span class=&quot;b&quot;&gt;if&lt;/span&gt; self.use_res &lt;span class=&quot;b&quot;&gt;else&lt;/span&gt; y`;
function stop(){}
const PS=[
 {n:&#x27;① bottleneck vs inverted&#x27;,ex:&#x27;&lt;p&gt;ResNet bottleneck 은 &lt;b class=&quot;blue&quot;&gt;줄였다 늘립니다&lt;/b&gt; (256→64→256) — 지름길이 &lt;b&gt;넓은 쪽&lt;/b&gt;에 붙습니다. MobileNetV2 는 반대로 &lt;b class=&quot;teal&quot;&gt;늘렸다 줄입니다&lt;/b&gt; (24→144→24, t = 6) — 지름길이 &lt;b&gt;얇은 쪽&lt;/b&gt;. 그래서 &quot;inverted&quot;.&lt;/p&gt;&lt;p&gt;넓은 가운데에서는 depthwise 3×3 만 하므로 싸고, 블록 사이에 오가는 텐서는 얇아서 메모리가 적습니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{setCode(IRC);await playWd();window.__d3.wd=[[256,64,256],[24,144,24]];setStatus(&#x27;ok&#x27;,&#x27;ResNet: 256→64→256 (지름길 넓음) · V2: 24→144→24 (지름길 얇음)&#x27;);}},
 {n:&#x27;② 파라미터 8,832&#x27;,ex:&#x27;&lt;p&gt;IR(24, 24, s1, t 6): 1×1 24·144 = &lt;b&gt;3,456&lt;/b&gt; + BN 288 + dw 144·9 = &lt;b&gt;1,296&lt;/b&gt; + BN 288 + 1×1 144·24 = &lt;b&gt;3,456&lt;/b&gt; + BN 48 = &lt;b class=&quot;green&quot;&gt;8,832&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;IR(16, 24, s2) 는 &lt;b&gt;5,136&lt;/b&gt; — stride 2 이고 채널이 달라서 지름길이 없습니다. 마지막 1×1 뒤에는 활성화가 없습니다 (&lt;b class=&quot;amber&quot;&gt;linear bottleneck&lt;/b&gt; — 얇은 쪽에서 ReLU 가 정보를 버리지 않도록). 활성화는 ReLU6.&lt;/p&gt;&#x27;,
  run:async()=&gt;{setCode(IRC+`\n\nsum(p.numel() &lt;span class=&quot;b&quot;&gt;for&lt;/span&gt; p &lt;span class=&quot;b&quot;&gt;in&lt;/span&gt; InvertedResidual(24, 24, 1).parameters())   &lt;span class=&quot;c&quot;&gt;# 8832&lt;/span&gt;`);pk=0;let t;for(pn=0;pn&lt;=6;pn++){t=drawPb();await sleep(450);}pk=1;const t2=drawPb();await sleep(900);pk=0;drawPb();window.__d3.ir=[t,t2];setStatus(&#x27;ok&#x27;,`IR(24, 24, s1) = ${fmt(t)} · IR(16, 24, s2) = ${fmt(t2)}`);}},
 {n:&#x27;③ SE — 채널 주의&#x27;,ex:&#x27;&lt;p&gt;SE: ① 채널마다 공간 평균 (&lt;b&gt;squeeze&lt;/b&gt;) → ② FC 두 개 (줄였다 늘리기) → ③ &lt;b class=&quot;purple&quot;&gt;hard-sigmoid&lt;/b&gt; 로 0~1 → ④ 채널마다 곱 (&lt;b&gt;excitation&lt;/b&gt;). &quot;지금 이 이미지에 중요한 채널&quot; 은 키우고 나머지는 줄입니다.&lt;/p&gt;&lt;p&gt;예시의 FC 가중치는 설명용 고정 값입니다. 체크박스로 채널 2 를 밝게 하면 가중치가 어떻게 바뀌는지 보세요.&lt;/p&gt;&#x27;,
  run:async()=&gt;{setCode(`&lt;span class=&quot;b&quot;&gt;class&lt;/span&gt; SE(nn.Module):\n    &lt;span class=&quot;b&quot;&gt;def&lt;/span&gt; __init__(self, c, r=4):\n        super().__init__()\n        self.fc1 = nn.Conv2d(c, c // r, 1)\n        self.fc2 = nn.Conv2d(c // r, c, 1)\n    &lt;span class=&quot;b&quot;&gt;def&lt;/span&gt; forward(self, x):\n        s = x.mean(dim=(2, 3), keepdim=True)       &lt;span class=&quot;c&quot;&gt;# squeeze&lt;/span&gt;\n        s = F.relu(self.fc1(s))\n        s = F.hardsigmoid(self.fc2(s))              &lt;span class=&quot;c&quot;&gt;# 0~1&lt;/span&gt;\n        &lt;span class=&quot;b&quot;&gt;return&lt;/span&gt; x * s                                &lt;span class=&quot;c&quot;&gt;# excitation&lt;/span&gt;`);big=false;$(&#x27;#cBg&#x27;).checked=false;let r;for(seStep=0;seStep&lt;=4;seStep++){r=drawSe();setStatus(&#x27;info&#x27;,$(&#x27;#sel&#x27;).textContent);await sleep(900);}
   big=true;$(&#x27;#cBg&#x27;).checked=true;const r2=drawSe();await sleep(900);window.__d3.se=[r.hs.map(v=&gt;+v.toFixed(3)),r2.hs.map(v=&gt;+v.toFixed(3))];setStatus(&#x27;ok&#x27;,`가중치 ${r.hs.map(v=&gt;v.toFixed(2)).join(&#x27; &#x27;)} → (채널 2 밝게) ${r2.hs.map(v=&gt;v.toFixed(2)).join(&#x27; &#x27;)}`);}},
 {n:&#x27;④ h-swish&#x27;,ex:&#x27;&lt;p&gt;swish = x·σ(x) 는 정확도에 좋지만 sigmoid (exp) 가 장치에서 비쌉니다. &lt;b class=&quot;amber&quot;&gt;h-swish = x · ReLU6(x + 3) / 6&lt;/b&gt; — 곱셈 · 덧셈 · clip 만으로 근사합니다.&lt;/p&gt;&lt;p&gt;x ≤ −3 → 0, x ≥ 3 → x, 사이는 곡선. PyTorch &lt;code&gt;nn.Hardswish&lt;/code&gt;. 같은 원리로 hard-sigmoid = ReLU6(x + 3) / 6.&lt;/p&gt;&#x27;,
  run:async()=&gt;{setCode(`hswish = &lt;span class=&quot;b&quot;&gt;lambda&lt;/span&gt; x: x * F.relu6(x + 3) / 6\nx = torch.linspace(-6, 6, 7)\nprint(hswish(x))\nprint(nn.Hardswish()(x))      &lt;span class=&quot;c&quot;&gt;# 같은 값&lt;/span&gt;`);const out=[];for(const x of [-6,-3,-1.5,0,1.5,3,6]){hx=x;drawHs();out.push(+hsw(x).toFixed(3));setStatus(&#x27;info&#x27;,`x = ${x}: ReLU ${relu(x).toFixed(2)} · swish ${sw(x).toFixed(3)} · h-swish ${hsw(x).toFixed(3)}`);await sleep(650);}hx=1;drawHs();window.__d3.hs=out;setStatus(&#x27;ok&#x27;,&#x27;h-swish: x ≤ −3 → 0 · x ≥ 3 → x · 사이는 swish 근사&#x27;);}},
 {n:&#x27;⑤ MobileNetV3-Small 구조&#x27;,ex:&#x27;&lt;p&gt;torchvision &lt;code&gt;mobilenet_v3_small&lt;/code&gt;: features 안 InvertedResidual &lt;b&gt;11&lt;/b&gt; 개 중 &lt;b class=&quot;purple&quot;&gt;SE 9&lt;/b&gt; 개 (보라 테두리), 앞쪽 3개는 ReLU (RE), 나머지는 h-swish (HS).&lt;/p&gt;&lt;p&gt;224 입력 → 마지막 특징맵 &lt;b&gt;(576, 7, 7)&lt;/b&gt;. classifier = Linear(576→1024) · Hardswish · Dropout · Linear(1024→1000). 전체 &lt;b&gt;2,542,856&lt;/b&gt; params, &lt;b&gt;56,510,400&lt;/b&gt; MAC.&lt;/p&gt;&#x27;,
  run:async()=&gt;{setCode(`&lt;span class=&quot;b&quot;&gt;from&lt;/span&gt; torchvision.models &lt;span class=&quot;b&quot;&gt;import&lt;/span&gt; mobilenet_v3_small\nm = mobilenet_v3_small()\nirs = [b &lt;span class=&quot;b&quot;&gt;for&lt;/span&gt; b &lt;span class=&quot;b&quot;&gt;in&lt;/span&gt; m.features &lt;span class=&quot;b&quot;&gt;if&lt;/span&gt; type(b).__name__ == &lt;span class=&quot;a&quot;&gt;&quot;InvertedResidual&quot;&lt;/span&gt;]\nlen(irs)                                                     &lt;span class=&quot;c&quot;&gt;# 11&lt;/span&gt;\nsum(any(type(x).__name__ == &lt;span class=&quot;a&quot;&gt;&quot;SqueezeExcitation&quot;&lt;/span&gt; &lt;span class=&quot;b&quot;&gt;for&lt;/span&gt; x &lt;span class=&quot;b&quot;&gt;in&lt;/span&gt; b.modules()) &lt;span class=&quot;b&quot;&gt;for&lt;/span&gt; b &lt;span class=&quot;b&quot;&gt;in&lt;/span&gt; irs)   &lt;span class=&quot;c&quot;&gt;# 9&lt;/span&gt;\nm.features(torch.zeros(1, 3, 224, 224)).shape                &lt;span class=&quot;c&quot;&gt;# (1, 576, 7, 7)&lt;/span&gt;`);for(bi=0;bi&lt;11;bi++){drawBlk();const b=BK[bi];setStatus(&#x27;info&#x27;,`블록 ${bi+1}/11 — 출력 ${b[0]}채널 · ${b[2]===&#x27;RE&#x27;?&#x27;ReLU&#x27;:&#x27;h-swish&#x27;}${b[3]===2?&#x27; · stride 2&#x27;:&#x27;&#x27;} · ${b[1]?&#x27;SE 있음&#x27;:&#x27;SE 없음&#x27;}`);await sleep(420);}bi=-1;drawBlk();window.__d3.v3=[BK.length,BK.filter(b=&gt;b[1]).length];setStatus(&#x27;ok&#x27;,&#x27;InvertedResidual 11 · SE 9 · (576, 7, 7)&#x27;);}},
];
initPresets(PS,stop);
setCode(IRC);drawWd();drawPb();drawSe();drawHs();drawBlk();
window.addEventListener(&#x27;resize&#x27;,()=&gt;{drawWd();drawPb();drawSe();drawHs();});
$(&#x27;#presets button&#x27;).click();
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;

function arrow(g,x0,y0,x1,y1,c,w=2,hs=8){const a=Math.atan2(y1-y0,x1-x0),L=Math.hypot(x1-x0,y1-y0);if(L&lt;1)return;hs=Math.min(hs,L*0.6);g.strokeStyle=c;g.fillStyle=c;g.lineWidth=w;g.beginPath();g.moveTo(x0,y0);g.lineTo(x1-Math.cos(a)*hs*0.7,y1-Math.sin(a)*hs*0.7);g.stroke();

function hbars(cv,items,o={}){const [g,W,H]=fitCanvas(cv);g.clearRect(0,0,W,H);const ml=o.ml??110,bh=o.bh??24,gap=o.gap??12,mx=o.max??Math.max(1e-9,...items.map(i=&gt;i.v??0));

const CODE=`&lt;span class=&quot;b&quot;&gt;from&lt;/span&gt; torchvision.models &lt;span class=&quot;b&quot;&gt;import&lt;/span&gt; mobilenet_v3_small, MobileNet_V3_Small_Weights
mnet = mobilenet_v3_small(weights=MobileNet_V3_Small_Weights.IMAGENET1K_V1)
mnet.classifier[3] = nn.Linear(1024, 10)       &lt;span class=&quot;c&quot;&gt;# 1000 → 10&lt;/span&gt;
count_params(mnet)                              &lt;span class=&quot;c&quot;&gt;# 1,528,106&lt;/span&gt;`;
const FE=`&lt;span class=&quot;b&quot;&gt;for&lt;/span&gt; p &lt;span class=&quot;b&quot;&gt;in&lt;/span&gt; mnet.features.parameters():
    p.requires_grad = False                     &lt;span class=&quot;c&quot;&gt;# 동결&lt;/span&gt;
opt = torch.optim.Adam([p &lt;span class=&quot;b&quot;&gt;for&lt;/span&gt; p &lt;span class=&quot;b&quot;&gt;in&lt;/span&gt; mnet.parameters() &lt;span class=&quot;b&quot;&gt;if&lt;/span&gt; p.requires_grad], lr=1e-3)
sum(p.numel() &lt;span class=&quot;b&quot;&gt;for&lt;/span&gt; p &lt;span class=&quot;b&quot;&gt;in&lt;/span&gt; mnet.parameters() &lt;span class=&quot;b&quot;&gt;if&lt;/span&gt; p.requires_grad)   &lt;span class=&quot;c&quot;&gt;# 601,098&lt;/span&gt;`;
const FT=`&lt;span class=&quot;b&quot;&gt;for&lt;/span&gt; p &lt;span class=&quot;b&quot;&gt;in&lt;/span&gt; mnet.parameters():
    p.requires_grad = True                      &lt;span class=&quot;c&quot;&gt;# 전체 학습&lt;/span&gt;
opt = torch.optim.Adam(mnet.parameters(), lr=1e-3)`;
function stop(){}
const PS=[
 {n:&#x27;① 머리 바꾸기 1000 → 10&#x27;,ex:&#x27;&lt;p&gt;사전학습 모델의 마지막 Linear 는 ImageNet &lt;b&gt;1,000&lt;/b&gt; 클래스용 (1024·1000 + 1000 = 1,025,000). CIFAR-10 은 10 클래스이므로 &lt;code&gt;mnet.classifier[3] = nn.Linear(1024, 10)&lt;/code&gt; 으로 교체 (10,250).&lt;/p&gt;&lt;p&gt;결과: 2,542,856 → &lt;b class=&quot;amber&quot;&gt;1,528,106&lt;/b&gt; = features &lt;b&gt;927,008&lt;/b&gt; + classifier &lt;b&gt;601,098&lt;/b&gt;. 새 Linear 만 무작위, 나머지는 ImageNet 지식 그대로.&lt;/p&gt;&#x27;,
  run:async()=&gt;{setCode(CODE);lock=[false,false,false,false,false];swap(false);setStatus(&#x27;info&#x27;,`ImageNet 원본: ${fmt(total())}`);await sleep(1200);const [t,T]=swap(true);await sleep(800);window.__d3.swap=[2542856,T];setStatus(&#x27;ok&#x27;,`classifier[3] 1000 → 10: 전체 ${fmt(T)} = features 927,008 + classifier 601,098`);}},
 {n:&#x27;② feature extraction (동결)&#x27;,ex:&#x27;&lt;p&gt;features 를 동결 (&lt;code&gt;requires_grad = False&lt;/code&gt;) 하고 classifier 만 학습 — 학습 파라미터 &lt;b class=&quot;teal&quot;&gt;601,098&lt;/b&gt; (39%). 기울기를 features 로 보내지 않아 빠르고, 데이터가 적어도 과적합이 덜합니다.&lt;/p&gt;&lt;p&gt;1 epoch test &lt;b class=&quot;rv&quot; data-r=&quot;fe_acc&quot;&gt;&lt;/b&gt; (실행 예).&lt;/p&gt;&#x27;,
  run:async()=&gt;{swap(true);lock=[false,false,false,false,false];drawNet();setCode(FE);await sleep(700);lock[0]=true;const [t,T]=drawNet();drawAcc(0);fillR(R);await sleep(700);window.__d3.fe=t;setStatus(&#x27;ok&#x27;,`학습 파라미터 ${fmt(t)} / ${fmt(T)} (${pct(t,T)})`);}},
 {n:&#x27;③ fine-tuning (전체)&#x27;,ex:&#x27;&lt;p&gt;전체 파라미터 &lt;b class=&quot;amber&quot;&gt;1,528,106&lt;/b&gt; 를 Adam 1e-3 으로 함께 학습. features 도 CIFAR-10 에 맞게 조금씩 바뀝니다 — 보통 정확도가 더 높지만 느리고, 데이터가 너무 적으면 사전학습 지식을 망가뜨릴 수 있습니다 (그때는 lr 을 낮춤).&lt;/p&gt;&lt;p&gt;1 epoch test &lt;b class=&quot;rv&quot; data-r=&quot;ft_acc&quot;&gt;&lt;/b&gt; (실행 예).&lt;/p&gt;&#x27;,
  run:async()=&gt;{swap(true);lock=[true,false,false,false,false];drawNet();setCode(FT);await sleep(700);lock[0]=false;const [t]=drawNet();drawAcc(1);fillR(R);await sleep(700);window.__d3.ft=t;setStatus(&#x27;ok&#x27;,`학습 파라미터 ${fmt(t)} (100%)`);}},
 {n:&#x27;④ 세 방법 비교&#x27;,ex:&#x27;&lt;p&gt;같은 구조 · 같은 1 epoch: feature extraction &lt;b class=&quot;rv&quot; data-r=&quot;fe_acc&quot;&gt;&lt;/b&gt; · fine-tuning &lt;b class=&quot;rv&quot; data-r=&quot;ft_acc&quot;&gt;&lt;/b&gt; · 처음부터 (&lt;code&gt;weights=None, num_classes=10&lt;/code&gt;) &lt;b class=&quot;rv&quot; data-r=&quot;sc_acc&quot;&gt;&lt;/b&gt; (실행 예).&lt;/p&gt;&lt;p&gt;사전학습은 &lt;b&gt;출발점&lt;/b&gt;이 다릅니다 — 처음부터는 1 epoch 로는 특징을 배우기 부족합니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{setCode(CODE+`\n\nscratch = mobilenet_v3_small(weights=None, num_classes=10)`);for(let i=0;i&lt;3;i++){drawAcc(i);await sleep(800);}drawAcc();window.__d3.acc=[rs(R.fe_acc),rs(R.ft_acc),rs(R.sc_acc)];setStatus(&#x27;ok&#x27;,`fe ${rs(R.fe_acc)} · ft ${rs(R.ft_acc)} · scratch ${rs(R.sc_acc)} (실행 예)`);}},
 {n:&#x27;⑤ 주의 3가지&#x27;,ex:&#x27;&lt;p&gt;① &lt;b class=&quot;amber&quot;&gt;ImageNet 정규화&lt;/b&gt; — 사전학습 때와 같은 mean (0.485, 0.456, 0.406), std (0.229, 0.224, 0.225).&lt;/p&gt;&lt;p&gt;② &lt;b class=&quot;amber&quot;&gt;입력이 너무 작으면 안 됨&lt;/b&gt; — 32×32 를 그대로 넣으면 stride 32 후 1×1. &lt;code&gt;Resize(96)&lt;/code&gt; 로 키움 (마지막 특징맵 3×3, MAC 11,057,600).&lt;/p&gt;&lt;p&gt;③ &lt;b class=&quot;amber&quot;&gt;동결한 BN 의 running 통계&lt;/b&gt; — &lt;code&gt;requires_grad=False&lt;/code&gt; 여도 &lt;code&gt;train()&lt;/code&gt; 모드면 running_mean/var 가 바뀝니다. 완전히 고정하려면 BN 을 eval 로.&lt;/p&gt;&#x27;,
  run:async()=&gt;{setCode(`tf_mn = transforms.Compose([\n    transforms.Resize(96),                         &lt;span class=&quot;c&quot;&gt;# 32 → 96&lt;/span&gt;\n    transforms.ToTensor(),\n    transforms.Normalize((0.485, 0.456, 0.406),    &lt;span class=&quot;c&quot;&gt;# ImageNet 정규화&lt;/span&gt;\n                         (0.229, 0.224, 0.225))])\n&lt;span class=&quot;c&quot;&gt;# 동결 BN 고정: mnet.train(); mnet.features.eval()&lt;/span&gt;`);for(const [m,t] of [[&#x27;정규화&#x27;,&#x27;① ImageNet mean/std&#x27;],[&#x27;해상도&#x27;,&#x27;② Resize 96 → 마지막 (576, 3, 3)&#x27;],[&#x27;BN&#x27;,&#x27;③ 동결해도 train() 모드면 BN running 통계가 바뀜&#x27;]]){setStatus(&#x27;info&#x27;,t);await sleep(1000);}window.__d3.caution=3;setStatus(&#x27;ok&#x27;,&#x27;정규화 · 입력 크기 · BN running 통계&#x27;);}},
];
initPresets(PS,stop);
swap(true);drawAcc();setCode(CODE);
window.addEventListener(&#x27;resize&#x27;,()=&gt;{drawNet();drawAcc();});
$(&#x27;#presets button&#x27;).click();
&lt;/script&gt;

&lt;h1&gt;적은 데이터 실험&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;6교시 — 현장 데이터는 보통 적습니다. CIFAR-10 train 50,000장 중 &lt;b style=&quot;color:var(--amber)&quot;&gt;클래스당 100장 = 1,000장&lt;/b&gt;만 써서, 같은 MobileNetV3-S 를 &lt;b style=&quot;color:var(--red)&quot;&gt;처음부터&lt;/b&gt; 학습한 것과 &lt;b style=&quot;color:var(--teal)&quot;&gt;사전학습 + fine-tuning&lt;/b&gt; 한 것을 비교합니다 (증강 · Adam 1e-3 · 배치 64 · 10 epoch · test 10,000장).&lt;/p&gt;
&lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill amber&quot;&gt;np.where(targets == c)[0][:100]&lt;/span&gt;&lt;span class=&quot;pill teal&quot;&gt;np.bincount → 모두 100&lt;/span&gt;&lt;span class=&quot;pill red&quot;&gt;처음부터 &lt;span class=&quot;rv&quot; data-r=&quot;small_sc&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;pill green&quot;&gt;사전학습 &lt;span class=&quot;rv&quot; data-r=&quot;small_pt&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;pill purple&quot;&gt;확인 셀: 차이 &amp;gt; 0.15&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;
  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;균형 부분집합 만들기 — 클래스마다 앞에서 n 장&lt;/h2&gt;
    &lt;div class=&quot;sl&quot;&gt;&lt;label&gt;n&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sN&quot; min=&quot;10&quot; max=&quot;500&quot; step=&quot;10&quot; value=&quot;100&quot;&gt;&lt;output id=&quot;oN&quot;&gt;&lt;/output&gt;&lt;/div&gt;

&lt;div class=&quot;two&quot;&gt;

    &lt;canvas id=&quot;cv&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:#f87171&quot;&gt;&lt;/i&gt;처음부터&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#2dd4bf&quot;&gt;&lt;/i&gt;사전학습 fine-tuning&lt;/span&gt;&lt;/div&gt;

  &lt;/div&gt;
  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;클래스별 정확도 &lt;span class=&quot;tag&quot;&gt;실행 예&lt;/span&gt;&lt;/h2&gt;

 {n:&#x27;② 10 epoch 학습 곡선&#x27;,ex:&#x27;&lt;p&gt;같은 1,000장 · 같은 증강 · Adam 1e-3 · 배치 64 · 10 epoch. &lt;b class=&quot;red&quot;&gt;처음부터&lt;/b&gt; &lt;b class=&quot;rv&quot; data-r=&quot;small_sc&quot;&gt;&lt;/b&gt; vs &lt;b class=&quot;teal&quot;&gt;사전학습&lt;/b&gt; &lt;b class=&quot;rv&quot; data-r=&quot;small_pt&quot;&gt;&lt;/b&gt; (실행 예, test 10,000장).&lt;/p&gt;&lt;p&gt;사전학습 모델은 첫 epoch 부터 높은 곳에서 출발합니다 — ImageNet 에서 배운 모서리 · 질감 · 모양 특징을 그대로 쓰기 때문.&lt;/p&gt;&lt;p&gt;주의: torchvision MobileNetV3 BN momentum 은 &lt;b&gt;0.01&lt;/b&gt;. 적은 step 이면 train 정확도는 오르는데 eval() test 가 &lt;b class=&quot;red&quot;&gt;0.10&lt;/b&gt; 에 머물 수 있음 → 두 모델 모두 &lt;code&gt;set_bn_momentum(m, 0.1)&lt;/code&gt;.&lt;/p&gt;&#x27;,
  run:async()=&gt;{setCode(`&lt;span class=&quot;b&quot;&gt;for&lt;/span&gt; name, w &lt;span class=&quot;b&quot;&gt;in&lt;/span&gt; [(&lt;span class=&quot;a&quot;&gt;&quot;scratch&quot;&lt;/span&gt;, None), (&lt;span class=&quot;a&quot;&gt;&quot;pretrained&quot;&lt;/span&gt;, MobileNet_V3_Small_Weights.IMAGENET1K_V1)]:\n    m = mobilenet_v3_small(weights=w)\n    m.classifier[3] = nn.Linear(1024, 10)\n    set_bn_momentum(m, 0.1)          &lt;span class=&quot;c&quot;&gt;# 기본 0.01 → 0.1 (running 통계가 빨리 따라오게)&lt;/span&gt;\n    opt = torch.optim.Adam(m.parameters(), lr=1e-3)\n    hist[name] = fit(m, small_loader, test_loader_96, 10, opt)`);for(cvN=1;cvN&lt;=10;cvN++){drawCv();setStatus(&#x27;info&#x27;,`epoch ${cvN}/10`);await sleep(260);}window.__d3.curve=[rs(R.small_sc),rs(R.small_pt)];setStatus(&#x27;ok&#x27;,`처음부터 ${rs(R.small_sc)} vs 사전학습 ${rs(R.small_pt)} (실행 예)`);}},
 {n:&#x27;③ 클래스별 정확도&#x27;,ex:&#x27;&lt;p&gt;클래스마다 정답 비율을 비교합니다. 가장 크게 오른 클래스: &lt;b class=&quot;amber&quot;&gt;&lt;span class=&quot;rv&quot; data-r=&quot;small_top_gain&quot;&gt;&lt;/span&gt;&lt;/b&gt; (실행 예).&lt;/p&gt;&lt;p&gt;데이터가 적을 때 처음부터 학습한 모델은 몇몇 클래스를 거의 못 맞히는데, 사전학습 모델은 고르게 올라갑니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{setCode(`pc = M.diagonal() / M.sum(axis=1)       &lt;span class=&quot;c&quot;&gt;# 클래스별 정확도 (혼동 행렬)&lt;/span&gt;\ngain = pc_pt - pc_sc\nCLASSES[gain.argmax()]`);let k=null;for(pcN=1;pcN&lt;=10;pcN++){k=drawPc();await sleep(160);}window.__d3.top=k;setStatus(&#x27;ok&#x27;,`가장 크게 오른 클래스: ${rs(R.small_top_gain)}${k!=null&amp;&amp;k&gt;=0?` (그래프: ${CL[k]})`:&#x27;&#x27;}`);}},
 {n:&#x27;④ 확인 셀 — 차이 &gt; 0.15&#x27;,ex:&#x27;&lt;p&gt;노트북 확인 셀: &lt;code&gt;assert small_pt - small_sc &gt; 0.15&lt;/code&gt;. 사전학습이 &lt;b&gt;크게&lt;/b&gt; 높아야 통과합니다.&lt;/p&gt;&lt;p&gt;현장 데이터 (예: 안전모 사진 수백 장) 로 모델을 만들 때 &lt;b class=&quot;teal&quot;&gt;사전학습 + fine-tuning&lt;/b&gt; 이 기본값인 이유입니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{cvN=10;drawCv();const sc=rn(R.small_sc),pt=rn(R.small_pt);setCode(`print(small_sc, small_pt, small_pt - small_sc)\n&lt;span class=&quot;b&quot;&gt;assert&lt;/span&gt; small_pt - small_sc &gt; 0.15, &lt;span class=&quot;a&quot;&gt;&quot;사전학습 효과가 작습니다&quot;&lt;/span&gt;`);await sleep(600);window.__d3.diff=sc!=null&amp;&amp;pt!=null?+(pt-sc).toFixed(4):null;setStatus(sc!=null&amp;&amp;pt!=null?(pt-sc&gt;0.15?&#x27;ok&#x27;:&#x27;warn&#x27;):&#x27;info&#x27;,sc!=null&amp;&amp;pt!=null?`차이 ${(pt-sc).toFixed(4)} ${pt-sc&gt;0.15?&#x27;&gt; 0.15 통과&#x27;:&#x27;≤ 0.15&#x27;}`:&#x27;실행 결과가 아직 없습니다 — Colab 실행 후 채워집니다&#x27;);}},
 {n:&#x27;⑤ ImageFolder 로 현장 데이터&#x27;,ex:&#x27;&lt;p&gt;오늘은 CIFAR-10 을 쓰지만, 현장 이미지는 폴더로 정리하면 &lt;code&gt;datasets.ImageFolder&lt;/code&gt; 로 그대로 바뀝니다: &lt;code&gt;safety/train/helmet/…&lt;/code&gt;.&lt;/p&gt;&lt;p&gt;&lt;code&gt;classes&lt;/code&gt; = &lt;b class=&quot;amber&quot;&gt;폴더 이름 정렬 순서 = 레이블 번호&lt;/b&gt;. 폴더를 추가하면 번호가 바뀔 수 있으니 &lt;code&gt;class_to_idx&lt;/code&gt; 를 저장해 두세요.&lt;/p&gt;&#x27;,
  run:async()=&gt;{setCode(`train_set = datasets.ImageFolder(&lt;span class=&quot;a&quot;&gt;&quot;safety/train&quot;&lt;/span&gt;, transform=tf_mn)\ntrain_set.classes          &lt;span class=&quot;c&quot;&gt;# 폴더 이름 정렬&lt;/span&gt;\ntrain_set.class_to_idx     &lt;span class=&quot;c&quot;&gt;# {&#x27;helmet&#x27;: 0, &#x27;no_helmet&#x27;: 1, ...}&lt;/span&gt;`);folders=[...BASE];added=&#x27;&#x27;;drawTree();await sleep(800);let m;for(const v of [&#x27;vest&#x27;,&#x27;fire&#x27;,&#x27;smoke&#x27;]){folders.push(v);added=v;m=drawTree();setStatus(&#x27;info&#x27;,`${v}/ 추가 → ${JSON.stringify(m)}`);await sleep(1000);}window.__d3.folder=m;setStatus(&#x27;ok&#x27;,&#x27;classes = 정렬된 폴더 이름 · 번호 = 순서&#x27;);}},
];
initPresets(PS,stop);
setCode(CODE);drawPick();drawCv();drawPc();drawTree();
window.addEventListener(&#x27;resize&#x27;,()=&gt;{drawPick();drawCv();drawPc();});
$(&#x27;#presets button&#x27;).click();
&lt;/script&gt;

&lt;body&gt;
&lt;div class=&quot;app&quot;&gt;
&lt;h1&gt;Grad-CAM 계산&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;7교시 — &quot;모델이 &lt;b&gt;어디를 보고&lt;/b&gt; 이 클래스라고 했나?&quot; 마지막 conv 출력 A&lt;sup&gt;k&lt;/sup&gt; (채널 k 의 특징맵) 와 그 클래스 점수의 기울기 ∂y&lt;sup&gt;c&lt;/sup&gt;/∂A&lt;sup&gt;k&lt;/sup&gt; 만 있으면 됩니다. 아래는 &lt;b style=&quot;color:var(--amber)&quot;&gt;4채널 × 3×3&lt;/b&gt; 장난감 예 — 모든 숫자를 이 페이지가 직접 계산합니다.&lt;/p&gt;
&lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill amber&quot;&gt;α_k = mean(∂y^c/∂A^k)&lt;/span&gt;&lt;span class=&quot;pill teal&quot;&gt;CAM = ReLU(Σ_k α_k A^k)&lt;/span&gt;&lt;span class=&quot;pill blue&quot;&gt;÷ max → 0~1 → bilinear 업샘플&lt;/span&gt;&lt;span class=&quot;pill purple&quot;&gt;ResNet-20 8×8 · MobileNetV3-S 3×3&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;단계별 계산 — A^k (파랑) · 기울기 (빨강 −, 초록 +)&lt;/h2&gt;
  &lt;div class=&quot;stp&quot; id=&quot;stp&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;row ctl&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;bPv&quot;&gt;◀ 이전&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;bNx&quot;&gt;다음 ▶&lt;/button&gt;&lt;label class=&quot;chk&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;cNoRelu&quot;&gt; ReLU 빼 보기&lt;/label&gt;&lt;/div&gt;
  &lt;canvas id=&quot;mat&quot;&gt;&lt;/canvas&gt;
  &lt;div class=&quot;fm&quot; id=&quot;fm&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;
  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;겹쳐 그리기 — 32×32 입력 위에 업샘플한 CAM&lt;/h2&gt;
    &lt;div class=&quot;sl&quot;&gt;&lt;label&gt;투명도&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sA&quot; min=&quot;0&quot; max=&quot;100&quot; value=&quot;55&quot;&gt;&lt;output id=&quot;oA&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;canvas id=&quot;ov&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;Python (노트북 7교시)&lt;/h2&gt;&lt;div class=&quot;code&quot; id=&quot;code&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;상태&lt;/h2&gt;&lt;div class=&quot;status info&quot; id=&quot;status&quot;&gt;프리셋을 누르세요.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;CAM 해상도 — ResNet-20 layer3 8×8 (32 입력, stride 4) vs MobileNetV3-S features[-1] 3×3 (96 입력, stride 32) · 모식도&lt;/h2&gt;
  &lt;canvas id=&quot;res&quot;&gt;&lt;/canvas&gt;
  &lt;div class=&quot;note&quot;&gt;같은 &quot;관심 영역&quot; 을 8×8 칸과 3×3 칸으로 나타낸 모식도입니다. 3×3 은 &quot;대략 아래 가운데&quot; 정도만 알려 줍니다 — 위치가 중요하면 객체 탐지 (Day 4).&lt;/div&gt;

&lt;script&gt;
const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,ms));
let busy=false, timer=null;
function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}
function setCode(h){$(&#x27;#code&#x27;).innerHTML=h;}

&lt;span class=&quot;b&quot;&gt;def&lt;/span&gt; fwd_hook(m, inp, out):
    acts[&lt;span class=&quot;a&quot;&gt;&quot;A&quot;&lt;/span&gt;] = out
    &lt;span class=&quot;b&quot;&gt;if&lt;/span&gt; out.requires_grad:
        out.register_hook(&lt;span class=&quot;b&quot;&gt;lambda&lt;/span&gt; g: grads.__setitem__(&lt;span class=&quot;a&quot;&gt;&quot;G&quot;&lt;/span&gt;, g))
h = target_layer.register_forward_hook(fwd_hook)
logits = model(x)
cls = logits.argmax(1)
model.zero_grad()
logits[torch.arange(len(x)), cls].sum().backward()
alpha = grads[&lt;span class=&quot;a&quot;&gt;&quot;G&quot;&lt;/span&gt;].mean(dim=(2, 3), keepdim=True)      &lt;span class=&quot;c&quot;&gt;# GAP&lt;/span&gt;
cam = F.relu((alpha * acts[&lt;span class=&quot;a&quot;&gt;&quot;A&quot;&lt;/span&gt;]).sum(dim=1))
cam = cam / (cam.amax(dim=(1, 2), keepdim=True) + 1e-8)     &lt;span class=&quot;c&quot;&gt;# 0~1&lt;/span&gt;
cam = F.interpolate(cam[:, None], size=x.shape[-2:], mode=&lt;span class=&quot;a&quot;&gt;&quot;bilinear&quot;&lt;/span&gt;)
h.remove()`;
function stop(){}
const PS=[
 {n:&#x27;① A^k 와 기울기&#x27;,ex:&#x27;&lt;p&gt;마지막 conv 출력 &lt;b class=&quot;blue&quot;&gt;A^k&lt;/b&gt; 는 forward hook 으로, 클래스 c 점수 y^c 의 기울기 &lt;b&gt;∂y^c/∂A^k&lt;/b&gt; 는 &lt;code&gt;out.register_hook&lt;/code&gt; 으로 저장합니다 (&lt;code&gt;requires_grad&lt;/code&gt; 일 때만).&lt;/p&gt;&lt;p&gt;기울기가 &lt;b class=&quot;green&quot;&gt;+&lt;/b&gt; 인 채널은 &quot;이 채널이 커지면 그 클래스 점수가 오른다&quot;, &lt;b class=&quot;red&quot;&gt;−&lt;/b&gt; 는 반대. 예: 하늘 채널은 automobile 점수를 내립니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{setCode(CODE);noRelu=false;$(&#x27;#cNoRelu&#x27;).checked=false;goS(0);await sleep(1200);window.__d3.A=4;setStatus(&#x27;ok&#x27;,&#x27;A: 4채널 × 3×3 · 기울기: 같은 shape&#x27;);}},
 {n:&#x27;② α = GAP(기울기)&#x27;,ex:&#x27;&lt;p&gt;채널마다 기울기를 공간 평균 → 숫자 하나 &lt;b class=&quot;amber&quot;&gt;α_k&lt;/b&gt; = 그 채널의 중요도. 코드: &lt;code&gt;grads.mean(dim=(2, 3), keepdim=True)&lt;/code&gt;.&lt;/p&gt;&lt;p&gt;예: α₀ (자동차 몸체) 은 크고 양수, α₁ (하늘) 은 음수.&lt;/p&gt;&#x27;,
  run:async()=&gt;{goS(1);await sleep(1000);const r=gradcam();window.__d3.alpha=r.al.map(v=&gt;+v.toFixed(4));setStatus(&#x27;ok&#x27;,`α = [${r.al.map(v=&gt;v.toFixed(3)).join(&#x27;, &#x27;)}]`);}},
 {n:&#x27;③ 가중합 → ReLU&#x27;,ex:&#x27;&lt;p&gt;&lt;code&gt;(alpha * acts).sum(dim=1)&lt;/code&gt; — 중요도로 채널들을 더해 3×3 지도 하나. 그다음 &lt;b class=&quot;teal&quot;&gt;ReLU&lt;/b&gt;: 그 클래스 점수를 &lt;b&gt;올리는&lt;/b&gt; 위치만 남깁니다 (음수 = 다른 클래스 쪽 증거).&lt;/p&gt;&lt;p&gt;체크박스 &quot;ReLU 빼 보기&quot; 로 차이를 확인하세요.&lt;/p&gt;&#x27;,
  run:async()=&gt;{noRelu=false;$(&#x27;#cNoRelu&#x27;).checked=false;goS(2);await sleep(1100);const r=goS(3);await sleep(1000);noRelu=true;$(&#x27;#cNoRelu&#x27;).checked=true;drawMat();setStatus(&#x27;warn&#x27;,&#x27;ReLU 없음 — 음수 칸이 섞임&#x27;);await sleep(1100);noRelu=false;$(&#x27;#cNoRelu&#x27;).checked=false;drawMat();window.__d3.S=r.S.map(x=&gt;x.map(v=&gt;+v.toFixed(4)));setStatus(&#x27;ok&#x27;,`음수 칸 ${r.S.flat().filter(v=&gt;v&lt;0).length}개 → ReLU 로 0`);}},
 {n:&#x27;④ 정규화 · 업샘플 · 겹치기&#x27;,ex:&#x27;&lt;p&gt;최댓값으로 나눠 &lt;b&gt;0~1&lt;/b&gt; → &lt;code&gt;F.interpolate(…, mode=&quot;bilinear&quot;)&lt;/code&gt; 로 입력 크기 (32×32) 까지 부드럽게 키움 → 원본 위에 반투명하게 겹쳐 그립니다.&lt;/p&gt;&lt;p&gt;밝은 곳 = 모델이 automobile 이라고 판단할 때 근거가 된 위치 (이 장난감 예에서는 아래 가운데 차체).&lt;/p&gt;&#x27;,
  run:async()=&gt;{noRelu=false;$(&#x27;#cNoRelu&#x27;).checked=false;goS(4);await sleep(1000);goS(5);for(const a of [0,.2,.4,.6,.8,.55]){alphaO=a;drawOv();await sleep(300);}const r=gradcam();window.__d3.N=r.N.map(x=&gt;x.map(v=&gt;+v.toFixed(3)));setStatus(&#x27;ok&#x27;,&#x27;3×3 → bilinear 32×32 → 겹치기&#x27;);}},
 {n:&#x27;⑤ 8×8 vs 3×3&#x27;,ex:&#x27;&lt;p&gt;CAM 크기 = 마지막 conv 특징맵 크기. ResNet-20 layer3 은 32 입력에서 &lt;b class=&quot;teal&quot;&gt;8×8&lt;/b&gt; (stride 4), MobileNetV3-S features[-1] 은 96 입력에서 &lt;b class=&quot;amber&quot;&gt;3×3&lt;/b&gt; (stride 32).&lt;/p&gt;&lt;p&gt;3×3 은 거칠어서 &quot;대략 어디&quot; 만 알려 줍니다. 오답에서 &lt;b&gt;예측 클래스 CAM&lt;/b&gt; 과 &lt;b&gt;정답 클래스 CAM&lt;/b&gt; 을 비교하면 배경 · 맥락에 속았는지 볼 수 있습니다. 위치가 중요하면 → &lt;b&gt;탐지 (Day 4)&lt;/b&gt;.&lt;/p&gt;&#x27;,
  run:async()=&gt;{for(const m of [0,2,1,3]){resOn=m;drawRes();await sleep(800);}window.__d3.res=[8,3];setStatus(&#x27;ok&#x27;,&#x27;ResNet-20 8×8 vs MobileNetV3-S 3×3 — 해상도가 낮을수록 위치가 거칠다&#x27;);}},
];
initPresets(PS,stop);
setCode(CODE);goS(0);drawRes();
window.addEventListener(&#x27;resize&#x27;,()=&gt;{drawMat();drawRes();});
$(&#x27;#presets button&#x27;).click();
&lt;/script&gt;

&lt;p class=&quot;sub&quot;&gt;8교시 미니 프로젝트 — &lt;b style=&quot;color:var(--teal)&quot;&gt;사전학습 MobileNetV3-Small 전이학습&lt;/b&gt; (96 입력) vs Day 2 &lt;b style=&quot;color:var(--blue)&quot;&gt;ResNet-20&lt;/b&gt; (처음부터, 32 입력). 정확도 · 파라미터 · MAC · CPU 지연시간을 한 표에 놓고, &lt;b&gt;장치 조건&lt;/b&gt;에 맞는 모델을 고릅니다. 강사 사전 실행 예 test &lt;b class=&quot;rv&quot; data-r=&quot;proj_acc&quot;&gt;&lt;/b&gt;.&lt;/p&gt;

  &lt;div class=&quot;row ctl&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;bPv&quot;&gt;◀ 이전&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;bNx&quot;&gt;다음 ▶&lt;/button&gt;&lt;/div&gt;

 {n:&#x27;③ 비교표&#x27;,ex:&#x27;&lt;p&gt;ResNet-20 (처음부터, 32): &lt;b&gt;272,474&lt;/b&gt; · &lt;b&gt;40,813,184&lt;/b&gt; MAC · &lt;b class=&quot;rv&quot; data-r=&quot;lat_r20&quot;&gt;&lt;/b&gt; ms · &lt;b class=&quot;rv&quot; data-r=&quot;acc_r20&quot;&gt;&lt;/b&gt;.&lt;br&gt;MobileNetV3-S (전이학습, 96): &lt;b&gt;1,528,106&lt;/b&gt; · &lt;b&gt;11,057,600&lt;/b&gt; MAC · &lt;b class=&quot;rv&quot; data-r=&quot;lat_mn96&quot;&gt;&lt;/b&gt; ms · &lt;b class=&quot;rv&quot; data-r=&quot;proj_acc&quot;&gt;&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;파라미터는 MobileNet 이 &lt;b class=&quot;amber&quot;&gt;5.6배&lt;/b&gt; 많은데 MAC 은 약 &lt;b class=&quot;teal&quot;&gt;1/3.7&lt;/b&gt;. 어느 쪽이 빠른지는 MAC 만으로 정할 수 없습니다 — 3교시의 메모리 병목.&lt;/p&gt;&#x27;,

 {n:&#x27;④ 예산으로 고르기&#x27;,ex:&#x27;&lt;p&gt;장치 조건 = &lt;b&gt;지연시간 예산&lt;/b&gt; (예: 30 FPS → 33 ms) + &lt;b&gt;목표 정확도&lt;/b&gt;. 두 조건을 모두 만족하는 모델 중 가장 빠른 것을 고릅니다.&lt;/p&gt;&lt;p&gt;슬라이더로 예산을 줄여 보세요. 아무것도 남지 않으면 → 해상도 낮추기 · 더 작은 모델 · 양자화 (Quantization, 11/16~) · ONNX · TensorRT (11/4~).&lt;/p&gt;&#x27;,
  run:async()=&gt;{const out=[];for(const [b,t] of [[33,.85],[5,.85],[1,.85],[33,.9],[100,.8],[33,.85]]){bud=b;tgt=t;out.push(decide());setStatus(&#x27;info&#x27;,`예산 ${b} ms · 목표 ${t.toFixed(2)} → ${out[out.length-1]??&#x27;선택 없음 / 판단 보류&#x27;}`);await sleep(900);}window.__d3.pick=out;setStatus(&#x27;ok&#x27;,&#x27;조건 2개 (지연시간 · 정확도) 를 동시에 — 장치에서 잰 숫자로&#x27;);}},

<script>
const ids = [...document.querySelectorAll('nav button')].map(b => b.dataset.id);
function fit(fr) {
  try {
    const d = fr.contentDocument; if (!d || !d.body) return;
    fr.style.height = Math.max(600, d.documentElement.scrollHeight) + 'px';
  } catch (e) {}
}
function show(id, push) {
  if (!ids.includes(id)) id = ids[0];
  document.querySelectorAll('section.lesson').forEach(s => s.classList.toggle('active', s.id === id));
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-current', b.dataset.id === id ? 'true' : 'false'));
  const sec = document.getElementById(id);
  document.title = sec.dataset.title + ' — Vision 기본 모델 Day 3';
  const fr = sec.querySelector('iframe');
  fr.loading = 'eager'; fit(fr);
  if (push) history.replaceState(null, '', '#' + id);
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('section.lesson iframe').forEach(fr => {
  fr.addEventListener('load', () => {
    fit(fr);
    try {
      new ResizeObserver(() => fit(fr)).observe(fr.contentDocument.body);
      fr.contentDocument.addEventListener('keydown', key);   // iframe 안에서도 ← → 동작
    } catch (e) {}
  });
});
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.id, true));
function key(e) {
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const cur = ids.indexOf(location.hash.slice(1) || ids[0]);
  if (e.key === 'ArrowRight' && cur < ids.length - 1) show(ids[cur + 1], true);
  if (e.key === 'ArrowLeft' && cur > 0) show(ids[cur - 1], true);
}
document.addEventListener('keydown', key);
window.addEventListener('resize', () => document.querySelectorAll('section.lesson.active iframe').forEach(fit));
window.addEventListener('hashchange', () => show(location.hash.slice(1), false));   // 주소창에서 #d3-N 을 바꿔도 이동
show(location.hash.slice(1), false);
</script>
