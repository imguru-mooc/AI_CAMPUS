<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vision 기본 모델 Day 3 개념 워크시트</title>
<style>
  :root{--bg:#0b1220;--panel:#111a2e;--line:#1f2b45;--text:#dbe4f0;--dim:#8a9bb8;--amber:#f5b942;--teal:#2dd4bf;--blue:#60a5fa;--green:#4ade80;--red:#f87171;--purple:#c084fc;--mono:"Consolas","D2Coding","JetBrains Mono",monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR","Segoe UI",sans-serif;font-size:15px;line-height:1.55}
  .app{max-width:920px;margin:0 auto;padding:22px 20px 40px}
  h1{color:var(--amber);font-size:24px;margin:0 0 6px}
  .sub{color:var(--dim);margin:0 0 14px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
  .panel h2{font-size:14px;color:var(--dim);margin:0 0 10px;font-weight:600}
  button{background:#172239;border:1px solid #2a3a5c;color:var(--text);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--amber)}button.active{background:#3a2e12;border-color:var(--amber);color:var(--amber)}
  button.primary{background:#123d33;border-color:var(--teal);color:var(--teal);font-weight:700;padding:9px 18px;font-size:14px}
  button.submit{background:#3a2e12;border-color:var(--amber);color:var(--amber);font-weight:700;padding:9px 18px;font-size:14px}
  button:disabled{opacity:.5;cursor:default}
  button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  input[type=text]{background:#0a0f1c;color:var(--text);border:1px solid #2a3a5c;border-radius:6px;padding:6px 10px;font-family:var(--mono);font-size:14px}
  select{background:#0a0f1c;color:var(--text);border:1px solid #2a3a5c;border-radius:6px;padding:4px 8px;font-family:inherit;font-size:14px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px}
  .tabs button .s{font-family:var(--mono);font-size:11px;color:var(--dim);margin-left:6px}
  .tabs button.graded .s{color:var(--green)}
  .legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .tag{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--dim);font-family:var(--mono)}
  .head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .head .t{color:var(--amber);font-size:17px}
  .head .a{font-size:13px;color:var(--teal);font-family:var(--mono)}
  .q{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;background:#0e1628}
  .q.unans{border-color:#5a3a1a}
  .q.ok{border-color:#1f6b45}.q.bad{border-color:#7a2e2e}
  .qh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .q .n{font-family:var(--mono);color:var(--dim);font-size:12px}
  .ty{font-size:11.5px;border-radius:999px;padding:1px 9px;border:1px solid}
  .q .p{margin:6px 0 10px;font-size:15px}
  .q code,.fb code,.dg code{font-family:var(--mono);color:var(--blue);background:#0a0f1c;padding:1px 5px;border-radius:4px}
  .q pre{font-family:var(--mono);background:#0a0f1c;border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:6px 0 4px;font-size:14px;white-space:pre;overflow-x:auto;line-height:1.9}
  .q pre input{font-size:13px;padding:2px 6px;width:auto;min-width:5ch}
  .opts{display:grid;gap:6px}
  .opt{text-align:left;padding:8px 12px;font-size:14px}
  .opt .box{display:inline-block;width:18px;font-family:var(--mono);color:var(--dim)}
  .opt.sel{border-color:var(--amber);background:#1f1a0c}
  .opt.ok{border-color:var(--green);color:var(--green);background:#0d2216}
  .opt.bad{border-color:var(--red);color:var(--red);background:#2a1212}
  .opt.miss{border-color:var(--green);border-style:dashed}
  .ox{display:flex;gap:10px}
  .ox button{font-size:22px;width:78px;height:54px;font-weight:700}
  .fill{line-height:2.3}
  .mrow{display:grid;grid-template-columns:1fr 24px minmax(160px,1.2fr);gap:8px;align-items:center;margin-bottom:6px}
  .mrow .l{background:#0a0f1c;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:14px}
  .mrow select{width:100%}
  .mrow .arr{color:var(--dim);text-align:center}
  .mrow.ok select{border-color:var(--green)}.mrow.bad select{border-color:var(--red)}
  .ord{list-style:none;margin:0;padding:0;display:grid;gap:6px}
  .ord li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;background:#0a0f1c;border:1px solid #2a3a5c;border-radius:8px;padding:7px 10px;cursor:grab;font-size:14px}
  .ord li.drag{opacity:.4}.ord li.over{border-color:var(--amber)}
  .ord li .k{font-family:var(--mono);color:var(--dim)}
  .ord li .mv button{padding:2px 8px;margin-left:4px}
  .ord li.ok{border-color:var(--green)}.ord li.bad{border-color:var(--red)}
  .hot{background:#0a0f1c;border:1px solid var(--line);border-radius:8px;padding:6px;overflow-x:auto}
  .hot svg{display:block;max-width:100%;height:auto;margin:0 auto}
  .hot .rg{cursor:pointer;fill:transparent;stroke:transparent;stroke-width:2.5}
  .hot .rg:hover{stroke:#f5b94288}
  .hot .rg.sel{stroke:var(--amber);fill:#f5b94222}
  .hot .rg.ok{stroke:var(--green);fill:#4ade8026}
  .hot .rg.bad{stroke:var(--red);fill:#f8717126}
  .card{perspective:900px;max-width:560px}
  .card .in{position:relative;min-height:130px;transition:transform .5s;transform-style:preserve-3d}
  .card.flip .in{transform:rotateY(180deg)}
  .card .f,.card .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;border:1px solid #2a3a5c;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px 18px;font-size:16px}
  .card .f{background:#14203a;color:var(--amber)}
  .card .b{background:#0f2a27;color:var(--teal);transform:rotateY(180deg)}
  @media (prefers-reduced-motion:reduce){.card .in{transition:none}}
  .selfrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
  .selfrow .hint{margin-left:4px}
  .fb{margin-top:10px;font-size:13px;color:var(--dim);border-left:3px solid var(--line);padding-left:10px}
  .fb.ok{border-left-color:var(--green)}.fb.bad{border-left-color:var(--red)}
  .fb b.v{display:block;margin-bottom:2px}
  .fb.ok b.v{color:var(--green)}.fb.bad b.v{color:var(--red)}
  .fb .anim{color:var(--teal);font-family:var(--mono);font-size:12px;display:block;margin-top:3px}
  .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
  .code{font-family:var(--mono);font-size:20px;color:var(--amber);letter-spacing:1px}
  .score{font-family:var(--mono);color:var(--green);font-size:16px}
  .hint{color:var(--dim);font-size:13px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:0;max-width:860px;width:92vw;max-height:88vh}
  dialog::backdrop{background:#000a}
  .dg{padding:18px 20px}
  .dg h3{color:var(--amber);margin:0 0 4px;font-size:20px}
  .dg .meta{color:var(--dim);font-size:13px;margin-bottom:12px;font-family:var(--mono)}
  .dg .sec{margin:14px 0 6px;color:var(--teal);font-weight:700;font-size:14px}
  .dg table{width:100%;border-collapse:collapse;font-size:13px}
  .dg th{text-align:left;color:var(--dim);font-weight:600;padding:5px 8px;border-bottom:1px solid var(--line);font-size:12px}
  .dg td{padding:5px 8px;border-bottom:1px solid #16203a;vertical-align:top}
  .dg .ok{color:var(--green)}.dg .bad{color:var(--red)}.dg .none{color:var(--dim)}
  .dg .sum{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0;font-family:var(--mono)}
  .dgbar{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 20px;display:flex;gap:8px;justify-content:flex-end;align-items:center}
  .toast{color:var(--green);font-size:13px;margin-right:auto}
  .body{overflow:auto;max-height:calc(88vh - 60px)}
  @media(max-width:600px){.mrow{grid-template-columns:1fr;gap:4px}.mrow .arr{display:none}}
</style>
</head>
<body>
<div class="app">
  <h1>Vision 기본 모델 Day 3 개념 워크시트</h1>
  <p class="sub">교시마다 10문항 — 객관식 · O/X · 빈칸 · 짝 맞추기 · 순서 배열 · 핫스팟 · 코드 완성 등 9가지 유형이 섞여 나옵니다. 답을 고른 뒤 아래 <b style="color:var(--teal)">채점하기</b>를 누르면 정오 · 해설과 결과 코드가 나타납니다. 채점 전에는 답을 바꿀 수 있고, 채점 후에는 잠깁니다. 모든 교시를 마치면 <b style="color:var(--amber)">제출</b>로 오답 정리를 열고, <b>캡처</b>로 복사해 노션에 붙여 넣으세요.</p>

  <div class="panel">
    <div class="row"><label style="color:var(--dim);font-size:13px">이름 <input type="text" id="name" placeholder="홍길동"></label><span class="hint">이름은 결과 코드 계산에만 쓰이며 저장되지 않습니다.</span></div>
  </div>
  <div class="panel"><h2>교시</h2><div class="tabs" id="tabs"></div><div class="legend" id="legend"></div></div>
  <div class="panel" id="sheet"></div>
  <div class="panel">
    <div class="actions">
      <button class="primary" id="gradeBtn">채점하기</button>
      <span class="score" id="rscore"></span>
      <span class="hint" id="rhint"></span>
      <span class="code" id="rcode">—</span>
    </div>
    <div class="actions" style="margin-top:12px">
      <button class="submit" id="submitBtn">제출 (오답 정리)</button>
      <button id="resetBtn">이 교시 다시 풀기</button>
    </div>
  </div>
</div>

<dialog id="dlg">
  <div class="body"><div class="dg" id="dgBody"></div></div>
  <div class="dgbar"><span class="toast" id="toast"></span><button id="captureBtn" class="primary">📋 캡처 (노션용 복사)</button><button id="closeBtn">닫기</button></div>
</dialog>

<script>
const Q = [{"t": "1교시 · 복습 · 정확도 vs 속도", "anim": "D3-1 정확도 vs 속도", "qs": [{"type": "single", "p": "문제 1-1 — Day 2 에서 만든 CIFAR-10 용 <b>ResNet-20</b> (입력 32×32) 의 파라미터 수는?", "o": ["272,474", "11,689,512", "2,542,856", "25,557,032"], "a": 0, "w": "ResNet-20 은 272,474 개 (약 0.27M) 로 ImageNet 용 ResNet-18 (11.7M) 의 1/43 입니다. 실행 예: Day 2 가중치 (20 epoch) test 0.8587.", "an": "문제 1-1"}, {"type": "single", "p": "카메라 영상을 <b>30 FPS</b> 로 실시간 처리하려면 이미지 한 장의 처리 (지연시간) 가 대략 몇 ms 안에 끝나야 하나요?", "o": ["약 30 ms", "약 3.3 ms", "약 33 ms", "약 300 ms"], "a": 2, "w": "1000 ms / 30 장 = 33.3 ms. 실행 예 (CPU 1 스레드): ResNet-50 (224) 134 ms · MobileNetV3-S (224) 8.8 ms — 장치에서 ResNet-50 은 실시간이 어렵습니다.", "an": "D3-1 · 정확도 vs 속도"}, {"type": "multi", "p": "문제 1-2 — 온디바이스 조건으로 지연시간을 잴 때의 규칙으로 <b>옳은 것</b>을 모두 고르세요.", "o": ["CPU 에서 <code>torch.set_num_threads(1)</code> 로 스레드 1개만 쓴다", "카메라 프레임처럼 배치 1장을 넣는다", "첫 실행이 진짜 속도이므로 warm-up 없이 한 번만 잰다", "처음 몇 번 (warm-up) 은 버리고 여러 번 잰 평균을 쓴다", "GPU 에서 배치 128 로 잰 시간을 128 로 나누면 장치의 한 장 지연시간과 같다"], "a": [0, 1, 3], "w": "첫 실행은 메모리 할당 · 캐시 때문에 느려 버립니다. 배치로 나눈 처리량 (throughput) 은 한 장이 들어와 결과가 나오기까지의 지연시간 (latency) 과 다릅니다.", "an": "문제 1-2"}, {"type": "ox", "p": "ResNet-50 (224×224) 의 MAC 은 MobileNetV3-Small (224×224) 의 약 72배다.", "a": true, "w": "4,089,184,256 / 56,510,400 ≈ 72.4. 그런데 ImageNet top-1 차이는 76.1% vs 67.7% 로 8.4%p 입니다 — 연산을 크게 줄이고 정확도를 조금 내주는 것이 경량 모델의 방향입니다.", "an": "문제 1-3"}, {"type": "short", "p": "문제 1-2 — <code>latency_ms</code> 는 원래 모델을 건드리지 않으려고 <code>copy</code> 모듈의 어떤 함수로 모델을 복사한 뒤 <code>.cpu()</code> 로 옮기나요? (함수 이름)", "a": ["deepcopy", "copy.deepcopy", "deepcopy()", "copy.deepcopy()"], "w": "<code>model.cpu()</code> 는 제자리에서 옮기므로 GPU 의 r20 을 그대로 쓰면 이후 학습 코드가 CPU 모델을 쓰게 됩니다. 실행 예: ResNet-20 (32) 2.87 ms.", "an": "문제 1-2"}, {"type": "drop", "p": "ImageNet top-1 (torchvision 사전학습) 비교입니다. 빈칸에 알맞은 것을 고르세요.", "p2": "MobileNetV3-Large 는 top-1 {} 로 ResNet-18 (69.8%) 보다 높은데 MAC 은 {} 이다. ResNet-50 은 {} 로 가장 높지만 4.09 GMAC 이다.", "opts": [["67.7%", "74.0%", "71.9%"], ["1.81G", "56.5M", "217M"], ["76.1%", "80.2%", "69.8%"]], "a": [1, 2, 0], "w": "MobileNetV3-Large 74.0% · 217M MAC, ResNet-18 69.8% · 1.81G — 연산은 1/8 인데 정확도는 더 높습니다. MobileNetV3-Small 67.7% · 56.5M, MobileNetV2 71.9% · 301M.", "an": "1교시 · 정확도 vs 속도"}, {"type": "match", "p": "문제 1-3 — 모델과 파라미터 수를 짝지으세요.", "left": ["ResNet-20 (CIFAR)", "ResNet-18", "ResNet-50", "MobileNetV3-Small"], "right": ["272,474", "11,689,512", "25,557,032", "2,542,856"], "a": [0, 1, 2, 3], "w": "MAC (224 입력): ResNet-18 1,814,073,344 · ResNet-50 4,089,184,256 · MobileNetV3-S 56,510,400. ResNet-20 은 32 입력에서 40,813,184.", "an": "문제 1-3"}, {"type": "order", "p": "문제 1-2 — <code>latency_ms(model, input_size, reps=30, threads=1)</code> 의 진행 순서로 배열하세요.", "items": ["<code>copy.deepcopy(model).cpu().eval()</code>", "현재 스레드 수를 기억하고 <code>torch.set_num_threads(1)</code>", "<code>torch.no_grad()</code> 안에서 warm-up 3회 (버림)", "<code>time.perf_counter()</code> 로 30회 실행 시간을 재서 평균", "스레드 수를 원래대로 돌려놓고 ms 로 반환"], "w": "복사 → CPU · eval → 스레드 1 → warm-up → 측정 · 평균 → 원복. 스레드를 돌려놓지 않으면 이후 Colab 의 다른 CPU 작업이 느려집니다.", "an": "문제 1-2"}, {"type": "hot", "p": "ImageNet top-1 vs MAC 그래프입니다. <b>ResNet-18 보다 정확도가 높은 모델 중 MAC 이 가장 적은 모델</b>의 점을 클릭하세요.", "w": "MobileNetV3-Large (74.0%, 217M) 입니다. ResNet-18 (69.8%) 보다 높은 것은 MobileNetV2 71.9% (301M) · MobileNetV3-Large 74.0% (217M) · ResNet-50 76.1% (4.09G) 이고 그중 MAC 이 가장 적습니다. MobileNetV3-Small 은 MAC 은 가장 적지만 67.7% 로 ResNet-18 보다 낮습니다. 왼쪽 위로 갈수록 좋은 모델입니다.", "an": "D3-1 · 정확도 vs 속도", "viewBox": "0 0 760 320", "sw": 760, "svg": "<defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#8a9bb8\"/></marker><marker id=\"ahr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#f87171\"/></marker></defs><text x=\"20\" y=\"20\" font-size=\"12\" fill=\"#dbe4f0\" text-anchor=\" nt-baseline=\"middle\">76%</text><line x1=\"80\" y1=\"70.0\" x2=\"740\" y2=\"70.0\" stroke=\"#22314f\" stroke-dasharray=\"2 4\"/><text x=\"74\" y=\"70.0\" font-size=\"10\" fill=\"#8a9bb8\" text-anchor=\"end\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">78%</text><text x=\"410.0\" y=\"304\" font-size=\"11\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">MAC (이미지 한 장, 로그 눈금) →  오른쪽일수록 무겁다</text><text x=\"30\" y=\"46\" font-size=\"10.5\" fill=\"#8a9bb8\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">top-1</text><circle cx=\"158.9\" cy=\"241.7\" r=\"6\" fill=\"#2dd4bf\" stroke=\"#2dd4bf\"/><text x=\"172.9\" y=\"231.7\" font-size=\"11\" fill=\"#2dd4bf\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">MobileNetV3-Small</text><text x=\"172.9\" y=\"249.7\" font-size=\"10\" fill=\"#8a9bb8\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">67.7% · 56.5M</text><circle cx=\"326.5\" cy=\"136.7\" r=\"6\" fill=\"#2dd4bf\" stroke=\"#2dd4bf\"/><text x=\"312.5\" y=\"126.69999999999999\" font-size=\"11\" fill=\"#2dd4bf\" text-anchor=\"end\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">MobileNetV3-Large</text><text x=\"312.5\" y=\"144.7\" font-size=\"10\" fill=\"#8a9bb8\" text-anchor=\"end\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">74.0% · 217M</text><circle cx=\"367.2\" cy=\"171.7\" r=\"6\" fill=\"#2dd4bf\" stroke=\"#2dd4bf\"/><text x=\"381.2\" y=\"161.7\" font-size=\"11\" fill=\"#2dd4bf\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">MobileNetV2</text><text x=\"381.2\" y=\"179.7\" font-size=\"10\" fill=\"#8a9bb8\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">71.9% · 301M</text><circle cx=\"591.0\" cy=\"206.7\" r=\"6\" fill=\"#f5b942\" stroke=\"#f5b942\"/><text x=\"577.0\" y=\"196.7\" font-size=\"11\" fill=\"#f5b942\" text-anchor=\"end\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">ResNet-18</text><text x=\"577.0\" y=\"214.7\" font-size=\"10\" fill=\"#8a9bb8\" text-anchor=\"end\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">69.8% · 1814M</text><circle cx=\"692.2\" cy=\"101.7\" r=\"6\" fill=\"#f5b942\" stroke=\"#f5b942\"/><text x=\"678.2\" y=\"91.7\" font-size=\"11\" fill=\"#f5b942\" text-anchor=\"end\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">ResNet-50</text><text x=\"678.2\" y=\"109.7\" font-size=\"10\" fill=\"#8a9bb8\" text-anchor=\"end\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">76.1% · 4089M</text>", "regions": [{"id": "v3s", "label": "MobileNetV3-Small", "x": 138.9, "y": 221.7, "w": 40, "h": 40}, {"id": "v3l", "label": "MobileNetV3-Large", "x": 306.5, "y": 116.7, "w": 40, "h": 40}, {"id": "v2", "label": "MobileNetV2", "x": 347.2, "y": 151.7, "w": 40, "h": 40}, {"id": "r18", "label": "ResNet-18", "x": 571.0, "y": 186.7, "w": 40, "h": 40}, {"id": "r50", "label": "ResNet-50", "x": 672.2, "y": 81.7, "w": 40, "h": 40}], "a": "v3l"}, {"type": "code", "p": "문제 1-2 — 온디바이스 조건의 지연시간 측정 함수를 완성하세요.", "code": "def latency_ms(model, input_size, reps=30, threads=1):\n    m = copy.deepcopy(model).{{}}.eval()\n    x = torch.randn(input_size)\n    old = torch.get_num_threads()\n    torch.set_num_threads({{}})\n    with torch.{{}}():\n        for _ in range(3):                    # warm-up\n            m(x)\n        t0 = time.perf_counter()\n        for _ in range(reps):\n            m(x)\n        dt = (time.perf_counter() - t0) / {{}}\n    torch.set_num_threads(old)\n    return dt * 1000", "a": [["cpu()", "to('cpu')", "to(\"cpu\")"], ["threads"], ["no_grad", "inference_mode"], ["reps"]], "w": "CPU 로 복사 → 스레드 수 지정 → 기울기 계산 끄기 → warm-up 뒤 reps 번 평균. 실행 예: ResNet-20 2.87 ms · ResNet-18 70 ms · ResNet-50 134 ms · MobileNetV3-S 8.8 ms.", "an": "문제 1-2"}]}, {"t": "2교시 · 연산량 계산", "anim": "D3-2 연산량 지도", "qs": [{"type": "single", "p": "문제 2-1 — ResNet-50 (25,557,032 파라미터) 을 float32 로 저장할 때 가중치 메모리 (<code>param_MB</code>) 는?", "o": ["약 25.6 MB", "약 102 MB", "약 204 MB", "약 818 MB"], "a": 1, "w": "float32 는 4 bytes → 25,557,032 × 4 / 1e6 = 102.2 MB. 25.6 MB 는 1 byte (int8) 로 센 값, 818 MB 는 4 를 32 (bit) 로 착각한 값입니다.", "an": "문제 2-1"}, {"type": "single", "p": "문제 2-2 — 256 채널 bottleneck (1×1 256→64, 3×3 64→64, 1×1 64→256, bias 없음) 의 가중치 합은?", "o": ["1,179,648", "36,864", "98,304", "69,632"], "a": 3, "w": "16,384 + 36,864 + 16,384 = 69,632. 3×3 두 번 (basic) 은 2 · 9 · 256² = 1,179,648 로 약 17배 (16.9) 많습니다.", "an": "문제 2-2"}, {"type": "multi", "p": "파라미터 · 메모리 · MAC 에 대한 설명으로 <b>옳은 것</b>을 모두 고르세요.", "o": ["파라미터 메모리 = 파라미터 수 × 4 bytes (float32)", "MAC 이 같으면 실제 장치의 지연시간도 항상 같다", "활성화 메모리는 입력 해상도가 클수록 커진다", "1×1 Conv 는 위치마다 채널끼리만 섞는다", "활성화 메모리는 학습이 끝나면 모델 파일 (state_dict) 에 함께 저장된다"], "a": [0, 2, 3], "w": "활성화는 이미지 한 장을 처리하는 동안 생겼다 사라지는 층 출력이라 파일에 저장되지 않습니다. 지연시간은 MAC 외에 메모리 이동 · 병렬성에도 좌우됩니다 (3교시).", "an": "D3-2 · 연산량 지도"}, {"type": "ox", "p": "문제 2-1 의 <code>model_cost</code> 는 BN · ReLU 를 포함한 <b>모든 층</b>의 출력 원소 수를 더해 활성화 메모리를 구한다.", "a": false, "w": "forward hook 을 <code>nn.Conv2d</code> · <code>nn.Linear</code> 에만 걸었으므로 그 두 종류의 출력만 셉니다 (act_MB = 원소 수 × 4 / 1e6).", "an": "문제 2-1"}, {"type": "short", "p": "<code>nn.Conv2d(256, 64, 1, bias=False)</code> 의 가중치 수는? (숫자만)", "a": ["16384", "16,384", "16_384"], "w": "Cout · Cin · K² = 64 · 256 · 1 = 16,384. 1×1 이라 K² = 1 — 같은 채널의 3×3 이면 9배 (147,456).", "an": "문제 2-2"}, {"type": "drop", "p": "문제 2-1 — <code>model_cost</code> 의 설계입니다. 빈칸에 알맞은 것을 고르세요.", "p2": "hook 에서 출력 원소 수를 <code>out.{}</code> 로 세고, <code>param_MB = params × {} / 1e6</code> 이다. ResNet-50 의 param_MB 는 약 {} MB 이다.", "opts": [["shape", "numel()", "size()"], ["32", "8", "4"], ["102.2", "25.6", "51.1"]], "a": [1, 2, 0], "w": "numel() = 원소 개수. float32 한 개는 32 bit = 4 bytes. 25,557,032 × 4 / 1e6 = 102.2.", "an": "문제 2-1"}, {"type": "match", "p": "문제 2-2 — 층 (bias 없음) 과 가중치 수를 짝지으세요.", "left": ["Conv 1×1, 256 → 64", "Conv 3×3, 64 → 64", "Conv 3×3, 256 → 256", "basic 블록 (3×3 256→256 × 2)"], "right": ["16,384", "36,864", "589,824", "1,179,648"], "a": [0, 1, 2, 3], "w": "64 · 256 · 1 · 64 · 64 · 9 · 256 · 256 · 9 · 그 두 배. 비싼 3×3 을 채널이 적은 곳 (64) 에서 하는 것이 bottleneck 의 핵심입니다.", "an": "문제 2-2"}, {"type": "order", "p": "아래 층 (bias 없음) 을 <b>가중치 수가 작은 것부터</b> 배열하세요.", "items": ["Conv 1×1, 64 → 64", "Conv 3×3, 64 → 64", "Conv 1×1, 256 → 256", "Conv 3×3, 128 → 128", "Conv 3×3, 256 → 256"], "w": "4,096 → 36,864 → 65,536 → 147,456 → 589,824. 채널이 2배면 4배, 3×3 은 1×1 의 9배입니다.", "an": "문제 2-2"}, {"type": "hot", "p": "ResNet-50 의 bottleneck 블록 (256 채널) 입니다. <b>가중치가 가장 많은 층</b>을 클릭하세요.", "w": "Conv 3×3, 64 → 64 (36,864) 입니다. 1×1 두 층은 각각 16,384, 지름길 (identity) 과 덧셈은 가중치가 없습니다. 같은 일을 3×3 256→256 으로 하면 한 층만 589,824 개입니다.", "an": "D3-2 · 1×1 bottleneck", "viewBox": "0 0 640 424", "sw": 640, "svg": "<defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#8a9bb8\"/></marker><marker id=\"ahr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#f87171\"/></marker></defs><text x=\"195.0\" y=\"26\" font-size=\"12\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">x (N, 256, H, W)</text><rect x=\"70\" y=\"60\" width=\"250\" height=\"44\" rx=\"6\" fill=\"#14203 \"195.0\" y=\"360\" font-size=\"18\" fill=\"#f5b942\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"bold\" dominant-baseline=\"middle\">+</text><rect x=\"410\" y=\"154\" width=\"200\" height=\"44\" rx=\"6\" fill=\"#14203a\" stroke=\"#f5b942\" /><text x=\"510.0\" y=\"176\" font-size=\"12\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">지름길 (identity)</text><path d=\"M255.0,26 L510.0,26 L510.0,152\" fill=\"none\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><path d=\"M510.0,198 L510.0,360 L219.0,360\" fill=\"none\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><line x1=\"195.0\" y1=\"382\" x2=\"195.0\" y2=\"400\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><text x=\"195.0\" y=\"412\" font-size=\"11.5\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">ReLU → (N, 256, H, W)</text><text x=\"410\" y=\"250\" font-size=\"11\" fill=\"#8a9bb8\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">bias 없음 · BN 제외</text><text x=\"410\" y=\"272\" font-size=\"11\" fill=\"#8a9bb8\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">채널: 256 → 64 → 64 → 256</text>", "regions": [{"id": "c1", "label": "Conv 1×1, 256 → 64", "x": 70, "y": 60, "w": 250, "h": 44}, {"id": "c2", "label": "Conv 3×3, 64 → 64", "x": 70, "y": 154, "w": 250, "h": 44}, {"id": "c3", "label": "Conv 1×1, 64 → 256", "x": 70, "y": 248, "w": 250, "h": 44}, {"id": "add", "label": "덧셈 (+)", "shape": "circle", "x": 195.0, "y": 360, "r": 22}, {"id": "sc", "label": "지름길 (identity)", "x": 410, "y": 154, "w": 200, "h": 44}], "a": "c2"}, {"type": "code", "p": "문제 2-1 · 2-2 — 가중치 공식, bottleneck 계산, <code>model_cost</code> 를 완성하세요.", "code": "def w(cin, cout, k):\n    return {{}}\n\nbasic = 2 * w(256, 256, 3)\nbottleneck = w(256, {{}}, 1) + w(64, 64, 3) + w(64, 256, 1)\n\ndef model_cost(model, input_size):\n    acts = [0]\n    def hook(m, inp, out):\n        acts[0] += out.{{}}\n    hs = [m.register_forward_hook(hook) for m in model.modules() if isinstance(m, (nn.Conv2d, nn.Linear))]\n    ...\n    p = count_params(model)\n    return {\"params\": p, \"macs\": count_macs(model, input_size),\n            \"param_MB\": p * {{}} / 1e6, \"act_MB\": acts[0] * 4 / 1e6}", "a": [["cout * cin * k * k", "cin * cout * k * k", "cout * cin * k ** 2", "cin * cout * k ** 2", "k * k * cin * cout", "k * k * cout * cin"], ["64"], ["numel()"], ["4"]], "w": "Cout · Cin · K², 1×1 로 256 → 64 줄이기, 출력 원소 수 numel(), float32 4 bytes. basic 1,179,648 vs bottleneck 69,632.", "an": "문제 2-1 · 2-2"}]}, {"t": "3교시 · Depthwise Separable", "anim": "D3-3 Depthwise + Pointwise", "qs": [{"type": "single", "p": "Depthwise Separable 합성곱의 연산량 ÷ 일반 합성곱의 연산량은? (커널 K×K, 출력 채널 Cout)", "o": ["1/Cin + 1/K", "1/(Cout · K²)", "1/Cout + 1/K²", "1/K² 뿐"], "a": 2, "w": "(Cin·K²·HW + Cin·Cout·HW) / (Cin·Cout·K²·HW) = 1/Cout + 1/K². K = 3 이면 약 1/9 ~ 1/8.", "an": "D3-3 · Depthwise + Pointwise"}, {"type": "single", "p": "문제 3-2 — 64 → 128 채널 3×3 을 DS 로 바꿨을 때 가중치 수는? (bias 없음, BN 제외)", "o": ["8,768", "73,728", "576", "8,192"], "a": 0, "w": "depthwise 64 · 9 = 576 + pointwise 64 · 128 = 8,192 → 8,768 (일반 73,728 의 11.9%). 576 · 8,192 는 각 단계만 센 값입니다.", "an": "문제 3-2"}, {"type": "multi", "p": "Depthwise Separable 합성곱에 대한 설명으로 <b>옳은 것</b>을 모두 고르세요.", "o": ["depthwise 는 <code>groups = Cin</code> 으로 채널마다 따로 공간 (3×3) 만 섞는다", "pointwise 는 1×1 Conv 로 위치마다 채널만 섞는다", "depthwise 단계에서 채널 수를 Cin → Cout 으로 바꾼다", "64→128, 32×32 에서 DS 연산의 약 93% 는 pointwise 에서 나온다", "MAC 이 8.4배 줄면 실제 CPU 속도도 정확히 8.4배 빨라진다"], "a": [0, 1, 3], "w": "depthwise 는 채널 수를 유지 (Cin → Cin) 하고 채널 바꾸기는 pointwise 의 몫입니다. pointwise 8,388,608 / 8,978,432 = 93.4%. 실제 속도는 문제 3-3 처럼 MAC 비율보다 덜 빨라집니다.", "an": "문제 3-2"}, {"type": "ox", "p": "depthwise 합성곱은 곱셈은 적지만 계산량에 비해 메모리 이동이 많아, 실제 속도 향상이 MAC 비율만큼 나오지 않는 경우가 많다.", "a": true, "w": "실행 예 (CPU 1 스레드, 64×56×56): 일반 5.14 ms vs DS 1.26 ms → 4.1배 (MAC 은 8.4배). 그래서 실제 장치에서 재 봐야 합니다.", "an": "문제 3-3"}, {"type": "short", "p": "문제 3-2 — 64 → 128, 32×32 입력에서 DS 합성곱의 MAC 은? (숫자만)", "a": ["8978432", "8,978,432", "8_978_432"], "w": "depthwise 64 · 1024 · 9 = 589,824 + pointwise 128 · 1024 · 64 = 8,388,608 → 8,978,432. 일반 75,497,472 의 0.1189 = 1/128 + 1/9.", "an": "문제 3-2"}, {"type": "drop", "p": "문제 3-1 — <code>DSConv</code> 의 설계입니다. 빈칸에 알맞은 것을 고르세요.", "p2": "depthwise 는 <code>Conv2d(cin, cin, 3, padding=1, groups={})</code>, pointwise 는 <code>Conv2d(cin, cout, {})</code> 이다. K = 3 이면 연산 비율은 약 {} 이다.", "opts": [["1", "cin", "cout"], ["3", "1", "cin"], ["1/9 ~ 1/8", "1/2 ~ 1/3", "1/64"]], "a": [1, 1, 0], "w": "groups = cin 이면 필터 하나가 입력 채널 1 개만 봅니다. 1×1 은 공간을 섞지 않으므로 커널 1. 1/Cout + 1/9 ≈ 1/9 ~ 1/8.", "an": "문제 3-1"}, {"type": "match", "p": "문제 3-2 — 64 → 128, 32×32 (bias 없음) 에서 각 부분의 MAC 을 짝지으세요.", "left": ["일반 Conv 3×3, 64 → 128", "depthwise 3×3 (64 채널)", "pointwise 1×1, 64 → 128", "DS 합계 (depthwise + pointwise)"], "right": ["75,497,472", "589,824", "8,388,608", "8,978,432"], "a": [0, 1, 2, 3], "w": "MAC = Cout · H · W · (Cin / groups) · K². 128·1024·64·9 · 64·1024·1·9 · 128·1024·64·1 · 둘의 합.", "an": "문제 3-2"}, {"type": "order", "p": "문제 3-1 — <code>DSConv(cin, cout)</code> 에서 입력이 지나가는 순서로 배열하세요.", "items": ["depthwise <code>Conv2d(cin, cin, 3, groups=cin)</code>", "<code>BatchNorm2d(cin)</code> → ReLU", "pointwise <code>Conv2d(cin, cout, 1)</code>", "<code>BatchNorm2d(cout)</code> → ReLU"], "w": "<code>self.pw(self.dw(x))</code> — 각 단계 뒤에 BN · ReLU. MobileNetV1 은 이 블록을 쌓은 모델입니다.", "an": "문제 3-1"}, {"type": "hot", "p": "<code>DSConv(64, 128)</code> 에 32×32 입력을 넣습니다. 블록 전체 MAC (8,978,432) 의 <b>약 93% 를 차지하는 단계</b>를 클릭하세요.", "w": "pointwise Conv 1×1 (64 → 128) 입니다. 8,388,608 / 8,978,432 = 93.4%. depthwise 는 589,824 (6.6%) 뿐이고 BN · ReLU 는 MAC 에 넣지 않습니다. 그래서 MobileNet 연산의 대부분은 1×1 Conv 입니다.", "an": "D3-3 · Depthwise + Pointwise", "viewBox": "0 0 700 280", "sw": 700, "svg": "<defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#8a9bb8\"/></marker><marker id=\"ahr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#f87171\"/></marker></defs><text x=\"20\" y=\"22\" font-size=\"12.5\" fill=\"#dbe4f0\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">DSConv(64, 128) · 입력 (N, 64, 32, 32) · bias 없음</text><rect x=\"20\" y=\"60\" width=\"280\" height=\"60\" rx=\"6\" fill=\"#14203a\" stroke=\"#2dd4bf\" /><text x=\"160.0\" y=\"82\" font-size=\"12.5\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">depthwise Conv 3×3</text><text x=\"160.0\" y=\"104\" font-size=\"10.5\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">groups=64 (채널마다 공간만)</text><rect x=\"340\" y=\"60\" width=\"200\" height=\"60\" rx=\"6\" fill=\"#14203a\" stroke=\"#60a5fa\" /><text x=\"440.0\" y=\"90\" font-size=\"12.5\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">BN(64) → ReLU</text><rect x=\"20\" y=\"170\" width=\"280\" height=\"60\" rx=\"6\" fill=\"#14203a\" stroke=\"#2dd4bf\" /><text x=\"160.0\" y=\"192\" font-size=\"12.5\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">pointwise Conv 1×1</text><text x=\"160.0\" y=\"214\" font-size=\"10.5\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">64 → 128 (위치마다 채널만)</text><rect x=\"340\" y=\"170\" width=\"200\" height=\"60\" rx=\"6\" fill=\"#14203a\" stroke=\"#60a5fa\" /><text x=\"440.0\" y=\"200\" font-size=\"12.5\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">BN(128) → ReLU</text><line x1=\"302\" y1=\"90\" x2=\"338\" y2=\"90\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><line x1=\"302\" y1=\"200\" x2=\"338\" y2=\"200\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><path d=\"M440,122 L440,145 L160,145 L160,168\" fill=\"none\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><text x=\"560\" y=\"200\" font-size=\"11\" fill=\"#8a9bb8\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">→ (N, 128, 32, 32)</text><text x=\"20\" y=\"262\" font-size=\"11\" fill=\"#8a9bb8\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">일반 Conv 3×3, 64 → 128 의 MAC 은 75,497,472 — DS 는 그 0.1189 (= 1/128 + 1/9)</text>", "regions": [{"id": "dw", "label": "depthwise Conv 3×3 (groups=64)", "x": 20, "y": 60, "w": 280, "h": 60}, {"id": "bn1", "label": "BN(64) → ReLU", "x": 340, "y": 60, "w": 200, "h": 60}, {"id": "pw", "label": "pointwise Conv 1×1 (64 → 128)", "x": 20, "y": 170, "w": 280, "h": 60}, {"id": "bn2", "label": "BN(128) → ReLU", "x": 340, "y": 170, "w": 200, "h": 60}], "a": "pw"}, {"type": "code", "p": "문제 3-1 · 3-2 — <code>DSConv</code> 와 공식 확인 코드를 완성하세요.", "code": "class DSConv(nn.Module):\n    def __init__(self, cin, cout, stride=1):\n        super().__init__()\n        self.dw = nn.Sequential(nn.Conv2d(cin, cin, 3, stride=stride, padding=1, groups={{}}, bias=False),\n                                nn.BatchNorm2d(cin), nn.ReLU(inplace=True))\n        self.pw = nn.Sequential(nn.Conv2d(cin, cout, {{}}, bias=False),\n                                nn.BatchNorm2d(cout), nn.ReLU(inplace=True))\n\n    def forward(self, x):\n        return {{}}\n\nformula = {{}}          # 64 → 128, K = 3", "a": [["cin"], ["1", "kernel_size=1"], ["self.pw(self.dw(x))"], ["1 / 128 + 1 / 9", "1 / 9 + 1 / 128", "1 / 128 + 1 / 3 ** 2", "1 / 128 + 1 / (3 * 3)"]], "w": "groups=cin · 1×1 · depthwise 먼저 · 1/Cout + 1/K² = 0.1189. 실행 예 문제 3-3: 4.1배 빨라짐 (MAC 8.4배).", "an": "문제 3-1 · 3-2"}]}, {"t": "4교시 · MobileNet V1 · V2 · V3", "anim": "D3-4 Inverted residual · SE", "qs": [{"type": "single", "p": "MobileNetV2 의 <b>inverted residual</b> 블록 (t = 6) 안의 순서는?", "o": ["1×1 로 줄이기 → 3×3 → 1×1 로 늘리기", "depthwise 3×3 → 1×1 로 늘리기 → 1×1 로 줄이기", "3×3 → 3×3 (basic 블록)", "1×1 로 늘리기 (×6) → depthwise 3×3 → 1×1 로 줄이기"], "a": 3, "w": "ResNet bottleneck 은 줄였다 늘리기 (256→64→256, 지름길이 넓은 쪽), V2 는 늘렸다 줄이기 (24→144→24, 지름길이 얇은 쪽) 라서 inverted 입니다.", "an": "D3-4 · Inverted residual"}, {"type": "single", "p": "문제 4-2 — h-swish(x) = x · ReLU6(x + 3) / 6 일 때 h-swish(−1) 은?", "o": ["0", "−1/3 (≈ −0.333)", "−0.269 (swish 값)", "−1"], "a": 1, "w": "−1 · ReLU6(2) / 6 = −2/6. x ≤ −3 이면 0, x ≥ 3 이면 x. swish(−1) = −1 · σ(−1) ≈ −0.269 와 비슷한 모양을 sigmoid 없이 만듭니다.", "an": "문제 4-2"}, {"type": "multi", "p": "MobileNetV3 에 대한 설명으로 <b>옳은 것</b>을 모두 고르세요.", "o": ["SE 는 채널별 평균 → 작은 FC 두 개 → 0~1 가중치 → 채널마다 곱하기다", "h-swish 는 sigmoid 대신 ReLU6 로 swish 를 근사해 장치에서 계산이 싸다", "구조 일부를 자동 구조 탐색 (NAS) 으로 찾았다", "mobilenet_v3_small 의 InvertedResidual 블록 11 개 모두에 SE 가 들어 있다", "h-swish 는 x ≥ 3 에서 0 이 된다"], "a": [0, 1, 2], "w": "SE 가 있는 블록은 11 개 중 9 개 (문제 4-3). h-swish 는 x ≥ 3 에서 x, x ≤ −3 에서 0 입니다.", "an": "문제 4-3"}, {"type": "ox", "p": "<code>InvertedResidual(16, 24, stride=2)</code> 도 입력 x 를 출력에 더하는 지름길이 있다.", "a": false, "w": "지름길은 stride 1 이고 cin == cout 일 때만 씁니다 (<code>use_res</code>). 16 → 24, stride 2 는 shape 가 달라 더할 수 없습니다. 파라미터 5,136 개.", "an": "문제 4-1"}, {"type": "short", "p": "문제 4-1 — <code>InvertedResidual(24, 24)</code> (t = 6, BN 포함) 의 파라미터 수는?        nn.Conv2d(cin, hid, 1, bias=False), nn.BatchNorm2d(hid), nn.ReLU6(inplace=True),\n            nn.Conv2d(hid, hid, 3, stride, 1, groups={{}}, bias=False), nn.BatchNorm2d(hid), nn.ReLU6(inplace=True),\n            nn.Conv2d(hid, cout, 1, bias=False), nn.BatchNorm2d(cout),\n        )\n\n    def forward(self, x):\n        out = self.block(x)\n        return {{}} if self.use_res else out\n\ndef h_swish(x):\n    return x * F.relu6({{}}) / 6", "a": [["cin == cout", "cout == cin"], ["hid", "cin * t", "t * cin"], ["x + out", "out + x"], ["x + 3", "3 + x"]], "w": "지름길 조건 · depthwise 는 groups = hid · 지름길 덧셈 · ReLU6(x + 3) / 6. <code>nn.Hardswish()</code> 와 값이 같습니다.", "an": "문제 4-1 · 4-2"}]}, {"t": "5교시 · 전이학습", "anim": "D3-5 전이학습 — 동결과 미세조정", "qs": [{"type": "single", "p": "문제 5-1 — 사전학습 MobileNetV3-Small 의 <code>classifier[3]</code> 을 <code>nn.Linear(1024, 10)</code> 으로 바꾼 뒤 전체 파라미터 수는?", "o": ["1,528,106", "2,542,856", "927,008", "601,098"], "a": 0, "w": "Linear(1024→1000) 1,025,000 개가 Linear(1024→10) 10,250 개로 바뀌어 2,542,856 → 1,528,106 (features 927,008 + classifier 601,098).", "an": "문제 5-1"}, {"type": "single", "p": "문제 5-2 — feature extraction (features 동결) 에서 학습되는 파라미터는?", "o": ["927,008 개 (약 61%)", "10,250 개 (약 0.7%)", "1,528,106 개 (100%)", "601,098 개 (약 39%)"], "a": 3, "w": "동결하지 않은 classifier 전체 (Linear 576→1024 590,848 + Linear 1024→10 10,250) 가 학습됩니다. 실행 예 1 epoch test 0.6607.", "an": "문제 5-2"}, {"type": "multi", "p": "사전학습 모델로 전이학습할 때 <b>주의할 점</b>으로 옳은 것을 모두 고르세요.", "o": ["입력을 ImageNet 평균 · 표준편차로 정규화한다", "32×32 를 96×96 으로 키워 넣는다 (너무 작으면 특징이 사라짐)", "사전학습 모델이라도 CIFAR 정규화 상수를 써야 정확하다", "동결한 층의 BN 도 <code>model.train()</code> 상태에서는 running 통계가 바뀐다", "feature extraction 은 features 의 학습률만 낮추고 모든 파라미터를 학습한다"], "a": [0, 1, 3], "w": "사전학습 때와 같은 전처리 (mean (0.485, 0.456, 0.406), std (0.229, 0.224, 0.225)) 를 기대합니다. feature extraction 은 features 를 아예 동결합니다 — 작은 학습률로 전체를 학습하는 것은 fine-tuning.", "an": "5교시 · 주의"}, {"type": "ox", "p": "feature extraction 에서 features 를 동결하려면  "0"]], "a": [1, 1, 0], "w": "out.requires_grad 일 때만 register_hook (no_grad 안에서는 건너뜀). 축 2 · 3 = 세로 · 가로 평균.", "an": "문제 7-1"}, {"type": "match", "p": "CAM (또는 특징맵) 의 shape 를 짝지으세요.", "left": ["ResNet-20 <code>layer3</code> CAM · 32 입력", "MobileNetV3-S <code>features[-1]</code> CAM · 96 입력", "MobileNetV3-S <code>features[-1]</code> CAM · 224 입력", "ResNet-20 <code>layer3</code> 출력 acts · 배치 16"], "right": ["8×8", "3×3", "7×7", "(16, 64, 8, 8)"], "a": [0, 1, 2, 3], "w": "CAM 크기 = 입력 / 누적 stride (ResNet-20 4, MobileNetV3 32). 경량 모델은 빨리 줄여 연산을 아끼므로 CAM 이 거칩니다.", "an": "문제 7-1 · 7-3"}, {"type": "order", "p": "문제 7-1 — Grad-CAM 계산 순서로 배열하세요.", "items": ["forward — hook 이 마지막 Conv 출력 A 를 저장", "<code>logits[arange, cls].sum().backward()</code> — 기울기 저장", "α = 기울기의 공간 평균", "CAM = ReLU(Σ α<sub>k</sub> A<sup>k</sup>)", "최댓값으로 나눠 0~1 정규화", "입력 크기로 bilinear 업샘플 → 이미지에 겹쳐 그리기"], "w": "forward → backward → α → 가중합 + ReLU → 정규화 → 업샘플 · 겹치기.", "an": "D3-7 · Grad-CAM 계산"}, {"type": "hot", "p": "채널 3 개짜리 마지막 Conv 출력과 α 가 주어졌습니다. CAM = ReLU(Σ α<sub>k</sub> A<sup>k</sup>) 를 계산해 <b>값이 가장 큰 칸</b>을 클릭하세요.", "w": "행 0 · 열 1 입니다: 0.5·4 − 1·0 + 0.25·4 = 3. 다른 칸: (0,0) 0 · (0,2) 0.5 · (1,1) 2 · (1,2) 2 · (2,2) 0, 나머지 (1,0) −2 · (2,0) −1.5 · (2,1) −3 은 ReLU 로 0. α 의 부호를 무시하면 (2,1) 을 고르게 됩니다 — 음수 α 채널은 그 클래스 점수를 낮추는 근거입니다.", "an": "D3-7 · Grad-CAM 계산", "viewBox": "0 0 640 236", "sw": 640, "svg": "<defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#8a9bb8\"/></marker><marker id=\"ahr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#f87171\"/></marker></defs><text x=\"20\" y=\"22\" font-size=\"12.5\" fill=\"#dbe4f0\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">마지막 Conv 출력 A¹ · A² · A³ (각 3×3) 와 채널 중요도 α</tex function rng(seed){ let h = 2166136261; for (const c of seed) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 100000) / 100000; }; }
function shuffled(arr, seed){ const r = rng(seed), idx = arr.map((_, i) => i); for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; } if (idx.every((v, i) => v === i) && idx.length > 1) idx.push(idx.shift()); return idx; }

// ── 상태 ──
let tab = 0;
const graded = Q.map(() => false);
const ans = Q.map((s, i) => s.qs.map((q, k) => init(q, `${i}-${k}`)));
function init(q, id){
  switch (q.type) {
    case 'single': case 'ox': case 'hot': return null;
    case 'multi': return [];
    case 'short': return '';
    case 'drop': return q.opts.map(() => -1);
    case 'match': return q.left.map(() => -1);
    case 'order': return shuffled(q.items, 'o' + id);          // 현재 화면 순서(원래 인덱스)
    case 'flash': return { flipped:false, self:null };
    case 'code': return q.a.map(() => '');
  }
}
function answered(q, a){
  switch (q.type) {
    case 'single': case 'ox': case 'hot': return a !== null;
    case 'multi': return a.length > 0;
    case 'short': return a.trim() !== '';
    case 'drop': case 'match': return a.every(v => v >= 0);
    case 'order': return true;
    case 'flash': return a.self !== null;
    case 'code': return a.every(v => v.trim() !== '');
  }
}
function correct(q, a){
  switch (q.type) {
    case 'single': case 'hot': return a === q.a;
    case 'ox': return a === q.a;
    case 'multi': return a.length === q.a.length && q.a.every(x => a.includes(x));
    case 'short': return q.a.some(x => norm(x) === norm(a));
    case 'drop': return a.every((v, i) => v === q.a[i]);
    case 'match': return a.every((v, i) => v === q.a[i]);
    case 'order': return a.every((v, i) => v === i);
    case 'flash': return a.self === true;
    case 'code': return a.every((v, i) => q.a[i].some(x => norm(x) === norm(v)));
  }
}
const scoreOf = i => ans[i].filter((a, k) => correct(Q[i].qs[k], a)).length;

// ── 답 문자열 (오답 정리용) ──
const L = '①②③④⑤⑥⑦⑧';
function fmt(q, a, right){
  switch (q.type) {
    case 'single': return right ? `${L[q.a]} ${strip(q.o[q.a])}` : (a === null ? '미응답' : `${L[a]} ${strip(q.o[a])}`);
    case 'multi': { const v = right ? q.a : a; return v.length ? [...v].sort().map(i => L[i]).join(' ') : '미응답'; }
    case 'ox': { const v = right ? q.a : a; return v === null ? '미응답' : (v ? 'O' : 'X'); }
    case 'short': return right ? q.a[0] : (a.trim() || '미응답');
    case 'drop': return (right ? q.a : a).map((v, i) => v < 0 ? '?' : strip(q.opts[i][v])).join(' / ');
    case 'match': return (right ? q.a : a).map((v, i) => `${strip(q.left[i])}→${v < 0 ? '?' : strip(q.right[v])}`).join(', ');
    case 'order': return (right ? q.items.map((_, i) => i) : a).map(i => strip(q.items[i])).join(' → ');
    case 'hot': { const v = right ? q.a : a; return v === null ? '미응답' : (q.regions.find(r => r.id === v) || {}).label; }
    case 'flash': return right ? strip(q.back) : (a.self === null ? '미응답' : (a.self ? '알았다' : '몰랐다'));
    case 'code': return (right ? q.a.map(x => x[0]) : a.map(v => v || '?')).join(' / ');
  }
}

// ── 렌더 ──
function renderTabs(){
  $('#tabs').innerHTML = Q.map((s, i) => {
    const n = ans[i].filter((a, k) => answered(s.qs[k], a)).length;
    return `<button class="${i === tab ? 'active' : ''} ${graded[i] ? 'graded' : ''}" data-i="${i}">${i + 1}교시<span class="s">${graded[i] ? scoreOf(i) + '/10' : n + '/10'}</span></button>`;
  }).join('');
  $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => { tab = +b.dataset.i; history.replaceState(null, '', '#t' + (tab + 1)); render(); window.scrollTo({ top: 0 }); });
}
function qHTML(q, k){
  const a = ans[tab][k], g = graded[tab], id = `${tab}-${k}`, dis = g ? 'disabled' : '';
  const ok = g && correct(q, a);
  let body = '';
  switch (q.type) {
    case 'single':
    case 'multi': {
      const isM = q.type === 'multi';
      body = (isM ? '<div class="hint" style="margin:-4px 0 8px">정답을 <b>모두</b> 고르세요.</div>' : '') + '<div class="opts">' + q.o.map((o, j) => {
        const sel = isM ? a.includes(j) : a === j, isA = isM ? q.a.includes(j) : q.a === j;
        let c = sel ? 'sel' : '';
        if (g) c = isA && sel ? 'ok' : (sel ? 'bad' : (isA ? (isM ? 'miss' : 'ok') : ''));
        const box = isM ? (sel ? '☑' : '☐') : L[j];
        return `<button class="opt ${c}" data-k="${k}" data-j="${j}" ${dis}><span class="box">${box}</span> ${o}</button>`;
      }).join('') + '</div>';
      break;
    }
    case 'ox':
      body = '<div class="ox">' + [true, false].map(v => {
        let c = a === v ? 'active' : '';
        if (g) c = (q.a === v ? 'opt ok' : (a === v ? 'opt bad' : ''));
        return `<button class="oxb ${c}" data-k="${k}" data-v="${v}" ${dis} aria-label="${v ? '참' : '거짓'}">${v ? 'O' : 'X'}</button>`;
      }).join('') + '</div>';
      break;
    case 'short':
      body = `<input type="text" class="sa" data-k="${k}" value="${esc(a)}" placeholder="정답 입력" style="width:min(100%,320px)" ${dis}>`;
      break;
    case 'drop': {
      let i = 0;
      body = '<div class="fill">' + q.p2.replace(/\{\}/g, () => {
        const n = i++;
        const opts = q.opts[n].map((o, j) => `<option value="${j}" ${a[n] === j ? 'selected' : ''}>${esc(strip(o))}</option>`).join('');
        const st = g ? `style="border-color:${a[n] === q.a[n] ? 'var(--green)' : 'var(--red)'}"` : '';
        return `<select class="dd" data-k="${k}" data-n="${n}" ${dis} ${st}><option value="-1">선택</option>${opts}</select>`;
      }) + '</div>';
      break;
    }
    case 'match': {
      const order = shuffled(q.right, 'm' + id);
      body = q.left.map((l, i) => {
        const opts = order.map(j => `<option value="${j}" ${a[i] === j ? 'selected' : ''}>${esc(strip(q.right[j]))}</option>`).join('');
        const c = g ? (a[i] === q.a[i] ? 'ok' : 'bad') : '';
        return `<div class="mrow ${c}"><span class="l">${l}</span><span class="arr">↔</span><select class="mm" data-k="${k}" data-i="${i}" ${dis}><option value="-1">짝 선택</option>${opts}</select></div>`;
      }).join('');
      break;
    }
    case 'order':
      body = '<div class="hint" style="margin:-4px 0 8px">끌어다 놓거나 ▲▼ 버튼으로 순서를 바꾸세요.</div><ol class="ord" data-k="' + k + '">' + a.map((it, pos) => {
        const c = g ? (it === pos ? 'ok' : 'bad') : '';
        return `<li class="${c}" draggable="${!g}" data-pos="${pos}"><span class="k">${pos + 1}</span><span>${q.items[it]}</span><span class="mv"><button data-k="${k}" data-pos="${pos}" data-d="-1" ${dis || (pos === 0 ? 'disabled' : '')} aria-label="위로">▲</button><button data-k="${k}" data-pos="${pos}" data-d="1" ${dis || (pos === a.length - 1 ? 'disabled' : '')} aria-label="아래로">▼</button></span></li>`;
      }).join('') + '</ol>';
      break;
    case 'hot': {
      const regs = q.regions.map(r => {
        let c = a === r.id ? 'sel' : '';
        if (g) c = r.id === q.a ? 'ok' : (a === r.id ? 'bad' : '');
        const shape = r.shape === 'circle' ? `<circle cx="${r.x}" cy="${r.y}" r="${r.r}"` : `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="6"`;
        return `${shape} class="rg ${c}" data-k="${k}" data-r="${r.id}" tabindex="${g ? -1 : 0}" role="button" aria-label="${esc(r.label)}"><title>${esc(r.label)}</title>${r.shape === 'circle' ? '</circle>' : '</rect>'}`;
      }).join('');
      body = `<div class="hot"><svg viewBox="${q.viewBox}" width="${q.sw}" xmlns="http://www.w3.org/2000/svg">${q.svg}${regs}</svg></div>` +
        `<div class="hint" style="margin-top:6px">선택: <b style="color:var(--amber)">${a === null ? '없음' : esc((q.regions.find(r => r.id === a) || {}).label)}</b></div>`;
      break;
    }
    case 'flash':
      body = `<div class="card ${a.flipped ? 'flip' : ''}" data-k="${k}"><div class="in"><div class="f">${q.front}</div><div class="b">${q.back}</div></div></div>` +
        `<div class="selfrow"><button class="flipb" data-k="${k}" ${g ? 'disabled' : ''}>${a.flipped ? '앞면 보기' : '🔄 카드 뒤집기'}</button>` +
        `<button class="selfb ${a.self === true ? 'active' : ''}" data-k="${k}" data-v="1" ${g || !a.flipped ? 'disabled' : ''}>✅ 알았다</button>` +
        `<button class="selfb ${a.self === false ? 'active' : ''}" data-k="${k}" data-v="0" ${g || !a.flipped ? 'disabled' : ''}>❌ 몰랐다</button>` +
        `<span class="hint">${a.flipped ? '정답과 비교해 스스로 채점하세요.' : '먼저 답을 떠올린 뒤 뒤집으세요.'}</span></div>`;
      break;
    case 'code': {
      let i = 0;
      body = '<pre>' + esc(q.code).replace(/\{\{\}\}/g, () => {
        const n = i++;
        const w = Math.max(5, (q.a[n][0] || '').length + 2);
        const st = g ? `style="border-color:${q.a[n].some(x => norm(x) === norm(a[n])) ? 'var(--green)' : 'var(--red)'};width:${w}ch"` : `style="width:${w}ch"`;
        return `<input type="text" class="ci" data-k="${k}" data-n="${n}" value="${esc(a[n])}" ${dis} ${st} aria-label="빈칸 ${n + 1}">`;
      }) + '</pre>';
      break;
    }
  }
  const t = TYPES[q.type];
  const prompt = q.type === 'drop' ? (q.p || '') : (q.type === 'flash' ? (q.p || '카드 앞면의 질문에 답을 떠올린 뒤 뒤집어 확인하세요.') : q.p);
  let fb = '';
  if (g) {
    const right = q.type === 'flash' ? '' : `<div>정답: <b>${esc(fmt(q, a, true))}</b></div>`;
    fb = `<div class="fb ${ok ? 'ok' : 'bad'}"><b class="v">${ok ? '정답' : '오답'}</b>${right}${q.w}<span class="anim">확인: ${q.an}</span></div>`;
  }
  const un = !g && !answered(q, a) && attempted[tab] ? 'unans' : '';
  return `<div class="q ${g ? (ok ? 'ok' : 'bad') : un}"><div class="qh"><span class="n">문항 ${k + 1}</span><span class="ty" style="color:${t.c};border-color:${t.c}">${t.n}</span></div><div class="p">${prompt}</div>${body}${fb}</div>`;
}
const attempted = Q.map(() => false);
function render(){
  renderTabs();
  const s = Q[tab];
  $('#sheet').innerHTML = `<div class="head"><span class="t">${s.t}</span><span class="a">🎬 ${s.anim}</span></div>` + s.qs.map((q, k) => qHTML(q, k)).join('');
  bind();
  const nm = $('#name').value, g = graded[tab];
  if (g) {
    const sc = scoreOf(tab); $('#rscore').textContent = `${sc}/10`;
    if (nm.trim()) { $('#rcode').textContent = codeFor(nm, tab + 1, sc); $('#rhint').textContent = '결과 코드'; }
    else { $('#rcode').textContent = '—'; $('#rhint').textContent = '이름을 입력하면 결과 코드가 나옵니다.'; }
  } else {
    $('#rcode').textContent = '—'; $('#rscore').textContent = '';
    const n = ans[tab].filter((a, k) => answered(s.qs[k], a)).length;
    $('#rhint').textContent = `${tab + 1}교시: ${n}/10 응답. 채점하기를 누르면 잠깁니다.`;
  }
  $('#gradeBtn').disabled = g;
}
function bind(){
  const S = $('#sheet'), A = ans[tab];
  S.querySelectorAll('.opt[data-j]').forEach(b => b.onclick = () => {
    const k = +b.dataset.k, j = +b.dataset.j, q = Q[tab].qs[k];
    if (q.type === 'multi') { const i = A[k].indexOf(j); i < 0 ? A[k].push(j) : A[k].splice(i, 1); }
    else A[k] = A[k] === j ? null : j;
    render();
  });
  S.querySelectorAll('.oxb').forEach(b => b.onclick = () => { const k = +b.dataset.k, v = b.dataset.v === 'true'; A[k] = A[k] === v ? null : v; render(); });
  S.querySelectorAll('.sa').forEach(i => i.oninput = () => { A[+i.dataset.k] = i.value; renderTabs(); });
  S.querySelectorAll('.ci').forEach(i => i.oninput = () => { A[+i.dataset.k][+i.dataset.n] = i.value; renderTabs(); });
  S.querySelectorAll('.dd').forEach(s => s.onchange = () => { A[+s.dataset.k][+s.dataset.n] = +s.value; renderTabs(); });
  S.querySelectorAll('.mm').forEach(s => s.onchange = () => { A[+s.dataset.k][+s.dataset.i] = +s.value; renderTabs(); });
  S.querySelectorAll('.ord .mv button').forEach(b => b.onclick = () => {
    const k = +b.dataset.k, p = +b.dataset.pos, d = +b.dataset.d, arr = A[k];
    [arr[p], arr[p + d]] = [arr[p + d], arr[p]]; render();
  });
  S.querySelectorAll('.ord').forEach(ol => {
    const k = +ol.dataset.k; let from = null;
    ol.querySelectorAll('li').forEach(li => {
      li.addEventListener('dragstart', e => { from = +li.dataset.pos; li.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(from)); });
      li.addEventListener('dragend', () => li.classList.remove('drag'));
      li.addEventListener('dragover', e => { if (from !== null) { e.preventDefault(); li.classList.add('over'); } });
      li.addEventListener('dragleave', () => li.classList.remove('over'));
      li.addEventListener('drop', e => { e.preventDefault(); const to = +li.dataset.pos; if (from === null || from === to) return; const arr = A[k]; const [x] = arr.splice(from, 1); arr.splice(to, 0, x); from = null; render(); });
    });
  });
  S.querySelectorAll('.rg').forEach(r => {
    const pick = () => { if (graded[tab]) return; const k = +r.dataset.k; A[k] = A[k] === r.dataset.r ? null : r.dataset.r; render(); };
    r.addEventListener('click', pick);
    r.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
  });
  S.querySelectorAll('.flipb').forEach(b => b.onclick = () => { const k = +b.dataset.k; A[k].flipped = !A[k].flipped; render(); });
  S.querySelectorAll('.card').forEach(c => c.onclick = () => { if (graded[tab]) return; const k = +c.dataset.k; A[k].flipped = !A[k].flipped; render(); });
  S.querySelectorAll('.selfb').forEach(b => b.onclick = () => { const k = +b.dataset.k; A[k].self = b.dataset.v === '1'; render(); });
}

// ── 채점 · 결과 코드 ──
function hash(s){ let h = 5381; for (const c of s) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return h.toString(16).padStart(8, '0').slice(-4); }
function codeFor(name, t, score){ return `${t}${'ABCDEFGHIJK'[10 - score] || 'K'}-${hash(`${name.trim()}|${t}|${score}|vbday3`)}`; }
$('#gradeBtn').onclick = () => {
  const s = Q[tab], n = ans[tab].filter((a, k) => answered(s.qs[k], a)).length;
  attempted[tab] = true;
  if (n < 10 && !confirm(`아직 ${10 - n}문항에 답하지 않았습니다. 그래도 채점할까요? (미응답은 오답 처리)`)) { render(); return; }
  graded[tab] = true; render();
};
$('#resetBtn').onclick = () => {
  if (!confirm(`${tab + 1}교시 답을 모두 지우고 다시 풀까요?`)) return;
  graded[tab] = false; attempted[tab] = false;
  ans[tab] = Q[tab].qs.map((q, k) => init(q, `${tab}-${k}`)); render();
};
$('#name').oninput = render;

// ── 제출 · 오답 정리 ──
let lastHtml = '', lastText = '';
function buildReport(){
  const nm = $('#name').value.trim() || '(이름 없음)', ds = new Date().toLocaleString('ko-KR');
  let h = `<h3>Vision 기본 모델 Day 3 개념 워크시트 — 오답 정리</h3><div class="meta">${esc(nm)} · ${ds}</div>`;
  let t = `Vision 기본 모델 Day 3 개념 워크시트 — 오답 정리\n이름: ${nm}\n일시: ${ds}\n\n`;
  let tot = 0, cnt = 0;
  const byType = {};
  Q.forEach((s, i) => {
    if (!graded[i]) return;
    const sc = scoreOf(i); tot += sc; cnt++;
    s.qs.forEach((q, k) => { const b = byType[q.type] ||= [0, 0]; b[1]++; if (correct(q, ans[i][k])) b[0]++; });
    const code = $('#name').value.trim() ? codeFor($('#name').value, i + 1, sc) : '—';
    const wrong = s.qs.map((q, k) => ({ q, k, a: ans[i][k] })).filter(x => !correct(x.q, x.a));
    h += `<div class="sec">${esc(s.t)} — ${sc}/10 · 결과 코드 ${code}</div>`;
    t += `[${s.t}] ${sc}/10 · 결과 코드 ${code}\n`;
    if (!wrong.length) { h += `<div class="ok">전부 정답 🎉</div>`; t += '  전부 정답\n\n'; return; }
    h += '<table><tr><th>#</th><th>유형</th><th>문항</th><th>내 답</th><th>정답</th><th>다시 볼 곳</th></tr>';
    wrong.forEach(({ q, k, a }) => {
      const qt = strip(q.type === 'flash' ? q.front : (q.p || q.p2 || '')).replace(/\s+/g, ' ').slice(0, 70);
      const my = fmt(q, a, false), co = fmt(q, a, true);
      h += `<tr><td>${k + 1}</td><td>${TYPES[q.type].n}</td><td>${esc(qt)}</td><td class="bad">${esc(my)}</td><td class="ok">${esc(co)}</td><td>${esc(strip(q.an))}</td></tr>`;
      t += `  ${k + 1}. [${TYPES[q.type].n}] ${qt}\n     내 답: ${my}\n     정답: ${co}\n     다시 볼 곳: ${strip(q.an)}\n`;
    });
    h += '</table>'; t += '\n';
  });
  const notGraded = Q.map((s, i) => graded[i] ? null : i + 1).filter(x => x);
  const typeLine = Object.entries(byType).map(([k, [c, n]]) => `${TYPES[k].n} ${c}/${n}`).join(' · ');
  const sum = `<div class="sum"><span>채점한 교시 ${cnt}/8</span><span>합계 ${tot}/${cnt * 10}</span>${notGraded.length ? `<span class="none">미채점: ${notGraded.join(', ')}교시</span>` : ''}</div>` + (typeLine ? `<div class="meta">유형별 정답: ${typeLine}</div>` : '');
  h = h.replace('</div>', '</div>' + sum);
  t = t.replace('\n\n', `\n채점한 교시 ${cnt}/8 · 합계 ${tot}/${cnt * 10}${notGraded.length ? ' · 미채점 ' + notGraded.join(', ') + '교시' : ''}\n유형별 정답: ${typeLine}\n\n`);
  lastHtml = h; lastText = t;
  return h;
}
$('#submitBtn').onclick = () => {
  if (!graded.some(x => x)) { alert('먼저 한 교시 이상 채점하세요.'); return; }
  $('#dgBody').innerHTML = buildReport(); $('#toast').textContent = ''; $('#dlg').showModal();
};
$('#closeBtn').onclick = () => $('#dlg').close();
$('#captureBtn').onclick = async () => {
  const htmlDoc = `<meta charset="utf-8">` + lastHtml.replace(/ class="[^"]*"/g, '').replace(/<table>/g, '<table border="1" style="border-collapse:collapse">');
  try {
    if (navigator.clipboard && window.ClipboardItem) {
      await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([htmlDoc], { type: 'text/html' }), 'text/plain': new Blob([lastText], { type: 'text/plain' }) })]);
      $('#toast').textContent = '복사했습니다 — 노션에 붙여 넣으세요.'; return;
    }
  } catch (e) {}
  const ta = document.createElement('textarea'); ta.value = lastText; ta.style.position = 'fixed'; ta.style.opacity = '0';
  $('#dlg').appendChild(ta); ta.focus(); ta.select();
  const ok = document.execCommand('copy'); ta.remove();
  $('#toast').textContent = ok ? '텍스트로 복사했습니다.' : '복사하지 못했습니다 — 직접 선택해 복사하세요.';
};

$('#legend').innerHTML = Object.values(TYPES).map(t => `<span class="tag" style="color:${t.c};border-color:${t.c}55">${t.n}</span>`).join('');
// worksheet.html#t3 → 3교시 탭으로 바로 열기 (노트북 교시별 링크)
function fromHash(){ const m = location.hash.match(/^#t([1-8])$/); if (m) { tab = +m[1] - 1; } }
fromHash();
window.addEventListener('hashchange', () => { fromHash(); render(); window.scrollTo({ top: 0 }); });
render();
</script>
</body>
