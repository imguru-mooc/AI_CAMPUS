<div class="eyebrow">AI_CAMPUS · linux-day1 · worksheet</div><h1>Day 1 개념 워크시트</h1>
<p class="lead">교시별 10문항 · 4지 선다. 교시를 마칠 때마다 <b>제출 화면 만들기</b>를 누르고 그 화면을 캡처해 제출한다. 답은 이 브라우저에 자동 저장된다.</p>

</div><script>
const W=[{"t": "1교시 · 환경 점검", "items": [{"q": "현재 실행 중인 리눅스 커널의 버전 문자열만 출력하려고 한다. 아래 빈칸에 들어갈 옵션은?", "c": "uname ____", "o": ["-a", "-m", "-r", "-n"], "a": 2, "e": "-r은 커널 릴리스(release)만, -a는 전부, -n은 호스트 이름, -m은 아키텍처를 출력한다."}, {"q": "이 과목의 모든 C 실습이 x86_64 Ubuntu에서 진행될 때, `uname -m`의 출력으로 알맞은 것은?", "c": null, "o": ["aarch64", "x86_64", "i386", "armv7l"], "a": 1, "e": "Intel/AMD 64비트 PC는 x86_64다. aarch64는 Jetson·라즈베리파이 같은 64비트 ARM."}, {"q": "check_env.sh에서 CPU 코어 수가 1로 나왔다. VM 환경이라면 가장 먼저 할 조치는?", "c": null, "o": ["VM 설정에서 vCPU를 2개 이상으로 늘린다", "스왑 파일 크기를 두 배로 늘려 둔다", "gcc 대신 clang을 설치해 사용한다", "Ubuntu를 최신 LTS 버전으로 업그레이드해 둔다"], "a": 0, "e": "코어가 1개면 Day 2 affinity, Day 5 race 실습 결과가 나오지 않는다. VM의 vCPU 할당을 늘린다."}, {"q": "아래 명령에서 `build-essential` 패키지가 설치해 주는 것으로 가장 알맞은 것은?", "c": "sudo apt install build-essential", "o": ["gcc·make 등 C 빌드 도구 묶음", "시스템 콜 추적 도구 strace 단독", "리눅스 커널 소스 전체와 헤더 파일 묶음", "그래픽 기반의 통합 개발 환경 IDE"], "a": 0, "e": "build-essential은 gcc, g++, make, libc 개발 헤더 등을 함께 설치하는 메타 패키지다."}, {"q": "프로그램이 호출하는 시스템 콜을 하나씩 추적해 보여 주는 도구는?", "c": null, "o": ["valgrind", "perf", "strace", "gdb"], "a": 2, "e": "strace는 시스템 콜 추적, valgrind는 메모리 오류 검사, gdb는 디버거, perf는 성능 분석 도구다."}, {"q": "Day 4 커널 모듈 실습 전에 `mokutil --sb-state`로 확인하려는 것은?", "c": null, "o": ["현재 로그인한 사용자의 sudo 권한", "커널 모듈 소스 파일의 문법 오류 여부", "설치된 커널 헤더의 버전 일치 여부", "Secure Boot가 켜져 있는지 여부"], "a": 3, "e": "Secure Boot가 켜져 있으면 서명되지 않은 모듈은 insmod가 거부된다."}, {"q": "`linux-headers-$(uname -r)` 처럼 패키지 이름 안에 `$(uname -r)`를 쓴 이유는?", "c": null, "o": ["32비트와 64비트 헤더를 모두 받으려고", "저장소에서 가장 최신 커널 헤더를 자동으로 고르려고", "패키지 이름의 오타를 셸이 고쳐 주게 하려고", "실행 중인 커널 버전에 맞는 패키지를 고르려고"], "a": 3, "e": "$( )는 명령 치환이다. uname -r 결과(예: 6.8.0-45-generic)가 그 자리에 들어가 현재 커널용 패키지를 고른다."}, {"q": "Ubuntu 24.04의 기본 커널 6.8이 쓰는 일반 프로세스 스케줄러는? (Day 2 예고)", "c": null, "o": ["O(1) 스케줄러", "EEVDF", "라운드 로빈 단독", "CFS"], "a": 1, "e": "커널 6.6부터 CFS 대신 EEVDF가 기본 스케줄러가 되었다."}, {"q": "`sudo apt update` 명령이 하는 일로 알맞은 것은?", "c": null, "o": ["오래된 패키지 캐시 파일을 모두 삭제한다", "저장소의 패키지 목록 정보를 새로 받아 온다", "설치된 모든 패키지를 최신 버전으로 올린다", "운영체제를 다음 배포판 버전으로 올린다"], "a": 1, "e": "update는 목록 갱신만, upgrade가 실제 설치된 패키지를 올린다."}, {"q": "WSL2 환경에서 이 과정을 진행할 때 대체 실습이 필요한 부분은?", "c": null, "o": ["Makefile로 여러 예제를 빌드하기", "fork와 exec로 자식 프로세스를 만들기", "커널 모듈 로드와 thermal sysfs 읽기", "gcc로 C 프로그램을 컴파일하고 실행하기"], "a": 2, "e": "WSL2는 Microsoft 커널을 쓰며 모듈 로드·일부 sysfs(thermal 등)가 제한된다. 일반 C·POSIX 실습은 동작한다."}]}, {"t": "2교시 · Shell 필수", "items": [{"q": "현재 위치가 `/home/user/linux-course/day1`일 때, 아래 명령 실행 후의 위치는?", "c": "cd ../day2", "o": ["/home/user/linux-course/day1/day2", "/home/user/linux-course/day2", "/day2", "/home/user/day2"], "a": 1, "e": ".. 은 상위 디렉터리(linux-course)이므로 그 아래 day2로 이동한다."}, {"q": "아래 `ls -l` 출력에서 그룹 사용자에게 주어진 권한은?", "c": "-rwxr-x--- 1 user dev 512 Oct  2 09:10 run.sh", "o": ["아무 권한도 주어지지 않았다", "읽기·쓰기·실행 모두 가능하다", "읽기와 실행만 가능하다", "읽기만 가능하고 실행은 안 된다"], "a": 2, "e": "rwx(소유자) r-x(그룹) ---(기타). 그룹은 r과 x만 있다."}, {"q": "아래 명령을 실행하면 `err.txt`에는 무엇이 저장되는가?", "c": "./a.out > out.txt 2> err.txt", "o": ["표준 에러(fd 2)로 나간 출력만", "아무것도 저장되지 않고 화면에 나온다", "표준 출력(fd 1)으로 나간 출력만", "표준 출력과 표준 에러를 모두"], "a": 0, "e": "2> 는 fd 2(stderr)만 파일로 보낸다."}, {"q": "빌드 메시지와 에러 메시지를 모두 `build.log` 한 파일에 담으려면 빈칸에 무엇을 써야 하나?", "c": "make > build.log ____", "o": ["1>&2", "2>1", "2>&1", "&>2"], "a": 2, "e": "2>&1은 fd 2를 fd 1이 가리키는 곳(build.log)으로 복제한다. 순서가 중요해서 > build.log 뒤에 써야 한다."}, {"q": "아래 파이프라인이 최종적으로 출력하는 것은?", "c": "grep processor /proc/cpuinfo | wc -l", "o": ["CPU 모델 이름 한 줄", "CPU 논리 코어 수", "processor 단어의 글자 수", "cpuinfo 파일의 전체 줄 수"], "a": 1, "e": "grep이 processor 줄만 고르고, wc -l이 그 줄 수를 센다 = 논리 코어 수."}, {"q": "명령 끝에 `&`를 붙여 실행했을 때의 동작은?", "c": "sleep 30 &", "o": ["백그라운드에서 실행되고 프롬프트가 바로 돌아온다", "에러가 나도 무시하고 계속 실행하게 한다", "다른 사용자도 볼 수 있게 공유 실행된다", "30초 뒤에 같은 명령이 자동으로 다시 한 번 실행된다"], "a": 0, "e": "&는 셸이 자식의 종료를 기다리지 않게 한다(백그라운드 실행)."}, {"q": "방금 백그라운드로 실행한 프로세스의 PID를 담고 있는 셸 변수는?", "c": null, "o": ["$#", "$$", "$?", "$!"], "a": 3, "e": "$!는 마지막 백그라운드 PID, $?는 직전 종료 코드, $$는 셸 자신의 PID, $#은 인자 개수."}, {"q": "스크립트 파일에 소유자 실행 권한만 추가하는 명령은?", "c": null, "o": ["chmod 600 run.sh", "chown +x run.sh", "chmod o+w run.sh", "chmod u+x run.sh"], "a": 3, "e": "u+x는 소유자(user)에게 실행(x) 추가. 600은 rw------- 로 실행 권한이 없다."}, {"q": "아래 명령의 결과로 생기는 디렉터리 구조로 맞는 것은?", "c": "mkdir -p test/a/b", "o": ["test가 없으면 에러가 나고 아무것도 안 생긴다", "test, a, b 세 디렉터리가 나란히 생긴다", "test 안에 a, 그 안에 b가 한 번에 생긴다", "b만 생기고 test/a는 링크로 연결된다"], "a": 2, "e": "-p(parents)는 중간 경로가 없으면 함께 만든다."}, {"q": "`rm -r test` 실행에 대한 설명으로 옳은 것은?", "c": null, "o": ["휴지통 없이 즉시 삭제되어 되돌릴 수 없다", "빈 디렉터리일 때만 삭제가 허용된다", "root 권한이 없으면 항상 실패한다", "휴지통으로 이동하므로 언제든 복구된다"], "a": 0, "e": "rm은 휴지통을 거치지 않는다. 디렉터리째 지울 때는 경로를 두 번 확인한다."}]}, {"t": "3교시 · Makefile · 측정 스크립트", "items": [{"q": "아래 Makefile에서 `make` 실행 시 `missing separator` 에러가 났다. 가장 유력한 원인은?", "c": "%: %.c\n    $(CC) $(CFLAGS) -o $@ $<", "o": ["패턴 규칙 %: %.c 문법이 틀렸다", "$@와 $<의 순서가 서로 바뀌었다", "명령 줄이 탭이 아닌 스페이스로 시작했다", "CFLAGS 변수를 정의하지 않고 사용했다"], "a": 2, "e": "Makefile의 레시피(명령) 줄은 반드시 탭 문자로 시작해야 한다."}, {"q": "패턴 규칙 `%: %.c`로 `03_errno`를 빌드할 때 `$<`의 값은?", "c": "%: %.c\n\t$(CC) $(CFLAGS) -o $@ $<", "o": ["03_errno.c", "%.c", "Makefile.c", "03_errno"], "a": 0, "e": "$@는 대상(03_errno), $<는 첫 번째 재료(03_errno.c)."}, {"q": "방금 모든 예제를 빌드했고 아무것도 수정하지 않은 채 `make`를 다시 쳤다. 결과는?", "c": null, "o": ["가장 최근 파일 하나만 다시 컴파일한다", "Nothing to be done 메시지만 나온다", "실행 파일이 이미 있다는 에러로 멈춘다", "모든 예제를 처음부터 다시 컴파일한다"], "a": 1, "e": "make는 대상이 재료보다 새로우면 건너뛴다."}, {"q": "`touch 03_errno.c` 후 `make`를 실행하면 다시 빌드되는 것은?", "c": null, "o": ["03_errno와 그 다음 번호 예제", "아무것도 빌드되지 않는다", "모든 예제 실행 파일", "03_errno 하나만"], "a": 3, "e": "touch는 수정 시각(mtime)만 갱신한다. 03_errno.c가 03_errno보다 새로워져 그것만 다시 빌드된다."}, {"q": "아래 Makefile 변수 정의 후 `TARGETS`의 값은? (폴더에 a.c, b.c가 있다)", "c": "SRCS    = $(wildcard *.c)\nTARGETS = $(SRCS:.c=)", "o": ["a.o b.o", "a b", "*.c", "a.c b.c"], "a": 1, "e": "$(SRCS:.c=)는 각 단어 끝의 .c를 빈 문자열로 바꾼다."}, {"q": "`.PHONY: all clean`을 선언하는 이유로 알맞은 것은?", "c": null, "o": ["clean 대상을 다른 모든 대상보다 먼저 실행하려고", "같은 이름의 파일이 있어도 항상 명령을 실행하려고", "all과 clean을 동시에 병렬 실행하려고", "make 출력에서 두 대상을 숨기려고"], "a": 1, "e": "clean이라는 파일이 실제로 있으면 make가 '최신'이라 판단해 실행하지 않는다. PHONY는 파일이 아닌 대상임을 알린다."}, {"q": "run.sh를 아래처럼 실행했다. 스크립트 안에서 `$2`의 값은?", "c": "./run.sh ./02_syscall_direct 5 r.csv", "o": ["3", "r.csv", "./02_syscall_direct", "5"], "a": 3, "e": "$1=./02_syscall_direct, $2=5, $3=r.csv, $#=3."}, {"q": "run.sh에서 `OUT=${3:-result.csv}` 줄의 의미는?", "c": null, "o": ["result.csv 파일을 3개까지 만든다", "결과를 세 번째 줄부터 result.csv에 쓴다", "세 번째 인자가 없으면 result.csv를 쓴다", "세 번째 인자에서 result.csv를 뺀 값을 쓴다"], "a": 2, "e": "${변수:-기본값}은 변수가 비었거나 없을 때 기본값을 쓴다."}, {"q": "셸 스크립트 첫 줄 `#!/bin/bash`의 역할은?", "c": null, "o": ["커널에게 이 파일을 실행할 인터프리터를 알려 준다", "bash에서만 읽을 수 있는 주석을 표시한다", "스크립트 실행 전에 문법 검사를 수행한다", "스크립트를 root 권한으로 실행하게 한다"], "a": 0, "e": "shebang. ./run.sh로 실행하면 커널이 이 줄을 보고 /bin/bash run.sh로 실행한다."}, {"q": "아래 줄이 `elapsed_ms`로 기록하는 값의 의미는?", "c": "start=$(date +%s%N)\n\"$PROG\" > /dev/null\nend=$(date +%s%N)\necho \"$i,$(( (end - start) / 1000000 ))\"", "o": ["프로그램 시작 시각의 초 단위 값", "프로그램이 출력한 줄의 개수", "프로그램 1회 실행 시간(밀리초)", "프로그램이 사용한 메모리(MB)"], "a": 2, "e": "%s%N은 나노초 단위 현재 시각. 차이를 1,000,000으로 나누면 밀리초."}]}, {"t": "4교시 · 시스템 콜과 커널 경계", "items": [{"q": "사용자 프로그램이 파일 쓰기처럼 하드웨어에 영향을 주는 작업을 할 때 반드시 거치는 것은?", "c": null, "o": ["시스템 콜을 통해 커널에 요청한다", "하드웨어 레지스터에 직접 값을 쓴다", "C 표준 라이브러리가 대신 처리해 끝낸다", "다른 프로세스의 메모리를 빌려 쓴다"], "a": 0, "e": "사용자 모드에서는 장치 접근이 금지된다. 시스템 콜로 커널 모드에 진입해야 한다."}, {"q": "`man 2 write`와 `man 3 printf`에서 숫자 2와 3이 뜻하는 것은?", "c": null, "o": ["2는 시스템 콜, 3은 라이브러리 함수 설명서", "2는 두 번째 버전, 3은 세 번째 버전 설명서", "2는 커널 내부 함수, 3은 셸 내장 명령", "2는 사용자 명령, 3은 관리자 명령 설명서"], "a": 0, "e": "man 섹션 1=명령, 2=시스템 콜, 3=라이브러리 함수."}, {"q": "x86_64에서 시스템 콜 번호가 실리는 레지스터는?", "c": null, "o": ["rip", "rax", "rdi", "rsp"], "a": 1, "e": "rax=번호, rdi·rsi·rdx…=인자, 반환값도 rax로 돌아온다."}, {"q": "아래 코드에서 a와 b의 관계로 옳은 것은?", "c": "pid_t a = getpid();\nlong  b = syscall(SYS_getpid);", "o": ["b는 시스템 콜 번호 39가 된다", "b는 a보다 항상 1이 크다", "a는 부모 PID, b는 자기 PID다", "둘은 항상 같은 값이다"], "a": 3, "e": "getpid()는 SYS_getpid를 호출하는 glibc 래퍼일 뿐이다."}, {"q": "아래 프로그램을 터미널에서 직접 실행할 때 write 시스템 콜은 몇 번 호출되나?", "c": "write(1, \"A\\n\", 2);\nprintf(\"B\\n\");\nprintf(\"C\\n\");", "o": ["1번", "3번", "2번", "4번"], "a": 1, "e": "터미널이면 printf는 줄 단위 버퍼링 → \\n마다 write. 직접 write 1번 + printf 2번 = 3번."}, {"q": "위 프로그램을 `./a.out | cat`으로 실행하면 화면에 나오는 순서는?", "c": "write(1, \"A\\n\", 2);\nprintf(\"B\\n\");\nprintf(\"C\\n\");", "o": ["C, B, A", "B, C, A", "A만 나오고 B, C는 사라진다", "A, B, C"], "a": 3, "e": "write는 즉시 나가고, B·C는 버퍼에 모였다가 exit 때 한 번에 나간다. 여기서는 A가 먼저라 순서는 같다."}, {"q": "`strace -c ./prog`가 보여 주는 정보로 알맞은 것은?", "c": null, "o": ["메모리 누수가 생긴 위치 목록", "프로그램 소스의 줄별 실행 횟수 통계", "시스템 콜별 호출 횟수와 소요 시간", "함수별 CPU 캐시 미스 비율"], "a": 2, "e": "-c는 시스템 콜 요약(count) 표를 출력한다."}, {"q": "printf가 매번 write를 부르지 않고 버퍼에 모아 두는 가장 큰 이유는?", "c": null, "o": ["문자열 인코딩을 변환하는 시간을 벌려고", "시스템 콜 횟수를 줄여 전환 비용을 아끼려고", "화면에 나오는 출력 순서를 항상 보장하려고", "커널이 한 줄씩만 받을 수 있어서"], "a": 1, "e": "시스템 콜은 사용자↔커널 전환 비용이 있어, 모아서 적게 부르는 것이 빠르다."}, {"q": "시스템 콜이 끝나고 사용자 모드로 돌아올 때 커널이 반환값을 전달하는 방법은?", "c": null, "o": ["프로세스의 표준 출력으로 값을 쓴다", "전역 변수 errno에 항상 값을 쓴다", "스택 맨 위에 문자열로 값을 쓴다", "rax 레지스터에 값을 넣어 돌려준다"], "a": 3, "e": "반환값은 rax로 온다. errno 설정은 glibc 래퍼가 실패 시에만 한다."}, {"q": "아래 strace 출력에서 70이 의미하는 것은?", "c": "write(1, \"printf line 0\\nprintf line 1\\n\"..., 70) = 70", "o": ["파일 디스크립터 번호", "시스템 콜 번호", "실제로 쓴 바이트 수", "printf 호출 횟수"], "a": 2, "e": "= 뒤의 값이 반환값. write는 쓴 바이트 수를 돌려준다."}]}, {"t": "5교시 · 에러 처리와 /proc", "items": [{"q": "아래 코드에서 open이 실패했을 때 fd에 들어가는 값은?", "c": "int fd = open(\"/no/such/file\", O_RDONLY);", "o": ["NULL", "-1", "-2", "0"], "a": 1, "e": "실패 시 -1을 반환하고 원인은 errno에 남긴다. 커널이 준 -2(-ENOENT)를 glibc가 -1+errno로 바꾼다."}, {"q": "없는 파일을 열려다 실패했을 때 errno에 저장되는 상수는?", "c": null, "o": ["EACCES", "EISDIR", "ENOENT", "EBADF"], "a": 2, "e": "ENOENT(2) = No such file or directory."}, {"q": "일반 사용자가 `/etc/shadow`를 읽기로 열 때 나오는 errno는?", "c": null, "o": ["EEXIST", "ENOENT", "EINVAL", "EACCES"], "a": 3, "e": "파일은 있지만 권한이 없다 → EACCES(13). sudo로 실행하면 성공한다."}, {"q": "아래 코드의 출력 형식으로 알맞은 것은?", "c": "close(100);\nperror(\"close(100)\");", "o": ["Bad file descriptor (close(100))", "close(100) 실패: -1", "errno=9 close(100)", "close(100): Bad file descriptor"], "a": 3, "e": "perror는 '전달한 문자열: strerror(errno)' 형식으로 stderr에 출력한다."}, {"q": "errno 사용 규칙으로 옳은 것은?", "c": null, "o": ["errno는 printf로만 읽을 수 있다", "errno는 프로그램 시작 시에만 설정된다", "함수가 실패를 반환했을 때만 errno를 읽는다", "성공한 뒤에는 errno가 항상 0이 된다"], "a": 2, "e": "성공한 호출은 errno를 바꾸지 않을 수 있어, 이전 실패 값이 남아 있을 수 있다."}, {"q": "`/proc` 파일시스템에 대한 설명으로 옳은 것은?", "c": null, "o": ["디스크에 1초마다 자동으로 저장되는 시스템 로그 파일이다", "root만 읽을 수 있는 설정 파일 모음이다", "프로그램 종료 후에 생성되는 기록 파일이다", "읽는 순간 커널이 내용을 만들어 주는 가상 파일이다"], "a": 3, "e": "procfs는 디스크에 없다. 크기도 0으로 보이는 파일이 많다."}, {"q": "`/proc/self`가 가리키는 것은?", "c": null, "o": ["그 경로를 읽고 있는 프로세스 자신", "PID 1번인 init(systemd) 프로세스", "현재 로그인한 셸 프로세스", "가장 최근에 생성된 프로세스"], "a": 0, "e": "같은 /proc/self도 cat이 읽으면 cat의, 내 C 프로그램이 읽으면 그 프로그램의 정보다."}, {"q": "04_proc_self에서 50MB를 malloc만 하고 memset을 지우면 VmRSS는 어떻게 될까?", "c": null, "o": ["거의 늘지 않는다", "정확히 50MB 늘어난다", "malloc이 실패해 0이 된다", "100MB로 두 배 늘어난다"], "a": 0, "e": "malloc은 주소 공간만 예약한다. 실제로 써야 물리 페이지가 할당된다(Day 3 demand paging)."}, {"q": "`/proc/self/status`의 `VmRSS` 항목이 나타내는 것은?", "c": null, "o": ["프로세스가 연 파일의 총 크기", "프로세스가 예약한 가상 주소 크기", "실제로 물리 메모리를 차지한 크기", "디스크 스왑에 내려간 메모리 크기"], "a": 2, "e": "RSS = Resident Set Size. 실제 RAM에 올라와 있는 양."}, {"q": "아래 코드에서 fopen 실패를 처리하지 않으면 생길 수 있는 문제는?", "c": "FILE *fp = fopen(\"/proc/self/status\", \"r\");\nfgets(line, sizeof(line), fp);", "o": ["파일이 자동으로 다시 열려 문제가 없다", "fp가 NULL이면 fgets에서 비정상 종료된다", "컴파일 단계에서 에러로 막아 준다", "항상 빈 문자열을 읽고 정상 종료한다"], "a": 1, "e": "NULL 포인터로 fgets를 호출하면 segmentation fault가 난다. 반환값 검사가 필요하다."}]}, {"t": "6교시 · 프로세스 생성", "items": [{"q": "`fork()`가 자식 프로세스에게 돌려주는 값은?", "c": null, "o": ["-1", "0", "자식 자신의 PID", "부모의 PID"], "a": 1, "e": "자식은 0, 부모는 자식 PID, 실패 시 부모에게 -1."}, {"q": "아래 코드의 실행 결과 부모의 x와 자식의 x는?", "c": "int x = 100;\npid_t pid = fork();\nif (pid == 0) { x += 1; exit(0); }\nwait(NULL);\nx -= 1;", "o": ["부모 99, 자식 101", "부모 99, 자식 99", "부모 100, 자식 100", "부모 100, 자식 101"], "a": 0, "e": "fork 후 메모리는 분리된다. 자식은 101, 부모는 99."}, {"q": "아래 코드를 실행하면 \"hi\"는 몇 번 출력되나?", "c": "fork();\nfork();\nprintf(\"hi\\n\");", "o": ["2번", "3번", "1번", "4번"], "a": 3, "e": "fork 두 번 → 1→2→4개 프로세스가 각각 printf."}, {"q": "fork 직전에 `fflush(stdout)`를 호출하는 이유는?", "c": null, "o": ["자식이 부모보다 먼저 실행되게 하려고", "자식 프로세스의 출력을 막아 두려고", "버퍼가 자식에게 복제돼 중복 출력되는 것을 막으려고", "fork가 실패할 때 에러 메시지를 남기려고"], "a": 2, "e": "fork는 stdio 버퍼까지 복제한다. 파이프 출력 시 같은 줄이 두 번 나올 수 있다."}, {"q": "execvp가 성공했을 때의 동작으로 옳은 것은?", "c": null, "o": ["부모 프로세스의 코드를 교체한다", "0을 반환하고 다음 줄을 실행한다", "새 PID를 가진 프로세스를 만든다", "호출한 다음 줄로 돌아오지 않는다"], "a": 3, "e": "exec는 현재 프로세스의 내용물을 새 프로그램으로 교체한다. 돌아올 코드 자체가 없다."}, {"q": "exec 후에도 유지되는 것은?", "c": null, "o": ["원래 프로그램의 전역 변수와 static 변수 값", "PID와 열려 있던 파일 디스크립터", "원래 프로그램의 스택 내용", "원래 프로그램의 힙 메모리"], "a": 1, "e": "PID·부모 관계·fd(close-on-exec 제외)는 유지되고 코드·데이터·스택은 교체된다."}, {"q": "아래 실행에서 부모가 출력하는 종료 코드는?", "c": "./06_fork_exec_wait ls /nope", "o": ["2", "127", "0", "1"], "a": 0, "e": "ls는 접근 실패 시 종료 코드 2를 반환한다."}, {"q": "아래 코드에서 execvp가 실패하면 부모가 받는 종료 코드는?", "c": "execvp(cmd[0], cmd);\nperror(\"execvp\");\n_exit(127);", "o": ["255", "0", "127", "-1"], "a": 2, "e": "exec 실패 시 관례적으로 127을 쓴다(셸의 command not found와 같음)."}, {"q": "자식이 정상적으로 exit했는지 검사한 뒤 종료 코드를 꺼내는 매크로 조합은?", "c": null, "o": ["WIFSTOPPED와 WSTOPSIG", "WIFEXITED와 WEXITSTATUS", "WCOREDUMP와 WEXITSTATUS", "WIFSIGNALED와 WTERMSIG"], "a": 1, "e": "정상 종료 → WIFEXITED가 참일 때 WEXITSTATUS로 코드를 읽는다."}, {"q": "자식이 kill(SIGTERM)으로 죽었을 때 참이 되는 매크로는?", "c": null, "o": ["WEXITSTATUS(status)", "WIFEXITED(status)", "WIFSIGNALED(status)", "WIFCONTINUED(status)"], "a": 2, "e": "시그널로 종료되면 WIFSIGNALED가 참이고 WTERMSIG가 15를 돌려준다."}]}, {"t": "7교시 · 좀비 · 고아 · 시그널", "items": [{"q": "자식이 끝났는데 부모가 wait하지 않았다. 자식의 상태는?", "c": null, "o": ["좀비(Z) — 종료 코드만 테이블에 남는다", "고아 — init이 즉시 입양한다", "실행(R) — 계속 CPU를 사용한다", "잠듦(S) — 부모가 a": 3, "e": "시그널로 죽으면 셸은 128+시그널 번호를 쓴다. SIGINT=2 → 130."}]}, {"t": "8교시 · 종합 실습 myshell", "items": [{"q": "myshell의 기본 루프 순서로 알맞은 것은?", "c": null, "o": ["wait → fork → exec → 입력 읽기", "exec → fork → 입력 읽기 → wait", "fork → 입력 읽기 → 자르기 → wait → exec", "입력 읽기 → 자르기 → fork → exec → wait"], "a": 3, "e": "셸은 매 명령마다 fork-exec-wait를 반복한다."}, {"q": "`cd`를 자식 프로세스에서 실행하면 생기는 문제는?", "c": null, "o": ["셸이 다른 사용자로 바뀌어 버린다", "이동한 디렉터리 아래 파일이 모두 삭제된다", "자식이 종료되지 않고 좀비가 된다", "셸 자신의 현재 디렉터리는 바뀌지 않는다"], "a": 3, "e": "현재 디렉터리는 프로세스별 속성이다. 셸이 직접 chdir해야 한다."}, {"q": "execvp에 넘기는 argv 배열의 마지막 원소는?", "c": "char *argv[] = { \"ls\", \"-l\", \"/tmp\", ____ };", "o": ["0x20", "NULL", "\"\"", "\"\\0\""], "a": 1, "e": "exec 계열은 NULL 포인터로 인자 목록의 끝을 판단한다."}, {"q": "아래 parse 함수에서 `strtok`의 구분자 문자열에 포함된 것은?", "c": "char *tok = strtok(line, \" \\t\\n\");", "o": ["쉼표, 세미콜론, 공백", "탭과 널 문자", "공백, 탭, 줄바꿈", "공백 한 종류만"], "a": 2, "e": "\" \\t\\n\"은 공백·탭·줄바꿈. fgets가 남긴 \\n도 함께 잘린다."}, {"q": "myshell이 `signal(SIGINT, SIG_IGN)`을 호출하는 이유는?", "c": null, "o": ["Ctrl+C에 셸 자신은 죽지 않게 하려고", "Ctrl+C를 누르면 셸을 재시작하려고", "자식이 Ctrl+C를 받지 못하게 하려고", "Ctrl+C 입력을 명령으로 실행하려고"], "a": 0, "e": "셸은 무시하고, 자식은 exec 전에 SIG_DFL로 되돌려 Ctrl+C에 정상 종료되게 한다."}, {"q": "자식에서 `signal(SIGINT, SIG_DFL)`을 exec 전에 호출하는 이유는?", "c": null, "o": ["실행할 명령이 Ctrl+C에 정상 종료되게", "자식의 종료 코드를 0으로 고정하려고", "부모에게 SIGINT를 전달하지 않으려고", "exec 후에도 핸들러 함수를 유지하려고"], "a": 0, "e": "무시(SIG_IGN) 설정은 exec 후에도 상속된다. 기본값으로 되돌려야 sleep 등이 Ctrl+C에 끝난다."}, {"q": "myshell에서 `sleep 100` 실행 중 Ctrl+C를 눌렀다. 다음 프롬프트는?", "c": null, "o": ["myshell[0]$", "myshell[2]$", "myshell[127]$", "myshell[130]$"], "a": 3, "e": "자식이 SIGINT로 죽어 last = 128 + 2 = 130."}, {"q": "myshell에서 존재하지 않는 명령 `nosuchcmd`를 실행한 뒤의 프롬프트는?", "c": null, "o": ["myshell[130]$", "myshell[1]$", "myshell[127]$", "myshell[0]$"], "a": 2, "e": "execvp 실패 → perror → _exit(127)."}, {"q": "`strace -f`의 `-f` 옵션이 필요한 이유는?", "c": "strace -f -e trace=clone,execve,wait4 ./myshell", "o": ["추적 결과를 지정한 파일로 저장하려고", "fork로 생긴 자식까지 추적하려고", "시스템 콜 소요 시간을 함께 출력하려고", "실패한 시스템 콜만 골라 보려고"], "a": 1, "e": "-f(follow)는 자식 프로세스의 시스템 콜도 따라간다. fork는 내부적으로 clone으로 보인다."}, {"q": "myshell이 Ctrl+D 입력에서 종료하는 근거가 되는 코드는?", "c": "if (fgets(line, sizeof(line), stdin) == NULL)\n    break;", "o": ["Ctrl+D가 SIGTERM을 보내기 때문", "fgets가 EOF에서 NULL을 반환하기 때문", "execvp가 Ctrl+D를 명령으로 인식해서", "strtok이 빈 문자열을 돌려주기 때문"], "a": 1, "e": "빈 줄에서 Ctrl+D는 입력 끝(EOF)을 뜻하고, fgets는 NULL을 반환한다."}]}];

  h+=`<label class="${c}"><input type="radio" name="${k}" value="${j}" ${v===j?"checked":""} ${lock?"disabled":""}><span>${md(o)}</span></label>`});
 h+=`<div class="exp"><b>${v===q.a?"정답":"오답"}</b> · ${md(q.e)}</div></div>`});
h+=`<div class="act">${lock?'<button type="button" id="edit">수정하기</button>':'<button type="button" class="primary" id="sub">제출 화면 만들기</button>'}<span class="meta" id="left"></span></div><div class="card" id="card"></div>`;
const B=document.getElementById("body");B.innerHTML=h;
B.querySelectorAll("input[type=radio]").forEach(r=>r.onchange=()=>{S.ans[r.name]=+r.value;save();draw()});
const left=s.items.filter((q,i)=>S.ans[cur+"-"+i]===undefined).length;document.getElementById("left").textContent=lock?"":(left?`남은 문항 ${left}개`:"모두 답했습니다");
if(lock)card();const sb=document.getElementById("sub");if(sb)sb.onclick=()=>{if(!S.nm.trim()){alert("이름을 먼저 입력하세요.");nm.focus();return}if(left&&!confirm(`답하지 않은 문항이 ${left}개 있습니다. 그대로 제출 화면을 만들까요?`))return;S.sub[cur]=new Date().toLocaleString("ko-KR");save();draw();document.getElementById("card").scrollIntoView({behavior:"smooth"})};
const ed=document.getElementById("edit");if(ed)ed.onclick=()=>{delete S.sub[cur];save();draw()};final()}
function card(){const s=W[cur],sc=score(cur),c=document.getElementById("card");c.style.display="block";
c.innerHTML=`<h3>${esc(s.t)}</h3><div class="meta">${esc(S.nm)} · ${esc(S.sub[cur])}</div><div class="big">${sc} / 10</div><div class="grid">`+s.items.map((q,i)=>{const v=S.ans[cur+"-"+i];return `<span class="${v===q.a?"o":"x"}">${cur*10+i+1}${v===q.a?"○":"×"}</span>`}).join("")+`</div>`}
function final(){const f=document.getElementById("final");const all=W.every((s,t)=>S.sub[t]);f.style.display=all?"block":"none";if(all){const tot=W.reduce((a,s,t)=>a+score(t),0);document.getElementById("ftot").textContent=`${tot} / 80`;document.getElementById("fmeta").textContent=`${S.nm} · 8개 교시 제출 완료`}}
draw();
</script></body></html>
