<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCU Day 2 개념 워크시트 — 아날로그 입력 · 센서 · 코드 모듈화</title>
<style>
  :root{--bg:#0b1220;--panel:#111a2e;--line:#1f2b45;--text:#dbe4f0;--dim:#8a9bb8;--amber:#f5b942;--teal:#2dd4bf;--blue:#60a5fa;--green:#4ade80;--red:#f87171;--purple:#c084fc;--mono:"Consolas","D2Coding","JetBrains Mono",monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR","Segoe UI",sans-serif;font-size:15px;line-height:1.55}
  .app{max-width:900px;margin:0 auto;padding:22px 20px 40px}
  h1{color:var(--amber);font-size:24px;margin:0 0 6px}
  .sub{color:var(--dim);margin:0 0 14px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
  .panel h2{font-size:14px;color:var(--dim);margin:0 0 10px;font-weight:600}
  button{background:#172239;border:1px solid #2a3a5c;color:var(--text);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--amber)}button.active{background:#3a2e12;border-color:var(--amber);color:var(--amber)}
  button.primary{background:#123d33;border-color:var(--teal);color:var(--teal);font-weight:700;padding:9px 18px;font-size:14px}
  button.submit{background:#3a2e12;border-color:var(--amber);color:var(--amber);font-weight:700;padding:9px 18px;font-size:14px}
  button:disabled{opacity:.45;cursor:default}
  button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  input[type=text]{background:#0a0f1c;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-family:var(--mono);font-size:14px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px}
  .tabs button .s{font-family:var(--mono);font-size:11px;color:var(--dim);margin-left:6px}
  .tabs button.graded .s{color:var(--green)}
  .head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .head .t{color:var(--amber);font-size:17px}
  .head .a{font-size:13px;color:var(--teal);font-family:var(--mono)}
  .q{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#0e1628}
  .q.unans{border-color:#5a3a1a}
  .q .n{font-family:var(--mono);color:var(--dim);font-size:12px}
  .q .p{margin:4px 0 10px;font-size:15px}
  .q .p code,.opt code,.fb code,td code{font-family:var(--mono);color:var(--blue);background:#0a0f1c;padding:1px 5px;border-radius:4px}
  .q pre.qc{font-family:var(--mono);background:#0a0f1c;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:6px;padding:10px 12px;margin:4px 0 12px;font-size:13.5px;line-height:1.5;white-space:pre;overflow-x:auto;color:#dbe4f3}
  .q pre{font-family:var(--mono);background:#0a0f1c;border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:6px 0 10px;font-size:14px;white-space:pre;overflow-x:auto}
  .opts{display:grid;gap:6px}
  .opt{text-align:left;padding:8px 12px;font-size:14px;font-family:inherit}
  .opt.sel{border-color:var(--amber);background:#1f1a0c}
  .opt.ok{border-color:var(--green);color:var(--green);background:#0d2216}
  .opt.bad{border-color:var(--red);color:var(--red);background:#2a1212}
  .opt:disabled{cursor:default;opacity:.9}
  .fb{margin-top:8px;font-size:13px;color:var(--dim);border-left:3px solid var(--line);padding-left:10px}
  .fb.ok{border-left-color:var(--green)}.fb.bad{border-left-color:var(--red)}
  .fb .anim{color:var(--teal);font-family:var(--mono);font-size:12px;display:block;margin-top:3px}
  .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
  .code{font-family:var(--mono);font-size:20px;color:var(--amber);letter-spacing:1px}
  .score{font-family:var(--mono);color:var(--green);font-size:16px}
  .hint{color:var(--dim);font-size:13px}
  details{color:var(--dim);font-size:13px}
  details summary{cursor:pointer;color:var(--dim)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  /* dialog */
  dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:0;max-width:820px;width:92vw;max-height:88vh}
  dialog::backdrop{background:#000a}
  .dg{padding:18px 20px}
  .dg h3{color:var(--amber);margin:0 0 4px;font-size:20px}
  .dg .meta{color:var(--dim);font-size:13px;margin-bottom:12px;font-family:var(--mono)}
  .dg .sec{margin:14px 0 6px;color:var(--teal);font-weight:700;font-size:14px}
  .dg table{width:100%;border-collapse:collapse;font-size:13px}
  .dg th{text-align:left;color:var(--dim);font-weight:600;padding:5px 8px;border-bottom:1px solid var(--line);font-size:12px}
  .dg td{padding:5px 8px;border-bottom:1px solid #16203a;vertical-align:top}
  .dg td.r{font-family:var(--mono)}
  .dg .ok{color:var(--green)}.dg .bad{color:var(--red)}.dg .none{color:var(--dim)}
  .dg .sum{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0;font-family:var(--mono)}
  .dgbar{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 20px;display:flex;gap:8px;justify-content:flex-end;align-items:center}
  .toast{color:var(--green);font-size:13px;margin-right:auto}
  .body{overflow:auto;max-height:calc(88vh - 60px)}
</style>
</head>
<body>
<div class="app">
  <h1>MCU Day 2 개념 워크시트</h1>
  <p class="sub">아날로그 입력 · 센서 · 코드 모듈화 · 8교시 × 10문항. 🎬 표시는 index.html 의 애니메이션 번호입니다. 답을 고른 뒤 아래 <b style="color:var(--teal)">채점하기</b>를 누르면 정오·해설과 결과 코드가 나타납니다. 채점 전에는 답을 바꿀 수 있고, 채점 후에는 잠깁니다. 모든 교시를 마치면 <b style="color:var(--amber)">제출</b>로 오답 정리를 열고, <b>캡처</b>로 복사해 노션에 붙여 넣으세요.</p>

  <div class="panel">
    <div class="row"><label style="color:var(--dim);font-size:13px">이름 <input type="text" id="name" placeholder="홍길동"></label><span class="hint">이름은 결과 코드 계산에만 쓰이며 저장되지 않습니다.</span></div>
  </div>
  <div class="panel"><h2>교시</h2><div class="tabs" id="tabs"></div></div>
  <div class="panel" id="sheet"></div>
  <div class="panel">
    <div class="actions">
      <button class="primary" id="gradeBtn">채점하기</button>
      <span class="code" id="rcode">—</span><span class="score" id="rscore"></span><span class="hint" id="rhint"></span>
      <button class="submit" id="submitBtn" style="margin-left:auto">제출</button>
    </div>
  </div>
</div>

<dialog id="dlg">
  <div class="body"><div class="dg" id="dgBody"></div></div>
  <div class="dgbar"><span class="toast" id="toast"></span><button id="captureBtn" class="primary">📋 캡처 (노션용 복사)</button><button id="closeBtn">닫기</button></div>
</dialog>

<script>
const $=s=>document.querySelector(s);
const Q=[{"t": "1교시 · ADC 기초 — 가변저항", "anim": "D2-1 ADC 변환기", "qs": [{"p": "ESP32 의 analogRead() 가 돌려주는 값의 범위는 무엇입니까?", "o": ["0 ~ 255", "0 ~ 1023", "0 ~ 4095", "0 ~ 3300"], "a": 2, "w": "ESP32 ADC 는 12비트라 2¹² = 4096 단계, 0~4095 입니다. Arduino Uno 는 10비트(0~1023)입니다.", "an": "D2-1 · raw 12비트"}, {"p": "칩마다 저장된 보정값으로 전압을 mV 단위로 돌려주는 함수는 무엇입니까?", "o": ["analogReadMilliVolts(pin)", "analogRead(pin)", "analogReadResolution(pin)", "readVoltageMilli(pin)"], "a": 0, "w": "전압이 필요하면 analogReadMilliVolts 를 씁니다. raw × 3300 / 4095 비례 계산은 양 끝에서 오차가 큽니다.", "an": "D2-1 · 단순 계산 오차"}, {"p": "Day 4 에서 Wi-Fi 를 켤 예정입니다. 아날로그 센서를 연결할 핀으로 알맞은 것은 무엇입니까?", "o": ["GPIO 25 (ADC2 · DAC)", "GPIO 12 (ADC2 · 부트 핀)", "GPIO 34 (ADC1 · 입력 전용)", "GPIO 0 (ADC2 · Boot 버튼)"], "a": 2, "w": "ADC2 는 Wi-Fi 와 공유되어 Wi-Fi 를 켜면 읽을 수 없습니다. ADC1 은 GPIO 32~39 입니다.", "an": "D2-1 · ADC2 + Wi-Fi 토글"}, {"p": "기본 감쇠(11dB)에서 GPIO 에 3.25V 를 넣으면 analogRead 는 어떤 값에 가깝습니까?", "o": ["약 3250 그대로", "2048 근처", "0 으로 떨어진다", "4095 로 붙는다"], "a": 3, "w": "약 3.1V 이상은 4095 로 포화됩니다. 3.3V 를 넘으면 핀이 위험합니다.", "an": "D2-1 · 3.1V 이상"}, {"p": "가변저항의 세 다리 중 GPIO 에 연결해야 하는 것은 무엇입니까?", "o": ["왼쪽 끝 다리", "가운데 다리(와이퍼)", "오른쪽 끝 다리", "어느 다리든 상관없음"], "a": 1, "w": "양 끝은 3V3 와 GND, 가운데 다리에서 0~3.3V 사이 전압이 나옵니다. 양 끝을 바꾸면 방향만 반대가 됩니다.", "an": "1교시 배선 · 예제 1-4"}, {"p": "아래 함수에서 최소 · 최대를 포인터 인자로 돌려주는 이유는 무엇입니까?", "o": ["반환값은 하나라 여러 결과는 주소로", "포인터로 넘기면 계산 속도가 빨라서", "Arduino 에서는 전역 변수를 쓸 수 없어서", "Arduino 함수 작성 규칙이 요구해서"], "a": 0, "w": "C 과정 Day 2 의 max_to(a, b, &amp;out) 과 같은 모양입니다. 호출할 때 &amp;mn, &amp;mx 를 넘깁니다.", "an": "1교시 예제 1-3", "c": "int read_avg(int pin, int n, int *min_out, int *max_out);"}, {"p": "손잡이를 가만히 두어도 analogRead 값이 수십씩 흔들립니다. 이것은 무엇입니까?", "o": ["가변저항 내부 접점이 고장 난 것", "5V 레일에 잘못 연결해서 생긴 것", "정상적인 ADC 잡음 — 평균으로", "Wi-Fi 간섭 때문에만 생기는 문제"], "a": 2, "w": "ADC 값에는 늘 잡음이 섞입니다. 2교시에 링 버퍼 이동평균으로 줄입니다.", "an": "1교시 예제 1-3"}, {"p": "빈칸에 들어갈 것으로 알맞은 것은 무엇입니까?", "o": ["avg", "avg[0]", "&amp;avg", "*avg"], "a": 3, "w": "avg 는 float * 매개변수입니다. 가리키는 곳에 값을 쓰려면 역참조 *avg 를 씁니다.", "an": "1교시 빈칸 1-1", "c": "void stats(const int *a, int n, int *mn, int *mx, float *avg) {\n    ...\n    ____ = (float)sum / n;\n}"}, {"p": "analogRead 를 쓰기 전에 pinMode(34, INPUT) 이 필요합니까?", "o": ["반드시 INPUT 으로 설정해야 한다", "필요 없다 — analogRead 가 설정한다", "OUTPUT 으로 먼저 설정해야 한다", "INPUT_PULLUP 으로 설정해야 한다"], "a": 1, "w": "아날로그 입력은 pinMode 없이 바로 읽습니다. 풀업을 켜면 오히려 전압이 틀어집니다.", "an": "1교시 예제 1-1"}, {"p": "가변저항 한쪽 끝을 5V 레일에 연결했을 때 문제로 옳은 것은 무엇입니까?", "o": ["GPIO 에 3.3V 초과 전압이 들어간다", "아무 문제 없이 측정 범위만 넓어진다", "값이 항상 0 으로 고정되어 버린다", "가변저항이 과열되어 곧 타 버린다"], "a": 0, "w": "가운데 다리 전압이 0~5V 가 됩니다. 아날로그 센서 전원은 3V3 레일에.", "an": "1교시 예제 1-4"}]}, {"t": "2교시 · 조도 센서와 디지털 필터", "anim": "D2-2 전압 분배 · 링 버퍼", "qs": [{"p": "포토레지스터(CdS)의 성질로 옳은 것은 무엇입니까?", "o": ["밝을수록 저항이 커진다", "밝기와 저항은 무관하다", "밝을수록 저항이 작아진다", "빛을 내는 발광 부품이다"], "a": 2, "w": "밝으면 저항이 작아져 분압 회로의 가운데 전압(GPIO)이 올라갑니다.", "an": "D2-2 · 빛 세기 슬라이더"}, {"p": "3V3 — 포토레지스터 — (GPIO35) — 10kΩ — GND 회로에서 포토레지스터가 10kΩ 일 때 GPIO 전압은 약 얼마입니까?", "o": ["0V", "1.65V", "3.3V", "5V"], "a": 1, "w": "같은 저항 두 개면 전압이 절반으로 나뉩니다: 3.3 × 10k ÷ 20k = 1.65V.", "an": "2교시 예제 2-1 표"}, {"p": "10kΩ 을 빼먹고 포토레지스터만 3V3 ↔ GPIO 에 연결하면 값은 어떻게 됩니까?", "o": ["밝기에 따라 정상적으로 변한다", "음수 값이 나온다", "밝기와 상관없이 항상 0", "밝기와 상관없이 4095 근처"], "a": 3, "w": "GND 쪽 저항이 없어 GPIO 가 3V3 에 붙습니다. 분압에는 저항 두 개가 필요합니다.", "an": "2교시 예제 2-4"}, {"p": "링 버퍼에서 다음에 쓸 위치를 구하는 식으로 옳은 것은 무엇입니까? (RN = 8)", "o": ["head + 1", "(head + 1) % RN", "(head * 2) % RN", "(RN - head) % RN"], "a": 1, "w": "% RN 으로 배열 끝에서 0 으로 돌아가 가장 오래된 값을 덮어씁니다.", "an": "D2-2 · head 이동"}, {"p": "ring_push 에서 버퍼가 가득 찼을 때 sum 에서 빼는 값은 무엇입니까?", "o": ["buf[head] (가장 오래된 값)", "새로 들어온 값 v 자체", "buf[0] (배열 첫 칸의 값)", "sum / RN (지금까지의 평균)"], "a": 0, "w": "가득 찬 상태에서 head 자리는 가장 오래된 값입니다. 빼고 나서 새 값으로 덮어씁니다.", "an": "2교시 빈칸 2-1", "c": "if (r-&gt;count == RN) r-&gt;sum -= r-&gt;buf[____];"}, {"p": "합계(sum)를 구조체에 들고 다니는 이유는 무엇입니까?", "o": ["합계를 들고 다니면 메모리를 아낄 수 있어서", "평균의 소수점 정밀도를 높이려고", "매번 다시 더하지 않고 한 번씩 더하고 빼려고", "버퍼 값을 크기순으로 정렬해 두려고"], "a": 2, "w": "이동평균의 계산량이 RN 과 무관해집니다.", "an": "2교시 예제 2-2"}, {"p": "버퍼가 아직 다 차지 않았을 때 평균을 sum / RN 이 아니라 sum / count 로 구하는 이유는 무엇입니까?", "o": ["count 로 나누는 편이 계산이 더 빨라서", "count 는 항상 RN 과 같은 값이라서", "0 으로 나누는 오류를 막으려고", "RN 으로 나누면 처음 평균이 작게 나와서"], "a": 3, "w": "처음 3개가 들어왔는데 8 로 나누면 평균이 3/8 로 작아집니다.", "an": "2교시 빈칸 2-1 정답"}, {"p": "시리얼 플로터에 두 값을 범례와 함께 그리려면 어떤 형식으로 출력합니까?", "o": ["raw avg (공백 구분)", "raw:123,avg:120", "123;120 (세미콜론)", "[123, 120] (배열)"], "a": 1, "w": "IDE 2 의 시리얼 플로터는 이름:값 을 쉼표로 이어 한 줄씩 받습니다.", "an": "2교시 예제 2-1 · 2-2"}, {"p": "자동 조명에서 LED 를 조도 센서 바로 옆에 두었더니 LED 가 깜빡이며 진동합니다. 이유는 무엇입니까?", "o": ["LED 빛이 센서로 들어가는 되먹임", "PWM 주파수가 너무 낮게 설정되어서", "분압 저항 값이 너무 커서", "ADC2 핀에 센서를 연결해서"], "a": 0, "w": "출력이 입력에 영향을 주는 되먹임입니다. LED 와 센서를 떨어뜨리거나 가립니다.", "an": "2교시 예제 2-4"}, {"p": "자동 조명의 duty 계산으로 \"어두울수록 밝게\" 가 되는 것은 무엇입니까? (avg 0~4095, 8비트)", "o": ["duty = avg * 255 / 4095", "duty = (avg / 16) + 255 - 4095", "duty = 255 - avg * 255 / 4095", "duty = 4095 - avg * 255 / 4095"], "a": 2, "w": "어두우면 avg 가 작으므로 255 에서 빼야 duty 가 커집니다.", "an": "2교시 예제 2-3"}]}, {"t": "3교시 · 조이스틱과 서보", "anim": "D2-3 조이스틱 → 서보", "qs": [{"p": "조이스틱 모듈에 +5V 라고 인쇄되어 있습니다. ESP32 에서는 어디에 연결합니까?", "o": ["5V 레일 (인쇄대로)", "연결하지 않는다", "GPIO 핀 (전원용)", "3V3 레일"], "a": 3, "w": "5V 를 주면 X · Y 출력이 3.3V 를 넘어 ADC 가 4095 에 붙고 핀이 위험합니다. 인쇄와 상관없이 3V3.", "an": "3교시 배선 · 예제 3-1"}, {"p": "조이스틱 SW(버튼)를 GPIO4 에 연결했습니다. 알맞은 설정과 눌렀을 때의 값은 무엇입니까?", "o": ["INPUT 으로 설정, 누르면 HIGH", "INPUT_PULLUP, 누르면 LOW", "OUTPUT 으로 설정, 누르면 HIGH", "analogRead 로 0~4095 를 읽는다"], "a": 1, "w": "Day 1 5교시의 풀업 버튼과 같습니다. 누르면 GND 에 연결되어 LOW.", "an": "3교시 예제 3-1"}, {"p": "SG90 서보를 제어하는 PWM 주파수는 무엇입니까?", "o": ["50Hz (20ms 주기)", "1Hz (1초 주기)", "5000Hz (0.2ms 주기)", "1MHz (1µs 주기)"], "a": 0, "w": "20ms 마다 오는 펄스의 HIGH 길이(약 0.5~2.5ms)로 각도를 정합니다.", "an": "D2-3 · 펄스 그림"}, {"p": "펄스 폭 약 1.5ms 는 서보의 몇 도입니까?", "o": ["0°", "45°", "90°", "180°"], "a": 2, "w": "0.5ms = 0°, 1.5ms = 90°, 2.5ms = 180° (제품마다 약간 다름).", "an": "3교시 예제 3-2"}, {"p": "서보 PWM 분해능을 8비트 대신 14비트   else{$('#rcode').textContent='—';$('#rscore').textContent='';const n=ans[tab].filter(a=>a!==null).length;$('#rhint').textContent=`${tab+1}교시: ${n}/10 골랐습니다. 채점하기를 누르면 잠깁니다.`;}
}
$('#gradeBtn').onclick=()=>{const n=ans[tab].filter(a=>a!==null).length;if(n<10&&!confirm(`아직 ${10-n}문항을 고르지 않았습니다. 그래도 채점할까요? (미응답은 오답 처리)`))return;graded[tab]=true;render();};
$('#name').addEventListener('input',render);

/* ── 제출 대화상자 ── */
let lastHtml='',lastText='';
function buildReport(){
  const nm=$('#name').value.trim()||'(이름 없음)';const ds=new Date().toLocaleString('ko-KR');
  let h=`<h3>MCU Day 2 개념 워크시트 — 오답 정리</h3><div class="meta">${nm} · ${ds}</div>`;
  let t=`MCU Day 2 개념 워크시트 — 오답 정리\n이름: ${nm}\n일시: ${ds}\n\n`;
  let any=false;
  Q.forEach((s,i)=>{if(!graded[i])return;
    const wrong=s.qs.map((q,k)=>({q,k,a:ans[i][k]})).filter(x=>x.a!==x.q.a);
    h+=`<div class="sec">${s.t}</div>`;t+=`### ${s.t}\n`;
    if(!wrong.length){h+=`<div class="ok" style="margin:4px 0 8px">오답 없음</div>`;t+=`오답 없음\n\n`;return;}
    any=true;
    h+=`<table><tr><th>#</th><th>문항</th><th>내 답</th><th>정답</th></tr>`;t+=`| # | 문항 | 내 답 | 정답 |\n|---|---|---|---|\n`;
    wrong.forEach(({q,k,a})=>{const my=a===null?'미응답':'①②③④'[a]+' '+strip(q.o[a]);const co='①②③④'[q.a]+' '+strip(q.o[q.a]);const qt=strip(q.p).replace(/\s+/g,' ').slice(0,70);
      h+=`<tr><td class="r">${k+1}</td><td>${qt}</td><td class="bad">${my}</td><td class="ok">${co}</td></tr>`;
      t+=`| ${k+1} | ${qt.replace(/\|/g,'/')} | ${my.replace(/\|/g,'/')} | ${co.replace(/\|/g,'/')} |\n`;});
    h+=`</table>`;t+=`\n`;});
  const notGraded=Q.map((s,i)=>graded[i]?null:i+1).filter(x=>x);
  if(notGraded.length){h+=`<div class="meta" style="margin-top:10px">미채점: ${notGraded.join(', ')}교시</div>`;t+=`미채점: ${notGraded.join(', ')}교시\n`;}
  lastHtml=h;lastText=t;return h;
}
$('#submitBtn').onclick=()=>{if(!graded.some(x=>x)){alert('먼저 한 교시 이상 채점하기를 눌러 주세요.');return;}$('#dgBody').innerHTML=buildReport();$('#toast').textContent='';$('#dlg').showModal();};
$('#closeBtn').onclick=()=>$('#dlg').close();
function copyRich(html,text){
  // 1) copy 이벤트에 두 형식을 직접 실어 보내기 (사용자 클릭 안에서 동기 실행 — file:// 에서도 동작)
  let done=false;
  const onCopy=e=>{e.clipboardData.setData('text/html',html);e.clipboardData.setData('text/plain',text);e.preventDefault();done=true;};
  document.addEventListener('copy',onCopy);
  try{
    const body=$('#dgBody');const sel=window.getSelection();const range=document.createRange();range.selectNodeContents(body);sel.removeAllRanges();sel.addRange(range);
    document.execCommand('copy');
    sel.removeAllRanges();
  }catch(e){}
  document.removeEventListener('copy',onCopy);
  return done;
}
$('#captureBtn').onclick=async()=>{
  const htmlDoc=`<meta charset="utf-8">`+lastHtml.replace(/ class="[^"]*"/g,'').replace(/<table>/g,'<table border="1" style="border-collapse:collapse">');
  if(copyRich(htmlDoc,lastText)){$('#toast').textContent='복사됨 — 노션 페이지에서 Ctrl+V 로 붙여 넣으세요.';return;}
  // 2) 비동기 Clipboard API
  try{
    if(navigator.clipboard&&window.ClipboardItem){
      await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([htmlDoc],{type:'text/html'}),'text/plain':new Blob([lastText],{type:'text/plain'})})]);
    }else{await navigator.clipboard.writeText(lastText);}
    $('#toast').textContent='복사됨 — 노션 페이지에서 Ctrl+V 로 붙여 넣으세요.';return;
  }catch(e){}
  // 3) 최종: 텍스트 영역 선택 복사
  try{
    const ta=document.createElement('textarea');ta.value=lastText;ta.style.position='fixed';ta.style.opacity='0';$('#dlg').appendChild(ta);ta.focus();ta.select();
    const ok=document.execCommand('copy');ta.remove();
    $('#toast').textContent=ok?'텍스트(마크다운 표)로 복사됨 — 노션에서 Ctrl+V.':'복사 실패 — 대화상자 내용을 드래그해 Ctrl+C 로 복사하세요.';
  }catch(e){$('#toast').textContent='복사 실패 — 대화상자 내용을 드래그해 Ctrl+C 로 복사하세요.';}
};
render();
</script>
</body>
</html>
