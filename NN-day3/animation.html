&lt;div class=&quot;app&quot;&gt;

  &lt;p class=&quot;sub&quot;&gt;784-&lt;b style=&quot;color:var(--amber)&quot;&gt;h&lt;/b&gt;-10 신경망의 기울기를 Day 1 &lt;code&gt;numerical_gradient&lt;/code&gt;(중앙 차분)로 구하면 파라미터 하나마다 손실을 &lt;b style=&quot;color:var(--red)&quot;&gt;2번&lt;/b&gt; 계산해야 합니다 → step 당 &lt;code&gt;2 * P&lt;/code&gt; 번 순전파. 역전파(backpropagation)는 순전파 1번 + 역방향 1번이면 &lt;b style=&quot;color:var(--green)&quot;&gt;모든 기울기&lt;/b&gt;가 한꺼번에 나옵니다. 은닉 크기 h 를 바꿔 보세요 (시간 축은 log 눈금).&lt;/p&gt;

  g.font=&#x27;11px Consolas,monospace&#x27;;
  [[1e-3,&#x27;1ms&#x27;],[1,&#x27;1s&#x27;],[60,&#x27;1min&#x27;],[3600,&#x27;1h&#x27;],[86400,&#x27;1day&#x27;]].forEach(([s,l])=&gt;{g.strokeStyle=&#x27;#1a2540&#x27;;g.beginPath();g.moveTo(X(s),6);g.lineTo(X(s),H-18);g.stroke();g.fillStyle=&#x27;#5d7292&#x27;;g.fillText(l,X(s)-10,H-4);});
  const rows=[[&#x27;수치 1 step&#x27;,c.num,&#x27;#f87171&#x27;],[&#x27;역전파 1 step&#x27;,c.bp,&#x27;#4ade80&#x27;],[&#x27;수치 1 epoch&#x27;,c.num*EPOCH,&#x27;#f87171&#x27;],[&#x27;역전파 1 epoch&#x27;,c.bp*EPOCH,&#x27;#4ade80&#x27;]];
  const rh=(H-30)/rows.length;
  rows.forEach(([l,s,col],i)=&gt;{const y=8+i*rh;g.fillStyle=&#x27;#8a9bb8&#x27;;g.font=(W&lt;420?&#x27;10.5px&#x27;:&#x27;12px&#x27;)+&#x27; &quot;Noto Sans KR&quot;,sans-serif&#x27;;g.fillText(l,4,y+rh*0.55);
    g.fillStyle=col;g.globalAlpha=i&gt;=2?0.55:0.9;g.fillRect(ml,y+rh*0.18,Math.max(2,X(s)-ml),rh*0.5);g.globalAlpha=1;
    g.font=&#x27;11px Consolas,monospace&#x27;;g.fillStyle=&#x27;#dbe4f0&#x27;;const tx=fmtT(s);const tw=g.measureText(tx).width;const xx=X(s)+4+tw&gt;W?X(s)-tw-4:X(s)+4;g.fillStyle=X(s)+4+tw&gt;W?&#x27;#0b1220&#x27;:&#x27;#dbe4f0&#x27;;g.fillText(tx,xx,y+rh*0.55);});
}
function drawRace(fr=null){
  const [g,W,H]=fitCanvas($(&#x27;#race&#x27;));g.clearRect(0,0,W,H);const c=cost(h);
  const f=fr===null?0:fr;const sim=f*c.num;const bpSteps=Math.floor(sim/c.bp);
  const ml=8,mr=8,lw=W-ml-mr;g.font=&#x27;12px Consolas,monospace&#x27;;
  g.fillStyle=&#x27;#1a2540&#x27;;g.fillRect(ml,10,lw,14);g.fillRect(ml,H-30,lw,14);
  g.fillStyle=&#x27;#f87171&#x27;;g.fillRect(ml,10,lw*f,14);
  g.fillStyle=&#x27;#4ade80&#x27;;g.fillRect(ml,H-30,lw*Math.min(1,fr===null?0:Math.max(f&gt;0?1:0,0)),14);
  g.fillStyle=&#x27;#dbe4f0&#x27;;g.fillText(`수치: 손실 ${n0(Math.min(c.evals,f*c.evals))} / ${n0(c.evals)} 번 · ${fmtT(sim)}`,ml,40);
  g.fillText(`역전파: ${fr===null?&#x27;대기&#x27;:n0(bpSteps)+&#x27; step 완료&#x27;}`,ml,H-4);
  return bpSteps;
}
function info(){
  const c=cost(h);$(&#x27;#oh&#x27;).textContent=h;$(&#x27;#sh&#x27;).value=h;$(&#x27;#cp&#x27;).checked=prop;
  $(&#x27;#kv&#x27;).innerHTML=`&lt;span&gt;망&lt;/span&gt;&lt;b&gt;784-${h}-10&lt;/b&gt;&lt;span&gt;P&lt;/span&gt;&lt;b style=&quot;color:var(--amber)&quot;&gt;${n0(c.P)}&lt;/b&gt;&lt;span&gt;손실 계산/step&lt;/span&gt;&lt;b style=&quot;color:var(--red)&quot;&gt;2P = ${n0(c.evals)}&lt;/b&gt;&lt;span&gt;손실 1회&lt;/span&gt;&lt;b&gt;${(c.tl*1e3).toFixed(prop?4:2)} ms${prop?&#x27; (∝ P)&#x27;:&#x27;&#x27;}&lt;/b&gt;&lt;span&gt;수치 미분 1 step&lt;/span&gt;&lt;b style=&quot;color:var(--red)&quot;&gt;${fmtT(c.num)}&lt;/b&gt;&lt;span&gt;역전파 1 step&lt;/span&gt;&lt;b style=&quot;color:var(--green)&quot;&gt;${fmtT(c.bp)}&lt;/b&gt;&lt;span&gt;배수&lt;/span&gt;&lt;b style=&quot;color:var(--amber)&quot;&gt;≈ ${n0(c.num/c.bp)} 배&lt;/b&gt;&lt;span&gt;1 epoch (600)&lt;/span&gt;&lt;b&gt;${fmtT(c.num*EPOCH)} vs ${fmtT(c.bp*EPOCH)}&lt;/b&gt;`;
  setCode(`def count_params(params):              &lt;span class=&quot;c&quot;&gt;# 1-1&lt;/span&gt;\n    return sum(p.size for p in params.values())\n\nparams = init_params(${h})            &lt;span class=&quot;c&quot;&gt;# 784-${h}-10&lt;/span&gt;\nP = count_params(params)               &lt;span class=&quot;c&quot;&gt;# ${n0(c.P)}&lt;/span&gt;\nn_loss = 2 * P                         &lt;span class=&quot;c&quot;&gt;# 1-2  ${n0(c.evals)}&lt;/span&gt;\n\nt0 = time.perf_counter()               &lt;span class=&quot;c&quot;&gt;# 1-3&lt;/span&gt;\nloss_fn(params, Xm, Tm)                &lt;span class=&quot;c&quot;&gt;# 배치 100&lt;/span&gt;\nt_loss = time.perf_counter() - t0      &lt;span class=&quot;c&quot;&gt;# ≈ ${(c.tl*1e3).toFixed(prop?4:2)} ms&lt;/span&gt;\n&lt;span class=&quot;a&quot;&gt;t_num = n_loss * t_loss                 # ≈ ${fmtT(c.num)} / step&lt;/span&gt;\n&lt;span class=&quot;g&quot;&gt;# 역전파: forward 1 + backward 1 ≈ ${fmtT(c.bp)} / step\n# 1 epoch = 600 step → ${fmtT(c.num*EPOCH)} vs ${fmtT(c.bp*EPOCH)}&lt;/span&gt;`);
  drawBar();drawRace();
}
function stopRace(){if(raceTimer){cancelAnimationFrame(raceTimer);raceTimer=null;}}
function race(ms=5000){stopRace();return new Promise(res=&gt;{const t0=performance.now();const c=cost(h);
  const tick=()=&gt;{const f=Math.min(1,(performance.now()-t0)/ms);const n=drawRace(f);setStatus(&#x27;info&#x27;,`수치 미분 진행 ${(f*100).toFixed(0)}% (${fmtT(f*c.num)}) — 역전파는 그동안 ${n0(n)} step`);
    if(f&lt;1)raceTimer=requestAnimationFrame(tick);else{raceTimer=null;setStatus(&#x27;ok&#x27;,`수치 미분 1 step (${fmtT(c.num)}) 이 끝날 때 역전파는 ${n0(c.num/c.bp)} step 을 마쳤습니다.`);res();}};tick();});}
$(&#x27;#sh&#x27;).oninput=e=&gt;{if(busy)return;stopRace();h=+e.target.value;info();const c=cost(h);setStatus(&#x27;info&#x27;,`784-${h}-10: P = ${n0(c.P)}, 손실 ${n0(c.evals)} 번 → 수치 미분 ${fmtT(c.num)} vs 역전파 ${fmtT(c.bp)}`);};

window.addEventListener(&#x27;resize&#x27;,()=&gt;{drawBar();drawRace();});
async function slideTo(target,ms=1400){const a=h,n=24;for(let i=1;i&lt;=n;i++){h=Math.round(a+(target-a)*i/n);info();await sleep(ms/n);}}
const P=[
 {n:&#x27;① 784-1-10 — 은닉 1개&#x27;,ex:&#x27;&lt;p&gt;은닉이 1개뿐이어도 P = 784 + 1 + 10 + 10 = &lt;b class=&quot;amber&quot;&gt;805&lt;/b&gt; → 수치 미분은 step 마다 손실을 &lt;b class=&quot;red&quot;&gt;1,610 번&lt;/b&gt; 계산합니다. 손실 1회를 0.43 ms 로 잡으면 약 0.7 초. 역전파는 그래도 2 ms 수준.&lt;/p&gt;&lt;p&gt;노트북 &lt;code&gt;1-3&lt;/code&gt; 에서 784-1-10 (P 805), 784-2-10 (P 1,600), 784-4-10 (P 3,190) 의 수치 미분 시간을 재고 784-100-10 을 외삽합니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{prop=false;stopRace();await slideTo(1,600);const c=cost(1);setStatus(&#x27;info&#x27;,`784-1-10: P = ${n0(c.P)}, 손실 ${n0(c.evals)} 번/step → ${fmtT(c.num)} vs 역전파 ${fmtT(c.bp)}`);window.__s1=c;}},
 {n:&#x27;② 784-100-10 — 69 초 vs 2 ms&#x27;,ex:&#x27;&lt;p&gt;P = 784·100 + 100 + 100·10 + 10 = &lt;b class=&quot;amber&quot;&gt;79,510&lt;/b&gt; → 손실 &lt;b class=&quot;red&quot;&gt;159,020 번&lt;/b&gt;/step. 손실 1회 ≈ 0.43 ms 이면 수치 미분 1 step ≈ &lt;b class=&quot;red&quot;&gt;69 초&lt;/b&gt;, 역전파 1 step ≈ &lt;b class=&quot;green&quot;&gt;2 ms&lt;/b&gt; — 약 &lt;b class=&quot;amber&quot;&gt;35,000 배&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;측정값은 강사 서버 CPU 기준입니다. Colab 은 기기마다 다르니 &quot;수십 초 vs 수 ms&quot; 로 기억하세요. Day 2 마지막에 예고한 &quot;step 당 손실 159,020번&quot; 이 바로 이것.&lt;/p&gt;&#x27;,
  run:async()=&gt;{prop=false;await slideTo(100,1200);const c=cost(100);setStatus(&#x27;info&#x27;,`784-100-10: P = ${n0(c.P)}, 손실 ${n0(c.evals)} 번 → 수치 미분 ${fmtT(c.num)} vs 역전파 ${fmtT(c.bp)} (≈ ${n0(c.num/c.bp)} 배)`);await sleep(900);await race(4500);window.__s2=c;}},
 {n:&#x27;③ 1 epoch = 600 step&#x27;,ex:&#x27;&lt;p&gt;MNIST 60,000장을 배치 100 으로 나누면 1 epoch = &lt;b class=&quot;amber&quot;&gt;600 step&lt;/b&gt;. 수치 미분: 69 초 × 600 ≈ 41,400 초 ≈ &lt;b class=&quot;red&quot;&gt;11.5 시간&lt;/b&gt;. 역전파: 2 ms × 600 = &lt;b class=&quot;green&quot;&gt;1.2 초&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;8교시 미니 프로젝트는 10 epoch 를 돌립니다 — 수치 미분이면 약 5일, 역전파면 서버에서 약 14 초 (Colab 30~60 초).&lt;/p&gt;&#x27;,
  run:async()=&gt;{prop=false;h=100;info();const c=cost(100);
   setStatus(&#x27;info&#x27;,`1 step: ${fmtT(c.num)} vs ${fmtT(c.bp)}`);await sleep(1200);
   setStatus(&#x27;ok&#x27;,`1 epoch (600 step): 수치 미분 ${fmtT(c.num*EPOCH)} vs 역전파 ${fmtT(c.bp*EPOCH)} — 10 epoch 면 ${fmtT(c.num*EPOCH*10)} vs ${fmtT(c.bp*EPOCH*10)}`);window.__s3=[c.num*EPOCH,c.bp*EPOCH];}},
 {n:&#x27;④ ∝ P² — 1-3 외삽&#x27;,ex:&#x27;&lt;p&gt;수치 미분은 (1) 손실 계산 횟수 2P 가 P 에 비례하고, (2) 순전파 한 번의 비용(행렬 곱)도 P 에 비례 → 전체 &lt;b class=&quot;red&quot;&gt;∝ P²&lt;/b&gt;. P 가 10배면 시간은 100배.&lt;/p&gt;&lt;p&gt;이상적 모델(손실 1회 ∝ P)에서 784-1-10 → 784-100-10 은 P 가 98.8배, 시간은 약 &lt;b class=&quot;amber&quot;&gt;9,755배&lt;/b&gt;. 실제 측정에서는 작은 망일수록 고정 오버헤드가 커서 이보다 덜 늘어납니다. 역전파는 순전파의 2~3배 비용 → &lt;b class=&quot;green&quot;&gt;∝ P&lt;/b&gt;.&lt;/p&gt;&#x27;,

];
initPresets(P,stopRace);

&lt;body&gt;
&lt;div class=&quot;app&quot;&gt;
  &lt;h1&gt;계산 그래프 (computational graph) — 사과 · 귤 쇼핑&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;노드 = 연산, 엣지 = 값. &lt;b&gt;순방향&lt;/b&gt;(왼쪽 → 오른쪽)으로 흰 숫자를 계산하고, &lt;b style=&quot;color:var(--red)&quot;&gt;역방향&lt;/b&gt;(오른쪽 → 왼쪽)으로 빨간 숫자 = &quot;최종 금액에 대한 기울기&quot; 를 전달합니다. 각 노드는 자기 입력만 보고 &lt;b&gt;국소 계산&lt;/b&gt;만 합니다. 아래 칸에서 가격 · 개수 · 소비세를 바꿔 보세요.&lt;/p&gt;
  &lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill teal&quot;&gt;(100×2 + 150×3) × 1.1 = 715&lt;/span&gt;&lt;span class=&quot;pill red&quot;&gt;역방향 dout = 1 에서 시작&lt;/span&gt;&lt;span class=&quot;pill amber&quot;&gt;곱셈 노드: 상대편 입력을 곱한다&lt;/span&gt;&lt;span class=&quot;pill blue&quot;&gt;덧셈 노드: 그대로 흘린다&lt;/span&gt;&lt;span class=&quot;pill green&quot;&gt;d사과가격 = 2.2&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2 id=&quot;stageTitle&quot;&gt;계산 그래프&lt;/h2&gt;
      &lt;svg id=&quot;g&quot; viewBox=&quot;0 0 600 330&quot; role=&quot;img&quot; aria-label=&quot;사과 귤 쇼핑 계산 그래프&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:#dbe4f0&quot;&gt;&lt;/i&gt;순방향 값&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#f87171&quot;&gt;&lt;/i&gt;역방향 기울기 ∂(총액)/∂(값)&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;inp&quot; id=&quot;inp&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;row&quot; style=&quot;margin-top:10px&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;run&quot; id=&quot;bF&quot;&gt;순방향 ▶&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;run&quot; id=&quot;bB&quot;&gt;역방향 ◀&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;bN&quot;&gt;수치 미분 확인&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;bR&quot;&gt;기본값&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;현재 값&lt;/h2&gt;&lt;div class=&quot;kv&quot; id=&quot;kv&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;Python (노트북 2-1 ~ 2-3)&lt;/h2&gt;&lt;div class=&quot;code&quot; id=&quot;code&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;상태&lt;/h2&gt;&lt;div class=&quot;status info&quot; id=&quot;status&quot;&gt;프리셋을 누르세요.&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel explain&quot; id=&quot;explain&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,ms));
let busy=false;
function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}
function setCode(h){$(&#x27;#code&#x27;).innerHTML=h;}
function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const g=c.getContext(&#x27;2d&#x27;);g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}
function show(id,title){$$(&#x27;.view&#x27;).forEach(v=&gt;v.classList.toggle(&#x27;on&#x27;,v.id===id));if(title&amp;&amp;$(&#x27;#stageTitle&#x27;))$(&#x27;#stageTitle&#x27;).textContent=title;}
function initPresets(P,stop){$(&#x27;#presets&#x27;).innerHTML=P.map(p=&gt;`&lt;button type=&quot;button&quot;&gt;${p.n}&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}
const sigm=z=&gt;1/(1+Math.exp(-z));
const fe=(v,d=4)=&gt;{if(Number.isNaN(v))return &#x27;nan&#x27;;if(!isFinite(v))return v&gt;0?&#x27;inf&#x27;:&#x27;-inf&#x27;;const a=Math.abs(v);return a!==0&amp;&amp;(a&gt;=1e5||a&lt;1e-3)?v.toExponential(2):v.toFixed(d);};

const DEF={ap:100,ac:2,mp:150,mc:3,tax:1.1};
let V={...DEF},mode=&#x27;both&#x27;,stage=99;   // stage: 0 입력만, 1~3 순방향, 4~7 역방향 (apple: 1~2, 3~5)
const LBL={ap:&#x27;사과 가격&#x27;,ac:&#x27;사과 개수&#x27;,mp:&#x27;귤 가격&#x27;,mc:&#x27;귤 개수&#x27;,tax:&#x27;소비세&#x27;};
const fm=v=&gt;{const r=+(+v).toFixed(4);return r.toLocaleString(&#x27;en-US&#x27;,{maximumFractionDigits:4});};
function total(v,m=mode){const aS=v.ap*v.ac,mS=m===&#x27;both&#x27;?v.mp*v.mc:0;return (aS+mS)*v.tax;}
function calc(v=V,m=mode){
  const aS=v.ap*v.ac,mS=m===&#x27;both&#x27;?v.mp*v.mc:0,tot=aS+mS,out=tot*v.tax;
  const dtot=1*v.tax,dtax=1*tot,daS=dtot,dmS=dtot;    // 곱셈: 바꿔 곱하기, 덧셈: 그대로
  return {aS,mS,tot,out,d:{out:1,tot:dtot,tax:dtax,aS:daS,mS:dmS,ap:daS*v.ac,ac:daS*v.ap,mp:dmS*v.mc,mc:dmS*v.mp}};
}
function numGrad(k,h=1e-4){const a={...V},b={...V};a[k]+=h;b[k]-=h;return (total(a)-total(b))/(2*h);}
window.__calc=()=&gt;calc();
// 레이아웃
const LAY={
 both:{nodes:{mA:[205,78,&#x27;×&#x27;],mM:[205,242,&#x27;×&#x27;],add:[340,160,&#x27;+&#x27;],mT:[470,200,&#x27;×&#x27;]},
  ins:{ap:[8,40],ac:[8,116],mp:[8,204],mc:[8,280]},taxIn:[470,302],
  edges:[[&#x27;ap&#x27;,[96,52],[183,70],0,7],[&#x27;ac&#x27;,[96,128],[183,88],0,7],[&#x27;mp&#x27;,[96,216],[183,234],0,7],[&#x27;mc&#x27;,[96,292],[183,252],0,7],
   [&#x27;aS&#x27;,[227,90],[318,150],1,6],[&#x27;mS&#x27;,[227,230],[318,170],1,6],[&#x27;tot&#x27;,[362,166],[448,194],2,5],[&#x27;tax&#x27;,[470,288],[470,224],0,5],[&#x27;out&#x27;,[494,200],[592,200],3,4]]},
 apple:{nodes:{mA:[230,110,&#x27;×&#x27;],mT:[430,160,&#x27;×&#x27;]},
  ins:{ap:[8,62],ac:[8,150]},taxIn:[430,302],
  edges:[[&#x27;ap&#x27;,[96,74],[208,102],0,5],[&#x27;ac&#x27;,[96,162],[208,120],0,5],[&#x27;aS&#x27;,[252,116],[408,154],1,4],[&#x27;tax&#x27;,[430,288],[430,184],0,4],[&#x27;out&#x27;,[454,160],[592,160],2,3]]}};
function svg(){
  const L=LAY[mode],c=calc();const fwd={...V,aS:c.aS,mS:c.mS,tot:c.tot,out:c.out};let s=&#x27;&#x27;;
  const fS=mode===&#x27;both&#x27;?4:3;   // 역방향이 시작되는 stage
  s+=`&lt;defs&gt;&lt;marker id=&quot;ar&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto-start-reverse&quot;&gt;&lt;path d=&quot;M0,0L10,5L0,10z&quot; fill=&quot;#3f5070&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;`;
  L.edges.forEach(([k,a,b,fs,bs])=&gt;{const lit=stage&gt;=fs;s+=`&lt;line x1=&quot;${a[0]}&quot; y1=&quot;${a[1]}&quot; x2=&quot;${b[0]}&quot; y2=&quot;${b[1]}&quot; stroke=&quot;${stage&gt;=bs?&#x27;#f87171&#x27;:lit?&#x27;#8a9bb8&#x27;:&#x27;#2a3a5c&#x27;}&quot; stroke-opacity=&quot;${stage&gt;=bs?0.65:1}&quot; stroke-width=&quot;${stage&gt;=bs?2.4:1.6}&quot; marker-end=&quot;url(#ar)&quot;/&gt;`;
    const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,dx=b[0]-a[0],dy=b[1]-a[1],ln=Math.hypot(dx,dy);let nx=-dy/ln,ny=dx/ln;if(ny&gt;0||(ny===0&amp;&amp;nx&gt;0)){nx=-nx;ny=-ny;}
    const isIn=k in L.ins;
    if(!isIn&amp;&amp;k!==&#x27;tax&#x27;){if(lit)s+=`&lt;text x=&quot;${mx+nx*13}&quot; y=&quot;${my+ny*13+4}&quot; fill=&quot;#dbe4f0&quot; font-size=&quot;15&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;${fm(fwd[k])}&lt;/text&gt;`;}
    if(stage&gt;=bs&amp;&amp;!isIn&amp;&amp;k!==&#x27;tax&#x27;)s+=`&lt;text x=&quot;${mx-nx*15}&quot; y=&quot;${my-ny*15+5}&quot; fill=&quot;#f87171&quot; font-size=&quot;15&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;${fm(c.d[k])}&lt;/text&gt;`;});
  Object.entries(L.ins).forEach(([k,[x,y]])=&gt;{s+=`&lt;rect x=&quot;${x}&quot; y=&quot;${y}&quot; width=&quot;88&quot; height=&quot;24&quot; rx=&quot;5&quot; fill=&quot;#111a2e&quot; stroke=&quot;#2a3a5c&quot;/&gt;&lt;text x=&quot;${x+6}&quot; y=&quot;${y+16}&quot; fill=&quot;#8a9bb8&quot; font-size=&quot;11.5&quot;&gt;${LBL[k]}&lt;/text&gt;&lt;text x=&quot;${x+84}&quot; y=&quot;${y+16}&quot; fill=&quot;#f5b942&quot; font-size=&quot;13&quot; text-anchor=&quot;end&quot;&gt;${fm(V[k])}&lt;/text&gt;`;
    if(stage&gt;=(mode===&#x27;both&#x27;?7:5))s+=`&lt;text x=&quot;${x+44}&quot; y=&quot;${y+40}&quot; fill=&quot;#f87171&quot; font-size=&quot;15&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;${fm(c.d[k])}&lt;/text&gt;`;});
  const [tx,ty]=L.taxIn;s+=`&lt;rect x=&quot;${tx-44}&quot; y=&quot;${ty-12}&quot; width=&quot;88&quot; height=&quot;24&quot; rx=&quot;5&quot; fill=&quot;#111a2e&quot; stroke=&quot;#2a3a5c&quot;/&gt;&lt;text x=&quot;${tx-38}&quot; y=&quot;${ty+4}&quot; fill=&quot;#8a9bb8&quot; font-size=&quot;11.5&quot;&gt;소비세&lt;/text&gt;&lt;text x=&quot;${tx+40}&quot; y=&quot;${ty+4}&quot; fill=&quot;#f5b942&quot; font-size=&quot;13&quot; text-anchor=&quot;end&quot;&gt;${fm(V.tax)}&lt;/text&gt;`;
  if(stage&gt;=fS+1)s+=`&lt;text x=&quot;${tx+10}&quot; y=&quot;${ty-38}&quot; fill=&quot;#f87171&quot; font-size=&quot;15&quot; font-weight=&quot;600&quot;&gt;${fm(c.d.tax)}&lt;/text&gt;`;
  Object.entries(L.nodes).forEach(([k,[x,y,op]])=&gt;{const on=(k===&#x27;mA&#x27;||k===&#x27;mM&#x27;)?stage&gt;=1:k===&#x27;add&#x27;?stage&gt;=2:stage&gt;=(mode===&#x27;both&#x27;?3:2);
    s+=`&lt;circle cx=&quot;${x}&quot; cy=&quot;${y}&quot; r=&quot;22&quot; fill=&quot;#0e1628&quot; stroke=&quot;${on?&#x27;#f5b942&#x27;:&#x27;#3f5070&#x27;}&quot; stroke-width=&quot;2.2&quot;/&gt;&lt;text x=&quot;${x}&quot; y=&quot;${y+7}&quot; fill=&quot;${on?&#x27;#f5b942&#x27;:&#x27;#8a9bb8&#x27;}&quot; font-size=&quot;21&quot; text-anchor=&quot;middle&quot;&gt;${op}&lt;/text&gt;`;});
  const oy=mode===&#x27;both&#x27;?200:160;s+=`&lt;text x=&quot;596&quot; y=&quot;${oy-28}&quot; fill=&quot;#2dd4bf&quot; font-size=&quot;12&quot; text-anchor=&quot;end&quot;&gt;총액&lt;/text&gt;`;
  if(stage&gt;=fS)s+=`&lt;text x=&quot;596&quot; y=&quot;${oy+30}&quot; fill=&quot;#f87171&quot; font-size=&quot;12&quot; text-anchor=&quot;end&quot;&gt;dout&lt;/text&gt;`;
  $(&#x27;#g&#x27;).innerHTML=s;
}
function inputs(){$(&#x27;#inp&#x27;).innerHTML=Object.keys(LBL).map(k=&gt;`&lt;label&gt;${LBL[k]}&lt;input type=&quot;number&quot; step=&quot;any&quot; id=&quot;i_${k}&quot; value=&quot;${V[k]}&quot; ${mode===&#x27;apple&#x27;&amp;&amp;(k===&#x27;mp&#x27;||k===&#x27;mc&#x27;)?&#x27;disabled&#x27;:&#x27;&#x27;}&gt;&lt;/label&gt;`).join(&#x27;&#x27;);
  Object.keys(LBL).forEach(k=&gt;$(&#x27;#i_&#x27;+k).oninput=e=&gt;{if(busy)return;const v=parseFloat(e.target.value);if(!isFinite(v))return;V[k]=v;stage=99;draw();
    const c=calc();setStatus(&#x27;info&#x27;,`${LBL[k]} = ${fm(v)} → 총액 ${fm(c.out)}, d${LBL[k].replace(&#x27; &#x27;,&#x27;&#x27;)} = ${fm(c.d[k])}`);});}
function info(){
  const c=calc(),b=mode===&#x27;both&#x27;;const F=stage&gt;=1,Bk=stage&gt;=(b?4:3);
  $(&#x27;#kv&#x27;).innerHTML=`&lt;span&gt;사과 합&lt;/span&gt;&lt;b&gt;${F?fm(c.aS):&#x27;?&#x27;}&lt;/b&gt;${b?`&lt;span&gt;귤 합&lt;/span&gt;&lt;b&gt;${F?fm(c.mS):&#x27;?&#x27;}&lt;/b&gt;&lt;span&gt;합계&lt;/span&gt;&lt;b&gt;${stage&gt;=2?fm(c.tot):&#x27;?&#x27;}&lt;/b&gt;`:&#x27;&#x27;}&lt;span&gt;총액&lt;/span&gt;&lt;b style=&quot;color:var(--teal)&quot;&gt;${stage&gt;=(b?3:2)?fm(c.out):&#x27;?&#x27;}&lt;/b&gt;`+
   `&lt;span&gt;d소비세&lt;/span&gt;&lt;b style=&quot;color:var(--red)&quot;&gt;${Bk?fm(c.d.tax):&#x27;?&#x27;}&lt;/b&gt;&lt;span&gt;d사과가격&lt;/span&gt;&lt;b style=&quot;color:var(--red)&quot;&gt;${stage&gt;=(b?7:5)?fm(c.d.ap):&#x27;?&#x27;}&lt;/b&gt;&lt;span&gt;d사과개수&lt;/span&gt;&lt;b style=&quot;color:var(--red)&quot;&gt;${stage&gt;=(b?7:5)?fm(c.d.ac):&#x27;?&#x27;}&lt;/b&gt;`+
   (b?`&lt;span&gt;d귤가격&lt;/span&gt;&lt;b style=&quot;color:var(--red)&quot;&gt;${stage&gt;=7?fm(c.d.mp):&#x27;?&#x27;}&lt;/b&gt;&lt;span&gt;d귤개수&lt;/span&gt;&lt;b style=&quot;color:var(--red)&quot;&gt;${stage&gt;=7?fm(c.d.mc):&#x27;?&#x27;}&lt;/b&gt;`:&#x27;&#x27;);
  setCode(b?`apple, apple_num = ${fm(V.ap)}, ${fm(V.ac)}\norange, orange_num = ${fm(V.mp)}, ${fm(V.mc)}\ntax = ${fm(V.tax)}\n&lt;span class=&quot;c&quot;&gt;# 2-1 순방향&lt;/span&gt;\napple_price  = apple * apple_num       &lt;span class=&quot;c&quot;&gt;# ${fm(c.aS)}&lt;/span&gt;\norange_price = orange * orange_num     &lt;span class=&quot;c&quot;&gt;# ${fm(c.mS)}&lt;/span&gt;\nall_price = apple_price + orange_price &lt;span class=&quot;c&quot;&gt;# ${fm(c.tot)}&lt;/span&gt;\nprice = all_price * tax                &lt;span class=&quot;c&quot;&gt;# ${fm(c.out)}&lt;/span&gt;\n&lt;span class=&quot;c&quot;&gt;# 2-2 역방향 (dout = 1)&lt;/span&gt;\n&lt;span class=&quot;a&quot;&gt;dall_price, dtax = 1 * tax, 1 * all_price   # ${fm(c.d.tot)}, ${fm(c.d.tax)}\ndapple_price = dorange_price = dall_price   # 덧셈: 그대로\ndapple, dapple_num = dapple_price * apple_num, dapple_price * apple\ndorange, dorange_num = dorange_price * orange_num, dorange_price * orange&lt;/span&gt;\n&lt;span class=&quot;g&quot;&gt;# ${fm(c.d.ap)} ${fm(c.d.ac)} ${fm(c.d.mp)} ${fm(c.d.mc)} ${fm(c.d.tax)}&lt;/span&gt;`
   :`apple, apple_num, tax = ${fm(V.ap)}, ${fm(V.ac)}, ${fm(V.tax)}\napple_price = apple * apple_num   &lt;span class=&quot;c&quot;&gt;# ${fm(c.aS)}&lt;/span&gt;\nprice = apple_price * tax         &lt;span class=&quot;c&quot;&gt;# ${fm(c.out)}&lt;/span&gt;\n&lt;span class=&quot;a&quot;&gt;dapple_price, dtax = 1 * tax, 1 * apple_price\ndapple, dapple_num = dapple_price * apple_num, dapple_price * apple&lt;/span&gt;\n&lt;span class=&quot;g&quot;&gt;# dapple = ${fm(c.d.ap)}, dapple_num = ${fm(c.d.ac)}, dtax = ${fm(c.d.tax)}&lt;/span&gt;`);
}
function draw(){svg();info();}
function numCheck(){const ks=mode===&#x27;both&#x27;?[&#x27;ap&#x27;,&#x27;ac&#x27;,&#x27;mp&#x27;,&#x27;mc&#x27;,&#x27;tax&#x27;]:[&#x27;ap&#x27;,&#x27;ac&#x27;,&#x27;tax&#x27;];const c=calc();let mx=0;
  const rows=ks.map(k=&gt;{const n=numGrad(k);mx=Math.max(mx,Math.abs(n-c.d[k]));return `${LBL[k].padEnd(5,&#x27;　&#x27;)}  역전파 ${fm(c.d[k]).padStart(8)}   수치 ${n.toFixed(6).padStart(12)}`;});
  setCode(`def price_fn(apple, apple_num, orange, orange_num, tax):   &lt;span class=&quot;c&quot;&gt;# 2-3&lt;/span&gt;\n    return (apple * apple_num + orange * orange_num) * tax\n\n&lt;span class=&quot;c&quot;&gt;# 중앙 차분 h = 1e-4, 입력 하나씩&lt;/span&gt;\n${rows.join(&#x27;\n&#x27;)}\n&lt;span class=&quot;g&quot;&gt;# 최대 차이 ${mx.toExponential(1)} → 역전파 값이 맞습니다&lt;/span&gt;`);
  return mx;}
async function fwd(ms){stage=0;draw();setStatus(&#x27;info&#x27;,&#x27;입력 값만 있는 상태&#x27;);await sleep(ms);const c=calc();
  const msgs=mode===&#x27;both&#x27;?[`곱셈 노드: 사과 ${fm(V.ap)}×${fm(V.ac)} = ${fm(c.aS)}, 귤 ${fm(V.mp)}×${fm(V.mc)} = ${fm(c.mS)}`,`덧셈 노드: ${fm(c.aS)} + ${fm(c.mS)} = ${fm(c.tot)}`,`곱셈 노드: ${fm(c.tot)} × ${fm(V.tax)} = ${fm(c.out)}`]
   :[`곱셈 노드: 사과 ${fm(V.ap)}×${fm(V.ac)} = ${fm(c.aS)}`,`곱셈 노드: ${fm(c.aS)} × ${fm(V.tax)} = ${fm(c.out)}`];

async function bwd(ms){const c=calc(),b=mode===&#x27;both&#x27;;stage=b?3:2;draw();

 {n:&#x27;④ 계층으로 사과 그래프 (3-3)&#x27;,ex:&#x27;&lt;p&gt;MulLayer 두 개로 D3-2 의 &quot;사과만&quot; 그래프를 조립합니다. 역방향은 &lt;b class=&quot;amber&quot;&gt;순방향의 역순&lt;/b&gt;으로 호출: 먼저 소비세 계층 backward(1) → (1.1, 200), 그다음 사과 계층 backward(1.1) → (&lt;b class=&quot;red&quot;&gt;2.2&lt;/b&gt;, &lt;b class=&quot;red&quot;&gt;110&lt;/b&gt;).&lt;/p&gt;&lt;p&gt;이 &quot;계층 = forward/backward 를 가진 클래스, 역순으로 backward 호출&quot; 패턴이 오늘 6교시 &lt;code&gt;TwoLayerNet&lt;/code&gt; 의 뼈대입니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{setNode(&#x27;mul&#x27;,200,1.1,1,0);await nodeRun(700,[&#x27;mul_tax_layer: x = 사과합 200, y = 소비세 1.1&#x27;,&#x27;forward → 220&#x27;,&#x27;dout = 1 (최종 출력)&#x27;,&#x27;backward(1) → dapple_price = 1.1, dtax = 200&#x27;]);await sleep(700);
   setNode(&#x27;mul&#x27;,100,2,1.1,0);await nodeRun(700,[&#x27;mul_apple_layer: x = 사과 100, y = 개수 2&#x27;,&#x27;forward → 200&#x27;,&#x27;dout = 1.1 (소비세 계층에서 내려옴)&#x27;,&#x27;backward(1.1) → dapple = 2.2, dapple_num = 110&#x27;]);
   setCode(`apple, apple_num, tax = 100, 2, 1.1      &lt;span class=&quot;c&quot;&gt;# 3-3&lt;/span&gt;\nmul_apple_layer = MulLayer()\nmul_tax_layer = MulLayer()\n\napple_price = mul_apple_layer.forward(apple, apple_num)  &lt;span class=&quot;c&quot;&gt;# 200&lt;/span&gt;\nprice = mul_tax_layer.forward(apple_price, tax)         &lt;span class=&quot;c&quot;&gt;# 220&lt;/span&gt;\n\n&lt;span class=&quot;a&quot;&gt;dprice = 1                                               # 역순으로 backward\ndapple_price, dtax = mul_tax_layer.backward(dprice)     # 1.1, 200\ndapple, dapple_num = mul_apple_layer.backward(dapple_price)&lt;/span&gt;\n&lt;span class=&quot;g&quot;&gt;# 2.2 110 200&lt;/span&gt;`);
   setStatus(&#x27;ok&#x27;,&#x27;price 220, dapple 2.2, dapple_num 110, dtax 200 — D3-2 사과 그래프와 같습니다&#x27;);window.__apple=[2.2,110,200];}},
];
initPresets(P);

&lt;body&gt;
&lt;div class=&quot;app&quot;&gt;
  &lt;h1&gt;활성화 계층 — ReLU · Sigmoid&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;계층은 forward 때 backward 에 필요한 값을 &lt;b style=&quot;color:var(--amber)&quot;&gt;저장&lt;/b&gt;합니다. &lt;code&gt;Relu&lt;/code&gt; 는 &lt;code&gt;mask = (X &amp;lt;= 0)&lt;/code&gt; 를 저장해 역방향에서 그 자리를 0 으로 막고, &lt;code&gt;Sigmoid&lt;/code&gt; 는 출력 &lt;code&gt;out&lt;/code&gt; 을 저장해 &lt;code&gt;dout * out * (1 − out)&lt;/code&gt; 을 돌려줍니다 (Day 2 &lt;code&gt;sigmoid_grad&lt;/code&gt;). Sigmoid 는 작은 노드 4개(×−1, exp, +1, /)로 쪼개 역방향을 따라가 봅니다.&lt;/p&gt;
  &lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill red&quot;&gt;Relu: mask = (X &amp;lt;= 0)&lt;/span&gt;&lt;span class=&quot;pill amber&quot;&gt;dX = dout, dX[mask] = 0&lt;/span&gt;&lt;span class=&quot;pill purple&quot;&gt;Sigmoid: dX = dout·y(1 − y)&lt;/span&gt;&lt;span class=&quot;pill green&quot;&gt;x = 1.0 → 0.1966 · x = −2.0 → 0.1050&lt;/span&gt;&lt;span class=&quot;pill teal&quot;&gt;sigmoid′(0) = 0.25&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;grid&quot;&gt;
    &lt;div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;Relu 계층 — X 와 dout 은 직접 고칠 수 있습니다&lt;/h2&gt;
        &lt;div class=&quot;mats&quot; id=&quot;mats&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;row&quot; style=&quot;margin-top:8px&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;run&quot; id=&quot;bRelu&quot;&gt;forward → backward&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;bRR&quot;&gt;예제 값&lt;/button&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;Sigmoid 계산 그래프 — y = 1 / (1 + exp(−x))&lt;/h2&gt;
        &lt;svg id=&quot;sg&quot; viewBox=&quot;0 0 640 200&quot; role=&quot;img&quot; aria-label=&quot;sigmoid 를 네 노드로 쪼갠 계산 그래프&quot;&gt;&lt;/svg&gt;
        &lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;sx&quot;&gt;x&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sx&quot; min=&quot;-6&quot; max=&quot;6&quot; step=&quot;0.1&quot; value=&quot;1&quot;&gt;&lt;output id=&quot;ox&quot;&gt;1.0&lt;/output&gt;&lt;/div&gt;
        &lt;canvas id=&quot;plot&quot;&gt;&lt;/canvas&gt;
        &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:#c084fc&quot;&gt;&lt;/i&gt;y = sigmoid(x)&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#4ade80&quot;&gt;&lt;/i&gt;y(1 − y)&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#f5b942&quot;&gt;&lt;/i&gt;현재 x&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;row&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;run&quot; id=&quot;bSig&quot;&gt;역방향 한 노드씩&lt;/button&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;현재 값&lt;/h2&gt;&lt;div class=&quot;kv&quot; id=&quot;kv&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;Python (노트북 4-1 ~ 4-3)&lt;/h2&gt;&lt;div class=&quot;code&quot; id=&quot;code&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;상태&lt;/h2&gt;&lt;div class=&quot;status info&quot; id=&quot;status&quot;&gt;프리셋을 누르세요.&lt;/div&gt;&lt;/div&gt;

&lt;script&gt;
const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,ms));
let busy=false;
function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}
function setCode(h){$(&#x27;#code&#x27;).innerHTML=h;}
function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const g=c.getContext(&#x27;2d&#x27;);g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}
function show(id,title){$$(&#x27;.view&#x27;).forEach(v=&gt;v.classList.toggle(&#x27;on&#x27;,v.id===id));if(title&amp;&amp;$(&#x27;#stageTitle&#x27;))$(&#x27;#stageTitle&#x27;).textContent=title;}
function initPresets(P,stop){$(&#x27;#presets&#x27;).innerHTML=P.map(p=&gt;`&lt;button type=&quot;button&quot;&gt;${p.n}&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}
const sigm=z=&gt;1/(1+Math.exp(-z));
const fe=(v,d=4)=&gt;{if(Number.isNaN(v))return &#x27;nan&#x27;;if(!isFinite(v))return v&gt;0?&#x27;inf&#x27;:&#x27;-inf&#x27;;const a=Math.abs(v);return a!==0&amp;&amp;(a&gt;=1e5||a&lt;1e-3)?v.toExponential(2):v.toFixed(d);};

const f4=v=&gt;(Object.is(v,-0)?0:v).toFixed(4), fm=v=&gt;(+(+v).toFixed(4)).toString();
// ---------- Relu ----------
let RX=[[1.0,-0.5],[-2.0,3.0]],RD=[[1,1],[1,1]],rs=4;   // rs: 0 X, 1 mask, 2 out, 3 dout, 4 dX
const relu=()=&gt;{const mask=RX.map(r=&gt;r.map(v=&gt;v&lt;=0));const out=RX.map((r,i)=&gt;r.map((v,j)=&gt;mask[i][j]?0:v));const dX=RD.map((r,i)=&gt;r.map((v,j)=&gt;mask[i][j]?0:v));return {mask,out,dX};};
window.__relu=relu;
function mats(){
  const {mask,out,dX}=relu();const box=(k,t,body)=&gt;`&lt;div class=&quot;mat ${rs&gt;=k?&#x27;on&#x27;:&#x27;&#x27;} ${rs===k?&#x27;cur&#x27;:&#x27;&#x27;}&quot;&gt;&lt;h3&gt;${t}&lt;/h3&gt;&lt;div class=&quot;c&quot;&gt;${body}&lt;/div&gt;&lt;/div&gt;`;
  const cells=(M,f)=&gt;M.flat().map((v,n)=&gt;f(v,n)).join(&#x27;&#x27;);
  $(&#x27;#mats&#x27;).innerHTML=box(0,&#x27;X&#x27;,cells(RX,(v,n)=&gt;`&lt;input type=&quot;number&quot; step=&quot;any&quot; data-r=&quot;x&quot; data-n=&quot;${n}&quot; value=&quot;${v}&quot; aria-label=&quot;X ${n}&quot;&gt;`))+
   box(1,&#x27;mask X&amp;lt;=0&#x27;,cells(mask,v=&gt;`&lt;span class=&quot;${v?&#x27;T&#x27;:&#x27;F&#x27;}&quot;&gt;${v?&#x27;True&#x27;:&#x27;False&#x27;}&lt;/span&gt;`))+
   box(2,&#x27;out&#x27;,cells(out,(v,n)=&gt;`&lt;span class=&quot;${mask.flat()[n]?&#x27;z&#x27;:&#x27;p&#x27;}&quot;&gt;${fm(v)}&lt;/span&gt;`))+
   box(3,&#x27;dout&#x27;,cells(RD,(v,n)=&gt;`&lt;input type=&quot;number&quot; step=&quot;any&quot; data-r=&quot;d&quot; data-n=&quot;${n}&quot; value=&quot;${v}&quot; aria-label=&quot;dout ${n}&quot; style=&quot;color:var(--red)&quot;&gt;`))+
   box(4,&#x27;dX&#x27;,cells(dX,(v,n)=&gt;`&lt;span class=&quot;${mask.flat()[n]?&#x27;z&#x27;:&#x27;p&#x27;}&quot; style=&quot;${mask.flat()[n]?&#x27;&#x27;:&#x27;color:var(--red)&#x27;}&quot;&gt;${fm(v)}&lt;/span&gt;`));
  $$(&#x27;#mats input&#x27;).forEach(e=&gt;e.oninput=()=&gt;{if(busy)return;const v=parseFloat(e.value);if(!isFinite(v))return;const n=+e.dataset.n,M=e.dataset.r===&#x27;x&#x27;?RX:RD;M[n&gt;&gt;1][n&amp;1]=v;rs=4;
    const r=relu();$$(&#x27;#mats .mat&#x27;).forEach(m=&gt;m.classList.add(&#x27;on&#x27;));refreshRelu();info();setStatus(&#x27;info&#x27;,`mask = ${JSON.stringify(r.mask.map(a=&gt;a.map(b=&gt;b?&#x27;T&#x27;:&#x27;F&#x27;)))} → dX = ${JSON.stringify(r.dX.map(a=&gt;a.map(fm)))}`.replace(/&quot;/g,&#x27;&#x27;));});
}
function refreshRelu(){const {mask,out,dX}=relu();const sp=$$(&#x27;#mats .mat&#x27;);
  sp[1].querySelector(&#x27;.c&#x27;).innerHTML=mask.flat().map(v=&gt;`&lt;span class=&quot;${v?&#x27;T&#x27;:&#x27;F&#x27;}&quot;&gt;${v?&#x27;True&#x27;:&#x27;False&#x27;}&lt;/span&gt;`).join(&#x27;&#x27;);
  sp[2].querySelector(&#x27;.c&#x27;).innerHTML=out.flat().map((v,n)=&gt;`&lt;span class=&quot;${mask.flat()[n]?&#x27;z&#x27;:&#x27;p&#x27;}&quot;&gt;${fm(v)}&lt;/span&gt;`).join(&#x27;&#x27;);
  sp[4].querySelector(&#x27;.c&#x27;).innerHTML=dX.flat().map((v,n)=&gt;`&lt;span class=&quot;${mask.flat()[n]?&#x27;z&#x27;:&#x27;p&#x27;}&quot; style=&quot;${mask.flat()[n]?&#x27;&#x27;:&#x27;color:var(--red)&#x27;}&quot;&gt;${fm(v)}&lt;/span&gt;`).join(&#x27;&#x27;);}
// ---------- Sigmoid ----------
let SX=1.0,ss=9;   // ss: 0~4 순방향, 5 dout, 6 /, 7 +1, 8 exp, 9 ×−1
function sig(x=SX,dout=1){const a=-x,b=Math.exp(a),c=1+b,y=1/c;const dc=dout*(-1/(c*c)),db=dc*1,da=db*b,dx=da*(-1);return {a,b,c,y,dout,dc,db,da,dx,ref:dout*y*(1-y)};}
window.__sig=sig;
function sgSvg(){
  const s=sig();let h=`&lt;defs&gt;&lt;marker id=&quot;m&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0L10,5L0,10z&quot; fill=&quot;#3f5070&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;`;
  const NX=[150,270,390,510],OPS=[&#x27;×−1&#x27;,&#x27;exp&#x27;,&#x27;+1&#x27;,&#x27;/&#x27;],LOC=[&#x27;×(−1)&#x27;,&#x27;×exp(a)&#x27;,&#x27;×1&#x27;,&#x27;×(−y²)&#x27;];
  const E=[[14,128,&#x27;x&#x27;,SX,s.dx,0,9],[172,248,&#x27;a&#x27;,s.a,s.da,1,8],[292,368,&#x27;b&#x27;,s.b,s.db,2,7],[412,488,&#x27;c&#x27;,s.c,s.dc,3,6],[532,632,&#x27;y&#x27;,s.y,s.dout,4,5]];
  E.forEach(([x1,x2,n,v,d,f,b])=&gt;{h+=`&lt;line x1=&quot;${x1}&quot; y1=&quot;95&quot; x2=&quot;${x2}&quot; y2=&quot;95&quot; stroke=&quot;${ss&gt;=b?&#x27;#f87171&#x27;:ss&gt;=f?&#x27;#8a9bb8&#x27;:&#x27;#2a3a5c&#x27;}&quot; stroke-width=&quot;${ss&gt;=b?2.4:1.6}&quot; marker-end=&quot;url(#m)&quot;/&gt;`;
    const mx=(x1+x2)/2;if(ss&gt;=f)h+=`&lt;text x=&quot;${mx}&quot; y=&quot;64&quot; fill=&quot;#8a9bb8&quot; font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;${n}&lt;/text&gt;&lt;text x=&quot;${mx}&quot; y=&quot;84&quot; fill=&quot;#dbe4f0&quot; font-size=&quot;15&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;${f4(v)}&lt;/text&gt;`;
    if(ss&gt;=b)h+=`&lt;text x=&quot;${mx}&quot; y=&quot;120&quot; fill=&quot;#f87171&quot; font-size=&quot;15&quot; text-anchor=&quot;middle&quot; font-weight=&quot;600&quot;&gt;${f4(d)}&lt;/text&gt;`;});
  NX.forEach((x,i)=&gt;{const on=ss&gt;=i+1;const back=ss&gt;=9-i;h+=`&lt;circle cx=&quot;${x}&quot; cy=&quot;95&quot; r=&quot;22&quot; fill=&quot;#0e1628&quot; stroke=&quot;${back?&#x27;#f87171&#x27;:on?&#x27;#c084fc&#x27;:&#x27;#3f5070&#x27;}&quot; stroke-width=&quot;2.2&quot;/&gt;&lt;text x=&quot;${x}&quot; y=&quot;100&quot; fill=&quot;${on?&#x27;#c084fc&#x27;:&#x27;#8a9bb8&#x27;}&quot; font-size=&quot;${i===1?13:15}&quot; text-anchor=&quot;middle&quot;&gt;${OPS[i]}&lt;/text&gt;`;
    if(back)h+=`&lt;text x=&quot;${x}&quot; y=&quot;150&quot; fill=&quot;#f5b942&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;${LOC[i]}&lt;/text&gt;`;});
  if(ss&gt;=9)h+=`&lt;text x=&quot;320&quot; y=&quot;186&quot; fill=&quot;#4ade80&quot; font-size=&quot;14&quot; text-anchor=&quot;middle&quot;&gt;dx = dout·y²·exp(−x) = dout·y(1 − y) = ${f4(s.ref)}&lt;/text&gt;`;
  $(&#x27;#sg&#x27;).innerHTML=h;$(&#x27;#sx&#x27;).value=SX;$(&#x27;#ox&#x27;).textContent=SX.toFixed(1);
}
function plot(){
  const [g,W,H]=fitCanvas($(&#x27;#plot&#x27;));g.clearRect(0,0,W,H);const X=x=&gt;(x+6)/12*W,Y=v=&gt;H-8-v*(H-16);
  g.strokeStyle=&#x27;#1a2540&#x27;;[0,0.25,0.5,1].forEach(v=&gt;{g.beginPath();g.moveTo(0,Y(v));g.lineTo(W,Y(v));g.stroke();});g.beginPath();g.moveTo(X(0),0);g.lineTo(X(0),H);g.stroke();
  const line=(f,c)=&gt;{g.strokeStyle=c;g.lineWidth=2;g.beginPath();for(let i=0;i&lt;=240;i++){const x=-6+i/20;i?g.lineTo(X(x),Y(f(x))):g.moveTo(X(x),Y(f(x)));}g.stroke();};
  line(x=&gt;sigm(x),&#x27;#c084fc&#x27;);line(x=&gt;sigm(x)*(1-sigm(x)),&#x27;#4ade80&#x27;);
  const s=sig();g.strokeStyle=&#x27;#f5b942&#x27;;g.setLineDash([3,3]);g.beginPath();g.moveTo(X(SX),0);g.lineTo(X(SX),H);g.stroke();g.setLineDash([]);
  [[s.y,&#x27;#c084fc&#x27;],[s.ref,&#x27;#4ade80&#x27;]].forEach(([v,c])=&gt;{g.fillStyle=c;g.beginPath();g.arc(X(SX),Y(v),4.5,0,7);g.fill();});
  g.font=&#x27;11px Consolas,monospace&#x27;;g.fillStyle=&#x27;#5d7292&#x27;;g.fillText(&#x27;0.25&#x27;,4,Y(0.25)-3);g.fillText(&#x27;1&#x27;,4,Y(1)+11);g.fillText(&#x27;-6&#x27;,2,H-2);g.fillText(&#x27;6&#x27;,W-10,H-2);
}
function info(){
  const s=sig(),r=relu(),h=1e-4,num=(sigm(SX+h)-sigm(SX-h))/(2*h);
  const mat=M=&gt;&#x27;[&#x27;+M.map(a=&gt;&#x27;[&#x27;+a.map(fm).join(&#x27;, &#x27;)+&#x27;]&#x27;).join(&#x27;, &#x27;)+&#x27;]&#x27;;
  $(&#x27;#kv&#x27;).innerHTML=`&lt;span&gt;Relu X&lt;/span&gt;&lt;b&gt;${mat(RX)}&lt;/b&gt;&lt;span&gt;out&lt;/span&gt;&lt;b style=&quot;color:var(--green)&quot;&gt;${mat(r.out)}&lt;/b&gt;&lt;span&gt;dX&lt;/span&gt;&lt;b style=&quot;color:var(--red)&quot;&gt;${mat(r.dX)}&lt;/b&gt;&lt;span&gt;Sigmoid x&lt;/span&gt;&lt;b style=&quot;color:var(--amber)&quot;&gt;${SX.toFixed(1)}&lt;/b&gt;&lt;span&gt;y&lt;/span&gt;&lt;b style=&quot;color:var(--purple)&quot;&gt;${f4(s.y)}&lt;/b&gt;&lt;span&gt;그래프 역방향&lt;/span&gt;&lt;b style=&quot;color:var(--red)&quot;&gt;${f4(s.dx)}&lt;/b&gt;&lt;span&gt;y(1 − y)&lt;/span&gt;&lt;b style=&quot;color:var(--green)&quot;&gt;${f4(s.ref)}&lt;/b&gt;&lt;span&gt;수치 미분 (4-3)&lt;/span&gt;&lt;b&gt;${num.toFixed(8)}&lt;/b&gt;`;
  setCode(`class Relu:                             &lt;span class=&quot;c&quot;&gt;# 4-1&lt;/span&gt;\n    def forward(self, X):\n&lt;span class=&quot;a&quot;&gt;        self.mask = (X &amp;lt;= 0)             # 저장&lt;/span&gt;\n        out = X.copy()\n        out[self.mask] = 0\n        return out\n    def backward(self, dout):\n        dX = dout.copy()\n&lt;span class=&quot;a&quot;&gt;        dX[self.mask] = 0&lt;/span&gt;\n        return dX\n&lt;span class=&quot;g&quot;&gt;# X = ${mat(RX)}\n# out = ${mat(r.out)}, dX = ${mat(r.dX)}&lt;/span&gt;\n\nclass Sigmoid:                          &lt;span class=&quot;c&quot;&gt;# 4-2&lt;/span&gt;\n    def forward(self, X):\n&lt;span class=&quot;a&quot;&gt;        self.out = 1 / (1 + np.exp(-X))  # 저장&lt;/span&gt;\n        return self.out\n    def backward(self, dout):\n&lt;span class=&quot;a&quot;&gt;        return dout * self.out * (1 - self.out)&lt;/span&gt;\n&lt;span class=&quot;g&quot;&gt;# x = ${SX.toFixed(1)}: y = ${f4(s.y)}, backward(1) = ${f4(s.ref)}\n# 4-3 수치 미분: ${num.toFixed(8)}&lt;/span&gt;`);
}
function drawAll(){mats();sgSvg();plot();info();}
$(&#x27;#sx&#x27;).oninput=e=&gt;{if(busy)return;SX=+e.target.value;ss=9;sgSvg();plot();info();const s=sig();setStatus(&#x27;info&#x27;,`x = ${SX.toFixed(1)}: y = ${f4(s.y)}, dx = y(1 − y) = ${f4(s.ref)}`);};
async function reluRun(ms){const r=relu();const M=[&#x27;X 입력 (forward)&#x27;,&#x27;mask = (X &amp;lt;= 0) 저장 — True 자리가 &quot;꺼진&quot; 뉴런&#x27;,&#x27;out: mask 자리를 0 으로&#x27;,&#x27;위에서 dout 이 내려옴&#x27;,&#x27;dX: dout 을 복사하고 mask 자리를 0 으로 — forward 때 0 이었던 곳은 기울기도 0&#x27;];
  for(rs=0;rs&lt;=4;rs++){mats();info();setStatus(rs===4?&#x27;ok&#x27;:&#x27;info&#x27;,M[rs]+(rs===4?` → ${JSON.stringify(r.dX.map(a=&gt;a.map(fm)))}`.replace(/&quot;/g,&#x27;&#x27;):&#x27;&#x27;));await sleep(ms);}rs=4;}
async function sigRun(ms){const s=sig();const M=[`x = ${SX.toFixed(1)}`,`×−1 노드: a = ${f4(s.a)}`,`exp 노드: b = exp(a) = ${f4(s.b)}`,`+1 노드: c = 1 + b = ${f4(s.c)}`,`/ 노드: y = 1/c = ${f4(s.y)}`,
  &#x27;dout = 1 이 y 로 내려옴&#x27;,`/ 노드: 국소 미분 −1/c² = −y² → ${f4(s.dc)}`,`+1 노드: 그대로 → ${f4(s.db)}`,`exp 노드: × exp(a) = ×${f4(s.b)} → ${f4(s.da)}`,`×−1 노드: × (−1) → ${f4(s.dx)} = y(1 − y) = ${f4(s.ref)}`];
  for(ss=0;ss&lt;=9;ss++){sgSvg();setStatus(ss===9?&#x27;ok&#x27;:&#x27;info&#x27;,M[ss]);await sleep(ms);}ss=9;info();}
$(&#x27;#bRelu&#x27;).onclick=async()=&gt;{if(busy)return;busy=true;try{await reluRun(800);}finally{busy=false;}};
$(&#x27;#bRR&#x27;).onclick=()=&gt;{if(busy)return;RX=[[1.0,-0.5],[-2.0,3.0]];RD=[[1,1],[1,1]];rs=4;mats();info();setStatus(&#x27;info&#x27;,&#x27;X = [[1.0, −0.5], [−2.0, 3.0]], dout = 1&#x27;);};
$(&#x27;#bSig&#x27;).onclick=async()=&gt;{if(busy)return;busy=true;try{await sigRun(650);}finally{busy=false;}};
window.addEventListener(&#x27;resize&#x27;,plot);
const P=[
 {n:&#x27;① Relu 예제&#x27;,ex:&#x27;&lt;p&gt;X = [[1.0, −0.5], [−2.0, 3.0]] → mask = [[F, &lt;b class=&quot;red&quot;&gt;T&lt;/b&gt;], [&lt;b class=&quot;red&quot;&gt;T&lt;/b&gt;, F]] → out = [[1, 0], [0, 3]]. backward(ones) = &lt;b class=&quot;red&quot;&gt;[[1, 0], [0, 1]]&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;ReLU 의 미분은 x &amp;gt; 0 이면 1, 아니면 0 (Day 2 &lt;code&gt;(x &amp;gt; 0)&lt;/code&gt;). forward 에서 꺼진(0이 된) 뉴런은 역방향에서도 기울기를 막습니다 — 그래서 forward 때 &lt;b class=&quot;amber&quot;&gt;mask 를 저장&lt;/b&gt;해야 합니다. 노트북 &lt;code&gt;4-1&lt;/code&gt;.&lt;/p&gt;&#x27;,
  run:async()=&gt;{RX=[[1.0,-0.5],[-2.0,3.0]];RD=[[1,1],[1,1]];await reluRun(1100);window.__r1=relu();}},
 {n:&#x27;② Relu x = 0 은?&#x27;,ex:&#x27;&lt;p&gt;x = 0 에서 ReLU 는 꺾여 미분이 정의되지 않습니다. 우리는 &lt;code&gt;mask = (x &amp;lt;= 0)&lt;/code&gt; 이므로 &lt;b class=&quot;amber&quot;&gt;기울기 0&lt;/b&gt; 으로 정합니다 (밑바닥 · PyTorch 와 같은 관례). 실제 학습에서 정확히 0 이 나오는 경우는 드물어 결과에 거의 영향이 없습니다.&lt;/p&gt;&lt;p&gt;dout 칸에 다른 값(예: 2, −3)을 넣어 보세요 — 켜진 자리로만 그대로 통과합니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{RX=[[0,2.0],[-1.0,0]];RD=[[2,-3],[0.5,1]];await reluRun(900);window.__r2=relu();}},
 {n:&#x27;③ Sigmoid x = 1.0&#x27;,ex:&#x27;&lt;p&gt;sigmoid 를 ×−1 → exp → +1 → / 네 노드로 쪼개 역방향을 따라가면 국소 미분 (−1/c²)·1·exp(−x)·(−1) 이 곱해져 dx = dout·y²·exp(−x). y = 1/(1 + exp(−x)) 이므로 y·exp(−x) = 1 − y → &lt;b class=&quot;green&quot;&gt;dx = dout·y(1 − y)&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;x = 1.0 → y = 0.7311, y(1 − y) = &lt;b class=&quot;green&quot;&gt;0.1966&lt;/b&gt;. 결론: Sigmoid 계층은 forward 출력 &lt;code&gt;out&lt;/code&gt; 만 저장하면 backward 가 한 줄. 노트북 &lt;code&gt;4-3&lt;/code&gt; 은 이것을 수치 미분으로 확인합니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{SX=1.0;plot();await sigRun(950);window.__s1=sig(1.0);}},
 {n:&#x27;④ Sigmoid x = −2.0&#x27;,ex:&#x27;&lt;p&gt;x = −2.0 → y = 0.1192, y(1 − y) = &lt;b class=&quot;green&quot;&gt;0.1050&lt;/b&gt;. 같은 그래프, 같은 4단계 — 값만 다릅니다.&lt;/p&gt;&lt;p&gt;배열로 넣으면 &lt;code&gt;Sigmoid().forward(np.array([1.0, -2.0]))&lt;/code&gt; → [0.7311, 0.1192], &lt;code&gt;backward(np.ones(2))&lt;/code&gt; → [0.1966, 0.1050] (원소별 계산).&lt;/p&gt;&#x27;,
  run:async()=&gt;{SX=-2.0;plot();await sigRun(750);window.__s2=sig(-2.0);}},
 {n:&#x27;⑤ sigmoid′(0) = 0.25&#x27;,ex:&#x27;&lt;p&gt;y(1 − y) 의 최댓값은 x = 0 에서 &lt;b class=&quot;teal&quot;&gt;0.25&lt;/b&gt;. 슬라이더로 |x| 를 키우면 기울기가 0 에 가까워집니다(포화).&lt;/p&gt;&lt;p&gt;Sigmoid 를 n 층 쌓으면 역방향에서 최대 0.25ⁿ 이 곱해져 기울기가 사라집니다 (Day 2 기울기 소실). 그래서 은닉층은 ReLU — 켜진 자리에서 국소 미분이 1 이라 그대로 통과합니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{for(const x of [3,2,1,0]){SX=x;ss=9;sgSvg();plot();info();setStatus(&#x27;info&#x27;,`x = ${x}: y(1 − y) = ${f4(sig(x).ref)}`);await sleep(700);}setStatus(&#x27;ok&#x27;,&#x27;x = 0: y = 0.5, y(1 − y) = 0.2500 — sigmoid 기울기의 최댓값&#x27;);window.__s0=sig(0).ref;}},
];
initPresets(P);
drawAll();
$(&#x27;#presets button&#x27;).click();

&lt;/style&gt;

&lt;body&gt;
&lt;div class=&quot;app&quot;&gt;
  &lt;h1&gt;Affine 역전파 — shape 를 맞추면 식이 정해진다&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;Affine 계층 &lt;code&gt;Y = X @ W + b&lt;/code&gt;. 위에서 &lt;code&gt;dout&lt;/code&gt; (= ∂L/∂Y, Y 와 같은 shape) 이 내려오면 dX · dW · db 는 각각 &lt;b style=&quot;color:var(--amber)&quot;&gt;X · W · b 와 같은 shape&lt;/b&gt; 이어야 합니다. 후보 식을 눌러 보세요: &lt;b style=&quot;color:var(--red)&quot;&gt;빨강&lt;/b&gt; = shape 오류 · 불일치, &lt;b style=&quot;color:var(--green)&quot;&gt;초록&lt;/b&gt; = 정답, &lt;b style=&quot;color:var(--amber)&quot;&gt;노랑&lt;/b&gt; = shape 는 통과하지만 값이 틀린 함정.&lt;/p&gt;
  &lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill teal&quot;&gt;X (N, D) · W (D, M) · b (M,) · dout (N, M)&lt;/span&gt;&lt;span class=&quot;pill amber&quot;&gt;dX = dout @ W.T&lt;/span&gt;&lt;span class=&quot;pill amber&quot;&gt;dW = X.T @ dout&lt;/span&gt;&lt;span class=&quot;pill amber&quot;&gt;db = dout.sum(axis=0)&lt;/span&gt;&lt;span class=&quot;pill purple&quot;&gt;MNIST: dW1 = X.T (784, 100) @ dout (100, 100)&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;shape 그림 — 위: 순방향, 아래: 역방향 결과 (점선 = 필요한 shape)&lt;/h2&gt;
      &lt;svg id=&quot;sv&quot; viewBox=&quot;0 0 640 350&quot; role=&quot;img&quot; aria-label=&quot;Affine 순방향과 역방향 행렬 shape&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;sN&quot;&gt;N (배치)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sN&quot; min=&quot;1&quot; max=&quot;128&quot; step=&quot;1&quot;&gt;&lt;output id=&quot;oN&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;sD&quot;&gt;D (입력)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sD&quot; min=&quot;1&quot; max=&quot;800&quot; step=&quot;1&quot;&gt;&lt;output id=&quot;oD&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;sM&quot;&gt;M (출력)&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sM&quot; min=&quot;1&quot; max=&quot;128&quot; step=&quot;1&quot;&gt;&lt;output id=&quot;oM&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div id=&quot;slots&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;현재 값&lt;/h2&gt;&lt;div class=&quot;kv&quot; id=&quot;kv&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;Python (노트북 5-1)&lt;/h2&gt;&lt;div class=&quot;code&quot; id=&quot;code&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;상태&lt;/h2&gt;&lt;div class=&quot;status info&quot; id=&quot;status&quot;&gt;프리셋을 누르세요.&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;

  &lt;div class=&quot;panel explain&quot; id=&quot;explain&quot;&gt;&lt;/div&gt;

&lt;script&gt;
const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,ms));

function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}
function setCode(h){$(&#x27;#code&#x27;).innerHTML=h;}

function show(id,title){$$(&#x27;.view&#x27;).forEach(v=&gt;v.classList.toggle(&#x27;on&#x27;,v.id===id));if(title&amp;&amp;$(&#x27;#stageTitle&#x27;))$(&#x27;#stageTitle&#x27;).textContent=title;}
function initPresets(P,stop){$(&#x27;#presets&#x27;).innerHTML=P.map(p=&gt;`&lt;button type=&quot;button&quot;&gt;${p.n}&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}
const sigm=z=&gt;1/(1+Math.exp(-z));
const fe=(v,d=4)=&gt;{if(Number.isNaN(v))return &#x27;nan&#x27;;if(!isFinite(v))return v&gt;0?&#x27;inf&#x27;:&#x27;-inf&#x27;;const a=Math.abs(v);return a!==0&amp;&amp;(a&gt;=1e5||a&lt;1e-3)?v.toExponential(2):v.toFixed(d);};

let N=2,D=3,M=4;
const CANDS={
 dX:[&#x27;dout @ W&#x27;,&#x27;dout @ W.T&#x27;,&#x27;W @ dout&#x27;,&#x27;W @ dout.T&#x27;,&#x27;X.T @ dout&#x27;],
 dW:[&#x27;X @ dout&#x27;,&#x27;X.T @ dout&#x27;,&#x27;dout.T @ X&#x27;,&#x27;dout @ X.T&#x27;,&#x27;W.T @ dout&#x27;],
 db:[&#x27;dout.sum(axis=0)&#x27;,&#x27;dout.sum(axis=1)&#x27;,&#x27;dout.mean(axis=0)&#x27;,&#x27;dout.sum()&#x27;]};
const RIGHT={dX:&#x27;dout @ W.T&#x27;,dW:&#x27;X.T @ dout&#x27;,db:&#x27;dout.sum(axis=0)&#x27;};
let tried={dX:new Set(),dW:new Set(),db:new Set()},pick={dX:null,dW:null,db:null};
const shp=s=&gt;&#x27;(&#x27;+s.join(&#x27;, &#x27;)+(s.length===1?&#x27;,&#x27;:&#x27;&#x27;)+&#x27;)&#x27;;
const target=()=&gt;({dX:[N,D],dW:[D,M],db:[M]});
// 작은 shape 엔진 + 실제 값 (정답 식과 비교)
function rnd(seed){let a=seed;return()=&gt;{a=a+0x6D2B79F5|0;let t=Math.imul(a^a&gt;&gt;&gt;15,1|a);t=t+Math.imul(t^t&gt;&gt;&gt;7,61|t)^t;return((t^t&gt;&gt;&gt;14)&gt;&gt;&gt;0)/4294967296*2-1;};}
let MAT=null;
function mats(){const key=N+&#x27;,&#x27;+D+&#x27;,&#x27;+M;if(MAT&amp;&amp;MAT.key===key)return MAT;const r=rnd(7);const mk=(a,b)=&gt;({s:[a,b],v:Float64Array.from({length:a*b},r)});MAT={key,X:mk(N,D),W:mk(D,M),dout:mk(N,M)};return MAT;}
const T=m=&gt;{const [a,b]=m.s,v=new Float64Array(a*b);for(let i=0;i&lt;a;i++)for(let j=0;j&lt;b;j++)v[j*a+i]=m.v[i*b+j];return {s:[b,a],v};};
function mm(A,B){const [a,k]=A.s,[k2,b]=B.s;if(k!==k2)return {err:`${shp(A.s)} @ ${shp(B.s)} 불가 — 안쪽 차원 ${k} ≠ ${k2}`};const v=new Float64Array(a*b);
  for(let i=0;i&lt;a;i++)for(let p=0;p&lt;k;p++){const x=A.v[i*k+p];if(x===0)continue;const ro=p*b,o=i*b;for(let j=0;j&lt;b;j++)v[o+j]+=x*B.v[ro+j];}return {s:[a,b],v,how:`${shp(A.s)} @ ${shp(B.s)} → ${shp([a,b])}`};}
function evalExpr(e){const m=mats();const op=n=&gt;{const t=n.endsWith(&#x27;.T&#x27;);const base=m[n.replace(&#x27;.T&#x27;,&#x27;&#x27;)];return t?T(base):base;};
  if(e.includes(&#x27;@&#x27;)){const [a,b]=e.split(&#x27; @ &#x27;);return mm(op(a),op(b));}
  const d=m.dout,[n,k]=d.s;
  if(e===&#x27;dout.sum()&#x27;){let s=0;d.v.forEach(x=&gt;s+=x);return {s:[],v:Float64Array.of(s),how:`${shp(d.s)} 전체 합 → 스칼라 ()`};}
  const ax=e.includes(&#x27;axis=0&#x27;)?0:1,mean=e.includes(&#x27;mean&#x27;);const len=ax?n:k;const v=new Float64Array(len);
  for(let i=0;i&lt;n;i++)for(let j=0;j&lt;k;j++)v[ax?i:j]+=d.v[i*k+j];if(mean)v.forEach((x,i)=&gt;v[i]=x/(ax?k:n));
  return {s:[len],v,how:`${shp(d.s)} ${mean?&#x27;mean&#x27;:&#x27;sum&#x27;}(axis=${ax}) → ${shp([len])}`};}
function rel(a,b){let d=0,x=0,y=0;for(let i=0;i&lt;a.length;i++){d+=(a[i]-b[i])**2;x+=a[i]**2;y+=b[i]**2;}return Math.sqrt(d)/(Math.sqrt(x)+Math.sqrt(y)+1e-12);}
const JC=new Map();
function judge(slot,e){const key=[N,D,M,slot,e].join(&#x27;|&#x27;);if(!JC.has(key))JC.set(key,judge0(slot,e));return JC.get(key);}
function judge0(slot,e){const r=evalExpr(e),tg=target()[slot];
  if(r.err)return {cls:&#x27;bad&#x27;,msg:`✗ shape 오류: ${r.err}`};
  if(r.s.join()!==tg.join())return {cls:&#x27;bad&#x27;,msg:`✗ ${r.how} ≠ 필요한 ${shp(tg)}`};
  if(e===RIGHT[slot])return {cls:&#x27;ok&#x27;,msg:`✓ ${r.how} = ${slot} shape — 정답`};
  const ok=evalExpr(RIGHT[slot]);const re=rel(r.v,ok.v);
  return {cls:&#x27;trap&#x27;,msg:`⚠ ${r.how} — shape 는 통과! 하지만 정답과 rel_error = ${re.toFixed(2)} (값이 틀림)`,re};}
window.__judge=judge;
// 그림
const sz=n=&gt;10+13*Math.log2(n+1);
function rect(x,y,w,h,col,opt={}){return `&lt;rect x=&quot;${x}&quot; y=&quot;${y}&quot; width=&quot;${w}&quot; height=&quot;${h}&quot; rx=&quot;3&quot; fill=&quot;${opt.fill||col}&quot; fill-opacity=&quot;${opt.op??0.22}&quot; stroke=&quot;${col}&quot; stroke-width=&quot;${opt.sw||1.6}&quot; ${opt.dash?&#x27;stroke-dasharray=&quot;5 4&quot;&#x27;:&#x27;&#x27;}/&gt;`;}
const tw=t=&gt;[...t].reduce((s,c)=&gt;s+(c.charCodeAt(0)&gt;0x2000?12.5:7.4),0);
// 블록 = 사각형 + 아래 글자 두 줄. 블록 폭은 사각형과 글자 중 넓은 쪽
function block(x,y,w,h,col,l1,l2,c1,opt){const bw=Math.max(w,tw(l1),tw(l2||&#x27;&#x27;));const rx=x+(bw-w)/2;
  return {w:bw,svg:rect(rx,y,w,h,col,opt)+`&lt;text x=&quot;${x+bw/2}&quot; y=&quot;${y+h+16}&quot; fill=&quot;${c1||col}&quot; font-size=&quot;13&quot; text-anchor=&quot;middle&quot;&gt;${l1}&lt;/text&gt;`+(l2?`&lt;text x=&quot;${x+bw/2}&quot; y=&quot;${y+h+31}&quot; fill=&quot;#8a9bb8&quot; font-size=&quot;11.5&quot; text-anchor=&quot;middle&quot;&gt;${l2}&lt;/text&gt;`:&#x27;&#x27;)};}
function svg(){
  let s=&#x27;&#x27;;const y0=12,sd=sz(D),sn=sz(N),sm=sz(M);let x=10;const op=(t,x,y)=&gt;`&lt;text x=&quot;${x}&quot; y=&quot;${y}&quot; fill=&quot;#8a9bb8&quot; font-size=&quot;18&quot; text-anchor=&quot;middle&quot;&gt;${t}&lt;/text&gt;`;
  const mid=y0+Math.max(sn,sd)/2;const put=(b)=&gt;{s+=b.svg;x+=b.w;};
  put(block(x,y0,sd,sn,&#x27;#60a5fa&#x27;,&#x27;X&#x27;,`(${N}, ${D})`));s+=op(&#x27;@&#x27;,x+12,mid+6);x+=24;
  put(block(x,y0,sm,sd,&#x27;#f5b942&#x27;,&#x27;W&#x27;,`(${D}, ${M})`));s+=op(&#x27;+&#x27;,x+12,mid+6);x+=24;
  put(block(x,y0,sm,6,&#x27;#c084fc&#x27;,&#x27;b&#x27;,`(${M},)`));s+=op(&#x27;=&#x27;,x+12,mid+6);x+=24;
  put(block(x,y0,sm,sn,&#x27;#2dd4bf&#x27;,&#x27;Y&#x27;,`(${N}, ${M})`));x+=22;
  put(block(x,y0,sm,sn,&#x27;#f87171&#x27;,&#x27;dout&#x27;,`(${N}, ${M})`));let maxX=x;
  const y1=y0+Math.max(sn,sd)+52;
  x=10;
  [[&#x27;dX&#x27;,[N,D],&#x27;#60a5fa&#x27;],[&#x27;dW&#x27;,[D,M],&#x27;#f5b942&#x27;],[&#x27;db&#x27;,[M],&#x27;#c084fc&#x27;]].forEach(([k,t,col])=&gt;{
    const w=t.length===1?sz(t[0]):sz(t[1]),h=t.length===1?6:sz(t[0]);
    const p=pick[k];let l1=`${k} 필요 ${shp(t)}`,l2=p||&#x27;후보를 고르세요&#x27;,c=&#x27;#5d7292&#x27;,extra=&#x27;&#x27;;
    if(p){const j=judge(k,p),r=evalExpr(p);c=j.cls===&#x27;ok&#x27;?&#x27;#4ade80&#x27;:j.cls===&#x27;trap&#x27;?&#x27;#f5b942&#x27;:&#x27;#f87171&#x27;;
      if(!r.err&amp;&amp;r.s.length){const rs=r.s.length===2?[sz(r.s[1]),sz(r.s[0])]:[sz(r.s[0]),6];extra={w:rs[0],h:rs[1]};}
      l2=(r.err?&#x27;✗ &#x27;:&#x27;&#x27;)+p+(r.err?&#x27;&#x27;:` → ${shp(r.s)}`);}
    const bw=Math.max(w,extra?extra.w:0,tw(l1),tw(l2));const rx=x+(bw-w)/2;
    s+=rect(rx,y1,w,h,&#x27;#5d7292&#x27;,{dash:1,op:0});
    if(extra)s+=rect(rx,y1,extra.w,extra.h,c,{op:0.35,sw:2});
    const hh=Math.max(h,extra?extra.h:0);
    s+=`&lt;text x=&quot;${x+bw/2}&quot; y=&quot;${y1+hh+16}&quot; fill=&quot;#8a9bb8&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;${l1}&lt;/text&gt;&lt;text x=&quot;${x+bw/2}&quot; y=&quot;${y1+hh+31}&quot; fill=&quot;${c}&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;${l2}&lt;/text&gt;`;
    x+=bw+22;});
  maxX=Math.max(maxX,x);s=`&lt;line x1=&quot;0&quot; y1=&quot;${y1-14}&quot; x2=&quot;${Math.max(360,maxX)}&quot; y2=&quot;${y1-14}&quot; stroke=&quot;#1f2b45&quot;/&gt;`+s;
  const H=y1+Math.max(sz(D),sz(N),sz(M))+40;$(&#x27;#sv&#x27;).setAttribute(&#x27;viewBox&#x27;,`0 0 ${Math.max(360,Math.ceil(maxX))} ${Math.ceil(H)}`);$(&#x27;#sv&#x27;).innerHTML=s;
}
function slots(){
  $(&#x27;#slots&#x27;).innerHTML=Object.keys(CANDS).map(k=&gt;`&lt;div class=&quot;slot&quot;&gt;&lt;h3&gt;${k} &lt;span&gt;필요 shape ${shp(target()[k])}&lt;/span&gt;&lt;/h3&gt;&lt;div class=&quot;row&quot;&gt;${CANDS[k].map(e=&gt;{let c=&#x27;&#x27;;if(tried[k].has(e))c=judge(k,e).cls;return `&lt;button type=&quot;button&quot; data-k=&quot;${k}&quot; data-e=&quot;${e}&quot; class=&quot;${c}&quot;&gt;${e}&lt;/button&gt;`;}).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;msg&quot; id=&quot;m_${k}&quot;&gt;${pick[k]?judge(k,pick[k]).msg:&#x27;후보를 눌러 보세요&#x27;}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#slots button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(busy)return;choose(b.dataset.k,b.dataset.e);});
}
function choose(k,e){tried[k].add(e);pick[k]=e;const j=judge(k,e);draw();setStatus(j.cls===&#x27;ok&#x27;?&#x27;ok&#x27;:j.cls===&#x27;trap&#x27;?&#x27;info&#x27;:&#x27;warn&#x27;,`${k} = ${e}: ${j.msg}`);return j;}
function info(){
  $(&#x27;#kv&#x27;).innerHTML=`&lt;span&gt;X&lt;/span&gt;&lt;b style=&quot;color:var(--blue)&quot;&gt;(${N}, ${D})&lt;/b&gt;&lt;span&gt;W&lt;/span&gt;&lt;b style=&quot;color:var(--amber)&quot;&gt;(${D}, ${M})&lt;/b&gt;&lt;span&gt;b&lt;/span&gt;&lt;b style=&quot;color:var(--purple)&quot;&gt;(${M},)&lt;/b&gt;&lt;span&gt;Y, dout&lt;/span&gt;&lt;b style=&quot;color:var(--red)&quot;&gt;(${N}, ${M})&lt;/b&gt;&lt;span&gt;dX&lt;/span&gt;&lt;b&gt;dout (${N}, ${M}) @ W.T (${M}, ${D}) = (${N}, ${D})&lt;/b&gt;&lt;span&gt;dW&lt;/span&gt;&lt;b&gt;X.T (${D}, ${N}) @ dout (${N}, ${M}) = (${D}, ${M})&lt;/b&gt;&lt;span&gt;db&lt;/span&gt;&lt;b&gt;dout.sum(axis=0) = (${M},)&lt;/b&gt;&lt;span&gt;파라미터&lt;/span&gt;&lt;b&gt;${(D*M+M).toLocaleString()}&lt;/b&gt;`;
  setCode(`class Affine:                           &lt;span class=&quot;c&quot;&gt;# 5-1&lt;/span&gt;\n    def __init__(self, W, b):\n        self.W, self.b = W, b\n    def forward(self, X):\n        self.X = X                       &lt;span class=&quot;c&quot;&gt;# 저장 — dW 에 필요&lt;/span&gt;\n        return X @ self.W + self.b       &lt;span class=&quot;c&quot;&gt;# (${N}, ${M})&lt;/span&gt;\n    def backward(self, dout):            &lt;span class=&quot;c&quot;&gt;# dout (${N}, ${M})&lt;/span&gt;\n&lt;span class=&quot;a&quot;&gt;        self.dW = self.X.T @ dout        # (${D}, ${N}) @ (${N}, ${M}) = (${D}, ${M})\n        self.db = dout.sum(axis=0)       # (${M},)  b 가 N 행에 브로드캐스트됐으니 합\n        dX = dout @ self.W.T             # (${N}, ${M}) @ (${M}, ${D}) = (${N}, ${D})&lt;/span&gt;\n        return dX\n&lt;span class=&quot;g&quot;&gt;# Day 2: dW = X.T @ (Y − T) / N  ← dout = (Y − T) / N 을 넣은 것&lt;/span&gt;`);
}
function draw(){const dm={N,D,M};[&#x27;N&#x27;,&#x27;D&#x27;,&#x27;M&#x27;].forEach(k=&gt;{$(&#x27;#s&#x27;+k).value=dm[k];$(&#x27;#o&#x27;+k).textContent=dm[k];});svg();slots();info();}
function setDims(n,d,m){N=n;D=d;M=m;tried={dX:new Set(),dW:new Set(),db:new Set()};pick={dX:null,dW:null,db:null};draw();}
[&#x27;N&#x27;,&#x27;D&#x27;,&#x27;M&#x27;].forEach(k=&gt;$(&#x27;#s&#x27;+k).oninput=e=&gt;{if(busy)return;const v=+e.target.value;if(k===&#x27;N&#x27;)N=v;if(k===&#x27;D&#x27;)D=v;if(k===&#x27;M&#x27;)M=v;draw();
  const tr=Object.keys(pick).filter(s=&gt;pick[s]&amp;&amp;judge(s,pick[s]).cls===&#x27;trap&#x27;);setStatus(tr.length?&#x27;info&#x27;:&#x27;info&#x27;,`N = ${N}, D = ${D}, M = ${M}${tr.length?` — ⚠ ${tr.join(&#x27;, &#x27;)} 의 오답이 shape 검사를 통과 중`:&#x27;&#x27;}`);});
window.addEventListener(&#x27;resize&#x27;,svg);
async function tryList(list,ms){const out=[];for(const [k,e] of list){out.push(choose(k,e));await sleep(ms);}return out;}
const P=[
 {n:&#x27;① 작은 예 N=2, D=3, M=4&#x27;,ex:&#x27;&lt;p&gt;dX 는 X 와 같은 (2, 3) 이어야 합니다. dout (2, 4) 에 무엇을 곱해야 (2, 3)? → (4, 3) = &lt;b class=&quot;amber&quot;&gt;W.T&lt;/b&gt;. dW 는 (3, 4) → (3, 2) @ (2, 4) = &lt;b class=&quot;amber&quot;&gt;X.T @ dout&lt;/b&gt;. db 는 (4,) → 행 방향(axis=0) 합.&lt;/p&gt;&lt;p&gt;외울 필요 없이 &quot;&lt;b class=&quot;teal&quot;&gt;결과 shape 가 원래 변수 shape 와 같도록&lt;/b&gt;&quot; 놓으면 식이 하나로 정해집니다. 스칼라 곱셈 노드(D3-3)의 &quot;상대편 입력 곱하기&quot; 가 행렬에서는 전치 + 행렬 곱이 된 것.&lt;/p&gt;&#x27;,
  run:async()=&gt;{setDims(2,3,4);await sleep(400);await tryList([[&#x27;dX&#x27;,&#x27;dout @ W&#x27;],[&#x27;dX&#x27;,&#x27;X.T @ dout&#x27;],[&#x27;dX&#x27;,&#x27;dout @ W.T&#x27;],[&#x27;dW&#x27;,&#x27;X @ dout&#x27;],[&#x27;dW&#x27;,&#x27;dout.T @ X&#x27;],[&#x27;dW&#x27;,&#x27;X.T @ dout&#x27;],[&#x27;db&#x27;,&#x27;dout.sum(axis=1)&#x27;],[&#x27;db&#x27;,&#x27;dout.sum(axis=0)&#x27;]],850);
   setStatus(&#x27;ok&#x27;,&#x27;dX = dout @ W.T (2, 3), dW = X.T @ dout (3, 4), db = dout.sum(axis=0) (4,) — 모두 정답&#x27;);window.__p1=[&#x27;dX&#x27;,&#x27;dW&#x27;,&#x27;db&#x27;].map(k=&gt;judge(k,RIGHT[k]).cls);}},
 {n:&#x27;② MNIST N=100, D=784, M=100&#x27;,ex:&#x27;&lt;p&gt;MNIST 1층 (배치 100): X (100, 784), W1 (784, 100), dout (100, 100). &lt;b class=&quot;green&quot;&gt;dW1 = X.T (784, 100) @ dout (100, 100) = (784, 100)&lt;/b&gt;, dX = dout (100, 100) @ W1.T (100, 784) = (100, 784), db1 = (100,).&lt;/p&gt;&lt;p&gt;&lt;b class=&quot;red&quot;&gt;헷갈리는 이유&lt;/b&gt;: 배치 크기와 은닉 크기가 둘 다 100 이라 dout 이 정사각 (100, 100). 그래서 &lt;code&gt;dout.sum(axis=1)&lt;/code&gt; 도 (100,) 로 shape 검사를 통과합니다 — 배치 방향(axis=0)으로 합해야 맞습니다. 노트북에서 batch_size 를 잠깐 다른 값(예: 50)으로 바꿔 보면 실수가 바로 드러납니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{setDims(100,784,100);await sleep(500);const r=await tryList([[&#x27;dW&#x27;,&#x27;dout.T @ X&#x27;],[&#x27;dW&#x27;,&#x27;X.T @ dout&#x27;],[&#x27;dX&#x27;,&#x27;dout @ W&#x27;],[&#x27;dX&#x27;,&#x27;dout @ W.T&#x27;],[&#x27;db&#x27;,&#x27;dout.sum(axis=1)&#x27;],[&#x27;db&#x27;,&#x27;dout.sum(axis=0)&#x27;]],900);
   setStatus(&#x27;ok&#x27;,&#x27;dW1 = X.T (784, 100) @ dout (100, 100) = (784, 100) · dX = (100, 784) · db1 = (100,). ⚠ N = M = 100 이라 dout.sum(axis=1) 도 shape 통과&#x27;);window.__p2=r.map(j=&gt;j.cls);}},
 {n:&#x27;③ 정사각 W 함정 (D = M = 10)&#x27;,ex:&#x27;&lt;p&gt;784-10-10 망의 2층 Affine: X (3, 10), W2 &lt;b class=&quot;amber&quot;&gt;(10, 10)&lt;/b&gt;, dout (3, 10). 전치를 빼먹은 &lt;code&gt;dX = dout @ W&lt;/code&gt; 가 (3, 10) @ (10, 10) = (3, 10) 으로 &lt;b class=&quot;amber&quot;&gt;shape 오류 없이 실행&lt;/b&gt;됩니다 — 하지만 값이 틀립니다. &lt;code&gt;dout.T @ X&lt;/code&gt; (= dW 의 전치)도 마찬가지.&lt;/p&gt;&lt;p&gt;shape 가 맞아도 값이 틀릴 수 있다 → 새 계층을 만들면 반드시 &lt;b class=&quot;green&quot;&gt;gradient check&lt;/b&gt; (D3-7 버그 ②: 이 실수로 W1 상대 오차 0.63).&lt;/p&gt;&#x27;,
  run:async()=&gt;{setDims(3,10,10);await sleep(500);const r=await tryList([[&#x27;dX&#x27;,&#x27;dout @ W&#x27;],[&#x27;dX&#x27;,&#x27;dout @ W.T&#x27;],[&#x27;dW&#x27;,&#x27;dout.T @ X&#x27;],[&#x27;dW&#x27;,&#x27;X.T @ dout&#x27;]],1300);
   setStatus(&#x27;info&#x27;,`dout @ W: ${r[0].msg} · dout.T @ X: ${r[2].msg}`);window.__p3=r.map(j=&gt;[j.cls,j.re]);}},
 {n:&#x27;④ db — 합 vs 평균&#x27;,ex:&#x27;&lt;p&gt;순방향에서 b (M,) 는 N 개 행에 &lt;b class=&quot;purple&quot;&gt;브로드캐스트&lt;/b&gt;(복사)되어 더해집니다. 복사 = 같은 값이 여러 갈래로 나간 것 → 역방향에서는 갈래마다 온 기울기를 &lt;b class=&quot;green&quot;&gt;더합니다&lt;/b&gt; (덧셈 노드의 반대): &lt;code&gt;db = dout.sum(axis=0)&lt;/code&gt;.&lt;/p&gt;&lt;p&gt;&lt;code&gt;dout.mean(axis=0)&lt;/code&gt; 는 shape (M,) 가 같아 오류 없이 돌지만 값이 1/N 배 — D3-7 버그 ① (b2 상대 오차 0.5). 1/N 은 이미 SoftmaxWithLoss 의 (Y − T)/N 에 들어 있습니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{setDims(4,3,2);await sleep(400);const r=await tryList([[&#x27;db&#x27;,&#x27;dout.sum()&#x27;],[&#x27;db&#x27;,&#x27;dout.sum(axis=1)&#x27;],[&#x27;db&#x27;,&#x27;dout.mean(axis=0)&#x27;],[&#x27;db&#x27;,&#x27;dout.sum(axis=0)&#x27;]],1000);
   setStatus(&#x27;ok&#x27;,`db = dout.sum(axis=0) (2,) — mean 은 ${r[2].msg.replace(&#x27;⚠ &#x27;,&#x27;&#x27;)}`);window.__p4=r.map(j=&gt;[j.cls,j.re]);}},
];
initPresets(P);

&lt;body&gt;
&lt;div class=&quot;app&quot;&gt;
  &lt;h1&gt;Softmax-with-Loss — 역전파는 y − t&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;마지막 계층은 softmax 와 cross-entropy 를 하나로 묶은 &lt;code&gt;SoftmaxWithLoss&lt;/code&gt;. 두 함수의 미분을 이어 붙이면 복잡한 항이 모두 지워지고 &lt;b style=&quot;color:var(--red)&quot;&gt;(Y − T) / N&lt;/b&gt; 만 남습니다 — Day 2 로지스틱 회귀에서 본 바로 그 &lt;b style=&quot;color:var(--amber)&quot;&gt;&quot;(예측 − 정답)&quot;&lt;/b&gt;. 점수 x 와 정답 t 를 바꿔 보세요.&lt;/p&gt;
  &lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill purple&quot;&gt;y = softmax(x)&lt;/span&gt;&lt;span class=&quot;pill blue&quot;&gt;L = −log(y[t] + 1e-12)&lt;/span&gt;&lt;span class=&quot;pill red&quot;&gt;dx = (y − t) / N&lt;/span&gt;&lt;span class=&quot;pill green&quot;&gt;[0.3, 2.9, 4.0], t=2 → L 0.3057&lt;/span&gt;&lt;span class=&quot;pill amber&quot;&gt;dx = [0.0182, 0.2452, −0.2634]&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2 id=&quot;stageTitle&quot;&gt;y (확률) · t (정답) · y − t (기울기)&lt;/h2&gt;
      &lt;canvas id=&quot;bars&quot;&gt;&lt;/canvas&gt;
      &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:#c084fc&quot;&gt;&lt;/i&gt;y = softmax(x)&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#2dd4bf&quot;&gt;&lt;/i&gt;t (one-hot 테두리)&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#f87171&quot;&gt;&lt;/i&gt;y − t &amp;lt; 0&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#4ade80&quot;&gt;&lt;/i&gt;y − t &amp;gt; 0&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;inp&quot; id=&quot;inp&quot; style=&quot;margin-top:10px&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;row tb&quot; id=&quot;tb&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;row&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;run&quot; id=&quot;bStep&quot;&gt;경사 한 걸음 x ← x − 1.0·dx&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;bR&quot;&gt;기본값&lt;/button&gt;&lt;/div&gt;
      &lt;canvas id=&quot;lh&quot;&gt;&lt;/canvas&gt;
      &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:#4ade80&quot;&gt;&lt;/i&gt;loss 기록&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;현재 값&lt;/h2&gt;&lt;div class=&quot;kv&quot; id=&quot;kv&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;Python (노트북 5-2 ~ 5-4)&lt;/h2&gt;&lt;div class=&quot;code&quot; id=&quot;code&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;상태&lt;/h2&gt;&lt;div class=&quot;status info&quot; id=&quot;status&quot;&gt;프리셋을 누르세요.&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel explain&quot; id=&quot;explain&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,ms));
let busy=false;
function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}
function setCode(h){$(&#x27;#code&#x27;).innerHTML=h;}
function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const g=c.getContext(&#x27;2d&#x27;);g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}
function show(id,title){$$(&#x27;.view&#x27;).forEach(v=&gt;v.classList.toggle(&#x27;on&#x27;,v.id===id));if(title&amp;&amp;$(&#x27;#stageTitle&#x27;))$(&#x27;#stageTitle&#x27;).textContent=title;}
function initPresets(P,stop){$(&#x27;#presets&#x27;).innerHTML=P.map(p=&gt;`&lt;button type=&quot;button&quot;&gt;${p.n}&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}
const sigm=z=&gt;1/(1+Math.exp(-z));
const fe=(v,d=4)=&gt;{if(Number.isNaN(v))return &#x27;nan&#x27;;if(!isFinite(v))return v&gt;0?&#x27;inf&#x27;:&#x27;-inf&#x27;;const a=Math.abs(v);return a!==0&amp;&amp;(a&gt;=1e5||a&lt;1e-3)?v.toExponential(2):v.toFixed(d);};

const f4=v=&gt;(Math.abs(v)&lt;5e-5?0:v).toFixed(4);
let ROWS=[{x:[0.3,2.9,4.0],t:2}],hist=[];
function softmax(x){const m=Math.max(...x),e=x.map(v=&gt;Math.exp(v-m)),s=e.reduce((a,b)=&gt;a+b,0);return e.map(v=&gt;v/s);}
function swl(rows=ROWS){const N=rows.length;const Y=rows.map(r=&gt;softmax(r.x));const L=-Y.reduce((s,y,i)=&gt;s+Math.log(y[rows[i].t]+1e-12),0)/N;
  const dX=Y.map((y,i)=&gt;y.map((v,k)=&gt;(v-(k===rows[i].t?1:0))/N));return {N,Y,L,dX};}
window.__swl=()=&gt;swl();
const arr=a=&gt;&#x27;[&#x27;+a.map(f4).join(&#x27;, &#x27;)+&#x27;]&#x27;;
function drawBars(){
  const [g,W,H]=fitCanvas($(&#x27;#bars&#x27;));g.clearRect(0,0,W,H);const r=swl();const n=ROWS.length;
  const top=14,midY=H*0.56,bot=H-18;const Yp=v=&gt;midY-12-v*(midY-12-top);const yz=(bot+midY+8)/2,Yd=v=&gt;yz-v*(bot-midY-8)/2;
  g.font=&#x27;11px Consolas,monospace&#x27;;g.fillStyle=&#x27;#5d7292&#x27;;g.fillText(&#x27;y&#x27;,4,top+8);g.fillText(&#x27;1&#x27;,4,Yp(1)+4);g.fillText(&#x27;y − t&#x27;,4,midY+10);
  g.strokeStyle=&#x27;#1a2540&#x27;;g.beginPath();g.moveTo(26,Yp(0));g.lineTo(W,Yp(0));g.moveTo(26,yz);g.lineTo(W,yz);g.stroke();
  g.setLineDash([3,3]);g.beginPath();g.moveTo(26,Yd(1));g.lineTo(W,Yd(1));g.moveTo(26,Yd(-1));g.lineTo(W,Yd(-1));g.stroke();g.setLineDash([]);
  g.fillText(&#x27;+1&#x27;,4,Yd(1)+4);g.fillText(&#x27;−1&#x27;,4,Yd(-1)+4);
  const gw=(W-34)/n,bw=Math.min(46,gw/4.2);
  ROWS.forEach((row,i)=&gt;{const x0=34+i*gw;
    if(n&gt;1){g.fillStyle=&#x27;#8a9bb8&#x27;;g.fillText(`행 ${i}  t=${row.t}`,x0,top-2);}
    for(let k=0;k&lt;3;k++){const cx=x0+gw*(k+0.5)/3.2+6,y=r.Y[i][k],d=r.dX[i][k]*r.N;   // 막대는 y − t (N 으로 나누기 전)
      if(k===row.t){g.strokeStyle=&#x27;#2dd4bf&#x27;;g.lineWidth=2;g.strokeRect(cx-bw/2-3,Yp(1),bw+6,Yp(0)-Yp(1));}
      g.fillStyle=&#x27;#c084fc&#x27;;g.fillRect(cx-bw/2,Yp(y),bw,Yp(0)-Yp(y));
      g.fillStyle=&#x27;#dbe4f0&#x27;;g.fillText(y.toFixed(3),cx-bw/2-2,Math.max(top+10,Yp(y)-4));
      g.fillStyle=d&lt;0?&#x27;#f87171&#x27;:&#x27;#4ade80&#x27;;const yy=Math.min(yz,Yd(d)),hh=Math.max(1,Math.abs(Yd(d)-yz));g.fillRect(cx-bw/2,yy,bw,hh);
      g.fillStyle=&#x27;#dbe4f0&#x27;;g.fillText((d&gt;=0?&#x27;+&#x27;:&#x27;&#x27;)+d.toFixed(3),cx-bw/2-4,d&lt;0?Math.min(bot+12,yz+hh+12):yy-4);
      g.fillStyle=&#x27;#8a9bb8&#x27;;g.fillText(`x${k}=${row.x[k].toFixed(2)}`,cx-bw/2-4,H-3);}});
}
function drawLH(){const [g,W,H]=fitCanvas($(&#x27;#lh&#x27;));g.clearRect(0,0,W,H);g.font=&#x27;11px Consolas,monospace&#x27;;
  if(hist.length&lt;1){g.fillStyle=&#x27;#5d7292&#x27;;g.fillText(&#x27;경사 한 걸음을 누르면 loss 가 기록됩니다&#x27;,8,H/2+4);return;}
  const mx=Math.max(...hist,0.01),n=Math.max(hist.length,8),X=i=&gt;30+i/(n-1)*(W-40),Y=v=&gt;6+(1-v/mx)*(H-18);
  g.fillStyle=&#x27;#5d7292&#x27;;g.fillText(mx.toFixed(2),2,12);g.fillText(&#x27;0&#x27;,18,H-8);
  g.strokeStyle=&#x27;#4ade80&#x27;;g.lineWidth=2;g.beginPath();hist.forEach((v,i)=&gt;i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));g.stroke();
  hist.forEach((v,i)=&gt;{g.fillStyle=&#x27;#4ade80&#x27;;g.beginPath();g.arc(X(i),Y(v),3,0,7);g.fill();});}
function inputs(){const r0=ROWS[0];$(&#x27;#inp&#x27;).innerHTML=r0.x.map((v,k)=&gt;`&lt;label&gt;x${k}${ROWS.length&gt;1?&#x27; (행 0)&#x27;:&#x27;&#x27;}&lt;input type=&quot;number&quot; step=&quot;0.1&quot; id=&quot;x${k}&quot; value=&quot;${+v.toFixed(4)}&quot;&gt;&lt;/label&gt;`).join(&#x27;&#x27;);
  $(&#x27;#tb&#x27;).innerHTML=&#x27;&lt;span class=&quot;lab&quot;&gt;정답 t:&lt;/span&gt;&#x27;+[0,1,2].map(k=&gt;`&lt;button type=&quot;button&quot; data-t=&quot;${k}&quot; class=&quot;${r0.t===k?&#x27;sel&#x27;:&#x27;&#x27;}&quot;&gt;t = ${k}&lt;/button&gt;`).join(&#x27;&#x27;);
  [0,1,2].forEach(k=&gt;$(&#x27;#x&#x27;+k).oninput=e=&gt;{if(busy)return;const v=parseFloat(e.target.value);if(!isFinite(v))return;ROWS[0].x[k]=v;hist=[];draw(false);report();});
  $$(&#x27;#tb button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(busy)return;ROWS[0].t=+b.dataset.t;hist=[];draw();report();});}
function report(){const r=swl();setStatus(&#x27;info&#x27;,`y = ${arr(r.Y[0])}, loss = ${r.L.toFixed(4)}, dx = ${arr(r.dX[0])}`);}
function info(){
  const r=swl();const one=ROWS.length===1;
  $(&#x27;#kv&#x27;).innerHTML=`&lt;span&gt;N&lt;/span&gt;&lt;b&gt;${r.N}&lt;/b&gt;`+ROWS.map((row,i)=&gt;`&lt;span&gt;x${one?&#x27;&#x27;:&#x27;[&#x27;+i+&#x27;]&#x27;}&lt;/span&gt;&lt;b&gt;${arr(row.x)}&lt;/b&gt;&lt;span&gt;t${one?&#x27;&#x27;:&#x27;[&#x27;+i+&#x27;]&#x27;}&lt;/span&gt;&lt;b style=&quot;color:var(--teal)&quot;&gt;${row.t}  (one-hot [${[0,1,2].map(k=&gt;k===row.t?1:0)}])&lt;/b&gt;&lt;span&gt;y${one?&#x27;&#x27;:&#x27;[&#x27;+i+&#x27;]&#x27;}&lt;/span&gt;&lt;b style=&quot;color:var(--purple)&quot;&gt;${arr(r.Y[i])}&lt;/b&gt;`).join(&#x27;&#x27;)+
   `&lt;span&gt;loss&lt;/span&gt;&lt;b style=&quot;color:var(--green)&quot;&gt;${r.L.toFixed(4)}&lt;/b&gt;`+r.dX.map((d,i)=&gt;`&lt;span&gt;dx${one?&#x27;&#x27;:&#x27;[&#x27;+i+&#x27;]&#x27;}&lt;/span&gt;&lt;b style=&quot;color:var(--red)&quot;&gt;${arr(d)}&lt;/b&gt;`).join(&#x27;&#x27;);
  const xs=&#x27;[&#x27;+ROWS.map(row=&gt;&#x27;[&#x27;+row.x.map(v=&gt;+v.toFixed(4)).join(&#x27;, &#x27;)+&#x27;]&#x27;).join(&#x27;, &#x27;)+&#x27;]&#x27;,ts=&#x27;[&#x27;+ROWS.map(row=&gt;row.t).join(&#x27;, &#x27;)+&#x27;]&#x27;;
  setCode(`def softmax(x):                         &lt;span class=&quot;c&quot;&gt;# 5-2&lt;/span&gt;\n    x = x - x.max(axis=-1, keepdims=True)\n    e = np.exp(x)\n    return e / e.sum(axis=-1, keepdims=True)\n\ndef cross_entropy_error(y, t):\n    if y.ndim == 1:\n        y, t = y.reshape(1, -1), t.reshape(1, -1)\n    if t.size == y.size:                &lt;span class=&quot;c&quot;&gt;# one-hot → 레이블&lt;/span&gt;\n        t = t.argmax(axis=1)\n    N = y.shape[0]\n    return -np.sum(np.log(y[np.arange(N), t] + 1e-12)) / N\n\nclass SoftmaxWithLoss:                  &lt;span class=&quot;c&quot;&gt;# 5-3&lt;/span&gt;\n    def forward(self, x, t):\n        self.t = t\n        self.y = softmax(x)\n        self.loss = cross_entropy_error(self.y, self.t)\n        return self.loss\n    def backward(self, dout=1):\n        N = self.t.shape[0]\n        if self.t.size == self.y.size:  &lt;span class=&quot;c&quot;&gt;# one-hot&lt;/span&gt;\n            return (self.y - self.t) / N\n&lt;span class=&quot;a&quot;&gt;        dx = self.y.copy()\n        dx[np.arange(N), self.t] -= 1   # 정답 자리에서 1 빼기\n        return dx / N&lt;/span&gt;\n\nlayer = SoftmaxWithLoss()\nlayer.forward(np.array(${xs}), np.array(${ts}))\n&lt;span class=&quot;g&quot;&gt;# loss ${r.L.toFixed(4)}\n# backward() = ${&#x27;[&#x27;+r.dX.map(arr).join(&#x27;, &#x27;)+&#x27;]&#x27;}&lt;/span&gt;`);
}
function draw(inp=true){if(inp)inputs();drawBars();drawLH();info();}
function gstep(lr=1.0){const r=swl();if(!hist.length)hist.push(r.L);ROWS.forEach((row,i)=&gt;row.x=row.x.map((v,k)=&gt;v-lr*r.dX[i][k]));const r2=swl();hist.push(r2.L);draw();return [r.L,r2.L];}
$(&#x27;#bStep&#x27;).onclick=()=&gt;{if(busy)return;const [a,b]=gstep();setStatus(b&lt;a?&#x27;ok&#x27;:&#x27;info&#x27;,`x ← x − 1.0·dx: loss ${a.toFixed(4)} → ${b.toFixed(4)}`);};
$(&#x27;#bR&#x27;).onclick=()=&gt;{if(busy)return;ROWS=[{x:[0.3,2.9,4.0],t:2}];hist=[];draw();report();};
window.addEventListener(&#x27;resize&#x27;,()=&gt;{drawBars();drawLH();});
const P=[
 {n:&#x27;① [0.3, 2.9, 4.0], t = 2&#x27;,ex:&#x27;&lt;p&gt;softmax → y = [0.0182, 0.2452, &lt;b class=&quot;purple&quot;&gt;0.7366&lt;/b&gt;], 정답 t = 2 의 확률이 0.7366 → loss = −log 0.7366 = &lt;b class=&quot;green&quot;&gt;0.3057&lt;/b&gt;. 역방향: y 에서 정답 자리만 1 을 빼면 &lt;b class=&quot;red&quot;&gt;dx = [0.0182, 0.2452, −0.2634]&lt;/b&gt; (N = 1).&lt;/p&gt;&lt;p&gt;softmax 의 미분(야코비안)과 −log 의 미분 −1/y 을 곱하면 항들이 지워져 y − t 만 남습니다. 오답 자리는 + (점수를 내려라), 정답 자리는 − (점수를 올려라).&lt;/p&gt;&#x27;,
  run:async()=&gt;{ROWS=[{x:[0.3,2.9,4.0],t:2}];hist=[];draw();await sleep(300);const r=swl();setStatus(&#x27;ok&#x27;,`y = ${arr(r.Y[0])}, loss = ${r.L.toFixed(4)}, dx = y − t = ${arr(r.dX[0])}`);window.__p1=r;}},
 {n:&#x27;② 기울기 방향으로 한 걸음씩&#x27;,ex:&#x27;&lt;p&gt;x ← x − 1.0 · dx 를 반복하면 정답 점수 x2 는 올라가고 오답 점수는 내려가 &lt;b class=&quot;green&quot;&gt;loss 가 계속 줄어듭니다&lt;/b&gt;: 0.3057 → 0.1979 → 0.1461 → … (아래 그래프).&lt;/p&gt;&lt;p&gt;학습에서는 x 대신 W, b 를 움직이지만 원리는 같습니다 — dx = y − t 가 Affine 을 거쳐 dW = X.T @ dout 으로 전달됩니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{ROWS=[{x:[0.3,2.9,4.0],t:2}];hist=[];draw();await sleep(600);const L=[];for(let i=0;i&lt;6;i++){const [a,b]=gstep();L.push(b);setStatus(&#x27;info&#x27;,`step ${i+1}: loss ${a.toFixed(4)} → ${b.toFixed(4)}`);await sleep(800);}
   setStatus(&#x27;ok&#x27;,`6 걸음: loss ${hist.map(v=&gt;v.toFixed(4)).join(&#x27; → &#x27;)}`);window.__p2=hist.slice();}},
 {n:&#x27;③ 배치 2개 — N 으로 나누기&#x27;,ex:&#x27;&lt;p&gt;x = [[0.3, 2.9, 4.0], [1.0, 2.0, 0.5]], t = [2, 0] → 행별 loss 0.3057, 1.4644 → 평균 &lt;b class=&quot;green&quot;&gt;0.8850&lt;/b&gt;. 역방향은 행마다 y − t 를 구하고 &lt;b class=&quot;red&quot;&gt;N = 2 로 나눕니다&lt;/b&gt;: [[0.0091, 0.1226, −0.1317], [−0.3844, 0.3143, 0.0701]].&lt;/p&gt;&lt;p&gt;loss 가 평균이므로 기울기도 1/N. 이 1/N 이 이미 들어 있으니 Affine 의 db 는 &lt;code&gt;sum&lt;/code&gt; (mean 아님 — D3-5 ④). 막대는 나누기 전 y − t, kv 의 dx 는 나눈 값.&lt;/p&gt;&#x27;,
  run:async()=&gt;{ROWS=[{x:[0.3,2.9,4.0],t:2},{x:[1.0,2.0,0.5],t:0}];hist=[];draw();await sleep(400);const r=swl();
   setStatus(&#x27;ok&#x27;,`loss = ${r.L.toFixed(4)}, backward = [${r.dX.map(arr).join(&#x27;, &#x27;)}] (N = 2 로 나눔)`);window.__p3=r;}},
 {n:&#x27;④ Day 2 와 같은 (예측 − 정답)&#x27;,ex:&#x27;&lt;p&gt;Day 2 로지스틱 회귀: dW = Xᵀ(P − T)/N, 선형 회귀: dW = Xᵀ(Y − T)/N. 오늘 Affine 은 &lt;code&gt;dW = X.T @ dout&lt;/code&gt; 이고 dout = SoftmaxWithLoss 의 &lt;b class=&quot;red&quot;&gt;(Y − T)/N&lt;/b&gt; → 똑같은 식입니다 (노트북 &lt;code&gt;5-4&lt;/code&gt;).&lt;/p&gt;&lt;p&gt;sigmoid + BCE, softmax + CE, 항등 + ½MSE — 짝을 잘 맞춘 출력층/손실 조합은 모두 역전파가 &quot;(예측 − 정답)&quot; 이 되도록 설계된 것.&lt;/p&gt;&#x27;,
  run:async()=&gt;{ROWS=[{x:[0.3,2.9,4.0],t:2}];hist=[];draw();const r=swl();
   setCode(`&lt;span class=&quot;c&quot;&gt;# 5-4 Day 2 로지스틱 기울기와 비교&lt;/span&gt;\nlayer = SoftmaxWithLoss()\nlayer.forward(A2, t)                 &lt;span class=&quot;c&quot;&gt;# A2 = 2층 Affine 출력&lt;/span&gt;\ndout = layer.backward()              &lt;span class=&quot;c&quot;&gt;# (Y − T) / N&lt;/span&gt;\n&lt;span class=&quot;a&quot;&gt;dW2 = Z1.T @ dout                    # Affine2.backward&lt;/span&gt;\n\n&lt;span class=&quot;c&quot;&gt;# Day 2 로지스틱 회귀&lt;/span&gt;\n&lt;span class=&quot;a&quot;&gt;dW = X.T @ (P - T) / N               # 같은 모양: 입력ᵀ @ (예측 − 정답) / N&lt;/span&gt;\n&lt;span class=&quot;g&quot;&gt;# 예: y − t = ${arr(r.dX[0])}&lt;/span&gt;`);
   setStatus(&#x27;ok&#x27;,&#x27;SoftmaxWithLoss.backward() = (Y − T)/N → Affine dW = X.T @ dout = Xᵀ(Y − T)/N — Day 2 와 같은 식&#x27;);window.__p4=true;}},
 {n:&#x27;⑤ 확신하며 틀림 (t = 0)&#x27;,ex:&#x27;&lt;p&gt;같은 점수에 정답이 t = 0 이면 y[0] = 0.0182 → loss = −log 0.0182 = &lt;b class=&quot;red&quot;&gt;4.0057&lt;/b&gt;. 기울기 y − t = [&lt;b class=&quot;red&quot;&gt;−0.9818&lt;/b&gt;, 0.2452, 0.7366] — 크게 틀릴수록 기울기도 커서 빠르게 고칩니다.&lt;/p&gt;&lt;p&gt;log 안의 &lt;code&gt;1e-12&lt;/code&gt; 는 y = 0 일 때 −inf 를 막는 안전장치입니다. Day 2 의 1e-7 대신 1e-12 를 쓰는 이유는 6교시 gradient check 에서 (D3-7 ②).&lt;/p&gt;&#x27;,
  run:async()=&gt;{ROWS=[{x:[0.3,2.9,4.0],t:0}];hist=[];draw();await sleep(300);const r=swl();setStatus(&#x27;warn&#x27;,`t = 0: y[0] = ${f4(r.Y[0][0])}, loss = ${r.L.toFixed(4)}, dx = ${arr(r.dX[0])}`);window.__p5=r;}},
];
initPresets(P);
draw();
$(&#x27;#presets button&#x27;).click();
&lt;/script&gt;

&lt;body&gt;
&lt;div class=&quot;app&quot;&gt;

        &lt;div class=&quot;row&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;run&quot; id=&quot;bLive&quot;&gt;gradient check 실행&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;bNew&quot;&gt;새 난수&lt;/button&gt;&lt;/div&gt;

      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;코드 (노트북 6-1 ~ 6-4)&lt;/h2&gt;&lt;div class=&quot;code&quot; id=&quot;code&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;상태&lt;/h2&gt;&lt;div class=&quot;status info&quot; id=&quot;status&quot;&gt;프리셋을 누르세요.&lt;/div&gt;&lt;/div&gt;
