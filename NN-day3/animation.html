&lt;script&gt;
const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,ms));
let busy=false;
function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}
function setCode(h){$(&#x27;#code&#x27;).innerHTML=h;}
function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const g=c.getContext(&#x27;2d&#x27;);g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}
function show(id,title){$$(&#x27;.view&#x27;).forEach(v=&gt;v.classList.toggle(&#x27;on&#x27;,v.id===id));if(title&amp;&amp;$(&#x27;#stageTitle&#x27;))$(&#x27;#stageTitle&#x27;).textContent=title;}
function initPresets(P,stop){$(&#x27;#presets&#x27;).innerHTML=P.map(p=&gt;`&lt;button type=&quot;button&quot;&gt;${p.n}&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}
const sigm=z=&gt;1/(1+Math.exp(-z));
const fe=(v,d=4)=&gt;{if(Number.isNaN(v))return &#x27;nan&#x27;;if(!isFinite(v))return v&gt;0?&#x27;inf&#x27;:&#x27;-inf&#x27;;const a=Math.abs(v);return a!==0&amp;&amp;(a&gt;=1e5||a&lt;1e-3)?v.toExponential(2):v.toFixed(d);};

const KEYS=[&#x27;W1&#x27;,&#x27;b1&#x27;,&#x27;W2&#x27;,&#x27;b2&#x27;];
const CASES={   // 명세 값 (서버 numpy 측정)
 ok:{name:&#x27;정상&#x27;,v:{W1:2.1e-10,b1:5.0e-11,W2:5.4e-11,b2:3.9e-10}},
 eps:{name:&#x27;log + 1e-7&#x27;,v:{W1:5e-7,b1:5e-7,W2:5e-7,b2:5e-7}},
 bug1:{name:&#x27;버그 ① db.mean&#x27;,v:{W1:2.1e-10,b1:5.0e-11,W2:5.4e-11,b2:0.5}},
 bug2:{name:&#x27;버그 ② dout @ W&#x27;,v:{W1:0.63,b1:0.56,W2:5.4e-11,b2:3.9e-10}}};
window.__CASES=CASES;
let cur=&#x27;ok&#x27;,shown={},anim=null;
const verdict=v=&gt;v&lt;1e-7?[&#x27;통과&#x27;,&#x27;var(--green)&#x27;,&#x27;#4ade80&#x27;]:v&lt;=1e-4?[&#x27;의심&#x27;,&#x27;var(--amber)&#x27;,&#x27;#f5b942&#x27;]:v&lt;=1e-2?[&#x27;의심 (큼)&#x27;,&#x27;var(--amber)&#x27;,&#x27;#f5b942&#x27;]:[&#x27;버그&#x27;,&#x27;var(--red)&#x27;,&#x27;#f87171&#x27;];
const fx=v=&gt;v&gt;=0.01?v.toFixed(2):v.toExponential(1);
function drawCh(){
  const [g,W,H]=fitCanvas($(&#x27;#ch&#x27;));g.clearRect(0,0,W,H);const lo=-12,hi=0,ml=40,mr=12,mt=10,mb=24;
  const X=v=&gt;ml+(Math.log10(Math.max(v,1e-12))-lo)/(hi-lo)*(W-ml-mr);
  g.fillStyle=&#x27;rgba(74,222,128,.08)&#x27;;g.fillRect(X(1e-12),mt,X(1e-7)-X(1e-12),H-mt-mb);
  g.fillStyle=&#x27;rgba(245,185,66,.08)&#x27;;g.fillRect(X(1e-7),mt,X(1e-2)-X(1e-7),H-mt-mb);
  g.fillStyle=&#x27;rgba(248,113,113,.10)&#x27;;g.fillRect(X(1e-2),mt,X(1)-X(1e-2),H-mt-mb);
  g.font=&#x27;11px Consolas,monospace&#x27;;
  for(let e=lo;e&lt;=hi;e+=2){g.strokeStyle=&#x27;#1a2540&#x27;;g.beginPath();g.moveTo(X(10**e),mt);g.lineTo(X(10**e),H-mb);g.stroke();g.fillStyle=&#x27;#5d7292&#x27;;g.fillText(&#x27;1e&#x27;+e,X(10**e)-12,H-6);}
  [[1e-7,&#x27;#4ade80&#x27;,[]],[1e-4,&#x27;#f5b942&#x27;,[4,4]],[1e-2,&#x27;#f87171&#x27;,[]]].forEach(([v,c,d])=&gt;{g.setLineDash(d);g.strokeStyle=c;g.lineWidth=1.6;g.beginPath();g.moveTo(X(v),mt);g.lineTo(X(v),H-mb);g.stroke();g.setLineDash([]);});
  const rh=(H-mt-mb)/4;
  KEYS.forEach((k,i)=&gt;{const y=mt+rh*(i+0.5);g.fillStyle=&#x27;#dbe4f0&#x27;;g.font=&#x27;13px Consolas,monospace&#x27;;g.fillText(k,6,y+4);
    if(shown[k]===undefined)return;const v=shown[k],[,,c]=verdict(v);
    g.strokeStyle=c;g.globalAlpha=.5;g.lineWidth=3;g.beginPath();g.moveTo(ml,y);g.lineTo(X(v),y);g.stroke();g.globalAlpha=1;
    g.fillStyle=c;g.beginPath();g.arc(X(v),y,6,0,7);g.fill();
    g.font=&#x27;12px Consolas,monospace&#x27;;const t=fx(v),tw=g.measureText(t).width;g.fillStyle=&#x27;#dbe4f0&#x27;;g.fillText(t,X(v)+tw+10&gt;W?X(v)-tw-10:X(v)+9,y-8);});
}
const DIFF={
 ok:`class Affine:\n    def backward(self, dout):\n        self.dW = self.X.T @ dout\n        self.db = dout.sum(axis=0)\n        return dout @ self.W.T\n\ndef cross_entropy_error(y, t):\n    ...\n    return -np.sum(np.log(y[np.arange(N), t] + 1e-12)) / N`,
 eps:`def cross_entropy_error(y, t):\n    ...\n&lt;span class=&quot;del&quot;&gt;-   return -np.sum(np.log(y[np.arange(N), t] + 1e-12)) / N&lt;/span&gt;\n&lt;span class=&quot;add&quot;&gt;+   return -np.sum(np.log(y[np.arange(N), t] + 1e-7)) / N&lt;/span&gt;\n&lt;span class=&quot;c&quot;&gt;# 수치 미분은 log(y + 1e-7) 을 미분, 역전파 (Y − T)/N 은\n# log(y) 의 미분 → y ≈ 0.1 에서 1e-7/y ≈ 1e-6 만큼 차이&lt;/span&gt;`,
 bug1:`class Affine:                &lt;span class=&quot;c&quot;&gt;# Affine2 (2층)&lt;/span&gt;\n    def backward(self, dout):\n        self.dW = self.X.T @ dout\n&lt;span class=&quot;del&quot;&gt;-       self.db = dout.sum(axis=0)&lt;/span&gt;\n&lt;span class=&quot;add&quot;&gt;+       self.db = dout.mean(axis=0)      # (M,) shape 는 같음!&lt;/span&gt;\n        return dout @ self.W.T\n&lt;span class=&quot;c&quot;&gt;# 2층 Affine 의 backward 에 든 버그\n# b2: N = 3 → 1/3 배 → rel = (1 − 1/3)/(1 + 1/3) = 0.5\n# db 는 아래 층으로 전달되지 않음 → W1, b1, W2 는 정상&lt;/span&gt;`,
 bug2:`class Affine:                &lt;span class=&quot;c&quot;&gt;# Affine2 (2층)&lt;/span&gt;\n    def backward(self, dout):\n        self.dW = self.X.T @ dout\n        self.db = dout.sum(axis=0)\n&lt;span class=&quot;del&quot;&gt;-       return dout @ self.W.T&lt;/span&gt;\n&lt;span class=&quot;add&quot;&gt;+       return dout @ self.W             # W2 (10, 10) 정사각 → 오류 없음&lt;/span&gt;\n&lt;span class=&quot;c&quot;&gt;# Affine2 의 dX 가 틀림 → 그 아래 Relu1 · Affine1 의 W1, b1 만 틀림\n# W2, b2 는 dX 와 무관 → 정상&lt;/span&gt;`};
function setCase(k){cur=k;$$(&#x27;#cases button&#x27;).forEach(b=&gt;b.classList.toggle(&#x27;sel&#x27;,b.dataset.k===k));}
function kv(){const v=CASES[cur].v;
  $(&#x27;#kv&#x27;).innerHTML=`&lt;span&gt;경우&lt;/span&gt;&lt;b style=&quot;color:var(--amber)&quot;&gt;${CASES[cur].name}&lt;/b&gt;`+KEYS.map(k=&gt;{if(shown[k]===undefined)return `&lt;span&gt;${k}&lt;/span&gt;&lt;b class=&quot;dim&quot;&gt;…&lt;/b&gt;`;const [t,c]=verdict(shown[k]);return `&lt;span&gt;${k}&lt;/span&gt;&lt;b style=&quot;color:${c}&quot;&gt;${fx(shown[k])}  ${t}&lt;/b&gt;`;}).join(&#x27;&#x27;)+`&lt;span&gt;망&lt;/span&gt;&lt;b&gt;784-10-10, seed 0, 훈련 3장&lt;/b&gt;`;
  setCode(`&lt;span class=&quot;c&quot;&gt;# ${CASES[cur].name}&lt;/span&gt;\n${DIFF[cur]}\n\nnet = TwoLayerNet(784, 10, 10)          &lt;span class=&quot;c&quot;&gt;# 6-3&lt;/span&gt;\ngrad_num = net.numerical_gradient(X[:3], t[:3])\ngrad_bp  = net.gradient(X[:3], t[:3])\nfor k in grad_bp:\n    print(k, rel_error(grad_bp[k], grad_num[k]))\n&lt;span class=&quot;g&quot;&gt;${KEYS.map(k=&gt;`# ${k} ${fx(v[k])}`).join(&#x27;\n&#x27;)}&lt;/span&gt;`);}
function stopAnim(){if(anim){clearTimeout(anim);anim=null;}}
async function runCase(k,ms=450){stopAnim();setCase(k);shown={};drawCh();kv();
  for(const p of KEYS){await sleep(ms);shown[p]=CASES[k].v[p];drawCh();kv();}
  const bad=KEYS.filter(p=&gt;shown[p]&gt;1e-2),sus=KEYS.filter(p=&gt;shown[p]&gt;=1e-7&amp;&amp;shown[p]&lt;=1e-2);
  setStatus(bad.length?&#x27;warn&#x27;:sus.length?&#x27;info&#x27;:&#x27;ok&#x27;,bad.length?`버그: ${bad.map(p=&gt;`${p} ${fx(shown[p])}`).join(&#x27;, &#x27;)} — 나머지는 통과`:sus.length?`모두 ≈ ${fx(shown.W1)} — 의심 구간 (일정한 비율 차이)`:`모두 &amp;lt; 1e-7 통과 (W1 ${fx(shown.W1)}, b1 ${fx(shown.b1)}, W2 ${fx(shown.W2)}, b2 ${fx(shown.b2)})`);}
$(&#x27;#cases&#x27;).innerHTML=&#x27;&lt;span class=&quot;lab&quot;&gt;경우:&lt;/span&gt;&#x27;+Object.entries(CASES).map(([k,c])=&gt;`&lt;button type=&quot;button&quot; data-k=&quot;${k}&quot;&gt;${c.name}&lt;/button&gt;`).join(&#x27;&#x27;);

// ---------- 라이브 데모 ----------
function rng(seed){let a=seed;return ()=&gt;{a=a+0x6D2B79F5|0;let t=Math.imul(a^a&gt;&gt;&gt;15,1|a);t=t+Math.imul(t^t&gt;&gt;&gt;7,61|t)^t;return((t^t&gt;&gt;&gt;14)&gt;&gt;&gt;0)/4294967296;};}
let seed=1,LD=null;
function gauss(r){let u=0;while(!u)u=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r());}
function newData(){const r=rng(seed);const g=()=&gt;gauss(r);LD={X:Array.from({length:9},g),W:Array.from({length:9},()=&gt;0.5*g()),b:Array.from({length:3},()=&gt;0.1*g()),t:[0,1,2].map(()=&gt;Math.floor(r()*3))};}
const N=3,Dd=3,Mm=3;
function fwd(P,eps){const {X,W,b,t}=P;let L=0;const Y=[];for(let n=0;n&lt;N;n++){const a=[0,1,2].map(j=&gt;b[j]+[0,1,2].reduce((s,i)=&gt;s+X[n*Dd+i]*W[i*Mm+j],0));const m=Math.max(...a),e=a.map(v=&gt;Math.exp(v-m)),s=e[0]+e[1]+e[2];const y=e.map(v=&gt;v/s);Y.push(y);L-=Math.log(y[t[n]]+eps);}return {L:L/N,Y};}
function analytic(P,bugMean,bugT){const {Y}=fwd(P,1e-12);const dout=[];for(let n=0;n&lt;N;n++)for(let j=0;j&lt;Mm;j++)dout.push((Y[n][j]-(j===P.t[n]?1:0))/N);
  const dW=new Array(9).fill(0),db=[0,0,0],dX=new Array(9).fill(0);
  for(let n=0;n&lt;N;n++)for(let j=0;j&lt;Mm;j++){db[j]+=dout[n*Mm+j]/(bugMean?N:1);for(let i=0;i&lt;Dd;i++){dW[i*Mm+j]+=P.X[n*Dd+i]*dout[n*Mm+j];dX[n*Dd+i]+=dout[n*Mm+j]*(bugT?P.W[j*Mm+i]:P.W[i*Mm+j]);}}
  return {W:dW,b:db,X:dX};}
function numerical(P,eps,h=1e-4){const out={};for(const k of [&#x27;W&#x27;,&#x27;b&#x27;,&#x27;X&#x27;]){const a=P[k],g=new Array(a.length);for(let i=0;i&lt;a.length;i++){const o=a[i];a[i]=o+h;const f1=fwd(P,eps).L;a[i]=o-h;const f2=fwd(P,eps).L;a[i]=o;g[i]=(f1-f2)/(2*h);}out[k]=g;}return out;}
const relE=(a,b)=&gt;{let d=0,x=0,y=0;a.forEach((v,i)=&gt;{d+=(v-b[i])**2;x+=v*v;y+=b[i]*b[i];});return Math.sqrt(d)/(Math.sqrt(x)+Math.sqrt(y)+1e-12);};
function live(){const bm=$(&#x27;#kMean&#x27;).checked,bt=$(&#x27;#kT&#x27;).checked,eps=$(&#x27;#kE&#x27;).checked?1e-7:1e-12;
  const a=analytic(LD,bm,bt),n=numerical(LD,eps);const R={W:relE(a.W,n.W),b:relE(a.b,n.b),X:relE(a.X,n.X)};
  const fm=(v,c)=&gt;{let s=&#x27;&#x27;;for(let i=0;i&lt;v.length;i+=c)s+=v.slice(i,i+c).map(x=&gt;(x&gt;=0?&#x27; &#x27;:&#x27;&#x27;)+x.toFixed(5)).join(&#x27; &#x27;)+&#x27;\n&#x27;;return s.trimEnd();};
  $(&#x27;#gm&#x27;).innerHTML=[[&#x27;dW 역전파&#x27;,fm(a.W,3)],[&#x27;dW 수치 미분&#x27;,fm(n.W,3)],[&#x27;db 역전파 / 수치&#x27;,fm(a.b,3)+&#x27;\n&#x27;+fm(n.b,3)]].map(([h,p])=&gt;`&lt;div&gt;&lt;h3&gt;${h}&lt;/h3&gt;&lt;pre&gt;${p}&lt;/pre&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
  $(&#x27;#lkv&#x27;).innerHTML=Object.entries(R).map(([k,v])=&gt;{const [t,c]=verdict(v);return `&lt;span&gt;rel_error d${k}&lt;/span&gt;&lt;b style=&quot;color:${c}&quot;&gt;${v.toExponential(2)}  ${t}&lt;/b&gt;`;}).join(&#x27;&#x27;)+`&lt;span&gt;loss&lt;/span&gt;&lt;b&gt;${fwd(LD,eps).L.toFixed(6)}&lt;/b&gt;&lt;span&gt;t&lt;/span&gt;&lt;b&gt;[${LD.t}]&lt;/b&gt;`;
  return R;}
window.__live=(bm=false,bt=false,e=false)=&gt;{$(&#x27;#kMean&#x27;).checked=bm;$(&#x27;#kT&#x27;).checked=bt;$(&#x27;#kE&#x27;).checked=e;return live();};
$(&#x27;#bLive&#x27;).onclick=()=&gt;{if(busy)return;const R=live();const bad=Object.entries(R).filter(([,v])=&gt;v&gt;1e-2);setStatus(bad.length?&#x27;warn&#x27;:Object.values(R).some(v=&gt;v&gt;=1e-7)?&#x27;info&#x27;:&#x27;ok&#x27;,`라이브: ${Object.entries(R).map(([k,v])=&gt;`d${k} ${v.toExponential(1)}`).join(&#x27;, &#x27;)}`);};
$(&#x27;#bNew&#x27;).onclick=()=&gt;{if(busy)return;seed++;newData();$(&#x27;#bLive&#x27;).click();};

 {n:&#x27;① 정상 — 모두 통과&#x27;,ex:&#x27;&lt;p&gt;784-10-10 망, 훈련 3장: W1 ≈ &lt;b class=&quot;green&quot;&gt;2.1e-10&lt;/b&gt;, b1 ≈ 5.0e-11, W2 ≈ 5.4e-11, b2 ≈ 3.9e-10 — 모두 1e-7 보다 훨씬 작아 &lt;b class=&quot;green&quot;&gt;통과&lt;/b&gt;. 남은 차이는 중앙 차분의 오차(h = 1e-4)와 부동소수점 반올림입니다.&lt;/p&gt;&lt;p&gt;수치 미분은 파라미터 7,960개 × 2번 손실 계산이라 느립니다 — 그래서 &lt;b class=&quot;amber&quot;&gt;작은 망, 몇 장의 데이터&lt;/b&gt;로만 검사하고, 통과하면 큰 망 학습에는 역전파만 씁니다. 노트북 &lt;code&gt;6-1 gradient&lt;/code&gt;, &lt;code&gt;6-2 rel_error&lt;/code&gt;, &lt;code&gt;6-3&lt;/code&gt;.&lt;/p&gt;&#x27;,
  run:async()=&gt;{await runCase(&#x27;ok&#x27;);window.__g1={...shown};}},
 {n:&#x27;② log 에 1e-7 을 더하면&#x27;,ex:&#x27;&lt;p&gt;cross-entropy 의 log 에 Day 2 처럼 &lt;code&gt;1e-7&lt;/code&gt; 을 더하면 모든 파라미터의 상대 오차가 &lt;b class=&quot;amber&quot;&gt;≈ 5e-7&lt;/b&gt; 로 똑같이 올라갑니다. 버그가 아니라 &lt;b&gt;손실 식이 미세하게 달라진 것&lt;/b&gt;: 수치 미분은 log(y + 1e-7) 을 미분하지만 역전파의 (Y − T)/N 은 log(y) 의 미분이라 y ≈ 0.1 에서 1e-7/y ≈ 1e-6 만큼 일정한 비율로 어긋납니다.&lt;/p&gt;&lt;p&gt;그래서 Day 3 부터는 &lt;b class=&quot;green&quot;&gt;1e-12&lt;/b&gt;. 모든 파라미터가 같은 크기로 어긋나면 &quot;식의 차이&quot;, 특정 파라미터만 크면 &quot;버그&quot; 로 읽으세요.&lt;/p&gt;&#x27;,
  run:async()=&gt;{await runCase(&#x27;eps&#x27;);window.__g2={...shown};}},
 {n:&#x27;③ 버그 ① db = dout.mean&#x27;,ex:&#x27;&lt;p&gt;&lt;code&gt;db = dout.mean(axis=0)&lt;/code&gt; — shape (M,) 가 sum 과 같아 &lt;b class=&quot;red&quot;&gt;오류 없이 실행&lt;/b&gt;됩니다. 값은 1/N 배 → N = 3 이면 rel = (1 − 1/3)/(1 + 1/3) = &lt;b class=&quot;red&quot;&gt;0.5&lt;/b&gt;. 그래프에서 b2 하나만 빨간 구역으로 튀어나옵니다 (명세 측정에서 나머지는 정상).&lt;/p&gt;&lt;p&gt;1/N 은 이미 SoftmaxWithLoss 의 (Y − T)/N 에 들어 있으니 Affine 에서는 &lt;b class=&quot;green&quot;&gt;sum&lt;/b&gt;. 노트북 &lt;code&gt;6-4&lt;/code&gt; 버그 찾기.&lt;/p&gt;&#x27;,

&lt;div class=&quot;app&quot;&gt;
  &lt;h1&gt;미니배치 SGD — 3클래스 나선 분류&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;직선 하나로는 못 나누는 나선 데이터(3클래스 × 100점)를 &lt;code&gt;TwoLayerNet(2, 100, 3)&lt;/code&gt; (Affine → ReLU → Affine → SoftmaxWithLoss) 으로 학습합니다. 매 epoch 마다 train 240점을 섞고(&lt;code&gt;rng.permutation&lt;/code&gt;) batch 크기만큼 잘라 &lt;b style=&quot;color:var(--amber)&quot;&gt;gradient → 업데이트&lt;/b&gt; 를 반복합니다. 배경색 = 모델이 예측한 클래스 (결정 경계), ● = train, ○ = test.&lt;/p&gt;

  &lt;div class=&quot;grid&quot;&gt;

function play(done){if(timer)return;if(ep&gt;=target)reset();onDone=done||null;const per=bs&gt;=240?2:1;

    const h=hist[hist.length-1];setStatus(&#x27;info&#x27;,`epoch ${ep} · iteration ${it.toLocaleString()} — loss ${h[1].toFixed(3)}, train ${h[2].toFixed(3)}, test ${h[3].toFixed(3)}`);
    if(ep&gt;=target){timer=null;info();finish();return;}timer=requestAnimationFrame(tick);};timer=requestAnimationFrame(tick);info();}
function finish(){const h=hist[hist.length-1];const good=h[2]&gt;=0.95;setStatus(good?&#x27;ok&#x27;:&#x27;warn&#x27;,`${ep} epoch (${it.toLocaleString()} iteration, batch ${bs}, lr ${lr}${shuffle?&#x27;&#x27;:&#x27;, 셔플 off&#x27;}): loss ${h[1].toFixed(3)}, train ${h[2].toFixed(3)}, test ${h[3].toFixed(3)}${good&amp;&amp;bs===30&amp;&amp;lr===1.0&amp;&amp;shuffle?&#x27; — 노트북 기준 0.988 / 0.983 과 비슷한 수준&#x27;:&#x27;&#x27;}`);
  window.__last={bs,lr,shuffle,ep,it,loss:h[1],train:h[2],test:h[3]};if(onDone){const f=onDone;onDone=null;f(window.__last);}}
$(&#x27;#bsb&#x27;).innerHTML=&#x27;&lt;span class=&quot;lab&quot;&gt;batch:&lt;/span&gt;&#x27;+[1,30,240].map(v=&gt;`&lt;button type=&quot;button&quot; data-v=&quot;${v}&quot;&gt;${v}${v===240?&#x27; (전체)&#x27;:&#x27;&#x27;}&lt;/button&gt;`).join(&#x27;&#x27;);
$(&#x27;#lrb&#x27;).innerHTML=&#x27;&lt;span class=&quot;lab&quot;&gt;lr:&lt;/span&gt;&#x27;+[0.1,1.0,5.0].map(v=&gt;`&lt;button type=&quot;button&quot; data-v=&quot;${v}&quot;&gt;${v.toFixed(1)}&lt;/button&gt;`).join(&#x27;&#x27;);
$$(&#x27;#bsb button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{bs=+b.dataset.v;reset();setStatus(&#x27;info&#x27;,`batch ${bs} → iters_per_epoch = 240 // ${bs} = ${ipe()}, 300 epoch = ${(ipe()*300).toLocaleString()} iteration. ▶ 재생`);});
$$(&#x27;#lrb button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{lr=+b.dataset.v;reset();setStatus(&#x27;info&#x27;,`lr = ${lr}. ▶ 재생`);});
$(&#x27;#shf&#x27;).onchange=e=&gt;{shuffle=e.target.checked;reset();setStatus(&#x27;info&#x27;,shuffle?&#x27;셔플 on: 매 epoch rng.permutation(240)&#x27;:&#x27;셔플 off: 클래스 0 → 1 → 2 순으로 정렬된 순서 그대로 (최악의 경우)&#x27;);};
$(&#x27;#bP&#x27;).onclick=()=&gt;{if(timer){stop();info();setStatus(&#x27;info&#x27;,`일시정지 — epoch ${ep}`);}else play();};
$(&#x27;#bE&#x27;).onclick=()=&gt;{stop();if(ep&gt;=target)return;oneEpoch();render();const h=hist[hist.length-1];setStatus(&#x27;info&#x27;,`epoch ${ep}: ${ipe()} iteration 실행 → loss ${h[1].toFixed(3)}, train ${h[2].toFixed(3)}, test ${h[3].toFixed(3)}`);};
$(&#x27;#bR&#x27;).onclick=()=&gt;{reset();setStatus(&#x27;info&#x27;,&#x27;초기화 — W 가 작아(0.01) 모든 확률 ≈ 1/3, loss ≈ ln 3 = 1.0986&#x27;);};
window.addEventListener(&#x27;resize&#x27;,render);
function cfg(b,l,s){bs=b;lr=l;shuffle=s;reset();}
const P=[
 {n:&#x27;① batch 30 · lr 1.0 · 300 epoch&#x27;,ex:&#x27;&lt;p&gt;노트북 7-2 설정: iters_per_epoch = 240 // 30 = &lt;b class=&quot;amber&quot;&gt;8&lt;/b&gt;, 300 epoch = &lt;b class=&quot;amber&quot;&gt;2,400 iteration&lt;/b&gt;. 처음엔 W 가 작아(0.01) 확률이 모두 ≈ 1/3, loss ≈ ln 3 = 1.099. epoch 10 쯤 경계가 굽기 시작하고, 50 에서 나선 모양을 대략 따라가며, 300 에서 거의 다 맞힙니다.&lt;/p&gt;&lt;p&gt;노트북(numpy) 기준: epoch 1: 1.097 / 0.33 / 0.35 · 10: 0.785 / 0.63 / 0.67 · 50: 0.277 / 0.87 / 0.82 · 200: 0.081 / 0.97 / 0.93 · &lt;b class=&quot;green&quot;&gt;300: 0.039 / 0.988 / 0.983&lt;/b&gt;. 브라우저는 난수가 달라 숫자는 조금 다르지만 같은 흐름입니다. 아래 스냅샷: epoch 1 / 10 / 50 / 300 결정 경계 (노트북 7-3).&lt;/p&gt;&#x27;,
  run:async()=&gt;{cfg(30,1.0,true);setStatus(&#x27;info&#x27;,&#x27;batch 30, lr 1.0, 셔플 on — 학습 시작&#x27;);play();}},
 {n:&#x27;② iteration 수 계산 (7-1)&#x27;,ex:&#x27;&lt;p&gt;&lt;b&gt;epoch&lt;/b&gt; = 훈련 데이터를 한 바퀴 다 보는 것, &lt;b&gt;iteration&lt;/b&gt; = 미니배치 하나로 한 번 업데이트하는 것. &lt;code&gt;iters_per_epoch = N // batch_size&lt;/code&gt;.&lt;/p&gt;&lt;p&gt;나선 N = 240: batch 1 → 240, batch 30 → &lt;b class=&quot;amber&quot;&gt;8&lt;/b&gt;, batch 240 → 1 (전체 배치 = Day 2 의 경사하강). MNIST N = 60,000, batch 100 → &lt;b class=&quot;amber&quot;&gt;600&lt;/b&gt; (D3-1 의 &quot;1 epoch = 600 step&quot;).&lt;/p&gt;&#x27;,
  run:async()=&gt;{stop();const rows=[[240,1],[240,30],[240,240],[60000,100]];let out=[];for(const [n,b] of rows){out.push(`N = ${n.toLocaleString()}, batch ${b} → ${Math.floor(n/b)}`);setStatus(&#x27;info&#x27;,out.join(&#x27; · &#x27;));await sleep(700);}
   setCode(`&lt;span class=&quot;c&quot;&gt;# 7-1&lt;/span&gt;\nfor N, batch_size in [(240, 1), (240, 30), (240, 240), (60000, 100)]:\n    print(N, batch_size, N // batch_size)\n&lt;span class=&quot;g&quot;&gt;# 240 1 240\n# 240 30 8\n# 240 240 1\n# 60000 100 600&lt;/span&gt;\n\n&lt;span class=&quot;c&quot;&gt;# 300 epoch × 8 = 2,400 iteration (나선)\n# 10 epoch × 600 = 6,000 iteration (MNIST, 8교시)&lt;/span&gt;`);
   setStatus(&#x27;ok&#x27;,&#x27;240 // 30 = 8 · 300 epoch × 8 = 2,400 iteration · MNIST 60,000 // 100 = 600&#x27;);window.__ipe=[240,8,1,600];}},
 {n:&#x27;③ 전체 배치 240&#x27;,ex:&#x27;&lt;p&gt;batch = N 이면 epoch 마다 업데이트가 &lt;b class=&quot;red&quot;&gt;1번&lt;/b&gt;뿐 → 300 epoch 동안 300번만 움직입니다 (batch 30 은 2,400번). 같은 epoch 수로 비교하면 훨씬 덜 학습됩니다 — 이 브라우저 실행에서 300 epoch 후 train 약 0.79.&lt;/p&gt;&lt;p&gt;기울기는 가장 정확하지만(잡음 없음) 계산 한 번이 크고 횟수가 적습니다. 미니배치는 &quot;적당히 정확한 기울기로 자주 움직이기&quot;.&lt;/p&gt;&#x27;,
  run:async()=&gt;{cfg(240,1.0,true);setStatus(&#x27;info&#x27;,&#x27;batch 240 (전체 배치) — 1 iteration/epoch&#x27;);play();}},
 {n:&#x27;④ batch 1 (lr 0.1)&#x27;,ex:&#x27;&lt;p&gt;batch 1 = 샘플 하나씩 (순수 SGD): epoch 당 &lt;b class=&quot;amber&quot;&gt;240 iteration&lt;/b&gt;. 같은 epoch 에서 업데이트가 30배 많아 epoch 기준으로는 빨리 배우지만, 미니배치 loss(회색 점)가 크게 &lt;b class=&quot;red&quot;&gt;요동&lt;/b&gt;칩니다. 샘플 하나의 기울기는 잡음이 커서 lr 을 0.1 로 낮췄습니다.&lt;/p&gt;&lt;p&gt;batch 1 에 lr 1.0 을 쓰면 이 브라우저 실행에서는 한쪽 클래스로 쏠린 채 학습이 안 됩니다 — 직접 눌러 보세요. 또 GPU · NumPy 의 행렬 연산을 못 살려 실제로는 느립니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{cfg(1,0.1,true);setStatus(&#x27;info&#x27;,&#x27;batch 1, lr 0.1 — 240 iteration/epoch&#x27;);play();}},
 {n:&#x27;⑤ lr 5.0 · lr 0.1&#x27;,ex:&#x27;&lt;p&gt;&lt;b class=&quot;red&quot;&gt;lr 5.0&lt;/b&gt;: 한 번에 너무 멀리 뛰어 loss 가 줄지 않고 정확도가 0.33 근처(한 클래스만 예측)에 머뭅니다. 큰 lr 로 ReLU 가 대부분 꺼져(죽은 ReLU) 회복을 못 하는 경우도 있습니다.&lt;/p&gt;&lt;p&gt;&lt;b class=&quot;amber&quot;&gt;lr 0.1&lt;/b&gt;: 안정적이지만 느려서 300 epoch 후에도 train 약 0.73 (이 브라우저 실행). 적당한 lr(1.0)이 가장 빠르게 수렴 — Day 4 에서 Adam 등으로 이 문제를 줄입니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{cfg(30,5.0,true);setStatus(&#x27;info&#x27;,&#x27;lr 5.0 — 학습 시작&#x27;);const r5=await new Promise(r=&gt;play(r));if(!r5)return;await sleep(1200);cfg(30,0.1,true);setStatus(&#x27;info&#x27;,&#x27;lr 0.1 — 학습 시작&#x27;);play();}},
 {n:&#x27;⑥ 셔플 off&#x27;,ex:&#x27;&lt;p&gt;셔플을 끄고 train 을 &lt;b class=&quot;amber&quot;&gt;클래스 순서(0 → 1 → 2)로 정렬&lt;/b&gt;한 채 자르면 각 미니배치가 한 클래스뿐입니다 → 업데이트마다 &quot;이번엔 0, 다음엔 1…&quot; 쪽으로 끌려가 loss 가 톱니처럼 요동하고 수렴이 늦어집니다 (이 브라우저 실행: epoch 50 에 train 약 0.55, 셔플 on 은 약 0.81).&lt;/p&gt;&lt;p&gt;그래서 &lt;code&gt;rng.permutation(N)&lt;/code&gt; 으로 &lt;b class=&quot;green&quot;&gt;매 epoch 섞습니다&lt;/b&gt;. 데이터 파일은 흔히 클래스별로 정렬되어 저장되므로 셔플은 필수 습관.&lt;/p&gt;&#x27;,
  run:async()=&gt;{cfg(30,1.0,false);setStatus(&#x27;info&#x27;,&#x27;셔플 off (클래스 순 정렬) — 학습 시작&#x27;);play();}},
];
initPresets(P,stop);
reset();

&lt;body&gt;
&lt;div class=&quot;app&quot;&gt;
  &lt;h1&gt;미니 프로젝트 — MNIST 2층 MLP (784-100-10)&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;오늘 만든 계층을 쌓은 &lt;code&gt;TwoLayerNet(784, 100, 10)&lt;/code&gt; 을 batch 100, lr 0.1 로 &lt;b style=&quot;color:var(--amber)&quot;&gt;10 epoch&lt;/b&gt; (6,000 iteration) 학습한 결과입니다. 학습된 가중치를 &lt;b style=&quot;color:var(--purple)&quot;&gt;int8&lt;/b&gt; 로 줄여 이 페이지에 넣었으므로, 브라우저가 직접 순전파 &lt;code&gt;softmax(relu(X @ W1 + b1) @ W2 + b2)&lt;/code&gt; 를 계산합니다. 샘플을 누르거나 숫자를 직접 그려 보세요.&lt;/p&gt;
  &lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill teal&quot;&gt;X = x.reshape(-1, 784) / 255.0&lt;/span&gt;&lt;span class=&quot;pill blue&quot;&gt;첫 손실 ≈ ln 10 = 2.3026&lt;/span&gt;&lt;span class=&quot;pill green&quot;&gt;10 epoch: train 0.9747 · test 0.9694&lt;/span&gt;&lt;span class=&quot;pill amber&quot;&gt;채점 기준 test ≥ 0.95&lt;/span&gt;&lt;span class=&quot;pill purple&quot;&gt;int8 가중치: test 0.9692&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;

<script>
const ids = [...document.querySelectorAll('nav button')].map(b => b.dataset.id);
function fit(fr) {
  try {
    const d = fr.contentDocument; if (!d || !d.body) return;
    fr.style.height = Math.max(600, d.documentElement.scrollHeight) + 'px';
  } catch (e) {}
}
function show(id, push) {
  if (!ids.includes(id)) id = ids[0];
  document.querySelectorAll('section.lesson').forEach(s => s.classList.toggle('active', s.id === id));
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-current', b.dataset.id === id ? 'true' : 'false'));
  const sec = document.getElementById(id);
  document.title = sec.dataset.title + ' — Neural Network Day 3';
  const fr = sec.querySelector('iframe');
  fr.loading = 'eager'; fit(fr);
  if (push) history.replaceState(null, '', '#' + id);
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('section.lesson iframe').forEach(fr => {
  fr.addEventListener('load', () => {
    fit(fr);
    try {
      new ResizeObserver(() => fit(fr)).observe(fr.contentDocument.body);
      fr.contentDocument.addEventListener('keydown', key);   // iframe 안에서도 ← → 동작
    } catch (e) {}
  });
});
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.id, true));
function key(e) {
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const cur = ids.indexOf(location.hash.slice(1) || ids[0]);
  if (e.key === 'ArrowRight' && cur < ids.length - 1) show(ids[cur + 1], true);
  if (e.key === 'ArrowLeft' && cur > 0) show(ids[cur - 1], true);
}
document.addEventListener('keydown', key);
window.addEventListener('resize', () => document.querySelectorAll('section.lesson.active iframe').forEach(fit));
show(location.hash.slice(1), false);
</script>
