<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCU Day 1 개념 워크시트 — ESP32 빌드 과정과 디지털 I/O</title>
<style>
  :root{--bg:#0b1220;--panel:#111a2e;--line:#1f2b45;--text:#dbe4f0;--dim:#8a9bb8;--amber:#f5b942;--teal:#2dd4bf;--blue:#60a5fa;--green:#4ade80;--red:#f87171;--purple:#c084fc;--mono:"Consolas","D2Coding","JetBrains Mono",monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR","Segoe UI",sans-serif;font-size:15px;line-height:1.55}
  .app{max-width:900px;margin:0 auto;padding:22px 20px 40px}
  h1{color:var(--amber);font-size:24px;margin:0 0 6px}
  .sub{color:var(--dim);margin:0 0 14px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
  .panel h2{font-size:14px;color:var(--dim);margin:0 0 10px;font-weight:600}
  button{background:#172239;border:1px solid #2a3a5c;color:var(--text);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--amber)}button.active{background:#3a2e12;border-color:var(--amber);color:var(--amber)}
  button.primary{background:#123d33;border-color:var(--teal);color:var(--teal);font-weight:700;padding:9px 18px;font-size:14px}
  button.submit{background:#3a2e12;border-color:var(--amber);color:var(--amber);font-weight:700;padding:9px 18px;font-size:14px}
  button:disabled{opacity:.45;cursor:default}
  button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  input[type=text]{background:#0a0f1c;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-family:var(--mono);font-size:14px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px}
  .tabs button .s{font-family:var(--mono);font-size:11px;color:var(--dim);margin-left:6px}
  .tabs button.graded .s{color:var(--green)}
  .head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .head .t{color:var(--amber);font-size:17px}
  .head .a{font-size:13px;color:var(--teal);font-family:var(--mono)}
  .q{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#0e1628}
  .q.unans{border-color:#5a3a1a}
  .q .n{font-family:var(--mono);color:var(--dim);font-size:12px}
  .q .p{margin:4px 0 10px;font-size:15px}
  .q .p code,.opt code,.fb code,td code{font-family:var(--mono);color:var(--blue);background:#0a0f1c;padding:1px 5px;border-radius:4px}
  .q pre.qc{font-family:var(--mono);background:#0a0f1c;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:6px;padding:10px 12px;margin:4px 0 12px;font-size:13.5px;line-height:1.5;white-space:pre;overflow-x:auto;color:#dbe4f3}
  .q pre{font-family:var(--mono);background:#0a0f1c;border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:6px 0 10px;font-size:14px;white-space:pre;overflow-x:auto}
  .opts{display:grid;gap:6px}
  .opt{text-align:left;padding:8px 12px;font-size:14px;font-family:inherit}
  .opt.sel{border-color:var(--amber);background:#1f1a0c}
  .opt.ok{border-color:var(--green);color:var(--green);background:#0d2216}
  .opt.bad{border-color:var(--red);color:var(--red);background:#2a1212}
  .opt:disabled{cursor:default;opacity:.9}
  .fb{margin-top:8px;font-size:13px;color:var(--dim);border-left:3px solid var(--line);padding-left:10px}
  .fb.ok{border-left-color:var(--green)}.fb.bad{border-left-color:var(--red)}
  .fb .anim{color:var(--teal);font-family:var(--mono);font-size:12px;display:block;margin-top:3px}
  .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
  .code{font-family:var(--mono);font-size:20px;color:var(--amber);letter-spacing:1px}
  .score{font-family:var(--mono);color:var(--green);font-size:16px}
  .hint{color:var(--dim);font-size:13px}
  details{color:var(--dim);font-size:13px}
  details summary{cursor:pointer;color:var(--dim)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  /* dialog */
  dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:0;max-width:820px;width:92vw;max-height:88vh}
  dialog::backdrop{background:#000a}
  .dg{padding:18px 20px}
  .dg h3{color:var(--amber);margin:0 0 4px;font-size:20px}
  .dg .meta{color:var(--dim);font-size:13px;margin-bottom:12px;font-family:var(--mono)}
  .dg .sec{margin:14px 0 6px;color:var(--teal);font-weight:700;font-size:14px}
  .dg table{width:100%;border-collapse:collapse;font-size:13px}
  .dg th{text-align:left;color:var(--dim);font-weight:600;padding:5px 8px;border-bottom:1px solid var(--line);font-size:12px}
  .dg td{padding:5px 8px;border-bottom:1px solid #16203a;vertical-align:top}
  .dg td.r{font-family:var(--mono)}
  .dg .ok{color:var(--green)}.dg .bad{color:var(--red)}.dg .none{color:var(--dim)}
  .dg .sum{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0;font-family:var(--mono)}
  .dgbar{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 20px;display:flex;gap:8px;justify-content:flex-end;align-items:center}
  .toast{color:var(--green);font-size:13px;margin-right:auto}
  .body{overflow:auto;max-height:calc(88vh - 60px)}
</style>
</head>
<body>
<div class="app">
  <h1>MCU Day 1 개념 워크시트</h1>
  <p class="sub">ESP32 빌드 과정과 디지털 I/O · 8교시 × 10문항. 🎬 표시는 index.html 의 애니메이션 번호입니다. 답을 고른 뒤 아래 <b style="color:var(--teal)">채점하기</b>를 누르면 정오·해설과 결과 코드가 나타납니다. 채점 전에는 답을 바꿀 수 있고, 채점 후에는 잠깁니다. 모든 교시를 마치면 <b style="color:var(--amber)">제출</b>로 오답 정리를 열고, <b>캡처</b>로 복사해 노션에 붙여 넣으세요.</p>

  <div class="panel">
    <div class="row"><label style="color:var(--dim);font-size:13px">이름 <input type="text" id="name" placeholder="홍길동"></label><span class="hint">이름은 결과 코드 계산에만 쓰이며 저장되지 않습니다.</span></div>
  </div>
  <div class="panel"><h2>교시</h2><div class="tabs" id="tabs"></div></div>
  <div class="panel" id="sheet"></div>
  <div class="panel">
    <div class="actions">
      <button class="primary" id="gradeBtn">채점하기</button>
      <span class="code" id="rcode">—</span><span class="score" id="rscore"></span><span class="hint" id="rhint"></span>
      <button class="submit" id="submitBtn" style="margin-left:auto">제출</button>
    </div>
  </div>
</div>

<dialog id="dlg">
  <div class="body"><div class="dg" id="dgBody"></div></div>
  <div class="dgbar"><span class="toast" id="toast"></span><button id="captureBtn" class="primary">📋 캡처 (노션용 복사)</button><button id="closeBtn">닫기</button></div>
</dialog>

<script>
const $=s=>document.querySelector(s);
const Q=[{"t": "1교시 · MCU · ESP32 구조", "anim": "D1-1 핀맵 · 칩 구조", "qs": [{"p": "MCU 와 PC 의 차이로 옳은 것은 무엇입니까?", "o": ["MCU 는 CPU · 메모리 · 입출력이 한 칩에 있고 OS 없이 바로 돈다", "MCU 는 Linux 같은 운영체제 위에서만 프로그램을 실행할 수 있다", "MCU 는 화면과 키보드가 연결되어 있어야만 동작할 수 있다", "MCU 는 부품이 따로 나뉘어 있어 PC 보다 전력을 훨씬 많이 쓴다"], "a": 0, "w": "MCU 는 CPU, SRAM, Flash, GPIO 등을 칩 하나에 넣은 것입니다. OS 없이 부팅 1초 안에 우리 코드가 실행되고, 전력은 mW 단위입니다.", "an": "1교시 슬라이드 · MCU 란?"}, {"p": "ESP32 칩의 CPU 구성으로 옳은 것은 무엇입니까?", "o": ["싱글코어 최대 80MHz", "쿼드코어 최대 1.2GHz", "듀얼코어 최대 240MHz", "싱글코어 최대 16MHz"], "a": 2, "w": "Xtensa LX6 듀얼코어, 최대 240MHz 입니다. 16MHz 는 Arduino Uno(ATmega328P) 입니다.", "an": "D1-1 · 칩 블록도 Core 0 / Core 1"}, {"p": "오늘 우리가 쓴 setup() 과 loop() 는 어느 코어에서 실행됩니까?", "o": ["Core 0 (Wi-Fi 코어)", "ROM 부트 코드 안", "두 코어에서 동시에", "Core 1 (loopTask)"], "a": 3, "w": "Arduino-ESP32 는 loopTask 를 core 1 에 만들어 setup/loop 를 실행합니다. Core 0 은 주로 Wi-Fi · Bluetooth 처리를 맡습니다.", "an": "D1-1 · 칩 블록도 Core 1"}, {"p": "칩(ESP32-D0WD) 에 4MB Flash · 크리스털 · 안테나 커넥터를 더해 금속 캔으로 덮은 단위를 무엇이라 합니까?", "o": ["개발 보드 (DevKit)", "모듈 (ESP-32U)", "브레드보드 (830홀)", "쉴드 (확장 보드)"], "a": 1, "w": "칩 → 모듈(ESP-32U) → 개발 보드(DevKit: 모듈 + CP2102 + 레귤레이터 + 버튼 + 핀 헤더) 순서입니다.", "an": "D1-1 · 칩→모듈→보드"}, {"p": "모듈 이름 ESP-32U 의 \"U\" 가 뜻하는 것과, 그 때문에 주의할 점은 무엇입니까?", "o": ["외부 안테나형 — Wi-Fi 를 쓸 때 안테나를 꽂는다", "USB 내장형 — 따로 USB 케이블을 꽂을 필요가 없다", "Ultra 저전력형 — USB 대신 배터리로만 전원을 준다", "UART 전용형 — Wi-Fi · Bluetooth 가 들어 있지 않다"], "a": 0, "w": "U 모델은 기판 안테나 대신 U.FL 커넥터가 있습니다. Day 4 Wi-Fi 실습 전에 외부 안테나를 꽂습니다.", "an": "D1-1 · 칩 블록도 Wi-Fi"}, {"p": "보드 위의 CP2102 칩이 하는 일은 무엇입니까?", "o": ["USB 5V 를 3.3V 전원으로 낮춘다", "Wi-Fi 안테나 신호를 증폭해 준다", "USB 와 UART 신호를 서로 바꾼다", "업로드한 프로그램을 저장해 둔다"], "a": 2, "w": "PC 의 COM 포트가 바로 이 칩입니다. 업로드와 시리얼 모니터 데이터가 USB ↔ UART 로 변환되어 오갑니다.", "an": "D1-1 · 칩→모듈→보드"}, {"p": "다음 중 LED 를 연결해도 켤 수 없는 핀은 무엇입니까?", "o": ["GPIO 25", "GPIO 27", "GPIO 4", "GPIO 34"], "a": 3, "w": "GPIO 34~39 는 입력 전용입니다. 출력 회로가 없어 digitalWrite 를 해도 아무 일도 일어나지 않습니다.", "an": "D1-1 · 핀맵 34 핀"}, {"p": "보드 표기 CLK, D0, D1, D2, D3, CMD 핀(GPIO 6~11)을 쓰면 안 되는 이유는 무엇입니까?", "o": ["이 핀들은 5V 로만 동작하는 핀이라서", "내부 SPI Flash 에 연결된 핀이라서", "UART0 가 이 핀들을 쓰고 있어서", "이 핀들은 입력 전용 핀이라서"], "a": 1, "w": "무엇이든 연결하면 부팅이 멈추거나 무한 리셋됩니다. 칩 블록도의 SPI 한 채널이 Flash 전용입니다.", "an": "D1-1 · Flash 핀 · SPI 블록"}, {"p": "ESP32 GPIO 의 논리 전압과 이에 따른 규칙으로 옳은 것은 무엇입니까?", "o": ["3.3V 로직 — 5V 신호를 직접 넣지 않는다", "5V 로직 — 5V 센서를 그대로 연결해도 된다", "1.8V 로직 — LED 는 트랜지스터로만 켠다", "12V 로직 — 모터를 바로 연결할 수 있다"], "a": 0, "w": "ESP32 는 3.3V 칩입니다. 5V 출력 센서(HC-SR04 Echo, MQ-2 AO)는 Day 2 에서 분압해서 연결합니다.", "an": "1교시 · 전압 안전 3원칙"}, {"p": "아래 함수가 is_safe_output(15) 에 대해 반환하는 값은 무엇입니까?", "o": ["1", "15", "0", "컴파일 에러"], "a": 2, "w": "15 는 STRAP_PINS 목록에 있으므로 in_list 가 1 을 반환하고, 함수는 0 을 반환합니다.", "an": "1교시 빈칸 1-1", "c": "const int STRAP_PINS[] = {0, 2, 5, 12, 15};\nint is_safe_output(int pin) {\n    if (pin &gt;= 34 &amp;&amp; pin &lt;= 39) return 0;\n    if (in_list(pin, STRAP_PINS, 5)) return 0;\n    return 1;\n}"}]}, {"t": "2교시 · 설치 · 연결 · 빌드", "anim": "D1-2 설치 · USB 연결 · 빌드", "qs": [{"p": "Arduino IDE 의 \"추가 보드 관리자 URL\" 에 아래 주소를 넣는 이유는 무엇입니까?", "o": ["Arduino IDE 본체를 최신 버전으로 업데이트하려고", "설치된 라이브러리를 한 번에 정리하려고", "CP2102 USB 드라이버를 자동으로 설치하려고", "ESP32 보드 패키지를 보드 매니저가 찾게 하려고"], "a": 3, "w": "이 URL 을 넣어야 보드 매니저 검색에 esp32 by Espressif Systems 가 나타납니다.", "an": "따라하기 A-3 · D1-2 체크리스트", "c": "https://espressif.github.io/arduino-esp32/package_esp32_index.json"}, {"p": "보드 매니저에서 \"esp32\" 를 검색했더니 두 항목이 나옵니다. 이 과정에서 설치할 것은 무엇입니까?", "o": ["Arduino ESP32 Boards (Arduino 제작)", "esp32 by Espressif Systems 3.x", "두 항목을 모두 설치한다", "아무것도 설치하지 않아도 된다"], "a": 1, "w": "Arduino ESP32 Boards 는 Arduino Nano ESP32 전용입니다. 2.x 를 설치하면 7교시 ledcAttach 가 컴파일되지 않습니다.", "an": "따라하기 A-4"}, {"p": "Windows 계정 이름이 한글(C:\\Users\\홍길동\\…)일 때 권장되는 조치는 무엇입니까?", "o": ["스케치북 위치를 영문 경로로", "한글 경로를 그대로 두고 쓴다", "Windows 계정 이름을 새로 만든다", "Arduino IDE 1.x 버전으로 바꾼다"], "a": 0, "w": "한글 · 공백 경로는 빌드 오류의 가장 흔한 원인입니다. 파일 → 기본 설정 → 스케치북 위치.", "an": "따라하기 A-2"}, {"p": "Micro USB(Micro-B) 플러그가 단자에 잘 들어가지 않습니다. 올바른 입을 돕습니다.", "an": "따라하기 B-3"}]}, {"t": "3교시 · 배선 · Digital Output", "anim": "D1-3 따라 꽂기 · LED · 신호등", "qs": [{"p": "브레드보드의 a4 구멍에 꽂은 선과 전기적으로 이어진 곳은 어디입니까?", "o": ["a1 ~ a63 가로 한 줄 전체", "4열의 a ~ e 세로 다섯 칸", "4열의 a ~ j 세로 열 칸", "위쪽 빨간 + 레일 한 줄"], "a": 1, "w": "같은 열의 a~e 다섯 칸이 속에서 이어져 있고 가운데 홈에서 끊깁니다. 레일만 가로 한 줄 전체가 이어져 있습니다.", "an": "D1-3 · 구멍 누르기"}, {"p": "LED 회로에서 저항을 e4 – f4 처럼 가운데 홈을 건너 꽂는 이유는 무엇입니까?", "o": ["홈 위아래가 끊겨 있어 이어 주려고", "저항 색띠를 읽기 쉽게 보이려고", "저항에 방향이 있어서 맞추려고", "저항의 열을 공기로 식혀 주려고"], "a": 0, "w": "전류 경로: GPIO25 → a4 ━ e4 → 저항 → f4 ━ g4 → LED → g5 ━ j5 → − 레일 → GND.", "an": "D1-3 · 따라 꽂기 ① · 그림 2"}, {"p": "빨강 LED 를 g4 · g5 에 꽂을 때 올바른 방향은 무엇입니까?", "o": ["긴 다리(+)를 g5, 짧은 다리를 g4", "방향과 상관없이 아무렇게나", "긴 다리(+)를 g4, 짧은 다리를 g5", "두 다리를 모두 g4 한 칸에"], "a": 2, "w": "LED 는 방향이 있는 다이오드입니다. 긴 다리(+)가 전류가 들어오는 저항 쪽, 짧은 다리가 GND 쪽.", "an": "D1-3 · 따라 꽂기 ②"}, {"p": "ESP32 DevKit 을 브레드보드에 직접 꽂지 않고 옆에 두고 M-F 점퍼선으로 연결하는 이유는 무엇입니까?", "o": ["ESP32 가 뜨거워져 브레드보드가 녹아서", "브레드보드 레일에 5V 가 흐르고 있어서", "M-F 점퍼선이 M-M 보다 접촉 저항이 작아서", "보드 폭이 넓어 한쪽 핀에 꽂을 곳이 없어서"], "a": 3, "w": "M-F 점퍼의 구멍 쪽을 ESP32 핀에, 핀 쪽을 브레드보드 a행에 꽂습니다.", "an": "D1-3 · 따라 꽂기 ⑦"}, {"p": "빨강 LED(Vf 2.0V)에 220Ω 을 연결했을 때 흐르는 전류는 약 얼마입니까? (GPIO 3.3V)", "o": ["0.6mA", "5.9mA", "15mA", "33mA"], "a": 1, "w": "(3.3 − 2.0) ÷ 220 ≈ 0.0059A = 5.9mA 입니다.", "an": "D1-3 · LED 전류 220Ω"}, {"p": "LED 에 저항 없이 GPIO 를 직접 연결하면 안 되는 이유는 무엇입니까?", "o": ["LED 가 아예 켜지지 않게 되어서", "전류를 제한할 것이 없어 손상돼서", "컴파일 단계에서 에러가 발생해서", "LED 색이 흐리게 바뀌어 버려서"], "a": 1, "w": "저항이 전류를 정합니다. 저항이 없으면 핀 한계를 넘는 전류가 흐를 수 있습니다.", "an": "D1-3 · 저항 0Ω"}, {"p": "아래 코드에서 N_LED 의 값은 얼마입니까?", "o": ["3", "12", "4", "27"], "a": 0, "w": "sizeof(LED_PINS) 는 12바이트, sizeof(LED_PINS[0]) 은 4바이트이므로 3 입니다.", "an": "3교시 예제 3-2", "c": "const int LED_PINS[] = {25, 26, 27};\nconst int N_LED = sizeof(LED_PINS) / sizeof(LED_PINS[0]);"}, {"p": "pinMode(25, OUTPUT) 을 빠뜨리고 digitalWrite(25, HIGH) 만 하면 어떻게 됩니까?", "o": ["출력 설정이 안 돼 거의 안 켜진다", "컴파일 에러가 나서 업로드가 안 된다", "정상적으로 밝게 켜진다", "ESP32 가 계속 리셋된다"], "a": 0, "w": "핀 방향(출력 활성화)은 pinMode 가 설정합니다.", "an": "3교시 예제 3-2"}, {"p": "신호등 코드에서 state 선언의 static 을 빼면 어떤 일이 생깁니까?", "o": ["초록만 계속 켜진다", "순서가 거꾸로 돈다", "빨강만 계속 반복된다", "컴파일 에러가 난다"], "a": 2, "w": "loop() 가 불릴 때마다 지역 변수 state 가 ST_RED 로 다시 초기화됩니다.", "an": "D1-3 · 신호등 static 끄기", "c": "void loop() {\n    light_t state = ST_RED;      // static 없음\n    switch (state) { ... state = ST_GREEN; ... }\n}"}, {"p": "typedef enum { ST_RED, ST_GREEN, ST_YELLOW } light_t; 에서 ST_YELLOW 의 정수값은 얼마입니까?", "o": ["0", "1", "2", "3"], "a": 2, "w": "enum 은 따로 지정하지 않으면 0 부터 1 씩 증가합니다. 8교시에 이 값을 배열 인덱스로 씁니다.", "an": "3교시 예제 3-3"}]}, {"t": "4교시 · 레지스터 직접 제어", "anim": "D1-4 W1TS / W1TC 비트 뷰어", "qs": [{"p": "아래 코드 실행 후 reg 의 값은 무엇입니까?", "o": ["0x0A000000", "0x02000000", "0x08000000", "0x0E000000"], "a": 0, "w": "25번(0x02000000)과 27번(0x08000000) 비트를 OR 하면 0x0A000000 입니다.", "an": "4교시 예제 4-1 · D1-4", "c": "uint32_t reg = 0;\nreg |= (1UL &lt;&lt; 25);\nreg |= (1UL &lt;&lt; 27);"}, {"p": "이어서 아래 한 줄을 실행하면 reg 는 어떻게 됩니까?", "o": ["0x0A000000 그대로", "0", "0x02000000", "0x08000000"], "a": 3, "w": "&amp; ~ 로 25번 비트만 끕니다. 27번 비트만 남습니다.", "an": "4교시 예제 4-1", "c": "reg &amp;= ~(1UL &lt;&lt; 25);"}, {"p": "REG_WRITE(GPIO_OUT_W1TS_REG, 1UL &lt;&lt; 26) 의 동작은 무엇입니까?", "o": ["26번 핀만 끈다", "26번 핀만 켠다", "26번만 켜고 나머지는 끈다", "26번 핀을 입력으로 바꾼다"], "a": 1, "w": "W1TS = Write 1 To Set. 1 인 비트의 핀만 HIGH 가 되고 나머지는 그대로입니다.", "an": "D1-4 · W1TS"}, {"p": "W1TC 레지스터에 0x0C000000 을 쓰면 어떤 핀이 꺼집니까?", "o": ["26, 27", "25, 26", "2, 3", "12, 14"], "a": 0, "w": "0x0C000000 은 bit 26 과 bit 27 입니다.", "an": "D1-4 · W1TC"}, {"p": "13번 핀이 켜져 있는 상태에서 아래를 실행하면 13번 핀은 어떻게 됩니까?", "o": ["꺼진다", "계속 켜져 있다", "한 번 깜빡인다", "입력으로 바뀐다"], "a": 0, "w": "GPIO_OUT_REG 는 32비트 전체를 덮어씁니다. 마스크에 없는 핀은 0 이 됩니다.", "an": "4교시 예제 4-4 · D1-4 덮어쓰기", "c": "REG_WRITE(GPIO_OUT_REG, 1UL &lt;&lt; 25);"}, {"p": "W1TS/W1TC 방식이 GPIO_OUT_REG 에 읽고-수정-쓰기 하는 방식보다 안전한 이유는 무엇입니까?", "o": ["전력을 덜 써서 배터리 수명이 길어져서", "컴파일러가 자동으로 최적화해 주어서", "다른 핀을 읽지 않아 끼어들어도 안전해서", "32번 이상 핀까지 한 번에 제어할 수 있 ", "millis() == wait_ms + t_mark", "millis() &gt;= wait_ms (t_mark 없이)", "millis() - t_mark &gt;= wait_ms"], "a": 3, "w": "상태에 들어온 시각(t_mark)부터의 경과 시간을 뺄셈으로 비교합니다. 5교시 millis() 비교와 같은 방식입니다.", "an": "8교시 정답 8-A", "c": "if (____) {\n    digitalWrite(PIN_LED, HIGH);\n    t_mark = millis();\n    return ST_GO;\n}"}, {"p": "on_go() 에서 반응 시간을 계산하는 식으로 옳은 것은 무엇입니까?", "o": ["reaction_ms = millis();", "reaction_ms = millis() - t_mark;", "reaction_ms = t_mark - millis();", "reaction_ms = wait_ms + t_mark;"], "a": 1, "w": "LED 를 켜면서 t_mark 를 갱신했으므로 그 시각부터의 경과가 반응 시간입니다.", "an": "8교시 정답 8-A"}, {"p": "best_ms 를 UINT32_MAX 로 초기화하는 이유는 무엇입니까?", "o": ["첫 기록이 무조건 신기록이 되게", "덧셈 오버플로를 미리 막으려고", "0 으로 나누는 오류를 막으려고", "C 언어 규칙이 그렇게 요구해서"], "a": 0, "w": "최솟값을 찾을 때 가능한 가장 큰 값에서 시작하는 관용구입니다.", "an": "8교시 종합 과제 8-A"}, {"p": "모든 상태를 switch 하나에 넣는 대신 함수 포인터 표를 쓰는 장점은 무엇입니까?", "o": ["switch 보다 실행이 항상 더 빠르다", "프로그램이 쓰는 메모리가 0 이 된다", "상태 코드가 함수로 나뉘어 추가가 쉽다", "ISR 안에서만 쓸 수 있는 방식이다"], "a": 2, "w": "상태 추가 = 함수 하나 + enum 이름 하나 + 표 한 칸.", "an": "8교시 예제 8-1"}, {"p": "on_idle() 에서 random(1000, 4001) 이 반환할 수 있는 범위는 무엇입니까?", "o": ["1000 ~ 4001", "1000 ~ 4000", "0 ~ 4000", "1001 ~ 4000"], "a": 1, "w": "Arduino random(min, max) 는 min 이상 max 미만을 반환합니다.", "an": "8교시 종합 과제 8-A", "c": "wait_ms = random(1000, 4001);"}, {"p": "확장 과제로 2인 대결(버튼 2개)을 만들 때 가장 알맞은 설계는 무엇입니까?", "o": ["button_pressed 함수를 두 개 복사한다", "delay 로 두 버튼을 번갈아 읽는다", "ISR 안에서 승자를 바로 출력한다", "button_t 배열로 같은 함수를 재사용한다"], "a": 3, "w": "5교시에서 구조체 포인터로 만든 함수를 그대로 재사용합니다.", "an": "8교시 확장 과제"}]}];
let tab=0;const ans=Q.map(s=>s.qs.map(()=>null));const graded=Q.map(()=>false);
function hash(s){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return h.toString(16).padStart(8,'0').slice(-4);}
function codeFor(name,t,score){return `${t}${'ABCDEFGHIJK'[10-score]||'K'}-${hash(`${name.trim()}|${t}|${score}|mcu-day1`)}`;}
function scoreOf(i){return ans[i].filter((a,k)=>a===Q[i].qs[k].a).length;}
function strip(h){const d=document.createElement('div');d.innerHTML=h;return d.textContent;}
function renderTabs(){$('#tabs').innerHTML=Q.map((s,i)=>{const n=ans[i].filter(a=>a!==null).length;return `<button class="${i===tab?'active':''} ${graded[i]?'graded':''}" data-i="${i}">${i+1}교시<span class="s">${graded[i]?scoreOf(i)+'/10':n+'/10'}</span></button>`;}).join('');$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=+b.dataset.i;render();window.scrollTo({top:0});});}
function render(){renderTabs();const s=Q[tab];const g=graded[tab];
  $('#sheet').innerHTML=`<div class="head"><span class="t">${s.t}</span><span class="a">🎬 ${s.anim}</span></div>`+s.qs.map((q,k)=>{const a=ans[tab][k];
    return `<div class="q ${g&&a===null?'unans':''}"><div class="n">문항 ${k+1}</div><div class="p">${q.p}</div>${q.c?`<pre class="qc">${q.c}</pre>`:``}<div class="opts">${q.o.map((o,j)=>{let cls='';if(g){if(j===q.a)cls='ok';else if(j===a)cls='bad';}else if(j===a)cls='sel';return `<button class="opt ${cls}" data-k="${k}" data-j="${j}" ${g?'disabled':''}>${'①②③④'[j]} ${o}</button>`;}).join('')}</div>${g?`<div class="fb ${a===q.a?'ok':'bad'}">${a===null?'미응답. ':(a===q.a?'정답. ':'오답. ')}${q.w}<span class="anim">확인: ${q.an}</span></div>`:''}</div>`;}).join('');
  $('#sheet').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k,j=+b.dataset.j;ans[tab][k]=(ans[tab][k]===j?null:j);render();});
  $('#gradeBtn').disabled=g;$('#gradeBtn').textContent=g?'채점 완료':'채점하기';
  const nm=$('#name').value;
  if(g){const sc=scoreOf(tab);$('#rscore').textContent=`${sc}/10`;if(nm.trim()){$('#rcode').textContent=codeFor(nm,tab+1,sc);$('#rhint').textContent='결과 코드';}else{$('#rcode').textContent='—';$('#rhint').textContent='이름을 입력하면 결과 코드가 나옵니다.';}}
  else{$('#rcode').textContent='—';$('#rscore').textContent='';const n=ans[tab].filter(a=>a!==null).length;$('#rhint').textContent=`${tab+1}교시: ${n}/10 골랐습니다. 채점하기를 누르면 잠깁니다.`;}
}
$('#gradeBtn').onclick=()=>{const n=ans[tab].filter(a=>a!==null).length;if(n<10&&!confirm(`아직 ${10-n}문항을 고르지 않았습니다. 그래도 채점할까요? (미응답은 오답 처리)`))return;graded[tab]=true;render();};
$('#name').addEventListener('input',render);

/* ── 제출 대화상자 ── */
let lastHtml='',lastText='';
function buildReport(){
  const nm=$('#name').value.trim()||'(이름 없음)';const ds=new Date().toLocaleString('ko-KR');
  let h=`<h3>MCU Day 1 개념 워크시트 — 오답 정리</h3><div class="meta">${nm} · ${ds}</div>`;
  let t=`MCU Day 1 개념 워크시트 — 오답 정리\n이름: ${nm}\n일시: ${ds}\n\n`;
  let any=false;
  Q.forEach((s,i)=>{if(!graded[i])return;
    const wrong=s.qs.map((q,k)=>({q,k,a:ans[i][k]})).filter(x=>x.a!==x.q.a);
    h+=`<div class="sec">${s.t}</div>`;t+=`### ${s.t}\n`;
    if(!wrong.length){h+=`<div class="ok" style="margin:4px 0 8px">오답 없음</div>`;t+=`오답 없음\n\n`;return;}
    any=true;
    h+=`<table><tr><th>#</th><th>문항</th><th>내 답</th><th>정답</th></tr>`;t+=`| # | 문항 | 내 답 | 정답 |\n|---|---|---|---|\n`;
    wrong.forEach(({q,k,a})=>{const my=a===null?'미응답':'①②③④'[a]+' '+strip(q.o[a]);const co='①②③④'[q.a]+' '+strip(q.o[q.a]);const qt=strip(q.p).replace(/\s+/g,' ').slice(0,70);
      h+=`<tr><td class="r">${k+1}</td><td>${qt}</td><td class="bad">${my}</td><td class="ok">${co}</td></tr>`;
      t+=`| ${k+1} | ${qt.replace(/\|/g,'/')} | ${my.replace(/\|/g,'/')} | ${co.replace(/\|/g,'/')} |\n`;});
    h+=`</table>`;t+=`\n`;});
  const notGraded=Q.map((s,i)=>graded[i]?null:i+1).filter(x=>x);
  if(notGraded.length){h+=`<div class="meta" style="margin-top:10px">미채점: ${notGraded.join(', ')}교시</div>`;t+=`미채점: ${notGraded.join(', ')}교시\n`;}
  lastHtml=h;lastText=t;return h;
}
$('#submitBtn').onclick=()=>{if(!graded.some(x=>x)){alert('먼저 한 교시 이상 채점하기를 눌러 주세요.');return;}$('#dgBody').innerHTML=buildReport();$('#toast').textContent='';$('#dlg').showModal();};
$('#closeBtn').onclick=()=>$('#dlg').close();
function copyRich(html,text){
  // 1) copy 이벤트에 두 형식을 직접 실어 보내기 (사용자 클릭 안에서 동기 실행 — file:// 에서도 동작)
  let done=false;
  const onCopy=e=>{e.clipboardData.setData('text/html',html);e.clipboardData.setData('text/plain',text);e.preventDefault();done=true;};
  document.addEventListener('copy',onCopy);
  try{
    const body=$('#dgBody');const sel=window.getSelection();const range=document.createRange();range.selectNodeContents(body);sel.removeAllRanges();sel.addRange(range);
    document.execCommand('copy');
    sel.removeAllRanges();
  }catch(e){}
  document.removeEventListener('copy',onCopy);
  return done;
}
$('#captureBtn').onclick=async()=>{
  const htmlDoc=`<meta charset="utf-8">`+lastHtml.replace(/ class="[^"]*"/g,'').replace(/<table>/g,'<table border="1" style="border-collapse:collapse">');
  if(copyRich(htmlDoc,lastText)){$('#toast').textContent='복사됨 — 노션 페이지에서 Ctrl+V 로 붙여 넣으세요.';return;}
  // 2) 비동기 Clipboard API
  try{
    if(navigator.clipboard&&window.ClipboardItem){
      await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([htmlDoc],{type:'text/html'}),'text/plain':new Blob([lastText],{type:'text/plain'})})]);
    }else{await navigator.clipboard.writeText(lastText);}
    $('#toast').textContent='복사됨 — 노션 페이지에서 Ctrl+V 로 붙여 넣으세요.';return;
  }catch(e){}
  // 3) 최종: 텍스트 영역 선택 복사
  try{
    const ta=document.createElement('textarea');ta.value=lastText;ta.style.position='fixed';ta.style.opacity='0';$('#dlg').appendChild(ta);ta.focus();ta.select();
    const ok=document.execCommand('copy');ta.remove();
    $('#toast').textContent=ok?'텍스트(마크다운 표)로 복사됨 — 노션에서 Ctrl+V.':'복사 실패 — 대화상자 내용을 드래그해 Ctrl+C 로 복사하세요.';
  }catch(e){$('#toast').textContent='복사 실패 — 대화상자 내용을 드래그해 Ctrl+C 로 복사하세요.';}
};
render();
