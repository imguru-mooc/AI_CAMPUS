<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ctrl+S의 정체 · 컴퓨터 구조 Day 1</title>
<style>
:root{--navy:#1E2761;--navy2:#2A3578;--navy3:#36429A;--ice:#CADCFC;--icebg:#EDF3FC;
--white:#FFFFFF;--data:#FFC24B;--ok:#7BE0AD;--warn:#FF8B8B;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--navy);color:var(--ice);font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
min-height:100vh;display:flex;flex-direction:column}
header{padding:14px 22px;border-bottom:1px solid var(--navy3);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header a{color:var(--ice);opacity:.7;font-size:12.5px;text-decoration:none}
header a:hover{opacity:1}
header h1{font-size:17px;color:var(--white)}
header .tagchip{font-size:11.5px;background:var(--navy2);border-radius:999px;padding:4px 12px}
main{flex:1;width:min(980px,95vw);margin:0 auto;padding:20px 0 34px}
.lead{font-size:14px;opacity:.85;line-height:1.6;margin-bottom:14px}
.lead b{color:var(--data)}
.stage{background:var(--navy2);border-radius:16px;padding:22px;position:relative;min-height:260px;overflow:hidden}
.panel{margin-top:14px;border:1px dashed var(--navy3);border-radius:14px;padding:13px 16px;
display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
.grp{display:flex;align-items:center;gap:9px;font-size:13.5px}
.grp label{font-weight:700;color:var(--white)}
output{min-width:48px;font-weight:700;color:var(--data)}
input[type=range]{accent-color:var(--data);width:150px}
input[type=number],input[type=text]{background:var(--navy);border:1px solid var(--navy3);color:var(--white);
border-radius:8px;padding:8px 10px;font-family:inherit;font-size:14px;width:110px}
.btn{background:var(--ice);color:var(--navy);border:none;border-radius:999px;padding:10px 20px;
font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.ghost{background:transparent;color:var(--ice);border:1px solid var(--ice)}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--data);outline-offset:2px}
.status{margin-top:12px;min-height:44px;border-radius:12px;padding:11px 16px;
background:rgba(202,220,252,.08);font-size:14.5px;line-height:1.5}
.status b{color:var(--data)} .status.good{background:rgba(123,224,173,.12)} .status.bad{background:rgba(255,139,139,.12)}
.token{width:24px;height:24px;border-radius:50%;background:var(--data);
box-shadow:0 0 13px rgba(255,194,75,.75);position:absolute;transition:left .7s ease,top .7s ease;z-index:6}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes pop{from{transform:scale(.5);opacity:0}}
footer{text-align:center;font-size:11.5px;opacity:.55;padding:13px;border-top:1px solid var(--navy3)}

.docwrap{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.doc{background:var(--navy);border-radius:12px;padding:14px;min-height:190px}
.doc h3{font-size:14px;color:var(--white);margin-bottom:8px}
.paper{background:var(--icebg);color:var(--navy);border-radius:8px;min-height:110px;padding:10px 12px;
font-size:14px;line-height:1.55;word-break:break-all;transition:opacity .7s,transform .7s}
.paper.gone{opacity:0;transform:translateY(24px)}
.paper.empty{opacity:.35;font-style:italic}
@media(max-width:720px){.docwrap{grid-template-columns:1fr}}

</style>
</head>
<body>
<header>
  <a href="index.html">← 전체 목록</a>
  <h1>Ctrl+S의 정체</h1>
  <span class="tagchip">S4 저장장치와 입출력장치</span>
</header>
<main>
<p class="lead">아래 칸에 <b>진짜로 글을 써 보세요.</b> 글자는 작업대에만 쌓입니다 — 저장 버튼이 하는 일과, 저장 없이 껐을 때의 결과를 확인하세요.</p>

<div class="stage">
  <div class="docwrap">
    <div class="doc"><h3>🗂️ 작업대 위의 문서 (지금 쓰는 중)</h3><div class="paper" id="mem">아직 아무 것도 없음</div></div>
    <div class="doc"><h3>🏬 창고 속의 사본 (마지막 저장)</h3><div class="paper empty" id="disk">저장한 적 없음</div></div>
  </div>
</div>
<div class="panel">
  <div class="grp" style="flex:1;min-width:260px"><label for="inp">글쓰기</label>
    <input type="text" id="inp" style="flex:1;width:auto" placeholder="여기에 아무 문장이나 입력…"></div>
  <button class="btn" id="save">저장 (Ctrl+S)</button>
  <button class="btn ghost" id="off">저장 없이 전원 끄기</button>
  <button class="btn ghost" id="rst">처음부터</button>
</div>
<div class="status" id="st">타이핑하는 글자는 <b>작업대에만</b> 있습니다. 창고 사본은 저장을 눌러야 갱신됩니다.</div>

</main>
<footer>컴퓨터 구조 Day 1 · 호박색 점은 언제나 「데이터」 · 인터넷 없이 동작</footer>
<script>
"use strict";
const $=(id)=>document.getElementById(id);
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;

let saved="";
$("inp").addEventListener("input",()=>{
  const v=$("inp").value;
  $("mem").textContent=v||"아직 아무 것도 없음";
  const diff=v.length-saved.length;
  if(v!==saved)$("st").innerHTML="작업대에 <b>"+v.length+"자</b> — 창고 사본과 <b>"+Math.abs(v.length-saved.length)+"자</b> 다릅니다. 지금 꺼지면 그 차이만큼 사라집니다.";
});
$("inp").addEventListener("keydown",(e)=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();$("save").click();}
});
$("save").addEventListener("click",()=>{
  saved=$("inp").value;
  $("disk").textContent=saved||"빈 문서";$("disk").classList.remove("empty");
  $("st").className="status good";
  $("st").innerHTML="저장! 이 순간의 <b>사본</b>이 창고로 복사됐습니다. 계속 쓰면 다시 달라집니다.";
  setTimeout(()=>$("st").className="status",1200);
});
$("off").addEventListener("click",()=>{
  const cur=$("inp").value,lost=cur.length-saved.length;
  $("mem").classList.add("gone");
  setTimeout(()=>{
    $("inp").value=saved;$("mem").classList.remove("gone");
    $("mem").textContent=saved||"아직 아무 것도 없음";
    $("st").className=lost>0?"status bad":"status good";
    $("st").innerHTML=lost>0
      ?"전원이 꺼졌습니다 — 저장 이후에 쓴 <b>"+lost+"자</b>가 사라지고, 창고의 사본만 돌아왔습니다. 「저장 안 했는데 껐다」의 정체입니다."
      :"전원이 꺼졌지만 전부 저장돼 있어서 <b>잃은 것이 없습니다.</b> 저장의 힘!";
  },reduced?0:800);
});
$("rst").addEventListener("click",()=>{saved="";$("inp").value="";$("mem").textContent="아직 아무 것도 없음";
  $("disk").textContent="저장한 적 없음";$("disk").classList.add("empty");$("st").className="status";
  $("st").innerHTML="처음 상태입니다.";});

</script>
</body>
</html>
