<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>숫자 옮겨심기 · 컴퓨터 구조 Day 1</title>
<style>
:root{--navy:#1E2761;--navy2:#2A3578;--navy3:#36429A;--ice:#CADCFC;--icebg:#EDF3FC;
--white:#FFFFFF;--data:#FFC24B;--ok:#7BE0AD;--warn:#FF8B8B;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--navy);color:var(--ice);font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
min-height:100vh;display:flex;flex-direction:column}
header{padding:14px 22px;border-bottom:1px solid var(--navy3);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header a{color:var(--ice);opacity:.7;font-size:12.5px;text-decoration:none}
header a:hover{opacity:1}
header h1{font-size:17px;color:var(--white)}
header .tagchip{font-size:11.5px;background:var(--navy2);border-radius:999px;padding:4px 12px}
main{flex:1;width:min(980px,95vw);margin:0 auto;padding:20px 0 34px}
.lead{font-size:14px;opacity:.85;line-height:1.6;margin-bottom:14px}
.lead b{color:var(--data)}
.stage{background:var(--navy2);border-radius:16px;padding:22px;position:relative;min-height:260px;overflow:hidden}
.panel{margin-top:14px;border:1px dashed var(--navy3);border-radius:14px;padding:13px 16px;
display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
.grp{display:flex;align-items:center;gap:9px;font-size:13.5px}
.grp label{font-weight:700;color:var(--white)}
output{min-width:48px;font-weight:700;color:var(--data)}
input[type=range]{accent-color:var(--data);width:150px}
input[type=number],input[type=text]{background:var(--navy);border:1px solid var(--navy3);color:var(--white);
border-radius:8px;padding:8px 10px;font-family:inherit;font-size:14px;width:110px}
.btn{background:var(--ice);color:var(--navy);border:none;border-radius:999px;padding:10px 20px;
font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.ghost{background:transparent;color:var(--ice);border:1px solid var(--ice)}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--data);outline-offset:2px}
.status{margin-top:12px;min-height:44px;border-radius:12px;padding:11px 16px;
background:rgba(202,220,252,.08);font-size:14.5px;line-height:1.5}
.status b{color:var(--data)} .status.good{background:rgba(123,224,173,.12)} .status.bad{background:rgba(255,139,139,.12)}
.token{width:24px;height:24px;border-radius:50%;background:var(--data);
box-shadow:0 0 13px rgba(255,194,75,.75);position:absolute;transition:left .7s ease,top .7s ease;z-index:6}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes pop{from{transform:scale(.5);opacity:0}}
footer{text-align:center;font-size:11.5px;opacity:.55;padding:13px;border-top:1px solid var(--navy3)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sysinfo{background:var(--icebg);color:var(--navy);border-radius:12px;padding:12px 14px;font-size:13.5px}
.sysinfo h3{font-size:13px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.badge{font-size:10px;background:var(--warn);border-radius:999px;padding:2px 8px}
.sysrow{padding:7px 4px;border-top:1px solid var(--ice)}
.num{background:var(--data);border-radius:6px;padding:2px 8px;font-weight:700;cursor:pointer;border:2px solid transparent}
.num.sel{border-color:var(--navy)}
.num.used{opacity:.3;pointer-events:none}
.mytab{background:var(--navy);border-radius:12px;padding:12px 14px}
.mytab h3{font-size:13px;color:var(--white);margin-bottom:8px}
.cell{display:flex;justify-content:space-between;align-items:center;padding:9px 6px;border-top:1px solid var(--navy3);font-size:13.5px}
.hole{min-width:90px;text-align:center;border:2px dashed var(--navy3);border-radius:8px;padding:5px 8px;cursor:pointer;font-weight:700}
.hole.ok{border-style:solid;border-color:var(--ok);color:var(--ok)}
@media(max-width:720px){.two{grid-template-columns:1fr}}

</style>
</head>
<body>
<header>
  <a href="index.html">← 전체 목록</a>
  <h1>숫자 옮겨심기</h1>
  <span class="tagchip">S7 실습 8 리허설</span>
</header>
<main>
<p class="lead">왼쪽 시스템 정보의 <b>숫자를 클릭</b>하고, 오른쪽 내 사양표의 맞는 칸을 클릭해 옮겨 심으세요 — 실습 8과 똑같은 동작입니다.</p>

<div class="stage">
  <div class="two">
    <div class="sysinfo">
      <h3>시스템 정보 <span class="badge">일반형 예시 — 실제 화면은 OS 확정 후</span></h3>
      <div class="sysrow">프로세서: 어떤CPU <span class="num" data-k="0">2.8GHz</span> <span class="num" data-k="1">4코어</span></div>
      <div class="sysrow">설치된 RAM: <span class="num" data-k="2">8GB</span></div>
      <div class="sysrow">저장장치: <span class="num" data-k="3">256GB</span> SSD</div>
    </div>
    <div class="mytab">
      <h3>내 사양표</h3>
      <div class="cell"><span>CPU 속도</span><span class="hole" data-k="0">?</span></div>
      <div class="cell"><span>코어 수</span><span class="hole" data-k="1">?</span></div>
      <div class="cell"><span>메모리 크기</span><span class="hole" data-k="2">?</span></div>
      <div class="cell"><span>저장장치 크기</span><span class="hole" data-k="3">?</span></div>
    </div>
  </div>
</div>
<div class="panel"><button class="btn ghost" id="rst">다시 하기</button></div>
<div class="status" id="st">숫자 4개를 전부 맞는 칸으로 옮기면 완료!</div>

</main>
<footer>컴퓨터 구조 Day 1 · 호박색 점은 언제나 「데이터」 · 인터넷 없이 동작</footer>
<script>
"use strict";
const $=(id)=>document.getElementById(id);
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;

const V=["2.8GHz","4코어","8GB","256GB"];let sel=-1,ok=0;
document.querySelectorAll(".num").forEach(n=>n.addEventListener("click",()=>{
 document.querySelectorAll(".num").forEach(x=>x.classList.remove("sel"));
 n.classList.add("sel");sel=+n.dataset.k;
 $("st").innerHTML="<b>"+V[sel]+"</b> 선택 — 오른쪽에서 이 숫자가 들어갈 칸을 클릭하세요.";}));
document.querySelectorAll(".hole").forEach(h=>h.addEventListener("click",()=>{
 if(h.classList.contains("ok"))return;
 if(sel<0){$("st").innerHTML="먼저 왼쪽에서 숫자를 클릭하세요.";return;}
 if(+h.dataset.k===sel){h.classList.add("ok");h.textContent=V[sel];
   document.querySelector('.num[data-k="'+sel+'"]').classList.add("used");
   sel=-1;ok++;
   if(ok===4){$("st").className="status good";$("st").innerHTML="완료! 실습 8에서는 <b>여러분의 진짜 숫자</b>로 똑같이 하면 됩니다.";}
   else $("st").innerHTML="정답! <b>"+(4-ok)+"칸</b> 남았습니다.";
 }else{h.classList.add("shake");setTimeout(()=>h.classList.remove("shake"),450);
   $("st").className="status bad";$("st").innerHTML="그 칸이 아닙니다 — 항목 이름을 다시 읽어 보세요.";
   setTimeout(()=>$("st").className="status",900);}}));
$("rst").addEventListener("click",()=>location.reload());

</script>
</body>
</html>
