<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>거리 경주 — 둘이 붙어 있어야 하는 이유 · 컴퓨터 구조 Day 1</title>
<style>
:root{--navy:#1E2761;--navy2:#2A3578;--navy3:#36429A;--ice:#CADCFC;--icebg:#EDF3FC;
--white:#FFFFFF;--data:#FFC24B;--ok:#7BE0AD;--warn:#FF8B8B;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--navy);color:var(--ice);font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
min-height:100vh;display:flex;flex-direction:column}
header{padding:14px 22px;border-bottom:1px solid var(--navy3);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header a{color:var(--ice);opacity:.7;font-size:12.5px;text-decoration:none}
header a:hover{opacity:1}
header h1{font-size:17px;color:var(--white)}
header .tagchip{font-size:11.5px;background:var(--navy2);border-radius:999px;padding:4px 12px}
main{flex:1;width:min(980px,95vw);margin:0 auto;padding:20px 0 34px}
.lead{font-size:14px;opacity:.85;line-height:1.6;margin-bottom:14px}
.lead b{color:var(--data)}
.stage{background:var(--navy2);border-radius:16px;padding:22px;position:relative;min-height:260px;overflow:hidden}
.panel{margin-top:14px;border:1px dashed var(--navy3);border-radius:14px;padding:13px 16px;
display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
.grp{display:flex;align-items:center;gap:9px;font-size:13.5px}
.grp label{font-weight:700;color:var(--white)}
output{min-width:48px;font-weight:700;color:var(--data)}
input[type=range]{accent-color:var(--data);width:150px}
input[type=number],input[type=text]{background:var(--navy);border:1px solid var(--navy3);color:var(--white);
border-radius:8px;padding:8px 10px;font-family:inherit;font-size:14px;width:110px}
.btn{background:var(--ice);color:var(--navy);border:none;border-radius:999px;padding:10px 20px;
font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.ghost{background:transparent;color:var(--ice);border:1px solid var(--ice)}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--data);outline-offset:2px}
.status{margin-top:12px;min-height:44px;border-radius:12px;padding:11px 16px;
background:rgba(202,220,252,.08);font-size:14.5px;line-height:1.5}
.status b{color:var(--data)} .status.good{background:rgba(123,224,173,.12)} .status.bad{background:rgba(255,139,139,.12)}
.token{width:24px;height:24px;border-radius:50%;background:var(--data);
box-shadow:0 0 13px rgba(255,194,75,.75);position:absolute;transition:left .7s ease,top .7s ease;z-index:6}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes pop{from{transform:scale(.5);opacity:0}}
footer{text-align:center;font-size:11.5px;opacity:.55;padding:13px;border-top:1px solid var(--navy3)}

.lane{background:var(--navy);border-radius:12px;padding:14px 16px 18px;margin-bottom:12px;position:relative}
.lane h3{font-size:14px;color:var(--white);margin-bottom:10px}
.track{position:relative;height:78px}
.spot{position:absolute;top:8px;width:78px;height:62px;border-radius:10px;background:var(--navy2);
border:1px solid var(--navy3);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;gap:2px}
.spot .em{font-size:24px}
.hand{position:absolute;top:20px;left:0;font-size:30px;z-index:4;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.count{position:absolute;right:16px;top:12px;font-size:13px;color:var(--data);font-weight:700}
.count.done{color:var(--ok)}

</style>
</head>
<body>
<header>
  <a href="index.html">← 전체 목록</a>
  <h1>거리 경주 — 둘이 붙어 있어야 하는 이유</h1>
  <span class="tagchip">S3 CPU와 메모리</span>
</header>
<main>
<p class="lead">두 손의 빠르기는 완전히 같습니다. 다른 것은 <b>작업대까지의 거리</b>뿐 — 거리를 바꿔 가며 경주를 돌려 보세요.</p>

<div class="stage">
  <div class="lane"><h3>① 작업대가 바로 옆 (실제 컴퓨터)</h3><div class="count" id="ca">0 / 8</div>
    <div class="track"><div class="spot" style="left:0"><span class="em">🧠</span>CPU</div>
    <div class="spot" id="da" style="left:110px"><span class="em">🗂️</span>작업대</div>
    <div class="hand" id="ha">✋</div></div></div>
  <div class="lane"><h3>② 작업대가 멀리 (만약 떨어져 있다면)</h3><div class="count" id="cb">0 / 8</div>
    <div class="track" id="tb"><div class="spot" style="left:0"><span class="em">🧠</span>CPU</div>
    <div class="spot" id="db"><span class="em">🗂️</span>작업대</div>
    <div class="hand" id="hb">✋</div></div></div>
</div>
<div class="panel">
  <div class="grp"><label for="dist">② 거리</label><input type="range" id="dist" min="250" max="640" value="480" step="10"><output id="disto">480</output></div>
  <div class="grp"><label for="jobs">일감</label><input type="range" id="jobs" min="4" max="16" value="8"><output id="jobso">8</output></div>
  <button class="btn" id="go">경주 시작</button>
  <button class="btn ghost" id="rst">초기화</button>
</div>
<div class="status" id="st">준비되면 「경주 시작」을 누르세요.</div>

</main>
<footer>컴퓨터 구조 Day 1 · 호박색 점은 언제나 「데이터」 · 인터넷 없이 동작</footer>
<script>
"use strict";
const $=(id)=>document.getElementById(id);
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;

const SPEED=300;let run=false,raf=0;
function layout(){$("db").style.left=Math.min(+$("dist").value,$("tb").clientWidth-80)+"px";$("disto").value=$("dist").value;}
function reset(){cancelAnimationFrame(raf);run=false;layout();
  $("ha").style.transform="translateX(20px)";$("hb").style.transform="translateX(20px)";
  const j=$("jobs").value;$("ca").textContent="0 / "+j;$("cb").textContent="0 / "+j;
  $("ca").classList.remove("done");$("cb").classList.remove("done");
  $("st").className="status";$("st").innerHTML="준비되면 「경주 시작」을 누르세요.";$("jobso").value=j;}
$("go").addEventListener("click",()=>{
  reset();run=true;
  const jobs=+$("jobs").value,dA=110,dB=parseFloat($("db").style.left);
  const t0=performance.now();let fA=0,fB=0;
  function fr(now){const t=(now-t0)/1000;
    [[dA,"ha","ca"],[dB,"hb","cb"]].forEach(([d,h,c],i)=>{
      const trip=(2*d)/SPEED,cnt=Math.min(jobs,Math.floor(t/trip)),fin=cnt>=jobs;
      const ph=fin?0:(t%trip)/trip,x=20+(ph<0.5?ph*2:(1-ph)*2)*(d-20);
      $(h).style.transform="translateX("+(reduced?(fin?20:x):x)+"px)";
      $(c).textContent=cnt+" / "+jobs;
      if(fin){$(c).classList.add("done");if(i===0&&!fA)fA=t;if(i===1&&!fB)fB=t;}});
    if(fA&&!fB)$("st").innerHTML="① 끝! <b>"+fA.toFixed(1)+"초</b> — ②는 아직 오가는 중…";
    if(fA&&fB){run=false;$("st").className="status good";
      $("st").innerHTML="① <b>"+fA.toFixed(1)+"초</b> vs ② <b>"+fB.toFixed(1)+"초</b> — 같은 손인데 <b>"+(fB/fA).toFixed(1)+"배</b> 차이! 그래서 메모리 슬롯은 CPU 바로 옆에 있습니다.";return;}
    raf=requestAnimationFrame(fr);}
  raf=requestAnimationFrame(fr);});
$("rst").addEventListener("click",reset);
$("dist").addEventListener("input",()=>{if(!run)layout();$("disto").value=$("dist").value;});
$("jobs").addEventListener("input",()=>{if(!run)reset();});
addEventListener("resize",()=>{if(!run)layout();});
reset();

</script>
</body>
</html>
