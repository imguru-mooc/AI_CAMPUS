<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전원 실험 — 사라진다 vs 남는다 · 컴퓨터 구조 Day 1</title>
<style>
:root{--navy:#1E2761;--navy2:#2A3578;--navy3:#36429A;--ice:#CADCFC;--icebg:#EDF3FC;
--white:#FFFFFF;--data:#FFC24B;--ok:#7BE0AD;--warn:#FF8B8B;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--navy);color:var(--ice);font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
min-height:100vh;display:flex;flex-direction:column}
header{padding:14px 22px;border-bottom:1px solid var(--navy3);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header a{color:var(--ice);opacity:.7;font-size:12.5px;text-decoration:none}
header a:hover{opacity:1}
header h1{font-size:17px;color:var(--white)}
header .tagchip{font-size:11.5px;background:var(--navy2);border-radius:999px;padding:4px 12px}
main{flex:1;width:min(980px,95vw);margin:0 auto;padding:20px 0 34px}
.lead{font-size:14px;opacity:.85;line-height:1.6;margin-bottom:14px}
.lead b{color:var(--data)}
.stage{background:var(--navy2);border-radius:16px;padding:22px;position:relative;min-height:260px;overflow:hidden}
.panel{margin-top:14px;border:1px dashed var(--navy3);border-radius:14px;padding:13px 16px;
display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
.grp{display:flex;align-items:center;gap:9px;font-size:13.5px}
.grp label{font-weight:700;color:var(--white)}
output{min-width:48px;font-weight:700;color:var(--data)}
input[type=range]{accent-color:var(--data);width:150px}
input[type=number],input[type=text]{background:var(--navy);border:1px solid var(--navy3);color:var(--white);
border-radius:8px;padding:8px 10px;font-family:inherit;font-size:14px;width:110px}
.btn{background:var(--ice);color:var(--navy);border:none;border-radius:999px;padding:10px 20px;
font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.ghost{background:transparent;color:var(--ice);border:1px solid var(--ice)}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--data);outline-offset:2px}
.status{margin-top:12px;min-height:44px;border-radius:12px;padding:11px 16px;
background:rgba(202,220,252,.08);font-size:14.5px;line-height:1.5}
.status b{color:var(--data)} .status.good{background:rgba(123,224,173,.12)} .status.bad{background:rgba(255,139,139,.12)}
.token{width:24px;height:24px;border-radius:50%;background:var(--data);
box-shadow:0 0 13px rgba(255,194,75,.75);position:absolute;transition:left .7s ease,top .7s ease;z-index:6}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes pop{from{transform:scale(.5);opacity:0}}
footer{text-align:center;font-size:11.5px;opacity:.55;padding:13px;border-top:1px solid var(--navy3)}

.s4wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.zone{background:var(--navy);border-radius:12px;padding:14px;min-height:210px}
.zone h3{font-size:14px;color:var(--white);margin-bottom:4px}
.zone .cap{font-size:11.5px;opacity:.7;margin-bottom:10px}
.blocks{display:flex;flex-wrap:wrap;gap:8px}
.blk{background:var(--data);color:var(--navy);font-size:12.5px;font-weight:700;border-radius:8px;
padding:8px 10px;transition:opacity .7s,transform .7s}
.blk.saved::after{content:" ✓"}
.blk.store{background:var(--icebg)}
.blk.gone{opacity:0;transform:translateY(26px) rotate(8deg)}
.powerbtn{width:72px;height:72px;border-radius:50%;border:3px solid var(--ice);background:var(--navy2);
color:var(--ice);font-size:26px;cursor:pointer}
.powerbtn.off{border-color:var(--warn);color:var(--warn)}
.led{width:12px;height:12px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);display:inline-block}
.led.off{background:#5a5f7a;box-shadow:none}
@media(max-width:720px){.s4wrap{grid-template-columns:1fr}}

</style>
</head>
<body>
<header>
  <a href="index.html">← 전체 목록</a>
  <h1>전원 실험 — 사라진다 vs 남는다</h1>
  <span class="tagchip">S4 저장장치와 입출력장치</span>
</header>
<main>
<p class="lead">프로그램을 열고, 일부만 저장한 뒤, <b>직접 전원을 꺼 보세요.</b> 무엇이 사라지고 무엇이 남는지가 실습 4의 판단 기준입니다.</p>

<div class="stage">
  <div class="s4wrap">
    <div class="zone"><h3>🗂️ 작업대 (메모리 RAM)</h3><div class="cap">지금 쓰는 것을 올려두는 곳</div><div class="blocks" id="ram"></div></div>
    <div class="zone"><h3>🏬 창고 (저장장치 SSD/HDD)</h3><div class="cap">꺼도 남는 곳</div><div class="blocks" id="ssd"></div></div>
  </div>
  <div style="display:flex;align-items:center;gap:16px;margin-top:16px;flex-wrap:wrap">
    <button class="powerbtn" id="pwr" title="전원">⏻</button>
    <span class="led" id="led"></span><span id="ledtxt" style="font-size:13px">전원 켜짐</span>
  </div>
</div>
<div class="panel">
  <button class="btn" id="open">프로그램 열기</button>
  <button class="btn" id="save">저장하기 (Ctrl+S)</button>
  <button class="btn ghost" id="reopen" disabled>창고에서 다시 열기</button>
  <button class="btn ghost" id="rst">처음부터</button>
</div>
<div class="status" id="st">「프로그램 열기」를 몇 번 눌러 작업대를 채워 보세요. 저장은 <b>사본을 창고에 복사</b>하는 일입니다.</div>

</main>
<footer>컴퓨터 구조 Day 1 · 호박색 점은 언제나 「데이터」 · 인터넷 없이 동작</footer>
<script>
"use strict";
const $=(id)=>document.getElementById(id);
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;

let ram=[],ssd=[],power=true,no=0;
const NAMES=["문서","사진","음악","게임","메모","영상"];
function draw(){
  $("ram").innerHTML=ram.map(b=>'<div class="blk'+(b.saved?" saved":"")+'" id="rb'+b.id+'">'+b.name+'</div>').join("");
  $("ssd").innerHTML=ssd.map(b=>'<div class="blk store">'+b.name+' ✓</div>').join("");
  $("reopen").disabled=!(power&&ssd.length&&ram.length===0);}
function msg(h,c){$("st").className="status"+(c?" "+c:"");$("st").innerHTML=h;}
$("open").addEventListener("click",()=>{
  if(!power){msg("전원이 꺼져 있습니다. 먼저 켜세요.","bad");return;}
  if(ram.length>=6){msg("작업대가 가득 — 크기 이야기는 S6에서!");return;}
  no++;ram.push({id:no,name:NAMES[(no-1)%6]+no,saved:false});draw();
  msg("작업대에 <b>"+ram[ram.length-1].name+"</b>이(가) 올라왔습니다. 아직 창고에는 없습니다.");});
$("save").addEventListener("click",()=>{
  if(!power){msg("전원이 꺼져 있습니다.","bad");return;}
  const u=ram.filter(b=>!b.saved);
  if(!u.length){msg("저장할 새 내용이 없습니다.");return;}
  u.forEach(b=>{b.saved=true;ssd.push({name:b.name});});draw();
  msg("<b>"+u.length+"개</b> 사본이 창고로 복사됐습니다. 원본에 ✓ 표시.","good");});
$("pwr").addEventListener("click",()=>{
  power=!power;$("pwr").classList.toggle("off",!power);$("led").classList.toggle("off",!power);
  $("ledtxt").textContent=power?"전원 켜짐":"전원 꺼짐";
  if(!power){const lost=ram.filter(b=>!b.saved).length,kept=ssd.length;
    ram.forEach(b=>{const el=$("rb"+b.id);if(el)el.classList.add("gone");});
    setTimeout(()=>{ram=[];draw();},reduced?0:750);
    msg("전원 OFF — 작업대는 <b>전부</b> 비워졌습니다. 저장 안 한 <b>"+lost+"개</b>는 영영 사라졌고, 창고의 <b>"+kept+"개</b>는 그대로.",lost>0?"bad":"good");
  }else{draw();msg("전원 ON — 작업대는 비어 있고 창고는 그대로. 「창고에서 다시 열기」로 복원해 보세요.");}});
$("reopen").addEventListener("click",()=>{
  ssd.forEach(b=>{no++;ram.push({id:no,name:b.name,saved:true});});draw();
  msg("창고의 사본이 작업대로 — 이 길(저장장치→메모리)을 S5에서 다시 만납니다.","good");});
$("rst").addEventListener("click",()=>{ram=[];ssd=[];power=true;no=0;
  $("pwr").classList.remove("off");$("led").classList.remove("off");$("ledtxt").textContent="전원 켜짐";
  draw();msg("처음 상태입니다.");});
draw();

</script>
</body>
</html>
