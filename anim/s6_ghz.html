<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHz 다이얼 · 컴퓨터 구조 Day 1</title>
<style>
:root{--navy:#1E2761;--navy2:#2A3578;--navy3:#36429A;--ice:#CADCFC;--icebg:#EDF3FC;
--white:#FFFFFF;--data:#FFC24B;--ok:#7BE0AD;--warn:#FF8B8B;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--navy);color:var(--ice);font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
min-height:100vh;display:flex;flex-direction:column}
header{padding:14px 22px;border-bottom:1px solid var(--navy3);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header a{color:var(--ice);opacity:.7;font-size:12.5px;text-decoration:none}
header a:hover{opacity:1}
header h1{font-size:17px;color:var(--white)}
header .tagchip{font-size:11.5px;background:var(--navy2);border-radius:999px;padding:4px 12px}
main{flex:1;width:min(980px,95vw);margin:0 auto;padding:20px 0 34px}
.lead{font-size:14px;opacity:.85;line-height:1.6;margin-bottom:14px}
.lead b{color:var(--data)}
.stage{background:var(--navy2);border-radius:16px;padding:22px;position:relative;min-height:260px;overflow:hidden}
.panel{margin-top:14px;border:1px dashed var(--navy3);border-radius:14px;padding:13px 16px;
display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
.grp{display:flex;align-items:center;gap:9px;font-size:13.5px}
.grp label{font-weight:700;color:var(--white)}
output{min-width:48px;font-weight:700;color:var(--data)}
input[type=range]{accent-color:var(--data);width:150px}
input[type=number],input[type=text]{background:var(--navy);border:1px solid var(--navy3);color:var(--white);
border-radius:8px;padding:8px 10px;font-family:inherit;font-size:14px;width:110px}
.btn{background:var(--ice);color:var(--navy);border:none;border-radius:999px;padding:10px 20px;
font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.ghost{background:transparent;color:var(--ice);border:1px solid var(--ice)}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--data);outline-offset:2px}
.status{margin-top:12px;min-height:44px;border-radius:12px;padding:11px 16px;
background:rgba(202,220,252,.08);font-size:14.5px;line-height:1.5}
.status b{color:var(--data)} .status.good{background:rgba(123,224,173,.12)} .status.bad{background:rgba(255,139,139,.12)}
.token{width:24px;height:24px;border-radius:50%;background:var(--data);
box-shadow:0 0 13px rgba(255,194,75,.75);position:absolute;transition:left .7s ease,top .7s ease;z-index:6}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes pop{from{transform:scale(.5);opacity:0}}
footer{text-align:center;font-size:11.5px;opacity:.55;padding:13px;border-top:1px solid var(--navy3)}

.machine{background:var(--navy);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.machine h3{font-size:14px;color:var(--white);margin-bottom:8px}
.hands{font-size:24px;letter-spacing:4px;min-height:32px}
.hands span{display:inline-block;animation:wb 1s infinite}
@keyframes wb{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.bar{height:14px;background:var(--navy2);border-radius:999px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0%;background:var(--data);transition:width .12s linear}
.mres{font-size:13px;margin-top:6px;min-height:18px;color:var(--data);font-weight:700}
@media(prefers-reduced-motion:reduce){.hands span{animation:none}}

</style>
</head>
<body>
<header>
  <a href="index.html">← 전체 목록</a>
  <h1>GHz 다이얼</h1>
  <span class="tagchip">S6 사양표 읽는 법</span>
</header>
<main>
<p class="lead">같은 손 하나 — <b>GHz만 올려 보세요.</b> 10초 측정으로 처리량이 어떻게 변하는지 숫자로 확인합니다.</p>

<div class="stage">
  <div class="machine"><h3>내 컴퓨터 (코어 1개 고정)</h3>
    <div class="hands" id="h1"></div><div class="bar"><i id="b1"></i></div>
    <div class="mres" id="r1"></div></div>
</div>
<div class="panel">
  <div class="grp"><label for="g1">속도</label><input type="range" id="g1" min="1" max="4" value="1" step="0.5"><output id="g1o">1.0GHz</output></div>
  <button class="btn" id="go">10초 측정</button>
</div>
<div class="status" id="st">1.0GHz로 먼저 재고, 3.0GHz로 다시 재서 비교해 보세요.</div>

</main>
<footer>컴퓨터 구조 Day 1 · 호박색 점은 언제나 「데이터」 · 인터넷 없이 동작</footer>
<script>
"use strict";
const $=(id)=>document.getElementById(id);
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;

let hist=[],run=false;
function hands(){$("h1").innerHTML="<span style='animation-duration:"+(1.6/+$("g1").value)+"s'>✋</span>";
 $("g1o").value=(+$("g1").value).toFixed(1)+"GHz";}
$("g1").addEventListener("input",()=>{if(!run)hands();});
$("go").addEventListener("click",()=>{
 if(run)return;run=true;const g=+$("g1").value,t0=performance.now();
 (function fr(){const t=(performance.now()-t0)/1000;
   const doneJobs=Math.floor(g*4*t);
   $("b1").style.width=Math.min(100,t/10*100)+"%";
   $("r1").textContent="처리 "+doneJobs+"개";
   if(t<10){requestAnimationFrame(fr);}
   else{run=false;const total=Math.floor(g*4*10);hist.push([g,total]);
     let cmp="";
     if(hist.length>=2){const[pg,pt]=hist[hist.length-2];
       cmp=" — 직전("+pg.toFixed(1)+"GHz, "+pt+"개)보다 <b>"+(total/pt).toFixed(1)+"배</b>";}
     $("st").className="status good";
     $("st").innerHTML=g.toFixed(1)+"GHz로 10초에 <b>"+total+"개</b> 처리"+cmp+". GHz는 손이 움직이는 속도입니다.";}})();});
hands();

</script>
</body>
</html>
