<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부품 퍼즐 · 컴퓨터 구조 Day 1</title>
<style>
:root{--navy:#1E2761;--navy2:#2A3578;--navy3:#36429A;--ice:#CADCFC;--icebg:#EDF3FC;
--white:#FFFFFF;--data:#FFC24B;--ok:#7BE0AD;--warn:#FF8B8B;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--navy);color:var(--ice);font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
min-height:100vh;display:flex;flex-direction:column}
header{padding:14px 22px;border-bottom:1px solid var(--navy3);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header a{color:var(--ice);opacity:.7;font-size:12.5px;text-decoration:none}
header a:hover{opacity:1}
header h1{font-size:17px;color:var(--white)}
header .tagchip{font-size:11.5px;background:var(--navy2);border-radius:999px;padding:4px 12px}
main{flex:1;width:min(980px,95vw);margin:0 auto;padding:20px 0 34px}
.lead{font-size:14px;opacity:.85;line-height:1.6;margin-bottom:14px}
.lead b{color:var(--data)}
.stage{background:var(--navy2);border-radius:16px;padding:22px;position:relative;min-height:260px;overflow:hidden}
.panel{margin-top:14px;border:1px dashed var(--navy3);border-radius:14px;padding:13px 16px;
display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
.grp{display:flex;align-items:center;gap:9px;font-size:13.5px}
.grp label{font-weight:700;color:var(--white)}
output{min-width:48px;font-weight:700;color:var(--data)}
input[type=range]{accent-color:var(--data);width:150px}
input[type=number],input[type=text]{background:var(--navy);border:1px solid var(--navy3);color:var(--white);
border-radius:8px;padding:8px 10px;font-family:inherit;font-size:14px;width:110px}
.btn{background:var(--ice);color:var(--navy);border:none;border-radius:999px;padding:10px 20px;
font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.ghost{background:transparent;color:var(--ice);border:1px solid var(--ice)}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--data);outline-offset:2px}
.status{margin-top:12px;min-height:44px;border-radius:12px;padding:11px 16px;
background:rgba(202,220,252,.08);font-size:14.5px;line-height:1.5}
.status b{color:var(--data)} .status.good{background:rgba(123,224,173,.12)} .status.bad{background:rgba(255,139,139,.12)}
.token{width:24px;height:24px;border-radius:50%;background:var(--data);
box-shadow:0 0 13px rgba(255,194,75,.75);position:absolute;transition:left .7s ease,top .7s ease;z-index:6}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes pop{from{transform:scale(.5);opacity:0}}
footer{text-align:center;font-size:11.5px;opacity:.55;padding:13px;border-top:1px solid var(--navy3)}

.board{position:relative;width:min(560px,92%);height:280px;margin:0 auto;background:var(--navy);
border-radius:14px;border:2px solid var(--navy3)}
.pslot{position:absolute;border:2px dashed var(--navy3);border-radius:10px;display:flex;align-items:center;
justify-content:center;font-size:12px;color:var(--ice);opacity:.85;cursor:pointer}
.pslot.done{border-style:solid;border-color:var(--ok);color:var(--ok);opacity:1}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;justify-content:center}
.chip{background:var(--data);color:var(--navy);font-weight:700;border-radius:999px;padding:10px 16px;
cursor:pointer;font-size:13.5px;border:3px solid transparent}
.chip.sel{border-color:var(--white)}
.chip.used{opacity:.25;pointer-events:none}

</style>
</head>
<body>
<header>
  <a href="index.html">← 전체 목록</a>
  <h1>부품 퍼즐</h1>
  <span class="tagchip">S2 실습 2 리허설</span>
</header>
<main>
<p class="lead">아래 <b>이름표를 먼저 클릭</b>하고, 보드에서 맞는 자리를 클릭해 붙이세요. 실습 2(이름표 채우기)의 연습 게임입니다.</p>

<div class="stage">
  <div class="board">
    <div class="pslot" data-a="0" style="left:37%;top:24%;width:120px;height:74px">가운데 자리는?</div>
    <div class="pslot" data-a="1" style="left:66%;top:20%;width:70px;height:110px">옆 슬롯은?</div>
    <div class="pslot" data-a="2" style="left:8%;top:62%;width:126px;height:64px">구석 상자는?</div>
    <div class="pslot" data-a="3" style="left:66%;top:66%;width:130px;height:58px">바깥 연결은?</div>
  </div>
  <div class="chips" id="chips"></div>
</div>
<div class="panel"><button class="btn ghost" id="rst">다시 하기</button></div>
<div class="status" id="st">이름표 4개를 모두 제자리에 붙이면 성공!</div>

</main>
<footer>컴퓨터 구조 Day 1 · 호박색 점은 언제나 「데이터」 · 인터넷 없이 동작</footer>
<script>
"use strict";
const $=(id)=>document.getElementById(id);
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;

const NAMES=["CPU","메모리","저장장치","입출력장치"];
let sel=-1,placed=0;
function chips(){
  const order=[2,0,3,1];
  $("chips").innerHTML=order.map(i=>'<span class="chip" id="ch'+i+'" data-i="'+i+'">'+NAMES[i]+'</span>').join("");
  document.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{
    document.querySelectorAll(".chip").forEach(x=>x.classList.remove("sel"));
    c.classList.add("sel"); sel=+c.dataset.i;
    $("st").innerHTML="<b>"+NAMES[sel]+"</b> 선택 — 이제 보드에서 자리를 클릭하세요.";
  }));
}
document.querySelectorAll(".pslot").forEach(s=>s.addEventListener("click",()=>{
  if(s.classList.contains("done"))return;
  if(sel<0){$("st").innerHTML="먼저 아래에서 이름표를 클릭하세요.";return;}
  if(+s.dataset.a===sel){
    s.classList.add("done"); s.textContent=NAMES[sel];
    $("ch"+sel).classList.add("used"); $("ch"+sel).classList.remove("sel");
    placed++; sel=-1;
    if(placed===4){$("st").className="status good";$("st").innerHTML="완성! 🎉 이제 종이 실습에서도 같은 자리에 같은 이름을 쓰면 됩니다.";}
    else $("st").innerHTML="정답! <b>"+(4-placed)+"개</b> 남았습니다.";
  }else{
    s.classList.add("shake"); setTimeout(()=>s.classList.remove("shake"),450);
    $("st").className="status bad"; $("st").innerHTML="그 자리가 아닙니다 — 위치를 다시 떠올려 보세요. (힌트: "+s.textContent+")";
    setTimeout(()=>$("st").className="status",900);
  }
}));
$("rst").addEventListener("click",()=>location.reload());
chips();

</script>
</body>
</html>
