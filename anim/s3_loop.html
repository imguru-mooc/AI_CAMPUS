<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>손과 작업대 — 기본 루프 · 컴퓨터 구조 Day 1</title>
<style>
:root{--navy:#1E2761;--navy2:#2A3578;--navy3:#36429A;--ice:#CADCFC;--icebg:#EDF3FC;
--white:#FFFFFF;--data:#FFC24B;--ok:#7BE0AD;--warn:#FF8B8B;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--navy);color:var(--ice);font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
min-height:100vh;display:flex;flex-direction:column}
header{padding:14px 22px;border-bottom:1px solid var(--navy3);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header a{color:var(--ice);opacity:.7;font-size:12.5px;text-decoration:none}
header a:hover{opacity:1}
header h1{font-size:17px;color:var(--white)}
header .tagchip{font-size:11.5px;background:var(--navy2);border-radius:999px;padding:4px 12px}
main{flex:1;width:min(980px,95vw);margin:0 auto;padding:20px 0 34px}
.lead{font-size:14px;opacity:.85;line-height:1.6;margin-bottom:14px}
.lead b{color:var(--data)}
.stage{background:var(--navy2);border-radius:16px;padding:22px;position:relative;min-height:260px;overflow:hidden}
.panel{margin-top:14px;border:1px dashed var(--navy3);border-radius:14px;padding:13px 16px;
display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
.grp{display:flex;align-items:center;gap:9px;font-size:13.5px}
.grp label{font-weight:700;color:var(--white)}
output{min-width:48px;font-weight:700;color:var(--data)}
input[type=range]{accent-color:var(--data);width:150px}
input[type=number],input[type=text]{background:var(--navy);border:1px solid var(--navy3);color:var(--white);
border-radius:8px;padding:8px 10px;font-family:inherit;font-size:14px;width:110px}
.btn{background:var(--ice);color:var(--navy);border:none;border-radius:999px;padding:10px 20px;
font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.ghost{background:transparent;color:var(--ice);border:1px solid var(--ice)}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--data);outline-offset:2px}
.status{margin-top:12px;min-height:44px;border-radius:12px;padding:11px 16px;
background:rgba(202,220,252,.08);font-size:14.5px;line-height:1.5}
.status b{color:var(--data)} .status.good{background:rgba(123,224,173,.12)} .status.bad{background:rgba(255,139,139,.12)}
.token{width:24px;height:24px;border-radius:50%;background:var(--data);
box-shadow:0 0 13px rgba(255,194,75,.75);position:absolute;transition:left .7s ease,top .7s ease;z-index:6}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes pop{from{transform:scale(.5);opacity:0}}
footer{text-align:center;font-size:11.5px;opacity:.55;padding:13px;border-top:1px solid var(--navy3)}

.lane{background:var(--navy);border-radius:12px;padding:14px 16px 18px;margin-bottom:12px;position:relative}
.lane h3{font-size:14px;color:var(--white);margin-bottom:10px}
.track{position:relative;height:78px}
.spot{position:absolute;top:8px;width:78px;height:62px;border-radius:10px;background:var(--navy2);
border:1px solid var(--navy3);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;gap:2px}
.spot .em{font-size:24px}
.hand{position:absolute;top:20px;left:0;font-size:30px;z-index:4;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.count{position:absolute;right:16px;top:12px;font-size:13px;color:var(--data);font-weight:700}
.count.done{color:var(--ok)}

</style>
</head>
<body>
<header>
  <a href="index.html">← 전체 목록</a>
  <h1>손과 작업대 — 기본 루프</h1>
  <span class="tagchip">S3 CPU와 메모리</span>
</header>
<main>
<p class="lead">CPU(손)는 쉬지 않고 작업대(메모리)를 오가며 재료를 가져와 처리합니다. <b>속도를 조절</b>하며 이 반복을 관찰하세요 — Day 3의 씨앗이 되는 장면입니다.</p>

<div class="stage">
  <div class="lane">
    <h3>손이 재료를 가져와 → 처리해서 → 되돌려 놓는다</h3>
    <div class="count" id="c">처리 0개</div>
    <div class="track" id="tr">
      <div class="spot" style="left:0"><span class="em">🧠</span>CPU 자리</div>
      <div class="spot" id="desk" style="left:300px"><span class="em">🗂️</span>작업대</div>
      <div class="hand" id="hand">✋</div>
    </div>
  </div>
</div>
<div class="panel">
  <button class="btn" id="go">시작</button>
  <button class="btn ghost" id="stop">정지</button>
  <div class="grp"><label for="sp">손의 속도</label>
  <input type="range" id="sp" min="120" max="600" value="260" step="20"><output id="spo">보통</output></div>
</div>
<div class="status" id="st">시작을 누르면 손이 왕복합니다. 왕복 1번 = 일 1개 처리.</div>

</main>
<footer>컴퓨터 구조 Day 1 · 호박색 점은 언제나 「데이터」 · 인터넷 없이 동작</footer>
<script>
"use strict";
const $=(id)=>document.getElementById(id);
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;

let run=false,raf=0,done=0,t0=0,acc=0;
function label(){const v=+$("sp").value;$("spo").value=v<220?"천천히":(v<420?"보통":"빠르게");}
function frame(now){
  if(!run)return;
  const v=+$("sp").value, d=300, trip=(2*d)/v;
  const t=acc+(now-t0)/1000;
  const cnt=Math.floor(t/trip);
  if(cnt>done){done=cnt;$("c").textContent="처리 "+done+"개";
    if(done===5)$("st").innerHTML="이 반복이 1초에 <b>수십억 번</b> 일어나는 것이 GHz입니다 — S6에서 다시 만납니다.";}
  const ph=(t%trip)/trip;
  const x=20+(ph<0.5?ph*2:(1-ph)*2)*(d-20);
  $("hand").style.transform="translateX("+(reduced?20:x)+"px)";
  raf=requestAnimationFrame(frame);
}
$("go").addEventListener("click",()=>{if(run)return;run=true;t0=performance.now();raf=requestAnimationFrame(frame);});
$("stop").addEventListener("click",()=>{if(!run)return;run=false;acc+=(performance.now()-t0)/1000;cancelAnimationFrame(raf);});
$("sp").addEventListener("input",()=>{if(run){acc+=(performance.now()-t0)/1000;t0=performance.now();}label();});
label();

</script>
</body>
</html>
