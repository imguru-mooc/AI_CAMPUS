<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자릿값 저울 · 컴퓨터 구조 Day 2</title>
<style>
:root{--navy:#1E2761;--navy2:#2A3578;--navy3:#36429A;--ice:#CADCFC;--icebg:#EDF3FC;--white:#FFFFFF;--data:#FFC24B;--ok:#7BE0AD;--warn:#FF8B8B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--navy);color:var(--ice);font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;display:flex;flex-direction:column;min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--navy3);flex-wrap:wrap}
header a{color:var(--ice);opacity:.7;text-decoration:none;font-size:13px}
header a:hover{opacity:1}
header h1{font-size:17px;color:var(--white);letter-spacing:.02em}
.tag{font-size:12px;background:var(--navy3);border-radius:999px;padding:4px 12px}
.tag.star{background:var(--data);color:var(--navy);font-weight:700}
main{flex:1;width:min(980px,94vw);margin:0 auto;padding:24px 0 44px}
.panel{background:var(--navy2);border:1px solid var(--navy3);border-radius:16px;padding:22px;margin-bottom:18px}
.hint{font-size:13.5px;opacity:.8;line-height:1.7}
.btn{background:var(--ice);color:var(--navy);border:0;border-radius:999px;padding:10px 20px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.btn.ghost{background:transparent;color:var(--ice);border:1px solid var(--navy3)}
.btn.on{background:var(--data);color:var(--navy)}
.btn:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--data);outline-offset:2px}
.bits{display:flex;gap:8px;flex-wrap:wrap}
.bit{width:46px;height:58px;border:2px solid var(--navy3);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:var(--ice);background:var(--navy);transition:background .15s,border-color .15s,color .15s}
.bit.click{cursor:pointer}
.bit.on{background:var(--data);color:var(--navy);border-color:var(--data)}
.bit.sign{border-color:var(--warn)}
.pv{width:46px;text-align:center;font-size:12px;opacity:.75}
.big{font-size:34px;font-weight:800;color:var(--white)}
.amber{color:var(--data)}
.warn{color:var(--warn)}
.ok{color:var(--ok)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hidden{display:none !important}
input[type=number],input[type=text],select{background:var(--navy);border:1px solid var(--navy3);color:var(--white);border-radius:10px;padding:10px 12px;font-size:15px;font-family:inherit;width:120px}
input[type=text]{width:170px}
input[type=range]{accent-color:var(--data);width:220px}
.flash{animation:fl .55s}
@keyframes fl{0%{background:var(--data);color:var(--navy);border-color:var(--data)}100%{}}
.blink{animation:bl 1s infinite alternate}
@keyframes bl{from{background:var(--navy)}to{background:var(--data);color:var(--navy)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01s !important;transition-duration:.01s !important}}
.dish{min-height:34px;font-size:20px;font-weight:700}
.log{font-size:14px;line-height:1.9;margin-top:14px}
</style>
</head>
<body>
<header><a href="index.html">← 목록</a><h1>자릿값 저울</h1><span class="tag star">S2 주 도구 · 검산 전용</span></header>
<main>
<div class="panel hint">워크시트를 <b>손으로 먼저 푼 뒤</b>, 여기서 검산만 하세요. 정방향: 칸을 켜면 자릿값이 접시에 쌓입니다. 역방향: 큰 자릿값부터 한 단계씩 덜어냅니다.</div>
<div class="panel row">
  <button class="btn on" id="tabF">정방향 · 2진수 → 10진수</button>
  <button class="btn ghost" id="tabR">역방향 · 10진수 → 2진수</button>
</div>
<div class="panel" id="fwd">
  <div class="bits" id="pvF"></div>
  <div style="height:8px"></div>
  <div class="bits" id="bitsF"></div>
  <div class="row" style="margin-top:20px"><span>합산 접시</span><div class="dish amber" id="dish">—</div></div>
  <div class="big">= <span id="totF">0</span></div>
</div>
<div class="panel hidden" id="rev">
  <div class="row">
    <label>10진수 (0~255)</label><input type="number" id="inR" min="0" max="255" value="167">
    <button class="btn" id="startR">시작</button>
    <button class="btn ghost" id="stepR">한 단계씩 덜어내기</button>
  </div>
  <div style="height:16px"></div>
  <div class="bits" id="pvR"></div>
  <div style="height:8px"></div>
  <div class="bits" id="bitsR"></div>
  <div class="log" id="logR"></div>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
const pad8=n=>((n%256)+256)%256===0&&n!==0?"00000000":(((n%256)+256)%256).toString(2).padStart(8,"0");
const P8=n=>(((n%256)+256)%256).toString(2).padStart(8,"0");
const HX=n=>(((n%256)+256)%256).toString(16).toUpperCase().padStart(2,"0");
const NUM=n=>n.toLocaleString("ko-KR");
const PV=[128,64,32,16,8,4,2,1];
function pvRow(el){el.innerHTML="";PV.forEach(v=>{const d=document.createElement("div");d.className="pv";d.textContent=v;el.appendChild(d);});}
pvRow($("pvF"));pvRow($("pvR"));
// 정방향
let fb=[0,0,0,0,0,0,0,0];
function renderF(){
  const el=$("bitsF");el.innerHTML="";
  fb.forEach((b,i)=>{const d=document.createElement("div");d.className="bit click"+(b?" on":"");d.textContent=b;d.tabIndex=0;
    const go=()=>{fb[i]^=1;renderF();$("totF").classList.add("flash");setTimeout(()=>$("totF").classList.remove("flash"),560);};
    d.onclick=go;d.onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();go();}};el.appendChild(d);});
  const on=PV.filter((v,i)=>fb[i]);
  $("dish").textContent=on.length?on.join(" + "):"—";
  $("totF").textContent=on.reduce((a,b)=>a+b,0);
}
renderF();
// 역방향
let rem=0,idx=0,rb=[0,0,0,0,0,0,0,0],done=true;
function renderR(){const el=$("bitsR");el.innerHTML="";rb.forEach(b=>{const d=document.createElement("div");d.className="bit"+(b?" on":"");d.textContent=b===""?"":b;el.appendChild(d);});}
$("startR").onclick=()=>{
  let v=Math.max(0,Math.min(255,parseInt($("inR").value||"0",10)));$("inR").value=v;
  rem=v;idx=0;rb=["","","","","","","",""];done=false;
  $("logR").innerHTML="남은 수: <b class='amber'>"+v+"</b> — 128부터 순서대로 물어봅니다.";
  renderR();
};
$("stepR").onclick=()=>{
  if(done){$("logR").innerHTML+="<br>먼저 <b>시작</b>을 누르세요.";return;}
  const pv=PV[idx];
  if(pv<=rem){rb[idx]=1;rem-=pv;$("logR").innerHTML+="<br>"+pv+" 들어감 → <b class='amber'>1</b> · 남은 수 "+rem;}
  else{rb[idx]=0;$("logR").innerHTML+="<br>"+pv+"은(는) 남은 수보다 큼 → 0";}
  renderR();
  const cells=$("bitsR").children;cells[idx].classList.add("flash");
  idx++;
  if(idx===8){done=true;$("logR").innerHTML+="<br><b class='ok'>완성: "+rb.join("")+"</b> — 손으로 푼 답과 같은지 비교하세요.";}
};
// 탭
$("tabF").onclick=()=>{$("fwd").classList.remove("hidden");$("rev").classList.add("hidden");$("tabF").className="btn on";$("tabR").className="btn ghost";};
$("tabR").onclick=()=>{$("rev").classList.remove("hidden");$("fwd").classList.add("hidden");$("tabR").className="btn on";$("tabF").className="btn ghost";};
</script>
</body>
</html>
