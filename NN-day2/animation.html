const fe=(v,d=4)=&gt;{if(Number.isNaN(v))return &#x27;nan&#x27;;if(!isFinite(v))return v&gt;0?&#x27;inf&#x27;:&#x27;-inf&#x27;;const a=Math.abs(v);return a!==0&amp;&amp;(a&gt;=1e5||a&lt;1e-3)?v.toExponential(2):v.toFixed(d);};

  const on=c=&gt;c?&#x27;#4ade80&#x27;:&#x27;#5d7292&#x27;;
  $(&#x27;#neuron&#x27;).innerHTML=`
  &lt;defs&gt;&lt;marker id=&quot;ar&quot; viewBox=&quot;0 0 10 10&quot; refX=&quot;9&quot; refY=&quot;5&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M0,0L10,5L0,10z&quot; fill=&quot;#8a9bb8&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;
  &lt;line x1=&quot;60&quot; y1=&quot;55&quot; x2=&quot;200&quot; y2=&quot;100&quot; stroke=&quot;${x1?&#x27;#f5b942&#x27;:&#x27;#3f5070&#x27;}&quot; stroke-width=&quot;${1+Math.abs(w1)*4}&quot; marker-end=&quot;url(#ar)&quot;/&gt;
  &lt;line x1=&quot;60&quot; y1=&quot;160&quot; x2=&quot;200&quot; y2=&quot;118&quot; stroke=&quot;${x2?&#x27;#f5b942&#x27;:&#x27;#3f5070&#x27;}&quot; stroke-width=&quot;${1+Math.abs(w2)*4}&quot; marker-end=&quot;url(#ar)&quot;/&gt;
  &lt;line x1=&quot;225&quot; y1=&quot;22&quot; x2=&quot;225&quot; y2=&quot;82&quot; stroke=&quot;#c084fc&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;/&gt;
  &lt;text x=&quot;232&quot; y=&quot;20&quot; fill=&quot;#c084fc&quot; font-size=&quot;13&quot;&gt;b = ${f1(b)}&lt;/text&gt;
  &lt;circle cx=&quot;40&quot; cy=&quot;50&quot; r=&quot;22&quot; fill=&quot;#0e1628&quot; stroke=&quot;${on(x1)}&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;40&quot; y=&quot;47&quot; fill=&quot;#dbe4f0&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;x1&lt;/text&gt;&lt;text x=&quot;40&quot; y=&quot;62&quot; fill=&quot;${on(x1)}&quot; font-size=&quot;14&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;${x1}&lt;/text&gt;
  &lt;circle cx=&quot;40&quot; cy=&quot;160&quot; r=&quot;22&quot; fill=&quot;#0e1628&quot; stroke=&quot;${on(x2)}&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;40&quot; y=&quot;157&quot; fill=&quot;#dbe4f0&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;x2&lt;/text&gt;&lt;text x=&quot;40&quot; y=&quot;172&quot; fill=&quot;${on(x2)}&quot; font-size=&quot;14&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;${x2}&lt;/text&gt;
  &lt;text x=&quot;110&quot; y=&quot;62&quot; fill=&quot;#f5b942&quot; font-size=&quot;13&quot;&gt;×W1 = ${f1(w1)}&lt;/text&gt;
  &lt;text x=&quot;110&quot; y=&quot;160&quot; fill=&quot;#f5b942&quot; font-size=&quot;13&quot;&gt;×W2 = ${f1(w2)}&lt;/text&gt;
  &lt;circle cx=&quot;225&quot; cy=&quot;110&quot; r=&quot;26&quot; fill=&quot;#0e1628&quot; stroke=&quot;#2dd4bf&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;225&quot; y=&quot;117&quot; fill=&quot;#2dd4bf&quot; font-size=&quot;20&quot; text-anchor=&quot;middle&quot;&gt;Σ&lt;/text&gt;
  &lt;text x=&quot;225&quot; y=&quot;155&quot; fill=&quot;#dbe4f0&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;s = ${f2(s)}&lt;/text&gt;
  &lt;line x1=&quot;252&quot; y1=&quot;110&quot; x2=&quot;296&quot; y2=&quot;110&quot; stroke=&quot;#8a9bb8&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;/&gt;
  &lt;rect x=&quot;300&quot; y=&quot;84&quot; width=&quot;58&quot; height=&quot;52&quot; rx=&quot;8&quot; fill=&quot;#0e1628&quot; stroke=&quot;#60a5fa&quot; stroke-width=&quot;2&quot;/&gt;
  &lt;polyline points=&quot;308,124 329,124 329,96 350,96&quot; fill=&quot;none&quot; stroke=&quot;#60a5fa&quot; stroke-width=&quot;2&quot;/&gt;
  &lt;text x=&quot;329&quot; y=&quot;152&quot; fill=&quot;#60a5fa&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot;&gt;step&lt;/text&gt;
  &lt;line x1=&quot;360&quot; y1=&quot;110&quot; x2=&quot;392&quot; y2=&quot;110&quot; stroke=&quot;#8a9bb8&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;/&gt;
  &lt;circle cx=&quot;414&quot; cy=&quot;110&quot; r=&quot;20&quot; fill=&quot;${y?&#x27;#123d22&#x27;:&#x27;#2a1212&#x27;}&quot; stroke=&quot;${y?&#x27;#4ade80&#x27;:&#x27;#f87171&#x27;}&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;414&quot; y=&quot;116&quot; fill=&quot;${y?&#x27;#4ade80&#x27;:&#x27;#f87171&#x27;}&quot; font-size=&quot;16&quot; text-anchor=&quot;middle&quot; font-weight=&quot;700&quot;&gt;${y}&lt;/text&gt;
  &lt;text x=&quot;414&quot; y=&quot;148&quot; fill=&quot;#8a9bb8&quot; font-size=&quot;12&quot; text-anchor=&quot;middle&quot;&gt;y&lt;/text&gt;
  &lt;text x=&quot;10&quot; y=&quot;204&quot; fill=&quot;#8a9bb8&quot; font-size=&quot;12&quot;&gt;s = ${x1}·${f1(w1)} + ${x2}·${f1(w2)} + (${f1(b)}) = ${f2(s)} → ${s&gt;1e-9?&#x27;s &amp;gt; 0 → y = 1&#x27;:&#x27;s ≤ 0 → y = 0&#x27;}&lt;/text&gt;`;
}
function plane(){
  const [g,W,H]=fitCanvas($(&#x27;#plane&#x27;));const R=[-0.5,1.5];
  const X=v=&gt;(v-R[0])/(R[1]-R[0])*W, Y=v=&gt;H-(v-R[0])/(R[1]-R[0])*H;
  g.clearRect(0,0,W,H);
  const st=4;g.fillStyle=&#x27;rgba(45,212,191,.16)&#x27;;
  for(let px=0;px&lt;W;px+=st)for(let py=0;py&lt;H;py+=st){const a=R[0]+(px+st/2)/W*2,c=R[0]+(1-(py+st/2)/H)*2;if(S(a,c)&gt;1e-9)g.fillRect(px,py,st,st);}
  g.strokeStyle=&#x27;#1a2540&#x27;;g.lineWidth=1;for(let v=-0.5;v&lt;=1.51;v+=0.5){g.beginPath();g.moveTo(X(v),0);g.lineTo(X(v),H);g.moveTo(0,Y(v));g.lineTo(W,Y(v));g.stroke();}
  g.strokeStyle=&#x27;#3f5070&#x27;;g.beginPath();g.moveTo(X(0),0);g.lineTo(X(0),H);g.moveTo(0,Y(0));g.lineTo(W,Y(0));g.stroke();
  g.font=&#x27;11px Consolas,monospace&#x27;;g.fillStyle=&#x27;#5d7292&#x27;;g.fillText(&#x27;x1&#x27;,W-16,Y(0)-4);g.fillText(&#x27;x2&#x27;,X(0)+4,12);g.fillText(&#x27;1&#x27;,X(1)-3,Y(0)+13);g.fillText(&#x27;1&#x27;,X(0)-10,Y(1)+4);
  // boundary
  g.strokeStyle=&#x27;#2dd4bf&#x27;;g.lineWidth=2.5;g.beginPath();
  if(Math.abs(w2)&gt;1e-9){g.moveTo(X(R[0]),Y(-(w1*R[0]+b)/w2));g.lineTo(X(R[1]),Y(-(w1*R[1]+b)/w2));}
  else if(Math.abs(w1)&gt;1e-9){const xv=-b/w1;g.moveTo(X(xv),0);g.lineTo(X(xv),H);}
  g.stroke();
  IN.forEach(([a,c],i)=&gt;{const y=step(S(a,c));const col=y?&#x27;#4ade80&#x27;:&#x27;#f87171&#x27;;
    g.beginPath();g.arc(X(a),Y(c),9,0,7);g.fillStyle=col;g.fill();
    if(target&amp;&amp;target[i]!==y){g.strokeStyle=&#x27;#f5b942&#x27;;g.lineWidth=3;g.beginPath();g.arc(X(a),Y(c),14,0,7);g.stroke();}
    if(a===x1&amp;&amp;c===x2){g.strokeStyle=&#x27;#dbe4f0&#x27;;g.lineWidth=2;g.beginPath();g.arc(X(a),Y(c),13,0,7);g.stroke();}
    g.fillStyle=&#x27;#dbe4f0&#x27;;g.fillText(`(${a},${c})`,X(a)+12,Y(c)-10);});
}
function table(){
  let ok=0;
  let h=`&lt;tr&gt;&lt;th&gt;x1&lt;/th&gt;&lt;th&gt;x2&lt;/th&gt;&lt;th&gt;s&lt;/th&gt;&lt;th&gt;y&lt;/th&gt;${target?`&lt;th&gt;${gate}&lt;/th&gt;`:&#x27;&#x27;}&lt;/tr&gt;`;
  IN.forEach(([a,c],i)=&gt;{const s=S(a,c),y=step(s),show=i&lt;filled;if(target&amp;&amp;y===target[i])ok++;
    h+=`&lt;tr class=&quot;${i===hl?&#x27;cur&#x27;:&#x27;&#x27;}&quot;&gt;&lt;td&gt;${a}&lt;/td&gt;&lt;td&gt;${c}&lt;/td&gt;&lt;td&gt;${show?f2(s):&#x27;·&#x27;}&lt;/td&gt;&lt;td class=&quot;${show?(target?(y===target[i]?&#x27;ok1&#x27;:&#x27;bad1&#x27;):&#x27;&#x27;):&#x27;&#x27;}&quot;&gt;${show?y:&#x27;·&#x27;}&lt;/td&gt;${target?`&lt;td&gt;${target[i]}&lt;/td&gt;`:&#x27;&#x27;}&lt;/tr&gt;`;});
  $(&#x27;#tt&#x27;).innerHTML=h;
  $(&#x27;#ttnote&#x27;).innerHTML=target?`맞은 행: &lt;b style=&quot;color:${ok===4?&#x27;var(--green)&#x27;:&#x27;var(--amber)&#x27;}&quot;&gt;${ok}/4&lt;/b&gt;`:&#x27;&#x27;;
  return ok;
}
function render(){
  $(&#x27;#w1&#x27;).value=w1;$(&#x27;#w2&#x27;).value=w2;$(&#x27;#bb&#x27;).value=b;$(&#x27;#ow1&#x27;).textContent=f1(w1);$(&#x27;#ow2&#x27;).textContent=f1(w2);$(&#x27;#obb&#x27;).textContent=f1(b);
  $(&#x27;#bx1&#x27;).textContent=&#x27;x1 = &#x27;+x1;$(&#x27;#bx2&#x27;).textContent=&#x27;x2 = &#x27;+x2;$(&#x27;#bx1&#x27;).classList.toggle(&#x27;on1&#x27;,!!x1);$(&#x27;#bx2&#x27;).classList.toggle(&#x27;on1&#x27;,!!x2);
  $(&#x27;#bx1&#x27;).setAttribute(&#x27;aria-pressed&#x27;,!!x1);$(&#x27;#bx2&#x27;).setAttribute(&#x27;aria-pressed&#x27;,!!x2);
  neuron();plane();const ok=table();
  const s=S(x1,x2);
  $(&#x27;#kv&#x27;).innerHTML=`&lt;span&gt;x&lt;/span&gt;&lt;b&gt;[${x1}, ${x2}]&lt;/b&gt;&lt;span&gt;W&lt;/span&gt;&lt;b style=&quot;color:var(--amber)&quot;&gt;[${f1(w1)}, ${f1(w2)}]&lt;/b&gt;&lt;span&gt;b&lt;/span&gt;&lt;b style=&quot;color:var(--purple)&quot;&gt;${f1(b)}&lt;/b&gt;&lt;span&gt;s = x @ W + b&lt;/span&gt;&lt;b&gt;${f2(s)}&lt;/b&gt;&lt;span&gt;y = step(s)&lt;/span&gt;&lt;b style=&quot;color:${step(s)?&#x27;var(--green)&#x27;:&#x27;var(--red)&#x27;}&quot;&gt;${step(s)}&lt;/b&gt;&lt;span&gt;결정 경계&lt;/span&gt;&lt;b style=&quot;color:var(--teal)&quot;&gt;x1·${f1(w1)} + x2·${f1(w2)} + (${f1(b)}) = 0&lt;/b&gt;`;
  const outs=IN.map(([a,c])=&gt;step(S(a,c)));
  setCode(`def perceptron(x, W, b):\n    s = x @ W + b              &lt;span class=&quot;c&quot;&gt;# 가중합 + 편향 (x1·W1 + x2·W2 + b)&lt;/span&gt;\n    return 1 if s &gt; 0 else 0   &lt;span class=&quot;c&quot;&gt;# 계단 함수&lt;/span&gt;\n\nW = np.array([${f1(w1)}, ${f1(w2)}])\nb = ${f1(b)}\nfor x in [(0, 0), (0, 1), (1, 0), (1, 1)]:\n    print(x, perceptron(np.array(x), W, b))\n&lt;span class=&quot;g&quot;&gt;${IN.map(([a,c],i)=&gt;`# (${a}, ${c}) ${outs[i]}`).join(&#x27;\n&#x27;)}&lt;/span&gt;`);
  return ok;
}
function setW(a,c,d){w1=r1(a);w2=r1(c);b=r1(d);}
[&#x27;w1&#x27;,&#x27;w2&#x27;,&#x27;bb&#x27;].forEach(id=&gt;$(&#x27;#&#x27;+id).oninput=e=&gt;{if(busy)return;const v=+e.target.value;if(id===&#x27;w1&#x27;)w1=v;else if(id===&#x27;w2&#x27;)w2=v;else b=v;filled=4;hl=-1;const ok=render();
  setStatus(target&amp;&amp;ok===4?&#x27;ok&#x27;:&#x27;info&#x27;,target?`${gate} 목표: ${ok}/4 행 일치${ok===4?&#x27; — 정답!&#x27;:&#x27;&#x27;}`:`s = ${f2(S(x1,x2))} → y = ${step(S(x1,x2))}`);});
$(&#x27;#bx1&#x27;).onclick=()=&gt;{if(busy)return;x1=1-x1;render();setStatus(&#x27;info&#x27;,`입력 (${x1}, ${x2}) → s = ${f2(S(x1,x2))} → y = ${step(S(x1,x2))}`);};
$(&#x27;#bx2&#x27;).onclick=()=&gt;{if(busy)return;x2=1-x2;render();setStatus(&#x27;info&#x27;,`입력 (${x1}, ${x2}) → s = ${f2(S(x1,x2))} → y = ${step(S(x1,x2))}`);};
window.addEventListener(&#x27;resize&#x27;,plane);

async function truth(g){
  target=GT[g];gate=g;filled=0;render();await sleep(500);
  for(let i=0;i&lt;4;i++){[x1,x2]=IN[i];hl=i;filled=i+1;render();const s=S(x1,x2);
    setStatus(&#x27;info&#x27;,`(${x1}, ${x2}): s = ${x1}·${f1(w1)} + ${x2}·${f1(w2)} + (${f1(b)}) = ${f2(s)} → y = ${step(s)}`);await sleep(850);}
  hl=-1;const ok=render();return ok;
}
async function gatePreset(g,a,c,d){
  setW(a,c,d);const ok=await truth(g);
  setStatus(ok===4?&#x27;ok&#x27;:&#x27;warn&#x27;,`${g}: W = (${f1(w1)}, ${f1(w2)}), b = ${f1(b)} → 진리표 ${ok}/4 일치. 청록 직선 위쪽(s &amp;gt; 0)만 1 입니다.`);
}
const P=[
 {n:&#x27;① AND (0.5, 0.5, −0.7)&#x27;,ex:&#x27;&lt;p&gt;두 입력이 모두 1 일 때만 s = 0.5 + 0.5 − 0.7 = &lt;b class=&quot;green&quot;&gt;0.3 &amp;gt; 0&lt;/b&gt;. 하나만 1 이면 s = −0.2 라 0 입니다. 편향 b 는 &lt;b class=&quot;purple&quot;&gt;문턱값의 반대 부호&lt;/b&gt;(문턱값 = −b) — 얼마나 쉽게 1 이 되는지를 정합니다.&lt;/p&gt;&lt;p&gt;노트북 &lt;code&gt;1-1 perceptron(x, W, b)&lt;/code&gt; 를 구현하면 이 진리표가 그대로 출력됩니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{await gatePreset(&#x27;AND&#x27;,0.5,0.5,-0.7);}},
 {n:&#x27;② OR (0.5, 0.5, −0.2)&#x27;,ex:&#x27;&lt;p&gt;W 는 AND 와 같고 &lt;b class=&quot;purple&quot;&gt;b 만 −0.7 → −0.2&lt;/b&gt; 로 올렸습니다. 이제 입력 하나만 1 이어도 s = 0.3 &amp;gt; 0. 결정 경계 직선이 원점 쪽으로 평행 이동한 것을 확인하세요.&lt;/p&gt;&lt;p&gt;노트북 &lt;code&gt;1-2&lt;/code&gt; 에서 OR 가중치를 채울 때 이 값을 씁니다 — 다른 값도 정답이 될 수 있습니다(슬라이더로 찾아보기).&lt;/p&gt;&#x27;,
  run:async()=&gt;{await gatePreset(&#x27;OR&#x27;,0.5,0.5,-0.2);}},
 {n:&#x27;③ NAND (−0.5, −0.5, 0.7)&#x27;,ex:&#x27;&lt;p&gt;AND 의 W, b 부호를 모두 뒤집으면 출력이 반대인 &lt;b class=&quot;amber&quot;&gt;NAND&lt;/b&gt;. 직선은 그대로, &lt;b class=&quot;teal&quot;&gt;양(+)의 쪽이 반대편&lt;/b&gt;으로 바뀝니다.&lt;/p&gt;&lt;p&gt;NAND 하나만 있으면 모든 논리 회로를 만들 수 있습니다 — 3교시에 NAND · OR · AND 를 쌓아 XOR 을 만듭니다(노트북 1-2, 3-1).&lt;/p&gt;&#x27;,
  run:async()=&gt;{await gatePreset(&#x27;NAND&#x27;,-0.5,-0.5,0.7);}},
 {n:&#x27;④ XOR 은?&#x27;,ex:&#x27;&lt;p&gt;XOR 은 (0,1), (1,0) 만 1 — 두 초록 점이 대각선에 있어 &lt;b class=&quot;red&quot;&gt;직선 하나로 0 과 1 을 나눌 수 없습니다&lt;/b&gt;(선형 분리 불가). 슬라이더의 9,261 가지 조합을 모두 시도해도 최대 3/4.&lt;/p&gt;&lt;p&gt;해결은 층을 쌓는 것: 2교시 학습 규칙도 XOR 에서는 수렴하지 못하고(D2-2), 3교시 &lt;b class=&quot;teal&quot;&gt;다층 퍼셉트론&lt;/b&gt;이 은닉층으로 공간을 바꿔 풉니다(D2-3).&lt;/p&gt;&#x27;,
  run:async()=&gt;{target=GT.XOR;gate=&#x27;XOR&#x27;;
   const tries=[[0.5,0.5,-0.7],[0.5,0.5,-0.2],[-0.5,-0.5,0.7],[1,-1,0],[0.5,0.5,-0.5],[-1,1,-0.2]];
   for(const t of tries){setW(...t);filled=4;hl=-1;const ok=render();setStatus(&#x27;warn&#x27;,`W = (${f1(w1)}, ${f1(w2)}), b = ${f1(b)} → XOR 진리표 ${ok}/4`);await sleep(900);}
   let best=0,cnt=0;
   for(let i=-10;i&lt;=10;i++)for(let j=-10;j&lt;=10;j++)for(let k=-10;k&lt;=10;k++){cnt++;const ww=[i/10,j/10,k/10];let ok=0;IN.forEach(([a,c],n)=&gt;{if((ww[0]*a+ww[1]*c+ww[2]&gt;1e-9?1:0)===GT.XOR[n])ok++;});if(ok&gt;best)best=ok;}
   window.__xorBest=best;
   setStatus(&#x27;warn&#x27;,`슬라이더 전체 ${cnt.toLocaleString()} 조합(W1, W2, b ∈ −1..1, 0.1 간격)을 모두 시도 → 최대 &lt;b&gt;${best}/4&lt;/b&gt;. 직선 하나로는 XOR 을 만들 수 없습니다.`);}},
];
initPresets(P);
render();
$(&#x27;#presets button&#x27;).click();
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;

&lt;body&gt;
&lt;div class=&quot;app&quot;&gt;
  &lt;h1&gt;퍼셉트론 학습 규칙 — 틀린 만큼 고친다&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;샘플을 하나씩 넣어 출력 y = step(xW + b) 와 정답 t 를 비교하고, 틀렸을 때만 &lt;code&gt;W ← W − η(y − t)x&lt;/code&gt;, &lt;code&gt;b ← b − η(y − t)&lt;/code&gt; 로 고칩니다 — 7 · 8교시 경사하강과 같은 (y − t)x 모양. 시작 W = (0, 0), b = 0, η = 0.1, 입력 순서 (0,0) → (0,1) → (1,0) → (1,1).&lt;/p&gt;
  &lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill amber&quot;&gt;W ← W − η(y − t)x&lt;/span&gt;&lt;span class=&quot;pill purple&quot;&gt;b ← b − η(y − t)&lt;/span&gt;&lt;span class=&quot;pill teal&quot;&gt;x2 = −(W1·x1 + b) / W2&lt;/span&gt;&lt;span class=&quot;pill green&quot;&gt;AND: epoch 5 → W=(0.2, 0.1), b=−0.2&lt;/span&gt;&lt;span class=&quot;pill red&quot;&gt;XOR: 정확도 0.5 에서 맴돎&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;결정 경계 · 정확도&lt;/h2&gt;

      &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:#4ade80&quot;&gt;&lt;/i&gt;정답 t = 1&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#f87171&quot;&gt;&lt;/i&gt;정답 t = 0&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#2dd4bf&quot;&gt;&lt;/i&gt;현재 경계&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#5d7292&quot;&gt;&lt;/i&gt;이전 경계&lt;/span&gt;&lt;span&gt;노란 링 = 지금 샘플&lt;/span&gt;&lt;/div&gt;
      &lt;canvas id=&quot;acc&quot;&gt;&lt;/canvas&gt;
      &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:#f5b942&quot;&gt;&lt;/i&gt;epoch 끝 정확도 (0 ~ 1)&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;row&quot; style=&quot;margin-top:10px&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;run&quot; id=&quot;b1&quot;&gt;한 샘플&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;bE&quot;&gt;한 epoch&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;bA&quot;&gt;자동&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;bR&quot;&gt;처음부터&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;현재 값&lt;/h2&gt;&lt;div class=&quot;kv&quot; id=&quot;kv&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;갱신 기록 (최근 8개)&lt;/h2&gt;&lt;div class=&quot;scroll&quot;&gt;&lt;table class=&quot;tt&quot; id=&quot;log&quot;&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;Python (노트북 2-1 · 2-2)&lt;/h2&gt;&lt;div class=&quot;code&quot; id=&quot;code&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;상태&lt;/h2&gt;&lt;div class=&quot;status info&quot; id=&quot;status&quot;&gt;프리셋을 누르세요.&lt;/div&gt;&lt;/div&gt;

&lt;script&gt;
const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,ms));
let busy=false;
function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}
function setCode(h){$(&#x27;#code&#x27;).innerHTML=h;}
function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const g=c.getContext(&#x27;2d&#x27;);g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}
function show(id,title){$$(&#x27;.view&#x27;).forEach(v=&gt;v.classList.toggle(&#x27;on&#x27;,v.id===id));if(title&amp;&amp;$(&#x27;#stageTitle&#x27;))$(&#x27;#stageTitle&#x27;).textContent=title;}
function initPresets(P,stop){$(&#x27;#presets&#x27;).innerHTML=P.map(p=&gt;`&lt;button type=&quot;button&quot;&gt;${p.n}&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}
const sigm=z=&gt;1/(1+Math.exp(-z));
const fe=(v,d=4)=&gt;{if(Number.isNaN(v))return &#x27;nan&#x27;;if(!isFinite(v))return v&gt;0?&#x27;inf&#x27;:&#x27;-inf&#x27;;const a=Math.abs(v);return a!==0&amp;&amp;(a&gt;=1e5||a&lt;1e-3)?v.toExponential(2):v.toFixed(d);};

const IN=[[0,0],[0,1],[1,0],[1,1]];
const GT={AND:[0,0,0,1],OR:[0,1,1,1],XOR:[0,1,1,0]};
const ETA=0.1;
let gate=&#x27;AND&#x27;,w=[0,0],b=0,prev=null,k=0,epoch=0,accH=[],log=[],cur=-1,timer=null;
const rd=v=&gt;Math.round(v*1e6)/1e6, f1=v=&gt;(Math.abs(v)&lt;1e-9?0:v).toFixed(1), f2=v=&gt;(Math.abs(v)&lt;1e-9?0:v).toFixed(2);
const out=(x)=&gt;(w[0]*x[0]+w[1]*x[1]+b&gt;1e-9?1:0);
const acc=()=&gt;IN.reduce((s,x,i)=&gt;s+(out(x)===GT[gate][i]?1:0),0)/4;
function reset(){stopAuto();w=[0,0];b=0;prev=null;k=0;epoch=0;accH=[];log=[];cur=-1;render();}
function one(){
  const i=k%4,x=IN[i],t=GT[gate][i],y=out(x),e=t-y;
  prev=[w[0],w[1],b];
  w=[rd(w[0]+ETA*e*x[0]),rd(w[1]+ETA*e*x[1])];b=rd(b+ETA*e);
  k++;cur=i;
  let ep=null;
  if(k%4===0){epoch++;ep=acc();accH.push(ep);}
  log.push({ep:Math.floor((k-1)/4)+1,x,t,y,e,w:w.slice(),b});if(log.length&gt;8)log.shift();
  render();
  const msg=e===0?`epoch ${Math.floor((k-1)/4)+1} 샘플 (${x}) : y = ${y}, t = ${t} → y − t = 0, 갱신 없음`:
    `epoch ${Math.floor((k-1)/4)+1} 샘플 (${x}) : y = ${y}, t = ${t} → y − t = ${-e} → W ← (${f1(prev[0])}, ${f1(prev[1])}) − 0.1·(${-e})·(${x}) = (${f1(w[0])}, ${f1(w[1])}), b ← ${f1(prev[2])} − 0.1·(${-e}) = ${f1(b)}`;
  if(ep!==null)setStatus(ep===1?&#x27;ok&#x27;:&#x27;info&#x27;,msg+`&lt;br&gt;&lt;b&gt;epoch ${epoch} 끝 정확도 = ${ep.toFixed(2)}&lt;/b&gt;`);
  else setStatus(&#x27;info&#x27;,msg);
  return ep;
}
function oneEpoch(){let ep;do{ep=one();}while(ep===null);return ep;}
function draw(){
  const [g,W,H]=fitCanvas($(&#x27;#plane&#x27;));const R=[-0.5,1.5];
  const X=v=&gt;(v-R[0])/(R[1]-R[0])*W, Y=v=&gt;H-(v-R[0])/(R[1]-R[0])*H;
  g.clearRect(0,0,W,H);
  const st=4;g.fillStyle=&#x27;rgba(45,212,191,.15)&#x27;;
  for(let px=0;px&lt;W;px+=st)for(let py=0;py&lt;H;py+=st){const a=R[0]+(px+st/2)/W*2,c=R[0]+(1-(py+st/2)/H)*2;if(w[0]*a+w[1]*c+b&gt;1e-9)g.fillRect(px,py,st,st);}
  g.strokeStyle=&#x27;#1a2540&#x27;;g.lineWidth=1;for(let v=-0.5;v&lt;=1.51;v+=0.5){g.beginPath();g.moveTo(X(v),0);g.lineTo(X(v),H);g.moveTo(0,Y(v));g.lineTo(W,Y(v));g.stroke();}
  g.strokeStyle=&#x27;#3f5070&#x27;;g.beginPath();g.moveTo(X(0),0);g.lineTo(X(0),H);g.moveTo(0,Y(0));g.lineTo(W,Y(0));g.stroke();
  const line=(p,col,wd,dash)=&gt;{const [a,c,d]=p;g.setLineDash(dash);g.strokeStyle=col;g.lineWidth=wd;g.beginPath();
    if(Math.abs(c)&gt;1e-9){g.moveTo(X(R[0]),Y(-(a*R[0]+d)/c));g.lineTo(X(R[1]),Y(-(a*R[1]+d)/c));}
    else if(Math.abs(a)&gt;1e-9){const xv=-d/a;g.moveTo(X(xv),0);g.lineTo(X(xv),H);}
    g.stroke();g.setLineDash([]);};
  if(prev)line(prev,&#x27;#5d7292&#x27;,1.5,[5,5]);
  line([w[0],w[1],b],&#x27;#2dd4bf&#x27;,2.5,[]);
  g.font=&#x27;11px Consolas,monospace&#x27;;
  IN.forEach((x,i)=&gt;{const t=GT[gate][i],y=out(x);g.beginPath();g.arc(X(x[0]),Y(x[1]),9,0,7);g.fillStyle=t?&#x27;#4ade80&#x27;:&#x27;#f87171&#x27;;g.fill();
    if(y!==t){g.strokeStyle=&#x27;#dbe4f0&#x27;;g.lineWidth=1.5;g.beginPath();g.moveTo(X(x[0])-5,Y(x[1])-5);g.lineTo(X(x[0])+5,Y(x[1])+5);g.moveTo(X(x[0])+5,Y(x[1])-5);g.lineTo(X(x[0])-5,Y(x[1])+5);g.stroke();}
    if(i===cur){g.strokeStyle=&#x27;#f5b942&#x27;;g.lineWidth=3;g.beginPath();g.arc(X(x[0]),Y(x[1]),15,0,7);g.stroke();}
    g.fillStyle=&#x27;#dbe4f0&#x27;;g.fillText(`(${x})`,X(x[0])+12,Y(x[1])-12);});
  if(Math.abs(w[0])&lt;1e-9&amp;&amp;Math.abs(w[1])&lt;1e-9){g.fillStyle=&#x27;#8a9bb8&#x27;;g.fillText(`W = (0, 0): 경계 없음 — 모든 점 y = ${b&gt;1e-9?1:0}`,8,16);}
  drawAcc();
}
function drawAcc(){
  const [g,W,H]=fitCanvas($(&#x27;#acc&#x27;));g.clearRect(0,0,W,H);g.font=&#x27;11px Consolas,monospace&#x27;;
  const n=Math.max(accH.length,10),X=i=&gt;26+i/(n-1)*(W-34),Y=v=&gt;6+(1-v)*(H-20);
  g.strokeStyle=&#x27;#1a2540&#x27;;[0,0.5,1].forEach(v=&gt;{g.beginPath();g.moveTo(26,Y(v));g.lineTo(W,Y(v));g.stroke();g.fillStyle=&#x27;#5d7292&#x27;;g.fillText(v.toFixed(1),2,Y(v)+4);});
  g.fillText(&#x27;epoch&#x27;,W-40,H-2);
  if(!accH.length)return;
  g.strokeStyle=&#x27;#f5b942&#x27;;g.lineWidth=2;g.beginPath();accH.forEach((v,i)=&gt;i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));g.stroke();
  accH.forEach((v,i)=&gt;{g.fillStyle=v===1?&#x27;#4ade80&#x27;:&#x27;#f5b942&#x27;;g.beginPath();g.arc(X(i),Y(v),2.5,0,7);g.fill();});
}
function render(){
  draw();
  $$(&#x27;#gbtn button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;sel&#x27;,x.dataset.g===gate));
  const a=acc();
  $(&#x27;#kv&#x27;).innerHTML=`&lt;span&gt;게이트&lt;/span&gt;&lt;b&gt;${gate}  t = [${GT[gate]}]&lt;/b&gt;&lt;span&gt;epoch (완료)&lt;/span&gt;&lt;b&gt;${epoch}&lt;/b&gt;&lt;span&gt;다음 샘플&lt;/span&gt;&lt;b&gt;(${IN[k%4]})&lt;/b&gt;&lt;span&gt;W&lt;/span&gt;&lt;b style=&quot;color:var(--amber)&quot;&gt;(${f1(w[0])}, ${f1(w[1])})&lt;/b&gt;&lt;span&gt;b&lt;/span&gt;&lt;b style=&quot;color:var(--purple)&quot;&gt;${f1(b)}&lt;/b&gt;&lt;span&gt;현재 정확도&lt;/span&gt;&lt;b style=&quot;color:${a===1?&#x27;var(--green)&#x27;:&#x27;var(--amber)&#x27;}&quot;&gt;${a.toFixed(2)}&lt;/b&gt;&lt;span&gt;경계&lt;/span&gt;&lt;b style=&quot;color:var(--teal)&quot;&gt;${Math.abs(w[1])&gt;1e-9?`x2 = −(${f1(w[0])}·x1 + (${f1(b)})) / ${f1(w[1])}`:&#x27;(W2 = 0)&#x27;}&lt;/b&gt;`;
  $(&#x27;#log&#x27;).innerHTML=&#x27;&lt;tr&gt;&lt;th&gt;ep&lt;/th&gt;&lt;th&gt;x&lt;/th&gt;&lt;th&gt;t&lt;/th&gt;&lt;th&gt;y&lt;/th&gt;&lt;th&gt;y−t&lt;/th&gt;&lt;th&gt;W&lt;/th&gt;&lt;th&gt;b&lt;/th&gt;&lt;/tr&gt;&#x27;+log.map(r=&gt;`&lt;tr&gt;&lt;td&gt;${r.ep}&lt;/td&gt;&lt;td&gt;(${r.x})&lt;/td&gt;&lt;td&gt;${r.t}&lt;/td&gt;&lt;td&gt;${r.y}&lt;/td&gt;&lt;td class=&quot;${r.e?&#x27;bad1&#x27;:&#x27;dim&#x27;}&quot;&gt;${-r.e||0}&lt;/td&gt;&lt;td&gt;(${f1(r.w[0])}, ${f1(r.w[1])})&lt;/td&gt;&lt;td&gt;${f1(r.b)}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;);
  setCode(`X = np.array([[0, 0], [0, 1], [1, 0], [1, 1]])\nT = np.array([${GT[gate]}])        &lt;span class=&quot;c&quot;&gt;# ${gate}&lt;/span&gt;\nW, b, eta = np.zeros(2), 0.0, 0.1\nfor epoch in range(epochs):\n    for x, t in zip(X, T):\n        y = perceptron(x, W, b)       &lt;span class=&quot;c&quot;&gt;# step(x @ W + b)&lt;/span&gt;\n&lt;span class=&quot;a&quot;&gt;        W = W - eta * (y - t) * x     # 2-1&lt;/span&gt;\n&lt;span class=&quot;a&quot;&gt;        b = b - eta * (y - t)&lt;/span&gt;\n&lt;span class=&quot;c&quot;&gt;# 2-2 결정 경계: x2 = -(W[0]*x1 + b) / W[1]&lt;/span&gt;\n&lt;span class=&quot;g&quot;&gt;# epoch ${epoch}: W = [${f1(w[0])}, ${f1(w[1])}], b = ${f1(b)}, acc = ${a.toFixed(2)}&lt;/span&gt;`);
}
function stopAuto(){clearInterval(timer);timer=null;$(&#x27;#bA&#x27;).textContent=&#x27;자동&#x27;;}
function auto(){if(timer){stopAuto();return;}$(&#x27;#bA&#x27;).textContent=&#x27;정지&#x27;;
  timer=setInterval(()=&gt;{one();const done=(k%4===0)&amp;&amp;(accH[accH.length-1]===1&amp;&amp;gate!==&#x27;XOR&#x27;);if(done||epoch&gt;=50){stopAuto();if(done)setStatus(&#x27;ok&#x27;,`epoch ${epoch} 에서 정확도 1.0 — W = (${f1(w[0])}, ${f1(w[1])}), b = ${f1(b)} 로 수렴.`);}},220);}
$(&#x27;#gbtn&#x27;).innerHTML=Object.keys(GT).map(g=&gt;`&lt;button type=&quot;button&quot; data-g=&quot;${g}&quot;&gt;${g}&lt;/button&gt;`).join(&#x27; &#x27;);
$$(&#x27;#gbtn button&#x27;).forEach(x=&gt;x.onclick=()=&gt;{if(busy)return;gate=x.dataset.g;reset();setStatus(&#x27;info&#x27;,`${gate} 처음부터: W = (0, 0), b = 0`);});
$(&#x27;#b1&#x27;).onclick=()=&gt;{if(busy)return;stopAuto();one();};
$(&#x27;#bE&#x27;).onclick=()=&gt;{if(busy)return;stopAuto();if(k%4)while(k%4)one();else oneEpoch();};
$(&#x27;#bA&#x27;).onclick=()=&gt;{if(busy)return;auto();};
$(&#x27;#bR&#x27;).onclick=()=&gt;{if(busy)return;reset();setStatus(&#x27;info&#x27;,`${gate} 처음부터: W = (0, 0), b = 0`);};
window.addEventListener(&#x27;resize&#x27;,draw);

const P=[
 {n:&#x27;① AND — 한 샘플씩&#x27;,ex:&#x27;&lt;p&gt;W = (0, 0), b = 0 에서는 s = 0 이라 모든 출력이 0. 첫 샘플 (0,0) 은 t = 0 이라 맞음 → 갱신 없음. &lt;b class=&quot;amber&quot;&gt;틀린 샘플에서만&lt;/b&gt; −η(y − t)·x 만큼 W 가 움직입니다 — 입력이 0 인 성분은 바뀌지 않습니다. y − t 는 7교시 선형 회귀의 기울기 (y − t)x 와 같은 &amp;lsquo;오차&amp;rsquo;입니다.&lt;/p&gt;&lt;p&gt;노트북 &lt;code&gt;2-1&lt;/code&gt; 은 이 두 줄 갱신식을 채우는 문제입니다. 점선 = 갱신 전 경계, 청록 = 갱신 후.&lt;/p&gt;&#x27;,
  run:async()=&gt;{gate=&#x27;AND&#x27;;reset();setStatus(&#x27;info&#x27;,&#x27;AND, W = (0, 0), b = 0, η = 0.1 에서 시작&#x27;);await sleep(800);
   for(let i=0;i&lt;8;i++){one();await sleep(1100);}
   setStatus(&#x27;info&#x27;,`2 epoch(샘플 8개) 끝: W = (${f1(w[0])}, ${f1(w[1])}), b = ${f1(b)}, 정확도 ${acc().toFixed(2)}. ② 에서 수렴까지.`);}},
 {n:&#x27;② AND — 수렴까지 (epoch 5)&#x27;,ex:&#x27;&lt;p&gt;epoch 별 정확도 0.25 → 0.5 → 0.75 → 0.5 → &lt;b class=&quot;green&quot;&gt;1.0&lt;/b&gt;. 5 epoch 째 &lt;b class=&quot;green&quot;&gt;W = (0.2, 0.1), b = −0.2&lt;/b&gt; 에서 더 이상 틀리는 샘플이 없어 멈춥니다(수렴).&lt;/p&gt;&lt;p&gt;찾은 값은 1교시의 (0.5, 0.5, −0.7) 과 다르지만 &lt;b class=&quot;teal&quot;&gt;같은 진리표&lt;/b&gt;를 만드는 또 다른 직선입니다. 경계 x2 = −(0.2·x1 − 0.2)/0.1 = 2 − 2·x1 (노트북 2-2).&lt;/p&gt;&#x27;,
  run:async()=&gt;{gate=&#x27;AND&#x27;;reset();await sleep(500);
   for(let e=0;e&lt;5;e++){for(let i=0;i&lt;4;i++){one();await sleep(380);}await sleep(500);}
   window.__and=[w[0],w[1],b,epoch,acc(),accH.slice()];
   setStatus(&#x27;ok&#x27;,`epoch ${epoch}: 정확도 ${accH[accH.length-1].toFixed(2)} → W = (${f1(w[0])}, ${f1(w[1])}), b = ${f1(b)} 로 수렴. 정확도 기록 [${accH.map(v=&gt;v.toFixed(2)).join(&#x27;, &#x27;)}]`);}},
 {n:&#x27;③ OR 학습&#x27;,ex:&#x27;&lt;p&gt;OR 은 더 쉬워 &lt;b class=&quot;green&quot;&gt;epoch 3&lt;/b&gt; 에 정확도 1.0 (W = (0.1, 0.1), b = 0.0). s = 0 인 (0,0) 은 계단 함수 &lt;code&gt;s &amp;gt; 0&lt;/code&gt; 규칙에 따라 0 — 경계선 위의 점은 0 쪽입니다.&lt;/p&gt;&lt;p&gt;학습 규칙은 &lt;b class=&quot;teal&quot;&gt;선형 분리 가능&lt;/b&gt;하기만 하면 언젠가 반드시 수렴합니다(퍼셉트론 수렴 정리).&lt;/p&gt;&#x27;,
  run:async()=&gt;{gate=&#x27;OR&#x27;;reset();await sleep(500);
   for(let e=0;e&lt;4;e++){for(let i=0;i&lt;4;i++){one();await sleep(380);}await sleep(400);}
   setStatus(&#x27;ok&#x27;,`OR: 정확도 기록 [${accH.map(v=&gt;v.toFixed(2)).join(&#x27;, &#x27;)}] → W = (${f1(w[0])}, ${f1(w[1])}), b = ${f1(b)}`);}},
 {n:&#x27;④ XOR — 50 epoch&#x27;,ex:&#x27;&lt;p&gt;XOR 은 50 epoch 을 돌려도 정확도가 &lt;b class=&quot;red&quot;&gt;0.5 에서 맴돌고 1.0 에 도달하지 못합니다&lt;/b&gt;. 한 샘플을 맞추려 직선을 옮기면 다른 샘플이 틀려 W, b 가 같은 값들을 순환합니다.&lt;/p&gt;&lt;p&gt;직선 하나(뉴런 하나)의 한계 — 1969년 Minsky · Papert 가 지적한 문제입니다. 3교시 &lt;b class=&quot;teal&quot;&gt;은닉층&lt;/b&gt;을 넣으면 해결됩니다(D2-3).&lt;/p&gt;&#x27;,
  run:async()=&gt;{gate=&#x27;XOR&#x27;;reset();await sleep(400);
   for(let e=0;e&lt;50;e++){oneEpoch();await sleep(e&lt;6?500:70);}
   window.__xor=accH.slice();
   setStatus(&#x27;warn&#x27;,`XOR 50 epoch: 정확도 최댓값 ${Math.max(...accH).toFixed(2)}, 최솟값 ${Math.min(...accH).toFixed(2)} — 1.0 에 한 번도 도달하지 못함. 마지막 W = (${f1(w[0])}, ${f1(w[1])}), b = ${f1(b)}`);}},
];
initPresets(P,stopAuto);
reset();
$(&#x27;#presets button&#x27;).click();
&lt;/script&gt;

&lt;body&gt;
&lt;div class=&quot;app&quot;&gt;
  &lt;h1&gt;XOR = AND(NAND(x1, x2), OR(x1, x2)) — 층을 쌓으면 된다&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;은닉층 뉴런 두 개(&lt;b style=&quot;color:var(--purple)&quot;&gt;NAND&lt;/b&gt;, &lt;b style=&quot;color:var(--green)&quot;&gt;OR&lt;/b&gt;)의 출력을 새 좌표 (s1, s2) 로 보면, XOR 의 네 점이 &lt;b style=&quot;color:var(--teal)&quot;&gt;직선 하나로 나뉘는 위치&lt;/b&gt;로 옮겨집니다. 출력 뉴런(AND)은 그 직선입니다.&lt;/p&gt;
  &lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill purple&quot;&gt;s1 = NAND(x1, x2)&lt;/span&gt;&lt;span class=&quot;pill green&quot;&gt;s2 = OR(x1, x2)&lt;/span&gt;&lt;span class=&quot;pill amber&quot;&gt;y = AND(s1, s2)&lt;/span&gt;&lt;span class=&quot;pill blue&quot;&gt;h = step(X @ W1 + b1)&lt;/span&gt;&lt;span class=&quot;pill teal&quot;&gt;y = step(h @ W2 + b2)&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;grid&quot;&gt;

        &lt;svg id=&quot;net&quot; viewBox=&quot;0 0 460 250&quot; role=&quot;img&quot; aria-label=&quot;2층 XOR 네트워크&quot;&gt;&lt;/svg&gt;

&lt;script&gt;
const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,ms));
let busy=false;
function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}
function setCode(h){$(&#x27;#code&#x27;).innerHTML=h;}
function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const g=c.getContext(&#x27;2d&#x27;);g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}
function show(id,title){$$(&#x27;.view&#x27;).forEach(v=&gt;v.classList.toggle(&#x27;on&#x27;,v.id===id));if(title&amp;&amp;$(&#x27;#stageTitle&#x27;))$(&#x27;#stageTitle&#x27;).textContent=title;}
function initPresets(P,stop){$(&#x27;#presets&#x27;).innerHTML=P.map(p=&gt;`&lt;button type=&quot;button&quot;&gt;${p.n}&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}
const sigm=z=&gt;1/(1+Math.exp(-z));
const fe=(v,d=4)=&gt;{if(Number.isNaN(v))return &#x27;nan&#x27;;if(!isFinite(v))return v&gt;0?&#x27;inf&#x27;:&#x27;-inf&#x27;;const a=Math.abs(v);return a!==0&amp;&amp;(a&gt;=1e5||a&lt;1e-3)?v.toExponential(2):v.toFixed(d);};

const IN=[[0,0],[0,1],[1,0],[1,1]], XOR=[0,1,1,0];
const W1=[[-0.5,0.5],[-0.5,0.5]], b1=[0.7,-0.2], W2=[0.5,0.5], b2=-0.7;
const st=s=&gt;s&gt;1e-9?1:0;
function fwd(x){const a=[0,1].map(j=&gt;x[0]*W1[0][j]+x[1]*W1[1][j]+b1[j]);const h=a.map(st);const s=h[0]*W2[0]+h[1]*W2[1]+b2;return {a,h,s,y:st(s)};}
let sel=[1,0],phase=3,rows=[];   // phase 0: 입력, 1: 은닉 합, 2: 은닉 출력, 3: 출력
const f2=v=&gt;(Math.abs(v)&lt;1e-9?0:v).toFixed(1);
function net(){
  const r=fwd(sel);
  const N={x1:[50,70],x2:[50,180],h1:[230,70],h2:[230,180],y:[400,125]};
  const act=(p)=&gt;phase&gt;=p;
  const E=(a,c,wt,p,on)=&gt;{const [x1,y1]=N[a],[x2,y2]=N[c];const lit=act(p)&amp;&amp;on;return `&lt;line class=&quot;edge&quot; x1=&quot;${x1+22}&quot; y1=&quot;${y1}&quot; x2=&quot;${x2-24}&quot; y2=&quot;${y2}&quot; stroke=&quot;${lit?&#x27;#f5b942&#x27;:&#x27;#2a3a5c&#x27;}&quot; stroke-width=&quot;${lit?3:1.5}&quot;/&gt;&lt;text x=&quot;${(x1+x2)/2+(y2&gt;y1?-14:-10)}&quot; y=&quot;${(y1+y2)/2+(y2&gt;y1?-6:14)+(a===&#x27;x2&#x27;&amp;&amp;c===&#x27;h1&#x27;?40:0)+(a===&#x27;x1&#x27;&amp;&amp;c===&#x27;h2&#x27;?-40:0)}&quot; fill=&quot;#8a9bb8&quot; font-size=&quot;11&quot;&gt;${f2(wt)}&lt;/text&gt;`;};
  let h=&#x27;&#x27;;
  h+=E(&#x27;x1&#x27;,&#x27;h1&#x27;,W1[0][0],1,sel[0])+E(&#x27;x2&#x27;,&#x27;h1&#x27;,W1[1][0],1,sel[1])+E(&#x27;x1&#x27;,&#x27;h2&#x27;,W1[0][1],1,sel[0])+E(&#x27;x2&#x27;,&#x27;h2&#x27;,W1[1][1],1,sel[1]);
  h+=E(&#x27;h1&#x27;,&#x27;y&#x27;,W2[0],3,r.h[0])+E(&#x27;h2&#x27;,&#x27;y&#x27;,W2[1],3,r.h[1]);
  const node=(k,lab,val,col,show,sub)=&gt;{const [x,y]=N[k];return `&lt;circle cx=&quot;${x}&quot; cy=&quot;${y}&quot; r=&quot;24&quot; fill=&quot;#0e1628&quot; stroke=&quot;${col}&quot; stroke-width=&quot;2&quot;/&gt;&lt;text x=&quot;${x}&quot; y=&quot;${y-4}&quot; fill=&quot;#dbe4f0&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot;&gt;${lab}&lt;/text&gt;&lt;text x=&quot;${x}&quot; y=&quot;${y+12}&quot; fill=&quot;${show?(val?&#x27;#4ade80&#x27;:&#x27;#f87171&#x27;):&#x27;#3f5070&#x27;}&quot; font-size=&quot;14&quot; font-weight=&quot;700&quot; text-anchor=&quot;middle&quot;&gt;${show?val:&#x27;?&#x27;}&lt;/text&gt;${sub?`&lt;text x=&quot;${x}&quot; y=&quot;${y+40}&quot; fill=&quot;#8a9bb8&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot;&gt;${sub}&lt;/text&gt;`:&#x27;&#x27;}`;};
  h+=node(&#x27;x1&#x27;,&#x27;x1&#x27;,sel[0],&#x27;#60a5fa&#x27;,true)+node(&#x27;x2&#x27;,&#x27;x2&#x27;,sel[1],&#x27;#60a5fa&#x27;,true);
  h+=node(&#x27;h1&#x27;,&#x27;s1 NAND&#x27;,r.h[0],&#x27;#c084fc&#x27;,phase&gt;=2,phase&gt;=1?`a=${f2(r.a[0])}`:&#x27;b=0.7&#x27;);
  h+=node(&#x27;h2&#x27;,&#x27;s2 OR&#x27;,r.h[1],&#x27;#4ade80&#x27;,phase&gt;=2,phase&gt;=1?`a=${f2(r.a[1])}`:&#x27;b=−0.2&#x27;);
  h+=node(&#x27;y&#x27;,&#x27;y AND&#x27;,r.y,&#x27;#f5b942&#x27;,phase&gt;=3,phase&gt;=3?`s=${f2(r.s)}`:&#x27;b=−0.7&#x27;);
  h+=`&lt;text x=&quot;50&quot; y=&quot;240&quot; fill=&quot;#8a9bb8&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot;&gt;입력층&lt;/text&gt;&lt;text x=&quot;230&quot; y=&quot;240&quot; fill=&quot;#8a9bb8&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot;&gt;은닉층 (step)&lt;/text&gt;&lt;text x=&quot;400&quot; y=&quot;240&quot; fill=&quot;#8a9bb8&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot;&gt;출력층 (step)&lt;/text&gt;`;
  $(&#x27;#net&#x27;).innerHTML=h;
  $$(&#x27;#ibtn button&#x27;).forEach(b=&gt;b.classList.toggle(&#x27;sel&#x27;,b.dataset.v===sel.join(&#x27;,&#x27;)));
  $(&#x27;#tt&#x27;).innerHTML=&#x27;&lt;tr&gt;&lt;th&gt;x1&lt;/th&gt;&lt;th&gt;x2&lt;/th&gt;&lt;th&gt;s1 = NAND&lt;/th&gt;&lt;th&gt;s2 = OR&lt;/th&gt;&lt;th&gt;y = AND(s1,s2)&lt;/th&gt;&lt;th&gt;XOR&lt;/th&gt;&lt;/tr&gt;&#x27;+IN.map((x,i)=&gt;{const r=fwd(x),d=rows.includes(i);return `&lt;tr class=&quot;${x.join()===sel.join()?&#x27;cur&#x27;:&#x27;&#x27;}&quot;&gt;&lt;td&gt;${x[0]}&lt;/td&gt;&lt;td&gt;${x[1]}&lt;/td&gt;&lt;td&gt;${d?r.h[0]:&#x27;·&#x27;}&lt;/td&gt;&lt;td&gt;${d?r.h[1]:&#x27;·&#x27;}&lt;/td&gt;&lt;td class=&quot;${d?(r.y===XOR[i]?&#x27;ok1&#x27;:&#x27;bad1&#x27;):&#x27;&#x27;}&quot;&gt;${d?r.y:&#x27;·&#x27;}&lt;/td&gt;&lt;td&gt;${XOR[i]}&lt;/td&gt;&lt;/tr&gt;`;}).join(&#x27;&#x27;);
}
function codeGate(){const r=fwd(sel);
  setCode(`def XOR(x1, x2):              &lt;span class=&quot;c&quot;&gt;# 3-1&lt;/span&gt;\n    s1 = NAND(x1, x2)\n    s2 = OR(x1, x2)\n    return AND(s1, s2)\n\nXOR(${sel[0]}, ${sel[1]})\n&lt;span class=&quot;c&quot;&gt;# s1 = NAND(${sel}) = ${r.h[0]}, s2 = OR(${sel}) = ${r.h[1]}&lt;/span&gt;\n&lt;span class=&quot;g&quot;&gt;# AND(${r.h[0]}, ${r.h[1]}) = ${r.y}&lt;/span&gt;`);}
function codeMat(){
  setCode(`W1 = np.array([[-0.5, 0.5],      &lt;span class=&quot;c&quot;&gt;# 열0 NAND, 열1 OR&lt;/span&gt;\n               [-0.5, 0.5]])\nb1 = np.array([0.7, -0.2])\nW2 = np.array([[0.5], [0.5]])    &lt;span class=&quot;c&quot;&gt;# AND&lt;/span&gt;\nb2 = np.array([-0.7])\n\nX = np.array([[0,0],[0,1],[1,0],[1,1]])  &lt;span class=&quot;c&quot;&gt;# (4,2)&lt;/span&gt;\nh = (X @ W1 + b1 &gt; 0).astype(int)        &lt;span class=&quot;c&quot;&gt;# (4,2)&lt;/span&gt;\ny = (h @ W2 + b2 &gt; 0).astype(int)        &lt;span class=&quot;c&quot;&gt;# (4,1)&lt;/span&gt;\n&lt;span class=&quot;g&quot;&gt;# X@W1+b1 = ${JSON.stringify(IN.map(x=&gt;fwd(x).a.map(v=&gt;+v.toFixed(1))))}\n# h = ${JSON.stringify(IN.map(x=&gt;fwd(x).h))}\n# y.ravel() = ${JSON.stringify(IN.map(x=&gt;fwd(x).y))}&lt;/span&gt;`);}
$(&#x27;#mat&#x27;).innerHTML=`&lt;div&gt;&lt;b&gt;W1&lt;/b&gt; (2,2)\n[[-0.5,  0.5],\n [-0.5,  0.5]]&lt;/div&gt;&lt;div&gt;&lt;b&gt;b1&lt;/b&gt; (2,)\n[ 0.7, -0.2]&lt;/div&gt;&lt;div&gt;&lt;b&gt;W2&lt;/b&gt; (2,1)\n[[0.5],\n [0.5]]&lt;/div&gt;&lt;div&gt;&lt;b&gt;b2&lt;/b&gt; (1,)\n[-0.7]&lt;/div&gt;`;
$(&#x27;#ibtn&#x27;).innerHTML=IN.map(x=&gt;`&lt;button type=&quot;button&quot; data-v=&quot;${x}&quot;&gt;(${x})&lt;/button&gt;`).join(&#x27; &#x27;);
$$(&#x27;#ibtn button&#x27;).forEach(b=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;try{show(&#x27;vNet&#x27;,&#x27;2층 네트워크&#x27;);sel=b.dataset.v.split(&#x27;,&#x27;).map(Number);await flow(450);}finally{busy=false;}});
async function flow(ms){
  const r=fwd(sel);codeGate();
  phase=0;net();setStatus(&#x27;info&#x27;,`입력 (${sel}) 을 넣습니다.`);await sleep(ms);
  phase=1;net();setStatus(&#x27;info&#x27;,`은닉 합: a1 = −0.5·${sel[0]} − 0.5·${sel[1]} + 0.7 = ${f2(r.a[0])}, a2 = 0.5·${sel[0]} + 0.5·${sel[1]} − 0.2 = ${f2(r.a[1])}`);await sleep(ms*1.6);
  phase=2;net();setStatus(&#x27;info&#x27;,`step → s1 (NAND) = ${r.h[0]}, s2 (OR) = ${r.h[1]}`);await sleep(ms*1.4);
  phase=3;const i=IN.findIndex(x=&gt;x.join()===sel.join());if(!rows.includes(i))rows.push(i);net();
  setStatus(&#x27;ok&#x27;,`출력: 0.5·${r.h[0]} + 0.5·${r.h[1]} − 0.7 = ${f2(r.s)} → y = ${r.y} (XOR(${sel}) = ${XOR[i]})`);await sleep(ms);
}
/* 공간 변환 */
let tmix=0;
function space(){
  const [g,W,H]=fitCanvas($(&#x27;#space&#x27;));g.clearRect(0,0,W,H);
  const V=W&lt;520, pw=V?W-20:(W-30)/2, ph=V?(H-60)/2:H-36, R=[-0.4,1.4];
  const OX=k=&gt;V?10:10+k*(pw+10), OY=k=&gt;V?8+k*(ph+30):8;
  const P=(k,u,v)=&gt;[OX(k)+(u-R[0])/(R[1]-R[0])*pw, OY(k)+(1-(v-R[0])/(R[1]-R[0]))*ph];
  g.font=&#x27;12px Consolas,monospace&#x27;;
  for(let k=0;k&lt;2;k++){
    g.strokeStyle=&#x27;#1f2b45&#x27;;g.strokeRect(OX(k),OY(k),pw,ph);
    g.strokeStyle=&#x27;#3f5070&#x27;;const [ox,oy]=P(k,0,0),[ax]=P(k,1.4,0),[,ay]=P(k,0,1.4),[bx]=P(k,R[0],0),[,by]=P(k,0,R[0]);
    g.beginPath();g.moveTo(bx,oy);g.lineTo(ax,oy);g.moveTo(ox,by);g.lineTo(ox,ay);g.stroke();
    g.fillStyle=&#x27;#8a9bb8&#x27;;g.fillText(k?&#x27;h 공간 (s1, s2)&#x27;:&#x27;x 공간 (x1, x2)&#x27;,OX(k)+4,OY(k)+ph+16);
    g.fillStyle=&#x27;#5d7292&#x27;;g.fillText(k?&#x27;s1&#x27;:&#x27;x1&#x27;,ax-16,oy-4);g.fillText(k?&#x27;s2&#x27;:&#x27;x2&#x27;,ox+4,ay+12);
    const [p1x,p1y]=P(k,1,0),[q1x,q1y]=P(k,0,1);g.fillText(&#x27;1&#x27;,p1x-3,p1y+13);g.fillText(&#x27;1&#x27;,q1x-10,q1y+4);
  }
  // AND line in h-space (clip to panel)
  if(tmix&gt;0.98){g.save();g.beginPath();g.rect(OX(1),OY(1),pw,ph);g.clip();g.fillStyle=&#x27;rgba(245,185,66,.10)&#x27;;
    g.beginPath();const s=u=&gt;1.4-u;g.moveTo(...P(1,-0.4,s(-0.4)));g.lineTo(...P(1,1.4,s(1.4)));g.lineTo(...P(1,1.4,1.4));g.lineTo(...P(1,-0.4,1.4));g.closePath();g.fill();
    g.strokeStyle=&#x27;#f5b942&#x27;;g.lineWidth=2.5;g.beginPath();g.moveTo(...P(1,-0.4,s(-0.4)));g.lineTo(...P(1,1.4,s(1.4)));g.stroke();g.restore();}
  // points
  const e=tmix&lt;0.5?2*tmix*tmix:1-2*(1-tmix)*(1-tmix);
  IN.forEach((x,i)=&gt;{const h=fwd(x).h;const [ax,ay]=P(0,x[0],x[1]),[bx,by]=P(1,h[0],h[1]);
    g.fillStyle=XOR[i]?&#x27;rgba(74,222,128,.25)&#x27;:&#x27;rgba(248,113,113,.25)&#x27;;g.beginPath();g.arc(ax,ay,8,0,7);g.fill();
    const off=(x.join()===&#x27;0,1&#x27;?-5:x.join()===&#x27;1,0&#x27;?5:0)*e;
    const px=ax+(bx-ax)*e+off,py=ay+(by-ay)*e;
    g.fillStyle=XOR[i]?&#x27;#4ade80&#x27;:&#x27;#f87171&#x27;;g.beginPath();g.arc(px,py,8,0,7);g.fill();
    g.fillStyle=&#x27;#dbe4f0&#x27;;g.font=&#x27;11px Consolas,monospace&#x27;;
    g.fillText(`(${x})`,ax+10,ay-12);
  });
  if(tmix&gt;=1){g.font=(pw&lt;220?&#x27;10px&#x27;:&#x27;11px&#x27;)+&#x27; Consolas,monospace&#x27;;g.fillStyle=&#x27;#dbe4f0&#x27;;
    const L=[[[0,1],&#x27;(1,1)→(0,1)&#x27;,&#x27;left&#x27;,10,18],[[1,1],&#x27;(0,1),(1,0)→(1,1)&#x27;,&#x27;right&#x27;,4,-14],[[1,0],&#x27;(0,0)→(1,0)&#x27;,&#x27;right&#x27;,-12,-12]];
    L.forEach(([h,t,al,dx,dy])=&gt;{const [bx,by]=P(1,h[0],h[1]);g.textAlign=al;g.fillText(t,bx+dx,by+dy);});
    g.fillStyle=&#x27;#f5b942&#x27;;g.textAlign=&#x27;right&#x27;;const [tx,ty]=P(1,1.38,0.62);g.fillText(&#x27;y = 1 쪽&#x27;,tx,ty);g.textAlign=&#x27;left&#x27;;}
}
async function morph(){tmix=0;space();setStatus(&#x27;info&#x27;,&#x27;x 공간: XOR 의 1(초록) 과 0(빨강) 이 대각선에 엇갈려 직선 하나로 나눌 수 없습니다.&#x27;);await sleep(1300);
  for(let i=1;i&lt;=40;i++){tmix=i/40;space();await sleep(35);}
  setStatus(&#x27;ok&#x27;,&#x27;h 공간: (0,1), (1,0) 이 모두 (1,1) 로 겹치고 (0,0)→(1,0), (1,1)→(0,1). 이제 AND 직선 하나가 초록과 빨강을 나눕니다.&#x27;);}
$(&#x27;#bMove&#x27;).onclick=async()=&gt;{if(busy)return;busy=true;try{await morph();}finally{busy=false;}};
window.addEventListener(&#x27;resize&#x27;,()=&gt;{if($(&#x27;#vSpace&#x27;).classList.contains(&#x27;on&#x27;))space();});

const P=[
 {n:&#x27;① 네 입력 모두 흘려보기&#x27;,ex:&#x27;&lt;p&gt;각 입력을 은닉층 NAND · OR 에 동시에 넣고, 두 출력을 다시 AND 에 넣습니다. 결과 열이 &lt;b class=&quot;green&quot;&gt;[0, 1, 1, 0] = XOR&lt;/b&gt;. 뉴런 하나로 못 하던 일을 &lt;b class=&quot;teal&quot;&gt;뉴런 3개, 2층&lt;/b&gt;으로 해냈습니다.&lt;/p&gt;&lt;p&gt;노트북 &lt;code&gt;3-1&lt;/code&gt; 은 1교시에 만든 &lt;code&gt;NAND · OR · AND&lt;/code&gt; 함수를 조합해 &lt;code&gt;XOR&lt;/code&gt; 을 만드는 문제입니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{show(&#x27;vNet&#x27;,&#x27;2층 네트워크&#x27;);rows=[];for(const x of IN){sel=x;await flow(380);await sleep(300);}
   setStatus(&#x27;ok&#x27;,&#x27;진리표 완성: y = [0, 1, 1, 0] — XOR 과 일치합니다.&#x27;);}},
 {n:&#x27;② (1, 0) 천천히&#x27;,ex:&#x27;&lt;p&gt;(1, 0): NAND 합 = −0.5 + 0.7 = &lt;b class=&quot;purple&quot;&gt;0.2 &amp;gt; 0 → 1&lt;/b&gt;, OR 합 = 0.5 − 0.2 = &lt;b class=&quot;green&quot;&gt;0.3 &amp;gt; 0 → 1&lt;/b&gt;. 출력 AND(1, 1) = 0.5 + 0.5 − 0.7 = 0.3 → &lt;b class=&quot;amber&quot;&gt;1&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;노란 선 = 실제로 값이 흐른(입력이 1 인) 연결입니다. Day 3 에서는 이 흐름을 거꾸로 따라가며 기울기를 계산합니다(역전파).&lt;/p&gt;&#x27;,
  run:async()=&gt;{show(&#x27;vNet&#x27;,&#x27;2층 네트워크&#x27;);sel=[1,0];await flow(900);}},
 {n:&#x27;③ 공간 변환 x → h&#x27;,ex:&#x27;&lt;p&gt;은닉층은 입력을 &lt;b class=&quot;teal&quot;&gt;새 좌표계&lt;/b&gt;로 옮깁니다. x 공간에서 엇갈려 있던 네 점이 h = (NAND, OR) 공간에서는 (1,0), (1,1), (1,1), (0,1) — 초록 두 점이 한 점으로 모이고 &lt;b class=&quot;amber&quot;&gt;AND 직선 하나로 분리&lt;/b&gt;됩니다.&lt;/p&gt;&lt;p&gt;&quot;은닉층이 문제를 선형 분리 가능하게 바꾼다&quot; — 딥러닝이 하는 일의 핵심 그림입니다. 4교시에 step 을 sigmoid · ReLU 로 바꾸면 이 변환이 부드러워집니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{show(&#x27;vSpace&#x27;,&#x27;공간 변환 — x 공간 → h 공간&#x27;);await sleep(50);await morph();}},
 {n:&#x27;④ 행렬로 쓰기 (3-2)&#x27;,ex:&#x27;&lt;p&gt;W1 의 &lt;b class=&quot;purple&quot;&gt;열 0 = NAND&lt;/b&gt; 가중치, &lt;b class=&quot;green&quot;&gt;열 1 = OR&lt;/b&gt; 가중치. 입력 4개를 행으로 쌓은 X (4,2) 에 &lt;code&gt;X @ W1 + b1&lt;/code&gt; 한 번이면 은닉 뉴런 2개 × 샘플 4개를 모두 계산합니다.&lt;/p&gt;&lt;p&gt;노트북 &lt;code&gt;3-2&lt;/code&gt; 는 이 행렬 버전입니다. 5교시에는 같은 모양으로 2→3→2→2 망을 &lt;code&gt;forward(network, X)&lt;/code&gt; 로 계산합니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{show(&#x27;vNet&#x27;,&#x27;행렬 형태 — X @ W1 + b1&#x27;);rows=[];phase=3;net();codeMat();
   setStatus(&#x27;info&#x27;,&#x27;X (4,2) @ W1 (2,2) + b1 (2,) → (4,2) …&#x27;);await sleep(900);
   for(let i=0;i&lt;4;i++){sel=IN[i];rows.push(i);net();const r=fwd(IN[i]);setStatus(&#x27;info&#x27;,`행 ${i}: [${IN[i]}] @ W1 + b1 = [${r.a.map(f2)}] → step → [${r.h}] → @ W2 + b2 = ${f2(r.s)} → ${r.y}`);await sleep(900);}
   setStatus(&#x27;ok&#x27;,&#x27;행렬 두 번 곱으로 XOR 진리표 4행을 한꺼번에 계산: y = [0, 1, 1, 0]&#x27;);}},
];
initPresets(P);
net();codeGate();
$(&#x27;#presets button&#x27;).click();
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe></section>
<section class="lesson" id="d2-4" data-title="D2-4 활성화 함수"><iframe title="D2-4 활성화 함수" loading="lazy" srcdoc="&lt;!DOCTYPE html&gt;
&lt;html lang=&quot;ko&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;UTF-8&quot;&gt;
&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;&gt;
&lt;title&gt;활성화 함수 — Neural Network Day 2&lt;/title&gt;
&lt;style&gt;
  :root{--bg:#0b1220;--panel:#111a2e;--line:#1f2b45;--text:#dbe4f0;--dim:#8a9bb8;--amber:#f5b942;--teal:#2dd4bf;--blue:#60a5fa;--green:#4ade80;--red:#f87171;--purple:#c084fc;--mono:&quot;Consolas&quot;,&quot;D2Coding&quot;,&quot;JetBrains Mono&quot;,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:&quot;Pretendard&quot;,&quot;Noto Sans KR&quot;,&quot;Segoe UI&quot;,sans-serif;font-size:15px;line-height:1.55}
  .app{max-width:1100px;margin:0 auto;padding:22px 20px 40px}
  @media(max-width:520px){.app{padding:16px 12px 30px}}
  h1{color:var(--amber);font-size:24px;margin:0 0 6px}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px;min-width:0}
  @media(max-width:520px){.panel{padding:12px 10px}}
  .panel h2{font-size:14px;color:var(--dim);margin:0 0 10px;font-weight:600}
  .presets{display:flex;flex-wrap:wrap;gap:8px}
  button{background:#172239;border:1px solid #2a3a5c;color:var(--text);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--amber)}button.active{background:#3a2e12;border-color:var(--amber);color:var(--amber)}
  button.run{background:#123d33;border-color:var(--teal);color:var(--teal);font-weight:700}
  button.sel{background:#123d33;border-color:var(--teal);color:var(--teal)}

  button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .grid{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}
  @media(max-width:860px){.grid{grid-template-columns:1fr}}
  .grid&gt;*{min-width:0}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.two{grid-template-columns:1fr}}
  .two&gt;*{min-width:0}
  .view{display:none}.view.on{display:block}
  canvas{width:100%;display:block;background:#0a0f1c;border:1px solid var(--line);border-radius:8px}
  svg{max-width:100%}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:8px}
  .legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
  .lab{font-size:13px;color:var(--dim)}
  .sl{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:13px;margin:8px 0}
  .sl label{color:var(--amber);width:70px;flex:none}
  .sl input{flex:1;min-width:60px;accent-color:var(--amber)}
  .sl output{width:58px;text-align:right;flex:none}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-family:var(--mono);font-size:13.5px}
  .kv span:nth-child(odd){color:var(--dim)}
  .kv b{font-weight:600;overflow-wrap:anywhere}
  .code{font-family:var(--mono);background:#0a0f1c;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;white-space:pre-wrap;min-height:64px;overflow-wrap:anywhere}
  .code .g{color:var(--green)}.code .e{color:var(--red)}.code .c{color:#5d7292}.code .a{color:var(--amber)}.code .b{color:var(--blue)}
  .status{border-radius:8px;padding:10px 12px;font-size:14px;border:1px solid var(--line);min-height:44px;overflow-wrap:anywhere}
  .status.ok{border-color:var(--green);color:var(--green);background:#0d2216}.status.info{border-color:var(--teal);color:var(--teal);background:#0f2a27}.status.warn{border-color:var(--red);color:var(--red);background:#2a1212}
  .explain p{margin:6px 0}.explain b.teal{color:var(--teal)}.explain b.amber{color:var(--amber)}.explain b.green{color:var(--green)}.explain b.red{color:var(--red)}.explain b.blue{color:var(--blue)}.explain b.purple{color:var(--purple)}
  table.tt{border-collapse:collapse;font-family:var(--mono);font-size:13px;width:100%}
  table.tt th,table.tt td{border:1px solid var(--line);padding:4px 6px;text-align:center}
  table.tt th{color:var(--dim);font-weight:600;background:#0e1628}
  table.tt tr.cur td{background:#2a2210}
  .ok1{color:var(--green)}.bad1{color:var(--red)}.dim{color:var(--dim)}
  .scroll{overflow-x:auto;max-width:100%}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}

  #fc{aspect-ratio:16/10}
  #lin{aspect-ratio:2/1.1}
  #van{aspect-ratio:16/9}
  .mm{font-family:var(--mono);font-size:13px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:10px}
  .mm div{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#0a0f1c;white-space:pre;opacity:.2;transition:opacity .4s}
  .mm div.on{opacity:1}
  .mm b{color:var(--amber)}
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div class=&quot;app&quot;&gt;
  &lt;h1&gt;활성화 함수 — 비선형이 층을 의미 있게 만든다&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;가중합 a = x·W + b 뒤에 붙는 함수 h(a). 실선 = 함수, &lt;b style=&quot;color:var(--red)&quot;&gt;점선 = 도함수&lt;/b&gt;. 도함수 크기가 Day 3 역전파에서 기울기가 얼마나 잘 전달되는지를 정합니다.&lt;/p&gt;
  &lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill blue&quot;&gt;sigmoid = 1/(1+e^(−x))&lt;/span&gt;&lt;span class=&quot;pill red&quot;&gt;sigmoid&#x27; = s(1−s) ≤ 0.25&lt;/span&gt;&lt;span class=&quot;pill purple&quot;&gt;tanh&#x27; = 1 − t²&lt;/span&gt;&lt;span class=&quot;pill green&quot;&gt;ReLU&#x27; = (x &amp;gt; 0)&lt;/span&gt;&lt;span class=&quot;pill amber&quot;&gt;(xW1)W2 = x(W1W2)&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2 id=&quot;stageTitle&quot;&gt;함수와 도함수&lt;/h2&gt;
      &lt;div class=&quot;view on&quot; id=&quot;vFn&quot;&gt;
        &lt;div class=&quot;row&quot; id=&quot;fbtn&quot;&gt;&lt;/div&gt;
        &lt;canvas id=&quot;fc&quot;&gt;&lt;/canvas&gt;
        &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:#60a5fa&quot;&gt;&lt;/i&gt;f(x)&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#f87171&quot;&gt;&lt;/i&gt;f&#x27;(x) 점선&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#f5b942&quot;&gt;&lt;/i&gt;현재 x&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;xs&quot;&gt;x&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;xs&quot; min=&quot;-5&quot; max=&quot;5&quot; step=&quot;0.01&quot;&gt;&lt;output id=&quot;ox&quot;&gt;&lt;/output&gt;&lt;/div&gt;
        &lt;label class=&quot;lab&quot; style=&quot;display:flex;gap:6px;align-items:center&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;big&quot;&gt; Leaky ReLU 기울기를 α = 0.1 로 크게 보기 (실제 기본값 α = 0.01)&lt;/label&gt;
      &lt;/div&gt;
      &lt;div class=&quot;view&quot; id=&quot;vLin&quot;&gt;
        &lt;div class=&quot;mm&quot; id=&quot;mm&quot;&gt;&lt;/div&gt;
        &lt;canvas id=&quot;lin&quot;&gt;&lt;/canvas&gt;
        &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:#60a5fa&quot;&gt;&lt;/i&gt;출력 &amp;gt; 0 영역&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#f87171&quot;&gt;&lt;/i&gt;출력 &amp;lt; 0 영역&lt;/span&gt;&lt;span&gt;같은 W1, W2 — 왼쪽: 활성화 없음, 오른쪽: ReLU&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;view&quot; id=&quot;vVan&quot;&gt;
        &lt;canvas id=&quot;van&quot;&gt;&lt;/canvas&gt;
        &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:#f87171&quot;&gt;&lt;/i&gt;sigmoid&#x27; 최댓값 0.25 의 곱 (log 눈금)&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#4ade80&quot;&gt;&lt;/i&gt;ReLU&#x27; = 1 (x &amp;gt; 0)&lt;/span&gt;&lt;span&gt;가로축 = 층 수 n · 0.25¹⁰ ≈ 9.5e-7&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;현재 값&lt;/h2&gt;&lt;div class=&quot;kv&quot; id=&quot;kv&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;Python (노트북 4-1 ~ 4-4)&lt;/h2&gt;&lt;div class=&quot;code&quot; id=&quot;code&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;상태&lt;/h2&gt;&lt;div class=&quot;status info&quot; id=&quot;status&quot;&gt;프리셋을 누르세요.&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel explain&quot; id=&quot;explain&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,ms));
let busy=false;
function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}
function setCode(h){$(&#x27;#code&#x27;).innerHTML=h;}
function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const g=c.getContext(&#x27;2d&#x27;);g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}
function show(id,title){$$(&#x27;.view&#x27;).forEach(v=&gt;v.classList.toggle(&#x27;on&#x27;,v.id===id));if(title&amp;&amp;$(&#x27;#stageTitle&#x27;))$(&#x27;#stageTitle&#x27;).textContent=title;}
function initPresets(P,stop){$(&#x27;#presets&#x27;).innerHTML=P.map(p=&gt;`&lt;button type=&quot;button&quot;&gt;${p.n}&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}
const sigm=z=&gt;1/(1+Math.exp(-z));
const fe=(v,d=4)=&gt;{if(Number.isNaN(v))return &#x27;nan&#x27;;if(!isFinite(v))return v&gt;0?&#x27;inf&#x27;:&#x27;-inf&#x27;;const a=Math.abs(v);return a!==0&amp;&amp;(a&gt;=1e5||a&lt;1e-3)?v.toExponential(2):v.toFixed(d);};

let fn=&#x27;sigmoid&#x27;, xv=0, big=false;
const al=()=&gt;big?0.1:0.01;
const F={
  step:{f:x=&gt;x&gt;0?1:0,d:x=&gt;0,code:&#x27;def step(x):\n    return (x &gt; 0).astype(int)\n&lt;span class=&quot;c&quot;&gt;# 도함수: 0 (x = 0 에서 정의 안 됨)&lt;/span&gt;&#x27;},
  sigmoid:{f:x=&gt;sigm(x),d:x=&gt;{const s=sigm(x);return s*(1-s);},code:&#x27;def sigmoid(x):                 &lt;span class=&quot;c&quot;&gt;# 4-1&lt;/span&gt;\n    return 1 / (1 + np.exp(-x))\n\ndef sigmoid_grad(x):            &lt;span class=&quot;c&quot;&gt;# 4-3&lt;/span&gt;\n    s = sigmoid(x)\n    return s * (1 - s)&#x27;},
  tanh:{f:x=&gt;Math.tanh(x),d:x=&gt;1-Math.tanh(x)**2,code:&#x27;y = np.tanh(x)\ndy = 1 - np.tanh(x) ** 2&#x27;},
  ReLU:{f:x=&gt;Math.max(0,x),d:x=&gt;x&gt;0?1:0,code:&#x27;def relu(x):                    &lt;span class=&quot;c&quot;&gt;# 4-2&lt;/span&gt;\n    return np.maximum(0, x)\n\ndef relu_grad(x):\n    return (x &gt; 0).astype(float)&#x27;},
  &#x27;Leaky ReLU&#x27;:{f:x=&gt;x&gt;0?x:al()*x,d:x=&gt;x&gt;0?1:al(),code:null},
};
const YR=[-1.5,3];
function drawFn(){
  const [g,W,H]=fitCanvas($(&#x27;#fc&#x27;));g.clearRect(0,0,W,H);
  const X=x=&gt;(x+5)/10*W, Y=y=&gt;H-(y-YR[0])/(YR[1]-YR[0])*H;
  g.strokeStyle=&#x27;#1a2540&#x27;;g.lineWidth=1;g.font=&#x27;11px Consolas,monospace&#x27;;g.fillStyle=&#x27;#5d7292&#x27;;
  for(let x=-5;x&lt;=5;x++){g.beginPath();g.moveTo(X(x),0);g.lineTo(X(x),H);g.stroke();if(x%2===0&amp;&amp;x)g.fillText(x,X(x)-5,Y(0)+13);}
  for(let y=-1;y&lt;=3;y++){g.beginPath();g.moveTo(0,Y(y));g.lineTo(W,Y(y));g.stroke();if(y)g.fillText(y,X(0)+4,Y(y)+4);}
  g.strokeStyle=&#x27;#3f5070&#x27;;g.beginPath();g.moveTo(X(0),0);g.lineTo(X(0),H);g.moveTo(0,Y(0));g.lineTo(W,Y(0));g.stroke();
  g.setLineDash([3,4]);g.strokeStyle=&#x27;#2a3a5c&#x27;;g.beginPath();g.moveTo(0,Y(0.25));g.lineTo(W,Y(0.25));g.stroke();g.setLineDash([]);g.fillStyle=&#x27;#5d7292&#x27;;g.fillText(&#x27;0.25&#x27;,4,Y(0.25)-3);
  const F0=F[fn];
  const plot=(f,col,dash,wd)=&gt;{g.setLineDash(dash);g.strokeStyle=col;g.lineWidth=wd;g.beginPath();let pv=null;
    for(let i=0;i&lt;=600;i++){const x=-5+i/60;const y=Math.max(YR[0]-1,Math.min(YR[1]+1,f(x)));const jump=pv!==null&amp;&amp;Math.abs(y-pv)&gt;0.5;
      if(i===0||jump)g.moveTo(X(x),Y(y));else g.lineTo(X(x),Y(y));pv=y;}g.stroke();g.setLineDash([]);};
  plot(F0.d,&#x27;#f87171&#x27;,[6,5],2);plot(F0.f,&#x27;#60a5fa&#x27;,[],2.6);
  const fy=F0.f(xv),dy=F0.d(xv);
  g.strokeStyle=&#x27;rgba(245,185,66,.6)&#x27;;g.beginPath();g.moveTo(X(xv),0);g.lineTo(X(xv),H);g.stroke();
  // tangent
  g.strokeStyle=&#x27;rgba(245,185,66,.9)&#x27;;g.lineWidth=1.5;g.beginPath();g.moveTo(X(xv-1.2),Y(fy-1.2*dy));g.lineTo(X(xv+1.2),Y(fy+1.2*dy));g.stroke();
  g.fillStyle=&#x27;#f5b942&#x27;;g.beginPath();g.arc(X(xv),Y(fy),5,0,7);g.fill();
  g.fillStyle=&#x27;#f87171&#x27;;g.beginPath();g.arc(X(xv),Y(dy),4,0,7);g.fill();
}
function infoFn(){
  const F0=F[fn],fy=F0.f(xv),dy=F0.d(xv);
  $(&#x27;#xs&#x27;).value=xv;$(&#x27;#ox&#x27;).textContent=xv.toFixed(2);
  $$(&#x27;#fbtn button&#x27;).forEach(b=&gt;b.classList.toggle(&#x27;sel&#x27;,b.dataset.f===fn));
  $(&#x27;#kv&#x27;).innerHTML=`&lt;span&gt;함수&lt;/span&gt;&lt;b&gt;${fn}${fn===&#x27;Leaky ReLU&#x27;?` (α = ${al()})`:&#x27;&#x27;}&lt;/b&gt;&lt;span&gt;x&lt;/span&gt;&lt;b&gt;${xv.toFixed(2)}&lt;/b&gt;&lt;span&gt;f(x)&lt;/span&gt;&lt;b style=&quot;color:var(--blue)&quot;&gt;${fy.toFixed(4)}&lt;/b&gt;&lt;span&gt;f&#x27;(x)&lt;/span&gt;&lt;b style=&quot;color:var(--red)&quot;&gt;${dy.toFixed(4)}&lt;/b&gt;`+(fn===&#x27;sigmoid&#x27;?`&lt;span&gt;s(1−s)&lt;/span&gt;&lt;b&gt;${fy.toFixed(4)}·${(1-fy).toFixed(4)}&lt;/b&gt;`:&#x27;&#x27;)+(fn===&#x27;tanh&#x27;?`&lt;span&gt;1 − t²&lt;/span&gt;&lt;b&gt;1 − ${fy.toFixed(4)}²&lt;/b&gt;`:&#x27;&#x27;);
  const c=fn===&#x27;Leaky ReLU&#x27;?`def leaky_relu(x, alpha=0.01):   &lt;span class=&quot;c&quot;&gt;# 4-2&lt;/span&gt;\n    return np.where(x &gt; 0, x, alpha * x)\n&lt;span class=&quot;c&quot;&gt;# 그림은 alpha = ${al()}&lt;/span&gt;`:F0.code;
  setCode(`${c}\n\nx = ${xv.toFixed(2)}\n&lt;span class=&quot;g&quot;&gt;# f(x)  = ${fy.toFixed(4)}\n# f&#x27;(x) = ${dy.toFixed(4)}&lt;/span&gt;`);
}
function setFn(f){fn=f;drawFn();infoFn();}
$(&#x27;#fbtn&#x27;).innerHTML=Object.keys(F).map(f=&gt;`&lt;button type=&quot;button&quot; data-f=&quot;${f}&quot;&gt;${f}&lt;/button&gt;`).join(&#x27;&#x27;);
$$(&#x27;#fbtn button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(busy)return;setFn(b.dataset.f);fnStatus();});
$(&#x27;#xs&#x27;).oninput=e=&gt;{if(busy)return;xv=+e.target.value;drawFn();infoFn();fnStatus();};
$(&#x27;#big&#x27;).onchange=e=&gt;{big=e.target.checked;drawFn();infoFn();};
function fnStatus(){const F0=F[fn],dy=F0.d(xv);setStatus(dy&lt;0.05&amp;&amp;fn!==&#x27;Leaky ReLU&#x27;?&#x27;warn&#x27;:&#x27;info&#x27;,`${fn}: x = ${xv.toFixed(2)} → f = ${F0.f(xv).toFixed(4)}, f&#x27; = ${dy.toFixed(4)}${dy&lt;0.05&amp;&amp;fn!==&#x27;step&#x27;?&#x27; — 기울기가 거의 0 (포화)&#x27;:&#x27;&#x27;}${fn===&#x27;step&#x27;?&#x27; — 기울기가 0 이라 경사하강으로 학습할 수 없음&#x27;:&#x27;&#x27;}`);}
window.addEventListener(&#x27;resize&#x27;,()=&gt;{if($(&#x27;#vFn&#x27;).classList.contains(&#x27;on&#x27;))drawFn();if($(&#x27;#vLin&#x27;).classList.contains(&#x27;on&#x27;))drawLin();if($(&#x27;#vVan&#x27;).classList.contains(&#x27;on&#x27;))drawVan(nV);});

/* 선형만 쌓으면 */
const HW=[[1,0],[0,1],[1,1]], HB=[0,0,-1], V=[1,1,-3], C=-0.5;
const net2=(x,y,act)=&gt;{let s=C;for(let j=0;j&lt;3;j++){let a=HW[j][0]*x+HW[j][1]*y+HB[j];if(act)a=Math.max(0,a);s+=V[j]*a;}return s;};
let linStage=2;
function drawLin(){
  const [g,W,H]=fitCanvas($(&#x27;#lin&#x27;));g.clearRect(0,0,W,H);
  const pw=(W-30)/2,ph=H-30,R=[-2,2];
  for(let k=0;k&lt;2;k++){if(k===1&amp;&amp;linStage&lt;2)continue;
    const ox=10+k*(pw+10),st=3;
    for(let px=0;px&lt;pw;px+=st)for(let py=0;py&lt;ph;py+=st){const x=R[0]+(px+st/2)/pw*4,y=R[1]-(py+st/2)/ph*4;const s=net2(x,y,k===1);
      g.fillStyle=s&gt;0?&#x27;#28436a&#x27;:&#x27;#4b2a31&#x27;;g.fillRect(Math.floor(ox+px),Math.floor(8+py),st+1,st+1);}
    g.strokeStyle=&#x27;#3f5070&#x27;;g.beginPath();g.moveTo(ox+pw/2,8);g.lineTo(ox+pw/2,8+ph);g.moveTo(ox,8+ph/2);g.lineTo(ox+pw,8+ph/2);g.stroke();

const M=(A,B)=&gt;A.map(r=&gt;B[0].map((_,j)=&gt;r.reduce((s,v,k)=&gt;s+v*B[k][j],0)));
async function linPreset(){
  show(&#x27;vLin&#x27;,&#x27;선형 층 두 개 = 선형 층 한 개&#x27;);linStage=0;
  const W1=[[1,2],[0,1]],W2=[[2,0],[1,1]],x=[[1,1]];   // 행 벡터 x (1, 2) — Y = XW + b 와 같은 순서
  const a=M(x,W1),y1=M(a,W2),W12=M(W1,W2),y2=M(x,W12);
  $(&#x27;#mm&#x27;).innerHTML=`&lt;div data-k=&quot;1&quot;&gt;&lt;b&gt;W1&lt;/b&gt; = [[1, 2],\n      [0, 1]]\n&lt;b&gt;W2&lt;/b&gt; = [[2, 0],\n      [1, 1]]\n&lt;b&gt;x&lt;/b&gt;  = [1, 1]   (행 벡터)&lt;/div&gt;&lt;div data-k=&quot;2&quot;&gt;&lt;b&gt;xW1&lt;/b&gt; = [${a.flat()}]\n&lt;b&gt;(xW1)W2&lt;/b&gt; = [${y1.flat()}]&lt;/div&gt;&lt;div data-k=&quot;3&quot;&gt;&lt;b&gt;W1W2&lt;/b&gt; = [[${W12[0]}],\n        [${W12[1]}]]\n&lt;b&gt;x(W1W2)&lt;/b&gt; = [${y2.flat()}]&lt;/div&gt;`;
  const on=k=&gt;$$(&#x27;#mm div&#x27;).forEach(d=&gt;d.classList.toggle(&#x27;on&#x27;,+d.dataset.k&lt;=k));
  setCode(`W1 = np.array([[1, 2], [0, 1]])\nW2 = np.array([[2, 0], [1, 1]])\nx = np.array([1, 1])          &lt;span class=&quot;c&quot;&gt;# 행 벡터 (샘플 하나)&lt;/span&gt;\n\n(x @ W1) @ W2      &lt;span class=&quot;g&quot;&gt;# [${y1.flat()}]&lt;/span&gt;\nx @ (W1 @ W2)      &lt;span class=&quot;g&quot;&gt;# [${y2.flat()}]  같다!&lt;/span&gt;\nW1 @ W2            &lt;span class=&quot;g&quot;&gt;# [[${W12[0]}], [${W12[1]}]]&lt;/span&gt;\nnp.allclose((x @ W1) @ W2, x @ (W1 @ W2))  &lt;span class=&quot;g&quot;&gt;# True (4-4)&lt;/span&gt;`);
  $(&#x27;#kv&#x27;).innerHTML=`&lt;span&gt;(xW1)W2&lt;/span&gt;&lt;b&gt;[${y1.flat()}]&lt;/b&gt;&lt;span&gt;x(W1W2)&lt;/span&gt;&lt;b&gt;[${y2.flat()}]&lt;/b&gt;&lt;span&gt;합친 행렬&lt;/span&gt;&lt;b&gt;W1W2 = [[${W12[0]}], [${W12[1]}]]&lt;/b&gt;`;
  window.__lin4={a:a.flat(),y1:y1.flat(),W12,y2:y2.flat()};
  on(1);drawLin();setStatus(&#x27;info&#x27;,&#x27;2×2 행렬 W1, W2 와 입력 행 벡터 x = [1, 1]&#x27;);await sleep(1000);
  on(2);setStatus(&#x27;info&#x27;,`층을 차례로: xW1 = [${a.flat()}], (xW1)W2 = [${y1.flat()}]`);await sleep(1200);
  on(3);setStatus(&#x27;info&#x27;,`먼저 합치면: W1W2 = W1 @ W2 = [[${W12[0]}], [${W12[1]}]] → x(W1W2) = [${y2.flat()}] — 같은 결과`);await sleep(1200);
  setStatus(&#x27;info&#x27;,&#x27;은닉 3개짜리 2층 망(같은 가중치)에서 활성화 없이 출력 부호를 칠하면…&#x27;);await sleep(900);
  linStage=1;drawLin();await sleep(1300);

}
/* 기울기 소실 */
let nV=10;
function drawVan(n){
  const [g,W,H]=fitCanvas($(&#x27;#van&#x27;));g.clearRect(0,0,W,H);
  const ml=52,mb=24,mt=10,lo=-7,hi=0.5;
  const Y=l=&gt;mt+(hi-l)/(hi-lo)*(H-mt-mb), bw=(W-ml-10)/10;
  g.font=&#x27;11px Consolas,monospace&#x27;;g.fillStyle=&#x27;#5d7292&#x27;;g.strokeStyle=&#x27;#1a2540&#x27;;
  for(let e=0;e&gt;=-7;e--){g.beginPath();g.moveTo(ml,Y(e));g.lineTo(W,Y(e));g.stroke();g.fillText(&#x27;1e&#x27;+e,4,Y(e)+4);}
  for(let i=1;i&lt;=10;i++){const x=ml+(i-1)*bw;
    if(i&lt;=n){const v=Math.pow(0.25,i);g.fillStyle=&#x27;#f87171&#x27;;g.fillRect(x+bw*0.12,Y(Math.log10(v)),bw*0.36,Y(lo)-Y(Math.log10(v)));
      g.fillStyle=&#x27;#4ade80&#x27;;g.fillRect(x+bw*0.52,Y(0),bw*0.36,Y(lo)-Y(0));}
    g.fillStyle=&#x27;#8a9bb8&#x27;;g.fillText(i,x+bw*0.4,H-8);}
}
async function vanPreset(){

    $(&#x27;#kv&#x27;).innerHTML=`&lt;span&gt;층 수 n&lt;/span&gt;&lt;b&gt;${nV}&lt;/b&gt;&lt;span&gt;sigmoid&#x27; 곱 (최대)&lt;/span&gt;&lt;b style=&quot;color:var(--red)&quot;&gt;0.25^${nV} = ${v.toExponential(2)}&lt;/b&gt;&lt;span&gt;ReLU&#x27; 곱 (x&amp;gt;0)&lt;/span&gt;&lt;b style=&quot;color:var(--green)&quot;&gt;1^${nV} = 1&lt;/b&gt;`;
    setStatus(nV&lt;10?&#x27;info&#x27;:&#x27;warn&#x27;,`${nV}층: 기울기 ≤ 0.25^${nV} = ${v.toExponential(2)}${nV===10?&#x27; — 입력 쪽 층에는 기울기가 거의 전달되지 않습니다 (기울기 소실)&#x27;:&#x27;&#x27;}`);await sleep(500);}
  nV=10;window.__van=Math.pow(0.25,10);
  setCode(`sigmoid_grad(0)           &lt;span class=&quot;g&quot;&gt;# 0.25  (최댓값)&lt;/span&gt;\n0.25 ** 10               &lt;span class=&quot;g&quot;&gt;# ${Math.pow(0.25,10).toExponential(4)}&lt;/span&gt;\n&lt;span class=&quot;c&quot;&gt;# 역전파(Day 3)는 층마다 도함수를 곱한다&lt;/span&gt;\n&lt;span class=&quot;c&quot;&gt;# ReLU: x &gt; 0 이면 도함수 1 → 곱해도 1&lt;/span&gt;`);
}
const P=[
 {n:&#x27;① sigmoid&#x27;,ex:&#x27;&lt;p&gt;sigmoid 는 모든 실수를 (0, 1) 로 눌러 확률처럼 해석할 수 있습니다. 도함수 &lt;code&gt;s(1 − s)&lt;/code&gt; 는 x = 0 에서 &lt;b class=&quot;red&quot;&gt;최대 0.25&lt;/b&gt;, |x| 가 커지면 거의 0 (포화).&lt;/p&gt;&lt;p&gt;노트북 &lt;code&gt;4-1 sigmoid&lt;/code&gt;, &lt;code&gt;4-3 sigmoid_grad&lt;/code&gt;. 5교시 순전파의 은닉층, 8교시 로지스틱 회귀의 출력이 sigmoid 입니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{show(&#x27;vFn&#x27;,&#x27;함수와 도함수&#x27;);setFn(&#x27;sigmoid&#x27;);for(let v=-5;v&lt;=5.001;v+=0.25){xv=v;drawFn();infoFn();fnStatus();await sleep(70);}xv=0;drawFn();infoFn();
   setStatus(&#x27;ok&#x27;,`sigmoid(0) = ${sigm(0)}, sigmoid&#x27;(0) = ${(sigm(0)*(1-sigm(0))).toFixed(2)} (최댓값). x = ±5 에서 도함수 ≈ ${(sigm(5)*(1-sigm(5))).toFixed(4)}`);}},
 {n:&#x27;② tanh&#x27;,ex:&#x27;&lt;p&gt;tanh 는 (−1, 1) 범위, 원점 대칭이라 출력 평균이 0 근처. 도함수 &lt;code&gt;1 − t²&lt;/code&gt; 는 x = 0 에서 &lt;b class=&quot;purple&quot;&gt;1&lt;/b&gt; 로 sigmoid 보다 4배 크지만 역시 양 끝에서 포화합니다.&lt;/p&gt;&lt;p&gt;tanh(x) = 2·sigmoid(2x) − 1 — 모양은 같고 눈금만 다릅니다. RNN 에서 자주 쓰입니다.&lt;/p&gt;&#x27;,

 {n:&#x27;③ ReLU · Leaky ReLU&#x27;,ex:&#x27;&lt;p&gt;&lt;b class=&quot;green&quot;&gt;ReLU = max(0, x)&lt;/b&gt;: x &amp;gt; 0 이면 도함수 1 — 곱해도 줄지 않아 깊은 망에서 기본으로 씁니다. 대신 x &amp;lt; 0 이면 도함수 0 (&quot;죽은 ReLU&quot;).&lt;/p&gt;&lt;p&gt;&lt;b class=&quot;amber&quot;&gt;Leaky ReLU&lt;/b&gt; 는 음수 쪽에 작은 기울기 α (기본 0.01) 를 남겨 이를 막습니다. 0.01 은 그림에서 거의 안 보여 체크박스로 0.1 을 볼 수 있습니다(노트북 &lt;code&gt;4-2&lt;/code&gt;).&lt;/p&gt;&#x27;,

 {n:&#x27;④ step — 왜 안 쓰나&#x27;,ex:&#x27;&lt;p&gt;퍼셉트론의 step 은 x ≠ 0 에서 &lt;b class=&quot;red&quot;&gt;도함수가 항상 0&lt;/b&gt;. 경사하강은 기울기로 움직이므로 W 를 조금 바꿔도 손실 변화를 알 수 없습니다.&lt;/p&gt;&lt;p&gt;그래서 신경망은 step 을 &lt;b class=&quot;teal&quot;&gt;매끄러운 sigmoid&lt;/b&gt; 로 바꾸며 시작했습니다 — 1 · 2교시 퍼셉트론과 5교시 신경망의 차이입니다.&lt;/p&gt;&#x27;,

&lt;body&gt;
&lt;div class=&quot;app&quot;&gt;
  &lt;h1&gt;행렬로 보는 순전파 — 2 → 3 → 2 → 2&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;층마다 &lt;code&gt;A = Z @ W + b&lt;/code&gt; (가중합) → &lt;code&gt;Z = h(A)&lt;/code&gt; (활성화) 를 반복합니다. 은닉층은 &lt;b style=&quot;color:var(--blue)&quot;&gt;sigmoid&lt;/b&gt;, 출력층은 &lt;b style=&quot;color:var(--teal)&quot;&gt;identity&lt;/b&gt;(회귀). 같은 코드가 샘플 1개든 배치 N개든 그대로 동작합니다.&lt;/p&gt;
  &lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill amber&quot;&gt;A1 = X @ W1 + b1&lt;/span&gt;&lt;span class=&quot;pill blue&quot;&gt;Z1 = sigmoid(A1)&lt;/span&gt;&lt;span class=&quot;pill teal&quot;&gt;Y = Z2 @ W3 + b3&lt;/span&gt;&lt;span class=&quot;pill green&quot;&gt;파라미터 23개&lt;/span&gt;&lt;span class=&quot;pill purple&quot;&gt;MNIST 784-100-10 → 79,510&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2 id=&quot;stageTitle&quot;&gt;네트워크&lt;/h2&gt;
      &lt;svg id=&quot;net&quot; viewBox=&quot;0 0 480 270&quot; role=&quot;img&quot; aria-label=&quot;2-3-2-2 신경망 순전파&quot;&gt;&lt;/svg&gt;
      &lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;sx1&quot;&gt;x1&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sx1&quot; min=&quot;-2&quot; max=&quot;2&quot; step=&quot;0.1&quot;&gt;&lt;output id=&quot;ox1&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;sx2&quot;&gt;x2&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sx2&quot; min=&quot;-2&quot; max=&quot;2&quot; step=&quot;0.1&quot;&gt;&lt;output id=&quot;ox2&quot;&gt;&lt;/output&gt;&lt;/div&gt;
      &lt;div class=&quot;row&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;run&quot; id=&quot;bRun&quot;&gt;순전파 재생&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;bReset&quot;&gt;X = [1.0, 0.5]&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;two&quot; style=&quot;margin-top:12px&quot;&gt;
        &lt;div&gt;&lt;h2 id=&quot;shpTitle&quot;&gt;shape 추적&lt;/h2&gt;&lt;div class=&quot;shp&quot; id=&quot;shp&quot;&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div&gt;&lt;h2&gt;파라미터 수&lt;/h2&gt;&lt;div class=&quot;pc&quot; id=&quot;pc&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;Python (노트북 5-1 ~ 5-4)&lt;/h2&gt;&lt;div class=&quot;code&quot; id=&quot;code&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;상태&lt;/h2&gt;&lt;div class=&quot;status info&quot; id=&quot;status&quot;&gt;프리셋을 누르세요.&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel explain&quot; id=&quot;explain&quot;&gt;&lt;/div&gt;
