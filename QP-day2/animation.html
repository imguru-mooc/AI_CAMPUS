  code:`def ort_acc(path, X=None, y=None, bs=250):\n    s = ort.InferenceSession(path, providers=CPU)          &lt;span class=&quot;c&quot;&gt;# 세션은 한 번만&lt;/span&gt;\n    preds = [s.run(None, {&quot;input&quot;: X[i:i + bs]})[0].argmax(1) for i in range(0, len(X), bs)]\n    return float((np.concatenate(preds) == y).mean())`,
  ex:&#x27;&lt;p&gt;&lt;b&gt;직접 구현&lt;/b&gt;: 세션을 한 번 만들고 &lt;code&gt;bs&lt;/code&gt; 장씩 잘라 실행 → argmax 를 모아 정답과 비교합니다. &lt;b&gt;같은 함수 · 같은 2,000장&lt;/b&gt;으로 재야 모델끼리 비교가 공정합니다.&lt;/p&gt;&#x27;},

steps([
 {n:&#x27;① 실습 2-1 — quantize_dynamic&#x27;,vt:&#x27;한 줄로 INT8 — 크기와 정확도&#x27;,run:()=&gt;play(0),

steps([
 {n:&#x27;① 개념 — folding 식&#x27;,vt:&#x27;Conv → BN 을 Conv 하나로&#x27;,run:()=&gt;play(0),
  q:[&#x27;folding 한 Conv(W′, b′) 의 출력은 원래 Conv → BN 의 출력과 비교해 어떨까요?&#x27;,[&#x27;같다 — 부동소수점 오차 (1e-6 수준) 만 있다&#x27;,&#x27;BN 의 정규화 효과가 사라져 값의 범위가 크게 달라진다&#x27;,&#x27;평균은 같지만 채널마다 분산이 달라져 정확도가 1%p 쯤 떨어진다&#x27;],0,&#x27;추론 때 BN 은 고정된 γ · β · μ · σ² 로 &quot;곱하고 더하는&quot; 계산일 뿐이라 Conv 의 weight · bias 에 미리 합칠 수 있습니다.&#x27;],
  kv:[[&quot;W′&quot;,&#x27;W · γ / √(σ² + ε)&#x27;],[&quot;b′&quot;,&#x27;β − μ · γ / √(σ² + ε)&#x27;],[&#x27;최대 차이&#x27;,&#x27;9.5e-07&#x27;]],st:[&#x27;ok&#x27;,&#x27;같은 계산을 한 번의 Conv 로 — 양자화는 W′ 를 대상으로&#x27;],
  code:`&lt;span class=&quot;c&quot;&gt;# BN(Wx) = γ·(Wx − μ)/√(σ²+ε) + β = (k·W)x + (β − μ·k),   k = γ/√(σ²+ε)&lt;/span&gt;`,
  ex:&#x27;&lt;p&gt;BN 을 남겨 둔 채 양자화하면 Conv 출력과 BN 출력을 &lt;b&gt;따로&lt;/b&gt; 양자화해야 해서 오차가 두 번 생깁니다. 접어 두면 양자화할 텐서가 줄고, 실제로 실행되는 weight (W′) 의 범위로 scale 을 정하게 됩니다.&lt;/p&gt;&#x27;},
 {n:&#x27;② 실습 3-1 — fold_bn()&#x27;,vt:&#x27;k 를 구해 filter 마다 곱한다&#x27;,run:()=&gt;play(1,260,8),
  q:[&#x27;k 의 모양은 (16,), W 의 모양은 (16, 3, 3, 3) 입니다. 출력 채널마다 곱하려면?&#x27;,[&#x27;W * k — 모양이 달라도 NumPy 가 알아서 출력 채널 축에 맞춰 준다&#x27;,&#x27;W * k[:, None, None, None]&#x27;,&#x27;W * k[None, :, None, None] — 두 번째 축 (입력 채널) 에 맞춘다&#x27;],1,&#x27;(16,) 을 그대로 곱하면 마지막 축 (크기 3) 과 맞추려다 오류가 납니다. (16, 1, 1, 1) 로 바꿔 0번 축 (출력 채널) 에 맞춥니다 — Day 1 per-channel 과 같은 모양.&#x27;],
  kv:[[&quot;W′ 모양&quot;,&#x27;(16, 3, 3, 3)&#x27;],[&quot;b′ 모양&quot;,&#x27;(16,)&#x27;],[&#x27;Conv+BN 과 최대 차이&#x27;,&#x27;9.54e-07&#x27;]],st:[&#x27;ok&#x27;,&quot;stem 의 Conv · BN 으로 확인 — Conv + BN = Conv(W′, b′)&quot;],
  code:`def fold_bn(conv, bn):\n    k = (bn.weight / torch.sqrt(bn.running_var + bn.eps)).detach().numpy()\n    W = conv.weight.detach().numpy() * &lt;span class=&quot;hl&quot;&gt;k[:, None, None, None]&lt;/span&gt;\n    b = bn.bias.detach().numpy() - bn.running_mean.detach().numpy() * k\n    return W.astype(np.float32), b.astype(np.float32)`,
  ex:&#x27;&lt;p&gt;&lt;b&gt;직접 구현&lt;/b&gt;: BN 의 네 값은 &lt;code&gt;bn.weight&lt;/code&gt; (γ) · &lt;code&gt;bn.bias&lt;/code&gt; (β) · &lt;code&gt;bn.running_mean&lt;/code&gt; (μ) · &lt;code&gt;bn.running_var&lt;/code&gt; (σ²) 입니다. 결과 &lt;code&gt;Wf&lt;/code&gt; 는 5교시 예제 5-A 에서 ONNX 안의 INT8 weight 를 검산할 때 다시 씁니다.&lt;/p&gt;&#x27;},
 {n:&#x27;③ 확인 — ONNX 는 이미 접혀 있다&#x27;,vt:&#x27;BN 모듈 21개 → ONNX 노드 몇 개?&#x27;,run:()=&gt;play(2),
  q:[&#x27;1교시에 내보낸 rn20.onnx 안에 BatchNormalization 노드는 몇 개 있을까요?&#x27;,[&#x27;21개 — PyTorch 모듈 수와 같다&#x27;,&#x27;0개&#x27;,&#x27;52개 — 모든 노드마다 하나씩 붙는다&#x27;],1,&#x27;exporter 가 eval 모드에서 자동으로 Conv 에 합칩니다. ONNX 첫 Conv 의 weight 와 직접 구한 W′ 의 차이는 0.0 이었습니다.&#x27;],
  kv:[[&#x27;PyTorch BatchNorm2d&#x27;,&#x27;21개&#x27;],[&#x27;ONNX BatchNormalization&#x27;,&#x27;0개&#x27;],[&quot;ONNX weight − W′&quot;,&#x27;0.0&#x27;]],st:[&#x27;ok&#x27;,&#x27;직접 구현한 식 = exporter 가 한 일&#x27;],
  code:`first_conv = [n for n in g.node if n.op_type == &quot;Conv&quot;][0]\nnp.abs(inits[first_conv.input[1]] - Wf).max()        &lt;span class=&quot;c&quot;&gt;# 0.0&lt;/span&gt;\nop_count(&quot;rn20.onnx&quot;)[&quot;BatchNormalization&quot;]          &lt;span class=&quot;c&quot;&gt;# 0&lt;/span&gt;`,
  ex:&#x27;&lt;p&gt;그래서 오늘은 folding 을 따로 실행할 필요가 없습니다. 하지만 &lt;b&gt;train 모드로 내보내거나&lt;/b&gt; 다른 프레임워크에서 온 ONNX 에는 BN 이 남아 있을 수 있으니, 양자화 전에 &lt;code&gt;op_count&lt;/code&gt; 로 확인하는 습관을 들이세요.&lt;/p&gt;&#x27;},
 {n:&#x27;④ 실습 3-2 — quant_pre_process&#x27;,vt:&#x27;모양 정보 (value_info) 채우기&#x27;,run:()=&gt;play(3,140,10),
  q:[&#x27;quant_pre_process 를 거친 rn20_pre.onnx 의 노드 수는 (원래 52개)?&#x27;,[&#x27;52개 그대로 — 모양 정보만 채워진다&#x27;,&#x27;31개 — Conv 와 Relu 가 하나로 합쳐진다&#x27;,&#x27;104개 — 노드마다 모양을 계산하는 노드가 더해진다&#x27;],0,&#x27;이 모델은 BN 이 이미 접혀 있어 합칠 것이 없습니다. 달라진 것은 value_info 0 → 52개 — 양자화 도구가 per-channel 축을 정하려면 텐서 모양을 알아야 합니다.&#x27;],
  kv:[[&#x27;value_info&#x27;,&#x27;0 → 52&#x27;],[&#x27;노드 수&#x27;,&#x27;52 → 52&#x27;],[&#x27;정확도&#x27;,&#x27;0.846 그대로&#x27;]],st:[&#x27;ok&#x27;,&#x27;이후 모든 양자화의 입력은 rn20_pre.onnx&#x27;],
  code:`quant_pre_process(&quot;rn20.onnx&quot;, &quot;rn20_pre.onnx&quot;)\nvi_before = len(onnx.load(&quot;rn20.onnx&quot;).graph.value_info)       &lt;span class=&quot;c&quot;&gt;# 0&lt;/span&gt;\nvi_after  = len(onnx.load(&quot;rn20_pre.onnx&quot;).graph.value_info)   &lt;span class=&quot;c&quot;&gt;# 52&lt;/span&gt;`,
  ex:&#x27;&lt;p&gt;&lt;b&gt;직접 구현&lt;/b&gt;: 한 줄로 전처리하고 &lt;code&gt;graph.value_info&lt;/code&gt; 개수를 비교합니다. ONNX Runtime 문서도 양자화 전에 이 단계를 권장합니다 — 4교시부터 입력 파일은 항상 &lt;code&gt;rn20_pre.onnx&lt;/code&gt; 입니다.&lt;/p&gt;&#x27;},
]);

  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}

const K={b:&#x27;#60a5fa&#x27;,a:&#x27;#f59e0b&#x27;,g:&#x27;#34d399&#x27;,r:&#x27;#f87171&#x27;,p:&#x27;#c084fc&#x27;,t:&#x27;#2dd4bf&#x27;,d:&#x27;#8a9bb8&#x27;,x:&#x27;#dbe4f0&#x27;,l:&#x27;#334155&#x27;,bg:&#x27;#111a2e&#x27;,z:&#x27;#1f2b45&#x27;};

&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;교시 흐름 — 노트북 순서대로 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;

  ex:&#x27;&lt;p&gt;&lt;b&gt;직접 구현&lt;/b&gt;: 입력은 3교시의 &lt;code&gt;rn20_pre.onnx&lt;/code&gt;. 도구는 reader 가 건네는 배치를 모델에 흘려 활성값 텐서 34개의 범위를 기록하고, 그 범위로 정한 scale · zp 를 파일에 저장합니다 — 실행할 때 다시 계산하지 않으니 dynamic 처럼 느리지 않습니다.&lt;/p&gt;&#x27;},
 {n:&#x27;③ 예제 4-A — scale 검산&#x27;,vt:&#x27;파일 안의 scale · zp = Day 1 의 식&#x27;,run:()=&gt;play(2),
  q:[&#x27;rn20_int8.onnx 안의 input scale 과, Day 1 에 직접 만든 my_quant.calc_scale_zp 의 결과는?&#x27;,[&#x27;다르다 — ONNX Runtime 은 공개되지 않은 별도의 보정식을 쓴다&#x27;,&#x27;같다 (0.016141 · 123)&#x27;,&#x27;scale 은 같지만 zero_point 는 ORT 가 항상 128 로 고정한다&#x27;],1,&#x27;(max − min) / 255 와 round(−min / scale). 도구가 하는 일은 Day 1 에 손으로 계산한 것과 같습니다 — 그래서 결과를 직접 검산할 수 있습니다.&#x27;],
  kv:[[&#x27;보정 데이터 범위&#x27;,&#x27;[−1.9895, 2.1265]&#x27;],[&#x27;ONNX Runtime&#x27;,&#x27;scale 0.016141 · zp 123&#x27;],[&#x27;my_quant&#x27;,&#x27;scale 0.016141 · zp 123&#x27;]],st:[&#x27;ok&#x27;,&#x27;도구 = Day 1 식 — 검산 가능&#x27;],
  code:`qn = [n for n in g8.node if n.op_type == &quot;QuantizeLinear&quot; and n.input[0] == &quot;input&quot;][0]\nort_scale, ort_zp = float(init8[qn.input[1]]), int(init8[qn.input[2]])\nmy_scale, my_zp = my_quant.calc_scale_zp(X_cal.min(), X_cal.max(), 0, 255)`,
  ex:&#x27;&lt;p&gt;&lt;b&gt;제공 코드&lt;/b&gt;입니다. QuantizeLinear 노드의 입력은 (텐서, scale 이름, zp 이름) 세 개이고 실제 값은 initializer 에 있습니다. 여기서 만든 &lt;code&gt;g8 · init8 · qn&lt;/code&gt; 은 5교시에서 다시 쓰므로 꼭 실행하세요.&lt;/p&gt;&#x27;},
 {n:&#x27;④ 예제 4-B — 어두운 보정 데이터&#x27;,vt:&#x27;보정 분포 ≠ 실제 입력 분포&#x27;,run:()=&gt;play(3),
  q:[&#x27;보정 이미지만 어둡게 (밝기 × 0.2) 만들어 보정하고, 평가는 원래 밝기로 합니다. 정확도는?&#x27;,[&#x27;0.845 — 장수가 500장으로 같으므로 그대로다&#x27;,&#x27;0.684 — 크게 떨어진다&#x27;,&#x27;0.846 — 범위가 좁아져 해상도가 좋아지므로 오히려 오른다&#x27;],1,&#x27;보정이 본 범위가 실제 입력보다 좁아, 밝은 값이 모두 최댓값으로 잘립니다 (clipping). Day 1 6교시의 clipping 오차를 모델 전체에서 본 것입니다.&#x27;],
  kv:[[&#x27;정상 보정&#x27;,&#x27;0.8450&#x27;],[&#x27;어두운 보정&#x27;,&#x27;0.6840 (−16.2%p)&#x27;],[&#x27;달라진 곳&#x27;,&#x27;reader 에 넣은 데이터 한 곳&#x27;]],st:[&#x27;bad&#x27;,&#x27;분포가 틀리면 500장이어도 무너진다&#x27;],
  code:`X_dark = preprocess((cal[&quot;images&quot;] * 0.2).astype(np.uint8))\nquantize_static(&quot;rn20_pre.onnx&quot;, &quot;rn20_dark.onnx&quot;, &lt;span class=&quot;hl&quot;&gt;CifarReader(X_dark)&lt;/span&gt;, ...)   &lt;span class=&quot;c&quot;&gt;# 나머지는 4-2 와 같음&lt;/span&gt;\nacc_dark = ort_acc(&quot;rn20_dark.onnx&quot;)`,
  ex:&#x27;&lt;p&gt;&lt;b&gt;제공 코드&lt;/b&gt;입니다. 현장 카메라가 밤에도 쓰인다면 보정 데이터에 낮 · 밤 · 역광을 고르게 섞어야 합니다 — 8교시 과제 6 의 질문으로 이어집니다.&lt;/p&gt;&#x27;},
 {n:&#x27;⑤ 🔁 바꿔보기 — 보정 장수&#x27;,vt:&#x27;10장이면 부족할까&#x27;,run:()=&gt;play(4),
  q:[&#x27;보정을 500장이 아니라 10장으로만 하면 정확도는?&#x27;,[&#x27;0.70 대 — 장수에 거의 비례해 떨어진다&#x27;,&#x27;0.8445 — 거의 같다&#x27;,&#x27;0.10 — 10장으로는 범위를 잡지 못해 무작위 수준이 된다&#x27;],1,&#x27;10장이어도 입력 분포가 실제와 같으면 범위가 거의 같게 잡힙니다. 장수는 수백 장이면 충분하고, 중요한 것은 분포입니다.&#x27;],
  kv:[[&#x27;10장&#x27;,&#x27;0.8445&#x27;],[&#x27;50장 · 100장&#x27;,&#x27;0.843 · 0.845&#x27;],[&#x27;500장&#x27;,&#x27;0.845&#x27;]],st:[&#x27;ok&#x27;,&#x27;장수보다 분포 — 4교시의 결론&#x27;],
  code:`N_CAL = 10                                &lt;span class=&quot;c&quot;&gt;# 10, 50, 100, 500 으로 바꿔 보세요&lt;/span&gt;\nquantize_static(&quot;rn20_pre.onnx&quot;, &quot;rn20_ncal.onnx&quot;, CifarReader(X_cal[:N_CAL], bs=min(50, N_CAL)), ...)`,
  ex:&#x27;&lt;p&gt;숫자 하나만 바꿔 관찰하는 셀입니다. &lt;b&gt;4교시 정리&lt;/b&gt;: static = 보정 데이터로 범위를 미리 재서 scale 고정 · reader 는 get_next (끝나면 None) 와 rewind · 파일 안의 scale 은 Day 1 식 · 보정 데이터는 현장과 같은 분포로.&lt;/p&gt;&#x27;},
]);

const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];

function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const g=c.getContext(&#x27;2d&#x27;);g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}
function initPresets(P,stop){$(&#x27;#presets&#x27;).innerHTML=P.map(p=&gt;`&lt;button type=&quot;button&quot;&gt;${p.n}&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}
const esc=s=&gt;String(s).replace(/&amp;/g,&#x27;&amp;amp;&#x27;).replace(/&lt;/g,&#x27;&amp;lt;&#x27;).replace(/&gt;/g,&#x27;&amp;gt;&#x27;);

const K={b:&#x27;#60a5fa&#x27;,a:&#x27;#f59e0b&#x27;,g:&#x27;#34d399&#x27;,r:&#x27;#f87171&#x27;,p:&#x27;#c084fc&#x27;,t:&#x27;#2dd4bf&#x27;,d:&#x27;#8a9bb8&#x27;,x:&#x27;#dbe4f0&#x27;,l:&#x27;#334155&#x27;,bg:&#x27;#111a2e&#x27;,z:&#x27;#1f2b45&#x27;};

&lt;h1&gt;${o.h1}&lt;/h1&gt;&lt;p class=&quot;sub&quot;&gt;${o.sub}&lt;/p&gt;
&lt;div class=&quot;panel goals&quot;&gt;&lt;h2&gt;이 교시에서 배우는 것&lt;/h2&gt;&lt;ol&gt;${o.goals.map(g=&gt;`&lt;li&gt;${g}&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ol&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;교시 흐름 — 노트북 순서대로 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2 id=&quot;vt&quot;&gt;그림&lt;/h2&gt;&lt;canvas id=&quot;cv&quot; style=&quot;height:${o.h||250}px&quot;&gt;&lt;/canvas&gt;&lt;/div&gt;

 &lt;div&gt;&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;🤔 먼저 예측 — 고르면 실측값이 나옵니다&lt;/h2&gt;&lt;div id=&quot;quiz&quot;&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;강사 실측 (노트북 실행 결과)&lt;/h2&gt;&lt;div class=&quot;kv&quot; id=&quot;kv&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div&gt;&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;노트북 코드&lt;/h2&gt;&lt;div class=&quot;code&quot; id=&quot;code&quot;&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;상태&lt;/h2&gt;&lt;div class=&quot;status info&quot; id=&quot;status&quot;&gt;단계를 누르세요.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/div&gt;

function showKV(rows){$(&#x27;#kv&#x27;).innerHTML=rows.map(([k,v])=&gt;`&lt;span&gt;${k}&lt;/span&gt;&lt;b&gt;${v}&lt;/b&gt;`).join(&#x27;&#x27;);}

  $(&#x27;#quiz&#x27;).innerHTML=`&lt;p class=&quot;q&quot;&gt;${qs}&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;${opts.map((o,i)=&gt;`&lt;button type=&quot;button&quot; data-i=&quot;${i}&quot;&gt;${o}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;&lt;/p&gt;`;

function hbar(g,x,y,w,h,frac,c,label,val){g.fillStyle=K.z;g.fillRect(x,y,w,h);g.fillStyle=c;g.fillRect(x,y,Math.max(0,w*Math.min(1,frac)),h);if(label)txt(g,label,x-6,y+h/2+4,K.x,&#x27;12px sans-serif&#x27;,&#x27;right&#x27;);if(val)txt(g,val,x+w*Math.min(1,frac)+6,y+h/2+4,K.x,&#x27;12px sans-serif&#x27;);}

 if(S===1){const D=[[&#x27;MinMax pt&#x27;,.846],[&#x27;MinMax pc&#x27;,.845],[&#x27;Entropy pt&#x27;,.846],[&#x27;Entropy pc&#x27;,.845],[&#x27;Percentile pt&#x27;,.8465],[&#x27;Percentile pc&#x27;,.844]],k=Math.floor(T*6.01);

 if(S===2){const n=Math.floor(T*34.01),bw=92*u/34,py=v=&gt;205-(v-.6)/.45*150;txt(g,&#x27;활성값 텐서 34개 — Percentile scale / MinMax scale (1.0 = 같은 범위)&#x27;,2*u,18,K.d);

async function play(s,ms,n){S=s;await tween(n||20,ms||80,t=&gt;{T=t;draw();});}
steps([
 {n:&#x27;① 개념 — 세 방법&#x27;,vt:&#x27;범위의 오른쪽 끝을 어디에&#x27;,run:()=&gt;play(0,300,6),
  q:[&#x27;Percentile 방법으로 범위를 MinMax 보다 좁게 잡으면 무엇이 달라질까요?&#x27;,[&#x27;scale 이 작아져 촘촘해지지만, 범위 밖 값은 잘린다&#x27;,&#x27;scale 이 커져서 반올림 오차와 clipping 오차가 함께 줄어든다&#x27;,&#x27;zero_point 만 달라지고 scale 과 오차는 그대로다&#x27;],0,&#x27;Day 1 6교시의 두 오차입니다. 좁히면 반올림 오차 ↓ · clipping 오차 ↑. 꼬리에 드문 큰 값이 있을 때 좁히는 쪽이 이득입니다.&#x27;],
  kv:[[&#x27;MinMax&#x27;,&#x27;본 값의 min ~ max 전체&#x27;],[&#x27;Percentile&#x27;,&#x27;위쪽 극단값 (예: 0.001%) 을 버림&#x27;],[&#x27;Entropy&#x27;,&#x27;FP32 분포와 INT8 분포의 차이 (KL) 가 가장 작은 범위&#x27;]],st:[&#x27;info&#x27;,&#x27;반올림 오차 ↔ clipping 오차의 줄다리기&#x27;],
  code:`quantize_static(..., calibrate_method=&lt;span class=&quot;hl&quot;&gt;CalibrationMethod.MinMax&lt;/span&gt;)       &lt;span class=&quot;c&quot;&gt;# 기본값&lt;/span&gt;\nquantize_static(..., calibrate_method=CalibrationMethod.Percentile)\nquantize_static(..., calibrate_method=CalibrationMethod.Entropy)`,
  ex:&#x27;&lt;p&gt;세 방법 모두 &quot;보정 데이터를 흘려 본 값&quot; 에서 출발하고, &lt;b&gt;범위의 끝을 어디에 둘지&lt;/b&gt;만 다릅니다. 4교시까지 쓴 것은 기본값 MinMax 입니다.&lt;/p&gt;&#x27;},
 {n:&#x27;② 실습 6-1 — 6개 모델 표&#x27;,vt:&#x27;방법 3 × per-channel 2&#x27;,run:()=&gt;play(1,260,6),
  q:[&#x27;6개 모델 중 가장 좋은 것과 가장 나쁜 것의 정확도 차이는 얼마나 될까요?&#x27;,[&#x27;약 5%p — 방법에 따라 뚜렷하게 갈린다&#x27;,&#x27;약 0.25%p — 거의 차이가 없다&#x27;,&#x27;약 16%p — 보정 방법이 틀리면 4교시 어두운 보정만큼 무너진다&#x27;],1,&#x27;0.844 ~ 0.8465. 2,000장 중 5장 차이로 측정 잡음 수준입니다. ResNet-20 의 활성값은 꼬리가 짧아 어느 방법으로 잘라도 비슷합니다.&#x27;],
  kv:[[&#x27;MinMax pt / pc&#x27;,&#x27;0.8460 / 0.8450&#x27;],[&#x27;Entropy pt / pc&#x27;,&#x27;0.8460 / 0.8450&#x27;],[&#x27;Percentile pt / pc&#x27;,&#x27;0.8465 / 0.8440&#x27;]],st:[&#x27;ok&#x27;,&#x27;6개 모두 손실 1%p 이내 — 차이 0.25%p&#x27;],
  code:`for m in [CalibrationMethod.MinMax, CalibrationMethod.Entropy, CalibrationMethod.Percentile]:\n    for pc in [False, True]:\n        path = f&quot;rn20_{m.name}_{&#x27;pc&#x27; if pc else &#x27;pt&#x27;}.onnx&quot;\n        quantize_static(&quot;rn20_pre.onnx&quot;, path, CifarReader(X_cal), calibrate_method=m, per_channel=pc, ...)\n        rows.append({&quot;method&quot;: m.name, &quot;per_channel&quot;: pc, &quot;acc&quot;: ort_acc(path)})`,
  ex:&#x27;&lt;p&gt;&lt;b&gt;직접 구현&lt;/b&gt;: 이중 for 로 6개를 만들어 &lt;code&gt;calib_df&lt;/code&gt; 에 모읍니다. &quot;정확도가 같으니 방법도 같은 일을 했겠지&quot; 라고 넘어가지 말고, 다음 단계에서 실제로 고른 scale 을 열어 봅니다.&lt;/p&gt;&#x27;},
 {n:&#x27;③ 실습 6-2 — act_scales()&#x27;,vt:&#x27;실제로 고른 scale 은 달랐다&#x27;,run:()=&gt;play(2,60,34),
  q:[&#x27;정확도는 거의 같았습니다. Percentile 이 고른 scale 은 MinMax 와 비교해 어땠을까요?&#x27;,[&#x27;34개 모두 MinMax 와 완전히 같다 — 그래서 정확도도 같았다&#x27;,&#x27;평균 18% 작다 (범위를 줄였다) — 그런데도 정확도는 그대로&#x27;,&#x27;평균 2배 크다 — 범위를 넓혀 잡았다&#x27;],1,&#x27;Percentile 은 범위를 평균 0.819배, 가장 많이는 0.665배 (layer1.2 Relu) 까지 줄였습니다. 잘린 값이 드물어 정확도에 영향이 없었던 것입니다.&#x27;],

  code:`def act_scales(path):\n    g = onnx.load(path).graph; init = {i.name: numpy_helper.to_array(i) for i in g.initializer}\n    return {n.input[0]: float(init[n.input[1]]) for n in g.node if n.op_type == &quot;QuantizeLinear&quot;}\n\nr_pc = np.array([s_pc[k] / s_mm[k] for k in s_mm])     &lt;span class=&quot;c&quot;&gt;# Percentile / MinMax&lt;/span&gt;`,
  ex:&#x27;&lt;p&gt;&lt;b&gt;직접 구현&lt;/b&gt;: 예제 4-A 에서 scale 하나를 꺼낸 방법을 QuantizeLinear 전체로 넓힙니다. 텐서 이름 → scale 사전을 만들어 방법끼리 비율을 구합니다.&lt;/p&gt;&#x27;},
 {n:&#x27;④ 정리 — 언제 차이가 나나&#x27;,vt:&#x27;outlier 가 있으면 이야기가 달라진다&#x27;,run:()=&gt;play(3,400,2),

  q:[&#x27;bench 가 돌려주는 mean 과 p95 는 어떤 관계일까요?&#x27;,[&#x27;p95 ≥ mean — 가끔 느린 실행이 있다&#x27;,&#x27;p95 &lt; mean — 상위 5% 를 버린 값이므로 항상 더 작다&#x27;,&#x27;항상 같다 — 같은 입력을 같은 모델에 넣으므로 매번 같은 시간이 걸린다&#x27;],0,&#x27;p95 는 100번 중 95번째로 느린 값입니다. OS 의 다른 작업 · 캐시 상태로 가끔 느린 실행이 생기고, 실시간 시스템에서는 이 꼬리가 문제입니다 (FP32 실측 mean 0.644 · p95 0.700).&#x27;],
  kv:[[&#x27;스레드&#x27;,&#x27;1 (make_session)&#x27;],[&#x27;배치 1&#x27;,&#x27;n=200 · warm=20 → mean · p95&#x27;],[&#x27;배치 32&#x27;,&#x27;n=30 · warm=5 → fps&#x27;]],st:[&#x27;info&#x27;,&#x27;조건이 같아야 모델끼리 비교가 된다&#x27;],
  code:`s = make_session(path)                               &lt;span class=&quot;c&quot;&gt;# 스레드 1&lt;/span&gt;\nb1  = bench(s, X_ev[:1],  n=200, warm=20)             &lt;span class=&quot;c&quot;&gt;# 지연&lt;/span&gt;\nb32 = bench(s, X_ev[:32], n=30,  warm=5)              &lt;span class=&quot;c&quot;&gt;# 처리량&lt;/span&gt;`,
  ex:&#x27;&lt;p&gt;2교시에 만든 &lt;code&gt;bench&lt;/code&gt; · &lt;code&gt;make_session&lt;/code&gt;, 1교시의 &lt;code&gt;ort_acc&lt;/code&gt;, 환경 셀의 &lt;code&gt;size_kb&lt;/code&gt; — 오늘 만든 도구를 모두 한 표에 모으는 교시입니다.&lt;/p&gt;&#x27;},
 {n:&#x27;② 실습 7-1 — perf_df&#x27;,vt:&#x27;5개 모델 성능표&#x27;,run:()=&gt;play(1,300,5),

  code:`MODELS = [(&quot;rn20.onnx&quot;, &quot;FP32&quot;), (&quot;rn20_dyn.onnx&quot;, &quot;dynamic&quot;), (&quot;rn20_int8.onnx&quot;, &quot;QDQ U8/S8&quot;), ...]\nfor path, quant in MODELS:\n    s = make_session(path); b1 = bench(s, X_ev[:1], n=200, warm=20); b32 = bench(s, X_ev[:32], n=30, warm=5)\n    rows.append({&quot;model&quot;: path, &quot;quant&quot;: quant, &quot;size_kb&quot;: size_kb(path), &quot;acc&quot;: ort_acc(path),\n                 &quot;mean_ms&quot;: b1[&quot;mean&quot;], &quot;p95_ms&quot;: b1[&quot;p95&quot;], &quot;fps_b32&quot;: b32[&quot;fps&quot;]})`,

 {n:&#x27;③ 표 읽기 — 배치 32 처리량&#x27;,vt:&#x27;지연과 처리량은 다른 질문&#x27;,run:()=&gt;play(2),
  q:[&#x27;QDQ U8/S8 모델의 배치 32 처리량은 FP32 (1,429 장/초) 의 몇 배쯤일까요?&#x27;,[&#x27;약 4배 — FP32 4바이트가 INT8 1바이트가 되었으므로&#x27;,&#x27;약 2.3배&#x27;,&#x27;약 1.0배 — 배치가 커지면 양자화의 이득이 사라진다&#x27;],1,&#x27;3,222 장/초 (2.25배). &quot;4배 작으니 4배 빠르다&quot; 가 아닙니다 — 메모리 이동 · Q/DQ 변환 등 줄지 않는 비용이 있습니다. 측정값이 답입니다.&#x27;],

  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}

const K={b:&#x27;#60a5fa&#x27;,a:&#x27;#f59e0b&#x27;,g:&#x27;#34d399&#x27;,r:&#x27;#f87171&#x27;,p:&#x27;#c084fc&#x27;,t:&#x27;#2dd4bf&#x27;,d:&#x27;#8a9bb8&#x27;,x:&#x27;#dbe4f0&#x27;,l:&#x27;#334155&#x27;,bg:&#x27;#111a2e&#x27;,z:&#x27;#1f2b45&#x27;};

<script>
const ids = [...document.querySelectorAll('nav button')].map(b => b.dataset.id);
function fit(fr) {
  try {
    const d = fr.contentDocument; if (!d || !d.body) return;
    fr.style.height = Math.max(600, d.documentElement.scrollHeight) + 'px';
  } catch (e) {}
}
function show(id, push) {
  if (!ids.includes(id)) id = ids[0];
  document.querySelectorAll('section.lesson').forEach(s => s.classList.toggle('active', s.id === id));
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-current', b.dataset.id === id ? 'true' : 'false'));
  const sec = document.getElementById(id);
  document.title = sec.dataset.title + ' — Quantization·Pruning Day 2';
  const fr = sec.querySelector('iframe');
  fr.loading = 'eager'; fit(fr);
  if (push) history.replaceState(null, '', '#' + id);
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('section.lesson iframe').forEach(fr => {
  fr.addEventListener('load', () => {
    fit(fr);
    try {
      new ResizeObserver(() => fit(fr)).observe(fr.contentDocument.body);
      fr.contentDocument.addEventListener('keydown', key);   // iframe 안에서도 ← → 동작
    } catch (e) {}
  });
});
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.id, true));
function key(e) {
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const cur = ids.indexOf(location.hash.slice(1) || ids[0]);
  if (e.key === 'ArrowRight' && cur < ids.length - 1) show(ids[cur + 1], true);
  if (e.key === 'ArrowLeft' && cur > 0) show(ids[cur - 1], true);
}
document.addEventListener('keydown', key);
window.addEventListener('resize', () => document.querySelectorAll('section.lesson.active iframe').forEach(fit));
window.addEventListener('hashchange', () => show(location.hash.slice(1), false));   // 주소창에서 #d1-N 을 바꿔도 이동
show(location.hash.slice(1), false);
</script>
