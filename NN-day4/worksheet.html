<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neural Network Day 4 개념 워크시트</title>
<style>
  :root{--bg:#0b1220;--panel:#111a2e;--line:#1f2b45;--text:#dbe4f0;--dim:#8a9bb8;--amber:#f5b942;--teal:#2dd4bf;--blue:#60a5fa;--green:#4ade80;--red:#f87171;--purple:#c084fc;--mono:"Consolas","D2Coding","JetBrains Mono",monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR","Segoe UI",sans-serif;font-size:15px;line-height:1.55}
  .app{max-width:920px;margin:0 auto;padding:22px 20px 40px}
  h1{color:var(--amber);font-size:24px;margin:0 0 6px}
  .sub{color:var(--dim);margin:0 0 14px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
  .panel h2{font-size:14px;color:var(--dim);margin:0 0 10px;font-weight:600}
  button{background:#172239;border:1px solid #2a3a5c;color:var(--text);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--amber)}button.active{background:#3a2e12;border-color:var(--amber);color:var(--amber)}
  button.primary{background:#123d33;border-color:var(--teal);color:var(--teal);font-weight:700;padding:9px 18px;font-size:14px}
  button.submit{background:#3a2e12;border-color:var(--amber);color:var(--amber);font-weight:700;padding:9px 18px;font-size:14px}
  button:disabled{opacity:.5;cursor:default}
  button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  input[type=text]{background:#0a0f1c;color:var(--text);border:1px solid #2a3a5c;border-radius:6px;padding:6px 10px;font-family:var(--mono);font-size:14px}
  select{background:#0a0f1c;color:var(--text);border:1px solid #2a3a5c;border-radius:6px;padding:4px 8px;font-family:inherit;font-size:14px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px}
  .tabs button .s{font-family:var(--mono);font-size:11px;color:var(--dim);margin-left:6px}
  .tabs button.graded .s{color:var(--green)}
  .legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .tag{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--dim);font-family:var(--mono)}
  .head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .head .t{color:var(--amber);font-size:17px}
  .head .a{font-size:13px;color:var(--teal);font-family:var(--mono)}
  .q{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;background:#0e1628}
  .q.unans{border-color:#5a3a1a}
  .q.ok{border-color:#1f6b45}.q.bad{border-color:#7a2e2e}
  .qh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .q .n{font-family:var(--mono);color:var(--dim);font-size:12px}
  .ty{font-size:11.5px;border-radius:999px;padding:1px 9px;border:1px solid}
  .q .p{margin:6px 0 10px;font-size:15px}
  .q code,.fb code,.dg code{font-family:var(--mono);color:var(--blue);background:#0a0f1c;padding:1px 5px;border-radius:4px}
  .q pre{font-family:var(--mono);background:#0a0f1c;border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:6px 0 4px;font-size:14px;white-space:pre;overflow-x:auto;line-height:1.9}
  .q pre input{font-size:13px;padding:2px 6px;width:auto;min-width:5ch}
  .opts{display:grid;gap:6px}
  .opt{text-align:left;padding:8px 12px;font-size:14px}
  .opt .box{display:inline-block;width:18px;font-family:var(--mono);color:var(--dim)}
  .opt.sel{border-color:var(--amber);background:#1f1a0c}
  .opt.ok{border-color:var(--green);color:var(--green);background:#0d2216}
  .opt.bad{border-color:var(--red);color:var(--red);background:#2a1212}
  .opt.miss{border-color:var(--green);border-style:dashed}
  .ox{display:flex;gap:10px}
  .ox button{font-size:22px;width:78px;height:54px;font-weight:700}
  .fill{line-height:2.3}
  .mrow{display:grid;grid-template-columns:1fr 24px minmax(160px,1.2fr);gap:8px;align-items:center;margin-bottom:6px}
  .mrow .l{background:#0a0f1c;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:14px}
  .mrow select{width:100%}
  .mrow .arr{color:var(--dim);text-align:center}
  .mrow.ok select{border-color:var(--green)}.mrow.bad select{border-color:var(--red)}
  .ord{list-style:none;margin:0;padding:0;display:grid;gap:6px}
  .ord li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;background:#0a0f1c;border:1px solid #2a3a5c;border-radius:8px;padding:7px 10px;cursor:grab;font-size:14px}
  .ord li.drag{opacity:.4}.ord li.over{border-color:var(--amber)}
  .ord li .k{font-family:var(--mono);color:var(--dim)}
  .ord li .mv button{padding:2px 8px;margin-left:4px}
  .ord li.ok{border-color:var(--green)}.ord li.bad{border-color:var(--red)}
  .hot{background:#0a0f1c;border:1px solid var(--line);border-radius:8px;padding:6px;overflow-x:auto}
  .hot svg{display:block;max-width:100%;height:auto;margin:0 auto}
  .hot .rg{cursor:pointer;fill:transparent;stroke:transparent;stroke-width:2.5}
  .hot .rg:hover{stroke:#f5b94288}
  .hot .rg.sel{stroke:var(--amber);fill:#f5b94222}
  .hot .rg.ok{stroke:var(--green);fill:#4ade8026}
  .hot .rg.bad{stroke:var(--red);fill:#f8717126}
  .card{perspective:900px;max-width:560px}
  .card .in{position:relative;min-height:130px;transition:transform .5s;transform-style:preserve-3d}
  .card.flip .in{transform:rotateY(180deg)}
  .card .f,.card .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;border:1px solid #2a3a5c;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px 18px;font-size:16px}
  .card .f{background:#14203a;color:var(--amber)}
  .card .b{background:#0f2a27;color:var(--teal);transform:rotateY(180deg)}
  @media (prefers-reduced-motion:reduce){.card .in{transition:none}}
  .selfrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
  .selfrow .hint{margin-left:4px}
  .fb{margin-top:10px;font-size:13px;color:var(--dim);border-left:3px solid var(--line);padding-left:10px}
  .fb.ok{border-left-color:var(--green)}.fb.bad{border-left-color:var(--red)}
  .fb b.v{display:block;margin-bottom:2px}
  .fb.ok b.v{color:var(--green)}.fb.bad b.v{color:var(--red)}
  .fb .anim{color:var(--teal);font-family:var(--mono);font-size:12px;display:block;margin-top:3px}
  .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
  .code{font-family:var(--mono);font-size:20px;color:var(--amber);letter-spacing:1px}
  .score{font-family:var(--mono);color:var(--green);font-size:16px}
  .hint{color:var(--dim);font-size:13px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:0;max-width:860px;width:92vw;max-height:88vh}
  dialog::backdrop{background:#000a}
  .dg{padding:18px 20px}
  .dg h3{color:var(--amber);margin:0 0 4px;font-size:20px}
  .dg .meta{color:var(--dim);font-size:13px;margin-bottom:12px;font-family:var(--mono)}
  .dg .sec{margin:14px 0 6px;color:var(--teal);font-weight:700;font-size:14px}
  .dg table{width:100%;border-collapse:collapse;font-size:13px}
  .dg th{text-align:left;color:var(--dim);font-weight:600;padding:5px 8px;border-bottom:1px solid var(--line);font-size:12px}
  .dg td{padding:5px 8px;border-bottom:1px solid #16203a;vertical-align:top}
  .dg .ok{color:var(--green)}.dg .bad{color:var(--red)}.dg .none{color:var(--dim)}
  .dg .sum{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0;font-family:var(--mono)}
  .dgbar{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 20px;display:flex;gap:8px;justify-content:flex-end;align-items:center}
  .toast{color:var(--green);font-size:13px;margin-right:auto}
  .body{overflow:auto;max-height:calc(88vh - 60px)}
  @media(max-width:600px){.mrow{grid-template-columns:1fr;gap:4px}.mrow .arr{display:none}}
</style>
</head>
<body>
<div class="app">
  <h1>Neural Network Day 4 개념 워크시트</h1>
  <p class="sub">교시마다 10문항 — 객관식 · O/X · 빈칸 · 짝 맞추기 · 순서 배열 · 핫스팟 · 코드 완성 등 9가지 유형이 섞여 나옵니다. 답을 고른 뒤 아래 <b style="color:var(--teal)">채점하기</b>를 누르면 정오 · 해설과 결과 코드가 나타납니다. 채점 전에는 답을 바꿀 수 있고, 채점 후에는 잠깁니다. 모든 교시를 마치면 <b style="color:var(--amber)">제출</b>로 오답 정리를 열고, <b>캡처</b>로 복사해 노션에 붙여 넣으세요.</p>

  <div class="panel">
    <div class="row"><label style="color:var(--dim);font-size:13px">이름 <input type="text" id="name" placeholder="홍길동"></label><span class="hint">이름은 결과 코드 계산에만 쓰이며 저장되지 않습니다.</span></div>
  </div>
  <div class="panel"><h2>교시</h2><div class="tabs" id="tabs"></div><div class="legend" id="legend"></div></div>
  <div class="panel" id="sheet"></div>
  <div class="panel">
    <div class="actions">
      <button class="primary" id="gradeBtn">채점하기</button>
      <span class="score" id="rscore"></span>
      <span class="hint" id="rhint"></span>
      <span class="code" id="rcode">—</span>
    </div>
    <div class="actions" style="margin-top:12px">
      <button class="submit" id="submitBtn">제출 (오답 정리)</button>
      <button id="resetBtn">이 교시 다시 풀기</button>
    </div>
  </div>
</div>

<dialog id="dlg">
  <div class="body"><div class="dg" id="dgBody"></div></div>
  <div class="dgbar"><span class="toast" id="toast"></span><button id="captureBtn" class="primary">📋 캡처 (노션용 복사)</button><button id="closeBtn">닫기</button></div>
</dialog>

<script>
const Q = [{"t": "1교시 · 복습 퀴즈 · SGD 의 약점", "anim": "D4-1 SGD 지그재그", "qs": [{"type": "single", "p": "f(x, y) = x²/20 + y² 의 기울기 (∂f/∂x, ∂f/∂y) 는?", "o": ["(x/20, y)", "(x/20, 2y)", "(x/10, 2y)", "(x/10, y)"], "a": 2, "w": "x²/20 을 미분하면 2x/20 = x/10, y² 는 2y. 같은 거리라도 y 방향 기울기가 훨씬 가파릅니다 (곡률 2 vs 0.1 → 20배).", "an": "문제 1-1"}, {"type": "single", "p": "SGD lr 0.95 로 y 를 갱신하면 y ← y − 0.95 · 2y 입니다. 매 step y 에 곱해지는 수는?", "o": ["−0.9", "−1.9", "0.05", "0.9"], "a": 0, "w": "1 − 2 × 0.95 = −0.9. 부호가 매 step 바뀌니 y 는 +, −, +, … 로 튀는 지그재그가 되고, 크기는 0.9배씩 줄어 30 step 후 y = 0.085.", "an": "D4-1 · SGD 지그재그"}, {"type": "multi", "p": "f(x, y) = x²/20 + y² 에서 SGD 가 비효율적인 이유를 <b>모두</b> 고르세요.", "o": ["y 방향 곡률이 x 방향보다 20배 크다 (비등방성)", "시작점 (−7, 2) 에서 기울기가 0 이라 움직이지 않는다", "학습률 하나로는 y 에 맞추면 x 가 너무 느리고, x 에 맞추면 y 가 발산한다", "기울기 방향이 최솟값 (0, 0) 을 똑바로 가리키지 않는다"], "a": [0, 2, 3], "w": "(−7, 2) 의 기울기는 (−0.7, 4) — 대부분 y 쪽을 가리킵니다. 모든 방향에 같은 lr 을 쓰는 SGD 의 한계이고, 2교시 옵티마이저들이 이것을 고칩니다.", "an": "D4-1 · SGD 지그재그"}, {"type": "ox", "p": "lr 1.0 이면 y 는 2, −2, 2, −2, … 로 영원히 진동하고 0 으로 가지 않는다.", "a": true, "w": "y ← (1 − 2·1.0) y = −y. 크기가 그대로라 ±2 사이를 끝없이 오갑니다. lr 1.05 부터는 |−1.1| &gt; 1 이라 발산.", "an": "문제 1-3"}, {"type": "short", "p": "SGD lr 1.05 로 30 step 후 y 의 값은? (소수 첫째 자리)", "a": ["34.9"], "w": "y ← (1 − 2.1) y = −1.1 y. 30 step 이면 2 × 1.1³⁰ ≈ 34.9 (짝수 번이라 부호 +) — 발산입니다.", "an": "문제 1-3"}, {"type": "drop", "p2": "y 방향 갱신은 y ← (1 − {}) y 이므로 수렴하려면 |1 − 2·lr| &lt; 1, 즉 lr &lt; {} 이어야 한다.", "opts": [["lr/10", "lr", "2·lr"], ["0.5", "20", "1"]], "a": [2, 2], "w": "0 &lt; 2·lr &lt; 2 → lr &lt; 1. x 방향은 1 − lr/10 이라 lr &lt; 20 까지 괜찮지만, 가장 가파른 방향(y) 이 lr 의 상한을 정합니다.", "an": "문제 1-3"}, {"type": "match", "p": "SGD 학습률과 30 step 결과 (시작 (−7, 2)) 를 짝지으세요.", "left": ["lr 0.1", "lr 0.95", "lr 1.0", "lr 1.05"], "right": ["끝 (−5.178, 0.002) — x 가 거의 안 움직임", "지그재그, 끝 (−0.350, 0.085)", "y 가 ±2 에서 영원히 진동", "발산 (y = 34.9)"], "a": [0, 1, 2, 3], "w": "lr 0.1 은 y 는 금방 0 이 되지만 x 는 매 step 0.99배라 느립니다. 안정 조건 lr &lt; 1 바로 아래인 0.95 가 가장 멀리 가지만 지그재그.", "an": "문제 1-3"}, {"type": "order", "p": "문제 1-2 <code>run_optimizer</code> 로 SGD 경로를 만드는 순서로 배열하세요.", "items": ["시작점 (−7, 2) 를 경로에 기록한다", "<code>grad_f(x, y)</code> 로 현재 위치의 기울기를 구한다", "<code>optimizer.update(params, grads)</code> 로 위치를 제자리 갱신한다", "새 위치를 경로에 기록하고 30 step 까지 반복한다"], "w": "params = {'x': …, 'y': …}, grads 도 같은 키 — MNIST 망과 똑같은 update(params, grads) 인터페이스로 2차원 함수를 학습시킵니다.", "an": "문제 1-2"}, {"type": "hot", "p": "f(x, y) = x²/20 + y² 위의 SGD (lr 0.95) 경로입니다. 경로가 매 step 부호를 바꾸며 <b>흔들리는 (지그재그) 방향</b>을 클릭하세요.", "w": "y 방향입니다. y 방향이 20배 가파르기 때문에 lr 0.95 에서 y 는 매 step −0.9 배가 되어 위아래로 튀고, 정작 최솟값 쪽인 x 방향으로는 천천히 나아갑니다.", "an": "D4-1 · SGD 지그재그", "viewBox": "0 0 540 300", "sw": 540, "svg": "<defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#8a9bb8\"/></marker></defs><path d=\"M452.4,145.0 L452.1,143.5 L451.1,142.0 L449.4,140.5 L447.1,139.1 L444.1,137.7 L440.6,136.4 L436.5,135.2 L431.9,134.2 L426.9,133.2 L421.5,132.4 L415.7,131.7 L409.6,131.1 L403.4,130.7 L397.0,130.5 L390.5,130.4 L384.0,130.5 L377.6,130.7 L371.3,131.1 L365.3,131.7 L359.5,132.4 L354.1,133.2 L349.0,134.2 L344.4,135.2 L340.4,136.4 L336.8,137.7 L333.9,139.1 L331.6,140.5 L329.9,142.0 L328.9,143.5 L328.5,145.0 L328.9,146.5 L329.9,148.0 L331.6,149.5 L333.9,150.9 L336.8,152.3 L340.4,153.6 L344.4,154.8 L349.0,155.8 L354.1,156.8 L359.5,157.6 L365.3,158.3 L371.3,158.9 L377.6,159.3 L384.0,159.5 L390.5,159.6 L397.0,159.5 L403.4,159.3 L409.6,158.9 L415.7,158.3 L421.5,157.6 L426.9,156.8 L431.9,155.8 L436.5,154.8 L440.6,153.6 L444.1,152.3 L447.1,150.9 L449.4,149.5 L451.1,148.0 L452.1,146.5 L452.4,145.0\" fill=\"none\" stroke=\"#2a3a5c\" stroke-width=\"1.2\" /><path d=\"M514.4,145.0 L513.7,141.9 L511.7,138.9 L508.3,136.0 L503.7,133.1 L497.8,130.4 L490.7,127.8 L482.6,125.5 L473.4,123.3 L463.3,121.4 L452.4,119.7 L440.9,118.3 L428.8,117.2 L416.2,116.4 L403.4,116.0 L390.5,115.8 L3 0"], ["2"]], "w": "∂f/∂x = x/10, ∂f/∂y = 2y. 시작점 (−7, 2) 에서 (−0.7, 4).", "an": "문제 1-1"}]}, {"t": "2교시 · 옵티마이저 구현", "anim": "D4-2 옵티마이저 경주", "qs": [{"type": "single", "p": "Momentum (α = 0.9) 의 갱신식은?", "o": ["h ← h + (∂L/∂W)²,  W ← W − η·∂L/∂W / √h", "v ← αv − η·∂L/∂W,  W ← W − v", "v ← αv + η·∂L/∂W,  W ← W + v", "v ← αv − η·∂L/∂W,  W ← W + v"], "a": 3, "w": "v 는 속도 — 이전 속도를 0.9 배 유지하고 기울기 반대 방향으로 가속합니다. 지그재그 성분은 서로 상쇄되고 꾸준한 x 방향 성분은 쌓입니다. 마지막 보기는 AdaGrad.", "an": "문제 2-1"}, {"type": "single", "p": "MNIST 784-100-100-100-100-10 (He, batch 128, 2000 iteration) 비교에서 SGD(lr 0.01) 의 test 정확도와 마지막 100 iteration 평균 손실은?", "o": ["0.9644 · 0.074", "0.9378 · 0.227", "0.9726 · 0.059", "0.9745 · 0.046"], "a": 1, "w": "SGD 0.9378 · Momentum 0.9644 · AdaGrad 0.9726 · RMSProp 0.9745 · Adam 0.9740. 같은 2000 iteration 에서 SGD 만 손실이 0.227 로 크게 남습니다.", "an": "문제 2-6"}, {"type": "multi", "p": "AdaGrad 와 RMSProp 에 대해 옳은 것을 <b>모두</b> 고르세요.", "o": ["AdaGrad 의 h 는 기울기 제곱을 더하기만 해서 실제 학습률이 점점 작아진다", "RMSProp 은 h ← ρh + (1 − ρ)g² (ρ = 0.99) 로 오래된 기울기를 서서히 잊는다", "AdaGrad 는 모든 파라미터에 똑같은 실제 학습률을 쓴다", "RMSProp 의 h 도 AdaGrad 처럼 계속 커지기만 한다"], "a": [0, 1], "w": "두 방법 모두 파라미터마다 η / (√h + 1e-7) 로 학습률을 따로 조절합니다 — 많이 움직인 (기울기가 컸던) 방향은 작게, 적게 움직인 방향은 크게.", "an": "문제 2-2 · 2-3"}, {"type": "ox", "p": "Adam 의 편향 보정 m̂ = m/(1 − β1ᵗ), v̂ = v/(1 − β2ᵗ) 은 m, v 가 0 에서 시작해 초반에 0 쪽으로 치우치는 것을 바로잡는다.", "a": true, "w": "t = 1 이면 m = 0.1g 지만 m̂ = 0.1g / 0.1 = g. 보정이 없으면 첫 수십 step 의 이동이 지나치게 작아집니다.", "an": "문제 2-4"}, {"type": "short", "p": "AdaGrad (lr 1.5) 의 첫 step 에서 h = g² 이므로 이동량은 1.5 · g / (|g| + 1e-7) 입니다. 시작점 (−7, 2) 에서 x 는 얼마나 움직이나? (숫자, 크기만)", "a": ["1.5"], "w": "g/|g| ≈ ±1 이라 기울기 크기와 상관없이 모든 좌표가 lr 만큼 움직입니다 — x 기울기는 0.7, y 는 4 로 다르지만 첫 step 은 둘 다 1.5.", "an": "문제 2-5"}, {"type": "drop", "p2": "옵티마이저의 상태 (v, h, m) 는 처음 update 때 {} 로 만들고, params 는 {} 갱신한다.", "opts": [["np.empty", "np.ones_like", "np.zeros_like"], ["새 딕셔너리로", "복사본으로", "제자리"]], "a": [2, 2], "w": "params[k] -= … 처럼 제자리 갱신해야 계층이 들고 있는 배열이 바뀝니다. 새 배열을 대입하면 연결이 끊깁니다.", "an": "문제 2-1"}, {"type": "match", "p": "f(x, y) = x²/20 + y² 에서 30 step 후 끝점의 f 값을 짝지으세요.", "left": ["SGD (lr 0.95)", "Momentum (lr 0.1)", "AdaGrad (lr 1.5)", "Adam (lr 0.3)"], "right": ["0.0133", "0.0479", "0.00072", "0.102"], "a": [0, 1, 2, 3], "w": "끝점 SGD (−0.350, 0.085) · Momentum (0.896, 0.088) · AdaGrad (−0.120, 0.000) · RMSProp (−0.697, 0.000) f 0.0243 · Adam (0.136, 0.318). 이 함수에서는 AdaGrad 가 가장 가깝지만 MNIST 에서는 순위가 다릅니다.", "an": "문제 2-5"}, {"type": "order", "p": "<code>Adam.update(params, grads)</code> 의 처리 순서로 배열하세요.", "items": ["처음이면 m, v 를 <code>np.zeros_like</code> 로 만든다", "t += 1 하고 m ← β1·m + (1 − β1)g, v ← β2·v + (1 − β2)g² 로 갱신한다", "m̂ = m/(1 − β1ᵗ), v̂ = v/(1 − β2ᵗ) 로 편향 보정한다", "W ← W − η·m̂/(√v̂ + 1e-7) 로 제자리 갱신한다"], "w": "Adam = Momentum (m) + RMSProp (v) + 편향 보정. β1 0.9, β2 0.999.", "an": "문제 2-4"}, {"type": "hot", "p": "같은 함수에서 다섯 옵티마이저를 30 step 돌린 경로입니다. 오른쪽 확대 그림에서 <b>최솟값 (0, 0) 에 가장 가깝게 (f 가 가장 작게)</b> 끝난 끝점을 클릭하세요.", "w": "AdaGrad (−0.120, 0.000), f 0.00072 입니다. y 방향의 큰 기울기가 h 에 쌓여 그 방향 학습률이 빠르게 줄어들기 때문에 지그재그 없이 x 축을 따라 들어옵니다.", "an": "D4-2 · 옵티마이저 경주", "viewBox": "0 0 640 300", "sw": 640, "svg": "<defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#8a9bb8\"/></marker></defs><text x=\"20.0\" y=\"16.0\" font-size=\"12\" fill=\"#8a9bb8\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">30 step 경로 (전체)</text><text x=\"330.0\" y=\"16.0\" font-size=\"12\" fill=\"#8a9bb8\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">원점 근처 확대 (끝점)</text><rect x=\"325.0\" y=\"28.0\" width=\"300.0\" height=\"250.0\" rx=\"4\" fill=\"#0a0f1c\" stroke=\"#2a3a5c\"/><defs><clipPath id=\"zc4\"><rect x=\"325\" y=\"28\" width=\"300\" height=\"250\"/></clipPath><clipPath id=\"lc4\"><rect x=\"10\" y=\"28\" 를 막기 때문", "running_mean 이 매 step b 를 흡수하므로 Affine 이 b 의 기울기를 따로 구하지 않기 때문", "BN 의 dx 열 합이 0 이라 db = 0 — BN 이 평균을 빼며 b 를 지운다"], "a": 3, "w": "b 를 바꾸면 그 열 전체가 같은 만큼 움직이는데, BN 이 μ 를 빼며 그대로 지웁니다. 그래서 8교시 gradient check 에서 BN 앞 b 는 상대 오차 2e-4 (절댓값 1e-16 수준) 가 나와도 문제가 아닙니다.", "an": "문제 4-3"}, {"type": "single", "p": "BN 효과 실험 (1000장, 784-100×5-10, SGD 0.01, 20 epoch) 에서 <b>std 0.01</b> 초기화의 마지막 train / test 는? (BN 없음 → BN 있음)", "o": ["0.483 / 0.435 → 0.878 / 0.692", "0.117 / 0.103 → 1.000 / 0.878", "0.850 / 0.772 → 0.969 / 0.726", "0.097 / 0.098 → 0.483 / 0.347"], "a": 1, "w": "std 0.01 은 BN 없이는 학습이 거의 안 되지만, BN 이 층마다 분포를 다시 맞춰 주니 1.000 / 0.878 까지 갑니다. 다른 보기는 std 1.0, std 0.1, He 의 결과 — BN 은 초기화에 덜 민감하게 만들어 줍니다.", "an": "문제 4-4"}, {"type": "multi", "p": "x = rng(4).normal(3, 2, (5, 4)), γ = [1, 2, 0.5, 1.5], β = [0, 1, −1, 0.5] 를 BN 에 넣은 출력에 대해 옳은 것을 <b>모두</b> 고르세요.", "o": ["γ, β 는 학습되지 않는 고정 상수다", "열마다 평균이 β 와 같다", "열마다 표준편차가 γ 와 같다", "평균 · 분산은 axis=1 (한 샘플 안의 뉴런들) 로 구한다"], "a": [1, 2], "w": "BN 은 뉴런 (열) 마다 미니배치 방향 axis=0 으로 평균 0 · 분산 1 을 맞춘 뒤, 학습되는 γ 로 늘이고 β 로 옮깁니다.", "an": "문제 4-1"}, {"type": "ox", "p": "추론 (train_flg=False) 때도 들어온 미니배치의 평균 · 분산으로 정규화한다.", "a": false, "w": "추론은 학습 중 모아 둔 running_mean · running_var 를 씁니다. 그래야 이미지 한 장만 넣어도, 같은 이미지는 언제나 같은 결과가 나옵니다.", "an": "D4-4 · 학습 vs 추론"}, {"type": "short", "p": "running_mean = 0.9 · running_mean + 0.1 · μ 입니다. running_mean 이 0 일 때 μ = 5 인 배치 하나를 넣으면 running_mean 은? (숫자)", "a": ["0.5", ".5"], "w": "0.9 × 0 + 0.1 × 5 = 0.5. N(5, 2²) 배치 100개를 50번 넣으면 running_mean 5.03, running_var 3.83 으로 참값 (5, 4) 에 다가갑니다.", "an": "문제 4-1"}, {"type": "drop", "p2": "BN 은 x̂ = (x − μ) / √(σ² + {}) 로 정규화한 뒤 y = {} 를 내보낸다.", "opts": [["1", "ε", "N"], ["γx̂ + β", "x̂ / γ", "βx̂ + γ"]], "a": [1, 0], "w": "ε = 1e-7 은 분산이 0 일 때 0 으로 나누는 것을 막습니다. γ = 1, β = 0 으로 시작합니다.", "an": "문제 4-1"}, {"type": "match", "p": "BatchNorm.backward 의 조각을 짝지으세요.", "left": ["dβ", "dγ", "dx̂", "dx"], "right": ["Σdout (axis=0)", "Σ(x̂ · dout) (axis=0)", "γ · dout", "(N·dx̂ − Σdx̂ − x̂·Σ(dx̂·x̂)) / (N·std)"], "a": [0, 1, 2, 3], "w": "dβ, dγ 는 Affine 의 db 와 같은 꼴입니다. dx 는 μ, σ² 도 x 에 의존하기 때문에 항이 셋. gradient check 는 dx 3.8e-10, dγ 9.1e-13, dβ 6.8e-14.", "an": "문제 4-2 · 4-3"}, {"type": "order", "p": "<code>BatchNorm.forward(x, train_flg=True)</code> 의 계산 순서로 배열하세요.", "items": ["<code>mu = x.mean(axis=0)</code>", "<code>xc = x - mu</code>, <code>var = np.mean(xc**2, axis=0)</code>", "<code>std = np.sqrt(var + eps)</code>, <code>xn = xc / std</code>", "<code>gamma * xn + beta</code> 를 돌려준다"], "w": "이 사이에 running_mean · running_var 도 0.9 / 0.1 로 갱신합니다. xc, std, xn 은 backward 에 쓰려고 저장합니다.", "an": "문제 4-1"}, {"type": "hot", "p": "BatchNorm 의 계산 블록입니다. <b>train_flg=False (추론)</b> 일 때 정규화에 쓰이는 블록을 클릭하세요.", "w": "running_mean · running_var 로 정규화하는 블록입니다. 학습 때는 미니배치 μ, σ² 로 정규화하면서 running 값을 0.9 · rm + 0.1 · μ 로 쌓아 두고, 추론 때 그 값을 씁니다. γ, β 적용은 두 경우 모두 공통.", "an": "D4-4 · 학습 vs 추론", "viewBox": "0 0 640 250", "sw": 640, "svg": "<defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#8a9bb8\"/></marker></defs><text x=\"28.0\" y=\"128.0\" font-size=\"16\" fill=\"#f5b942\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"bold\" dominant-baseline=\"middle\">x</text><rect x=\"66.0\" y=\"24.0\" width=\"190.0\" height=\"46.0\" rx=\"6\" fill=\"#14203a\" stroke=\"#2dd4bf\"/><text x=\"161.0\" y=\"41.0\" font-size=\"12\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">μ, σ² = x 의 평균 · 분산</text><text x=\"161.0\" y=\"57.0\" font-size=\"10.5\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">(axis=0, 미니배치)</text><rect x=\"286.0\" y=\"24.0\" width=\"214.0\" height=\"46.0\" rx=\"6\" fill=\"#14203a\" stroke=\"#2dd4bf\"/><text x=\"393.0\" y=\"47.0\" font-size=\"12\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">x̂ = (x − μ) / √(σ² + ε)</text><rect x=\"286.0\" y=\"92.0\" width=\"214.0\" height=\"46.0\" rx=\"6\" fill=\"#14203a\" stroke=\"#2dd4bf\"/><text x=\"393.0\" y=\"109.0\" font-size=\"12\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">rm ← 0.9·rm + 0.1·μ</text><text x=\"393.0\" y=\"125.0\" font-size=\"10.5\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">(rm = running_mean, running_var 도 같음)</text><rect x=\"66.0\" y=\"180.0\" width=\"434.0\" height=\"46.0\" rx=\"6\" fill=\"#14203a\" stroke=\"#2dd4bf\"/><text x=\"283.0\" y=\"203.0\" font-size=\"12\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">x̂ = (x − running_mean) / √(running_var + ε)</text><rect x=\"524.0\" y=\"102.0\" width=\"104.0\" height=\"46.0\" rx=\"6\" fill=\"#14203a\" stroke=\"#f472b6\"/><text x=\"576.0\" y=\"125.0\" font-size=\"12\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">y = γx̂ + β</text><line x1=\"40.0\" y1=\"118.0\" x2=\"64.0\" y2=\"54.0\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><line x1=\"40.0\" y1=\"138.0\" x2=\"64.0\" y2=\"198.0\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><line x1=\"256.0\" y1=\"47.0\" x2=\"284.0\" y2=\"47.0\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><line x1=\"200.0\" y1=\"70.0\" x2=\"284.0\" y2=\"112.0\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><line x1=\"500.0\" y1=\"47.0\" x2=\"540.0\" y2=\"100.0\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><line x1=\"500.0  "label": "점 D", "shape": "circle", "x": 469.2, "y": 137.1, "r": 15}], "a": "min"}, {"type": "code", "p": "문제 5-1 간극과 test 손실이 가장 낮았던 평가 시점을 구하는 코드를 완성하세요.", "code": "gap = hist['train_acc'][-1] {{}} hist['test_acc'][-1]\nbest = int(np.{{}}(hist['test_loss']))   # test 손실이 가장 낮은 평가 인덱스\nprint(f'gap {gap:.3f}, best epoch {hist[\"epoch\"][best]}')", "a": [["-"], ["argmin"]], "w": "argmin 은 최솟값의 인덱스 — 과적합이 시작되는 지점입니다. 300장 실험에서 gap 은 0.214.", "an": "문제 5-1 · 5-3"}]}, {"t": "6교시 · 규제 — weight decay · Dropout", "anim": "D4-6 규제 — weight decay · Dropout", "qs": [{"type": "single", "p": "weight decay (L2) 를 쓰면 손실과 가중치 기울기에 각각 무엇이 더해지나?", "o": ["손실 + ½λΣW²,  기울기 + λW", "손실 + λΣW²,  기울기 + λW²", "손실 + ½λΣW²,  기울기 + ½λW", "손실 + λΣ|W|,  기울기 + λ"], "a": 0, "w": "½λW² 를 W 로 미분하면 λW. 큰 가중치일수록 크게 끌어당겨 0 쪽으로 '감쇠' 시킵니다.", "an": "문제 6-1"}, {"type": "single", "p": "같은 설정 (300장, 6층) 에서 λ = 0.1 의 결과 train 0.767 / test 0.641 에 대한 해석으로 옳은 것은?", "o": ["학습률이 너무 커서 발산했다", "과적합이 규제 없음보다 더 심해졌다", "Dropout 과 함께 써야만 weight decay 효과가 난다", "규제가 너무 강해 과소적합 (train 도 낮다)"], "a": 3, "w": "λ 0.01 은 1.000 / 0.810 으로 test 가 좋아졌지만, 10배인 0.1 은 가중치를 너무 눌러 학습 자체가 부족해집니다. λ 도 하이퍼파라미터 — 7교시에서 탐색합니다.", "an": "문제 6-3"}, {"type": "multi", "p": "weight decay 의 벌점 ½λΣ‖W‖² 에 <b>포함하지 않는</b> 파라미터를 <b>모두</b> 고르세요.", "o": ["BatchNorm 의 γ", "Affine 의 가중치 W", "BatchNorm 의 β", "Affine 의 편향 b"], "a": [0, 2, 3], "w": "벌점은 가중치 W 에만 겁니다. 편향 · γ · β 는 개수가 적고 크기를 줄이는 것이 과적합 방지와 관계가 적습니다.", "an": "문제 6-1"}, {"type": "ox", "p": "Dropout 은 추론 (train_flg=False) 때도 학습 때처럼 무작위로 뉴런을 끈다.", "a": false, "w": "추론 때는 모든 뉴런을 쓰고 출력을 (1 − ratio) 배 합니다. 학습 때 평균적으로 (1 − ratio) 만큼만 살아 있었으니 크기를 맞추는 것입니다.", "an": "문제 6-2"}, {"type": "short", "p": "W = [[1, 2], [3, −1]], λ = 0.1 일 때 L2 손실 항 ½λΣW² 는? (숫자)", "a": ["0.75", ".75"], "w": "ΣW² = 1 + 4 + 9 + 1 = 15, ½ × 0.1 × 15 = 0.75. 기울기에 더해지는 λW = [[0.1, 0.2], [0.3, −0.1]].", "an": "문제 6-1"}, {"type": "drop", "p2": "Dropout(ratio) 는 학습 때 mask = rng.random(x.shape) {} ratio, out = x * mask 이고, 추론 때 out = x * {} 이다.", "opts": [["<", "==", ">"], ["ratio", "(1 − ratio)", "mask"]], "a": [2, 1], "w": "random 값이 ratio 보다 큰 뉴런만 살아남습니다 (살 확률 1 − ratio). backward 는 dout * mask — 꺼진 뉴런으로는 기울기도 흐르지 않습니다.", "an": "문제 6-2"}, {"type": "match", "p": "5교시와 같은 설정 (300장, 784-100×6-10, 200 epoch) 에서 규제와 마지막 train / test 를 짝지으세요.", "left": ["규제 없음", "weight decay λ = 0.01", "Dropout 0.2", "weight decay λ = 0.1"], "right": ["1.000 / 0.786", "1.000 / 0.810", "1.000 / 0.800", "0.767 / 0.641"], "a": [0, 1, 2, 3], "w": "λ 0.01 은 test 손실도 0.74 → 0.65 로 줄었습니다. Dropout 은 초반 학습이 느려 25 epoch 에 train 0.53.", "an": "문제 6-3"}, {"type": "order", "p": "<code>Dropout</code> 계층이 한 번 학습 · 평가될 때의 순서로 배열하세요.", "items": ["forward(x, train_flg=True): <code>self.mask = rng.random(x.shape) &gt; ratio</code>", "<code>x * self.mask</code> 를 다음 층으로 보낸다", "backward: <code>dout * self.mask</code> 를 아래로 보낸다", "평가: forward(x, train_flg=False) → <code>x * (1 - ratio)</code>"], "w": "매 forward 마다 새 mask 를 뽑으므로, 매 iteration 다른 '작은 망' 을 학습하는 효과가 납니다.", "an": "문제 6-2"}, {"type": "hot", "p": "Dropout(ratio = 0.2) 계층입니다. 각 은닉 뉴런 옆에 이번 forward 의 <b>rng.random 값 r</b> 이 적혀 있습니다. 이번 step 에 <b>꺼지는 (0 이 되는)</b> 뉴런을 클릭하세요.", "w": "r = 0.18 인 뉴런입니다. mask = r &gt; 0.2 이므로 0.18 만 False. 0.27 은 0.2 보다 커서 살아남습니다 — 평균적으로 20% 가 꺼집니다.", "an": "D4-6 · Dropout", "viewBox": "0 0 500 300", "sw": 500, "svg": "<line x1=\"86.0\" y1=\"90.0\" x2=\"232.0\" y2=\"40.0\" stroke=\"#2a3a5c\" stroke-width=\"1\" /><line x1=\"86.0\" y1=\"90.0\" x2=\"232.0\" y2=\"95.0\" stroke=\"#2a3a5c\" stroke-width=\"1\" /><line x1=\"86.0\" y1=\"90.0\" x2=\"232.0\" y2=\"150.0\" stroke=\"#2a3a5c\" stroke-width=\"1\" /><line x1=\"86.0\" y1=\"90.0\" x2=\"232.0\" y2=\"205.0\" stroke=\"#2a3a5c\" stroke-width=\"1\" /><line x1=\"86.0\" y1=\"90.0\" x2=\"232.0\" y2=\"260.0\" stroke=\"#2a3a5c\" stroke-width=\"1\" /><line x1=\"86.0\" y1=\"150.0\" x2=\"232.0\" y2=\"40.0\" stroke=\"#2a3a5c\" stroke-width=\"1\" /><line x1=\"86.0\" y1=\"150.0\" x2=\"232.0\" y2=\"95.0\" stroke=\"#2a3 lr 0.240, λ 4.1e-5) · 0.870 (lr 0.588) · 0.870 (lr 0.134) · 0.845 (lr 0.112). lr 3e-4 근처는 val 0.08~0.14 로 학습이 안 됩니다.", "an": "문제 7-3"}, {"type": "multi", "p": "로그 스케일 <b>랜덤</b> 탐색이 그리드 탐색보다 나은 이유를 <b>모두</b> 고르세요.", "o": ["시도 횟수와 상관없이 걸리는 시간이 같다", "중요한 축 (lr) 의 서로 다른 값을 더 많이 시도한다", "1e-4 ~ 1 처럼 자릿수가 다른 범위를 고르게 훑는다", "최적값을 반드시 찾는다는 보장이 있다"], "a": [1, 2], "w": "그리드 3 × 3 이면 lr 은 3가지 값뿐이지만, 랜덤 9회면 lr 이 9가지 — λ 처럼 영향이 작은 축에 시도를 낭비하지 않습니다.", "an": "문제 7-2"}, {"type": "ox", "p": "lr = 10 ** rng.uniform(−4, 0) 으로 뽑으면 1e-4 ~ 1e-3 구간과 0.1 ~ 1 구간이 뽑힐 확률이 같다.", "a": true, "w": "지수가 −4 ~ 0 에서 균등하니 자릿수 구간마다 1/4 씩. 그냥 uniform(1e-4, 1) 이면 90% 가 0.1 ~ 1 에 몰립니다.", "an": "문제 7-2"}, {"type": "short", "p": "학습 1000장에서 p = rng.permutation(1000), val = p[:200] 이면 실제로 학습에 쓰는 train 은 몇 장인가? (숫자)", "a": ["800"], "w": "train = p[200:] → 800장. 섞은 뒤 나누므로 두 집합이 겹치지 않습니다.", "an": "문제 7-1"}, {"type": "drop", "p2": "탐색 결론: lr 은 {} 가 좋고 λ 는 이 범위에서 영향이 작다 → 다음엔 lr = 10^U({}) 로 좁혀 다시 탐색한다.", "opts": [["0.1 ~ 0.6", "0.6 ~ 1", "1e-4 ~ 1e-3"], ["−1.3, −0.2", "−6, −1", "−4, 0"]], "a": [0, 0], "w": "10^−1.3 ≈ 0.05, 10^−0.2 ≈ 0.63. 넓게 → 좁게 반복하는 것이 실무 탐색 방식입니다.", "an": "문제 7-3"}, {"type": "match", "p": "데이터 집합과 역할을 짝지으세요.", "left": ["train (800장)", "validation (200장)", "test", "hp_results.npy"], "right": ["가중치 학습 (기울기 계산 · 갱신)", "하이퍼파라미터 선택", "마지막에 한 번 — 일반화 성능 보고", "30 × [val, lr, λ, train] 탐색 기록"], "a": [0, 1, 2, 3], "w": "세 집합의 역할을 섞지 않는 것이 핵심입니다.", "an": "문제 7-1 · 7-3"}, {"type": "order", "p": "문제 7-3 탐색 루프 한 회 (trial) 의 순서로 배열하세요.", "items": ["같은 rng 로 lr = 10^U(−4, 0), λ = 10^U(−6, −1) 을 순서대로 뽑는다", "784-100-100-10 망을 seed = trial 로 만든다", "train 800장으로 SGD 20 epoch (batch 100) 학습한다", "val 200장 정확도를 [val, lr, λ, train] 으로 기록한다"], "w": "30 회 약 11 초. 끝나면 val 순으로 정렬해 상위 설정을 봅니다.", "an": "문제 7-3"}, {"type": "hot", "p": "30회 랜덤 탐색의 lr–val 정확도 산점도입니다. val 정확도가 <b>가장 높은 점들이 모인 lr 구간</b>을 클릭하세요.", "w": "1e-1 ~ 1 구간입니다 — 상위 4개 (0.885, 0.875, 0.870, 0.870) 가 lr 0.13 ~ 0.59. 1e-4 ~ 1e-3 구간은 학습이 거의 안 되어 0.1 근처입니다. 그 .optimizer.update(params,&#160;grads)</text><text x=\"22.0\" y=\"230.0\" font-size=\"11\" fill=\"#8a9bb8\" text-anchor=\"end\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">8</text><text x=\"34.0\" y=\"230.0\" font-size=\"12.5\" fill=\"#dbe4f0\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;self.history['loss'].append(loss)</text><text x=\"22.0\" y=\"258.0\" font-size=\"11\" fill=\"#8a9bb8\" text-anchor=\"end\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">9</text><text x=\"34.0\" y=\"258.0\" font-size=\"12.5\" fill=\"#dbe4f0\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">&#160;&#160;&#160;&#160;self.history['train_acc'].append(self.model.accuracy(X,&#160;t))</text>", "regions": [{"id": "p", "label": "1번째 줄", "x": 28, "y": 22.0, "w": 556, "h": 24}, {"id": "g", "label": "6번째 줄", "x": 28, "y": 162.0, "w": 556, "h": 24}, {"id": "u", "label": "7번째 줄", "x": 28, "y": 190.0, "w": 556, "h": 24}, {"id": "l", "label": "8번째 줄", "x": 28, "y": 218.0, "w": 556, "h": 24}, {"id": "a", "label": "9번째 줄", "x": 28, "y": 246.0, "w": 556, "h": 24}], "a": "u"}, {"type": "code", "p": "과제 4 저장 · 불러오기를 완성하세요.", "code": "def save_params(model, path):\n    np.{{}}(path, **model.params())\n\ndef load_params(model, path):\n    data = np.load(path)\n    for k, p in model.params().items():\n        p[{{}}] = data[k]          # 제자리 복사", "a": [["savez"], ["..."]], "w": "키 '0.W', '1.gamma' … 가 파일 안 배열 이름이 됩니다. 다시 불러온 모델의 test 정확도가 0.9757 로 같으면 과제 4 통과.", "an": "과제 4"}]}];
const TYPES = {
  single:{n:'단일 선택',c:'#60a5fa'}, multi:{n:'다중 선택',c:'#c084fc'}, ox:{n:'O/X',c:'#f5b942'},
  short:{n:'단답형',c:'#2dd4bf'}, drop:{n:'선택형 빈칸',c:'#93c5fd'}, match:{n:'짝 맞추기',c:'#f472b6'},
  order:{n:'순서 배열',c:'#fb923c'}, hot:{n:'핫스팟',c:'#4ade80'}, code:{n:'코드 완성',c:'#a3e635'}
};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip = h => { const d = document.createElement('div'); d.innerHTML = h; return d.textContent; };
const norm = s => String(s ?? '').toLowerCase().replace(/\s+/g, '').replace(/[“”]/g, '"').replace(/[‘’]/g, "'");
function rng(seed){ let h = 2166136261; for (const c of seed) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 100000) / 100000; }; }
function shuffled(arr, seed){ const r = rng(seed), idx = arr.map((_, i) => i); for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; } if (idx.every((v, i) => v === i) && idx.length > 1) idx.push(idx.shift()); return idx; }

// ── 상태 ──
let tab = 0;
const graded = Q.map(() => false);
const ans = Q.map((s, i) => s.qs.map((q, k) => init(q, `${i}-${k}`)));
function init(q, id){
  switch (q.type) {
    case 'single': case 'ox': case 'hot': return null;
    case 'multi': return [];
    case 'short': return '';
    case 'drop': return q.opts.map(() => -1);
    case 'match': return q.left.map(() => -1);
    case 'order': return shuffled(q.items, 'o' + id);          // 현재 화면 순서(원래 인덱스)
    case 'flash': return { flipped:false, self:null };
    case 'code': return q.a.map(() => '');
  }
}
function answered(q, a){
  switch (q.type) {
    case 'single': case 'ox': case 'hot': return a !== null;
    case 'multi': return a.length > 0;
    case 'short': return a.trim() !== '';
    case 'drop': case 'match': return a.every(v => v >= 0);
    case 'order': return true;
    case 'flash': return a.self !== null;
    case 'code': return a.every(v => v.trim() !== '');
  }
}
function correct(q, a){
  switch (q.type) {
    case 'single': case 'hot': return a === q.a;
    case 'ox': return a === q.a;
    case 'multi': return a.length === q.a.length && q.a.every(x => a.includes(x));
    case 'short': return q.a.some(x => norm(x) === norm(a));
    case 'drop': return a.every((v, i) => v === q.a[i]);
    case 'match': return a.every((v, i) => v === q.a[i]);
    case 'order': return a.every((v, i) => v === i);
    case 'flash': return a.self === true;
    case 'code': return a.every((v, i) => q.a[i].some(x => norm(x) === norm(v)));
  }
}
const scoreOf = i => ans[i].filter((a, k) => correct(Q[i].qs[k], a)).length;

// ── 답 문자열 (오답 정리용) ──
const L = '①②③④⑤⑥⑦⑧';
function fmt(q, a, right){
  switch (q.type) {
    case 'single': return right ? `${L[q.a]} ${strip(q.o[q.a])}` : (a === null ? '미응답' : `${L[a]} ${strip(q.o[a])}`);
    case 'multi': { const v = right ? q.a : a; return v.length ? [...v].sort().map(i => L[i]).join(' ') : '미응답'; }
    case 'ox': { const v = right ? q.a : a; return v === null ? '미응답' : (v ? 'O' : 'X'); }
    case 'short': return right ? q.a[0] : (a.trim() || '미응답');
    case 'drop': return (right ? q.a : a).map((v, i) => v < 0 ? '?' : strip(q.opts[i][v])).join(' / ');
    case 'match': return (right ? q.a : a).map((v, i) => `${strip(q.left[i])}→${v < 0 ? '?' : strip(q.right[v])}`).join(', ');
    case 'order': return (right ? q.items.map((_, i) => i) : a).map(i => strip(q.items[i])).join(' → ');
    case 'hot': { const v = right ? q.a : a; return v === null ? '미응답' : (q.regions.find(r => r.id === v) || {}).label; }
    case 'flash': return right ? strip(q.back) : (a.self === null ? '미응답' : (a.self ? '알았다' : '몰랐다'));
    case 'code': return (right ? q.a.map(x => x[0]) : a.map(v => v || '?')).join(' / ');
  }
}

function renderTabs(){
  $('#tabs').innerHTML = Q.map((s, i) => {
    const n = ans[i].filter((a, k) => answered(s.qs[k], a)).length;
    return `<button class="${i === tab ? 'active' : ''} ${graded[i] ? 'graded' : ''}" data-i="${i}">${i + 1}교시<span class="s">${graded[i] ? scoreOf(i) + '/10' : n + '/10'}</span></button>`;

  $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => { tab = +b.dataset.i; history.replaceState(null, '', '#t' + (tab + 1)); render(); window.scrollTo({ top: 0 }); });
}
function qHTML(q, k){
  const a = ans[tab][k], g = graded[tab], id = `${tab}-${k}`, dis = g ? 'disabled' : '';
  const ok = g && correct(q, a);

        const sel = isM ? a.includes(j) : a === j, isA = isM ? q.a.includes(j) : q.a === j;
        let c = sel ? 'sel' : '';
        if (g) c = isA && sel ? 'ok' : (sel ? 'bad' : (isA ? (isM ? 'miss' : 'ok') : ''));
        const box = isM ? (sel ? '☑' : '☐') : L[j];

      body = '<div class="ox">' + [true, false].map(v => {

    case 'drop': {

    }
    case 'order':
      body = '<div class="hint" style="margin:-4px 0 8px">끌어다 놓거나 ▲▼ 버튼으로 순서를 바꾸세요.</div><ol class="ord" data-k="' + k + '">' + a.map((it, pos) => {
        const c = g ? (it === pos ? 'ok' : 'bad') : '';
        return `<li class="${c}" draggable="${!g}" data-pos="${pos}"><span class="k">${pos + 1}</span><span>${q.items[it]}</span><span class="mv"><button data-k="${k}" data-pos="${pos}" data-d="-1" ${dis || (pos === 0 ? 'disabled' : '')} aria-label="위로">▲</button><button data-k="${k}" data-pos="${pos}" data-d="1" ${dis || (pos === a.length - 1 ? 'disabled' : '')} aria-label="아래로">▼</button></span></li>`;
      }).join('') + '</ol>';
      break;
    case 'hot': {
      const regs = q.regions.map(r => {
        let c = a === r.id ? 'sel' : '';
        if (g) c = r.id === q.a ? 'ok' : (a === r.id ? 'bad' : '');
        const shape = r.shape === 'circle' ? `<circle cx="${r.x}" cy="${r.y}" r="${r.r}"` : `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="6"`;
        return `${shape} class="rg ${c}" data-k="${k}" data-r="${r.id}" tabindex="${g ? -1 : 0}" role="button" aria-label="${esc(r.label)}"><title>${esc(r.label)}</title>${r.shape === 'circle' ? '</circle>' : '</rect>'}`;
      }).join('');
      body = `<div class="hot"><svg viewBox="${q.viewBox}" width="${q.sw}" xmlns="http://www.w3.org/2000/svg">${q.svg}${regs}</svg></div>` +
        `<div class="hint" style="margin-top:6px">선택: <b style="color:var(--amber)">${a === null ? '없음' : esc((q.regions.find(r => r.id === a) || {}).label)}</b></div>`;
      break;
    }
    case 'flash':
      body = `<div class="card ${a.flipped ? 'flip' : ''}" data-k="${k}"><div class="in"><div class="f">${q.front}</div><div class="b">${q.back}</div></div></div>` +
        `<div class="selfrow"><button class="flipb" data-k="${k}" ${g ? 'disabled' : ''}>${a.flipped ? '앞면 보기' : '🔄 카드 뒤집기'}</button>` +
        `<button class="selfb ${a.self === true ? 'active' : ''}" data-k="${k}" data-v="1" ${g || !a.flipped ? 'disabled' : ''}>✅ 알았다</button>` +
        `<button class="selfb ${a.self === false ? 'active' : ''}" data-k="${k}" data-v="0" ${g || !a.flipped ? 'disabled' : ''}>❌ 몰랐다</button>` +
        `<span class="hint">${a.flipped ? '정답과 비교해 스스로 채점하세요.' : '먼저 답을 떠올린 뒤 뒤집으세요.'}</span></div>`;
      break;
    case 'code': {
      let i = 0;
      body = '<pre>' + esc(q.code).replace(/\{\{\}\}/g, () => {
        const n = i++;
        const w = Math.max(5, (q.a[n][0] || '').length + 2);
        const st = g ? `style="border-color:${q.a[n].some(x => norm(x) === norm(a[n])) ? 'var(--green)' : 'var(--red)'};width:${w}ch"` : `style="width:${w}ch"`;
        return `<input type="text" class="ci" data-k="${k}" data-n="${n}" value="${esc(a[n])}" ${dis} ${st} aria-label="빈칸 ${n + 1}">`;
      }) + '</pre>';
      break;
    }
  }
  const t = TYPES[q.type];
  const prompt = q.type === 'drop' ? (q.p || '') : (q.type === 'flash' ? (q.p || '카드 앞면의 질문에 답을 떠올린 뒤 뒤집어 확인하세요.') : q.p);
  let fb = '';
  if (g) {
    const right = q.type === 'flash' ? '' : `<div>정답: <b>${esc(fmt(q, a, true))}</b></div>`;
    fb = `<div class="fb ${ok ? 'ok' : 'bad'}"><b class="v">${ok ? '정답' : '오답'}</b>${right}${q.w}<span class="anim">확인: ${q.an}</span></div>`;
  }
  const un = !g && !answered(q, a) && attempted[tab] ? 'unans' : '';
  return `<div class="q ${g ? (ok ? 'ok' : 'bad') : un}"><div class="qh"><span class="n">문항 ${k + 1}</span><span class="ty" style="color:${t.c};border-color:${t.c}">${t.n}</span></div><div class="p">${prompt}</div>${body}${fb}</div>`;
}
const attempted = Q.map(() => false);
function render(){
  renderTabs();
  const s = Q[tab];
  $('#sheet').innerHTML = `<div class="head"><span class="t">${s.t}</span><span class="a">🎬 ${s.anim}</span></div>` + s.qs.map((q, k) => qHTML(q, k)).join('');
  bind();
  const nm = $('#name').value, g = graded[tab];
  if (g) {
    const sc = scoreOf(tab); $('#rscore').textContent = `${sc}/10`;
    if (nm.trim()) { $('#rcode').textContent = codeFor(nm, tab + 1, sc); $('#rhint').textContent = '결과 코드'; }
    else { $('#rcode').textContent = '—'; $('#rhint').textContent = '이름을 입력하면 결과 코드가 나옵니다.'; }
  } else {
    $('#rcode').textContent = '—'; $('#rscore').textContent = '';
    const n = ans[tab].filter((a, k) => answered(s.qs[k], a)).length;
    $('#rhint').textContent = `${tab + 1}교시: ${n}/10 응답. 채점하기를 누르면 잠깁니다.`;
  }
  $('#gradeBtn').disabled = g;
}
function bind(){
  const S = $('#sheet'), A = ans[tab];
  S.querySelectorAll('.opt[data-j]').forEach(b => b.onclick = () => {
    const k = +b.dataset.k, j = +b.dataset.j, q = Q[tab].qs[k];
    if (q.type === 'multi') { const i = A[k].indexOf(j); i < 0 ? A[k].push(j) : A[k].splice(i, 1); }
    else A[k] = A[k] === j ? null : j;
    render();
  });
  S.querySelectorAll('.oxb').forEach(b => b.onclick = () => { const k = +b.dataset.k, v = b.dataset.v === 'true'; A[k] = A[k] === v ? null : v; render(); });
  S.querySelectorAll('.sa').forEach(i => i.oninput = () => { A[+i.dataset.k] = i.value; renderTabs(); });
  S.querySelectorAll('.ci').forEach(i => i.oninput = () => { A[+i.dataset.k][+i.dataset.n] = i.value; renderTabs(); });
  S.querySelectorAll('.dd').forEach(s => s.onchange = () => { A[+s.dataset.k][+s.dataset.n] = +s.value; renderTabs(); });
  S.querySelectorAll('.mm').forEach(s => s.onchange = () => { A[+s.dataset.k][+s.dataset.i] = +s.value; renderTabs(); });
  S.querySelectorAll('.ord .mv button').forEach(b => b.onclick = () => {
    const k = +b.dataset.k, p = +b.dataset.pos, d = +b.dataset.d, arr = A[k];
    [arr[p], arr[p + d]] = [arr[p + d], arr[p]]; render();
  });
  S.querySelectorAll('.ord').forEach(ol => {
    const k = +ol.dataset.k; let from = null;
    ol.querySelectorAll('li').forEach(li => {
      li.addEventListener('dragstart', e => { from = +li.dataset.pos; li.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(from)); });
      li.addEventListener('dragend', () => li.classList.remove('drag'));
      li.addEventListener('dragover', e => { if (from !== null) { e.preventDefault(); li.classList.add('over'); } });
      li.addEventListener('dragleave', () => li.classList.remove('over'));
      li.addEventListener('drop', e => { e.preventDefault(); const to = +li.dataset.pos; if (from === null || from === to) return; const arr = A[k]; const [x] = arr.splice(from, 1); arr.splice(to, 0, x); from = null; render(); });
    });
  });
  S.querySelectorAll('.rg').forEach(r => {
    const pick = () => { if (graded[tab]) return; const k = +r.dataset.k; A[k] = A[k] === r.dataset.r ? null : r.dataset.r; render(); };
    r.addEventListener('click', pick);
    r.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
  });
  S.querySelectorAll('.flipb').forEach(b => b.onclick = () => { const k = +b.dataset.k; A[k].flipped = !A[k].flipped; render(); });
  S.querySelectorAll('.card').forEach(c => c.onclick = () => { if (graded[tab]) return; const k = +c.dataset.k; A[k].flipped = !A[k].flipped; render(); });
  S.querySelectorAll('.selfb').forEach(b => b.onclick = () => { const k = +b.dataset.k; A[k].self = b.dataset.v === '1'; render(); });
}

// ── 채점 · 결과 코드 ──
function hash(s){ let h = 5381; for (const c of s) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return h.toString(16).padStart(8, '0').slice(-4); }
function codeFor(name, t, score){ return `${t}${'ABCDEFGHIJK'[10 - score] || 'K'}-${hash(`${name.trim()}|${t}|${score}|nnday4`)}`; }
$('#gradeBtn').onclick = () => {
  const s = Q[tab], n = ans[tab].filter((a, k) => answered(s.qs[k], a)).length;
  attempted[tab] = true;
  if (n < 10 && !confirm(`아직 ${10 - n}문항에 답하지 않았습니다. 그래도 채점할까요? (미응답은 오답 처리)`)) { render(); return; }
  graded[tab] = true; render();
};
$('#resetBtn').onclick = () => {
  if (!confirm(`${tab + 1}교시 답을 모두 지우고 다시 풀까요?`)) return;
  graded[tab] = false; attempted[tab] = false;
  ans[tab] = Q[tab].qs.map((q, k) => init(q, `${tab}-${k}`)); render();
};
$('#name').oninput = render;

// ── 제출 · 오답 정리 ──
let lastHtml = '', lastText = '';
function buildReport(){
  const nm = $('#name').value.trim() || '(이름 없음)', ds = new Date().toLocaleString('ko-KR');
  let h = `<h3>Neural Network Day 4 개념 워크시트 — 오답 정리</h3><div class="meta">${esc(nm)} · ${ds}</div>`;
  let t = `Neural Network Day 4 개념 워크시트 — 오답 정리\n이름: ${nm}\n일시: ${ds}\n\n`;
  let tot = 0, cnt = 0;
  const byType = {};
  Q.forEach((s, i) => {
    if (!graded[i]) return;
    const sc = scoreOf(i); tot += sc; cnt++;
    s.qs.forEach((q, k) => { const b = byType[q.type] ||= [0, 0]; b[1]++; if (correct(q, ans[i][k])) b[0]++; });
    const code = $('#name').value.trim() ? codeFor($('#name').value, i + 1, sc) : '—';
    const wrong = s.qs.map((q, k) => ({ q, k, a: ans[i][k] })).filter(x => !correct(x.q, x.a));
    h += `<div class="sec">${esc(s.t)} — ${sc}/10 · 결과 코드 ${code}</div>`;
    t += `[${s.t}] ${sc}/10 · 결과 코드 ${code}\n`;
    if (!wrong.length) { h += `<div class="ok">전부 정답 🎉</div>`; t += '  전부 정답\n\n'; return; }
    h += '<table><tr><th>#</th><th>유형</th><th>문항</th><th>내 답</th><th>정답</th><th>다시 볼 곳</th></tr>';
    wrong.forEach(({ q, k, a }) => {
      const qt = strip(q.type === 'flash' ? q.front : (q.p || q.p2 || '')).replace(/\s+/g, ' ').slice(0, 70);
      const my = fmt(q, a, false), co = fmt(q, a, true);
      h += `<tr><td>${k + 1}</td><td>${TYPES[q.type].n}</td><td>${esc(qt)}</td><td class="bad">${esc(my)}</td><td class="ok">${esc(co)}</td><td>${esc(strip(q.an))}</td></tr>`;
      t += `  ${k + 1}. [${TYPES[q.type].n}] ${qt}\n     내 답: ${my}\n     정답: ${co}\n     다시 볼 곳: ${strip(q.an)}\n`;
    });
    h += '</table>'; t += '\n';
  });
  const notGraded = Q.map((s, i) => graded[i] ? null : i + 1).filter(x => x);
  const typeLine = Object.entries(byType).map(([k, [c, n]]) => `${TYPES[k].n} ${c}/${n}`).join(' · ');
  const sum = `<div class="sum"><span>채점한 교시 ${cnt}/8</span><span>합계 ${tot}/${cnt * 10}</span>${notGraded.length ? `<span class="none">미채점: ${notGraded.join(', ')}교시</span>` : ''}</div>` + (typeLine ? `<div class="meta">유형별 정답: ${typeLine}</div>` : '');
  h = h.replace('</div>', '</div>' + sum);
  t = t.replace('\n\n', `\n채점한 교시 ${cnt}/8 · 합계 ${tot}/${cnt * 10}${notGraded.length ? ' · 미채점 ' + notGraded.join(', ') + '교시' : ''}\n유형별 정답: ${typeLine}\n\n`);
  lastHtml = h; lastText = t;
  return h;
}
$('#submitBtn').onclick = () => {
  if (!graded.some(x => x)) { alert('먼저 한 교시 이상 채점하세요.'); return; }
  $('#dgBody').innerHTML = buildReport(); $('#toast').textContent = ''; $('#dlg').showModal();
};
$('#closeBtn').onclick = () => $('#dlg').close();
$('#captureBtn').onclick = async () => {
  const htmlDoc = `<meta charset="utf-8">` + lastHtml.replace(/ class="[^"]*"/g, '').replace(/<table>/g, '<table border="1" style="border-collapse:collapse">');
  try {
    if (navigator.clipboard && window.ClipboardItem) {
      await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([htmlDoc], { type: 'text/html' }), 'text/plain': new Blob([lastText], { type: 'text/plain' }) })]);
      $('#toast').textContent = '복사했습니다 — 노션에 붙여 넣으세요.'; return;
    }
  } catch (e) {}
  const ta = document.createElement('textarea'); ta.value = lastText; ta.style.position = 'fixed'; ta.style.opacity = '0';
  $('#dlg').appendChild(ta); ta.focus(); ta.select();
  const ok = document.execCommand('copy'); ta.remove();
  $('#toast').textContent = ok ? '텍스트로 복사했습니다.' : '복사하지 못했습니다 — 직접 선택해 복사하세요.';
};

$('#legend').innerHTML = Object.values(TYPES).map(t => `<span class="tag" style="color:${t.c};border-color:${t.c}55">${t.n}</span>`).join('');
// worksheet.html#t3 → 3교시 탭으로 바로 열기 (노트북 교시별 링크)
function fromHash(){ const m = location.hash.match(/^#t([1-8])$/); if (m) { tab = +m[1] - 1; } }
fromHash();
window.addEventListener('hashchange', () => { fromHash(); render(); window.scrollTo({ top: 0 }); });
render();
</script>
</body>
</html>
