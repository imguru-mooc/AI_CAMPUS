  &lt;p class=&quot;sub&quot;&gt;f(x, y) = x²/20 + y² 는 &lt;b style=&quot;color:var(--amber)&quot;&gt;y 방향이 x 방향보다 20배 가파른&lt;/b&gt; 그릇입니다 (비등방성). 기울기 ∇f = (x/10, 2y) 는 최솟값 (0, 0) 을 가리키지 않고 거의 &lt;b&gt;y 방향&lt;/b&gt;만 가리키므로, SGD &lt;code&gt;W ← W − η·∂L/∂W&lt;/code&gt; 는 y 를 넘어갔다 돌아왔다 하는 지그재그를 그리고 x 쪽으로는 아주 느리게 갑니다. 화살표 = 이번 step 의 이동 &lt;code&gt;−η·∇f&lt;/code&gt;. 그림을 클릭하면 시작점을 바꿀 수 있습니다.&lt;/p&gt;

const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];

const sigm=z=&gt;1/(1+Math.exp(-z));
const fe=(v,d=4)=&gt;{if(Number.isNaN(v))return &#x27;nan&#x27;;if(!isFinite(v))return v&gt;0?&#x27;inf&#x27;:&#x27;-inf&#x27;;const a=Math.abs(v);return a!==0&amp;&amp;(a&gt;=1e5||a&lt;1e-3)?v.toExponential(2):v.toFixed(d);};

function makeRng(seed){let a=seed&gt;&gt;&gt;0;const u=()=&gt;{a=(a+0x6D2B79F5)&gt;&gt;&gt;0;let t=a;t=Math.imul(t^(t&gt;&gt;&gt;15),t|1);t^=t+Math.imul(t^(t&gt;&gt;&gt;7),t|61);return((t^(t&gt;&gt;&gt;14))&gt;&gt;&gt;0)/4294967296;};

function arrow(g,x0,y0,x1,y1,c,w=2,hs=8){const a=Math.atan2(y1-y0,x1-x0),L=Math.hypot(x1-x0,y1-y0);if(L&lt;1)return;hs=Math.min(hs,L*0.6);g.strokeStyle=c;g.fillStyle=c;g.lineWidth=w;g.beginPath();g.moveTo(x0,y0);g.lineTo(x1-Math.cos(a)*hs*0.7,y1-Math.sin(a)*hs*0.7);g.stroke();

    code=o.id===&#x27;AdaGrad&#x27;?`&lt;span class=&quot;c&quot;&gt;# 2-2 AdaGrad&lt;/span&gt;\nfor k in params:\n    self.h[k] += grads[k] ** 2\n    params[k] -= self.lr * grads[k] / (np.sqrt(self.h[k]) + 1e-7)\n&lt;span class=&quot;a&quot;&gt;# h = ${v2(r.h)} → 보폭 η/√h = (${fe(eff[0],3)}, ${fe(eff[1],3)})&lt;/span&gt;\n&lt;span class=&quot;c&quot;&gt;# 많이 움직인 축(y)은 보폭이 작아진다. h 는 계속 커지기만 함&lt;/span&gt;`
      :`&lt;span class=&quot;c&quot;&gt;# 2-3 RMSProp (ρ = decay 0.99)&lt;/span&gt;\nfor k in params:\n    self.h[k] = self.decay * self.h[k] + (1 - self.decay) * grads[k] ** 2\n    params[k] -= self.lr * grads[k] / (np.sqrt(self.h[k]) + 1e-7)\n&lt;span class=&quot;a&quot;&gt;# h = ${v2(r.h)} → 보폭 (${fe(eff[0],3)}, ${fe(eff[1],3)})&lt;/span&gt;\n&lt;span class=&quot;c&quot;&gt;# 지수 이동 평균: 오래된 기울기는 잊는다 (AdaGrad 처럼 멈추지 않음)&lt;/span&gt;`;}
  if(o.id===&#x27;Adam&#x27;){kv+=`&lt;span&gt;t&lt;/span&gt;&lt;b&gt;${r.t}&lt;/b&gt;&lt;span&gt;m (1차)&lt;/span&gt;&lt;b style=&quot;color:var(--blue)&quot;&gt;${v2(r.m)}&lt;/b&gt;&lt;span&gt;v (2차)&lt;/span&gt;&lt;b style=&quot;color:var(--green)&quot;&gt;${v2(r.s,4)}&lt;/b&gt;&lt;span&gt;m̂ = m/(1−0.9ᵗ)&lt;/span&gt;&lt;b style=&quot;color:var(--blue)&quot;&gt;${v2(r.mh)}&lt;/b&gt;&lt;span&gt;v̂ = v/(1−0.999ᵗ)&lt;/span&gt;&lt;b style=&quot;color:var(--green)&quot;&gt;${v2(r.vh)}&lt;/b&gt;&lt;span&gt;이동&lt;/span&gt;&lt;b style=&quot;color:var(--amber)&quot;&gt;${v2(r.d)}&lt;/b&gt;`;
    code=`&lt;span class=&quot;c&quot;&gt;# 2-4 Adam (β1 0.9, β2 0.999)&lt;/span&gt;\nself.t += 1                              &lt;span class=&quot;c&quot;&gt;# t = ${r.t}&lt;/span&gt;\nself.m[k] = self.beta1 * self.m[k] + (1 - self.beta1) * grads[k]\nself.v[k] = self.beta2 * self.v[k] + (1 - self.beta2) * grads[k] ** 2\nm_hat = self.m[k] / (1 - self.beta1 ** self.t)   &lt;span class=&quot;c&quot;&gt;# ${v2(r.mh)}&lt;/span&gt;\nv_hat = self.v[k] / (1 - self.beta2 ** self.t)   &lt;span class=&quot;c&quot;&gt;# ${v2(r.vh)}&lt;/span&gt;\nparams[k] -= self.lr * m_hat / (np.sqrt(v_hat) + 1e-7)\n&lt;span class=&quot;a&quot;&gt;# Momentum(m) + RMSProp(v) + 편향 보정(초반 m, v 가 0 쪽으로 치우친 것 보정)&lt;/span&gt;`;}
  $(&#x27;#kv&#x27;).innerHTML=kv;setCode(code);draw();}
function drawLC(upto=mk){
  const S=D.opt_mnist.map((r,i)=&gt;({pts:r.curve.slice(0,upto).map((v,j)=&gt;[(j+0.5)*20,v]),c:OPTS[i].c,w:2}));
  chart($(&#x27;#lc&#x27;),{xr:[0,2000],yr:[0.02,3],ylog:true,xt:[0,500,1000,1500,2000],yt:[0.03,0.1,0.3,1,3],xl:&#x27;iteration&#x27;,ml:40,series:S});
  $(&#x27;#mt&#x27;).innerHTML=&#x27;&lt;tr&gt;&lt;th&gt;optimizer&lt;/th&gt;&lt;th&gt;lr&lt;/th&gt;&lt;th&gt;마지막 100 평균 손실&lt;/th&gt;&lt;th&gt;test 정확도&lt;/th&gt;&lt;/tr&gt;&#x27;+D.opt_mnist.map((r,i)=&gt;`&lt;tr&gt;&lt;td style=&quot;color:${OPTS[i].c}&quot;&gt;${r.name}&lt;/td&gt;&lt;td&gt;${MLR[r.name]}&lt;/td&gt;&lt;td&gt;${upto&gt;=mk?r.last100.toFixed(3):&#x27;…&#x27;}&lt;/td&gt;&lt;td&gt;${upto&gt;=mk?r.test.toFixed(4):&#x27;…&#x27;}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;);}
function stop(){stopTimer();}
async function play(ms=85){if(k&gt;=STEPS)k=0;info();while(k&lt;STEPS){await sleep(ms);k++;info();}}
function endTxt(ids){return OPTS.filter(o=&gt;ids.includes(o.id)).map(o=&gt;`${o.id} (${f3(o.pts[STEPS][0])}, ${f3(o.pts[STEPS][1])}) f ${fe(fxy(...o.pts[STEPS]),4)}`).join(&#x27; · &#x27;);}
$(&#x27;#bPrev&#x27;).onclick=()=&gt;{if(busy)return;if(k&gt;0)k--;info();};
$(&#x27;#bNext&#x27;).onclick=()=&gt;{if(busy)return;if(k&lt;STEPS)k++;info();};
$(&#x27;#bHome&#x27;).onclick=()=&gt;{if(busy)return;k=0;info();};
$(&#x27;#bDef&#x27;).onclick=()=&gt;{if(busy)return;setup(OPTS.map(o=&gt;o.id),sel);setStatus(&#x27;info&#x27;,&#x27;기본 lr · 시작점 (−7, 2) 로 되돌렸습니다.&#x27;);};
$(&#x27;#bPlay&#x27;).onclick=async()=&gt;{if(busy)return;busy=true;try{await play();setStatus(&#x27;ok&#x27;,endTxt(OPTS.filter(o=&gt;o.on).map(o=&gt;o.id)));}finally{busy=false;}};
$(&#x27;#ct&#x27;).addEventListener(&#x27;click&#x27;,e=&gt;{if(busy)return;const r=e.target.getBoundingClientRect();
  start=[Math.round((CX[0]+(e.clientX-r.left)/r.width*(CX[1]-CX[0]))*100)/100,Math.round((CY[0]+(1-(e.clientY-r.top)/r.height)*(CY[1]-CY[0]))*100)/100];simAll();k=0;info();setStatus(&#x27;info&#x27;,`시작점 (${start[0].toFixed(2)}, ${start[1].toFixed(2)}) — ▶ 30 step 경주 를 누르세요.`);});
window.addEventListener(&#x27;resize&#x27;,()=&gt;{draw();drawLC();});
function setup(on,s){start=[-7,2];OPTS.forEach(o=&gt;{o.lr=DEF[o.id];o.on=on.includes(o.id);});sel=s;simAll();k=0;info();}
window.__d2={};
const P=[
 {n:&#x27;① 5종 경주 (기본 lr)&#x27;,ex:&#x27;&lt;p&gt;같은 30 step 인데 끝점이 크게 다릅니다: SGD &lt;b class=&quot;amber&quot;&gt;(−0.350, 0.085)&lt;/b&gt; f 0.0133 · Momentum &lt;b class=&quot;blue&quot;&gt;(0.896, 0.088)&lt;/b&gt; f 0.0479 · AdaGrad &lt;b class=&quot;green&quot;&gt;(−0.120, 0.000)&lt;/b&gt; f 0.00072 · RMSProp &lt;b class=&quot;purple&quot;&gt;(−0.697, 0.000)&lt;/b&gt; f 0.0243 · Adam &lt;b class=&quot;red&quot;&gt;(0.136, 0.318)&lt;/b&gt; f 0.102.&lt;/p&gt;&lt;p&gt;lr 은 optimizer 마다 다릅니다 — 같은 lr 로 비교하면 공정하지 않습니다(보폭의 의미가 다름). 이 그릇에서는 AdaGrad 가 가장 가깝지만, 실제 신경망(MNIST)에서는 순위가 다릅니다 → 아래 그래프.&lt;/p&gt;&#x27;,
  run:async()=&gt;{setup(OPTS.map(o=&gt;o.id),&#x27;SGD&#x27;);await sleep(300);await play();OPTS.forEach(o=&gt;{const [x,y]=o.pts[STEPS];window.__d2[o.id]={x,y,f:fxy(x,y)};});setStatus(&#x27;ok&#x27;,endTxt(OPTS.map(o=&gt;o.id)));}},
 {n:&#x27;② Momentum — 관성&#x27;,ex:&#x27;&lt;p&gt;&lt;code&gt;v ← αv − η·g&lt;/code&gt;, &lt;code&gt;W ← W + v&lt;/code&gt;. 공이 그릇을 굴러 내려가듯 속도 v 가 쌓입니다. x 방향은 기울기 부호가 계속 같아 v 가 커지고(가속), y 방향은 부호가 번갈아 바뀌어 서로 상쇄됩니다 → 지그재그가 줄어듭니다.&lt;/p&gt;&lt;p&gt;관성 때문에 최솟값을 지나쳐 x &amp;gt; 0 까지 갔다가 돌아오는 중 — 30 step 끝 &lt;b class=&quot;blue&quot;&gt;(0.896, 0.088)&lt;/b&gt;.&lt;/p&gt;&#x27;,
  run:async()=&gt;{setup([&#x27;SGD&#x27;,&#x27;Momentum&#x27;],&#x27;Momentum&#x27;);await sleep(300);await play(110);setStatus(&#x27;ok&#x27;,endTxt([&#x27;SGD&#x27;,&#x27;Momentum&#x27;])+&#x27; — v 의 x 성분이 쌓여 최솟값을 지나침&#x27;);}},
 {n:&#x27;③ AdaGrad — 축별 보폭&#x27;,ex:&#x27;&lt;p&gt;&lt;code&gt;h ← h + g²&lt;/code&gt;, &lt;code&gt;W ← W − η·g/(√h + 1e-7)&lt;/code&gt;. 많이 움직인 축은 h 가 커져 보폭이 줄어듭니다. 첫 step 에서 y 의 h = 16, x 의 h = 0.49 → 보폭 η/√h 가 y 쪽이 5.7배 작습니다.&lt;/p&gt;&lt;p&gt;lr 1.5 로 크게 잡아도 y 가 튀지 않습니다. 단점: h 가 계속 커지기만 해서 오래 학습하면 보폭이 0 에 가까워져 멈춥니다 → RMSProp.&lt;/p&gt;&#x27;,
  run:async()=&gt;{setup([&#x27;SGD&#x27;,&#x27;AdaGrad&#x27;],&#x27;AdaGrad&#x27;);await sleep(300);await play(110);setStatus(&#x27;ok&#x27;,endTxt([&#x27;SGD&#x27;,&#x27;AdaGrad&#x27;]));}},
 {n:&#x27;④ RMSProp — 잊어버리는 h&#x27;,ex:&#x27;&lt;p&gt;&lt;code&gt;h ← ρh + (1 − ρ)g²&lt;/code&gt; (ρ = 0.99) — 지수 이동 평균이라 오래된 기울기는 점점 잊습니다. 그래서 AdaGrad 처럼 보폭이 계속 줄어들지 않습니다.&lt;/p&gt;&lt;p&gt;처음 몇 step 은 h 가 작아(1 − ρ = 0.01 배) 보폭이 커지는 점도 보세요. lr 0.1 → 끝 &lt;b class=&quot;purple&quot;&gt;(−0.697, 0.000)&lt;/b&gt;.&lt;/p&gt;&#x27;,
  run:async()=&gt;{setup([&#x27;AdaGrad&#x27;,&#x27;RMSProp&#x27;],&#x27;RMSProp&#x27;);await sleep(300);await play(110);setStatus(&#x27;ok&#x27;,endTxt([&#x27;AdaGrad&#x27;,&#x27;RMSProp&#x27;]));}},
 {n:&#x27;⑤ Adam — m̂ · v̂&#x27;,ex:&#x27;&lt;p&gt;Adam = Momentum 의 1차 모멘트 m + RMSProp 의 2차 모멘트 v + &lt;b class=&quot;amber&quot;&gt;편향 보정&lt;/b&gt;. m, v 는 0 에서 시작하므로 초반엔 0 쪽으로 치우칩니다 → &lt;code&gt;m̂ = m/(1 − β1ᵗ)&lt;/code&gt;, &lt;code&gt;v̂ = v/(1 − β2ᵗ)&lt;/code&gt; 로 보정. t = 1 이면 m̂ = g, v̂ = g² → 첫 이동은 축마다 정확히 −η·sign(g) = (0.3, −0.3)!&lt;/p&gt;&lt;p&gt;lr 0.3 → 끝 &lt;b class=&quot;red&quot;&gt;(0.136, 0.318)&lt;/b&gt;. 그릇에선 아직 진동 중이지만 MNIST 에서는 상위권.&lt;/p&gt;&#x27;,
  run:async()=&gt;{setup([&#x27;Momentum&#x27;,&#x27;Adam&#x27;],&#x27;Adam&#x27;);k=0;info();await sleep(500);k=1;info();setStatus(&#x27;info&#x27;,&#x27;t = 1: m̂ = g, v̂ = g² → 이동 = −0.3·g/|g| = (0.3, −0.3)&#x27;);await sleep(1500);await play(100);setStatus(&#x27;ok&#x27;,endTxt([&#x27;Momentum&#x27;,&#x27;Adam&#x27;]));}},
 {n:&#x27;⑥ MNIST 2000 iteration&#x27;,ex:&#x27;&lt;p&gt;784-100-100-100-100-10, He 초기화, batch 128, 2000 iteration, seed 0 (노트북 2-6). test 정확도: SGD(0.01) &lt;b class=&quot;amber&quot;&gt;0.9378&lt;/b&gt; · Momentum(0.01) &lt;b class=&quot;blue&quot;&gt;0.9644&lt;/b&gt; · AdaGrad(0.01) &lt;b class=&quot;green&quot;&gt;0.9726&lt;/b&gt; · RMSProp(0.001) &lt;b class=&quot;purple&quot;&gt;0.9745&lt;/b&gt; · Adam(0.001) &lt;b class=&quot;red&quot;&gt;0.9740&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;마지막 100 iteration 평균 손실 0.227 / 0.074 / 0.059 / 0.046 / 0.046. 실무 기본값은 Adam(lr 0.001) — 8교시 미니 프로젝트도 Adam 을 씁니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{for(let i=1;i&lt;=mk;i+=4){drawLC(i);setStatus(&#x27;info&#x27;,`iteration ${i*20} / 2000`);await sleep(28);}drawLC(mk);window.__d2m=D.opt_mnist.map(r=&gt;[r.name,r.last100,r.test]);
   setStatus(&#x27;ok&#x27;,&#x27;test: &#x27;+D.opt_mnist.map(r=&gt;`${r.name} ${r.test.toFixed(4)}`).join(&#x27; · &#x27;));}},
];
buildOpts();simAll();info();drawLC();
initPresets(P,stop);

  &lt;p class=&quot;sub&quot;&gt;입력 1000×100 (표준정규분포) 을 100 노드짜리 은닉층 5개에 통과시키고, 층마다 활성화 값의 히스토그램을 그립니다 (편향 없음, 각 층 &lt;code&gt;W = scale * rng.standard_normal((100, 100))&lt;/code&gt;). 가중치 scale 이 너무 크면 sigmoid 가 0 · 1 로 쏠려 &lt;b style=&quot;color:var(--red)&quot;&gt;기울기 소실&lt;/b&gt;, 너무 작으면 모두 한 값 근처로 모여 &lt;b style=&quot;color:var(--amber)&quot;&gt;표현력이 사라집니다&lt;/b&gt;. Xavier &lt;code&gt;√(1/n_in)&lt;/code&gt; 는 sigmoid · tanh, He &lt;code&gt;√(2/n_in)&lt;/code&gt; 는 ReLU 에 맞춘 값입니다 (n_in = 100 → 0.1, 0.141).&lt;/p&gt;

 {n:&#x27;② sigmoid · std 0.01&#x27;,ex:&#x27;&lt;p&gt;scale 0.01 이면 &lt;code&gt;x @ W&lt;/code&gt; 가 0 근처 → sigmoid 출력이 모두 0.5 근처. 노트북 표준편차 &lt;b class=&quot;amber&quot;&gt;0.025 → 0.012&lt;/b&gt;. 기울기는 살아 있지만 뉴런 100개가 거의 같은 값을 내므로 &lt;b&gt;표현력이 제한&lt;/b&gt;됩니다 (여러 뉴런을 둔 의미가 없음).&lt;/p&gt;&#x27;,
  run:async()=&gt;{await sc(&#x27;sigmoid&#x27;,&#x27;0.01&#x27;,S=&gt;&#x27;sigmoid · std 0.01: std &#x27;+S.map(q=&gt;q.std.toFixed(3)).join(&#x27; / &#x27;)+&#x27; (JS) — 모두 0.5 근처&#x27;);}},
 {n:&#x27;③ sigmoid · Xavier&#x27;,ex:&#x27;&lt;p&gt;Xavier: &lt;code&gt;std = √(1/n_in)&lt;/code&gt; = 0.1. 앞 층 노드 수가 n 이면 합의 분산이 n 배가 되므로 1/n 로 나눠 맞춘 것. 노트북 표준편차 &lt;b class=&quot;green&quot;&gt;0.207 / 0.123 / 0.112 / 0.124 / 0.117&lt;/b&gt; — 0 · 1 로 쏠리지도, 한 점에 몰리지도 않고 넓게 퍼집니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{await sc(&#x27;sigmoid&#x27;,&#x27;xavier&#x27;,S=&gt;&#x27;sigmoid · Xavier: std &#x27;+S.map(q=&gt;q.std.toFixed(3)).join(&#x27; / &#x27;)+&#x27; (JS)&#x27;);}},
 {n:&#x27;④ ReLU · std 0.01&#x27;,ex:&#x27;&lt;p&gt;ReLU 는 음수를 0 으로 만들어 분산이 절반으로 줄어듭니다. scale 0.01 이면 층마다 0.01×√100/√2 ≈ 0.07 배 → 노트북 표준편차 &lt;b class=&quot;red&quot;&gt;0.058, 0.0041, 0.0003, 0.0000&lt;/b&gt; — 층마다 신호가 사라집니다. MNIST 에선 손실이 2.301 에서 꼼짝 않고 test 0.1135.&lt;/p&gt;&#x27;,
  run:async()=&gt;{await sc(&#x27;relu&#x27;,&#x27;0.01&#x27;,S=&gt;&#x27;ReLU · std 0.01: std &#x27;+S.map(q=&gt;fe(q.std,4)).join(&#x27; / &#x27;)+&#x27; (JS) — 층마다 약 0.07 배&#x27;);}},
 {n:&#x27;⑤ ReLU · Xavier&#x27;,ex:&#x27;&lt;p&gt;Xavier 는 ReLU 의 &quot;절반이 0&quot; 을 고려하지 않아 층마다 약 1/√2 배씩 줄어듭니다. 노트북 &lt;b class=&quot;amber&quot;&gt;0.583, 0.412, 0.303, 0.220, 0.177&lt;/b&gt; (점점 작아짐). 5층이면 버티지만 깊어질수록 문제.&lt;/p&gt;&#x27;,
  run:async()=&gt;{await sc(&#x27;relu&#x27;,&#x27;xavier&#x27;,S=&gt;&#x27;ReLU · Xavier: std &#x27;+S.map(q=&gt;q.std.toFixed(3)).join(&#x27; / &#x27;)+&#x27; (JS) — 점점 작아짐&#x27;);}},
 {n:&#x27;⑥ ReLU · He&#x27;,ex:&#x27;&lt;p&gt;He: &lt;code&gt;std = √(2/n_in)&lt;/code&gt; — ReLU 가 절반을 0 으로 만드는 만큼 2 를 곱해 분산을 유지합니다. 노트북 &lt;b class=&quot;green&quot;&gt;0.82, 0.82, 0.86, 0.88, 1.00&lt;/b&gt; (유지). MNIST 4층 은닉 SGD 0.01, 2000 iteration: std 0.01 → &lt;b class=&quot;red&quot;&gt;0.1135&lt;/b&gt; · Xavier → &lt;b class=&quot;amber&quot;&gt;0.9179&lt;/b&gt; · He → &lt;b class=&quot;green&quot;&gt;0.9378&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;규칙: &lt;b&gt;sigmoid · tanh → Xavier, ReLU → He&lt;/b&gt;.&lt;/p&gt;&#x27;,
  run:async()=&gt;{await sc(&#x27;relu&#x27;,&#x27;he&#x27;,S=&gt;&#x27;ReLU · He: std &#x27;+S.map(q=&gt;q.std.toFixed(3)).join(&#x27; / &#x27;)+&#x27; (JS) — 층을 지나도 유지&#x27;);
   const n=D.init_mnist[0].curve.length;for(let i=1;i&lt;=n;i+=4){drawLC(i);await sleep(25);}drawLC();window.__d3m=D.init_mnist.map(r=&gt;[r.name,r.last100,r.test]);
   setStatus(&#x27;ok&#x27;,&#x27;MNIST 2000 iteration: &#x27;+D.init_mnist.map(r=&gt;`${LN[r.name]} test ${r.test.toFixed(4)}`).join(&#x27; · &#x27;));}},
 {n:&#x27;⑦ 대칭 문제 (상수 초기화)&#x27;,ex:&#x27;&lt;p&gt;W 를 모두 같은 값(0.01)으로 두면 은닉 뉴런들이 &lt;b class=&quot;red&quot;&gt;같은 입력 · 같은 가중치&lt;/b&gt; → 같은 출력 → 역전파에서도 같은 기울기 → 같은 갱신. 몇 step 을 돌려도 똑같은 상태로 남아 뉴런 여러 개가 사실상 &lt;b&gt;1개&lt;/b&gt;입니다.&lt;/p&gt;&lt;p&gt;노트북: 784-10-10 을 W 전부 0.01 로 두고 SGD 0.1 300 iteration → W1 의 모든 열이 똑같음, test &lt;b class=&quot;red&quot;&gt;0.2714&lt;/b&gt;. W 를 0 으로 두면 dW1 = 0, dW2 = 0 이라 아예 움직이지 않습니다. 해결: &lt;b class=&quot;green&quot;&gt;랜덤 초기화&lt;/b&gt; 로 대칭을 깬다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{view(&#x27;vSym&#x27;);symInit(&#x27;const&#x27;);symInfo();await sleep(500);for(let i=0;i&lt;10;i++){symStep(1);symInfo();setStatus(&#x27;warn&#x27;,`상수 초기화 · step ${sym.it}: 은닉 4개 활성화 ${sym.z.map(v=&gt;v.toFixed(4)).join(&#x27; = &#x27;)}`);await sleep(180);}
   const c=colsSame();await sleep(600);symInit(&#x27;rand&#x27;);symInfo();for(let i=0;i&lt;10;i++){symStep(1);symInfo();await sleep(120);}
   window.__d3sym2={constSame:c,randSame:colsSame()};setStatus(&#x27;ok&#x27;,`상수 초기화: 10 step 후에도 W1 열 4개 ${c?&#x27;모두 같음&#x27;:&#x27;다름&#x27;} · 랜덤 초기화: ${colsSame()?&#x27;같음&#x27;:&#x27;서로 다름&#x27;} — 랜덤이 대칭을 깹니다`);}},
];
symInit(&#x27;const&#x27;);drawLC();setAI(&#x27;sigmoid&#x27;,&#x27;1.0&#x27;);
initPresets(P,null);
$(&#x27;#presets button&#x27;).click();

&lt;div class=&quot;app&quot;&gt;
  &lt;h1&gt;Batch Normalization&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;미니배치(N 개)의 특성(열)마다 평균 μ, 분산 σ² 를 구해 &lt;b style=&quot;color:var(--teal)&quot;&gt;평균 0 · 분산 1&lt;/b&gt; 로 맞춘 뒤(&lt;code&gt;x̂ = (x − μ)/√(σ² + ε)&lt;/code&gt;), 학습하는 γ, β 로 &lt;b style=&quot;color:var(--amber)&quot;&gt;다시 늘이고 옮깁니다&lt;/b&gt;(&lt;code&gt;y = γx̂ + β&lt;/code&gt;). 아래는 노트북 4-1 의 예제 &lt;code&gt;x = rng(4).normal(3, 2, (5, 4))&lt;/code&gt;, γ = [1, 2, 0.5, 1.5], β = [0, 1, −1, 0.5]. 단계 0 에서 점을 위아래로 끌거나 표의 값을 고쳐 보세요.&lt;/p&gt;
  &lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill teal&quot;&gt;axis=0 · ε = 1e-7&lt;/span&gt;&lt;span class=&quot;pill amber&quot;&gt;출력 열 평균 = β · 표준편차 = γ&lt;/span&gt;&lt;span class=&quot;pill blue&quot;&gt;gradient check dx 3.8e-10 · dγ 9.1e-13 · dβ 6.8e-14&lt;/span&gt;&lt;span class=&quot;pill purple&quot;&gt;running: 0.9·running + 0.1·μ → 5.03 / 3.83&lt;/span&gt;&lt;span class=&quot;pill green&quot;&gt;std 0.01: noBN 0.117 vs BN 1.000&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2 id=&quot;stageTitle&quot;&gt;단계&lt;/h2&gt;
      &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;seg&quot; id=&quot;mode&quot;&gt;&lt;button type=&quot;button&quot; data-m=&quot;train&quot; class=&quot;sel&quot;&gt;학습 (train_flg=True)&lt;/button&gt;&lt;button type=&quot;button&quot; data-m=&quot;infer&quot;&gt;추론 (running 값)&lt;/button&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;canvas id=&quot;bn&quot;&gt;&lt;/canvas&gt;
      &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:#f5b942&quot;&gt;&lt;/i&gt;μ (또는 running_mean)&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#c084fc&quot;&gt;&lt;/i&gt;±σ&lt;/span&gt;&lt;span&gt;점 색 = 배치 안의 샘플 (행) 0~4&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;row stg&quot; id=&quot;stg&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;row ctl&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;bPrev&quot;&gt;◀&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;bNext&quot;&gt;▶&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;run&quot; id=&quot;bPlay&quot;&gt;▶ 0 → 5 재생&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;bRst&quot;&gt;예제 값으로&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;bF1&quot;&gt;학습 forward ×1&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;bF10&quot;&gt;×10&lt;/button&gt;&lt;/div&gt;
      &lt;div class=&quot;scroll&quot;&gt;&lt;table class=&quot;tt&quot; id=&quot;tb&quot;&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;현재 값&lt;/h2&gt;&lt;div class=&quot;kv&quot; id=&quot;kv&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;Python (노트북 4-1 · 4-2)&lt;/h2&gt;&lt;div class=&quot;code&quot; id=&quot;code&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;상태&lt;/h2&gt;&lt;div class=&quot;status info&quot; id=&quot;status&quot;&gt;프리셋을 누르세요.&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;two&quot;&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;running mean 수렴 — N(5, 2²) 배치(100개) 50번 (default_rng(0))&lt;/h2&gt;
      &lt;canvas id=&quot;rc&quot;&gt;&lt;/canvas&gt;
      &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:#60a5fa&quot;&gt;&lt;/i&gt;배치 μ&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#f5b942&quot;&gt;&lt;/i&gt;running_mean&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#c084fc&quot;&gt;&lt;/i&gt;배치 σ²&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#f87171&quot;&gt;&lt;/i&gt;running_var&lt;/span&gt;&lt;/div&gt;

   const ym=window.__d4.ym;setStatus(&#x27;ok&#x27;,`forward ${nfw}회 후 추론 출력 열 평균 [${ym.map(f3).join(&#x27;, &#x27;)}] ≈ β`);}},
 {n:&#x27;⑤ running mean 50 배치&#x27;,ex:&#x27;&lt;p&gt;N(5, 2²) 에서 뽑은 배치(100개)를 50번 넣으면 (노트북 &lt;code&gt;default_rng(0)&lt;/code&gt;) running_mean &lt;b class=&quot;amber&quot;&gt;5.03&lt;/b&gt;, running_var &lt;b class=&quot;amber&quot;&gt;3.83&lt;/b&gt;. 시작값 0 · 1 에서 0.9 배씩 잊으며 참값 5 · 4 근처로 수렴합니다. 마지막 몇 배치의 무게가 커서 정확히 5 · 4 는 아닙니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{drawRC(0);await sleep(300);await playRC();setStatus(&#x27;ok&#x27;,`50 배치 후 running_mean ${D.running.rm[49].toFixed(2)} · running_var ${D.running.rv[49].toFixed(2)}`);}},
 {n:&#x27;⑥ BN 효과 — std 0.01&#x27;,ex:&#x27;&lt;p&gt;1000장, 784-100×5-10, SGD 0.01, 20 epoch, batch 100. 마지막 train/test:&lt;/p&gt;&lt;p&gt;std 1.0: noBN 0.097/0.098 (발산) vs BN 0.483/0.347 · std 0.1: 0.483/0.435 vs 0.878/0.692 · &lt;b class=&quot;amber&quot;&gt;std 0.01: 0.117/0.103 vs 1.000/0.878&lt;/b&gt; · He: 0.850/0.772 vs 0.969/0.726.&lt;/p&gt;&lt;p&gt;BN 이 있으면 초기화가 나빠도 학습이 됩니다 (초기화에 덜 민감, 더 큰 학습률 가능). 다만 1000장이라 train 1.000 vs test 0.878 — 과적합은 따로 다뤄야 합니다 (5교시).&lt;/p&gt;&#x27;,
  run:async()=&gt;{for(let i=0;i&lt;4;i++){drawFX(i);const r=D.bn_effect[i];setStatus(&#x27;info&#x27;,`${INL[r.init]}: noBN ${r.no.tr[19].toFixed(3)}/${r.no.te.toFixed(3)} vs BN ${r.bn.tr[19].toFixed(3)}/${r.bn.te.toFixed(3)}`);await sleep(650);}
   drawFX(2);const r=D.bn_effect[2];window.__d4fx=D.bn_effect.map(q=&gt;[q.init,q.no.tr[19],q.no.te,q.bn.tr[19],q.bn.te]);setStatus(&#x27;ok&#x27;,`std 0.01: BN 없음 ${r.no.tr[19].toFixed(3)} / ${r.no.te.toFixed(3)} → BN ${r.bn.tr[19].toFixed(3)} / ${r.bn.te.toFixed(3)}`);}},
];
info();drawRC();drawFX();
initPresets(P,null);
$(&#x27;#presets button&#x27;).click();

&lt;div class=&quot;app&quot;&gt;
  &lt;h1&gt;과적합 (overfitting)&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;모델이 train 데이터의 &lt;b style=&quot;color:var(--red)&quot;&gt;잡음까지 외우면&lt;/b&gt; train 오차는 0 에 가까워지는데 처음 보는 test 데이터에서는 오히려 나빠집니다. 왼쪽 장난감: 참 함수 &lt;code&gt;sin(πx)&lt;/code&gt;(초록 점선) 에 잡음을 더한 점들(파랑)을 다항식으로 맞춥니다 — 차수 = 모델 크기. 아래 MNIST: 학습 300장으로 784-100×6-10 을 200 epoch 학습하면 train 1.000 · test 0.786, test &lt;b&gt;손실&lt;/b&gt;은 오히려 커집니다 (과신).&lt;/p&gt;
  &lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill red&quot;&gt;300장: train 1.000 / test 0.786 · 간극 0.214&lt;/span&gt;&lt;span class=&quot;pill amber&quot;&gt;test 손실 25 epoch 0.79 → 200 epoch 1.12&lt;/span&gt;&lt;span class=&quot;pill green&quot;&gt;3000장 (600 iteration): 1.000 / 0.926&lt;/span&gt;&lt;span class=&quot;pill blue&quot;&gt;784-100-10 (300장): 1.000 / 0.802&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;grid&quot;&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;다항 회귀 장난감 — y = sin(πx) + 잡음 (σ 0.25)&lt;/h2&gt;
      &lt;canvas id=&quot;fit&quot;&gt;&lt;/canvas&gt;
      &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;&lt;i style=&quot;background:#60a5fa&quot;&gt;&lt;/i&gt;train 점&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#8a9bb8&quot;&gt;&lt;/i&gt;test 400점&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#f5b942&quot;&gt;&lt;/i&gt;다항식&lt;/span&gt;&lt;span&gt;&lt;i style=&quot;background:#4ade80&quot;&gt;&lt;/i&gt;참 함수&lt;/span&gt;&lt;/div&gt;

    &lt;/div&gt;
    &lt;div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;현재 값&lt;/h2&gt;&lt;div class=&quot;kv&quot; id=&quot;kv&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;Python (NumPy 만)&lt;/h2&gt;&lt;div class=&quot;code&quot; id=&quot;code&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;상태&lt;/h2&gt;&lt;div class=&quot;status info&quot; id=&quot;status&quot;&gt;프리셋을 누르세요.&lt;/div&gt;&lt;/div&gt;

&lt;script&gt;
const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,ms));
let busy=false, timer=null;
function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}
function setCode(h){$(&#x27;#code&#x27;).innerHTML=h;}
function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const g=c.getContext(&#x27;2d&#x27;);g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}
function show(id,title){$$(&#x27;.view&#x27;).forEach(v=&gt;v.classList.toggle(&#x27;on&#x27;,v.id===id));if(title&amp;&amp;$(&#x27;#stageTitle&#x27;))$(&#x27;#stageTitle&#x27;).textContent=title;}
function initPresets(P,stop){$(&#x27;#presets&#x27;).innerHTML=P.map(p=&gt;`&lt;button type=&quot;button&quot;&gt;${p.n}&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}
const sigm=z=&gt;1/(1+Math.exp(-z));
const fe=(v,d=4)=&gt;{if(Number.isNaN(v))return &#x27;nan&#x27;;if(!isFinite(v))return v&gt;0?&#x27;inf&#x27;:&#x27;-inf&#x27;;const a=Math.abs(v);return a!==0&amp;&amp;(a&gt;=1e5||a&lt;1e-3)?v.toExponential(2):v.toFixed(d);};
const f3=v=&gt;(Math.abs(v)&lt;5e-4?0:v).toFixed(3), f4=v=&gt;(Math.abs(v)&lt;5e-5?0:v).toFixed(4);
const esc=s=&gt;String(s).replace(/&amp;/g,&#x27;&amp;amp;&#x27;).replace(/&lt;/g,&#x27;&amp;lt;&#x27;).replace(/&gt;/g,&#x27;&amp;gt;&#x27;);
// 시드 고정 난수 (mulberry32) + 정규분포 (Box-Muller) — numpy default_rng 과는 다른 수열
function makeRng(seed){let a=seed&gt;&gt;&gt;0;const u=()=&gt;{a=(a+0x6D2B79F5)&gt;&gt;&gt;0;let t=a;t=Math.imul(t^(t&gt;&gt;&gt;15),t|1);t^=t+Math.imul(t^(t&gt;&gt;&gt;7),t|61);return((t^(t&gt;&gt;&gt;14))&gt;&gt;&gt;0)/4294967296;};
  let sp=null;const n=()=&gt;{if(sp!==null){const v=sp;sp=null;return v;}let x,y,r;do{x=u()*2-1;y=u()*2-1;r=x*x+y*y;}while(r&gt;=1||r===0);const m=Math.sqrt(-2*Math.log(r)/r);sp=y*m;return x*m;};return {u,n};}
// 공용 선 그래프: o={xr,yr,xlog,ylog,xt,yt,xf,yf,xl,yl,series:[{pts,c,w,dash,dot,alpha}],hl:[{y,c,t}],vb:[{x0,x1,c}],ml}
function chart(cv,o){
  const [g,W,H]=fitCanvas(cv);g.clearRect(0,0,W,H);
  const ml=o.ml??46,mr=o.mr??12,mt=o.mt??10,mb=o.xl?36:24;
  const tx=v=&gt;o.xlog?Math.log10(v):v,ty=v=&gt;o.ylog?Math.log10(Math.max(v,1e-300)):v;
  const X=v=&gt;ml+(tx(v)-tx(o.xr[0]))/(tx(o.xr[1])-tx(o.xr[0]))*(W-ml-mr);
  const Y=v=&gt;mt+(1-(ty(v)-ty(o.yr[0]))/(ty(o.yr[1])-ty(o.yr[0])))*(H-mt-mb);
  g.font=&#x27;11px Consolas,monospace&#x27;;g.lineWidth=1;
  (o.vb||[]).forEach(b=&gt;{g.fillStyle=b.c;g.fillRect(X(b.x0),mt,X(b.x1)-X(b.x0),H-mt-mb);});
  (o.yt||[]).forEach(v=&gt;{const y=Y(v);g.strokeStyle=&#x27;#1a2540&#x27;;g.beginPath();g.moveTo(ml,y);g.lineTo(W-mr,y);g.stroke();g.fillStyle=&#x27;#5d7292&#x27;;g.textAlign=&#x27;right&#x27;;g.fillText(o.yf?o.yf(v):v,ml-5,y+4);});
  (o.xt||[]).forEach(v=&gt;{const x=X(v);g.strokeStyle=&#x27;#1a2540&#x27;;g.beginPath();g.moveTo(x,mt);g.lineTo(x,H-mb);g.stroke();g.fillStyle=&#x27;#5d7292&#x27;;g.textAlign=&#x27;center&#x27;;g.fillText(o.xf?o.xf(v):v,x,H-mb+14);});
  g.textAlign=&#x27;left&#x27;;

 {n:&#x27;① 차수 3 — 적당&#x27;,ex:&#x27;&lt;p&gt;점 12개를 3차 다항식으로 맞추면 참 함수 sin(πx) 와 비슷한 곡선이 나옵니다. train MSE 와 test MSE 가 둘 다 잡음 분산(0.0625) 근처 — 잡음은 원래 맞출 수 없는 부분입니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{n=12;seed=1;Dt=polyData(n,seed);showT=false;deg=1;info();await slideDeg(3,300);setStatus(&#x27;ok&#x27;,`차수 3: train MSE ${fe(window.__d5t.tr,4)} · test MSE ${fe(window.__d5t.te,4)}`);}},
 {n:&#x27;② 차수 15 — 과적합&#x27;,ex:&#x27;&lt;p&gt;점 12개에 파라미터 16개 → 곡선이 &lt;b class=&quot;red&quot;&gt;모든 점을 거의 정확히 지나가며&lt;/b&gt; 점 사이에서 크게 출렁입니다. train MSE ≈ 0, test MSE 는 폭발. 잡음까지 외운 것 = &lt;b class=&quot;red&quot;&gt;과적합&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;신경망도 같습니다: 파라미터(수십만 개)에 비해 데이터(300장)가 적으면 train 정확도 1.000 인데 test 는 0.786.&lt;/p&gt;&#x27;,
  run:async()=&gt;{n=12;seed=1;Dt=polyData(n,seed);showT=true;deg=3;info();await sleep(300);await slideDeg(15,160);setStatus(&#x27;warn&#x27;,`차수 15 · 점 12개: train MSE ${fe(window.__d5t.tr,4)} vs test MSE ${fe(window.__d5t.te,4)}`);}},
 {n:&#x27;③ 데이터 늘리기&#x27;,ex:&#x27;&lt;p&gt;같은 차수 15 라도 점을 100개로 늘리면 곡선이 함부로 출렁일 수 없습니다 — test MSE 가 크게 줄어듭니다. 과적합의 가장 확실한 해결책은 &lt;b class=&quot;green&quot;&gt;데이터를 늘리는 것&lt;/b&gt;. MNIST 300장 → 3000장: test 0.786 → &lt;b class=&quot;green&quot;&gt;0.926&lt;/b&gt;.&lt;/p&gt;&#x27;,
  run:async()=&gt;{deg=15;seed=1;showT=true;for(const m of [12,20,35,60,100]){n=m;Dt=polyData(n,seed);info();setStatus(&#x27;info&#x27;,`점 ${n}개: train ${fe(window.__d5t.tr,4)} · test ${fe(window.__d5t.te,4)}`);await sleep(550);}

 {n:&#x27;④ 차수 1 → 15 곡선&#x27;,ex:&#x27;&lt;p&gt;아래 그래프: 차수를 올리면 train 오차(파랑)는 계속 줄지만 test 오차(빨강)는 어느 지점부터 다시 올라갑니다. 차수 1~2 는 &lt;b class=&quot;amber&quot;&gt;과소적합&lt;/b&gt;(너무 단순), 큰 차수는 &lt;b class=&quot;red&quot;&gt;과적합&lt;/b&gt;. 그 사이 test 가 최소인 곳이 좋은 모델 — 이것을 고르는 데 test 가 아니라 &lt;b&gt;validation&lt;/b&gt; 을 써야 한다는 것이 7교시.&lt;/p&gt;&#x27;,
  run:async()=&gt;{n=15;seed=1;Dt=polyData(n,seed);showT=false;deg=1;info();await slideDeg(15,220);const b=window.__d5t.best;await sleep(300);await slideDeg(b,120);setStatus(&#x27;ok&#x27;,`점 15개: test MSE 가 최소인 차수 = ${b}`);}},
 {n:&#x27;⑤ MNIST 300장 — 1.000 / 0.786&#x27;,ex:&#x27;&lt;p&gt;학습 300장, 784-100×6-10 (He), SGD &lt;b&gt;0.1&lt;/b&gt;, batch 100, 200 epoch (= 600 iteration), 10 epoch 마다 평가. 끝 train &lt;b class=&quot;blue&quot;&gt;1.000&lt;/b&gt; / test &lt;b class=&quot;red&quot;&gt;0.786&lt;/b&gt;, 간극 0.214.&lt;/p&gt;&lt;p&gt;test &lt;b&gt;손실&lt;/b&gt;은 25 epoch &lt;b class=&quot;amber&quot;&gt;0.79&lt;/b&gt; → 200 epoch &lt;b class=&quot;amber&quot;&gt;1.12&lt;/b&gt; 로 증가 — 정확도는 거의 그대로인데 틀린 답을 점점 더 &lt;b&gt;확신&lt;/b&gt;하기 때문 (과신).&lt;/p&gt;&#x27;,
  run:async()=&gt;{const r=await animM(&#x27;plain&#x27;);window.__d5.plain=r;setStatus(&#x27;warn&#x27;,`300장: train ${r.tr.toFixed(3)} / test ${r.te.toFixed(3)} · test 손실 ${r.tl25.toFixed(2)} → ${r.tl.toFixed(2)} (증가)`);}},

  run:async()=&gt;{const r=await animM(&#x27;n3000&#x27;);window.__d5.n3000=r;await sleep(500);const s=await animM(&#x27;small&#x27;);window.__d5.small=s;await sleep(400);await animM(&#x27;n3000&#x27;);

&lt;div class=&quot;app&quot;&gt;
  &lt;h1&gt;규제 (regularization) — weight decay · Dropout&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;데이터를 늘릴 수 없을 때 과적합을 줄이는 두 방법. &lt;b style=&quot;color:var(--amber)&quot;&gt;weight decay (L2)&lt;/b&gt;: 손실에 &lt;code&gt;½λΣ‖W‖²&lt;/code&gt; 를 더해 큰 가중치에 벌점 → 기울기에 &lt;code&gt;+ λW&lt;/code&gt; (편향 · γ · β 제외). &lt;b style=&quot;color:var(--teal)&quot;&gt;Dropout&lt;/b&gt;: 학습 때 뉴런 일부(ratio)를 무작위로 끄고, 추론 때는 모두 켠 뒤 출력에 &lt;code&gt;(1 − ratio)&lt;/code&gt; 를 곱합니다. 5교시와 같은 MNIST 설정(300장, 784-100×6-10, SGD 0.1, 200 epoch)으로 비교합니다.&lt;/p&gt;
  &lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill red&quot;&gt;규제 없음 1.000 / 0.786 · test 손실 1.12&lt;/span&gt;&lt;span class=&quot;pill amber&quot;&gt;λ 0.01 → 1.000 / 0.810 · 손실 0.74 → 0.65&lt;/span&gt;&lt;span class=&quot;pill teal&quot;&gt;Dropout 0.2 → 1.000 / 0.800 · 25 epoch train 0.53&lt;/span&gt;&lt;span class=&quot;pill purple&quot;&gt;λ 0.1 → 0.767 / 0.641 (과소적합)&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;grid&quot;&gt;
    &lt;div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;weight decay — 차수 15 다항식 · 점 12개 (D4-5 와 같은 데이터)&lt;/h2&gt;
        &lt;canvas id=&quot;fit&quot;&gt;&lt;/canvas&gt;
        &lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;sl&quot;&gt;log₁₀ λ&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sl&quot; min=&quot;-8&quot; max=&quot;0&quot; step=&quot;0.1&quot; value=&quot;-8&quot;&gt;&lt;output id=&quot;ol&quot;&gt;0&lt;/output&gt;&lt;/div&gt;

        &lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;sr&quot;&gt;ratio&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sr&quot; min=&quot;0&quot; max=&quot;0.9&quot; step=&quot;0.05&quot; value=&quot;0.5&quot;&gt;&lt;output id=&quot;or&quot;&gt;0.50&lt;/output&gt;&lt;/div&gt;

    &lt;/div&gt;
    &lt;div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2 id=&quot;kvT&quot;&gt;현재 값&lt;/h2&gt;&lt;div class=&quot;kv&quot; id=&quot;kv&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;Python (노트북 6-1 · 6-2)&lt;/h2&gt;&lt;div class=&quot;code&quot; id=&quot;code&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;상태&lt;/h2&gt;&lt;div class=&quot;status info&quot; id=&quot;status&quot;&gt;프리셋을 누르세요.&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;

  if(frac&gt;=0.15)MS.filter(m=&gt;keys.includes(m[0])).forEach(([k,,c])=&gt;{const r=D.overfit[k],i=r.ep.indexOf(25);o.g.strokeStyle=c;o.g.beginPath();o.g.arc(o.X(25),o.Y(r.tl[i]),5,0,7);o.g.stroke();});
  $(&#x27;#lga&#x27;).innerHTML=MS.map(([k,l,c])=&gt;`&lt;span style=&quot;opacity:${keys.includes(k)?1:0.35}&quot;&gt;&lt;i style=&quot;background:${c}&quot;&gt;&lt;/i&gt;${l}&lt;/span&gt;`).join(&#x27;&#x27;);

async function animM(only){for(let f=1;f&lt;=24;f++){drawM(f/24,only);await sleep(45);}drawM(1,only);}
window.addEventListener(&#x27;resize&#x27;,()=&gt;{wdInfo();doDraw();drawM();});
async function slideLam(to,ms=50){const st=to&gt;lamLog?0.2:-0.2;while(Math.abs(lamLog-to)&gt;1e-9){lamLog=Math.round((lamLog+st)*10)/10;if((st&gt;0&amp;&amp;lamLog&gt;to)||(st&lt;0&amp;&amp;lamLog&lt;to))lamLog=to;wdInfo();await sleep(ms);}}
const fin=k=&gt;{const r=D.overfit[k],L=r.ep.length-1,i=r.ep.indexOf(25);return {tr:r.tr[L],te:r.te[L],tl:r.tl[L],tl25:r.tl[i],tr25:r.tr[i]};};
const P=[
 {n:&#x27;① λ = 0 — 과적합&#x27;,ex:&#x27;&lt;p&gt;규제 없이 차수 15 다항식을 점 12개에 맞추면 계수 |w_j| 가 수천~수만까지 커지며 곡선이 점 사이에서 출렁입니다. 큰 가중치 = 입력의 작은 변화에도 출력이 크게 변하는 &quot;예민한&quot; 모델.&lt;/p&gt;&#x27;,
  run:async()=&gt;{focus=&#x27;wd&#x27;;lamLog=-8;wdInfo();const w=window.__d6w;setStatus(&#x27;warn&#x27;,`λ = 0: ‖W‖ ${fe(w.norm,3)} · train MSE ${fe(w.tr,4)} vs test MSE ${fe(w.te,4)}`);}},
 {n:&#x27;② λ 키우기 — ‖W‖ 감소&#x27;,ex:&#x27;&lt;p&gt;손실에 &lt;code&gt;½λΣ‖W‖²&lt;/code&gt; 를 더하면 &quot;오차도 작게, 가중치도 작게&quot; 를 동시에 원하게 됩니다. λ 를 키우면 ‖W‖ 이 급격히 줄고 곡선이 매끄러워지며 test MSE 가 내려갑니다.&lt;/p&gt;&lt;p&gt;SGD 로 보면 &lt;code&gt;W ← (1 − ηλ)W − η·dW&lt;/code&gt; — 매 step 가중치를 조금씩 0 쪽으로 감쇠시키므로 &quot;weight decay&quot;.&lt;/p&gt;&#x27;,
  run:async()=&gt;{focus=&#x27;wd&#x27;;lamLog=-8;wdInfo();await sleep(300);await slideLam(-3,70);const w=window.__d6w;setStatus(&#x27;ok&#x27;,`λ = 1e-3: ‖W‖ ${fe(w.norm,3)} · train ${fe(w.tr,4)} · test ${fe(w.te,4)}`);}},
 {n:&#x27;③ λ 너무 큼 — 과소적합&#x27;,ex:&#x27;&lt;p&gt;λ 가 너무 크면 가중치를 거의 0 으로 눌러 버려 train 조차 못 맞춥니다 = &lt;b class=&quot;amber&quot;&gt;과소적합&lt;/b&gt;. MNIST 에서도 λ 0.1 은 train 0.767 / test 0.641 — 규제 없음(0.786)보다 나쁩니다. λ 도 하이퍼파라미터 → 7교시 탐색.&lt;/p&gt;&#x27;,
  run:async()=&gt;{focus=&#x27;wd&#x27;;await slideLam(0,60);const w=window.__d6w;setStatus(&#x27;warn&#x27;,`λ = 1: ‖W‖ ${fe(w.norm,3)} · train MSE ${fe(w.tr,4)} — train 도 못 맞춤 (과소적합)`);}},
 {n:&#x27;④ Dropout 학습 — 매번 다른 mask&#x27;,ex:&#x27;&lt;p&gt;학습 때 매 forward 마다 &lt;code&gt;mask = rng.random(x.shape) &amp;gt; ratio&lt;/code&gt; 로 뉴런을 무작위로 끕니다 (ratio 0.5 → 평균 절반). 꺼진 뉴런은 출력도 0, 기울기도 0.&lt;/p&gt;&lt;p&gt;특정 뉴런에 의존할 수 없으니 여러 뉴런에 정보를 나눠 담게 되고, 매 step 다른 &quot;작은 망&quot; 을 학습하는 셈 → 앙상블 효과. 대신 학습이 느려집니다 (MNIST Dropout 0.2: 25 epoch train 0.53).&lt;/p&gt;&#x27;,
  run:async()=&gt;{focus=&#x27;do&#x27;;ratio=0.5;dmode=&#x27;train&#x27;;mrng=makeRng(3);nstep=0;for(let i=0;i&lt;8;i++){newMask();doInfo();setStatus(&#x27;info&#x27;,`step ${nstep}: 켜진 은닉 뉴런 ${window.__d6d.kept} / 12`);await sleep(420);}}},
 {n:&#x27;⑤ Dropout 추론 — ×(1 − ratio)&#x27;,ex:&#x27;&lt;p&gt;추론(&lt;code&gt;train_flg=False&lt;/code&gt;)에서는 모든 뉴런을 켜고 출력에 &lt;code&gt;(1 − ratio)&lt;/code&gt; 를 곱합니다. 학습 때는 평균적으로 (1 − ratio) 만큼만 켜져 있었으므로, 다음 층이 받는 값의 &lt;b&gt;기댓값&lt;/b&gt;을 학습 때와 맞추는 것입니다.&lt;/p&gt;&lt;p&gt;(다른 방식: 학습 때 &lt;code&gt;/(1 − ratio)&lt;/code&gt; 로 미리 키워 두는 inverted dropout — PyTorch 방식. 결과는 같습니다.)&lt;/p&gt;&#x27;,
  run:async()=&gt;{focus=&#x27;do&#x27;;ratio=0.5;dmode=&#x27;train&#x27;;newMask();doInfo();await sleep(700);dmode=&#x27;infer&#x27;;doInfo();setStatus(&#x27;ok&#x27;,`추론: 은닉 12개 모두 켜짐 · 출력 ×${(1-ratio).toFixed(2)}`);}},
 {n:&#x27;⑥ MNIST 비교&#x27;,ex:&#x27;&lt;p&gt;5교시와 같은 설정에서: 규제 없음 1.000 / &lt;b class=&quot;red&quot;&gt;0.786&lt;/b&gt;, test 손실 0.79 → 1.12 (증가) · λ &lt;b class=&quot;amber&quot;&gt;0.01&lt;/b&gt; → 1.000 / &lt;b class=&quot;amber&quot;&gt;0.810&lt;/b&gt;, test 손실 0.74 → &lt;b class=&quot;amber&quot;&gt;0.65&lt;/b&gt; (감소) · Dropout &lt;b class=&quot;teal&quot;&gt;0.2&lt;/b&gt; → 1.000 / &lt;b class=&quot;teal&quot;&gt;0.800&lt;/b&gt;, 초반 학습이 느림 (25 epoch train 0.53) · λ 0.1 → 0.767 / 0.641 (과소적합).&lt;/p&gt;&lt;p&gt;train 이 1.000 인 것은 같지만, 규제를 하면 test 손실이 커지지 않습니다 = 과신하지 않음.&lt;/p&gt;&#x27;,

&lt;div class=&quot;app&quot;&gt;
  &lt;h1&gt;하이퍼파라미터 탐색 (hyperparameter search)&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;학습률 lr, weight decay λ 처럼 사람이 정하는 값은 &lt;b style=&quot;color:var(--amber)&quot;&gt;validation&lt;/b&gt; 데이터로 고릅니다 — test 로 고르면 test 에 과적합되어 &quot;처음 보는 데이터&quot; 의 성능을 알 수 없게 됩니다. 범위가 10배 단위로 넓으니 &lt;b&gt;로그 스케일&lt;/b&gt;로 뽑고, 그리드보다 &lt;b style=&quot;color:var(--teal)&quot;&gt;랜덤 탐색&lt;/b&gt;이 중요한 축을 더 촘촘히 봅니다. 노트북 7-3: 30 회, lr = 10^U(−4, 0), λ = 10^U(−6, −1), 784-100-100-10, SGD, 20 epoch.&lt;/p&gt;
  &lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill blue&quot;&gt;1000장 → val p[:200] · train p[200:]&lt;/span&gt;&lt;span class=&quot;pill green&quot;&gt;최고 val 0.885 · lr 0.242 · λ 4.8e-6&lt;/span&gt;&lt;span class=&quot;pill red&quot;&gt;lr 3e-4 ~ 6e-4 → val 0.08 ~ 0.14&lt;/span&gt;&lt;span class=&quot;pill amber&quot;&gt;다음: lr 10^U(−1.3, −0.2)&lt;/span&gt;&lt;/div&gt;

  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;grid&quot;&gt;
    &lt;div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;train / validation / test 분리 (노트북 7-1)&lt;/h2&gt;
        &lt;svg id=&quot;sp&quot; viewBox=&quot;0 0 520 150&quot; role=&quot;img&quot; aria-label=&quot;train validation test 분리 그림&quot;&gt;&lt;/svg&gt;
      &lt;/div&gt;
      &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;그리드 vs 랜덤 — 성능이 가로축(중요)에만 달린 장난감&lt;/h2&gt;
        &lt;div class=&quot;two gr&quot;&gt;&lt;div&gt;&lt;h3 id=&quot;gt&quot;&gt;그리드&lt;/h3&gt;&lt;canvas id=&quot;cg&quot;&gt;&lt;/canvas&gt;&lt;/div&gt;&lt;div&gt;&lt;h3 id=&quot;rt&quot;&gt;랜덤&lt;/h3&gt;&lt;canvas id=&quot;cr&quot;&gt;&lt;/canvas&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;lab&quot;&gt;시도 횟수&lt;/span&gt;&lt;span class=&quot;seg&quot; id=&quot;ns&quot;&gt;&lt;/span&gt;&lt;button type=&quot;button&quot; id=&quot;bRe&quot;&gt;랜덤 다시 뽑기&lt;/button&gt;&lt;/div&gt;
        &lt;div class=&quot;legend&quot;&gt;&lt;span&gt;배경 밝을수록 성능 높음 (세로축은 무관) · 아래 눈금 = 중요한 축에서 실제로 본 값&lt;/span&gt;&lt;/div&gt;

<script>
const ids = [...document.querySelectorAll('nav button')].map(b => b.dataset.id);
function fit(fr) {
  try {
    const d = fr.contentDocument; if (!d || !d.body) return;
    fr.style.height = Math.max(600, d.documentElement.scrollHeight) + 'px';
  } catch (e) {}
}
function show(id, push) {
  if (!ids.includes(id)) id = ids[0];
  document.querySelectorAll('section.lesson').forEach(s => s.classList.toggle('active', s.id === id));
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-current', b.dataset.id === id ? 'true' : 'false'));
  const sec = document.getElementById(id);
  document.title = sec.dataset.title + ' — Neural Network Day 4';
  const fr = sec.querySelector('iframe');
  fr.loading = 'eager'; fit(fr);
  if (push) history.replaceState(null, '', '#' + id);
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('section.lesson iframe').forEach(fr => {
  fr.addEventListener('load', () => {
    fit(fr);
    try {
      new ResizeObserver(() => fit(fr)).observe(fr.contentDocument.body);
      fr.contentDocument.addEventListener('keydown', key);   // iframe 안에서도 ← → 동작
    } catch (e) {}
  });
});
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.id, true));
function key(e) {
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const cur = ids.indexOf(location.hash.slice(1) || ids[0]);
  if (e.key === 'ArrowRight' && cur < ids.length - 1) show(ids[cur + 1], true);
  if (e.key === 'ArrowLeft' && cur > 0) show(ids[cur - 1], true);
}
document.addEventListener('keydown', key);
window.addEventListener('resize', () => document.querySelectorAll('section.lesson.active iframe').forEach(fit));
window.addEventListener('hashchange', () => show(location.hash.slice(1), false));   // 주소창에서 #d4-N 을 바꿔도 이동
show(location.hash.slice(1), false);
</script>
