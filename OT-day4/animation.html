&lt;script&gt;
const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];
const RM=window.matchMedia&amp;&amp;window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,RM?Math.min(ms,80):ms));
let busy=false, timer=null;
function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}
function setCode(h){$(&#x27;#code&#x27;).innerHTML=h;}
function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const g=c.getContext(&#x27;2d&#x27;);g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}
function initPresets(P,stop){$(&#x27;#presets&#x27;).innerHTML=P.map(p=&gt;`&lt;button type=&quot;button&quot;&gt;${p.n}&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}
const esc=s=&gt;String(s).replace(/&amp;/g,&#x27;&amp;amp;&#x27;).replace(/&lt;/g,&#x27;&amp;lt;&#x27;).replace(/&gt;/g,&#x27;&amp;gt;&#x27;);
const fmt=n=&gt;n.toLocaleString(&#x27;en-US&#x27;);
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
window.__d4={};
let guess=null, predOpts=[];
function initPredict(q,opts){predOpts=opts;guess=null;
  $(&#x27;#pred&#x27;).innerHTML=`&lt;div class=&quot;steps3&quot;&gt;&lt;span class=&quot;on&quot; id=&quot;st1&quot;&gt;① 예측&lt;/span&gt;&lt;span id=&quot;st2&quot;&gt;② 실행&lt;/span&gt;&lt;span id=&quot;st3&quot;&gt;③ 설명&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;pq&quot;&gt;${q}&lt;/div&gt;&lt;div class=&quot;seg&quot; id=&quot;predOpts&quot;&gt;${opts.map((o,i)=&gt;`&lt;button type=&quot;button&quot; data-i=&quot;${i}&quot;&gt;${o}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;pv&quot; id=&quot;predV&quot;&gt;먼저 하나를 고른 뒤 실행 ▶ 하세요. (안 골라도 실행은 됩니다)&lt;/div&gt;`;
  $$(&#x27;#predOpts button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{guess=+b.dataset.i;$$(&#x27;#predOpts button&#x27;).forEach(x=&gt;{x.classList.toggle(&#x27;sel&#x27;,x===b);x.classList.remove(&#x27;ok&#x27;,&#x27;bad&#x27;);});
    const v=$(&#x27;#predV&#x27;);v.className=&#x27;pv&#x27;;v.textContent=&#x27;예측: &#x27;+opts[guess]+&#x27; → 이제 실행해서 확인&#x27;;phase(1);});}
function phase(k){[&#x27;#st1&#x27;,&#x27;#st2&#x27;,&#x27;#st3&#x27;].forEach((s,i)=&gt;{const e=$(s);if(e)e.classList.toggle(&#x27;on&#x27;,i===k);});}
function judge(ans,why){$$(&#x27;#predOpts button&#x27;).forEach((b,i)=&gt;{b.classList.toggle(&#x27;ok&#x27;,i===ans);b.classList.toggle(&#x27;bad&#x27;,i===guess&amp;&amp;i!==ans);});
  const v=$(&#x27;#predV&#x27;);v.className=&#x27;pv &#x27;+(guess===null?&#x27;&#x27;:guess===ans?&#x27;ok&#x27;:&#x27;bad&#x27;);
  v.innerHTML=(guess===null?&#x27;정답: &#x27;:guess===ans?&#x27;✅ 예측 적중 — &#x27;:&#x27;❌ 예측과 다름 — &#x27;)+&#x27;&lt;b&gt;&#x27;+predOpts[ans]+&#x27;&lt;/b&gt;. &#x27;+why;phase(2);window.__d4.judged=(window.__d4.judged||0)+1;}
function ready(){$(&#x27;#explain&#x27;).innerHTML=&#x27;&lt;p&gt;&lt;b class=&quot;amber&quot;&gt;① 예측&lt;/b&gt;을 먼저 고르고 → &lt;b class=&quot;teal&quot;&gt;② 프리셋 또는 ▶ 버튼&lt;/b&gt;으로 실행하면 → &lt;b class=&quot;green&quot;&gt;③ 여기에 설명&lt;/b&gt;이 나옵니다.&lt;/p&gt;&#x27;;setStatus(&#x27;info&#x27;,&#x27;먼저 위에서 예측을 하나 고른 뒤, 프리셋이나 ▶ 버튼을 누르세요.&#x27;);}
function pct(a,q){const s=[...a].sort((x,y)=&gt;x-y);const h=(s.length-1)*q/100,lo=Math.floor(h),hi=Math.ceil(h);return s[lo]+(s[hi]-s[lo])*(h-lo);}
function rng(seed){let t=seed&gt;&gt;&gt;0;return()=&gt;{t+=0x6D2B79F5;let r=Math.imul(t^t&gt;&gt;&gt;15,1|t);r^=r+Math.imul(r^r&gt;&gt;&gt;7,61|r);return((r^r&gt;&gt;&gt;14)&gt;&gt;&gt;0)/4294967296;};}


const N=[[&#x27;Conv_31&#x27;,&#x27;c&#x27;,&#x27;1×1 확장&#x27;],[&#x27;HardSwish_32&#x27;,&#x27;a&#x27;,&#x27;&#x27;],[&#x27;Conv_33&#x27;,&#x27;c&#x27;,&#x27;3×3 depthwise&#x27;],[&#x27;HardSwish_34&#x27;,&#x27;a&#x27;,&#x27;&#x27;],[&#x27;GlobalAveragePool_35&#x27;,&#x27;p&#x27;,&#x27;SE&#x27;],[&#x27;Conv_36&#x27;,&#x27;c&#x27;,&#x27;SE fc1&#x27;],[&#x27;Relu_37&#x27;,&#x27;a&#x27;,&#x27;&#x27;],[&#x27;Conv_38&#x27;,&#x27;c&#x27;,&#x27;SE fc2&#x27;],[&#x27;HardSigmoid_39&#x27;,&#x27;a&#x27;,&#x27;&#x27;],[&#x27;Mul_40&#x27;,&#x27;x&#x27;,&#x27;SE 곱&#x27;],[&#x27;Conv_41&#x27;,&#x27;c&#x27;,&#x27;1×1 투영&#x27;],[&#x27;Add_42&#x27;,&#x27;x&#x27;,&#x27;잔차 연결&#x27;]];
const RULES=[{k:&#x27;act&#x27;,t:&#x27;Conv + 활성 함수 (HardSwish · Relu)&#x27;,g:[[0,1],[2,3],[5,6]]},{k:&#x27;add&#x27;,t:&#x27;Conv + Add (잔차 연결)&#x27;,g:[[10,11]]},{k:&#x27;pwn&#x27;,t:&#x27;점별 연산 묶기 PWN(HardSigmoid, Mul)&#x27;,g:[[8,9]]},{k:&#x27;ref&#x27;,t:&#x27;입력 데이터 배치 변환 Reformat 레이어 추가&#x27;,g:[]}];
let on={act:true,add:true,pwn:true,ref:false}, fused=false, hotN=[], newL=-1;
function groups(){const used=new Set(),G=[];RULES.forEach(r=&gt;{if(!on[r.k])return;r.g.forEach(g=&gt;{G.push(g);g.forEach(i=&gt;used.add(i));});});
  const L=[];let i=0;while(i&lt;N.length){const g=G.find(g=&gt;g[0]===i);if(g){L.push(g);i=g[g.length-1]+1;}else{L.push([i]);i++;}}return L;}
function lname(g){if(g.length===1)return N[g[0]][0];const names=g.map(i=&gt;N[i][0]);return (on.pwn&amp;&amp;g[0]===8)?`PWN(${names.join(&#x27;, &#x27;)})`:names.join(&#x27; + &#x27;);}
function layers(){if(!fused)return [];const L=groups().map(g=&gt;({n:lname(g),f:g.length&gt;1,g}));if(on.ref)L.unshift({n:&#x27;Reformatting CopyNode for Input Tensor 0 to Conv_31&#x27;,r:1,g:[]});return L;}
function drawRules(){$(&#x27;#rules&#x27;).innerHTML=RULES.map(r=&gt;`&lt;label&gt;&lt;input type=&quot;checkbox&quot; data-k=&quot;${r.k}&quot; ${on[r.k]?&#x27;checked&#x27;:&#x27;&#x27;}&gt; ${r.t}&lt;/label&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#rules input&#x27;).forEach(c=&gt;c.onchange=e=&gt;{if(busy){e.target.checked=on[c.dataset.k];return;}on[c.dataset.k]=e.target.checked;newL=-1;draw();});}
function draw(){const L=layers();const inF=new Set();L.forEach(l=&gt;{if(l.f)l.g.forEach(i=&gt;inF.add(i));});
  $(&#x27;#nodes&#x27;).innerHTML=N.map((n,i)=&gt;`&lt;div class=&quot;nd ${n[1]} ${hotN.includes(i)?&#x27;hot&#x27;:&#x27;&#x27;} ${fused&amp;&amp;inF.has(i)?&#x27;gone&#x27;:&#x27;&#x27;}&quot;&gt;${n[0]}${n[2]?` &lt;span class=&quot;dim&quot;&gt;· ${n[2]}&lt;/span&gt;`:&#x27;&#x27;}&lt;/div&gt;`).join(&#x27;&#x27;);
  $(&#x27;#lays&#x27;).innerHTML=fused?L.map((l,i)=&gt;`&lt;div class=&quot;ly ${l.f?&#x27;f&#x27;:&#x27;&#x27;} ${l.r?&#x27;r&#x27;:&#x27;&#x27;} ${i===newL?&#x27;new&#x27;:&#x27;&#x27;}&quot;&gt;${esc(l.n)}&lt;/div&gt;`).join(&#x27;&#x27;):&#x27;&lt;div class=&quot;dim&quot; style=&quot;font-size:12.5px&quot;&gt;아직 빌드 전 — 파싱 직후 레이어 수는 노드 수와 비슷&lt;/div&gt;&#x27;;
  const nl=fused?L.length:N.length;
  $(&#x27;#cnt&#x27;).innerHTML=`&lt;div&gt;ONNX 노드&lt;b&gt;${N.length}&lt;/b&gt;이 블록&lt;/div&gt;&lt;div class=&quot;am&quot;&gt;엔진 레이어&lt;b&gt;${nl}&lt;/b&gt;${fused?&#x27;합친 뒤 (예시)&#x27;:&#x27;파싱 직후 ≈&#x27;}&lt;/div&gt;&lt;div&gt;레이어 사이 메모리 왕복&lt;b&gt;${nl-1}&lt;/b&gt;중간 결과 쓰기 · 읽기&lt;/div&gt;`;
  code(L);}
function code(L){const names=L.map(l=&gt;l.n);const fz=names.filter(n=&gt;n.includes(&#x27; + &#x27;));const parts=fz.map(n=&gt;n.split(&#x27; + &#x27;).length);const ref=names.filter(n=&gt;n.includes(&#x27;Reformat&#x27;));
  const i=parts.length?parts.indexOf(Math.max(...parts)):-1;
  setCode(`&lt;span class=&quot;c&quot;&gt;# 7-1  엔진 인스펙터 → 레이어 이름&lt;/span&gt;
insp = run32.engine.create_engine_inspector()
info = json.loads(insp.get_engine_information(trt.LayerInformationFormat.&lt;span class=&quot;hl&quot;&gt;JSON&lt;/span&gt;))
names = [l[&quot;Name&quot;] if isinstance(l, dict) else l for l in info[&quot;Layers&quot;]]
print(f&quot;ONNX 노드 {n_onnx}개 → 엔진 레이어 {len(names)}개&quot;)
&lt;span class=&quot;b&quot;&gt;# mnv3s 전체: ONNX 노드 127개 → 엔진 레이어 ?개 (T4 에서 확인)&lt;/span&gt;

&lt;span class=&quot;c&quot;&gt;# 7-2  합쳐진 레이어 세기 — 위 블록 (예시) 에 적용하면&lt;/span&gt;
fused = [n for n in names if &quot; + &quot; in n]
parts = [len(n.split(&quot; + &quot;)) for n in fused]
reformat = [n for n in names if &quot;Reformat&quot; in n]
i = int(np.&lt;span class=&quot;hl&quot;&gt;argmax&lt;/span&gt;(parts))
&lt;span class=&quot;b&quot;&gt;# → fused ${fz.length}개 · ONNX 노드 ${parts.reduce((a,b)=&gt;a+b,0)}개 포함 · Reformat ${ref.length}개${i&gt;=0?`
# → 가장 많이 합친: &quot;${esc(fz[i])}&quot; (${parts[i]}개)`:&#x27;&#x27;}&lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;# PWN(...) 은 &quot; + &quot; 가 없어 이 방법으로는 안 세짐 → &#x27;대략&#x27; 으로 보기&lt;/span&gt;`);}
async function fuse(){phase(1);fused=false;newL=-1;hotN=[];draw();await sleep(300);fused=true;
  const L=layers();$(&#x27;#lays&#x27;).innerHTML=&#x27;&#x27;;
  for(let i=0;i&lt;L.length;i++){hotN=L[i].g;newL=i;const keep=L.slice(0,i+1);
    const inF=new Set();keep.forEach(l=&gt;{if(l.f)l.g.forEach(j=&gt;inF.add(j));});
    $(&#x27;#nodes&#x27;).innerHTML=N.map((n,j)=&gt;`&lt;div class=&quot;nd ${n[1]} ${hotN.includes(j)?&#x27;hot&#x27;:&#x27;&#x27;} ${inF.has(j)&amp;&amp;!hotN.includes(j)?&#x27;gone&#x27;:&#x27;&#x27;}&quot;&gt;${n[0]}${n[2]?` &lt;span class=&quot;dim&quot;&gt;· ${n[2]}&lt;/span&gt;`:&#x27;&#x27;}&lt;/div&gt;`).join(&#x27;&#x27;);

    if(L[i].f)setStatus(&#x27;info&#x27;,`합치기: ${L[i].n}\n→ 중간 결과를 GPU 메모리에 쓰지 않고 한 커널 안에서 이어서 계산`);

    await sleep(L[i].f||L[i].r?900:300);}
  hotN=[];newL=-1;draw();const n=L.length;setStatus(&#x27;ok&#x27;,`이 블록: ONNX 노드 ${N.length}개 → 엔진 레이어 ${n}개 (예시)\n레이어 사이 메모리 왕복 ${N.length-1} → ${n-1}`);window.__d4.layers=n;}

const P=[
 {n:&#x27;① 합치기 전&#x27;,ex:&#x27;&lt;p&gt;파싱 직후 (4-1) 의 레이어 수는 ONNX 노드 수와 비슷합니다. 노드마다 결과를 GPU 메모리에 &lt;b&gt;쓰고&lt;/b&gt; 다음 노드가 다시 &lt;b&gt;읽습니다&lt;/b&gt; — 이 블록만 해도 왕복 11번.&lt;/p&gt;&lt;p&gt;mnv3s 전체 ONNX 노드는 &lt;b&gt;127개&lt;/b&gt;. 합치기는 ⑥ 빌드 때 일어납니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{fused=false;setRules({act:true,add:true,pwn:true});draw();setStatus(&#x27;info&#x27;,`합치기 전: 노드 ${N.length}개 = 레이어 ${N.length}개 → 메모리 왕복 ${N.length-1}번`);}},
 {n:&#x27;② Conv + 활성 합치기&#x27;,ex:&#x27;&lt;p&gt;Conv 바로 뒤의 HardSwish · Relu 는 Conv 커널이 결과를 쓰기 직전에 함께 계산할 수 있습니다 → 엔진 레이어 하나 &lt;b class=&quot;amber&quot;&gt;&quot;Conv_31 + HardSwish_32&quot;&lt;/b&gt;. HardSwish 가 사라진 게 아니라 &lt;b&gt;Conv 안으로 들어간&lt;/b&gt; 것.&lt;/p&gt;&#x27;,
  run:async()=&gt;{setRules({act:true});await fuse();judge(1,&#x27;Conv + HardSwish 는 엔진에서 레이어 하나로 합쳐지고, 이름도 &quot;A + B&quot; 로 이어 붙습니다.&#x27;);}},
 {n:&#x27;③ 규칙 모두&#x27;,ex:&#x27;&lt;p&gt;Conv + 활성, Conv + Add (잔차), 점별 연산 묶기 PWN(...) 까지 → 레이어 수와 메모리 왕복이 크게 줄었습니다.&lt;/p&gt;&lt;p&gt;Day 3 4교시 ORT 의 &lt;b&gt;FusedConv&lt;/b&gt; 와 같은 생각이지만, TensorRT 는 여기에 더해 레이어마다 &lt;b&gt;커널을 직접 재 보고&lt;/b&gt; 고릅니다 (2교시).&lt;/p&gt;&#x27;,
  run:async()=&gt;{setRules({act:true,add:true,pwn:true});await fuse();}},
 {n:&#x27;④ Reformat · 이름으로 세기&#x27;,ex:&#x27;&lt;p&gt;&lt;b class=&quot;purple&quot;&gt;Reformatting CopyNode&lt;/b&gt; 는 데이터 배치 (메모리 레이아웃) 를 바꾸는 레이어 — 합치기와 반대로 레이어가 &lt;b&gt;늘어나기도&lt;/b&gt; 합니다.&lt;/p&gt;&lt;p&gt;7-2 처럼 이름의 &lt;code&gt;&quot; + &quot;&lt;/code&gt; 로 나눈 조각 수를 세면 합쳐진 노드 수를 대략 알 수 있습니다. &lt;code&gt;PWN(...)&lt;/code&gt; 처럼 괄호로 묶인 이름도 있어 버전마다 다르니 &lt;b&gt;&quot;대략&quot;&lt;/b&gt; 으로 봅니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{setRules({act:true,add:true,pwn:true,ref:true});await fuse();for(let k=0;k&lt;3;k++){$(&#x27;#w&#x27;+k).classList.add(&#x27;hot&#x27;);await sleep(500);}}},
];
initPredict(&#x27;ONNX 의 &lt;code&gt;Conv → HardSwish&lt;/code&gt; 두 노드는 TensorRT 엔진에서 어떻게 될까?&#x27;,[&#x27;그대로 레이어 2개&#x27;,&#x27;레이어 하나 &quot;Conv + HardSwish&quot;&#x27;,&#x27;HardSwish 는 지워진다&#x27;]);

&lt;div class=&quot;app&quot;&gt;

&lt;h1&gt;미니 프로젝트 — 실행기 4가지 성능표&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;같은 &lt;code&gt;mnv3s_b1.onnx&lt;/code&gt; 를 &lt;b&gt;ORT CPU · ORT CUDA · TensorRT FP32 · TensorRT FP16&lt;/b&gt; 으로 돌려 &lt;b style=&quot;color:var(--amber)&quot;&gt;속도 + 정확도&lt;/b&gt;를 한 표로 만들고, p95 가 가장 작은 실행기를 고른 뒤 &lt;b&gt;정확도까지 확인&lt;/b&gt;해 추천합니다. 시나리오 B 에서는 FP16 정확도가 떨어졌다고 가정해 결론이 어떻게 바뀌는지 봅니다.&lt;/p&gt;

<script>
const ids = [...document.querySelectorAll('nav button')].map(b => b.dataset.id);
function fit(fr) {
  try {
    const d = fr.contentDocument; if (!d || !d.body) return;
    fr.style.height = Math.max(600, d.documentElement.scrollHeight) + 'px';
  } catch (e) {}
}
function show(id, push) {
  if (!ids.includes(id)) id = ids[0];
  document.querySelectorAll('section.lesson').forEach(s => s.classList.toggle('active', s.id === id));
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-current', b.dataset.id === id ? 'true' : 'false'));
  const sec = document.getElementById(id);
  document.title = sec.dataset.title + ' — ONNX·TensorRT Day 4';
  const fr = sec.querySelector('iframe');
  fr.loading = 'eager'; fit(fr);
  if (push) history.replaceState(null, '', '#' + id);
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('section.lesson iframe').forEach(fr => {
  fr.addEventListener('load', () => {
    fit(fr);
    try {
      new ResizeObserver(() => fit(fr)).observe(fr.contentDocument.body);
      fr.contentDocument.addEventListener('keydown', key);   // iframe 안에서도 ← → 동작
    } catch (e) {}
  });
});
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.id, true));
function key(e) {
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const cur = ids.indexOf(location.hash.slice(1) || ids[0]);
  if (e.key === 'ArrowRight' && cur < ids.length - 1) show(ids[cur + 1], true);
  if (e.key === 'ArrowLeft' && cur > 0) show(ids[cur - 1], true);
}
document.addEventListener('keydown', key);
window.addEventListener('resize', () => document.querySelectorAll('section.lesson.active iframe').forEach(fit));
window.addEventListener('hashchange', () => show(location.hash.slice(1), false));   // 주소창에서 #d4-N 을 바꿔도 이동
show(location.hash.slice(1), false);
</script>
