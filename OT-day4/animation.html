  <h2>1~8교시 시뮬레이션</h2>
  <div class="list">
<button data-id="d4-1" aria-current="false"><span class="p">1교시</span><span class="no">D4-1</span><span class="tt">설계도 · 기계 · 완성품</span><span class="d">ONNX = 설계도 · ONNX Runtime = 읽어서 바로 돌리는 기계 · TensorRT 엔진 = 이 GPU 전용 완성품 · 엔진은 같은 GPU 세대 (sm_75 …) + 같은 TensorRT 버전에서만 → 배포할 것은 .onnx</span></button>
<button data-id="d4-2" aria-current="false"><span class="p">2교시</span><span class="no">D4-2</span><span class="tt">엔진 빌드 단계</span><span class="d">polygraphy convert = ① 파싱 → ② 최적화 (레이어 합치기) → ③ 커널 고르기 (후보를 GPU 에서 직접 재 봄 — 오래 걸림) → ④ 저장 · 로그는 [I] · [W] · [E] · 빌드 시간</span></button>
<button data-id="d4-3" aria-current="false"><span class="p">3교시</span><span class="no">D4-3</span><span class="tt">비교 · atol · rtol</span><span class="d">polygraphy run --onnxrt --trt — 같은 입력을 두 실행기에 → 원소마다 |a − b| ≤ atol + rtol · |b| → 모두 만족하면 PASSED · FP32 는 엄격하게 · FP16 은 1e-3 이면 흔히 FAILED</span></button>
<button data-id="d4-4" aria-current="false"><span class="p">4교시</span><span class="no">D4-4</span><span class="tt">빌드 여섯 단계</span><span class="d">① Logger → ② Builder → ③ Network → ④ OnnxParser.parse_from_file → ⑤ Config (WORKSPACE · DETAILED · FP16) → ⑥ build_serialized_network → 파일 · build_engine(onnx, engine, fp16=False)</span></button>
<button data-id="d4-5" aria-current="false"><span class="p">5교시</span><span class="no">D4-5</span><span class="tt">엔진 실행 — 주소 알려 주기</span><span class="d">① Runtime → 엔진 ② Context ③ get_tensor_name · shape ④ CUDA 텐서 버퍼 ⑤ set_tensor_address · execute_async_v3 (비동기) · synchronize ⑥ GPU → CPU · trt_runner = 버퍼는 한 번만</span></button>
<button data-id="d4-6" aria-current="false"><span class="p">6교시</span><span class="no">D4-6</span><span class="tt">FP32 vs FP16</span><span class="d">FP16 = 부호 1 · 지수 5 · 가수 10 비트 · 최대 65504 · eps 2⁻¹⁰ ≈ 0.000977 (유효숫자 약 3자리) · np.float16(0.1) = 0.0999755859375 · 1000.3 → 1000.5 · 70000 → inf · FP32 eps 1.19e-07</span></button>
<button data-id="d4-7" aria-current="false"><span class="p">7교시</span><span class="no">D4-7</span><span class="tt">레이어 합치기</span><span class="d">ONNX 노드 여러 개 → 엔진 레이어 하나 &#x27;A + B&#x27; (Conv + HardSwish · Conv + Add · PWN(...)) · 레이어 사이 GPU 메모리 왕복 ↓ · mnv3s ONNX 노드 127개 · 이름의 &#x27; + &#x27; 로 세기 · Reformat 레이어</span></button>
<button data-id="d4-8" aria-current="false"><span class="p">8교시</span><span class="no">D4-8</span><span class="tt">실행기 4가지 성능표</span><span class="d">ORT CPU · ORT CUDA · TRT FP32 · TRT FP16 → provider · precision · mean · p95 · fps · max_diff · top1_same · speedup · p95 최소 = 가장 빠름 → 정확도 (top-1 · MNIST) 확인 후 추천 · ot_baseline.csv</span></button>

&lt;body&gt;
&lt;div class=&quot;app&quot;&gt;

&lt;h1&gt;설계도 · 기계 · 완성품 — ONNX · ONNX Runtime · TensorRT 엔진&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;같은 &lt;code&gt;.onnx&lt;/code&gt; 를 두 가지로 실행할 수 있습니다. &lt;b style=&quot;color:var(--teal)&quot;&gt;ONNX Runtime&lt;/b&gt; 은 설계도를 읽어 &lt;b&gt;바로&lt;/b&gt; 돌리는 기계, &lt;b style=&quot;color:var(--amber)&quot;&gt;TensorRT&lt;/b&gt; 는 설계도로 &lt;b&gt;이 GPU 전용 완성품&lt;/b&gt; (&lt;code&gt;.engine&lt;/code&gt;) 을 미리 조립해 둡니다. 아래에서 T4 에서 만든 엔진을 다른 장치로 가져가 보세요.&lt;/p&gt;
&lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill blue&quot;&gt;.onnx = 설계도 (어디서나)&lt;/span&gt;&lt;span class=&quot;pill teal&quot;&gt;ORT = 세션마다 최적화&lt;/span&gt;&lt;span class=&quot;pill amber&quot;&gt;.engine = 빌드 한 번 · 이 GPU 전용&lt;/span&gt;&lt;span class=&quot;pill green&quot;&gt;T4 = sm_75 · Orin = sm_87&lt;/span&gt;&lt;span class=&quot;pill purple&quot;&gt;TensorRT 10.16.1.11&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;panel pred&quot;&gt;&lt;h2&gt;먼저 예측 (실행 전에)&lt;/h2&gt;&lt;div id=&quot;pred&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;세 가지 — 카드를 누르면 비교표의 해당 칸이 켜집니다&lt;/h2&gt;
  &lt;div class=&quot;trio&quot; id=&quot;trio&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;scroll&quot; style=&quot;margin-top:10px&quot;&gt;&lt;table class=&quot;tt cmpT&quot; id=&quot;cmpT&quot;&gt;&lt;/table&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;
  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;엔진 들고 가기 — T4 에서 만든 mnv3s_fp32.engine&lt;/h2&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;lab&quot;&gt;가져갈 장치&lt;/span&gt;&lt;div class=&quot;seg&quot; id=&quot;devSel&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;lab&quot;&gt;그 장치의 TensorRT&lt;/span&gt;&lt;div class=&quot;seg&quot; id=&quot;verSel&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;row ctl&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;run&quot; id=&quot;bRun&quot;&gt;엔진 복사 → 실행 ▶&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;bOnnx&quot;&gt;대신 .onnx 를 가져가 다시 빌드 ▶&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;ship&quot;&gt;
      &lt;div class=&quot;dev&quot; id=&quot;src&quot;&gt;&lt;h3&gt;만든 곳 (Colab)&lt;/h3&gt;&lt;span class=&quot;big&quot;&gt;Tesla T4&lt;/span&gt;&lt;br&gt;compute capability 7.5 → &lt;b&gt;sm_75&lt;/b&gt;&lt;br&gt;TensorRT 10.16.1.11&lt;/div&gt;
      &lt;div class=&quot;mid&quot;&gt;&lt;span class=&quot;ln&quot;&gt;&lt;/span&gt;&lt;span class=&quot;pk&quot; id=&quot;pk&quot;&gt;📦&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;dev&quot; id=&quot;dst&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;chk2&quot; id=&quot;chk&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;note&quot;&gt;기본 빌드 기준입니다. (TensorRT 에는 하드웨어 · 버전 호환을 넓히는 고급 빌드 옵션이 따로 있지만, 오늘은 다루지 않습니다.)&lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;Python (노트북 1-1 · 설치 확인)&lt;/h2&gt;&lt;div class=&quot;code&quot; id=&quot;code&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;상태&lt;/h2&gt;&lt;div class=&quot;status info&quot; id=&quot;status&quot;&gt;프리셋을 누르세요.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;panel explain&quot; id=&quot;explain&quot;&gt;&lt;/div&gt;

&lt;/div&gt;
&lt;script&gt;
const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];
const RM=window.matchMedia&amp;&amp;window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,RM?Math.min(ms,80):ms));
let busy=false, timer=null;
function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}
function setCode(h){$(&#x27;#code&#x27;).innerHTML=h;}
function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const g=c.getContext(&#x27;2d&#x27;);g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}
function initPresets(P,stop){$(&#x27;#presets&#x27;).innerHTML=P.map(p=&gt;`&lt;button type=&quot;button&quot;&gt;${p.n}&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}
const esc=s=&gt;String(s).replace(/&amp;/g,&#x27;&amp;amp;&#x27;).replace(/&lt;/g,&#x27;&amp;lt;&#x27;).replace(/&gt;/g,&#x27;&amp;gt;&#x27;);
const fmt=n=&gt;n.toLocaleString(&#x27;en-US&#x27;);
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
window.__d4={};
let guess=null, predOpts=[];
function initPredict(q,opts){predOpts=opts;guess=null;
  $(&#x27;#pred&#x27;).innerHTML=`&lt;div class=&quot;steps3&quot;&gt;&lt;span class=&quot;on&quot; id=&quot;st1&quot;&gt;① 예측&lt;/span&gt;&lt;span id=&quot;st2&quot;&gt;② 실행&lt;/span&gt;&lt;span id=&quot;st3&quot;&gt;③ 설명&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;pq&quot;&gt;${q}&lt;/div&gt;&lt;div class=&quot;seg&quot; id=&quot;predOpts&quot;&gt;${opts.map((o,i)=&gt;`&lt;button type=&quot;button&quot; data-i=&quot;${i}&quot;&gt;${o}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;pv&quot; id=&quot;predV&quot;&gt;먼저 하나를 고른 뒤 실행 ▶ 하세요. (안 골라도 실행은 됩니다)&lt;/div&gt;`;
  $$(&#x27;#predOpts button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{guess=+b.dataset.i;$$(&#x27;#predOpts button&#x27;).forEach(x=&gt;{x.classList.toggle(&#x27;sel&#x27;,x===b);x.classList.remove(&#x27;ok&#x27;,&#x27;bad&#x27;);});
    const v=$(&#x27;#predV&#x27;);v.className=&#x27;pv&#x27;;v.textContent=&#x27;예측: &#x27;+opts[guess]+&#x27; → 이제 실행해서 확인&#x27;;phase(1);});}
function phase(k){[&#x27;#st1&#x27;,&#x27;#st2&#x27;,&#x27;#st3&#x27;].forEach((s,i)=&gt;{const e=$(s);if(e)e.classList.toggle(&#x27;on&#x27;,i===k);});}
function judge(ans,why){$$(&#x27;#predOpts button&#x27;).forEach((b,i)=&gt;{b.classList.toggle(&#x27;ok&#x27;,i===ans);b.classList.toggle(&#x27;bad&#x27;,i===guess&amp;&amp;i!==ans);});
  const v=$(&#x27;#predV&#x27;);v.className=&#x27;pv &#x27;+(guess===null?&#x27;&#x27;:guess===ans?&#x27;ok&#x27;:&#x27;bad&#x27;);
  v.innerHTML=(guess===null?&#x27;정답: &#x27;:guess===ans?&#x27;✅ 예측 적중 — &#x27;:&#x27;❌ 예측과 다름 — &#x27;)+&#x27;&lt;b&gt;&#x27;+predOpts[ans]+&#x27;&lt;/b&gt;. &#x27;+why;phase(2);window.__d4.judged=(window.__d4.judged||0)+1;}
function ready(){$(&#x27;#explain&#x27;).innerHTML=&#x27;&lt;p&gt;&lt;b class=&quot;amber&quot;&gt;① 예측&lt;/b&gt;을 먼저 고르고 → &lt;b class=&quot;teal&quot;&gt;② 프리셋 또는 ▶ 버튼&lt;/b&gt;으로 실행하면 → &lt;b class=&quot;green&quot;&gt;③ 여기에 설명&lt;/b&gt;이 나옵니다.&lt;/p&gt;&#x27;;setStatus(&#x27;info&#x27;,&#x27;먼저 위에서 예측을 하나 고른 뒤, 프리셋이나 ▶ 버튼을 누르세요.&#x27;);}
function pct(a,q){const s=[...a].sort((x,y)=&gt;x-y);const h=(s.length-1)*q/100,lo=Math.floor(h),hi=Math.ceil(h);return s[lo]+(s[hi]-s[lo])*(h-lo);}
function rng(seed){let t=seed&gt;&gt;&gt;0;return()=&gt;{t+=0x6D2B79F5;let r=Math.imul(t^t&gt;&gt;&gt;15,1|t);r^=r+Math.imul(r^r&gt;&gt;&gt;7,61|r);return((r^r&gt;&gt;&gt;14)&gt;&gt;&gt;0)/4294967296;};}


const CARDS=[{ic:&#x27;📐&#x27;,t:&#x27;ONNX&#x27;,f:&#x27;.onnx&#x27;,d:&#x27;설계도 — 어떤 연산을 어떤 순서로. 어디서나 읽을 수 있다&#x27;},
             {ic:&#x27;⚙️&#x27;,t:&#x27;ONNX Runtime&#x27;,f:&#x27;InferenceSession&#x27;,d:&#x27;설계도를 읽어 바로 돌리는 기계 (Day 3)&#x27;},
             {ic:&#x27;🏎️&#x27;,t:&#x27;TensorRT 엔진&#x27;,f:&#x27;.engine&#x27;,d:&#x27;이 GPU 에 맞춰 미리 조립한 완성품 (오늘)&#x27;}];
const ROWS=[[&#x27;입력&#x27;,&#x27;&lt;code&gt;.onnx&lt;/code&gt;&#x27;,&#x27;&lt;code&gt;.onnx&lt;/code&gt;&#x27;],
            [&#x27;언제 최적화?&#x27;,&#x27;세션 만들 때마다 (1초 이내)&#x27;,&#x27;빌드할 때 한 번 (수십 초~분) → &lt;code&gt;.engine&lt;/code&gt; 저장&#x27;],
            [&#x27;어떻게?&#x27;,&#x27;정해진 규칙으로 노드 합치기&#x27;,&#x27;규칙 + 이 GPU 에서 커널 후보를 직접 재 보고 가장 빠른 것&#x27;],
            [&#x27;어디서?&#x27;,&#x27;CPU · GPU · 여러 장치&#x27;,&#x27;NVIDIA GPU 전용 (Jetson 포함)&#x27;],
            [&#x27;결과 파일&#x27;,&#x27;없음 (메모리 안)&#x27;,&#x27;&lt;code&gt;.engine&lt;/code&gt; — 만든 GPU 종류 · TensorRT 버전에서만&#x27;]];
const DEV=[{k:&#x27;T4&#x27;,n:&#x27;Tesla T4 (다른 Colab 세션)&#x27;,cc:&#x27;7.5&#x27;,sm:&#x27;sm_75&#x27;},{k:&#x27;Orin&#x27;,n:&#x27;Jetson Orin&#x27;,cc:&#x27;8.7&#x27;,sm:&#x27;sm_87&#x27;},{k:&#x27;A100&#x27;,n:&#x27;A100 (Colab 고급 GPU)&#x27;,cc:&#x27;8.0&#x27;,sm:&#x27;sm_80&#x27;}];
const VER=[{k:&#x27;same&#x27;,n:&#x27;10.16.1.11 (같음)&#x27;},{k:&#x27;other&#x27;,n:&#x27;다른 10.x 버전&#x27;},{k:&#x27;11&#x27;,n:&#x27;11.x&#x27;}];
let card=-1, dv=0, vr=0, shipped=0;
function drawCards(){$(&#x27;#trio&#x27;).innerHTML=CARDS.map((c,i)=&gt;`&lt;button type=&quot;button&quot; class=&quot;card c${i} ${i===card?&#x27;hot&#x27;:&#x27;&#x27;}&quot; data-i=&quot;${i}&quot;&gt;&lt;span class=&quot;ic&quot;&gt;${c.ic}&lt;/span&gt;&lt;b&gt;${c.t}&lt;/b&gt;&lt;small&gt;&lt;code&gt;${c.f}&lt;/code&gt;&lt;/small&gt;&lt;small&gt;${c.d}&lt;/small&gt;&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#trio .card&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(busy)return;card=+b.dataset.i;drawCards();drawCmp();
    setStatus(&#x27;info&#x27;,[&#x27;ONNX = 설계도. ORT 도 TensorRT 도 이 파일에서 출발합니다 → 다른 장치로 가져갈 것은 이것&#x27;,&#x27;ONNX Runtime — 세션을 만들 때마다 규칙대로 최적화하고 바로 실행. CPU · GPU 어디서나&#x27;,&#x27;TensorRT 엔진 — 빌드 때 한 번, 이 GPU 에서 커널을 직접 재 보고 골라 저장. 그래서 이 GPU · 이 버전 전용&#x27;][card]);});}
function drawCmp(){$(&#x27;#cmpT&#x27;).innerHTML=`&lt;tr&gt;&lt;th&gt;&lt;/th&gt;&lt;th class=&quot;${card===1?&#x27;&#x27;:&#x27;&#x27;}&quot;&gt;ONNX Runtime (Day 3)&lt;/th&gt;&lt;th&gt;TensorRT (오늘)&lt;/th&gt;&lt;/tr&gt;`+
  ROWS.map((r,i)=&gt;`&lt;tr class=&quot;${(card===0&amp;&amp;i===0)||(card===2&amp;&amp;i===4)||(card===1&amp;&amp;i===1)?&#x27;cur&#x27;:&#x27;&#x27;}&quot;&gt;&lt;td&gt;${r[0]}&lt;/td&gt;&lt;td&gt;${r[1]}&lt;/td&gt;&lt;td&gt;${r[2]}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;);}
function drawSel(){$(&#x27;#devSel&#x27;).innerHTML=DEV.map((d,i)=&gt;`&lt;button type=&quot;button&quot; data-i=&quot;${i}&quot; class=&quot;${i===dv?&#x27;sel&#x27;:&#x27;&#x27;}&quot;&gt;${d.k} · ${d.sm}&lt;/button&gt;`).join(&#x27;&#x27;);
  $(&#x27;#verSel&#x27;).innerHTML=VER.map((v,i)=&gt;`&lt;button type=&quot;button&quot; data-i=&quot;${i}&quot; class=&quot;${i===vr?&#x27;sel&#x27;:&#x27;&#x27;}&quot;&gt;${v.n}&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#devSel button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(busy)return;dv=+b.dataset.i;reset();});
  $$(&#x27;#verSel button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(busy)return;vr=+b.dataset.i;reset();});}
function dst(cls){const d=DEV[dv];$(&#x27;#dst&#x27;).className=&#x27;dev &#x27;+(cls||&#x27;&#x27;);$(&#x27;#dst&#x27;).innerHTML=`&lt;h3&gt;가져간 곳&lt;/h3&gt;&lt;span class=&quot;big&quot;&gt;${d.n}&lt;/span&gt;&lt;br&gt;compute capability ${d.cc} → &lt;b&gt;${d.sm}&lt;/b&gt;&lt;br&gt;TensorRT ${VER[vr].n}`;}
function reset(){shipped=0;drawSel();dst();$(&#x27;#pk&#x27;).classList.remove(&#x27;go&#x27;);$(&#x27;#pk&#x27;).textContent=&#x27;📦&#x27;;$(&#x27;#chk&#x27;).innerHTML=&#x27;&#x27;;code();setStatus(&#x27;info&#x27;,&#x27;장치와 버전을 고르고 ▶ 를 누르세요.&#x27;);}
function code(){const d=DEV[dv];setCode(`&lt;span class=&quot;c&quot;&gt;# 1-1  설치 확인 — 엔진이 어느 GPU · 어느 버전용인지&lt;/span&gt;
print(&quot;TensorRT 버전:&quot;, trt.&lt;span class=&quot;hl&quot;&gt;__version__&lt;/span&gt;)
print(&quot;GPU 이름:&quot;, torch.cuda.get_device_name(0))
cc = torch.cuda.get_device_capability(0)
print(&quot;compute capability:&quot;, cc, &quot;→&quot;, f&quot;sm_{cc[0]}{cc[1]}&quot;)
&lt;span class=&quot;b&quot;&gt;# 만든 곳 (Colab T4) → (7, 5) → sm_75&lt;/span&gt;
&lt;span class=&quot;b&quot;&gt;# 가져간 곳 (${d.k})  → (${d.cc.replace(&#x27;.&#x27;,&#x27;, &#x27;)}) → ${d.sm}&lt;/span&gt;`);}
async function ship(){const d=DEV[dv],okA=d.k===&#x27;T4&#x27;,okV=vr===0;phase(1);dst();$(&#x27;#chk&#x27;).innerHTML=&#x27;&#x27;;
  setStatus(&#x27;info&#x27;,&#x27;mnv3s_fp32.engine 복사 중…&#x27;);$(&#x27;#pk&#x27;).textContent=&#x27;📦&#x27;;$(&#x27;#pk&#x27;).classList.remove(&#x27;go&#x27;);await sleep(150);$(&#x27;#pk&#x27;).classList.add(&#x27;go&#x27;);await sleep(800);
  const line=(k,a,b,ok)=&gt;`&lt;span&gt;${k}&lt;/span&gt;&lt;span&gt;${a} ↔ ${b}&lt;/span&gt;&lt;span class=&quot;r ${ok?&#x27;ok1&#x27;:&#x27;bad1&#x27;}&quot;&gt;${ok?&#x27;✓ 같음&#x27;:&#x27;✗ 다름&#x27;}&lt;/span&gt;`;
  $(&#x27;#chk&#x27;).innerHTML=line(&#x27;GPU 세대&#x27;,&#x27;sm_75&#x27;,d.sm,okA);await sleep(500);
  $(&#x27;#chk&#x27;).innerHTML+=line(&#x27;TensorRT&#x27;,&#x27;10.16.1.11&#x27;,VER[vr].n.replace(&#x27; (같음)&#x27;,&#x27;&#x27;),okV);await sleep(500);
  const ok=okA&amp;&amp;okV;dst(ok?&#x27;ok&#x27;:&#x27;bad&#x27;);shipped=1;
  if(ok)setStatus(&#x27;ok&#x27;,&#x27;✅ 같은 GPU 세대 (sm_75) + 같은 TensorRT 버전 → 엔진을 그대로 읽어 실행합니다.&#x27;);
  else setStatus(&#x27;warn&#x27;,`❌ 엔진을 읽지 못합니다 (deserialize 실패).\n${!okA?`GPU 세대가 다름 (sm_75 → ${d.sm}) — 고른 커널이 이 GPU 용이 아님`:&#x27;&#x27;}${!okA&amp;&amp;!okV?&#x27;\n&#x27;:&#x27;&#x27;}${!okV?&#x27;TensorRT 버전이 다름 — 엔진 파일 형식이 버전마다 다름&#x27;:&#x27;&#x27;}\n→ .onnx 를 가져가 그 장치에서 다시 빌드하세요.`);
  window.__d4.ship=(window.__d4.ship||0)+1;return ok;}
async function rebuild(){const d=DEV[dv];phase(1);$(&#x27;#pk&#x27;).textContent=&#x27;📐&#x27;;$(&#x27;#pk&#x27;).classList.remove(&#x27;go&#x27;);await sleep(150);$(&#x27;#pk&#x27;).classList.add(&#x27;go&#x27;);
  setStatus(&#x27;info&#x27;,`mnv3s_b1.onnx 를 ${d.k} 로 복사…`);await sleep(800);

  $(&#x27;#chk&#x27;).innerHTML+=`&lt;span&gt;다시 빌드&lt;/span&gt;&lt;span&gt;${d.sm} 에서 커널 다시 고르기&lt;/span&gt;&lt;span class=&quot;r ok1&quot;&gt;✓&lt;/span&gt;`;await sleep(500);

const P=[
 {n:&#x27;① 세 가지 비교&#x27;,ex:&#x27;&lt;p&gt;&lt;b class=&quot;blue&quot;&gt;ONNX&lt;/b&gt; 는 설계도, &lt;b class=&quot;teal&quot;&gt;ONNX Runtime&lt;/b&gt; 은 세션을 만들 때마다 설계도를 읽고 정해진 규칙으로 최적화해 바로 돌리는 기계입니다.&lt;/p&gt;&lt;p&gt;&lt;b class=&quot;amber&quot;&gt;TensorRT&lt;/b&gt; 는 빌드할 때 &lt;b&gt;한 번&lt;/b&gt;, 이 GPU 에서 커널 후보를 &lt;b&gt;직접 재 보고&lt;/b&gt; 가장 빠른 것을 골라 &lt;code&gt;.engine&lt;/code&gt; 으로 저장합니다. 그래서 빠르지만 &lt;b&gt;이 GPU · 이 버전 전용&lt;/b&gt;입니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{for(let i=0;i&lt;3;i++){card=i;drawCards();drawCmp();setStatus(&#x27;info&#x27;,`${CARDS[i].t} — ${CARDS[i].d}`);await sleep(1100);}setStatus(&#x27;ok&#x27;,&#x27;같은 .onnx 에서 출발 → ORT 는 바로 실행, TensorRT 는 미리 조립 (빌드) 후 실행&#x27;);}},
 {n:&#x27;② T4 → T4 (같은 버전)&#x27;,ex:&#x27;&lt;p&gt;다른 Colab 세션이라도 &lt;b&gt;같은 T4 (sm_75)&lt;/b&gt; 이고 TensorRT 가 &lt;b&gt;같은 10.16.1.11&lt;/b&gt; 이면 엔진을 그대로 읽어 씁니다. 그래서 오늘 설치 셀에서 버전을 고정했습니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{dv=0;vr=0;reset();await sleep(300);await ship();}},
 {n:&#x27;③ T4 → Jetson Orin&#x27;,ex:&#x27;&lt;p&gt;Jetson Orin 은 compute capability &lt;b&gt;8.7 (sm_87)&lt;/b&gt;, T4 는 &lt;b&gt;7.5 (sm_75)&lt;/b&gt;. 엔진 안의 커널은 T4 에서 재 보고 고른 것이라 Orin 에서는 쓸 수 없습니다.&lt;/p&gt;&lt;p&gt;→ &lt;b class=&quot;green&quot;&gt;.onnx 를 Jetson 으로 가져가 그 장치에서 다시 빌드&lt;/b&gt;. 8교시 과제 6-3 의 답이기도 합니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{dv=1;vr=0;reset();await sleep(300);await ship();judge(2,&#x27;GPU 세대가 다르면 (sm_75 → sm_87) 엔진을 읽지 못합니다. .onnx 를 가져가 다시 빌드.&#x27;);await sleep(900);await rebuild();}},
 {n:&#x27;④ T4 → A100&#x27;,ex:&#x27;&lt;p&gt;같은 Colab 이라도 런타임 유형을 &lt;b&gt;A100 (sm_80)&lt;/b&gt; 으로 바꾸면 T4 에서 만든 엔진은 읽지 못합니다. ⚠️ 엔진 파일을 다른 GPU 로 가져가는 것은 2교시 &quot;자주 하는 실수&quot;.&lt;/p&gt;&#x27;,
  run:async()=&gt;{dv=2;vr=0;reset();await sleep(300);await ship();}},
 {n:&#x27;⑤ 같은 T4 · 다른 버전&#x27;,ex:&#x27;&lt;p&gt;GPU 가 같아도 &lt;b&gt;TensorRT 버전&lt;/b&gt;이 다르면 엔진 형식이 달라 읽지 못합니다. 그래서 설치 셀에서 &lt;code&gt;tensorrt-cu12==10.16.1.11&lt;/code&gt; 로 고정합니다. (11.x 는 6교시의 &lt;code&gt;BuilderFlag.FP16&lt;/code&gt; 이 없어져 방식 자체가 바뀝니다.)&lt;/p&gt;&#x27;,
  run:async()=&gt;{dv=0;vr=1;reset();await sleep(300);await ship();}},
];
initPredict(&#x27;Colab &lt;b&gt;T4&lt;/b&gt; 에서 만든 &lt;code&gt;mnv3s_fp32.engine&lt;/code&gt; 을 &lt;b&gt;Jetson Orin&lt;/b&gt; (TensorRT 버전은 같다고 하자) 에 복사해 실행하면?&#x27;,[&#x27;그대로 잘 실행된다&#x27;,&#x27;실행은 되지만 느리다&#x27;,&#x27;실행 안 됨 → .onnx 로 다시 빌드&#x27;]);

&lt;body&gt;
&lt;div class=&quot;app&quot;&gt;

&lt;h1&gt;엔진 빌드 단계 — &lt;code&gt;polygraphy convert&lt;/code&gt; 안에서 일어나는 일&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;명령 한 줄 &lt;code&gt;polygraphy convert mnv3s_b1.onnx -o mnv3s_fp32_cli.engine&lt;/code&gt; 이 수십 초 걸리는 이유를 단계별로 봅니다. 그다음 빌드 로그를 한 줄씩 &lt;b&gt;[I] 정보 · [W] 경고 · [E] 오류&lt;/b&gt; 로 분류하고 빌드 시간 줄을 찾으세요.&lt;/p&gt;

const P=[
 {n:&#x27;① 빌드 네 단계&#x27;,ex:&#x27;&lt;p&gt;&lt;b class=&quot;blue&quot;&gt;① 파싱&lt;/b&gt; ONNX 노드 → TensorRT 레이어. &lt;b class=&quot;purple&quot;&gt;② 최적화&lt;/b&gt; 레이어 합치기 · 상수 접기. &lt;b class=&quot;amber&quot;&gt;③ 커널 고르기&lt;/b&gt; 레이어마다 후보 커널 (tactic) 을 이 GPU 에서 &lt;b&gt;직접 실행해 재 보고&lt;/b&gt; 가장 빠른 것을 고름. &lt;b class=&quot;red&quot;&gt;④ 저장&lt;/b&gt; 직렬화 → &lt;code&gt;.engine&lt;/code&gt;.&lt;/p&gt;&lt;p&gt;⚠️ 빌드 셀은 &lt;b&gt;한 번만&lt;/b&gt; 누르고 기다리세요 — 겹치면 더 오래 걸리고 GPU 메모리가 모자랄 수 있습니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{fp16=false;$(&#x27;#cFp16&#x27;).checked=false;code();await build();}},
 {n:&#x27;② 왜 오래 걸리나&#x27;,ex:&#x27;&lt;p&gt;시간 대부분은 &lt;b class=&quot;amber&quot;&gt;③ 커널 고르기&lt;/b&gt;. 같은 Conv 라도 계산 방법 (커널) 이 여러 가지라, TensorRT 는 &lt;b&gt;실제로 돌려 보고&lt;/b&gt; 가장 빠른 것을 고릅니다. 레이어 수 × 후보 수 만큼 실행 → 수십 초.&lt;/p&gt;&lt;p&gt;그래서 &lt;b&gt;한 번 빌드해 저장해 두고 재사용&lt;/b&gt;합니다. ORT 는 이 과정 없이 규칙대로만 최적화 (세션마다 1초 이내).&lt;/p&gt;&#x27;,
  run:async()=&gt;{fp16=false;$(&#x27;#cFp16&#x27;).checked=false;code();await build();judge(2,&#x27;레이어마다 후보 커널을 GPU 에서 직접 재 보는 ③ 단계가 대부분의 시간을 씁니다.&#x27;);}},
 {n:&#x27;③ --fp16 붙이기&#x27;,ex:&#x27;&lt;p&gt;같은 명령에 &lt;code&gt;--fp16&lt;/code&gt; 만 붙이면 FP16 엔진. FP16 후보 커널까지 재 보므로 빌드가 더 걸릴 수 있고, 가중치가 절반이라 &lt;b&gt;파일은 작아집니다&lt;/b&gt;. 로그의 Flags 줄에 &lt;code&gt;[FP16]&lt;/code&gt; 이 보입니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{fp16=true;$(&#x27;#cFp16&#x27;).checked=true;code();await build();li=1;ans=[];found=0;drawLog();}},
 {n:&#x27;④ 로그 읽기&#x27;,ex:&#x27;&lt;p&gt;볼 곳 세 가지: &lt;b class=&quot;red&quot;&gt;[E]&lt;/b&gt; 오류 (빌드 실패) · &lt;b class=&quot;amber&quot;&gt;[W]&lt;/b&gt; 경고 (계속 진행) · &lt;b class=&quot;green&quot;&gt;빌드 시간&lt;/b&gt; 줄 (&lt;code&gt;Finished engine building in … seconds&lt;/code&gt;).&lt;/p&gt;&lt;p&gt;⚠️ &lt;code&gt;[W]&lt;/code&gt; 를 오류로 착각하지 마세요. 종료 코드 0 이면 성공. 흔한 경고 &quot;INT64 가중치를 INT32 로&quot; 는 무시해도 됩니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{li=0;await auto();}},
 {n:&#x27;⑤ 실패한 빌드&#x27;,ex:&#x27;&lt;p&gt;&lt;code&gt;[E]&lt;/code&gt; 줄이 있으면 실패 — 종료 코드가 0 이 아니고 엔진 파일도 없습니다. 파싱 오류의 대부분은 &lt;b&gt;TensorRT 가 모르는 연산&lt;/b&gt; → 지원 연산 조합으로 바꿔 다시 export.&lt;/p&gt;&#x27;,
  run:async()=&gt;{li=2;await auto();}},
];
initPredict(&#x27;&lt;code&gt;polygraphy convert&lt;/code&gt; 로 mnv3s 엔진을 만드는 데 수십 초가 걸립니다. &lt;b&gt;가장 오래 걸리는 단계&lt;/b&gt;는?&#x27;,[&#x27;① ONNX 파일 읽기 (파싱)&#x27;,&#x27;② 레이어 합치기&#x27;,&#x27;③ 후보 커널을 GPU 에서 직접 재 보고 고르기&#x27;,&#x27;④ .engine 파일 저장&#x27;]);

&lt;body&gt;
&lt;div class=&quot;app&quot;&gt;

&lt;h1&gt;비교 · atol · rtol — PASSED / FAILED 는 어떻게 정해지나&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;&lt;code&gt;polygraphy run&lt;/code&gt; 은 같은 무작위 입력을 ONNX Runtime (&lt;b&gt;b&lt;/b&gt;, 기준) 과 TensorRT (&lt;b&gt;a&lt;/b&gt;) 에 넣고 출력 원소를 하나씩 비교합니다. 아래 슬라이더로 &lt;b style=&quot;color:var(--amber)&quot;&gt;atol · rtol&lt;/b&gt; 을 바꾸며 판정이 어떻게 바뀌는지 보세요. 행을 누르면 그 원소의 계산식이 나옵니다.&lt;/p&gt;
&lt;div class=&quot;gpuex&quot;&gt;⚠ &lt;span&gt;&lt;b&gt;출력 값은 예시&lt;/b&gt; — FP32 · FP16 엔진 출력은 차이의 크기를 보여 주려고 만든 예시 숫자입니다. 판정 식은 polygraphy 와 같습니다. 실제 값은 Colab T4 에서 확인하세요.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill amber&quot;&gt;|a − b| ≤ atol + rtol · |b|&lt;/span&gt;&lt;span class=&quot;pill green&quot;&gt;모든 원소 만족 → PASSED&lt;/span&gt;&lt;span class=&quot;pill red&quot;&gt;하나라도 넘으면 FAILED&lt;/span&gt;&lt;span class=&quot;pill blue&quot;&gt;--atol 1e-3 --rtol 1e-3&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;panel pred&quot;&gt;&lt;h2&gt;먼저 예측 (실행 전에)&lt;/h2&gt;&lt;div id=&quot;pred&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;
  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;출력 12개 비교 (logits 1000개 중 일부)&lt;/h2&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;lab&quot;&gt;엔진&lt;/span&gt;&lt;div class=&quot;seg&quot; id=&quot;pSel&quot;&gt;&lt;button type=&quot;button&quot; data-v=&quot;32&quot;&gt;TRT FP32&lt;/button&gt;&lt;button type=&quot;button&quot; data-v=&quot;16&quot;&gt;TRT FP16&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;sA&quot;&gt;atol&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sA&quot; min=&quot;0&quot; max=&quot;9&quot; step=&quot;1&quot; value=&quot;4&quot;&gt;&lt;output id=&quot;oA&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;sR&quot;&gt;rtol&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sR&quot; min=&quot;0&quot; max=&quot;9&quot; step=&quot;1&quot; value=&quot;4&quot;&gt;&lt;output id=&quot;oR&quot;&gt;&lt;/output&gt;&lt;/div&gt;

  &lt;/div&gt;
  &lt;div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;명령 (노트북 3-1 · 3-2)&lt;/h2&gt;&lt;div class=&quot;code&quot; id=&quot;code&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;원소 하나 계산&lt;/h2&gt;&lt;div class=&quot;frm&quot; id=&quot;frm&quot;&gt;&lt;/div&gt;&lt;div class=&quot;status info&quot; id=&quot;status&quot;&gt;프리셋을 누르세요.&lt;/div&gt;&lt;/div&gt;

&lt;script&gt;
const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];
const RM=window.matchMedia&amp;&amp;window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,RM?Math.min(ms,80):ms));
let busy=false, timer=null;
function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}
function setCode(h){$(&#x27;#code&#x27;).innerHTML=h;}
function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const g=c.getContext(&#x27;2d&#x27;);g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}
function initPresets(P,stop){$(&#x27;#presets&#x27;).innerHTML=P.map(p=&gt;`&lt;button type=&quot;button&quot;&gt;${p.n}&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}
const esc=s=&gt;String(s).replace(/&amp;/g,&#x27;&amp;amp;&#x27;).replace(/&lt;/g,&#x27;&amp;lt;&#x27;).replace(/&gt;/g,&#x27;&amp;gt;&#x27;);
const fmt=n=&gt;n.toLocaleString(&#x27;en-US&#x27;);
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
window.__d4={};
let guess=null, predOpts=[];
function initPredict(q,opts){predOpts=opts;guess=null;
  $(&#x27;#pred&#x27;).innerHTML=`&lt;div class=&quot;steps3&quot;&gt;&lt;span class=&quot;on&quot; id=&quot;st1&quot;&gt;① 예측&lt;/span&gt;&lt;span id=&quot;st2&quot;&gt;② 실행&lt;/span&gt;&lt;span id=&quot;st3&quot;&gt;③ 설명&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;pq&quot;&gt;${q}&lt;/div&gt;&lt;div class=&quot;seg&quot; id=&quot;predOpts&quot;&gt;${opts.map((o,i)=&gt;`&lt;button type=&quot;button&quot; data-i=&quot;${i}&quot;&gt;${o}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;pv&quot; id=&quot;predV&quot;&gt;먼저 하나를 고른 뒤 실행 ▶ 하세요. (안 골라도 실행은 됩니다)&lt;/div&gt;`;
  $$(&#x27;#predOpts button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{guess=+b.dataset.i;$$(&#x27;#predOpts button&#x27;).forEach(x=&gt;{x.classList.toggle(&#x27;sel&#x27;,x===b);x.classList.remove(&#x27;ok&#x27;,&#x27;bad&#x27;);});
    const v=$(&#x27;#predV&#x27;);v.className=&#x27;pv&#x27;;v.textContent=&#x27;예측: &#x27;+opts[guess]+&#x27; → 이제 실행해서 확인&#x27;;phase(1);});}
function phase(k){[&#x27;#st1&#x27;,&#x27;#st2&#x27;,&#x27;#st3&#x27;].forEach((s,i)=&gt;{const e=$(s);if(e)e.classList.toggle(&#x27;on&#x27;,i===k);});}
function judge(ans,why){$$(&#x27;#predOpts button&#x27;).forEach((b,i)=&gt;{b.classList.toggle(&#x27;ok&#x27;,i===ans);b.classList.toggle(&#x27;bad&#x27;,i===guess&amp;&amp;i!==ans);});
  const v=$(&#x27;#predV&#x27;);v.className=&#x27;pv &#x27;+(guess===null?&#x27;&#x27;:guess===ans?&#x27;ok&#x27;:&#x27;bad&#x27;);
  v.innerHTML=(guess===null?&#x27;정답: &#x27;:guess===ans?&#x27;✅ 예측 적중 — &#x27;:&#x27;❌ 예측과 다름 — &#x27;)+&#x27;&lt;b&gt;&#x27;+predOpts[ans]+&#x27;&lt;/b&gt;. &#x27;+why;phase(2);window.__d4.judged=(window.__d4.judged||0)+1;}
function ready(){$(&#x27;#explain&#x27;).innerHTML=&#x27;&lt;p&gt;&lt;b class=&quot;amber&quot;&gt;① 예측&lt;/b&gt;을 먼저 고르고 → &lt;b class=&quot;teal&quot;&gt;② 프리셋 또는 ▶ 버튼&lt;/b&gt;으로 실행하면 → &lt;b class=&quot;green&quot;&gt;③ 여기에 설명&lt;/b&gt;이 나옵니다.&lt;/p&gt;&#x27;;setStatus(&#x27;info&#x27;,&#x27;먼저 위에서 예측을 하나 고른 뒤, 프리셋이나 ▶ 버튼을 누르세요.&#x27;);}
function pct(a,q){const s=[...a].sort((x,y)=&gt;x-y);const h=(s.length-1)*q/100,lo=Math.floor(h),hi=Math.ceil(h);return s[lo]+(s[hi]-s[lo])*(h-lo);}
function rng(seed){let t=seed&gt;&gt;&gt;0;return()=&gt;{t+=0x6D2B79F5;let r=Math.imul(t^t&gt;&gt;&gt;15,1|t);r^=r+Math.imul(r^r&gt;&gt;&gt;7,61|r);return((r^r&gt;&gt;&gt;14)&gt;&gt;&gt;0)/4294967296;};}


const TOL=[1e-5,3e-5,1e-4,3e-4,1e-3,3e-3,1e-2,3e-2,5e-2,1e-1];
const tf=v=&gt;{const e=Math.floor(Math.log10(v)+1e-9),m=Math.round(v/10**e);return m+&#x27;e&#x27;+e;};
const R=rng(4);const N=12;
const B=Array.from({length:N},()=&gt;+((R()*2-1)*(R()&lt;.3?6:2.5)).toFixed(4));
const D32=B.map(b=&gt;(R()*2-1)*(2e-6+1.5e-6*Math.abs(b)));
const D16=B.map(b=&gt;(R()*2-1)*(2.5e-3+2.2e-3*Math.abs(b))+(R()&lt;.2?(R()&lt;.5?-1:1)*0.012:0));
let pr=32, ai=4, rI=4, sel=-1;
function rows(){const D=pr===32?D32:D16,at=TOL[ai],rt=TOL[rI];return B.map((b,i)=&gt;{const a=b+D[i],d=Math.abs(a-b),tol=at+rt*Math.abs(b);return {b,a,d,tol,ok:d&lt;=tol};});}
function draw(){$$(&#x27;#pSel button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;sel&#x27;,+x.dataset.v===pr));$(&#x27;#sA&#x27;).value=ai;$(&#x27;#sR&#x27;).value=rI;$(&#x27;#oA&#x27;).textContent=tf(TOL[ai]);$(&#x27;#oR&#x27;).textContent=tf(TOL[rI]);
  const rs=rows();const nf=rs.filter(r=&gt;!r.ok).length;const mx=Math.max(...rs.map(r=&gt;r.d));
  $(&#x27;#tbl&#x27;).innerHTML=&#x27;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;b (ORT)&lt;/th&gt;&lt;th&gt;a (TRT)&lt;/th&gt;&lt;th&gt;|a−b|&lt;/th&gt;&lt;th&gt;허용&lt;/th&gt;&lt;th&gt;차이 / 허용&lt;/th&gt;&lt;th&gt;판정&lt;/th&gt;&lt;/tr&gt;&#x27;+rs.map((r,i)=&gt;{const fr=Math.min(r.d/r.tol,2);
    return `&lt;tr data-i=&quot;${i}&quot; class=&quot;${r.ok?&#x27;&#x27;:&#x27;f&#x27;} ${i===sel?&#x27;cur&#x27;:&#x27;&#x27;}&quot;&gt;&lt;td&gt;${i}&lt;/td&gt;&lt;td&gt;${r.b.toFixed(4)}&lt;/td&gt;&lt;td&gt;${r.a.toFixed(pr===32?6:4)}&lt;/td&gt;&lt;td&gt;${r.d.toExponential(1)}&lt;/td&gt;&lt;td&gt;${r.tol.toExponential(1)}&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;mini&quot;&gt;&lt;i class=&quot;${r.ok?&#x27;&#x27;:&#x27;over&#x27;}&quot; style=&quot;width:${fr*50}%&quot;&gt;&lt;/i&gt;&lt;u style=&quot;left:50%&quot;&gt;&lt;/u&gt;&lt;/span&gt;&lt;/td&gt;&lt;td class=&quot;${r.ok?&#x27;ok1&#x27;:&#x27;bad1&#x27;}&quot;&gt;${r.ok?&#x27;✓&#x27;:&#x27;✗&#x27;}&lt;/td&gt;&lt;/tr&gt;`;}).join(&#x27;&#x27;);
  $$(&#x27;#tbl tr[data-i]&#x27;).forEach(t=&gt;t.onclick=()=&gt;{if(busy)return;sel=+t.dataset.i;draw();});
  const v=$(&#x27;#vd&#x27;);v.className=&#x27;vd &#x27;+(nf?&#x27;bad&#x27;:&#x27;ok&#x27;);v.innerHTML=(nf?`FAILED — ${nf}/${N} 원소가 허용 초과`:`PASSED — ${N}/${N} 원소 모두 허용 안`)+`&lt;div style=&quot;font-size:12.5px;font-weight:400&quot;&gt;Absolute Difference max = ${mx.toExponential(2)} &lt;span class=&quot;ex&quot;&gt;예시&lt;/span&gt;&lt;/div&gt;`;
  frm(rs);code(nf);window.__d4.v=nf?&#x27;FAILED&#x27;:&#x27;PASSED&#x27;;}
function frm(rs){const i=sel&lt;0?rs.reduce((k,r,j)=&gt;r.d/r.tol&gt;rs[k].d/rs[k].tol?j:k,0):sel;const r=rs[i];
  $(&#x27;#frm&#x27;).innerHTML=`원소 #${i}${sel&lt;0?(r.ok?&#x27; (가장 아슬아슬한 원소)&#x27;:&#x27; (허용을 가장 크게 넘은 원소)&#x27;):&#x27;&#x27;}&lt;br&gt;|a − b| = &lt;b&gt;${r.d.toExponential(2)}&lt;/b&gt; ${r.ok?&#x27;≤&#x27;:&#x27;&gt;&#x27;} atol + rtol·|b| = ${tf(TOL[ai])} + ${tf(TOL[rI])}×${Math.abs(r.b).toFixed(3)} = &lt;b&gt;${r.tol.toExponential(2)}&lt;/b&gt; → &lt;span class=&quot;${r.ok?&#x27;ok1&#x27;:&#x27;bad1&#x27;}&quot;&gt;${r.ok?&#x27;✓&#x27;:&#x27;✗&#x27;}&lt;/span&gt;`;}
function code(nf){setCode(`&lt;span class=&quot;c&quot;&gt;# 3-1 / 3-2  같은 입력 → ORT 와 TensorRT 비교&lt;/span&gt;
polygraphy run mnv3s_b1.onnx --onnxrt --trt${pr===16?&#x27; &lt;span class=&quot;a&quot;&gt;--fp16&lt;/span&gt;&#x27;:&#x27;&#x27;} --atol &lt;span class=&quot;hl&quot;&gt;${tf(TOL[ai])}&lt;/span&gt; --rtol &lt;span class=&quot;hl&quot;&gt;${tf(TOL[rI])}&lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;# 판정: 모든 원소에서 |a - b| &lt;= atol + rtol * |b|&lt;/span&gt;
&lt;span class=&quot;${nf?&#x27;e&#x27;:&#x27;g&#x27;}&quot;&gt;# → ${nf?&#x27;FAILED&#x27;:&#x27;PASSED&#x27;}&lt;/span&gt;

def verdict(log_path):
    text = open(log_path).read()
    result = &quot;PASSED&quot; if re.search(r&quot;\\bPASSED \\| Runtime&quot;, text) else &quot;&lt;span class=&quot;hl&quot;&gt;FAILED&lt;/span&gt;&quot;
    m = re.findall(r&quot;Absolute Difference.*?max=([0-9.eE+-]+)&quot;, text)
    return result, (float(m[-1]) if m else None)`);}
$$(&#x27;#pSel button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(busy)return;pr=+b.dataset.v;sel=-1;draw();});
$(&#x27;#sA&#x27;).oninput=e=&gt;{if(busy){e.target.value=ai;return;}ai=+e.target.value;draw();};
$(&#x27;#sR&#x27;).oninput=e=&gt;{if(busy){e.target.value=rI;return;}rI=+e.target.value;draw();};
async function set(p,a,r,msg){pr=p;sel=-1;draw();await sleep(400);ai=a;rI=r;draw();phase(1);await sleep(600);const nf=rows().filter(x=&gt;!x.ok).length;setStatus(nf?&#x27;warn&#x27;:&#x27;ok&#x27;,msg(nf));}
function stop(){}
const P=[
 {n:&#x27;① FP32 · 1e-3&#x27;,ex:&#x27;&lt;p&gt;FP32 엔진의 차이는 &lt;b&gt;10⁻⁶ 정도&lt;/b&gt; — 허용 (약 10⁻³) 보다 훨씬 작아 &lt;b class=&quot;green&quot;&gt;PASSED&lt;/b&gt;. &quot;Absolute Difference ... max=&quot; 가 실제 최대 차이입니다.&lt;/p&gt;&lt;p&gt;&lt;code&gt;--trt&lt;/code&gt; 를 주면 polygraphy 가 안에서 엔진을 새로 빌드한 뒤 비교합니다 (그래서 또 수십 초).&lt;/p&gt;&#x27;,
  run:async()=&gt;set(32,4,4,nf=&gt;nf?&#x27;FAILED&#x27;:&#x27;PASSED — FP32 엔진은 사실상 같은 답&#x27;)},
 {n:&#x27;② FP16 · 1e-3 (엄격)&#x27;,ex:&#x27;&lt;p&gt;FP16 은 유효숫자가 약 3자리라 출력 차이가 &lt;b&gt;10⁻³ ~ 10⁻²&lt;/b&gt; — 같은 엄격한 기준이면 &lt;b class=&quot;red&quot;&gt;FAILED&lt;/b&gt; 가 흔합니다.&lt;/p&gt;&lt;p&gt;&lt;b&gt;FAILED = &quot;틀렸다&quot; 가 아니라 &quot;이 기준보다 차이가 크다&quot;&lt;/b&gt;. 기준을 정하는 것은 사람입니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{await set(16,4,4,nf=&gt;`FAILED — ${nf}개 원소가 허용 초과. FP16 에 FP32 기준을 쓴 것`);judge(1,&#x27;FP16 의 차이 (10⁻³~10⁻²) 는 atol 1e-3 · rtol 1e-3 의 허용보다 커서 FAILED 가 흔합니다.&#x27;);}},
 {n:&#x27;③ FP16 · 5e-2 (느슨)&#x27;,ex:&#x27;&lt;p&gt;&lt;code&gt;--atol 5e-2 --rtol 5e-2&lt;/code&gt; 로 느슨하게 하면 &lt;b class=&quot;green&quot;&gt;PASSED&lt;/b&gt;. 하지만 느슨한 PASSED 만으로 결론 내지 말고 &lt;b&gt;정확도&lt;/b&gt; (6교시 MNIST · 8교시 top-1) 로 다시 판단합니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;set(16,8,8,nf=&gt;nf?&#x27;아직 FAILED&#x27;:&#x27;PASSED — 느슨한 기준 안. 다음은 정확도로 확인&#x27;)},
 {n:&#x27;④ rtol 만 키우면&#x27;,ex:&#x27;&lt;p&gt;허용 = atol + rtol·|b|. &lt;b&gt;rtol&lt;/b&gt; 은 값이 큰 원소에서 허용을 크게 만들고, &lt;b&gt;atol&lt;/b&gt; 은 0 근처 작은 값에서 바닥을 깔아 줍니다. rtol 만 키우면 |b| 가 작은 원소가 마지막까지 남습니다 — 행을 눌러 확인해 보세요.&lt;/p&gt;&#x27;,
  run:async()=&gt;set(16,2,9,nf=&gt;nf?`atol 1e-4 · rtol 1e-1 → 아직 ${nf}개 FAILED (|b| 가 작은 원소)`:&#x27;PASSED&#x27;)},
];
initPredict(&#x27;FP16 엔진을 FP32 와 &lt;b&gt;같은 기준&lt;/b&gt; &lt;code&gt;--atol 1e-3 --rtol 1e-3&lt;/code&gt; 으로 ORT 와 비교하면?&#x27;,[&#x27;PASSED&#x27;,&#x27;FAILED (흔함)&#x27;,&#x27;명령 오류&#x27;]);
initPresets(P,stop);
draw();setStatus(&#x27;info&#x27;,&#x27;먼저 위에서 예측을 하나 고른 뒤, 프리셋이나 슬라이더를 움직이세요.&#x27;);
ready();

&lt;/script&gt;

&lt;script&gt;
const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];

  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}

  $(&#x27;#pred&#x27;).innerHTML=`&lt;div class=&quot;steps3&quot;&gt;&lt;span class=&quot;on&quot; id=&quot;st1&quot;&gt;① 예측&lt;/span&gt;&lt;span id=&quot;st2&quot;&gt;② 실행&lt;/span&gt;&lt;span id=&quot;st3&quot;&gt;③ 설명&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;pq&quot;&gt;${q}&lt;/div&gt;&lt;div class=&quot;seg&quot; id=&quot;predOpts&quot;&gt;${opts.map((o,i)=&gt;`&lt;button type=&quot;button&quot; data-i=&quot;${i}&quot;&gt;${o}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;pv&quot; id=&quot;predV&quot;&gt;먼저 하나를 고른 뒤 실행 ▶ 하세요. (안 골라도 실행은 됩니다)&lt;/div&gt;`;
  $$(&#x27;#predOpts button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{guess=+b.dataset.i;$$(&#x27;#predOpts button&#x27;).forEach(x=&gt;{x.classList.toggle(&#x27;sel&#x27;,x===b);x.classList.remove(&#x27;ok&#x27;,&#x27;bad&#x27;);});
    const v=$(&#x27;#predV&#x27;);v.className=&#x27;pv&#x27;;v.textContent=&#x27;예측: &#x27;+opts[guess]+&#x27; → 이제 실행해서 확인&#x27;;phase(1);});}
function phase(k){[&#x27;#st1&#x27;,&#x27;#st2&#x27;,&#x27;#st3&#x27;].forEach((s,i)=&gt;{const e=$(s);if(e)e.classList.toggle(&#x27;on&#x27;,i===k);});}

  const v=$(&#x27;#predV&#x27;);v.className=&#x27;pv &#x27;+(guess===null?&#x27;&#x27;:guess===ans?&#x27;ok&#x27;:&#x27;bad&#x27;);
  v.innerHTML=(guess===null?&#x27;정답: &#x27;:guess===ans?&#x27;✅ 예측 적중 — &#x27;:&#x27;❌ 예측과 다름 — &#x27;)+&#x27;&lt;b&gt;&#x27;+predOpts[ans]+&#x27;&lt;/b&gt;. &#x27;+why;phase(2);window.__d4.judged=(window.__d4.judged||0)+1;}
function ready(){$(&#x27;#explain&#x27;).innerHTML=&#x27;&lt;p&gt;&lt;b class=&quot;amber&quot;&gt;① 예측&lt;/b&gt;을 먼저 고르고 → &lt;b class=&quot;teal&quot;&gt;② 프리셋 또는 ▶ 버튼&lt;/b&gt;으로 실행하면 → &lt;b class=&quot;green&quot;&gt;③ 여기에 설명&lt;/b&gt;이 나옵니다.&lt;/p&gt;&#x27;;setStatus(&#x27;info&#x27;,&#x27;먼저 위에서 예측을 하나 고른 뒤, 프리셋이나 ▶ 버튼을 누르세요.&#x27;);}
function pct(a,q){const s=[...a].sort((x,y)=&gt;x-y);const h=(s.length-1)*q/100,lo=Math.floor(h),hi=Math.ceil(h);return s[lo]+(s[hi]-s[lo])*(h-lo);}
function rng(seed){let t=seed&gt;&gt;&gt;0;return()=&gt;{t+=0x6D2B79F5;let r=Math.imul(t^t&gt;&gt;&gt;15,1|t);r^=r+Math.imul(r^r&gt;&gt;&gt;7,61|r);return((r^r&gt;&gt;&gt;14)&gt;&gt;&gt;0)/4294967296;};}

 {k:&#x27;Logger&#x27;,d:&#x27;TensorRT 가 하는 말을 받는 곳&#x27;,c:&#x27;LOGGER = trt.Logger(trt.Logger.WARNING)&#x27;,why:&#x27;모든 TensorRT 객체는 Logger 를 받습니다 — 가장 먼저.&#x27;},

 {k:&#x27;OnnxParser&#x27;,d:&#x27;ONNX 로 설계판 채우기&#x27;,c:&#x27;parser = trt.OnnxParser(network, LOGGER)\nok = parser.parse_from_file(&quot;mnv3s_b1.onnx&quot;)   &lt;span class=&quot;c&quot;&gt;# False 면 get_error(i)&lt;/span&gt;&#x27;,why:&#x27;Parser 는 채울 Network 를 받아야 합니다 — Network 가 먼저.&#x27;},
 {k:&#x27;Config&#x27;,d:&#x27;빌드 옵션&#x27;,c:&#x27;config = builder.create_builder_config()\nconfig.set_memory_pool_limit(trt.MemoryPoolType.WORKSPACE, 1 &lt;&lt; 30)\nconfig.profiling_verbosity = trt.ProfilingVerbosity.DETAILED&#x27;,why:&#x27;옵션은 빌드 직전에 — 설계판이 채워진 뒤 (Builder 가 만들어 줌).&#x27;},
 {k:&#x27;build_serialized_network&#x27;,d:&#x27;빌드 (수십 초)&#x27;,c:&#x27;blob = builder.build_serialized_network(network, config)   &lt;span class=&quot;c&quot;&gt;# None 이면 실패&lt;/span&gt;&#x27;,why:&#x27;빌드에는 채워진 Network 와 Config 둘 다 필요합니다.&#x27;},
 {k:&#x27;파일 저장&#x27;,d:&#x27;.engine 으로&#x27;,c:&#x27;with open(&quot;mnv3s_fp32.engine&quot;, &quot;wb&quot;) as f:\n    f.write(blob)&#x27;,why:&#x27;저장할 blob 은 빌드가 끝나야 생깁니다.&#x27;}];
const FP16L=&#x27;    &lt;span class=&quot;hl&quot;&gt;config.set_flag(trt.BuilderFlag.FP16)&lt;/span&gt;   &lt;span class=&quot;c&quot;&gt;# fp16=True 일 때 이 한 줄&lt;/span&gt;&#x27;;
let order=[], got=0, fp16=false, flashNew=-1, mode=&#x27;step&#x27;;
function shuffle(){const R=rng(Date.now()%100000);order=S.map((_,i)=&gt;i);for(let i=order.length-1;i&gt;0;i--){const j=Math.floor(R()*(i+1));[order[i],order[j]]=[order[j],order[i]];}if(order.every((v,i)=&gt;v===i))order.reverse();}
function drawPool(){$(&#x27;#pool&#x27;).innerHTML=order.filter(i=&gt;i&gt;=got).map(i=&gt;`&lt;button type=&quot;button&quot; class=&quot;pc&quot; data-i=&quot;${i}&quot;&gt;${S[i].k}&lt;small&gt;${S[i].d}&lt;/small&gt;&lt;/button&gt;`).join(&#x27;&#x27;)||&#x27;&lt;span class=&quot;ok1&quot; style=&quot;font-size:13px&quot;&gt;✓ 모두 조립 — fp16 을 켜 보세요&lt;/span&gt;&#x27;;
  $$(&#x27;#pool .pc&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(busy)return;pick(+b.dataset.i,b);});}
function drawSlots(){$(&#x27;#slots&#x27;).innerHTML=S.map((s,i)=&gt;{const f=i&lt;got;return `&lt;div class=&quot;slot ${f?&#x27;fill&#x27;:&#x27;&#x27;} ${i===flashNew?&#x27;new&#x27;:&#x27;&#x27;}&quot;&gt;&lt;span class=&quot;no&quot;&gt;${i&lt;6?&#x27;①②③④⑤⑥&#x27;[i]:&#x27;→&#x27;}&lt;/span&gt;&lt;span class=&quot;tx&quot;&gt;${f?`&lt;b&gt;${s.k}&lt;/b&gt;&lt;small&gt;${s.d}&lt;/small&gt;`:&#x27;&lt;span class=&quot;dim&quot;&gt;?&lt;/span&gt;&#x27;}${f&amp;&amp;fp16&amp;&amp;i===4?&#x27;&lt;small style=&quot;color:var(--amber)&quot;&gt;+ set_flag(BuilderFlag.FP16)&lt;/small&gt;&#x27;:&#x27;&#x27;}&lt;/span&gt;&lt;/div&gt;`;}).join(&#x27;&#x27;);}
function pick(i,el){if(i===got){got++;flashNew=i;drawPool();drawSlots();code();
    setStatus(&#x27;ok&#x27;,`${&#x27;①②③④⑤⑥→&#x27;[i]} ${S[i].k} ✓ — ${S[i].why}`+(got===S.length?&#x27;\n🎉 여섯 단계 완성 → mnv3s_fp32.engine&#x27;:&#x27;&#x27;));if(got===S.length)window.__d4.order=1;return true;}
  if(el){el.classList.add(&#x27;shake&#x27;);setTimeout(()=&gt;el.classList.remove(&#x27;shake&#x27;),400);}
  setStatus(&#x27;warn&#x27;,`✗ 지금은 ${S[i].k} 차례가 아닙니다.\n${S[i].why}`);return false;}
function code(){let L=[];
  if(mode===&#x27;fn&#x27;){setCode(`def build_engine(onnx_path, engine_path, fp16=False):
    builder = trt.Builder(LOGGER)
    network = builder.create_network(0)
    parser = trt.OnnxParser(network, LOGGER)
    if not parser.parse_from_file(onnx_path):
        raise RuntimeError(&quot;\\n&quot;.join(str(parser.get_error(i)) for i in range(parser.num_errors)))
    config = builder.create_builder_config()
    config.set_memory_pool_limit(trt.MemoryPoolType.WORKSPACE, 1 &lt;&lt; 30)
    config.profiling_verbosity = trt.ProfilingVerbosity.DETAILED
    if fp16:
${fp16?&#x27;        &lt;span class=&quot;hl&quot;&gt;config.set_flag(trt.BuilderFlag.FP16)&lt;/span&gt;&#x27;:&#x27;        config.set_flag(trt.BuilderFlag.FP16)&#x27;}
    blob = builder.build_serialized_network(network, config)
    if blob is None:
        raise RuntimeError(&quot;빌드 실패 — 위 로그를 확인하세요&quot;)
    with open(engine_path, &quot;wb&quot;) as f:
        f.write(blob)
    return engine_path

build_engine(&quot;mnist_cnn_b1.onnx&quot;, &quot;cnn_fp32.engine&quot;)
build_engine(&quot;mnv3s_b1.onnx&quot;, &quot;mnv3s_fp16.engine&quot;, fp16=&lt;span class=&quot;hl&quot;&gt;True&lt;/span&gt;)   &lt;span class=&quot;c&quot;&gt;# 6교시&lt;/span&gt;`);return;}
  for(let i=0;i&lt;got;i++){let c=S[i].c;if(i===flashNew)c=c.split(&#x27;\n&#x27;).map(l=&gt;`&lt;span class=&quot;hl&quot;&gt;${l}&lt;/span&gt;`).join(&#x27;\n&#x27;);L.push(`&lt;span class=&quot;c&quot;&gt;# ${&#x27;①②③④⑤⑥&#x27;[i]||&#x27;⑥&#x27;} ${S[i].k}&lt;/span&gt;\n${c}`);if(i===4&amp;&amp;fp16)L.push(FP16L.trim());}
  setCode(L.join(&#x27;\n&#x27;)||&#x27;&lt;span class=&quot;c&quot;&gt;# 카드를 순서대로 누르면 코드가 여기에 쌓입니다&lt;/span&gt;&#x27;);}
$(&#x27;#bShuf&#x27;).onclick=()=&gt;{if(busy)return;mode=&#x27;step&#x27;;got=0;flashNew=-1;shuffle();drawPool();drawSlots();code();setStatus(&#x27;info&#x27;,&#x27;섞었습니다. ① 부터 누르세요.&#x27;);};
async function assemble(){mode=&#x27;step&#x27;;got=0;flashNew=-1;shuffle();drawPool();drawSlots();code();phase(1);await sleep(400);
  for(let i=0;i&lt;S.length;i++){const el=$(`#pool .pc[data-i=&quot;${i}&quot;]`);if(el){el.classList.add(&#x27;hot&#x27;);el.style.borderColor=&#x27;var(--amber)&#x27;;}await sleep(450);pick(i,null);await sleep(600);}flashNew=-1;drawSlots();code();}
$(&#x27;#bAns&#x27;).onclick=()=&gt;{if(!busy){busy=true;assemble().finally(()=&gt;busy=false);}};
$(&#x27;#cFp16&#x27;).onchange=e=&gt;{if(busy){e.target.checked=fp16;return;}fp16=e.target.checked;flashNew=-1;drawSlots();code();
  setStatus(fp16?&#x27;ok&#x27;:&#x27;info&#x27;,fp16?(got&gt;4||mode===&#x27;fn&#x27;?&#x27;fp16=True → ⑤ Config 에 한 줄 config.set_flag(trt.BuilderFlag.FP16) 만 추가. 나머지는 그대로&#x27;:&#x27;⑤ Config 카드까지 조립하면 FP16 줄이 보입니다&#x27;):&#x27;fp16=False → FP16 줄 없음 (FP32 엔진)&#x27;);};

 {n:&#x27;① 순서대로 조립&#x27;,ex:&#x27;&lt;p&gt;① &lt;b&gt;Logger&lt;/b&gt; (말 받는 곳) → ② &lt;b&gt;Builder&lt;/b&gt; (공장) → ③ &lt;b&gt;Network&lt;/b&gt; (빈 설계판) → ④ &lt;b&gt;OnnxParser&lt;/b&gt; 로 설계판 채우기 → ⑤ &lt;b&gt;Config&lt;/b&gt; (WORKSPACE 1 GB · DETAILED) → ⑥ &lt;b&gt;build_serialized_network&lt;/b&gt; → 파일.&lt;/p&gt;&lt;p&gt;각 단계는 앞 단계가 만든 것을 받습니다 — 그래서 순서가 정해져 있습니다.&lt;/p&gt;&#x27;,

 {n:&#x27;② Parser 를 먼저?&#x27;,ex:&#x27;&lt;p&gt;&lt;code&gt;trt.OnnxParser(network, LOGGER)&lt;/code&gt; — Parser 는 &lt;b&gt;채울 Network 를 인자로&lt;/b&gt; 받습니다. Network 가 없으면 만들 수 없습니다.&lt;/p&gt;&lt;p&gt;⚠️ &lt;code&gt;parse_from_file&lt;/code&gt; 결과 (&lt;code&gt;ok&lt;/code&gt;) 를 확인하지 않고 빌드하면 빈 설계판으로 빌드해 &lt;code&gt;None&lt;/code&gt; 이 나옵니다. 파싱 → 확인 → 빌드.&lt;/p&gt;&#x27;,

&lt;div class=&quot;app&quot;&gt;

&lt;h1&gt;엔진 실행 — TensorRT 에는 GPU 메모리 &#x27;주소&#x27; 를 알려 준다&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;ONNX Runtime 은 NumPy 를 그대로 받았지만, TensorRT 는 &lt;b style=&quot;color:var(--green)&quot;&gt;GPU 메모리 주소&lt;/b&gt;만 받습니다. GPU 버퍼는 PyTorch CUDA 텐서로 만들고 &lt;code&gt;data_ptr()&lt;/code&gt; 를 Context 에 알려 줍니다. 그리고 &lt;code&gt;execute_async_v3&lt;/code&gt; 는 &lt;b style=&quot;color:var(--amber)&quot;&gt;&quot;시작해 둬&quot;&lt;/b&gt; 만 하고 바로 돌아옵니다 — 기다리지 않고 읽으면?&lt;/p&gt;
&lt;div class=&quot;gpuex&quot;&gt;⚠ &lt;span&gt;&lt;b&gt;주소 · 출력 값은 예시&lt;/b&gt; — 메모리 주소와 logits 숫자는 설명용입니다. 실제 값은 Colab T4 에서 확인하세요.&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill blue&quot;&gt;CPU: x1 (NumPy)&lt;/span&gt;&lt;span class=&quot;pill green&quot;&gt;GPU: d_in · d_out (CUDA 텐서)&lt;/span&gt;&lt;span class=&quot;pill amber&quot;&gt;set_tensor_address(name, ptr)&lt;/span&gt;&lt;span class=&quot;pill red&quot;&gt;execute_async_v3 = 비동기&lt;/span&gt;&lt;span class=&quot;pill teal&quot;&gt;torch.cuda.synchronize()&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;panel pred&quot;&gt;&lt;h2&gt;먼저 예측 (실행 전에)&lt;/h2&gt;&lt;div id=&quot;pred&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;
  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;메모리 · Context · GPU 실행&lt;/h2&gt;

    &lt;div class=&quot;row&quot;&gt;&lt;label class=&quot;chk&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;cNoSync&quot;&gt; synchronize 생략 (기다리지 않고 바로 읽기)&lt;/label&gt;&lt;/div&gt;

&lt;script&gt;
const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];
const RM=window.matchMedia&amp;&amp;window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,RM?Math.min(ms,80):ms));
let busy=false, timer=null;
function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}
function setCode(h){$(&#x27;#code&#x27;).innerHTML=h;}
function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const g=c.getContext(&#x27;2d&#x27;);g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}
function initPresets(P,stop){$(&#x27;#presets&#x27;).innerHTML=P.map(p=&gt;`&lt;button type=&quot;button&quot;&gt;${p.n}&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}
const esc=s=&gt;String(s).replace(/&amp;/g,&#x27;&amp;amp;&#x27;).replace(/&lt;/g,&#x27;&amp;lt;&#x27;).replace(/&gt;/g,&#x27;&amp;gt;&#x27;);
const fmt=n=&gt;n.toLocaleString(&#x27;en-US&#x27;);
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
window.__d4={};
let guess=null, predOpts=[];
function initPredict(q,opts){predOpts=opts;guess=null;
  $(&#x27;#pred&#x27;).innerHTML=`&lt;div class=&quot;steps3&quot;&gt;&lt;span class=&quot;on&quot; id=&quot;st1&quot;&gt;① 예측&lt;/span&gt;&lt;span id=&quot;st2&quot;&gt;② 실행&lt;/span&gt;&lt;span id=&quot;st3&quot;&gt;③ 설명&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;pq&quot;&gt;${q}&lt;/div&gt;&lt;div class=&quot;seg&quot; id=&quot;predOpts&quot;&gt;${opts.map((o,i)=&gt;`&lt;button type=&quot;button&quot; data-i=&quot;${i}&quot;&gt;${o}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;pv&quot; id=&quot;predV&quot;&gt;먼저 하나를 고른 뒤 실행 ▶ 하세요. (안 골라도 실행은 됩니다)&lt;/div&gt;`;
  $$(&#x27;#predOpts button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{guess=+b.dataset.i;$$(&#x27;#predOpts button&#x27;).forEach(x=&gt;{x.classList.toggle(&#x27;sel&#x27;,x===b);x.classList.remove(&#x27;ok&#x27;,&#x27;bad&#x27;);});
    const v=$(&#x27;#predV&#x27;);v.className=&#x27;pv&#x27;;v.textContent=&#x27;예측: &#x27;+opts[guess]+&#x27; → 이제 실행해서 확인&#x27;;phase(1);});}
function phase(k){[&#x27;#st1&#x27;,&#x27;#st2&#x27;,&#x27;#st3&#x27;].forEach((s,i)=&gt;{const e=$(s);if(e)e.classList.toggle(&#x27;on&#x27;,i===k);});}
function judge(ans,why){$$(&#x27;#predOpts button&#x27;).forEach((b,i)=&gt;{b.classList.toggle(&#x27;ok&#x27;,i===ans);b.classList.toggle(&#x27;bad&#x27;,i===guess&amp;&amp;i!==ans);});
  const v=$(&#x27;#predV&#x27;);v.className=&#x27;pv &#x27;+(guess===null?&#x27;&#x27;:guess===ans?&#x27;ok&#x27;:&#x27;bad&#x27;);
  v.innerHTML=(guess===null?&#x27;정답: &#x27;:guess===ans?&#x27;✅ 예측 적중 — &#x27;:&#x27;❌ 예측과 다름 — &#x27;)+&#x27;&lt;b&gt;&#x27;+predOpts[ans]+&#x27;&lt;/b&gt;. &#x27;+why;phase(2);window.__d4.judged=(window.__d4.judged||0)+1;}
function ready(){$(&#x27;#explain&#x27;).innerHTML=&#x27;&lt;p&gt;&lt;b class=&quot;amber&quot;&gt;① 예측&lt;/b&gt;을 먼저 고르고 → &lt;b class=&quot;teal&quot;&gt;② 프리셋 또는 ▶ 버튼&lt;/b&gt;으로 실행하면 → &lt;b class=&quot;green&quot;&gt;③ 여기에 설명&lt;/b&gt;이 나옵니다.&lt;/p&gt;&#x27;;setStatus(&#x27;info&#x27;,&#x27;먼저 위에서 예측을 하나 고른 뒤, 프리셋이나 ▶ 버튼을 누르세요.&#x27;);}
function pct(a,q){const s=[...a].sort((x,y)=&gt;x-y);const h=(s.length-1)*q/100,lo=Math.floor(h),hi=Math.ceil(h);return s[lo]+(s[hi]-s[lo])*(h-lo);}
function rng(seed){let t=seed&gt;&gt;&gt;0;return()=&gt;{t+=0x6D2B79F5;let r=Math.imul(t^t&gt;&gt;&gt;15,1|t);r^=r+Math.imul(r^r&gt;&gt;&gt;7,61|r);return((r^r&gt;&gt;&gt;14)&gt;&gt;&gt;0)/4294967296;};}


const ADDR_IN=&#x27;0x7f3a4c000000&#x27;, ADDR_OUT=&#x27;0x7f3a4c093000&#x27;;
const LOG=[0.412,-1.073,2.318,0.057,-0.660];   // 예시 logits 앞 5개
const STEP=[&#x27;① Runtime&#x27;,&#x27;② Context&#x27;,&#x27;③ 이름 · shape&#x27;,&#x27;④ GPU 버퍼&#x27;,&#x27;⑤ 주소&#x27;,&#x27;⑤ 실행&#x27;,&#x27;⑤ 기다리기&#x27;,&#x27;⑥ CPU 로&#x27;];
const CODE=[
 &#x27;RUNTIME = trt.Runtime(LOGGER)\nengine = RUNTIME.deserialize_cuda_engine(open(&quot;mnv3s_fp32.engine&quot;, &quot;rb&quot;).read())&#x27;,
 &#x27;context = engine.create_execution_context()&#x27;,
 &#x27;in_name, out_name = engine.get_tensor_name(0), engine.get_tensor_name(1)   &lt;span class=&quot;c&quot;&gt;# &quot;input&quot;, &quot;logits&quot;&lt;/span&gt;\nengine.get_tensor_shape(out_name)                                  &lt;span class=&quot;c&quot;&gt;# (1, 1000)&lt;/span&gt;&#x27;,
 &#x27;d_in = torch.from_numpy(x1).to(&quot;cuda&quot;)                            &lt;span class=&quot;c&quot;&gt;# ④ CPU → GPU 복사&lt;/span&gt;\nd_out = torch.empty((1, 1000), dtype=torch.float32, device=&quot;cuda&quot;)&#x27;,
 &#x27;context.set_tensor_address(in_name, d_in.data_ptr())              &lt;span class=&quot;c&quot;&gt;# ⑤ 주소 알려 주기&lt;/span&gt;\ncontext.set_tensor_address(out_name, d_out.data_ptr())&#x27;,
 &#x27;context.execute_async_v3(torch.cuda.current_stream().cuda_stream)  &lt;span class=&quot;c&quot;&gt;# ⑤ 실행 (비동기)&lt;/span&gt;&#x27;,
 &#x27;torch.cuda.synchronize()                                           &lt;span class=&quot;c&quot;&gt;#    끝날 때까지 기다리기&lt;/span&gt;&#x27;,
 &#x27;y_trt = d_out.cpu().numpy()                                        &lt;span class=&quot;c&quot;&gt;# ⑥ GPU → CPU&lt;/span&gt;\nprint(np.abs(y_trt - ref).max(), y_trt.argmax() == ref.argmax())&#x27;];
let k=0, prog=0, running=false, nosync=false, bad=0, result=null, runs=0, mode=&#x27;step&#x27;, anim=null;
function vec(v){return &#x27;[&#x27;+v.map(x=&gt;x.toFixed(3)).join(&#x27;, &#x27;)+&#x27;, …]&#x27;;}
function draw(){
  $(&#x27;#stl&#x27;).innerHTML=STEP.map((s,i)=&gt;`&lt;span class=&quot;${i&lt;k?&#x27;dn&#x27;:i===k?&#x27;on&#x27;:&#x27;&#x27;}&quot;&gt;${s}&lt;/span&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#aSel button&#x27;).forEach(b=&gt;b.classList.toggle(&#x27;sel&#x27;,+b.dataset.v===bad));$(&#x27;#cNoSync&#x27;).checked=nosync;
  const outState=prog&gt;=100?&#x27;done&#x27;:prog&gt;0?&#x27;run&#x27;:&#x27;empty&#x27;;
  $(&#x27;#cpuM&#x27;).innerHTML=`&lt;div class=&quot;buf ${k===4&amp;&amp;bad?&#x27;bad&#x27;:&#x27;&#x27;}&quot;&gt;x1 · float32 (1, 3, 224, 224)&lt;small&gt;NumPy — 입력 1장&lt;/small&gt;&lt;/div&gt;`+
    `&lt;div class=&quot;buf ${k&lt;8&amp;&amp;!result?&#x27;off&#x27;:result===&#x27;ok&#x27;?&#x27;good&#x27;:&#x27;bad&#x27;}&quot;&gt;y_trt&lt;small&gt;${result===&#x27;ok&#x27;?vec(LOG)+&#x27; · argmax = 2 &lt;span class=&quot;ex&quot;&gt;예시&lt;/span&gt;&#x27;:result?&#x27;아직 계산 전 값 — 비었거나 이전 값 ✗&#x27;:&#x27;—&#x27;}&lt;/small&gt;&lt;/div&gt;`;
  $(&#x27;#gpuM&#x27;).innerHTML=`&lt;div class=&quot;buf ${k&gt;=4?&#x27;good&#x27;:k===3?&#x27;hot&#x27;:&#x27;off&#x27;}&quot;&gt;d_in · ${ADDR_IN}&lt;small&gt;${k&gt;=4?&#x27;x1 복사본 (1, 3, 224, 224)&#x27;:&#x27;아직 없음&#x27;}&lt;/small&gt;&lt;/div&gt;`+
    `&lt;div class=&quot;buf ${k&lt;4?&#x27;off&#x27;:outState===&#x27;done&#x27;?&#x27;good&#x27;:outState===&#x27;run&#x27;?&#x27;hot&#x27;:&#x27;&#x27;}&quot;&gt;d_out · ${ADDR_OUT}&lt;small&gt;${k&lt;4?&#x27;아직 없음&#x27;:outState===&#x27;empty&#x27;?&#x27;torch.empty — 아무 값 (쓰레기)&#x27;:outState===&#x27;run&#x27;?&#x27;계산 중… &#x27;+Math.round(prog)+&#x27;%&#x27;:&#x27;logits &#x27;+vec(LOG)}&lt;/small&gt;&lt;/div&gt;`;
  const a1=k&gt;=5?(bad?&#x27;&lt;b class=&quot;bad1&quot;&gt;x1 (CPU 배열) ✗&lt;/b&gt;&#x27;:`&lt;b&gt;${ADDR_IN}&lt;/b&gt;`):&#x27;&lt;span class=&quot;dim&quot;&gt;?&lt;/span&gt;&#x27;,a2=k&gt;=5?`&lt;b&gt;${ADDR_OUT}&lt;/b&gt;`:&#x27;&lt;span class=&quot;dim&quot;&gt;?&lt;/span&gt;&#x27;;
  $(&#x27;#ctxV&#x27;).innerHTML=`&lt;span&gt;엔진&lt;/span&gt;&lt;b&gt;${k&gt;=1?&#x27;mnv3s_fp32.engine ✓&#x27;:&#x27;—&#x27;}&lt;/b&gt;&lt;span&gt;context&lt;/span&gt;&lt;b&gt;${k&gt;=2?&#x27;✓&#x27;:&#x27;—&#x27;}&lt;/b&gt;&lt;span&gt;&quot;input&quot; 주소&lt;/span&gt;${a1}&lt;span&gt;&quot;logits&quot; 주소&lt;/span&gt;${a2}`;
  $(&#x27;#pb&#x27;).style.width=prog+&#x27;%&#x27;;
  $(&#x27;#strmT&#x27;).textContent=&#x27;GPU stream: &#x27;+(prog&gt;=100?&#x27;완료 ✓&#x27;:prog&gt;0?&#x27;실행 중… (CPU 는 이미 다음 줄로)&#x27;:&#x27;대기&#x27;);
  $(&#x27;#cnt&#x27;).innerHTML=mode===&#x27;runner&#x27;?`버퍼 만든 횟수 &lt;b&gt;1&lt;/b&gt; · 주소 알려 준 횟수 &lt;b&gt;1&lt;/b&gt; · run(x) 호출 &lt;b&gt;${runs}&lt;/b&gt;`:&#x27;&#x27;;
  code();}
function code(){if(mode===&#x27;runner&#x27;){setCode(`def trt_runner(engine_path):
    eng = RUNTIME.deserialize_cuda_engine(open(engine_path, &quot;rb&quot;).read())
    ctx = eng.create_execution_context()
    …                                            &lt;span class=&quot;c&quot;&gt;# 이름 · shape&lt;/span&gt;
    d_i = torch.empty(…, device=&quot;cuda&quot;)          &lt;span class=&quot;c&quot;&gt;# 버퍼 — 한 번만&lt;/span&gt;
    d_o = torch.empty(…, device=&quot;cuda&quot;)
    ctx.set_tensor_address(i_name, d_i.data_ptr())   &lt;span class=&quot;c&quot;&gt;# 주소 — 한 번만&lt;/span&gt;
    ctx.set_tensor_address(o_name, d_o.data_ptr())

    def run(x):
        &lt;span class=&quot;hl&quot;&gt;d_i.copy_(torch.from_numpy(np.ascontiguousarray(x, dtype=np.float32)))&lt;/span&gt;
        &lt;span class=&quot;hl&quot;&gt;ctx.execute_async_v3(torch.cuda.current_stream().cuda_stream)&lt;/span&gt;
        &lt;span class=&quot;hl&quot;&gt;torch.cuda.synchronize()&lt;/span&gt;
        &lt;span class=&quot;hl&quot;&gt;return d_o.cpu().numpy()&lt;/span&gt;

    run.engine, run.context = eng, ctx
    return run`);return;}
  setCode(CODE.slice(0,k).map(c=&gt;c.replace(/ {3,}(&lt;span class=&quot;c&quot;&gt;)/g,&#x27;  $1&#x27;)).map((c,i)=&gt;{if(i===6&amp;&amp;nosync)return &#x27;&lt;span class=&quot;e&quot;&gt;# torch.cuda.synchronize()   ← 생략!&lt;/span&gt;&#x27;;
    if(i===4&amp;&amp;bad)c=c.replace(&#x27;d_in.data_ptr()&#x27;,&#x27;&lt;span class=&quot;e&quot;&gt;x1&lt;/span&gt;&#x27;);
    return i===k-1?c.split(&#x27;\n&#x27;).map(l=&gt;`&lt;span class=&quot;hl&quot;&gt;${l}&lt;/span&gt;`).join(&#x27;\n&#x27;):c;}).join(&#x27;\n&#x27;)||&#x27;&lt;span class=&quot;c&quot;&gt;# 다음 단계 ▶ 를 누르세요&lt;/span&gt;&#x27;);}
function gpuRun(ms){return new Promise(r=&gt;{const t0=performance.now();running=true;const f=()=&gt;{prog=Math.min(100,(performance.now()-t0)/(RM?80:ms)*100);draw();if(prog&lt;100)anim=requestAnimationFrame(f);else{running=false;r();}};f();});}
let gpuP=null;
async function next(){if(k&gt;=8)return;phase(1);
  if(k===4&amp;&amp;bad){k=5;draw();setStatus(&#x27;warn&#x27;,&#x27;✗ set_tensor_address 에 NumPy 배열 (CPU 메모리) 을 줌 → TensorRT 는 GPU 주소만 받습니다.\nCUDA 텐서의 data_ptr() 를 주세요. (위에서 &quot;d_in.data_ptr()&quot; 로 바꾸고 처음부터)&#x27;);window.__d4.badAddr=1;return;}
  k++;
  if(k===6){gpuP=gpuRun(1600);draw();setStatus(&#x27;info&#x27;,&#x27;execute_async_v3 → 바로 돌아옴 (True). GPU 는 이제 막 계산을 시작했습니다.&#x27;);
    if(nosync){await sleep(350);k=7;draw();setStatus(&#x27;info&#x27;,&#x27;synchronize 없음 → CPU 는 기다리지 않고 곧장 다음 줄로…&#x27;);await sleep(350);k=8;
      result=&#x27;stale&#x27;;draw();setStatus(&#x27;warn&#x27;,&#x27;✗ GPU 계산이 끝나기 전에 읽음 → y_trt 는 비어 있거나 이전 값!\n(시간을 쟀다면 &quot;시작 명령&quot; 시간만 잡혀 엄청 빠르게 보입니다)&#x27;);window.__d4.stale=1;await gpuP;draw();
      setStatus(&#x27;warn&#x27;,&#x27;✗ y_trt 는 계산 전 값 그대로 — GPU 는 그 뒤에야 끝났습니다 (d_out 만 채워짐).\n→ execute_async_v3 다음에 torch.cuda.synchronize()&#x27;);}
    return;}
  if(k===7){setStatus(&#x27;info&#x27;,&#x27;synchronize — GPU 가 끝날 때까지 CPU 가 기다림…&#x27;);await gpuP;draw();setStatus(&#x27;ok&#x27;,&#x27;GPU 계산 끝 ✓ — 이제 d_out 에 답이 들어 있음&#x27;);return;}
  if(k===8){result=&#x27;ok&#x27;;draw();setStatus(&#x27;ok&#x27;,&#x27;✅ y_trt — ORT CPU 출력 ref 와 최대 차이 &lt; 1e-3 · top-1 같음 (5-2 확인 셀)&#x27;);window.__d4.ok=1;return;}
  draw();setStatus(&#x27;info&#x27;,[&#x27;&#x27;,&#x27;엔진 파일 → Runtime 이 읽어 엔진 객체로 (빌드 때의 Builder 에 해당)&#x27;,&#x27;Context — 입출력 주소 등 실행 한 번의 상태. 엔진 하나로 여러 개 가능&#x27;,&#x27;이름은 export 때 붙인 그대로 — &quot;input&quot; (1,3,224,224) · &quot;logits&quot; (1,1000)&#x27;,&#x27;GPU 에 입력 복사본 d_in + 출력 자리 d_out (아직 아무 값)&#x27;,&#x27;Context 에 GPU 주소 두 개 알려 주기&#x27;][k]);}
function reset(){if(anim)cancelAnimationFrame(anim);k=0;prog=0;result=null;mode=&#x27;step&#x27;;runs=0;draw();}
$(&#x27;#bNext&#x27;).onclick=()=&gt;{if(!busy){busy=true;next().finally(()=&gt;busy=false);}};
$(&#x27;#bReset&#x27;).onclick=()=&gt;{if(busy)return;reset();setStatus(&#x27;info&#x27;,&#x27;처음부터 — 다음 단계 ▶&#x27;);};
$(&#x27;#cNoSync&#x27;).onchange=e=&gt;{if(busy){e.target.checked=nosync;return;}nosync=e.target.checked;reset();setStatus(&#x27;info&#x27;,nosync?&#x27;synchronize 생략 모드 — 다음 단계 ▶ 로 끝까지 가 보세요&#x27;:&#x27;synchronize 포함 (정상)&#x27;);};
$$(&#x27;#aSel button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(busy)return;bad=+b.dataset.v;reset();setStatus(bad?&#x27;warn&#x27;:&#x27;info&#x27;,bad?&#x27;실수 모드: 입력 주소로 NumPy 배열을 줍니다 — ⑤ 까지 가 보세요&#x27;:&#x27;정상: CUDA 텐서의 data_ptr()&#x27;);});
async function all(){reset();await sleep(300);while(k&lt;8){await next();if(k===5&amp;&amp;bad)break;await sleep(k===6?500:700);}}
function stop(){if(anim)cancelAnimationFrame(anim);}
const P=[
 {n:&#x27;① 여섯 단계 (정상)&#x27;,ex:&#x27;&lt;p&gt;① Runtime 으로 엔진 읽기 → ② Context → ③ 이름 · shape (&lt;code&gt;get_tensor_name&lt;/code&gt;) → ④ GPU 버퍼 (&lt;code&gt;.to(&quot;cuda&quot;)&lt;/code&gt;, &lt;code&gt;torch.empty(..., device=&quot;cuda&quot;)&lt;/code&gt;) → ⑤ &lt;b&gt;주소&lt;/b&gt; 알려 주기 · 실행 · &lt;b&gt;기다리기&lt;/b&gt; → ⑥ &lt;code&gt;.cpu().numpy()&lt;/code&gt; 로 가져와 비교.&lt;/p&gt;&lt;p&gt;이름 &quot;input&quot; · &quot;logits&quot; 는 Day 1 export 때 붙인 그대로 — TensorRT 도 이름으로 찾습니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{nosync=false;bad=0;await all();}},
 {n:&#x27;② 기다리지 않고 읽기&#x27;,ex:&#x27;&lt;p&gt;&lt;code&gt;execute_async_v3&lt;/code&gt; 는 GPU 에 &quot;시작해 둬&quot; 만 하고 &lt;b&gt;바로 돌아옵니다&lt;/b&gt; (비동기). 끝나기 전에 출력 자리를 보면 &lt;b class=&quot;red&quot;&gt;비어 있거나 이전 값&lt;/b&gt;일 수 있습니다.&lt;/p&gt;&lt;p&gt;PyTorch 의 &lt;code&gt;.cpu()&lt;/code&gt; 는 같은 stream 이면 알아서 기다려 주지만, &lt;b&gt;시간을 잴 때&lt;/b&gt; synchronize 를 빼면 실행이 끝나기 전 시간이 잡혀 엄청 빠르게 보입니다 → &lt;code&gt;synchronize&lt;/code&gt; 를 명시하는 습관.&lt;/p&gt;&#x27;,
  run:async()=&gt;{nosync=true;bad=0;await all();judge(1,&#x27;비동기 실행이 끝나기 전이라 출력 자리는 아직 비었거나 이전 값입니다. synchronize 후에 읽기.&#x27;);}},
 {n:&#x27;③ 실수: NumPy 주소&#x27;,ex:&#x27;&lt;p&gt;⚠️ NumPy 배열을 &lt;code&gt;set_tensor_address&lt;/code&gt; 에 넣으면 안 됩니다 — TensorRT 는 &lt;b&gt;GPU 주소&lt;/b&gt;만 받습니다. CUDA 텐서의 &lt;code&gt;data_ptr()&lt;/code&gt;.&lt;/p&gt;&lt;p&gt;⚠️ 입력을 &lt;code&gt;float64&lt;/code&gt; 로 넣는 것도 흔한 실수 — &lt;code&gt;np.random.rand&lt;/code&gt; 의 기본은 float64 → &lt;code&gt;.astype(np.float32)&lt;/code&gt;.&lt;/p&gt;&#x27;,
  run:async()=&gt;{nosync=false;bad=1;await all();}},
 {n:&#x27;④ trt_runner — 버퍼 한 번&#x27;,ex:&#x27;&lt;p&gt;&lt;code&gt;trt_runner(engine_path)&lt;/code&gt; 는 엔진 · Context · 버퍼 · 주소를 &lt;b&gt;한 번만&lt;/b&gt; 준비하고, &lt;code&gt;run(x)&lt;/code&gt; 는 &lt;b&gt;복사 → 실행 → 기다리기 → 가져오기&lt;/b&gt; 네 줄만 — 그래서 빠릅니다.&lt;/p&gt;&lt;p&gt;⚠️ 실행할 때마다 &lt;code&gt;torch.empty(..., device=&quot;cuda&quot;)&lt;/code&gt; 를 새로 만들고 주소를 다시 알려 주면 느립니다. 배치 1 고정 엔진이라 x 크기가 다르면 &lt;code&gt;copy_&lt;/code&gt; 에서 오류.&lt;/p&gt;&#x27;,
  run:async()=&gt;{nosync=false;bad=0;reset();mode=&#x27;runner&#x27;;k=5;draw();for(let i=0;i&lt;3;i++){runs++;result=null;prog=0;draw();setStatus(&#x27;info&#x27;,`run(x${i+1}) — 복사 → 실행 → 기다리기 → 가져오기 (버퍼 · 주소는 그대로)`);await gpuRun(700);result=&#x27;ok&#x27;;draw();await sleep(500);}

&lt;h1&gt;FP32 vs FP16 — 숫자 하나를 16비트에 담으면&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;FP16 은 숫자 하나를 2바이트에 저장합니다 — 메모리 절반, T4 Tensor Core 로 빠른 계산. 대신 &lt;b style=&quot;color:var(--amber)&quot;&gt;범위&lt;/b&gt; (최대 65504) 와 &lt;b style=&quot;color:var(--amber)&quot;&gt;정밀도&lt;/b&gt; (유효숫자 약 3자리) 가 줄어듭니다. 아래에 아무 숫자나 넣어 FP16 비트와 실제 저장되는 값을 확인하세요 — &lt;code&gt;np.float16(v)&lt;/code&gt; 와 같은 반올림 (가장 가까운 값, 동률이면 짝수).&lt;/p&gt;

const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];
const RM=window.matchMedia&amp;&amp;window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,RM?Math.min(ms,80):ms));
let busy=false, timer=null;
function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}
function setCode(h){$(&#x27;#code&#x27;).innerHTML=h;}
function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const g=c.getContext(&#x27;2d&#x27;);g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}

  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}
const esc=s=&gt;String(s).replace(/&amp;/g,&#x27;&amp;amp;&#x27;).replace(/&lt;/g,&#x27;&amp;lt;&#x27;).replace(/&gt;/g,&#x27;&amp;gt;&#x27;);

let guess=null, predOpts=[];
function initPredict(q,opts){predOpts=opts;guess=null;
  $(&#x27;#pred&#x27;).innerHTML=`&lt;div class=&quot;steps3&quot;&gt;&lt;span class=&quot;on&quot; id=&quot;st1&quot;&gt;① 예측&lt;/span&gt;&lt;span id=&quot;st2&quot;&gt;② 실행&lt;/span&gt;&lt;span id=&quot;st3&quot;&gt;③ 설명&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;pq&quot;&gt;${q}&lt;/div&gt;&lt;div class=&quot;seg&quot; id=&quot;predOpts&quot;&gt;${opts.map((o,i)=&gt;`&lt;button type=&quot;button&quot; data-i=&quot;${i}&quot;&gt;${o}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;pv&quot; id=&quot;predV&quot;&gt;먼저 하나를 고른 뒤 실행 ▶ 하세요. (안 골라도 실행은 됩니다)&lt;/div&gt;`;
  $$(&#x27;#predOpts button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{guess=+b.dataset.i;$$(&#x27;#predOpts button&#x27;).forEach(x=&gt;{x.classList.toggle(&#x27;sel&#x27;,x===b);x.classList.remove(&#x27;ok&#x27;,&#x27;bad&#x27;);});
    const v=$(&#x27;#predV&#x27;);v.className=&#x27;pv&#x27;;v.textContent=&#x27;예측: &#x27;+opts[guess]+&#x27; → 이제 실행해서 확인&#x27;;phase(1);});}
function phase(k){[&#x27;#st1&#x27;,&#x27;#st2&#x27;,&#x27;#st3&#x27;].forEach((s,i)=&gt;{const e=$(s);if(e)e.classList.toggle(&#x27;on&#x27;,i===k);});}
function judge(ans,why){$$(&#x27;#predOpts button&#x27;).forEach((b,i)=&gt;{b.classList.toggle(&#x27;ok&#x27;,i===ans);b.classList.toggle(&#x27;bad&#x27;,i===guess&amp;&amp;i!==ans);});
  const v=$(&#x27;#predV&#x27;);v.className=&#x27;pv &#x27;+(guess===null?&#x27;&#x27;:guess===ans?&#x27;ok&#x27;:&#x27;bad&#x27;);
  v.innerHTML=(guess===null?&#x27;정답: &#x27;:guess===ans?&#x27;✅ 예측 적중 — &#x27;:&#x27;❌ 예측과 다름 — &#x27;)+&#x27;&lt;b&gt;&#x27;+predOpts[ans]+&#x27;&lt;/b&gt;. &#x27;+why;phase(2);window.__d4.judged=(window.__d4.judged||0)+1;}
function ready(){$(&#x27;#explain&#x27;).innerHTML=&#x27;&lt;p&gt;&lt;b class=&quot;amber&quot;&gt;① 예측&lt;/b&gt;을 먼저 고르고 → &lt;b class=&quot;teal&quot;&gt;② 프리셋 또는 ▶ 버튼&lt;/b&gt;으로 실행하면 → &lt;b class=&quot;green&quot;&gt;③ 여기에 설명&lt;/b&gt;이 나옵니다.&lt;/p&gt;&#x27;;setStatus(&#x27;info&#x27;,&#x27;먼저 위에서 예측을 하나 고른 뒤, 프리셋이나 ▶ 버튼을 누르세요.&#x27;);}
function pct(a,q){const s=[...a].sort((x,y)=&gt;x-y);const h=(s.length-1)*q/100,lo=Math.floor(h),hi=Math.ceil(h);return s[lo]+(s[hi]-s[lo])*(h-lo);}
function rng(seed){let t=seed&gt;&gt;&gt;0;return()=&gt;{t+=0x6D2B79F5;let r=Math.imul(t^t&gt;&gt;&gt;15,1|t);r^=r+Math.imul(r^r&gt;&gt;&gt;7,61|r);return((r^r&gt;&gt;&gt;14)&gt;&gt;&gt;0)/4294967296;};}


// ── FP16 반올림: double → half (round-to-nearest-even), np.float16 과 같은 규칙 ──
function rne(v){const f=Math.floor(v),d=v-f;return d&gt;0.5?f+1:d&lt;0.5?f:(f%2===0?f:f+1);}

  if(e&lt;-14){const q=rne(a/2**-24);                       // 비정규 (subnormal)

function f32bits(x){const dv=new DataView(new ArrayBuffer(4));dv.setFloat32(0,x);return dv.getUint32(0);}
function bitHTML(b,n,ne){let h=&#x27;&#x27;;for(let i=n-1;i&gt;=0;i--){const bit=(b&gt;&gt;&gt;i)&amp;1;const pos=n-1-i;const c=pos===0?&#x27;s&#x27;:pos&lt;=ne?&#x27;e&#x27;:&#x27;m&#x27;;h+=`&lt;span class=&quot;${c}&quot;&gt;${bit}&lt;/span&gt;`;if(pos===0||pos===ne)h+=&#x27;&lt;span class=&quot;gap&quot;&gt;&lt;/span&gt;&#x27;;}return h;}
const pyf=v=&gt;{if(!isFinite(v))return Number.isNaN(v)?&#x27;nan&#x27;:(v&lt;0?&#x27;-inf&#x27;:&#x27;inf&#x27;);if(v===0)return Object.is(v,-0)?&#x27;-0.0&#x27;:&#x27;0.0&#x27;;

function show(raw){const v=Number(String(raw).trim());if(String(raw).trim()===&#x27;&#x27;||Number.isNaN(v)){setStatus(&#x27;warn&#x27;,&#x27;숫자를 넣으세요 (예: 0.1, 1000.3, 7e4)&#x27;);return null;}

    let s=&#x27;&lt;div class=&quot;ax&quot;&gt;&lt;/div&gt;&#x27;;for(let j=-2;j&lt;=2;j++){const t=hv+j*ulp;if(Math.abs(t)&gt;65504)continue;s+=`&lt;div class=&quot;tk ${j===0?&#x27;cur&#x27;:&#x27;&#x27;}&quot; style=&quot;left:${X(t)}&quot;&gt;&lt;/div&gt;`;if(j%2===0)s+=`&lt;div class=&quot;lb ${j===0?&#x27;cur&#x27;:&#x27;&#x27;}&quot; style=&quot;${j&lt;0?&#x27;left:0;transform:none&#x27;:j&gt;0?&#x27;left:auto;right:0;transform:none&#x27;:&#x27;left:&#x27;+X(t)}&quot;&gt;${pyf(t)}&lt;/div&gt;`;}
    const xp=Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100));s+=`&lt;div class=&quot;x&quot; style=&quot;left:${xp}%&quot;&gt;&lt;/div&gt;`;
    $(&#x27;#nl&#x27;).innerHTML=s+`&lt;div class=&quot;lb&quot; style=&quot;left:50%;top:0;transform:translateX(-50%);display:none&quot;&gt;&lt;/div&gt;`;
    $(&#x27;#nl&#x27;).title=&#x27;눈금 간격 &#x27;+ulp;}
  else $(&#x27;#nl&#x27;).innerHTML=`&lt;div class=&quot;ax&quot;&gt;&lt;/div&gt;&lt;div class=&quot;lb&quot; style=&quot;left:50%;top:6px;color:var(--red)&quot;&gt;${isFinite(hv)?&#x27;0 — 너무 작아 0 이 됨 (&lt; 2⁻²⁵)&#x27;:&#x27;눈금 없음 — FP16 으로 표현할 수 없음 → inf&#x27;}&lt;/div&gt;`;

  const av=Math.abs(v);$(&#x27;#rbar&#x27;).innerHTML=`&lt;i style=&quot;left:${L(6e-8)}%;width:${L(65504)-L(6e-8)}%;background:#2f5a3699&quot;&gt;&lt;/i&gt;&lt;i style=&quot;left:${L(65504)}%;width:${100-L(65504)}%;background:#2a5a8a66&quot;&gt;&lt;/i&gt;${av&gt;0?`&lt;u style=&quot;left:${L(av)}%&quot;&gt;&lt;/u&gt;`:&#x27;&#x27;}`;

function code(raw,hv){setCode(`&lt;span class=&quot;c&quot;&gt;# 6-1  FP16 손으로 만져 보기&lt;/span&gt;
for v in [0.1, 3.14159265, 1000.3, 70000.0]:
    print(f&quot;{v:&gt;12} → FP16 {float(np.&lt;span class=&quot;hl&quot;&gt;float16&lt;/span&gt;(v))!r}&quot;)
&lt;span class=&quot;b&quot;&gt;#  0.1        → FP16 0.0999755859375&lt;/span&gt;
&lt;span class=&quot;b&quot;&gt;#  3.14159265 → FP16 3.140625&lt;/span&gt;
&lt;span class=&quot;b&quot;&gt;#  1000.3     → FP16 1000.5&lt;/span&gt;
&lt;span class=&quot;b&quot;&gt;#  70000.0    → FP16 inf&lt;/span&gt;
fi = np.finfo(np.float16)
print(&quot;FP16 최대:&quot;, fi.max, &quot;| eps:&quot;, fi.eps, &quot;| FP32 eps:&quot;, np.finfo(np.float32).eps)
&lt;span class=&quot;b&quot;&gt;# FP16 최대: 65504.0 | eps: 0.000977 | FP32 eps: 1.1920929e-07&lt;/span&gt;

&lt;span class=&quot;a&quot;&gt;float(np.float16(${esc(String(raw).trim())}))&lt;/span&gt;  &lt;span class=&quot;c&quot;&gt;# →&lt;/span&gt; &lt;span class=&quot;${isFinite(hv)?&#x27;g&#x27;:&#x27;e&#x27;}&quot;&gt;${pyf(hv)}&lt;/span&gt;`);}
async function play(raw,msg){$(&#x27;#inV&#x27;).value=raw;phase(1);await sleep(250);const r=show(raw);if(!r)return;await sleep(350);
  setStatus(isFinite(r.hv)?(r.hv===r.v?&#x27;ok&#x27;:&#x27;info&#x27;):&#x27;warn&#x27;,msg?msg(r):(isFinite(r.hv)?`${raw} → FP16 ${pyf(r.hv)}${r.ulp16?` · 이 근처 눈금 간격 ${r.ulp16}`:&#x27;&#x27;}`:`${raw} → inf · 65504 를 넘으면 FP16 으로 표현할 수 없음`));}
$(&#x27;#bConv&#x27;).onclick=()=&gt;{if(!busy){busy=true;play($(&#x27;#inV&#x27;).value).finally(()=&gt;busy=false);}};

$$(&#x27;#chips button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(!busy){busy=true;play(b.dataset.v).finally(()=&gt;busy=false);}});
function stop(){}
const P=[
 {n:&#x27;① 0.1&#x27;,ex:&#x27;&lt;p&gt;0.1 은 이진수로 끝없이 이어지는 수라 FP32 도 정확히 담지 못합니다. FP16 은 가수가 10비트뿐이라 &lt;b class=&quot;amber&quot;&gt;0.0999755859375&lt;/b&gt; — 오차 약 2.4e-5.&lt;/p&gt;&#x27;,
  run:async()=&gt;play(&#x27;0.1&#x27;)},
 {n:&#x27;② 3.14159265&#x27;,ex:&#x27;&lt;p&gt;π 는 FP16 으로 &lt;b class=&quot;amber&quot;&gt;3.140625&lt;/b&gt;. 2 ~ 4 사이의 눈금 간격은 2⁻⁹ = 0.00195 — 소수점 아래 셋째 자리에서 이미 틀립니다. &lt;b&gt;유효숫자 약 3자리&lt;/b&gt;.&lt;/p&gt;&#x27;,
  run:async()=&gt;play(&#x27;3.14159265&#x27;)},
 {n:&#x27;③ 1000.3&#x27;,ex:&#x27;&lt;p&gt;지수가 커질수록 눈금 간격도 커집니다. 512 ~ 1024 사이는 간격 &lt;b&gt;0.5&lt;/b&gt; → 1000.3 은 가장 가까운 눈금 &lt;b class=&quot;amber&quot;&gt;1000.5&lt;/b&gt; 로.&lt;/p&gt;&lt;p&gt;상대 오차로 보면 약 2e-4 — eps (2⁻¹⁰ ≈ 0.000977) 의 절반 이하입니다. FP16 은 &lt;b&gt;상대적으로&lt;/b&gt; 3자리 정도를 지킵니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{await play(&#x27;1000.3&#x27;);judge(2,&#x27;512 ~ 1024 사이 FP16 눈금 간격은 0.5 — 1000.3 에서 가장 가까운 눈금은 1000.5 입니다.&#x27;);}},
 {n:&#x27;④ 70000 → inf&#x27;,ex:&#x27;&lt;p&gt;FP16 최대는 &lt;b class=&quot;amber&quot;&gt;65504&lt;/b&gt;. 이를 넘으면 (정확히는 65520 이상이면 반올림 결과가) &lt;b class=&quot;red&quot;&gt;inf&lt;/b&gt;. 지수 5비트의 한계입니다 — FP32 는 약 3.4e38 까지.&lt;/p&gt;&lt;p&gt;신경망의 활성값 · 가중치는 대부분 이 범위 안이라 FP16 으로도 결과가 거의 같지만, &lt;b&gt;&quot;거의&quot; 를 꼭 재 봐야&lt;/b&gt; 합니다 (3교시 · 6-3).&lt;/p&gt;&#x27;,

  run:async()=&gt;{await play(&#x27;1.0009765625&#x27;);await sleep(1200);await play(&#x27;1.0004&#x27;,r=&gt;`1.0004 → ${pyf(r.hv)} — 1 과 1.0009765625 사이라 가까운 1 로`);}},
];

&lt;div class=&quot;app&quot;&gt;

&lt;h1&gt;레이어 합치기 — 왜 빨라졌나&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;MobileNetV3 블록 하나의 ONNX 노드가 엔진에서 어떻게 합쳐지는지 봅니다. 합치기 규칙을 켜고 끄며 &lt;b style=&quot;color:var(--blue)&quot;&gt;노드 수&lt;/b&gt; vs &lt;b style=&quot;color:var(--amber)&quot;&gt;레이어 수&lt;/b&gt;, 그리고 레이어 사이의 &lt;b&gt;GPU 메모리 왕복&lt;/b&gt;이 어떻게 줄어드는지 확인하세요. 합쳐진 레이어의 이름은 원래 노드 이름을 &lt;code&gt;&quot; + &quot;&lt;/code&gt; 로 이어 붙인 모양입니다.&lt;/p&gt;
&lt;div class=&quot;gpuex&quot;&gt;⚠ &lt;span&gt;&lt;b&gt;엔진 레이어 구성 · 이름은 예시 (개념도)&lt;/b&gt; — 실제로 무엇이 합쳐지는지 · 레이어가 몇 개인지는 TensorRT 버전 · GPU 마다 다릅니다. 실제 값은 Colab T4 에서 노트북 7-1 · 7-2 로 확인하세요. (mnv3s ONNX 노드 127개는 검증 값)&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill blue&quot;&gt;ONNX 노드 127개 (mnv3s_b1)&lt;/span&gt;&lt;span class=&quot;pill amber&quot;&gt;&quot;Conv + HardSwish&quot;&lt;/span&gt;&lt;span class=&quot;pill purple&quot;&gt;Reformatting CopyNode&lt;/span&gt;&lt;span class=&quot;pill green&quot;&gt;create_engine_inspector → JSON&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;

&lt;div class=&quot;grid&quot;&gt;

  &lt;/div&gt;
  &lt;div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;Python (노트북 7-1 · 7-2)&lt;/h2&gt;&lt;div class=&quot;code&quot; id=&quot;code&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;상태&lt;/h2&gt;&lt;div class=&quot;status info&quot; id=&quot;status&quot;&gt;프리셋을 누르세요.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;빨라진 이유 세 가지 (7교시 정리)&lt;/h2&gt;
  &lt;div class=&quot;why&quot;&gt;&lt;div class=&quot;fb&quot; id=&quot;w0&quot;&gt;&lt;b&gt;① 레이어 합치기&lt;/b&gt;&lt;small&gt;중간 결과의 메모리 왕복 ↓&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; id=&quot;w1&quot;&gt;&lt;b&gt;② 직접 재 보고 고른 커널&lt;/b&gt;&lt;small&gt;이 GPU 에서 가장 빠른 tactic&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot; id=&quot;w2&quot;&gt;&lt;b&gt;③ FP16 + Tensor Core&lt;/b&gt;&lt;small&gt;6교시&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;⚠️ 레이어 수가 적을수록 무조건 빠르다고 단정하지 마세요 — 합치기 · 커널 선택 · FP16 이 함께 작용합니다. 결국 bench 로 확인. ⚠️ &lt;code&gt;profiling_verbosity = DETAILED&lt;/code&gt; 없이 빌드한 엔진은 이름만 나오고 &lt;code&gt;LayerType&lt;/code&gt; 이 없습니다.&lt;/div&gt;
