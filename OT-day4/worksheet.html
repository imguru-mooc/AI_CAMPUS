<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONNX·TensorRT Day 4 — TensorRT 첫걸음 · 개념 워크시트</title>
<style>
  :root{--bg:#0b1220;--panel:#111a2e;--line:#1f2b45;--text:#dbe4f0;--dim:#8a9bb8;--amber:#f5b942;--teal:#2dd4bf;--blue:#60a5fa;--green:#4ade80;--red:#f87171;--purple:#c084fc;--mono:"Consolas","D2Coding","JetBrains Mono",monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR","Segoe UI",sans-serif;font-size:15px;line-height:1.55}
  .app{max-width:920px;margin:0 auto;padding:22px 20px 40px}
  h1{color:var(--amber);font-size:24px;margin:0 0 6px}
  .sub{color:var(--dim);margin:0 0 14px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
  .panel h2{font-size:14px;color:var(--dim);margin:0 0 10px;font-weight:600}
  button{background:#172239;border:1px solid #2a3a5c;color:var(--text);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--amber)}button.active{background:#3a2e12;border-color:var(--amber);color:var(--amber)}
  button.primary{background:#123d33;border-color:var(--teal);color:var(--teal);font-weight:700;padding:9px 18px;font-size:14px}
  button.submit{background:#3a2e12;border-color:var(--amber);color:var(--amber);font-weight:700;padding:9px 18px;font-size:14px}
  button:disabled{opacity:.5;cursor:default}
  button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  input[type=text]{background:#0a0f1c;color:var(--text);border:1px solid #2a3a5c;border-radius:6px;padding:6px 10px;font-family:var(--mono);font-size:14px}
  select{background:#0a0f1c;color:var(--text);border:1px solid #2a3a5c;border-radius:6px;padding:4px 8px;font-family:inherit;font-size:14px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px}
  .tabs button .s{font-family:var(--mono);font-size:11px;color:var(--dim);margin-left:6px}
  .tabs button.graded .s{color:var(--green)}
  .legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .tag{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--dim);font-family:var(--mono)}
  .head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .head .t{color:var(--amber);font-size:17px}
  .head .a{font-size:13px;color:var(--teal);font-family:var(--mono)}
  .q{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;background:#0e1628}
  .q.unans{border-color:#5a3a1a}
  .q.ok{border-color:#1f6b45}.q.bad{border-color:#7a2e2e}
  .qh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .q .n{font-family:var(--mono);color:var(--dim);font-size:12px}
  .ty{font-size:11.5px;border-radius:999px;padding:1px 9px;border:1px solid}
  .q .p{margin:6px 0 10px;font-size:15px}
  .q code,.fb code,.dg code{font-family:var(--mono);color:var(--blue);background:#0a0f1c;padding:1px 5px;border-radius:4px}
  .q pre{font-family:var(--mono);background:#0a0f1c;border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:6px 0 4px;font-size:14px;white-space:pre;overflow-x:auto;line-height:1.9}
  .q pre input{font-size:13px;padding:2px 6px;width:auto;min-width:5ch}
  .opts{display:grid;gap:6px}
  .opt{text-align:left;padding:8px 12px;font-size:14px}
  .opt .box{display:inline-block;width:18px;font-family:var(--mono);color:var(--dim)}
  .opt.sel{border-color:var(--amber);background:#1f1a0c}
  .opt.ok{border-color:var(--green);color:var(--green);background:#0d2216}
  .opt.bad{border-color:var(--red);color:var(--red);background:#2a1212}
  .opt.miss{border-color:var(--green);border-style:dashed}
  .ox{display:flex;gap:10px}
  .ox button{font-size:22px;width:78px;height:54px;font-weight:700}
  .fill{line-height:2.3}
  .mrow{display:grid;grid-template-columns:1fr 24px minmax(160px,1.2fr);gap:8px;align-items:center;margin-bottom:6px}
  .mrow .l{background:#0a0f1c;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:14px}
  .mrow select{width:100%}
  .mrow .arr{color:var(--dim);text-align:center}
  .mrow.ok select{border-color:var(--green)}.mrow.bad select{border-color:var(--red)}
  .ord{list-style:none;margin:0;padding:0;display:grid;gap:6px}
  .ord li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;background:#0a0f1c;border:1px solid #2a3a5c;border-radius:8px;padding:7px 10px;cursor:grab;font-size:14px}
  .ord li.drag{opacity:.4}.ord li.over{border-color:var(--amber)}
  .ord li .k{font-family:var(--mono);color:var(--dim)}
  .ord li .mv button{padding:2px 8px;margin-left:4px}
  .ord li.ok{border-color:var(--green)}.ord li.bad{border-color:var(--red)}
  .hot{background:#0a0f1c;border:1px solid var(--line);border-radius:8px;padding:6px;overflow-x:auto}
  .hot svg{display:block;max-width:100%;height:auto;margin:0 auto}
  .hot .rg{cursor:pointer;fill:transparent;stroke:transparent;stroke-width:2.5}
  .hot .rg:hover{stroke:#f5b94288}
  .hot .rg.sel{stroke:var(--amber);fill:#f5b94222}
  .hot .rg.ok{stroke:var(--green);fill:#4ade8026}
  .hot .rg.bad{stroke:var(--red);fill:#f8717126}
  .card{perspective:900px;max-width:560px}
  .card .in{position:relative;min-height:130px;transition:transform .5s;transform-style:preserve-3d}
  .card.flip .in{transform:rotateY(180deg)}
  .card .f,.card .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;border:1px solid #2a3a5c;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px 18px;font-size:16px}
  .card .f{background:#14203a;color:var(--amber)}
  .card .b{background:#0f2a27;color:var(--teal);transform:rotateY(180deg)}
  @media (prefers-reduced-motion:reduce){.card .in{transition:none}}
  .selfrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
  .selfrow .hint{margin-left:4px}
  .fb{margin-top:10px;font-size:13px;color:var(--dim);border-left:3px solid var(--line);padding-left:10px}
  .fb.ok{border-left-color:var(--green)}.fb.bad{border-left-color:var(--red)}
  .fb b.v{display:block;margin-bottom:2px}
  .fb.ok b.v{color:var(--green)}.fb.bad b.v{color:var(--red)}
  .fb .anim{color:var(--teal);font-family:var(--mono);font-size:12px;display:block;margin-top:3px}
  .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
  .code{font-family:var(--mono);font-size:20px;color:var(--amber);letter-spacing:1px}
  .score{font-family:var(--mono);color:var(--green);font-size:16px}
  .hint{color:var(--dim);font-size:13px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:0;max-width:860px;width:92vw;max-height:88vh}
  dialog::backdrop{background:#000a}
  .dg{padding:18px 20px}
  .dg h3{color:var(--amber);margin:0 0 4px;font-size:20px}
  .dg .meta{color:var(--dim);font-size:13px;margin-bottom:12px;font-family:var(--mono)}
  .dg .sec{margin:14px 0 6px;color:var(--teal);font-weight:700;font-size:14px}
  .dg table{width:100%;border-collapse:collapse;font-size:13px}
  .dg th{text-align:left;color:var(--dim);font-weight:600;padding:5px 8px;border-bottom:1px solid var(--line);font-size:12px}
  .dg td{padding:5px 8px;border-bottom:1px solid #16203a;vertical-align:top}
  .dg .ok{color:var(--green)}.dg .bad{color:var(--red)}.dg .none{color:var(--dim)}
  .dg .sum{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0;font-family:var(--mono)}
  .dgbar{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 20px;display:flex;gap:8px;justify-content:flex-end;align-items:center}
  .toast{color:var(--green);font-size:13px;margin-right:auto}
  .body{overflow:auto;max-height:calc(88vh - 60px)}
  @media(max-width:600px){.mrow{grid-template-columns:1fr;gap:4px}.mrow .arr{display:none}}
</style>
</head>
<body>
<div class="app">
  <h1>ONNX·TensorRT Day 4 — TensorRT 첫걸음 · 개념 워크시트</h1>
  <p class="sub">교시마다 10문항 — 객관식 · O/X · 빈칸 · 짝 맞추기 · 순서 배열 · 핫스팟 · 코드 완성 등 9가지 유형이 섞여 나옵니다. 답을 고른 뒤 아래 <b style="color:var(--teal)">채점하기</b>를 누르면 정오 · 해설과 결과 코드가 나타납니다. 채점 전에는 답을 바꿀 수 있고, 채점 후에는 잠깁니다. 모든 교시를 마치면 <b style="color:var(--amber)">제출</b>로 오답 정리를 열고, <b>캡처</b>로 복사해 노션에 붙여 넣으세요.</p>

  <div class="panel">
    <div class="row"><label style="color:var(--dim);font-size:13px">이름 <input type="text" id="name" placeholder="홍길동"></label><span class="hint">이름은 결과 코드 계산에만 쓰이며 저장되지 않습니다.</span></div>
  </div>
  <div class="panel"><h2>교시</h2><div class="tabs" id="tabs"></div><div class="legend" id="legend"></div></div>
  <div class="panel" id="sheet"></div>
  <div class="panel">
    <div class="actions">
      <button class="primary" id="gradeBtn">채점하기</button>
      <span class="score" id="rscore"></span>
      <span class="hint" id="rhint"></span>
      <span class="code" id="rcode">—</span>
    </div>
    <div class="actions" style="margin-top:12px">
      <button class="submit" id="submitBtn">제출 (오답 정리)</button>
      <button id="resetBtn">이 교시 다시 풀기</button>
    </div>
  </div>
</div>

<dialog id="dlg">
  <div class="body"><div class="dg" id="dgBody"></div></div>
  <div class="dgbar"><span class="toast" id="toast"></span><button id="captureBtn" class="primary">📋 캡처 (노션용 복사)</button><button id="closeBtn">닫기</button></div>
</dialog>

<script>
const Q = [{"t": "1교시 · TensorRT 란 · 엔진은 이 GPU 전용 · 고정 크기 ONNX", "anim": "D4-1 설계도 · 기계 · 완성품", "qs": [{"type": "single", "p": "오늘의 비유에서 <b>TensorRT 엔진</b> (<code>.engine</code>) 에 해당하는 것은?", "o": ["설계도 — 어느 장치에서나 읽는 표준 모델 파일", "범용 기계 — 설계도를 읽어 바로 돌린다", "완성품 — 이 GPU 전용으로 다시 조립했다", "공장 — 데이터로 모델을 학습시킨다"], "a": 2, "w": "ONNX = 설계도 · ONNX Runtime = 읽어서 바로 돌리는 기계 · TensorRT 엔진 = <b>이 GPU 전용 완성품</b>.", "an": "1교시 · 📌 정리"}, {"type": "single", "p": "ONNX Runtime 과 TensorRT 는 <b>언제 최적화하는가</b>가 다릅니다. 옳은 것은?", "o": ["ORT 는 세션 생성 때, TensorRT 는 빌드 때 한 번 최적화한다", "둘 다 <code>run</code> 을 부를 때마다 그래프를 처음부터 다시 최적화한다", "ORT 는 빌드 때 한 번, TensorRT 는 실행할 때마다 다시 최적화한다", "TensorRT 는 최적화 없이 ONNX 그래프를 그대로 실행한다"], "a": 0, "w": "ORT 는 세션을 만들 때 정해진 규칙으로 합치고 (메모리 안에만), TensorRT 는 빌드 때 한 번 — 규칙 + <b>이 GPU 에서 커널 후보를 직접 재 보고</b> 고른 결과를 파일로 남깁니다.", "an": "1교시 · ORT vs TensorRT 표"}, {"type": "multi", "p": "TensorRT 엔진 파일에 대해 옳은 것을 모두 고르세요.", "o": ["만든 GPU 의 <b>compute capability</b> (세대 번호) 에 묶인다", "같은 GPU 라도 TensorRT 버전이 다르면 다시 빌드해야 한다", "NVIDIA GPU 라면 어느 세대에서든 그대로 읽힌다", "배포할 때는 <code>.onnx</code> 를 가져가 그 장치에서 다시 빌드한다", "CPU 만 있는 컴퓨터에서도 엔진 파일을 그대로 실행할 수 있다"], "a": [0, 1, 3], "w": "엔진 = 만든 GPU 세대 · TensorRT 버전 전용. 다른 GPU (A100 · Jetson) 로 가져가면 읽지 못합니다. TensorRT 는 NVIDIA GPU 전용입니다.", "an": "1교시 · 2교시 ⚠️"}, {"type": "ox", "p": "배치를 자유롭게 (<code>dynamic_axes</code>) 내보낸 ONNX 도 추가 설정 없이 오늘의 <code>build_engine</code> 으로 바로 빌드된다.", "a": false, "w": "배치가 자유로우면 '최소 · 최적 · 최대 크기' 설정 (<b>optimization profile</b>) 이 따로 필요합니다. 없으면 빌드 오류 — 그래서 오늘은 배치 1 고정 <code>_b1.onnx</code>.", "an": "문제 1-2 · 4교시 ⚠️"}, {"type": "short", "p": "Colab <b>T4</b> GPU 의 compute capability 는? (예: 8.6 처럼)", "a": ["7.5", "(7,5)", "sm_75", "sm75"], "w": "T4 = (7, 5) → <code>sm_75</code>. Jetson Orin 은 8.7 (<code>sm_87</code>) — 숫자가 다르면 엔진을 다시 빌드합니다.", "an": "문제 1-1"}, {"type": "drop", "p": "문제 1-2 — 고정 크기 ONNX 를 내보냅니다.", "p2": "더미 입력은 <code>torch.randn(</code>{}<code>, 3, 224, 224)</code>, <code>dynamic_axes</code> 는 {}, 그래서 세션의 입력 shape 32.log", "x": 40, "y": 224, "w": 300, "h": 42}], "a": "onnx"}, {"type": "code", "p": "문제 1-1 · 1-2 — 빈칸을 채우세요.", "code": "print(\"TensorRT 버전:\", trt.{{}})\ncc = torch.cuda.{{}}(0)\nprint(\"compute capability:\", cc, \"→\", f\"sm_{cc[0]}{cc[1]}\")\n\ncpu_sess = ort.InferenceSession(\"mnv3s_b1.onnx\", providers=CPU)\nprint(\"입력 shape:\", cpu_sess.get_inputs()[0].{{}})", "a": [["__version__"], ["get_device_capability"], ["shape"]], "w": "확인 셀은 <code>trt.__version__.startswith(\"10.\")</code> 과 입력 shape <code>[1, 3, 224, 224]</code> 를 검사합니다. 10.x 가 아니면 설치 셀을 건너뛴 것.", "an": "문제 1-1 · 1-2"}]}, {"t": "2교시 · polygraphy convert · 빌드 단계 · 로그", "anim": "D4-2 엔진 빌드 단계", "qs": [{"type": "single", "p": "Colab 에서 <code>trtexec</code> 대신 <b>Polygraphy</b> 로 엔진을 만드는 이유는?", "o": ["Polygraphy 가 trtexec 보다 엔진을 더 빠르게 만들어서", "pip 판 TensorRT 에는 <code>trtexec</code> 명령이 들어 있지 않아서", "Colab 의 <code>trtexec</code> 는 FP16 엔진을 만들지 못해서", "Polygraphy 는 GPU 없이도 엔진을 만들 수 있어서"], "a": 1, "w": "Jetson · 서버에 있는 <code>trtexec</code> 는 pip 판 TensorRT 에 없습니다. Polygraphy 는 NVIDIA 가 만든 TensorRT 도우미 도구로, 같은 일을 합니다.", "an": "2교시 도입"}, {"type": "single", "p": "엔진 빌드가 오래 걸리는 가장 큰 이유는?", "o": ["ONNX 파일을 인터넷에서 다시 내려받아 한 줄씩 읽어서", "가중치를 처음부터 다시 학습해 엔진에 넣어서", "Python 반복문으로 레이어를 하나씩 변환해서", "후보 커널을 이 GPU 에서 직접 재 보고 골라서"], "a": 3, "w": "빌드 = 파싱 → 최적화 → <b>커널 고르기 (오래 걸림)</b> → 저장. 그래서 한 번 빌드해 파일로 남기고, 실행은 빠릅니다.", "an": "문제 2-1 · 해설"}, {"type": "multi", "p": "빌드 결과 판단으로 옳은 것을 모두 고르세요.", "o": ["<code>[W]</code> 줄은 경고 — 읽고 넘어가도 빌드는 계속된다", "<code>[E]</code> 줄이 있으면 빌드 실패를 먼저 의심한다", "종료 코드가 0 이면 빌드가 성공한 것이다", "<code>[W]</code> 가 하나라도 있으면 그 엔진은 쓸 수 없다", "빌드가 느리면 셀을 한 번 더 눌러 빨리 끝낸다"], "a": [0, 1, 2], "w": "흔한 경고: 'INT64 가중치를 INT32 로 바꿨다' — 무시해도 됩니다. 셀을 여러 번 누르면 빌드가 겹쳐 더 오래 걸리고 GPU 메모리가 모자랄 수 있습니다.", "an": "문제 2-2 · ⚠️ 자주 하는 실수"}, {"type": "ox", "p": "같은 <code>polygraphy convert</code> 명령에 <code>--fp16</code> 만 붙이면 FP16 엔진을 만들 수 있다.", "a": true, "w": "<code>polygraphy convert mnv3s_b1.onnx --fp16 -o mnv3s_fp16_cli.engine</code>. 자세한 것은 6교시.", "an": "2교시 🔁 바꿔보기"}, {"type": "short", "p": "<code>polygraphy convert</code> 에서 <b>출력 엔진 파일 이름</b>을 정하는 옵션은? (짧은 형태)", "a": ["-o", "--output"], "w": "<code>-o 엔진.engine</code> (긴 형태 <code>--output</code>).", "an": "문제 2-1"}, {"type": "drop", "p": "문제 2-2 — 로그에서 볼 곳입니다.", "p2": "경고는 {} 로 시작하는 줄, 오류는 {} 로 시작하는 줄, 성공한 명령의 종료 코드는 {} 이다.", "opts": [["[I]", "[W]", "[E]"], ["[W]", "[E]", "[V]"], ["0", "1", "-1"]], "a": [1, 1, 0], "w": "[W] = 계속 진행, [E] = 빌드 실패. <code>[W]</code> 를 오류로 착각하지 말고 <code>[E]</code> 와 종료 코드를 보세요.", "an": "문제 2-2 · 해설"}, {"type": "match", "p": "명령 · 옵션과 뜻을 짝지으세요.", "left": ["<code>polygraphy convert</code>", "<code>-o</code>", "<code>--fp16</code>", "<code>sh(cmd, log=…)</code>"], "right": ["ONNX → TensorRT 엔진 만들기", "출력 엔진 파일 이름", "FP16 을 허락한 엔진 빌드", "명령 실행 — 마지막 몇 줄만 보이고 전체 로그는 파일로"], "a": [0, 1, 2, 3], "w": "<code>sh()</code> 는 오늘 환경 셀의 도우미 — <code>!polygraphy …</code> 로 해도 됩니다.", "an": "2교시 · 📌 정리"}, {"type": "order", "p": "문제 2-1 · 2-2 의 진행 순서로 배열하세요.", "items": ["<code>polygraphy convert mnv3s_b1.onnx -o mnv3s_fp32_cli.engine</code> 실행", "셀을 한 번만 누르고 빌드가 끝날 때까지 기다리기", "종료 코드가 0 인지 확인", "<code>build_fp32.log</code> 에서 <code>[E]</code> · <code>[W]</code> 줄 세기", "ONNX 와 엔진의 파일 크기 비교"], "w": "엔진 파일에는 가중치 + 고른 커널 정보가 들어 있어 ONNX 와 크기가 비슷하거나 조금 다릅니다. 시간 · 크기 숫자는 장비와 버전마다 다릅니다.", "an": "문제 2-1 · 2-2"}, {"type": "hot", "p": "<code>polygraphy convert</code> 안의 빌드 단계입니다. <b>시간이 가장 오래 걸리는 단계</b>를 클릭하세요.", "w": "<b>③ 커널 고르기 (tactic 선택)</b> 입니다. 레이어마다 후보 커널을 이 GPU 에서 실제로 돌려 재 보고 가장 빠른 것을 고릅니다 — 그래서 엔진이 '이 GPU 전용' 이 됩니다.", "an": "문제 2-1 · 2교시 📌", "viewBox": "0 0 720 270", "sw": 720, "svg": "<defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#8a9bb8\"/></marker><marker id=\"ahr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill gine()", "anim": "D4-4 빌드 여섯 단계", "qs": [{"type": "single", "p": "<code>parser.parse_from_file(...)</code> 의 결과를 확인하지 않고 빌드하면 어떻게 될 수 있나요?", "o": ["TensorRT 가 ONNX 의 잘못된 부분을 자동으로 고쳐 준다", "파싱 단계를 건너뛰어 빌드가 더 빨리 끝난다", "파싱 오류는 무시되고 FP16 엔진이 대신 만들어진다", "빈 설계판으로 빌드되어 결과가 <code>None</code> 이 된다"], "a": 3, "w": "파싱 → <b>확인</b> → 빌드. 실패하면 <code>parser.num_errors</code> · <code>get_error(i)</code> 로 오류를 모두 출력합니다.", "an": "4교시 ⚠️ 자주 하는 실수"}, {"type": "single", "p": "Config 의 <code>set_memory_pool_limit(</code> <code>trt.MemoryPoolType.WORKSPACE,</code> <code>1 &lt;&lt; 30)</code> 의 뜻은?", "o": ["엔진 파일의 최대 크기를 1 GB 로 제한해 둔다", "커널 작업 공간의 상한을 1 GB 로 정한다", "입력 배치 크기의 상한을 30 장으로 정해 둔다", "GPU 메모리 1 GB 를 미리 0 으로 채워 둔다"], "a": 1, "w": "<code>1 &lt;&lt; 30</code> = 2³⁰ 바이트 = 1 GB. 작업 공간이 너무 작으면 빠른 커널을 못 고릅니다.", "an": "문제 4-2 · 해설"}, {"type": "multi", "p": "<code>build_engine(onnx_path, engine_path, fp16=False)</code> 에 대해 옳은 것을 모두 고르세요.", "o": ["빌드마다 Builder · Network · Config 를 새로 만든다", "<code>fp16=True</code> 면 <code>BuilderFlag.FP16</code> 플래그를 켠다", "빌드 결과가 <code>None</code> 이면 RuntimeError 를 낸다", "<code>profiling_verbosity</code> 기본값으로도 LayerType 이 보인다", "<code>create_network(0)</code> 의 0 은 배치 크기 0 이다"], "a": [0, 1, 2], "w": "전역 Builder · Network 를 재사용하면 두 번째 빌드에 이전 설계가 섞입니다. DETAILED 가 있어야 7교시에 LayerType 이 보입니다. <code>0</code> = 기본 설정 (explicit batch).", "an": "문제 4-3 · ⚠️"}, {"type": "ox", "p": "TensorRT 11.x 에서도 <code>trt.BuilderFlag.FP16</code> 한 줄로 FP16 을 켤 수 있으므로, 설치 셀에서 버전을 고정할 필요가 없다.", "a": false, "w": "이 플래그는 10.12 이후 '오래된 방식 (weak typing)' 으로 표시되고 <b>11.x 에서 없어졌습니다</b>. 그래서 오늘은 <code>tensorrt-cu12==10.16.1.11</code> 로 고정.", "an": "설치 셀 · 문제 4-3 해설"}, {"type": "short", "p": "파일에서 ONNX 를 바로 읽어 설계판을 채우는 OnnxParser 메서드는? <code>parser.____(\"mnv3s_b1.onnx\")</code>", "a": ["parse_from_file", "parse_from_file()"], "w": "<code>parse_from_file</code> — 성공하면 True. 파싱 직후 레이어 수는 ONNX 노드 수와 비슷하고, 합치기는 ⑥ 빌드 때 일어납니다.", "an": "문제 4-1"}, {"type": "drop", "p": "문제 4-1 — 파싱이 실패했을 때입니다.", mily=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">→ blob 을 파일로 쓰면 .engine 완성 (blob 이 None 이면 빌드 실패)</text>", "regions": [{"id": "logger", "label": "① Logger", "x": 20, "y": 50, "w": 210, "h": 64}, {"id": "builder", "label": "② Builder", "x": 255, "y": 50, "w": 210, "h": 64}, {"id": "network", "label": "③ Network", "x": 490, "y": 50, "w": 210, "h": 64}, {"id": "parser", "label": "④ OnnxParser", "x": 20, "y": 170, "w": 210, "h": 64}, {"id": "config", "label": "⑤ Config", "x": 255, "y": 170, "w": 210, "h": 64}, {"id": "build", "label": "⑥ 빌드 · 저장", "x": 490, "y": 170, "w": 210, "h": 64}], "a": "config"}, {"type": "code", "p": "문제 4-3 — <code>build_engine</code> 의 빈칸을 채우세요.", "code": "def build_engine(onnx_path, engine_path, fp16=False):\n    builder = trt.Builder(LOGGER)\n    network = builder.create_network(0)\n    parser = trt.OnnxParser(network, LOGGER)\n    if not parser.parse_from_file(onnx_path):\n        raise RuntimeError(\"\\n\".join(str(parser.get_error(i)) for i in range(parser.num_errors)))\n    config = builder.create_builder_config()\n    config.set_memory_pool_limit(trt.MemoryPoolType.{{}}, 1 << 30)\n    config.profiling_verbosity = trt.ProfilingVerbosity.{{}}\n    if fp16:\n        config.set_flag(trt.BuilderFlag.{{}})\n    blob = builder.{{}}(network, config)\n    if blob is None:\n        raise RuntimeError(\"빌드 실패 — 위 로그를 확인하세요\")\n    with open(engine_path, \"wb\") as f:\n        f.write(blob)\n    return engine_path", "a": [["WORKSPACE"], ["DETAILED"], ["FP16"], ["build_serialized_network"]], "w": "Builder · Network · Parser · Config 를 모두 함수 안에서 새로 만듭니다. 확인 셀은 <code>fp16</code> 인자와 <code>cnn_fp32.engine</code> 파일을 검사합니다.", "an": "문제 4-2 · 4-3"}]}, {"t": "5교시 · Python 으로 엔진 실행 · trt_runner()", "anim": "D4-5 엔진 실행 — 주소 알려 주기", "qs": [{"type": "single", "p": "<code>context.set_tensor_address(name, ...)</code> 에 넘기는 것은?", "o": ["CPU 에 있는 NumPy 배열 객체 그 자체", "엔진에 들어 있는 텐서 이름 목록", "CUDA 텐서의 <code>data_ptr()</code> 값", "<code>.engine</code> 엔진 파일의 경로"], "a": 2, "w": "ONNX Runtime 은 NumPy 를 그대로 받았지만, TensorRT 는 <b>GPU 메모리 주소</b>만 받습니다. GPU 메모리는 PyTorch CUDA 텐서로 준비합니다.", "an": "5교시 도입 · ⚠️"}, {"type": "single", "p": "<code>execute_async_v3</code> 뒤에 <code>torch.cuda.synchronize()</code> 를 하는 이유는?", "o": ["엔진을 다시 빌드해 다음 실행을 준비하려고", "실행이 비동기라 GPU 계산이 끝날 때까지 기다리려고", "다음 실행 전에 GPU 메모리를 비우려고", "GPU 출력을 FP16 에서 FP32 로 바꾸려고"], "a": 1, "w": "기다리지 않고 결과를 읽으면 아직 비어 있을 수 있고, 시간을 재면 실행이 끝나기 전 시간이라 엄청 빠르게 보입니다.", "an": "문제 5-2 · 해설"}, {"type": "multi", "p": "<code>trt_runner(engine_path)</code> 가 빠르고 올바르게 동작하는 이유를 모두 고르세요.", "o": ["버퍼 (CUDA 텐서) 와 주소를 한 번만 준비한다", "<code>run(x)</code> 는 복사 → 실행 → 기다리기 → 가져오기만 한다", "입력을 <code>np.float32</code> 로 맞춘다 (기본은 float64)", "<code>run(x)</code> 마다 <code>torch.empty</code> 로 새 버퍼를 만든다", "<code>run(x)</code> 마다 엔진을 다시 deserialize 한다"], "a": [0, 1, 2], "w": "버퍼 · 주소는 한 번. <code>run.engine, run.context = eng, ctx</code> 로 엔진이 사라지지 않게 붙잡아 둡니다. 배치 1 고정 엔진이라 다른 크기의 x 는 <code>copy_</code> 에서 오류.", "an": "문제 5-3 · ⚠️"}, {"type": "ox", "p": "5-4 의 세 줄 (ORT CPU · ORT CUDA · TRT FP32) 은 모두 'CPU 의 NumPy 입력 → CPU 의 NumPy 출력' 을 재므로, GPU 쪽 줄의 시간에는 복사 시간도 들어 있다.", "a": true, "w": "그래서 공평합니다. 배치 1 · 작은 모델이면 복사가 큰 몫을 차지해 TensorRT 의 이득이 계산 시간 차이보다 작게 보일 수 있습니다 (Day 3 5교시와 같은 이유).", "an": "문제 5-4 · 해설"}, {"type": "short", "p": "엔진의 i 번째 입출력 텐서 <b>이름</b>을 꺼내는 메서드는? <code>engine.____(i)</code>", "a": ["get_tensor_name", "get_tensor_name()"], "w": "이름은 export 때 붙인 그대로 (<code>input</code> · <code>logits</code>) — Day 1 에서 이름을 붙인 이유가 여기 있습니다.", "an": "문제 5-1"}, {"type": "drop", "p": "엔진을 실행 준비하는 세 메서드입니다.", "p2": "엔진 읽기 <code>RUNTIME.</code>{}<code>(bytes)</code> → 실행 상태 <code>engine.</code>{}<code>()</code> → 실행 <code>context.</code>{}<code>(stream)</code>", "opts": [["deserialize_cuda_engine", "build_serialized_network", "parse_from_file"], ["create_builder_config", "create_execution_context", "create_network"], ["run", "execute_async_v3", "synchronize"]], "a": [0, 1, 1], "w": "Runtime = 엔진 파일을 읽는 도구 (빌드 때의 Builder 에 해당). Context 는 엔진 하나로 여러 개 만들 수 있습니다.", "an": "5교시 ① ② · 문제 5-2"}, {"type": "match", "p": "코드와 돌려주는 것을 짝지으세요.", "left": ["<code>engine.num_io_tensors</code>", "<code>engine.get_tensor_mode(name)</code>", "<code>engine.get_tensor_shape(name)</code>", "<code>d_in.data_ptr()</code>"], "right": ["입출력 텐서 개수", "INPUT / OUTPUT 구분", "텐서 shape — 예: (1, 3, 224, 224)", "CUDA 텐서의 GPU 메모리 주소"], "a": [0, 1, 2, 3], "w": "5-1 표: name · mode · shape · dtype. 오늘 엔진의 입출력 dtype 은 FP32 입니다 (FP16 엔진도).", "an": "문제 5-1 · 5-2"}, {"type": "order", "p": "엔진을 실행하는 순서로 배열하세요.", "items": ["<code>Runtime</code> 으로 엔진 deserialize", "<code>create_execution_context()</code>", "<code>get_tensor_name</code> · shape 로 입출력 확인", "CUDA 텐서 버퍼 만들고 <code>set_tensor_address</code>", "<code>execute_async_v3</code> → <code>synchronize</code> → CPU 로 가져와 비교"], "w": "① Runtime ② Context ③ 이름 · shape ④ GPU 버퍼 ⑤ 주소 · 실행 · 기다리기 ⑥ CPU 로 · 비교.", "an": "5교시 · 📌 정리"}, {"type": "hot", "p": "엔진 실행 단계입니다. 시간을 쟀더니 <b>터무니없이 빠르게</b> 나왔습니다. 빠뜨렸을 가능성이 가장 큰 단계를 클릭하세요.", "w": "<b>⑤ 기다리기 — <code>torch.cuda.synchronize()</code></b> 입니다. <code>execute_async_v3</code> 는 시작만 하고 바로 돌아오므로, 기다리지 않으면 실행이 끝나기 전의 시간을 잽니다.", "an": "5교시 ⚠️ 자주 하는 실수", "viewBox": "0 0 720 280", "sw": 720, "svg": "<defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#8a9bb8\"/></marker><marker id=\"ahr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#f87171\"/></marker></defs><text x=\"20\" y=\"20\" font-size=\"12\" fill=\"#dbe4f0\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">trt_runner 안에서 일어나는 일</text><rect x=\"20\" y=\"50\" width=\"164\" height=\"64\" rx=\"6\" fill=\"#14203a\" stroke=\"#60a5fa\" stroke-width=\"1\"/><text x=\"102.0\" y= 값에서 멈춤)", "69984.0 (가까운 값으로 반올림)", "inf (표현 범위 초과)"], "a": 3, "w": "FP16 의 최대값은 <b>65504</b> — 넘으면 <code>inf</code>. 확인 셀: <code>np.isinf(np.float16(70000.0))</code>.", "an": "문제 6-1"}, {"type": "multi", "p": "FP16 플래그 (<code>BuilderFlag.FP16</code>) 로 만든 엔진에 대해 옳은 것을 모두 고르세요.", "o": ["FP16 은 '허락' — 일부 레이어는 FP32 로 남을 수 있다", "입출력은 FP32 그대로라 입력을 float32 로 넣는다", "T4 의 Tensor Core 가 FP16 을 빠르게 계산한다", "어느 모델에서든 FP32 엔진보다 정확히 2배 빨라진다", "입출력이 FP16 이라 입력을 <code>float16</code> 으로 바꿔 넣는다"], "a": [0, 1, 2], "w": "'FP16 은 무조건 2배' 는 틀린 생각 — 복사 · 작은 레이어 · FP32 로 남은 레이어 때문에 모델마다 다릅니다. 재 보고 말하기. 안쪽 계산만 FP16, 입출력은 FP32 (5-1 표의 dtype).", "an": "문제 4-3 해설 · 6교시 ⚠️"}, {"type": "ox", "p": "FP16 엔진의 <code>max_diff</code> 가 FP32 엔진보다 훨씬 커도, MNIST 정확도 (분류 결과) 가 그대로면 쓸 수 있다고 판단할 수 있다.", "a": true, "w": "분류는 '가장 큰 점수가 무엇인가' 만 봅니다. 최대 차이만이 아니라 <b>정확도로 판단</b> — 빨라도 틀리면 못 쓰므로 성능표에 정확도 열을 함께 둡니다.", "an": "문제 6-3 · 과제 6 해설 2"}, {"type": "short", "p": "<code>float(np.float16(1000.3))</code> 의 값은?", "a": ["1000.5"], "w": "1000 근처에서 FP16 의 간격은 0.5 — 1000.3 은 가장 가까운 <b>1000.5</b> 로 저장됩니다.", "an": "문제 6-1 · 해설"}, {"type": "drop", "p": "문제 6-1 — <code>np.finfo(np.float16)</code> 로 본 FP16 입니다.", "p2": "최대값은 {}, eps (1 다음 수까지의 간격) 는 약 {}, 그래서 유효숫자는 약 {} 자리이다.", "opts": [["3.4e38", "65504", "32767"], ["1.19e-7", "0.1", "0.000977"], ["3", "7", "16"]], "a": [1, 2, 0], "w": "FP16 eps ≈ 0.000977 (≈ 0.001), FP32 eps ≈ 1.19e-7. 그래서 FP16 비교에는 느슨한 기준이 필요했습니다 (3교시).", "an": "문제 6-1"}, {"type": "match", "p": "코드와 결과를 짝지으세요.", "left": ["<code>float(np.float16(0.1))</code>", "<code>float(np.float16(1000.3))</code>", "<code>np.float16(70000.0)</code>", "<code>np.finfo(np.float16).max</code>"], "right": ["0.0999755859375", "1000.5", "inf", "65504"], "a": [0, 1, 2, 3], "w": "0.1 도 정확히 저장되지 않고, 65504 를 넘으면 inf. 신경망의 활성값 · 가중치는 대부분 이 범위 안이라 결과가 '거의' 같습니다 — '거의' 를 꼭 재 봐야 합니다.", "an": "문제 6-1"}, {"type": "order", "p": "문제 6-2 · 6-3 의 흐름으로 배열하세요.", "items": ["<code>build_engine(..., fp16=True)</code> 로 FP16 엔진 빌드", "<code>tr e>A + B</code> 모양인 것은 무엇을 뜻하나요?", "o": ["두 엔진 파일을 하나로 이어 붙인 레이어다", "ONNX 노드 여러 개를 합친 레이어다", "FP16 과 FP32 를 섞어서 쓰는 레이어다", "빌드 중 오류가 나서 실행을 건너뛴 레이어다"], "a": 1, "w": "합쳐진 레이어는 원래 ONNX 노드 이름을 ' + ' 로 이어 붙인 모양입니다. 보통 Conv + 활성 함수 (HardSwish · Relu) 나 Conv + Add.", "an": "문제 7-1 · 7-2 해설"}, {"type": "single", "p": "<code>profiling_verbosity = DETAILED</code> 없이 빌드한 엔진을 인스펙트하면?", "o": ["인스펙터를 만들 수 없다는 오류가 난다", "엔진이 FP16 정밀도로 다시 빌드된다", "이름만 나오고 <code>LayerType</code> 정보는 없다", "레이어가 하나도 나오지 않고 빈 목록이다"], "a": 2, "w": "그래서 <code>build_engine</code> 의 Config 에 DETAILED 를 넣어 두었습니다.", "an": "7교시 ⚠️ 자주 하는 실수"}, {"type": "multi", "p": "7교시 정리에서 든 <b>TensorRT 가 빨라진 이유</b>를 모두 고르세요.", "o": ["레이어 합치기 — 메모리 왕복 감소", "이 GPU 에서 재 보고 고른 커널 (tactic)", "FP16 + Tensor Core 계산", "가중치를 다시 학습해 더 작아진 모델", "입력 이미지를 자동으로 줄여 계산량 감소"], "a": [0, 1, 2], "w": "Day 3 ORT 는 정해진 규칙으로 합치고, TensorRT 는 규칙 + '직접 재 보고' 고릅니다. 모델 · 입력은 그대로입니다.", "an": "7교시 · 📌 정리"}, {"type": "ox", "p": "엔진 레이어 수가 ONNX 노드 수보다 적을수록 무조건 더 빠르다.", "a": false, "w": "합치기 + 커널 선택 + FP16 이 함께 작용합니다. 레이어 수만으로 단정하지 말고 결국 <code>bench</code> 로 확인.", "an": "7교시 ⚠️"}, {"type": "short", "p": "엔진 정보를 JSON 으로 받을 때의 형식은? <code>trt.LayerInformationFormat.____</code>", "a": ["JSON"], "w": "<code>insp.get_engine_information(trt.LayerInformationFormat.JSON)</code> → <code>json.loads</code> → <code>info[\"Layers\"]</code>.", "an": "문제 7-1"}, {"type": "drop", "p": "문제 7-1 — 엔진 인스펙터입니다.", "p2": "<code>insp = run32.engine.</code>{}<code>()</code> → <code>info = json.loads(insp.</code>{}<code>(trt.LayerInformationFormat.JSON))</code> → 레이어 목록 <code>info[\"</code>{}<code>\"]</code>", "opts": [["create_execution_context", "create_engine_inspector", "create_network"], ["get_engine_information", "get_layer_information", "get_tensor_name"], ["Layers", "Bindings", "Nodes"]], "a": [1, 0, 0], "w": "<code>run32.engine</code> — <code>trt_runner</code> 가 붙잡아 둔 엔진을 그대로 씁니다. CLI 로는 <code>polygraphy inspect model 엔진 --show layers</code>.", "an": "문제 7-1 · 7-3"}, {"type":         const n = i++;
        const w = Math.max(5, (q.a[n][0] || '').length + 2);
        const st = g ? `style="border-color:${q.a[n].some(x => norm(x) === norm(a[n])) ? 'var(--green)' : 'var(--red)'};width:${w}ch"` : `style="width:${w}ch"`;
        return `<input type="text" class="ci" data-k="${k}" data-n="${n}" value="${esc(a[n])}" ${dis} ${st} aria-label="빈칸 ${n + 1}">`;
      }) + '</pre>';
      break;
    }
  }
  const t = TYPES[q.type];
  const prompt = q.type === 'drop' ? (q.p || '') : (q.type === 'flash' ? (q.p || '카드 앞면의 질문에 답을 떠올린 뒤 뒤집어 확인하세요.') : q.p);
  let fb = '';
  if (g) {
    const right = q.type === 'flash' ? '' : `<div>정답: <b>${esc(fmt(q, a, true))}</b></div>`;
    fb = `<div class="fb ${ok ? 'ok' : 'bad'}"><b class="v">${ok ? '정답' : '오답'}</b>${right}${q.w}<span class="anim">확인: ${q.an}</span></div>`;
  }
  const un = !g && !answered(q, a) && attempted[tab] ? 'unans' : '';
  return `<div class="q ${g ? (ok ? 'ok' : 'bad') : un}"><div class="qh"><span class="n">문항 ${k + 1}</span><span class="ty" style="color:${t.c};border-color:${t.c}">${t.n}</span></div><div class="p">${prompt}</div>${body}${fb}</div>`;
}
const attempted = Q.map(() => false);
function render(){
  renderTabs();
  const s = Q[tab];
  $('#sheet').innerHTML = `<div class="head"><span class="t">${s.t}</span><span class="a">🎬 ${s.anim}</span></div>` + s.qs.map((q, k) => qHTML(q, k)).join('');
  bind();
  const nm = $('#name').value, g = graded[tab];
  if (g) {
    const sc = scoreOf(tab); $('#rscore').textContent = `${sc}/10`;
    if (nm.trim()) { $('#rcode').textContent = codeFor(nm, tab + 1, sc); $('#rhint').textContent = '결과 코드'; }
    else { $('#rcode').textContent = '—'; $('#rhint').textContent = '이름을 입력하면 결과 코드가 나옵니다.'; }
  } else {
    $('#rcode').textContent = '—'; $('#rscore').textContent = '';
    const n = ans[tab].filter((a, k) => answered(s.qs[k], a)).length;
    $('#rhint').textContent = `${tab + 1}교시: ${n}/10 응답. 채점하기를 누르면 잠깁니다.`;
  }
  $('#gradeBtn').disabled = g;
}
function bind(){
  const S = $('#sheet'), A = ans[tab];
  S.querySelectorAll('.opt[data-j]').forEach(b => b.onclick = () => {
    const k = +b.dataset.k, j = +b.dataset.j, q = Q[tab].qs[k];
    if (q.type === 'multi') { const i = A[k].indexOf(j); i < 0 ? A[k].push(j) : A[k].splice(i, 1); }
    else A[k] = A[k] === j ? null : j;
    render();
  });
  S.querySelectorAll('.oxb').forEach(b => b.onclick = () => { const k = +b.dataset.k, v = b.dataset.v === 'true'; A[k] = A[k] === v ? null : v; render(); });
  S.querySelectorAll('.sa').forEach(i => i.oninput = () => { A[+i.dataset.k] = i.value; renderTabs(); });
  S.querySelectorAll('.ci').forEach(i => i.oninput = () => { A[+i.dataset.k][+i.dataset.n] = i.value; renderTabs(); });
  S.querySelectorAll('.dd').forEach(s => s.onchange = () => { A[+s.dataset.k][+s.dataset.n] = +s.value; renderTabs(); });
  S.querySelectorAll('.mm').forEach(s => s.onchange = () => { A[+s.dataset.k][+s.dataset.i] = +s.value; renderTabs(); });
  S.querySelectorAll('.ord .mv button').forEach(b => b.onclick = () => {
    const k = +b.dataset.k, p = +b.dataset.pos, d = +b.dataset.d, arr = A[k];
    [arr[p], arr[p + d]] = [arr[p + d], arr[p]]; render();
  });
  S.querySelectorAll('.ord').forEach(ol => {
    const k = +ol.dataset.k; let from = null;
    ol.querySelectorAll('li').forEach(li => {
      li.addEventListener('dragstart', e => { from = +li.dataset.pos; li.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(from)); });
      li.addEventListener('dragend', () => li.classList.remove('drag'));
      li.addEventListener('dragover', e => { if (from !== null) { e.preventDefault(); li.classList.add('over'); } });
      li.addEventListener('dragleave', () => li.classList.remove('over'));
      li.addEventListener('drop', e => { e.preventDefault(); const to = +li.dataset.pos; if (from === null || from === to) return; const arr = A[k]; const [x] = arr.splice(from, 1); arr.splice(to, 0, x); from = null; render(); });
    });
  });
  S.querySelectorAll('.rg').forEach(r => {
    const pick = () => { if (graded[tab]) return; const k = +r.dataset.k; A[k] = A[k] === r.dataset.r ? null : r.dataset.r; render(); };
    r.addEventListener('click', pick);
    r.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
  });
  S.querySelectorAll('.flipb').forEach(b => b.onclick = () => { const k = +b.dataset.k; A[k].flipped = !A[k].flipped; render(); });
  S.querySelectorAll('.card').forEach(c => c.onclick = () => { if (graded[tab]) return; const k = +c.dataset.k; A[k].flipped = !A[k].flipped; render(); });
  S.querySelectorAll('.selfb').forEach(b => b.onclick = () => { const k = +b.dataset.k; A[k].self = b.dataset.v === '1'; render(); });
}

// ── 채점 · 결과 코드 ──
function hash(s){ let h = 5381; for (const c of s) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return h.toString(16).padStart(8, '0').slice(-4); }
function codeFor(name, t, score){ return `${t}${'ABCDEFGHIJK'[10 - score] || 'K'}-${hash(`${name.trim()}|${t}|${score}|otday4`)}`; }
$('#gradeBtn').onclick = () => {
  const s = Q[tab], n = ans[tab].filter((a, k) => answered(s.qs[k], a)).length;
  attempted[tab] = true;
  if (n < 10 && !confirm(`아직 ${10 - n}문항에 답하지 않았습니다. 그래도 채점할까요? (미응답은 오답 처리)`)) { render(); return; }
  graded[tab] = true; render();
};
$('#resetBtn').onclick = () => {
  if (!confirm(`${tab + 1}교시 답을 모두 지우고 다시 풀까요?`)) return;
  graded[tab] = false; attempted[tab] = false;
  ans[tab] = Q[tab].qs.map((q, k) => init(q, `${tab}-${k}`)); render();
};
$('#name').oninput = render;

// ── 제출 · 오답 정리 ──
let lastHtml = '', lastText = '';
function buildReport(){
  const nm = $('#name').value.trim() || '(이름 없음)', ds = new Date().toLocaleString('ko-KR');
  let h = `<h3>ONNX·TensorRT Day 4 — TensorRT 첫걸음 · 개념 워크시트 — 오답 정리</h3><div class="meta">${esc(nm)} · ${ds}</div>`;
  let t = `ONNX·TensorRT Day 4 — TensorRT 첫걸음 · 개념 워크시트 — 오답 정리\n이름: ${nm}\n일시: ${ds}\n\n`;
  let tot = 0, cnt = 0;
  const byType = {};
  Q.forEach((s, i) => {
    if (!graded[i]) return;
    const sc = scoreOf(i); tot += sc; cnt++;
    s.qs.forEach((q, k) => { const b = byType[q.type] ||= [0, 0]; b[1]++; if (correct(q, ans[i][k])) b[0]++; });
    const code = $('#name').value.trim() ? codeFor($('#name').value, i + 1, sc) : '—';
    const wrong = s.qs.map((q, k) => ({ q, k, a: ans[i][k] })).filter(x => !correct(x.q, x.a));
    h += `<div class="sec">${esc(s.t)} — ${sc}/10 · 결과 코드 ${code}</div>`;
    t += `[${s.t}] ${sc}/10 · 결과 코드 ${code}\n`;
    if (!wrong.length) { h += `<div class="ok">전부 정답 🎉</div>`; t += '  전부 정답\n\n'; return; }
    h += '<table><tr><th>#</th><th>유형</th><th>문항</th><th>내 답</th><th>정답</th><th>다시 볼 곳</th></tr>';
    wrong.forEach(({ q, k, a }) => {
      const qt = strip(q.type === 'flash' ? q.front : (q.p || q.p2 || '')).replace(/\s+/g, ' ').slice(0, 70);
      const my = fmt(q, a, false), co = fmt(q, a, true);
      h += `<tr><td>${k + 1}</td><td>${TYPES[q.type].n}</td><td>${esc(qt)}</td><td class="bad">${esc(my)}</td><td class="ok">${esc(co)}</td><td>${esc(strip(q.an))}</td></tr>`;
      t += `  ${k + 1}. [${TYPES[q.type].n}] ${qt}\n     내 답: ${my}\n     정답: ${co}\n     다시 볼 곳: ${strip(q.an)}\n`;
    });
    h += '</table>'; t += '\n';
  });
  const notGraded = Q.map((s, i) => graded[i] ? null : i + 1).filter(x => x);
  const typeLine = Object.entries(byType).map(([k, [c, n]]) => `${TYPES[k].n} ${c}/${n}`).join(' · ');
  const sum = `<div class="sum"><span>채점한 교시 ${cnt}/8</span><span>합계 ${tot}/${cnt * 10}</span>${notGraded.length ? `<span class="none">미채점: ${notGraded.join(', ')}교시</span>` : ''}</div>` + (typeLine ? `<div class="meta">유형별 정답: ${typeLine}</div>` : '');
  h = h.replace('</div>', '</div>' + sum);
  t = t.replace('\n\n', `\n채점한 교시 ${cnt}/8 · 합계 ${tot}/${cnt * 10}${notGraded.length ? ' · 미채점 ' + notGraded.join(', ') + '교시' : ''}\n유형별 정답: ${typeLine}\n\n`);
  lastHtml = h; lastText = t;
  return h;
}
$('#submitBtn').onclick = () => {
  if (!graded.some(x => x)) { alert('먼저 한 교시 이상 채점하세요.'); return; }
  $('#dgBody').innerHTML = buildReport(); $('#toast').textContent = ''; $('#dlg').showModal();
};
$('#closeBtn').onclick = () => $('#dlg').close();
$('#captureBtn').onclick = async () => {
  const htmlDoc = `<meta charset="utf-8">` + lastHtml.replace(/ class="[^"]*"/g, '').replace(/<table>/g, '<table border="1" style="border-collapse:collapse">');
  try {
    if (navigator.clipboard && window.ClipboardItem) {
      await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([htmlDoc], { type: 'text/html' }), 'text/plain': new Blob([lastText], { type: 'text/plain' }) })]);
      $('#toast').textContent = '복사했습니다 — 노션에 붙여 넣으세요.'; return;
    }
  } catch (e) {}
  const ta = document.createElement('textarea'); ta.value = lastText; ta.style.position = 'fixed'; ta.style.opacity = '0';
  $('#dlg').appendChild(ta); ta.focus(); ta.select();
  const ok = document.execCommand('copy'); ta.remove();
  $('#toast').textContent = ok ? '텍스트로 복사했습니다.' : '복사하지 못했습니다 — 직접 선택해 복사하세요.';
};

$('#legend').innerHTML = Object.values(TYPES).map(t => `<span class="tag" style="color:${t.c};border-color:${t.c}55">${t.n}</span>`).join('');
// worksheet.html#t3 → 3교시 탭으로 바로 열기 (노트북 교시별 링크)
function fromHash(){ const m = location.hash.match(/^#t([1-8])$/); if (m) { tab = +m[1] - 1; } }
fromHash();
window.addEventListener('hashchange', () => { fromHash(); render(); window.scrollTo({ top: 0 }); });
render();
</script>
