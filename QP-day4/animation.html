steps([
 {n:&#x27;① 실습 2-1 — fake_quant()&#x27;,vt:&#x27;quantize → dequantize 를 한 번에&#x27;,run:()=&gt;play(0,60,32),
  q:[&#x27;3비트 대칭 (scale 0.25, 정수 −4 ~ 3) 으로 x = 5.0 을 fake quant 하면 출력은?&#x27;,[&#x27;5.0 — 범위 밖 값은 그대로 통과한다&#x27;,&#x27;0.75&#x27;,&#x27;1.0 — 가장 가까운 정수로 반올림된다&#x27;],1,&#x27;round(5.0 / 0.25) = 20 → clamp 로 3 → 3 × 0.25 = 0.75. 범위 밖은 끝 칸으로 잘립니다. 결과는 FP32 지만 −1.0 ~ 0.75 사이 8개 값만 나옵니다.&#x27;],
  kv:[[&#x27;입력 [−1.2 … 1.2] 9개&#x27;,&#x27;[−1, −1, −0.5, −0.25, 0, 0.25, 0.5, 0.75, 0.75]&#x27;],[&#x27;출력 자료형&#x27;,&#x27;FP32 (torch.float32)&#x27;],[&#x27;값의 종류&#x27;,&#x27;8개 (3비트)&#x27;]],st:[&#x27;ok&#x27;,&#x27;계단 모양의 FP32&#x27;],
  code:`def fake_quant(x, scale, zp, qmin, qmax):\n    q = torch.clamp(torch.round(x / scale) + zp, qmin, qmax)     &lt;span class=&quot;c&quot;&gt;# quantize&lt;/span&gt;\n    return (q - zp) * scale                                       &lt;span class=&quot;c&quot;&gt;# dequantize&lt;/span&gt;`,
  ex:&#x27;&lt;p&gt;&lt;b&gt;직접 구현&lt;/b&gt;: Day 1 의 두 함수를 한 줄씩 이어 붙입니다. 지금은 &lt;code&gt;torch.round&lt;/code&gt; 그대로 — 기울기 문제는 예제 2-A 에서 확인하고 3교시에 고칩니다.&lt;/p&gt;&#x27;},
 {n:&#x27;② 실습 2-2 — FakeQuant 모듈&#x27;,vt:&#x27;weight 와 활성값은 다르게&#x27;,run:()=&gt;play(1,90,24),
  q:[&#x27;FakeQuant 모듈에서 weight 의 scale 은 매 forward 마다 다시 계산하고, 활성값의 범위는 보정 때 정해 고정합니다. weight 를 매번 다시 재는 이유는?&#x27;,[&#x27;weight 는 학습 중에 계속 바뀌므로&#x27;,&#x27;weight 는 입력 이미지마다 값이 달라지므로&#x27;,&#x27;weight 의 scale 계산이 활성값보다 훨씬 빨라서&#x27;],0,&#x27;QAT 중 weight 는 매 step 갱신되므로 그때그때의 |w| 최댓값으로 scale 을 잡습니다. 활성값은 배치마다 흔들리므로 보정 500장으로 범위를 정해 고정합니다 — 배포 때의 scale 과 같아지도록.&#x27;],
  kv:[[&#x27;weight&#x27;,&#x27;채널별 대칭 · scale = amax / qmax · 매번&#x27;],[&#x27;활성값&#x27;,&#x27;텐서별 비대칭 · [min(lo, 0), max(hi, 0)] · 보정 고정&#x27;],[&#x27;zero_point&#x27;,&#x27;round(−lo / s) — 0 이 정확히 한 칸&#x27;]],st:[&#x27;ok&#x27;,&#x27;FakeQuant(bits, per_channel) 하나로 두 역할&#x27;],
  code:`def forward(self, x):\n    if self.per_channel:                                   &lt;span class=&quot;c&quot;&gt;# weight&lt;/span&gt;\n        qmax = 2 ** (self.bits - 1) - 1\n        amax = x.detach().abs().flatten(1).amax(1).clamp(min=1e-8).view(-1, *[1] * (x.dim() - 1))\n        return fake_quant(x, amax / qmax, 0.0, -qmax, qmax)\n    if self.calib:                                         &lt;span class=&quot;c&quot;&gt;# 보정 — 범위만 기록&lt;/span&gt;\n        self.lo = torch.minimum(self.lo, x.detach().min()); self.hi = torch.maximum(self.hi, x.detach().max()); return x\n    lo, hi = min(float(self.lo), 0.0), max(float(self.hi), 1e-8); qmax = 2 ** self.bits - 1; s = (hi - lo) / qmax\n    return fake_quant(x, s, round(-lo / s), 0, qmax)`,
  ex:&#x27;&lt;p&gt;&lt;b&gt;직접 구현&lt;/b&gt;: 생성자와 보정 모드 틀은 시작 코드에 있고 &lt;code&gt;forward&lt;/code&gt; 의 세 갈래를 채웁니다. 범위에 0 을 포함시키는 이유는 ReLU 출력의 0 이 오차 없이 표현되게 하려는 것입니다 (Day 1 4교시).&lt;/p&gt;&#x27;},
 {n:&#x27;③ 예제 2-A — round 의 기울기&#x27;,vt:&#x27;계단의 평평한 곳&#x27;,run:()=&gt;play(2),
  q:[&#x27;fake_quant(w) 의 결과로 loss (0.1875) 를 계산해 역전파했습니다. w.grad 는?&#x27;,[&#x27;[0, 0, 0]&#x27;,&#x27;loss 를 줄이는 방향의 0 이 아닌 값 세 개&#x27;,&#x27;오류가 난다 — round 는 미분할 수 없어서&#x27;],0,&#x27;round 는 계단 함수라 평평한 곳의 미분이 0 입니다. PyTorch 는 오류 없이 0 을 돌려줍니다. loss 가 남아 있어도 weight 는 움직이지 않습니다 — 조용히 학습이 멈추는 것이 더 위험합니다.&#x27;],
  kv:[[&#x27;loss&#x27;,&#x27;0.1875&#x27;],[&#x27;w.grad&#x27;,&#x27;[0, 0, 0]&#x27;],[&#x27;결과&#x27;,&#x27;optimizer.step() 을 해도 w 는 그대로&#x27;]],st:[&#x27;bad&#x27;,&#x27;이대로는 QAT 가 불가능 — 3교시 STE 로 푼다&#x27;],
  code:`w = torch.tensor([0.31, -0.77, 0.20], requires_grad=True)\ntarget = torch.tensor([0.5, -0.5, 0.5])\nloss = ((fake_quant(w, 0.25, 0, -4, 3) - target) ** 2).sum()\nloss.backward()\ngrad_round = w.grad.clone()          &lt;span class=&quot;c&quot;&gt;# tensor([0., 0., 0.])&lt;/span&gt;`,
  ex:&#x27;&lt;p&gt;&lt;b&gt;제공 코드&lt;/b&gt;입니다. 여기서 만든 &lt;code&gt;w&lt;/code&gt; 와 &lt;code&gt;target&lt;/code&gt; 은 3교시 예제 3-A 의 작은 학습 실험에서 다시 씁니다.&lt;/p&gt;&#x27;},
 {n:&#x27;④ 정리 — 왜 &quot;fake&quot; 인가&#x27;,vt:&#x27;보는 값 · 저장되는 값&#x27;,run:()=&gt;play(3,400,3),
  q:[&#x27;QAT 로 학습하는 동안 모델 파일에 저장되는 weight 는 어떤 값일까요?&#x27;,[&#x27;FP32 — 진짜 INT8 은 배포할 때 만든다&#x27;,&#x27;INT8 정수 — 학습 중에도 정수로 저장한다&#x27;,&#x27;scale 로 나눈 값 — 정수에 가까운 FP32&#x27;],0,&#x27;forward 에서만 양자화된 값을 &quot;흉내&quot; 내고, 학습 · 저장되는 것은 FP32 weight 입니다. 그래야 작은 기울기로 조금씩 움직일 수 있습니다. 정수가 되는 것은 QDQ ONNX 를 TensorRT 엔진으로 만들 때입니다 (7교시).&#x27;],

  code:`&lt;span class=&quot;c&quot;&gt;# x → q = clamp(round(x / s) + zp, qmin, qmax) → x̂ = (q − zp) · s&lt;/span&gt;`,
  ex:&#x27;&lt;p&gt;&lt;b&gt;2교시 정리&lt;/b&gt;: fake quant = quantize → dequantize · weight 는 채널별 대칭 (매번), 활성값은 텐서별 비대칭 (보정 고정) · round 의 기울기가 0 이라 그대로는 학습 불가.&lt;/p&gt;&#x27;},

  q:[&#x27;round 의 기울기가 0 이라 학습이 멈췄습니다. STE 는 backward 를 어떻게 바꿀까요?&#x27;,[&#x27;round 를 부드러운 곡선 (sigmoid) 으로 바꿔 forward 와 backward 를 모두 고친다&#x27;,&#x27;forward 는 그대로 두고, backward 에서만 기울기를 그대로 통과시킨다&#x27;,&#x27;기울기 대신 무작위 방향으로 weight 를 조금씩 움직인다&#x27;],1,&#x27;forward 는 여전히 진짜 round (배포 때와 같은 숫자) 이고, backward 에서만 &quot;round 가 없는 것처럼&quot; 위에서 온 기울기를 그대로 내려보냅니다. 그래서 Straight-Through 입니다.&#x27;],
  kv:[[&#x27;torch.round&#x27;,&#x27;forward 계단 · backward 0&#x27;],[&#x27;STE round&#x27;,&#x27;forward 계단 · backward 1 (그대로)&#x27;],[&#x27;clamp (범위 밖)&#x27;,&#x27;backward 0&#x27;]],st:[&#x27;ok&#x27;,&#x27;forward 는 배포와 같게, backward 만 근사&#x27;],
  code:`&lt;span class=&quot;c&quot;&gt;# forward :  y = round(x)&lt;/span&gt;\n&lt;span class=&quot;c&quot;&gt;# backward:  ∂L/∂x = ∂L/∂y        ← &quot;곧게 통과 (straight-through)&quot;&lt;/span&gt;`,
  ex:&#x27;&lt;p&gt;forward 까지 부드럽게 바꾸면 학습 때 본 숫자와 배포 때의 숫자가 달라집니다. STE 는 forward 를 건드리지 않는 것이 핵심입니다.&lt;/p&gt;&#x27;},
 {n:&#x27;② 실습 3-1 — RoundSTE&#x27;,vt:&#x27;autograd.Function&#x27;,run:()=&gt;play(1),
  q:[&#x27;y = RoundSTE.apply(x) 뒤 (y × [1, 2, 3]).sum() 을 역전파하면 x.grad 는?&#x27;,[&#x27;[0, 0, 0] — round 를 지났으므로&#x27;,&#x27;[1, 2, 3] — 위에서 온 기울기 그대로&#x27;,&#x27;[1, 1, 1] — STE 의 기울기는 항상 1 이므로&#x27;],1,&#x27;backward(ctx, g) 의 g 는 &quot;출력에 대한 loss 의 기울기&quot; [1, 2, 3] 입니다. 그것을 그대로 돌려주므로 x.grad 도 [1, 2, 3] 입니다. &quot;항상 1&quot; 이 아니라 &quot;1 을 곱해 통과&quot; 입니다.&#x27;],
  kv:[[&#x27;forward&#x27;,&#x27;[0.2, 0.7, −1.6] → [0, 1, −2]&#x27;],[&#x27;backward&#x27;,&#x27;g = [1, 2, 3] → [1, 2, 3]&#x27;],[&#x27;사용&#x27;,&#x27;RoundSTE.apply(x)&#x27;]],st:[&#x27;ok&#x27;,&#x27;forward 는 반올림, backward 는 그대로&#x27;],
  code:`class RoundSTE(torch.autograd.Function):\n    @staticmethod\n    def forward(ctx, x):\n        return torch.round(x)\n\n    @staticmethod\n    def backward(ctx, g):\n        return &lt;span class=&quot;hl&quot;&gt;g&lt;/span&gt;                         &lt;span class=&quot;c&quot;&gt;# round 가 없는 것처럼 그대로 통과&lt;/span&gt;`,
  ex:&#x27;&lt;p&gt;&lt;b&gt;직접 구현&lt;/b&gt;: &lt;code&gt;torch.autograd.Function&lt;/code&gt; 을 상속하고 &lt;code&gt;@staticmethod&lt;/code&gt; 두 개를 정의합니다. 인스턴스를 만들지 않고 &lt;code&gt;RoundSTE.apply(x)&lt;/code&gt; 로 부릅니다.&lt;/p&gt;&#x27;},
 {n:&#x27;③ 실습 3-2 — STE fake_quant&#x27;,vt:&#x27;범위 밖은 기울기 0&#x27;,run:()=&gt;{S=2;return play(2);},
  q:[&#x27;STE 로 바꾼 fake_quant (범위 −1.0 ~ 0.75) 에 x = [−2.0, −0.4, 0.3, 0.6, 2.0] 을 넣었습니다. 범위 밖인 −2.0 과 2.0 의 기울기는?&#x27;,[&#x27;1 — STE 가 모든 값의 기울기를 통과시킨다&#x27;,&#x27;0 — clamp 가 막는다&#x27;,&#x27;−1 과 +1 — 범위 안으로 끌어당기는 방향&#x27;],1,&#x27;round 는 STE 로 통과하지만 clamp 는 그대로입니다. 범위 밖에서는 clamp 의 기울기가 0 이라 잘린 값은 학습되지 않습니다. 범위 안의 값만 기울기 1 을 받습니다: [0, 1, 1, 1, 0].&#x27;],
  kv:[[&#x27;기울기&#x27;,&#x27;[0, 1, 1, 1, 0]&#x27;],[&#x27;범위 안&#x27;,&#x27;(1 / scale) × scale = 1&#x27;],[&#x27;범위 밖&#x27;,&#x27;0 — 잘린 값은 움직이지 않는다&#x27;]],st:[&#x27;ok&#x27;,&#x27;이 정의 이후 2교시의 FakeQuant 도 STE 로 학습된다&#x27;],
  code:`def fake_quant(x, scale, zp, qmin, qmax):            &lt;span class=&quot;c&quot;&gt;# STE 버전으로 다시 정의&lt;/span&gt;\n    q = torch.clamp(&lt;span class=&quot;hl&quot;&gt;RoundSTE.apply&lt;/span&gt;(x / scale) + zp, qmin, qmax)\n    return (q - zp) * scale`,
  ex:&#x27;&lt;p&gt;&lt;b&gt;직접 구현&lt;/b&gt;: 2-1 의 함수에서 &lt;code&gt;torch.round&lt;/code&gt; 한 곳만 바꿉니다. 같은 이름으로 다시 정의했기 때문에 2교시의 &lt;code&gt;FakeQuant&lt;/code&gt; 모듈도 이제 이 STE 버전을 부릅니다.&lt;/p&gt;&#x27;},
 {n:&#x27;④ 예제 3-A — 작은 학습 실험&#x27;,vt:&#x27;weight 가 칸 사이를 옮겨 간다&#x27;,run:()=&gt;play(3,60,30),
  q:[&#x27;예제 2-A 의 w 를 STE 버전으로 50번 학습하면 loss (처음 0.1875) 는 어떻게 될까요?&#x27;,[&#x27;0.1875 그대로 — 여전히 계단이라 움직이지 못한다&#x27;,&#x27;0 — 양자화 결과가 target 칸에 들어간다&#x27;,&#x27;0.09 쯤 — 절반까지만 줄어든다&#x27;],1,&#x27;STE 로 기울기가 흐르자 w 가 [0.41, −0.62, 0.40] 으로 움직여, 양자화 결과가 정확히 [0.5, −0.5, 0.5] 가 됩니다. torch.round 버전은 w 가 처음 값 그대로입니다.&#x27;],
  kv:[[&#x27;round 버전&#x27;,&#x27;loss 0.1875 → 0.1875 · w 그대로&#x27;],[&#x27;STE 버전&#x27;,&#x27;loss 0.1875 → 0.0000&#x27;],[&#x27;STE 뒤 w&#x27;,&#x27;[0.41, −0.62, 0.40]&#x27;]],st:[&#x27;ok&#x27;,&#x27;QAT = 이것을 수만 개 weight · 진짜 loss 로&#x27;],
  code:`def toy_train(fq, steps=50):\n    w = torch.tensor([0.31, -0.77, 0.20], requires_grad=True)\n    opt = torch.optim.SGD([w], lr=0.1)\n    for _ in range(steps):\n        loss = ((fq(w, 0.25, 0, -4, 3) - target) ** 2).sum()\n        opt.zero_grad(); loss.backward(); opt.step()`,
  ex:&#x27;&lt;p&gt;&lt;b&gt;제공 코드&lt;/b&gt;입니다. 눈여겨볼 점: w 자체가 0.5 가 된 것이 아니라 (0.41), &lt;b&gt;양자화했을 때 0.5 가 되는 칸 안으로&lt;/b&gt; 들어갔습니다. QAT 는 &quot;양자화된 결과가 잘 맞도록&quot; FP32 weight 의 자리를 옮기는 학습입니다.&lt;/p&gt;&#x27;},
]);

  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}

const K={b:&#x27;#60a5fa&#x27;,a:&#x27;#f59e0b&#x27;,g:&#x27;#34d399&#x27;,r:&#x27;#f87171&#x27;,p:&#x27;#c084fc&#x27;,t:&#x27;#2dd4bf&#x27;,d:&#x27;#8a9bb8&#x27;,x:&#x27;#dbe4f0&#x27;,l:&#x27;#334155&#x27;,bg:&#x27;#111a2e&#x27;,z:&#x27;#1f2b45&#x27;};

&lt;h1&gt;${o.h1}&lt;/h1&gt;&lt;p class=&quot;sub&quot;&gt;${o.sub}&lt;/p&gt;

  code:`def fold(conv, bn):\n    k = bn.weight / torch.sqrt(bn.running_var + bn.eps)\n    c = nn.Conv2d(conv.in_channels, conv.out_channels, conv.kernel_size, conv.stride, conv.padding, bias=True)\n    c.weight.data = conv.weight.data * k.view(-1, 1, 1, 1)\n    c.bias.data = bn.bias.data - bn.running_mean * k + (conv.bias.data * k if conv.bias is not None else 0)\n    return c`,

  code:`def quantize_model(model, wbits=8, abits=8):\n    m = fold_all(model)\n    def swap(parent):\n        for name, ch in parent.named_children():\n            if isinstance(ch, nn.Conv2d): q = QConv2d(...).setup(wbits, abits)\n            elif isinstance(ch, nn.Linear): q = QLinear(...).setup(wbits, abits)\n            else: swap(ch); continue\n            q.weight.data, q.bias.data = ch.weight.data.clone(), ch.bias.data.clone(); &lt;span class=&quot;hl&quot;&gt;setattr(parent, name, q)&lt;/span&gt;\n    swap(m); return m.to(DEV)`,

  kv:[[&#x27;epoch 1 · 2 · 3&#x27;,&#x27;0.8290 · 0.8335 · 0.8320&#x27;],[&#x27;이득&#x27;,&#x27;+10.4%p (PTQ 0.728)&#x27;],[&#x27;시간&#x27;,&#x27;약 90초 (CPU) — GPU 는 수십 초&#x27;]],st:[&#x27;ok&#x27;,&#x27;QAT 로 W3A8 을 되살렸다 — FP32 와 1.4%p 차이&#x27;],
  code:`def train_qat(model, epochs=EPOCHS, lr=1e-3, on_epoch=None):\n    opt = torch.optim.SGD(model.parameters(), lr=lr, momentum=0.9, weight_decay=5e-4)\n    sched = torch.optim.lr_scheduler.CosineAnnealingLR(opt, epochs * (len(Xtr_u8) // 128 + 1))\n    for ep in range(epochs):\n        model.train()\n        for xb, yb in batches(seed=ep):\n            loss = F.cross_entropy(model(xb), yb)\n            opt.zero_grad(); loss.backward(); opt.step(); sched.step()\n        model.eval()\n        if on_epoch: on_epoch(ep, model)`,
  ex:&#x27;&lt;p&gt;&lt;b&gt;직접 구현&lt;/b&gt;: 평범한 학습 루프입니다 — 특별한 것은 모델 안의 FakeQuant (STE) 뿐입니다. 이 함수는 6교시 (ModelOpt QAT) 와 8교시에서 그대로 다시 쓰고, Day 5 의 &lt;code&gt;finetune&lt;/code&gt; 도 같은 구조입니다.&lt;/p&gt;&#x27;},
 {n:&#x27;④ 설정 — 왜 작은 lr · 짧은 epoch&#x27;,vt:&#x27;fine-tuning 의 조건&#x27;,run:()=&gt;play(3,300,4),
  q:[&#x27;QAT 의 learning rate 를 처음 학습의 1/100 (1e-3) 로 작게 잡는 이유는?&#x27;,[&#x27;양자화된 모델은 큰 lr 에서 기울기가 0 이 되므로&#x27;,&#x27;이미 학습된 weight 를 조금만 옮기면 되므로&#x27;,&#x27;lr 이 작아야 FakeQuant 의 보정 범위가 바뀌지 않으므로&#x27;],1,&#x27;QAT 는 처음부터 다시 배우는 것이 아니라, 잘 학습된 weight 를 양자화에 맞게 미세 조정하는 것입니다. 큰 lr 은 이미 배운 것을 흩뜨립니다. (Day 5 의 pruning 뒤 fine-tuning 은 더 크게 망가진 모델이라 1e-2 를 씁니다.)&#x27;],
  kv:[[&#x27;lr&#x27;,&#x27;1e-3 · cosine&#x27;],[&#x27;epoch&#x27;,&#x27;3&#x27;],[&#x27;비용&#x27;,&#x27;CPU 약 1.5분 · GPU 수십 초&#x27;]],st:[&#x27;info&#x27;,&#x27;정확도와 함께 학습 비용도 기록한다&#x27;],
  code:`EPOCHS = 3\nt_qat3 = train_qat(q3, on_epoch=lambda ep, m: print(f&quot;  epoch {ep + 1}: {acc_torch(m):.4f}&quot;))`,
  ex:&#x27;&lt;p&gt;&lt;b&gt;4교시 정리&lt;/b&gt;: BN folding → QConv2d (FakeQuant 2개) → 보정 (= PTQ) → 짧은 fine-tuning (= QAT). W3A8 은 0.73 → 0.83. 5교시에는 같은 일을 NVIDIA ModelOpt 로 한 줄에 합니다.&lt;/p&gt;&#x27;},
]);

function ask(q){const [qs,opts,ans,why]=q;
  $(&#x27;#quiz&#x27;).innerHTML=`&lt;p class=&quot;q&quot;&gt;${qs}&lt;/p&gt;&lt;div class=&quot;opts&quot;&gt;${opts.map((o,i)=&gt;`&lt;button type=&quot;button&quot; data-i=&quot;${i}&quot;&gt;${o}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;p class=&quot;why&quot; hidden&gt;&lt;/p&gt;`;
  $$(&#x27;#quiz .opts button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{const i=+b.dataset.i;$$(&#x27;#quiz .opts button&#x27;).forEach((x,j)=&gt;{x.disabled=true;x.classList.toggle(&#x27;ok&#x27;,j===ans);x.classList.toggle(&#x27;no&#x27;,j===i&amp;&amp;i!==ans);});
    const w=$(&#x27;#quiz .why&#x27;);w.hidden=false;w.innerHTML=(i===ans?&#x27;✅ 맞았습니다. &#x27;:&#x27;❌ 다시 생각해 봅시다. &#x27;)+why;reveal();});}

function box(g,x,y,w,h,t,c,sub,on){g.fillStyle=on?c+&#x27;33&#x27;:K.bg;g.strokeStyle=c;g.lineWidth=on?2.5:1.2;g.beginPath();g.roundRect(x,y,w,h,7);g.fill();g.stroke();g.lineWidth=1;

 {n:&#x27;① 개념 — 직접 만든 것 ↔ ModelOpt&#x27;,vt:&#x27;같은 일을 하는 도구&#x27;,run:()=&gt;play(0,300,5),

 {n:&#x27;② 실습 5-1 — mtq.quantize (INT8)&#x27;,vt:&#x27;양자화기 110개 중 켜진 것&#x27;,run:()=&gt;play(1,40,37),

  kv:[[&#x27;입력 쪽&#x27;,&#x27;Q → DQ (텐서별 scale)&#x27;],[&#x27;weight 쪽&#x27;,&#x27;Q → DQ (채널별 scale · axis 0)&#x27;],[&#x27;BN&#x27;,&#x27;21개 남음 — TensorRT 가 접는다&#x27;]],st:[&#x27;info&#x27;,&#x27;내보낸 그래프는 한 번 열어 본다&#x27;],
  code:`Counter(n.op_type for n in onnx.load(&quot;rn20_qat.onnx&quot;).graph.node)\n&lt;span class=&quot;c&quot;&gt;# {&#x27;QuantizeLinear&#x27;: 45, &#x27;DequantizeLinear&#x27;: 45, &#x27;Conv&#x27;: 21, &#x27;BatchNormalization&#x27;: 21, ...}&lt;/span&gt;`,
  ex:&#x27;&lt;p&gt;scale · zero_point 가 initializer 가 아니라 Constant 노드로 들어가서, Day 3 의 &lt;code&gt;trt_check&lt;/code&gt; 를 Constant 까지 보도록 넓혀 데이터 셀에 넣어 두었습니다. 도구마다 QDQ 를 적는 방식이 조금씩 다릅니다.&lt;/p&gt;&#x27;},
 {n:&#x27;③ 실습 7-2 — INT8 엔진&#x27;,vt:&#x27;보정 없이 빌드&#x27;,run:()=&gt;play(2),
  q:[&#x27;QAT 로 만든 QDQ ONNX 로 TensorRT INT8 엔진을 빌드할 때 보정 데이터가 필요할까요?&#x27;,[&#x27;필요하다 — QAT 모델은 학습 데이터로 다시 보정해야 한다&#x27;,&#x27;필요 없다 — scale 이 이미 ONNX 안에 있다&#x27;,&#x27;필요하다 — FP16 플래그를 함께 켠 경우에만&#x27;],1,&#x27;Day 3 4교시와 같습니다. QDQ ONNX 에는 scale 이 들어 있으므로 INT8 + FP16 플래그만 켜면 됩니다. QAT 로 학습된 범위가 그대로 엔진에 들어갑니다.&#x27;],
  kv:[[&#x27;빌드&#x27;,&#x27;build_once(…, fp16=True, int8=True)&#x27;],[&#x27;CPU 실측 (ORT)&#x27;,&#x27;0.8405 · 약 1.4 ms · 1,135 KB&#x27;],[&#x27;TensorRT 값&#x27;,&#x27;수업에서 GPU 로 직접 측정&#x27;]],st:[&#x27;info&#x27;,&#x27;엔진 지연 · 크기는 GPU 에서 확인합니다&#x27;],
  code:`if TRT_OK:\n    path = build_once(&quot;rn20_qat.onnx&quot;, &quot;rn20_qat.engine&quot;, fp16=True, int8=True); infer = TRTInfer(path)\nelse:\n    path = &quot;rn20_qat.onnx&quot;; s = make_session(path); infer = lambda x, s=s: s.run(None, {&quot;input&quot;: x})[0]\ndeploy_row = {&quot;model&quot;: &quot;ModelOpt QAT INT8&quot;, &quot;backend&quot;: BACKEND, &quot;acc&quot;: ..., &quot;mean_ms&quot;: ..., &quot;size_kb&quot;: size_kb(path)}`,
  ex:&#x27;&lt;p&gt;&lt;b&gt;직접 구현&lt;/b&gt;: Day 3 실습 4-2 의 &lt;code&gt;build_engine&lt;/code&gt; (환경 셀) 을 그대로 씁니다. GPU 가 없으면 같은 값을 ONNX Runtime CPU 로 잽니다 — 이때 지연 · 크기는 엔진이 아니라 ONNX 의 값입니다.&lt;/p&gt;&#x27;},
 {n:&#x27;④ 정리 — PTQ 든 QAT 든 같은 길&#x27;,vt:&#x27;QDQ ONNX 가 만나는 곳&#x27;,run:()=&gt;play(3,500,2),
  q:[&#x27;Day 3 에서 PTQ 로 만든 QDQ ONNX 와 오늘 QAT 로 만든 QDQ ONNX — TensorRT 로 가는 배포 경로가 다를까요?&#x27;,[&#x27;다르다 — QAT 모델은 전용 빌드 플래그가 필요하다&#x27;,&#x27;같다 — 둘 다 QDQ ONNX 이고 같은 build_engine 을 쓴다&#x27;,&#x27;다르다 — PTQ 모델만 FP16 fallback 을 쓸 수 있다&#x27;],1,&#x27;TensorRT 는 Q/DQ 와 그 안의 scale 만 봅니다. 그 scale 을 보정으로 정했는지 (PTQ) 학습으로 다듬었는지 (QAT) 는 구분하지 않습니다. 그래서 Day 3 의 함수들이 오늘도 그대로 쓰입니다.&#x27;],
  kv:[[&#x27;PTQ (Day 3)&#x27;,&#x27;ORT quantize_static → QDQ ONNX&#x27;],[&#x27;QAT (오늘)&#x27;,&#x27;ModelOpt → torch.onnx.export → QDQ ONNX&#x27;],[&#x27;이후&#x27;,&#x27;같은 trt_check · build_engine&#x27;]],st:[&#x27;ok&#x27;,&#x27;explicit (QDQ) 경로 하나로 모인다&#x27;],
  code:`&lt;span class=&quot;c&quot;&gt;# trtexec --onnx=rn20_qat.onnx --int8 --fp16&lt;/span&gt;`,
  ex:&#x27;&lt;p&gt;&lt;b&gt;7교시 정리&lt;/b&gt;: ModelOpt 모델 → QDQ ONNX (scale 포함 · zero_point 0) → 보정 없이 INT8 + FP16 엔진. QDQ ONNX 는 FP32 크기이고 엔진이 작습니다. 8교시에 다섯 가지 방법을 한 표에 놓습니다.&lt;/p&gt;&#x27;},

<script>
const ids = [...document.querySelectorAll('nav button')].map(b => b.dataset.id);
function fit(fr) {
  try {
    const d = fr.contentDocument; if (!d || !d.body) return;
    fr.style.height = Math.max(600, d.documentElement.scrollHeight) + 'px';
  } catch (e) {}
}
function show(id, push) {
  if (!ids.includes(id)) id = ids[0];
  document.querySelectorAll('section.lesson').forEach(s => s.classList.toggle('active', s.id === id));
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-current', b.dataset.id === id ? 'true' : 'false'));
  const sec = document.getElementById(id);
  document.title = sec.dataset.title + ' — Quantization·Pruning Day 4';
  const fr = sec.querySelector('iframe');
  fr.loading = 'eager'; fit(fr);
  if (push) history.replaceState(null, '', '#' + id);
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('section.lesson iframe').forEach(fr => {
  fr.addEventListener('load', () => {
    fit(fr);
    try {
      new ResizeObserver(() => fit(fr)).observe(fr.contentDocument.body);
      fr.contentDocument.addEventListener('keydown', key);   // iframe 안에서도 ← → 동작
    } catch (e) {}
  });
});
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.id, true));
function key(e) {
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const cur = ids.indexOf(location.hash.slice(1) || ids[0]);
  if (e.key === 'ArrowRight' && cur < ids.length - 1) show(ids[cur + 1], true);
  if (e.key === 'ArrowLeft' && cur > 0) show(ids[cur - 1], true);
}
document.addEventListener('keydown', key);
window.addEventListener('resize', () => document.querySelectorAll('section.lesson.active iframe').forEach(fit));
window.addEventListener('hashchange', () => show(location.hash.slice(1), false));   // 주소창에서 #d1-N 을 바꿔도 이동
show(location.hash.slice(1), false);
</script>
