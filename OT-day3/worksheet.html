<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONNX·TensorRT Day 3 — ONNX Runtime 으로 빠르게 · 개념 워크시트</title>
<style>
  :root{--bg:#0b1220;--panel:#111a2e;--line:#1f2b45;--text:#dbe4f0;--dim:#8a9bb8;--amber:#f5b942;--teal:#2dd4bf;--blue:#60a5fa;--green:#4ade80;--red:#f87171;--purple:#c084fc;--mono:"Consolas","D2Coding","JetBrains Mono",monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR","Segoe UI",sans-serif;font-size:15px;line-height:1.55}
  .app{max-width:920px;margin:0 auto;padding:22px 20px 40px}
  h1{color:var(--amber);font-size:24px;margin:0 0 6px}
  .sub{color:var(--dim);margin:0 0 14px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
  .panel h2{font-size:14px;color:var(--dim);margin:0 0 10px;font-weight:600}
  button{background:#172239;border:1px solid #2a3a5c;color:var(--text);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--amber)}button.active{background:#3a2e12;border-color:var(--amber);color:var(--amber)}
  button.primary{background:#123d33;border-color:var(--teal);color:var(--teal);font-weight:700;padding:9px 18px;font-size:14px}
  button.submit{background:#3a2e12;border-color:var(--amber);color:var(--amber);font-weight:700;padding:9px 18px;font-size:14px}
  button:disabled{opacity:.5;cursor:default}
  button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  input[type=text]{background:#0a0f1c;color:var(--text);border:1px solid #2a3a5c;border-radius:6px;padding:6px 10px;font-family:var(--mono);font-size:14px}
  select{background:#0a0f1c;color:var(--text);border:1px solid #2a3a5c;border-radius:6px;padding:4px 8px;font-family:inherit;font-size:14px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px}
  .tabs button .s{font-family:var(--mono);font-size:11px;color:var(--dim);margin-left:6px}
  .tabs button.graded .s{color:var(--green)}
  .legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .tag{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--dim);font-family:var(--mono)}
  .head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .head .t{color:var(--amber);font-size:17px}
  .head .a{font-size:13px;color:var(--teal);font-family:var(--mono)}
  .q{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;background:#0e1628}
  .q.unans{border-color:#5a3a1a}
  .q.ok{border-color:#1f6b45}.q.bad{border-color:#7a2e2e}
  .qh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .q .n{font-family:var(--mono);color:var(--dim);font-size:12px}
  .ty{font-size:11.5px;border-radius:999px;padding:1px 9px;border:1px solid}
  .q .p{margin:6px 0 10px;font-size:15px}
  .q code,.fb code,.dg code{font-family:var(--mono);color:var(--blue);background:#0a0f1c;padding:1px 5px;border-radius:4px}
  .q pre{font-family:var(--mono);background:#0a0f1c;border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:6px 0 4px;font-size:14px;white-space:pre;overflow-x:auto;line-height:1.9}
  .q pre input{font-size:13px;padding:2px 6px;width:auto;min-width:5ch}
  .opts{display:grid;gap:6px}
  .opt{text-align:left;padding:8px 12px;font-size:14px}
  .opt .box{display:inline-block;width:18px;font-family:var(--mono);color:var(--dim)}
  .opt.sel{border-color:var(--amber);background:#1f1a0c}
  .opt.ok{border-color:var(--green);color:var(--green);background:#0d2216}
  .opt.bad{border-color:var(--red);color:var(--red);background:#2a1212}
  .opt.miss{border-color:var(--green);border-style:dashed}
  .ox{display:flex;gap:10px}
  .ox button{font-size:22px;width:78px;height:54px;font-weight:700}
  .fill{line-height:2.3}
  .mrow{display:grid;grid-template-columns:1fr 24px minmax(160px,1.2fr);gap:8px;align-items:center;margin-bottom:6px}
  .mrow .l{background:#0a0f1c;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:14px}
  .mrow select{width:100%}
  .mrow .arr{color:var(--dim);text-align:center}
  .mrow.ok select{border-color:var(--green)}.mrow.bad select{border-color:var(--red)}
  .ord{list-style:none;margin:0;padding:0;display:grid;gap:6px}
  .ord li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;background:#0a0f1c;border:1px solid #2a3a5c;border-radius:8px;padding:7px 10px;cursor:grab;font-size:14px}
  .ord li.drag{opacity:.4}.ord li.over{border-color:var(--amber)}
  .ord li .k{font-family:var(--mono);color:var(--dim)}
  .ord li .mv button{padding:2px 8px;margin-left:4px}
  .ord li.ok{border-color:var(--green)}.ord li.bad{border-color:var(--red)}
  .hot{background:#0a0f1c;border:1px solid var(--line);border-radius:8px;padding:6px;overflow-x:auto}
  .hot svg{display:block;max-width:100%;height:auto;margin:0 auto}
  .hot .rg{cursor:pointer;fill:transparent;stroke:transparent;stroke-width:2.5}
  .hot .rg:hover{stroke:#f5b94288}
  .hot .rg.sel{stroke:var(--amber);fill:#f5b94222}
  .hot .rg.ok{stroke:var(--green);fill:#4ade8026}
  .hot .rg.bad{stroke:var(--red);fill:#f8717126}
  .card{perspective:900px;max-width:560px}
  .card .in{position:relative;min-height:130px;transition:transform .5s;transform-style:preserve-3d}
  .card.flip .in{transform:rotateY(180deg)}
  .card .f,.card .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;border:1px solid #2a3a5c;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px 18px;font-size:16px}
  .card .f{background:#14203a;color:var(--amber)}
  .card .b{background:#0f2a27;color:var(--teal);transform:rotateY(180deg)}
  @media (prefers-reduced-motion:reduce){.card .in{transition:none}}
  .selfrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
  .selfrow .hint{margin-left:4px}
  .fb{margin-top:10px;font-size:13px;color:var(--dim);border-left:3px solid var(--line);padding-left:10px}
  .fb.ok{border-left-color:var(--green)}.fb.bad{border-left-color:var(--red)}
  .fb b.v{display:block;margin-bottom:2px}
  .fb.ok b.v{color:var(--green)}.fb.bad b.v{color:var(--red)}
  .fb .anim{color:var(--teal);font-family:var(--mono);font-size:12px;display:block;margin-top:3px}
  .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
  .code{font-family:var(--mono);font-size:20px;color:var(--amber);letter-spacing:1px}
  .score{font-family:var(--mono);color:var(--green);font-size:16px}
  .hint{color:var(--dim);font-size:13px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:0;max-width:860px;width:92vw;max-height:88vh}
  dialog::backdrop{background:#000a}
  .dg{padding:18px 20px}
  .dg h3{color:var(--amber);margin:0 0 4px;font-size:20px}
  .dg .meta{color:var(--dim);font-size:13px;margin-bottom:12px;font-family:var(--mono)}
  .dg .sec{margin:14px 0 6px;color:var(--teal);font-weight:700;font-size:14px}
  .dg table{width:100%;border-collapse:collapse;font-size:13px}
  .dg th{text-align:left;color:var(--dim);font-weight:600;padding:5px 8px;border-bottom:1px solid var(--line);font-size:12px}
  .dg td{padding:5px 8px;border-bottom:1px solid #16203a;vertical-align:top}
  .dg .ok{color:var(--green)}.dg .bad{color:var(--red)}.dg .none{color:var(--dim)}
  .dg .sum{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0;font-family:var(--mono)}
  .dgbar{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 20px;display:flex;gap:8px;justify-content:flex-end;align-items:center}
  .toast{color:var(--green);font-size:13px;margin-right:auto}
  .body{overflow:auto;max-height:calc(88vh - 60px)}
  @media(max-width:600px){.mrow{grid-template-columns:1fr;gap:4px}.mrow .arr{display:none}}
</style>
</head>
<body>
<div class="app">
  <h1>ONNX·TensorRT Day 3 — ONNX Runtime 으로 빠르게 · 개념 워크시트</h1>
  <p class="sub">교시마다 10문항 — 객관식 · O/X · 빈칸 · 짝 맞추기 · 순서 배열 · 핫스팟 · 코드 완성 등 9가지 유형이 섞여 나옵니다. 답을 고른 뒤 아래 <b style="color:var(--teal)">채점하기</b>를 누르면 정오 · 해설과 결과 코드가 나타납니다. 채점 전에는 답을 바꿀 수 있고, 채점 후에는 잠깁니다. 모든 교시를 마치면 <b style="color:var(--amber)">제출</b>로 오답 정리를 열고, <b>캡처</b>로 복사해 노션에 붙여 넣으세요.</p>

  <div class="panel">
    <div class="row"><label style="color:var(--dim);font-size:13px">이름 <input type="text" id="name" placeholder="홍길동"></label><span class="hint">이름은 결과 코드 계산에만 쓰이며 저장되지 않습니다.</span></div>
  </div>
  <div class="panel"><h2>교시</h2><div class="tabs" id="tabs"></div><div class="legend" id="legend"></div></div>
  <div class="panel" id="sheet"></div>
  <div class="panel">
    <div class="actions">
      <button class="primary" id="gradeBtn">채점하기</button>
      <span class="score" id="rscore"></span>
      <span class="hint" id="rhint"></span>
      <span class="code" id="rcode">—</span>
    </div>
    <div class="actions" style="margin-top:12px">
      <button class="submit" id="submitBtn">제출 (오답 정리)</button>
      <button id="resetBtn">이 교시 다시 풀기</button>
    </div>
  </div>
</div>

<dialog id="dlg">
  <div class="body"><div class="dg" id="dgBody"></div></div>
  <div class="dgbar"><span class="toast" id="toast"></span><button id="captureBtn" class="primary">📋 캡처 (노션용 복사)</button><button id="closeBtn">닫기</button></div>
</dialog>

<script>
const Q = [{"t": "1교시 · Day 2 복습 · 오늘의 모델 · GPU 확인", "anim": "D3-1 오늘의 지도 · 실험 원칙", "qs": [{"type": "single", "p": "<code>ort.get_available_providers()</code> 가 돌려주는 것은?", "o": ["이 세션이 실제로 쓰고 있는 실행기", "이 컴퓨터에 <b>설치된</b> (쓸 수 있는) 실행기 목록", "GPU 가 있는지 여부 (True / False)", "ONNX 파일이 요구하는 실행기"], "a": 1, "w": "설치 목록일 뿐입니다. 실제로 GPU 에서 도는지는 세션을 만든 뒤 <code>sess.get_providers()</code> 로 확인합니다. 실행 예 (CPU 런타임): <code>['AzureExecutionProvider', 'CPUExecutionProvider']</code>.", "an": "문제 1-2"}, {"type": "single", "p": "<code>providers=[\"CUDAExecutionProvider\", \"CPUExecutionProvider\"]</code> 로 세션을 만들었는데 CUDA 라이브러리가 맞지 않습니다. 어떻게 될까요?", "o": ["ImportError 로 셀이 멈춘다", "세션이 만들어지지 않고 None 이 된다", "예외 없이 다음 후보인 CPUExecutionProvider 로 넘어가 실행된다", "GPU 와 CPU 가 계산을 반씩 나눠 맡는다"], "a": 2, "w": "providers 는 <b>희망 목록</b> — 앞에서부터 시도하고 안 되면 다음 것으로 넘어갑니다 (예외 없이!). 그래서 'GPU 로 돌린 줄 알았는데 CPU 였다' 가 흔합니다.", "an": "문제 1-2 · 해설"}, {"type": "multi", "p": "<b>오늘의 실험 원칙</b>에 맞는 것을 모두 고르세요.", "o": ["시간을 아끼려고 스레드 수와 최적화 레벨을 한 실험에서 동시에 바꾼다", "모델 · 실행기 · 스레드 · 레벨 · 배치 · 장치를 표의 열로 함께 적는다", "설정을 바꾼 뒤 출력이 이전과 같은지 <code>allclose</code> 로 확인한다", "빨라지기만 하면 출력이 조금 달라져도 괜찮다", "한 번에 손잡이 하나만 바꿔 비교한다"], "a": [1, 2, 4], "w": "① 한 번에 하나만 바꾼다 ② 조건을 함께 적는다 ③ 바꾼 뒤에도 결과는 같아야 한다. 둘을 동시에 바꾸면 무엇 때문에 빨라졌는지 알 수 없습니다.", "an": "1교시 · 오늘의 실험 원칙"}, {"type": "ox", "p": "<code>mnv3s.onnx</code> 는 가중치를 내려받지 않고 구조만 만든 모델이라, 이 모델로 잰 속도는 믿을 수 없다.", "a": false, "w": "속도는 가중치 <b>값</b>이 아니라 <b>구조</b> (연산 종류 · 크기 · 순서) 로 정해집니다. 예측 결과에는 의미가 없지만 속도 실험에는 충분합니다. 노드 127개 · 10.2 MB · Conv 52개.", "an": "오늘의 모델 · 문제 1-1 해설"}, {"type": "short", "p": "세션이 <b>실제로</b> 쓰는 실행기 목록을 돌려주는 메서드는? <code>sess.____()</code>", "a": ["get_providers", "get_providers()", "sess.get_providers()"], "w": "<code>get_providers()</code> — 맨 앞이 실제로 쓰이는 실행기입니다. <code>used[0] == \"CUDAExecutionProvider\"</code> 이면 GPU_OK.", "an": "문제 1-2"}, {"type": "drop", "p": "문제 1-1 — MobileNetV3 를 어제 8교시 배포 규칙 그대로 내보냅니다.", "p2": "<code>dynamic_axes</code> 의 0번 축 이름은 {}, <code>opset_version</code> 은 {}, 출력 이름은 {} 로 정한다.", "opts": [["\"batch\"", "0", "None"], ["13", "17", "20"], ["\"output\"", "\"logits\"", "\"probs\""]], "a": [0, 1, 1], "w": "입력 shape 가 <code>['batch', 3, 224, 224]</code> 가 되고, opset 17 은 Day 2 배포 파일과 같은 판 — Day 4 TensorRT 로 그대로 넘깁니다.", "an": "문제 1-1"}, {"type": "match", "p": "오늘 돌릴 손잡이와 그 교시 · 코드를 짝지으세요.", "left": ["스레드 수", "그래프 최적화 레벨", "CPU → GPU", "어디가 느린가"], "right": ["3교시 <code>intra_op_num_threads</code>", "4교시 <code>graph_optimization_level</code>", "5교시 <code>CUDAExecutionProvider</code>", "7교시 <code>enable_profiling</code>"], "a": [0, 1, 2, 3], "w": "손잡이 다섯 개: 스레드 · 최적화 레벨 · CPU/GPU · 배치 크기 (6교시), 그리고 어디가 느린지 보는 profiling.", "an": "D3-1 · 오늘의 지도"}, {"type": "order", "p": "문제 1-1 의 흐름으로 배열하세요.", "items": ["<code>make_mnv3s()</code> 로 모델 만들기 (eval 상태)", "<code>torch.onnx.export</code> → <code>mnv3s.onnx</code> (batch 자유 · opset 17)", "<code>InferenceSession</code> 으로 열기 (providers=CPU)", "같은 <code>x1</code> 을 <code>sess.run</code>", "<code>np.allclose(ORT 결과, ref, atol=1e-4)</code>"], "w": "<code>make_mnv3s()</code> 는 <code>eval()</code> 상태로 돌려줍니다. PyTorch 2.15 의 <code>torch.onnx.export</code> 는 기본으로 eval 모드 그래프를 기록하므로, eval() 을 빠뜨리면 ONNX 파일이 아니라 <b>비교 기준인 PyTorch 결과 (ref)</b> 가 BN 배치 통계 때문에 달라집니다. 실행 예: PyTorch 와 같다: True.", "an": "문제 1-1"}, {"type": "hot", "p": "CUDA 라이브러리가 맞지 않는 런타임의 셀 출력입니다. <b>지금 실제로 어느 실행기로 돌고 있는지</b> 알려 주는 줄을 클릭하세요.", "w": "<b><code>sess.get_providers()</code></b> 입니다. 설치 목록에 CUDA 가 있고, 희망 목록 맨 앞에 CUDA 를 넣었고, run 도 잘 끝났지만 — 실제 실행기는 CPU 뿐입니다. 조용히 CPU 로 넘어간 것.", "an": "문제 1-2 · 해설", "viewBox": "0 0 720 290", "sw": 720, "svg": "<defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#8a9bb8\"/></marker><marker id=\"ahr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#f87171\"/></marker></defs> ont-weight=\"normal\" dominant-baseline=\"middle\">['CPUExecutionProvider']</text><rect x=\"32\" y=\"216\" width=\"656\" height=\"50\" rx=\"5\" fill=\"#101a30\" stroke=\"#2a3a5c\" stroke-width=\"1\"/><text x=\"44\" y=\"232\" font-size=\"11.5\" fill=\"#dbe4f0\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">&gt;&gt;&gt; sess.run(None, {\"input\": x1})[0].shape</text><text x=\"70\" y=\"251\" font-size=\"11.5\" fill=\"#2dd4bf\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">(1, 1000)</text>", "regions": [{"id": "avail", "label": "ort.get_available_providers()", "x": 32, "y": 48, "w": 656, "h": 50}, {"id": "want", "label": "sess = ort.InferenceSession(\"mnv3s.onnx\",", "x": 32, "y": 104, "w": 656, "h": 50}, {"id": "used", "label": "sess.get_providers()", "x": 32, "y": 160, "w": 656, "h": 50}, {"id": "run", "label": "sess.run(None, {\"input\": x1})[0].shape", "x": 32, "y": 216, "w": 656, "h": 50}], "a": "used"}, {"type": "code", "p": "문제 1-2 — 빈칸을 채우세요.", "code": "probe = ort.InferenceSession(\"mnist_cnn_dyn.onnx\", providers=[\"{{}}\", \"CPUExecutionProvider\"])\nused = probe.{{}}()\nGPU_OK = used[{{}}] == \"CUDAExecutionProvider\"\nprint(\"실제 사용:\", used, \"→\", \"GPU 사용 가능\" if GPU_OK else \"GPU 없음 — 런타임 유형 확인\")", "a": [["CUDAExecutionProvider"], ["get_providers"], ["0"]], "w": "GPU_OK 가 False 면 런타임 유형이 T4 GPU 인지 확인합니다 (5교시만 영향). 확인 셀은 <code>used[-1] == \"CPUExecutionProvider\"</code> 도 검사합니다.", "an": "문제 1-2"}]}, {"t": "2교시 · 시간을 재는 법 · bench()", "anim": "D3-2 재는 법 — warm-up · p95", "qs": [{"type": "single", "p": "추론처럼 <b>짧은 시간</b>을 재기에 알맞은 시계는?", "o": ["<code>time.perf_counter()</code>", "<code>time.time()</code>", "<code>time.sleep()</code>", "<code>datetime.now()</code>"], "a": 0, "w": "<code>perf_counter()</code> 는 초 단위 고해상도 시계 — 실행 전 · 후 차이 × 1000 = ms. <code>time.time()</code> 은 짧은 시간에서 오차가 큽니다.", "an": "문제 2-1 · 해설"}, {  for _ in range(n):\n        t0 = time.{{}}()\n        sess.run(None, {name: x})\n        t.append((time.perf_counter() - t0) * {{}})\n    t = np.array(t)\n    return {\"mean\": t.mean(), \"p50\": np.percentile(t, 50), \"p95\": np.percentile(t, {{}}),\n            \"fps\": 1000 / t.mean() * x.shape[{{}}]}", "a": [["perf_counter"], ["1000"], ["95"], ["0"]], "w": "<code>x.shape[0]</code> = 배치 크기. SimpleConvNet 은 0.1 ms 대로 너무 빨라 측정 오차가 커서 오늘 실험은 주로 MobileNetV3 로 합니다.", "an": "문제 2-3"}]}, {"t": "3교시 · 스레드 수 · SessionOptions", "anim": "D3-3 스레드 · 코어", "qs": [{"type": "single", "p": "<code>SessionOptions.intra_op_num_threads</code> 가 정하는 것은?", "o": ["연산 <b>하나</b>를 몇 개의 스레드가 나눠 계산할지", "동시에 만들 수 있는 세션 수", "GPU 스트림 수", "배치를 몇 조각으로 나눠 실행할지"], "a": 0, "w": "스레드 = 일꾼, 코어 = 작업대. Conv 하나를 몇 명이 나눠 계산하느냐입니다.", "an": "3교시 · D3-3"}, {"type": "single", "p": "코어 2개 런타임의 실행 예 — 스레드 1 · 2 · 4 의 평균이 <b>1.87 · 1.74 · 3.96 ms</b> 입니다. 옳은 해석은?", "o": ["스레드는 많을수록 빠르다", "스레드 4가 가장 빠르다", "1 스레드가 언제나 최선이다", "코어 수 (2) 를 넘기면 일꾼들이 작업대를 번갈아 써서 오히려 느려진다"], "a": 3, "w": "코어 수가 상한입니다. 코어보다 스레드가 많으면 (oversubscription) 서로 기다리느라 평균도, 특히 p95 가 크게 나빠집니다.", "an": "문제 3-1 · 3-2"}, {"type": "multi", "p": "<code>SessionOptions</code> 에 대해 옳은 것을 모두 고르세요.", "o": ["<code>so</code> 를 만들고 값을 정한 뒤 <code>InferenceSession(path, so, providers=…)</code> 에 넘긴다", "세션을 만든 뒤 <code>so.intra_op_num_threads</code> 를 바꾸면 그 세션에 바로 적용된다", "<code>intra_op_num_threads</code> 의 기본값 0 은 코어 수에 맞춰 자동으로 정한다", "스레드 실험 중에는 스레드 말고 아무것도 바꾸지 않는다", "스레드를 늘리면 작은 연산도 무조건 빨라진다"], "a": [0, 2, 3], "w": "옵션 → 세션 순서. 이미 만든 세션에는 적용되지 않습니다. 작은 연산은 나누는 비용이 더 클 수도 있습니다.", "an": "3교시 · ⚠️ 자주 하는 실수"}, {"type": "ox", "p": "코어보다 스레드가 많아지면 평균보다 <b>p95</b> 가 먼저 나빠진다.", "a": true, "w": "일꾼들이 작업대를 번갈아 쓰면 '가끔 크게' 늦어집니다 → 꼬리 (p95) 부터 나빠집니다. 그래서 실시간이면 p95 가 가장 작은 줄로 고릅니다.", "an": "문제 3-2 · 해설"}, {"type": "short", "p": "<code>SessionOptions</code> 에서 연산 하나에 쓸 스레드 수를 정하는 속성 이름은? <code>so.____ = 2</code>", "a": ["intra_op_num_threads", "so.intra_op_num_threads"], "w": path"], ["mean"]], "w": "<code>LEVELS</code> 는 'DISABLE' → <code>ORT_DISABLE_ALL</code> … 'ALL' → <code>ORT_ENABLE_ALL</code> 사전. <code>iloc[0]</code> = DISABLE 줄이라 첫 줄의 speedup 은 1.", "an": "make_session · 문제 4-2"}]}, {"t": "5교시 · CPU → GPU · CUDAExecutionProvider", "anim": "D3-5 CPU → GPU", "qs": [{"type": "single", "p": "설치 셀이 <code>onnxruntime-gpu</code> 를 깔기 전에 <code>pip uninstall -y onnxruntime</code> 을 먼저 하는 이유는?", "o": ["GPU 판이 CPU 판보다 용량이 작아서", "CPU 판은 Colab 에서 동작하지 않아서", "CPU 판과 GPU 판을 같이 깔면 어느 쪽이 import 되는지 꼬여 GPU 가 안 보일 수 있어서", "<code>onnx</code> 패키지와 이름이 겹쳐서"], "a": 2, "w": "<code>onnxruntime</code> 과 <code>onnxruntime-gpu</code> 는 같은 <code>import onnxruntime</code> 을 씁니다. CPU 판을 지우고 GPU 판만 깔아야 합니다.", "an": "설치 셀 · 5교시 ⚠️"}, {"type": "single", "p": "GPU 세션의 <b>첫 실행</b>이 수백 ms ~ 수 초 걸리는 이유로 맞는 것은?", "o": ["CUDA 초기화 · GPU 메모리 확보 · cuDNN 이 Conv 마다 가장 빠른 방법을 찾는 시간이 섞여서", "모델 파일을 인터넷에서 다시 내려받아서", "GPU 의 계산이 CPU 보다 원래 느려서", "ONNX 파일을 TensorRT 엔진으로 바꾸는 시간이라서"], "a": 0, "w": "그래서 GPU 는 warm-up 이 CPU 보다 더 중요합니다. 실제 서비스에서는 시작할 때 한 번 미리 돌려 둡니다.", "an": "문제 5-1 · 해설"}, {"type": "multi", "p": "문제 5-2 (배치 1 vs 배치 32, CPU vs GPU) 에 대해 옳은 것을 모두 고르세요.", "o": ["배치 1 은 계산량이 작아 복사 · 실행 준비 시간의 비중이 크다", "배치 1 에서는 GPU 의 이득이 작거나 CPU 가 이기기도 한다", "배치 32 에서는 GPU 의 수천 개 코어가 일할 거리가 생겨 처리량 차이가 크게 벌어진다", "배치 1 만 재 보고 'GPU 는 별로' 라고 결론 내려도 된다", "GPU 는 배치를 아무리 키워도 메모리 걱정이 없다"], "a": [0, 1, 2], "w": "GPU 는 일이 많을수록 유리합니다. 단, 메모리가 넘치면 <code>Failed to allocate memory</code> 오류가 납니다.", "an": "문제 5-2 · 해설"}, {"type": "ox", "p": "GPU 는 CPU 와 다른 계산 방법 (cuDNN 커널) 을 쓰므로 CPU 끼리보다 차이가 조금 커서, 문제 5-3 은 <code>atol=1e-3</code> 으로 판정한다.", "a": true, "w": "1e-6 ~ 1e-5 정도 차이는 정상 (덧셈 순서 · 다른 알고리즘). Day 4 TensorRT FP16 에서는 차이가 훨씬 커지고, 그때 기준을 다시 정합니다.", "an": "문제 5-3"}, {"type": "short", "p": "providers 맨 앞에 넣어 GPU 로 실행하게 하는 실행기 이름은?", "a": ["CUDAExecutionProvider", "\"CUDAExecutionProvider\""], "w": "<code>providers=[\"CUDAExecutionProvider\", \"CPUExecutionProvider\"]</code> — 그리고 꼭 <code>get_providers()</code> 로 확인.", "an": "5교시 · 📌 정리"}, {"type": "drop", "p": "GPU 로 한 번 실행할 때 생기는 일입니다.", "p2": "CPU 메모리의 입력을 {} 로 복사 → GPU 계산 → 결과를 {} 로 복사한다. 배치 1 처럼 작은 일에서는 {} 의 비중이 커진다.", "opts": [["Host→Device (H2D)", "Device→Host (D2H)", "디스크"], ["Host→Device (H2D)", "Device→Host (D2H)", "디스크"], ["계산", "복사 · 준비", "가중치 다운로드"]], "a": [0, 1, 1], "w": "CPU 실행에는 없던 시간 — <b>CPU ↔ GPU 사이에 데이터를 나르는 시간</b>이 새로 생깁니다. 코드는 한 단어지만 비용 구조가 바뀝니다.", "an": "D3-5 · 5교시 도입"}, {"type": "match", "p": "자주 하는 실수와 고치는 법을 짝지으세요.", "left": ["<code>onnxruntime</code> · <code>onnxruntime-gpu</code> 를 둘 다 설치", "providers 에 CUDA 를 넣었으니 GPU 일 거라 믿음", "warm-up 없이 GPU 첫 실행 시간을 기록", "배치 1 만 재고 결론"], "right": ["CPU 판을 지우고 GPU 판만 설치", "<code>get_providers()</code> 로 실제 실행기 확인", "시작할 때 미리 돌려 두고 잰다", "배치를 바꿔 다시 잰다 (GPU 는 일이 많을수록 유리)"], "a": [0, 1, 2, 3], "w": "라이브러리가 안 맞으면 조용히 CPU 로 돌아갑니다. 첫 실행 시간을 성능으로 기록하면 수백 배 느리게 보입니다.", "an": "5교시 · ⚠️ 자주 하는 실수"}, {"type": "order", "p": "5교시를 진행하는 순서로 배열하세요.", "items": ["런타임 유형을 T4 GPU 로 바꾸고 <b>설치 셀부터</b> 다시 실행", "<code>providers=[\"CUDAExecutionProvider\", \"CPUExecutionProvider\"]</code> 로 세션 만들기", "<code>get_providers()[0]</code> 으로 실제 실행기 확인", "warm-up 후 배치 1 · 32 를 CPU · GPU 로 <code>bench</code>", "GPU vs CPU 출력 최대 차이 &lt; 1e-3 확인"], "w": "GPU_OK 가 False 면 셀이 '건너뜀' 을 출력합니다 — 런타임을 바꾸거나 강사 화면으로 봅니다.", "an": "5교시 · 문제 5-1 ~ 5-3"}, {"type": "hot", "p": "GPU 세션에서 <code>run</code> 한 번에 일어나는 일입니다. <b>입력 사진을 GPU 메모리로 옮기는 단계 — CPU 실행에는 없던 시간</b>을 클릭하세요.", "w": "<b>Host → Device 복사</b> 입니다. 결과를 돌려받는 Device → Host 복사도 새로 생긴 시간입니다. 배치 1 은 계산이 짧아 이 복사 · 준비 비중이 커지고, 그래서 GPU 이득이 작습니다.", "an": "D3-5 · 문제 5-2 해설", "viewBox": "0 0 720 285", "sw": 720, "svg": "<defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#8a9bb8\"/></marker><marker id=\"ahr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L d": "gpu", "label": "GPU 계산", "x": 530, "y": 125, "w": 150, "h": 60}, {"id": "d2h", "label": "Device → Host 복사", "x": 260, "y": 170, "w": 200, "h": 50}], "a": "h2d"}, {"type": "code", "p": "문제 5-1 · 5-3 — 빈칸을 채우세요.", "code": "gpu_sess = make_session(\"mnv3s.onnx\", providers=[\"{{}}\", \"CPUExecutionProvider\"])\nassert gpu_sess.get_providers()[0] == \"CUDAExecutionProvider\"\nout_cpu = cpu_sess.run(None, {\"input\": x32})[0]\nout_gpu = gpu_sess.run(None, {\"input\": x32})[0]\ngpu_diff = float(np.abs(out_gpu - out_cpu).{{}}())\nassert gpu_diff < {{}}", "a": [["CUDAExecutionProvider"], ["max"], ["1e-3", "0.001"]], "w": "장치가 달라도 같은 모델이어야 합니다 (실험 원칙 3). 예측 일치율 <code>(out_gpu.argmax(1) == out_cpu.argmax(1)).mean()</code> 도 함께 봅니다.", "an": "문제 5-1 · 5-3"}]}, {"t": "6교시 · 배치 크기 · 지연 vs 처리량", "anim": "D3-6 지연 vs 처리량", "qs": [{"type": "single", "p": "<b>처리량</b> (throughput, 장/초) 의 계산식은?", "o": ["1000 ÷ 지연 (ms)", "지연 (ms) ÷ 배치", "배치 ÷ 지연 (ms)", "배치 × 1000 ÷ 지연 (ms)"], "a": 3, "w": "한 번 run 에 b 장을 처리하고 그 지연이 L ms 이면 1초에 b × 1000 ÷ L 장. <code>bench</code> 의 <code>fps</code> 가 바로 이 값입니다.", "an": "6교시 · 표"}, {"type": "single", "p": "실행 예에서 배치 4 의 처리량이 <b>590 장/초</b> 였습니다. 배치 4 한 번 run 의 지연은 약?", "o": ["약 1.7 ms", "약 6.8 ms", "약 147 ms", "약 590 ms"], "a": 1, "w": "지연 = 배치 × 1000 ÷ 처리량 = 4 × 1000 ÷ 590 ≈ <b>6.8 ms</b>. 장당 시간 (ms_per_img) 은 6.8 ÷ 4 ≈ 1.7 ms.", "an": "문제 6-1"}, {"type": "multi", "p": "옳은 것을 모두 고르세요.", "o": ["지연 (latency) 은 한 번 <code>run</code> 이 끝날 때까지 걸린 시간이다", "배치 b 의 지연을 그대로 '한 장 시간' 으로 써도 된다", "<code>ms_per_img × imgs_per_s = 1000</code> 이다", "배치가 너무 크면 캐시에 다 안 들어가 처리량이 오히려 떨어지기도 한다", "처리량이 가장 큰 배치가 실시간 카메라에도 언제나 최선이다"], "a": [0, 2, 3], "w": "장당 시간 = 지연 ÷ b. 처리량 최대 배치라도 지연이 길면 실시간에는 못 씁니다 — 목적에 따라 고르는 숫자가 다릅니다.", "an": "문제 6-1 · 6-2 · ⚠️"}, {"type": "ox", "p": "카메라가 30 FPS 로 보낼 때 실시간 처리라면 한 프레임의 지연 예산은 약 33 ms 이다.", "a": true, "w": "1000 ÷ 30 ≈ 33 ms. 지연이 이 예산을 넘으면 다음 프레임이 오기 전에 답을 못 냅니다.", "an": "6교시 · ⚠️ 자주 하는 실수"}, {"type": "short", "p": "배치 1 처리량이 <b>520 장/초 ].name\n    for _ in range(n):\n        s_.run(None, {name: x})\n    ev = json.load(open(s_.{{}}()))\n    ag = collections.Counter()\n    for e in ev:\n        if e.get(\"cat\") == \"{{}}\" and e[\"name\"].endswith(\"_kernel_time\"):\n            ag[e[\"args\"][\"op_name\"]] += e[\"dur\"]\n    tot = sum(ag.values())\n    return pd.DataFrame([{\"op\": o, \"share_%\": v / tot * 100} for o, v in ag.most_common({{}})])", "a": [["True"], ["end_profiling"], ["Node"], ["k"]], "w": "Conv 가 절반 이상인 MobileNetV3 를 더 빠르게 하려면 Conv 를 빠르게 — Day 4 TensorRT (GPU 전용 Conv 커널 · FP16), 11/16 Quantization (INT8).", "an": "문제 7-3"}]}, {"t": "8교시 · 미니 프로젝트 · 카메라 4대 설정", "anim": "D3-8 카메라 4대 설정 정하기", "qs": [{"type": "single", "p": "카메라 <b>4대</b> (각 30 FPS) 를 CPU 한 대로 감당하려면 필요한 처리량은?", "o": ["30 장/초", "34 장/초", "120 장/초", "4 장/초"], "a": 2, "w": "4 × 30 = <b>120 장/초</b>. 과제 3 의 조건 <code>batch_tbl[\"fps\"] &gt;= 120</code>.", "an": "8교시 · 과제 3"}, {"type": "single", "p": "과제 2 에서 <code>best</code> 로 고르는 줄의 기준은?", "o": ["p95 가 가장 작은 줄 — <code>grid[\"p95\"].idxmin()</code>", "mean 이 가장 작은 줄", "fps 가 가장 큰 줄", "표의 마지막 줄"], "a": 0, "w": "현장 카메라는 실시간 — p95 로 고릅니다. 채점 셀은 <code>best.p95 == grid.p95.min()</code> 을 검사합니다.", "an": "과제 2"}, {"type": "multi", "p": "과제 3 (배치와 처리량) 에 대해 옳은 것을 모두 고르세요.", "o": ["<code>best</code> 의 스레드 · 레벨은 그대로 두고 배치만 1 · 4 · 8 로 바꾼다", "fps ≥ 120 인 배치 중 지연 (mean) 이 가장 짧은 배치를 고른다", "감당하는 배치가 하나도 없으면 <code>chosen_batch = None</code> 도 정답이다", "처리량이 가장 큰 배치 8 을 무조건 고른다", "배치를 바꾸면서 레벨도 함께 바꿔 본다"], "a": [0, 1, 2], "w": "감당 가능한 배치가 여럿이면 지연이 짧은 쪽 (보통 배치 1) 이 실시간에 유리합니다. 실행 예: 선택 배치 1.", "an": "과제 3 · 해설"}, {"type": "ox", "p": "미니 프로젝트 채점은 시간 숫자의 크기가 아니라 <b>방법과 일관성</b> (예: best 가 정말 표에서 가장 작은 p95 인가) 을 본다.", "a": true, "w": "시간 숫자는 사람마다, 실행마다 다릅니다. 확인 셀 · 채점 셀은 값이 아니라 방법을 검사합니다.", "an": "8교시 도입 · 채점 셀"}, {"type": "short", "p": "과제 5 에서 저장하는 성능표 파일 이름은? (Day 4 TensorRT 결과를 같은 열로 이어 붙입니다)", "a": ["ot_baseline.csv"], "w": "<code>ot_baseline.csv</code> — 조건 열 + 결과 열. 내일 TensorRT 줄을 이어 붙이므로   S.querySelectorAll('.selfb').forEach(b => b.onclick = () => { const k = +b.dataset.k; A[k].self = b.dataset.v === '1'; render(); });
}

// ── 채점 · 결과 코드 ──
function hash(s){ let h = 5381; for (const c of s) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return h.toString(16).padStart(8, '0').slice(-4); }
function codeFor(name, t, score){ return `${t}${'ABCDEFGHIJK'[10 - score] || 'K'}-${hash(`${name.trim()}|${t}|${score}|otday3`)}`; }
$('#gradeBtn').onclick = () => {
  const s = Q[tab], n = ans[tab].filter((a, k) => answered(s.qs[k], a)).length;
  attempted[tab] = true;
  if (n < 10 && !confirm(`아직 ${10 - n}문항에 답하지 않았습니다. 그래도 채점할까요? (미응답은 오답 처리)`)) { render(); return; }
  graded[tab] = true; render();
};
$('#resetBtn').onclick = () => {
  if (!confirm(`${tab + 1}교시 답을 모두 지우고 다시 풀까요?`)) return;
  graded[tab] = false; attempted[tab] = false;
  ans[tab] = Q[tab].qs.map((q, k) => init(q, `${tab}-${k}`)); render();
};
$('#name').oninput = render;

// ── 제출 · 오답 정리 ──
let lastHtml = '', lastText = '';
function buildReport(){
  const nm = $('#name').value.trim() || '(이름 없음)', ds = new Date().toLocaleString('ko-KR');
  let h = `<h3>ONNX·TensorRT Day 3 — ONNX Runtime 으로 빠르게 · 개념 워크시트 — 오답 정리</h3><div class="meta">${esc(nm)} · ${ds}</div>`;
  let t = `ONNX·TensorRT Day 3 — ONNX Runtime 으로 빠르게 · 개념 워크시트 — 오답 정리\n이름: ${nm}\n일시: ${ds}\n\n`;
  let tot = 0, cnt = 0;
  const byType = {};
  Q.forEach((s, i) => {
    if (!graded[i]) return;
    const sc = scoreOf(i); tot += sc; cnt++;
    s.qs.forEach((q, k) => { const b = byType[q.type] ||= [0, 0]; b[1]++; if (correct(q, ans[i][k])) b[0]++; });
    const code = $('#name').value.trim() ? codeFor($('#name').value, i + 1, sc) : '—';
    const wrong = s.qs.map((q, k) => ({ q, k, a: ans[i][k] })).filter(x => !correct(x.q, x.a));
    h += `<div class="sec">${esc(s.t)} — ${sc}/10 · 결과 코드 ${code}</div>`;
    t += `[${s.t}] ${sc}/10 · 결과 코드 ${code}\n`;
    if (!wrong.length) { h += `<div class="ok">전부 정답 🎉</div>`; t += '  전부 정답\n\n'; return; }
    h += '<table><tr><th>#</th><th>유형</th><th>문항</th><th>내 답</th><th>정답</th><th>다시 볼 곳</th></tr>';
    wrong.forEach(({ q, k, a }) => {
      const qt = strip(q.type === 'flash' ? q.front : (q.p || q.p2 || '')).replace(/\s+/g, ' ').slice(0, 70);
      const my = fmt(q, a, false), co = fmt(q, a, true);
      h += `<tr><td>${k + 1}</td><td>${TYPES[q.type].n}</td><td>${esc(qt)}</td><td class="bad">${esc(my)}</td><td class="ok">${esc(co)}</td><td>${esc(strip(q.an))}</td></tr>`;
      t += `  ${k + 1}. [${TYPES[q.type].n}] ${qt}\n     내 답: ${my}\n     정답: ${co}\n     다시 볼 곳: ${strip(q.an)}\n`;
    });
    h += '</table>'; t += '\n';
  });
  const notGraded = Q.map((s, i) => graded[i] ? null : i + 1).filter(x => x);
  const typeLine = Object.entries(byType).map(([k, [c, n]]) => `${TYPES[k].n} ${c}/${n}`).join(' · ');
  const sum = `<div class="sum"><span>채점한 교시 ${cnt}/8</span><span>합계 ${tot}/${cnt * 10}</span>${notGraded.length ? `<span class="none">미채점: ${notGraded.join(', ')}교시</span>` : ''}</div>` + (typeLine ? `<div class="meta">유형별 정답: ${typeLine}</div>` : '');
  h = h.replace('</div>', '</div>' + sum);
  t = t.replace('\n\n', `\n채점한 교시 ${cnt}/8 · 합계 ${tot}/${cnt * 10}${notGraded.length ? ' · 미채점 ' + notGraded.join(', ') + '교시' : ''}\n유형별 정답: ${typeLine}\n\n`);
  lastHtml = h; lastText = t;
  return h;
}
$('#submitBtn').onclick = () => {
  if (!graded.some(x => x)) { alert('먼저 한 교시 이상 채점하세요.'); return; }
  $('#dgBody').innerHTML = buildReport(); $('#toast').textContent = ''; $('#dlg').showModal();
};
$('#closeBtn').onclick = () => $('#dlg').close();
$('#captureBtn').onclick = async () => {
  const htmlDoc = `<meta charset="utf-8">` + lastHtml.replace(/ class="[^"]*"/g, '').replace(/<table>/g, '<table border="1" style="border-collapse:collapse">');
  try {
    if (navigator.clipboard && window.ClipboardItem) {
      await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([htmlDoc], { type: 'text/html' }), 'text/plain': new Blob([lastText], { type: 'text/plain' }) })]);
      $('#toast').textContent = '복사했습니다 — 노션에 붙여 넣으세요.'; return;
    }
  } catch (e) {}
  const ta = document.createElement('textarea'); ta.value = lastText; ta.style.position = 'fixed'; ta.style.opacity = '0';
  $('#dlg').appendChild(ta); ta.focus(); ta.select();
  const ok = document.execCommand('copy'); ta.remove();
  $('#toast').textContent = ok ? '텍스트로 복사했습니다.' : '복사하지 못했습니다 — 직접 선택해 복사하세요.';
};

$('#legend').innerHTML = Object.values(TYPES).map(t => `<span class="tag" style="color:${t.c};border-color:${t.c}55">${t.n}</span>`).join('');
// worksheet.html#t3 → 3교시 탭으로 바로 열기 (노트북 교시별 링크)
function fromHash(){ const m = location.hash.match(/^#t([1-8])$/); if (m) { tab = +m[1] - 1; } }
fromHash();
window.addEventListener('hashchange', () => { fromHash(); render(); window.scrollTo({ top: 0 }); });
render();
</script>
