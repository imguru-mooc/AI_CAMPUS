  if(rt){$(&#x27;#provOut&#x27;).innerHTML=`설치됨: [&#x27;TensorrtExecutionProvider&#x27;, &#x27;CUDAExecutionProvider&#x27;, &#x27;CPUExecutionProvider&#x27;]  &lt;span class=&quot;c&quot;&gt;# 예시&lt;/span&gt;

    setStatus(&#x27;ok&#x27;,&#x27;T4 GPU 런타임 (예시): CUDA 가 1순위로 쓰이고, CPU 는 GPU 가 못 하는 연산의 예비로 남음 → GPU_OK = True&#x27;);}
  else{$(&#x27;#provOut&#x27;).innerHTML=`설치됨: [&#x27;AzureExecutionProvider&#x27;, &#x27;CPUExecutionProvider&#x27;]
실제 사용: &lt;span class=&quot;e&quot;&gt;[&#x27;CPUExecutionProvider&#x27;]&lt;/span&gt; → GPU 없음 — 런타임 유형이 T4 GPU 인지 확인 (5교시만 영향)`;
    setStatus(&#x27;warn&#x27;,&#x27;CUDA 를 1순위로 적었지만 오류 없이 CPU 로 실행됨!\n→ providers 는 희망 목록. 세션을 만든 뒤 get_providers() 로 꼭 확인&#x27;);window.__d3.prov=&#x27;cpu&#x27;;}}
$(&#x27;#bProv&#x27;).onclick=()=&gt;{if(!busy){busy=true;prov().finally(()=&gt;busy=false);}};
$$(&#x27;#rSel button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(busy)return;rt=+b.dataset.v;drawProv(0);$(&#x27;#provOut&#x27;).innerHTML=&#x27;&lt;span class=&quot;c&quot;&gt;# InferenceSession ▶ 을 누르세요&lt;/span&gt;&#x27;;});
function stop(){}
async function seq(list){rows=[];drawTbl();for(const [t,l] of list){th=t;lv=l;drawSel();await sleep(400);await bench1();await sleep(900);}}
const P=[
 {n:&#x27;① 지도 · 손잡이 다섯&#x27;,ex:&#x27;&lt;p&gt;오늘은 4단계 중 &lt;b class=&quot;teal&quot;&gt;③ 실행하기&lt;/b&gt;만 다룹니다. 모델 파일은 그대로 두고, ONNX Runtime 이 &lt;b&gt;어떻게&lt;/b&gt; 실행할지를 바꿉니다.&lt;/p&gt;&lt;p&gt;손잡이: &lt;b class=&quot;amber&quot;&gt;스레드&lt;/b&gt; (3교시) · &lt;b class=&quot;amber&quot;&gt;최적화 레벨&lt;/b&gt; (4교시) · &lt;b class=&quot;amber&quot;&gt;CPU/GPU&lt;/b&gt; (5교시) · &lt;b class=&quot;amber&quot;&gt;배치&lt;/b&gt; (6교시) · &lt;b class=&quot;amber&quot;&gt;profiling&lt;/b&gt; (7교시, 어디가 느린지 보는 도구). 재는 법은 2교시 &lt;code&gt;bench()&lt;/code&gt;.&lt;/p&gt;&#x27;,
  run:async()=&gt;{for(let i=0;i&lt;5;i++){knob=i;drawLoop();setStatus(&#x27;info&#x27;,`${KN[i].k} — ${KN[i].p}교시 · ${KN[i].s}`);await sleep(800);}knob=-1;drawLoop();setStatus(&#x27;ok&#x27;,&#x27;바꿀 때마다: bench() 로 재고 → 결과가 같은지 확인 → 표에 한 줄&#x27;);}},
 {n:&#x27;② 둘 다 바꾸면?&#x27;,ex:&#x27;&lt;p&gt;기준 (스레드 1 · DISABLE) 에서 &lt;b class=&quot;red&quot;&gt;스레드와 레벨을 동시에&lt;/b&gt; 바꿨더니 p95 6.62 → 2.41 ms. 빨라진 것은 확실하지만, &lt;b&gt;무엇 때문인지&lt;/b&gt;는 이 두 줄로 말할 수 없습니다.&lt;/p&gt;&lt;p&gt;원칙 1: &lt;b class=&quot;amber&quot;&gt;한 번에 하나만 바꾼다.&lt;/b&gt;&lt;/p&gt;&#x27;,
  run:async()=&gt;{await seq([[1,&#x27;DISABLE&#x27;],[2,&#x27;ALL&#x27;]]);judge(2,&#x27;두 손잡이를 동시에 돌렸으니 이 두 줄만으로는 원인을 가를 수 없습니다. → 프리셋 ③ 에서 하나씩.&#x27;);}},
 {n:&#x27;③ 하나씩 바꾸면&#x27;,ex:&#x27;&lt;p&gt;레벨만 바꾼 줄: 6.62 → &lt;b class=&quot;green&quot;&gt;2.23&lt;/b&gt; ms (약 3배). 스레드만 바꾼 줄: 6.62 → 5.09 ms (약 1.3배).&lt;/p&gt;&lt;p&gt;이제 &lt;b&gt;레벨의 효과가 훨씬 크다&lt;/b&gt;고 말할 수 있습니다. 표의 각 줄에 &lt;b&gt;조건 (threads · level)&lt;/b&gt; 을 함께 적었기 때문에 가능한 비교입니다 — 원칙 2.&lt;/p&gt;&#x27;,
  run:async()=&gt;{await seq([[1,&#x27;DISABLE&#x27;],[1,&#x27;ALL&#x27;],[1,&#x27;DISABLE&#x27;],[2,&#x27;DISABLE&#x27;]]);}},
 {n:&#x27;④ providers = 희망 목록&#x27;,ex:&#x27;&lt;p&gt;&lt;code&gt;get_available_providers()&lt;/code&gt; 는 &lt;b&gt;설치된&lt;/b&gt; 목록, &lt;code&gt;sess.get_providers()&lt;/code&gt; 는 &lt;b&gt;실제로 쓰는&lt;/b&gt; 목록입니다.&lt;/p&gt;&lt;p&gt;providers 는 앞에서부터 시도하고 안 되면 &lt;b class=&quot;red&quot;&gt;오류 없이&lt;/b&gt; 다음으로 넘어갑니다. 그래서 &quot;GPU 로 돌린 줄 알았는데 CPU 였다&quot; 가 흔합니다 → 세션을 만든 뒤 &lt;code&gt;get_providers()&lt;/code&gt; 로 꼭 확인.&lt;/p&gt;&#x27;,
  run:async()=&gt;{rt=0;await prov();await sleep(1800);rt=1;await prov();}},
];
initPredict(&#x27;기준 (스레드 1 · DISABLE, p95 6.62 ms) 에서 &lt;b&gt;스레드 1→2 와 레벨 DISABLE→ALL 을 동시에&lt;/b&gt; 바꿨더니 p95 2.41 ms. 빨라진 원인은?&#x27;,[&#x27;스레드 때문&#x27;,&#x27;레벨 때문&#x27;,&#x27;이 두 줄로는 알 수 없다&#x27;]);
initPresets(P,stop);
drawLoop();drawSel();drawTbl();drawProv(0);$(&#x27;#provOut&#x27;).innerHTML=&#x27;&lt;span class=&quot;c&quot;&gt;# InferenceSession ▶ 을 누르세요&lt;/span&gt;&#x27;;
ready();

&lt;body&gt;
&lt;div class=&quot;app&quot;&gt;

&lt;h1&gt;재는 법 — warm-up · 평균 · p95 · FPS&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;같은 &lt;code&gt;sess.run&lt;/code&gt; 을 반복해도 시간은 매번 다릅니다. 특히 &lt;b style=&quot;color:var(--red)&quot;&gt;첫 실행&lt;/b&gt;은 메모리 확보 · 캐시 채우기 · 커널 선택이 섞여 느립니다. 아래 슬라이더로 &lt;b&gt;warm-up 횟수&lt;/b&gt;와 &lt;b&gt;측정 횟수&lt;/b&gt;를 바꾸면 평균 · p50 · &lt;b style=&quot;color:var(--amber)&quot;&gt;p95&lt;/b&gt; · FPS 가 바로 다시 계산됩니다.&lt;/p&gt;

 {n:&#x27;② warm-up 10 · 100번 (2-2)&#x27;,ex:&#x27;&lt;p&gt;warm-up 10번은 재지 않고 버리고, 다음 100번의 시간으로 &lt;b class=&quot;green&quot;&gt;평균&lt;/b&gt; · &lt;b class=&quot;teal&quot;&gt;p50&lt;/b&gt; · &lt;b class=&quot;amber&quot;&gt;p95&lt;/b&gt; · FPS 를 구합니다.&lt;/p&gt;&lt;p&gt;p95 = &quot;100번 중 95번은 이보다 빠르다&quot;. 실시간 시스템은 평균이 아니라 &lt;b class=&quot;amber&quot;&gt;p95&lt;/b&gt; 로 판단합니다 — 가끔 튀는 순간에 프레임을 놓치기 때문입니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{setWN(10,100);await play();}},
 {n:&#x27;③ 평균 vs p95 꼬리&#x27;,ex:&#x27;&lt;p&gt;히스토그램의 &lt;b&gt;오른쪽 꼬리&lt;/b&gt; — 대부분은 1.8 ms 근처지만 가끔 2.2 ms 이상 튑니다. 평균은 꼬리에 조금만 끌려가고, p95 는 꼬리를 직접 보여 줍니다.&lt;/p&gt;&lt;p&gt;&lt;b&gt;최대값&lt;/b&gt;은 한 번의 사고 (다른 프로그램 · 메모리 정리) 에 크게 흔들려 비교용으로 쓰지 않습니다. n 을 늘리면 p95 가 안정됩니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{setWN(10,20);await play();await sleep(1500);setWN(10,300);await play();setStatus(&#x27;ok&#x27;,`n = 300: 평균 ${st.mean.toFixed(2)} · p95 ${st.p95.toFixed(2)} · 최대 ${st.max.toFixed(2)} ms\n→ 평균과 p95 는 안정적, 최대는 한 번의 튐에 좌우됨`);}},
 {n:&#x27;④ bench() 네 단계 (2-3)&#x27;,ex:&#x27;&lt;p&gt;2-2 를 함수 하나로: &lt;code&gt;bench(sess, x, n=100, warm=10)&lt;/code&gt; → &lt;code&gt;{&quot;mean&quot;, &quot;p50&quot;, &quot;p95&quot;, &quot;fps&quot;}&lt;/code&gt;. 입력 이름은 세션에서 읽고, FPS 에 &lt;code&gt;x.shape[0]&lt;/code&gt; (배치) 를 곱해 &lt;b class=&quot;purple&quot;&gt;초당 장 수&lt;/b&gt;로 만듭니다.&lt;/p&gt;&lt;p&gt;오늘 하루 모든 측정을 이 함수 하나로 합니다. 측정 중에는 다른 셀을 돌리지 마세요 — &lt;b&gt;잴 때는 재기만&lt;/b&gt;.&lt;/p&gt;&#x27;,
  run:async()=&gt;{for(let k=0;k&lt;4;k++){drawSteps(k);await sleep(700);}drawSteps(4);setWN(10,100);await play();}},
];
initPredict(&#x27;&lt;b&gt;warm-up 0 · 5번만&lt;/b&gt; 잰 평균은 &lt;b&gt;warm-up 10 · 100번&lt;/b&gt; 잰 평균과 비교해 어떻게 나올까?&#x27;,[&#x27;더 크다 (느리게 보인다)&#x27;,&#x27;거의 같다&#x27;,&#x27;더 작다 (빠르게 보인다)&#x27;]);
initPresets(P,stop);
drawSteps(-1);recalc();
window.addEventListener(&#x27;resize&#x27;,()=&gt;draw());
ready();

&lt;script&gt;
const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];

const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,RM?Math.min(ms,80):ms));
let busy=false, timer=null;

function setCode(h){$(&#x27;#code&#x27;).innerHTML=h;}

function initPresets(P,stop){$(&#x27;#presets&#x27;).innerHTML=P.map(p=&gt;`&lt;button type=&quot;button&quot;&gt;${p.n}&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}
const esc=s=&gt;String(s).replace(/&amp;/g,&#x27;&amp;amp;&#x27;).replace(/&lt;/g,&#x27;&amp;lt;&#x27;).replace(/&gt;/g,&#x27;&amp;gt;&#x27;);

function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
window.__d3={};
let guess=null, predOpts=[];
function initPredict(q,opts){predOpts=opts;guess=null;
  $(&#x27;#pred&#x27;).innerHTML=`&lt;div class=&quot;steps3&quot;&gt;&lt;span class=&quot;on&quot; id=&quot;st1&quot;&gt;① 예측&lt;/span&gt;&lt;span id=&quot;st2&quot;&gt;② 실행&lt;/span&gt;&lt;span id=&quot;st3&quot;&gt;③ 설명&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;pq&quot;&gt;${q}&lt;/div&gt;&lt;div class=&quot;seg&quot; id=&quot;predOpts&quot;&gt;${opts.map((o,i)=&gt;`&lt;button type=&quot;button&quot; data-i=&quot;${i}&quot;&gt;${o}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;pv&quot; id=&quot;predV&quot;&gt;먼저 하나를 고른 뒤 실행 ▶ 하세요. (안 골라도 실행은 됩니다)&lt;/div&gt;`;
  $$(&#x27;#predOpts button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{guess=+b.dataset.i;$$(&#x27;#predOpts button&#x27;).forEach(x=&gt;{x.classList.toggle(&#x27;sel&#x27;,x===b);x.classList.remove(&#x27;ok&#x27;,&#x27;bad&#x27;);});
    const v=$(&#x27;#predV&#x27;);v.className=&#x27;pv&#x27;;v.textContent=&#x27;예측: &#x27;+opts[guess]+&#x27; → 이제 실행해서 확인&#x27;;phase(1);});}
function phase(k){[&#x27;#st1&#x27;,&#x27;#st2&#x27;,&#x27;#st3&#x27;].forEach((s,i)=&gt;{const e=$(s);if(e)e.classList.toggle(&#x27;on&#x27;,i===k);});}
function judge(ans,why){$$(&#x27;#predOpts button&#x27;).forEach((b,i)=&gt;{b.classList.toggle(&#x27;ok&#x27;,i===ans);b.classList.toggle(&#x27;bad&#x27;,i===guess&amp;&amp;i!==ans);});
  const v=$(&#x27;#predV&#x27;);v.className=&#x27;pv &#x27;+(guess===null?&#x27;&#x27;:guess===ans?&#x27;ok&#x27;:&#x27;bad&#x27;);
  v.innerHTML=(guess===null?&#x27;정답: &#x27;:guess===ans?&#x27;✅ 예측 적중 — &#x27;:&#x27;❌ 예측과 다름 — &#x27;)+&#x27;&lt;b&gt;&#x27;+predOpts[ans]+&#x27;&lt;/b&gt;. &#x27;+why;phase(2);window.__d3.judged=(window.__d3.judged||0)+1;}
function ready(){$(&#x27;#explain&#x27;).innerHTML=&#x27;&lt;p&gt;&lt;b class=&quot;amber&quot;&gt;① 예측&lt;/b&gt;을 먼저 고르고 → &lt;b class=&quot;teal&quot;&gt;② 프리셋 또는 ▶ 버튼&lt;/b&gt;으로 실행하면 → &lt;b class=&quot;green&quot;&gt;③ 여기에 설명&lt;/b&gt;이 나옵니다.&lt;/p&gt;&#x27;;setStatus(&#x27;info&#x27;,&#x27;먼저 위에서 예측을 하나 고른 뒤, 프리셋이나 ▶ 버튼을 누르세요.&#x27;);}
function pct(a,q){const s=[...a].sort((x,y)=&gt;x-y);const h=(s.length-1)*q/100,lo=Math.floor(h),hi=Math.ceil(h);return s[lo]+(s[hi]-s[lo])*(h-lo);}
function rng(seed){let t=seed&gt;&gt;&gt;0;return()=&gt;{t+=0x6D2B79F5;let r=Math.imul(t^t&gt;&gt;&gt;15,1|t);r^=r+Math.imul(r^r&gt;&gt;&gt;7,61|r);return((r^r&gt;&gt;&gt;14)&gt;&gt;&gt;0)/4294967296;};}


const RUNS=[{1:[1.87,1.99],2:[1.74,1.89],4:[3.96,6.10]},{1:[1.90,2.24],2:[1.79,2.21],4:[4.68,9.98]}];
const FPS=[null,{1:527.48,2:558.05,4:213.62}];
let th=2, runI=0, done={}, tick=0, anim=null;
function workers(){
  const ws=Array.from({length:th},(_,i)=&gt;i);let on=[],wait=[];
  if(th&lt;=2){on=ws;}else{const a=tick%2;on=a?[2,3]:[0,1];wait=a?[0,1]:[2,3];}
  $(&#x27;#shop&#x27;).innerHTML=[0,1].map(c=&gt;{const w=on[c];const busy=w!==undefined;
    return `&lt;div class=&quot;wb ${busy?&#x27;busy&#x27;:&#x27;idle&#x27;} ${th&gt;2&amp;&amp;anim?&#x27;sw&#x27;:&#x27;&#x27;}&quot;&gt;&lt;div class=&quot;h&quot;&gt;코어 ${c} (작업대)&lt;/div&gt;${busy?`&lt;span class=&quot;wk c${w}&quot;&gt;W${w+1}&lt;/span&gt;`:&#x27;&lt;div class=&quot;dim&quot; style=&quot;margin-top:14px;font-size:12.5px&quot;&gt;비어 있음 — 놀고 있음&lt;/div&gt;&#x27;}&lt;/div&gt;`;}).join(&#x27;&#x27;);
  $(&#x27;#queue&#x27;).innerHTML=wait.length?`대기 중 (차례 기다림): ${wait.map(w=&gt;`&lt;span class=&quot;wk c${w}&quot;&gt;W${w+1}&lt;/span&gt;`).join(&#x27;&#x27;)} &lt;span class=&quot;bad1&quot;&gt; ← 교대할 때마다 캐시 · 문맥 다시 준비&lt;/span&gt;`:`&lt;span class=&quot;dim&quot;&gt;대기 없음 — ${th===1?&#x27;일꾼 1명, 작업대 1개는 놀고 있음&#x27;:&#x27;일꾼 수 = 작업대 수&#x27;}&lt;/span&gt;`;}
function sample(t,n,seed){const r=rng(seed);const [m]=RUNS[0][t];const a=[];
  for(let i=0;i&lt;n;i++){let v;if(t===4){v=r()&lt;0.25?3.8+r()*2.8:2.3+r()*1.1;}else{v=m-0.05+r()*0.1;if(r()&lt;0.05)v+=0.12+r()*0.15;}a.push(v);}return a;}
function drawCv(){const [g,w,h]=fitCanvas($(&#x27;#cv&#x27;));g.clearRect(0,0,w,h);
  const L=34,B=16,T=8,mx=7.2,n=30;g.font=&#x27;11px Consolas,monospace&#x27;;
  for(const v of [2,4,6]){const y=h-B-v/mx*(h-B-T);g.strokeStyle=&#x27;#1f2b45&#x27;;g.beginPath();g.moveTo(L,y);g.lineTo(w-4,y);g.stroke();g.fillStyle=&#x27;#8a9bb8&#x27;;g.fillText(v+&#x27;ms&#x27;,2,y+4);}
  const ts=[1,2,4],gw=(w-L-8)/3;
  ts.forEach((t,k)=&gt;{const x0=L+k*gw;g.fillStyle=t===th?&#x27;#f5b942&#x27;:&#x27;#8a9bb8&#x27;;g.fillText(`스레드 ${t}`,x0+4,h-3);
    if(!done[t])return;const a=sample(t,n,t*11);const bw=(gw-10)/n;
    a.forEach((v,i)=&gt;{const bh=v/mx*(h-B-T);g.fillStyle=t===4?(v&gt;3.6?&#x27;#f87171&#x27;:&#x27;#f5b942&#x27;):&#x27;#2dd4bf&#x27;;g.fillRect(x0+4+i*bw,h-B-bh,Math.max(1,bw*0.75),bh);});});}
function drawTbl(){const R=RUNS[runI];
  $$(&#x27;#runSel button&#x27;).forEach(b=&gt;b.classList.toggle(&#x27;sel&#x27;,+b.dataset.v===runI));
  $(&#x27;#tbl&#x27;).innerHTML=&#x27;&lt;tr&gt;&lt;th&gt;threads&lt;/th&gt;&lt;th&gt;mean ms&lt;/th&gt;&lt;th&gt;p95 ms&lt;/th&gt;&lt;th&gt;fps&lt;/th&gt;&lt;th&gt;p95 / mean&lt;/th&gt;&lt;/tr&gt;&#x27;+[1,2,4].map(t=&gt;{const [m,p]=R[t];const f=FPS[runI]?FPS[runI][t]:1000/m;
    return `&lt;tr class=&quot;${t===th?&#x27;cur&#x27;:&#x27;&#x27;}&quot;&gt;&lt;td&gt;${t}&lt;/td&gt;&lt;td&gt;${done[t]||runI?m.toFixed(2):&#x27;?&#x27;}&lt;/td&gt;&lt;td class=&quot;${t===4?&#x27;bad1&#x27;:&#x27;&#x27;}&quot;&gt;${done[t]||runI?p.toFixed(2):&#x27;?&#x27;}&lt;/td&gt;&lt;td&gt;${done[t]||runI?f.toFixed(0):&#x27;?&#x27;}&lt;/td&gt;&lt;td&gt;${done[t]||runI?(p/m).toFixed(2):&#x27;?&#x27;}&lt;/td&gt;&lt;/tr&gt;`;}).join(&#x27;&#x27;);
  const best=[1,2,4].reduce((a,b)=&gt;R[a][1]&lt;=R[b][1]?a:b);
  $(&#x27;#bars&#x27;).innerHTML=[1,2,4].map(t=&gt;{const show=done[t]||runI;const [m,p]=R[t];
    return `&lt;span&gt;스레드 ${t} p95&lt;/span&gt;&lt;div class=&quot;t&quot;&gt;&lt;i style=&quot;width:${show?p/10*100:0}%;background:${t===4?&#x27;var(--red)&#x27;:t===best?&#x27;var(--green)&#x27;:&#x27;var(--blue)&#x27;}&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;span&gt;${show?p.toFixed(2)+&#x27; ms&#x27;:&#x27;—&#x27;}&lt;/span&gt;`;}).join(&#x27;&#x27;);}
function code(){const R=RUNS[runI];const all3=done[1]&amp;&amp;done[2]&amp;&amp;done[4]||runI;
  setCode(`print(&quot;이 런타임의 CPU 코어 수:&quot;, os.cpu_count())   &lt;span class=&quot;b&quot;&gt;# 2&lt;/span&gt;
rows = []
for th in [1, 2, 4]:
    so = ort.SessionOptions()
    so.&lt;span class=&quot;hl&quot;&gt;intra_op_num_threads&lt;/span&gt; = th          &lt;span class=&quot;c&quot;&gt;# 옵션 → 세션 순서&lt;/span&gt;
    s = ort.InferenceSession(&quot;mnv3s.onnx&quot;, so, providers=CPU)
    rows.append({&quot;threads&quot;: th, **bench(s, x1)})
df_th = pd.DataFrame(rows)

&lt;span class=&quot;c&quot;&gt;# 3-2  실시간이면 p95 가 가장 작은 줄&lt;/span&gt;
best_threads = int(df_th.loc[df_th[&quot;p95&quot;].&lt;span class=&quot;hl&quot;&gt;idxmin&lt;/span&gt;(), &quot;threads&quot;])
${all3?`&lt;span class=&quot;b&quot;&gt;# p95 기준 최선: 2 스레드
# 코어 2개에 스레드 4 → 평균 ${R[4][0].toFixed(2)} ms · p95 ${R[4][1].toFixed(2)} ms&lt;/span&gt;`:&#x27;&lt;span class=&quot;c&quot;&gt;# (세 줄을 다 재면 결과가 나옵니다)&lt;/span&gt;&#x27;}`);}
function stopAnim(){if(anim){clearInterval(anim);anim=null;}}
async function run1(t){th=t;$$(&#x27;#tSel button&#x27;).forEach(b=&gt;b.classList.toggle(&#x27;sel&#x27;,+b.dataset.v===th));phase(1);stopAnim();tick=0;workers();
  anim=setInterval(()=&gt;{tick++;workers();},RM?400:330);setStatus(&#x27;info&#x27;,`스레드 ${t} 로 bench(…) 재는 중…`);await sleep(1600);stopAnim();workers();
  done[t]=1;drawCv();drawTbl();code();const [m,p]=RUNS[0][t];
  setStatus(t===4?&#x27;warn&#x27;:&#x27;ok&#x27;,`스레드 ${t}: 평균 ${m.toFixed(2)} ms · p95 ${p.toFixed(2)} ms (실행 예 A)\n${t===1?&#x27;작업대 하나는 놀고 있음&#x27;:t===2?&#x27;일꾼 수 = 코어 수 → 가장 좋음&#x27;:&#x27;일꾼 4명이 작업대 2개를 번갈아 → 교대 비용 · 가끔 크게 늦어짐 (p95 ↑)&#x27;}`);
  if(done[1]&amp;&amp;done[2]&amp;&amp;done[4])judge(1,&#x27;스레드 2 → 4 에서 평균은 1.74 → 3.96 ms (2.3배), p95 는 1.89 → 6.10 ms (3.2배). 꼬리 (p95) 가 먼저, 더 크게 나빠집니다.&#x27;);}
$(&#x27;#bRun&#x27;).onclick=()=&gt;{if(!busy){busy=true;run1(th).finally(()=&gt;busy=false);}};
async function runAll(){for(const t of [1,2,4]){await run1(t);await sleep(700);}}
$(&#x27;#bAll&#x27;).onclick=()=&gt;{if(!busy){busy=true;runAll().finally(()=&gt;busy=false);}};
$$(&#x27;#tSel button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(busy)return;th=+b.dataset.v;$$(&#x27;#tSel button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;sel&#x27;,x===b));tick=0;workers();drawCv();drawTbl();});
$$(&#x27;#runSel button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(busy)return;runI=+b.dataset.v;drawTbl();code();
  setStatus(&#x27;info&#x27;,runI?&#x27;실행 예 B (같은 노트북을 다시 실행): 1 · 2 · 4 스레드 p95 2.24 · 2.21 · 9.98 ms\n숫자는 달라도 모양은 같다 — 스레드 4 의 p95 가 가장 크게 튐&#x27;:&#x27;실행 예 A: 1 · 2 · 4 스레드 p95 1.99 · 1.89 · 6.10 ms&#x27;);});
function stop(){stopAnim();}
const P=[
 {n:&#x27;① 일꾼 1명&#x27;,ex:&#x27;&lt;p&gt;스레드 1 → 일꾼 한 명이 작업대 하나에서 모든 계산. 다른 작업대는 놀고 있습니다. 실행 예: 평균 &lt;b&gt;1.87&lt;/b&gt; ms · p95 &lt;b&gt;1.99&lt;/b&gt; ms.&lt;/p&gt;&lt;p&gt;⚠️ &lt;code&gt;so.intra_op_num_threads&lt;/code&gt; 는 세션을 &lt;b&gt;만들기 전에&lt;/b&gt; 정해야 합니다. 이미 만든 세션에는 적용되지 않습니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{await run1(1);}},
 {n:&#x27;② 일꾼 2명 = 코어 수&#x27;,ex:&#x27;&lt;p&gt;스레드 2 = 코어 2 → 두 작업대를 모두 씀. 실행 예: 평균 &lt;b class=&quot;green&quot;&gt;1.74&lt;/b&gt; ms · p95 &lt;b class=&quot;green&quot;&gt;1.89&lt;/b&gt; ms — 가장 좋습니다.&lt;/p&gt;&lt;p&gt;2배가 아니라 약 7% 빨라졌습니다. 작은 연산은 나누고 모으는 비용이 이득을 상당 부분 먹습니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{await run1(2);}},
 {n:&#x27;③ 일꾼 4명 &gt; 코어 2&#x27;,ex:&#x27;&lt;p&gt;스레드 4 → 일꾼이 작업대를 &lt;b class=&quot;red&quot;&gt;번갈아&lt;/b&gt; 씁니다 (oversubscription). 교대할 때마다 캐시 · 문맥을 다시 준비 → 평균 &lt;b&gt;3.96&lt;/b&gt; ms, p95 &lt;b class=&quot;red&quot;&gt;6.10&lt;/b&gt; ms.&lt;/p&gt;&lt;p&gt;평균은 2.3배, p95 는 3.2배 나빠졌습니다 — &lt;b&gt;꼬리부터&lt;/b&gt; 망가집니다. 실시간 시스템에서 가장 위험한 경우입니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{await runAll();}},
 {n:&#x27;④ p95 로 고르기 (3-2)&#x27;,ex:&#x27;&lt;p&gt;&lt;code&gt;df_th[&quot;p95&quot;].idxmin()&lt;/code&gt; = p95 가 가장 작은 줄 → &lt;b class=&quot;green&quot;&gt;2 스레드&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;ORT 기본값 &lt;code&gt;0&lt;/code&gt; 은 코어 수에 맞춰 자동으로 정합니다. 그래서 보통은 기본값이 좋고, 다른 프로그램과 CPU 를 나눠 써야 할 때 줄입니다. 실행 예 B 로 바꿔 보면 숫자는 달라도 결론은 같습니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{done={1:1,2:1,4:1};runI=0;drawTbl();drawCv();code();await sleep(900);runI=1;drawTbl();code();setStatus(&#x27;ok&#x27;,&#x27;실행 예 A · B 모두 idxmin(p95) → 2 스레드\n스레드 4 의 p95: 6.10 · 9.98 ms (튀는 정도는 실행마다 다름)&#x27;);}},
];
initPredict(&#x27;코어 2개짜리 Colab 에서 스레드를 &lt;b&gt;2 → 4&lt;/b&gt; 로 늘리면, 무엇이 더 크게 나빠질까?&#x27;,[&#x27;평균 (mean)&#x27;,&#x27;p95 (가끔 튀는 꼬리)&#x27;,&#x27;둘 다 같은 비율로&#x27;]);
initPresets(P,stop);
workers();drawCv();drawTbl();code();
$$(&#x27;#tSel button&#x27;).forEach(b=&gt;b.classList.toggle(&#x27;sel&#x27;,+b.dataset.v===th));
window.addEventListener(&#x27;resize&#x27;,drawCv);

&lt;style&gt;

&lt;body&gt;
&lt;div class=&quot;app&quot;&gt;

&lt;h1&gt;그래프 최적화 레벨 — 노드 합치기 · 레이아웃&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;ONNX Runtime 은 세션을 만들 때 그래프를 &lt;b&gt;스스로 고칩니다&lt;/b&gt;. 얼마나 고칠지가 &lt;code&gt;graph_optimization_level&lt;/code&gt; — &lt;b&gt;DISABLE → BASIC → EXTENDED → ALL&lt;/b&gt; (기본값). 아래에서 레벨을 골라 SimpleConvNet 의 노드가 어떻게 바뀌는지 보고, MobileNetV3 의 시간을 재 봅니다.&lt;/p&gt;
&lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill blue&quot;&gt;so.graph_optimization_level&lt;/span&gt;&lt;span class=&quot;pill amber&quot;&gt;FusedConv · FusedGemm&lt;/span&gt;&lt;span class=&quot;pill teal&quot;&gt;NCHWc · ReorderOutput&lt;/span&gt;&lt;span class=&quot;pill purple&quot;&gt;com.microsoft = ORT 전용&lt;/span&gt;&lt;span class=&quot;pill green&quot;&gt;결과는 같다&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;panel pred&quot;&gt;&lt;h2&gt;먼저 예측 (실행 전에)&lt;/h2&gt;&lt;div id=&quot;pred&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;
  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;4-1 — SimpleConvNet 을 레벨별로 열기 (save_opt 로 저장한 그래프)&lt;/h2&gt;
    &lt;div class=&quot;lvls&quot; id=&quot;lvls&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;row ctl&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;run&quot; id=&quot;bOpt&quot;&gt;세션 만들기 ▶ (그래프 고치기)&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;gwrap&quot;&gt;
      &lt;div class=&quot;gcol&quot;&gt;&lt;h3&gt;원래 ONNX (mnist_cnn_dyn.onnx)&lt;/h3&gt;&lt;div class=&quot;ng&quot; id=&quot;g0&quot;&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;gcol&quot;&gt;&lt;h3 id=&quot;g1h&quot;&gt;ORT 가 고친 그래프&lt;/h3&gt;&lt;div class=&quot;ng&quot; id=&quot;g1&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;Python (노트북 4-1 · 4-2)&lt;/h2&gt;&lt;div class=&quot;code&quot; id=&quot;code&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;상태&lt;/h2&gt;&lt;div class=&quot;status info&quot; id=&quot;status&quot;&gt;프리셋을 누르세요.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;
  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;4-2 — MobileNetV3 · 레벨만 바꿔 bench (실행 예, 평균 ms)&lt;/h2&gt;
    &lt;div class=&quot;row ctl&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;run&quot; id=&quot;bTime&quot;&gt;네 레벨 재기 ▶&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;bars&quot; id=&quot;bars&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;note&quot;&gt;노트북 검증 실행 값 (Colab CPU 2코어 · 스레드 자동). 다른 실행 예: DISABLE 5.25 · ALL 1.86 ms (2.8배). 장치마다 다르지만 &lt;b&gt;ALL 에서 크게&lt;/b&gt; 빨라지는 모양은 같습니다.&lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;🔁 빨라져도 답은 같은가? (DISABLE 출력과 비교)&lt;/h2&gt;
    &lt;div class=&quot;row ctl&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;run&quot; id=&quot;bSame&quot;&gt;allclose 비교 ▶&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;diff&quot; id=&quot;diff&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;note&quot;&gt;ALL 로 저장한 그래프 (&lt;code&gt;cnn_opt_ALL.onnx&lt;/code&gt;) 는 &lt;b&gt;그 CPU 전용&lt;/b&gt;입니다 — ORT 도 &quot;should only be used in the same environment&quot; 경고를 냅니다. 배포할 때는 원래 ONNX 를 주고, 장치에서 세션을 만들 때 최적화하게 합니다.&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;panel explain&quot; id=&quot;explain&quot;&gt;&lt;/div&gt;

&lt;/div&gt;
&lt;script&gt;
const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];
const RM=window.matchMedia&amp;&amp;window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,RM?Math.min(ms,80):ms));
let busy=false, timer=null;
function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}
function setCode(h){$(&#x27;#code&#x27;).innerHTML=h;}
function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const g=c.getContext(&#x27;2d&#x27;);g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}
function initPresets(P,stop){$(&#x27;#presets&#x27;).innerHTML=P.map(p=&gt;`&lt;button type=&quot;button&quot;&gt;${p.n}&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}
const esc=s=&gt;String(s).replace(/&amp;/g,&#x27;&amp;amp;&#x27;).replace(/&lt;/g,&#x27;&amp;lt;&#x27;).replace(/&gt;/g,&#x27;&amp;gt;&#x27;);
const fmt=n=&gt;n.toLocaleString(&#x27;en-US&#x27;);
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
window.__d3={};
let guess=null, predOpts=[];
function initPredict(q,opts){predOpts=opts;guess=null;
  $(&#x27;#pred&#x27;).innerHTML=`&lt;div class=&quot;steps3&quot;&gt;&lt;span class=&quot;on&quot; id=&quot;st1&quot;&gt;① 예측&lt;/span&gt;&lt;span id=&quot;st2&quot;&gt;② 실행&lt;/span&gt;&lt;span id=&quot;st3&quot;&gt;③ 설명&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;pq&quot;&gt;${q}&lt;/div&gt;&lt;div class=&quot;seg&quot; id=&quot;predOpts&quot;&gt;${opts.map((o,i)=&gt;`&lt;button type=&quot;button&quot; data-i=&quot;${i}&quot;&gt;${o}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;pv&quot; id=&quot;predV&quot;&gt;먼저 하나를 고른 뒤 실행 ▶ 하세요. (안 골라도 실행은 됩니다)&lt;/div&gt;`;
  $$(&#x27;#predOpts button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{guess=+b.dataset.i;$$(&#x27;#predOpts button&#x27;).forEach(x=&gt;{x.classList.toggle(&#x27;sel&#x27;,x===b);x.classList.remove(&#x27;ok&#x27;,&#x27;bad&#x27;);});
    const v=$(&#x27;#predV&#x27;);v.className=&#x27;pv&#x27;;v.textContent=&#x27;예측: &#x27;+opts[guess]+&#x27; → 이제 실행해서 확인&#x27;;phase(1);});}
function phase(k){[&#x27;#st1&#x27;,&#x27;#st2&#x27;,&#x27;#st3&#x27;].forEach((s,i)=&gt;{const e=$(s);if(e)e.classList.toggle(&#x27;on&#x27;,i===k);});}

  const v=$(&#x27;#predV&#x27;);v.className=&#x27;pv &#x27;+(guess===null?&#x27;&#x27;:guess===ans?&#x27;ok&#x27;:&#x27;bad&#x27;);

function pct(a,q){const s=[...a].sort((x,y)=&gt;x-y);const h=(s.length-1)*q/100,lo=Math.floor(h),hi=Math.ceil(h);return s[lo]+(s[hi]-s[lo])*(h-lo);}

const LV=[&#x27;DISABLE&#x27;,&#x27;BASIC&#x27;,&#x27;EXTENDED&#x27;,&#x27;ALL&#x27;];

 EXTENDED:[[&#x27;FusedConv&#x27;,&#x27;fused&#x27;,&#x27;com.microsoft · Conv + Relu&#x27;],[&#x27;MaxPool&#x27;,&#x27;pool&#x27;,&#x27;&#x27;],[&#x27;Flatten&#x27;,&#x27;shp&#x27;,&#x27;&#x27;],[&#x27;FusedGemm&#x27;,&#x27;fused&#x27;,&#x27;com.microsoft · Gemm + Relu&#x27;],[&#x27;Gemm&#x27;,&#x27;&#x27;,&#x27;&#x27;]],

const T={DISABLE:5.44,BASIC:5.43,EXTENDED:5.27,ALL:2.15};

function gHtml(nodes,mark){return &#x27;&lt;div class=&quot;nio&quot;&gt;input [batch,1,28,28]&lt;/div&gt;&#x27;+nodes.map((n,i)=&gt;`&lt;div class=&quot;ne&quot;&gt;&lt;span class=&quot;ln&quot;&gt;&lt;/span&gt;&lt;span class=&quot;hd2&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;nnode ${n[1]===&#x27;act&#x27;?&#x27;act&#x27;:n[1]===&#x27;pool&#x27;?&#x27;pool&#x27;:n[1]===&#x27;shp&#x27;?&#x27;shp&#x27;:n[1]} ${mark&amp;&amp;mark.includes(i)?&#x27;merge&#x27;:&#x27;&#x27;}&quot;&gt;&lt;div class=&quot;hd&quot;&gt;${n[0]}&lt;/div&gt;${n[2]?`&lt;div class=&quot;dm&quot;&gt;${n[2]}&lt;/div&gt;`:&#x27;&#x27;}&lt;/div&gt;`).join(&#x27;&#x27;)+&#x27;&lt;div class=&quot;ne&quot;&gt;&lt;span class=&quot;ln&quot;&gt;&lt;/span&gt;&lt;span class=&quot;hd2&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;nio&quot;&gt;logits [batch,10]&lt;/div&gt;&#x27;;}

  $(&#x27;#lvls&#x27;).innerHTML=LV.map(l=&gt;`&lt;button type=&quot;button&quot; data-l=&quot;${l}&quot; class=&quot;${l===lv?&#x27;sel&#x27;:&#x27;&#x27;}&quot;&gt;${l}&lt;small&gt;${LVD[l]}&lt;/small&gt;&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#lvls button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(busy)return;lv=b.dataset.l;shown=null;merge=[];draw();setStatus(&#x27;info&#x27;,`${lv} 선택 — 세션 만들기 ▶ 를 누르면 ORT 가 그래프를 고칩니다`);});
  $(&#x27;#g0&#x27;).innerHTML=gHtml(N0,merge)+`&lt;div class=&quot;cnt&quot;&gt;노드 &lt;b&gt;7&lt;/b&gt; 개&lt;/div&gt;`;
  if(shown){$(&#x27;#g1&#x27;).innerHTML=gHtml(G[shown])+`&lt;div class=&quot;cnt&quot;&gt;${shown} → 노드 &lt;b&gt;${G[shown].length}&lt;/b&gt; 개&lt;/div&gt;`;$(&#x27;#g1h&#x27;).textContent=`cnn_opt_${shown}.onnx`;}
  else{$(&#x27;#g1&#x27;).innerHTML=&#x27;&lt;div class=&quot;dim&quot; style=&quot;padding:30px 6px;text-align:center;font-size:13px&quot;&gt;세션 만들기 ▶ 를 누르세요&lt;/div&gt;&#x27;;$(&#x27;#g1h&#x27;).textContent=&#x27;ORT 가 고친 그래프&#x27;;}
  code();}
function code(){const ops=shown?G[shown].map(n=&gt;`&#x27;${n[0]}&#x27;`).join(&#x27;, &#x27;):&#x27;&#x27;;
  setCode(`&lt;span class=&quot;c&quot;&gt;# 4-1  레벨별로 세션을 만들며 고친 그래프 저장&lt;/span&gt;
for lv in [&quot;DISABLE&quot;, &quot;BASIC&quot;, &quot;EXTENDED&quot;, &quot;ALL&quot;]:
    make_session(&quot;mnist_cnn_dyn.onnx&quot;, level=&lt;span class=&quot;hl&quot;&gt;lv&lt;/span&gt;, save_opt=f&quot;cnn_opt_{lv}.onnx&quot;)
    g_ = onnx.load(f&quot;cnn_opt_{lv}.onnx&quot;).graph
    print(lv.ljust(9), len(g_.node), &quot;개:&quot;, [n.op_type for n in g_.node])
${shown?`&lt;span class=&quot;b&quot;&gt;# ${shown.padEnd(9)} ${G[shown].length} 개: [${ops}]&lt;/span&gt;`:&#x27;&#x27;}

&lt;span class=&quot;c&quot;&gt;# make_session 안에서&lt;/span&gt;
so.graph_optimization_level = LEVELS[&quot;&lt;span class=&quot;a&quot;&gt;${lv}&lt;/span&gt;&quot;]   &lt;span class=&quot;c&quot;&gt;# ORT_${lv===&#x27;DISABLE&#x27;?&#x27;DISABLE_ALL&#x27;:&#x27;ENABLE_&#x27;+lv}&lt;/span&gt;

&lt;span class=&quot;c&quot;&gt;# 4-2  MobileNetV3 — 레벨만 바꿔 bench&lt;/span&gt;
rows.append({&quot;level&quot;: lv, **bench(make_session(&quot;mnv3s.onnx&quot;, level=lv), x1)})
df_lv[&quot;speedup&quot;] = df_lv[&quot;mean&quot;].iloc[0] / df_lv[&quot;&lt;span class=&quot;hl&quot;&gt;mean&lt;/span&gt;&quot;]`);}
async function opt(){phase(1);shown=null;merge=[];draw();
  if(lv===&#x27;EXTENDED&#x27;||lv===&#x27;ALL&#x27;){merge=[0,1];draw();setStatus(&#x27;info&#x27;,&#x27;Conv 바로 뒤 Relu → 하나로 합칠 수 있음&#x27;);await sleep(900);merge=[4,5];draw();setStatus(&#x27;info&#x27;,&#x27;Gemm (fc1) 바로 뒤 Relu → 하나로 합칠 수 있음&#x27;);await sleep(900);merge=[];}
  if(lv===&#x27;ALL&#x27;){merge=[0];draw();setStatus(&#x27;info&#x27;,&#x27;Conv → 이 CPU 의 SIMD 에 맞는 NCHWc 레이아웃으로 · 뒤에 ReorderOutput 으로 되돌리기&#x27;);await sleep(900);merge=[];}

function bars(k){$(&#x27;#bars&#x27;).innerHTML=LV.map((l,i)=&gt;`&lt;span&gt;${l}&lt;/span&gt;&lt;div class=&quot;t&quot;&gt;&lt;i style=&quot;width:${i&lt;k?T[l]/6*100:0}%;background:${l===&#x27;ALL&#x27;?&#x27;var(--green)&#x27;:&#x27;var(--blue)&#x27;}&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;span&gt;${i&lt;k?T[l].toFixed(2)+&#x27; ms · &#x27;+(T.DISABLE/T[l]).toFixed(2)+&#x27;×&#x27;:&#x27;—&#x27;}&lt;/span&gt;`).join(&#x27;&#x27;);}
async function timeAll(){phase(1);for(let k=1;k&lt;=4;k++){bars(k);setStatus(&#x27;info&#x27;,`bench(make_session(&quot;mnv3s.onnx&quot;, level=&quot;${LV[k-1]}&quot;), x1) → ${T[LV[k-1]].toFixed(2)} ms`);await sleep(700);}

  $(&#x27;#diff&#x27;).innerHTML+=`&lt;div&gt;${l.padEnd(9,&#x27; &#x27;)} 최대 차이 &lt;b&gt;${D[l]}&lt;/b&gt; | allclose: &lt;span class=&quot;ok1&quot;&gt;True&lt;/span&gt;&lt;/div&gt;`;}

 {n:&#x27;① DISABLE · BASIC&#x27;,ex:&#x27;&lt;p&gt;&lt;b&gt;DISABLE&lt;/b&gt; = 원래 그래프 그대로 7개: Conv · Relu · MaxPool · Flatten · Gemm · Relu · Gemm.&lt;/p&gt;&lt;p&gt;&lt;b&gt;BASIC&lt;/b&gt; = 상수 접기 · 쓸모없는 노드 제거. 이 모델은 이미 export 단계에서 접혀 있어 &lt;b&gt;바꿀 것이 없습니다&lt;/b&gt; → 7개 그대로.&lt;/p&gt;&#x27;,

&lt;h1&gt;CPU → GPU — 복사 · 계산 · 복사&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;providers 맨 앞에 &lt;code&gt;CUDAExecutionProvider&lt;/code&gt; 를 두면 GPU 에서 실행합니다. 코드는 한 단어지만, &lt;b style=&quot;color:var(--amber)&quot;&gt;CPU ↔ GPU 사이에 데이터를 나르는 시간&lt;/b&gt;과 &lt;b style=&quot;color:var(--red)&quot;&gt;첫 실행 준비 시간&lt;/b&gt;이 새로 생깁니다. 아래 타임라인에서 배치 1 과 배치 32 를 비교해 보세요.&lt;/p&gt;
&lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill amber&quot;&gt;CUDAExecutionProvider&lt;/span&gt;&lt;span class=&quot;pill blue&quot;&gt;H2D 복사&lt;/span&gt;&lt;span class=&quot;pill green&quot;&gt;GPU 계산&lt;/span&gt;&lt;span class=&quot;pill teal&quot;&gt;D2H 복사&lt;/span&gt;&lt;span class=&quot;pill red&quot;&gt;첫 실행 = cuDNN 준비&lt;/span&gt;&lt;span class=&quot;pill purple&quot;&gt;GPU 숫자 = 예시&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;panel pred&quot;&gt;&lt;h2&gt;먼저 예측 (실행 전에)&lt;/h2&gt;&lt;div id=&quot;pred&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;
  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;한 번의 run — 타임라인&lt;/h2&gt;
    &lt;div class=&quot;warn5&quot;&gt;⚠️ 이 과정의 검증 실행 환경에는 GPU 가 없었습니다. &lt;b&gt;GPU 의 모든 시간은 설명용 예시&lt;/b&gt;입니다 (T4 에서 실제로 재면 달라집니다). CPU 숫자는 노트북 검증 실행 값입니다.&lt;/div&gt;

const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];

  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}
const esc=s=&gt;String(s).replace(/&amp;/g,&#x27;&amp;amp;&#x27;).replace(/&lt;/g,&#x27;&amp;lt;&#x27;).replace(/&gt;/g,&#x27;&amp;gt;&#x27;);
const fmt=n=&gt;n.toLocaleString(&#x27;en-US&#x27;);

  $(&#x27;#pred&#x27;).innerHTML=`&lt;div class=&quot;steps3&quot;&gt;&lt;span class=&quot;on&quot; id=&quot;st1&quot;&gt;① 예측&lt;/span&gt;&lt;span id=&quot;st2&quot;&gt;② 실행&lt;/span&gt;&lt;span id=&quot;st3&quot;&gt;③ 설명&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;pq&quot;&gt;${q}&lt;/div&gt;&lt;div class=&quot;seg&quot; id=&quot;predOpts&quot;&gt;${opts.map((o,i)=&gt;`&lt;button type=&quot;button&quot; data-i=&quot;${i}&quot;&gt;${o}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;pv&quot; id=&quot;predV&quot;&gt;먼저 하나를 고른 뒤 실행 ▶ 하세요. (안 골라도 실행은 됩니다)&lt;/div&gt;`;
  $$(&#x27;#predOpts button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{guess=+b.dataset.i;$$(&#x27;#predOpts button&#x27;).forEach(x=&gt;{x.classList.toggle(&#x27;sel&#x27;,x===b);x.classList.remove(&#x27;ok&#x27;,&#x27;bad&#x27;);});
    const v=$(&#x27;#predV&#x27;);v.className=&#x27;pv&#x27;;v.textContent=&#x27;예측: &#x27;+opts[guess]+&#x27; → 이제 실행해서 확인&#x27;;phase(1);});}

  v.innerHTML=(guess===null?&#x27;정답: &#x27;:guess===ans?&#x27;✅ 예측 적중 — &#x27;:&#x27;❌ 예측과 다름 — &#x27;)+&#x27;&lt;b&gt;&#x27;+predOpts[ans]+&#x27;&lt;/b&gt;. &#x27;+why;phase(2);window.__d3.judged=(window.__d3.judged||0)+1;}
function ready(){$(&#x27;#explain&#x27;).innerHTML=&#x27;&lt;p&gt;&lt;b class=&quot;amber&quot;&gt;① 예측&lt;/b&gt;을 먼저 고르고 → &lt;b class=&quot;teal&quot;&gt;② 프리셋 또는 ▶ 버튼&lt;/b&gt;으로 실행하면 → &lt;b class=&quot;green&quot;&gt;③ 여기에 설명&lt;/b&gt;이 나옵니다.&lt;/p&gt;&#x27;;setStatus(&#x27;info&#x27;,&#x27;먼저 위에서 예측을 하나 고른 뒤, 프리셋이나 ▶ 버튼을 누르세요.&#x27;);}
function pct(a,q){const s=[...a].sort((x,y)=&gt;x-y);const h=(s.length-1)*q/100,lo=Math.floor(h),hi=Math.ceil(h);return s[lo]+(s[hi]-s[lo])*(h-lo);}

// CPU: 검증 값 (배치 1 = 6교시 실행 예 1.92 ms, 배치 32 = 5-2 실행 예 64.6 ms). GPU: 전부 예시.
const TL={CPU:{1:[[&#x27;c&#x27;,1.92]],32:[[&#x27;c&#x27;,64.6]]},GPU:{1:[[&#x27;o&#x27;,0.25],[&#x27;h&#x27;,0.08],[&#x27;g&#x27;,0.85],[&#x27;d&#x27;,0.02]],32:[[&#x27;o&#x27;,0.25],[&#x27;h&#x27;,2.4],[&#x27;g&#x27;,5.4],[&#x27;d&#x27;,0.05]]}};
const COL={c:&#x27;#2dd4bf&#x27;,h:&#x27;#60a5fa&#x27;,g:&#x27;#4ade80&#x27;,d:&#x27;#c084fc&#x27;,o:&#x27;#8a9bb8&#x27;};
const NAME={c:&#x27;CPU 계산&#x27;,h:&#x27;H2D&#x27;,g:&#x27;GPU 계산&#x27;,d:&#x27;D2H&#x27;,o:&#x27;준비&#x27;};
const tot=(d,b)=&gt;TL[d][b].reduce((a,s)=&gt;a+s[1],0);
let dev=&#x27;BOTH&#x27;, B=1, prog=1, f5=null, f5d=&#x27;&#x27;, seen={};
function lanes(){return dev===&#x27;BOTH&#x27;?[&#x27;CPU&#x27;,&#x27;GPU&#x27;]:[dev];}
function draw(){const [g,w,h]=fitCanvas($(&#x27;#cv&#x27;));g.clearRect(0,0,w,h);g.font=&#x27;12px Consolas,monospace&#x27;;
  const L=lanes(),mx=Math.max(...L.map(d=&gt;tot(d,B)))*1.08,X0=46,lw=w-X0-10;
  L.forEach((d,k)=&gt;{const y=24+k*((h-50)/L.length),bh=Math.min(46,(h-60)/L.length-14);

    let x=0;const lim=tot(d,B)*prog;
    TL[d][B].forEach(([k2,v])=&gt;{const vv=Math.max(0,Math.min(v,lim-x));if(vv&gt;0){const px=X0+x/mx*lw,pw=Math.max(2,vv/mx*lw);g.fillStyle=COL[k2];g.fillRect(px,y,pw,bh);
        if(pw&gt;44&amp;&amp;vv===v){g.fillStyle=&#x27;#0b1220&#x27;;g.fillText(NAME[k2],px+4,y+bh/2+4);}}x+=v;});
    if(prog&gt;=1){g.fillStyle=&#x27;#dbe4f0&#x27;;const t=tot(d,B);const tx=Math.min(X0+t/mx*lw+6,w-150);
      g.fillText(`${t.toFixed(2)} ms${d===&#x27;GPU&#x27;?&#x27; (예시)&#x27;:&#x27;&#x27;}`,tx,y+bh+14);}});
  g.fillStyle=&#x27;#8a9bb8&#x27;;g.fillText(`배치 ${B} · 시간 →`,X0,h-4);}
async function play(){phase(1);prog=0;for(let i=1;i&lt;=24;i++){prog=i/24;draw();await sleep(40);}prog=1;draw();seen[dev+B]=1;tbl();
  const c=tot(&#x27;CPU&#x27;,B),gg=tot(&#x27;GPU&#x27;,B);
  if(dev===&#x27;CPU&#x27;)setStatus(&#x27;ok&#x27;,`CPU 배치 ${B}: ${c.toFixed(2)} ms (실행 예) → ${(B*1000/c).toFixed(0)} 장/초`);
  else if(dev===&#x27;GPU&#x27;)setStatus(&#x27;ok&#x27;,`GPU 배치 ${B} (예시): 복사 ${(TL.GPU[B][1][1]+TL.GPU[B][3][1]).toFixed(2)} ms + 계산 ${TL.GPU[B][2][1]} ms + 준비 → ${gg.toFixed(2)} ms`);
  else{setStatus(B===1?&#x27;info&#x27;:&#x27;ok&#x27;,B===1?`배치 1: CPU ${c.toFixed(2)} ms vs GPU ${gg.toFixed(2)} ms (예시)\n계산량이 작아 복사 · 실행 준비가 큰 비중 → 차이가 작다`:`배치 32: CPU ${c.toFixed(1)} ms vs GPU ${gg.toFixed(1)} ms (예시)\nGPU 의 수천 개 코어에 일거리가 생김 → 처리량 차이가 크게 벌어짐`);
    if(B===1)judge(1,&#x27;배치 1 은 계산량이 작아 복사 · 실행 준비가 큰 비중을 차지합니다. GPU 의 이득이 작거나, CPU 가 이기기도 합니다 (5교시 해설).&#x27;);}
  window.__d3.tl=(window.__d3.tl||0)+1;}

function sel(){$$(&#x27;#dSel button&#x27;).forEach(b=&gt;b.classList.toggle(&#x27;sel&#x27;,b.dataset.v===dev));$$(&#x27;#bSel button&#x27;).forEach(b=&gt;b.classList.toggle(&#x27;sel&#x27;,+b.dataset.v===B));code();}
$$(&#x27;#dSel button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(busy)return;dev=b.dataset.v;sel();prog=1;draw();});
$$(&#x27;#bSel button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(busy)return;B=+b.dataset.v;sel();prog=1;draw();});
const F5={CPU:[2.2,2.66,2.11,2.5,2.33],GPU:[1450,3.1,1.6,1.4,1.35]};
function draw5(k){const [g,w,h]=fitCanvas($(&#x27;#cv5&#x27;));g.clearRect(0,0,w,h);g.font=&#x27;12px Consolas,monospace&#x27;;
  if(!f5d){g.fillStyle=&#x27;#8a9bb8&#x27;;g.fillText(&#x27;▶ 를 누르세요&#x27;,10,24);return;}
  const a=F5[f5d],L=8,bw=(w-L*2)/5,lg=v=&gt;Math.log10(v+1)/Math.log10(1600);
  a.slice(0,k).forEach((v,i)=&gt;{const bh=(f5d===&#x27;GPU&#x27;?lg(v):v/3)*(h-40);g.fillStyle=i===0?&#x27;#f87171&#x27;:&#x27;#2dd4bf&#x27;;g.fillRect(L+i*bw+8,h-20-bh,bw-16,bh);
    g.fillStyle=&#x27;#dbe4f0&#x27;;g.fillText(v&gt;=100?v.toFixed(0):v.toFixed(2),L+i*bw+10,h-24-bh);g.fillStyle=&#x27;#8a9bb8&#x27;;g.fillText(`#${i+1}`,L+i*bw+bw/2-8,h-5);});
  g.fillStyle=f5d===&#x27;GPU&#x27;?&#x27;#c084fc&#x27;:&#x27;#8a9bb8&#x27;;g.fillText(f5d===&#x27;GPU&#x27;?&#x27;GPU (예시 · 로그 눈금)&#x27;:&#x27;CPU (검증 실행 2-1)&#x27;,w-190,14);}
async function first5(d){f5d=d;phase(1);for(let k=1;k&lt;=5;k++){draw5(k);await sleep(450);}
  if(d===&#x27;GPU&#x27;)setStatus(&#x27;warn&#x27;,&#x27;GPU 첫 실행 1450 ms vs 다섯 번째 1.35 ms (예시)\nCUDA 초기화 · GPU 메모리 확보 · cuDNN 이 Conv 마다 가장 빠른 방법 찾기\n→ GPU 에서는 warm-up 이 CPU 보다 훨씬 중요&#x27;);
  else setStatus(&#x27;info&#x27;,&#x27;CPU 첫 5번 (검증 실행): 2.2 · 2.66 · 2.11 · 2.5 · 2.33 ms\n이 실행에서는 첫 번째가 특별히 느리지 않았다 — 준비 비용이 작음&#x27;);window.__d3.f5=d;}
$(&#x27;#b5c&#x27;).onclick=()=&gt;{if(!busy){busy=true;first5(&#x27;CPU&#x27;).finally(()=&gt;busy=false);}};
$(&#x27;#b5g&#x27;).onclick=()=&gt;{if(!busy){busy=true;first5(&#x27;GPU&#x27;).finally(()=&gt;busy=false);}};
function tbl(){const rows=[[&#x27;CPU&#x27;,1],[&#x27;CPU&#x27;,32],[&#x27;GPU&#x27;,1],[&#x27;GPU&#x27;,32]];
  $(&#x27;#tbl&#x27;).innerHTML=&#x27;&lt;tr&gt;&lt;th&gt;device&lt;/th&gt;&lt;th&gt;batch&lt;/th&gt;&lt;th&gt;mean ms&lt;/th&gt;&lt;th&gt;fps (장/초)&lt;/th&gt;&lt;/tr&gt;&#x27;+rows.map(([d,b])=&gt;{const t=tot(d,b),s=seen[d+b]||seen[&#x27;BOTH&#x27;+b];
    return `&lt;tr class=&quot;${b===B&amp;&amp;(dev===d||dev===&#x27;BOTH&#x27;)?&#x27;cur&#x27;:&#x27;&#x27;}&quot;&gt;&lt;td&gt;${d}&lt;/td&gt;&lt;td&gt;${b}&lt;/td&gt;&lt;td&gt;${s?t.toFixed(2)+(d===&#x27;GPU&#x27;?&#x27; &lt;span class=&quot;ex&quot;&gt;예시&lt;/span&gt;&#x27;:&#x27;&#x27;):&#x27;?&#x27;}&lt;/td&gt;&lt;td&gt;${s?(b*1000/t).toFixed(0):&#x27;?&#x27;}&lt;/td&gt;&lt;/tr&gt;`;}).join(&#x27;&#x27;);
  $(&#x27;#kv&#x27;).innerHTML=`&lt;span&gt;CPU 출처&lt;/span&gt;&lt;b&gt;배치 1 = 6교시 실행 예 · 배치 32 = 5-2 실행 예 (64.6 ms)&lt;/b&gt;&lt;span&gt;GPU vs CPU&lt;/span&gt;&lt;b&gt;최대 차이 1e-6 ~ 1e-5 정도가 정상 &lt;span class=&quot;ex&quot;&gt;예시&lt;/span&gt; → atol=1e-3 으로 판정&lt;/b&gt;&lt;span&gt;예측 일치율&lt;/span&gt;&lt;b&gt;argmax 가 같으면 1.00&lt;/b&gt;`;}
function code(){
  setCode(`&lt;span class=&quot;c&quot;&gt;# 5-1  GPU 세션 — 희망 목록 맨 앞에 CUDA&lt;/span&gt;

print(&quot;실제 실행기:&quot;, gpu_sess.get_providers()[0])   &lt;span class=&quot;c&quot;&gt;# 꼭 확인!&lt;/span&gt;

&lt;span class=&quot;c&quot;&gt;# 5-2  CPU · GPU × 배치 1 · 32&lt;/span&gt;
x32 = np.random.rand(32, 3, 224, 224).astype(np.float32)
for dev, s_ in [(&quot;CPU&quot;, cpu_sess), (&quot;GPU&quot;, gpu_sess)]:

&lt;span class=&quot;b&quot;&gt;# 지금: ${dev===&#x27;BOTH&#x27;?&#x27;CPU · GPU&#x27;:dev} · 배치 ${B}&lt;/span&gt;

&lt;span class=&quot;c&quot;&gt;# 5-3  결과는 같은가 — GPU 는 다른 커널 → atol 조금 크게&lt;/span&gt;
gpu_diff = float(np.abs(out_gpu - out_cpu).&lt;span class=&quot;hl&quot;&gt;max&lt;/span&gt;())
assert gpu_diff &lt; 1e-3`);}

const P=[
 {n:&#x27;① GPU 첫 실행 (5-1)&#x27;,ex:&#x27;&lt;p&gt;GPU 는 처음에 준비할 것이 많습니다: CUDA 초기화 · GPU 메모리 확보 · &lt;b&gt;cuDNN&lt;/b&gt; 이 Conv 마다 가장 빠른 계산 방법을 찾기. 그래서 첫 실행이 수백 ms ~ 수 초 &lt;span class=&quot;ex&quot;&gt;예시&lt;/span&gt;.&lt;/p&gt;&lt;p&gt;⚠️ warm-up 없이 첫 실행을 성능으로 기록하면 수백 배 느리게 보입니다. 실제 서비스에서는 시작할 때 한 번 미리 돌려 둡니다.&lt;/p&gt;&#x27;,

 {n:&#x27;② 배치 1 — 복사가 큰 비중&#x27;,ex:&#x27;&lt;p&gt;배치 1: GPU 계산 자체는 빠르지만 &lt;b class=&quot;blue&quot;&gt;H2D 복사&lt;/b&gt; · 실행 준비 · &lt;b class=&quot;purple&quot;&gt;D2H 복사&lt;/b&gt;가 붙습니다. 계산량이 작으면 이 고정 비용의 비중이 커서 &lt;b&gt;GPU 의 이득이 작거나 CPU 가 이기기도&lt;/b&gt; 합니다.&lt;/p&gt;&lt;p&gt;그래서 배치 1 하나만 재고 &quot;GPU 가 별로&quot; 라고 결론 내리면 안 됩니다.&lt;/p&gt;&#x27;,

 {n:&#x27;③ 배치 32 — GPU 의 일거리&#x27;,ex:&#x27;&lt;p&gt;배치 32: CPU 는 실행 예 &lt;b&gt;64.6 ms&lt;/b&gt; (≈ 495 장/초). GPU 는 복사도 32배로 늘지만 계산을 수천 개 코어가 나눠 하므로 전체가 훨씬 짧습니다 &lt;span class=&quot;ex&quot;&gt;예시&lt;/span&gt;.&lt;/p&gt;&lt;p&gt;GPU 는 &lt;b&gt;일이 많을수록&lt;/b&gt; 유리합니다 → 6교시 배치 크기.&lt;/p&gt;&#x27;,

&lt;h1&gt;배치 크기 — 지연 vs 처리량&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;두 숫자를 따로 봅니다. &lt;b style=&quot;color:var(--red)&quot;&gt;지연 (latency, ms)&lt;/b&gt; = 한 번 &lt;code&gt;run&lt;/code&gt; 이 끝날 때까지 걸린 시간. &lt;b style=&quot;color:var(--green)&quot;&gt;처리량 (throughput, 장/초)&lt;/b&gt; = 1초에 처리하는 사진 수 = 배치 × 1000 ÷ 지연. 배치를 키우면 지연은 늘어나는데, 처리량은? CPU (코어 2개) 에서 배치 1 → 64 로 재 봅니다.&lt;/p&gt;
&lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill red&quot;&gt;latency_ms = r[&quot;mean&quot;]&lt;/span&gt;&lt;span class=&quot;pill green&quot;&gt;imgs_per_s = r[&quot;fps&quot;]&lt;/span&gt;&lt;span class=&quot;pill blue&quot;&gt;ms_per_img = mean / b&lt;/span&gt;&lt;span class=&quot;pill amber&quot;&gt;idxmax()&lt;/span&gt;&lt;span class=&quot;pill purple&quot;&gt;카메라 수 = 처리량 // 30&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;

&lt;div class=&quot;grid&quot;&gt;

const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];

  $(&#x27;#pred&#x27;).innerHTML=`&lt;div class=&quot;steps3&quot;&gt;&lt;span class=&quot;on&quot; id=&quot;st1&quot;&gt;① 예측&lt;/span&gt;&lt;span id=&quot;st2&quot;&gt;② 실행&lt;/span&gt;&lt;span id=&quot;st3&quot;&gt;③ 설명&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;pq&quot;&gt;${q}&lt;/div&gt;&lt;div class=&quot;seg&quot; id=&quot;predOpts&quot;&gt;${opts.map((o,i)=&gt;`&lt;button type=&quot;button&quot; data-i=&quot;${i}&quot;&gt;${o}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;pv&quot; id=&quot;predV&quot;&gt;먼저 하나를 고른 뒤 실행 ▶ 하세요. (안 골라도 실행은 됩니다)&lt;/div&gt;`;
  $$(&#x27;#predOpts button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{guess=+b.dataset.i;$$(&#x27;#predOpts button&#x27;).forEach(x=&gt;{x.classList.toggle(&#x27;sel&#x27;,x===b);x.classList.remove(&#x27;ok&#x27;,&#x27;bad&#x27;);});
    const v=$(&#x27;#predV&#x27;);v.className=&#x27;pv&#x27;;v.textContent=&#x27;예측: &#x27;+opts[guess]+&#x27; → 이제 실행해서 확인&#x27;;phase(1);});}

const BS=[1,4,16,64], LAT={1:1.92,4:6.78,16:31.54,64:138.06}, THR={1:520,4:590,16:507,64:464};

  const L=44,R=48,T=30,Bm=28,pw=w-L-R,ph=h-T-Bm,X=i=&gt;L+pw*(i/3),YL=v=&gt;T+ph*(1-v/150),YT=v=&gt;T+ph*(1-v/700);

  g.fillStyle=&#x27;#4ade80&#x27;;for(const v of [0,350,700]){g.fillText(v,w-R+6,YT(v)+4);}g.textAlign=&#x27;right&#x27;;g.fillText(&#x27;처리량 장/초 ●&#x27;,w-4,13);g.textAlign=&#x27;left&#x27;;
  const yb=YL(33.3);g.strokeStyle=&#x27;#f5b942&#x27;;g.setLineDash([4,4]);g.beginPath();g.moveTo(L,yb);g.lineTo(L+pw,yb);g.stroke();g.setLineDash([]);g.fillStyle=&#x27;#f5b942&#x27;;g.fillText(&#x27;실시간 예산 33 ms (30 FPS)&#x27;,L+4,yb-4);

  pts.forEach(([i,b])=&gt;{g.fillStyle=&#x27;#dbe4f0&#x27;;g.fillText(THR[b]+&#x27;&#x27;,X(i)+6,YT(THR[b])-6);g.fillStyle=&#x27;#f87171&#x27;;g.fillText(LAT[b].toFixed(1),X(i)+6,YL(LAT[b])+14);});}

  $(&#x27;#tbl&#x27;).innerHTML=&#x27;&lt;tr&gt;&lt;th&gt;batch&lt;/th&gt;&lt;th&gt;latency_ms&lt;/th&gt;&lt;th&gt;imgs_per_s&lt;/th&gt;&lt;th&gt;ms_per_img&lt;/th&gt;&lt;/tr&gt;&#x27;+BS.map(b=&gt;`&lt;tr class=&quot;${b===B?&#x27;cur&#x27;:&#x27;&#x27;}&quot;&gt;&lt;td&gt;${b}&lt;/td&gt;&lt;td&gt;${done[b]?LAT[b].toFixed(2):&#x27;?&#x27;}&lt;/td&gt;&lt;td class=&quot;${b===best?&#x27;ok1&#x27;:&#x27;&#x27;}&quot;&gt;${done[b]?THR[b]:&#x27;?&#x27;}&lt;/td&gt;&lt;td&gt;${done[b]?(LAT[b]/b).toFixed(2):&#x27;?&#x27;}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;);}
function cam(){const need=cams*fpsC,bud=1000/fpsC;$(&#x27;#oC&#x27;).textContent=cams+&#x27;대&#x27;;$(&#x27;#oF&#x27;).textContent=fpsC;
  $(&#x27;#cam&#x27;).innerHTML=BS.map(b=&gt;{const cap=Math.floor(THR[b]/fpsC),ok=THR[b]&gt;=need,gat=b/need*1000,tot=gat+LAT[b];
    return `&lt;div class=&quot;fb ${ok?&#x27;okc&#x27;:&#x27;ngc&#x27;}&quot;&gt;&lt;small&gt;배치 ${b} · ${THR[b]} 장/초&lt;/small&gt;&lt;b&gt;${cap}대&lt;/b&gt;&lt;small&gt;필요 ${need} 장/초 → ${ok?&#x27;감당 ✓&#x27;:&#x27;부족 ✗&#x27;}&lt;/small&gt;&lt;small&gt;지연 ${LAT[b].toFixed(1)} + 모으기 ${gat.toFixed(1)} = ${tot.toFixed(1)} ms${tot&gt;bud?&#x27; &gt; 예산&#x27;:&#x27;&#x27;}&lt;/small&gt;&lt;/div&gt;`;}).join(&#x27;&#x27;);code();}
function code(){
  setCode(`&lt;span class=&quot;c&quot;&gt;# 6-1  배치 1 · 4 · 16 · 64&lt;/span&gt;
for b in [1, 4, 16, 64]:
    xb = np.random.rand(b, 3, 224, 224).astype(np.float32)
    r = bench(cpu_sess, xb, n=20, warm=3)
    rows.append({&quot;batch&quot;: b, &quot;latency_ms&quot;: r[&quot;&lt;span class=&quot;hl&quot;&gt;mean&lt;/span&gt;&quot;], &quot;imgs_per_s&quot;: r[&quot;fps&quot;],
                 &quot;ms_per_img&quot;: r[&quot;mean&quot;] / &lt;span class=&quot;hl&quot;&gt;b&lt;/span&gt;})
${done[B]?`&lt;span class=&quot;b&quot;&gt;# batch ${B}: latency ${LAT[B].toFixed(2)} ms · ${THR[B]} 장/초 · ${(LAT[B]/B).toFixed(2)} ms/장&lt;/span&gt;`:&#x27;&#x27;}

&lt;span class=&quot;c&quot;&gt;# 6-2  처리량이 가장 큰 배치&lt;/span&gt;
best_batch = int(df_b.loc[df_b.imgs_per_s.&lt;span class=&quot;hl&quot;&gt;idxmax&lt;/span&gt;(), &quot;batch&quot;])   &lt;span class=&quot;b&quot;&gt;# 4&lt;/span&gt;

&lt;span class=&quot;c&quot;&gt;# 6-3  카메라 몇 대? (카메라 ${fpsC} FPS)&lt;/span&gt;
cams_b1 = int(df_b.imgs_per_s.iloc[0] // &lt;span class=&quot;hl&quot;&gt;${fpsC}&lt;/span&gt;)        &lt;span class=&quot;b&quot;&gt;# ${Math.floor(THR[1]/fpsC)}&lt;/span&gt;
cams_best = int(df_b.imgs_per_s.max() // ${fpsC})           &lt;span class=&quot;b&quot;&gt;# ${Math.floor(THR[4]/fpsC)}&lt;/span&gt;`);}
async function run1(b){B=b;sel();phase(1);frames(0);$(&#x27;#mbox&#x27;).classList.remove(&#x27;run&#x27;);
  for(let k=1;k&lt;=b;k+=Math.max(1,Math.floor(b/8))){frames(k);await sleep(60);}frames(b);
  $(&#x27;#mbox&#x27;).classList.add(&#x27;run&#x27;);await sleep(Math.min(900,300+LAT[b]*4));$(&#x27;#mbox&#x27;).classList.remove(&#x27;run&#x27;);frames(0);
  done[b]=1;draw();tbl();code();
  setStatus(b===64?&#x27;warn&#x27;:&#x27;ok&#x27;,`배치 ${b}: 지연 ${LAT[b].toFixed(2)} ms · 처리량 ${b} × 1000 / ${LAT[b].toFixed(2)} = ${THR[b]} 장/초${b===64?&#x27;\n지연이 실시간 예산 33 ms 를 크게 넘음 — 처리량도 배치 1 보다 낮다&#x27;:&#x27;&#x27;}`);
  if(BS.every(x=&gt;done[x]))judge(2,&#x27;배치 64 는 464 장/초로 배치 1 (520) 보다 오히려 낮습니다. CPU 는 코어가 2개뿐이라 처리량이 금방 멈추고, 배치가 너무 크면 캐시에 다 안 들어가 떨어지기도 합니다.&#x27;);}
$(&#x27;#bRun&#x27;).onclick=()=&gt;{if(!busy){busy=true;run1(B).finally(()=&gt;busy=false);}};
async function runAll(){for(const b of BS){await run1(b);await sleep(600);}}
$(&#x27;#bAll&#x27;).onclick=()=&gt;{if(!busy){busy=true;runAll().finally(()=&gt;busy=false);}};
$$(&#x27;#bSel button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(busy)return;B=+b.dataset.v;sel();frames(0);draw();tbl();code();});
$(&#x27;#sC&#x27;).oninput=()=&gt;{cams=+$(&#x27;#sC&#x27;).value;cam();};
$(&#x27;#sF&#x27;).oninput=()=&gt;{fpsC=+$(&#x27;#sF&#x27;).value;cam();};
function setC(c,f){cams=c;fpsC=f;$(&#x27;#sC&#x27;).value=c;$(&#x27;#sF&#x27;).value=f;cam();}
function stop(){}
const P=[
 {n:&#x27;① 배치 1 → 64 (6-1)&#x27;,ex:&#x27;&lt;p&gt;지연: 1.92 → 6.78 → 31.54 → &lt;b class=&quot;red&quot;&gt;138.06 ms&lt;/b&gt; — 배치와 함께 계속 늘어납니다.&lt;/p&gt;&lt;p&gt;처리량: 520 → &lt;b class=&quot;green&quot;&gt;590&lt;/b&gt; → 507 → 464 장/초 — 배치 4 에서 정점을 찍고 오히려 줄어듭니다. CPU 는 코어가 2개뿐이라 일을 많이 줘도 동시에 할 사람이 없습니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{done={};await runAll();}},
 {n:&#x27;② 장당 시간&#x27;,ex:&#x27;&lt;p&gt;&lt;code&gt;ms_per_img = latency_ms / b&lt;/code&gt; → 1.92 · 1.70 · 1.97 · 2.16 ms. &lt;code&gt;ms_per_img × imgs_per_s = 1000&lt;/code&gt; — 같은 정보의 두 표현입니다.&lt;/p&gt;&lt;p&gt;⚠️ 배치 b 의 시간을 그대로 &quot;한 장 시간&quot; 으로 쓰면 안 됩니다. 장당 시간 = 지연 ÷ b.&lt;/p&gt;&#x27;,
  run:async()=&gt;{done={1:1,4:1,16:1,64:1};draw();tbl();for(const b of BS){B=b;sel();tbl();code();setStatus(&#x27;info&#x27;,`배치 ${b}: ${LAT[b].toFixed(2)} ms ÷ ${b} = ${(LAT[b]/b).toFixed(2)} ms/장 · × ${THR[b]} 장/초 ≈ 1000`);await sleep(1000);}}},
 {n:&#x27;③ 처리량 최대 배치 (6-2)&#x27;,ex:&#x27;&lt;p&gt;&lt;code&gt;df_b.imgs_per_s.idxmax()&lt;/code&gt; → &lt;b class=&quot;green&quot;&gt;배치 4&lt;/b&gt; (590 장/초).&lt;/p&gt;&lt;p&gt;하지만 실시간 카메라라면 &lt;b&gt;지연&lt;/b&gt;이 예산 (30 FPS → 33 ms) 안이어야 합니다. 배치 64 는 138 ms — 처리량이 높아도 실시간에는 못 씁니다. &lt;b&gt;목적에 따라 고르는 숫자가 다릅니다.&lt;/b&gt;&lt;/p&gt;&#x27;,
  run:async()=&gt;{done={1:1,4:1,16:1,64:1};B=4;sel();draw();tbl();code();setStatus(&#x27;ok&#x27;,&#x27;best_batch = 4 → 590 장/초 (지연 6.78 ms, 예산 33 ms 안)&#x27;);}},
 {n:&#x27;④ 카메라 몇 대? (6-3)&#x27;,ex:&#x27;&lt;p&gt;카메라 한 대 = 30 FPS. 배치 1: 520 // 30 = &lt;b class=&quot;green&quot;&gt;17대&lt;/b&gt;, 배치 4: 590 // 30 = &lt;b class=&quot;green&quot;&gt;19대&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;여러 카메라의 프레임을 모으면 처리량은 늘지만, &lt;b&gt;모으는 시간 + 배치 지연&lt;/b&gt;만큼 답이 늦어집니다. 8교시 미니 프로젝트 (카메라 4대) 의 질문입니다. 카메라 슬라이더를 20대로 올려 보세요.&lt;/p&gt;&#x27;,
  run:async()=&gt;{done={1:1,4:1,16:1,64:1};draw();tbl();setC(4,30);setStatus(&#x27;ok&#x27;,&#x27;카메라 4대 × 30 FPS = 120 장/초 → 네 배치 모두 감당&#x27;);await sleep(1600);setC(18,30);setStatus(&#x27;warn&#x27;,&#x27;카메라 18대 = 540 장/초 → 배치 4 (590) 만 감당&#x27;);await sleep(1600);setC(20,30);setStatus(&#x27;warn&#x27;,&#x27;카메라 20대 = 600 장/초 → 어떤 배치도 부족 → GPU · 입력 줄이기 · 프레임 건너뛰기 · TensorRT&#x27;);}},
];
initPredict(&#x27;배치를 1 → 64 로 키우면, &lt;b&gt;처리량 (장/초)&lt;/b&gt; 은 배치 1 의 520 장/초와 비교해 어떻게 될까?&#x27;,[&#x27;약 64배 (3만 장/초 이상)&#x27;,&#x27;몇 배 늘어난다&#x27;,&#x27;비슷하거나 오히려 낮다&#x27;]);
initPresets(P,stop);
sel();frames(0);draw();tbl();cam();
window.addEventListener(&#x27;resize&#x27;,draw);
ready();

.pf{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
@media(max-width:620px){.pf{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pf .fb{text-align:center;padding:7px 4px}
.pf .fb b{display:block;font-size:13px}
.ev{font-family:var(--mono);font-size:12px;background:#0a0f1c;border:1px solid var(--line);border-radius:8px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:8px;min-height:60px}
.ev .k{color:var(--dim)}.ev .v{color:var(--amber)}.ev .s{color:var(--teal)}
.cnt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.cnt .fb{text-align:center}.cnt .fb b{display:block;font-size:17px;color:var(--amber)}

&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div class=&quot;app&quot;&gt;

&lt;h1&gt;profiling — 어디가 느린가&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;지금까지는 &lt;b&gt;전체&lt;/b&gt; 시간을 쟀습니다. 더 빠르게 하려면 &lt;b style=&quot;color:var(--amber)&quot;&gt;어느 연산이 시간을 먹는지&lt;/b&gt; 알아야 합니다. profiling 을 켜면 ORT 가 노드마다 걸린 시간을 JSON 파일로 남깁니다. 다섯 단계를 따라가며 두 모델의 &lt;b&gt;병목&lt;/b&gt;을 찾아봅니다.&lt;/p&gt;
&lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill amber&quot;&gt;so.enable_profiling = True&lt;/span&gt;&lt;span class=&quot;pill blue&quot;&gt;sess.end_profiling()&lt;/span&gt;&lt;span class=&quot;pill teal&quot;&gt;cat == &quot;Node&quot;&lt;/span&gt;&lt;span class=&quot;pill purple&quot;&gt;_kernel_time&lt;/span&gt;&lt;span class=&quot;pill red&quot;&gt;dur = µs&lt;/span&gt;&lt;span class=&quot;pill green&quot;&gt;op_name 별 합&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;panel pred&quot;&gt;&lt;h2&gt;먼저 예측 (실행 전에)&lt;/h2&gt;&lt;div id=&quot;pred&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;
  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;7-1 · 7-2 — profiling 다섯 단계&lt;/h2&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;lab&quot;&gt;모델&lt;/span&gt;&lt;div class=&quot;seg&quot; id=&quot;mSel&quot;&gt;&lt;button type=&quot;button&quot; data-v=&quot;mn&quot;&gt;mnv3s.onnx&lt;/button&gt;&lt;button type=&quot;button&quot; data-v=&quot;cnn&quot;&gt;mnist_cnn_dyn.onnx&lt;/button&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;run&quot; id=&quot;bRun&quot;&gt;profiling ▶&lt;/button&gt;&lt;/div&gt;
    &lt;div class=&quot;pf&quot; id=&quot;pf&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;cnt&quot; id=&quot;cnt&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;ev&quot; id=&quot;ev&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;row&quot; style=&quot;margin-top:8px&quot;&gt;&lt;label class=&quot;chk&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;cNode&quot; checked&gt; cat == &quot;Node&quot; 만 고르기&lt;/label&gt;&lt;label class=&quot;chk&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;cMs&quot;&gt; dur 을 ms 로 착각하기&lt;/label&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;Python (노트북 7-1 · 7-2 · 7-3)&lt;/h2&gt;&lt;div class=&quot;code&quot; id=&quot;code&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;상태&lt;/h2&gt;&lt;div class=&quot;status info&quot; id=&quot;status&quot;&gt;프리셋을 누르세요.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2 id=&quot;barH&quot;&gt;연산 종류별 시간 비율 (share_%)&lt;/h2&gt;
  &lt;div class=&quot;bars&quot; id=&quot;bars&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;노트북 검증 실행의 profiling JSON 에서 구한 값 (mnv3s 7-1 · SimpleConvNet 7-3, 각 20번 실행, ORT 기본 설정 = ALL). 실행마다 몇 % 씩 다릅니다 (다른 실행 예: mnv3s Conv 53.3% · SimpleConvNet FusedGemm 51.0%). Reorder 노드는 4교시 ALL 레이아웃이 넣은 노드입니다.&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;panel explain&quot; id=&quot;explain&quot;&gt;&lt;/div&gt;

&lt;/div&gt;
&lt;script&gt;
const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];
const RM=window.matchMedia&amp;&amp;window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,RM?Math.min(ms,80):ms));
let busy=false, timer=null;
function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}
function setCode(h){$(&#x27;#code&#x27;).innerHTML=h;}
function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const g=c.getContext(&#x27;2d&#x27;);g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}
function initPresets(P,stop){$(&#x27;#presets&#x27;).innerHTML=P.map(p=&gt;`&lt;button type=&quot;button&quot;&gt;${p.n}&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}
const esc=s=&gt;String(s).replace(/&amp;/g,&#x27;&amp;amp;&#x27;).replace(/&lt;/g,&#x27;&amp;lt;&#x27;).replace(/&gt;/g,&#x27;&amp;gt;&#x27;);
const fmt=n=&gt;n.toLocaleString(&#x27;en-US&#x27;);
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
window.__d3={};
let guess=null, predOpts=[];
function initPredict(q,opts){predOpts=opts;guess=null;
  $(&#x27;#pred&#x27;).innerHTML=`&lt;div class=&quot;steps3&quot;&gt;&lt;span class=&quot;on&quot; id=&quot;st1&quot;&gt;① 예측&lt;/span&gt;&lt;span id=&quot;st2&quot;&gt;② 실행&lt;/span&gt;&lt;span id=&quot;st3&quot;&gt;③ 설명&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;pq&quot;&gt;${q}&lt;/div&gt;&lt;div class=&quot;seg&quot; id=&quot;predOpts&quot;&gt;${opts.map((o,i)=&gt;`&lt;button type=&quot;button&quot; data-i=&quot;${i}&quot;&gt;${o}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;pv&quot; id=&quot;predV&quot;&gt;먼저 하나를 고른 뒤 실행 ▶ 하세요. (안 골라도 실행은 됩니다)&lt;/div&gt;`;
  $$(&#x27;#predOpts button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{guess=+b.dataset.i;$$(&#x27;#predOpts button&#x27;).forEach(x=&gt;{x.classList.toggle(&#x27;sel&#x27;,x===b);x.classList.remove(&#x27;ok&#x27;,&#x27;bad&#x27;);});
    const v=$(&#x27;#predV&#x27;);v.className=&#x27;pv&#x27;;v.textContent=&#x27;예측: &#x27;+opts[guess]+&#x27; → 이제 실행해서 확인&#x27;;phase(1);});}
function phase(k){[&#x27;#st1&#x27;,&#x27;#st2&#x27;,&#x27;#st3&#x27;].forEach((s,i)=&gt;{const e=$(s);if(e)e.classList.toggle(&#x27;on&#x27;,i===k);});}
function judge(ans,why){$$(&#x27;#predOpts button&#x27;).forEach((b,i)=&gt;{b.classList.toggle(&#x27;ok&#x27;,i===ans);b.classList.toggle(&#x27;bad&#x27;,i===guess&amp;&amp;i!==ans);});
  const v=$(&#x27;#predV&#x27;);v.className=&#x27;pv &#x27;+(guess===null?&#x27;&#x27;:guess===ans?&#x27;ok&#x27;:&#x27;bad&#x27;);
  v.innerHTML=(guess===null?&#x27;정답: &#x27;:guess===ans?&#x27;✅ 예측 적중 — &#x27;:&#x27;❌ 예측과 다름 — &#x27;)+&#x27;&lt;b&gt;&#x27;+predOpts[ans]+&#x27;&lt;/b&gt;. &#x27;+why;phase(2);window.__d3.judged=(window.__d3.judged||0)+1;}
function ready(){$(&#x27;#explain&#x27;).innerHTML=&#x27;&lt;p&gt;&lt;b class=&quot;amber&quot;&gt;① 예측&lt;/b&gt;을 먼저 고르고 → &lt;b class=&quot;teal&quot;&gt;② 프리셋 또는 ▶ 버튼&lt;/b&gt;으로 실행하면 → &lt;b class=&quot;green&quot;&gt;③ 여기에 설명&lt;/b&gt;이 나옵니다.&lt;/p&gt;&#x27;;setStatus(&#x27;info&#x27;,&#x27;먼저 위에서 예측을 하나 고른 뒤, 프리셋이나 ▶ 버튼을 누르세요.&#x27;);}
function pct(a,q){const s=[...a].sort((x,y)=&gt;x-y);const h=(s.length-1)*q/100,lo=Math.floor(h),hi=Math.ceil(h);return s[lo]+(s[hi]-s[lo])*(h-lo);}
function rng(seed){let t=seed&gt;&gt;&gt;0;return()=&gt;{t+=0x6D2B79F5;let r=Math.imul(t^t&gt;&gt;&gt;15,1|t);r^=r+Math.imul(r^r&gt;&gt;&gt;7,61|r);return((r^r&gt;&gt;&gt;14)&gt;&gt;&gt;0)/4294967296;};}


const M={mn:{file:&#x27;mnv3s.onnx&#x27;,ev:2882,node:2840,per:142,
  sh:[[&#x27;Conv&#x27;,56.9],[&#x27;Mul&#x27;,14.0],[&#x27;Gemm&#x27;,10.1],[&#x27;HardSigmoid&#x27;,8.0],[&#x27;ReorderOutput&#x27;,5.2],[&#x27;ReorderInput&#x27;,3.2],[&#x27;기타&#x27;,2.6]],
  ex:{name:&#x27;/features/features.0/features.0.0/Conv_output_0_nchwc_kernel_time&#x27;,dur:173,op:&#x27;Conv&#x27;,shape:&#x27;[1, 16, 112, 112]&#x27;}},
 cnn:{file:&#x27;mnist_cnn_dyn.onnx&#x27;,ev:162,node:120,per:6,
  sh:[[&#x27;FusedGemm&#x27;,61.2],[&#x27;Conv&#x27;,16.9],[&#x27;MaxPool&#x27;,7.5],[&#x27;ReorderOutput&#x27;,7.3],[&#x27;Gemm&#x27;,4.8],[&#x27;Flatten&#x27;,2.3]],
  ex:{name:&#x27;/Relu_output_0_nchwc_kernel_time&#x27;,dur:44,op:&#x27;Conv&#x27;,shape:&#x27;[1, 32, 24, 24]&#x27;}}};
let mk=&#x27;mn&#x27;, step=-1, filt=true, msBug=false;
const ST=[[&#x27;① 켜기&#x27;,&#x27;enable_profiling=True&#x27;],[&#x27;② 실행&#x27;,&#x27;run × 20&#x27;],[&#x27;③ 닫기&#x27;,&#x27;end_profiling()&#x27;],[&#x27;④ 고르기&#x27;,&#x27;cat==&quot;Node&quot;&#x27;],[&#x27;⑤ 합치기&#x27;,&#x27;op_name 별 dur&#x27;]];
function drawPf(){$(&#x27;#pf&#x27;).innerHTML=ST.map((s,i)=&gt;`&lt;div class=&quot;fb ${i===step?&#x27;hot&#x27;:i&lt;step?&#x27;done&#x27;:&#x27;&#x27;}&quot;&gt;&lt;b&gt;${s[0]}&lt;/b&gt;&lt;small&gt;${s[1]}&lt;/small&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#mSel button&#x27;).forEach(b=&gt;b.classList.toggle(&#x27;sel&#x27;,b.dataset.v===mk));
  const m=M[mk];
  $(&#x27;#cnt&#x27;).innerHTML=`&lt;div class=&quot;fb&quot;&gt;&lt;small&gt;전체 기록&lt;/small&gt;&lt;b&gt;${step&gt;=3?fmt(m.ev):&#x27;—&#x27;}&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;small&gt;노드 기록&lt;/small&gt;&lt;b&gt;${step&gt;=3?(filt?fmt(m.node):fmt(m.ev)):&#x27;—&#x27;}&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;fb&quot;&gt;&lt;small&gt;노드 수 × 20&lt;/small&gt;&lt;b&gt;${step&gt;=3&amp;&amp;filt?m.per+&#x27; × 20&#x27;:&#x27;—&#x27;}&lt;/b&gt;&lt;/div&gt;`;
  const e=m.ex;
  $(&#x27;#ev&#x27;).innerHTML=step&lt;3?&#x27;&lt;span class=&quot;k&quot;&gt;# ③ end_profiling() 이 돌려준 JSON 파일을 열면 여기에 기록 하나가 보입니다&lt;/span&gt;&#x27;:
`{&lt;span class=&quot;k&quot;&gt;&quot;cat&quot;&lt;/span&gt;: &lt;span class=&quot;s&quot;&gt;&quot;Node&quot;&lt;/span&gt;, &lt;span class=&quot;k&quot;&gt;&quot;name&quot;&lt;/span&gt;: &quot;${e.name.replace(&#x27;_kernel_time&#x27;,&#x27;&lt;span class=&quot;s&quot;&gt;_kernel_time&lt;/span&gt;&#x27;)}&quot;,
 &lt;span class=&quot;k&quot;&gt;&quot;dur&quot;&lt;/span&gt;: &lt;span class=&quot;v&quot;&gt;${e.dur}&lt;/span&gt;,  &lt;span class=&quot;k&quot;&gt;# µs&lt;/span&gt;
 &lt;span class=&quot;k&quot;&gt;&quot;args&quot;&lt;/span&gt;: {&lt;span class=&quot;k&quot;&gt;&quot;op_name&quot;&lt;/span&gt;: &lt;span class=&quot;v&quot;&gt;&quot;${e.op}&quot;&lt;/span&gt;, &lt;span class=&quot;k&quot;&gt;&quot;provider&quot;&lt;/span&gt;: &quot;CPUExecutionProvider&quot;,
          &lt;span class=&quot;k&quot;&gt;&quot;output_type_shape&quot;&lt;/span&gt;: [{&quot;float&quot;: ${e.shape}}], ...}}`;}
function drawBars(k){const m=M[mk];$(&#x27;#barH&#x27;).textContent=`${m.file} — 연산 종류별 시간 비율 (share_%)`;
  if(!filt&amp;&amp;k){$(&#x27;#bars&#x27;).innerHTML=&#x27;&lt;span class=&quot;bad1&quot;&gt;고르지 않음&lt;/span&gt;&lt;div class=&quot;t&quot;&gt;&lt;i style=&quot;width:100%;background:var(--red)&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;span class=&quot;bad1&quot;&gt;?&lt;/span&gt;&#x27;;return;}
  $(&#x27;#bars&#x27;).innerHTML=m.sh.map(([o,v],i)=&gt;`&lt;span&gt;${o}&lt;/span&gt;&lt;div class=&quot;t&quot;&gt;&lt;i style=&quot;width:${k?v:0}%;background:${i===0?&#x27;var(--amber)&#x27;:o.startsWith(&#x27;Reorder&#x27;)?&#x27;var(--teal)&#x27;:&#x27;var(--blue)&#x27;}&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;span&gt;${k?v.toFixed(1)+&#x27;%&#x27;:&#x27;—&#x27;}&lt;/span&gt;`).join(&#x27;&#x27;);}
function code(){const m=M[mk];
  setCode(`&lt;span class=&quot;c&quot;&gt;# 7-1  profiling 을 켠 세션으로 20번&lt;/span&gt;
ps = make_session(&quot;${m.file}&quot;, profile=&lt;span class=&quot;hl&quot;&gt;True&lt;/span&gt;)   &lt;span class=&quot;c&quot;&gt;# so.enable_profiling = True&lt;/span&gt;
for _ in range(20):
    ps.run(None, {&quot;input&quot;: ${mk===&#x27;mn&#x27;?&#x27;x1&#x27;:&#x27;xm&#x27;}})
prof_path = ps.&lt;span class=&quot;hl&quot;&gt;end_profiling&lt;/span&gt;()        &lt;span class=&quot;c&quot;&gt;# 파일을 닫고 경로를 돌려줌&lt;/span&gt;
events = json.load(open(prof_path))
node_ev = [e for e in events if e.get(&quot;cat&quot;) == &lt;span class=&quot;a&quot;&gt;&quot;Node&quot;&lt;/span&gt;
           and e[&quot;name&quot;].endswith(&lt;span class=&quot;a&quot;&gt;&quot;_kernel_time&quot;&lt;/span&gt;)]
${step&gt;=3?`&lt;span class=&quot;b&quot;&gt;# 전체 기록 ${m.ev} | 노드 기록 ${m.node}&lt;/span&gt;`:&#x27;&#x27;}

&lt;span class=&quot;c&quot;&gt;# 7-2  op_name 별 dur (µs) 합 → 비율&lt;/span&gt;
agg = collections.Counter()
for e in node_ev:
    agg[e[&quot;args&quot;][&quot;&lt;span class=&quot;hl&quot;&gt;op_name&lt;/span&gt;&quot;]] += e[&quot;dur&quot;]
total = sum(agg.values())
df_prof = pd.DataFrame([{&quot;op&quot;: k, &quot;ms_per_run&quot;: v / 20 / ${msBug?&#x27;&lt;span class=&quot;e&quot;&gt;1&lt;/span&gt;&#x27;:&#x27;1000&#x27;},
                         &quot;share_%&quot;: v / total * 100} for k, v in agg.most_common()])
${step&gt;=4?`&lt;span class=&quot;b&quot;&gt;# 1위: ${m.sh[0][0]} ${m.sh[0][1].toFixed(1)}%&lt;/span&gt;`:&#x27;&#x27;}`);}
async function prof(){phase(1);step=-1;drawPf();drawBars(0);code();const m=M[mk];
  for(let i=0;i&lt;5;i++){step=i;drawPf();code();
    setStatus(&#x27;info&#x27;,[`① profile=True 로 세션 생성 — 이 세션은 기록하느라 느려짐 (재는 세션과 따로!)`,`② ${m.file} 를 20번 run — 노드마다 시작 시각 · 걸린 시간 기록`,`③ end_profiling() → onnxruntime_profile__….json 경로. 안 부르면 파일이 닫히지 않아 내용이 없음`,filt?`④ 전체 ${m.ev}개 중 cat == &quot;Node&quot; · _kernel_time 인 ${m.node}개 = 노드 ${m.per}개 × 20번`:`④ 고르지 않으면 Session 등 다른 기록 (모델 로드 · 세션 시작) 까지 섞임`,`⑤ op_name 별로 dur 을 더해 비율로`][i]);await sleep(850);}
  step=5;drawPf();
  if(!filt){drawBars(1);setStatus(&#x27;warn&#x27;,&#x27;노드 기록만 고르지 않으면 모델 로드 · 세션 시작 같은 기록이 섞여 op_name 이 없는 항목에서 KeyError / 엉뚱한 비율\n→ cat == &quot;Node&quot; 와 _kernel_time 둘 다 확인&#x27;);return;}
  for(let k=0;k&lt;=10;k++){$$(&#x27;#bars .t i&#x27;).forEach((el,i)=&gt;el.style.width=(m.sh[i][1]*k/10)+&#x27;%&#x27;);await sleep(30);}drawBars(1);code();
  setStatus(msBug?&#x27;warn&#x27;:&#x27;ok&#x27;,msBug?&#x27;dur 을 ms 로 착각 (÷1000 을 빼먹음) → ms_per_run 이 1000배 커짐 (비율 share_% 는 그대로라 놓치기 쉬움)\ndur 단위는 µs (1000 µs = 1 ms)&#x27;:`${m.file}: 1위 ${m.sh[0][0]} ${m.sh[0][1].toFixed(1)}% · 2위 ${m.sh[1][0]} ${m.sh[1][1].toFixed(1)}% · 3위 ${m.sh[2][0]} ${m.sh[2][1].toFixed(1)}%`);
  window.__d3.top=m.sh[0][0];
  if(mk===&#x27;cnn&#x27;&amp;&amp;!msBug)judge(1,&#x27;SimpleConvNet 의 1위는 FusedGemm (fc1 + Relu) 61.2% — 가중치 432,100 개가 여기 있습니다 (4교시 describe_onnx 의 params 열). 구조로 짐작한 병목을 재서 확인했습니다.&#x27;);}
$(&#x27;#bRun&#x27;).onclick=()=&gt;{if(!busy){busy=true;prof().finally(()=&gt;busy=false);}};
$$(&#x27;#mSel button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(busy)return;mk=b.dataset.v;step=-1;drawPf();drawBars(0);code();});

function stop(){}
const P=[
 {n:&#x27;① 다섯 단계 (7-1)&#x27;,ex:&#x27;&lt;p&gt;&lt;code&gt;make_session(..., profile=True)&lt;/code&gt; → 20번 run → &lt;code&gt;end_profiling()&lt;/code&gt; → JSON. 기록은 크롬의 &lt;code&gt;chrome://tracing&lt;/code&gt; (또는 ui.perfetto.dev) 에 끌어다 놓으면 시간 막대로도 볼 수 있습니다.&lt;/p&gt;&lt;p&gt;mnv3s: 전체 2,882 기록 중 노드 기록 2,840 = 노드 142개 × 20번. 142개는 ORT 가 최적화한 뒤 (ALL) 의 노드 — 4교시의 Reorder 노드가 보입니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{mk=&#x27;mn&#x27;;setChk(true,false);await prof();}},
 {n:&#x27;② mnv3s — Conv 가 절반 (7-2)&#x27;,ex:&#x27;&lt;p&gt;MobileNetV3 는 &lt;b class=&quot;amber&quot;&gt;Conv 56.9%&lt;/b&gt; · Mul 14.0% · Gemm 10.1% · HardSigmoid 8.0% · ReorderOutput 5.2% · ReorderInput 3.2%.&lt;/p&gt;&lt;p&gt;빠르게 하려면 &lt;b&gt;Conv 를 빠르게&lt;/b&gt; 해야 합니다 → Day 4 TensorRT (GPU 전용 Conv 커널 · FP16), 11/16 Quantization (INT8 Conv).&lt;/p&gt;&#x27;,
  run:async()=&gt;{mk=&#x27;mn&#x27;;setChk(true,false);await prof();}},
 {n:&#x27;③ SimpleConvNet — 다른 병목 (7-3)&#x27;,ex:&#x27;&lt;p&gt;SimpleConvNet 은 &lt;b class=&quot;amber&quot;&gt;FusedGemm 61.2%&lt;/b&gt; · Conv 16.9% · MaxPool 7.5%. 1위가 다릅니다 — fc1 (4320 → 100) 의 가중치 432,000 개가 여기에 있습니다.&lt;/p&gt;&lt;p&gt;&quot;구조를 보면 병목을 짐작할 수 있고 (describe_onnx 의 params), 재 보면 확인할 수 있다&quot; — 모델마다 병목이 다릅니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{mk=&#x27;cnn&#x27;;setChk(true,false);await prof();}},
 {n:&#x27;④ 자주 하는 실수&#x27;,ex:&#x27;&lt;p&gt;⚠️ &lt;code&gt;cat == &quot;Node&quot;&lt;/code&gt; 로 고르지 않음 → 모델 로드 · 세션 시작 기록이 섞임. ⚠️ &lt;code&gt;dur&lt;/code&gt; 을 ms 로 착각 → 실제는 &lt;b class=&quot;red&quot;&gt;µs&lt;/b&gt; (1000 µs = 1 ms). ⚠️ profiling 켠 세션으로 속도를 잼 → 기록하느라 느려짐. &lt;b&gt;재는 세션과 기록하는 세션은 따로.&lt;/b&gt;&lt;/p&gt;&#x27;,
  run:async()=&gt;{mk=&#x27;mn&#x27;;setChk(false,false);await prof();await sleep(1500);setChk(true,true);await prof();await sleep(800);setChk(true,false);drawBars(1);code();}},
];
initPredict(&#x27;SimpleConvNet (Conv · MaxPool · fc1 4320→100 · fc2) 을 profiling 하면 &lt;b&gt;가장 오래 걸리는 연산&lt;/b&gt;은?&#x27;,[&#x27;Conv&#x27;,&#x27;FusedGemm (fc1 + Relu)&#x27;,&#x27;MaxPool&#x27;]);

&lt;body&gt;
&lt;div class=&quot;app&quot;&gt;

&lt;h1&gt;미니 프로젝트 — 현장 카메라 4대용 설정 정하기&lt;/h1&gt;

&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;과제 흐름&lt;/h2&gt;&lt;div class=&quot;flow8&quot; id=&quot;flow&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;
  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;과제 2 — 실험표 grid (배치 1 · p95 ms)&lt;/h2&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;lab&quot;&gt;실행&lt;/span&gt;&lt;div class=&quot;seg&quot; id=&quot;runSel&quot;&gt;&lt;button type=&quot;button&quot; data-v=&quot;0&quot;&gt;실행 예 A&lt;/button&gt;&lt;button type=&quot;button&quot; data-v=&quot;1&quot;&gt;실행 예 B (다시 실행)&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;

    &lt;h2 style=&quot;margin-top:14px&quot;&gt;과제 3 — 최선 설정에서 배치 1 · 4 · 8&lt;/h2&gt;
    &lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;sC&quot;&gt;카메라&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sC&quot; min=&quot;1&quot; max=&quot;40&quot; value=&quot;4&quot;&gt;&lt;output id=&quot;oC&quot;&gt;4대&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;need&quot; id=&quot;need&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;row ctl&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;run&quot; id=&quot;bBatch&quot;&gt;batch_tbl 재기 ▶&lt;/button&gt;&lt;/div&gt;

    &lt;div class=&quot;rec&quot; id=&quot;rec&quot; style=&quot;display:none&quot;&gt;&lt;/div&gt;

  for(let i=0;i&lt;5;i++){await sleep(350);if(ok[i]){s+=pt[i];h+=`&lt;span class=&quot;g&quot;&gt;✅ ${nm[i]}&lt;/span&gt;\n`;}else h+=`&lt;span class=&quot;e&quot;&gt;❌ ${nm[i].split(&#x27;  &#x27;)[0]} — 아직 안 함&lt;/span&gt;\n`;$(&#x27;#score&#x27;).innerHTML=h;}
  h+=`\n자동 채점 &lt;b&gt;${s} / 90&lt;/b&gt;  (+ 과제 6 강사 채점 10점)`;$(&#x27;#score&#x27;).innerHTML=h;sdone=1;stage=6;flow();
  setStatus(s===90?&#x27;ok&#x27;:&#x27;warn&#x27;,s===90?&#x27;자동 채점 90 / 90 (검증 실행 B 도 90 / 90)\not_baseline.csv — 내일 Day 4 TensorRT 결과를 같은 열로 이어 붙임&#x27;:`자동 채점 ${s} / 90 — 빠진 과제를 먼저 실행하세요`);window.__d3.score=s;}

  setStatus(&#x27;info&#x27;,ri?&#x27;실행 예 B: grid p95 6.05 · 1.98 · 4.03 · 1.80 → 최선 2 스레드 · ALL (A 와 다름!)\n배치 1 · 4 · 8 → 643 · 933 · 1059 장/초&#x27;:&#x27;실행 예 A: grid p95 6.62 · 2.23 · 5.09 · 2.41 → 최선 1 스레드 · ALL\n배치 1 · 4 · 8 → 473 · 606 · 497 장/초&#x27;);});

  run:async()=&gt;{ri=0;await grid();}},
 {n:&#x27;② 배치 · 카메라 4대 (과제 3)&#x27;,ex:&#x27;&lt;p&gt;best 설정 그대로 배치 1 · 4 · 8 → 473 · 606 · 497 장/초. 카메라 4대 = &lt;b class=&quot;amber&quot;&gt;120 장/초&lt;/b&gt; → 세 배치 모두 감당. 그중 지연 (mean) 이 가장 짧은 &lt;b class=&quot;green&quot;&gt;배치 1&lt;/b&gt; 을 고릅니다 — 프레임마다 바로 처리.&lt;/p&gt;&lt;p&gt;여기서 fps 는 bench 가 배치를 곱한 &quot;초당 장 수&quot; 입니다.&lt;/p&gt;&#x27;,

<script>
const ids = [...document.querySelectorAll('nav button')].map(b => b.dataset.id);
function fit(fr) {
  try {
    const d = fr.contentDocument; if (!d || !d.body) return;
    fr.style.height = Math.max(600, d.documentElement.scrollHeight) + 'px';
  } catch (e) {}
}
function show(id, push) {
  if (!ids.includes(id)) id = ids[0];
  document.querySelectorAll('section.lesson').forEach(s => s.classList.toggle('active', s.id === id));
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-current', b.dataset.id === id ? 'true' : 'false'));
  const sec = document.getElementById(id);
  document.title = sec.dataset.title + ' — ONNX·TensorRT Day 3';
  const fr = sec.querySelector('iframe');
  fr.loading = 'eager'; fit(fr);
  if (push) history.replaceState(null, '', '#' + id);
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('section.lesson iframe').forEach(fr => {
  fr.addEventListener('load', () => {
    fit(fr);
    try {
      new ResizeObserver(() => fit(fr)).observe(fr.contentDocument.body);
      fr.contentDocument.addEventListener('keydown', key);   // iframe 안에서도 ← → 동작
    } catch (e) {}
  });
});
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.id, true));
function key(e) {
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const cur = ids.indexOf(location.hash.slice(1) || ids[0]);
  if (e.key === 'ArrowRight' && cur < ids.length - 1) show(ids[cur + 1], true);
  if (e.key === 'ArrowLeft' && cur > 0) show(ids[cur - 1], true);
}
document.addEventListener('keydown', key);
window.addEventListener('resize', () => document.querySelectorAll('section.lesson.active iframe').forEach(fit));
window.addEventListener('hashchange', () => show(location.hash.slice(1), false));   // 주소창에서 #d3-N 을 바꿔도 이동
show(location.hash.slice(1), false);
</script>
