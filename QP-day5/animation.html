layout({h1:&#x27;가지치기 단위와 기준 — 무엇을, 어떤 순서로 지울까&#x27;,sub:&#x27;1교시 노트북 순서: 단위 4가지 → weight 분포 (예제 1-A) → magnitude mask (1-1) → filter L1-norm · 단위별 크기 (1-2).&#x27;,

 if(S===0){txt(g,&#x27;개념도 — 지우는 단위&#x27;,2*u,20,K.d);

 if(S===1){txt(g,&#x27;ResNet-20 conv weight 270,256개 — |w| 가 임계값보다 작은 비율&#x27;,2*u,20,K.d);

 if(S===2){const w=[0.1,-0.5,0.3,0.05,-0.2,0.4],m=[0,1,1,0,0,1];txt(g,&#x27;magnitude_mask(w, 0.5) — 절댓값이 작은 절반을 지운다&#x27;,2*u,20,K.d);
  w.forEach((v,i)=&gt;{const x=6*u+i*15*u;box(g,x,40,12*u,40,String(v),K.b,&#x27;|w| &#x27;+Math.abs(v));if(T&gt;.4){arr(g,x+6*u,82,x+6*u,104);box(g,x,106,12*u,36,R?String(m[i]):&#x27;?&#x27;,R?(m[i]?K.g:K.r):K.l,&#x27;&#x27;,R);}
   if(R&amp;&amp;T&gt;.8){box(g,x,166,12*u,36,m[i]?String(v):&#x27;0&#x27;,m[i]?K.b:K.z);}});
  txt(g,&#x27;w&#x27;,1*u,64,K.d,&#x27;12px sans-serif&#x27;);txt(g,&#x27;mask&#x27;,0.5*u,128,K.d,&#x27;12px sans-serif&#x27;);txt(g,R?&#x27;w×m&#x27;:&#x27;&#x27;,0.5*u,188,K.d,&#x27;12px sans-serif&#x27;);

 if(S===3){txt(g,&#x27;layer2[0].conv1 (32 × 16 × 3 × 3) — 단위 하나를 지우면 사라지는 weight 수&#x27;,2*u,20,K.d);

  txt(g,&#x27;막대 길이는 로그 눈금&#x27;,30*u,188,K.d,&#x27;11px sans-serif&#x27;);txt(g,R?&#x27;layer1[0].conv1 의 filter L1-norm: 가장 작은 7.45 ~ 가장 큰 11.36&#x27;:&#x27;&#x27;,2*u,214,K.x,&#x27;12.5px sans-serif&#x27;);txt(g,R?&#x27;차이가 크면 &quot;작은 filter 부터&quot; 가 잘 맞고, 비슷하면 어느 것을 빼도 손해가 비슷하다&#x27;:&#x27;&#x27;,2*u,236,K.d,&#x27;12px sans-serif&#x27;);}

 {n:&#x27;① 개념 — 가지치기 단위&#x27;,vt:&#x27;weight 에서 layer 까지&#x27;,run:()=&gt;play(0,300,4),

  kv:[[&#x27;unstructured&#x27;,&#x27;손해 작음 · 일반 커널에서 속도 그대로&#x27;],[&#x27;structured&#x27;,&#x27;손해 큼 · 어디서나 빨라짐&#x27;],[&#x27;회복&#x27;,&#x27;fine-tuning (6교시)&#x27;]],st:[&#x27;info&#x27;,&#x27;기준 × 단위 × 방식 × 회복&#x27;],

  ex:&#x27;&lt;p&gt;오늘의 결론을 먼저 말하면 &lt;b&gt;실무에서 속도를 얻는 것은 structured pruning&lt;/b&gt; 입니다. 왜 그런지를 unstructured 부터 재 보며 확인합니다.&lt;/p&gt;&#x27;},
 {n:&#x27;② 예제 1-A — weight 분포&#x27;,vt:&#x27;작은 weight 가 얼마나 많은가&#x27;,run:()=&gt;play(1),
  q:[&#x27;ResNet-20 의 conv weight 중 |w| &lt; 0.05 인 것은 얼마나 될까요? (|w| &lt; 0.01 은 21%, &lt; 0.02 는 40%)&#x27;,[&#x27;약 45%&#x27;,&#x27;약 76%&#x27;,&#x27;약 99%&#x27;],1,&#x27;76% 입니다. 학습된 weight 는 0 근처에 몰린 종 모양이라 &quot;작은 것부터 지우기&quot; 가 자연스러운 기준이 됩니다. 다만 &quot;작다&quot; 가 &quot;중요하지 않다&quot; 를 보장하지는 않습니다.&#x27;],
  kv:[[&#x27;conv weight&#x27;,&#x27;270,256개&#x27;],[&#x27;|w| &lt; 0.01 · 0.02&#x27;,&#x27;21% · 40%&#x27;],[&#x27;|w| &lt; 0.05&#x27;,&#x27;76%&#x27;]],st:[&#x27;ok&#x27;,&#x27;0 근처에 몰려 있다&#x27;],
  code:`w_all = torch.cat([m.weight.detach().abs().flatten() for n, m in convs(rn20) if isinstance(m, nn.Conv2d)])\nsmall = {t: float((w_all &lt; t).float().mean()) for t in [0.01, 0.02, 0.05]}`,

 {n:&#x27;④ 정리 — 어떤 하드웨어에서&#x27;,vt:&#x27;T4 와 Ampere&#x27;,run:()=&gt;play(3,400,3),

async function play(s,ms,n){S=s;await tween(n||20,ms||80,t=&gt;{T=t;draw();});}
steps([
 {n:&#x27;① 개념 — 함께 줄여야 하는 곳&#x27;,vt:&#x27;conv1 → bn1 → conv2&#x27;,run:()=&gt;play(0,300,4),
  q:[&#x27;conv1 의 filter 를 절반으로 줄였습니다. 뒤따르는 BatchNorm 에서는 채널마다 몇 가지 값을 함께 골라내야 할까요?&#x27;,[&#x27;1가지 — γ 만 고르면 나머지는 자동으로 맞춰진다&#x27;,&#x27;2가지 — 학습되는 γ (weight) 와 β (bias)&#x27;,&#x27;4가지 — γ · β · 평균 · 분산&#x27;],2,&#x27;BN 은 채널마다 γ · β · 평균 · 분산을 가집니다. 하나라도 빠뜨리면 모양 오류가 나거나 엉뚱한 통계로 정규화됩니다. 그리고 다음 conv2 는 출력이 아니라 입력 축을 줄입니다.&#x27;],
  kv:[[&#x27;conv1&#x27;,&#x27;weight[keep] — 출력 축&#x27;],[&#x27;bn1&#x27;,&#x27;γ · β · μ · σ² 모두 [keep]&#x27;],[&#x27;conv2&#x27;,&#x27;weight[:, keep] — 입력 축&#x27;]],st:[&#x27;info&#x27;,&#x27;filter 하나를 빼면 세 곳이 바뀐다&#x27;],
  code:`new1.weight.data = c1.weight.data[keep].clone()\nfor a in [&quot;weight&quot;, &quot;bias&quot;, &quot;running_mean&quot;, &quot;running_var&quot;]:\n    getattr(nb, a).data = getattr(b1, a).data[keep].clone()\nnew2.weight.data = c2.weight.data[:, keep].clone()`,
  ex:&#x27;&lt;p&gt;ResNet 블록에서 &lt;b&gt;안쪽&lt;/b&gt; (conv1 출력 = conv2 입력) 은 자유롭게 자를 수 있습니다. &lt;b&gt;바깥쪽&lt;/b&gt; (conv2 출력) 은 residual 덧셈 때문에 다른 블록과 함께 잘라야 합니다 — 예제 4-A 에서 확인합니다.&lt;/p&gt;&#x27;},
 {n:&#x27;② 실습 4-1 — prune_block&#x27;,vt:&#x27;블록 하나의 안쪽 32 → 16&#x27;,run:()=&gt;play(1,400,3),
  q:[&#x27;conv1 의 filter 를 32 → 16 으로 줄였습니다. conv2 의 weight (32, 32, 3, 3) 는 어떻게 바뀌어야 할까요?&#x27;,[&#x27;(16, 32, 3, 3) — 출력 축을 줄인다&#x27;,&#x27;(32, 16, 3, 3) — 입력 축을 줄인다&#x27;,&#x27;(16, 16, 3, 3) — 두 축을 모두 줄인다&#x27;],1,&#x27;conv2 는 conv1 의 출력을 입력으로 받으므로 입력 축 (dim 1) 만 16 으로 줄입니다. 출력 32 는 블록 바깥으로 나가 shortcut 과 더해지므로 그대로 둡니다 — 그래서 블록의 입출력 모양이 변하지 않습니다.&#x27;],
  kv:[[&#x27;conv1&#x27;,&#x27;(32, 32, 3, 3) → (16, 32, 3, 3)&#x27;],[&#x27;conv2&#x27;,&#x27;(32, 32, 3, 3) → (32, 16, 3, 3)&#x27;],[&#x27;블록 출력&#x27;,&#x27;(2, 32, 16, 16) 그대로&#x27;]],st:[&#x27;ok&#x27;,&#x27;안쪽만 줄이면 블록 밖은 모른다&#x27;],
  code:`def prune_block(block, ratio):\n    c1, b1, c2 = block.conv1, block.bn1, block.conv2\n    n_keep = int(round(c1.out_channels * (1 - ratio)))\n    keep = &lt;span class=&quot;hl&quot;&gt;filter_l1(c1)&lt;/span&gt;.argsort(descending=True)[:n_keep].sort().values\n    ...   &lt;span class=&quot;c&quot;&gt;# 새 conv1 · bn1 · conv2 를 만들어 block 에 넣는다&lt;/span&gt;\n    return keep`,
  ex:&#x27;&lt;p&gt;&lt;b&gt;직접 구현&lt;/b&gt;: 1교시의 &lt;code&gt;filter_l1&lt;/code&gt; 로 남길 filter 를 고릅니다. 확인 셀은 ratio 0 일 때 출력이 원래와 같은지도 봅니다.&lt;/p&gt;&#x27;},
 {n:&#x27;③ 실습 4-2 — manual_prune&#x27;,vt:&#x27;9개 블록 모두&#x27;,run:()=&gt;play(2),
  q:[&#x27;9개 블록의 안쪽 채널을 50% 줄였습니다 (params 272,474 → 138,506). fine-tuning 전 정확도는? (25% 는 0.50)&#x27;,[&#x27;약 0.81 — unstructured 50% 와 비슷&#x27;,&#x27;약 0.17 — 거의 무너진다&#x27;,&#x27;0.846 — 안쪽만 줄였으므로 그대로&#x27;],1,&#x27;0.168 입니다. unstructured 50% (0.8125) 보다 훨씬 많이 떨어집니다 — filter 를 통째로 빼면 그 안의 큰 weight 도 함께 사라지기 때문입니다. 떨어진 정확도는 6교시 fine-tuning 으로 되찾습니다.&#x27;],
  kv:[[&#x27;ratio 0.25&#x27;,&#x27;205,490 params · 0.5025&#x27;],[&#x27;ratio 0.5&#x27;,&#x27;138,506 params · 0.1680&#x27;],[&#x27;unstructured 50%&#x27;,&#x27;0.8125 (비교)&#x27;]],st:[&#x27;warn&#x27;,&#x27;structured 는 fine-tuning 과 한 세트&#x27;],
  code:`def manual_prune(model, ratio):\n    m = copy.deepcopy(model)\n    for layer in [m.layer1, m.layer2, m.layer3]:\n        for block in layer:\n            prune_block(block, ratio)\n    return m`,
  ex:&#x27;&lt;p&gt;&lt;b&gt;직접 구현&lt;/b&gt;: &lt;code&gt;manual_df&lt;/code&gt; (ratio · params · acc · latency_ms) 를 만듭니다. params 가 진짜로 줄었다는 점이 unstructured 와 다릅니다.&lt;/p&gt;&#x27;},
 {n:&#x27;④ 예제 4-A — 속도비 · residual&#x27;,vt:&#x27;바깥쪽 채널을 자르면&#x27;,run:()=&gt;play(3),
  q:[&#x27;블록의 conv2 출력 (바깥쪽) 을 16 → 8채널로 바꾸고 forward 하면?&#x27;,[&#x27;residual 덧셈에서 오류가 난다&#x27;,&#x27;문제없이 돌고 블록 출력이 8채널이 된다&#x27;,&#x27;돌기는 하지만 정확도가 조금 떨어진다&#x27;],0,&#x27;conv2 출력 (8) 과 shortcut (16) 을 더할 수 없어 RuntimeError 가 납니다. 바깥쪽을 자르려면 shortcut · 앞뒤 블록 · stem 까지 같은 채널을 함께 잘라야 합니다 — 5교시의 DependencyGraph 가 하는 일입니다.&#x27;],

 {n:&#x27;① 예제 5-A — DependencyGraph&#x27;,vt:&#x27;함께 잘리는 묶음&#x27;,run:()=&gt;play(0,250,9),
  q:[&#x27;layer1[0].conv2 의 출력 채널 2개를 자르려 합니다. 함께 바뀌어야 하는 Conv 는 모두 몇 개일까요?&#x27;,[&#x27;1개 — 그 conv2 만&#x27;,&#x27;3개 — 그 블록의 conv1 · conv2 · 다음 블록의 conv1&#x27;,&#x27;9개 — stem 부터 layer2[0] 의 입력까지&#x27;],2,&#x27;layer1 의 세 블록은 모두 같은 통로 (stem 출력 16채널) 에 덧셈으로 연결됩니다. stem · 세 블록의 conv2 (출력) · conv1 (입력) · layer2[0] 의 conv1 과 shortcut (입력) 까지 9개가 함께 바뀝니다.&#x27;],
  kv:[[&#x27;group&#x27;,&#x27;항목 20개 · Conv2d 9개&#x27;],[&#x27;자른 뒤&#x27;,&#x27;stem 출력 16 → 14&#x27;],[&#x27;정확도&#x27;,&#x27;0.846 → 0.634 (채널 2개)&#x27;]],st:[&#x27;ok&#x27;,&#x27;residual 통로 전체가 한 묶음&#x27;],
  code:`DG = tp.DependencyGraph().build_dependency(m_dg, example_inputs=EX_IN)\ngroup = DG.&lt;span class=&quot;hl&quot;&gt;get_pruning_group&lt;/span&gt;(m_dg.layer1[0].conv2, tp.prune_conv_out_channels, idxs=[0, 1])\ngroup.prune()`,
  ex:&#x27;&lt;p&gt;&lt;b&gt;제공 코드 (실행만)&lt;/b&gt;: 예시 입력 하나를 흘려 연산 그래프를 따라가며 &quot;이 채널을 자르면 함께 잘라야 하는 모든 곳&quot; 을 찾습니다. 출력된 Conv 이름 9개를 4교시의 오류와 연결해 보세요.&lt;/p&gt;&#x27;},
 {n:&#x27;② 실습 5-1 — MetaPruner · MACs&#x27;,vt:&#x27;채널 50% 를 자동으로&#x27;,run:()=&gt;play(1),
  q:[&#x27;모든 층의 채널을 50% 줄이면 MACs (곱셈-누산 횟수) 는 원래의 몇 % 가 될까요?&#x27;,[&#x27;약 75%&#x27;,&#x27;약 50%&#x27;,&#x27;약 25%&#x27;],2,&#x27;Conv 의 MACs 는 C_in × C_out 에 비례합니다. 둘 다 절반이면 1/4 입니다. 실측 41.2M → 10.5M (26%), params 272,474 → 68,786 (25%).&#x27;],
  kv:[[&#x27;MACs&#x27;,&#x27;41.2M → 10.5M (26%)&#x27;],[&#x27;params&#x27;,&#x27;272,474 → 68,786 (25%)&#x27;],[&#x27;규칙&#x27;,&#x27;채널 r → MACs 약 (1 − r)²&#x27;]],st:[&#x27;ok&#x27;,&#x27;채널 절반 = 계산 1/4&#x27;],
  code:`def make_pruner(model, ratio, steps=1):\n    return tp.pruner.&lt;span class=&quot;hl&quot;&gt;MetaPruner&lt;/span&gt;(model, EX_IN, importance=tp.importance.MagnitudeImportance(p=1),\n                                pruning_ratio=ratio, iterative_steps=steps, ignored_layers=[model.fc])\n\ndef prune_channels(model, ratio):\n    m = copy.deepcopy(model).cpu().eval()\n    make_pruner(m, ratio).step()\n    return m`,
  ex:&#x27;&lt;p&gt;&lt;b&gt;직접 구현&lt;/b&gt;: &lt;code&gt;make_pruner&lt;/code&gt; 는 6교시 iterative (steps=3) 에서 다시 씁니다. &lt;code&gt;tp.utils.count_ops_and_params&lt;/code&gt; 로 MACs · params 를 셉니다.&lt;/p&gt;&#x27;},
 {n:&#x27;③ 개념 — ignored_layers&#x27;,vt:&#x27;자르면 안 되는 곳&#x27;,run:()=&gt;play(2),
  q:[&#x27;ignored_layers=[model.fc] 로 50% 를 자른 모델의 fc 는 어떤 모양일까요? (원래 Linear(64 → 10))&#x27;,[&#x27;Linear(64 → 10) — fc 는 전혀 바뀌지 않는다&#x27;,&#x27;Linear(32 → 10) — 입력만 줄어든다&#x27;,&#x27;Linear(32 → 5) — 입력 · 출력 모두 줄어든다&#x27;],1,&#x27;ignored_layers 는 그 층의 &quot;출력 채널&quot; 을 자르지 않게 합니다 — 클래스 10개는 지켜야 합니다. 입력 (64 → 32) 은 앞 층의 출력이 줄었으므로 의존성에 따라 함께 줄어듭니다.&#x27;],
  kv:[[&#x27;fc&#x27;,&#x27;Linear(64 → 10) → Linear(32 → 10)&#x27;],[&#x27;중요도&#x27;,&#x27;MagnitudeImportance(p=1) — L1&#x27;],[&#x27;ratio&#x27;,&#x27;채널 수 기준&#x27;]],st:[&#x27;info&#x27;,&#x27;출력 클래스 수는 지킨다&#x27;],
  code:`print(p50.fc)                &lt;span class=&quot;c&quot;&gt;# Linear(in_features=32, out_features=10, bias=True)&lt;/span&gt;\nprint(p50.layer3[0].conv1)   &lt;span class=&quot;c&quot;&gt;# Conv2d(16, 32, kernel_size=(3, 3), stride=(2, 2), ...)&lt;/span&gt;`,
  ex:&#x27;&lt;p&gt;검출 모델이라면 head 의 출력 (클래스 · 박스 수) 을 ignored_layers 에 넣습니다. 지켜야 하는 층을 빠뜨리면 출력 모양이 바뀌어 버립니다.&lt;/p&gt;&#x27;},
 {n:&#x27;④ 실습 5-2 — 비율별 표&#x27;,vt:&#x27;fine-tuning 전 정확도&#x27;,run:()=&gt;play(3),
  q:[&#x27;torch-pruning 으로 채널 20% 만 잘랐습니다. fine-tuning 전 정확도는? (FP32 0.846)&#x27;,[&#x27;약 0.80 — 조금 떨어진다&#x27;,&#x27;약 0.24 — 크게 무너진다&#x27;,&#x27;0.846 — 20% 는 영향이 없다&#x27;],1,&#x27;0.2415 입니다. 40% · 60% 는 0.10 (무작위) 입니다. 통로 (residual) 채널까지 자르기 때문에 4교시의 &quot;블록 안쪽만&quot; 보다 훨씬 많이 떨어집니다. structured pruning 은 fine-tuning 과 한 세트입니다 → 6교시.&#x27;],
  kv:[[&#x27;20%&#x27;,&#x27;MACs 24.9M · 0.2415&#x27;],[&#x27;40% · 60%&#x27;,&#x27;14.2M · 0.101 / 6.2M · 0.100&#x27;],[&#x27;지연&#x27;,&#x27;줄어든다 (값은 노트북에서 측정)&#x27;]],st:[&#x27;warn&#x27;,&#x27;MACs 는 줄었지만 정확도가 무너졌다&#x27;],
  code:`rows = []\nfor r in [0.0, 0.2, 0.4, 0.6]:\n    m = prune_channels(rn20, r) if r &gt; 0 else rn20\n    macs, params = tp.utils.count_ops_and_params(m, EX_IN)\n    rows.append({&quot;ratio&quot;: r, &quot;macs_m&quot;: macs / 1e6, &quot;params&quot;: int(params), &quot;acc&quot;: acc_torch(m), &quot;latency_ms&quot;: latency_torch(m)})\ntp_df = pd.DataFrame(rows)`,
  ex:&#x27;&lt;p&gt;&lt;b&gt;직접 구현&lt;/b&gt;: 작은 모델은 MACs 가 줄어도 층마다 드는 고정 비용 때문에 지연이 MACs 만큼 줄지는 않습니다 — &lt;code&gt;latency_ms&lt;/code&gt; 열에서 확인하세요.&lt;/p&gt;&#x27;},

<script>
const ids = [...document.querySelectorAll('nav button')].map(b => b.dataset.id);
function fit(fr) {
  try {
    const d = fr.contentDocument; if (!d || !d.body) return;
    fr.style.height = Math.max(600, d.documentElement.scrollHeight) + 'px';
  } catch (e) {}
}
function show(id, push) {
  if (!ids.includes(id)) id = ids[0];
  document.querySelectorAll('section.lesson').forEach(s => s.classList.toggle('active', s.id === id));
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-current', b.dataset.id === id ? 'true' : 'false'));
  const sec = document.getElementById(id);
  document.title = sec.dataset.title + ' — Quantization·Pruning Day 5';
  const fr = sec.querySelector('iframe');
  fr.loading = 'eager'; fit(fr);
  if (push) history.replaceState(null, '', '#' + id);
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('section.lesson iframe').forEach(fr => {
  fr.addEventListener('load', () => {
    fit(fr);
    try {
      new ResizeObserver(() => fit(fr)).observe(fr.contentDocument.body);
      fr.contentDocument.addEventListener('keydown', key);   // iframe 안에서도 ← → 동작
    } catch (e) {}
  });
});
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.id, true));
function key(e) {
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const cur = ids.indexOf(location.hash.slice(1) || ids[0]);
  if (e.key === 'ArrowRight' && cur < ids.length - 1) show(ids[cur + 1], true);
  if (e.key === 'ArrowLeft' && cur > 0) show(ids[cur - 1], true);
}
document.addEventListener('keydown', key);
window.addEventListener('resize', () => document.querySelectorAll('section.lesson.active iframe').forEach(fit));
window.addEventListener('hashchange', () => show(location.hash.slice(1), false));   // 주소창에서 #d1-N 을 바꿔도 이동
show(location.hash.slice(1), false);
</script>
