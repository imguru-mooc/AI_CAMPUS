<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linux &amp; Shell Day 2 개념 워크시트 — 스케줄링</title>
<style>
  :root{--bg:#0b1220;--panel:#111a2e;--line:#1f2b45;--text:#dbe4f0;--dim:#8a9bb8;--amber:#f5b942;--teal:#2dd4bf;--blue:#60a5fa;--green:#4ade80;--red:#f87171;--purple:#c084fc;--mono:"Consolas","D2Coding","JetBrains Mono",monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR","Segoe UI",sans-serif;font-size:15px;line-height:1.55}
  .app{max-width:900px;margin:0 auto;padding:22px 20px 40px}
  h1{color:var(--amber);font-size:24px;margin:0 0 6px}
  .sub{color:var(--dim);margin:0 0 14px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
  .panel h2{font-size:14px;color:var(--dim);margin:0 0 10px;font-weight:600}
  button{background:#172239;border:1px solid #2a3a5c;color:var(--text);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--amber)}button.active{background:#3a2e12;border-color:var(--amber);color:var(--amber)}
  button.primary{background:#123d33;border-color:var(--teal);color:var(--teal);font-weight:700;padding:9px 18px;font-size:14px}
  button.submit{background:#3a2e12;border-color:var(--amber);color:var(--amber);font-weight:700;padding:9px 18px;font-size:14px}
  button:disabled{opacity:.45;cursor:default}
  button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  input[type=text]{background:#0a0f1c;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-family:var(--mono);font-size:14px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px}
  .tabs button .s{font-family:var(--mono);font-size:11px;color:var(--dim);margin-left:6px}
  .tabs button.graded .s{color:var(--green)}
  .head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .head .t{color:var(--amber);font-size:17px}
  .head .a{font-size:13px;color:var(--teal);font-family:var(--mono)}
  .q{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#0e1628}
  .q.unans{border-color:#5a3a1a}
  .q .n{font-family:var(--mono);color:var(--dim);font-size:12px}
  .q .p{margin:4px 0 10px;font-size:15px}
  .q .p code,.opt code,.fb code,td code{font-family:var(--mono);color:var(--blue);background:#0a0f1c;padding:1px 5px;border-radius:4px}
  .q pre.qc{font-family:var(--mono);background:#0a0f1c;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:6px;padding:10px 12px;margin:4px 0 12px;font-size:13.5px;line-height:1.5;white-space:pre;overflow-x:auto;color:#dbe4f3}
  .q pre{font-family:var(--mono);background:#0a0f1c;border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:6px 0 10px;font-size:14px;white-space:pre;overflow-x:auto}
  .opts{display:grid;gap:6px}
  .opt{text-align:left;padding:8px 12px;font-size:14px;font-family:inherit}
  .opt.sel{border-color:var(--amber);background:#1f1a0c}
  .opt.ok{border-color:var(--green);color:var(--green);background:#0d2216}
  .opt.bad{border-color:var(--red);color:var(--red);background:#2a1212}
  .opt:disabled{cursor:default;opacity:.9}
  .fb{margin-top:8px;font-size:13px;color:var(--dim);border-left:3px solid var(--line);padding-left:10px}
  .fb.ok{border-left-color:var(--green)}.fb.bad{border-left-color:var(--red)}
  .fb .anim{color:var(--teal);font-family:var(--mono);font-size:12px;display:block;margin-top:3px}
  .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
  .code{font-family:var(--mono);font-size:20px;color:var(--amber);letter-spacing:1px}
  .score{font-family:var(--mono);color:var(--green);font-size:16px}
  .hint{color:var(--dim);font-size:13px}
  details{color:var(--dim);font-size:13px}
  details summary{cursor:pointer;color:var(--dim)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  /* dialog */
  dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:0;max-width:820px;width:92vw;max-height:88vh}
  dialog::backdrop{background:#000a}
  .dg{padding:18px 20px}
  .dg h3{color:var(--amber);margin:0 0 4px;font-size:20px}
  .dg .meta{color:var(--dim);font-size:13px;margin-bottom:12px;font-family:var(--mono)}
  .dg .sec{margin:14px 0 6px;color:var(--teal);font-weight:700;font-size:14px}
  .dg table{width:100%;border-collapse:collapse;font-size:13px}
  .dg th{text-align:left;color:var(--dim);font-weight:600;padding:5px 8px;border-bottom:1px solid var(--line);font-size:12px}
  .dg td{padding:5px 8px;border-bottom:1px solid #16203a;vertical-align:top}
  .dg td.r{font-family:var(--mono)}
  .dg .ok{color:var(--green)}.dg .bad{color:var(--red)}.dg .none{color:var(--dim)}
  .dg .sum{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0;font-family:var(--mono)}
  .dgbar{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 20px;display:flex;gap:8px;justify-content:flex-end;align-items:center}
  .toast{color:var(--green);font-size:13px;margin-right:auto}
  .body{overflow:auto;max-height:calc(88vh - 60px)}
</style>
</head>
<body>
<div class="app">
  <h1>Linux &amp; Shell Day 2 개념 워크시트</h1>
  <p class="sub">스케줄링 — CFS · affinity · RT · cgroup · jitter · 8교시 × 10문항. 🎬 표시는 animation.html 의 애니메이션 번호입니다. 답을 고른 뒤 아래 <b style="color:var(--teal)">채점하기</b>를 누르면 정오·해설과 결과 코드가 나타납니다. 채점 전에는 답을 바꿀 수 있고, 채점 후에는 잠깁니다. 모든 교시를 마치면 <b style="color:var(--amber)">제출</b>로 오답 정리를 열고, <b>캡처</b>로 복사해 노션에 붙여 넣으세요.</p>

  <div class="panel">
    <div class="row"><label style="color:var(--dim);font-size:13px">이름 <input type="text" id="name" placeholder="홍길동"></label><span class="hint">이름은 결과 코드 계산에만 쓰이며 저장되지 않습니다.</span></div>
  </div>
  <div class="panel"><h2>교시</h2><div class="tabs" id="tabs"></div></div>
  <div class="panel" id="sheet"></div>
  <div class="panel">
    <div class="actions">
      <button class="primary" id="gradeBtn">채점하기</button>
      <span class="code" id="rcode">—</span><span class="score" id="rscore"></span><span class="hint" id="rhint"></span>
      <button class="submit" id="submitBtn" style="margin-left:auto">제출</button>
    </div>
  </div>
</div>

<dialog id="dlg">
  <div class="body"><div class="dg" id="dgBody"></div></div>
  <div class="dgbar"><span class="toast" id="toast"></span><button id="captureBtn" class="primary">📋 캡처 (노션용 복사)</button><button id="closeBtn">닫기</button></div>
</dialog>

<script>
const $=s=>document.querySelector(s);
const Q=[{"t": "1교시 · 컨텍스트 스위치", "anim": "D2-1 컨텍스트 스위치", "qs": [{"p": "ps 의 STAT 열에서 실행 중이거나 실행 대기(run queue) 중인 프로세스를 나타내는 글자는 무엇입니까?", "o": ["D", "R", "Z", "S"], "a": 1, "w": "R 은 실행 중이거나 CPU 를 기다리는 상태입니다. S 는 잠듦, D 는 깨울 수 없는 잠(주로 디스크 I/O), Z 는 좀비입니다.", "an": "1교시 1-2 표"}, {"p": "디스크 I/O 를 기다리며 시그널로도 깨울 수 없는 잠을 자는 상태는 무엇입니까?", "o": ["T", "R", "D", "S"], "a": 2, "w": "D(uninterruptible sleep)는 I/O 완료 전에는 시그널로도 깨우지 않습니다. 그래서 kill -9 도 바로 듣지 않을 수 있습니다.", "an": "1교시 1-2 표"}, {"p": "프로세스가 sleep 이나 I/O 대기로 스스로 CPU 를 내려놓을 때 늘어나는 카운터는 무엇입니까?", "o": ["nonvoluntary_ctxt_switches", "preempt_count_total", "nr_switches_forced", "voluntary_ctxt_switches"], "a": 3, "w": "/proc/PID/status 의 voluntary_ctxt_switches 는 스스로 잠든 횟수, nonvoluntary_ctxt_switches 는 선점당한 횟수입니다.", "an": "D2-1 · 표의 자발적 ▼"}, {"p": "아래 실행 결과에서 자발적 전환이 1000 이 나온 이유로 알맞은 것은 무엇입니까?", "c": "$ ./01_ctxsw sleep\n  자발적   전환 (스스로 잠듦)   : 1000\n  비자발적 전환 (선점당함)      : 0", "o": ["usleep 을 1000번 불러 매번 잠들어서", "CPU 가 1000 MHz 로 동작하고 있어서", "1초 동안 타이머 인터럽트가 1000번 와서 선점해서", "1000번 선점당한 것을 자발적으로 기록해서"], "a": 0, "w": "usleep(1000) 을 부를 때마다 프로세스가 잠들며 CPU 를 내려놓으므로 자발적 전환이 1번씩 늘어 1000 이 됩니다.", "an": "D2-1 · A 를 sleep 형으로"}, {"p": "경쟁자가 하나도 없는 CPU 에서 busy 루프를 2초 돌렸습니다. 비자발적 전환 수로 가장 알맞은 것은 무엇입니까?", "o": ["자발적 전환과 항상 같다", "거의 0 에 가깝다", "busy 루프 횟수와 같다", "정확히 2000 이 된다"], "a": 1, "w": "빼앗아 갈 다른 태스크가 없으면 스케줄러는 계속 같은 태스크를 실행합니다. stress-ng 같은 경쟁자가 있어야 비자발적 전환이 늘어납니다.", "an": "D2-1 · B 없음 · busy"}, {"p": "stress-ng --cpu 2 를 켜고 ./01_ctxsw busy 를 실행했습니다. 가장 크게 늘어나는 것은 무엇입니까?", "o": ["열린 파일 디스크립터 수", "좀비 프로세스 수", "자발적 전환", "비자발적 전환"], "a": 3, "w": "두 vCPU 가 모두 바쁘면 스케줄러가 busy 루프를 주기적으로 빼앗아 다른 태스크에게 줍니다. 그래서 비자발적(선점) 전환이 늘어납니다.", "an": "D2-1 · stress-ng 부하"}, {"p": "컨텍스트 스위치에 대한 설명으로 옳은 것은 무엇입니까?", "o": ["CPU 클럭 속도를 바꾸는 하드웨어 기능이다", "자식 프로세스를 거두는 시스템 콜이다", "태스크를 바꿀 때 레지스터 등을 저장·복원한다", "프로세스의 PID 를 새로운 번호로 다시 매기는 작업이다"], "a": 2, "w": "컨텍스트 스위치는 지금 태스크의 레지스터·스택 포인터 등을 저장하고 다음 태스크의 것을 복원해 CPU 를 넘겨주는 일입니다.", "an": "1교시 1-1"}, {"p": "<code>cat /proc/loadavg</code> 의 첫 세 숫자가 의미하는 것은 무엇입니까?", "c": "0.85 0.42 0.20 1/215 2410", "o": ["1·5·15분 동안 새로 만들어진 프로세스 수", "1·5·15분 평균 메모리 사용률", "1·5·15분 평균 CPU 온도", "1·5·15분 평균 실행 대기 태스크 수"], "a": 3, "w": "load average 는 R(실행·대기) 과 D 상태 태스크 수의 이동 평균입니다. vCPU 2개에서 2.0 이면 꽉 찬 상태입니다.", "an": "1교시 1-1"}, {"p": "vCPU 가 2개인 VM 에서 load average 가 계속 4.0 입니다. 알맞은 해석은 무엇입니까?", "o": ["평균적으로 CPU 를 기다리는 태스크가 있다", "CPU 사용률이 4 % 라는 뜻이다", "지금 실행 중인 프로세스가 4개뿐이라는 뜻이다", "좀비가 4개 쌓여 있다는 뜻이다"], "a": 0, "w": "실행·대기 태스크가 평균 4개인데 CPU 는 2개이므로, 평균 2개 정도는 차례를 기다리고 있다는 뜻입니다.", "an": "1교시 1-1"}, {"p": "01_ctxsw 에서 전환 횟수를 /proc/self/status 로 읽는 이유는 무엇입니까?", "o": ["커널이 프로세스별 통계를 그 파일로 보여 줘서", "stdout 버퍼에 횟수가 쌓이기 때문에", "Makefile 이 빌드할 때 자동으로 기록해 주기 때문에", "전환 횟수는 errno 로만 알 수 있기 때문에"], "a": 0, "w": "/proc 은 커널이 읽는 순간 만들어 주는 가상 파일입니다. /proc/self/status 에 그 프로세스의 상태·메모리·전환 횟수가 들어 있습니다.", "an": "1교시 예제 01"}]}, {"t": "2교시 · CFS 실측", "anim": "D2-2 CFS vruntime", "qs": [{"p": "CFS 가 다음에 실행할 태스크를 고르는 기준은 무엇입니까?", "o": ["vruntime 이 가장 작은 태스크", "메모리를 가장 적게 쓰고 있는 태스크", "PID 가 가장 작은 태스크", "가장 최근에 깨어난 태스크"], "a": 0, "w": "CFS 는 레드블랙 트리에서 vruntime 이 가장 작은(가장 덜 실행된) 태스크를 고릅니다.", "an": "D2-2 · ◀ 최소"}, {"p": "nice 0 태스크의 weight 는 얼마입니까?", "o": ["4096", "110", "1024", "100"], "a": 2, "w": "nice 0 의 weight 가 1024 이고, nice 가 1 오를 때마다 약 1.25 배 작아집니다. nice 10 은 110 입니다.", "an": "2교시 2-1 표"}, {"p": "vruntime 증가량을 나타내는 식으로 알맞은 것은 무엇입니까?", "o": ["실제 실행 시간 + nice 값", "실제 실행 시간 × 1024 / weight", "실제 실행 시간 − weight", "실제 실행 시간 × weight / 1024"], "a": 1, "w": "weight 가 작을수록(nice 가 클수록) 같은 실행 시간에도 vruntime 이 더 빨리 늘어나 덜 뽑힙니다.", "an": "D2-2 · vruntime/실행 열"}, {"p": "nice 0 과 nice 10 프로세스가 같은 CPU 에서 경쟁합니다. nice 0 쪽 몫에 가장 가까운 것은 무엇입니까?", "o": ["약 90 %", "약 67 %", "약 50 %", "약 99 %"], "a": 0, "w": "1024 / (1024 + 110) = 90.3 % 입니다. 실제 02_nice_race 측정에서도 90.3 % : 9.7 % 가 나왔습니다.", "an": "2교시 예제 02"}, {"p": "02_nice_race 에서 두 자식을 모두 CPU 0 에 고정하는 이유는 무엇입니까?", "o": ["nice 는 CPU 0 에서만 동작하기 때문에", "CPU 1 은 root 전용이기 때문에", "CPU 0 이 CPU 1 보다 빠르기 때문에", "같은 CPU 에서 경쟁해야 몫이 나뉘기 때문에"], "a": 3, "w": "고정하지 않으면 vCPU 2개에 하나씩 올라가 둘 다 100 % 를 씁니다. 같은 CPU 를 나눠 써야 weight 비율이 드러납니다.", "an": "2교시 2-2"}, {"p": "아래 03_vruntime 출력에서 비율 9.31 이 나온 이유는 무엇입니까?", "c": "nice = 10\n  구간 실행시간(ms)   vruntime(ms)   비율\n       1          498.2         4637.5     9.31", "o": ["1024 / 110 = 9.31 이기 때문에", "4637.5 / 498.2 는 항상 같기 때문에", "CPU 가 9.31 GHz 이기 때문에", "10 × 0.931 이 9.31 이기 때문에"], "a": 0, "w": "nice 10 의 weight 는 110 이므로 vruntime 은 실제 실행 시간의 1024/110 = 9.31 배로 늘어납니다.", "an": "2교시 예제 03"}, {"p": "실행 중인 PID 2410 의 nice 값을 5 로 바꾸는 명령은 무엇입니까?", "o": ["taskset -n 5 2410", "nice -n 5 2410", "chrt -n 5 2410", "renice -n 5 -p 2410"], "a": 3, "w": "nice 는 실행할 때 지정하고, 이미 실행 중인 프로세스는 renice 로 바꿉니다. 값을 낮추려면(우선순위 올리기) root 가 필요합니다.", "an": "2교시 확인 4"}, {"p": "일반 사용자가 할 수 없는 것은 무엇입니까?", "o": ["renice 로 자기 프로세스 nice 를 5 로 바꾸기", "nice -n 19 로 새 프로그램 실행하기", "자기 프로세스의 nice 를 0 에서 -5 로 낮추기", "자기 프로세스의 nice 를 0 에서 10 으로 올리기"], "a": 2, "w": "nice 를 낮추는 것(더 많은 CPU 를 가져가기)은 root 권한이 필요합니다. 높이는 것(양보)은 누구나 할 수 있습니다.", "an": "2교시 2-1"}, {"p": "수업 VM(커널 5.15)과 커널 6.6 이상의 차이로 알맞은 것은 무엇입니까?", "o": ["6.6 부터 nice 값이 없어졌다", "6.6 부터 기본 스케줄러가 EEVDF 로 바뀌었다", "5.15 에는 vruntime 이라는 개념이 아직 없다", "5.15 는 RT 정책을 지원하지 않는다"], "a": 1, "w": "커널 6.6 부터 CFS 를 대신해 EEVDF 가 기본입니다. nice·weight 개념은 유지됩니다. 수업 VM 은 5.15 라서 CFS 로 해석합니다.", "an": "2교시 2-1 참고"}, {"p": "CFS 가 세 태스크(nice 0, 5, 10)를 1초 실행했습니다. 가장 많이 실행된 태스크는 무엇입니까?", "o": ["nice 10", "nice 5", "nice 0", "셋 다 같다"], "a": 2, "w": "weight 1024 : 335 : 110 이므로 nice 0 이 약 70 % 를 가져갑니다. 애니메이션의 실제 몫과 예상 몫이 같게 나옵니다.", "an": "D2-2 · 1초 실행"}]}, {"t": "3교시 · CPU affinity", "anim": "D2-3 CPU affinity", "qs": [{"p": "CPU affinity 의 의미로 알맞은 것은 무엇입니까?", "o": ["CPU 의 동작 주파수 설정값", "프로세스가 실행될 수 있는 CPU 목록", "프로세스 간 통신 채널의 개수", "프로세스가 최대로 쓸 수 있는 메모리 크기"], "a": 1, "w": "affinity 는 그 프로세스를 어느 CPU 에서 실행해도 되는지 정한 집합입니다. 기본값은 모든 CPU 입니다.", "an": "3교시 3-1"}, {"p": "셸에서 ./prog 를 CPU 0 에서만 실행하는 명령은 무엇입니까?", "o": ["renice -c 0 ./prog", "nice -c 0 ./prog", "taskset -c 0 ./prog", "chrt -c 0 ./prog"], "a": 2, "w": "taskset -c 는 CPU 번호 목록으로 affinity 를 지정해 실행합니다. 실행 중인 PID 는 taskset -cp 로 바꿉니다.", "an": "3교시 3-1 표"}, {"p": "C 에서 sched_setaffinity 를 쓰려면 소스 맨 앞에 무엇을 정의해야 합니까?", "o": ["#define _AFFINITY_ON", "#define _POSIX_SOURCE", "#define _KERNEL_MODE", "#define _GNU_SOURCE"], "a": 3, "w": "sched_setaffinity · CPU_SET · sched_getcpu 는 GNU 확장이라 모든 #include 앞에 _GNU_SOURCE 를 정의해야 선언이 보입니다.", "an": "빈칸 3-1"}, {"p": "아래 코드 실행 후 set 에 들어 있는 CPU 는 무엇입니까?", "c": "cpu_set_t set;\nCPU_ZERO(&amp;set);\nCPU_SET(1, &amp;set);", "o": ["아무 CPU 도 없음", "CPU 0 과 CPU 1", "CPU 1 하나", "CPU 0 하나"], "a": 2, "w": "CPU_ZERO 로 비운 뒤 CPU_SET(1) 로 1 만 넣었습니다. 이 집합을 sched_setaffinity 에 주면 CPU 1 에서만 실행됩니다.", "an": "3교시 예제 04"}, {"p": "지금 실행 중인 CPU 번호를 돌려주는 함수는 무엇입니까?", "o": ["sched_getaffinity()", "sysconf()", "getcpu_count()", "sched_getcpu()"], "a": 3, "w": "sched_getcpu() 는 호출한 순간 실행 중인 CPU 번호를 돌려줍니다. 고정하지 않으면 실행 중에 바뀔 수 있습니다.", "an": "3교시 예제 04"}, {"p": "vCPU 2개 VM 에서 ./04_affinity 5 를 실행하면 어떻게 됩니까?", "o": ["자동으로 CPU 1 에 고정된다", "sched_setaffinity 가 EINVAL 로 실패한다", "경고 없이 고정을 무시하고 그냥 실행된다", "CPU 5 를 새로 만들어 그 CPU 에 고정한다"], "a": 1, "w": "존재하는(온라인) CPU 가 하나도 없는 집합은 커널이 Invalid argument(EINVAL)로 거부합니다.", "an": "3교시 3-1"}, {"p": "CPU 0 에 stress-ng 가 돌고 CPU 1 은 비어 있습니다. taskset -c 0 ./07_busy 의 계산량에 가장 가까운 것은 무엇입니까?", "o": ["약 25 %", "0 %", "약 100 %", "약 50 %"], "a": 3, "w": "CPU 0 을 stress-ng 와 나눠 쓰므로 절반 정도입니다. CPU 1 이 놀고 있어도 고정 때문에 옮겨 가지 못합니다.", "an": "D2-3 · P 를 CPU 0 고정"}, {"p": "같은 상황에서 고정하지 않고 ./07_busy 를 실행하면 어떻게 됩니까?", "o": ["반드시 CPU 0 에서 50 % 로 실행된다", "CPU 0 과 1 을 동시에 써서 계산량이 200 % 가 된다", "비어 있는 CPU 1 로 옮겨 100 % 가까이 실행된다", "stress-ng 가 끝날 때까지 시작하지 않는다"], "a": 2, "w": "affinity 가 자유로우면 부하 분산(load balancing)이 덜 바쁜 CPU 로 옮겨 줍니다.", "an": "D2-3 · 자유"}, {"p": "CPU 고정의 장점으로 알맞은 것은 무엇입니까?", "o": ["캐시를 재사용하고 실행 위치가 예측 가능하다", "프로세스의 메모리 사용량이 절반으로 줄어든다", "항상 다른 프로세스보다 먼저 실행된다", "root 권한 없이 RT 정책을 쓸 수 있다"], "a": 0, "w": "같은 CPU 에서 계속 돌면 L1/L2 캐시 내용이 재사용되고, 지연이 예측 가능해집니다. 대신 그 CPU 가 바쁘면 기다려야 합니다.", "an": "3교시 3-1"}, {"p": "실행 중인 PID 3001 을 CPU 1 로 옮기는 명령은 무엇입니까?", "o": ["taskset -cp 1 3001", "renice -c 1 3001", "taskset -c 1 3001", "chrt -p 1 3001"], "a": 0, "w": "-p 는 이미 실행 중인 PID 를 대상으로 한다는 뜻입니다. -c 는 CPU 번호 목록 형식입니다.", "an": "3교시 3-1 표"}]}, {"t": "4교시 · 실시간 정책", "anim": "D2-4 실시간 정책", "qs": [{"p": "SCHED_FIFO 태스크가 CPU 를 내려놓는 경우로 알맞은 것은 무엇입니까?", "o": ["다른 CPU 가 놀고 있을 때마다", "매 4ms 마다 시간 조각이 끝날 때", "끝나거나 잠들거나 더 높은 RT 가 올 때", "nice 값이 더 낮은 태스크가 깨어날 때"], "a": 2, "w": "FIFO 는 시간 조각이 없습니다. 스스로 잠들거나 끝나거나 더 높은 우선순위 RT 태스크가 깨어나야 비킵니다.", "an": "D2-4 · 무한 루프"}, {"p": "SCHED_FIFO · SCHED_RR 의 우선순위 범위는 무엇입니까?", "o": ["1 ~ 255", "0 ~ 139", "1 ~ 99", "-20 ~ 19"], "a": 2, "w": "RT 우선순위는 1~99 이고 숫자가 클수록 높습니다. nice(-20~19)는 SCHED_OTHER 에만 쓰입니다.", "an": "4교시 예제 05"}, {"p": "SCHED_RR 이 SCHED_FIFO 와 다른 점은 무엇입니까?", "o": ["같은 CPU 의 일반 태스크보다 항상 나중에 실행된다", "우선순위 범위가 -20 ~ 19 이다", "같은 우선순위끼리 시간 조각을 돌아가며 쓴다", "root 권한 없이 쓸 수 있다"], "a": 2, "w": "RR 은 FIFO 에 같은 우선순위끼리의 라운드 로빈(기본 100ms)을 더한 것입니다.", "an": "4교시 4-1 표"}, {"p": "일반 사용자로 ./05_rt_policy 를 실행했을 때 나오는 메시지는 무엇입니까?", "o": ["sched_setscheduler: Operation not permitted", "sched_setscheduler: No such file or directory", "sched_setscheduler: Invalid argument", "Segmentation fault (core dumped)"], "a": 0, "w": "RT 정책은 다른 모든 일반 태스크를 밀어낼 수 있어 root(CAP_SYS_NICE) 권한이 필요합니다. 없으면 EPERM 입니다.", "an": "4교시 4-2"}, {"p": "./prog 를 SCHED_FIFO 우선순위 50 으로 실행하는 명령은 무엇입니까?", "o": ["sudo renice -f 50 ./prog", "sudo taskset -c 50 ./prog", "sudo nice -n 50 ./prog", "sudo chrt -f 50 ./prog"], "a": 3, "w": "chrt -f 는 FIFO, -r 은 RR 입니다. chrt -p PID 로 현재 정책을 확인합니다.", "an": "4교시 4-2"}, {"p": "아래 값의 의미로 알맞은 것은 무엇입니까?", "c": "$ cat /proc/sys/kernel/sched_rt_runtime_us\n950000\n$ cat /proc/sys/kernel/sched_rt_period_us\n1000000", "o": ["RT 우선순위는 95 를 넘을 수 없다", "1초마다 RT 태스크는 최대 0.95초만 실행된다", "RT 태스크는 0.95초가 지나면 커널이 자동 종료한다", "RT 태스크 수는 최대 95개다"], "a": 1, "w": "RT throttling 입니다. RT 가 무한 루프에 빠져도 1초 중 50ms 는 일반 태스크가 실행되어 시스템이 완전히 멈추지 않습니다.", "an": "D2-4 · throttling"}, {"p": "FIFO 무한 루프 버그가 있는데 RT throttling 이 켜져 있습니다. PuTTY 는 어떻게 됩니까?", "o": ["즉시 접속이 끊어진다", "전혀 영향을 받지 않는다", "VM 이 자동으로 재부팅된다", "매우 느리지만 가끔 반응한다"], "a": 3, "w": "1초 중 50ms 만 일반 태스크에 돌아가므로 sshd·셸이 아주 느리게 반응합니다. throttling 을 끄면 완전히 멈춥니다.", "an": "D2-4 · 무한 루프 + throttling"}, {"p": "RT 태스크를 올바르게 쓰는 모양은 무엇입니까?", "o": ["다른 태스크가 끼어들지 못하게 쉬지 않고 계속 계산한다", "주기마다 짧게 일하고 clock_nanosleep 으로 잠든다", "모든 프로세스를 RT 로 바꾼다", "우선순위를 항상 99 로 준다"], "a": 1, "w": "RT 태스크에는 반드시 잠드는 지점이 있어야 나머지 시간을 다른 태스크가 쓸 수 있습니다.", "an": "D2-4 · 주기 RT"}, {"p": "RT 태스크와 SCHED_OTHER 태스크가 같은 CPU 에서 실행 가능할 때 누가 먼저 실행됩니까?", "o": ["nice 가 낮은 OTHER 태스크", "RT 태스크", "먼저 만들어진 태스크", "vruntime 이 작은 태스크"], "a": 1, "w": "RT 클래스는 OTHER(CFS) 클래스보다 항상 먼저 선택됩니다. throttling 한도 안에서는 예외가 없습니다.", "an": "4교시 4-1"}, {"p": "실행 중인 PID 2410 의 스케줄링 정책과 우선순위를 확인하는 명령은 무엇입니까?", "o": ["chrt -p 2410", "nice -p 2410", "taskset -p 2410", "ps -p 2410 -o nice"], "a": 0, "w": "chrt -p 는 'pid 2410 의 현재 정책: SCHED_FIFO, 우선순위: 50' 처럼 보여 줍니다.", "an": "4교시 4-2"}]}, {"t": "5교시 · 시간 측정과 주기 실행", "anim": "D2-5 주기 실행과 드리프트", "qs": [{"p": "경과 시간 측정에 CLOCK_MONOTONIC 을 쓰는 이유는 무엇입니까?", "o": ["사람이 읽는 실제 날짜와 시각을 알려 주어서", "시계를 조정해도 거꾸로 가지 않아서", "프로세스마다 0 부터 시작해서", "CPU 사용 시간만 세어 주어서"], "a": 1, "w": "CLOCK_REALTIME 은 벽시계라 조정될 수 있습니다. MONOTONIC 은 부팅 후 계속 증가만 해서 시간 차이 계산에 안전합니다.", "an": "5교시 5-1 표"}, {"p": "1 ms 는 몇 ns 입니까?", "o": ["1,000,000 ns", "100,000 ns", "1,000 ns", "1,000,000,000 ns"], "a": 0, "w": "1 s = 10⁹ ns, 1 ms = 10⁶ ns, 1 us = 10³ ns 입니다.", "an": "빈칸 5-1"}, {"p": "아래 코드로 측정한 값의 단위는 무엇입니까?", "c": "long long d = (b.tv_sec - a.tv_sec) * 1000000LL\n            + (b.tv_nsec - a.tv_nsec) / 1000;", "o": ["초 단위 정수(s)", "나노초(ns)", "마이크로초(us)", "밀리초(ms)"], "a": 2, "w": "초 차이에 10⁶ 을 곱하고 나노초 차이를 1000 으로 나눴으므로 마이크로초입니다.", "an": "5교시 5-1"}, {"p": "1ms 주기 루프에 상대 nanosleep 을 쓰면 생기는 문제는 무엇입니까?", "o": ["프로그램이 root 권한을 요구한다", "일한 시간과 깨어나는 지연이 주기마다 쌓인다", "sleep 이 전혀 동작하지 않는다", "CPU 사용률이 항상 100 % 가 되어 다른 일을 못 한다"], "a": 1, "w": "'지금부터 1ms' 를 반복하면 매 주기 (일한 시간 + 지연) 만큼 밀립니다. 예제에서 1000번에 +303ms 였습니다.", "an": "D2-5"}, {"p": "절대 시각까지 잠들게 하는 호출로 알맞은 것은 무엇입니까?", "o": ["clock_nanosleep(CLOCK_MONOTONIC, TIMER_ABSTIME, &amp;next, NULL)", "usleep(next.tv_nsec / 1000)", "nanosleep(&amp;next, NULL)", "clock_nanosleep(CLOCK_MONOTONIC, 0, &amp;period, NULL)"], "a": 0, "w": "TIMER_ABSTIME 플래그를 주면 '그 시각까지' 잠듭니다. next 를 매 주기 1ms 씩 더해 갑니다.", "an": "빈칸 5-1"}, {"p": "06_sleep_drift 결과에서 절대 sleep 의 오차가 +0.1ms 만 남은 이유는 무엇입니까?", "c": "상대 nanosleep        :   1303.0 ms (오차 +303.0 ms)\n절대 clock_nanosleep  :   1000.1 ms (오차 +0.1 ms)", "o": ["매 주기 늦은 만큼이 다음 주기에서 흡수되어서", "측정을 한 번만 해서", "절대 sleep 은 일을 하지 않아서", "절대 sleep 은 CPU 를 더 빨리 돌려서"], "a": 0, "w": "다음 깨어날 시각이 '시작 + i×1ms' 로 고정되어 있으므로 이번 주기의 지연이 다음 주기로 넘어가지 않습니다. 마지막 한 번의 지연만 남습니다.", "an": "D2-5"}, {"p": "next.tv_nsec 에 1ms 를 더한 뒤 반드시 확인해야 하는 것은 무엇입니까?", "c": "next.tv_nsec += 1000000;", "o": ["음수가 되면 0 으로 바꿈", "1000 의 배수인지 검사해 아니면 반올림", "tv_sec 을 0 으로 초기화", "10억을 넘으면 tv_sec 으로 올림"], "a": 3, "w": "tv_nsec 은 0 ~ 999,999,999 범위여야 합니다. 넘치면 10억을 빼고 tv_sec 을 1 늘립니다. 그렇지 않으면 EINVAL 이 납니다.", "an": "빈칸 5-1"}, {"p": "1ms 주기 상대 sleep 루프를 360만 번(목표 1시간) 돌리는데 주기마다 0.3ms 씩 밀립니다. 목표보다 얼마나 늦게 끝납니까?", "o": ["약 1초", "약 3시간", "약 0.3초", "약 18분"], "a": 3, "w": "360만 주기 × 0.3ms = 1080초 = 18분입니다. 작은 어긋남도 주기 수만큼 곱해져 커집니다.", "an": "D2-5 · 1시간 뒤 오차"}, {"p": "로그에 '2026-10-06 14:03:21' 처럼 날짜·시각을 찍을 때 알맞은 시계는 무엇입니까?", "o": ["CLOCK_PROCESS_CPUTIME_ID", "CLOCK_REALTIME", "CLOCK_MONOTONIC", "CLOCK_THREAD_CPUTIME_ID"], "a": 1, "w": "사람이 읽는 날짜·시각은 벽시계인 CLOCK_REALTIME 입니다. 간격 측정과 주기 실행은 MONOTONIC 입니다.", "an": "5교시 5-1 표"}, {"p": "주기 태스크에서 work() 시간이 주기보다 길어지면 절대 sleep 은 어떻게 됩니까?", "o": ["커널이 SIGALRM 을 보내 프로세스를 종료한다", "work() 가 강제로 중단된다", "다음 시각이 이미 지나 있어 바로 깨어난다", "주기가 자동으로 두 배가 된다"], "a": 2, "w": "이미 지난 시각까지 자라고 하면 clock_nanosleep 은 즉시 돌아옵니다. 주기를 놓친(overrun) 것이므로 따로 감지해야 합니다.", "an": "5교시 5-2"}]}, {"t": "6교시 · cgroup v2", "anim": "D2-6 cgroup cpu.max", "qs": [{"p": "cgroup 의 역할로 알맞은 것은 무엇입니까?", "o function copyRich(html,text){
  // 1) copy 이벤트에 두 형식을 직접 실어 보내기 (사용자 클릭 안에서 동기 실행 — file:// 에서도 동작)
  let done=false;
  const onCopy=e=>{e.clipboardData.setData('text/html',html);e.clipboardData.setData('text/plain',text);e.preventDefault();done=true;};
  document.addEventListener('copy',onCopy);
  try{
    const body=$('#dgBody');const sel=window.getSelection();const range=document.createRange();range.selectNodeContents(body);sel.removeAllRanges();sel.addRange(range);
    document.execCommand('copy');
    sel.removeAllRanges();
  }catch(e){}
  document.removeEventListener('copy',onCopy);
  return done;
}

  // 3) 최종: 텍스트 영역 선택 복사
  try{
    const ta=document.createElement('textarea');ta.value=lastText;ta.style.position='fixed';ta.style.opacity='0';$('#dlg').appendChild(ta);ta.focus();ta.select();
    const ok=document.execCommand('copy');ta.remove();
    $('#toast').textContent=ok?'텍스트(마크다운 표)로 복사됨 — 노션에서 Ctrl+V.':'복사 실패 — 대화상자 내용을 드래그해 Ctrl+C 로 복사하세요.';
  }catch(e){$('#toast').textContent='복사 실패 — 대화상자 내용을 드래그해 Ctrl+C 로 복사하세요.';}
};
render();
</script>
</body>
</html>
