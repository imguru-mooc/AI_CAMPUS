<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>컴프리헨션 변환기 — Python Day 2</title>
<style>
  :root{--bg:#0b1220;--panel:#111a2e;--line:#1f2b45;--text:#dbe4f0;--dim:#8a9bb8;--amber:#f5b942;--teal:#2dd4bf;--blue:#60a5fa;--green:#4ade80;--red:#f87171;--purple:#c084fc;--mono:"Consolas","D2Coding","JetBrains Mono",monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR","Segoe UI",sans-serif;font-size:15px;line-height:1.55}
  .app{max-width:1100px;margin:0 auto;padding:22px 20px 40px}
  h1{color:var(--amber);font-size:24px;margin:0 0 6px}
  .sub{color:var(--dim);margin:0 0 14px}
  .pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .pill{border:1px solid;border-radius:999px;padding:4px 12px;font-size:13px;font-family:var(--mono)}
  .pill.teal{color:var(--teal);border-color:var(--teal)}.pill.amber{color:var(--amber);border-color:var(--amber)}.pill.blue{color:var(--blue);border-color:var(--blue)}.pill.green{color:var(--green);border-color:var(--green)}.pill.red{color:var(--red);border-color:var(--red)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
  .panel h2{font-size:14px;color:var(--dim);margin:0 0 10px;font-weight:600}
  .presets{display:flex;flex-wrap:wrap;gap:8px}
  button{background:#172239;border:1px solid #2a3a5c;color:var(--text);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--amber)}button.active{background:#3a2e12;border-color:var(--amber);color:var(--amber)}
  button.run{background:#123d33;border-color:var(--teal);color:var(--teal);font-weight:700}
  button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .code{font-family:var(--mono);background:#0a0f1c;border:1px solid var(--line);border-radius:8px;padding:8px 0;font-size:14px;overflow-x:auto}
  .ln{padding:3px 12px;border-left:3px solid transparent;white-space:pre}
  .ln.cur{background:#1f1a0c;border-left-color:var(--amber)}
  .ln .k{color:var(--purple)}.ln .n{color:var(--amber)}
  .seg{padding:1px 3px;border-radius:4px;transition:background .2s}
  .seg.cur{background:#3a2e12;outline:1px solid var(--amber)}
  .flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:46px;margin:8px 0}
  .tok{font-family:var(--mono);font-size:14px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#0e1628;transition:all .25s}
  .tok.cur{border-color:var(--amber);background:#1f1a0c;color:var(--amber)}
  .tok.skip{border-color:var(--red);color:var(--red);opacity:.5;text-decoration:line-through}
  .tok.done{opacity:.45}
  .res .tok{border-color:var(--green);color:var(--green);background:#0d2216;animation:pop .3s}
  @keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
  .lbl{font-size:12px;color:var(--dim);font-family:var(--mono);margin-top:6px}
  .status{border-radius:8px;padding:10px 12px;font-size:14px;border:1px solid var(--line);min-height:44px}
  .status.ok{border-color:var(--green);color:var(--green);background:#0d2216}.status.info{border-color:var(--teal);color:var(--teal);background:#0f2a27}.status.warn{border-color:var(--red);color:var(--red);background:#2a1212}
  .explain p{margin:6px 0}.explain b.teal{color:var(--teal)}.explain b.amber{color:var(--amber)}.explain b.green{color:var(--green)}.explain b.red{color:var(--red)}.explain b.blue{color:var(--blue)}
  .explain code{font-family:var(--mono);color:var(--blue)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .row label{color:var(--dim);font-size:13px}
  input[type=range]{accent-color:var(--amber)}
</style>
</head>
<body>
<div class="app">
  <h1>컴프리헨션 변환기</h1>
  <p class="sub">같은 일을 하는 <b style="color:var(--blue)">for 문</b>과 <b style="color:var(--teal)">컴프리헨션</b>을 나란히 놓고, 원소 하나가 지나갈 때 두 코드의 어느 부분이 실행되는지 동시에 하이라이트합니다.</p>
  <div class="pills"><span class="pill blue">for 문 3~4줄</span><span class="pill teal">[식 for 변수 in 시퀀스 if 조건]</span><span class="pill amber">읽는 순서: for → if → 식</span><span class="pill green">결과는 새 리스트</span></div>

  <div class="panel"><h2>프리셋</h2><div class="presets" id="presets"></div>
    <div class="row" style="margin-top:10px"><button class="run" id="playBtn">재생</button><button id="stepBtn">한 단계</button><label>속도 <input type="range" id="speed" min="150" max="1100" value="550"></label></div>
  </div>

  <div class="grid">
    <div class="panel"><h2>for 문</h2><div class="code" id="codeL"></div></div>
    <div class="panel"><h2>컴프리헨션</h2><div class="code" id="codeR"></div></div>
  </div>

  <div class="panel">
    <h2>원소의 여행</h2>
    <div class="lbl">입력</div><div class="flow" id="inFlow"></div>
    <div class="lbl">결과 result</div><div class="flow res" id="outFlow"></div>
  </div>
  <div class="panel"><h2>상태</h2><div class="status info" id="status"></div></div>
  <div class="panel explain" id="explain"></div>
</div>

<script>
const $=s=>document.querySelector(s);
/* preset: src(입력배열), expr(값 변환 fn), cond(fn|null), 표시 문자열들 */
const PRESETS=[
 {n:'기본 — 2배',src:[1,2,3,4],expr:x=>x*2,cond:null,exprS:'x * 2',condS:null,varS:'x',seqS:'[1, 2, 3, 4]',
  ex:'<p>컴프리헨션은 for 문을 한 줄로 접은 것입니다. 읽는 순서는 <b class="amber">for → (if) → 맨 앞의 식</b>. 대괄호가 있으니 결과는 항상 <b class="green">새 리스트</b>입니다.</p>'},
 {n:'조건 — 짝수만',src:[1,2,3,4,5,6],expr:x=>x*x,cond:x=>x%2===0,exprS:'x * x',condS:'x % 2 == 0',varS:'x',seqS:'[1, 2, 3, 4, 5, 6]',
  ex:'<p><code>if</code> 를 통과하지 못한 원소는 <b class="red">식을 계산하지 않고</b> 버려집니다. filter + map 을 한 줄에 쓴 셈입니다.</p>'},
 {n:'ADC → 전압',src:[512,300,1023,0],expr:x=>Math.round(x/1023*3.3*100)/100,cond:null,exprS:'round(r / 1023 * 3.3, 2)',condS:null,varS:'r',seqS:'raws',
  ex:'<p>Day 1 의 ADC 공식을 리스트 전체에 적용합니다. for 문으로 4줄 쓸 일을 한 줄로 — 데이터 전처리에서 가장 많이 쓰는 형태입니다.</p>'},
 {n:'경고만 필터',src:[22.1,35.5,24.9,36.9,31.2],expr:x=>x,cond:x=>x>35,exprS:'t',condS:'t > 35',varS:'t',seqS:'temps',
  ex:'<p>식이 <code>t</code> 그대로면 "골라내기만" 하는 것입니다. <code>list(filter(lambda t: t &gt; 35, temps))</code> 와 같지만 컴프리헨션이 더 읽기 쉽습니다.</p>'},
 {n:'문자열 파싱',src:['T=25.3','T=31.0','T=22.8'],expr:s=>parseFloat(s.split('=')[1]),cond:null,exprS:'float(s.split("=")[1])',condS:null,varS:'s',seqS:'fields',
  ex:'<p>식 자리에는 어떤 표현식이든 옵니다. Day 1 파싱 코드가 한 줄이 됐습니다. 단, 여기서 ValueError 가 나면 전체가 멈추므로 지저분한 데이터는 6교시의 try 를 쓴 for 문이 낫습니다 — <b class="amber">짧은 것보다 읽히는 것이 우선</b>.</p>'},
];
let cur=0,pos=-1,phase=0,timer=null,result=[];
function esc(t){return String(t).replace(/</g,'&lt;');}
function buildCode(){
  const p=PRESETS[cur];
  const L=[`result = []`,`for ${p.varS} in ${p.seqS}:`,...(p.condS?[`    if ${p.condS}:`]:[]),`    ${p.condS?'    ':''}result.append(${p.exprS})`];
  $('#codeL').innerHTML=L.map((l,i)=>`<div class="ln" data-l="${i}">${esc(l)}</div>`).join('');
  const rSegs=[`result = [`,`<span class="seg" id="sgE">${esc(p.exprS)}</span>`,` <span class="seg" id="sgF">for ${p.varS} in ${p.seqS}</span>`,p.condS?` <span class="seg" id="sgI">if ${esc(p.condS)}</span>`:'',`]`].join('');
  $('#codeR').innerHTML=`<div class="ln">${rSegs}</div>`;
}
function renderFlows(){
  const p=PRESETS[cur];
  $('#inFlow').innerHTML=p.src.map((v,i)=>{
    let cls='';if(i<pos)cls=(p.cond&&!p.cond(p.src[i]))?'skip':'done';else if(i===pos)cls=(phase>=1&&p.cond&&!p.cond(v))?'skip':'cur';
    return `<div class="tok ${cls}">${esc(v)}</div>`;}).join('')||'<span style="color:#3f5070">—</span>';
  $('#outFlow').innerHTML=result.map(v=>`<div class="tok">${esc(v)}</div>`).join('')||'<span style="color:#3f5070">비어 있음</span>';
}
function hl(lIdx,seg){
  $('#codeL').querySelectorAll('.ln').forEach((el,i)=>el.classList.toggle('cur',i===lIdx));
  ['sgF','sgI','sgE'].forEach(id=>{const el=document.getElementById(id);if(el)el.classList.toggle('cur',id===seg);});
}
function setStatus(c,m){const s=$('#status');s.className='status '+c;s.innerHTML=m;}
function reset(){stop();pos=-1;phase=0;result=[];buildCode();renderFlows();hl(-1,null);setStatus('info','재생 또는 한 단계를 누르세요. 두 코드가 같은 순간에 같은 일을 합니다.');}
function step(){
  const p=PRESETS[cur];const hasIf=!!p.cond;
  if(pos>=p.src.length){stop();return;}
  if(phase===0){ // fetch next element
    pos++;
    if(pos>=p.src.length){hl(-1,null);renderFlows();setStatus('ok',`끝. result = [${result.join(', ')}] — 원본은 그대로, 결과는 새 리스트.`);stop();return;}
    hl(1,'sgF');renderFlows();setStatus('info',`<b>for</b>: 다음 원소 ${esc(p.src[pos])} 를 ${p.varS} 에 대입`);phase=hasIf?1:2;return;
  }
  if(phase===1){ // if
    const v=p.src[pos];const ok=p.cond(v);
    hl(2,'sgI');renderFlows();
    setStatus(ok?'info':'warn',`<b>if</b> ${p.condS} → ${ok?'참: 식 계산으로':'거짓: 이 원소는 버리고 다음으로'}`);
    phase=ok?2:0;return;
  }
  if(phase===2){ // expr + append
    const p2=PRESETS[cur];const v=p2.src[pos];const r=p2.expr(v);
    result.push(r);hl(p2.condS?3:2,'sgE');renderFlows();
    setStatus('ok',`<b>식</b> ${p2.exprS} = ${esc(r)} → result 에 추가`);phase=0;return;
  }
}
function play(){if(timer){stop();return;}$('#playBtn').textContent='일시정지';step();timer=setInterval(step,1250-+$('#speed').value);}
function stop(){clearInterval(timer);timer=null;$('#playBtn').textContent='재생';}
$('#playBtn').onclick=play;$('#stepBtn').onclick=()=>{stop();step();};
$('#presets').innerHTML=PRESETS.map(p=>`<button>${p.n}</button>`).join('');
$('#presets').querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{$('#presets').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));cur=i;$('#explain').innerHTML=PRESETS[i].ex;reset();});
$('#presets').querySelector('button').click();
</script>
</body>
</html>
