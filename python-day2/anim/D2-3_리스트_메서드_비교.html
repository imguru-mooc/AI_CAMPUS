<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>리스트 메서드 동작 비교 — Python Day 2</title>
<style>
  :root{--bg:#0b1220;--panel:#111a2e;--line:#1f2b45;--text:#dbe4f0;--dim:#8a9bb8;--amber:#f5b942;--teal:#2dd4bf;--blue:#60a5fa;--green:#4ade80;--red:#f87171;--purple:#c084fc;--mono:"Consolas","D2Coding","JetBrains Mono",monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR","Segoe UI",sans-serif;font-size:15px;line-height:1.55}
  .app{max-width:1100px;margin:0 auto;padding:22px 20px 40px}
  h1{color:var(--amber);font-size:24px;margin:0 0 6px}
  .sub{color:var(--dim);margin:0 0 14px}
  .pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .pill{border:1px solid;border-radius:999px;padding:4px 12px;font-size:13px;font-family:var(--mono)}
  .pill.teal{color:var(--teal);border-color:var(--teal)}.pill.amber{color:var(--amber);border-color:var(--amber)}.pill.green{color:var(--green);border-color:var(--green)}.pill.red{color:var(--red);border-color:var(--red)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
  .panel h2{font-size:14px;color:var(--dim);margin:0 0 10px;font-weight:600}
  .presets{display:flex;flex-wrap:wrap;gap:8px}
  button{background:#172239;border:1px solid #2a3a5c;color:var(--text);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--amber)}button.active{background:#3a2e12;border-color:var(--amber);color:var(--amber)}
  button.run{background:#123d33;border-color:var(--teal);color:var(--teal);font-weight:700}
  button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .grid{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .listrow{display:flex;gap:6px;flex-wrap:wrap;min-height:52px;align-items:center}
  .lbl{font-family:var(--mono);color:var(--dim);font-size:13px;width:64px}
  .cell{font-family:var(--mono);font-size:16px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:#0e1628;transition:all .3s}
  .cell.new{border-color:var(--green);color:var(--green);background:#0d2216;animation:pop .35s}
  .cell.gone{border-color:var(--red);color:var(--red);background:#2a1212;text-decoration:line-through;opacity:.55}
  .cell.moved{border-color:var(--amber)}
  @keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
  .retbox{font-family:var(--mono);font-size:14px;margin-top:8px}
  .retbox b{color:var(--amber)}
  .retbox .none{color:var(--red)}
  .code{font-family:var(--mono);background:#0a0f1c;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;white-space:pre-wrap;min-height:64px}
  .code .g{color:var(--green)}.code .e{color:var(--red)}.code .c{color:#5d7292}
  .status{border-radius:8px;padding:10px 12px;font-size:14px;border:1px solid var(--line);min-height:44px}
  .status.ok{border-color:var(--green);color:var(--green);background:#0d2216}.status.info{border-color:var(--teal);color:var(--teal);background:#0f2a27}.status.warn{border-color:var(--red);color:var(--red);background:#2a1212}
  .explain p{margin:6px 0}.explain b.teal{color:var(--teal)}.explain b.amber{color:var(--amber)}.explain b.green{color:var(--green)}.explain b.red{color:var(--red)}
  .explain code{font-family:var(--mono);color:var(--blue)}
  .rowset{display:flex;gap:16px;align-items:flex-start;margin-bottom:6px}
</style>
</head>
<body>
<div class="app">
  <h1>리스트 메서드 동작 비교</h1>
  <p class="sub">같은 리스트에 메서드를 적용하며 <b style="color:var(--green)">제자리 변경</b>인지, <b style="color:var(--amber)">반환값</b>이 무엇인지 확인합니다. 초록 = 새로 생김, 빨강 = 사라짐, 노랑 = 밀려남.</p>
  <div class="pills"><span class="pill green">제자리(in-place) 변경</span><span class="pill amber">반환값 주의</span><span class="pill red">sort() 는 None 반환</span><span class="pill teal">sorted() 는 새 리스트</span></div>

  <div class="panel"><h2>프리셋 (누르면 재생)</h2><div class="presets" id="presets"></div>
    <div style="margin-top:10px"><button id="resetBtn">리스트 초기화 a = [22.1, 35.5, 24.9, 31.2]</button></div>
  </div>

  <div class="grid">
    <div class="panel">
      <h2>리스트 상태</h2>
      <div class="rowset"><span class="lbl">a</span><div class="listrow" id="rowA"></div></div>
      <div class="rowset" id="rowBWrap" style="display:none"><span class="lbl" id="rowBLbl">b</span><div class="listrow" id="rowB"></div></div>
      <div class="retbox" id="ret"></div>
    </div>
    <div>
      <div class="panel"><h2>Python</h2><div class="code" id="code"></div></div>
      <div class="panel"><h2>상태</h2><div class="status info" id="status">프리셋을 누르면 한 단계씩 재생됩니다.</div></div>
    </div>
  </div>
  <div class="panel explain" id="explain"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const INIT=[22.1,35.5,24.9,31.2];
let A=[...INIT];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function renderA(marks={}){$('#rowA').innerHTML=A.map((v,i)=>`<div class="cell ${marks[i]||''}">${v}</div>`).join('');}
function renderB(arr,lbl='b',marks={}){$('#rowBWrap').style.display='flex';$('#rowBLbl').textContent=lbl;$('#rowB').innerHTML=arr.map((v,i)=>`<div class="cell ${marks[i]||''}">${v}</div>`).join('');}
function hideB(){$('#rowBWrap').style.display='none';}
function setStatus(c,m){const s=$('#status');s.className='status '+c;s.innerHTML=m;}
function ret(html){$('#ret').innerHTML=html;}
let busy=false;
async function guard(fn){if(busy)return;busy=true;await fn();busy=false;}
const PRESETS=[
 {n:'append(28.0)',ex:'<p><code>append</code> 는 값 <b>하나</b>를 끝에 붙입니다. 제자리 변경이며 반환값은 None — 결과를 변수에 받을 필요가 없습니다.</p>',
  run:async()=>{hideB();A=[...INIT];renderA();$('#code').textContent='a.append(28.0)';await sleep(400);A.push(28.0);renderA({[A.length-1]:'new'});ret('반환값: <span class="none">None</span> · a 가 직접 바뀜 (길이 4 → 5)');setStatus('ok','끝에 한 칸 추가.');}},
 {n:'append([1, 2]) 주의',ex:'<p>리스트를 append 하면 <b class="red">리스트 통째로 한 칸</b>이 됩니다. 풀어서 붙이려면 <code>extend</code>.</p>',
  run:async()=>{hideB();A=[...INIT];renderA();$('#code').textContent='a.append([1, 2])';await sleep(400);A.push('[1, 2]');renderA({[A.length-1]:'new'});ret('길이 4 → 5 — 마지막 원소가 리스트 자체');setStatus('warn','[1, 2] 가 통째로 한 원소가 됐습니다.');}},
 {n:'extend([1, 2])',ex:'<p><code>extend</code> 는 시퀀스를 <b class="green">풀어서</b> 이어 붙입니다. <code>a += [1, 2]</code> 와 같은 동작입니다.</p>',
  run:async()=>{hideB();A=[...INIT];renderA();$('#code').textContent='a.extend([1, 2])   # a += [1, 2] 와 동일';await sleep(400);A.push(1);renderA({[A.length-1]:'new'});await sleep(300);A.push(2);renderA({[A.length-1]:'new',[A.length-2]:'new'});ret('길이 4 → 6 — 원소가 낱개로 추가');setStatus('ok','두 원소가 각각 붙었습니다. append 프리셋과 비교하세요.');}},
 {n:'insert(1, 99)',ex:'<p><code>insert(i, x)</code> 는 i 번 자리에 끼워 넣고 <b class="amber">뒤 원소들을 한 칸씩 밉니다</b>. 큰 리스트 앞쪽 insert 는 느립니다.</p>',
  run:async()=>{hideB();A=[...INIT];renderA();$('#code').textContent='a.insert(1, 99)';await sleep(400);A.splice(1,0,99);const m={1:'new'};for(let i=2;i<A.length;i++)m[i]='moved';renderA(m);ret('반환값: <span class="none">None</span> · 1번 뒤 원소가 모두 밀림');setStatus('ok','1번 칸에 끼어들고 뒤가 밀렸습니다.');}},
 {n:'pop() / pop(0)',ex:'<p><code>pop</code> 은 <b class="amber">꺼낸 값을 반환</b>하는 유일한 삭제입니다. 인덱스 생략 시 마지막. 큐처럼 앞에서 꺼내려면 pop(0) — 자주 하면 <code>collections.deque</code> 권장.</p>',
  run:async()=>{hideB();A=[...INIT];renderA();$('#code').textContent='x = a.pop()      # 마지막\ny = a.pop(0)     # 0번';await sleep(400);renderA({[A.length-1]:'gone'});await sleep(500);const x=A.pop();renderA();await sleep(300);renderA({0:'gone'});await sleep(500);const y=A.shift();renderA();ret(`반환값: x = <b>${x}</b>, y = <b>${y}</b> — pop 만 값을 돌려줍니다`);setStatus('ok','인덱스 기반 삭제 + 값 반환.');}},
 {n:'remove(24.9) vs del a[1]',ex:'<p><code>remove</code> 는 <b>값</b>으로 첫 번째 일치를 지우고(없으면 ValueError), <code>del a[i]</code> 는 <b>인덱스</b>로 지웁니다. 둘 다 반환값 없음.</p>',
  run:async()=>{hideB();A=[...INIT];renderA();$('#code').textContent='a.remove(24.9)   # 값으로\ndel a[1]         # 인덱스로';await sleep(400);renderA({2:'gone'});await sleep(500);A.splice(2,1);renderA();await sleep(400);renderA({1:'gone'});await sleep(500);A.splice(1,1);renderA();ret('반환값: <span class="none">None</span> / del 은 문(statement)');setStatus('ok','값 기반 vs 인덱스 기반.');}},
 {n:'sort() — 제자리, None 반환',ex:'<p><code>sort()</code> 는 원본을 정렬하고 <b class="red">None 을 반환</b>합니다. 반환값을 쓰지 마세요.</p>',
  run:async()=>{hideB();A=[...INIT];renderA();$('#code').textContent='a.sort()';await sleep(400);A.sort((x,y)=>x-y);renderA({0:'moved',1:'moved',2:'moved',3:'moved'});ret('반환값: <span class="none">None</span> · a 자체가 정렬됨');setStatus('ok','원본이 바뀌는 제자리 정렬.');}},
 {n:'⚠ a = a.sort() 함정',ex:'<p>가장 흔한 사고. <code>sort()</code> 의 반환값 None 을 a 에 다시 대입하면 <b class="red">리스트가 사라지고 a 는 None</b> 이 됩니다. 다음 줄의 len(a) 에서 TypeError.</p>',
  run:async()=>{hideB();A=[...INIT];renderA();$('#code').innerHTML='a = a.sort()\nprint(a)\nlen(a)';await sleep(500);A.sort((x,y)=>x-y);renderA();await sleep(400);$('#rowA').innerHTML='<div class="cell gone">None</div>';ret('a 는 이제 <span class="none">None</span> — 리스트에 접근 불가');$('#code').innerHTML+='\n<span class="g">None</span>\n<span class="e">TypeError: object of type \'NoneType\' has no len()</span>';setStatus('warn','정렬은 됐지만 그 결과(None)를 a 에 덮어써 리스트를 잃었습니다. 그냥 a.sort() 만 쓰세요.');}},
 {n:'sorted(a) — 새 리스트',ex:'<p><code>sorted()</code> 는 원본을 두고 <b class="teal">정렬된 새 리스트</b>를 돌려줍니다. 원본 보존이 필요하면 이쪽. <code>reverse=True</code>, <code>key=</code> 는 내일 4교시 람다와 함께.</p>',
  run:async()=>{A=[...INIT];renderA();$('#code').textContent='b = sorted(a)\nprint(a)   # 원본 유지';await sleep(400);const B=[...A].sort((x,y)=>x-y);renderB(B,'b',Object.fromEntries(B.map((_,i)=>[i,'new'])));ret('반환값: <b>새 리스트</b> · a 는 그대로');setStatus('ok','a 원본 유지, b 에 정렬본. sort() 프리셋과 비교하세요.');}},
];
$('#presets').innerHTML=PRESETS.map(p=>`<button>${p.n}</button>`).join('');
$('#presets').querySelectorAll('button').forEach((b,i)=>b.onclick=()=>guard(async()=>{$('#presets').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));$('#explain').innerHTML=PRESETS[i].ex;await PRESETS[i].run();}));
$('#resetBtn').onclick=()=>{if(busy)return;A=[...INIT];hideB();renderA();ret('');$('#code').textContent='a = [22.1, 35.5, 24.9, 31.2]';setStatus('info','초기화했습니다.');};
A=[...INIT];renderA();$('#presets').querySelector('button').click();
</script>
</body>
</html>
