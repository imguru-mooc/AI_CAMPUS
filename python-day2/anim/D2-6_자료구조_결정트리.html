<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자료구조 선택 결정 트리 — Python Day 2</title>
<style>
  :root{--bg:#0b1220;--panel:#111a2e;--line:#1f2b45;--text:#dbe4f0;--dim:#8a9bb8;--amber:#f5b942;--teal:#2dd4bf;--blue:#60a5fa;--green:#4ade80;--red:#f87171;--purple:#c084fc;--mono:"Consolas","D2Coding","JetBrains Mono",monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR","Segoe UI",sans-serif;font-size:15px;line-height:1.55}
  .app{max-width:1100px;margin:0 auto;padding:22px 20px 40px}
  h1{color:var(--amber);font-size:24px;margin:0 0 6px}
  .sub{color:var(--dim);margin:0 0 14px}
  .pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .pill{border:1px solid;border-radius:999px;padding:4px 12px;font-size:13px;font-family:var(--mono)}
  .pill.teal{color:var(--teal);border-color:var(--teal)}.pill.amber{color:var(--amber);border-color:var(--amber)}.pill.blue{color:var(--blue);border-color:var(--blue)}.pill.green{color:var(--green);border-color:var(--green)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
  .panel h2{font-size:14px;color:var(--dim);margin:0 0 10px;font-weight:600}
  button{background:#172239;border:1px solid #2a3a5c;color:var(--text);border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--amber)}button.active{background:#3a2e12;border-color:var(--amber);color:var(--amber)}
  button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .presets{display:flex;flex-wrap:wrap;gap:8px}
  .presets button{font-size:13px;padding:7px 12px}
  .qbox{text-align:center;padding:6px 0 2px}
  .qbox .q{font-size:20px;color:var(--amber);margin:6px 0 16px;font-weight:700}
  .choices{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .choices button{font-size:16px;padding:12px 30px;border-radius:12px}
  .choices button.yes{border-color:var(--green);color:var(--green)}
  .choices button.no{border-color:var(--red);color:var(--red)}
  .crumbs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:6px;min-height:30px}
  .crumb{font-size:12px;font-family:var(--mono);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--dim)}
  .crumb b{color:var(--teal)}
  .result{text-align:center;padding:10px 0}
  .bigname{font-family:var(--mono);font-size:34px;font-weight:800;margin:6px 0}
  .lit{font-family:var(--mono);font-size:18px;color:var(--dim);margin-bottom:12px}
  .props{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
  .ex{font-size:14px;color:var(--text);max-width:640px;margin:0 auto 8px;text-align:left}
  .ex code{font-family:var(--mono);color:var(--blue);background:#0a0f1c;padding:1px 5px;border-radius:4px}
  .again{margin-top:10px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--dim);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);font-size:12px}
  td{padding:6px 8px;border-bottom:1px solid #16203a}
  td.n{font-family:var(--mono);font-weight:700}
  .status{border-radius:8px;padding:10px 12px;font-size:14px;border:1px solid var(--line);min-height:40px}
  .status.info{border-color:var(--teal);color:var(--teal);background:#0f2a27}
</style>
</head>
<body>
<div class="app">
  <h1>자료구조 선택 결정 트리</h1>
  <p class="sub">데이터의 성질 네 가지 — <b style="color:var(--amber)">키로 찾는가 · 순서가 필요한가 · 바뀌는가 · 중복을 허용하는가</b> — 만 답하면 알맞은 자료구조에 도착합니다.</p>
  <div class="pills"><span class="pill blue">list</span><span class="pill teal">tuple</span><span class="pill" style="color:var(--purple);border-color:var(--purple)">dict</span><span class="pill green">set</span></div>

  <div class="panel">
    <h2>실무 예제로 시작 (자동으로 답을 따라갑니다)</h2>
    <div class="presets" id="presets"></div>
  </div>

  <div class="panel">
    <div class="crumbs" id="crumbs"></div>
    <div id="stage"></div>
  </div>
  <div class="panel"><h2>안내</h2><div class="status info" id="status"></div></div>
  <div class="panel">
    <h2>요약 표</h2>
    <table><thead><tr><th>자료구조</th><th>순서</th><th>변경</th><th>중복</th><th>찾기</th><th>온디바이스 예</th></tr></thead>
    <tbody>
      <tr><td class="n" style="color:var(--blue)">list</td><td>O</td><td>O</td><td>O</td><td>인덱스</td><td>센서 시계열, 프레임 버퍼</td></tr>
      <tr><td class="n" style="color:var(--teal)">tuple</td><td>O</td><td>✕</td><td>O</td><td>인덱스</td><td>좌표 (x, y), 설정 상수, dict 키</td></tr>
      <tr><td class="n" style="color:var(--purple)">dict</td><td>키 기준</td><td>O</td><td>키 ✕</td><td>키 O(1)</td><td>핀 매핑, 노드별 측정 레코드</td></tr>
      <tr><td class="n" style="color:var(--green)">set</td><td>✕</td><td>O</td><td>✕</td><td>포함 O(1)</td><td>감지된 객체 ID, 중복 제거</td></tr>
    </tbody></table>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
/* 결정 트리 */
const TREE={
 q:'이름(키)으로 값을 찾아야 하나요?',
 yes:{leaf:'dict'},
 no:{q:'저장 순서가 의미 있나요? (n번째 값이 중요한가)',
   yes:{q:'만든 뒤 내용이 바뀌나요?',
     yes:{leaf:'list'},
     no:{leaf:'tuple'}},
   no:{q:'같은 값이 두 번 있어도 되나요?',
     yes:{leaf:'list',note:'순서도 중복도 다 허용하는 기본 그릇은 리스트입니다.'},
     no:{leaf:'set'}}}};
const LEAF={
 list:{c:'var(--blue)',lit:'[22.1, 23.4, 31.2]',props:['순서 O','변경 O','중복 O'],
   ex:'<div class="ex">• 1초마다 쌓이는 온도 시계열: <code>temps.append(t)</code><br>• 정렬·슬라이싱·통계의 기본 재료. 오늘 1교시의 주인공.</div>'},
 tuple:{c:'var(--teal)',lit:'("ESP32-01", 25.3)',props:['순서 O','변경 ✕','중복 O'],
   ex:'<div class="ex">• 좌표 <code>(x, y)</code>, 함수의 다중 반환값, 바뀌면 안 되는 설정<br>• 불변이라 <b>dict 의 키</b>가 될 수 있습니다.</div>'},
 dict:{c:'var(--purple)',lit:'{"LED": 3, "BTN": 5}',props:['키 조회 O(1)','키 중복 ✕','변경 O'],
   ex:'<div class="ex">• 핀 매핑, 노드 ID → 측정 레코드, JSON 전체<br>• "무엇의 값" 형태면 무조건 딕셔너리부터 떠올리세요.</div>'},
 set:{c:'var(--green)',lit:'{101, 102, 103}',props:['중복 ✕','순서 ✕','포함검사 O(1)'],
   ex:'<div class="ex">• 감지된 객체 ID 모음, 방문한 노드 기록<br>• 교집합·차집합 연산과 <code>len(set(x))</code> 중복 제거.</div>'}};
const PRESETS=[
 {n:'1초마다 온도 기록',ans:['no','yes','yes'],why:'키가 아니라 시간 순서가 중요하고, 계속 append 됩니다.'},
 {n:'GPIO 핀 이름 → 번호',ans:['yes'],why:'"LED 는 몇 번?" — 이름으로 찾는 순간 딕셔너리입니다.'},
 {n:'좌표 (x, y)',ans:['no','yes','no'],why:'x, y 순서는 중요하지만 좌표 자체는 바뀌지 않는 한 쌍입니다.'},
 {n:'감지된 객체 ID 모음',ans:['no','no','no'],why:'몇 번째로 봤는지는 무의미하고, 같은 ID 는 한 번만 세면 됩니다.'},
 {n:'노드별 측정 기록 전체',ans:['yes'],why:'노드 ID 로 찾는 dict — 그 값은 다시 list of dict (트리 뷰어 참고).'},
 {n:'직접 답해 보기',ans:null,why:''},
];
let node=TREE,trail=[],busy=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function crumbs(){$('#crumbs').innerHTML=trail.map(t=>`<span class="crumb">${t.q.slice(0,14)}… <b>${t.a==='yes'?'예':'아니오'}</b></span>`).join('');}
function renderQ(){
  crumbs();
  $('#stage').innerHTML=`<div class="qbox"><div class="q">${node.q}</div><div class="choices"><button class="yes" data-a="yes">예</button><button class="no" data-a="no">아니오</button></div></div>`;
  $('#stage').querySelectorAll('button').forEach(b=>b.onclick=()=>answer(b.dataset.a));
}
function renderLeaf(note){
  crumbs();const L=LEAF[node.leaf];
  $('#stage').innerHTML=`<div class="result"><div style="color:var(--dim);font-size:13px">도착한 자료구조</div><div class="bigname" style="color:${L.c}">${node.leaf}</div><div class="lit">${L.lit}</div><div class="props">${L.props.map(p=>`<span class="pill" style="color:${L.c};border-color:${L.c}">${p}</span>`).join('')}</div>${L.ex}${note?`<div class="ex" style="color:var(--amber)">※ ${note}</div>`:''}<button class="again" id="againBtn">처음부터 다시</button></div>`;
  $('#againBtn').onclick=reset;
}
function answer(a){
  if(!node||node.leaf||!node[a])return;
  trail.push({q:node.q,a});node=node[a];
  if(node.leaf)renderLeaf(node.note);else renderQ();
}
function reset(){node=TREE;trail=[];renderQ();setStatus('질문에 예/아니오로 답하거나, 위 실무 예제를 눌러 자동 진행을 보세요.');}
function setStatus(m){$('#status').innerHTML=m;}
async function auto(p){
  if(busy)return;busy=true;reset();setStatus(`<b>${p.n}</b> — ${p.why}`);
  for(const a of p.ans){await sleep(900);
    const btn=$('#stage').querySelector(`button[data-a="${a}"]`);if(!btn){break;}btn.classList.add('active');await sleep(450);answer(a);}
  busy=false;
}
$('#presets').innerHTML=PRESETS.map(p=>`<button>${p.n}</button>`).join('');
$('#presets').querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{$('#presets').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));const p=PRESETS[i];if(p.ans)auto(p);else{reset();setStatus('직접 답해 보세요. 7교시 과제에서 자료구조가 막히면 이 트리로 돌아오세요.');}});
reset();
</script>
</body>
</html>
