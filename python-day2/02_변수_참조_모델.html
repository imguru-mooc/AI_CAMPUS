<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>변수 · 참조 모델 — Python Day 1</title>
<style>
  :root{--bg:#0b1220;--panel:#111a2e;--line:#1f2b45;--text:#dbe4f0;--dim:#8a9bb8;--amber:#f5b942;--teal:#2dd4bf;--blue:#60a5fa;--green:#4ade80;--red:#f87171;--purple:#c084fc;--mono:"Consolas","D2Coding","JetBrains Mono",monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR","Segoe UI",sans-serif;font-size:15px;line-height:1.55}
  .app{max-width:1100px;margin:0 auto;padding:22px 20px 40px}
  h1{color:var(--amber);font-size:24px;margin:0 0 6px}
  .sub{color:var(--dim);margin:0 0 14px}
  .pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .pill{border:1px solid;border-radius:999px;padding:4px 12px;font-size:13px;font-family:var(--mono)}
  .pill.teal{color:var(--teal);border-color:var(--teal)}.pill.amber{color:var(--amber);border-color:var(--amber)}.pill.blue{color:var(--blue);border-color:var(--blue)}.pill.green{color:var(--green);border-color:var(--green)}.pill.red{color:var(--red);border-color:var(--red)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
  .panel h2{font-size:14px;color:var(--dim);margin:0 0 10px;font-weight:600}
  .presets{display:flex;flex-wrap:wrap;gap:8px}
  button{background:#172239;border:1px solid #2a3a5c;color:var(--text);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--amber)}button.active{background:#3a2e12;border-color:var(--amber);color:var(--amber)}
  button.run{background:#123d33;border-color:var(--teal);color:var(--teal);font-weight:700}
  button:disabled{opacity:.4;cursor:default}
  button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .grid{display:grid;grid-template-columns:1fr 1.5fr;gap:14px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .code{font-family:var(--mono);background:#0a0f1c;border:1px solid var(--line);border-radius:8px;padding:8px 0;font-size:15px}
  .code .ln{padding:4px 12px;display:flex;gap:12px;border-left:3px solid transparent;white-space:pre}
  .code .ln .no{color:#3f5070;width:16px;text-align:right}
  .code .ln.cur{background:#1f1a0c;border-left-color:var(--amber)}
  .code .ln.done{color:#8a9bb8}
  .stage{position:relative;min-height:330px;display:grid;grid-template-columns:150px 1fr;gap:20px}
  .col h3{font-size:13px;color:var(--dim);margin:0 0 8px;font-weight:600}
  .names{display:flex;flex-direction:column;gap:14px}
  .tag{position:relative;background:#1a2540;border:1px solid var(--blue);color:var(--blue);border-radius:6px 20px 20px 6px;padding:8px 14px;font-family:var(--mono);font-size:16px;width:110px;transition:all .35s}
  .tag.new{animation:pop .4s}
  .objs{display:flex;flex-direction:column;gap:14px}
  .obj{background:#0e1628;border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:230px;transition:all .4s;position:relative}
  .obj .t{font-size:11px;color:var(--dim);font-family:var(--mono)}
  .obj .v{font-family:var(--mono);font-size:18px;color:var(--amber)}
  .obj .id{font-size:11px;color:#3f5070;font-family:var(--mono)}
  .obj.lock::after{content:"불변";position:absolute;right:10px;top:8px;font-size:11px;color:var(--teal);border:1px solid var(--teal);border-radius:4px;padding:0 5px}
  .obj.mut::after{content:"가변";position:absolute;right:10px;top:8px;font-size:11px;color:var(--green);border:1px solid var(--green);border-radius:4px;padding:0 5px}
  .obj.new{animation:pop .4s;border-color:var(--amber)}
  .obj.garbage{opacity:.25;border-style:dashed}
  .obj.garbage .v{text-decoration:line-through}
  .obj.changed .v{color:var(--green)}
  .obj.changed{animation:flash .6s}
  svg.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  svg.arrows path{fill:none;stroke:var(--teal);stroke-width:2;stroke-linecap:round;transition:d .35s}
  @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes flash{0%{box-shadow:0 0 0 0 #4ade8088}100%{box-shadow:0 0 0 12px transparent}}
  .status{border-radius:8px;padding:10px 12px;font-size:14px;border:1px solid var(--line);min-height:44px}
  .status.ok{border-color:var(--green);color:var(--green);background:#0d2216}.status.info{border-color:var(--teal);color:var(--teal);background:#0f2a27}.status.warn{border-color:var(--red);color:var(--red);background:#2a1212}
  .out{font-family:var(--mono);background:#0a0f1c;border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:60px;font-size:14px;white-space:pre-wrap;color:var(--green)}
  .explain p{margin:6px 0}.explain b.teal{color:var(--teal)}.explain b.amber{color:var(--amber)}.explain b.green{color:var(--green)}.explain b.red{color:var(--red)}.explain b.blue{color:var(--blue)}
  .explain code{font-family:var(--mono);color:var(--blue)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  @media(prefers-reduced-motion:reduce){.tag,.obj{transition:none;animation:none}}
</style>
</head>
<body>
<div class="app">
  <h1>변수 · 참조 모델</h1>
  <p class="sub">변수는 값을 담는 상자가 아니라 값에 붙이는 이름표입니다. 한 줄씩 실행하면서 이름표와 객체가 어떻게 움직이는지 봅니다.</p>
  <div class="pills">
    <span class="pill blue">이름표 (변수)</span><span class="pill amber">객체 (값)</span><span class="pill teal">불변: 새 객체 생성</span><span class="pill green">가변: 제자리 변경</span><span class="pill red">이름을 잃은 객체 → 회수</span>
  </div>

  <div class="panel"><h2>프리셋</h2><div class="presets" id="presets"></div></div>

  <div class="grid">
    <div>
      <div class="panel">
        <h2>코드</h2>
        <div class="code" id="code"></div>
        <div class="row" style="margin-top:10px">
          <button class="run" id="stepBtn">다음 줄 실행</button>
          <button id="resetBtn">처음부터</button>
          <button id="autoBtn">자동 재생</button>
        </div>
      </div>
      <div class="panel"><h2>출력</h2><div class="out" id="out"></div></div>
    </div>
    <div>
      <div class="panel">
        <h2>메모리</h2>
        <div class="stage" id="stage">
          <div class="col"><h3>이름 공간</h3><div class="names" id="names"></div></div>
          <div class="col"><h3>객체</h3><div class="objs" id="objs"></div></div>
          <svg class="arrows" id="arrows"></svg>
        </div>
      </div>
      <div class="panel"><h2>상태</h2><div class="status info" id="status"></div></div>
    </div>
  </div>
  <div class="panel explain" id="explain"></div>
</div>

<script>
const $=s=>document.querySelector(s);
let names={}, objs=[], nextId=0, step=0, output='', flags={};
const addr=i=>'0x'+(0x7f3a1c00+i*0x30).toString(16);
function newObj(type,value,mutable=false){const o={id:nextId++,type,value,mutable,isNew:true};objs.push(o);return o;}
function alive(){const used=new Set(Object.values(names));objs.forEach(o=>o.garbage=!used.has(o.id));}

const PRESETS=[
 {name:'대입과 재대입',lines:['a = 10','print(a)','a = 20','print(a)'],
  run:[
   ()=>{const o=newObj('int',10);names.a=o.id;return ['info','<code>a = 10</code>: 정수 객체 10을 만들고 이름표 a를 붙입니다.'];},
   ()=>{output+='10\n';return ['ok','a가 가리키는 객체의 값 10을 출력합니다.'];},
   ()=>{const o=newObj('int',20);names.a=o.id;return ['info','<code>a = 20</code>: 10을 20으로 <b>바꾸는 것이 아니라</b> 새 객체 20을 만들고 이름표만 옮깁니다. 10은 이름을 잃어 회수 대상이 됩니다.'];},
   ()=>{output+='20\n';return ['ok','이제 a는 20을 가리킵니다.'];}],
  ex:'<p>Python에서 <code>=</code>는 "값을 복사해 넣기"가 아니라 <b class="blue">이름표 붙이기</b>입니다. 재대입하면 상자 안의 값이 바뀌는 게 아니라 이름표가 <b class="amber">다른 객체</b>로 옮겨갑니다.</p><p>아무 이름도 붙지 않은 객체는 Python이 알아서 메모리에서 정리합니다(가비지 컬렉션).</p>'},
 {name:'두 이름, 하나의 값',lines:['a = 10','b = a','a = 20','print(a, b)','print(a is b)'],
  run:[
   ()=>{const o=newObj('int',10);names.a=o.id;return ['info','객체 10에 이름표 a.'];},
   ()=>{names.b=names.a;return ['info','<code>b = a</code>: 값을 복사하지 않습니다. a가 가리키는 <b>같은 객체</b>에 이름표 b를 하나 더 붙입니다.'];},
   ()=>{const o=newObj('int',20);names.a=o.id;return ['info','<code>a = 20</code>: a만 새 객체로 옮깁니다. b는 여전히 10에 붙어 있습니다.'];},
   ()=>{output+='20 10\n';return ['ok','a는 20, b는 10. b는 영향을 받지 않았습니다.'];},
   ()=>{output+='False\n';return ['ok','<code>is</code>는 같은 객체인지 묻습니다. 이제 서로 다른 객체이므로 False.'];}],
  ex:'<p><code>b = a</code>는 "a의 값을 b에 복사"처럼 보이지만 실제로는 <b class="blue">같은 객체에 이름을 하나 더 붙이는 것</b>입니다. 정수처럼 <b class="teal">불변</b> 객체라면 어차피 값이 바뀌지 않으니 문제가 되지 않습니다.</p><p>이 차이가 중요해지는 순간이 Day 2의 <b class="green">리스트</b>입니다. 마지막 두 프리셋에서 미리 확인하세요.</p>'},
 {name:'문자열도 불변',lines:['s = "ESP32"','t = s','s = s + "-CAM"','print(s)','print(t)'],
  run:[
   ()=>{const o=newObj('str','"ESP32"');names.s=o.id;return ['info','문자열 객체에 이름표 s.'];},
   ()=>{names.t=names.s;return ['info','같은 문자열에 이름표 t 추가.'];},
   ()=>{const o=newObj('str','"ESP32-CAM"');names.s=o.id;return ['info','<code>s + "-CAM"</code>은 기존 문자열을 늘리지 않고 <b>새 문자열</b>을 만듭니다. s만 새 객체로 이동.'];},
   ()=>{output+='ESP32-CAM\n';return ['ok','s는 새 문자열.'];},
   ()=>{output+='ESP32\n';return ['ok','t는 원래 문자열 그대로. 문자열 메서드가 항상 "새 문자열을 반환"하는 이유입니다.'];}],
  ex:'<p>문자열은 <b class="teal">불변</b>입니다. <code>s + "-CAM"</code>, <code>s.upper()</code>, <code>s.strip()</code> 모두 원본을 고치지 않고 <b class="amber">새 객체</b>를 돌려줍니다. 그래서 결과를 다시 변수에 대입해야 합니다: <code>s = s.strip()</code>.</p>'},
 {name:'[Day 2 예고] 리스트 참조 공유',lines:['a = [1, 2, 3]','b = a','b.append(4)','print(a)','print(a is b)'],
  run:[
   ()=>{const o=newObj('list','[1, 2, 3]',true);names.a=o.id;return ['info','리스트 객체에 이름표 a. 리스트는 <b>가변</b>입니다.'];},
   ()=>{names.b=names.a;return ['info','같은 리스트에 이름표 b. 복사가 아닙니다.'];},
   ()=>{const o=objs[names.b];o.value='[1, 2, 3, 4]';o.changed=true;return ['warn','<code>b.append(4)</code>: 새 객체를 만들지 않고 <b>그 자리에서</b> 리스트를 바꿉니다. a도 같은 객체를 보고 있습니다.'];},
   ()=>{output+='[1, 2, 3, 4]\n';return ['warn','a를 건드리지 않았는데 a도 바뀌어 있습니다. 초보자가 가장 자주 만나는 함정.'];},
   ()=>{output+='True\n';return ['ok','a와 b는 같은 객체입니다.'];}],
  ex:'<p>정수·문자열과 달리 리스트는 <b class="green">가변</b>입니다. <code>append</code>, <code>[i] = x</code>, <code>sort()</code>는 새 객체를 만들지 않고 <b>제자리에서</b> 고칩니다. 그 객체에 붙은 다른 이름표에서도 변화가 보입니다.</p><p>독립된 복사본이 필요하면 <code>b = a.copy()</code>를 씁니다. 다음 프리셋에서 비교하세요.</p>'},
 {name:'[Day 2 예고] 리스트 복사',lines:['a = [1, 2, 3]','b = a.copy()','b.append(4)','print(a)','print(b)'],
  run:[
   ()=>{const o=newObj('list','[1, 2, 3]',true);names.a=o.id;return ['info','리스트에 이름표 a.'];},
   ()=>{const o=newObj('list','[1, 2, 3]',true);names.b=o.id;return ['info','<code>a.copy()</code>는 내용이 같은 <b>새 리스트</b>를 만듭니다. b는 다른 객체.'];},
   ()=>{const o=objs[names.b];o.value='[1, 2, 3, 4]';o.changed=true;return ['info','b가 가리키는 객체만 바뀝니다.'];},
   ()=>{output+='[1, 2, 3]\n';return ['ok','a는 그대로.'];},
   ()=>{output+='[1, 2, 3, 4]\n';return ['ok','b만 변경. <code>a[:]</code>, <code>list(a)</code>도 같은 효과입니다.'];}],
  ex:'<p><code>copy()</code>, <code>a[:]</code>, <code>list(a)</code>는 겉 리스트를 복제합니다(<b class="teal">얕은 복사</b>). 리스트 안에 또 리스트가 있으면 안쪽은 여전히 공유되므로, 그때는 <code>copy.deepcopy()</code>가 필요합니다. 다음 두 프리셋에서 확인하세요.</p>'},
 {name:'[Day 2] 중첩 리스트 얕은 복사',lines:['inner = [10, 20]','a = [inner, 3]','b = a.copy()','b[0].append(30)','print(a[0])'],
  run:[
   ()=>{const o=newObj('list','[10, 20]',true);names.inner=o.id;flags.inner=o.id;return ['info','안쪽 리스트 객체를 만듭니다.'];},
   ()=>{const o=newObj('list','[ →, 3 ]',true);o.refs=[flags.inner];names.a=o.id;return ['info','바깥 리스트 a. 첫 칸은 값이 아니라 <b>안쪽 리스트를 가리키는 참조</b>(보라 화살표)입니다.'];},
   ()=>{const o=newObj('list','[ →, 3 ]',true);o.refs=[flags.inner];names.b=o.id;return ['warn','<code>copy()</code>는 <b>겉 리스트만</b> 복제합니다. 새 리스트의 첫 칸도 <b>같은 안쪽 리스트</b>를 가리킵니다 — 이것이 얕은 복사.'];},
   ()=>{const o=objs[flags.inner];o.value='[10, 20, 30]';o.changed=true;return ['warn','b[0] 를 통해 안쪽 리스트를 고치면, a[0] 에서도 같은 객체가 보입니다.'];},
   ()=>{output+='[10, 20, 30]\n';return ['warn','a 를 건드리지 않았는데 a[0] 이 바뀌어 있습니다.'];}],
  ex:'<p><code>copy()</code> · <code>a[:]</code> · <code>list(a)</code> 는 <b class="teal">얕은 복사</b> — 겉 상자만 새로 만들고 <b class="purple">안쪽 참조는 그대로 공유</b>합니다. 1교시 실습의 <code>[[0]*3]*2</code> 함정도 같은 원리입니다.</p>'},
 {name:'[Day 2] deepcopy',lines:['import copy','a = [[10, 20], 3]','b = copy.deepcopy(a)','b[0].append(30)','print(a[0], b[0])'],
  run:[
   ()=>{return ['info','copy 모듈을 가져옵니다.'];},
   ()=>{const inner=newObj('list','[10, 20]',true);flags.i1=inner.id;const o=newObj('list','[ →, 3 ]',true);o.refs=[inner.id];names.a=o.id;return ['info','중첩 리스트 a.'];},
   ()=>{const inner2=newObj('list','[10, 20]',true);flags.i2=inner2.id;const o=newObj('list','[ →, 3 ]',true);o.refs=[inner2.id];names.b=o.id;return ['ok','<code>deepcopy</code>는 <b>안쪽까지 전부</b> 새로 만듭니다. 화살표가 서로 다른 안쪽 리스트를 가리킵니다.'];},
   ()=>{const o=objs[flags.i2];o.value='[10, 20, 30]';o.changed=true;return ['info','b 쪽 안쪽 리스트만 바뀝니다.'];},
   ()=>{output+='[10, 20] [10, 20, 30]\n';return ['ok','a 는 완전히 독립 — 겉과 속이 모두 분리된 깊은 복사입니다.'];}],
  ex:'<p><b class="green">deepcopy</b> 는 트리 전체를 재귀적으로 복제합니다. 안전하지만 느리므로, 중첩이 없다면 얕은 복사로 충분합니다. "내 데이터가 몇 층인가"를 먼저 보세요 (트리 뷰어 참고).</p>'},
];
let active=0, timer=null;

function renderPresets(){$('#presets').innerHTML=PRESETS.map((p,i)=>`<button data-i="${i}" class="${i===active?'active':''}">${p.name}</button>`).join('');$('#presets').querySelectorAll('button').forEach(b=>b.onclick=()=>load(+b.dataset.i));}
function renderCode(){const p=PRESETS[active];$('#code').innerHTML=p.lines.map((l,i)=>`<div class="ln ${i===step?'cur':(i<step?'done':'')}"><span class="no">${i+1}</span>${l.replace(/</g,'&lt;')}</div>`).join('');}
function renderMem(){
  alive();
  $('#names').innerHTML=Object.keys(names).map(n=>`<div class="tag" id="n_${n}">${n}</div>`).join('');
  $('#objs').innerHTML=objs.map(o=>`<div class="obj ${o.mutable?'mut':'lock'} ${o.isNew?'new':''} ${o.garbage?'garbage':''} ${o.changed?'changed':''}" id="o_${o.id}"><div class="t">${o.type}</div><div class="v">${o.value}</div><div class="id">id ${addr(o.id)}</div></div>`).join('');
  objs.forEach(o=>{o.isNew=false;o.changed=false;});
  requestAnimationFrame(drawArrows);
}
function drawArrows(){
  const svg=$('#arrows'),st=$('#stage').getBoundingClientRect();let h='';
  h+='<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2dd4bf"/></marker></defs>';
  h+='<defs><marker id="ahp" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c084fc"/></marker></defs>';
  for(const n in names){const a=document.getElementById('n_'+n),b=document.getElementById('o_'+names[n]);if(!a||!b)continue;
    const ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect();
    const x1=ra.right-st.left,y1=ra.top+ra.height/2-st.top,x2=rb.left-st.left,y2=rb.top+rb.height/2-st.top;
    h+=`<path d="M${x1},${y1} C${x1+40},${y1} ${x2-40},${y2} ${x2},${y2}" marker-end="url(#ah)"/>`;}
  objs.forEach(o=>{(o.refs||[]).forEach(rid=>{const a=document.getElementById('o_'+o.id),b=document.getElementById('o_'+rid);if(!a||!b)return;
    const ra=a.getBoundingClientRect(),rb=b.getBoundingClientRect();
    const x1=ra.right-st.left,y1=ra.top+ra.height/2-st.top,x2=rb.left-st.left,y2=rb.top+rb.height/2-st.top;
    h+=`<path d="M${x1},${y1} C${x1+34},${y1} ${x2-34},${y2} ${x2},${y2}" stroke="#c084fc" marker-end="url(#ahp)"/>`;});});
  svg.innerHTML=h;
}
function setStatus(c,m){const s=$('#status');s.className='status '+c;s.innerHTML=m;}
function load(i){clearInterval(timer);timer=null;$('#autoBtn').textContent='자동 재생';active=i;names={};objs=[];nextId=0;step=0;output='';flags={};
  renderPresets();renderCode();renderMem();$('#out').textContent='';$('#explain').innerHTML=PRESETS[i].ex;$('#stepBtn').disabled=false;setStatus('info','"다음 줄 실행"을 누르세요. 노란 줄이 지금 실행할 줄입니다.');}
function doStep(){const p=PRESETS[active];if(step>=p.lines.length)return;const [c,m]=p.run[step]();step++;renderCode();renderMem();$('#out').textContent=output;setStatus(c,m);
  if(step>=p.lines.length){$('#stepBtn').disabled=true;clearInterval(timer);timer=null;$('#autoBtn').textContent='자동 재생';}}
$('#stepBtn').onclick=doStep;$('#resetBtn').onclick=()=>load(active);
$('#autoBtn').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('#autoBtn').textContent='자동 재생';return;}if(step>=PRESETS[active].lines.length)load(active);$('#autoBtn').textContent='정지';doStep();timer=setInterval(doStep,1500);};
window.addEventListener('resize',drawArrows);
load(0);
</script>
