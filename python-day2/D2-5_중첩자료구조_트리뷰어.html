<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중첩 자료구조 트리 뷰어 — Python Day 2</title>
<style>
  :root{--bg:#0b1220;--panel:#111a2e;--line:#1f2b45;--text:#dbe4f0;--dim:#8a9bb8;--amber:#f5b942;--teal:#2dd4bf;--blue:#60a5fa;--green:#4ade80;--red:#f87171;--purple:#c084fc;--mono:"Consolas","D2Coding","JetBrains Mono",monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR","Segoe UI",sans-serif;font-size:15px;line-height:1.55}
  .app{max-width:1100px;margin:0 auto;padding:22px 20px 40px}
  h1{color:var(--amber);font-size:24px;margin:0 0 6px}
  .sub{color:var(--dim);margin:0 0 14px}
  .pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .pill{border:1px solid;border-radius:999px;padding:4px 12px;font-size:13px;font-family:var(--mono)}
  .pill.teal{color:var(--teal);border-color:var(--teal)}.pill.amber{color:var(--amber);border-color:var(--amber)}.pill.blue{color:var(--blue);border-color:var(--blue)}.pill.red{color:var(--red);border-color:var(--red)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
  .panel h2{font-size:14px;color:var(--dim);margin:0 0 10px;font-weight:600}
  .presets{display:flex;flex-wrap:wrap;gap:8px}
  button{background:#172239;border:1px solid #2a3a5c;color:var(--text);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--amber)}button.active{background:#3a2e12;border-color:var(--amber);color:var(--amber)}
  button.run{background:#123d33;border-color:var(--teal);color:var(--teal);font-weight:700}
  button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .grid{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .tree{font-family:var(--mono);font-size:14px;line-height:1.9}
  .node{padding:1px 6px;border-radius:6px;border:1px solid transparent;transition:all .25s;display:inline-block}
  .node.path{border-color:var(--teal);background:#0f2a27;color:var(--teal)}
  .node.dest{border-color:var(--green);background:#0d2216;color:var(--green);font-weight:700}
  .tk{color:var(--purple)} .tv{color:var(--amber)} .ts{color:var(--teal)} .idx{color:var(--blue)}
  .indent{color:#3f5070}
  .expr{font-family:var(--mono);font-size:17px;background:#0a0f1c;border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:46px}
  .expr .seg{padding:1px 2px;border-radius:4px}
  .expr .seg.cur{background:#3a2e12;outline:1px solid var(--amber)}
  .expr .seg.done{color:var(--teal)}
  .out{font-family:var(--mono);background:#0a0f1c;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:16px;min-height:46px}
  .out.ok{color:var(--green)}.out.err{color:var(--red)}
  .out .ty{font-size:12px;color:var(--dim);margin-left:10px}
  .status{border-radius:8px;padding:10px 12px;font-size:14px;border:1px solid var(--line);min-height:44px}
  .status.ok{border-color:var(--green);color:var(--green);background:#0d2216}.status.info{border-color:var(--teal);color:var(--teal);background:#0f2a27}.status.warn{border-color:var(--red);color:var(--red);background:#2a1212}
  .explain p{margin:6px 0}.explain b.teal{color:var(--teal)}.explain b.amber{color:var(--amber)}.explain b.green{color:var(--green)}.explain b.red{color:var(--red)}.explain b.blue{color:var(--blue)}
  .explain code{font-family:var(--mono);color:var(--blue)}
</style>
</head>
<body>
<div class="app">
  <h1>중첩 자료구조 트리 뷰어</h1>
  <p class="sub">JSON 센서 데이터는 <b style="color:var(--purple)">dict</b> 안에 <b style="color:var(--blue)">list</b>, 그 안에 다시 dict 가 겹쳐 있습니다. 접근식의 대괄호 하나가 트리에서 한 층 내려가는 것과 같습니다.</p>
  <div class="pills"><span class="pill" style="color:var(--purple);border-color:var(--purple)">"키" → dict 층</span><span class="pill blue">[숫자] → list 층</span><span class="pill teal">경로</span><span class="pill amber">도착한 값</span><span class="pill red">잘못된 층 → KeyError / IndexError / TypeError</span></div>

  <div class="panel"><h2>접근식 프리셋</h2><div class="presets" id="presets"></div>
    <div style="margin-top:10px"><button class="run" id="playBtn">한 층씩 내려가기</button></div>
  </div>

  <div class="grid">
    <div class="panel"><h2>nodes (data/nodes.json)</h2><div class="tree" id="tree"></div></div>
    <div>
      <div class="panel"><h2>접근식</h2><div class="expr" id="expr"></div></div>
      <div class="panel"><h2>결과</h2><div class="out" id="out">—</div></div>
      <div class="panel"><h2>상태</h2><div class="status info" id="status">프리셋을 고르고 "한 층씩 내려가기"를 누르세요.</div></div>
    </div>
  </div>
  <div class="panel explain" id="explain"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const DATA={"ESP32-01":{loc:"gate",readings:[{T:25.3,H:60,D:120},{T:26.1,H:58,D:118}]},
            "ESP32-02":{loc:"lab", readings:[{T:36.9,H:70,D:150},{T:29.8,H:66,D:140}]},
            "ESP32-03":{loc:"roof",readings:[{T:25.1,H:48,D:210}]}};
/* 트리 렌더: 각 노드에 경로 id 부여 */
function pid(path){return 'n_'+path.join('_').replace(/[^\w]/g,'x');}
function renderTree(){
  const pad=n=>`<span class="indent">${'│  '.repeat(n)}</span>`;
  let h='';
  h+=`<div><span class="node" id="${pid([])}">nodes</span> <span class="ts">dict</span></div>`;
  Object.entries(DATA).forEach(([nid,node])=>{
    h+=`<div>${pad(1)}<span class="node" id="${pid([nid])}"><span class="tk">"${nid}"</span></span> <span class="ts">dict</span></div>`;
    h+=`<div>${pad(2)}<span class="node" id="${pid([nid,'loc'])}"><span class="tk">"loc"</span> : <span class="tv">"${node.loc}"</span></span></div>`;
    h+=`<div>${pad(2)}<span class="node" id="${pid([nid,'readings'])}"><span class="tk">"readings"</span></span> <span class="ts">list, len ${node.readings.length}</span></div>`;
    node.readings.forEach((r,i)=>{
      h+=`<div>${pad(3)}<span class="node" id="${pid([nid,'readings',i])}"><span class="idx">[${i}]</span></span> <span class="ts">dict</span></div>`;
      h+=`<div>${pad(4)}${Object.entries(r).map(([k,v])=>`<span class="node" id="${pid([nid,'readings',i,k])}"><span class="tk">"${k}"</span>: <span class="tv">${v}</span></span>`).join('  ')}</div>`;
    });
  });
  $('#tree').innerHTML=h;
}
function clearHl(){document.querySelectorAll('.node').forEach(n=>n.classList.remove('path','dest'));}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let busy=false,cur=0;
const PRESETS=[
 {n:'노드 하나 nodes["ESP32-01"]',steps:['ESP32-01'],ex:'<p>첫 대괄호는 최상위 dict 의 키 조회입니다. 결과는 그 노드 전체(dict) — 아직 값이 아니라 <b class="teal">한 층 아래의 구조</b>입니다.</p>'},
 {n:'위치 ...["loc"]',steps:['ESP32-01','loc'],ex:'<p>dict 안의 dict — 대괄호를 이어 붙이면 됩니다. 도착한 값은 문자열입니다.</p>'},
 {n:'첫 측정 T ...["readings"][0]["T"]',steps:['ESP32-01','readings',0,'T'],ex:'<p>가장 중요한 형태: <b class="amber">dict → list → dict</b> 3층. <code>"readings"</code> 는 키(따옴표), <code>[0]</code> 은 리스트 인덱스(숫자), <code>"T"</code> 는 다시 키. 층의 자료형에 맞는 대괄호를 써야 합니다.</p>'},
 {n:'두 번째 측정 H ...[1]["H"]',steps:['ESP32-02','readings',1,'H'],ex:'<p>같은 경로 문법으로 다른 노드·다른 인덱스에 접근합니다. 반복문과 결합하면: <code>for r in nodes[nid]["readings"]: r["T"]</code></p>'},
 {n:'✕ 없는 키 ["ESP32-09"]',steps:['ESP32-09'],err:['KeyError',"'ESP32-09'"],ex:'<p>dict 층에서 없는 키 → <b class="red">KeyError</b>. 방어는 <code>.get()</code> 또는 <code>in</code>.</p>'},
 {n:'✕ 없는 인덱스 [5]',steps:['ESP32-03','readings',5],err:['IndexError','list index out of range'],ex:'<p>list 층에서 범위 밖 인덱스 → <b class="red">IndexError</b>. ESP32-03 의 readings 는 1개뿐입니다. <code>len()</code> 으로 먼저 확인하거나 for 로 순회하세요.</p>'},
 {n:'✕ 층 착각 ["readings"]["T"]',steps:['ESP32-01','readings','T'],err:['TypeError','list indices must be integers or slices, not str'],ex:'<p>readings 는 <b class="blue">list</b> 인데 문자열 키를 쓰면 <b class="red">TypeError</b>. "지금 몇 층에 있고 그 층이 무슨 자료형인지"를 아는 것이 중첩 구조의 전부입니다. 트리 뷰어로 층을 먼저 확인하세요.</p>'},
];
function exprHtml(steps,hlIdx,doneUpto){
  let segs=[`<span class="seg ${doneUpto>=-1&&hlIdx===-1?'cur':''}">nodes</span>`];
  steps.forEach((s,i)=>{const txt=typeof s==='number'?`[${s}]`:`["${s}"]`;
    segs.push(`<span class="seg ${i===hlIdx?'cur':(i<=doneUpto?'done':'')}">${txt}</span>`);});
  return segs.join('');
}
async function play(){
  if(busy)return;busy=true;const p=PRESETS[cur];clearHl();
  $('#out').className='out';$('#out').textContent='—';
  const path=[];
  document.getElementById(pid([])).classList.add('path');
  $('#expr').innerHTML=exprHtml(p.steps,-1,-2);
  setStatus('info','최상위 nodes (dict) 에서 출발.');
  await sleep(650);
  let ref=DATA;let failed=false;
  for(let i=0;i<p.steps.length;i++){
    const s=p.steps[i];$('#expr').innerHTML=exprHtml(p.steps,i,i-1);
    const isLast=i===p.steps.length-1;
    // check error preset
    const errNow=p.err&&isLast;
    if(!errNow){
      path.push(s);const el=document.getElementById(pid(path));
      if(el)el.classList.add(isLast?'dest':'path');
      ref=typeof s==='number'?ref[s]:(ref[s]!==undefined?ref[s]:(ref.readings?ref.readings:ref));
      // maintain ref properly
    }
    const kind=typeof s==='number'?`리스트 인덱스 [${s}]`:`딕셔너리 키 "${s}"`;
    if(errNow){setStatus('warn',`${kind} 에서 실패!`);await sleep(500);
      $('#out').className='out err';$('#out').textContent=`${p.err[0]}: ${p.err[1]}`;
      setStatus('warn',`<b>${p.err[0]}</b> — ${p.err[0]==='TypeError'?'층의 자료형과 대괄호 종류가 맞지 않습니다':'그 층에 해당 항목이 없습니다'}.`);
      failed=true;break;}
    setStatus('info',`${kind} 로 한 층 아래로.`);
    await sleep(650);
  }
  if(!failed){
    // resolve actual value
    let v=DATA;for(const s of p.steps)v=v[s];
    $('#expr').innerHTML=exprHtml(p.steps,-9,p.steps.length-1);
    const ty=Array.isArray(v)?'list':typeof v==='object'?'dict':typeof v==='number'?(Number.isInteger(v)?'int':'float'):'str';
    $('#out').className='out ok';$('#out').innerHTML=(ty==='dict'?JSON.stringify(v).slice(0,60)+(JSON.stringify(v).length>60?'…':''):Array.isArray(v)?`list(len ${v.length})`:typeof v==='string'?`"${v}"`:v)+`<span class="ty">${ty}</span>`;
    setStatus('ok',`도착. 대괄호 ${p.steps.length}개 = ${p.steps.length}층 내려왔습니다.`);
  }
  busy=false;
}
function setStatus(c,m){const s=$('#status');s.className='status '+c;s.innerHTML=m;}
$('#playBtn').onclick=play;
$('#presets').innerHTML=PRESETS.map(p=>`<button>${p.n}</button>`).join('');
$('#presets').querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{if(busy)return;$('#presets').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));cur=i;$('#explain').innerHTML=PRESETS[i].ex;clearHl();$('#expr').innerHTML=exprHtml(PRESETS[i].steps,-9,-2);$('#out').className='out';$('#out').textContent='—';setStatus('info','"한 층씩 내려가기"를 누르세요.');});
renderTree();$('#presets').querySelector('button').click();play();
</script>
</body>
</html>
