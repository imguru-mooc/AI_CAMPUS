  <div class="list">
<button data-id="d1-1" aria-current="false"><span class="p">1교시</span><span class="no">D1-1</span><span class="tt">모델 다이어트</span><span class="d">SimpleConvNet 433,890 · MobileNetV3-Small 2,542,856 · YOLOv8n 3,193,934 · FP32 4 B → FP16 2 B → INT8 1 B → INT4 0.5 B · 크기 1/4 ≠ 속도 4배 · 크기 · 속도 · 정확도 한 표</span></button>
<button data-id="d1-2" aria-current="false"><span class="p">2교시</span><span class="no">D1-2</span><span class="tt">비트로 숫자 담기</span><span class="d">FP32 부호 1 · 지수 8 · 가수 23 · FP16 1 · 5 · 10 (최대 65,504) · 0.1 → 0.09998 · 1000.1 → 1000 · 70000 → inf · astype(int8) 200 → −56 · round → clip → astype · int8 100×100 = 16</span></button>
<button data-id="d1-3" aria-current="false"><span class="p">3교시</span><span class="no">D1-3</span><span class="tt">scale · zero-point 조절기</span><span class="d">[−1, 3] → UINT8: scale 4/255 = 0.01569 · zp 64 · 1.234 → q 143 → 1.2392 · 범위 안 |오차| ≤ scale/2 · 범위 밖 4.0 → 2.996 (clipping) · 0 포함해야 0 → 0 · 4비트 scale 0.2667</span></button>
<button data-id="d1-4" aria-current="false"><span class="p">4교시</span><span class="no">D1-4</span><span class="tt">대칭 · 비대칭 비교</span><span class="d">대칭 scale = max|x|/127 · zp 0 · −127~127 · 비대칭 UINT8 0~255 · ReLU 출력 실측 MSE 5.1배 차이 · weight 실측 1.20배 · 치우친 weight SHIFT 0.3 → 2.55배</span></button>
<button data-id="d1-5" aria-current="false"><span class="p">5교시</span><span class="no">D1-5</span><span class="tt">per-tensor vs per-channel</span><span class="d">conv.weight (30, 1, 5, 5) · per-tensor scale 0.003798 하나 · per-channel 30개 0.0016 ~ 0.0038 · reshape(30, −1).max(1) · sc[:, None, None, None] · conv 1.91배 · fc1 2.63배 · 튀는 필터 ×10 → 18배</span></button>
<button data-id="d1-6" aria-current="false"><span class="p">6교시</span><span class="no">D1-6</span><span class="tt">clip 범위 슬라이더</span><span class="d">MinMax 2.137 · 99.9% 1.607 (넘는 값 0.1%) · 반올림 오차 vs 잘림 오차 · 최적 clip 8bit 0.97×max · 4bit 0.71×max · outlier ×20 → 나머지 값 Percentile 42배 정확 · 전체 MSE 는 MinMax 가 낮음</span></button>
<button data-id="d1-7" aria-current="false"><span class="p">7교시</span><span class="no">D1-7</span><span class="tt">정수 행렬곱</span><span class="d">y = s_w s_x (W_q x_q + b_q) · INT8 × INT8 → INT32 누적 · acc ±65,000 > INT16 32,767 · b_q = round(b / (s_x s_w)) INT32 · fc2 실측 최대 차이 0.10 · 일치율 1.00 · requantize M = s_x s_w / s_y</span></button>

&lt;body&gt;
&lt;div class=&quot;app&quot;&gt;
&lt;h1&gt;모델 다이어트 — 숫자 하나의 byte 를 줄이면&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;모델 크기 = &lt;b style=&quot;color:var(--amber)&quot;&gt;파라미터 수 × 숫자 하나의 byte&lt;/b&gt;. 모델과 자료형을 골라 크기가 어떻게 변하는지 보세요. 아래 &#x27;장치 메모리&#x27; 는 가중치가 차지하는 칸을 보여 줍니다.&lt;/p&gt;
&lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill teal&quot;&gt;FP32 4 B · FP16 2 B · INT8 1 B&lt;/span&gt;&lt;span class=&quot;pill amber&quot;&gt;SimpleConvNet 1.74 MB → 0.43 MB&lt;/span&gt;&lt;span class=&quot;pill blue&quot;&gt;MobileNetV3-Small 10.17 MB → 2.54 MB&lt;/span&gt;&lt;span class=&quot;pill red&quot;&gt;크기 1/4 ≠ 속도 4배&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;
  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;① 모델 고르기 → ② 자료형 고르기&lt;/h2&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;lab&quot;&gt;모델&lt;/span&gt;&lt;div class=&quot;seg&quot; id=&quot;mdl&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;lab&quot;&gt;자료형&lt;/span&gt;&lt;div class=&quot;seg&quot; id=&quot;dt&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;bars&quot; id=&quot;bars&quot; style=&quot;margin-top:12px&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;lab&quot; style=&quot;margin-top:14px&quot;&gt;장치 메모리 (예시: 한 칸 = 0.5 MB, 16 MB)&lt;/div&gt;

&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;가중치를 한 번 읽는 시간 (예시) — 대역폭이 같다면 byte 가 적을수록 빨리 읽는다&lt;/h2&gt;

&lt;script&gt;

const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];
const RM=window.matchMedia&amp;&amp;window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,RM?Math.min(ms,80):ms));

function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const g=c.getContext(&#x27;2d&#x27;);g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}
function initPresets(P,stop){$(&#x27;#presets&#x27;).innerHTML=P.map(p=&gt;`&lt;button type=&quot;button&quot;&gt;${p.n}&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}
const esc=s=&gt;String(s).replace(/&amp;/g,&#x27;&amp;amp;&#x27;).replace(/&lt;/g,&#x27;&amp;lt;&#x27;).replace(/&gt;/g,&#x27;&amp;gt;&#x27;);
const fmt=n=&gt;n.toLocaleString(&#x27;en-US&#x27;);
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
window.__d1={};

const M={&#x27;SimpleConvNet&#x27;:433890,&#x27;MobileNetV3-Small&#x27;:2542856,&#x27;YOLOv8n&#x27;:3193934};
const D=[[&#x27;FP32&#x27;,4,&#x27;#60a5fa&#x27;],[&#x27;FP16&#x27;,2,&#x27;#c084fc&#x27;],[&#x27;INT8&#x27;,1,&#x27;#2dd4bf&#x27;],[&#x27;INT4&#x27;,0.5,&#x27;#f5b942&#x27;]];
let mdl=&#x27;SimpleConvNet&#x27;, dt=&#x27;FP32&#x27;;
$(&#x27;#mdl&#x27;).innerHTML=Object.keys(M).map(k=&gt;`&lt;button type=&quot;button&quot; data-k=&quot;${k}&quot;&gt;${k}&lt;/button&gt;`).join(&#x27;&#x27;);
$(&#x27;#dt&#x27;).innerHTML=D.map(d=&gt;`&lt;button type=&quot;button&quot; data-k=&quot;${d[0]}&quot;&gt;${d[0]} (${d[1]} B)&lt;/button&gt;`).join(&#x27;&#x27;);
$(&#x27;#mem&#x27;).innerHTML=&#x27;&lt;i&gt;&lt;/i&gt;&#x27;.repeat(32);
const mb=(m,b)=&gt;M[m]*b/1e6;
function draw(){
  $$(&#x27;#mdl button&#x27;).forEach(b=&gt;b.classList.toggle(&#x27;sel&#x27;,b.dataset.k===mdl));
  $$(&#x27;#dt button&#x27;).forEach(b=&gt;b.classList.toggle(&#x27;sel&#x27;,b.dataset.k===dt));
  const mx=mb(mdl,4);
  $(&#x27;#bars&#x27;).innerHTML=D.map(d=&gt;{const v=mb(mdl,d[1]);return `&lt;div class=&quot;bar ${d[0]===dt?&#x27;cur&#x27;:&#x27;&#x27;}&quot;&gt;&lt;span class=&quot;lab0&quot; style=&quot;color:${d[0]===dt?&#x27;var(--amber)&#x27;:&#x27;var(--dim)&#x27;}&quot;&gt;${d[0]}&lt;/span&gt;&lt;div class=&quot;tr&quot;&gt;&lt;div class=&quot;fl&quot; style=&quot;width:${v/mx*100}%;background:${d[2]}&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;b&gt;${v.toFixed(2)} MB&lt;/b&gt;&lt;/div&gt;`;}).join(&#x27;&#x27;);
  const b=D.find(d=&gt;d[0]===dt)[1], v=mb(mdl,b), cells=Math.ceil(v/0.5);
  $$(&#x27;#mem i&#x27;).forEach((e,i)=&gt;e.classList.toggle(&#x27;on&#x27;,i&lt;cells));
  const bw=+$(&#x27;#bw&#x27;).value;$(&#x27;#obw&#x27;).textContent=bw+&#x27; GB/s&#x27;;
  $(&#x27;#rd&#x27;).innerHTML=D.map(d=&gt;`&lt;span&gt;${d[0]}&lt;/span&gt;&lt;b&gt;${(mb(mdl,d[1])/1000/bw*1000).toFixed(3)} ms&lt;/b&gt;`).join(&#x27;&#x27;);
  const r=4/b;
  setCode([`n_params = sum(p.numel() for p in m.parameters())`,`&lt;span class=&quot;b&quot;&gt;# → ${fmt(M[mdl])}&lt;/span&gt;`,
   `BYTES = {&quot;FP32&quot;: 4, &quot;FP16&quot;: 2, &quot;INT8&quot;: 1}`,
   `size_mb = n_params * &lt;span class=&quot;hl&quot;&gt;${b}&lt;/span&gt; / 1e6  &lt;span class=&quot;b&quot;&gt;# ${v.toFixed(3)} MB&lt;/span&gt;`,
   `ratio = fp32 / ${dt.toLowerCase()}  &lt;span class=&quot;b&quot;&gt;# ${r} 배&lt;/span&gt;`].join(&#x27;\n&#x27;));
  setStatus(b&lt;4?&#x27;ok&#x27;:&#x27;info&#x27;,`${mdl} · ${dt}: ${fmt(M[mdl])} × ${b} B = ${v.toFixed(2)} MB  (FP32 의 1/${r})\n장치 메모리 ${cells} 칸 / 32 칸`);
}
$$(&#x27;#mdl button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(busy)return;mdl=b.dataset.k;draw();});
$$(&#x27;#dt button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(busy)return;dt=b.dataset.k;draw();});
$(&#x27;#bw&#x27;).oninput=draw;
function stop(){}
const P=[
 {n:&#x27;① SimpleConvNet FP32 → INT8&#x27;,ex:&#x27;&lt;p&gt;SimpleConvNet 은 파라미터 &lt;b class=&quot;amber&quot;&gt;433,890&lt;/b&gt; 개. FP32 는 숫자 하나에 4 byte → &lt;b&gt;1.74 MB&lt;/b&gt;, INT8 은 1 byte → &lt;b class=&quot;teal&quot;&gt;0.43 MB&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;모델 구조는 그대로이고 &lt;b&gt;숫자를 담는 그릇&lt;/b&gt;만 작아졌습니다. 이것이 양자화입니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{mdl=&#x27;SimpleConvNet&#x27;;for(const d of [&#x27;FP32&#x27;,&#x27;FP16&#x27;,&#x27;INT8&#x27;]){dt=d;draw();await sleep(900);}}},
 {n:&#x27;② 세 모델 비교&#x27;,ex:&#x27;&lt;p&gt;MobileNetV3-Small 2,542,856 개 → FP32 &lt;b&gt;10.17 MB&lt;/b&gt; / INT8 &lt;b class=&quot;teal&quot;&gt;2.54 MB&lt;/b&gt;. YOLOv8n (OT Day 5 의 yolov8n.onnx 안 가중치 3,193,934 개) → 12.78 MB / 3.19 MB.&lt;/p&gt;&lt;p&gt;모델이 클수록 줄어드는 MB 도 큽니다. 장치 메모리 칸이 얼마나 비는지 보세요.&lt;/p&gt;&#x27;,
  run:async()=&gt;{dt=&#x27;FP32&#x27;;for(const m of Object.keys(M)){mdl=m;draw();await sleep(700);}dt=&#x27;INT8&#x27;;for(const m of Object.keys(M)){mdl=m;draw();await sleep(700);}}},
 {n:&#x27;③ INT4 까지&#x27;,ex:&#x27;&lt;p&gt;INT4 는 숫자 하나에 0.5 byte → FP32 의 1/8. 하지만 담을 수 있는 서로 다른 값은 &lt;b class=&quot;red&quot;&gt;16 개&lt;/b&gt;뿐입니다 (INT8 은 256 개).&lt;/p&gt;&lt;p&gt;비트를 줄일수록 작아지지만 오차가 커집니다 — 8교시 미니 프로젝트에서 8 · 4 · 2 비트를 직접 비교합니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{mdl=&#x27;MobileNetV3-Small&#x27;;for(const d of [&#x27;FP32&#x27;,&#x27;INT8&#x27;,&#x27;INT4&#x27;]){dt=d;draw();await sleep(900);}}},
 {n:&#x27;④ 크기 1/4 ≠ 속도 4배&#x27;,ex:&#x27;&lt;p&gt;가중치를 메모리에서 &lt;b&gt;읽는 시간&lt;/b&gt;은 byte 에 비례해 1/4 이 됩니다 (아래 표 — 대역폭은 예시).&lt;/p&gt;&lt;p&gt;그러나 전체 추론 시간에는 &lt;b class=&quot;red&quot;&gt;연산 · 전처리 · 런타임 오버헤드&lt;/b&gt;도 있고, 하드웨어에 INT8 연산 유닛이 없으면 오히려 느려질 수도 있습니다. 그래서 이 과목은 크기 · 속도 · 정확도를 &lt;b&gt;항상 측정&lt;/b&gt;해 한 표에 적습니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{mdl=&#x27;YOLOv8n&#x27;;dt=&#x27;INT8&#x27;;for(const v of [2,4,10,25]){$(&#x27;#bw&#x27;).value=v;draw();await sleep(700);}}},
];
initPresets(P,stop);
draw();

&lt;p class=&quot;sub&quot;&gt;같은 숫자라도 담는 그릇에 따라 저장되는 값이 달라집니다. 숫자를 바꿔 &lt;b style=&quot;color:var(--amber)&quot;&gt;FP16 의 반올림 · overflow&lt;/b&gt;, &lt;b style=&quot;color:var(--amber)&quot;&gt;INT8 의 wrap-around&lt;/b&gt; 를 직접 보세요.&lt;/p&gt;

  &lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;INT8 끼리 곱하면? (바꿔보기 셀)&lt;/h2&gt;
  &lt;div class=&quot;wrapc&quot;&gt;a &lt;input type=&quot;number&quot; id=&quot;ia&quot; class=&quot;num&quot; value=&quot;100&quot; min=&quot;-128&quot; max=&quot;127&quot;&gt; × b &lt;input type=&quot;number&quot; id=&quot;ib&quot; class=&quot;num&quot; value=&quot;100&quot; min=&quot;-128&quot; max=&quot;127&quot;&gt; = &lt;span id=&quot;mul&quot;&gt;&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;INT8 결과 그릇에 담으면 256 으로 나눈 나머지만 남습니다 (wrap-around). 7교시에 INT32 로 누적해 해결합니다.&lt;/div&gt;

&lt;script&gt;

const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];
const RM=window.matchMedia&amp;&amp;window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,RM?Math.min(ms,80):ms));
let busy=false, timer=null;
function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}
function setCode(h){$(&#x27;#code&#x27;).innerHTML=h;}
function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const g=c.getContext(&#x27;2d&#x27;);g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}
function initPresets(P,stop){$(&#x27;#presets&#x27;).innerHTML=P.map(p=&gt;`&lt;button type=&quot;button&quot;&gt;${p.n}&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}
const esc=s=&gt;String(s).replace(/&amp;/g,&#x27;&amp;amp;&#x27;).replace(/&lt;/g,&#x27;&amp;lt;&#x27;).replace(/&gt;/g,&#x27;&amp;gt;&#x27;);
const fmt=n=&gt;n.toLocaleString(&#x27;en-US&#x27;);
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
window.__d1={};

const F32=new Float32Array(1), U32=new Uint32Array(F32.buffer);
function toHalf(v){F32[0]=v;const x=U32[0];const sign=(x&gt;&gt;&gt;16)&amp;0x8000;const ex=(x&gt;&gt;&gt;23)&amp;0xff;let e=ex-127+15;let m=x&amp;0x7fffff;
  if(ex===0xff)return sign|0x7c00|(m?0x200:0);
  if(e&gt;=31)return sign|0x7c00;
  if(e&lt;=0){if(e&lt;-10)return sign;m=(m|0x800000);const sh=14-e;let h=m&gt;&gt;&gt;sh;const rem=m&amp;((1&lt;&lt;sh)-1),half=1&lt;&lt;(sh-1);if(rem&gt;half||(rem===half&amp;&amp;(h&amp;1)))h++;return sign|h;}
  let h=sign|(e&lt;&lt;10)|(m&gt;&gt;&gt;13);const rem=m&amp;0x1fff;if(rem&gt;0x1000||(rem===0x1000&amp;&amp;(h&amp;1)))h++;return h;}
function fromHalf(h){const s=h&amp;0x8000?-1:1,e=(h&gt;&gt;10)&amp;0x1f,m=h&amp;0x3ff;if(e===0)return s*m*Math.pow(2,-24);if(e===31)return m?NaN:s*Infinity;return s*(1+m/1024)*Math.pow(2,e-15);}
const bitsHtml=(n,len,cls)=&gt;[...Array(len)].map((_,i)=&gt;{const b=(n&gt;&gt;&gt;(len-1-i))&amp;1;return `&lt;i class=&quot;${cls(i)}&quot;&gt;${b}&lt;/i&gt;`;}).join(&#x27;&#x27;);
const wrap8=v=&gt;{let t=Math.trunc(v);if(!isFinite(t))return 0;t=((t%256)+256)%256;return t&gt;127?t-256:t;};

const show=v=&gt;Number.isFinite(v)?(+v.toPrecision(9)).toString():String(v).replace(&#x27;Infinity&#x27;,&#x27;inf&#x27;);
function draw(){
  const x=parseFloat($(&#x27;#x&#x27;).value);const xv=isFinite(x)?x:0;
  F32[0]=xv;const u=U32[0],f32=F32[0];
  $(&#x27;#b32&#x27;).innerHTML=bitsHtml(u,32,i=&gt;i===0?&#x27;s&#x27;:i&lt;9?&#x27;e&#x27;:&#x27;m&#x27;);
  $(&#x27;#k32&#x27;).innerHTML=`&lt;span&gt;저장된 값&lt;/span&gt;&lt;b&gt;${show(f32)}&lt;/b&gt;&lt;span&gt;입력과 차이&lt;/span&gt;&lt;b&gt;${show(Math.abs(f32-xv))}&lt;/b&gt;`;
  const h=toHalf(xv),f16=fromHalf(h);
  $(&#x27;#b16&#x27;).innerHTML=bitsHtml(h,16,i=&gt;i===0?&#x27;s&#x27;:i&lt;6?&#x27;e&#x27;:&#x27;m&#x27;);
  const e16=Math.abs(f16-f32);
  $(&#x27;#k16&#x27;).innerHTML=`&lt;span&gt;저장된 값&lt;/span&gt;&lt;b style=&quot;color:${isFinite(f16)?&#x27;var(--purple)&#x27;:&#x27;var(--red)&#x27;}&quot;&gt;${show(f16)}&lt;/b&gt;&lt;span&gt;FP32 와 차이&lt;/span&gt;&lt;b&gt;${show(e16)}&lt;/b&gt;`;
  const w=wrap8(xv),c=r8(xv),q=c&amp;0xff;
  $(&#x27;#ki&#x27;).innerHTML=`&lt;span&gt;astype(np.int8) 만&lt;/span&gt;&lt;b style=&quot;color:${w===c?&#x27;var(--text)&#x27;:&#x27;var(--red)&#x27;}&quot;&gt;${w}&lt;/b&gt;&lt;span&gt;round → clip → astype&lt;/span&gt;&lt;b style=&quot;color:var(--teal)&quot;&gt;${c}&lt;/b&gt;&lt;span&gt;되돌린 값과 차이&lt;/span&gt;&lt;b&gt;${show(Math.abs(c-xv))}&lt;/b&gt;`;

function stop(){}
const P=[
 {n:&#x27;① 0.1 은 어디서나 근삿값&#x27;,ex:&#x27;&lt;p&gt;0.1 은 2진수로 정확히 쓸 수 없어 FP32 도 0.100000001 로 저장합니다. FP16 은 가수가 10비트뿐이라 &lt;b class=&quot;purple&quot;&gt;0.0999756&lt;/b&gt; — 차이 2.4e-5.&lt;/p&gt;&lt;p&gt;INT8 로 그냥 바꾸면 0 이 됩니다. 정수에는 소수가 없으니 &lt;b class=&quot;amber&quot;&gt;scale&lt;/b&gt; 이 필요합니다 (3교시).&lt;/p&gt;&#x27;,run:async()=&gt;{setx(0.1);}},

&lt;body&gt;
&lt;div class=&quot;app&quot;&gt;
&lt;h1&gt;scale · zero-point 조절기 — 실수 구간을 정수 칸에 겹치기&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;위 줄은 실수 x, 아래 줄은 정수 q 입니다. 범위 &lt;b style=&quot;color:var(--amber)&quot;&gt;[xmin, xmax]&lt;/b&gt; 와 비트 수를 바꾸면 scale(칸 간격)과 zero_point(0.0 이 놓이는 칸)가 바뀝니다. x 를 움직여 quantize → dequantize 오차를 보세요.&lt;/p&gt;
&lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill amber&quot;&gt;scale = (xmax − xmin) / (qmax − qmin)&lt;/span&gt;&lt;span class=&quot;pill teal&quot;&gt;zp = qmin − round(xmin / scale)&lt;/span&gt;&lt;span class=&quot;pill blue&quot;&gt;q = clip(round(x/scale) + zp)&lt;/span&gt;&lt;span class=&quot;pill green&quot;&gt;x̂ = (q − zp) × scale&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;실수 x (위) ↔ 정수 q (아래)&lt;/h2&gt;&lt;canvas id=&quot;cv&quot;&gt;&lt;/canvas&gt;
  &lt;div class=&quot;two&quot; style=&quot;margin-top:8px&quot;&gt;
    &lt;div&gt;

const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];

  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}

const rne=v=&gt;{const f=Math.floor(v),d=v-f;if(Math.abs(d-0.5)&lt;1e-12)return f%2===0?f:f+1;return Math.round(v);};  // NumPy 식 반올림
function calc(){let lo=+$(&#x27;#sMin&#x27;).value,hi=+$(&#x27;#sMax&#x27;).value;if(hi&lt;lo)[lo,hi]=[hi,lo];const bits=+$(&#x27;#sB&#x27;).value,qmax=2**bits-1;
  let a=lo,b=hi;if($(&#x27;#z0&#x27;).checked){a=Math.min(lo,0);b=Math.max(hi,0);}
  if(b===a)b=a+1e-6;const s=(b-a)/qmax;const zp=$(&#x27;#z0&#x27;).checked?Math.min(qmax,Math.max(0,0-rne(a/s))):rne(-a/s);
  const x=+$(&#x27;#sX&#x27;).value;const q=Math.min(qmax,Math.max(0,rne(x/s)+zp));const xh=(q-zp)*s;
  return {lo,hi,a,b,bits,qmax,s,zp,x,q,xh,err:Math.abs(xh-x),inR:x&gt;=a&amp;&amp;x&lt;=b};}
function draw(){const c=calc();
  $(&#x27;#oMin&#x27;).textContent=(+$(&#x27;#sMin&#x27;).value).toFixed(1);$(&#x27;#oMax&#x27;).textContent=(+$(&#x27;#sMax&#x27;).value).toFixed(1);$(&#x27;#oB&#x27;).textContent=c.bits+&#x27; bit&#x27;;$(&#x27;#oX&#x27;).textContent=c.x.toFixed(3);

  const L=40,R=W-30,X0=-5,X1=5,px=v=&gt;L+(v-X0)/(X1-X0)*(R-L);const yT=60,yB=170;
  g.fillStyle=&#x27;#1a2a1a&#x27;;g.fillRect(px(c.a),yT-14,px(c.b)-px(c.a),28);
  g.strokeStyle=&#x27;#5d7292&#x27;;g.lineWidth=1.5;g.beginPath();g.moveTo(L,yT);g.lineTo(R,yT);g.stroke();

  // x → q

&lt;body&gt;
&lt;div class=&quot;app&quot;&gt;
&lt;h1&gt;per-tensor vs per-channel — scale 하나 vs 필터마다 하나&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;필터(출력 채널) 8개의 weight 를 한 줄씩 그렸습니다. 점은 실제 값, 세로 눈금은 그 채널이 쓰는 정수 칸입니다. &lt;b style=&quot;color:var(--red)&quot;&gt;per-tensor&lt;/b&gt; 는 가장 큰 필터에 맞춘 간격 하나를 모두가 쓰고, &lt;b style=&quot;color:var(--teal)&quot;&gt;per-channel&lt;/b&gt; 은 필터마다 자기 크기에 맞는 간격을 씁니다.&lt;/p&gt;
&lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill red&quot;&gt;per-tensor: scale = max|W| / 127&lt;/span&gt;&lt;span class=&quot;pill teal&quot;&gt;per-channel: np.abs(W).reshape(C, −1).max(1) / 127&lt;/span&gt;&lt;span class=&quot;pill amber&quot;&gt;sc[:, None, None, None]&lt;/span&gt;&lt;span class=&quot;pill blue&quot;&gt;실측 conv 1.91배 · fc1 2.63배&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;
  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;필터 8개 (예시 데이터, 필터당 25개 값)&lt;/h2&gt;&lt;canvas id=&quot;cv&quot;&gt;&lt;/canvas&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;lab&quot;&gt;방식&lt;/span&gt;&lt;div class=&quot;seg&quot; id=&quot;md&quot;&gt;&lt;button type=&quot;button&quot; data-k=&quot;t&quot;&gt;per-tensor&lt;/button&gt;&lt;button type=&quot;button&quot; data-k=&quot;c&quot;&gt;per-channel&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;sB&quot;&gt;bits&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sB&quot; min=&quot;2&quot; max=&quot;8&quot; step=&quot;1&quot; value=&quot;3&quot;&gt;&lt;output id=&quot;oB&quot;&gt;&lt;/output&gt;&lt;/div&gt;
    &lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;sK&quot;&gt;필터0 ×K&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sK&quot; min=&quot;1&quot; max=&quot;30&quot; step=&quot;1&quot; value=&quot;1&quot;&gt;&lt;output id=&quot;oK&quot;&gt;&lt;/output&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;필터별 MSE (빨강 per-tensor · 청록 per-channel)&lt;/h2&gt;&lt;div id=&quot;bars&quot;&gt;&lt;/div&gt;&lt;div class=&quot;kv&quot; id=&quot;kv&quot; style=&quot;margin-top:8px&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;Python (노트북 5-1 ~ 5-4)&lt;/h2&gt;&lt;div class=&quot;code&quot; id=&quot;code&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;상태&lt;/h2&gt;&lt;div class=&quot;status info&quot; id=&quot;status&quot;&gt;프리셋을 누르세요.&lt;/div&gt;&lt;/div&gt;

&lt;script&gt;

const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];
const RM=window.matchMedia&amp;&amp;window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,RM?Math.min(ms,80):ms));
let busy=false, timer=null;
function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}
function setCode(h){$(&#x27;#code&#x27;).innerHTML=h;}
function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const g=c.getContext(&#x27;2d&#x27;);g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}
function initPresets(P,stop){$(&#x27;#presets&#x27;).innerHTML=P.map(p=&gt;`&lt;button type=&quot;button&quot;&gt;${p.n}&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}
const esc=s=&gt;String(s).replace(/&amp;/g,&#x27;&amp;amp;&#x27;).replace(/&lt;/g,&#x27;&amp;lt;&#x27;).replace(/&gt;/g,&#x27;&amp;gt;&#x27;);
const fmt=n=&gt;n.toLocaleString(&#x27;en-US&#x27;);
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
window.__d1={};

let seed=3;const rnd=()=&gt;{seed=(seed*1103515245+12345)%2147483648;return seed/2147483648;};
const gauss=()=&gt;{let u=0;while(u===0)u=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*rnd());};
const MAG=[0.48,0.21,0.36,0.17,0.41,0.23,0.30,0.20];
const BASE=MAG.map(m=&gt;{const v=[...Array(25)].map(()=&gt;gauss());const a=Math.max(...v.map(Math.abs));return v.map(x=&gt;x/a*m);});
let md=&#x27;t&#x27;;
const rne=v=&gt;{const f=Math.floor(v),d=v-f;if(Math.abs(d-0.5)&lt;1e-12)return f%2===0?f:f+1;return Math.round(v);};
function W(){const K=+$(&#x27;#sK&#x27;).value;return BASE.map((r,i)=&gt;i===0?r.map(v=&gt;v*K):r);}
function q(row,s,qm){return row.map(v=&gt;Math.max(-qm,Math.min(qm,rne(v/s)))*s);}
const mse=(a,b)=&gt;a.reduce((t,v,i)=&gt;t+(v-b[i])**2,0)/a.length;
function draw(){const bits=+$(&#x27;#sB&#x27;).value,qm=2**(bits-1)-1,K=+$(&#x27;#sK&#x27;).value;$(&#x27;#oB&#x27;).textContent=bits+&#x27; bit&#x27;;$(&#x27;#oK&#x27;).textContent=&#x27;×&#x27;+K;
  $$(&#x27;#md button&#x27;).forEach(b=&gt;b.classList.toggle(&#x27;sel&#x27;,b.dataset.k===md));
  const w=W(),mx=Math.max(...w.flat().map(Math.abs)),st=mx/qm,sc=w.map(r=&gt;Math.max(...r.map(Math.abs))/qm);
  const et=w.map(r=&gt;mse(q(r,st,qm),r)),ec=w.map((r,i)=&gt;mse(q(r,sc[i],qm),r));
  const [g,Wd,H]=fitCanvas($(&#x27;#cv&#x27;));g.clearRect(0,0,Wd,H);
  const L=44,R=Wd-12,view=Math.max(...MAG)*1.1*(K&gt;1?Math.min(K,3):1),px=v=&gt;L+(v+view)/(2*view)*(R-L),rh=(H-20)/8;
  g.font=&#x27;11px Consolas,monospace&#x27;;
  w.forEach((r,i)=&gt;{const y=14+i*rh+rh/2,s=md===&#x27;t&#x27;?st:sc[i];
    g.fillStyle=&#x27;#8a9bb8&#x27;;g.textAlign=&#x27;left&#x27;;g.fillText(&#x27;ch&#x27;+i,4,y+4);
    g.strokeStyle=&#x27;#1f2b45&#x27;;g.beginPath();g.moveTo(L,y);g.lineTo(R,y);g.stroke();
    g.fillStyle=md===&#x27;t&#x27;?&#x27;#f87171&#x27;:&#x27;#2dd4bf&#x27;;g.globalAlpha=.75;
    for(let k=-qm;k&lt;=qm;k++){const x=px(k*s);if(x&gt;=L&amp;&amp;x&lt;=R)g.fillRect(x-0.5,y-rh*0.32,1,rh*0.64);}g.globalAlpha=1;
    const qh=q(r,s,qm);r.forEach((v,j)=&gt;{const x=px(v);if(x&lt;L||x&gt;R)return;g.fillStyle=&#x27;#60a5fa&#x27;;g.beginPath();g.arc(x,y,2.6,0,7);g.fill();g.strokeStyle=&#x27;#f5b94299&#x27;;g.beginPath();g.moveTo(x,y);g.lineTo(px(qh[j]),y+rh*0.3);g.stroke();});
  });
  if(K&gt;2){g.fillStyle=&#x27;#f87171&#x27;;g.textAlign=&#x27;right&#x27;;g.fillText(&#x27;ch0 은 화면 밖까지 큼 (×&#x27;+K+&#x27;)&#x27;,R,12);}
  const big=Math.max(...et,...ec);
  $(&#x27;#bars&#x27;).innerHTML=w.map((_,i)=&gt;`&lt;div class=&quot;chb&quot;&gt;&lt;span&gt;ch${i}&lt;/span&gt;&lt;div class=&quot;tr&quot;&gt;&lt;div class=&quot;fl&quot; style=&quot;width:${et[i]/big*100}%;background:#f87171&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;tr&quot;&gt;&lt;div class=&quot;fl&quot; style=&quot;width:${ec[i]/big*100}%;background:#2dd4bf&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
  const Et=et.reduce((a,b)=&gt;a+b)/8,Ec=ec.reduce((a,b)=&gt;a+b)/8;window.__d1.ratio=Et/Ec;
  $(&#x27;#kv&#x27;).innerHTML=`&lt;span&gt;per-tensor scale&lt;/span&gt;&lt;b&gt;${st.toFixed(5)} (1개)&lt;/b&gt;&lt;span&gt;per-channel scale&lt;/span&gt;&lt;b&gt;${Math.min(...sc).toFixed(5)} ~ ${Math.max(...sc).toFixed(5)} (8개)&lt;/b&gt;&lt;span&gt;MSE per-tensor&lt;/span&gt;&lt;b style=&quot;color:var(--red)&quot;&gt;${Et.toExponential(2)}&lt;/b&gt;&lt;span&gt;MSE per-channel&lt;/span&gt;&lt;b style=&quot;color:var(--teal)&quot;&gt;${Ec.toExponential(2)}&lt;/b&gt;&lt;span&gt;차이&lt;/span&gt;&lt;b style=&quot;color:var(--amber)&quot;&gt;${(Et/Ec).toFixed(2)} 배&lt;/b&gt;`;
  setCode([`st = np.abs(W).max() / ${qm}            &lt;span class=&quot;b&quot;&gt;# ${st.toFixed(5)}&lt;/span&gt;`,`sc = np.abs(W).reshape(8, -1).max(axis=1) / ${qm}`,`sc4 = sc[:, None, None, None]   &lt;span class=&quot;b&quot;&gt;# (8, 1, 1, 1)&lt;/span&gt;`,`W_q = np.clip(np.round(W / ${md===&#x27;t&#x27;?&#x27;st&#x27;:&#x27;sc4&#x27;}), -${qm}, ${qm}) * ${md===&#x27;t&#x27;?&#x27;st&#x27;:&#x27;sc4&#x27;}`,`&lt;span class=&quot;b&quot;&gt;# per-tensor / per-channel MSE = ${(Et/Ec).toFixed(2)} (예시)&lt;/span&gt;`].join(&#x27;\n&#x27;));
  setStatus(md===&#x27;t&#x27;?&#x27;warn&#x27;:&#x27;ok&#x27;,md===&#x27;t&#x27;?`per-tensor — 모든 필터가 가장 큰 필터에 맞춘 간격 ${st.toFixed(4)} 을 씀. 작은 필터일수록 칸이 거칠다`:`per-channel — 필터마다 자기 크기의 간격. 전체 MSE ${(Et/Ec).toFixed(2)} 배 정확`);
}
$$(&#x27;#md button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(busy)return;md=b.dataset.k;draw();});$(&#x27;#sB&#x27;).oninput=draw;$(&#x27;#sK&#x27;).oninput=draw;window.addEventListener(&#x27;resize&#x27;,draw);
function stop(){}
const set=(o)=&gt;{for(const k in o){if(k===&#x27;md&#x27;)md=o[k];else $(&#x27;#&#x27;+k).value=o[k];}draw();};
const P=[
 {n:&#x27;① 같은 데이터, 두 방식&#x27;,ex:&#x27;&lt;p&gt;per-tensor 는 가장 큰 필터(ch0 0.48)에 맞춘 간격 하나를 8개 필터가 함께 씁니다. ch3 (0.17) 처럼 작은 필터는 칸 몇 개만 쓰게 되어 거칠어집니다.&lt;/p&gt;&lt;p&gt;per-channel 로 바꾸면 필터마다 자기 max 에 맞춘 간격 → 모든 필터가 칸을 꽉 채워 씁니다.&lt;/p&gt;&#x27;,run:async()=&gt;{set({sB:3,sK:1,md:&#x27;t&#x27;});await sleep(1500);set({md:&#x27;c&#x27;});}},
 {n:&#x27;② 비트를 바꿔 보기&#x27;,ex:&#x27;&lt;p&gt;8비트처럼 칸이 많으면 두 방식 모두 오차가 작아 차이가 잘 안 보입니다. 비트를 줄일수록 per-channel 의 이득이 뚜렷해집니다 — 8교시 2비트 결과(정확도 0.25 vs 0.52)와 같은 이유입니다.&lt;/p&gt;&lt;p&gt;노트북 실측 8비트: conv &lt;b class=&quot;blue&quot;&gt;1.91 배&lt;/b&gt;, fc1 &lt;b class=&quot;blue&quot;&gt;2.63 배&lt;/b&gt;.&lt;/p&gt;&#x27;,run:async()=&gt;{for(const b of [8,5,3,2]){set({sB:b,sK:1,md:&#x27;t&#x27;});await sleep(700);set({md:&#x27;c&#x27;});await sleep(700);}}},
 {n:&#x27;③ 튀는 필터 하나 (×K)&#x27;,ex:&#x27;&lt;p&gt;필터 0 을 10배로 키우면 per-tensor scale 도 10배 → &lt;b class=&quot;red&quot;&gt;나머지 7개 필터가 모두 손해&lt;/b&gt;를 봅니다. per-channel 은 ch0 만 간격이 넓어지고 나머지는 그대로.&lt;/p&gt;&lt;p&gt;노트북 바꿔보기 (K = 10, 실제 conv weight): 차이 &lt;b class=&quot;amber&quot;&gt;18 배&lt;/b&gt;.&lt;/p&gt;&#x27;,run:async()=&gt;{set({sB:4,md:&#x27;t&#x27;});for(const k of [1,3,10]){set({sK:k});await sleep(900);}set({md:&#x27;c&#x27;});}},
];
initPresets(P,stop);
draw();
$(&#x27;#presets button&#x27;).click();

&lt;/script&gt;

  &lt;div class=&quot;sl&quot;&gt;&lt;label for=&quot;sC&quot;&gt;clip&lt;/label&gt;&lt;input type=&quot;range&quot; id=&quot;sC&quot; min=&quot;0.01&quot; max=&quot;1&quot; step=&quot;0.01&quot; value=&quot;1&quot;&gt;&lt;output id=&quot;oC&quot;&gt;&lt;/output&gt;&lt;/div&gt;

const P=[
 {n:&#x27;① 8 bit: clip 을 좁혀 가기&#x27;,ex:&#x27;&lt;p&gt;8비트는 칸이 256개라 MinMax(1.0×) 에서도 반올림 오차가 작습니다. clip 을 줄이면 잠시 좋아지다가 곧 &lt;b class=&quot;red&quot;&gt;잘림 오차&lt;/b&gt;가 폭발합니다.&lt;/p&gt;&lt;p&gt;노트북 실측 (SimpleConvNet 활성값): 최적 clip &lt;b class=&quot;amber&quot;&gt;0.97 × max&lt;/b&gt; — 거의 MinMax.&lt;/p&gt;&#x27;,run:async()=&gt;{bits=8;$(&#x27;#ol&#x27;).checked=false;await sweep(1,0.4,-0.05,230);await sweep(0.45,0.95,0.05,160);}},
 {n:&#x27;② 4 bit: 좁힐수록 이득&#x27;,ex:&#x27;&lt;p&gt;4비트는 칸이 16개뿐이라 간격이 넓어 반올림 오차가 큽니다. 드문 큰 값을 조금 잘라 내고 간격을 촘촘하게 하는 편이 낫습니다.&lt;/p&gt;&lt;p&gt;노트북 실측: 최적 clip &lt;b class=&quot;amber&quot;&gt;0.71 × max&lt;/b&gt;. 최적 범위는 &lt;b&gt;비트 수에 따라 다르다&lt;/b&gt;.&lt;/p&gt;&#x27;,run:async()=&gt;{bits=4;$(&#x27;#ol&#x27;).checked=false;await sweep(1,0.35,-0.05,230);$(&#x27;#sC&#x27;).value=window.__d1.best.toFixed(2);draw();}},
 {n:&#x27;③ 99.9% Percentile&#x27;,ex:&#x27;&lt;p&gt;보라 점선 = 99.9 백분위. 값의 0.1% 만 잘립니다. 노트북 실측: 2.137 → &lt;b&gt;1.607&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;이 데이터 (outlier 없음 · 8비트) 에서는 Percentile 의 MSE 가 MinMax 보다 오히려 큽니다 — &quot;Percentile 이 항상 낫다&quot; 는 아닙니다. 측정해서 고릅니다.&lt;/p&gt;&#x27;,run:async()=&gt;{bits=8;$(&#x27;#ol&#x27;).checked=false;$(&#x27;#sC&#x27;).value=1;draw();await sleep(900);const x=data();$(&#x27;#sC&#x27;).value=(pct(x,99.9)/Math.max(...x)).toFixed(2);draw();}},
 {n:&#x27;④ outlier 하나&#x27;,ex:&#x27;&lt;p&gt;값 하나가 max × 20 이 되면 MinMax 범위가 20배 → 간격 20배 → 나머지 19,999 개가 모두 거칠어집니다.&lt;/p&gt;&lt;p&gt;Percentile 처럼 그 값을 잘라 내면 &lt;b class=&quot;teal&quot;&gt;나머지 값&lt;/b&gt;은 훨씬 정확하지만, outlier 하나의 오차가 너무 커서 &lt;b class=&quot;amber&quot;&gt;전체 MSE&lt;/b&gt; 는 MinMax 가 더 낮게 나옵니다. 노트북 6-3: 나머지 값은 Percentile 이 &lt;b&gt;42 배&lt;/b&gt; 정확. 무엇을 지표로 삼느냐가 결론을 바꿉니다.&lt;/p&gt;&#x27;,run:async()=&gt;{bits=8;$(&#x27;#ol&#x27;).checked=true;$(&#x27;#sC&#x27;).value=1;draw();await sleep(1200);const x=data();$(&#x27;#sC&#x27;).value=Math.max(0.05,pct(x,99.9)/Math.max(...x)).toFixed(2);draw();}},
];
initPresets(P,stop);
draw();
$(&#x27;#presets button&#x27;).click();

&lt;/script&gt;

&lt;h1&gt;정수 행렬곱 — INT8 × INT8 → INT32 누적 → × scale&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;출력 뉴런 2개, 입력 4개짜리 작은 층 &lt;code&gt;y = W x + b&lt;/code&gt; 를 정수로 계산합니다. &lt;b style=&quot;color:var(--amber)&quot;&gt;다음 단계 ▶&lt;/b&gt; 를 누르며 곱 하나하나가 누적되는 것을 보고, 누적 그릇을 INT8 · INT16 으로 바꾸면 무슨 일이 생기는지 확인하세요.&lt;/p&gt;
&lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill teal&quot;&gt;대칭: zp = 0&lt;/span&gt;&lt;span class=&quot;pill amber&quot;&gt;acc = Σ x_q · W_q (INT32)&lt;/span&gt;&lt;span class=&quot;pill purple&quot;&gt;b_q = round(b / (s_x · s_w))&lt;/span&gt;&lt;span class=&quot;pill blue&quot;&gt;y ≈ (acc + b_q) × s_x · s_w&lt;/span&gt;&lt;span class=&quot;pill green&quot;&gt;실측 fc2: 최대 차이 0.10 · 일치율 1.00&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;
  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;실수 → 정수 (예시 값)&lt;/h2&gt;
    &lt;table class=&quot;mat&quot; id=&quot;tx&quot;&gt;&lt;/table&gt;
    &lt;div class=&quot;row&quot; style=&quot;margin-top:10px&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;run&quot; id=&quot;nx&quot;&gt;다음 단계 ▶&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;rs&quot;&gt;처음부터&lt;/button&gt;
      &lt;span class=&quot;lab&quot;&gt;누적 그릇&lt;/span&gt;&lt;div class=&quot;seg&quot; id=&quot;acc&quot;&gt;&lt;button type=&quot;button&quot; data-k=&quot;32&quot;&gt;INT32&lt;/button&gt;&lt;button type=&quot;button&quot; data-k=&quot;16&quot;&gt;INT16&lt;/button&gt;&lt;button type=&quot;button&quot; data-k=&quot;8&quot;&gt;INT8&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;

    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;상태&lt;/h2&gt;&lt;div class=&quot;status info&quot; id=&quot;status&quot;&gt;프리셋을 누르세요.&lt;/div&gt;&lt;/div&gt;

&lt;script&gt;

const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];
const RM=window.matchMedia&amp;&amp;window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,RM?Math.min(ms,80):ms));
let busy=false, timer=null;
function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}
function setCode(h){$(&#x27;#code&#x27;).innerHTML=h;}
function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const g=c.getContext(&#x27;2d&#x27;);g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}
function initPresets(P,stop){$(&#x27;#presets&#x27;).innerHTML=P.map(p=&gt;`&lt;button type=&quot;button&quot;&gt;${p.n}&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}
const esc=s=&gt;String(s).replace(/&amp;/g,&#x27;&amp;amp;&#x27;).replace(/&lt;/g,&#x27;&amp;lt;&#x27;).replace(/&gt;/g,&#x27;&amp;gt;&#x27;);
const fmt=n=&gt;n.toLocaleString(&#x27;en-US&#x27;);
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
window.__d1={};

const X0=[1.4,0.0,1.5,1.3],Wf=[[0.30,0.27,0.25,0.29],[-0.08,0.25,-0.18,0.11]],Bf=[0.05,-0.02];
let st=0,cont=32;           // st: 0 준비 · 1 scale · 2 양자화 · 3..10 곱 누적(2행×4) · 11 bias · 12 결과
const rne=v=&gt;{const f=Math.floor(v),d=v-f;if(Math.abs(d-0.5)&lt;1e-12)return f%2===0?f:f+1;return Math.round(v);};
const wrap=(v,b)=&gt;{const m=2**b;let t=((v%m)+m)%m;return t&gt;=m/2?t-m:t;};
function comp(){const x=X0.slice();
  const sx=Math.max(...x.map(Math.abs))/127,sw=Math.max(...Wf.flat().map(Math.abs))/127;
  const xq=x.map(v=&gt;Math.max(-127,Math.min(127,rne(v/sx)))),Wq=Wf.map(r=&gt;r.map(v=&gt;Math.max(-127,Math.min(127,rne(v/sw)))));
  const bq=Bf.map(b=&gt;rne(b/(sx*sw)));const yf=Wf.map((r,j)=&gt;r.reduce((t,w,i)=&gt;t+w*x[i],0)+Bf[j]);
  return {x,sx,sw,xq,Wq,bq,yf};}
function draw(){const c=comp();
  $$(&#x27;#acc button&#x27;).forEach(b=&gt;b.classList.toggle(&#x27;sel&#x27;,+b.dataset.k===cont));
  const k=st&gt;=3&amp;&amp;st&lt;=10?st-3:-1,row=k&gt;=0?Math.floor(k/4):-1,col=k&gt;=0?k%4:-1;
  const q=st&gt;=2;
  $(&#x27;#tx&#x27;).innerHTML=`&lt;tr&gt;&lt;td class=&quot;lab&quot;&gt;&lt;/td&gt;${c.x.map((v,i)=&gt;`&lt;td class=&quot;${col===i?&#x27;hot&#x27;:&#x27;&#x27;}&quot;&gt;${q?c.xq[i]:v.toFixed(2)}&lt;/td&gt;`).join(&#x27;&#x27;)}&lt;td class=&quot;lab&quot;&gt;← ${q?&#x27;x_q&#x27;:&#x27;x&#x27;}&lt;/td&gt;&lt;/tr&gt;`+
   Wf.map((r,j)=&gt;`&lt;tr&gt;&lt;td class=&quot;lab&quot;&gt;${q?&#x27;W_q&#x27;:&#x27;W&#x27;}[${j}]&lt;/td&gt;${r.map((v,i)=&gt;`&lt;td class=&quot;${row===j&amp;&amp;col===i?&#x27;hot&#x27;:&#x27;&#x27;}&quot;&gt;${q?c.Wq[j][i]:v.toFixed(2)}&lt;/td&gt;`).join(&#x27;&#x27;)}&lt;td class=&quot;lab&quot;&gt;b${j} ${st&gt;=11?&#x27;→ &#x27;+c.bq[j]:Bf[j]}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;);
  // 누적
  const acc=[0,0],accTrue=[0,0];let ov=false;
  for(let t=0;t&lt;8&amp;&amp;(st&gt;=11||t&lt;=k);t++){const j=Math.floor(t/4),i=t%4;if(st&lt;3)break;accTrue[j]+=c.xq[i]*c.Wq[j][i];acc[j]=cont===32?accTrue[j]:wrap(acc[j]+c.xq[i]*c.Wq[j][i],cont);if(acc[j]!==accTrue[j])ov=true;}
  const fin=acc.map((a,j)=&gt;a+(st&gt;=11?c.bq[j]:0)),y=fin.map(v=&gt;v*c.sx*c.sw);
  $(&#x27;#ab&#x27;).innerHTML=`&lt;span&gt;s_x&lt;/span&gt;&lt;b&gt;${st&gt;=1?c.sx.toFixed(5):&#x27;—&#x27;}&lt;/b&gt;&lt;span&gt;s_w&lt;/span&gt;&lt;b&gt;${st&gt;=1?c.sw.toFixed(5):&#x27;—&#x27;}&lt;/b&gt;`+
   (k&gt;=0?`&lt;span&gt;지금 곱&lt;/span&gt;&lt;b style=&quot;color:var(--amber)&quot;&gt;${c.xq[col]} × ${c.Wq[row][col]} = ${c.xq[col]*c.Wq[row][col]}&lt;/b&gt;`:&#x27;&#x27;)+

 {n:&#x27;① 8 bit — 거의 그대로&#x27;,ex:&#x27;&lt;p&gt;8비트는 필터 값이 원래와 소수 둘째 자리까지 같습니다. 100장 예측 일치율 1.00, logits 최대 차이 0.067.&lt;/p&gt;&lt;p&gt;per-tensor 와 per-channel 의 차이도 거의 없습니다 — 칸이 255개나 되니까.&lt;/p&gt;&#x27;,run:async()=&gt;{phase=0;bits=8;pc=0;draw();await sleep(1100);pc=1;draw();}},

<script>
const ids = [...document.querySelectorAll('nav button')].map(b => b.dataset.id);
function fit(fr) {
  try {
    const d = fr.contentDocument; if (!d || !d.body) return;
    fr.style.height = Math.max(600, d.documentElement.scrollHeight) + 'px';
  } catch (e) {}
}
function show(id, push) {
  if (!ids.includes(id)) id = ids[0];
  document.querySelectorAll('section.lesson').forEach(s => s.classList.toggle('active', s.id === id));
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-current', b.dataset.id === id ? 'true' : 'false'));
  const sec = document.getElementById(id);
  document.title = sec.dataset.title + ' — Quantization·Pruning Day 1';
  const fr = sec.querySelector('iframe');
  fr.loading = 'eager'; fit(fr);
  if (push) history.replaceState(null, '', '#' + id);
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('section.lesson iframe').forEach(fr => {
  fr.addEventListener('load', () => {
    fit(fr);
    try {
      new ResizeObserver(() => fit(fr)).observe(fr.contentDocument.body);
      fr.contentDocument.addEventListener('keydown', key);   // iframe 안에서도 ← → 동작
    } catch (e) {}
  });
});
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.id, true));
function key(e) {
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const cur = ids.indexOf(location.hash.slice(1) || ids[0]);
  if (e.key === 'ArrowRight' && cur < ids.length - 1) show(ids[cur + 1], true);
  if (e.key === 'ArrowLeft' && cur > 0) show(ids[cur - 1], true);
}
document.addEventListener('keydown', key);
window.addEventListener('resize', () => document.querySelectorAll('section.lesson.active iframe').forEach(fit));
window.addEventListener('hashchange', () => show(location.hash.slice(1), false));   // 주소창에서 #d1-N 을 바꿔도 이동
show(location.hash.slice(1), false);
</script>
