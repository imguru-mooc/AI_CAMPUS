  <div class="list">
<button data-id="d2-1" aria-current="false"><span class="p">1교시</span><span class="no">D2-1</span><span class="tt">4단계 다시 · 오늘의 지도</span><span class="d">eval → ① export → ② 열어보기 → ③ run → ④ allclose · 오늘은 ② 를 코드로 · 노드 7 · initializer 6 · Netron 만 → 2·3교시 · 중간 shape · opset → 4 · Got: 4 Expected: 1 → 5 · export 늘 성공 → 6·7</span></button>
<button data-id="d2-2" aria-current="false"><span class="p">2교시</span><span class="no">D2-2</span><span class="tt">ONNX 파일의 속 구조</span><span class="d">ModelProto (ir_version 9 · opset 20 · pytorch) → GraphProto → input 1 · node 7 · initializer 6 · output 1 · value_info 0 · 앞 노드 output 이름 = 뒤 노드 input 이름 → 화살표 · 데이터 vs 가중치</span></button>

<button data-id="d2-5" aria-current="false"><span class="p">5교시</span><span class="no">D2-5</span><span class="tt">dynamic_axes — 배치 축 열기</span><span class="d">고정 [1,1,28,28] → 배치 4 = Got: 4 Expected: 1 · dynamic_axes={&quot;input&quot;: {0: &quot;batch&quot;}, &quot;logits&quot;: {0: &quot;batch&quot;}} → [&#x27;batch&#x27;,1,28,28] · 배치 1·4·8 OK · 100장 한 번에 정확도 1.0 · H·W 도 열면 32×32 → Gemm K 5880 ≠ 4320</span></button>
<button data-id="d2-6" aria-current="false"><span class="p">6교시</span><span class="no">D2-6</span><span class="tt">녹화되는 길 · 굳는 값</span><span class="d">export = 더미로 실행된 길만 녹화 · ① if → [Constant, Mul] · [-3,-2,-1] PyTorch [-4,-3,-2] vs ORT [-6,-4,-2] → torch.where (Where) ② float(np.mean) → 더미 평균 5 가 Constant · 차이 3.0 → x.mean(dim=1, keepdim=True) ③ view(1, -1) → 배치 4 addmm 오류 → flatten(1)</span></button>
<button data-id="d2-7" aria-current="false"><span class="p">7교시</span><span class="no">D2-7</span><span class="tt">미지원 연산 · 단순화</span><span class="d">torch.median → UnsupportedOperatorError: &#x27;aten::median&#x27; to ONNX opset version 20 is not supported · torch.sort(x, dim=1).values[:, k:k+1] → TopK 포함 21노드 · 원래 모델과 verify ✅ · ViewNet 11노드 → onnxslim → 4 [Conv, Relu, Reshape, Gemm] · do_constant_folding=False 16 → 4</span></button>

&lt;h1&gt;4단계 다시 — 그리고 오늘의 지도&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;어제는 &lt;b style=&quot;color:var(--amber)&quot;&gt;내보내기 → 열어보기 → 실행하기 → 확인하기&lt;/b&gt; 4단계를 다섯 모델에 반복했습니다. 문제 1-1 은 이 4단계를 한 셀에 다시 쓰는데, &lt;b style=&quot;color:var(--purple)&quot;&gt;② 열어보기&lt;/b&gt; 가 빠져 있습니다 — 그것이 오늘 하루의 주제입니다. 아래에서 4단계를 한 바퀴 돌고, 1-2 의 숫자를 기억으로 맞힌 뒤, 어제 막혔던 것 4가지가 오늘 몇 교시에서 풀리는지 지도를 봅니다.&lt;/p&gt;
&lt;div class=&quot;pills&quot;&gt;&lt;span class=&quot;pill amber&quot;&gt;cnn.eval()&lt;/span&gt;&lt;span class=&quot;pill blue&quot;&gt;torch.zeros(1, 1, 28, 28)&lt;/span&gt;&lt;span class=&quot;pill purple&quot;&gt;② 열어보기 = 오늘&lt;/span&gt;&lt;span class=&quot;pill teal&quot;&gt;np.allclose(atol=1e-5)&lt;/span&gt;&lt;span class=&quot;pill green&quot;&gt;노드 7 · initializer 6&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;프리셋 (누르면 재생)&lt;/h2&gt;&lt;div class=&quot;presets&quot; id=&quot;presets&quot;&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;grid&quot;&gt;
  &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;문제 1-1 — 어제의 4단계 (상자를 누르면 그 줄)&lt;/h2&gt;
    &lt;div class=&quot;loop&quot; id=&quot;loop&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;back&quot;&gt;④ 확인 → 다른 모델로 ↺ (어제 다섯 모델)&lt;/div&gt;
    &lt;div class=&quot;row ctl&quot; style=&quot;margin-top:8px&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;run&quot; id=&quot;bLoop&quot;&gt;한 바퀴 ▶&lt;/button&gt;&lt;/div&gt;
    &lt;h2 style=&quot;margin-top:14px&quot;&gt;문제 1-2 — 기억으로 예측하기 (실행하지 말고)&lt;/h2&gt;
    &lt;div class=&quot;guess&quot;&gt;
      &lt;label for=&quot;gN&quot;&gt;n_nodes_guess =&lt;/label&gt;&lt;input type=&quot;number&quot; id=&quot;gN&quot; min=&quot;0&quot; max=&quot;30&quot; value=&quot;&quot;&gt;
      &lt;label for=&quot;gI&quot;&gt;n_init_guess =&lt;/label&gt;&lt;input type=&quot;number&quot; id=&quot;gI&quot; min=&quot;0&quot; max=&quot;30&quot; value=&quot;&quot;&gt;
    &lt;/div&gt;
    &lt;div class=&quot;row&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;run&quot; id=&quot;bGuess&quot;&gt;확인 셀 실행&lt;/button&gt;&lt;span class=&quot;lab&quot;&gt;힌트: Conv · Gemm · Gemm 은 각각 weight · bias&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;Python (노트북 1-1 · 1-2)&lt;/h2&gt;&lt;div class=&quot;code&quot; id=&quot;code&quot;&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;상태&lt;/h2&gt;&lt;div class=&quot;status info&quot; id=&quot;status&quot;&gt;프리셋을 누르세요.&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;panel&quot;&gt;&lt;h2&gt;오늘의 지도 — 어제 막혔던 것 4가지 (눌러 보세요)&lt;/h2&gt;
  &lt;div class=&quot;map&quot; id=&quot;map&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;tl&quot; id=&quot;tl&quot;&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;div class=&quot;panel explain&quot; id=&quot;explain&quot;&gt;&lt;/div&gt;

&lt;/div&gt;
&lt;script&gt;
const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];
const RM=window.matchMedia&amp;&amp;window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,RM?Math.min(ms,80):ms));
let busy=false, timer=null;
function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}
function setCode(h){$(&#x27;#code&#x27;).innerHTML=h;}
function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const g=c.getContext(&#x27;2d&#x27;);g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}
function initPresets(P,stop){$(&#x27;#presets&#x27;).innerHTML=P.map(p=&gt;`&lt;button type=&quot;button&quot;&gt;${p.n}&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}
const esc=s=&gt;String(s).replace(/&amp;/g,&#x27;&amp;amp;&#x27;).replace(/&lt;/g,&#x27;&amp;lt;&#x27;).replace(/&gt;/g,&#x27;&amp;gt;&#x27;);
const fmt=n=&gt;n.toLocaleString(&#x27;en-US&#x27;);
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
window.__d2={};


const ST=[
 {k:&#x27;①&#x27;,t:&#x27;내보내기&#x27;,s:&#x27;torch.onnx.export&#x27;,ln:[1,2,3]},
 {k:&#x27;②&#x27;,t:&#x27;열어보기&#x27;,s:&#x27;오늘의 주제 · 코드로&#x27;,ln:[],today:1},
 {k:&#x27;③&#x27;,t:&#x27;실행하기&#x27;,s:&#x27;InferenceSession · run&#x27;,ln:[4,5,6]},
 {k:&#x27;④&#x27;,t:&#x27;확인하기&#x27;,s:&#x27;np.allclose&#x27;,ln:[7,8,9,10]}];
let cur=-1, guessOk=null, mapSel=-1;
const CODE=[
 &#x27;cnn.eval()                                         &lt;span class=&quot;c&quot;&gt;# 0. 실행 모드&lt;/span&gt;&#x27;,
 &#x27;torch.onnx.export(cnn, torch.zeros(1, 1, 28, 28), &quot;mnist_cnn.onnx&quot;,   &lt;span class=&quot;c&quot;&gt;# 1. 내보내기&lt;/span&gt;&#x27;,
 &#x27;                  input_names=[&quot;input&quot;], output_names=[&quot;logits&quot;],&#x27;,
 &#x27;                  **EXPORT_KW)&#x27;,
 &#x27;sess_cnn = ort.InferenceSession(&quot;mnist_cnn.onnx&quot;, providers=[&quot;CPUExecutionProvider&quot;])  &lt;span class=&quot;c&quot;&gt;# 3.&lt;/span&gt;&#x27;,
 &#x27;x0 = (digits[0].astype(np.float32) / 255)[None, None]   &lt;span class=&quot;c&quot;&gt;# (1, 1, 28, 28)&lt;/span&gt;&#x27;,
 &#x27;y_ort = sess_cnn.run(None, {&quot;input&quot;: x0})[0]&#x27;,
 &#x27;with torch.no_grad():&#x27;,
 &#x27;    y_pt = cnn(torch.from_numpy(x0)).numpy()&#x27;,
 &#x27;same = np.allclose(y_ort, y_pt, atol=1e-5)              &lt;span class=&quot;c&quot;&gt;# 4. 확인하기&lt;/span&gt;&#x27;,
 &#x27;print(&quot;예측&quot;, y_ort.argmax(), &quot;| 정답&quot;, labels[0], &quot;| PyTorch 와 같다:&quot;, same)&#x27;];
function drawLoop(){
  $(&#x27;#loop&#x27;).innerHTML=ST.map((s,i)=&gt;`&lt;div class=&quot;fb ${s.today?&#x27;today&#x27;:&#x27;&#x27;} ${i===cur?&#x27;hot&#x27;:i&lt;cur?&#x27;done&#x27;:&#x27;&#x27;}&quot; data-i=&quot;${i}&quot;&gt;&lt;b&gt;${s.k} ${s.t}&lt;/b&gt;&lt;small&gt;${s.s}&lt;/small&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#loop .fb&#x27;).forEach(e=&gt;e.onclick=()=&gt;{if(busy)return;cur=+e.dataset.i;drawLoop();say();});
  code();}
function code(){const hl=cur&gt;=0?ST[cur].ln:[];const zero=cur===0;
  let h=CODE.map((l,i)=&gt;(hl.includes(i)||(zero&amp;&amp;i===0))?`&lt;span class=&quot;a&quot;&gt;${l.replace(/&lt;span class=&quot;c&quot;&gt;/,&#x27;&lt;span class=&quot;c&quot; style=&quot;color:#c9a85a&quot;&gt;&#x27;)}&lt;/span&gt;`:l).join(&#x27;\n&#x27;);
  if(cur===1)h=CODE.slice(0,4).join(&#x27;\n&#x27;)+&#x27;\n&lt;span class=&quot;hl&quot;&gt;# 2. 열어보기 — 빠져 있음! → 오늘 2 · 3 · 4교시에 코드로&lt;/span&gt;\n&#x27;+CODE.slice(4).join(&#x27;\n&#x27;);
  const n=$(&#x27;#gN&#x27;).value, i=$(&#x27;#gI&#x27;).value;
  h+=`\n\n&lt;span class=&quot;c&quot;&gt;# 1-2  기억으로 예측&lt;/span&gt;\nn_nodes_guess = &lt;span class=&quot;hl&quot;&gt;${n===&#x27;&#x27;?&#x27;____&#x27;:esc(n)}&lt;/span&gt;\nn_init_guess = &lt;span class=&quot;hl&quot;&gt;${i===&#x27;&#x27;?&#x27;____&#x27;:esc(i)}&lt;/span&gt;`;
  if(guessOk===true)h+=`\n&lt;span class=&quot;g&quot;&gt;✅ 노드 7 개 · 가중치 텐서 6 개&lt;/span&gt;`;
  if(guessOk===false)h+=`\n&lt;span class=&quot;e&quot;&gt;AssertionError: (7, 6)&lt;/span&gt;`;
  setCode(h);}
function say(){if(cur&lt;0)return;const s=ST[cur];
  const m=[&#x27;① cnn.eval() 후 torch.zeros(1, 1, 28, 28) 로 녹화 → mnist_cnn.onnx&#x27;,&#x27;② 열어보기 — 1-1 셀에는 이 단계가 없습니다. 어제는 Netron 그림, 오늘은 코드 (onnx.load → graph)&#x27;,&#x27;③ ORT 로 첫 번째 숫자 사진 실행 → 예측 7 | 정답 7&#x27;,&#x27;④ np.allclose(y_ort, y_pt, atol=1e-5) → PyTorch 와 같다: True&#x27;][cur];
  setStatus(s.today?&#x27;warn&#x27;:cur===3?&#x27;ok&#x27;:&#x27;info&#x27;,m);}
async function loop(){for(let i=0;i&lt;4;i++){cur=i;drawLoop();say();await sleep(1000);}window.__d2.loop=4;}
$(&#x27;#bLoop&#x27;).onclick=()=&gt;{if(!busy){busy=true;loop().finally(()=&gt;busy=false);}};
function check(){const n=$(&#x27;#gN&#x27;).value,i=$(&#x27;#gI&#x27;).value;
  if(n===&#x27;&#x27;||i===&#x27;&#x27;){guessOk=null;code();setStatus(&#x27;info&#x27;,&#x27;두 칸에 숫자를 쓰세요.&#x27;);return;}
  guessOk=(+n===7&amp;&amp;+i===6);code();window.__d2.guess=guessOk;
  if(guessOk)setStatus(&#x27;ok&#x27;,&#x27;✅ 노드 7 개 (Conv · Relu · MaxPool · Flatten · Gemm · Relu · Gemm) · 가중치 텐서 6 개 (conv · fc1 · fc2 의 weight · bias)\n→ 2교시: len(g.node) · len(g.initializer) 한 줄씩으로 확인&#x27;);
  else setStatus(&#x27;warn&#x27;,`(${n}, ${i}) ≠ (7, 6)\n노드: Conv · Relu · MaxPool · Flatten · Gemm · Relu · Gemm\n가중치 텐서: weight · bias × (Conv, Gemm, Gemm) — Relu · MaxPool · Flatten 은 가중치가 없음`);}
$(&#x27;#bGuess&#x27;).onclick=()=&gt;{if(!busy)check();};
[&#x27;#gN&#x27;,&#x27;#gI&#x27;].forEach(s=&gt;$(s).oninput=()=&gt;{guessOk=null;code();});
const MAP=[
 {q:&#x27;Netron 그림으로만 봤다&#x27;,d:&#x27;그래프를 눈으로만&#x27;,to:[2,3],m:&#x27;2교시: onnx.load → graph 의 input · node · initializer · output 을 코드로. 3교시: 가중치 · 속성을 꺼내 describe_onnx() 표.&#x27;},
 {q:&#x27;중간 shape · opset 은?&#x27;,d:&#x27;Netron 화살표의 숫자 · 판 번호&#x27;,to:[4],m:&#x27;4교시: opset = 연산 사전의 판 번호 (GELU 9개 vs 2개) · checker 로 고장 찾기 · shape_inference 로 중간 shape 채우기.&#x27;},
 {q:&#x27;Got: 4 Expected: 1&#x27;,d:&#x27;배치 4 를 넣으면 오류&#x27;,to:[5],m:&#x27;5교시: dynamic_axes={&quot;input&quot;: {0: &quot;batch&quot;}, ...} → 첫 축이 이름 \&#x27;batch\&#x27; → 100장을 한 번에.&#x27;},
 {q:&#x27;export 는 늘 성공했다&#x27;,d:&#x27;그런데 성공 ≠ 정답&#x27;,to:[6,7],m:&#x27;6교시: 성공했는데 조용히 틀리는 3가지 (if · NumPy · 고정 배치). 7교시: 실패하는 경우 (미지원 연산) · onnxslim 단순화.&#x27;}];
const PER=[&#x27;복습 · 지도&#x27;,&#x27;파일 = 그래프&#x27;,&#x27;가중치 · 속성&#x27;,&#x27;opset · checker&#x27;,&#x27;dynamic_axes&#x27;,&#x27;조용히 틀림&#x27;,&#x27;미지원 · slim&#x27;,&#x27;BrightNet&#x27;];
function drawMap(){
  $(&#x27;#map&#x27;).innerHTML=MAP.map((p,i)=&gt;`&lt;button type=&quot;button&quot; class=&quot;mp ${i===mapSel?&#x27;on&#x27;:&#x27;&#x27;}&quot; data-i=&quot;${i}&quot;&gt;&lt;span class=&quot;q&quot;&gt;${esc(p.q)}&lt;small&gt;${p.d}&lt;/small&gt;&lt;/span&gt;&lt;span class=&quot;arr&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;to&quot;&gt;${p.to.map(t=&gt;`&lt;span&gt;${t}교시&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/span&gt;&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#map .mp&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(busy)return;mapSel=+b.dataset.i;drawMap();setStatus(&#x27;info&#x27;,MAP[mapSel].m);});
  const hot=mapSel&gt;=0?MAP[mapSel].to:[];
  $(&#x27;#tl&#x27;).innerHTML=PER.map((t,i)=&gt;`&lt;div class=&quot;fb ${hot.includes(i+1)?&#x27;hot&#x27;:i===0||i===7?&#x27;done&#x27;:&#x27;&#x27;}&quot;&gt;&lt;b&gt;${i+1}&lt;/b&gt;${t}&lt;/div&gt;`).join(&#x27;&#x27;);}
function stop(){}
const P=[
 {n:&#x27;① 4단계 한 바퀴&#x27;,ex:&#x27;&lt;p&gt;&lt;b class=&quot;amber&quot;&gt;0. eval&lt;/b&gt; → &lt;b&gt;① export&lt;/b&gt; (더미 &lt;code&gt;torch.zeros(1, 1, 28, 28)&lt;/code&gt; · 이름 &lt;code&gt;input&lt;/code&gt; / &lt;code&gt;logits&lt;/code&gt;) → &lt;b class=&quot;purple&quot;&gt;② 열어보기&lt;/b&gt; → &lt;b&gt;③ run&lt;/b&gt; (첫 번째 숫자 사진) → &lt;b class=&quot;teal&quot;&gt;④ allclose&lt;/b&gt;. 결과: 예측 7 | 정답 7 | PyTorch 와 같다: True.&lt;/p&gt;&lt;p&gt;1-1 셀을 잘 보면 ② 가 빠져 있습니다. 어제는 Netron 으로 열었고, 오늘은 &lt;b&gt;코드로&lt;/b&gt; 엽니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{await loop();}},
 {n:&#x27;② 빠진 단계는?&#x27;,ex:&#x27;&lt;p&gt;1-1 셀의 주석 번호는 &lt;code&gt;0. 1. 3. 4.&lt;/code&gt; — &lt;b class=&quot;purple&quot;&gt;2. 열어보기&lt;/b&gt; 가 없습니다.&lt;/p&gt;&lt;p&gt;오늘 2교시 &lt;code&gt;onnx.load&lt;/code&gt; · &lt;code&gt;graph.node&lt;/code&gt;, 3교시 &lt;code&gt;describe_onnx()&lt;/code&gt;, 4교시 &lt;code&gt;checker&lt;/code&gt; · &lt;code&gt;shape_inference&lt;/code&gt; 가 모두 이 ② 를 코드로 하는 방법입니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{for(const i of [0,2,3,1]){cur=i;drawLoop();say();await sleep(800);}}},
 {n:&#x27;③ 기억으로 예측 (1-2)&#x27;,ex:&#x27;&lt;p&gt;노드 = Conv · Relu · MaxPool · Flatten · Gemm · Relu · Gemm = &lt;b class=&quot;green&quot;&gt;7개&lt;/b&gt;. 가중치 텐서 = conv.weight · conv.bias · fc1.weight · fc1.bias · fc2.weight · fc2.bias = &lt;b class=&quot;green&quot;&gt;6개&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;2교시에 &lt;code&gt;len(g.node)&lt;/code&gt; · &lt;code&gt;len(g.initializer)&lt;/code&gt; 로 같은 숫자를 꺼냅니다. 먼저 틀린 답 (7, 3) 을 넣어 봅니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{$(&#x27;#gN&#x27;).value=7;$(&#x27;#gI&#x27;).value=3;code();await sleep(700);check();await sleep(1600);$(&#x27;#gI&#x27;).value=6;code();await sleep(600);check();}},
 {n:&#x27;④ 오늘의 지도&#x27;,ex:&#x27;&lt;p&gt;어제 막혔던 것 4가지 → 오늘의 교시: &lt;b&gt;Netron 만&lt;/b&gt; → 2 · 3교시, &lt;b&gt;중간 shape · opset&lt;/b&gt; → 4교시, &lt;b class=&quot;red&quot;&gt;Got: 4 Expected: 1&lt;/b&gt; → 5교시, &lt;b&gt;export 가 늘 성공한 줄&lt;/b&gt; → 6 · 7교시.&lt;/p&gt;&lt;p&gt;8교시 미니 프로젝트 &lt;b class=&quot;amber&quot;&gt;BrightNet&lt;/b&gt; 은 이 모두를 한 모델에서 고칩니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{for(let i=0;i&lt;4;i++){mapSel=i;drawMap();setStatus(&#x27;info&#x27;,MAP[i].m);await sleep(1300);}mapSel=-1;drawMap();setStatus(&#x27;ok&#x27;,&#x27;1교시 지도 → 2 · 3 · 4 · 5 · 6 · 7교시 → 8교시 BrightNet 에서 모두 사용&#x27;);}},
];
initPresets(P,stop);
drawLoop();drawMap();
$(&#x27;#presets button&#x27;).click();

&lt;/script&gt;

  :root{--bg:#0b1220;--panel:#111a2e;--line:#1f2b45;--text:#dbe4f0;--dim:#8a9bb8;--amber:#f5b942;--teal:#2dd4bf;--blue:#60a5fa;--green:#4ade80;--red:#f87171;--purple:#c084fc;--mono:&quot;Consolas&quot;,&quot;D2Coding&quot;,&quot;JetBrains Mono&quot;,monospace}

&lt;div class=&quot;app&quot;&gt;

&lt;h1&gt;ONNX 파일의 속 구조 — 상자 안의 상자&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;&lt;code&gt;m = onnx.load(&quot;mnist_cnn.onnx&quot;)&lt;/code&gt; 로 읽은 객체는 &lt;b style=&quot;color:var(--blue)&quot;&gt;ModelProto&lt;/b&gt; → &lt;b style=&quot;color:var(--teal)&quot;&gt;GraphProto&lt;/b&gt; → 네 가지 목록 (&lt;b style=&quot;color:var(--amber)&quot;&gt;input · node · initializer · output&lt;/b&gt;) 입니다. 상자를 눌러 그 부분을 꺼내는 코드와 실제 값을 보세요. 아래 그래프에서는 Netron 의 화살표가 사실 &lt;b&gt;이름이 같은 것&lt;/b&gt;일 뿐이라는 것을, 2-4 의 while 루프로 직접 따라가 확인합니다.&lt;/p&gt;

 {op:&#x27;Relu&#x27;,c:&#x27;act&#x27;,in:[&#x27;/fc1/Gemm_output_0&#x27;],out:&#x27;/Relu_1_output_0&#x27;},
 {op:&#x27;Gemm&#x27;,c:&#x27;&#x27;,in:[&#x27;/Relu_1_output_0&#x27;,&#x27;fc2.weight&#x27;,&#x27;fc2.bias&#x27;],out:&#x27;logits&#x27;}];
const INIT={&#x27;conv.weight&#x27;:&#x27;(30, 1, 5, 5)&#x27;,&#x27;conv.bias&#x27;:&#x27;(30,)&#x27;,&#x27;fc1.weight&#x27;:&#x27;(100, 4320)&#x27;,&#x27;fc1.bias&#x27;:&#x27;(100,)&#x27;,&#x27;fc2.weight&#x27;:&#x27;(10, 100)&#x27;,&#x27;fc2.bias&#x27;:&#x27;(10,)&#x27;};
let selK=null, col=false, tStep=-1, tName=null, path=[];   // tStep: 현재 찾은 노드 번호
const isW=x=&gt;x in INIT;
function drawBoxes(){
  $(&#x27;#bModel&#x27;).classList.toggle(&#x27;sel&#x27;,selK===&#x27;model&#x27;);$(&#x27;#bGraph&#x27;).classList.toggle(&#x27;sel&#x27;,selK===&#x27;graph&#x27;);
  $$(&#x27;.lb&#x27;).forEach(b=&gt;b.classList.toggle(&#x27;sel&#x27;,b.dataset.k===selK));
  const K={
   model:&#x27;&lt;span&gt;type&lt;/span&gt;&lt;b&gt;ModelProto&lt;/b&gt;&lt;span&gt;ir_version&lt;/span&gt;&lt;b&gt;9 (파일 형식 버전)&lt;/b&gt;&lt;span&gt;opset&lt;/span&gt;&lt;b&gt;20 (연산 사전 판 번호 — 4교시)&lt;/b&gt;&lt;span&gt;producer&lt;/span&gt;&lt;b&gt;pytorch 2.15.0&lt;/b&gt;&#x27;,
   graph:&#x27;&lt;span&gt;type&lt;/span&gt;&lt;b&gt;GraphProto&lt;/b&gt;&lt;span&gt;안의 목록&lt;/span&gt;&lt;b&gt;input · node · initializer · output · value_info&lt;/b&gt;&#x27;,
   input:&#x27;&lt;span&gt;len(g.input)&lt;/span&gt;&lt;b&gt;1&lt;/b&gt;&lt;span&gt;input&lt;/span&gt;&lt;b style=&quot;color:var(--amber)&quot;&gt;[1, 1, 28, 28]&lt;/b&gt;&lt;span&gt;뜻&lt;/span&gt;&lt;b&gt;바깥에서 넣는 것은 사진뿐&lt;/b&gt;&#x27;,
   output:&#x27;&lt;span&gt;len(g.output)&lt;/span&gt;&lt;b&gt;1&lt;/b&gt;&lt;span&gt;logits&lt;/span&gt;&lt;b style=&quot;color:var(--amber)&quot;&gt;[1, 10]&lt;/b&gt;&#x27;,
   node:&#x27;&lt;span&gt;len(g.node)&lt;/span&gt;&lt;b&gt;7&lt;/b&gt;&lt;span&gt;op_type&lt;/span&gt;&lt;b&gt;Conv · Relu · MaxPool · Flatten · Gemm · Relu · Gemm&lt;/b&gt;&#x27;,
   initializer:&#x27;&lt;span&gt;len(g.initializer)&lt;/span&gt;&lt;b&gt;6&lt;/b&gt;&#x27;+Object.entries(INIT).map(([k,v])=&gt;`&lt;span&gt;${k}&lt;/span&gt;&lt;b style=&quot;color:var(--blue)&quot;&gt;${v}&lt;/b&gt;`).join(&#x27;&#x27;),
   value_info:&#x27;&lt;span&gt;len(g.value_info)&lt;/span&gt;&lt;b&gt;0&lt;/b&gt;&lt;span&gt;4교시&lt;/span&gt;&lt;b&gt;infer_shapes 후 6 (중간 화살표 shape)&lt;/b&gt;&#x27;};
  $(&#x27;#kvB&#x27;).innerHTML=selK?K[selK]:&#x27;&lt;span&gt;선택&lt;/span&gt;&lt;b class=&quot;dim&quot;&gt;상자를 누르세요&lt;/b&gt;&#x27;;
  code1();drawTr();}
function code1(){const c=s=&gt;`&lt;span class=&quot;c&quot;&gt;${s}&lt;/span&gt;`,b=s=&gt;`&lt;span class=&quot;b&quot;&gt;${s}&lt;/span&gt;`,H=(k,s)=&gt;selK===k?`&lt;span class=&quot;a&quot;&gt;${s}&lt;/span&gt;`:s;
  let h=`m = onnx.load(&quot;mnist_cnn.onnx&quot;)
${H(&#x27;graph&#x27;,&#x27;g = m.graph&#x27;)}
${H(&#x27;model&#x27;,&#x27;print(&quot;ir_version :&quot;, m.ir_version)&#x27;)}          ${b(&#x27;# 9&#x27;)}
${H(&#x27;model&#x27;,&#x27;print(&quot;opset      :&quot;, m.opset_import[0].version)&#x27;)}  ${b(&#x27;# 20&#x27;)}
${H(&#x27;model&#x27;,&#x27;print(&quot;producer   :&quot;, m.producer_name, m.producer_version)&#x27;)}

${c(&#x27;# 2-1  네 목록의 길이&#x27;)}
n_in = ${H(&#x27;input&#x27;,&#x27;len(g.input)&#x27;)}               ${b(&#x27;# 1&#x27;)}
n_out = ${H(&#x27;output&#x27;,&#x27;len(g.output)&#x27;)}             ${b(&#x27;# 1&#x27;)}
n_node = ${H(&#x27;node&#x27;,&#x27;len(g.node)&#x27;)}               ${b(&#x27;# 7&#x27;)}
n_init = ${H(&#x27;initializer&#x27;,&#x27;len(g.initializer)&#x27;)}   ${b(&#x27;# 6&#x27;)}
${selK===&#x27;value_info&#x27;?&#x27;&lt;span class=&quot;a&quot;&gt;len(g.value_info)&lt;/span&gt;              &#x27;+b(&#x27;# 0 → 4교시 infer_shapes 후 6&#x27;):&#x27;&#x27;}
${c(&#x27;# 2-2  shape 읽기 (숫자 0 이면 이름)&#x27;)}
def shape_of(vi):
    return [d.dim_value if d.dim_value else d.&lt;span class=&quot;hl&quot;&gt;dim_param&lt;/span&gt;
            for d in vi.type.tensor_type.shape.dim]
${H(&#x27;input&#x27;,&#x27;shape_of(g.input[0])&#x27;)}    ${b(&#x27;# [1, 1, 28, 28]&#x27;)}
${H(&#x27;output&#x27;,&#x27;shape_of(g.output[0])&#x27;)}   ${b(&#x27;# [1, 10]&#x27;)}`;
  if(selK===&#x27;initializer&#x27;)h+=`\n\n${c(&#x27;# 2-3  가중치 이름 집합&#x27;)}\n&lt;span class=&quot;a&quot;&gt;init_names = {t.&lt;span class=&quot;hl&quot;&gt;name&lt;/span&gt; for t in g.initializer}&lt;/span&gt;`;
  setCode(h);}
function drawTr(){
  const hitName=tName;const nodeHot=tStep;
  $(&#x27;#leg&#x27;).innerHTML=col?&#x27;&lt;span style=&quot;--c:var(--teal)&quot;&gt;데이터 (앞에서 온 화살표)&lt;/span&gt;&lt;span style=&quot;--c:var(--blue)&quot;&gt;가중치 (initializer 이름)&lt;/span&gt;&#x27;:&#x27;&lt;span style=&quot;--c:#5d7292&quot;&gt;input · output 이름 목록&lt;/span&gt;&#x27;;
  let h=`&lt;div class=&quot;tio ${hitName===&#x27;input&#x27;||selK===&#x27;input&#x27;?&#x27;hit&#x27;:&#x27;&#x27;}&quot;&gt;input · [1, 1, 28, 28]&lt;/div&gt;`;
  N.forEach((n,i)=&gt;{const hotE=hitName&amp;&amp;n.in.includes(hitName)&amp;&amp;i===nodeHot;
    h+=`&lt;div class=&quot;te ${hotE?&#x27;hot&#x27;:&#x27;&#x27;}&quot;&gt;&lt;/div&gt;`;
    const dim=(selK===&#x27;initializer&#x27;&amp;&amp;!n.in.some(isW))||(tStep&gt;=0&amp;&amp;i!==nodeHot&amp;&amp;!path.includes(i));
    h+=`&lt;div class=&quot;tn ${n.c} ${i===nodeHot?&#x27;hot&#x27;:&#x27;&#x27;} ${dim?&#x27;dimn&#x27;:&#x27;&#x27;}&quot;&gt;&lt;div class=&quot;hd&quot;&gt;${n.op}&lt;i&gt;node[${i}]&lt;/i&gt;&lt;/div&gt;`+
      n.in.map(x=&gt;{const w=isW(x);const cls=(col?(w?&#x27;wt&#x27;:&#x27;dn&#x27;):&#x27;&#x27;)+(x===hitName&amp;&amp;i===nodeHot?&#x27; hit&#x27;:&#x27;&#x27;)+(selK===&#x27;initializer&#x27;&amp;&amp;w?&#x27; hit&#x27;:&#x27;&#x27;);return `&lt;div class=&quot;r ${cls}&quot;&gt;&lt;i&gt;in&lt;/i&gt;${esc(x)}&lt;/div&gt;`;}).join(&#x27;&#x27;)+
      `&lt;div class=&quot;r ${i===nodeHot&amp;&amp;tName===n.out?&#x27;hit&#x27;:&#x27;&#x27;}&quot;&gt;&lt;i&gt;out&lt;/i&gt;${esc(n.out)}&lt;/div&gt;&lt;/div&gt;`;});
  h+=`&lt;div class=&quot;te ${tName===&#x27;logits&#x27;?&#x27;hot&#x27;:&#x27;&#x27;}&quot;&gt;&lt;/div&gt;&lt;div class=&quot;tio ${tName===&#x27;logits&#x27;||selK===&#x27;output&#x27;?&#x27;hit&#x27;:&#x27;&#x27;}&quot;&gt;logits · [1, 10]&lt;/div&gt;`;
  $(&#x27;#tr&#x27;).innerHTML=h;
  $(&#x27;#nb&#x27;).innerHTML=`name = &lt;b&gt;${tName?&#x27;&quot;&#x27;+esc(tName)+&#x27;&quot;&#x27;:&#x27;—&#x27;}&lt;/b&gt;&lt;br&gt;path = [${path.map(i=&gt;&quot;&#x27;&quot;+N[i].op+&quot;&#x27;&quot;).join(&#x27;, &#x27;)}]`;
  code2();}
function code2(){const ph=tStep&lt;0?0:tName===N[tStep].out?2:1;const A=(k,s)=&gt;(tStep&gt;=0&amp;&amp;k===ph)?`&lt;span class=&quot;a&quot;&gt;${s}&lt;/span&gt;`:s;
  let h=`name = g.input[0].name          &lt;span class=&quot;b&quot;&gt;# &#x27;input&#x27;&lt;/span&gt;
path = []
while name != g.output[0].name:  &lt;span class=&quot;b&quot;&gt;# &#x27;logits&#x27; 까지&lt;/span&gt;
${A(1,&#x27;    node = next(n for n in g.node if name in n.input)&#x27;)}
    path.append(node.op_type)
${A(2,&#x27;    name = node.&lt;span class=&quot;hl&quot;&gt;output&lt;/span&gt;[0]&#x27;)}
print(&quot; → &quot;.join(path))`;
  if(tName===&#x27;logits&#x27;)h+=`\n&lt;span class=&quot;g&quot;&gt;Conv → Relu → MaxPool → Flatten → Gemm → Relu → Gemm&lt;/span&gt;\n&lt;span class=&quot;g&quot;&gt;✅ 화살표를 따라가도 노드 순서와 같다 — 7 개&lt;/span&gt;`;
  $(&#x27;#code2&#x27;).innerHTML=h;}
// 한 걸음: name 으로 노드 찾기(phase 1) → output 으로 넘어가기(phase 2)
function step(){
  if(tName===null){tName=&#x27;input&#x27;;tStep=-1;path=[];drawTr();setStatus(&#x27;info&#x27;,&quot;name = g.input[0].name → &#x27;input&#x27;&quot;);return false;}
  if(tName===&#x27;logits&#x27;){setStatus(&#x27;ok&#x27;,&#x27;name == &quot;logits&quot; → while 종료 · path 7개 = graph.node 순서 (topological order)&#x27;);return true;}
  if(tStep&lt;0||tName===N[tStep].out){const i=N.findIndex(n=&gt;n.in.includes(tName));tStep=i;path.push(i);drawTr();
    setStatus(&#x27;info&#x27;,`&#x27;${tName}&#x27; 을 input 으로 가진 노드 → node[${i}] ${N[i].op}${i&gt;0?`\n(node[${i-1}] 의 output 이름 = node[${i}] 의 input 이름 → 화살표 하나)`:&#x27;&#x27;}`);return false;}
  tName=N[tStep].out;drawTr();setStatus(&#x27;info&#x27;,`name = node.output[0] → &#x27;${tName}&#x27;`);return false;}
async function trace(){tName=null;tStep=-1;path=[];drawTr();for(let k=0;k&lt;40;k++){const done=step();await sleep(k===0?500:620);if(done)break;}window.__d2.path=path.length;}
$(&#x27;#bTrace&#x27;).onclick=()=&gt;{if(!busy){busy=true;trace().finally(()=&gt;busy=false);}};
$(&#x27;#bStep&#x27;).onclick=()=&gt;{if(!busy)step();};
$(&#x27;#bReset&#x27;).onclick=()=&gt;{if(busy)return;tName=null;tStep=-1;path=[];drawTr();setStatus(&#x27;info&#x27;,&#x27;처음으로 — 한 걸음 또는 ▶ 를 누르세요.&#x27;);};
$(&#x27;#cCol&#x27;).onchange=()=&gt;{col=$(&#x27;#cCol&#x27;).checked;drawTr();if(col)setStatus(&#x27;info&#x27;,&#x27;teal = 데이터 7개 (노드마다 1개) · blue = 가중치 6개 (Conv · Gemm · Gemm 에 2개씩)&#x27;);};
[$(&#x27;#bModel&#x27;),$(&#x27;#bGraph&#x27;),...$$(&#x27;.lb&#x27;)].forEach(e=&gt;e.onclick=ev=&gt;{ev.stopPropagation();if(busy)return;selK=e.dataset.k;drawBoxes();
  setStatus(&#x27;info&#x27;,{model:&#x27;ModelProto — 가장 바깥 상자: ir_version 9 · opset 20 · producer pytorch&#x27;,graph:&#x27;GraphProto — m.graph 안에 목록 다섯 개&#x27;,input:&#x27;g.input — 1개: input [1, 1, 28, 28]. 가중치는 input 이 아님&#x27;,output:&#x27;g.output — 1개: logits [1, 10]&#x27;,node:&#x27;g.node — 7개. 노드 = op_type + input 이름들 + output 이름들&#x27;,initializer:&#x27;g.initializer — 6개 (conv · fc1 · fc2 의 weight · bias)&#x27;,value_info:&#x27;g.value_info — 지금은 0개. 4교시 shape_inference 로 중간 화살표 6개가 채워짐&#x27;}[selK]);});
function stop(){}
const P=[
 {n:&#x27;① 상자 안의 상자&#x27;,ex:&#x27;&lt;p&gt;&lt;b class=&quot;blue&quot;&gt;ModelProto&lt;/b&gt; (ir_version 9 · opset 20 · producer pytorch) 안에 &lt;b class=&quot;teal&quot;&gt;GraphProto&lt;/b&gt;, 그 안에 &lt;b class=&quot;amber&quot;&gt;input · node · initializer · output&lt;/b&gt; 네 목록 (+ 지금은 비어 있는 value_info).&lt;/p&gt;&lt;p&gt;⚠️ &lt;code&gt;print(m)&lt;/code&gt; 은 가중치 숫자까지 전부 찍혀 화면이 멈출 수 있습니다 — 필요한 부분만 꺼내세요.&lt;/p&gt;&#x27;,
  run:async()=&gt;{for(const k of [&#x27;model&#x27;,&#x27;graph&#x27;,&#x27;input&#x27;,&#x27;node&#x27;,&#x27;initializer&#x27;,&#x27;output&#x27;,&#x27;value_info&#x27;]){selK=k;drawBoxes();setStatus(&#x27;info&#x27;,`${k} 선택`);await sleep(750);}selK=null;drawBoxes();setStatus(&#x27;ok&#x27;,&#x27;ModelProto → GraphProto → input 1 · node 7 · initializer 6 · output 1 · value_info 0&#x27;);}},
 {n:&#x27;② 네 목록의 길이 (2-1)&#x27;,ex:&#x27;&lt;p&gt;&lt;code&gt;len(g.input)&lt;/code&gt; 1 · &lt;code&gt;len(g.output)&lt;/code&gt; 1 · &lt;code&gt;len(g.node)&lt;/code&gt; 7 · &lt;code&gt;len(g.initializer)&lt;/code&gt; 6 — 1교시 예측과 같습니다.&lt;/p&gt;&lt;p&gt;가중치는 input 에 없습니다. &lt;b&gt;바깥에서 넣어 주는 것은 사진뿐&lt;/b&gt;, 가중치는 파일 안에 이미 있습니다. ⚠️ &lt;code&gt;g.inputs&lt;/code&gt; · &lt;code&gt;g.nodes&lt;/code&gt; (복수형) → AttributeError.&lt;/p&gt;&#x27;,
  run:async()=&gt;{for(const k of [&#x27;input&#x27;,&#x27;output&#x27;,&#x27;node&#x27;,&#x27;initializer&#x27;]){selK=k;drawBoxes();await sleep(800);}setStatus(&#x27;ok&#x27;,&#x27;input 1 · output 1 · node 7 · initializer 6 → ✅ 1교시 예측과 같다&#x27;);}},
 {n:&#x27;③ 입력 · 출력 shape (2-2)&#x27;,ex:&#x27;&lt;p&gt;shape 는 &lt;code&gt;type.tensor_type.shape.dim&lt;/code&gt; 목록. 각 축은 숫자 &lt;code&gt;dim_value&lt;/code&gt; 또는 이름 &lt;code&gt;dim_param&lt;/code&gt;.&lt;/p&gt;&lt;p&gt;지금은 모두 숫자: input &lt;b class=&quot;amber&quot;&gt;[1, 1, 28, 28]&lt;/b&gt; → logits &lt;b class=&quot;amber&quot;&gt;[1, 10]&lt;/b&gt;. 5교시 dynamic_axes 뒤에는 첫 축이 &lt;code&gt;\&#x27;batch\&#x27;&lt;/code&gt; 라는 이름이 되어 dim_param 쪽이 쓰입니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{selK=&#x27;input&#x27;;drawBoxes();await sleep(900);selK=&#x27;output&#x27;;drawBoxes();setStatus(&#x27;ok&#x27;,&#x27;input [1, 1, 28, 28] → logits [1, 10] (모두 dim_value)&#x27;);}},
 {n:&#x27;④ 데이터 vs 가중치 (2-3)&#x27;,ex:&#x27;&lt;p&gt;노드의 input 에는 &lt;b class=&quot;teal&quot;&gt;데이터&lt;/b&gt; (앞에서 온 화살표) 와 &lt;b class=&quot;blue&quot;&gt;가중치&lt;/b&gt; (initializer 이름) 가 섞여 있습니다. &lt;code&gt;init_names = {t.name for t in g.initializer}&lt;/code&gt; 로 나눕니다.&lt;/p&gt;&lt;p&gt;모든 노드는 데이터 화살표 1개 + 가중치 0 또는 2개. 이름이 &lt;code&gt;conv.weight&lt;/code&gt; · &lt;code&gt;fc1.bias&lt;/code&gt; 처럼 PyTorch 변수 이름 그대로 — Netron 의 B · C 가 바로 이것.&lt;/p&gt;&#x27;,
  run:async()=&gt;{$(&#x27;#cCol&#x27;).checked=true;col=true;selK=&#x27;initializer&#x27;;drawBoxes();setStatus(&#x27;info&#x27;,&#x27;가중치 6개 강조 (blue) — Conv · Gemm · Gemm&#x27;);await sleep(1500);selK=null;drawBoxes();setStatus(&#x27;ok&#x27;,&#x27;데이터 7개 (노드마다 1) · 가중치 6개 (0 또는 2)&#x27;);}},
 {n:&#x27;⑤ 화살표 따라가기 (2-4)&#x27;,ex:&#x27;&lt;p&gt;입력 이름 &lt;code&gt;\&#x27;input\&#x27;&lt;/code&gt; 에서 출발 → 그 이름을 input 으로 가진 노드를 찾고 → 그 노드의 &lt;b class=&quot;amber&quot;&gt;output[0]&lt;/b&gt; 으로 넘어가기를 &lt;code&gt;\&#x27;logits\&#x27;&lt;/code&gt; 까지 반복.&lt;/p&gt;&lt;p&gt;따라간 순서 = &lt;code&gt;graph.node&lt;/code&gt; 순서. ONNX 는 노드를 &lt;b&gt;계산 순서대로&lt;/b&gt; (topological order) 저장해야 합니다 — 4교시에 이 규칙을 일부러 깨 봅니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{selK=null;drawBoxes();await trace();}},
];
initPresets(P,stop);
drawBoxes();
$(&#x27;#presets button&#x27;).click();

&lt;/script&gt;

  {op:&#x27;GlobalAveragePool&#x27;,c:&#x27;pool&#x27;,p:0,w:[],a:{}},
  {op:&#x27;Flatten&#x27;,c:&#x27;shp&#x27;,p:0,w:[],a:{axis:&#x27;1&#x27;}},
  {op:&#x27;Gemm&#x27;,c:&#x27;&#x27;,p:51,w:[[&#x27;weight&#x27;,&#x27;(3, 16)&#x27;,48,&#x27;3·16&#x27;],[&#x27;bias&#x27;,&#x27;(3,)&#x27;,3,&#x27;3&#x27;]],a:{alpha:&#x27;1.0&#x27;,beta:&#x27;1.0&#x27;,transB:&#x27;1&#x27;}}]}};
let mk=&#x27;cnn&#x27;, sel=0, shown=-1, folded=0;
const cur=()=&gt;M[mk].nodes;
function drawChips(){
  $$(&#x27;#mSel button&#x27;).forEach(b=&gt;b.classList.toggle(&#x27;sel&#x27;,b.dataset.m===mk));
  $(&#x27;#chips&#x27;).innerHTML=cur().map((n,i)=&gt;`${i?&#x27;&lt;span class=&quot;arr&quot;&gt;→&lt;/span&gt;&#x27;:&#x27;&#x27;}&lt;button type=&quot;button&quot; class=&quot;chip ${n.c} ${i===sel?&#x27;sel&#x27;:&#x27;&#x27;}&quot; data-i=&quot;${i}&quot;&gt;&lt;span class=&quot;hd&quot;&gt;${n.op}&lt;/span&gt;&lt;span class=&quot;p ${n.p?&#x27;w&#x27;:&#x27;&#x27;}&quot;&gt;${n.p?fmt(n.p):&#x27;—&#x27;}&lt;/span&gt;&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#chips .chip&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(busy)return;sel=+b.dataset.i;drawChips();drawDet();code();say();});}
function drawDet(){const n=cur()[sel];
  let h=`&lt;h3&gt;가중치 (initializer) — node[${sel}] ${n.op}&lt;/h3&gt;`;
  if(n.w.length){h+=`&lt;div class=&quot;scroll&quot;&gt;&lt;table class=&quot;tt&quot;&gt;&lt;tr&gt;&lt;th&gt;이름&lt;/th&gt;&lt;th&gt;shape&lt;/th&gt;&lt;th&gt;.size&lt;/th&gt;&lt;/tr&gt;${n.w.map(w=&gt;`&lt;tr&gt;&lt;td style=&quot;color:var(--blue)&quot;&gt;${mk===&#x27;cnn&#x27;?w[0]:&#x27;&lt;span class=&quot;dim&quot;&gt;(Conv 의) &lt;/span&gt;&#x27;+w[0]}&lt;/td&gt;&lt;td&gt;${w[1]}&lt;/td&gt;&lt;td&gt;${w[3]} = ${fmt(w[2])}&lt;/td&gt;&lt;/tr&gt;`).join(&#x27;&#x27;)}&lt;tr&gt;&lt;td&gt;합계 params&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;td style=&quot;color:var(--amber)&quot;&gt;${fmt(n.p)}&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;`;}
  else h+=&#x27;&lt;div class=&quot;no&quot;&gt;없음 — 가중치가 없는 노드 (params 0)&lt;/div&gt;&#x27;;
  const a=Object.entries(n.a);
  h+=`&lt;h3&gt;속성 (attribute) — attrs_of(node)&lt;/h3&gt;`+(a.length?`&lt;div class=&quot;kv&quot;&gt;${a.map(([k,v])=&gt;`&lt;span&gt;${k}&lt;/span&gt;&lt;b style=&quot;color:var(--amber)&quot;&gt;${v}&lt;/b&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`:&#x27;&lt;div class=&quot;no&quot;&gt;{} — 속성이 없는 노드&lt;/div&gt;&#x27;);
  if(mk===&#x27;safe&#x27;&amp;&amp;n.w.length)h+=&#x27;&lt;div class=&quot;note&quot;&gt;SafetyNet 의 가중치 이름은 BN 을 합치며 export 가 새로 붙입니다 — 여기서는 shape 만 표시. &lt;code&gt;…&lt;/code&gt; 부분은 노트북에서 &lt;code&gt;attrs_of(n)&lt;/code&gt; 로 전부 확인하세요.&lt;/div&gt;&#x27;;
  $(&#x27;#det&#x27;).innerHTML=h;}
function say(){const n=cur()[sel];
  if(mk===&#x27;cnn&#x27;&amp;&amp;n.op===&#x27;Conv&#x27;)setStatus(&#x27;info&#x27;,&#x27;Conv: kernel_shape [5, 5] · strides [1, 1] · pads [0, 0, 0, 0] (위 · 왼 · 아래 · 오른) = nn.Conv2d(1, 30, 5)\nweight 750 + bias 30 = 780&#x27;);
  else if(mk===&#x27;cnn&#x27;&amp;&amp;n.op===&#x27;MaxPool&#x27;)setStatus(&#x27;info&#x27;,&#x27;MaxPool: kernel_shape [2, 2] · strides [2, 2] = nn.MaxPool2d(2)&#x27;);
  else if(n.op===&#x27;Gemm&#x27;)setStatus(&#x27;info&#x27;,`Gemm: transB = 1 (weight 를 뒤집어 곱함 — Day 1 Netron 에서 본 값) · params ${fmt(n.p)}${n.p===432100?&#x27; — 전체의 99.6%&#x27;:&#x27;&#x27;}`);
  else if(n.op===&#x27;Flatten&#x27;)setStatus(&#x27;info&#x27;,&#x27;Flatten: axis = 1 → (N, 나머지 전부)&#x27;);
  else setStatus(&#x27;info&#x27;,`${n.op}: 가중치 없음 · 속성 {}`);}
function code(){const hl=s=&gt;`&lt;span class=&quot;hl&quot;&gt;${s}&lt;/span&gt;`;const n=cur()[sel];const f=M[mk].file;
  setCode(`&lt;span class=&quot;c&quot;&gt;# 3-1  가중치 = initializer → NumPy&lt;/span&gt;
W = {t.name: onnx.numpy_helper.${hl(&#x27;to_array&#x27;)}(t) for t in g.initializer}
total = sum(a.${hl(&#x27;size&#x27;)} for a in W.values())   &lt;span class=&quot;b&quot;&gt;# ${mk===&#x27;cnn&#x27;?&#x27;433,890&#x27;:&#x27;—&#x27;}&lt;/span&gt;
${mk===&#x27;cnn&#x27;&amp;&amp;n.w.length?n.w.map(w=&gt;`&lt;span class=&quot;a&quot;&gt;W[&quot;${w[0]}&quot;].shape&lt;/span&gt;  &lt;span class=&quot;b&quot;&gt;# ${w[1]} → ${fmt(w[2])} 개&lt;/span&gt;`).join(&#x27;\n&#x27;):&#x27;&#x27;}

&lt;span class=&quot;c&quot;&gt;# 3-2  속성 = attribute&lt;/span&gt;
def attrs_of(node):
    return {a.name: onnx.helper.${hl(&#x27;get_attribute_value&#x27;)}(a) for a in node.attribute}
&lt;span class=&quot;a&quot;&gt;attrs_of(g.node[${sel}])&lt;/span&gt;  &lt;span class=&quot;b&quot;&gt;# ${n.op} ${Object.keys(n.a).length?Object.keys(n.a).slice(0,3).join(&#x27;, &#x27;)+&#x27; …&#x27;:&#x27;{}&#x27;}&lt;/span&gt;

&lt;span class=&quot;c&quot;&gt;# 3-3  요약 표&lt;/span&gt;
df = describe_onnx(&quot;${f}&quot;)
&quot;params&quot;: sum(W_[x].size for x in n.input if x in ${hl(&#x27;W_&#x27;)})
print(&quot;가중치 합계&quot;, f&quot;{df.params.${hl(&#x27;sum&#x27;)}():,}&quot;)   &lt;span class=&quot;b&quot;&gt;# ${mk===&#x27;cnn&#x27;?&#x27;433,890&#x27;:&#x27;1443&#x27;}&lt;/span&gt;`);}
function drawTable(){const ns=cur();const cnn=mk===&#x27;cnn&#x27;;const mx=Math.max(...ns.map(n=&gt;n.p));
  let h=`&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;op_type&lt;/th&gt;${cnn?&#x27;&lt;th&gt;data_in&lt;/th&gt;&lt;th&gt;out&lt;/th&gt;&#x27;:&#x27;&#x27;}&lt;th&gt;params&lt;/th&gt;&lt;th style=&quot;min-width:70px&quot;&gt;&lt;/th&gt;&lt;th&gt;attrs&lt;/th&gt;&lt;/tr&gt;`;
  ns.forEach((n,i)=&gt;{const cls=i&gt;shown?&#x27;pend&#x27;:i===shown?&#x27;new&#x27;:&#x27;&#x27;;const ak=Object.keys(n.a).filter(k=&gt;k!==&#x27;…&#x27;);
    h+=`&lt;tr class=&quot;${cls}&quot;&gt;&lt;td&gt;${i}&lt;/td&gt;&lt;td&gt;${n.op}&lt;/td&gt;${cnn?`&lt;td class=&quot;l&quot;&gt;[${esc(n.data)}]&lt;/td&gt;&lt;td class=&quot;l&quot;&gt;[${esc(n.out)}]&lt;/td&gt;`:&#x27;&#x27;}&lt;td style=&quot;color:${n.p?&#x27;var(--blue)&#x27;:&#x27;var(--dim)&#x27;}&quot;&gt;${fmt(n.p)}&lt;/td&gt;&lt;td&gt;&lt;div class=&quot;pbar&quot;&gt;&lt;i style=&quot;width:${i&lt;=shown?Math.max(n.p?2:0,n.p/mx*100):0}%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;/td&gt;&lt;td class=&quot;l&quot;&gt;${ak.length?&#x27;{&#x27;+ak.slice(0,2).map(k=&gt;`${k}: ${n.a[k]}`).join(&#x27;, &#x27;)+(ak.length&gt;2||n.a[&#x27;…&#x27;]?&#x27;, …&#x27;:&#x27;&#x27;)+&#x27;}&#x27;:&#x27;{}&#x27;}&lt;/td&gt;&lt;/tr&gt;`;});
  $(&#x27;#dt&#x27;).innerHTML=h;
  const tot=ns.slice(0,shown+1).reduce((s,n)=&gt;s+n.p,0);
  $(&#x27;#dSum&#x27;).textContent=shown&lt;0?`${M[mk].file} — ▶ 를 누르면 한 줄씩`:`노드 ${shown+1} / ${ns.length} | 가중치 합계 ${fmt(tot)}`;}
async function build(){shown=-1;drawTable();for(let i=0;i&lt;cur().length;i++){shown=i;sel=i;drawTable();drawChips();drawDet();code();await sleep(520);}
  const tot=cur().reduce((s,n)=&gt;s+n.p,0);window.__d2.total=tot;
  setStatus(&#x27;ok&#x27;,mk===&#x27;cnn&#x27;?&#x27;노드 7 | 가중치 합계 433,890 · params = [780, 0, 0, 0, 432100, 0, 1010]\n✅ describe_onnx 완성 — 8교시와 Day 3 이후에 계속 씀&#x27;:&#x27;노드 9 | ONNX 가중치 합계 1443 — PyTorch 파라미터 1491 과 48 차이 (아래 패널)&#x27;);}
$(&#x27;#bDesc&#x27;).onclick=()=&gt;{if(!busy){busy=true;build().finally(()=&gt;busy=false);}};
const LAY=[[&#x27;Conv2d(3, 8, 3)&#x27;,224,&#x27;conv&#x27;],[&#x27;BatchNorm2d(8) γ · β&#x27;,16,&#x27;bn&#x27;],[&#x27;ReLU · MaxPool2d&#x27;,0,&#x27;&#x27;],[&#x27;Conv2d(8, 16, 3)&#x27;,1168,&#x27;conv&#x27;],[&#x27;BatchNorm2d(16) γ · β&#x27;,32,&#x27;bn&#x27;],[&#x27;ReLU · MaxPool2d&#x27;,0,&#x27;&#x27;],[&#x27;AdaptiveAvgPool · Flatten&#x27;,0,&#x27;&#x27;],[&#x27;Linear(16, 3)&#x27;,51,&#x27;&#x27;]];
function drawFold(){
  if(mk===&#x27;cnn&#x27;){
    $(&#x27;#lay&#x27;).innerHTML=[[&#x27;Conv2d(1, 30, 5)&#x27;,780],[&#x27;ReLU · MaxPool2d(2)&#x27;,0],[&#x27;Linear(4320, 100)&#x27;,432100],[&#x27;Linear(100, 10)&#x27;,1010]].map(l=&gt;`&lt;div class=&quot;ly ${l[1]?&#x27;&#x27;:&#x27;zero&#x27;}&quot;&gt;&lt;span&gt;${l[0]}&lt;/span&gt;&lt;b&gt;${fmt(l[1])}&lt;/b&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
    $(&#x27;#cnt&#x27;).innerHTML=&#x27;433,890 &lt;small&gt;= PyTorch 433,890&lt;/small&gt;&#x27;;
    $(&#x27;#kvF&#x27;).innerHTML=&#x27;&lt;span&gt;차이&lt;/span&gt;&lt;b&gt;0 — BatchNorm 이 없는 모델&lt;/b&gt;&#x27;;
    $(&#x27;#fNote&#x27;).innerHTML=&#x27;SimpleConvNet 은 BN 이 없어 두 숫자가 같습니다. 위에서 &lt;b&gt;safety.onnx&lt;/b&gt; 를 고르고 ▶ 를 눌러 보세요.&#x27;;
    $(&#x27;#bFold&#x27;).disabled=true;return;}
  $(&#x27;#bFold&#x27;).disabled=false;
  $(&#x27;#lay&#x27;).innerHTML=LAY.map((l,i)=&gt;`&lt;div class=&quot;ly ${l[2]} ${l[1]?&#x27;&#x27;:&#x27;zero&#x27;} ${folded&amp;&amp;l[2]===&#x27;bn&#x27;?&#x27;gone&#x27;:&#x27;&#x27;}&quot; id=&quot;ly${i}&quot;&gt;&lt;span&gt;${l[0]}${folded&amp;&amp;l[2]===&#x27;conv&#x27;?&#x27; &lt;span style=&quot;color:var(--purple)&quot;&gt;+ BN&lt;/span&gt;&#x27;:&#x27;&#x27;}&lt;/span&gt;&lt;b&gt;${fmt(l[1])}&lt;/b&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
  const pt=1491-(folded?48:0);
  $(&#x27;#cnt&#x27;).innerHTML=`${folded?&#x27;1,443&#x27;:&#x27;1,491&#x27;} &lt;small&gt;${folded?&#x27;= ONNX 1443 (Conv 224 + Conv 1168 + Gemm 51)&#x27;:&#x27;= PyTorch 파라미터 (BN γ · β 포함)&#x27;}&lt;/small&gt;`;
  $(&#x27;#kvF&#x27;).innerHTML=&#x27;&lt;span&gt;PyTorch&lt;/span&gt;&lt;b&gt;1,491&lt;/b&gt;&lt;span&gt;ONNX&lt;/span&gt;&lt;b style=&quot;color:var(--amber)&quot;&gt;1,443&lt;/b&gt;&lt;span&gt;차이&lt;/span&gt;&lt;b style=&quot;color:var(--purple)&quot;&gt;48 = 8 + 8 + 16 + 16 (BN γ · β)&lt;/b&gt;&#x27;;
  $(&#x27;#fNote&#x27;).innerHTML=&#x27;BN 의 running_mean · running_var 는 학습 파라미터가 아니라 PyTorch 쪽에서도 세지 않습니다. Conv 의 weight · bias 는 &lt;b&gt;개수는 그대로&lt;/b&gt;, 값만 BN 이 녹아 들어가 바뀝니다.&#x27;;}
async function fold(){if(mk!==&#x27;safe&#x27;){mk=&#x27;safe&#x27;;sel=0;shown=-1;drawAll();}folded=0;drawFold();await sleep(700);
  const steps=[[1,0,16],[4,3,32]];let left=1491;
  for(const [b,c,n] of steps){$(&#x27;#ly&#x27;+b).classList.add(&#x27;flash&#x27;);setStatus(&#x27;info&#x27;,`${LAY[b][0]} — γ · β ${n}개를 앞 Conv 의 weight · bias 에 곱하고 더해 넣음`);await sleep(800);
    $(&#x27;#ly&#x27;+b).classList.add(&#x27;gone&#x27;);$(&#x27;#ly&#x27;+c).classList.add(&#x27;flash&#x27;);left-=n;$(&#x27;#cnt&#x27;).innerHTML=`${fmt(left)} &lt;small&gt;BN 이 접히는 중&lt;/small&gt;`;await sleep(900);$(&#x27;#ly&#x27;+c).classList.remove(&#x27;flash&#x27;);}
  folded=1;drawFold();window.__d2.fold=1443;setStatus(&#x27;ok&#x27;,&#x27;PyTorch 1491 − BN γ · β 48 = ONNX 1443\nConv-BN 합치기 (Day 1) — BN 노드가 그래프에서 사라지고 숫자는 Conv 안으로&#x27;);}
$(&#x27;#bFold&#x27;).onclick=()=&gt;{if(!busy){busy=true;fold().finally(()=&gt;busy=false);}};
function drawAll(){if(sel&gt;=cur().length)sel=0;drawChips();drawDet();drawTable();drawFold();code();}
$$(&#x27;#mSel button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(busy)return;mk=b.dataset.m;sel=0;shown=-1;folded=0;drawAll();setStatus(&#x27;info&#x27;,mk===&#x27;cnn&#x27;?&#x27;mnist_cnn.onnx — 노드 7 · initializer 6&#x27;:&#x27;safety.onnx — 노드 9 (BatchNormalization 노드 없음!) · ▶ 로 표를 만들어 보세요&#x27;);});
function stop(){}
const P=[
 {n:&#x27;① 가중치 꺼내기 (3-1)&#x27;,ex:&#x27;&lt;p&gt;&lt;code&gt;W = {t.name: numpy_helper.to_array(t) for t in g.initializer}&lt;/code&gt; → 이름 → NumPy 배열. 개수는 &lt;code&gt;.size&lt;/code&gt; (모든 축 곱) — &lt;code&gt;.shape&lt;/code&gt; 를 개수로 착각하지 마세요.&lt;/p&gt;&lt;p&gt;conv.weight (30, 1, 5, 5) · conv.bias (30,) · fc1.weight (100, 4320) · fc1.bias (100,) · fc2.weight (10, 100) · fc2.bias (10,) = &lt;b class=&quot;teal&quot;&gt;433,890&lt;/b&gt;. &lt;b class=&quot;blue&quot;&gt;fc1.weight 하나가 432,000&lt;/b&gt; — 99.6% 가 Flatten 뒤 Gemm 에.&lt;/p&gt;&#x27;,
  run:async()=&gt;{mk=&#x27;cnn&#x27;;folded=0;shown=-1;drawAll();for(const i of [0,4,6]){sel=i;drawChips();drawDet();code();say();await sleep(1100);}setStatus(&#x27;ok&#x27;,&#x27;합계 433,890 | conv.weight 같은가: True (PyTorch cnn.conv.weight 와 비교)&#x27;);}},
 {n:&#x27;② 속성 꺼내기 (3-2)&#x27;,ex:&#x27;&lt;p&gt;커널 크기 · stride · padding 같은 설정은 &lt;code&gt;node.attribute&lt;/code&gt;. &lt;code&gt;onnx.helper.get_attribute_value&lt;/code&gt; 로 꺼냅니다 (&lt;code&gt;a.ints&lt;/code&gt; · &lt;code&gt;a.i&lt;/code&gt; 를 직접 읽으면 종류마다 필드가 달라 헷갈림).&lt;/p&gt;&lt;p&gt;Conv kernel_shape &lt;b class=&quot;amber&quot;&gt;[5, 5]&lt;/b&gt; · MaxPool kernel_shape &lt;b class=&quot;amber&quot;&gt;[2, 2]&lt;/b&gt; strides &lt;b class=&quot;amber&quot;&gt;[2, 2]&lt;/b&gt; · Gemm transB 1 — PyTorch 코드 &lt;code&gt;nn.Conv2d(1, 30, 5)&lt;/code&gt; · &lt;code&gt;nn.MaxPool2d(2)&lt;/code&gt; 와 같습니다. Relu 는 &lt;code&gt;{}&lt;/code&gt;.&lt;/p&gt;&#x27;,
  run:async()=&gt;{mk=&#x27;cnn&#x27;;folded=0;shown=-1;drawAll();for(const i of [0,2,3,4,1]){sel=i;drawChips();drawDet();code();say();await sleep(1000);}}},
 {n:&#x27;③ describe_onnx 표 (3-3)&#x27;,ex:&#x27;&lt;p&gt;2교시 (이름) + 3교시 (가중치 · 속성) 를 합친 표: &lt;code&gt;op_type · data_in · out · params · attrs&lt;/code&gt;. params 열 = &lt;b class=&quot;blue&quot;&gt;[780, 0, 0, 0, 432100, 0, 1010]&lt;/b&gt; — Day 1 6교시 그림의 보라색 숫자.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Netron 을 코드로 만든 것&lt;/b&gt;. 8교시와 Day 3 이후에도 모든 모델을 이 표로 먼저 봅니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{mk=&#x27;cnn&#x27;;folded=0;drawAll();await build();}},
 {n:&#x27;④ SafetyNet 1491 vs 1443&#x27;,ex:&#x27;&lt;p&gt;SafetyNet 을 같은 표로 보면 노드 9개에 &lt;b&gt;BatchNormalization 이 없습니다&lt;/b&gt;. PyTorch 파라미터 &lt;b&gt;1491&lt;/b&gt;, ONNX 가중치 합계 &lt;b class=&quot;amber&quot;&gt;1443&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;차이 &lt;b class=&quot;purple&quot;&gt;48 = BN γ · β (8 + 8 + 16 + 16)&lt;/b&gt;. Conv-BN 합치기로 BN 의 숫자가 Conv weight · bias 에 녹아 들어가 따로 세어지지 않습니다. ONNX 가중치 수 ≠ PyTorch 파라미터 수일 수 있다!&lt;/p&gt;&#x27;,
  run:async()=&gt;{mk=&#x27;safe&#x27;;sel=0;folded=0;drawAll();await build();await sleep(500);await fold();}},
];
initPresets(P,stop);
drawAll();
$(&#x27;#presets button&#x27;).click();

&lt;/script&gt;

<section class="lesson" id="d2-4" data-title="D2-4 opset 사전 · checker"><iframe title="D2-4 opset 사전 · checker" loading="lazy" srcdoc="&lt;!DOCTYPE html&gt;

let look=-1;
function drawBooks(){
  $(&#x27;#books&#x27;).innerHTML=[13,17,20].map(v=&gt;`&lt;button type=&quot;button&quot; class=&quot;bk ${v===ov?&#x27;sel&#x27;:&#x27;&#x27;}&quot; data-v=&quot;${v}&quot;&gt;&lt;b&gt;${v}&lt;/b&gt;판&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#books .bk&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(busy)return;ov=+b.dataset.v;built=0;look=-1;drawAll();setStatus(&#x27;info&#x27;,`opset ${ov} 사전을 골랐습니다 — export ▶`);});
  $(&#x27;#vLab&#x27;).textContent=ov;
  const ws=WORDS[ov];const has=ws.includes(&#x27;Gelu&#x27;);
  $(&#x27;#page&#x27;).innerHTML=`&lt;div class=&quot;hd&quot;&gt;ONNX 연산 사전 ${ov}판 · G 로 시작하는 단어&lt;/div&gt;`+ws.map((w,i)=&gt;`&lt;div class=&quot;w ${i===look?&#x27;look&#x27;:&#x27;&#x27;} ${look&gt;=ws.length&amp;&amp;w===&#x27;Gelu&#x27;?&#x27;hit&#x27;:&#x27;&#x27;}&quot;&gt;${w}${w===&#x27;Gelu&#x27;?&#x27; ★ 20판에 새로 생김&#x27;:&#x27;&#x27;}&lt;/div&gt;`).join(&#x27;&#x27;)+
   (look&gt;=ws.length&amp;&amp;!has?&#x27;&lt;div class=&quot;w miss&quot;&gt;&quot;Gelu&quot; 없음 → Div · Erf · Add · Mul 로 풀어 씀&lt;/div&gt;&#x27;:&#x27;&#x27;);}
function drawGraph(){const g=ov===20?G20:G13;
  $(&#x27;#gch&#x27;).innerHTML=g.slice(0,built).map((n,i)=&gt;`${i?&#x27;&lt;span class=&quot;arr&quot;&gt;·&lt;/span&gt;&#x27;:&#x27;&#x27;}&lt;span class=&quot;gn ${n[1]} ${i===built-1?&#x27;in&#x27;:&#x27;&#x27;}&quot;&gt;&lt;span class=&quot;hd&quot;&gt;${n[0]}&lt;/span&gt;${n[2]?`&lt;span class=&quot;p&quot;&gt;${n[2]}&lt;/span&gt;`:&#x27;&#x27;}&lt;/span&gt;`).join(&#x27;&#x27;)||&#x27;&lt;span class=&quot;dim&quot; style=&quot;font-size:13px&quot;&gt;export ▶ 를 누르면 노드가 적힙니다&lt;/span&gt;&#x27;;
  let f=&#x27;GELU(x) = x · ½ · (1 + erf(x / √2))&#x27;;
  if(built===g.length)f+=ov===20?` → &lt;b&gt;노드 2개&lt;/b&gt; [Gemm, Gelu]`:ov===13?` → &lt;b&gt;노드 9개&lt;/b&gt; [Gemm, Constant, Div, Erf, Constant, Add, Mul, Constant, Mul]`:` → &lt;b&gt;(예시)&lt;/b&gt; 17판에도 Gelu 단어가 없어 13 처럼 풀어 씀 — 노트북은 13 · 20 만 실행`;
  $(&#x27;#fx&#x27;).innerHTML=f;}
function code4(){const hl=s=&gt;`&lt;span class=&quot;hl&quot;&gt;${s}&lt;/span&gt;`;
  setCode(`gelu_net = nn.Sequential(nn.Linear(4, 4), nn.GELU()).eval()
ops_by_opset = {}
for v in [13, 20]:
    path = f&quot;gelu_op{v}.onnx&quot;
    torch.onnx.export(gelu_net, torch.randn(1, 4), path,
                      opset_version=${hl(&#x27;v&#x27;)}, **EXPORT_KW)
    ops_by_opset[v] = [n.op_type for n in onnx.load(path).graph.node]
&lt;span class=&quot;b&quot;&gt;# opset 13: 9개 [&#x27;Gemm&#x27;, &#x27;Constant&#x27;, &#x27;Div&#x27;, &#x27;Erf&#x27;, &#x27;Constant&#x27;,&lt;/span&gt;
&lt;span class=&quot;b&quot;&gt;#                &#x27;Add&#x27;, &#x27;Mul&#x27;, &#x27;Constant&#x27;, &#x27;Mul&#x27;]&lt;/span&gt;
&lt;span class=&quot;b&quot;&gt;# opset 20: 2개 [&#x27;Gemm&#x27;, &#x27;Gelu&#x27;]&lt;/span&gt;
${ov===17?&#x27;&lt;span class=&quot;a&quot;&gt;# opset 17 은 노트북에서 실행하지 않음 (예시)&lt;/span&gt;\n&#x27;:&#x27;&#x27;}
&lt;span class=&quot;c&quot;&gt;# 두 파일 결과 비교&lt;/span&gt;
print(&quot;opset 13 vs 20 최대 차이:&quot;, np.abs(outs[13] - outs[20]).max())  &lt;span class=&quot;b&quot;&gt;# 0.0&lt;/span&gt;
print(onnx.load(&quot;mnist_cnn.onnx&quot;).opset_import[0].version)          &lt;span class=&quot;b&quot;&gt;# 20 (기본값)&lt;/span&gt;`);}
async function exportG(){built=0;look=-1;drawAll();const ws=WORDS[ov];
  for(let i=0;i&lt;=ws.length;i++){look=i;drawBooks();if(ws[i]===&#x27;Gelu&#x27;){setStatus(&#x27;info&#x27;,`${ov}판 사전에서 &quot;Gelu&quot; 찾음 ✓`);await sleep(500);look=ws.length;drawBooks();break;}await sleep(260);}
  if(!ws.includes(&#x27;Gelu&#x27;))setStatus(&#x27;warn&#x27;,`${ov}판 사전에 &quot;Gelu&quot; 없음 → x · ½ · (1 + erf(x / √2)) 를 아는 단어로 풀어 씀`);
  const g=ov===20?G20:G13;for(let i=1;i&lt;=g.length;i++){built=i;drawGraph();await sleep(ov===20?500:330);}
  window.__d2[&#x27;op&#x27;+ov]=g.length;
  setStatus(ov===17?&#x27;info&#x27;:&#x27;ok&#x27;,ov===20?&#x27;opset 20: 2개 [Gemm, Gelu] — 같은 계산, 한 단어\nopset 13 vs 20 최대 차이: 0.0&#x27;:ov===13?&#x27;opset 13: 9개 — Erf 로 풀어 씀\nopset 13 vs 20 최대 차이: 0.0&#x27;:&#x27;opset 17 (예시): Gelu 단어 없음 → 풀어 씀. 8교시 BrightNet 은 opset 17 로 내보냄&#x27;);}
$(&#x27;#bExp&#x27;).onclick=()=&gt;{if(!busy){busy=true;exportG().finally(()=&gt;busy=false);}};
// ── checker ──
const N=[[&#x27;Conv&#x27;,&#x27;&#x27;,&#x27;input&#x27;,&#x27;/conv/Conv_output_0&#x27;,[1,30,24,24]],[&#x27;Relu&#x27;,&#x27;act&#x27;,&#x27;/conv/Conv_output_0&#x27;,&#x27;/Relu_output_0&#x27;,[1,30,24,24]],[&#x27;MaxPool&#x27;,&#x27;pool&#x27;,&#x27;/Relu_output_0&#x27;,&#x27;/pool/MaxPool_output_0&#x27;,[1,30,12,12]],[&#x27;Flatten&#x27;,&#x27;shp&#x27;,&#x27;/pool/MaxPool_output_0&#x27;,&#x27;/Flatten_output_0&#x27;,[1,4320]],[&#x27;Gemm&#x27;,&#x27;&#x27;,&#x27;/Flatten_output_0&#x27;,&#x27;/fc1/Gemm_output_0&#x27;,[1,100]],[&#x27;Relu&#x27;,&#x27;act&#x27;,&#x27;/fc1/Gemm_output_0&#x27;,&#x27;/Relu_1_output_0&#x27;,[1,100]],[&#x27;Gemm&#x27;,&#x27;&#x27;,&#x27;/Relu_1_output_0&#x27;,&#x27;logits&#x27;,[1,10]]];
let broken=false, fixedOnce=false, inferred=0, outLines=[];
function drawCG(){
  let h=`&lt;div class=&quot;cio&quot;&gt;input · [1, 1, 28, 28]&lt;/div&gt;`;
  N.forEach((n,i)=&gt;{const inName=(i===1&amp;&amp;broken)?&#x27;nope&#x27;:n[2];
    const cut=i===1&amp;&amp;broken;
    const shp=i&gt;0&amp;&amp;inferred&gt;=i?` · &lt;b&gt;[${N[i-1][4].join(&#x27;, &#x27;)}]&lt;/b&gt;`:&#x27;&#x27;;
    h+=`&lt;div class=&quot;ce ${cut?&#x27;cut&#x27;:&#x27;&#x27;} ${i&gt;0&amp;&amp;inferred===i?&#x27;new&#x27;:&#x27;&#x27;}&quot;&gt;&lt;div class=&quot;ln&quot;&gt;&lt;/div&gt;&lt;div class=&quot;lb&quot;&gt;${i===0?&#x27;input&#x27;:esc(N[i-1][3])}${shp}${cut?&#x27; ✗ 아무도 받지 않음&#x27;:&#x27;&#x27;}&lt;/div&gt;&lt;/div&gt;`;
    h+=`&lt;div class=&quot;cn ${n[1]} ${cut?&#x27;bad&#x27;:&#x27;&#x27;}&quot;&gt;&lt;div class=&quot;hd&quot;&gt;${n[0]}&lt;i&gt;node[${i}]&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;r ${cut?&#x27;bad&#x27;:(i===1&amp;&amp;fixedOnce?&#x27;good&#x27;:&#x27;&#x27;)}&quot;&gt;&lt;i&gt;in &lt;/i&gt;${esc(inName)}&lt;/div&gt;&lt;/div&gt;`;});
  h+=`&lt;div class=&quot;ce&quot;&gt;&lt;div class=&quot;ln&quot;&gt;&lt;/div&gt;&lt;div class=&quot;lb&quot;&gt;logits · &lt;b&gt;[1, 10]&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;cio&quot;&gt;logits · [1, 10]&lt;/div&gt;`;
  $(&#x27;#cg&#x27;).innerHTML=h;
  $(&#x27;#vi&#x27;).innerHTML=`len(${inferred?&#x27;mi&#x27;:&#x27;m&#x27;}.graph.value_info) = &lt;b&gt;${inferred}&lt;/b&gt;${inferred===6?&#x27; — 중간 화살표 6개 모두&#x27;:&#x27;&#x27;}`;
  $(&#x27;#bFix&#x27;).disabled=!broken;$(&#x27;#bInfer&#x27;).disabled=broken;
  $(&#x27;#out&#x27;).innerHTML=outLines.join(&#x27;\n&#x27;)||&#x27;&lt;span class=&quot;c&quot;&gt;# 버튼을 순서대로 눌러 보세요&lt;/span&gt;&#x27;;}
function codeC(){setCode(`bad = onnx.load(&quot;mnist_cnn.onnx&quot;)
${broken?&#x27;&lt;span class=&quot;a&quot;&gt;&#x27;:&#x27;&#x27;}bad.graph.node[1].input[0] = &quot;nope&quot;${broken?&#x27;&lt;/span&gt;&#x27;:&#x27;&#x27;}      &lt;span class=&quot;c&quot;&gt;# Relu 입력 화살표를 끊는다&lt;/span&gt;
onnx.checker.check_model(bad)
ort.InferenceSession(bad.SerializeToString(), providers=[&quot;CPUExecutionProvider&quot;])

&lt;span class=&quot;c&quot;&gt;# 4-2  고치기 — 앞 노드(Conv) 의 output 이름&lt;/span&gt;
${fixedOnce&amp;&amp;!broken?&#x27;&lt;span class=&quot;a&quot;&gt;&#x27;:&#x27;&#x27;}bad.graph.node[1].input[0] = bad.graph.node[0].&lt;span class=&quot;hl&quot;&gt;output&lt;/span&gt;[0]${fixedOnce&amp;&amp;!broken?&#x27;&lt;/span&gt;&#x27;:&#x27;&#x27;}
onnx.checker.check_model(bad)

&lt;span class=&quot;c&quot;&gt;# 4-3  중간 shape 채우기 — 결과는 새 모델 mi&lt;/span&gt;
${inferred?&#x27;&lt;span class=&quot;a&quot;&gt;&#x27;:&#x27;&#x27;}mi = onnx.shape_inference.&lt;span class=&quot;hl&quot;&gt;infer_shapes&lt;/span&gt;(m)${inferred?&#x27;&lt;/span&gt;&#x27;:&#x27;&#x27;}
shapes = {vi.name: shape_of(vi) for vi in mi.graph.&lt;span class=&quot;hl&quot;&gt;value_info&lt;/span&gt;}
print(&quot;추론 후 value_info:&quot;, len(shapes))   &lt;span class=&quot;b&quot;&gt;# ${inferred||&#x27;0 → 6&#x27;}&lt;/span&gt;`);$(&#x27;#codeT&#x27;).textContent=&#x27;Python (노트북 4-2 · 4-3)&#x27;;}
function brk(){broken=true;inferred=0;outLines=[&#x27;&lt;span class=&quot;c&quot;&gt;bad.graph.node[1].input[0] = &quot;nope&quot;&lt;/span&gt;&#x27;];drawCG();codeC();setStatus(&#x27;warn&#x27;,&quot;Relu 의 input 이름이 &#x27;nope&#x27; — 그런 이름을 output 으로 내는 노드가 없으니 화살표가 끊김&quot;);}
function chk(){if(broken){outLines.push(&#x27;&lt;span class=&quot;e&quot;&gt;checker → ValidationError : Nodes in a graph must be topologically sorted, however input \&#x27;nope\&#x27; of node: \nname: /Relu OpType: Relu is not output of any previous nodes.&lt;/span&gt;&#x27;);setStatus(&#x27;warn&#x27;,&#x27;checker: &quot;topologically sorted&quot; 규칙 위반 — nope 는 앞 노드들의 output 이 아님&#x27;);}
  else{outLines.push(&#x27;&lt;span class=&quot;g&quot;&gt;checker → 통과 (오류 없음)&lt;/span&gt;&#x27;);setStatus(&#x27;ok&#x27;,&#x27;checker 통과 — 형식이 규칙에 맞음&#x27;);}drawCG();codeC();}
function ortS(){if(broken){outLines.push(&#x27;&lt;span class=&quot;e&quot;&gt;ORT     → [ONNXRuntimeError] : 2 : INVALID_ARGUMENT : Invalid model. Node input \&#x27;nope\&#x27; is not a graph input, initializer, or output of a previous node.&lt;/span&gt;&#x27;);setStatus(&#x27;warn&#x27;,&#x27;ORT 도 세션을 만들지 못함 — 같은 원인을 다른 말로&#x27;);}
  else{outLines.push(&#x27;&lt;span class=&quot;g&quot;&gt;ORT     → 세션 생성 OK · allclose(y, y_pt) True&lt;/span&gt;&#x27;);setStatus(&#x27;ok&#x27;,&#x27;✅ checker 통과 · 결과도 원래대로&#x27;);}drawCG();codeC();}
function fix(){if(!broken)return;broken=false;fixedOnce=true;outLines.push(&#x27;&lt;span class=&quot;t&quot;&gt;고친 이름: /conv/Conv_output_0&lt;/span&gt;&#x27;);drawCG();codeC();setStatus(&#x27;ok&#x27;,&#x27;node[1].input[0] = node[0].output[0] = &quot;/conv/Conv_output_0&quot; — 화살표 다시 연결&#x27;);}
async function infer(){if(broken)return;inferred=0;outLines.push(&#x27;&lt;span class=&quot;c&quot;&gt;추론 전 value_info: 0&lt;/span&gt;&#x27;);drawCG();codeC();await sleep(400);
  for(let i=1;i&lt;=6;i++){inferred=i;drawCG();codeC();setStatus(&#x27;info&#x27;,`${N[i-1][3]}  [${N[i-1][4].join(&#x27;, &#x27;)}]`);await sleep(520);}
  outLines.push(&#x27;&lt;span class=&quot;g&quot;&gt;추론 후 value_info: 6\n  /conv/Conv_output_0     [1, 30, 24, 24]\n  /Relu_output_0          [1, 30, 24, 24]\n  /pool/MaxPool_output_0  [1, 30, 12, 12]\n  /Flatten_output_0       [1, 4320]\n  /fc1/Gemm_output_0      [1, 100]\n  /Relu_1_output_0        [1, 100]&lt;/span&gt;&#x27;);drawCG();window.__d2.vi=6;
  setStatus(&#x27;ok&#x27;,&#x27;✅ 24 → 12 → 4320 을 코드로 — (28 − 5) / 1 + 1 = 24 같은 계산을 Conv 속성 (kernel_shape · strides · pads) 으로&#x27;);}
const W=f=&gt;()=&gt;{if(!busy)f();};
$(&#x27;#bBreak&#x27;).onclick=W(brk);$(&#x27;#bCheck&#x27;).onclick=W(chk);$(&#x27;#bOrt&#x27;).onclick=W(ortS);$(&#x27;#bFix&#x27;).onclick=W(fix);
$(&#x27;#bInfer&#x27;).onclick=()=&gt;{if(!busy){busy=true;infer().finally(()=&gt;busy=false);}};
function drawAll(){drawBooks();drawGraph();code4();$(&#x27;#codeT&#x27;).textContent=&#x27;Python (노트북 4-1)&#x27;;}
function stop(){}
const P=[
 {n:&#x27;① opset 13 vs 20 (4-1)&#x27;,ex:&#x27;&lt;p&gt;GELU(x) = x · ½ · (1 + erf(x / √2)). &lt;b class=&quot;amber&quot;&gt;20판&lt;/b&gt; 사전에는 &lt;code&gt;Gelu&lt;/code&gt; 라는 단어가 있어 한 노드로 적고 (&lt;b&gt;2개&lt;/b&gt;: Gemm · Gelu), &lt;b class=&quot;amber&quot;&gt;13판&lt;/b&gt;에는 없어 Div · Erf · Add · Mul 로 풀어 씁니다 (&lt;b&gt;9개&lt;/b&gt;). 결과 최대 차이 &lt;b class=&quot;green&quot;&gt;0.0&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;⚠️ 실행기 (오래된 장치 · TensorRT 버전) 가 아는 판보다 높은 opset 으로 내보내면 \&#x27;모르는 단어\&#x27; 오류. 배포할 실행기의 지원 판부터 확인하세요.&lt;/p&gt;&#x27;,
  run:async()=&gt;{ov=13;drawAll();await exportG();await sleep(1100);ov=20;drawAll();await exportG();}},
 {n:&#x27;② 끊고 · checker · ORT&#x27;,ex:&#x27;&lt;p&gt;&lt;code&gt;bad.graph.node[1].input[0] = &quot;nope&quot;&lt;/code&gt; — Relu 의 입력 이름을 아무도 내지 않는 이름으로. 2교시 규칙 (output 이름 = input 이름) 이 깨져 화살표가 끊깁니다.&lt;/p&gt;&lt;p&gt;&lt;b class=&quot;red&quot;&gt;checker&lt;/b&gt;: &lt;code&gt;ValidationError: Nodes in a graph must be topologically sorted, however input \&#x27;nope\&#x27; ...&lt;/code&gt; · &lt;b class=&quot;red&quot;&gt;ORT&lt;/b&gt;: &lt;code&gt;Invalid model. Node input \&#x27;nope\&#x27; is not a graph input, initializer, or output of a previous node.&lt;/code&gt;&lt;/p&gt;&#x27;,
  run:async()=&gt;{broken=false;fixedOnce=false;inferred=0;outLines=[];drawCG();codeC();await sleep(500);brk();await sleep(1000);chk();await sleep(1300);ortS();}},
 {n:&#x27;③ 고치기 (4-2)&#x27;,ex:&#x27;&lt;p&gt;Relu 의 input 은 &lt;b&gt;바로 앞 노드 (Conv) 의 output 이름&lt;/b&gt;이어야 합니다. 이름을 손으로 쓰지 말고 &lt;code&gt;bad.graph.node[0].output[0]&lt;/code&gt; 에서 읽어 옵니다 → &lt;code&gt;/conv/Conv_output_0&lt;/code&gt;.&lt;/p&gt;&lt;p&gt;checker 통과 · ORT 결과도 원래대로. 단, checker 통과는 &lt;b&gt;형식 검사&lt;/b&gt;일 뿐 — 결과 확인은 allclose.&lt;/p&gt;&#x27;,
  run:async()=&gt;{if(!broken){outLines=[];brk();await sleep(900);}fix();await sleep(1000);chk();await sleep(900);ortS();}},
 {n:&#x27;④ shape_inference (4-3)&#x27;,ex:&#x27;&lt;p&gt;&lt;code&gt;mi = onnx.shape_inference.infer_shapes(m)&lt;/code&gt; 는 중간 화살표마다 shape 를 계산해 &lt;code&gt;value_info&lt;/code&gt; 에 적은 &lt;b&gt;새 모델&lt;/b&gt;을 돌려줍니다. 0 → &lt;b class=&quot;teal&quot;&gt;6&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;[1, 30, 24, 24] · [1, 30, 24, 24] · [1, 30, 12, 12] · [1, 4320] · [1, 100] · [1, 100]. input · output 은 이미 shape 가 있어 중간 6개만 채워집니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{broken=false;outLines=[];drawCG();await infer();}},
];
initPresets(P,stop);
drawAll();drawCG();
$(&#x27;#presets button&#x27;).click();

&lt;/script&gt;

&lt;body&gt;
&lt;div class=&quot;app&quot;&gt;

&lt;h1&gt;dynamic_axes — 배치 축 열기&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;어제 5교시: 고정 shape 파일에 배치 4 를 넣으면 &lt;b style=&quot;color:var(--red)&quot;&gt;Got: 4 Expected: 1&lt;/b&gt;. 오늘은 export 때 &lt;b style=&quot;color:var(--amber)&quot;&gt;&quot;0번 축은 크기가 바뀔 수 있다&quot;&lt;/b&gt; 고 알려 줍니다. 아래에서 고정 / dynamic 파일에 배치를 바꿔 넣어 보고, 100장을 한 번에 실행한 뒤, 높이 · 너비까지 열면 무슨 일이 생기는지 shape 를 직접 계산해 봅니다.&lt;/p&gt;

    &lt;div class=&quot;tb&quot;&gt;&lt;span&gt;100장 1번&lt;/span&gt;&lt;div class=&quot;t&quot;&gt;&lt;i id=&quot;t2&quot; style=&quot;width:0&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;span id=&quot;t2v&quot;&gt;—&lt;/span&gt;&lt;/div&gt;

&lt;script&gt;
const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];

function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const g=c.getContext(&#x27;2d&#x27;);g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}
function initPresets(P,stop){$(&#x27;#presets&#x27;).innerHTML=P.map(p=&gt;`&lt;button type=&quot;button&quot;&gt;${p.n}&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}
const esc=s=&gt;String(s).replace(/&amp;/g,&#x27;&amp;amp;&#x27;).replace(/&lt;/g,&#x27;&amp;lt;&#x27;).replace(/&gt;/g,&#x27;&amp;gt;&#x27;);
const fmt=n=&gt;n.toLocaleString(&#x27;en-US&#x27;);

failed_op = &quot;${H===32?hl(&#x27;Gemm&#x27;):&#x27;____&#x27;}&quot;`);}
async function run(n){B=n??B;$(&#x27;#sB&#x27;).value=B;drawA();await sleep(300);
  $$(&#x27;#imgs .dg&#x27;).forEach(d=&gt;d.classList.add(&#x27;go&#x27;));drawA(&#x27;keep&#x27;);$(&#x27;#mdl&#x27;).classList.add(&#x27;run&#x27;);await sleep(600);
  if(!dyn&amp;&amp;B!==1){drawA(&#x27;err&#x27;);$(&#x27;#imgs&#x27;).innerHTML=&#x27;&#x27;;
    $(&#x27;#res&#x27;).innerHTML=`&lt;b style=&quot;color:var(--red)&quot;&gt;✗ 오류&lt;/b&gt;`;const re=$(&#x27;#resErr&#x27;);re.style.display=&#x27;block&#x27;;re.innerHTML=`&lt;span class=&quot;e&quot;&gt;[ONNXRuntimeError] : 2 : INVALID_ARGUMENT : Got invalid dimensions for input: input for the following indices\n index: 0 Got: ${B} Expected: 1\n Please fix either the inputs/outputs or the model.&lt;/span&gt;`;

  setStatus(&#x27;ok&#x27;,dyn?`배치 ${B} → (${B}, 10) — &#x27;batch&#x27; 는 이름일 뿐, 숫자로 굳지 않음`:&#x27;배치 1 → (1, 10) — 고정 파일도 1 은 OK&#x27;);window.__d2.last=&#x27;ok&#x27;;}
$(&#x27;#bRun&#x27;).onclick=()=&gt;{if(!busy){busy=true;run().finally(()=&gt;busy=false);}};
$(&#x27;#sB&#x27;).oninput=()=&gt;{if(busy)return;B=+$(&#x27;#sB&#x27;).value;drawA();};
$$(&#x27;#fSel button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(busy)return;dyn=+b.dataset.f;drawA();setStatus(&#x27;info&#x27;,dyn?&quot;dynamic: 0번 축 = 이름 &#x27;batch&#x27; (2-2 의 dim_param)&quot;:&#x27;고정: 모든 축이 숫자 (dim_value)&#x27;);});
function draw100(n){$(&#x27;#dots&#x27;).innerHTML=Array.from({length:100},(_,i)=&gt;`&lt;span class=&quot;${i&lt;n?&#x27;ok&#x27;:&#x27;&#x27;}&quot;&gt;&lt;/span&gt;`).join(&#x27;&#x27;);}
async function hundred(){draw100(0);$(&#x27;#t1&#x27;).style.width=&#x27;0&#x27;;$(&#x27;#t2&#x27;).style.width=&#x27;0&#x27;;$(&#x27;#t1v&#x27;).textContent=&#x27;—&#x27;;$(&#x27;#t2v&#x27;).textContent=&#x27;—&#x27;;

function hwCalc(){const c=H-4,p=c/2,f=30*p*p;return {c,p,f};}

  $$(&#x27;#hSel button&#x27;).forEach(b=&gt;b.classList.toggle(&#x27;sel&#x27;,+b.dataset.h===H));

 {n:&#x27;① 고정 파일에 배치 4&#x27;,ex:&#x27;&lt;p&gt;Day 1 의 &lt;code&gt;mnist_cnn.onnx&lt;/code&gt; 는 모든 축이 숫자 — 입력 &lt;b&gt;[1, 1, 28, 28]&lt;/b&gt;. 배치 1 은 되지만 배치 4 를 넣으면 &lt;b class=&quot;red&quot;&gt;Got: 4 Expected: 1&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;export 가 더미 &lt;code&gt;torch.zeros(1, 1, 28, 28)&lt;/code&gt; 의 shape 를 그대로 굳혔기 때문입니다.&lt;/p&gt;&#x27;,

 {n:&#x27;② dynamic_axes (5-1)&#x27;,ex:&#x27;&lt;p&gt;&lt;code&gt;dynamic_axes={&quot;input&quot;: {0: &quot;batch&quot;}, &quot;logits&quot;: {0: &quot;batch&quot;}}&lt;/code&gt; — &lt;code&gt;{이름: {축 번호: 축 이름}}&lt;/code&gt;. 더미는 여전히 배치 1 이지만 0번 축은 숫자로 굳히지 않습니다 → 입력 &lt;b class=&quot;purple&quot;&gt;[\&#x27;batch\&#x27;, 1, 28, 28]&lt;/b&gt;, 출력 &lt;b class=&quot;purple&quot;&gt;[\&#x27;batch\&#x27;, 10]&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;배치 1 · 4 · 8 모두 OK. 노드 구성은 고정 버전과 같습니다. ⚠️ 키를 input_names 와 다르게 쓰면 (&lt;code&gt;&quot;x&quot;&lt;/code&gt;) 적용되지 않습니다.&lt;/p&gt;&#x27;,

function drawVer(){const c=C[ck];
  if(!verified){$(&#x27;#vt&#x27;).innerHTML=&#x27;&lt;tr&gt;&lt;th&gt;case&lt;/th&gt;&lt;th&gt;입력&lt;/th&gt;&lt;th&gt;PyTorch&lt;/th&gt;&lt;th&gt;ONNX Runtime&lt;/th&gt;&lt;th&gt;결과&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td colspan=&quot;5&quot; class=&quot;dim&quot;&gt;export 후 verify ▶&lt;/td&gt;&lt;/tr&gt;&#x27;;$(&#x27;#vNote&#x27;).innerHTML=&#x27;&#x27;;return;}
  const rows=c.cases(fix,dm);
  $(&#x27;#vt&#x27;).innerHTML=&#x27;&lt;tr&gt;&lt;th&gt;case&lt;/th&gt;&lt;th&gt;입력&lt;/th&gt;&lt;th&gt;PyTorch&lt;/th&gt;&lt;th&gt;ONNX Runtime&lt;/th&gt;&lt;th&gt;결과&lt;/th&gt;&lt;/tr&gt;&#x27;+rows.map(r=&gt;{
    const ok=!r.err&amp;&amp;r.df&lt;=1e-4;const msg=r.err?`&lt;span class=&quot;bad1&quot;&gt;❌ ${esc(r.err)}&lt;/span&gt;`:`&lt;span class=&quot;${ok?&#x27;ok1&#x27;:&#x27;bad1&#x27;}&quot;&gt;${ok?&#x27;✅&#x27;:&#x27;❌&#x27;} 최대 차이 ${fe(r.df)}&lt;/span&gt;`;
    return `&lt;tr&gt;&lt;td class=&quot;l&quot;&gt;${r.n}&lt;/td&gt;&lt;td&gt;${r.x}&lt;/td&gt;&lt;td&gt;${r.pt}&lt;/td&gt;&lt;td style=&quot;${ok?&#x27;&#x27;:&#x27;color:var(--red)&#x27;}&quot;&gt;${r.ort}&lt;/td&gt;&lt;td class=&quot;l&quot;&gt;${msg}&lt;/td&gt;&lt;/tr&gt;`;}).join(&#x27;&#x27;);
  const ex=rows.some(r=&gt;r.ex);
  $(&#x27;#vNote&#x27;).innerHTML=(ex?&#x27;&lt;b&gt;(예시)&lt;/b&gt; 이 더미는 노트북에서 실행하지 않은 경우 — 같은 규칙으로 계산한 값입니다. &#x27;:&#x27;&#x27;)+&#x27;더미와 같은 입력은 녹화된 길과 같아 늘 ✅ — 일부러 &lt;b&gt;다른 경우&lt;/b&gt; (음수 · 다른 값 · 배치 4) 를 넣으세요.&#x27;;}
function code(){const c=C[ck];const hl=s=&gt;`&lt;span class=&quot;hl&quot;&gt;${s}&lt;/span&gt;`;$(&#x27;#codeT&#x27;).textContent=`Python (노트북 ${c.nb})`;
  let h;
  if(ck===&#x27;gate&#x27;)h=`class ${fix?&#x27;GateFix&#x27;:&#x27;Gate&#x27;}(nn.Module):
    def forward(self, x):
${fix?`        return torch.where(${hl(&#x27;x.mean() &gt; 0&#x27;)}, x * 2, x - 1)`:`        if x.mean() &gt; 0:              &lt;span class=&quot;c&quot;&gt;# 파이썬 if — 녹화 안 됨&lt;/span&gt;
            return x * 2
        else:
            return x - 1`}

export_warn(${fix?&#x27;gate_fix&#x27;:&#x27;gate&#x27;}, ${dm===&#x27;pos&#x27;?&#x27;torch.ones(1, 3)&#x27;:&#x27;-torch.ones(1, 3)&#x27;}, &quot;${fix?&#x27;gate_fix&#x27;:&#x27;gate&#x27;}.onnx&quot;,
            input_names=[&quot;input&quot;], output_names=[&quot;output&quot;])
cases_gate = {&quot;양수 [1,2,3]&quot;: ..., &quot;음수 [-3,-2,-1]&quot;: ...}
verify(${fix?&#x27;gate_fix&#x27;:&#x27;gate&#x27;}, &quot;${fix?&#x27;gate_fix&#x27;:&#x27;gate&#x27;}.onnx&quot;, cases_gate)`;
  else if(ck===&#x27;center&#x27;)h=`class ${fix?&#x27;CenterFix&#x27;:&#x27;Center&#x27;}(nn.Module):
    def forward(self, x):
${fix?`        return x - x.${hl(&#x27;mean&#x27;)}(dim=1, keepdim=True)   &lt;span class=&quot;c&quot;&gt;# (1, 3) − (1, 1)&lt;/span&gt;`:`        m = float(np.mean(x.detach().numpy()))   &lt;span class=&quot;c&quot;&gt;# 지금 이 값 → 파이썬 숫자&lt;/span&gt;
        return x - m`}

export_warn(${fix?&#x27;center_fix&#x27;:&#x27;center&#x27;}, torch.full((1, 3), ${dm}.0), &quot;${fix?&#x27;center_fix&#x27;:&#x27;center&#x27;}.onnx&quot;, ...)
verify(${fix?&#x27;center_fix&#x27;:&#x27;center&#x27;}, &quot;${fix?&#x27;center_fix&#x27;:&#x27;center&#x27;}.onnx&quot;, cases_c)
&lt;span class=&quot;c&quot;&gt;# .numpy() · .item() · float(x) · int(x) · .tolist() → 모두 상수로 굳음&lt;/span&gt;`;
  else h=`class ${fix?&#x27;HardFix(Hard)&#x27;:&#x27;Hard(nn.Module)&#x27;}:
    def forward(self, x):
        return self.fc(x.${fix?hl(&#x27;flatten&#x27;)+&#x27;(1)&#x27;:&#x27;view(1, -1)&#x27;})   &lt;span class=&quot;c&quot;&gt;# ${fix?&#x27;(N, 4, 4) → (N, 16)&#x27;:&#x27;(N, 4, 4) → (1, 16N) ← 1 고정&#x27;}&lt;/span&gt;

export_warn(${fix?&#x27;hard_fix&#x27;:&#x27;hard&#x27;}, torch.rand(1, 4, 4), &quot;${fix?&#x27;hard_fix&#x27;:&#x27;hard&#x27;}.onnx&quot;, ...,
            dynamic_axes={&quot;input&quot;: {0: &quot;batch&quot;}, &quot;logits&quot;: {0: &quot;batch&quot;}})
cases_h = {&quot;배치 1&quot;: rand(1, 4, 4), &quot;배치 4&quot;: rand(4, 4, 4)}
verify(${fix?&#x27;hard_fix&#x27;:&#x27;hard&#x27;}, &quot;${fix?&#x27;hard_fix&#x27;:&#x27;hard&#x27;}.onnx&quot;, cases_h)
&lt;span class=&quot;c&quot;&gt;# x.view(x.size(0), -1) 도 OK (7교시에 이것이 만드는 노드)&lt;/span&gt;`;
  setCode(h);}
async function exp(){recN=0;lineSt={};verified=false;recOn=true;drawAll();await sleep(300);const c=C[ck];
  for(const [i,s] of c.path(fix,dm)){lineSt[i]=s===&#x27;rec&#x27;?&#x27;run&#x27;:s;drawFw();await sleep(500);if(s===&#x27;rec&#x27;){lineSt[i]=&#x27;rec&#x27;;drawFw();}}
  const g=c.graph(fix,dm);for(let i=1;i&lt;=g.length;i++){recN=i;drawRec();await sleep(260);}
  recOn=false;drawRec();drawVer();
  const msg={gate:fix?&#x27;두 길을 모두 계산한 뒤 Where 로 고름 — 8개 노드, 경고 없음&#x27;:dm===&#x27;pos&#x27;?&#x27;평균 &gt; 0 → x * 2 길만 녹화 → [Constant, Mul]. else 쪽은 그래프에 없음&#x27;:&#x27;(예시) 평균 &lt; 0 → x − 1 길만 녹화&#x27;,
   center:fix?&#x27;ReduceMean — 평균을 매번 계산&#x27;:`NumPy 를 거친 순간 기록이 끊김 → 평균 ${dm} 이 Constant 로 굳음 → [Constant, Sub]`,
   hard:fix?&#x27;[Flatten, Gemm] — 배치 축은 그대로&#x27;:&#x27;view(1, −1) 의 1 이 Constant [1, −1] 로 → [Constant, Reshape, Gemm]. dynamic_axes 를 줘도 소용없음&#x27;}[ck];
  setStatus(fix?&#x27;ok&#x27;:&#x27;warn&#x27;,&#x27;export 완료 ✓ (오류 없음)\n&#x27;+msg);}
function ver(){verified=true;drawVer();const rows=C[ck].cases(fix,dm);const ok=rows.every(r=&gt;!r.err&amp;&amp;r.df&lt;=1e-4);window.__d2[&#x27;v_&#x27;+ck]=ok;
  if(ok)setStatus(&#x27;ok&#x27;,&#x27;✅ 모든 경우 PyTorch 와 같음&#x27;+(fix?&#x27;&#x27;:&#x27; (더미와 같은 경우만 넣으면 이렇게 속음)&#x27;));
  else setStatus(&#x27;warn&#x27;,ck===&#x27;gate&#x27;?&#x27;❌ 음수 [-3,-2,-1] — PyTorch [-4, -3, -2] vs ORT [-6, -4, -2] · 최대 차이 2.00&#x27;:ck===&#x27;center&#x27;?rows.filter(r=&gt;r.df&gt;1e-4).map(r=&gt;`❌ ${r.n} — PyTorch 는 그 입력의 평균을 빼고, ORT 는 굳은 ${dm} 를 뺌 · 최대 차이 ${r.df.toFixed(1)}`).join(&#x27;\n&#x27;):&#x27;❌ 배치 4 — PyTorch 도 오류: (4, 4, 4) 를 (1, 64) 로 펴서 Linear(16, 2) 에 넣을 수 없음. 더미가 배치 1 이라 export 때는 몰랐던 것&#x27;);}
$(&#x27;#bExp&#x27;).onclick=()=&gt;{if(!busy){busy=true;exp().finally(()=&gt;busy=false);}};
$(&#x27;#bVer&#x27;).onclick=()=&gt;{if(busy)return;if(!recN){setStatus(&#x27;info&#x27;,&#x27;먼저 export_warn ▶&#x27;);return;}ver();};
$(&#x27;#cFix&#x27;).onchange=()=&gt;{if(busy){$(&#x27;#cFix&#x27;).checked=fix;return;}fix=$(&#x27;#cFix&#x27;).checked;reset();drawAll();setStatus(&#x27;info&#x27;,fix?&#x27;고친 코드 — export_warn ▶ 로 다시 녹화&#x27;:&#x27;원래 코드&#x27;);};
function drawAll(){drawTabs();drawFw();drawRec();drawVer();code();}
async function full(k,d){ck=k;dm=d;fix=false;reset();drawAll();await exp();await sleep(700);ver();await sleep(1500);fix=true;reset();drawAll();await sleep(500);await exp();await sleep(600);ver();}
function stop(){}
const P=[
 {n:&#x27;① if — 한쪽 길만&#x27;,ex:&#x27;&lt;p&gt;더미 &lt;code&gt;torch.ones(1, 3)&lt;/code&gt; 는 평균 &gt; 0 → &lt;b class=&quot;amber&quot;&gt;x * 2&lt;/b&gt; 길만 실행 → 그래프 &lt;b&gt;[Constant, Mul]&lt;/b&gt;. else 쪽은 녹화되지 않았습니다. 음수 [-3, -2, -1] 에서 PyTorch [-4, -3, -2] vs ORT &lt;b class=&quot;red&quot;&gt;[-6, -4, -2]&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;고치기: &lt;code&gt;torch.where(x.mean() &gt; 0, x * 2, x - 1)&lt;/code&gt; — 두 결과를 모두 계산한 뒤 조건으로 고름 → [ReduceMean, Constant, Greater, Constant, Mul, Constant, Sub, Where]. 경고 &lt;code&gt;Converting a tensor to a Python boolean&lt;/code&gt; 가 보이면 의심하세요.&lt;/p&gt;&#x27;,
  run:async()=&gt;{await full(&#x27;gate&#x27;,&#x27;pos&#x27;);}},
 {n:&#x27;② NumPy — 값이 굳는다&#x27;,ex:&#x27;&lt;p&gt;&lt;code&gt;float(np.mean(x.detach().numpy()))&lt;/code&gt; — NumPy 를 거치는 순간 PyTorch 는 값의 출처를 기록하지 못합니다. 더미 [5, 5, 5] 의 평균 &lt;b class=&quot;purple&quot;&gt;5&lt;/b&gt; 가 Constant 로 굳어 [Constant, Sub]. 입력 [1, 2, 3] 이면 최대 차이 &lt;b class=&quot;red&quot;&gt;3.0&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;고치기: &lt;code&gt;x - x.mean(dim=1, keepdim=True)&lt;/code&gt; → [Constant, ReduceMean, Sub]. &lt;code&gt;.item()&lt;/code&gt; · &lt;code&gt;float()&lt;/code&gt; · &lt;code&gt;int()&lt;/code&gt; · &lt;code&gt;.tolist()&lt;/code&gt; 도 같은 문제.&lt;/p&gt;&#x27;,
  run:async()=&gt;{await full(&#x27;center&#x27;,&#x27;5&#x27;);}},
 {n:&#x27;③ view(1, −1) — 배치 고정&#x27;,ex:&#x27;&lt;p&gt;&lt;code&gt;x.view(1, -1)&lt;/code&gt; 의 &lt;b&gt;1&lt;/b&gt; 이 그래프에 상수로 → [Constant, Reshape, Gemm]. dynamic_axes 를 줘도 배치 4 는 (1, 64) 가 되어 실패 — 이번엔 &lt;b class=&quot;red&quot;&gt;PyTorch 도 오류&lt;/b&gt;: &lt;code&gt;addmm: mat1 and mat2 shapes cannot be multiplied (1x64 and 16x2)&lt;/code&gt;. 더미가 배치 1 이라 export 때는 몰랐을 뿐.&lt;/p&gt;&lt;p&gt;고치기: &lt;code&gt;x.flatten(1)&lt;/code&gt; (1번 축부터 펴기) → [Flatten, Gemm] · 배치 1 · 4 모두 최대 차이 5.96e-08.&lt;/p&gt;&#x27;,
  run:async()=&gt;{await full(&#x27;hard&#x27;,&#x27;r&#x27;);}},
 {n:&#x27;④ 더미를 바꾸면? (예시)&#x27;,ex:&#x27;&lt;p&gt;Gate 를 &lt;b&gt;음수 더미&lt;/b&gt;로 내보내면 이번엔 &lt;b&gt;x − 1&lt;/b&gt; 길만 녹화됩니다 → 양수 입력이 틀림. Center 를 더미 2 로 내보내면 2 가 굳습니다.&lt;/p&gt;&lt;p&gt;즉 결과가 &lt;b&gt;더미에 따라&lt;/b&gt; 달라집니다. 이 두 경우는 노트북에서 실행하지 않은 &lt;b&gt;(예시)&lt;/b&gt; — 같은 규칙으로 계산했습니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{ck=&#x27;gate&#x27;;dm=&#x27;neg&#x27;;fix=false;reset();drawAll();await exp();await sleep(600);ver();await sleep(1600);ck=&#x27;center&#x27;;dm=&#x27;2&#x27;;fix=false;reset();drawAll();await exp();await sleep(600);ver();}},
];
initPresets(P,stop);
drawAll();
$(&#x27;#presets button&#x27;).click();

&lt;/style&gt;
