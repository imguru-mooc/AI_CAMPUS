&lt;script&gt;
const $=s=&gt;document.querySelector(s), $$=s=&gt;[...document.querySelectorAll(s)];
const RM=window.matchMedia&amp;&amp;window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
const sleep=ms=&gt;new Promise(r=&gt;setTimeout(r,RM?Math.min(ms,80):ms));
let busy=false, timer=null;
function setStatus(c,m){const s=$(&#x27;#status&#x27;);s.className=&#x27;status &#x27;+c;s.innerHTML=m;}
function setCode(h){$(&#x27;#code&#x27;).innerHTML=h;}
function fitCanvas(c){const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;const w=Math.max(10,Math.round(r.width*d)),h=Math.max(10,Math.round(r.height*d));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}const g=c.getContext(&#x27;2d&#x27;);g.setTransform(d,0,0,d,0,0);return [g,r.width,r.height];}
function initPresets(P,stop){$(&#x27;#presets&#x27;).innerHTML=P.map(p=&gt;`&lt;button type=&quot;button&quot;&gt;${p.n}&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#presets button&#x27;).forEach((b,i)=&gt;b.onclick=async()=&gt;{if(busy)return;busy=true;if(stop)stop();$$(&#x27;#presets button&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x===b));$(&#x27;#explain&#x27;).innerHTML=P[i].ex;try{await P[i].run();}finally{busy=false;}});}
const esc=s=&gt;String(s).replace(/&amp;/g,&#x27;&amp;amp;&#x27;).replace(/&lt;/g,&#x27;&amp;lt;&#x27;).replace(/&gt;/g,&#x27;&amp;gt;&#x27;);
const fmt=n=&gt;n.toLocaleString(&#x27;en-US&#x27;);
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
window.__d1={};


const MOD={
 tiny:{n:&#x27;tiny&#x27;,s:[&#x27;export(tiny, randn(1, 3))&#x27;,&#x27;Gemm 1개 · B ⟨2×3⟩ · C ⟨2⟩&#x27;,&#x27;{onnx::Gemm_0: [[1,1,1]]} → [[6.5, −0.5]]&#x27;,&#x27;allclose atol 1e-5 · 20번&#x27;]},
 mlp:{n:&#x27;mlp&#x27;,s:[&#x27;export(mlp, randn(1, 3))&#x27;,&#x27;Gemm → Relu → Gemm · 26개&#x27;,&#x27;run(None, {in_name: x})[0]&#x27;,&#x27;PyTorch 와 allclose&#x27;]},
 cnn:{n:&#x27;MNIST CNN&#x27;,s:[&#x27;zeros(1, 1, 28, 28) · input / logits&#x27;,&#x27;7노드 · 가중치 노드 3 · 1.74 MB&#x27;,&#x27;100장 한 장씩 · /255&#x27;,&#x27;일치율 1.000 · 정확도 1.000&#x27;]},
 mnv3:{n:&#x27;MobileNetV3&#x27;,s:[&#x27;mnv3s.onnx (VB Day 5) · input / logits&#x27;,&#x27;입력 [batch, 3, 224, 224] · 출력 [batch, 1000]&#x27;,&#x27;전처리 6단계 → run&#x27;,&#x27;softmax · top-5 확인&#x27;]},
 safe:{n:&#x27;SafetyNet&#x27;,s:[&#x27;eval() → export(randn(1, 3, 64, 64))&#x27;,&#x27;onnx_report · 9노드 · BN 없음&#x27;,&#x27;{&quot;input&quot;: x} 난수 10개&#x27;,&#x27;최대 차이 &lt; 1e-4 · allclose&#x27;]}};
const LH=[&#x27;1 내보내기&#x27;,&#x27;2 열어보기&#x27;,&#x27;3 실행하기&#x27;,&#x27;4 확인하기&#x27;];
let mod=&#x27;tiny&#x27;, hotS=-1;
function drawLoop(){$(&#x27;#mods&#x27;).innerHTML=Object.entries(MOD).map(([k,m])=&gt;`&lt;button type=&quot;button&quot; data-k=&quot;${k}&quot; class=&quot;${k===mod?&#x27;sel&#x27;:&#x27;&#x27;}&quot;&gt;${m.n}&lt;/button&gt;`).join(&#x27;&#x27;);
  $$(&#x27;#mods button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(busy)return;mod=b.dataset.k;hotS=-1;drawLoop();setStatus(&#x27;info&#x27;,MOD[mod].n+&#x27; — 같은 4단계&#x27;);});
  $(&#x27;#loop&#x27;).innerHTML=MOD[mod].s.map((s,i)=&gt;`&lt;div class=&quot;fb ${i===hotS?&#x27;hot&#x27;:i&lt;hotS?&#x27;done&#x27;:&#x27;&#x27;}&quot;&gt;${LH[i]}&lt;small&gt;${esc(s)}&lt;/small&gt;&lt;/div&gt;`).join(&#x27;&#x27;);}
// 미니 게임
const ANS=[&#x27;safety.eval()&#x27;,&#x27;torch.onnx.export(safety, torch.randn(1, 3, 64, 64), input_names=[&quot;input&quot;], output_names=[&quot;logits&quot;])&#x27;,&#x27;Netron · onnx_report(&quot;safety.onnx&quot;)&#x27;,&#x27;ort.InferenceSession(&quot;safety.onnx&quot;, providers=[&quot;CPUExecutionProvider&quot;])&#x27;,&#x27;sess_s.run(None, {&quot;input&quot;: x})[0]&#x27;,&#x27;np.allclose(out, ref, atol=1e-4)&#x27;];
const TAG=[&#x27;eval&#x27;,&#x27;export&#x27;,&#x27;열어보기&#x27;,&#x27;InferenceSession&#x27;,&#x27;run&#x27;,&#x27;allclose&#x27;];
let order=[], pool=[], graded=false;
function shuffle(){pool=[...ANS.keys()];for(let i=pool.length-1;i&gt;0;i--){const j=(i*7+3)%(i+1);[pool[i],pool[j]]=[pool[j],pool[i]];}order=[];graded=false;drawGame();}
function drawGame(){
  $(&#x27;#pool&#x27;).innerHTML=pool.map(i=&gt;`&lt;button type=&quot;button&quot; draggable=&quot;true&quot; data-i=&quot;${i}&quot;&gt;${esc(TAG[i])}&lt;/button&gt;`).join(&#x27;&#x27;)||&#x27;&lt;span class=&quot;dim&quot; style=&quot;font-size:12.5px&quot;&gt;카드를 모두 놓았습니다 — 채점을 누르세요&lt;/span&gt;&#x27;;
  $$(&#x27;#pool button&#x27;).forEach(b=&gt;{b.onclick=()=&gt;{if(busy)return;put(+b.dataset.i);};b.ondragstart=e=&gt;{e.dataTransfer.setData(&#x27;text/plain&#x27;,b.dataset.i);};});
  $(&#x27;#slots&#x27;).innerHTML=ANS.map((_,k)=&gt;{const i=order[k];const f=i!==undefined;const cls=f?(&#x27;fill &#x27;+(graded?(i===k?&#x27;good&#x27;:&#x27;bad&#x27;):&#x27;&#x27;)):&#x27;&#x27;;
    return `&lt;div class=&quot;slot ${cls}&quot; data-k=&quot;${k}&quot;&gt;&lt;span class=&quot;no&quot;&gt;${k+1}&lt;/span&gt;&lt;span class=&quot;txt&quot;&gt;${f?esc(ANS[i]):&#x27;&lt;span class=&quot;dim&quot;&gt;빈칸&lt;/span&gt;&#x27;}&lt;/span&gt;&lt;span class=&quot;mv&quot;&gt;${f?`&lt;button type=&quot;button&quot; data-a=&quot;up&quot; data-k=&quot;${k}&quot; aria-label=&quot;위로&quot;&gt;▲&lt;/button&gt;&lt;button type=&quot;button&quot; data-a=&quot;dn&quot; data-k=&quot;${k}&quot; aria-label=&quot;아래로&quot;&gt;▼&lt;/button&gt;&lt;button type=&quot;button&quot; data-a=&quot;x&quot; data-k=&quot;${k}&quot; aria-label=&quot;빼기&quot;&gt;✕&lt;/button&gt;`:&#x27;&#x27;}&lt;/span&gt;&lt;/div&gt;`;}).join(&#x27;&#x27;);
  $$(&#x27;#slots .slot&#x27;).forEach(s=&gt;{s.ondragover=e=&gt;{e.preventDefault();s.classList.add(&#x27;over&#x27;);};s.ondragleave=()=&gt;s.classList.remove(&#x27;over&#x27;);
    s.ondrop=e=&gt;{e.preventDefault();s.classList.remove(&#x27;over&#x27;);const i=+e.dataTransfer.getData(&#x27;text/plain&#x27;);if(isNaN(i)||!pool.includes(i))return;const k=+s.dataset.k;
      pool=pool.filter(x=&gt;x!==i);if(order[k]!==undefined)pool.push(order[k]);order[k]=i;compact();graded=false;drawGame();};});
  $$(&#x27;#slots .mv button&#x27;).forEach(b=&gt;b.onclick=()=&gt;{if(busy)return;const k=+b.dataset.k,a=b.dataset.a;graded=false;
    if(a===&#x27;x&#x27;){pool.push(order[k]);order.splice(k,1);}
    else{const j=a===&#x27;up&#x27;?k-1:k+1;if(j&lt;0||j&gt;=order.length)return;[order[k],order[j]]=[order[j],order[k]];}
    drawGame();});
  code();}
function compact(){order=order.filter(x=&gt;x!==undefined);}
function put(i){pool=pool.filter(x=&gt;x!==i);order.push(i);graded=false;drawGame();}
function grade(){graded=true;drawGame();const n=order.filter((i,k)=&gt;i===k).length;window.__d1.score=n;
  if(n===6)setStatus(&#x27;ok&#x27;,&#x27;✅ 6 / 6 — eval → export → 열어보기 → InferenceSession → run → allclose&#x27;);
  else setStatus(&#x27;warn&#x27;,`${n} / 6 칸이 맞음 (빨강 = 위치 틀림)${order.length&lt;6?&#x27; · 빈칸 &#x27;+(6-order.length)+&#x27;개&#x27;:&#x27;&#x27;} — 힌트: eval 은 export 보다 먼저, 비교는 맨 끝`);}

  setCode(`${bnMode===&#x27;eval&#x27;?hl(&#x27;safety.eval()&#x27;):&#x27;&lt;span class=&quot;e&quot;&gt;safety.train()   # ✗&lt;/span&gt;&#x27;}

diff_s = max(diff_s, float(np.abs(out - ref).max()))     &lt;span class=&quot;b&quot;&gt;# ${bnMode===&#x27;eval&#x27;?&#x27;8.2e-08&#x27;:&#x27;큰 값&#x27;}&lt;/span&gt;
&lt;span class=&quot;c&quot;&gt;# 미니 게임 진행: ${k} / 6&lt;/span&gt;`);}

  for(let i=0;i&lt;6;i++){put(i);setStatus(&#x27;info&#x27;,`${i+1}. ${TAG[i]}`);await sleep(600);}grade();}
const P=[
 {n:&#x27;① 모든 모델에 같은 4단계&#x27;,ex:&#x27;&lt;p&gt;tiny 의 Gemm 1개부터 433,890 개 CNN, ImageNet MobileNetV3, 처음 보는 SafetyNet 까지 — 순서는 언제나 &lt;b class=&quot;amber&quot;&gt;내보내기 → 열어보기 → 실행하기 → 확인하기&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;달라지는 것은 더미 입력 shape · 이름 · 전처리뿐입니다.&lt;/p&gt;&#x27;,
  run:async()=&gt;{for(const k of Object.keys(MOD)){mod=k;for(let s=0;s&lt;4;s++){hotS=s;drawLoop();setStatus(&#x27;info&#x27;,`${MOD[k].n} · ${LH[s]}: ${MOD[k].s[s]}`);await sleep(380);}}hotS=4;drawLoop();setStatus(&#x27;ok&#x27;,&#x27;5개 모델 × 같은 4단계&#x27;);}},
 {n:&#x27;② SafetyNet 배포 순서&#x27;,ex:&#x27;&lt;p&gt;정답 순서: &lt;b&gt;eval()&lt;/b&gt; → &lt;b&gt;export&lt;/b&gt; (입력 1×3×64×64, 이름 input / logits) → &lt;b&gt;Netron · onnx_report&lt;/b&gt; → &lt;b&gt;InferenceSession&lt;/b&gt; → &lt;b&gt;run&lt;/b&gt; → &lt;b&gt;allclose&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;eval() 을 export 뒤에 하면 이미 학습 모드로 녹화된 뒤라 소용없습니다. 비교(allclose)는 실행 결과가 있어야 하므로 맨 끝.&lt;/p&gt;&#x27;,

 {n:&#x27;③ 틀린 순서 채점&#x27;,ex:&#x27;&lt;p&gt;export 를 eval() 보다 먼저 하거나, run 을 InferenceSession 보다 먼저 쓰면 틀립니다 — 빨간 칸을 ▲▼ 로 옮겨 고쳐 보세요.&lt;/p&gt;&#x27;,
  run:async()=&gt;{pool=[];order=[1,0,2,4,3,5];graded=false;drawGame();await sleep(700);grade();await sleep(1300);
   for(const [a,b] of [[0,1],[3,4]]){[order[a],order[b]]=[order[b],order[a]];graded=false;drawGame();setStatus(&#x27;info&#x27;,`${a+1} ↔ ${b+1} 교환`);await sleep(800);}grade();}},
 {n:&#x27;④ BN 은 어디로?&#x27;,ex:&#x27;&lt;p&gt;PyTorch SafetyNet 에는 BatchNorm2d 가 2개 있지만 &lt;code&gt;safety.onnx&lt;/code&gt; 에는 &lt;b class=&quot;red&quot;&gt;BatchNormalization 노드가 없습니다&lt;/b&gt; — 노드 9개.&lt;/p&gt;&lt;p&gt;eval 모드의 BN 은 고정된 평균 · 분산으로 &quot;곱하고 더하기&quot; 만 하므로, 바로 앞 Conv 의 weight · bias 에 미리 합쳐 넣을 수 있습니다 (&lt;b class=&quot;amber&quot;&gt;Conv-BN fusion&lt;/b&gt;). 학습 모드로 녹화하면 BN 이 배치 통계를 쓰는 노드로 남아 PyTorch(eval) 와 결과가 크게 달라집니다 — 과제 3 비교에서 바로 드러납니다.&lt;/p&gt;&#x27;,

];

<script>
const ids = [...document.querySelectorAll('nav button')].map(b => b.dataset.id);
function fit(fr) {
  try {
    const d = fr.contentDocument; if (!d || !d.body) return;
    fr.style.height = Math.max(600, d.documentElement.scrollHeight) + 'px';
  } catch (e) {}
}
function show(id, push) {
  if (!ids.includes(id)) id = ids[0];
  document.querySelectorAll('section.lesson').forEach(s => s.classList.toggle('active', s.id === id));
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-current', b.dataset.id === id ? 'true' : 'false'));
  const sec = document.getElementById(id);
  document.title = sec.dataset.title + ' — ONNX·TensorRT Day 1';
  const fr = sec.querySelector('iframe');
  fr.loading = 'eager'; fit(fr);
  if (push) history.replaceState(null, '', '#' + id);
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('section.lesson iframe').forEach(fr => {
  fr.addEventListener('load', () => {
    fit(fr);
    try {
      new ResizeObserver(() => fit(fr)).observe(fr.contentDocument.body);
      fr.contentDocument.addEventListener('keydown', key);   // iframe 안에서도 ← → 동작
    } catch (e) {}
  });
});
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.id, true));
function key(e) {
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const cur = ids.indexOf(location.hash.slice(1) || ids[0]);
  if (e.key === 'ArrowRight' && cur < ids.length - 1) show(ids[cur + 1], true);
  if (e.key === 'ArrowLeft' && cur > 0) show(ids[cur - 1], true);
}
document.addEventListener('keydown', key);
window.addEventListener('resize', () => document.querySelectorAll('section.lesson.active iframe').forEach(fit));
window.addEventListener('hashchange', () => show(location.hash.slice(1), false));   // 주소창에서 #d1-N 을 바꿔도 이동
show(location.hash.slice(1), false);
</script>
