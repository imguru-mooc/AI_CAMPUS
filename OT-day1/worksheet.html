<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONNX·TensorRT Day 1 개념 워크시트</title>
<style>
  :root{--bg:#0b1220;--panel:#111a2e;--line:#1f2b45;--text:#dbe4f0;--dim:#8a9bb8;--amber:#f5b942;--teal:#2dd4bf;--blue:#60a5fa;--green:#4ade80;--red:#f87171;--purple:#c084fc;--mono:"Consolas","D2Coding","JetBrains Mono",monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Noto Sans KR","Segoe UI",sans-serif;font-size:15px;line-height:1.55}
  .app{max-width:920px;margin:0 auto;padding:22px 20px 40px}
  h1{color:var(--amber);font-size:24px;margin:0 0 6px}
  .sub{color:var(--dim);margin:0 0 14px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
  .panel h2{font-size:14px;color:var(--dim);margin:0 0 10px;font-weight:600}
  button{background:#172239;border:1px solid #2a3a5c;color:var(--text);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--amber)}button.active{background:#3a2e12;border-color:var(--amber);color:var(--amber)}
  button.primary{background:#123d33;border-color:var(--teal);color:var(--teal);font-weight:700;padding:9px 18px;font-size:14px}
  button.submit{background:#3a2e12;border-color:var(--amber);color:var(--amber);font-weight:700;padding:9px 18px;font-size:14px}
  button:disabled{opacity:.5;cursor:default}
  button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  input[type=text]{background:#0a0f1c;color:var(--text);border:1px solid #2a3a5c;border-radius:6px;padding:6px 10px;font-family:var(--mono);font-size:14px}
  select{background:#0a0f1c;color:var(--text);border:1px solid #2a3a5c;border-radius:6px;padding:4px 8px;font-family:inherit;font-size:14px}
  .tabs{display:flex;flex-wrap:wrap;gap:6px}
  .tabs button .s{font-family:var(--mono);font-size:11px;color:var(--dim);margin-left:6px}
  .tabs button.graded .s{color:var(--green)}
  .legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .tag{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--dim);font-family:var(--mono)}
  .head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .head .t{color:var(--amber);font-size:17px}
  .head .a{font-size:13px;color:var(--teal);font-family:var(--mono)}
  .q{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;background:#0e1628}
  .q.unans{border-color:#5a3a1a}
  .q.ok{border-color:#1f6b45}.q.bad{border-color:#7a2e2e}
  .qh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .q .n{font-family:var(--mono);color:var(--dim);font-size:12px}
  .ty{font-size:11.5px;border-radius:999px;padding:1px 9px;border:1px solid}
  .q .p{margin:6px 0 10px;font-size:15px}
  .q code,.fb code,.dg code{font-family:var(--mono);color:var(--blue);background:#0a0f1c;padding:1px 5px;border-radius:4px}
  .q pre{font-family:var(--mono);background:#0a0f1c;border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:6px 0 4px;font-size:14px;white-space:pre;overflow-x:auto;line-height:1.9}
  .q pre input{font-size:13px;padding:2px 6px;width:auto;min-width:5ch}
  .opts{display:grid;gap:6px}
  .opt{text-align:left;padding:8px 12px;font-size:14px}
  .opt .box{display:inline-block;width:18px;font-family:var(--mono);color:var(--dim)}
  .opt.sel{border-color:var(--amber);background:#1f1a0c}
  .opt.ok{border-color:var(--green);color:var(--green);background:#0d2216}
  .opt.bad{border-color:var(--red);color:var(--red);background:#2a1212}
  .opt.miss{border-color:var(--green);border-style:dashed}
  .ox{display:flex;gap:10px}
  .ox button{font-size:22px;width:78px;height:54px;font-weight:700}
  .fill{line-height:2.3}
  .mrow{display:grid;grid-template-columns:1fr 24px minmax(160px,1.2fr);gap:8px;align-items:center;margin-bottom:6px}
  .mrow .l{background:#0a0f1c;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:14px}
  .mrow select{width:100%}
  .mrow .arr{color:var(--dim);text-align:center}
  .mrow.ok select{border-color:var(--green)}.mrow.bad select{border-color:var(--red)}
  .ord{list-style:none;margin:0;padding:0;display:grid;gap:6px}
  .ord li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;background:#0a0f1c;border:1px solid #2a3a5c;border-radius:8px;padding:7px 10px;cursor:grab;font-size:14px}
  .ord li.drag{opacity:.4}.ord li.over{border-color:var(--amber)}
  .ord li .k{font-family:var(--mono);color:var(--dim)}
  .ord li .mv button{padding:2px 8px;margin-left:4px}
  .ord li.ok{border-color:var(--green)}.ord li.bad{border-color:var(--red)}
  .hot{background:#0a0f1c;border:1px solid var(--line);border-radius:8px;padding:6px;overflow-x:auto}
  .hot svg{display:block;max-width:100%;height:auto;margin:0 auto}
  .hot .rg{cursor:pointer;fill:transparent;stroke:transparent;stroke-width:2.5}
  .hot .rg:hover{stroke:#f5b94288}
  .hot .rg.sel{stroke:var(--amber);fill:#f5b94222}
  .hot .rg.ok{stroke:var(--green);fill:#4ade8026}
  .hot .rg.bad{stroke:var(--red);fill:#f8717126}
  .card{perspective:900px;max-width:560px}
  .card .in{position:relative;min-height:130px;transition:transform .5s;transform-style:preserve-3d}
  .card.flip .in{transform:rotateY(180deg)}
  .card .f,.card .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;border:1px solid #2a3a5c;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px 18px;font-size:16px}
  .card .f{background:#14203a;color:var(--amber)}
  .card .b{background:#0f2a27;color:var(--teal);transform:rotateY(180deg)}
  @media (prefers-reduced-motion:reduce){.card .in{transition:none}}
  .selfrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
  .selfrow .hint{margin-left:4px}
  .fb{margin-top:10px;font-size:13px;color:var(--dim);border-left:3px solid var(--line);padding-left:10px}
  .fb.ok{border-left-color:var(--green)}.fb.bad{border-left-color:var(--red)}
  .fb b.v{display:block;margin-bottom:2px}
  .fb.ok b.v{color:var(--green)}.fb.bad b.v{color:var(--red)}
  .fb .anim{color:var(--teal);font-family:var(--mono);font-size:12px;display:block;margin-top:3px}
  .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
  .code{font-family:var(--mono);font-size:20px;color:var(--amber);letter-spacing:1px}
  .score{font-family:var(--mono);color:var(--green);font-size:16px}
  .hint{color:var(--dim);font-size:13px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:0;max-width:860px;width:92vw;max-height:88vh}
  dialog::backdrop{background:#000a}
  .dg{padding:18px 20px}
  .dg h3{color:var(--amber);margin:0 0 4px;font-size:20px}
  .dg .meta{color:var(--dim);font-size:13px;margin-bottom:12px;font-family:var(--mono)}
  .dg .sec{margin:14px 0 6px;color:var(--teal);font-weight:700;font-size:14px}
  .dg table{width:100%;border-collapse:collapse;font-size:13px}
  .dg th{text-align:left;color:var(--dim);font-weight:600;padding:5px 8px;border-bottom:1px solid var(--line);font-size:12px}
  .dg td{padding:5px 8px;border-bottom:1px solid #16203a;vertical-align:top}
  .dg .ok{color:var(--green)}.dg .bad{color:var(--red)}.dg .none{color:var(--dim)}
  .dg .sum{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0;font-family:var(--mono)}
  .dgbar{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 20px;display:flex;gap:8px;justify-content:flex-end;align-items:center}
  .toast{color:var(--green);font-size:13px;margin-right:auto}
  .body{overflow:auto;max-height:calc(88vh - 60px)}
  @media(max-width:600px){.mrow{grid-template-columns:1fr;gap:4px}.mrow .arr{display:none}}
</style>
</head>
<body>
<div class="app">
  <h1>ONNX·TensorRT Day 1 개념 워크시트</h1>
  <p class="sub">교시마다 10문항 — 객관식 · O/X · 빈칸 · 짝 맞추기 · 순서 배열 · 핫스팟 · 코드 완성 등 9가지 유형이 섞여 나옵니다. 답을 고른 뒤 아래 <b style="color:var(--teal)">채점하기</b>를 누르면 정오 · 해설과 결과 코드가 나타납니다. 채점 전에는 답을 바꿀 수 있고, 채점 후에는 잠깁니다. 모든 교시를 마치면 <b style="color:var(--amber)">제출</b>로 오답 정리를 열고, <b>캡처</b>로 복사해 노션에 붙여 넣으세요.</p>

  <div class="panel">
    <div class="row"><label style="color:var(--dim);font-size:13px">이름 <input type="text" id="name" placeholder="홍길동"></label><span class="hint">이름은 결과 코드 계산에만 쓰이며 저장되지 않습니다.</span></div>
  </div>
  <div class="panel"><h2>교시</h2><div class="tabs" id="tabs"></div><div class="legend" id="legend"></div></div>
  <div class="panel" id="sheet"></div>
  <div class="panel">
    <div class="actions">
      <button class="primary" id="gradeBtn">채점하기</button>
      <span class="score" id="rscore"></span>
      <span class="hint" id="rhint"></span>
      <span class="code" id="rcode">—</span>
    </div>
    <div class="actions" style="margin-top:12px">
      <button class="submit" id="submitBtn">제출 (오답 정리)</button>
      <button id="resetBtn">이 교시 다시 풀기</button>
    </div>
  </div>
</div>

<dialog id="dlg">
  <div class="body"><div class="dg" id="dgBody"></div></div>
  <div class="dgbar"><span class="toast" id="toast"></span><button id="captureBtn" class="primary">📋 캡처 (노션용 복사)</button><button id="closeBtn">닫기</button></div>
</dialog>

<script>
const Q = [{"t": "1교시 · 왜 ONNX 인가", "anim": "D1-1 학습 vs 실행", "qs": [{"type": "single", "p": "<b>ONNX 파일</b> 한 개에 함께 담기는 두 가지는?", "o": ["가중치 + 학습 데이터", "파이썬 코드 + 옵티마이저 상태", "계산 순서 (그래프) + 가중치", "loss 함수 + 정답 라벨"], "a": 2, "w": "실행하는 쪽에 필요한 것은 <b>계산 순서</b> (무엇을 곱하고 더하고 어떤 함수를 거치는지) 와 <b>가중치</b> 두 가지뿐입니다. ONNX 는 이 둘을 한 파일에 담는 공용 형식 — '누구나 읽을 수 있는 설계도' 입니다.", "an": "D1-1 · 학습 vs 실행"}, {"type": "single", "p": "<code>tiny.pt</code> (state_dict) 를 다른 곳에서 쓰려면 <b>반드시 함께 있어야 하는 것</b>은?", "o": ["모델 구조를 만드는 파이썬 코드 (<code>nn.Linear(3, 2)</code>)", "학습에 쓴 데이터셋", "Netron", "ONNX Runtime"], "a": 0, "w": "<code>tiny.pt</code> 에는 weight (2, 3) 과 bias (2) — 숫자 8개만 있습니다. '이 숫자로 무엇을 어떤 순서로 계산하는지' 는 파이썬 코드에 있으므로 코드가 없으면 쓸 수 없습니다.", "an": "문제 1-1"}, {"type": "multi", "p": "학습이 아니라 <b>실행 (추론) 할 때도 필요한 단계</b>를 모두 고르세요.", "o": ["이미지를 텐서로 바꾸기 (전처리)", "<code>model(x)</code> — forward", "<code>loss.backward()</code>", "<code>opt.step()</code>", "<code>logits.argmax(1)</code> — 결과 해석"], "a": [0, 1, 4], "w": "loss · backward · step 은 정답 (y) 이 있어야 하고 가중치를 바꾸는 <b>학습</b> 단계입니다. 실행은 전처리 → forward → 결과 해석. 이 중 ONNX 파일에 들어가는 것은 forward 뿐이고, 전처리 · 결과 해석은 ONNX 밖의 코드입니다.", "an": "문제 1-2"}, {"type": "ox", "p": "모델을 ONNX 로 바꾸기만 하면 실행 속도는 무조건 빨라진다.", "a": false, "w": "ONNX 는 <b>형식 (설계도)</b> 일 뿐입니다. 빠르기는 그 설계도를 실행하는 실행기 (ONNX Runtime · TensorRT …) 가 정합니다 — Day 3 · 4 에서 직접 측정합니다.", "an": "1교시 · 자주 하는 오해"}, {"type": "short", "p": "ONNX 는 무엇의 줄임말인가요? (영어로)", "a": ["Open Neural Network Exchange"], "w": "Open Neural Network Exchange — 여러 프레임워크와 실행기가 함께 쓰는 신경망 교환 형식입니다.", "an": "1교시 · 왜 ONNX 인가"}, {"type": "drop", "p": "빈칸에 알맞은 것을 고르세요.", "p2": "<code>.pt</code> 파일에는 {} 만 들어 있고, 계산 순서는 {} 에 있다. ONNX 파일에는 {} 이 함께 들어 있다.", "opts": [["학습 데이터", "가중치", "그래프"], ["Netron", "가중치", "파이썬 코드"], ["전처리 코드 + 클래스 이름", "계산 순서 + 가중치", "옵티마이저 + loss"]], "a": [1, 2, 1], "w": "<b>.pt = 가중치만</b>, 계산 순서는 파이썬 코드. <b>ONNX = 계산 순서 + 가중치, 한 파일</b>. 그래서 실행 장치에 파이썬 · PyTorch 가 없어도 됩니다.", "an": "1교시 · 정리"}, {"type": "match", "p": "이름과 하는 일을 짝지으세요.", "left": ["<code>.pt</code> (state_dict)", "<code>.onnx</code>", "ONNX Runtime", "Netron"], "right": ["가중치만 저장한 파일", "계산 순서 + 가중치를 담은 공용 형식 파일", "ONNX 파일을 읽어 실행하는 기계", "ONNX 파일을 그림으로 보여 주는 뷰어"], "a": [0, 1, 2, 3], "w": "오늘 4단계에 모두 나옵니다 — export 로 <code>.onnx</code> 를 만들고, Netron 으로 보고, ONNX Runtime 으로 실행합니다.", "an": "D1-1 · 학습 vs 실행"}, {"type": "order", "p": "오늘 모든 모델에 반복하는 흐름입니다. 순서대로 배열하세요.", "items": ["PyTorch 에서 모델 준비 (학습된 가중치)", "<code>torch.onnx.export</code> 로 내보내기", "Netron 으로 열어보기", "ONNX Runtime 으로 실행하기", "PyTorch 결과와 같은지 확인하기 (<code>np.allclose</code>)"], "w": "내보내기 → 열어보기 → 실행하기 → 확인하기. tiny · mlp · MNIST CNN · SafetyNet 모두 같은 4단계입니다.", "an": "1교시 · 오늘의 4단계"}, {"type": "hot", "p": "학습 한 바퀴의 네 단계입니다. <b>ONNX 파일에 담겨 실행 장치로 가는 단계</b>를 클릭하세요.", "w": "<code>model(x)</code> — forward 입니다. loss 는 정답 y 가 있어야 하고, backward · step 은 가중치를 바꾸는 학습 단계라 실행 장치에는 필요 없습니다. 그래서 이 과목의 ONNX 에는 forward 만 담깁니다.", "an": "D1-1 · 학습 vs 실행", "viewBox": "0 0 720 300", "sw": 720, "svg": "<defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#8a9bb8\"/></marker><marker id=\"ahr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#f87171\"/></marker></defs><text x=\"20\" y=\"20\" font-size=\"12\" fill=\"#dbe4f0\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">학습하는 곳의 한 바퀴 (반복) — 어떤 단계가 ONNX 파일에 담길까?</text><rect x=\"20\" y=\"40\" width=\"440\" height=\"240\" rx=\"8\" fill=\"#101a30\" stroke=\"#2a3a5c\" stroke-width=\"1\"/><text x=\"36\" y=\"58\" font-size=\"12\" fill=\"#f5b942\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"bold\" dominant-baseline=\"middle\">학습하는 곳 — Colab · PyTorch</text><rect x=\"40\" y=\"85\" width=\"190\" height=\"64\" rx=\"6\" fill=\"#14203a\" stroke=\"#60a5fa\" stroke-width=\"1\"/><text x=\"135.0\" y=\"108.0\" font-size=\"12\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"bold\" dominant-baseline=\"middle\">model(x)</text><text x=\"135.0\" y=\"128.0\" font-size=\"10.5\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">forward</text><rect x=\"250\" y=\"85\" width=\"190\" height=\"64\" rx=\"6\" fill=\"#14203a\" stroke=\"#60a5fa\" stroke-width=\"1\"/><text x=\"345.0\" y=\"108.0\" font-size=\"12\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"bold\" dominant-baseline=\"middle\">loss_fn(logits, y)</text><text x=\"345.0\" y=\"128.0\" font-size=\"10.5\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">loss — 정답 y 필요</text><rect x=\"250\" y=\"190\" width=\"190\" height=\"64\" rx=\"6\" fill=\"#14203a\" stroke=\"#60a5fa\" stroke-width=\"1\"/><text x=\"345.0\" y=\"213.0\" font-size=\"12\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"bold\" dominant-baseline=\"middle\">loss.backward()</text><text x=\"345.0\" y=\"233.0\" font-size=\"10.5\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">기울기 계산</text><rect x=\"40\" y=\"190\" width=\"190\" height=\"64\" rx=\"6\" fill=\"#14203a\" stroke=\"#60a5fa\" stroke-width=\"1\"/><text x=\"135.0\" y=\"213.0\" font-size=\"12\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"bold\" dominant-baseline=\"middle\">opt.step()</text><text x=\"135.0\" y=\"233.0\" font-size=\"10.5\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">가중치 수정</text><line x 울기 계산", "x": 250, "y": 190, "w": 190, "h": 64}, {"id": "step", "label": "opt.step() — 가중치 수정", "x": 40, "y": 190, "w": 190, "h": 64}], "a": "fwd"}, {"type": "code", "p": "문제 1-1 · 1-2 — <code>tiny.pt</code> 의 내용을 확인하고, 추론 단계 번호를 쓰세요.", "code": "sd = torch.load(\"tiny.pt\")\nkeys = list(sd.{{}}())                          # ['weight', 'bias']\nn = sum(v.{{}}() for v in sd.values())          # 숫자 8개\n\n# 0 전처리 · 1 forward · 2 loss · 3 backward · 4 opt.step · 5 argmax\ninfer_steps = [{{}}]", "a": [["keys"], ["numel"], ["0, 1, 5", "0,1,5"]], "w": "state_dict 는 딕셔너리처럼 <code>.keys()</code> 로 이름을 봅니다. <code>numel()</code> = 원소 수 → 6 + 2 = 8. 추론에는 0 · 1 · 5 만 필요합니다.", "an": "문제 1-1 · 1-2"}]}, {"t": "2교시 · 첫 ONNX 만들기", "anim": "D1-2 export 는 녹화다", "qs": [{"type": "single", "p": "<code>torch.onnx.export</code> 의 앞 세 인자 순서로 맞는 것은?", "o": ["(파일 이름, 모델, 더미 입력)", "(모델, 파일 이름, 더미 입력)", "(더미 입력, 모델, 파일 이름)", "(모델, 더미 입력, 파일 이름)"], "a": 3, "w": "<code>torch.onnx.export(tiny, dummy, \"tiny.onnx\", **EXPORT_KW)</code> — 모델 · 더미 입력 · 파일 이름 순서. <code>**EXPORT_KW</code> 는 환경 셀에서 만든 옵션으로 매번 그대로 붙입니다.", "an": "문제 2-2"}, {"type": "single", "p": "<code>nn.Linear(3, 2)</code> 의 파라미터 수와, float32 로 저장할 때 차지하는 byte 수는?", "o": ["6개 · 24 B", "8개 · 32 B", "8개 · 64 B", "5개 · 20 B"], "a": 1, "w": "weight 2×3 = 6 + bias 2 = <b>8개</b>, float32 는 숫자 하나에 4 B → <b>32 B</b>. 실제 tiny.onnx 는 249 B — 나머지는 그래프 · 이름 · 버전 정보입니다.", "an": "문제 2-3"}, {"type": "multi", "p": "export 의 <b>더미 입력</b>에 대한 설명으로 옳은 것을 모두 고르세요.", "o": ["값은 아무거나 괜찮다 (randn · zeros 모두 가능)", "shape 가 실제 입력과 맞아야 한다", "dtype 은 float32 로 — float64 로 만들면 ONNX 입력도 float64 로 굳는다", "진짜 학습 이미지여야 결과가 정확하다", "<code>torch.randn(3)</code> 처럼 배치 축 없이 만들어도 실행할 때 (1, 3) 을 받는다"], "a": [0, 1, 2], "w": "export 는 더미 입력을 한 번 흘려 보내며 <b>연산을 녹화</b>하므로 값은 상관없고 shape · dtype 이 중요합니다. 배치 축 없이 만들면 파일도 배치 축이 없는 입력만 받습니다.", "an": "문제 2-1 · 자주 하는 실수"}, {"type": "ox", "p": "tiny.onnx (249 B) 가 파라미터 32 B 보다 훨씬 큰 것은 계산 순서 (그래프) · 입출력 이름 · 버전 같은 설명이 함께 들어 있기 때문이다.", "a": true, "w": "249 − 32 = 217 B 가 그래프와 설명입니다. 큰 모델에서는 이 부분이 무시할 만큼 작아져 <b>파일 크기 ≈ 파라미터 수 × 4 B</b> 가 됩니다 (6교시 MNIST CNN 1.74 MB).", "an": "문제 2-3"}, {"type": "short", "p": "🔁 바꿔보기에서 <code>OUT = 5</code> 로 바꾼 <code>nn.Linear(3, 5)</code> 의 파라미터 수는? (숫자만)", "a": ["20", "20개"], "w": "weight 5×3 = 15 + bias 5 = 20개 → 80 B. 실행 예: 파일 297 B (2 → 5 로 바꿔도 파일은 48 B 만 커짐 = 12개 × 4 B).", "an": "2교시 · 바꿔보기"}, {"type": "drop", "p": "export 가 하는 일입니다. 빈칸을 채우세요.", "p2": "export 는 더미 입력을 {} 흘려 보내며 지나간 연산을 {} 한다. 그래서 더미 입력은 값보다 {} 이 중요하다.", "opts": [["에폭 수만큼", "한 번", "100번"], ["학습", "압축", "녹화 (기록)"], ["shape · dtype", "평균값", "파일 이름"]], "a": [1, 2, 0], "w": "'export 는 녹화다' — 더미 입력으로 forward 를 <b>한 번</b> 실행하며 지나간 연산을 기록합니다. 그래서 dummy 의 모양이 곧 ONNX 파일의 입력 모양이 됩니다.", "an": "D1-2 · export 는 녹화다"}, {"type": "match", "p": "ONNX 내보내기 4단계와 코드를 짝지으세요.", "left": ["① 모델 만들기", "② 더미 입력", "③ export", "④ 파일 확인"], "right": ["<code>tiny = nn.Linear(3, 2)</code> · <code>tiny.eval()</code>", "<code>torch.randn(1, 3)</code>", "<code>torch.onnx.export(tiny, dummy, \"tiny.onnx\")</code>", "<code>onnx.checker.check_model</code> · <code>os.path.getsize</code>"], "a": [0, 1, 2, 3], "w": "check_model 은 파일 형식이 올바른지 검사합니다 (오류가 없으면 통과). 파일 크기로 내용을 짐작할 수 있습니다.", "an": "D1-2 · 4단계"}, {"type": "order", "p": "<code>tiny.onnx</code> 를 만드는 순서로 배열하세요.", "items": ["<code>nn.Linear(3, 2)</code> 만들고 가중치 직접 넣기", "<code>tiny.eval()</code> — 실행 모드", "<code>dummy = torch.randn(1, 3)</code>", "<code>torch.onnx.export(tiny, dummy, \"tiny.onnx\", **EXPORT_KW)</code>", "<code>onnx.checker.check_model</code> 로 검사"], "w": "eval() 은 Dropout · BN 이 있는 모델에서 중요합니다 (tiny 는 영향 없지만 습관으로). 가중치를 직접 넣을 때는 <code>torch.no_grad()</code> 안에서.", "an": "2교시 ① ~ ④"}, {"type": "hot", "p": "<code>tiny = nn.Linear(3, 2)</code> 를 <b>입력 1개씩 실행할 파일</b>로 내보내려 합니다. 올바른 더미 입력을 클릭하세요.", "w": "더미 B <code>torch.randn(1, 3)</code> 입니다 — 배치 1 · 특징 3 · float32. A 는 배치 축이 없어 실행할 때도 (3,) 만 받는 파일이 되고, C 는 입력이 float64 로 굳으며, D 는 in_features 3 과 맞지 않아 forward 자체가 실패합니다.", "an" -width=\"1\"/><text x=\"209\" y=\"130\" font-size=\"12\" fill=\"#f5b942\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"bold\" dominant-baseline=\"middle\">더미 B</text><text x=\"209\" y=\"162\" font-size=\"11\" fill=\"#dbe4f0\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">torch.randn(1, 3)</text><text x=\"209\" y=\"230\" font-size=\"11\" fill=\"#8a9bb8\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">shape (1, 3)</text><text x=\"209\" y=\"254\" font-size=\"11\" fill=\"#8a9bb8\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">dtype float32</text><rect x=\"370\" y=\"110\" width=\"160\" height=\"180\" rx=\"8\" fill=\"#101a30\" stroke=\"#2a3a5c\" stroke-width=\"1\"/><text x=\"384\" y=\"130\" font-size=\"12\" fill=\"#f5b942\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"bold\" dominant-baseline=\"middle\">더미 C</text><text x=\"384\" y=\"162\" font-size=\"11\" fill=\"#dbe4f0\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">torch.randn(1, 3,</text><text x=\"384\" y=\"180\" font-size=\"11\" fill=\"#dbe4f0\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\"> dtype=torch.float64)</text><text x=\"384\" y=\"230\" font-size=\"11\" fill=\"#8a9bb8\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">shape (1, 3)</text><text x=\"384\" y=\"254\" font-size=\"11\" fill=\"#8a9bb8\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">dtype float64</text><rect x=\"545\" y=\"110\" width=\"160\" height=\"180\" rx=\"8\" fill=\"#101a30\" stroke=\"#2a3a5c\" stroke-width=\"1\"/><text x=\"559\" y=\"130\" font-size=\"12\" fill=\"#f5b942\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"bold\" dominant-baseline=\"middle\">더미 D</text><text x=\"559\" y=\"162\" font-size=\"11\" fill=\"#dbe4f0\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">torch.randn(1, 4)</text><text x=\"559\" y=\"230\" font-size=\"11\" fill=\"#8a9bb8\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">shape (1, 4)</text><text x=\"559\" y=\"254\" font-size=\"11\" fill=\"#8a9bb8\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">dtype float32</text>", "regions": [{"id": "da", "label": "더미 A — torch.randn(3)", "x": 20, "y": 110, "w": 160, "h": 180}, {"id": "db", "label": "더미 B — torch.randn(1, 3)", "x": 195, "y": 110, "w": 160, "h": 180}, {"id": "dc", "label": "더미 C — torch.randn(1, 3, dtype=torch.float64)", "x": 370, "y": 110, "w": 160, "h": 180}, {"id": "dd", "label": "더미 D — torch.randn(1, 4)", "x": 545, "y": 110, "w": 160, "h": 180}], "a": "db"}, {"type": "code", "p": "문제 2-1 ~ 2-3 — 더미 입력 · export · 파라미터 byte 를 완성하세요.", "code": "dummy = torch.randn({{}}, 3)                          # (1, 3) float32\ntorch.onnx.export({{}}, dummy, \"tiny.onnx\", **EXPORT_KW)\n\nn_params = sum(p.{{}}() for p in tiny.parameters())      # 8\nparam_bytes = n_params * {{}}                            # 32 B", "a": [["1"], ["tiny"], ["numel"], ["4"]], "w": "float32 = 4 byte. 실행 예: 파라미터 8 개 × 4 B = 32 B | tiny.onnx 249 B.", "an": "문제 2-1 ~ 2-3"}]}, {"t": "3교시 · Netron 으로 보기", "anim": "D1-3 Netron 그래프 읽기", "qs": [{"type": "single", "p": "Netron 에서 tiny.onnx 를 열면 상자가 하나 — <b>Gemm</b> 입니다. Gemm 이 하는 계산은?", "o": ["합성곱 (convolution)", "행렬곱 + 덧셈 (General Matrix Multiply)", "활성화 함수 ReLU", "softmax 로 확률 만들기"], "a": 1, "w": "Gemm = General Matrix Multiply. <code>y = x·Bᵀ + C</code> — nn.Linear 하나가 ONNX 에서 Gemm 노드 하나가 됩니다.", "an": "D1-3 · Netron 그래프 읽기"}, {"type": "single", "p": "tiny.onnx 의 Gemm 상자 옆에 보이는 <code>B</code> 와 <code>C</code> 는?", "o": ["B = 입력, C = 출력", "B = bias ⟨2⟩, C = weight ⟨2×3⟩", "B = weight ⟨2×3⟩, C = bias ⟨2⟩", "B · C 모두 opset 버전 정보"], "a": 2, "w": "B = weight ⟨2×3⟩, C = bias ⟨2⟩ — 파일 안의 가중치 (initializer) 입니다. B 를 클릭하면 숫자 1, 2, 3, 0, −1, 1 이 보입니다.", "an": "3교시 · Netron 확인할 것"}, {"type": "multi", "p": "<code>Linear(3, 4) → ReLU → Linear(4, 2)</code> 를 내보낸 <code>mlp.onnx</code> 에 대해 옳은 것을 모두 고르세요.", "o": ["노드 종류는 순서대로 Gemm, Relu, Gemm", "Relu 노드에는 가중치 (initializer) 가 붙지 않는다", "가중치 개수는 (4·3 + 4) + (2·4 + 2) = 26", "노드는 Linear 2 + ReLU 1 + 입력 1 = 4개", "Relu 노드에도 weight · bias 가 하나씩 있다"], "a": [0, 1, 2], "w": "상자는 계산 순서대로 놓입니다. 입력 · 출력은 노드가 아니라 그래프의 입출력이라 노드는 3개. ReLU 는 가중치 없는 연산.", "an": "문제 3-3"}, {"type": "ox", "p": "Gemm 노드에 <code>transB = 1</code> 속성이 붙는 것은 PyTorch 가 weight 를 (out, in) = (2, 3) 으로 저장하고 <code>x @ W.T</code> 로 계산하기 때문이다.", "a": true, "w": "transB = 1 = 'B 를 전치해서 곱하라'. 그래서 ONNX 의 B 모양도 PyTorch 의 <code>tiny.weight</code> 와 같은 (2, 3) 입니다.", "an": "문제 3-2"}, {"type": "short", "p": "<code>m.graph.node</code> 의 각 노드에서 <b>노드 종류</b> (Gemm, Relu …) 를 담은 속성 이름은? <code>n.____</code>", "a": ["op_type", "n.op_type"], "w": "Netron 의 상자 이름 = <code>op_type</code>. <code>[n.op_type for n in m.graph.node]</code> → <code>['Gemm']</code>.", "an": "문제 3-1"}, {"type": "drop", "p": "Netron 그림 읽는 법입니다.", "p2": "Netron 에서 상자는 {}, 화살표는 {}, 상자 옆 B · C 는 {} 이다.", "opts": [["노드 (연산)", "가중치", "입력 파일"], ["학습 방향", "파일 크기", "데이터 흐름"], ["출력 이름", "가중치 (initializer)", "opset 버전"]], "a": [0, 2, 1], "w": "상자 = 노드, 화살표 = 데이터 흐름, B · C = initializer. 코드로는 <code>onnx.load(path).graph.node</code> · <code>.initializer</code> 로 같은 내용을 봅니다.", "an": "3교시 · 정리"}, {"type": "match", "p": "PyTorch 쪽과 Netron (ONNX) 쪽을 짝지으세요.", "left": ["<code>nn.Linear(3, 2)</code>", "<code>nn.ReLU()</code>", "<code>tiny.weight</code>", "모델에 넣는 x"], "right": ["Gemm 노드", "Relu 노드", "initializer B ⟨2×3⟩", "그래프 입력 <code>onnx::Gemm_0</code>"], "a": [0, 1, 2, 3], "w": "입력 이름 <code>onnx::Gemm_0</code> 은 export 가 자동으로 붙인 것 — 5교시에서 <code>input</code> 으로 바꿉니다.", "an": "D1-3 · Netron 그래프 읽기"}, {"type": "order", "p": "Netron 에 보이는 <code>mlp.onnx</code> 를 위에서 아래로 (계산 순서) 배열하세요.", "items": ["입력 <code>onnx::Gemm_0</code> float32[1,3]", "Gemm (Linear 3 → 4)", "Relu", "Gemm (Linear 4 → 2)", "출력 float32[1,2]"], "w": "nn.Linear → Gemm, nn.ReLU → Relu. 층을 쌓으면 상자가 계산 순서대로 늘어납니다.", "an": "문제 3-3"}, {"type": "hot", "p": "Netron 으로 연 tiny.onnx 입니다. <b>가중치 숫자 1, 2, 3, 0, −1, 1</b> 이 들어 있는 부분을 클릭하세요.", "w": "Gemm 의 <b>B ⟨2×3⟩</b> 입니다 — weight [[1, 2, 3], [0, −1, 1]]. C ⟨2⟩ 는 bias [0.5, −0.5]. 위아래 둥근 상자는 그래프의 입력 · 출력 (이름과 shape) 입니다.", "an": "D1-3 · Netron 그래프 읽기", "viewBox": "0 0 720 320", "sw": 720, "svg": "<defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#8a9bb8\"/></marker><marker id=\"ahr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#f87171\"/></marker></defs><text x=\"20\" y=\"20\" font-size=\"12\" fill=\"#dbe4f0\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">Netron 에서 연 tiny.onnx (Gemm 상자를 클릭한 모습)</text><rect x=\"260\" y=\"40\" width=\"200\" height=\"52\" rx=\"26\" fill=\"#1b2438\" stroke=\"#3b4a6b\" stroke-width=\"1\"/><text x=\"360\" y=\"58\" font-size=\"12\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"bold\" dominant-baseline=\"middle\">onnx::Gemm_0</text><text x=\"360\" y=\"77\" font-size=\"10.5\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">float32[1,3]</text><line x1=\"360\" y1=\"94\" x2=\"360\" y2=\"118\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"230\" y=\"120\" width=\"260\" height=\"92\" rx=\"6\" fill=\"#14203a\" stroke=\"#60a5fa\" stroke-width=\"1\"/><rect x=\"230\" y=\"120\" width=\"260\" height=\"30\" rx=\"6\" fill=\"#1e3a5f\"/><text x=\"360\" y=\"135\" font-size=\"13\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"bold\" dominant-baseline=\"middle\">Gemm</text><line x1=\"230\" y1=\"181\" x2=\"490\" y2=\"181\" stroke=\"#2a3a5c\"/><text x=\"250\" y=\"166\" font-size=\"12\" fill=\"#f5b942\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"bold\" dominant-baseline=\"middle\">B</text><text x=\"290\" y=\"166\" font-size=\"12\" fill=\"#dbe4f0\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">⟨2×3⟩</text><text x=\"250\" y=\"197\" font-size=\"12\" fill=\"#f5b942\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"bold\" dominant-baseline=\"middle\">C</text><text x=\"290\" y=\"197\" font-size=\"12\" fill=\"#dbe4f0\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">⟨2⟩</text><text x=\"510\" y=\"135\" font-size=\"11\" fill=\"#8a9bb8\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">transB = 1</text><line x1=\"360\" y1=\"214\" x2=\"360\" y2=\"246\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"260\" y=\"248\" width=\"200\" height=\"52\" rx=\"26\" fill=\"#1b2438\" stroke=\"#3b4a6b\" stroke-width=\"1\"/><text x=\"360\" y=\"266\" font-size=\"12\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"bold\" dominant-baseline=\"middle\">3</text><text x=\"360\" y=\"285\" font-size=\"10.5\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">float32[1,2]</text>", "regions": [{"id": "in", "label": "입력 onnx::Gemm_0 float32[1,3]", "x": 260, "y": 40, "w": 200, "h": 52}, {"id": "B", "label": "Gemm 의 B ⟨2×3⟩", "x": 230, "y": 151, "w": 260, "h": 30}, {"id": "C", "label": "Gemm 의 C ⟨2⟩", "x": 230, "y": 182, "w": 260, "h": 30}, {"id": "out", "label": "출력 3 float32[1,2]", "x": 260, "y": 248, "w": 200, "h": 52}], "a": "B"}, {"type": "code", "p": "문제 3-1 ~ 3-3 — 노드 종류 · 가중치를 코드로 꺼내고 mlp 노드를 예측하세요.", "code": "m = onnx.load(\"tiny.onnx\")\nnode_types = [n.{{}} for n in m.graph.node]                 # ['Gemm']\nW_onnx = onnx.numpy_helper.{{}}(m.graph.{{}}[0])          # (2, 3)\n\npredict = [\"Gemm\", {{}}, \"Gemm\"]                            # mlp.onnx", "a": [["op_type"], ["to_array"], ["initializer"], ["\"Relu\"", "'Relu'"]], "w": "<code>m.graph.initializer</code> 에 가중치가 있고 <code>onnx.numpy_helper.to_array</code> 로 NumPy 배열이 됩니다. 단, [0] 이 항상 weight 라는 보장은 없습니다 (큰 모델은 이름으로 찾기 — Day 2).", "an": "문제 3-1 ~ 3-3"}]}, {"t": "4교시 · ONNX Runtime 으로 실행", "anim": "D1-4 InferenceSession 한 번 실행", "qs": [{"type": "single", "p": "<code>ort.InferenceSession(\"tiny.onnx\", providers=[\"CPUExecutionProvider\"])</code> 에서 <code>providers</code> 가 정하는 것은?", "o": ["입력 이름", "어디서 (어떤 장치 · 실행기로) 계산할지", "출력 개수", "opset 버전"], "a": 1, "w": "오늘은 CPU. GPU 는 <code>\"CUDAExecutionProvider\"</code> (Day 3), TensorRT 는 <code>\"TensorrtExecutionProvider\"</code>. 리스트 순서 = 우선순위.", "an": "문제 4-1"}, {"type": "single", "p": "<code>sess.run(None, {in_name: np.ones((1, 3))})</code> 가 <code>INVALID_ARGUMENT : Unexpected input data type. Actual: (tensor(double)) , expected: (tensor(float))</code> 를 냅니다. 고치는 방법은?", "o": ["입력 이름을 'input' 으로 바꾼다", "<code>np.ones((1, 3)).astype(np.float32)</code> 로 넣는다", "<code>torch.ones(1, 3)</code> 텐서로 넣는다", "providers 를 GPU 로 바꾼다"], "a": 1, "w": "NumPy 기본 dtype 은 float64 (= tensor(double)). 모델은 float32 (tensor(float)) 를 기대하므로 <code>.astype(np.float32)</code>. torch.Tensor 는 ORT 가 받지 않습니다.", "an": "4교시 · 일부러 틀려 보기 ❶"}, {"type": "multi", "p": "<code>sess.run</code> 에 대해 옳은 것을 모두 고르세요.", "o": ["입력은 <code>{이름: 배열}</code> 딕셔너리로 준다", "결과는 출력 개수만큼의 <b>리스트</b> — 출력이 하나여도 <code>[0]</code> 으로 꺼낸다", "첫 인자 <code>None</code> = '출력 전부 주세요'", "<code>torch.Tensor</code> 를 그대로 넣어도 된다", "float64 NumPy 배열은 ORT 가 자동으로 float32 로 바꿔 준다"], "a": [0, 1, 2], "w": "입력 = 딕셔너리, 출력 = 리스트. 입력은 NumPy float32 배열 — 텐서는 <code>.numpy()</code> (GPU 텐서면 <code>.cpu().numpy()</code>), float64 는 오류.", "an": "문제 4-3"}, {"type": "ox", "p": "PyTorch 결과와 ORT 결과를 <code>==</code> 로 비교해 False 가 나오면 export 가 잘못된 것이다.", "a": false, "w": "두 프로그램은 같은 식을 다른 순서 · 다른 라이브러리로 계산해 float32 끝자리가 다를 수 있습니다 (차이 ≈ 1e-7 은 정상). 그래서 <code>np.allclose(out, ref, atol=1e-5)</code> 로 판정합니다.", "an": "문제 4-4"}, {"type": "short", "p": "<code>sess.run(None, {\"x\": …})</code> 가 <code>Required inputs (['onnx::Gemm_0']) are missing from input feed (['x'])</code> 를 냈습니다. 모델이 기대하는 입력 이름은?", "a": ["onnx::Gemm_0"], "w": "메시지의 앞 괄호 = 모델이 필요한 입력, 뒤 괄호 = 내가 준 입력. 이름은 <code>sess.get_inputs()[0].name</code> 으로 알아내면 틀리지 않습니다.", "an": "4교시 · 일부러 틀려 보기 ❷"}, {"type": "drop", "p": "ORT 실행 4단계를 완성하세요.", "p2": "<code>InferenceSession</code> 으로 {} → <code>get_inputs()[0].</code>{} 로 입력 이름 → <code>run(None, feed)</code> 결과는 {} → <code>np.allclose</code> 로 비교.", "opts": [["학습", "열기", "export"], ["shape", "type", "name"], ["딕셔너리", "리스트", "torch.Tensor"]], "a": [1, 2, 1], "w": "열기 → 입력 이름 → 실행 (결과 리스트) → 비교. 실행 장치에는 <code>onnxruntime</code> 만 있으면 됩니다.", "an": "D1-4 · InferenceSession 한 번 실행"}, {"type": "match", "p": "tiny.onnx 세션에서 각 코드가 돌려주는 것을 짝지으세요.", "left": ["<code>sess.get_inputs()[0].name</code>", "<code>sess.get_inputs()[0].shape</code>", "<code>sess.get_inputs()[0].type</code>", "<code>sess.run(None, feed)[0]</code>"], "right": ["<code>'onnx::Gemm_0'</code>", "<code>[1, 3]</code>", "<code>'tensor(float)'</code>", "첫 번째 출력 NumPy 배열"], "a": [0, 1, 2, 3], "w": "type 'tensor(float)' = float32 — 넣는 NumPy 배열도 float32 여야 합니다.", "an": "문제 4-2 · 4-3"}, {"type": "order", "p": "ORT 로 tiny.onnx 를 실행하고 확인하는 순서로 배열하세요.", "items": ["<code>import onnxruntime as ort</code>", "<code>InferenceSession</code> 으로 <code>tiny.onnx</code> 열기 (<code>providers</code> 지정)", "<code>in_name = sess.get_inputs()[0].name</code>", "<code>outs = sess.run(None, {in_name: x1.numpy()})</code>", "<code>np.allclose(outs[0], ref, atol=1e-5)</code>"], "w": "PyTorch 없이도 돌아가는 부분은 앞의 4줄. 마지막 비교는 '내보낸 뒤 반드시 비교한다' — 오늘 가장 중요한 습관.", "an": "4교시 · 정리"}, {"type": "hot", "p": "ORT 실행 4단계 그림과 오류 메시지입니다. 이 오류를 없애려면 <b>어느 단계를 고쳐야</b> 하나요?", "w": "② 입력 딕셔너리입니다 — <code>np.ones((1, 3))</code> 는 float64 라 <code>x = np.ones((1, 3), np.float32)</code> (또는 <code>.astype(np.float32)</code>) 로 고칩니다. 세션 열기 · 출력 · 비교는 문제가 아닙니다.", "an": "D1-4 · 입력 딕셔너리", "viewBox": "0 0 720 290", "sw": 720, "svg": "<defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#8a9bb8\"/></marker><marker id=\"ahr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#f87171\"/></marker></defs><text x=\"20\" y=\"20\" font-size=\"12\" fill=\"#dbe4f0\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">ONNX Runtime 실행 4단계 — tiny.onnx</text><rect x=\"20\" y=\"50\" width=\"160\" height=\"120\" rx=\"6\" fill=\"#14203a\" stroke=\"#60a5fa\" stroke-width=\"1\"/><text x=\"100\" y=\"74\" font-size=\"12\" fill=\"#f5b942\" text-anchor=\"middle\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"bold\" dominant-baseline=\"middle\">① 열기</text><text x=\"100\" y=\"108\" font-size=\"10.5\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">InferenceSession(</text><text x=\"100\" y=\"130\" font-size=\"10.5\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">\"tiny.onnx\")</text><line x1=\"182\" y1=\"110\" x2=\"193\" y2=\"110\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"195\" y=\"50\" width=\"160\" height=\"120\" rx=\"6\" fill=\"#14203a\" stroke=\"#60a5fa\" stroke-width=\"1\"/><text x=\"275\" y=\"74\" font-size=\"12\" fill=\"#f5b942\" text-anchor=\"middle\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"bold\" dominant-baseline=\"middle\">② 입력 딕셔너리</text><text x=\"275\" y=\"108\" font-size=\"10.5\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">{in_name: x}</text><text x=\"275\" y=\"130\" font-size=\"10.5\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">x = np.ones((1, 3))</text><line x1=\"357\" y1=\"110\" x2=\"368\" y2=\"110\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"370\" y=\"50\" width=\"160\" height=\"120\" rx=\"6\" fill=\"#14203a\" stroke=\"#60a5fa\" stroke-width=\"1\"/><text x=\"450\" y=\"74\" font-size=\"12\" fill=\"#f5b942\" text-anchor=\"middle\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"bold\" dominant-baseline=\"middle\">③ 출력 리스트</text><text x=\"450\" y=\"108\" font-size=\"10.5\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">outs = sess.run(</text><text x=\"450\" y=\"130\" font-size=\"10.5\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">None, feed)</text><line x1=\"532\" y1=\"110\" x2=\"543\" y2=\"110\" stroke=\"#8a9bb8\" stroke-width=\"1.6\" marker-end=\"url(#ah)\"/><rect x=\"545\" y=\"50\" width=\"160\" height=\"120\" rx=\"6\" fill=\"#14203a\" stroke=\"#60a5fa\" stroke-width=\"1\"/><text x=\"625\" y=\"74\" font-size=\"12\" fill=\"#f5b942\" text-anchor=\"middle\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"bold\" dominant-baseline=\"middle\">④ 비교</text><text x=\"625\" y=\"108\" font-size=\"10.5\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">np.allclose(</text><text x=\"625\" y=\"130\" font-size=\"10.5\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">out, ref, atol=1e-5)</text><rect x=\"20\" y=\"196\" width=\"680\" height=\"76\" rx=\"6\" fill=\"#2a1416\" stroke=\"#f87171\" stroke-width=\"1\"/><text x=\"36\" y=\"216\" font-size=\"11.5\" fill=\"#f87171\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"bold\" dominant-baseline=\"middle\">실행 결과 (오류)</text><text x=\"36\" y=\"240\" font-size=\"11\" fill=\"#dbe4f0\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">INVALID_ARGUMENT : Unexpected input data type.</text><text x=\"36\" y=\"258\" font-size=\"11\" fill=\"#dbe4f0\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">Actual: (tensor(double)) , expected: (tensor(float))</text>", "regions": [{"id": "open", "label": "① 열기", "x": 20, "y": 50, "w": 160, "h": 120}, {"id": "feed", "label": "② 입력 딕셔너리", "x": 195, "y": 50, "w": 160, "h": 120}, {"id": "out", "label": "③ 출력 리스트", "x": 370, "y": 50, "w": 160, "h": 120}, {"id": "cmp", "label": "④ 비교", "x": 545, "y": 50, "w": 160, "h": 120}], "a": "feed"}, {"type": "code", "p": "문제 4-1 ~ 4-4 — tiny.onnx 를 ORT 로 실행하고 PyTorch 와 비교하세요.", "code": "sess = ort.InferenceSession(\"tiny.onnx\", providers=[{{}}])\nin_name = sess.get_inputs()[0].{{}}\nouts = sess.run({{}}, {in_name: x1.numpy()})        # x1 = [[1, 1, 1]]\ny_ort = outs[{{}}]                                   # [[6.5, -0.5]]\nsame = np.{{}}(y_ort, ref, atol=1e-5)", "a": [["\"CPUExecutionProvider\"", "'CPUExecutionProvider'"], ["name"], ["None"], ["0"], ["allclose"]], "w": "1·1 + 2·1 + 3·1 + 0.5 = 6.5,  0·1 − 1·1 + 1·1 − 0.5 = −0.5 — 손계산과 ORT 결과가 같습니다.", "an": "문제 4-1 ~ 4-4"}]}, {"t": "5교시 · 이름 붙이기 · 입력 shape", "anim": "D1-5 입력 shape 맞추기", "qs": [{"type": "single", "p": "<code>input_names</code> 없이 내보낸 tiny.onnx 의 입력 이름은?", "o": ["<code>input</code>", "<code>x</code>", "<code>weight</code>", "<code>onnx::Gemm_0</code>"], "a": 3, "w": "export 가 자동으로 붙인 이름입니다 (출력은 <code>3</code>). 이렇게 모델마다 다른 이름 대신 <code>input_names=[\"input\"]</code> 로 직접 정합니다.", "an": "D1-5 · 이름 붙이기"}, {"type": "single", "p": "컬러 224×224 사진 <b>8장</b>을 한 번에 넣는 입력 shape (N, C, H, W) 는?", "o": ["(8, 224, 224, 3)", "(8, 3, 224, 224)", "(3, 8, 224, 224)", "(1, 3, 224, 224)"], "a": 1, "w": "N = 8 장, C = 3 (컬러), H = W = 224. PyTorch · ONNX 모델은 대부분 N, C, H, W 순서입니다.", "an": "문제 5-2"}, {"type": "multi", "p": "입력 · 출력 이름 붙이기에 대해 옳은 것을 모두 고르세요.", "o": ["<code>input_names</code> · <code>output_names</code> 는 리스트로 쓴다", "이름을 정해 두면 <code>{\"input\": x}</code> 처럼 실행 코드가 단순해진다", "이 과정의 분류 모델은 입력 <code>input</code> / 출력 <code>logits</code> 로 통일한다", "<code>input_names=\"input\"</code> 처럼 문자열로 써도 된다", "이름을 바꾸면 가중치를 다시 학습해야 한다"], "a": [0, 1, 2], "w": "입력 · 출력이 여러 개일 수 있으므로 리스트입니다. 이름은 그래프의 꼬리표일 뿐 가중치와 상관없습니다.", "an": "문제 5-1"}, {"type": "ox", "p": "더미 입력 (1, 3) 으로 내보낸 <code>tiny_named.onnx</code> 에 (4, 3) 배열을 넣으면 4개를 한 번에 계산해 준다.", "a": false, "w": "입력 shape 는 export 때 <b>고정</b>됩니다 → <code>Got: 4 Expected: 1</code> 오류. 배치를 자유롭게 하는 <code>dynamic_axes</code> 는 Day 2 에서. 오늘은 1장씩 넣습니다.", "an": "문제 5-3"}, {"type": "short", "p": "MNIST 흑백 28×28 <b>1장</b>의 모델 입력 shape 를 튜플로 쓰세요.", "a": ["(1, 1, 28, 28)", "1, 1, 28, 28"], "w": "흑백은 C = 1. 1장이어도 N = 1 축이 반드시 있어야 합니다 → (1, 1, 28, 28).", "an": "문제 5-2"}, {"type": "drop", "p": "이미지 텐서의 축입니다.", "p2": "(N, C, H, W) 에서 N 은 {}, C 는 {} 이다. OpenCV 로 읽은 이미지는 {} 순서라 바꿔 줘야 한다.", "opts": [["높이", "장 수 (배치)", "채널"], ["채널", "너비", "배치"], ["(C, H, W)", "(N, C, H, W)", "(H, W, C)"]], "a": [1, 0, 2], "w": "OpenCV (H, W, C) → 모델 (N, C, H, W). 축 순서는 7교시 <code>transpose(2, 0, 1)</code>, N 축은 <code>[None]</code> 으로 바꿉니다.", "an": "D1-5 · (N, C, H, W)"}, {"type": "match", "p": "경우와 모델 입력 shape 를 짝지으세요.", "left": ["tiny — 특징 3개짜리 입력 1개", "MNIST 흑백 28×28 1장", "컬러 224×224 1장", "컬러 224×224 8장"], "right": ["(1, 3)", "(1, 1, 28, 28)", "(1, 3, 224, 224)", "(8, 3, 224, 224)"], "a": [0, 1, 2, 3], "w": "첫 축은 언제나 N (배치). 이미지는 그 뒤에 C, H, W.", "an": "문제 5-2"}, {"type": "order", "p": "이름 붙인 <code>tiny_named.onnx</code> 를 만들고 확인하는 순서로 배열하세요.", "items": ["<code>torch.onnx.export(…, input_names=[\"input\"], output_names=[\"output\"])</code>", "<code>InferenceSession</code> 으로 <code>tiny_named.onnx</code> 열기", "<code>get_inputs()</code> 로 이름이 'input' 인지 확인", "<code>sess_n.run(None, {\"input\": x1.numpy()})</code>", "결과 [[6.5, −0.5]] 가 이전과 같은지 확인"], "w": "이름만 바꿨으므로 계산 결과는 그대로 [[6.5, −0.5]] 입니다.", "an": "문제 5-1"}, {"type": "hot", "p": "배치 4개를 넣었을 때의 오류 메시지입니다. <b>모델 (파일) 이 기대하는 배치 크기</b>를 알려 주는 부분을 클릭하세요.", "w": "<code>Expected: 1</code> 입니다. <code>index: 0</code> = 0번 축 (배치), <code>Got: 4</code> = 내가 넣은 크기, <code>input: input</code> = 문제가 된 입력 이름. 그래서 <code>expected_batch = 1</code>.", "an": "문제 5-3", "viewBox": "0 0 720 260", "sw": 720, "svg": "<defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#8a9bb8\"/></marker><marker id=\"ahr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#f87171\"/></marker></defs><text x=\"20\" y=\"20\" font-size=\"12\" fill=\"#dbe4f0\" text-anchor=\"start\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">sess_n.run(None, {\"input\": x4})  # ospace\" font-weight=\"normal\" dominant-baseline=\"middle\">Please fix either the inputs/outputs or the model.</text>", "regions": [{"id": "name", "label": "input: input", "x": 40, "y": 120, "w": 150, "h": 44}, {"id": "idx", "label": "index: 0", "x": 210, "y": 120, "w": 120, "h": 44}, {"id": "got", "label": "Got: 4", "x": 350, "y": 120, "w": 110, "h": 44}, {"id": "exp", "label": "Expected: 1", "x": 480, "y": 120, "w": 150, "h": 44}], "a": "exp"}, {"type": "code", "p": "문제 5-1 ~ 5-3 — 이름 붙이기와 입력 shape 를 완성하세요.", "code": "torch.onnx.export(tiny, dummy, \"tiny_named.onnx\",\n                  input_names={{}}, output_names=[\"output\"], **EXPORT_KW)\n\ns1 = (1, {{}}, 28, 28)              # MNIST 흑백 1장\ns3 = ({{}}, 3, 224, 224)            # 컬러 224×224 8장\nexpected_batch = {{}}               # 'Got: 4 Expected: 1'", "a": [["[\"input\"]", "['input']"], ["1"], ["8"], ["1"]], "w": "input_names 는 리스트 <code>[\"input\"]</code>. 흑백 C = 1, 8장이면 N = 8, 고정된 배치는 1.", "an": "문제 5-1 ~ 5-3"}]}, {"t": "6교시 · MNIST CNN 내보내기", "anim": "D1-6 CNN 그래프와 shape", "qs": [{"type": "single", "p": "SimpleConvNet 을 내보낸 <code>mnist_cnn.onnx</code> 의 노드 순서는?", "o": ["Conv, MaxPool, Relu, Gemm, Flatten, Relu, Gemm", "Conv, Relu, MaxPool, Gemm, Relu, Gemm", "Conv, Relu, MaxPool, Flatten, Gemm, Relu, Gemm", "Conv, BatchNormalization, Relu, MaxPool, Flatten, Gemm, Gemm"], "a": 2, "w": "<code>pool(relu(conv(x)))</code> → <code>flatten(1)</code> → <code>relu(fc1)</code> → <code>fc2</code>. <code>F.relu</code> · <code>x.flatten(1)</code> 처럼 함수로 쓴 연산도 노드로 녹화됩니다.", "an": "문제 6-2"}, {"type": "single", "p": "파라미터 433,890 개인 SimpleConvNet 의 <code>mnist_cnn.onnx</code> 파일 크기는 대략?", "o": ["0.43 MB", "4.3 MB", "17.4 MB", "1.74 MB"], "a": 3, "w": "433,890 × 4 B ≈ 1.74 MB (실제 1,736,555 B). 큰 모델은 그래프 설명이 무시할 만큼 작아 <b>파일 크기 ≈ 파라미터 × 4 B</b>.", "an": "문제 6-1"}, {"type": "multi", "p": "<code>mnist_cnn.onnx</code> 에서 <b>가중치 (initializer) 가 붙는</b> 노드 종류를 모두 고르세요.", "o": ["Conv", "Relu", "MaxPool", "Flatten", "Gemm"], "a": [0, 4], "w": "Conv (780) · Gemm fc1 (432,100) · Gemm fc2 (1,010) — 가중치 노드 3개. Relu · MaxPool · Flatten 은 가중치가 없습니다.", "an": "문제 6-2"}, {"type": "ox", "p": "ORT 로 실행할 때 <code>/ 255</code> 를 빼먹으면 ONNX Runtime 이 오류 메시지를 내서 바로 알 수 있다.", "a": false, "w": "오류는 <b>하나도 나지 않고</b> 정확도만 조용히 떨어집니다 (실행 예: 1.00 → 0.92). 전처리를 학습 때와 다르게 하는 것이 가장 찾기 어려운 버그입니다.", "an": "6교시 · 바꿔보기"}, {"type": "short", "p": "<code>nn.Conv2d(1, 30, 5)</code> 의 파라미터 수는? (숫자만)", "a": ["780", "780개"], "w": "weight 30 × 1 × 5 × 5 = 750 + bias 30 = 780.", "an": "D1-6 · CNN 그래프와 shape"}, {"type": "drop", "p": "MNIST CNN 내보내기 · 확인입니다.", "p2": "더미 입력은 <code>torch.zeros(</code>{}<code>)</code>. zeros 여도 되는 이유는 export 가 {} 을 녹화하기 때문. ORT 와 PyTorch 가 같은지는 {} 으로도 확인한다.", "opts": [["28, 28", "1, 1, 28, 28", "1, 28, 28, 1"], ["입력 픽셀 값", "가중치 값", "값이 아니라 shape · 연산"], ["예측 (argmax) 일치율 1.0", "logits 가 비트까지 같은지", "정확도 0.5 이상"]], "a": [1, 2, 0], "w": "분류 모델은 logits 가 아주 조금 달라도 argmax 가 같으면 같은 답 — 100장 일치율 1.000 이 두 번째 확인 기준입니다.", "an": "문제 6-1 · 6-3"}, {"type": "match", "p": "SimpleConvNet 의 층과 파라미터 수를 짝지으세요.", "left": ["conv — Conv2d(1, 30, 5)", "fc1 — Linear(4320, 100)", "fc2 — Linear(100, 10)", "전체"], "right": ["780", "432,100", "1,010", "433,890"], "a": [0, 1, 2, 3], "w": "fc1 = 4320 × 100 + 100. 4320 = 30 × 12 × 12 (MaxPool 뒤 펼친 크기). 파라미터 대부분이 fc1 에 있습니다.", "an": "D1-6 · CNN 그래프와 shape"}, {"type": "order", "p": "샘플 100장을 한 장씩 ORT 로 실행하는 반복문 안의 순서로 배열하세요.", "items": ["uint8 (28, 28) 숫자 이미지 하나 꺼내기", "<code>astype(np.float32) / 255</code> 로 0~1", "<code>[None, None]</code> 으로 (1, 1, 28, 28)", "<code>sess_cnn.run(None, {\"input\": x})[0].argmax()</code>", "PyTorch 예측과 비교해 일치율 계산"], "w": "[None, None] = 앞에 축 두 개 (N, C) 추가. 실행 예: ORT–PyTorch 일치율 1.000 · 정확도 1.000.", "an": "문제 6-3"}, {"type": "hot", "p": "mnist_cnn.onnx 그래프입니다. <b>출력 shape 가 (1, 30, 12, 12)</b> 인 노드를 클릭하세요.", "w": "<b>MaxPool</b> 입니다 — 2×2 풀링이 24 × 24 를 12 × 12 로 절반으로 줄입니다. Conv 출력은 (1, 30, 24, 24) (28 − 5 + 1 = 24), Relu 는 shape 를 바꾸지 않고, Flatten 은 (1, 4320) 으로 폅니다.", "an": "D1-6 · CNN 그래프와 shape", "viewBox": "0 0 720 280", "sw": 720, "svg": "<defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#8a9bb8\"/></marker><marker id=\"ahr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#f87171\"/></marker></defs><text x=\"20\" y=\"20\" font-size=\"12\" fill=\"#dbe4f0\" text-anchor=\"start\" font-family=\"Noto Sans KR,sans-serif\" font-weight=\"normal\" dominant-baseline=\"middle\">mnist_cnn.onnx — Netron 그래프 (일부 shape 만 표시)</text><rect x=\"20\" y=\"50\" width=\"130\" height=\"56\" rx=\"28\" fill=\"#1b2438\" stroke=\"#3b4a6b\" stroke-width=\"1\"/><text x=\"85\" y=\"68\" font-size=\"12\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"bold\" dominant-baseline=\"middle\">input</text><text x=\"85\" y=\"88\" font-size=\"10.5\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">(1, 1, 28, 28)</text><rect x=\"180\" y=\"50\" width=\"110\" height=\"56\" rx=\"6\" fill=\"#14203a\" stroke=\"#60a5fa\" stroke-width=\"1\"/><text x=\"235.0\" y=\"69.0\" font-size=\"12\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"bold\" dominant-baseline=\"middle\">Conv</text><text x=\"235.0\" y=\"89.0\" font-size=\"10.5\" fill=\"#8a9bb8\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"normal\" dominant-baseline=\"middle\">30 · 5×5</text><rect x=\"340\" y=\"50\" width=\"90\" height=\"56\" rx=\"6\" fill=\"#14203a\" stroke=\"#3b4a6b\" stroke-width=\"1\"/><text x=\"385.0\" y=\"78.0\" font-size=\"12\" fill=\"#dbe4f0\" text-anchor=\"middle\" font-family=\"Consolas,D2Coding,monospace\" font-weight=\"bold\" dominant-baselin function answered(q, a){
  switch (q.type) {
    case 'single': case 'ox': case 'hot': return a !== null;
    case 'multi': return a.length > 0;
    case 'short': return a.trim() !== '';
    case 'drop': case 'match': return a.every(v => v >= 0);
    case 'order': return true;
    case 'flash': return a.self !== null;
    case 'code': return a.every(v => v.trim() !== '');
  }
}
function correct(q, a){
  switch (q.type) {
    case 'single': case 'hot': return a === q.a;
    case 'ox': return a === q.a;
    case 'multi': return a.length === q.a.length && q.a.every(x => a.includes(x));
    case 'short': return q.a.some(x => norm(x) === norm(a));
    case 'drop': return a.every((v, i) => v === q.a[i]);
    case 'match': return a.every((v, i) => v === q.a[i]);
    case 'order': return a.every((v, i) => v === i);
    case 'flash': return a.self === true;
    case 'code': return a.every((v, i) => q.a[i].some(x => norm(x) === norm(v)));
  }
}
const scoreOf = i => ans[i].filter((a, k) => correct(Q[i].qs[k], a)).length;

// ── 답 문자열 (오답 정리용) ──
const L = '①②③④⑤⑥⑦⑧';
function fmt(q, a, right){
  switch (q.type) {
    case 'single': return right ? `${L[q.a]} ${strip(q.o[q.a])}` : (a === null ? '미응답' : `${L[a]} ${strip(q.o[a])}`);
    case 'multi': { const v = right ? q.a : a; return v.length ? [...v].sort().map(i => L[i]).join(' ') : '미응답'; }
    case 'ox': { const v = right ? q.a : a; return v === null ? '미응답' : (v ? 'O' : 'X'); }
    case 'short': return right ? q.a[0] : (a.trim() || '미응답');
    case 'drop': return (right ? q.a : a).map((v, i) => v < 0 ? '?' : strip(q.opts[i][v])).join(' / ');
    case 'match': return (right ? q.a : a).map((v, i) => `${strip(q.left[i])}→${v < 0 ? '?' : strip(q.right[v])}`).join(', ');
    case 'order': return (right ? q.items.map((_, i) => i) : a).map(i => strip(q.items[i])).join(' → ');
    case 'hot': { const v = right ? q.a : a; return v === null ? '미응답' : (q.regions.find(r => r.id === v) || {}).label; }
    case 'flash': return right ? strip(q.back) : (a.self === null ? '미응답' : (a.self ? '알았다' : '몰랐다'));
    case 'code': return (right ? q.a.map(x => x[0]) : a.map(v => v || '?')).join(' / ');
  }
}

// ── 렌더 ──
function renderTabs(){
  $('#tabs').innerHTML = Q.map((s, i) => {
    const n = ans[i].filter((a, k) => answered(s.qs[k], a)).length;
    return `<button class="${i === tab ? 'active' : ''} ${graded[i] ? 'graded' : ''}" data-i="${i}">${i + 1}교시<span class="s">${graded[i] ? scoreOf(i) + '/10' : n + '/10'}</span></button>`;
  }).join('');
  $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => { tab = +b.dataset.i; history.replaceState(null, '', '#t' + (tab + 1)); render(); window.scrollTo({ top: 0 }); });
}
function qHTML(q, k){
  const a = ans[tab][k], g = graded[tab], id = `${tab}-${k}`, dis = g ? 'disabled' : '';
  const ok = g && correct(q, a);
  let body = '';
  switch (q.type) {
    case 'single':
    case 'multi': {
      const isM = q.type === 'multi';
      body = (isM ? '<div class="hint" style="margin:-4px 0 8px">정답을 <b>모두</b> 고르세요.</div>' : '') + '<div class="opts">' + q.o.map((o, j) => {
        const sel = isM ? a.includes(j) : a === j, isA = isM ? q.a.includes(j) : q.a === j;
        let c = sel ? 'sel' : '';
        if (g) c = isA && sel ? 'ok' : (sel ? 'bad' : (isA ? (isM ? 'miss' : 'ok') : ''));
        const box = isM ? (sel ? '☑' : '☐') : L[j];
        return `<button class="opt ${c}" data-k="${k}" data-j="${j}" ${dis}><span class="box">${box}</span> ${o}</button>`;
      }).join('') + '</div>';
      break;
    }
    case 'ox':
      body = '<div class="ox">' + [true, false].map(v => {
        let c = a === v ? 'active' : '';
        if (g) c = (q.a === v ? 'opt ok' : (a === v ? 'opt bad' : ''));
        return `<button class="oxb ${c}" data-k="${k}" data-v="${v}" ${dis} aria-label="${v ? '참' : '거짓'}">${v ? 'O' : 'X'}</button>`;
      }).join('') + '</div>';
      break;
    case 'short':
      body = `<input type="text" class="sa" data-k="${k}" value="${esc(a)}" placeholder="정답 입력" style="width:min(100%,320px)" ${dis}>`;
      break;
    case 'drop': {
      let i = 0;
      body = '<div class="fill">' + q.p2.replace(/\{\}/g, () => {
        const n = i++;
        const opts = q.opts[n].map((o, j) => `<option value="${j}" ${a[n] === j ? 'selected' : ''}>${esc(strip(o))}</option>`).join('');
        const st = g ? `style="border-color:${a[n] === q.a[n] ? 'var(--green)' : 'var(--red)'}"` : '';
        return `<select class="dd" data-k="${k}" data-n="${n}" ${dis} ${st}><option value="-1">선택</option>${opts}</select>`;
      }) + '</div>';
      break;
    }
    case 'match': {
      const order = shuffled(q.right, 'm' + id);
      body = q.left.map((l, i) => {
        const opts = order.map(j => `<option value="${j}" ${a[i] === j ? 'selected' : ''}>${esc(strip(q.right[j]))}</option>`).join('');
        const c = g ? (a[i] === q.a[i] ? 'ok' : 'bad') : '';
        return `<div class="mrow ${c}"><span class="l">${l}</span><span class="arr">↔</span><select class="mm" data-k="${k}" data-i="${i}" ${dis}><option value="-1">짝 선택</option>${opts}</select></div>`;
      }).join('');
      break;
    }
    case 'order':
      body = '<div class="hint" style="margin:-4px 0 8px">끌어다 놓거나 ▲▼ 버튼으로 순서를 바꾸세요.</div><ol class="ord" data-k="' + k + '">' + a.map((it, pos) => {
        const c = g ? (it === pos ? 'ok' : 'bad') : '';
        return `<li class="${c}" draggable="${!g}" data-pos="${pos}"><span class="k">${pos + 1}</span><span>${q.items[it]}</span><span class="mv"><button data-k="${k}" data-pos="${pos}" data-d="-1" ${dis || (pos === 0 ? 'disabled' : '')} aria-label="위로">▲</button><button data-k="${k}" data-pos="${pos}" data-d="1" ${dis || (pos === a.length - 1 ? 'disabled' : '')} aria-label="아래로">▼</button></span></li>`;
      }).join('') + '</ol>';
      break;
    case 'hot': {
      const regs = q.regions.map(r => {
        let c = a === r.id ? 'sel' : '';
        if (g) c = r.id === q.a ? 'ok' : (a === r.id ? 'bad' : '');
        const shape = r.shape === 'circle' ? `<circle cx="${r.x}" cy="${r.y}" r="${r.r}"` : `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="6"`;
        return `${shape} class="rg ${c}" data-k="${k}" data-r="${r.id}" tabindex="${g ? -1 : 0}" role="button" aria-label="${esc(r.label)}"><title>${esc(r.label)}</title>${r.shape === 'circle' ? '</circle>' : '</rect>'}`;
      }).join('');
      body = `<div class="hot"><svg viewBox="${q.viewBox}" width="${q.sw}" xmlns="http://www.w3.org/2000/svg">${q.svg}${regs}</svg></div>` +
        `<div class="hint" style="margin-top:6px">선택: <b style="color:var(--amber)">${a === null ? '없음' : esc((q.regions.find(r => r.id === a) || {}).label)}</b></div>`;
      break;
    }
    case 'flash':
      body = `<div class="card ${a.flipped ? 'flip' : ''}" data-k="${k}"><div class="in"><div class="f">${q.front}</div><div class="b">${q.back}</div></div></div>` +
        `<div class="selfrow"><button class="flipb" data-k="${k}" ${g ? 'disabled' : ''}>${a.flipped ? '앞면 보기' : '🔄 카드 뒤집기'}</button>` +
        `<button class="selfb ${a.self === true ? 'active' : ''}" data-k="${k}" data-v="1" ${g || !a.flipped ? 'disabled' : ''}>✅ 알았다</button>` +
        `<button class="selfb ${a.self === false ? 'active' : ''}" data-k="${k}" data-v="0" ${g || !a.flipped ? 'disabled' : ''}>❌ 몰랐다</button>` +
        `<span class="hint">${a.flipped ? '정답과 비교해 스스로 채점하세요.' : '먼저 답을 떠올린 뒤 뒤집으세요.'}</span></div>`;
      break;
    case 'code': {
      let i = 0;
      body = '<pre>' + esc(q.code).replace(/\{\{\}\}/g, () => {
        const n = i++;
        const w = Math.max(5, (q.a[n][0] || '').length + 2);
        const st = g ? `style="border-color:${q.a[n].some(x => norm(x) === norm(a[n])) ? 'var(--green)' : 'var(--red)'};width:${w}ch"` : `style="width:${w}ch"`;
        return `<input type="text" class="ci" data-k="${k}" data-n="${n}" value="${esc(a[n])}" ${dis} ${st} aria-label="빈칸 ${n + 1}">`;
      }) + '</pre>';
      break;
    }
  }
  const t = TYPES[q.type];
  const prompt = q.type === 'drop' ? (q.p || '') : (q.type === 'flash' ? (q.p || '카드 앞면의 질문에 답을 떠올린 뒤 뒤집어 확인하세요.') : q.p);
  let fb = '';
  if (g) {
    const right = q.type === 'flash' ? '' : `<div>정답: <b>${esc(fmt(q, a, true))}</b></div>`;
    fb = `<div class="fb ${ok ? 'ok' : 'bad'}"><b class="v">${ok ? '정답' : '오답'}</b>${right}${q.w}<span class="anim">확인: ${q.an}</span></div>`;
  }
  const un = !g && !answered(q, a) && attempted[tab] ? 'unans' : '';
  return `<div class="q ${g ? (ok ? 'ok' : 'bad') : un}"><div class="qh"><span class="n">문항 ${k + 1}</span><span class="ty" style="color:${t.c};border-color:${t.c}">${t.n}</span></div><div class="p">${prompt}</div>${body}${fb}</div>`;
}
const attempted = Q.map(() => false);
function render(){
  renderTabs();
  const s = Q[tab];
  $('#sheet').innerHTML = `<div class="head"><span class="t">${s.t}</span><span class="a">🎬 ${s.anim}</span></div>` + s.qs.map((q, k) => qHTML(q, k)).join('');
  bind();
  const nm = $('#name').value, g = graded[tab];
  if (g) {
    const sc = scoreOf(tab); $('#rscore').textContent = `${sc}/10`;
    if (nm.trim()) { $('#rcode').textContent = codeFor(nm, tab + 1, sc); $('#rhint').textContent = '결과 코드'; }
    else { $('#rcode').textContent = '—'; $('#rhint').textContent = '이름을 입력하면 결과 코드가 나옵니다.'; }
  } else {
    $('#rcode').textContent = '—'; $('#rscore').textContent = '';
    const n = ans[tab].filter((a, k) => answered(s.qs[k], a)).length;
    $('#rhint').textContent = `${tab + 1}교시: ${n}/10 응답. 채점하기를 누르면 잠깁니다.`;
  }
  $('#gradeBtn').disabled = g;
}
function bind(){
  const S = $('#sheet'), A = ans[tab];
  S.querySelectorAll('.opt[data-j]').forEach(b => b.onclick = () => {
    const k = +b.dataset.k, j = +b.dataset.j, q = Q[tab].qs[k];
    if (q.type === 'multi') { const i = A[k].indexOf(j); i < 0 ? A[k].push(j) : A[k].splice(i, 1); }
    else A[k] = A[k] === j ? null : j;
    render();
  });
  S.querySelectorAll('.oxb').forEach(b => b.onclick = () => { const k = +b.dataset.k, v = b.dataset.v === 'true'; A[k] = A[k] === v ? null : v; render(); });
  S.querySelectorAll('.sa').forEach(i => i.oninput = () => { A[+i.dataset.k] = i.value; renderTabs(); });
  S.querySelectorAll('.ci').forEach(i => i.oninput = () => { A[+i.dataset.k][+i.dataset.n] = i.value; renderTabs(); });
  S.querySelectorAll('.dd').forEach(s => s.onchange = () => { A[+s.dataset.k][+s.dataset.n] = +s.value; renderTabs(); });
  S.querySelectorAll('.mm').forEach(s => s.onchange = () => { A[+s.dataset.k][+s.dataset.i] = +s.value; renderTabs(); });
  S.querySelectorAll('.ord .mv button').forEach(b => b.onclick = () => {
    const k = +b.dataset.k, p = +b.dataset.pos, d = +b.dataset.d, arr = A[k];
    [arr[p], arr[p + d]] = [arr[p + d], arr[p]]; render();
  });
  S.querySelectorAll('.ord').forEach(ol => {
    const k = +ol.dataset.k; let from = null;
    ol.querySelectorAll('li').forEach(li => {
      li.addEventListener('dragstart', e => { from = +li.dataset.pos; li.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(from)); });
      li.addEventListener('dragend', () => li.classList.remove('drag'));
      li.addEventListener('dragover', e => { if (from !== null) { e.preventDefault(); li.classList.add('over'); } });
      li.addEventListener('dragleave', () => li.classList.remove('over'));
      li.addEventListener('drop', e => { e.preventDefault(); const to = +li.dataset.pos; if (from === null || from === to) return; const arr = A[k]; const [x] = arr.splice(from, 1); arr.splice(to, 0, x); from = null; render(); });
    });
  });
  S.querySelectorAll('.rg').forEach(r => {
    const pick = () => { if (graded[tab]) return; const k = +r.dataset.k; A[k] = A[k] === r.dataset.r ? null : r.dataset.r; render(); };
    r.addEventListener('click', pick);
    r.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
  });
  S.querySelectorAll('.flipb').forEach(b => b.onclick = () => { const k = +b.dataset.k; A[k].flipped = !A[k].flipped; render(); });
  S.querySelectorAll('.card').forEach(c => c.onclick = () => { if (graded[tab]) return; const k = +c.dataset.k; A[k].flipped = !A[k].flipped; render(); });
  S.querySelectorAll('.selfb').forEach(b => b.onclick = () => { const k = +b.dataset.k; A[k].self = b.dataset.v === '1'; render(); });
}

// ── 채점 · 결과 코드 ──
function hash(s){ let h = 5381; for (const c of s) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return h.toString(16).padStart(8, '0').slice(-4); }
function codeFor(name, t, score){ return `${t}${'ABCDEFGHIJK'[10 - score] || 'K'}-${hash(`${name.trim()}|${t}|${score}|otday1`)}`; }
$('#gradeBtn').onclick = () => {
  const s = Q[tab], n = ans[tab].filter((a, k) => answered(s.qs[k], a)).length;
  attempted[tab] = true;
  if (n < 10 && !confirm(`아직 ${10 - n}문항에 답하지 않았습니다. 그래도 채점할까요? (미응답은 오답 처리)`)) { render(); return; }
  graded[tab] = true; render();
};
$('#resetBtn').onclick = () => {
  if (!confirm(`${tab + 1}교시 답을 모두 지우고 다시 풀까요?`)) return;
  graded[tab] = false; attempted[tab] = false;
  ans[tab] = Q[tab].qs.map((q, k) => init(q, `${tab}-${k}`)); render();
};
$('#name').oninput = render;

// ── 제출 · 오답 정리 ──
let lastHtml = '', lastText = '';
function buildReport(){
  const nm = $('#name').value.trim() || '(이름 없음)', ds = new Date().toLocaleString('ko-KR');
  let h = `<h3>ONNX·TensorRT Day 1 개념 워크시트 — 오답 정리</h3><div class="meta">${esc(nm)} · ${ds}</div>`;
  let t = `ONNX·TensorRT Day 1 개념 워크시트 — 오답 정리\n이름: ${nm}\n일시: ${ds}\n\n`;
  let tot = 0, cnt = 0;
  const byType = {};
  Q.forEach((s, i) => {
    if (!graded[i]) return;
    const sc = scoreOf(i); tot += sc; cnt++;
    s.qs.forEach((q, k) => { const b = byType[q.type] ||= [0, 0]; b[1]++; if (correct(q, ans[i][k])) b[0]++; });
    const code = $('#name').value.trim() ? codeFor($('#name').value, i + 1, sc) : '—';
    const wrong = s.qs.map((q, k) => ({ q, k, a: ans[i][k] })).filter(x => !correct(x.q, x.a));
    h += `<div class="sec">${esc(s.t)} — ${sc}/10 · 결과 코드 ${code}</div>`;
    t += `[${s.t}] ${sc}/10 · 결과 코드 ${code}\n`;
    if (!wrong.length) { h += `<div class="ok">전부 정답 🎉</div>`; t += '  전부 정답\n\n'; return; }
    h += '<table><tr><th>#</th><th>유형</th><th>문항</th><th>내 답</th><th>정답</th><th>다시 볼 곳</th></tr>';
    wrong.forEach(({ q, k, a }) => {
      const qt = strip(q.type === 'flash' ? q.front : (q.p || q.p2 || '')).replace(/\s+/g, ' ').slice(0, 70);
      const my = fmt(q, a, false), co = fmt(q, a, true);
      h += `<tr><td>${k + 1}</td><td>${TYPES[q.type].n}</td><td>${esc(qt)}</td><td class="bad">${esc(my)}</td><td class="ok">${esc(co)}</td><td>${esc(strip(q.an))}</td></tr>`;
      t += `  ${k + 1}. [${TYPES[q.type].n}] ${qt}\n     내 답: ${my}\n     정답: ${co}\n     다시 볼 곳: ${strip(q.an)}\n`;
    });
    h += '</table>'; t += '\n';
  });
  const notGraded = Q.map((s, i) => graded[i] ? null : i + 1).filter(x => x);
  const typeLine = Object.entries(byType).map(([k, [c, n]]) => `${TYPES[k].n} ${c}/${n}`).join(' · ');
  const sum = `<div class="sum"><span>채점한 교시 ${cnt}/8</span><span>합계 ${tot}/${cnt * 10}</span>${notGraded.length ? `<span class="none">미채점: ${notGraded.join(', ')}교시</span>` : ''}</div>` + (typeLine ? `<div class="meta">유형별 정답: ${typeLine}</div>` : '');
  h = h.replace('</div>', '</div>' + sum);
  t = t.replace('\n\n', `\n채점한 교시 ${cnt}/8 · 합계 ${tot}/${cnt * 10}${notGraded.length ? ' · 미채점 ' + notGraded.join(', ') + '교시' : ''}\n유형별 정답: ${typeLine}\n\n`);
  lastHtml = h; lastText = t;
  return h;
}
$('#submitBtn').onclick = () => {
  if (!graded.some(x => x)) { alert('먼저 한 교시 이상 채점하세요.'); return; }
  $('#dgBody').innerHTML = buildReport(); $('#toast').textContent = ''; $('#dlg').showModal();
};
$('#closeBtn').onclick = () => $('#dlg').close();
$('#captureBtn').onclick = async () => {
  const htmlDoc = `<meta charset="utf-8">` + lastHtml.replace(/ class="[^"]*"/g, '').replace(/<table>/g, '<table border="1" style="border-collapse:collapse">');
  try {
    if (navigator.clipboard && window.ClipboardItem) {
      await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([htmlDoc], { type: 'text/html' }), 'text/plain': new Blob([lastText], { type: 'text/plain' }) })]);
      $('#toast').textContent = '복사했습니다 — 노션에 붙여 넣으세요.'; return;
    }
  } catch (e) {}
  const ta = document.createElement('textarea'); ta.value = lastText; ta.style.position = 'fixed'; ta.style.opacity = '0';
  $('#dlg').appendChild(ta); ta.focus(); ta.select();
  const ok = document.execCommand('copy'); ta.remove();
  $('#toast').textContent = ok ? '텍스트로 복사했습니다.' : '복사하지 못했습니다 — 직접 선택해 복사하세요.';
};

$('#legend').innerHTML = Object.values(TYPES).map(t => `<span class="tag" style="color:${t.c};border-color:${t.c}55">${t.n}</span>`).join('');
// worksheet.html#t3 → 3교시 탭으로 바로 열기 (노트북 교시별 링크)
function fromHash(){ const m = location.hash.match(/^#t([1-8])$/); if (m) { tab = +m[1] - 1; } }
fromHash();
window.addEventListener('hashchange', () => { fromHash(); render(); window.scrollTo({ top: 0 }); });
render();
</script>
