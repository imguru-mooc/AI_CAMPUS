  q:[&#x27;&quot;활성값도 채널마다 scale 을 따로 두면 (per-channel) 해결되지 않을까?&quot; — 실제로는?&#x27;,[&#x27;된다 — quantize_static 의 per_channel=True 가 활성값에도 적용된다&#x27;,&#x27;표준 런타임 (ORT · TensorRT) 은 활성값을 텐서당 scale 하나로만 다룬다&#x27;,&#x27;된다 — 대신 파일 크기가 채널 수만큼 배로 늘어난다&#x27;],1,&#x27;per_channel=True 는 weight 에만 적용됩니다. 활성값은 다음 연산이 채널을 섞어 더하기 때문에 텐서당 scale 하나가 표준입니다. 그래서 다른 처방 (범인을 FP32 로 · 채널 균등화 · QAT) 이 필요합니다.&#x27;],

  code:`&lt;span class=&quot;c&quot;&gt;# ReLU(300·x) = 300·ReLU(x) 이므로 다음 conv 의 weight 를 1/300 로 줄이면 FP32 결과는 그대로&lt;/span&gt;\n&lt;span class=&quot;c&quot;&gt;# 달라지는 것은 그 사이 텐서의 &#x27;범위&#x27; 뿐 — 양자화는 범위를 본다&lt;/span&gt;`,
  ex:&#x27;&lt;p&gt;&lt;b&gt;1교시 정리&lt;/b&gt;: 같은 FP32 함수라도 중간 텐서의 범위가 다르면 INT8 결과가 다르다 · 활성값은 per-tensor 라 outlier 채널에 약하다 · 범인은 특정 layer 에 있다 → 2교시에 SQNR 로 찾습니다.&lt;/p&gt;&#x27;},

steps([
 {n:&#x27;① 실습 2-1 — sqnr · cosine&#x27;,vt:&#x27;두 텐서가 얼마나 같은가&#x27;,run:()=&gt;play(0,700,3),
  q:[&#x27;오차의 크기가 신호의 10% 이면 SQNR 은 몇 dB 일까요? (1% 이면 40 dB)&#x27;,[&#x27;10 dB&#x27;,&#x27;20 dB&#x27;,&#x27;30 dB — 1% 일 때의 3/4&#x27;],1,&#x27;20 · log10(1 / 0.1) = 20 dB. 오차가 10배 커질 때마다 20 dB 씩 내려갑니다: 1% → 40, 10% → 20, 100% → 0 dB.&#x27;],
  kv:[[&#x27;오차 1% · 10% · 100%&#x27;,&#x27;40 · 20 · 0 dB&#x27;],[&#x27;의심 기준&#x27;,&#x27;SQNR &lt; 20 dB · cosine &lt; 0.99&#x27;],[&#x27;cos(x, 3x) · cos(x, −x)&#x27;,&#x27;1 · −1&#x27;]],st:[&#x27;ok&#x27;,&#x27;클수록 좋다 — 20 dB 아래면 의심&#x27;],
  code:`def sqnr(x, y):\n    x, y = np.ravel(x).astype(np.float64), np.ravel(y).astype(np.float64)\n    return float(20 * np.log10(np.linalg.norm(x) / (np.linalg.norm(x - y) + 1e-12)))\n\ndef cosine(x, y):\n    x, y = np.ravel(x).astype(np.float64), np.ravel(y).astype(np.float64)\n    return float(x @ y / (np.linalg.norm(x) * np.linalg.norm(y) + 1e-12))`,
  ex:&#x27;&lt;p&gt;&lt;b&gt;직접 구현&lt;/b&gt;: 모양에 상관없이 1차원으로 펴서 계산하고, 0 으로 나누지 않게 분모에 1e-12 를 더합니다. SQNR 은 크기까지, cosine 은 방향만 보므로 &quot;scale 이 조금 틀어진 것&quot; 과 &quot;모양이 망가진 것&quot; 을 구분하려고 둘을 함께 봅니다.&lt;/p&gt;&#x27;},
 {n:&#x27;② 예제 2-A — 누적 비교&#x27;,vt:&#x27;어디서부터 무너지나&#x27;,run:()=&gt;play(1,160,10),
  q:[&#x27;누적 비교 그래프에서 layer1.1 이후는 모두 낮게 나옵니다. 이 그래프만으로 layer2.1 · layer3.1 도 범인인지 알 수 있을까요?&#x27;,[&#x27;알 수 있다 — SQNR 이 낮은 블록은 모두 범인이다&#x27;,&#x27;알기 어렵다 — 이미 망가진 입력을 받아서 낮은 것일 수 있다&#x27;,&#x27;알 수 있다 — 직전 블록보다 조금이라도 내려갔다면 범인이다&#x27;],1,&#x27;오차는 누적됩니다. layer1.1 에서 무너진 값이 뒤로 전달되어, 죄 없는 블록도 낮게 보입니다. &quot;어디서부터&quot; 는 보이지만 &quot;누가&quot; 는 구분되지 않습니다.&#x27;],
  kv:[[&#x27;stem → layer1.0&#x27;,&#x27;37.8 → 34.3 dB&#x27;],[&#x27;layer1.1 (first_drop)&#x27;,&#x27;9.6 dB · cosine 0.943&#x27;],[&#x27;마지막 블록&#x27;,&#x27;1.8 dB · cosine 0.605&#x27;]],st:[&#x27;warn&#x27;,&#x27;처음 무너지는 곳은 layer1.1 — 나머지는 아직 모른다&#x27;],
  code:`modify_model_output_intermediate_tensors(&quot;bad_pre.onnx&quot;, &quot;bad_aug_f.onnx&quot;)     &lt;span class=&quot;c&quot;&gt;# 모든 중간 텐서를 출력으로&lt;/span&gt;\nf_acts = collect_activations(&quot;bad_aug_f.onnx&quot;, CifarReader(X_cal[:100]))\nq_acts = collect_activations(&quot;bad_aug_q.onnx&quot;, CifarReader(X_cal[:100]))\nrows.append({&quot;block&quot;: b, &quot;sqnr&quot;: sqnr(fa, qa), &quot;cos&quot;: cosine(fa, qa)})          &lt;span class=&quot;c&quot;&gt;# 2-1 의 함수&lt;/span&gt;`,
  ex:&#x27;&lt;p&gt;&lt;b&gt;제공 코드&lt;/b&gt;입니다 (ONNX Runtime 의 &lt;code&gt;qdq_loss_debug&lt;/code&gt; 도구). 텐서 이름 다루기가 까다로워 코드를 제공하지만, 비교 자체는 여러분이 2-1 에서 만든 &lt;code&gt;sqnr&lt;/code&gt; · &lt;code&gt;cosine&lt;/code&gt; 이 합니다. 여기서 만든 &lt;code&gt;BLK&lt;/code&gt; 는 실습 2-2 에서 씁니다.&lt;/p&gt;&#x27;},
 {n:&#x27;③ 실습 2-2 — 단독 민감도&#x27;,vt:&#x27;블록 하나만 양자화해 본다&#x27;,run:()=&gt;play(2,150,11),
  q:[&#x27;블록 하나만 INT8 로 바꾼 모델 11개를 만들었습니다. 최종 출력 SQNR 이 20 dB 아래인 것은 몇 개일까요?&#x27;,[&#x27;1개 — layer1.1 뿐&#x27;,&#x27;3개&#x27;,&#x27;8개 — layer1.1 과 그 뒤의 모든 블록&#x27;],1,&#x27;layer1.1 (10.4) · layer2.1 (7.7) · layer3.1 (3.5 dB). 다른 블록은 혼자 양자화하면 32 ~ 51 dB 로 멀쩡합니다 — 누적 비교에서 묻혀 있던 범인 둘이 드러납니다.&#x27;],

  ex:&#x27;&lt;p&gt;&lt;b&gt;직접 구현&lt;/b&gt;: 노드 이름이 &lt;code&gt;/layer1/layer1.1/&lt;/code&gt; 로 시작하는 것을 골라 &lt;code&gt;quantize=&lt;/code&gt; (nodes_to_quantize) 에 넣으면 그 블록만 양자화됩니다. 11번 반복 (약 10초) 하고 20 dB 아래를 &lt;code&gt;suspects&lt;/code&gt; 로 모읍니다.&lt;/p&gt;&#x27;},
 {n:&#x27;④ 주의 — 어느 텐서를 비교하나&#x27;,vt:&#x27;_DequantizeLinear_Output&#x27;,run:()=&gt;play(3),
  q:[&#x27;INT8 (QDQ) 모델에서 FP32 의 블록 출력과 비교해야 하는 텐서는?&#x27;,[&#x27;FP32 모델과 이름이 완전히 같은 텐서&#x27;,&#x27;그 이름 뒤에 _DequantizeLinear_Output 이 붙은 텐서&#x27;,&#x27;QuantizeLinear 의 출력인 INT8 정수 텐서 그대로&#x27;],1,&#x27;이름이 같은 텐서는 Q 에 들어가기 &quot;전&quot; 값이라 양자화 오차가 아직 없습니다. 다음 층이 실제로 받는 값은 Q → DQ 를 거친 _DequantizeLinear_Output 입니다.&#x27;],
  kv:[[&#x27;FP32 쪽&#x27;,&#x27;/layer1/layer1.0/Relu_1_output_0&#x27;],[&#x27;INT8 쪽&#x27;,&#x27;…Relu_1_output_0_DequantizeLinear_Output&#x27;],[&#x27;잘못 고르면&#x27;,&#x27;SQNR 이 실제보다 좋게 나옴&#x27;]],st:[&#x27;info&#x27;,&#x27;도구를 쓸 때는 &quot;무엇과 무엇을 비교하는지&quot; 부터&#x27;],

 {n:&#x27;① 개념 — 무엇을 빼야 하나&#x27;,vt:&#x27;범인 텐서가 지나는 길&#x27;,run:()=&gt;play(0,600,2),

 {n:&#x27;② 실습 3-1 — block_nodes()&#x27;,vt:&#x27;ONNX 노드 이름 찾기&#x27;,run:()=&gt;play(1),

 {n:&#x27;② 예제 4-A — trt_check()&#x27;,vt:&#x27;Day 2 모델은 합격할까&#x27;,run:()=&gt;play(1),
  q:[&#x27;Day 2 에서 x86 CPU 에 가장 빨랐던 설정 (활성값 U8 · weight S8) 의 QDQ 모델을 TensorRT 에 넣으면?&#x27;,[&#x27;합격 — QDQ 형식이면 TensorRT 가 모두 받는다&#x27;,&#x27;불합격 — 활성값의 zero_point 가 uint8 이고 0 이 아니다&#x27;,&#x27;합격 — weight 가 S8 대칭이면 활성값은 상관없다&#x27;],1,&#x27;TensorRT 의 INT8 은 부호 있는 대칭 (S8 · zero_point 0) 만 지원합니다. 112개 Q/DQ 중 68개가 uint8, 26개가 0 이 아닌 zero_point 입니다. 빌드 전에 점검하면 시간을 아낍니다.&#x27;],
  kv:[[&#x27;Q · DQ 노드&#x27;,&#x27;112&#x27;],[&#x27;uint8 zero_point · zp ≠ 0&#x27;,&#x27;68 · 26&#x27;],[&#x27;ok&#x27;,&#x27;False&#x27;]],st:[&#x27;bad&#x27;,&#x27;x86 최적 설정 ≠ TensorRT 조건 — 장치마다 다시 만든다&#x27;],
  code:`def trt_check(path):\n    qdq = [n for n in g.node if n.op_type in (&quot;QuantizeLinear&quot;, &quot;DequantizeLinear&quot;)]\n    zps = [init[n.input[2]] for n in qdq if len(n.input) &gt; 2 and n.input[2] in init]\n    r = {&quot;qdq&quot;: len(qdq), &quot;uint8&quot;: sum(z.dtype == np.uint8 for z in zps), &quot;nonzero_zp&quot;: sum(bool(np.any(z != 0)) for z in zps)}\n    r[&quot;ok&quot;] = r[&quot;qdq&quot;] &gt; 0 and r[&quot;uint8&quot;] == 0 and r[&quot;nonzero_zp&quot;] == 0`,
  ex:&#x27;&lt;p&gt;&lt;b&gt;제공 코드&lt;/b&gt;입니다. Day 1 4교시의 &quot;대칭 vs 비대칭&quot; 이 여기서 다시 나옵니다. &lt;code&gt;trt_check&lt;/code&gt; 는 실습 4-1 · 6-2 와 8교시에서 계속 쓰므로 꼭 실행하세요.&lt;/p&gt;&#x27;},
 {n:&#x27;③ 실습 4-1 — make_trt_int8()&#x27;,vt:&#x27;S8 · 대칭 QDQ 만들기&#x27;,run:()=&gt;play(2),
  q:[&#x27;활성값을 U8 비대칭에서 S8 대칭으로 바꾸면 (ReLU 뒤 텐서는 256칸 중 절반만 사용) ResNet-20 의 정확도는?&#x27;,[&#x27;0.842 — 거의 그대로다&#x27;,&#x27;약 0.42 — 쓸 수 있는 칸이 절반이 되어 정확도도 절반이 된다&#x27;,&#x27;0.10 — 음수 칸을 쓰지 못해 무작위 수준이 된다&#x27;],0,&#x27;칸이 절반 (약 7비트) 이 되어도 ResNet-20 에는 충분합니다: 0.846 → 0.842. 그리고 trt_check 는 uint8 0 · zp≠0 0 으로 합격합니다.&#x27;],
  kv:[[&#x27;trt_check&#x27;,&#x27;qdq 128 · uint8 0 · nonzero_zp 0 · ok True&#x27;],[&#x27;ORT 정확도&#x27;,&#x27;0.8420 (FP32 0.846)&#x27;],[&#x27;입력&#x27;,&#x27;배치 1 고정 (rn20_b1.onnx)&#x27;]],st:[&#x27;ok&#x27;,&#x27;TensorRT 조건 합격 · 정확도 유지&#x27;],
  code:`quantize_static(src, dst, reader, quant_format=QuantFormat.QDQ, per_channel=True, reduce_range=True,\n    &lt;span class=&quot;hl&quot;&gt;activation_type=QuantType.QInt8&lt;/span&gt;, weight_type=QuantType.QInt8, nodes_to_exclude=list(exclude),\n    extra_options={&lt;span class=&quot;hl&quot;&gt;&quot;ActivationSymmetric&quot;: True&lt;/span&gt;, &quot;WeightSymmetric&quot;: True, &quot;QuantizeBias&quot;: False})`,
  ex:&#x27;&lt;p&gt;&lt;b&gt;직접 구현&lt;/b&gt;: 활성값 자료형과 &lt;code&gt;extra_options&lt;/code&gt; 세 개가 Day 2 와 다른 곳입니다. &lt;code&gt;QuantizeBias=False&lt;/code&gt; 는 bias 를 FP32 로 두어 TensorRT 가 Conv 와 함께 처리하게 합니다. &lt;code&gt;exclude&lt;/code&gt; 인자는 6교시 (Detect head) 에서 씁니다.&lt;/p&gt;&#x27;},
 {n:&#x27;④ 실습 4-2 — build_engine(int8=True)&#x27;,vt:&#x27;플래그 한 줄&#x27;,run:()=&gt;play(3,200,6),
  q:[&#x27;QDQ ONNX 로 INT8 엔진을 빌드할 때 calibrator (보정 데이터) 를 TensorRT 에 넘겨야 할까요?&#x27;,[&#x27;넘겨야 한다 — INT8 플래그를 켜면 항상 보정 데이터가 필요하다&#x27;,&#x27;필요 없다 — scale 이 이미 ONNX 안에 있다&#x27;,&#x27;넘겨야 한다 — FP16 플래그를 함께 켠 경우에만&#x27;],1,&#x27;보정은 ONNX Runtime 이 이미 끝냈고 결과 (scale · zero_point) 가 Q/DQ 노드에 들어 있습니다. TensorRT 쪽에서 더하는 것은 BuilderFlag.INT8 한 줄뿐입니다.&#x27;],
  kv:[[&#x27;OT Day 4 와 다른 곳&#x27;,&#x27;int8 인자 + set_flag(BuilderFlag.INT8)&#x27;],[&#x27;INT8 + FP16&#x27;,&#x27;Q/DQ 없는 layer 는 FP16 으로&#x27;],[&#x27;엔진 빌드&#x27;,&#x27;GPU (T4) 에서 — 수업에서 직접&#x27;]],st:[&#x27;info&#x27;,&#x27;GPU 에서 rn20_int8.engine 을 빌드해 확인하세요&#x27;],
  code:`if fp16:\n    config.set_flag(trt.BuilderFlag.FP16)\nif int8:\n    &lt;span class=&quot;hl&quot;&gt;config.set_flag(trt.BuilderFlag.INT8)&lt;/span&gt;          &lt;span class=&quot;c&quot;&gt;# QDQ 를 INT8 로 실행&lt;/span&gt;\nconfig.profiling_verbosity = trt.ProfilingVerbosity.DETAILED     &lt;span class=&quot;c&quot;&gt;# 예제 5-A 에서 layer 정보를 보려고&lt;/span&gt;`,
  ex:&#x27;&lt;p&gt;&lt;b&gt;직접 구현&lt;/b&gt;: OT Day 4 의 &lt;code&gt;build_engine&lt;/code&gt; 에 인자 하나와 한 줄을 더합니다. FP16 을 함께 켜 두면 mixed precision 으로 뺀 layer 가 FP32 대신 FP16 으로 실행됩니다 — &quot;INT8 + FP16 fallback&quot;.&lt;/p&gt;&#x27;},
]);

 {n:&#x27;① 개념 — AP50 과 mAP50-95&#x27;,vt:&#x27;IoU 기준 10개&#x27;,run:()=&gt;play(0,700,3),

  ex:&#x27;&lt;p&gt;AP 는 점수가 높은 박스부터 차례로 정답 여부를 따져 precision-recall 곡선의 면적을 구한 값입니다 (VB Day 4). 그래서 평가할 때는 conf 를 0.01 까지 낮춰 모든 후보를 받습니다.&lt;/p&gt;&#x27;},
 {n:&#x27;② 실습 7-1 — eval_map()&#x27;,vt:&#x27;FP32 vs INT8 (head 제외)&#x27;,run:()=&gt;play(1,500,2),

<script>
const ids = [...document.querySelectorAll('nav button')].map(b => b.dataset.id);
function fit(fr) {
  try {
    const d = fr.contentDocument; if (!d || !d.body) return;
    fr.style.height = Math.max(600, d.documentElement.scrollHeight) + 'px';
  } catch (e) {}
}
function show(id, push) {
  if (!ids.includes(id)) id = ids[0];
  document.querySelectorAll('section.lesson').forEach(s => s.classList.toggle('active', s.id === id));
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-current', b.dataset.id === id ? 'true' : 'false'));
  const sec = document.getElementById(id);
  document.title = sec.dataset.title + ' — Quantization·Pruning Day 3';
  const fr = sec.querySelector('iframe');
  fr.loading = 'eager'; fit(fr);
  if (push) history.replaceState(null, '', '#' + id);
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('section.lesson iframe').forEach(fr => {
  fr.addEventListener('load', () => {
    fit(fr);
    try {
      new ResizeObserver(() => fit(fr)).observe(fr.contentDocument.body);
      fr.contentDocument.addEventListener('keydown', key);   // iframe 안에서도 ← → 동작
    } catch (e) {}
  });
});
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.id, true));
function key(e) {
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const cur = ids.indexOf(location.hash.slice(1) || ids[0]);
  if (e.key === 'ArrowRight' && cur < ids.length - 1) show(ids[cur + 1], true);
  if (e.key === 'ArrowLeft' && cur > 0) show(ids[cur - 1], true);
}
document.addEventListener('keydown', key);
window.addEventListener('resize', () => document.querySelectorAll('section.lesson.active iframe').forEach(fit));
window.addEventListener('hashchange', () => show(location.hash.slice(1), false));   // 주소창에서 #d1-N 을 바꿔도 이동
show(location.hash.slice(1), false);
</script>
